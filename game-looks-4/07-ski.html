<title>4-07 雪山のスキー場 色鉛筆</title>
<style>

<canvas id="c"></canvas>
<div id="cap">4-07 ─ 雪山のスキー場 / 色鉛筆のハッチング　｜　見るだけ（自動で進む）</div>
<script src="pencil.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const P = PENCIL(THREE, { sky: 0xc8e2f2, size: 5.8, wide: 7.6, look: [0, 1.3, 0] });
const { box, cyl, cone, ball, prism, grp, hash, rod } = P;

// 奥の角が山頂の、段々の雪山。手前に凍った池
const H = (x, z) => Math.round(Math.min(3, Math.max(0, 3.4 - .5 * Math.hypot(x + 6, (z + 4) * 1.2))) / .25) * .25;
const lake = (ix, iz) => ix >= 8 && ix <= 10 && iz >= 5 && iz <= 6;
for (let ix = 0; ix < 12; ix++) for (let iz = 0; iz < 8; iz++) {
  const x = ix - 5.5, z = iz - 3.5, h = H(x, z);
  if (lake(ix, iz)) box(null, 1, .4, 1, 0xbfe6f6, x, -.27, z); else box(null, 1, h + .4, 1, (ix + iz) % 2 ? 0xf8fafe : 0xe6eef8, x, h / 2 - .2, z);
}
P.dirt(12, 8, 0xa89a8a); P.sea(0xc8e2f2, -1.6);
// 岩と、雪をかぶった木
for (let i = 0; i < 8; i++) { const x = -5.5 + hash(i, 1) * 4, z = -3.6 + hash(i, 2) * 3.4; ball(null, .16 + hash(i, 3) * .16, 0xa8a2b8, x, H(x, z) + .05, z); }
const pine = (x, z, s) => { const g = P.tree(null, x, z, s, 0x3f8f6a, H(x, z)); cone(g, .2, .36, 0xffffff, 0, .84, 0); return g; };
for (const [x, z, s] of [[-5.5, .4, 1.2], [-4.6, 1.2, 1], [-5.3, 2, 1.1], [-3.5, 2.4, .9], [-5.4, 3.4, 1.2], [-1.5, -3.6, 1.1], [-.4, -3.4, 1], [.7, -3.6, 1.2], [1.8, -3.4, .9], [5.4, -3.5, 1.2], [4.6, -3.3, 1], [5.5, -1.8, 1.1], [5.4, 3.5, 1], [-2.3, 3.5, 1.1], [-1.6, -1.9, .9], [-2.9, .6, .9]]) pine(x, z, s);

// リフト：ふもと → 山頂
const A = [2.6, 1.15, -2.2], B = [-4.9, 3.75, -3.3], PX = .145, PZ = -.989;
const at = u => [A[0] + (B[0] - A[0]) * u, A[1] + (B[1] - A[1]) * u, A[2] + (B[2] - A[2]) * u];
for (const s of [-.17, .17]) rod(null, [A[0] + PX * s, A[1], A[2] + PZ * s], [B[0] + PX * s, B[1], B[2] + PZ * s], .015, 0x4a4058);
for (const u of [0, .25, .5, .75, 1]) { const [x, y, z] = at(u), g = H(x, z); cyl(null, .05, .07, y - g, 0x8a8698, x, (y + g) / 2, z, 6); const bar = box(null, .5, .05, .05, 0x8a8698, x, y + .01, z); bar.rotation.y = Math.atan2(-PZ, PX); }
const hutA = P.house(null, 3.2, -2.2, .8, .7, .6, 0xc09a6a, 0xffffff, Math.PI / 2), hutB = P.house(null, -5.4, -3.4, .6, .6, .5, 0xc09a6a, 0xffffff, Math.PI / 2, H(-5.4, -3.4));
const chairs = [...Array(8)].map((_, i) => {
  const g = grp(); box(g, .02, .34, .02, 0x4a4058, 0, -.17, 0); box(g, .3, .04, .12, 0xe2574c, 0, -.36, 0); box(g, .3, .14, .03, 0xe2574c, 0, -.28, -.06);
  const rider = P.person(g, 0, 0, [0x4f7fd8, 0xf0b03a, 0xb05cc8][i % 3], 0xe2574c, -.42); rider.scale.setScalar(.8);
  return { g, rider, o: i / 8 };
});
const dirY = Math.atan2(B[0] - A[0], B[2] - A[2]);

// ロッジ（えんとつの煙）、雪だるま、旗門、頂上の旗
const lodge = P.house(null, 4.2, -.6, 1.7, 1.2, .9, 0xb07a4a, 0xffffff, 0); box(lodge, .3, .3, .03, 0xffe880, -.5, .5, .61); box(lodge, .3, .3, .03, 0xffe880, .5, .5, .61); box(lodge, .22, .6, .22, 0xa8a2b8, .5, 1.4, -.2);
for (let k = 0; k < 5; k++) box(null, .06, .5, .06, 0xb08a5a, 3 + k * .12, .25, .4 + k * .0).rotation.z = .2;
const puffs = [...Array(5)].map((_, i) => ({ m: ball(null, .1, 0xeeeaf4, 0, 0, 0), ph: i / 5 }));
const sm = grp(null, 2.3, 0, 3.2); ball(sm, .24, 0xffffff, 0, .2, 0, 1); ball(sm, .17, 0xffffff, 0, .52, 0, 1); ball(sm, .12, 0xffffff, 0, .76, 0, 1); cone(sm, .03, .12, 0xf08a3a, 0, .76, .14, 4).rotation.x = Math.PI / 2; cyl(sm, .08, .1, .1, 0x4a4058, 0, .9, 0, 6); box(sm, .3, .02, .02, 0x8a5a3a, 0, .55, 0);
cyl(null, .02, .02, .8, 0x4a4058, -5.6, H(-5.6, -3.7) + .4, -3.7, 4); const topFlag = prism(null, .02, .22, .4, 0xe2574c, -5.6, H(-5.6, -3.7) + .58, -3.5);
// 滑るコース 2 本と旗門
const runs = [[[-4.6, -2.7], [1.0, 2.6]], [[-4.9, -2.4], [-3.6, 3.3]]];
const pos = (r, u) => { const [a, b] = runs[r], dx = b[0] - a[0], dz = b[1] - a[1], l = Math.hypot(dx, dz), w = Math.sin(u * 15) * .45; return [a[0] + dx * u - dz / l * w, a[1] + dz * u + dx / l * w]; };
for (let k = 0; k < 6; k++) { const u = (Math.PI / 2 + k * Math.PI) / 15, [x, z] = pos(0, u), y = H(x, z); const c = k % 2 ? 0x4f7fd8 : 0xe2574c; cyl(null, .015, .015, .4, c, x, y + .2, z, 4); box(null, .16, .1, .02, c, x + .08, y + .34, z); }
const skiers = [...Array(6)].map((_, i) => {
  const g = P.person(null, 0, 0, [0xe2574c, 0x4f7fd8, 0xf0b03a, 0xb05cc8, 0x4fa07a, 0xf08a3a][i], [0x4a4058, 0xffffff][i % 2]);
  box(g, .04, .02, .5, 0x4a4058, -.06, .01, .04); box(g, .04, .02, .5, 0x4a4058, .06, .01, .04);
  return { g, r: i % 2, o: i * .19, y: 0 };
});
const spray = [...Array(12)].map(() => ({ m: ball(null, .05, 0xffffff, 0, -5, 0), a: 1 }));
const skater = P.person(null, 0, 0, 0xb05cc8, 0xf6efdc, -.07);
const snow = [...Array(26)].map((_, i) => ({ m: ball(null, .035, 0xffffff, -6 + hash(i, 5) * 12, 0, -4 + hash(i, 6) * 8), ph: hash(i, 7) }));
let si = 0;

P.run((dt, t) => {
  for (const c of chairs) {
    const u = (t * .035 + c.o) % 1, up = u < .5, v = up ? u * 2 : 2 - u * 2, [x, y, z] = at(v), s = up ? .17 : -.17;
    c.g.position.set(x + PX * s, y, z + PZ * s); c.g.rotation.y = dirY + (up ? 0 : Math.PI); c.g.rotation.x = Math.sin(t * 1.5 + c.o * 20) * .06; c.rider.visible = up;
  }
  for (const s of skiers) {
    const u = (t * .075 + s.o) % 1, [x, z] = pos(s.r, u), [x2, z2] = pos(s.r, u + .004), ty = H(x, z);
    s.y += (ty - s.y) * Math.min(1, dt * 9); if (u < .02) s.y = ty;
    s.g.position.set(x, s.y, z); s.g.rotation.y = Math.atan2(x2 - x, z2 - z); s.g.rotation.z = Math.cos(u * 15) * .3;
    if (Math.random() < .25) { const p = spray[si++ % spray.length]; p.a = 0; p.m.position.set(x, s.y + .05, z); }
  }
  for (const p of spray) { p.a = Math.min(1, p.a + dt * 2.5); p.m.position.y += dt * .3; p.m.scale.setScalar(p.a < 1 ? 1.2 - p.a : .001); }
  puffs.forEach(p => { const a = (t * .35 + p.ph) % 1; p.m.position.set(4.7 + a * .4, 1.75 + a * 1.1, -.8); p.m.scale.setScalar(.5 + a * 1.6 - a * a * 1.4); });
  skater.position.set(3.5 + Math.cos(t * .9) * .9, -.07, 2 + Math.sin(t * .9) * .6 * Math.cos(t * .45)); skater.rotation.y = -t * .9; skater.rotation.z = .15;
  topFlag.rotation.y = Math.sin(t * 3) * .4;
  for (const f of snow) { const a = (t * .12 + f.ph) % 1; f.m.position.y = 5 - a * 5.2; f.m.position.x += Math.sin(t + f.ph * 30) * dt * .2; }
});
</script>
