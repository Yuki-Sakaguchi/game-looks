<canvas id="c"></canvas>
<div id="cap">4-05 ─ パターゴルフ / 色鉛筆のハッチング　｜　見るだけ（自動で進む）</div>
<script src="pencil.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const P = PENCIL(THREE, { sky: 0xb4e4f0, size: 5.4, wide: 7.4 });
const { box, cyl, cone, ball, prism, grp, hash } = P;

// 草の島。池が 1 つ
const pond = (ix, iz) => ix === 7 && iz >= 4 && iz <= 6;
P.tiles(12, 8, (ix, iz) => pond(ix, iz) ? [0x8fd0f0, -.14] : [(ix + iz) % 2 ? 0x6fb04a : 0x62a442, 0]);
P.dirt(12, 8); P.sea();

// コース：ティーから穴まで 5 本の直線
const C = [[-4.5, 2.6], [-4.5, -2], [-.5, -2], [-.5, 1.5], [3.6, 1.5], [3.6, -2.3]];
const course = P.path(C, false);
for (let i = 0; i < C.length - 1; i++) {
  const [ax, az] = C[i], [bx, bz] = C[i + 1], horiz = az === bz, len = Math.abs(bx - ax) + Math.abs(bz - az), mx = (ax + bx) / 2, mz = (az + bz) / 2;
  box(null, horiz ? len + 1.1 : 1.1, .05, horiz ? 1.1 : len + 1.1, 0xa8dc6a, mx, .025, mz);
  for (const s of [-.62, .62]) box(null, horiz ? len - 1.3 : .12, .16, horiz ? .12 : len - 1.3, 0xf6efdc, mx + (horiz ? 0 : s), .08, mz + (horiz ? s : 0));
}
for (const [x, z] of C) for (const [a, b] of [[-.62, -.62], [.62, -.62], [-.62, .62], [.62, .62]]) cyl(null, .09, .09, .22, 0xe2574c, x + a, .11, z + b, 6);
// 角の外がわの壁（ボールがはね返るところ）
box(null, 1.36, .16, .12, 0xf6efdc, -4.5, .08, -2.62); box(null, .12, .16, 1.36, 0xf6efdc, -5.12, .08, -2);
box(null, .12, .16, 1.36, 0xf6efdc, .12, .08, -2); box(null, 1.36, .16, .12, 0xf6efdc, -.5, .08, -2.62);
box(null, 1.36, .16, .12, 0xf6efdc, -.5, .08, 2.12); box(null, .12, .16, 1.36, 0xf6efdc, -1.12, .08, 1.5);
box(null, 1.36, .16, .12, 0xf6efdc, 3.6, .08, 2.12); box(null, .12, .16, 1.36, 0xf6efdc, 4.22, .08, 1.5);
box(null, 1.36, .16, .12, 0xf6efdc, 3.6, .08, -2.92); box(null, 1.36, .16, .12, 0xf6efdc, -4.5, .08, 3.22);
// ティー、穴、旗
box(null, .7, .02, .5, 0x4f7fd8, -4.5, .06, 2.6);
cyl(null, .13, .13, .02, 0x2a2438, 3.6, .056, -2.3, 10); cyl(null, .02, .02, 1.1, 0xf6efdc, 3.6, .6, -2.3, 5);
const flag = grp(null, 3.6, 1.0, -2.3); prism(flag, .02, .26, .44, 0xe2574c, 0, -.13, .22);
// 池にかかる橋
box(null, 1.2, .1, 1.1, 0xc09a6a, 1.5, .09, 1.5); for (const s of [-.5, .5]) { box(null, 1.2, .05, .05, 0xd8574c, 1.5, .4, 1.5 + s); for (const x of [1, 1.5, 2]) box(null, .05, .3, .05, 0xd8574c, x, .26, 1.5 + s); }
for (const [x, z] of [[1.4, .6], [1.6, 2.6]]) { cyl(null, .16, .16, .02, 0x6ac85a, x, -.13, z, 7); ball(null, .05, 0xf0a0c0, x, -.1, z); }
// 風車（羽がコースの上を横ぎる）
cyl(null, .26, .44, 1.5, 0xf6efdc, -2.5, .75, -2.95, 6); cone(null, .34, .42, 0xe2574c, -2.5, 1.7, -2.95, 6);
const blades = grp(null, -2.5, 1.3, -2.66); for (let i = 0; i < 4; i++) { const b = grp(blades); b.rotation.z = i * Math.PI / 2; box(b, .07, 1.2, .03, 0x8a5a3a, 0, .62, 0); box(b, .26, .8, .02, 0xf6efdc, .13, .76, 0); }
// バンカー、花、木、ベンチ、小屋、スコア板
for (const [x, z, r] of [[-2.4, .1, .7], [1.6, -1, .6]]) { const s = cyl(null, r, r, .04, 0xf0dc9a, x, .02, z, 9); s.scale.z = .7; }
for (let i = 0; i < 26; i++) { const x = -5.6 + hash(i, 1) * 11.2, z = -3.6 + hash(i, 2) * 7.2; if (C.some((c, k) => k < 5 && Math.abs(x - (c[0] + C[k + 1][0]) / 2) < Math.abs(c[0] - C[k + 1][0]) / 2 + .9 && Math.abs(z - (c[1] + C[k + 1][1]) / 2) < Math.abs(c[1] - C[k + 1][1]) / 2 + .9)) continue; cyl(null, .015, .015, .12, 0x3f8f4a, x, .06, z, 4); ball(null, .055, [0xf0a0c0, 0xf6e050, 0xfaf6ec, 0xe2574c][i % 4], x, .14, z); }
for (const [x, z, s] of [[-5.5, -3.5, 1.2], [5.5, -3.4, 1.2], [5.4, 3.4, 1.1], [1.6, -3.5, 1], [-2.6, 2.8, 1.1], [-2.9, 1.2, .9], [5.3, .2, 1], [2.2, -.2, .8]]) (hash(x, z) > .5 ? P.tree : P.round)(null, x, z, s);
box(null, .8, .06, .22, 0xb08a5a, -3.4, .24, 3.5); box(null, .8, .2, .05, 0xb08a5a, -3.4, .4, 3.6); for (const x of [-3.7, -3.1]) box(null, .05, .22, .2, 0x6a4a3a, x, .11, 3.5);
const hut = P.house(null, 5, 3, 1.1, 1, .8, 0xf2d8b0, 0x4fa07a, -Math.PI / 2); box(hut, .5, .26, .03, 0x9fc8e8, 0, .5, .51);
const sb = grp(null, 2.4, 0, -3.5); box(sb, .05, .7, .05, 0x6a4a3a, -.4, .35, 0); box(sb, .05, .7, .05, 0x6a4a3a, .4, .35, 0); box(sb, 1, .5, .05, 0x4a6a58, 0, .65, 0); for (let i = 0; i < 6; i++) box(sb, .1, .1, .02, i === 3 ? 0xf0c83a : 0xf6efdc, -.35 + (i % 3) * .35, .76 - ((i / 3) | 0) * .22, .03);

// ゴルファーと見物の人
const golfer = P.person(null, -4.95, 2.6, 0xe2574c, 0xf6efdc); golfer.rotation.y = Math.PI / 2;
const club = grp(golfer, 0, .34, .14); box(club, .03, .36, .03, 0x8a8298, 0, -.18, 0); box(club, .04, .05, .12, 0x8a8298, 0, -.36, .04);
const fans = [[4.3, -1.2, 0x4f7fd8], [4.4, -1.8, 0xf0b03a], [2.9, -3, 0xb05cc8]].map(([x, z, c], i) => ({ g: P.person(null, x, z, c), ph: i }));
const gb = P.add(null, new THREE.SphereGeometry(.09, 8, 6), 0xffffff);
const stars = [...Array(6)].map((_, i) => P.add(null, new THREE.OctahedronGeometry(.07), P.glow(0xffe060)));
const v = new THREE.Object3D();

P.run((dt, t) => {
  blades.rotation.z = t * 1.4; flag.rotation.y = Math.sin(t * 3) * .4;
  const c = t % 13, u = Math.min(1, Math.max(0, (c - 1) / 8.5)), e = 1 - (1 - u) ** 2.2;
  course.at(e * (course.total - .001), v);
  let y = .14; if (Math.abs(v.position.z - 1.5) < .1) y += .09 * Math.max(0, 1 - Math.abs(v.position.x - 1.5) / .75);
  const sunk = c > 9.5; gb.position.set(v.position.x, sunk ? Math.max(-.05, y - (c - 9.5) * .6) : y, v.position.z); gb.visible = c < 12.2;
  club.rotation.x = c < 1 ? -Math.sin(c * Math.PI) * 1.1 : 0;
  for (const f of fans) f.g.position.y = sunk ? Math.abs(Math.sin(t * 8 + f.ph)) * .16 : 0;
  stars.forEach((s, i) => { const a = (c - 9.6) / 1.5; s.visible = a > 0 && a < 1; const ang = i / 6 * Math.PI * 2; s.position.set(3.6 + Math.cos(ang) * a * .7, .3 + a * 1 - a * a * .5, -2.3 + Math.sin(ang) * a * .7); s.rotation.y = t * 5; });
});
</script>
