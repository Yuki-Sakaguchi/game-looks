<canvas id="c"></canvas>
<div id="cap">4-04 ─ ダンジョン探索 / 色鉛筆のハッチング　｜　見るだけ（自動で進む）</div>
<script src="pencil.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const P = PENCIL(THREE, { sky: 0xdcd6ea, size: 5.4, wide: 7.4 });
const { box, cyl, cone, ball, prism, grp, hash } = P;

// 床：石だたみ。まん中の部屋に溶岩の穴
const lava = (ix, iz) => ix >= 6 && ix <= 7 && iz >= 5 && iz <= 6;
P.tiles(12, 8, (ix, iz) => lava(ix, iz) ? null : [(ix + iz) % 2 ? 0xa8a2bc : 0x9690ac, hash(ix, iz) > .85 ? -.03 : 0]);
P.add(null, new THREE.BoxGeometry(2, .1, 2), P.glow(0xffa040), 1, -.3, 2);
P.dirt(12, 8, 0x6a6080); P.sea(0xdcd6ea, -1.5);
const bubbles = [...Array(5)].map((_, i) => ({ m: P.add(null, new THREE.IcosahedronGeometry(.1, 0), P.glow(0xffd060), .3 + hash(i, 1) * 1.4, -.25, 1.3 + hash(i, 2) * 1.4), ph: i * .23 }));

// 壁（上に明るいふち）。奥の 2 辺は高く、しきりは低い
function wall(x1, z1, x2, z2, h = .8) {
  const w = Math.abs(x2 - x1) + .3, d = Math.abs(z2 - z1) + .3, x = (x1 + x2) / 2, z = (z1 + z2) / 2;
  box(null, w, h, d, 0x7c7694, x, h / 2, z); box(null, w + .04, .08, d + .04, 0xb8b2cc, x, h, z);
}
wall(-6, -4, 6, -4, 1.4); wall(-6, -4, -6, 4, 1.4);
wall(-2, -4, -2, -1.3); wall(-2, -.1, -2, 1); wall(-6, 1, -3.7, 1); wall(-2.5, 1, -2, 1);
wall(2, -4, 2, -2.7); wall(2, -1.5, 2, 4);
// 奥の壁の飾り：旗、たいまつ、鉄ごうし
const torches = [];
for (const [x, z, ax] of [[-4, -3.8, 0], [0, -3.8, 0], [4, -3.8, 0], [-5.8, -1.5, 1], [-5.8, 2.6, 1]]) {
  const g = grp(null, x + (ax ? .22 : 0), .95, z + (ax ? 0 : .22)); box(g, .06, .26, .06, 0x6a4a3a, 0, -.1, 0);
  torches.push(P.add(g, new THREE.ConeGeometry(.1, .26, 5), P.glow(0xffc040), 0, .14, 0));
}
for (const [x, c] of [[-3, 0xd8574c], [1, 0x4f7fd8], [5, 0xd8574c]]) { box(null, .5, .7, .03, c, x, .9, -3.83); cone(null, .12, .12, 0xf0c83a, x, .98, -3.8, 4); }
box(null, .7, .9, .06, 0x4a4058, -5.82, .5, -2.9).rotation.y = 0; for (let k = 0; k < 4; k++) box(null, .04, .9, .1, 0x8a8298, -5.8, .5, .2 + k * .18);
// 下り階段
for (let k = 0; k < 4; k++) box(null, .8, .2, .3, 0x8a84a2, -5, -.05 - k * .12 + .1, -3.4 + k * .3);
// 柱、たる、骨、じゅうたん
for (const [x, z] of [[3, -.4], [5, -.4], [3, 1.8], [5, 1.8]]) { box(null, .44, .12, .44, 0xb8b2cc, x, .06, z); cyl(null, .16, .16, 1.1, 0xa8a2bc, x, .65, z, 8); box(null, .44, .12, .44, 0xb8b2cc, x, 1.24, z); }
box(null, 1.2, .02, 2, 0xb85a6a, 4, .01, .7); box(null, 1, .02, 1.8, 0xd8a04a, 4, .015, .7); box(null, .8, .02, 1.6, 0xb85a6a, 4, .02, .7);
for (const [x, z] of [[-1.5, -3.4], [-1.1, -3.4], [-1.3, -3.05], [1.5, 3.5]]) { cyl(null, .15, .15, .34, 0xa87a50, x, .17, z, 8); cyl(null, .16, .16, .04, 0x4a4058, x, .25, z, 8); }
for (const [x, z, r] of [[-3.5, -2, .4], [.6, -3.2, 1.9], [-4.6, 3.4, 2.6]]) { const b = box(null, .3, .04, .05, 0xf2ead8, x, .03, z); b.rotation.y = r; ball(null, .07, 0xf2ead8, x + .2, .06, z + .1); }
// 光る水晶（左の部屋）
const crystals = [[-4.9, 3.2, .5], [-5.2, 2.7, .34], [-4.5, 3.5, .3]].map(([x, z, h]) => P.add(null, new THREE.ConeGeometry(h * .32, h * 2, 5), P.glow(0x80e0f0), x, h, z));
// とげのわな
const spikes = grp(null, 0, 0, -2.1); box(null, .9, .03, .9, 0x6a6478, 0, .01, -2.1); for (let i = 0; i < 9; i++) cone(spikes, .06, .3, 0xd8d2e0, -.28 + (i % 3) * .28, .15, -.28 + ((i / 3) | 0) * .28, 4);
// 宝箱
const chest = grp(null, 4.9, 0, 3.1); box(chest, .5, .26, .34, 0xb07a3a, 0, .13, 0); box(chest, .52, .05, .36, 0xf0c83a, 0, .25, 0);
const lid = grp(chest, 0, .28, -.17); box(lid, .5, .14, .34, 0xb07a3a, 0, .07, .17); box(lid, .08, .1, .04, 0xf0c83a, 0, .04, .35);
const sparks = [...Array(5)].map((_, i) => ({ m: P.add(null, new THREE.OctahedronGeometry(.05), P.glow(0xfff0a0), 0, 0, 0), ph: i / 5 }));

// 勇者（部屋をめぐって宝箱まで行き、もどる）
const hero = P.person(null, 0, 0, 0x4f7fd8, 0xd8d2e0); box(hero, .04, .34, .04, 0xd8d2e0, .15, .34, .08); box(hero, .12, .03, .03, 0xf0c83a, .15, .2, .08); box(hero, .03, .2, .16, 0xd8574c, -.13, .26, 0);
const R = [[-4, 2.8], [-3.1, 2.8], [-3.1, -.7], [-1, -.7], [0, -.7], [0, -2.1], [3, -2.1], [4.2, -2.1], [4.2, 2.6]];
const route = P.path([...R, ...R.slice(1, -1).reverse()]);
// スライム、こうもり、がいこつ
const slimes = [[-4.6, -2.4, 0x6ac85a], [.4, .3, 0x6ac85a], [4.8, -3, 0xb05cc8], [-1, 3, 0x5ab8d8], [3.2, 3.2, 0xb05cc8]].map(([x, z, c], i) => {
  const g = grp(null, x, 0, z); const b = P.add(g, new THREE.SphereGeometry(.2, 7, 5, 0, Math.PI * 2, 0, Math.PI / 2), c, 0, 0, 0); ball(g, .03, 0x2a2438, -.07, .12, .15); ball(g, .03, 0x2a2438, .07, .12, .15);
  return { g, x, z, ph: i * 1.3 };
});
const bats = [...Array(3)].map((_, i) => { const g = grp(); ball(g, .07, 0x4a4058, 0, 0, 0); const l = box(g, .2, .02, .1, 0x4a4058, -.12, 0, 0), r = box(g, .2, .02, .1, 0x4a4058, .12, 0, 0); return { g, l, r, a: i * 2.1 }; });
const sk = grp(null, 4, 0, 1.2); box(sk, .16, .24, .1, 0xf2ead8, 0, .25, 0); ball(sk, .1, 0xf2ead8, 0, .46, 0); box(sk, .05, .14, .05, 0xf2ead8, -.05, .07, 0); box(sk, .05, .14, .05, 0xf2ead8, .05, .07, 0); box(sk, .03, .5, .03, 0x8a8298, .14, .3, .06);

P.run((dt, t) => {
  route.at(t * .95, hero); hero.position.y = Math.abs(Math.sin(t * 9)) * .05;
  for (const s of slimes) { const h = Math.max(0, Math.sin(t * 3 + s.ph)); s.g.position.set(s.x + Math.sin(t * .5 + s.ph) * .3, h * .22, s.z + Math.cos(t * .4 + s.ph) * .3); s.g.scale.set(1.15 - h * .25, .8 + h * .5, 1.15 - h * .25); }
  torches.forEach((f, i) => { f.scale.set(1 + Math.sin(t * 13 + i) * .15, 1 + Math.sin(t * 17 + i * 2) * .25, 1); });
  bubbles.forEach(b => { const a = (t * .5 + b.ph) % 1; b.m.position.y = -.28 + a * .12; b.m.scale.setScalar(Math.sin(a * Math.PI) * 1.2 + .01); });
  const up = Math.max(0, Math.sin(t * 1.3)); spikes.position.y = -.3 + up * .3;
  const near = Math.hypot(hero.position.x - 4.5, hero.position.z - 2.8) < 1.1; lid.rotation.x += ((near ? -1.1 : 0) - lid.rotation.x) * Math.min(1, dt * 5);
  sparks.forEach(s => { const a = (t * .7 + s.ph) % 1; s.m.visible = lid.rotation.x < -.5; s.m.position.set(4.9 + Math.sin(s.ph * 20) * .2, .35 + a * .7, 3.1 + Math.cos(s.ph * 30) * .1); s.m.rotation.y = t * 3; s.m.scale.setScalar(1 - a); });
  crystals.forEach((c, i) => c.scale.setScalar(1 + Math.sin(t * 2 + i) * .06));
  for (const b of bats) { const a = t * .9 + b.a; b.g.position.set(-3.8 + Math.cos(a) * 1.4, 1.5 + Math.sin(a * 2) * .2, -1.6 + Math.sin(a) * 1.5); b.l.rotation.z = Math.sin(t * 14) * .7; b.r.rotation.z = -Math.sin(t * 14) * .7; }
  sk.position.z = 1.2 + Math.sin(t * .6) * 1; sk.rotation.y = Math.cos(t * .6) > 0 ? 0 : Math.PI; sk.position.y = Math.abs(Math.sin(t * 6)) * .03;
});
</script>
