  cyl(g, r * 1.06, r * 1.1, .2, 0xe8e4f0, 0, .1, 0, 12); P.add(g, new THREE.SphereGeometry(r, 12, 6, 0, Math.PI * 2, 0, Math.PI / 2), c, 0, .2, 0);
  for (const k of [.35, .7]) cyl(g, r * Math.cos(Math.asin(k)) + .02, r * Math.cos(Math.asin(k)) + .02, .04, 0xe8e4f0, 0, .2 + r * k, 0, 12);

}

for (const [a, b] of [[[-1.4, .22, -1.9], [.1, .22, -2.3]], [[-3.4, .22, -.6], [-4.2, .22, .6]]]) { const r = rod(null, a, b, .17, 0xe8e4f0); rod(null, a, b, .19, 0xf0b03a).scale.y = .12; }
// 太陽電池

for (const z of [-3.4, -2.9]) { const k = cyl(null, .2, .2, .8, 0xf6f6fa, 2.9, .24, z, 8); k.rotation.z = Math.PI / 2; for (const s of [-.3, .3]) cyl(null, .21, .21, .04, 0xf0b03a, 2.9 + s, .24, z, 8).rotation.z = Math.PI / 2; }
for (const [x, z, c] of [[-1.5, 3.2, 0xf0b03a], [-1.1, 3.25, 0x4f7fd8], [-1.3, 3.2, 0xe2574c]]) box(null, .34, .26, .3, c, x, c === 0xe2574c ? .4 : .13, z);
const mast = grp(null, -5.3, 0, 3.3); for (let k = 0; k < 4; k++) { box(mast, .04, .5, .04, 0x8a8698, -.1 + k * .03, .25 + k * .5, 0); box(mast, .04, .5, .04, 0x8a8698, .1 - k * .03, .25 + k * .5, 0); box(mast, .24 - k * .05, .03, .03, 0x8a8698, 0, .5 + k * .5, 0); }

const flag = grp(null, -.6, 0, 3.4); cyl(flag, .015, .015, .8, 0xe8e4f0, 0, .4, 0, 4); box(flag, .34, .2, .02, 0xf0b03a, .18, .68, 0); box(flag, .34, .06, .025, 0xe2574c, .18, .68, 0);

cyl(null, 1, 1, .06, 0x9a96a8, 2.6, .03, 2.4, 8); cyl(null, .75, .75, .07, 0xb8b4c4, 2.6, .035, 2.4, 8); box(null, .9, .075, .12, 0xf0c83a, 2.6, .04, 2.4); box(null, .12, .075, .9, 0xf0c83a, 2.6, .04, 2.4);
const padLights = [...Array(8)].map((_, i) => P.add(null, new THREE.SphereGeometry(.05, 5, 4), P.glow(0xffe060), 2.6 + Math.cos(i * Math.PI / 4 + .39) * .9, .09, 2.4 + Math.sin(i * Math.PI / 4 + .39) * .9));
const tw = grp(null, 3.5, 0, 1.7); box(tw, .14, 1.5, .14, 0xe2574c, 0, .75, 0); box(tw, .4, .05, .1, 0xe2574c, -.2, 1.2, 0); box(tw, .4, .05, .1, 0xe2574c, -.2, .7, 0);
const rocket = grp(null, 2.6, 0, 2.4); cyl(rocket, .2, .22, 1.1, 0xf6f6fa, 0, .85, 0, 8); cone(rocket, .2, .45, 0xe2574c, 0, 1.62, 0, 8); cyl(rocket, .22, .22, .08, 0xe2574c, 0, .95, 0, 8); ball(rocket, .07, 0x6aa8e8, 0, 1.2, .18, 1); cone(rocket, .14, .16, 0x6a6478, 0, .26, 0, 6);

const dust = [...Array(8)].map((_, i) => ({ m: ball(null, .14, 0xe8e4f0, 0, -5, 0), ph: i / 8 }));

// 探査車と宇宙飛行士
const rover = grp(); box(rover, .34, .12, .56, 0xf6f6fa, 0, .2, 0); box(rover, .3, .04, .3, 0x4f7fd8, 0, .34, -.08); cyl(rover, .015, .015, .34, 0x4a4058, .1, .44, .2, 4); ball(rover, .04, 0xe2574c, .1, .62, .2); box(rover, .1, .08, .08, 0x4a4058, -.08, .3, .24);
const wheels = [-.2, 0, .2].flatMap(z => [-.2, .2].map(x => { const w = cyl(rover, .09, .09, .07, 0x6a6478, x, .09, z, 7); w.rotation.z = Math.PI / 2; return w; }));
const track = P.path([[-1.8, 1.2], [.2, .3], [1.3, .9], [.9, 3.3], [-2.4, 3.1], [-3.2, 2.2]]);
const astro = (x, z) => { const g = P.person(null, x, z, 0xf6f6fa); ball(g, .14, 0xf6f6fa, 0, .46, 0, 1); box(g, .14, .08, .03, 0xf0b03a, 0, .47, .12); box(g, .16, .2, .08, 0xd8d2e0, 0, .26, -.1); return g; };
const crew = [[-3.2, .4, 0], [.5, -.9, 1], [4.6, 1.6, 2]].map(([x, z, i]) => ({ g: astro(x, z), x, z, ph: i * 2 }));
const tracksM = [...Array(30)].map(() => box(null, .3, .01, .05, 0xa8a2b8, 0, -5, 0)); let ti = 0, td = 0;

P.run((dt, t) => {
  const c = t % 16; let y = 0, fire = 0;
  if (c > 4 && c < 9) { y = (c - 4) ** 2 * .55; fire = 1; } else if (c >= 9 && c < 11) y = 14; else if (c >= 11) { const a = (16 - c) / 5; y = a * a * 13.75; fire = a > .02 ? .7 : 0; } else if (c > 3.2) fire = .35;
  rocket.position.y = y; flame.visible = fire > 0; flame.scale.set(fire + Math.sin(t * 40) * .1, fire * (1 + Math.sin(t * 31) * .2), fire);
  dust.forEach(d => { const a = (t * 1.3 + d.ph) % 1, on = fire > 0 && y < 1.5; d.m.visible = on; const ang = d.ph * 6.28; d.m.position.set(2.6 + Math.cos(ang) * a * 1.2, .12 + a * .2, 2.4 + Math.sin(ang) * a * 1.2); d.m.scale.setScalar(.4 + a); });

  td += dt; if (td > .22) { td = 0; const m = tracksM[ti++ % 30]; m.position.set(rover.position.x, .012, rover.position.z); m.rotation.y = rover.rotation.y; }
  for (const a of crew) { const h = Math.max(0, Math.sin(t * 1.6 + a.ph)); a.g.position.set(a.x + Math.sin(t * .35 + a.ph) * .5, h * .3, a.z + Math.cos(t * .3 + a.ph) * .4); a.g.rotation.y = t * .35 + a.ph + 1.6; }
});
