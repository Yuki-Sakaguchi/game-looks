<script src="pencil.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const P = PENCIL(THREE, { sky: 0xcfe6f2, fov: 34, sun: [4, 10, 5] });
const { box, cyl, cone, ball, prism, grp, hash, rod, cam } = P;

// 旅の道（輪になっている）。橋が 2 つ
const R = [[6, -3.5], [6, -.5], [-3, -.5], [-3, 4.5], [-8, 4.5], [-8, -5.5], [6, -5.5]];
const route = P.path(R);
const onRoute = (x, z) => R.some((a, i) => { const b = R[(i + 1) % R.length]; return x >= Math.min(a[0], b[0]) - .5 && x <= Math.max(a[0], b[0]) + .5 && z >= Math.min(a[1], b[1]) - .5 && z <= Math.max(a[1], b[1]) + .5; });
const NX = 26, NZ = 18, wx = ix => ix - (NX - 1) / 2, wz = iz => iz - (NZ - 1) / 2;
const river = x => Math.abs(x - 1.5) < .1, lake = (x, z) => Math.hypot(x - 8, (z - 5) * 1.3) < 2.4, forest = (x, z) => x < -4.4 && !onRoute(x, z), field = (x, z) => x > 2.6 && x < 5 && z > 1.4 && z < 4.6;
P.tiles(NX, NZ, (ix, iz, x, z) => river(x) || lake(x, z) ? [0x8fd0f0, -.14] : onRoute(x, z) ? [0xead8a8, -.02] : field(x, z) ? [0xb98a5a, -.04] : forest(x, z) ? [(ix + iz) % 2 ? 0x6fb04a : 0x62a442, 0] : [(ix + iz) % 2 ? 0x8cc152 : 0x7ab648, 0]);
box(null, NX + .4, 1, NZ + .4, 0x9a6b4a, 0, -.92, 0); P.sea(0xb4e0fa, -1.2);
for (const z of [-.5, -5.5]) { box(null, 1.5, .12, 1, 0xc09a6a, 1.5, .02, z); for (const s of [-.46, .46]) { box(null, 1.5, .05, .05, 0xd8574c, 1.5, .32, z + s); for (const x of [.85, 1.5, 2.15]) box(null, .05, .3, .05, 0xd8574c, x, .18, z + s); } }

// 森、畑、村、城あと、湖
for (let i = 0; i < 90; i++) { const x = -12.3 + hash(i, 1) * 7.8, z = -8.3 + hash(i, 2) * 16.6; if (!forest(x, z) || onRoute(x + .6, z) || onRoute(x - .6, z) || onRoute(x, z + .6) || onRoute(x, z - .6)) continue; (i % 3 ? P.tree : P.round)(null, x, z, .9 + hash(i, 3) * .6, [0x3f8f4a, 0x358a5a, 0x4fa04a][i % 3]); }
for (let i = 0; i < 40; i++) { const x = -3.5 + hash(i, 4) * 15.5, z = -8 + hash(i, 5) * 16; if (onRoute(x, z) || river(Math.round(x - .5) + .5) || lake(x, z) || field(x, z)) continue; i % 4 ? (cyl(null, .015, .015, .12, 0x3f8f4a, x, .06, z, 4), ball(null, .06, [0xf0a0c0, 0xf6e050, 0xfaf6ec][i % 3], x, .14, z)) : ball(null, .14 + hash(i, 6) * .1, 0xbdb6cc, x, .04, z); }
for (let ix = 0; ix < 6; ix++) for (let iz = 0; iz < 9; iz++) cone(null, .06, .34, 0xe8b83a, 2.85 + ix * .38, .12, 1.65 + iz * .34, 4);
const WALL = [0xf6efdc, 0xf2d8b0, 0xe8e0f0], ROOF = [0xe2574c, 0x4f7fd8, 0xf0a03a, 0x4fa07a];
[[8, -3.6, 1.2, 0], [9.6, -2.2, 1, .4], [8.2, -.8, 1.1, -.2], [4.2, -2.4, 1, .1], [10.4, -4.4, .9, 0], [3.9, -4.1, .9, .3], [10, .6, 1, -.3]].forEach(([x, z, s, r], i) => { const g = P.house(null, x, z, 1.1 * s, 1 * s, .8 * s, WALL[i % 3], ROOF[i % 4], r); box(g, .2, .2, .03, 0x9fc8e8, .3 * s, .5 * s, .51 * s); if (i % 2) box(g, .16, .4, .16, 0xc8a090, .3, .8 * s + .4, -.1); });
cyl(null, .4, .44, .3, 0xd8d2e0, 7, .15, -2.2, 8); cyl(null, .32, .32, .02, 0x8fd0f0, 7, .31, -2.2, 8); for (const s of [-.3, .3]) box(null, .05, .7, .05, 0x8a6a4a, 7 + s, .5, -2.2); prism(null, .5, .2, .9, 0xe2574c, 7, .85, -2.2).rotation.y = Math.PI / 2;
const sign = (x, z) => { box(null, .05, .5, .05, 0x8a6a4a, x, .25, z); box(null, .4, .2, .04, 0xd8b078, x, .5, z); };
sign(5.3, -.1); sign(-3.6, .1); sign(-7.4, 5.1); sign(5.4, -6.1);
const cas = grp(null, -5.6, 0, -2.4); cyl(cas, .6, .7, 1.8, 0xd0cadc, 0, .9, 0, 8); for (let i = 0; i < 8; i++) box(cas, .2, .2, .14, 0xd0cadc, Math.cos(i * .785) * .58, 1.9, Math.sin(i * .785) * .58).rotation.y = -i * .785 + 1.57; box(cas, 1.6, .9, .3, 0xd0cadc, 1.2, .45, 0); box(cas, .3, .6, 1.2, 0xd0cadc, -.4, .3, 1); ball(cas, .3, 0x6aa84a, .9, .9, .1, 1); box(cas, .26, .4, .05, 0x4a4058, .2, .2, .66);
const boat = grp(null, 8, -.26, 5); box(boat, .3, .1, .6, 0xd8574c, 0, 0, 0); P.person(boat, 0, 0, 0xf0b03a, 0xe8c860, .02).scale.setScalar(.7);
const fire = grp(null, -5.6, 0, 6.2); for (let k = 0; k < 3; k++) cyl(fire, .04, .04, .4, 0x8a5a3a, 0, .06, 0, 5).rotation.set(Math.PI / 2, 0, k * 1.05); const flame = P.add(fire, new THREE.ConeGeometry(.14, .4, 5), P.glow(0xffb040), 0, .28, 0); prism(null, .9, .6, 1, 0xf0dc9a, -6.4, 0, 6.9);
const chest = grp(null, -9.6, 0, 6); box(chest, .4, .22, .28, 0xb07a3a, 0, .11, 0); box(chest, .42, .05, .3, 0xf0c83a, 0, .22, 0);

// 仲間 3 人と犬、足もとの輪
const hero = P.person(null, 0, 0, 0x4f7fd8, 0xd8d2e0); box(hero, .04, .34, .04, 0xd8d2e0, .15, .34, .08); box(hero, .03, .2, .16, 0xe2574c, -.13, .26, 0);
const mage = P.person(null, 0, 0, 0xb05cc8); cone(mage, .14, .3, 0xb05cc8, 0, .66, 0, 6); box(mage, .03, .5, .03, 0x8a5a3a, .15, .3, .06); P.add(mage, new THREE.OctahedronGeometry(.05), P.glow(0x80e0f0), .15, .6, .06);
const archer = P.person(null, 0, 0, 0x4fa07a, 0x4fa07a); const bow = P.add(archer, new THREE.TorusGeometry(.14, .012, 4, 8, Math.PI), 0x8a5a3a, -.14, .3, .04); bow.rotation.set(0, Math.PI / 2, Math.PI / 2);
const dog = grp(); box(dog, .12, .12, .26, 0xd8a060, 0, .14, 0); box(dog, .1, .1, .1, 0xd8a060, 0, .22, .16); box(dog, .03, .03, .12, 0xd8a060, 0, .2, -.18).rotation.x = .6; for (const [a, b] of [[-.04, -.08], [.04, -.08], [-.04, .08], [.04, .08]]) box(dog, .03, .1, .03, 0xa87a50, a, .05, b);
const party = [hero, mage, archer, dog];
const ringM = P.add(null, new THREE.TorusGeometry(.26, .025, 4, 14), P.glow(0xffffff)); ringM.rotation.x = Math.PI / 2;
// 村の人と魔物
const npcs = [[7.6, -2.9, 0xe2574c], [8.8, -1.6, 0xf0b03a], [4.9, -3.2, 0x5ab8d8], [9.2, -3.4, 0xf0a0c0]].map(([x, z, c], i) => ({ g: P.person(null, x, z, c, i % 2 ? 0xe8c860 : 0), x, z, ph: i * 1.9 }));
const mark = P.add(null, new THREE.ConeGeometry(.07, .2, 4), P.glow(0xffe060)); mark.rotation.x = Math.PI;
const mons = [[-5.8, 1.2, 0x6ac85a], [-6.4, 3, 0x6ac85a], [-9.6, 0, 0xb05cc8], [-10, 3.4, 0x5ab8d8], [-5.5, -4.2, 0xb05cc8], [-1, 2.4, 0x6ac85a], [0, -3, 0x5ab8d8]].map(([x, z, c], i) => {
  const g = grp(null, x, 0, z); P.add(g, new THREE.SphereGeometry(.2, 7, 5, 0, Math.PI * 2, 0, Math.PI / 2), c, 0, 0, 0); ball(g, .03, 0x2a2438, -.07, .12, .15); ball(g, .03, 0x2a2438, .07, .12, .15); return { g, x, z, ph: i * 1.3 };
});
const birds = [...Array(3)].map((_, i) => { const g = grp(); box(g, .3, .02, .1, 0xfaf6ec, 0, 0, 0); box(g, .07, .05, .18, 0xfaf6ec, 0, 0, 0); return { g, a: i * 2.1 }; });
const look = new THREE.Vector3(6, 0, -3.5);

P.run((dt, t) => {
  const d = t * 1.25; party.forEach((p, i) => { route.at(d - i * .62, p); p.position.y = Math.abs(Math.sin(t * 9 + i * 1.3)) * (i === 3 ? .07 : .04); });
  ringM.position.set(hero.position.x, .03, hero.position.z); ringM.scale.setScalar(1 + Math.sin(t * 4) * .08);
  look.lerp(hero.position, Math.min(1, dt * 2.5)); cam.position.set(look.x, 16.5, look.z + 7.5); cam.lookAt(look.x, 0, look.z - .4);
  for (const n of npcs) { n.g.position.set(n.x + Math.sin(t * .4 + n.ph) * .5, Math.abs(Math.sin(t * 6 + n.ph)) * .03, n.z + Math.cos(t * .33 + n.ph) * .4); n.g.rotation.y = Math.atan2(Math.cos(t * .4 + n.ph), -Math.sin(t * .33 + n.ph)); }
  const nn = npcs[Math.floor(t / 4) % npcs.length]; mark.position.set(nn.g.position.x, .85 + Math.sin(t * 5) * .05, nn.g.position.z); mark.rotation.y = t * 3;
  for (const m of mons) { const h = Math.max(0, Math.sin(t * 3 + m.ph)); m.g.position.set(m.x + Math.sin(t * .5 + m.ph) * .4, h * .2, m.z + Math.cos(t * .4 + m.ph) * .4); m.g.scale.set(1.15 - h * .25, .8 + h * .5, 1.15 - h * .25); }
  flame.scale.set(1 + Math.sin(t * 13) * .15, 1 + Math.sin(t * 17) * .25, 1); boat.position.x = 8 + Math.sin(t * .3) * 1; boat.rotation.y = Math.cos(t * .3) > 0 ? 1.57 : -1.57;
  for (const b of birds) { const a = t * .5 + b.a; b.g.position.set(look.x + Math.cos(a) * 3, 5, look.z + Math.sin(a) * 2.4); b.g.rotation.y = -a; b.g.rotation.z = Math.sin(t * 9 + b.a) * .4; }
});
