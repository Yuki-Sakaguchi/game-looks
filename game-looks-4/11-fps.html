<title>4-11 FPS 砂の町 色鉛筆</title>
<style>

canvas{width:100vw;height:100vh;display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#3a3048}

<canvas id="c"></canvas>
<div id="cap">4-11 ─ FPS（一人称）砂の町 / 色鉛筆のハッチング　｜　見るだけ（自動で進む）</div>
<script src="pencil.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const P = PENCIL(THREE, { sky: 0xd4e8f2, fov: 68, sun: [5, 10, 3] });
const { box, cyl, cone, ball, prism, grp, hash, rod, cam, scene } = P;
scene.add(cam); cam.position.set(0, 1.6, 0); cam.rotation.set(0, 0, 0);

// 地面と遠くの山（動かない）
box(null, 80, .2, 260, 0xead9b0, 0, -.1, -100);
for (let i = 0; i < 9; i++) cone(null, 14 + hash(i, 1) * 10, 12 + hash(i, 2) * 14, i % 2 ? 0xd8c8b8 : 0xcdbcc0, -80 + i * 20 + hash(i, 3) * 8, 5, -150 - hash(i, 4) * 20, 5);

// 手前に流れてくるもの。z = -L+6 … 6 をくり返す
const L = 96, items = [];
const put = (g, z0) => { items.push({ g, z0 }); return g; };
for (let i = 0; i < 24; i++) put(box(null, 5.4, .02, 1.5, 0xdcc89c, 0, .005, 0), i * 4);           // 道の敷石
function ruin(i, side) {
  const g = grp(null, side * (5 + hash(i, 5) * 2.5), 0, 0), w = 2.4 + hash(i, 6) * 1.6, h = 2.2 + hash(i, 7) * 3.2, d = 2.6 + hash(i, 8) * 1.4;
  const c = [0xf2e2c0, 0xeacfa8, 0xf6ead0, 0xe8d8c8][i % 4];
  box(g, w, h, d, c, 0, h / 2, 0); box(g, w + .16, .14, d + .16, 0xd8c098, 0, h, 0);
  if (i % 3 === 0) box(g, w * .5, .8, d * .6, c, -w * .2, h + .4, 0); else if (i % 3 === 1) { cyl(g, w * .28, w * .28, .3, c, 0, h + .15, 0, 8); ball(g, w * .27, 0xc8dcd8, 0, h + .3, 0, 1); }
  const fx = -side * (w / 2 + .01);                                    // 道がわの面に戸と窓
  box(g, .06, 1.5, .8, 0x8a6a4a, fx, .75, d * .15); box(g, .08, .1, 1, 0xd8c098, fx, 1.55, d * .15);
  for (let k = 0; k * 1.5 + 2.6 < h; k++) for (const z of [-d * .25, d * .25]) { box(g, .06, .6, .5, 0x4a4058, fx, 2.4 + k * 1.5, z); box(g, .12, .06, .6, 0xd8c098, fx, 2.06 + k * 1.5, z); }
  if (i % 2) { for (let k = 0; k < 5; k++) box(g, .9, .04, .3, k % 2 ? 0xf6efdc : [0xe2574c, 0x4f7fd8, 0xf0b03a][i % 3], fx - side * .5, 1.9 - Math.abs(0) * 0, -d * .3 + k * .3).rotation.z = side * .35; }
  for (let k = 0; k < 3; k++) if (hash(i, 9 + k) > .45) { const x = fx - side * (.5 + hash(i, 12 + k) * .8), z = -d / 2 + hash(i, 15 + k) * d; k % 2 ? box(g, .5, .5, .5, 0xc8a070, x, .25, z).rotation.y = hash(i, k) : cyl(g, .24, .24, .6, 0xa87a50, x, .3, z, 8); }
  return g;
}
for (let i = 0; i < 24; i++) put(ruin(i, i % 2 ? 1 : -1), (i >> 1) * 8 + (i % 2) * 3);
for (let i = 0; i < 8; i++) {                                           // やしの木と街灯
  const g = put(grp(null, (i % 2 ? 1 : -1) * 3.3, 0, 0), i * 12 + 5);
  if (i % 4 < 2) { rod(g, [0, 0, 0], [.3, 3.2, 0], .1, 0xb08a5a); for (let k = 0; k < 6; k++) { const lf = grp(g, .3, 3.2, 0); lf.rotation.y = k * 1.05; const c = cone(lf, .2, 1.6, 0x4fa04a, .7, -.15, 0, 4); c.rotation.z = -Math.PI / 2 - .35; } }
  else { cyl(g, .05, .07, 2.6, 0x4a4058, 0, 1.3, 0, 5); P.add(g, new THREE.SphereGeometry(.16, 6, 4), P.glow(0xffe880), 0, 2.7, 0); }
}
for (let i = 0; i < 5; i++) { const g = put(grp(null, (i % 2 ? 1 : -1) * (1.2 + hash(i, 20)), 0, 0), i * 19 + 9); box(g, 1.4, .7, .4, 0xc8c0b0, 0, .35, 0); box(g, 1.5, .1, .5, 0xb8b0a0, 0, .72, 0); box(g, .5, .45, .45, 0xc8a070, .5, .97, 0); }

// 銃（カメラについている）と照準
const gun = grp(cam, .34, -.32, -.72);
gun.scale.setScalar(.8); box(gun, .1, .14, .56, 0xa8a4b6, 0, 0, 0); box(gun, .07, .07, .34, 0x6a6478, 0, .03, -.42); box(gun, .12, .05, .2, 0x4a4058, 0, .1, .05); box(gun, .03, .06, .03, 0x4a4058, 0, .11, -.5);
box(gun, .08, .26, .1, 0x4a4058, 0, -.18, .12).rotation.x = .25; box(gun, .07, .2, .08, 0xf0b03a, 0, -.16, -.12); box(gun, .16, .12, .3, 0xf0c8a0, .02, -.2, .2); box(gun, .14, .1, .16, 0xf0c8a0, -.08, -.1, -.2);
const flash = P.add(gun, new THREE.ConeGeometry(.12, .4, 5), P.glow(0xffd860), 0, .03, -.8); flash.rotation.x = -Math.PI / 2;
for (const [x, y, w, h] of [[-.035, 0, .03, .006], [.035, 0, .03, .006], [0, .035, .006, .03], [0, -.035, .006, .03]]) P.add(cam, new THREE.BoxGeometry(w, h, .001), P.glow(0x2a2438), x, y, -1);

// 敵のドローン
const drones = [...Array(4)].map((_, i) => {
  const g = grp(); ball(g, .34, 0xe2574c, 0, 0, 0, 1); box(g, 1.1, .05, .12, 0x6a6478, 0, .3, 0); box(g, .12, .05, 1.1, 0x6a6478, 0, .3, 0);
  const eye = P.add(g, new THREE.SphereGeometry(.12, 6, 5), P.glow(0xffe060), 0, 0, .3); const rot = box(g, .9, .02, .08, 0x4a4058, 0, .36, 0); box(g, .08, .3, .08, 0x6a6478, 0, -.4, 0);
  return { g, rot, x: -3 + i * 2, y: 1.4 + i * .5, z: -16 - i * 13, pop: 0, ph: i * 1.7 };
});
const tracer = P.add(null, new THREE.BoxGeometry(.03, .03, 1), P.glow(0xffe060)); tracer.visible = false;
const sparks = [...Array(8)].map(() => ({ m: P.add(null, new THREE.OctahedronGeometry(.12), P.glow(0xffb040)), a: 1, v: new THREE.Vector3() })); let sp = 0;
let cd = 1, kick = 0, tr = 0, yaw = 0, dist = 0; const muzzle = new THREE.Vector3(), tv = new THREE.Vector3();

P.run((dt, t) => {
  dist += dt * 3.2;
  for (const it of items) { const z = ((it.z0 + dist) % L + L) % L - L + 6; it.g.position.z = z; it.g.scale.setScalar(Math.min(1, (z + L - 6) / 6 + .001)); }
  let target = null;
  for (const d of drones) {
    if (d.pop > 0) { d.pop -= dt * 3; d.g.scale.setScalar(1 + (1 - d.pop) * 1.2); if (d.pop <= 0) { d.z = -45 - Math.random() * 20; d.x = (Math.random() - .5) * 7; d.y = 1.2 + Math.random() * 2.4; d.g.scale.setScalar(1); } }
    else { d.z += dt * 7; if (d.z > -4) d.z = -70; if (!target || d.z > target.z) target = d; }
    d.g.position.set(d.x + Math.sin(t * 1.3 + d.ph) * .6, d.y + Math.sin(t * 2.1 + d.ph) * .25, d.z); d.g.rotation.z = Math.sin(t * 1.3 + d.ph) * .2; d.rot.rotation.y = t * 30; d.g.visible = d.pop > 0 ? d.pop > .3 : true;
  }
  const aim = target && target.z > -34 ? Math.atan2(-target.g.position.x, -target.g.position.z) : Math.sin(t * .4) * .12;
  yaw += (aim - yaw) * Math.min(1, dt * 5); cam.rotation.y = yaw; cam.rotation.x = Math.sin(t * .7) * .015 + (target && target.z > -34 ? Math.atan2(target.g.position.y - 1.6, -target.z) * .8 : 0) * .6;
  cam.position.y = 1.6 + Math.sin(t * 7) * .035; cam.position.x = Math.sin(t * 3.5) * .05;
  cd -= dt; kick = Math.max(0, kick - dt * 6); tr -= dt;
  if (cd <= 0 && target && target.z > -13 && Math.abs(aim - yaw) < .06) {
    cd = .55; kick = 1; tr = .07; target.pop = 1;
    gun.updateWorldMatrix(true, false); muzzle.set(0, .03, -.7).applyMatrix4(gun.matrixWorld); tv.copy(target.g.position);
    tracer.position.copy(muzzle).lerp(tv, .5); tracer.lookAt(tv); tracer.scale.z = muzzle.distanceTo(tv);
    for (let k = 0; k < 4; k++) { const s = sparks[sp++ % 8]; s.a = 0; s.m.position.copy(tv); s.v.set((Math.random() - .5) * 4, Math.random() * 3, (Math.random() - .5) * 4); }
  }
  tracer.visible = tr > 0; flash.visible = tr > 0; flash.rotation.z = t * 40;
  gun.position.set(.34 + Math.sin(t * 3.5) * .008, -.32 + Math.sin(t * 7) * .012 + kick * .02, -.72 + kick * .09); gun.rotation.x = kick * .12;
  for (const s of sparks) { if (s.a >= 1) { s.m.visible = false; continue; } s.m.visible = true; s.a += dt * 2.5; s.v.y -= 6 * dt; s.m.position.addScaledVector(s.v, dt); s.m.position.z += dt * 3.2; s.m.scale.setScalar(1 - s.a); }
});
</script>
