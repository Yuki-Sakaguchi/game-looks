<div id="cap">4-03 ─ 箱庭の鉄道 / 色鉛筆のハッチング　｜　見るだけ（自動で進む）</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const P = PENCIL(THREE, { sky: 0xbfe2f4, size: 5.4, wide: 7.4 });
const { box, cyl, cone, ball, prism, grp, hash } = P;

// 草の島に、川が 1 本
P.tiles(12, 8, (ix, iz) => ix === 8 ? [0x8fd0f0, -.14] : [(ix + iz) % 2 ? 0x8cc152 : 0x7ab648, 0]);
P.dirt(12, 8); P.sea();

// 線路：角のまるい輪
const pts = []; for (let i = 0; i < 40; i++) { const a = i / 40 * Math.PI * 2, c = Math.cos(a), s = Math.sin(a); pts.push([4.6 * Math.sign(c) * Math.abs(c) ** .6, 2.7 * Math.sign(s) * Math.abs(s) ** .6]); }
const rail = P.path(pts);
for (let d = 0; d < rail.total; d += .27) {
  const g = grp(); rail.at(d, g);
  box(g, .5, .04, .1, 0x8a5a3a, 0, .02, 0); box(g, .04, .05, .3, 0x6a6478, -.17, .06, 0); box(g, .04, .05, .3, 0x6a6478, .17, .06, 0);
}
// 橋（川をこえる 2 か所）
for (const z of [-2.59, 2.59]) {
  box(null, 1.3, .12, .8, 0xb08a5a, 2.5, -.07, z);
  for (const s of [-.42, .42]) { box(null, 1.3, .05, .05, 0xd8574c, 2.5, .3, z + s); for (const x of [1.95, 2.5, 3.05]) box(null, .05, .34, .05, 0xd8574c, x, .15, z + s); }
  for (const x of [2.05, 2.95]) box(null, .14, .5, .7, 0xbdb6cc, x, -.35, z);
}
// トンネルの丘
const hill = ball(null, 1.5, 0x6aa84a, -3.75, -.1, -2.3, 1); hill.scale.set(1.25, .85, 1.05);
ball(null, .8, 0x7ab648, -5, -.1, -3, 1); for (const [x, z, s] of [[-3.9, -2.6, 1], [-3.2, -2.9, .8], [-4.5, -2.2, .9]]) P.tree(null, x, z, s, 0x3f8f4a, 1.05);
for (const [x, z, r] of [[-5.05, -1.1, 0], [-2.2, -3.05, 1.2]]) { const g = grp(null, x, 0, z); g.rotation.y = r; box(g, .12, .7, .12, 0xbdb6cc, -.36, .35, 0); box(g, .12, .7, .12, 0xbdb6cc, .36, .35, 0); box(g, .84, .14, .14, 0xbdb6cc, 0, .72, 0); }

// 駅
box(null, 3, .14, .6, 0xd8d0c0, 0, .07, 3.35); box(null, 3, .02, .06, 0xf0c83a, 0, .15, 3.1);
for (const x of [-1.1, 1.1]) for (const z of [3.2, 3.55]) box(null, .05, .7, .05, 0x6a4a3a, x, .5, z);
prism(null, .7, .22, 2.6, 0xd8574c, 0, .85, 3.37).rotation.y = Math.PI / 2;
box(null, .7, .5, .34, 0xf6efdc, .2, .4, 3.45); box(null, .5, .08, .14, 0xb08a5a, -.7, .26, 3.5);
const waiters = [[-.9, 3.3, 0xe2574c], [-.3, 3.25, 0x4f7fd8], [.9, 3.3, 0xf0b03a]].map(([x, z, c], i) => ({ g: P.person(null, x, z, c, i === 1 ? 0x4a4058 : 0, .14), ph: i }));
// 信号
const sig = grp(null, 1.9, 0, 3.2); cyl(sig, .03, .03, .9, 0x4a4058, 0, .45, 0, 5); box(sig, .14, .3, .1, 0x4a4058, 0, .95, 0);
const lightR = P.add(sig, new THREE.SphereGeometry(.05, 6, 4), P.glow(0xff5040), 0, 1.02, .06), lightG = P.add(sig, new THREE.SphereGeometry(.05, 6, 4), P.glow(0x60e070), 0, .88, .06);

// 輪の中の村
const WALL = [0xf6efdc, 0xf2d8b0, 0xe8e0f0], ROOF = [0xe2574c, 0x4f7fd8, 0xf0a03a];
[[-2.4, -.6, .8, .2], [-1.3, .5, .9, -.3], [-.2, -.9, .7, .1], [.9, .3, .8, .5]].forEach(([x, z, h, r], i) => { const g = P.house(null, x, z, .85, .8, h, WALL[i % 3], ROOF[i % 3], r); box(g, .18, .18, .03, 0x9fc8e8, .25, h * .6, .41); });
const ch = grp(null, -2.6, 0, .9); box(ch, .8, .9, 1.1, 0xf6efdc, 0, .45, 0); prism(ch, .92, .45, 1.2, 0x8a8298, 0, .9, 0); box(ch, .4, 1.5, .4, 0xf6efdc, 0, .75, .6); cone(ch, .34, .6, 0x8a8298, 0, 1.8, .6, 4).rotation.y = Math.PI / 4;
for (let x = -1.9; x < 1.4; x += .22) box(null, .16, .02, .3, 0xd8c8a0, x, .01, -.05 + Math.sin(x * 2) * .12);
const cows = [[3.6, -.6], [4, .5], [3.3, .9]].map(([x, z], i) => { const g = grp(null, x, 0, z); g.rotation.y = i * 2; box(g, .2, .2, .36, 0xfaf6ec, 0, .26, 0); box(g, .12, .1, .12, 0x4a4058, .02, .3, .08); box(g, .14, .14, .14, 0xfaf6ec, 0, .34, .24); for (const [a, b] of [[-.07, -.12], [.07, -.12], [-.07, .12], [.07, .12]]) box(g, .04, .16, .04, 0x4a4058, a, .08, b); return g; });
for (let i = 0; i < 12; i++) box(null, .04, .2, .04, 0xb08a5a, 3 + (i % 4) * .45 - (i > 7 ? 0 : 0), .1, i < 4 ? -1.2 : i < 8 ? 1.4 : -1.2 + (i - 7) * .52);
for (const [x, z, s] of [[5.4, -3.4, 1.2], [5.5, 3.4, 1.1], [-5.5, 3.3, 1.2], [-5.4, 2.3, .9], [.4, -3.6, .9], [1.4, -3.5, 1.1], [4.6, 3.6, .8], [-.6, 1.4, .9], [.3, 1.5, 1]]) (hash(x, z) > .45 ? P.tree : P.round)(null, x, z, s);
const boat = grp(null, 2.5, -.3, .2); box(boat, .26, .1, .5, 0xd8574c, 0, 0, 0); box(boat, .2, .03, .06, 0xb08a5a, 0, .06, 0);

// 列車
const loco = grp(); box(loco, .3, .1, .62, 0x4a4058, 0, .14, 0);
cyl(loco, .13, .13, .38, 0xe2574c, 0, .32, .1, 8).rotation.x = Math.PI / 2; box(loco, .3, .32, .2, 0xe2574c, 0, .35, -.2); box(loco, .34, .04, .26, 0x4a4058, 0, .53, -.2);
cyl(loco, .05, .04, .16, 0x4a4058, 0, .5, .2, 6); cyl(loco, .07, .05, .05, 0x4a4058, 0, .6, .2, 6); ball(loco, .05, 0xf0c83a, 0, .47, .02); cone(loco, .14, .14, 0x4a4058, 0, .12, .37, 4).rotation.x = Math.PI / 2;
const mkWheels = g => [[-.16, -.18], [.16, -.18], [-.16, .18], [.16, .18]].map(([x, z]) => { const w = cyl(g, .08, .08, .04, 0x6a6478, x, .09, z, 8); w.rotation.z = Math.PI / 2; return w; });
const wheels = mkWheels(loco);
const cars = [0x4a4058, 0x4f7fd8, 0xf0b03a, 0x4fa07a].map((c, i) => {
  const g = grp(); box(g, .28, .08, .54, 0x4a4058, 0, .13, 0); wheels.push(...mkWheels(g));
  if (i === 0) { box(g, .28, .2, .4, c, 0, .26, 0); ball(g, .1, 0x2a2438, 0, .38, 0); }
  else { box(g, .28, .26, .52, c, 0, .3, 0); box(g, .3, .04, .56, 0xf6efdc, 0, .45, 0); box(g, .3, .1, .4, 0x9fc8e8, 0, .34, 0); }
  return g;
});
const puffs = [...Array(7)].map((_, i) => ({ m: ball(null, .1, 0xe8e4f0, 0, -5, 0), last: 1, i }));

P.run((dt, t) => {
  const d = t * 1.7; rail.at(d, loco); cars.forEach((c, i) => rail.at(d - .66 * (i + 1), c));
  for (const w of wheels) w.rotation.x = t * 9;
  for (const p of puffs) {
    const a = (t * .8 + p.i / 7) % 1; if (a < p.last) p.m.position.set(loco.position.x, .7, loco.position.z); p.last = a;
    p.m.position.y = .7 + a * .9; p.m.scale.setScalar(.5 + a * 1.6 - a * a * 1.5);
  }
  const near = Math.hypot(loco.position.x - 1.9, loco.position.z - 2.6) < 2.5; lightR.visible = near; lightG.visible = !near;
  for (const w of waiters) w.g.position.y = .14 + Math.max(0, Math.sin(t * 3 + w.ph * 2)) * .04;
  cows.forEach((c, i) => { c.rotation.y = i * 2 + Math.sin(t * .3 + i) * .6; });
  boat.position.z = .2 + Math.sin(t * .4) * 1.4; boat.position.y = -.3 + Math.sin(t * 2) * .02;
});
