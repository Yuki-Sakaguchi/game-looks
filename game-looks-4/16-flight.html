<canvas id="c"></canvas>
<div id="cap">4-16 ─ フライト（複葉機で輪くぐり）/ 色鉛筆のハッチング　｜　見るだけ（自動で進む）</div>
<script src="pencil.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const P = PENCIL(THREE, { sky: 0xd4ecf6, fov: 60, sun: [4, 10, 5] });
const { box, cyl, cone, ball, prism, grp, hash, rod, cam } = P;

// 飛ぶ道すじ（進んだ距離 d での横と高さ）。輪はこの上に並ぶ
const px = d => 9 * Math.sin(d * .03) + 3 * Math.sin(d * .071), py = d => 2.6 * Math.sin(d * .022 + 1);
const SEA = -14;
box(null, 900, .2, 900, 0xa8dcf2, 0, SEA - .1, -200);

// 流れてくるもの：島、雲、船、波
const L = 240, items = [];
const put = (g, z0, sc = 1) => { items.push({ g, z0, sc }); return g; };
for (let i = 0; i < 9; i++) {
  const r = 7 + hash(i, 1) * 9, g = put(grp(null, (i % 2 ? 1 : -1) * (10 + hash(i, 2) * 46), SEA, 0), i * 27 + hash(i, 3) * 10);
  cyl(g, r * 1.15, r * 1.25, .5, 0xf0dc9a, 0, .25, 0, 9); cyl(g, r * .9, r, 1.2, 0x8cc152, 0, 1, 0, 8); cone(g, r * .55, r * .9 + 2, i % 3 ? 0x6aa84a : 0xbdb6cc, -r * .15, 1.6 + (r * .9 + 2) / 2, -r * .1, 6);
  if (i % 3 === 0) cone(g, r * .24, r * .34, 0xffffff, -r * .15, 1.6 + r * .9 + 2 - r * .17, -r * .1, 6);
  for (let k = 0; k < 7; k++) { const a = hash(i, k + 4) * 6.28, q = r * (.55 + hash(i, k + 12) * .3); P.tree(g, Math.cos(a) * q, Math.sin(a) * q, 3 + hash(k, i) * 2, 0x3f8f4a, 1.6); }
  if (i % 2) for (let k = 0; k < 3; k++) P.house(g, r * .5 + k * 1.6 - 1.6, r * .55 - k * .4, 1.3, 1.2, 1, [0xf6efdc, 0xf2d8b0][k % 2], [0xe2574c, 0x4f7fd8, 0xf0a03a][k], .3, 1.6);
  else { for (let k = 0; k < 4; k++) cyl(g, 1 - k * .1, 1.1 - k * .1, 1.6, k % 2 ? 0xe2574c : 0xf6efdc, r * .6, 2.4 + k * 1.6, r * .5, 8); cone(g, 1, .9, 0xe2574c, r * .6, 8.5, r * .5, 8); }
}
for (let i = 0; i < 14; i++) { const g = put(grp(null, (i % 2 ? 1 : -1) * (5 + hash(i, 20) * 40), -6 + hash(i, 21) * 14, 0), i * 17 + hash(i, 22) * 9); const n = 3 + (i % 3); for (let k = 0; k < n; k++) ball(g, 1.6 + hash(i, k) * 1.6, 0xffffff, k * 2.2 - n, hash(k, i) * 1, hash(k, i + 5) * 1.2, 1); }
for (let i = 0; i < 5; i++) { const g = put(grp(null, (i % 2 ? 1 : -1) * (6 + hash(i, 30) * 26), SEA, 0), i * 47 + 20); box(g, 1.4, .8, 3.6, 0x9a6a4a, 0, .4, 0); box(g, 1.5, .1, 3.7, 0xe8d8b0, 0, .85, 0); for (const z of [-.6, .8]) { cyl(g, .07, .09, 4, 0x8a6a4a, 0, 2.8, z, 5); box(g, 2, 1.6, .08, 0xfaf6ec, 0, 3, z + .15); box(g, 1.5, 1, .08, 0xfaf6ec, 0, 4.4, z + .15); } box(g, .4, .02, 5, 0xffffff, 0, .02, 4); }
for (let i = 0; i < 60; i++) put(box(null, 1.6 + hash(i, 40) * 2, .02, .14, 0xffffff, -70 + hash(i, 41) * 140, SEA + .02, 0), hash(i, 42) * L);
for (let i = 0; i < 3; i++) {                                          // 気球
  const g = put(grp(null, (i % 2 ? 1 : -1) * (12 + i * 7), 2 + i * 2, 0), i * 80 + 50); const c = [0xe2574c, 0xf0c83a, 0x4f7fd8][i];
  ball(g, 2.4, c, 0, 2.6, 0, 1); for (let k = 0; k < 4; k++) { const st = P.add(g, new THREE.TorusGeometry(2.42, .1, 4, 12), 0xfaf6ec, 0, 2.6, 0); st.rotation.y = k * .785; } cone(g, 1.3, 1.6, c, 0, .2, 0, 8).rotation.x = Math.PI; box(g, .9, .7, .9, 0xc09a6a, 0, -1.6, 0); for (const [a, b] of [[-.4, -.4], [.4, -.4], [-.4, .4], [.4, .4]]) rod(g, [a, -1.3, b], [a * 1.6, .2, b * 1.6], .03, 0x8a6a4a);
}
// くぐる輪
const rings = [...Array(5)].map(() => { const g = grp(); P.add(g, new THREE.TorusGeometry(2.3, .16, 6, 18), P.glow(0xffd040)); P.add(g, new THREE.TorusGeometry(2.3, .26, 4, 18), 0xf0a03a).scale.z = .5; return { g, k: -1 }; });
const stars = [...Array(10)].map(() => ({ m: P.add(null, new THREE.OctahedronGeometry(.22), P.glow(0xffe060)), a: 1, v: new THREE.Vector3() })); let si = 0;

// 複葉機（機首は -z）
const plane = grp(), pb = grp(plane);
const fus = cyl(pb, .42, .2, 3.4, 0xe2574c, 0, 0, .3, 8); fus.rotation.x = -Math.PI / 2; cyl(pb, .44, .44, .5, 0xf6efdc, 0, 0, -1.5, 8).rotation.x = Math.PI / 2; cone(pb, .2, .3, 0x6a6478, 0, 0, -1.9, 6).rotation.x = -Math.PI / 2;
const prop = grp(pb, 0, 0, -1.86); box(prop, 2, .12, .04, 0x8a6a4a, 0, 0, 0); box(prop, .12, 2, .04, 0x8a6a4a, 0, 0, 0);
box(pb, 5.4, .1, 1, 0xf6efdc, 0, -.32, -.6); box(pb, 5.8, .1, 1.05, 0xf6efdc, 0, .95, -.75); for (const s of [-1, 1]) { box(pb, 1.2, .11, 1.06, 0xe2574c, s * 2.3, .95, -.75); for (const z of [-.95, -.4]) rod(pb, [s * 1.9, -.3, z + .2], [s * 1.9, .95, z], .035, 0x8a6a4a); for (const z of [-.95, -.4]) rod(pb, [s * .4, .35, z + .1], [s * .5, .95, z], .03, 0x8a6a4a); }
box(pb, 1.9, .08, .7, 0xf6efdc, 0, .1, 1.75); prism(pb, .08, .9, .8, 0xe2574c, 0, .1, 1.7);
for (const s of [-1, 1]) { rod(pb, [s * .3, -.3, -.9], [s * .6, -.95, -1], .04, 0x6a6478); cyl(pb, .26, .26, .12, 0x4a4058, s * .65, -.98, -1, 8).rotation.z = Math.PI / 2; }
ball(pb, .2, 0xf0c8a0, 0, .5, .1, 1); ball(pb, .22, 0x8a5a3a, 0, .56, .14, 1); box(pb, .34, .08, .06, 0x4a4058, 0, .52, -.06); const scarf = grp(pb, 0, .34, .28); box(scarf, .1, .06, .9, 0xf6f6fa, 0, 0, .45);
box(pb, .5, .26, .04, 0xbfe0f4, 0, .5, -.3);
const trail = [...Array(10)].map((_, i) => ({ m: ball(null, .12, 0xffffff, 0, -99, 0, 1), ph: i / 10 }));
let d = 0, next = 0;

P.run((dt, t) => {
  d += dt * 24;
  for (const it of items) { const z = ((it.z0 + d) % L + L) % L - L + 14; it.g.position.z = z; it.g.scale.setScalar(Math.min(1, Math.max(.001, (z + L - 14) / 16))); }
  const X = px(d), Y = py(d), bank = (px(d + 4) - px(d - 4)) * .09, pitch = (py(d + 4) - py(d - 4)) * .06;
  plane.position.set(X, Y, 0); pb.rotation.z = -bank; pb.rotation.x = pitch; plane.rotation.y = -(px(d + 3) - px(d - 3)) * .03; prop.rotation.z = t * 40; scarf.rotation.y = Math.sin(t * 9) * .3; scarf.rotation.x = Math.sin(t * 7) * .15;
  rings.forEach((r, i) => {
    const k = Math.floor(d / 44) + i, D = (k + .5) * 44, z = -(D - d);
    if (r.k !== k && z < -150) r.k = k;
    r.g.position.set(px(D), py(D), z); r.g.rotation.y = -(px(D + 3) - px(D - 3)) * .03; r.g.rotation.z = t * .6 + i; r.g.scale.setScalar(Math.min(1, Math.max(.001, (z + 190) / 20)));
  });
  const passed = Math.floor((d - 22) / 44); if (passed !== next) { next = passed; for (let k = 0; k < 10; k++) { const s = stars[si++ % 10]; s.a = 0; s.m.position.set(X, Y, 0); s.v.set(Math.cos(k * .63) * 5, Math.sin(k * .63) * 5, 6); } }
  for (const s of stars) { if (s.a >= 1) { s.m.visible = false; continue; } s.m.visible = true; s.a += dt * 1.6; s.m.position.addScaledVector(s.v, dt); s.m.rotation.y = t * 9; s.m.scale.setScalar(1.3 - s.a); }
  trail.forEach(p => { const a = (t * 1.6 + p.ph) % 1, dd = d - 2 - a * 12; p.m.position.set(px(dd) + (p.ph > .5 ? 2.7 : -2.7), py(dd) - .3, 2 + a * 12); p.m.scale.setScalar(.8 - a * .7); });
  cam.position.set(px(d - 7) * .82, py(d - 7) * .8 + 2.4, 8.6); cam.lookAt(X * .88, Y * .9 + .5, -6);
});
</script>
