<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4-14 レース 色鉛筆</title>
<style>
html,body{margin:0;height:100%;background:#f6f1e3;overflow:hidden}
canvas{width:100vw;height:100vh;display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#3a3048}
</style>
<canvas id="c"></canvas>
<div id="cap">4-14 ─ レース（うしろから追う視点）/ 色鉛筆のハッチング　｜　見るだけ（自動で進む）</div>
<script src="pencil.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const P = PENCIL(THREE, { sky: 0xcfe8f4, fov: 62, sun: [5, 10, 4] });
const { box, cyl, cone, ball, prism, grp, hash, rod, cam } = P;

// コースの曲がり：道のり s での横の位置
const f = s => 7 * Math.sin(s * .045) + 3 * Math.sin(s * .11 + 1);
const yaw = s => Math.atan2(f(s - 1) - f(s + 1), 2);   // 手前がわ（-z）が進む向き
const N = 76, STEP = 2, SPAN = N * STEP, AHEAD = 132;
const sOf = (k, car) => k + SPAN * Math.floor((car + AHEAD - k) / SPAN);          // いま見えている周回での道のり

// 地面と山（車についてくる）
const far = grp(); box(far, 500, .2, 500, 0x8cc152, 0, -.16, 0);
for (let i = 0; i < 12; i++) cone(far, 16 + hash(i, 1) * 12, 14 + hash(i, 2) * 16, i % 2 ? 0xb8c8d8 : 0xa8bcc8, -130 + i * 24, 6, -170 - hash(i, 3) * 20, 5);
for (let i = 0; i < 5; i++) { const c = grp(far, -80 + i * 40, 30 + hash(i, 4) * 12, -150); for (let k = 0; k < 4; k++) ball(c, 4 + hash(i, k) * 3, 0xffffff, k * 5 - 8, hash(k, i) * 2, 0, 1); }

// 道の板（縁石と中央線つき）
const road = [...Array(N)].map((_, k) => {
  const g = grp(); box(g, 8, .1, STEP + .25, 0xa8a4b6, 0, -.05, 0);
  for (const s of [-1, 1]) box(g, .5, .12, STEP + .25, k % 2 ? 0xe2574c : 0xf6f6fa, s * 4.2, -.04, 0);
  if (k % 3 === 0) box(g, .16, .11, 1.3, 0xf6f6fa, 0, -.04, 0);
  return { g, s0: k * STEP };
});
// 道ばたのもの
const side = [];
for (let i = 0; i < 46; i++) {
  const sd = i % 2 ? 1 : -1, g = grp(), k = i % 6, off = 6 + hash(i, 5) * 9;
  if (k < 3) (k ? P.tree : P.round)(g, 0, 0, 2.4 + hash(i, 6) * 2.2, [0x3f8f4a, 0x4fa04a, 0x5aa84e][i % 3]);
  else if (k === 3) { box(g, .12, 1.6, .12, 0x8a8698, 0, .8, 0); const b = box(g, 1.3, 1, .08, 0xf0c83a, 0, 2, 0); for (let j = 0; j < 3; j++) prism(g, .06, .5, .3, 0x2a2438, -.4 + j * .4, 1.76, .06).rotation.z = sd * Math.PI / 2; }
  else if (k === 4) { for (let j = 0; j < 3; j++) for (let l = 0; l < 2 - (j > 1); l++) { const ty = cyl(g, .32, .32, .24, j % 2 ? 0xf6f6fa : 0xe2574c, j * .7 - .7, .12 + l * .24, 0, 8); } }
  else { const h = P.house(g, 0, 0, 2.2, 2, 1.6, [0xf6efdc, 0xf2d8b0][i % 2], [0xe2574c, 0x4f7fd8, 0xf0a03a][i % 3], -sd * Math.PI / 2); }
  side.push({ g, s0: hash(i, 7) * SPAN, off: sd * (k === 4 ? 5.3 : k === 3 ? 5.6 : off + (k === 5 ? 4 : 0)) });
}
// 観客席とゲート（1 周に 1 回）
const stand = grp(); for (let r = 0; r < 4; r++) { box(stand, 14, .5, 1, 0xd0cadc, 0, .25 + r * .5, r * 1); for (let j = 0; j < 20; j++) ball(stand, .2, [0xe2574c, 0x4f7fd8, 0xf0c83a, 0xfaf6ec, 0x4fa07a][(j * 7 + r) % 5], -6.5 + j * .68, .75 + r * .5, r * 1); } box(stand, 14.4, .2, 5, 0xe2574c, 0, 3.6, 1.6); for (const x of [-7, 0, 7]) box(stand, .2, 3.6, .2, 0x8a8698, x, 1.8, 3.9);
side.push({ g: stand, s0: 40, off: -12, turn: Math.PI / 2 });
const gate = grp(); for (const s of [-1, 1]) box(gate, .5, 5, .5, 0x8a8698, s * 5, 2.5, 0); box(gate, 10.5, 1.1, .5, 0xf6f6fa, 0, 5, 0); for (let j = 0; j < 14; j++) for (let l = 0; l < 2; l++) if ((j + l) % 2) box(gate, .7, .5, .54, 0x2a2438, -4.55 + j * .7, 4.75 + l * .5, 0);
side.push({ g: gate, s0: 60, off: 0 });

// 車
function car(c, c2) {
  const g = grp(), b = grp(g);
  box(b, 1.5, .34, 3, c, 0, .42, 0); box(b, 1.3, .2, .8, c, 0, .44, -1.7); box(b, 1.2, .36, 1.3, 0xbfe0f4, 0, .76, .2); box(b, 1.24, .08, 1.1, c, 0, .96, .25);
  box(b, 1.7, .08, .4, c2, 0, 1.0, 1.4); for (const s of [-.6, .6]) box(b, .08, .34, .2, c2, s, .8, 1.4); box(b, .34, .06, 3.02, c2, 0, .6, 0);
  for (const s of [-.5, .5]) { box(b, .3, .14, .06, 0xffe880, s, .5, -1.51); P.add(b, new THREE.BoxGeometry(.3, .12, .06), P.glow(0xff5040), s, .5, 1.51); }
  const ws = [[-.8, -1], [.8, -1], [-.8, 1], [.8, 1]].map(([x, z]) => { const w = cyl(b, .34, .34, .3, 0x4a4058, x, .34, z, 10); w.rotation.z = Math.PI / 2; cyl(b, .16, .16, .32, 0xd0cadc, x, .34, z, 6).rotation.z = Math.PI / 2; return w; });
  return { g, b, ws };
}
const me = car(0xe2574c, 0xf6f6fa);
const rivals = [[0x4f7fd8, 0xf0c83a], [0xf0c83a, 0x2a2438], [0x4fa07a, 0xf6f6fa], [0xb05cc8, 0xf6f6fa]].map(([a, b], i) => ({ ...car(a, b), i, lane: (i % 2 ? 1 : -1) * 2 }));
const smoke = [...Array(8)].map((_, i) => ({ m: ball(null, .16, 0xeeeaf4, 0, -9, 0, 1), ph: i / 8 }));
const place = (o, s, x) => { o.g.position.set(f(s) + x, 0, -s); o.g.rotation.y = yaw(s); };
let S = 0, lane = 0;

P.run((dt, t) => {
  S += dt * 26;
  for (const r of road) { const s = sOf(r.s0, S); r.g.position.set(f(s), 0, -s); r.g.rotation.y = yaw(s); }
  for (const o of side) { const s = sOf(o.s0, S); o.g.position.set(f(s) + o.off, 0, -s); o.g.rotation.y = yaw(s) + (o.turn || 0); o.g.scale.setScalar(Math.min(1, Math.max(.001, (S + AHEAD - s) / 10))); }
  const steer = (f(S + 6) - f(S)) - (f(S) - f(S - 6));
  lane += (Math.sin(t * .5) * 2.2 - lane) * dt; place(me, S, lane); me.g.rotation.y += Math.cos(t * .5) * .05; me.b.rotation.z = steer * .06; me.b.position.y = Math.sin(t * 30) * .01;
  for (const w of me.ws) w.rotation.x = -t * 30;
  for (const r of rivals) { const s = S + 12 + r.i * 11 + Math.sin(t * .23 + r.i * 2) * 7; place(r, s, r.lane + Math.sin(t * .4 + r.i) * .9); r.b.rotation.z = ((f(s + 6) - f(s)) - (f(s) - f(s - 6))) * .06; for (const w of r.ws) w.rotation.x = -t * 30; }
  smoke.forEach(p => { const a = (t * 2.2 + p.ph) % 1, s = S - 1.8 - a * 5; p.m.position.set(f(s) + lane + Math.sin(p.ph * 30) * .5, .25 + a * .6, -s); p.m.scale.setScalar(.4 + a * 1.4 - a * a * 1.5); });
  far.position.set(f(S) * .6, 0, -S);
  const cs = S - 7.5; cam.position.set(f(cs) * .75 + f(S) * .25 + lane * .6, 3 + Math.sin(t * 23) * .012, -cs); cam.lookAt(f(S + 10) * .6 + f(S) * .4 + lane * .5, 1.1, -(S + 9));
});
</script>
