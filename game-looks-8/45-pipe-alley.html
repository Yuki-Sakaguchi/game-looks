  { const ph = (t * 3 + 9) / 20, k = ph % 2 < 1 ? ph % 1 : 1 - ph % 1, dd = ph % 2 < 1 ? 1 : -1; kid.position.set(END + 1.3, 0, -10 + k * 20); kid.rotation.y = dd > 0 ? 0 : PI; R.walk(kid, t * 11, 1.25); }
  R.catPose(cat, 'sit', t); const cu = (t * .8 / 30 + .3) % 1; cat2.position.set(22 - cu * 30, 0, .95); cat2.rotation.y = -PI / 2; R.catPose(cat2, 'walk', t * 9);
  birds.forEach((b, i) => R.birdPose(b, 'peck', t + i * .7));
  C.update(t, cam); crt.render(scene, cam, t);
});
