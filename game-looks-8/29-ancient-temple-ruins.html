<style>

<div id="cap">8-29 ─ 古代神殿の遺跡 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="pack-ruins.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 丘の上の古代神殿。朝のやわらかい光。色は石のクリームと草の緑、空の水色に、学者の上着のあい色をさし色にする。
// 石の柱・くずれたアーチ・石段・彫りのある石は pack-ruins.js（PK.〜）。つたと花がからみ、ふもとの池に柱が映る（水面に柱の絵をはっている）。
// 地図を持つ学者（R.actor の toon）が池のわきから石段をのぼり、柱のあいだをぬけて、草の坂を下りてひとまわりする。鳥、ちょう、水を飲む しか。
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), PK = PACK_RUINS(THREE, K, R), T = R.tex, PT = PK.tex, { hash } = K;
const { scene, cam, renderer, onResize } = K.stage({ fov: 46, far: 900, aa: false, fitAspect: .9, maxFov: 76 });
scene.add(R.skyDome([[0, '#58a6e0'], [.5, '#84c4ec'], [.85, '#b2dcf2'], [1, '#e8f4ec']], { r: 380 })); scene.fog = new THREE.Fog('#dcefe6', 50, 240);
const { sun } = K.lights(scene, renderer, { sky: 0xd4ecff, ground: 0xa8c490, amb: 1.6, sun: 0xffe6bc, power: 2.2, range: 36, map: 2048 }), SUN = new THREE.Vector3(.6, .58, .52).normalize();

// ---- 丘（上は平らな神殿の床。まわりは 1:2 の坂）と、ふもとの池 ----
const TOP = 4.2, STZ = 8.4, POOL = [-6.5, 14.2, 5], WY = -.06, sm = (a, b, v) => { const k = Math.max(0, Math.min(1, (v - a) / (b - a))); return k * k * (3 - 2 * k); };
const dOut = (x, z) => Math.hypot(Math.max(0, Math.abs(x) - 9), Math.max(0, z, -18 - z)), dPool = (x, z) => Math.hypot(x - POOL[0], (z - POOL[1]) * 1.15) - POOL[2];
const H = (x, z) => { const d = dOut(x, z), h = Math.max(0, TOP - d * .5) + (d > 9 ? Math.sin(x * .13) * Math.cos(z * .11) * .5 * sm(9, 20, d) : 0); return h - 2.4 * (1 - sm(-1.2, .5, dPool(x, z))); };
const onStep = (x, z) => Math.abs(x) < 2.5 && z > 0 && z < STZ, Y = (x, z) => onStep(x, z) ? (Math.floor((STZ - z) / .6) + 1) * .3 : H(x, z);
const path = new THREE.CatmullRomCurve3([[5, 25], [1.6, 18.5], [0, 12], [0, 8], [0, 0], [.4, -8], [3, -13.6], [10, -14.2], [18, -11], [21.5, -1], [20, 10], [15, 20], [10, 26]].map(([x, z]) => new THREE.Vector3(x, 0, z)), true, 'centripetal');
const LEN = path.getLength(), PTS = path.getSpacedPoints(110), dPath = (x, z) => { let d = 1e9; for (const p of PTS) d = Math.min(d, (p.x - x) ** 2 + (p.z - z) ** 2); return Math.sqrt(d); };
const GR = { c: '#78b456', flowers: .35, fc: ['#ffffff', '#ffe27a', '#c8b8f0'] }, STONE = '#e2d6b4';
const land = R.ground({ w: 108, d: 108, cell: 1.5, H, layers: [T.grass(GR), PT.ancient({ kind: 'block', c: STONE, moss: .45 }), T.cobble({ kind: 'slab', c: '#d2c6a4', moss: .6 })],
  mix: (x, z) => [.5 + (.4 - dOut(x, z)) * .8, dOut(x, z) > .6 && dPath(x, z) < 6 ? .5 + (1.1 - dPath(x, z)) * .5 : 0],
  shade: (x, z) => { const w = dPool(x, z); return w < .3 ? [.5, .8, 1.25] : [1, 1, .96]; } });
scene.add(land.mesh); for (const [w, d, x, z] of [[320, 704, -213, 0], [320, 704, 213, 0], [128, 320, 0, -213], [128, 320, 0, 213]]) { const o = R.ground({ w, d, cell: 32, layers: [T.grass(GR)] }); o.mesh.position.set(x, -.1, z); scene.add(o.mesh); }   // 遠くまでつづく草地（池の底をふさがないよう、まわりだけに 4 枚）
const WF = T.water({ c: '#5aaad6' }), water = R.ground({ w: 14, d: 14, cell: 2, layers: [WF[0]] }); water.mesh.position.set(POOL[0], WY, POOL[1]); water.mesh.receiveShadow = false; water.mat.transparent = true; water.mat.opacity = .8; water.mat.depthWrite = false; scene.add(water.mesh);

// ---- 神殿（pack-ruins）：置く高さは地面にあわせる ----
const fixed = [], put = (o, x, z, ry = 0, y = Y(x, z)) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
put(PK.steps({ w: 5, n: 14, rise: .3, run: .6, c: STONE, moss: .5, base: .4 }), 0, STZ, 0, 0);
const COLS = [[-6, -3, 0], [-6, -6, 0], [-6, -9, .5], [-6, -12, 0], [-6, -15, .8], [6, -3, 0], [6, -6, .45], [6, -9, 0], [6, -11.6, .78], [-4.2, 10, 0], [4.2, 10, .62], [-10, 3.5, .7]];
COLS.forEach(([x, z, br], i) => put(PK.column({ h: 7, r: .55, c: STONE, broken: br, seed: i, ivy: .7 }), x, z, i));
{ const G = R.geo(), CT = PT.ancient({ kind: 'carve', c: STONE, moss: .2 });   // 柱にのる はりと、落ちた石（彫りつき）
  G.box(1.3, .7, 4.6, -6, TOP + 7, -4.5, { m: 3, bottom: true }); G.box(1.3, .7, 4.4, 6, TOP + 7, -3, { m: 3, bottom: true }).at(R.TR(3.4, TOP + .05, -8.4, .5, 0, .12)).box(1.2, .7, 3, 0, 0, 0, { m: 3 }).at(R.TR(-3.2, TOP, -1.4, .3)).box(1.1, .8, 1.1, 0, 0, 0, { m: 3 }).at(R.TR(3, 0, 11.6, -.4, 0, -.1)).box(1.3, .7, 1.6, 0, 0, 0, { m: 3 }).at(R.TR(-13.5, H(-13.5, 9), 9, .8)).box(1.2, .7, 1.2, 0, 0, 0, { m: 3 }).at(R.TR(0, TOP, -15.6)).box(2.4, 1.1, 1.3, 0, 0, 0, { m: 3 }).box(1.5, .5, .9, 0, 1.1, 0, { m: 3 });
  fixed.push(G.mesh(CT)); }
put(PK.arch({ w: 5, h: 6.6, c: STONE, seed: 1 }), 0, -1.3, 0, TOP); put(PK.arch({ w: 4.6, h: 6, c: STONE, broken: .5, seed: 2 }), .3, -11, .06, TOP);
put(PK.wall({ len: 10, h: 4.6, tex: PT.ancient({ kind: 'carve', c: STONE, moss: .3 }), seed: 4, rebar: false, fall: .35 }), -1.5, -17.2, 0, TOP);
{ const f = put(PK.column({ h: 5.5, r: .5, c: STONE, seed: 3, ivy: 0 }), -2.6, -13.2, .5, TOP + .58); f.rotation.z = Math.PI / 2; }   // たおれた柱
for (const [x, y, z, ry, w, h] of [[-3.1, TOP + 3.6, -.66, 0, 2.6, 3.2], [3.2, TOP + 2.2, -.66, 0, 2, 2.6], [-1.5, TOP + 1.8, -16.55, 0, 6, 3], [2.56, .3, 6, Math.PI / 2, 6, 2.4], [-2.56, .6, 5, -Math.PI / 2, 6, 2.6]]) put(PK.ivy({ w, h, from: 'top', amount: .75, flowers: .5, seed: x > 0 ? 1 : 0 }), x, z, ry, y);
// 池の柱と、水に映る柱（水面に、柱の絵を手前へのばしてはる。昔の 3D ゲーム機ふうの見せ方。段ごとに左右へずらして、さざ波に見せる）
const PC = [[-4.4, 12.6, 0, 5.4], [-7.6, 11.4, .55, 6], [-9.2, 15.2, 0, 6.4], [-6, 16.6, .8, 5]]; PC.forEach(([x, z, br, h], i) => { const c = PK.column({ h, r: .5, c: STONE, broken: br, seed: i + 5, ivy: 0, base: 1.5 }); c.position.set(x, -.35, z); c.rotation.y = i; fixed.push(c); });
const RG = R.geo().normal([0, 1, 0]); for (const [x, z, br, h] of PC) { const L = Math.min(h * (br ? 1 - br * .7 : 1) * .62, 3.4), n = 6; for (let k = 0; k < n; k++) { const a = k / n, b = (k + 1) / n, o = (k % 2 ? .07 : -.07) * (1 + a), w = .56 - a * .1, dx = .3, dz = .95, X = t => x + dx * (.7 + t * L), Z = t => z + dz * (.7 + t * L);
  RG.quad([X(a) - w + o, WY + .03, Z(a)], [X(a) + w + o, WY + .03, Z(a)], [X(b) + w + o, WY + .03, Z(b)], [X(b) - w + o, WY + .03, Z(b)], [0, .15 + a * .8, .5, .15 + b * .8], 1 - a * .25); } }
const refl = RG.mesh(PT.ancient({ kind: 'flute', c: STONE, moss: .1 })); refl.material.transparent = true; refl.material.opacity = .5; refl.material.depthWrite = false; refl.material.color.set('#cfe2ee'); refl.castShadow = refl.receiveShadow = false; refl.renderOrder = 2; scene.add(refl);
// 木（神殿のうしろは こい緑の高い木で、光のすじの背景にする）と草花
for (let i = 0; i < 16; i++) { const a = -2.5 + i * .23, r = 30 + hash(i, 2) * 8; put(R.tree({ kind: i % 3 ? 'tall' : 'round', h: 13 + hash(i, 3) * 5, c: ['#468a4e', '#4f9650', '#3f8052'][i % 3], seed: i }), Math.sin(a) * r, -9 - Math.cos(a) * r * .9, i); }
for (let i = 0; i < 26; i++) { const a = hash(i, 1) * 6.283, r = 27 + hash(i, 4) * 26, x = Math.cos(a) * r + 4, z = Math.sin(a) * r + 2; if (z < -14 || dPath(x, z) < 4 || dPool(x, z) < 3) continue; put(R.tree({ kind: ['round', 'round', 'tall'][i % 3], h: 6 + hash(i, 3) * 4, c: ['#5aa850', '#66b058', '#4f9a4a'][i % 3], seed: i + 20 }), x, z, i); }
const FC = [['#ffffff', '#ffe27a'], ['#c8b8f0', '#ffffff'], ['#ffe27a', '#ffffff'], ['#f4c8d8', '#ffffff']];
for (let i = 0; i < 30; i++) { const u = i / 30 + hash(i, 4) * .02, p = path.getPointAt(u % 1), tg = path.getTangentAt(u % 1), s = i % 2 ? 1 : -1, o = 2.2 + hash(i, 5) * 1.8, x = p.x - tg.z * s * o, z = p.z + tg.x * s * o; if (onStep(x, z) || dPool(x, z) < .4) continue; put(PK.flowers({ n: 9, r: 1.3, seed: i, fc: FC[i % 4], s: .75 }), x, z); }
for (let i = 0; i < 80; i++) { const x = (hash(i, 6) - .5) * 70 + 3, z = (hash(i, 7) - .5) * 64 + 3; if (dPath(x, z) < 1.6 || dPool(x, z) < .3 || onStep(x, z) || dOut(x, z) < .2 && i % 4) continue; put(R.tuft({ kind: ['grass', 'bush', 'flower', 'grass', 'reed'][i % 5], s: .6 + hash(i, 8) * .7, seed: i % 3 }), x, z, i); }
for (let i = 0; i < 9; i++) { const a = i * .7 + .2, x = POOL[0] + Math.cos(a) * (POOL[2] + .5), z = POOL[1] + Math.sin(a) * (POOL[2] + .5) / 1.15; if (dPath(x, z) > 1.3) put(R.tuft({ kind: 'reed', s: 1 + hash(i, 3) * .4, seed: i % 3 }), x, z, i); }
scene.add(R.merge(fixed));

// ---- 空と遠景、光のすじ ----
scene.add(R.backdrop({ c: '#68a66c', haze: '#dcefe6', r: 240, y: -5, h: 36 }));
for (let i = 0; i < 7; i++) { const c = R.cloud({ s: 36 + hash(i, 9) * 30, c: '#ffffff', shade: '#d0e2f0', seed: i }), a = i * .9 + 2.6; c.position.set(Math.cos(a) * 220, 50 + hash(i, 10) * 36, Math.sin(a) * 220); c.lookAt(0, 24, 0); scene.add(c); }
const shafts = [[-4.5, -5, 3], [-4.2, -8.4, 2.4], [-3.6, -12.5, 2.6], [1.5, -15, 2.2]].map(([x, z, w], i) => { const s = PK.shaft({ w, h: 11, dx: 5.6, dz: 4.4, a: .3, c: '#fff0c4', seed: i }); s.position.set(x, TOP, z); scene.add(s); return s; });
const motes = PK.motes({ n: 60, area: [13, 6, 16], c: '#fff6cc' }); motes.position.set(0, TOP + .3, -8); scene.add(motes);

// ---- 学者（地図を持つ）・しか・鳥・ちょう ----
const hero = R.actor({ build: 'toon', sex: 'f', hairStyle: 'bun', bangs: 'part', hair: '#6e4a36', eyes: 'big', brow: 'soft', cloth: 'coat', top: '#3c5a9c', top2: '#f6eeda', bottom: '#e6d8b8', lower: 'pants', belt: '#8a5a34', shoes: 'boot', shoe: '#7a4a30', neck: 'collar', back: 'bag', acc: '#c8803c', strap: true }); scene.add(hero);
{ const P = R.Px(32, 24), pa = R.ramp('#ecd6a2'); P.rect(0, 0, 32, 24, pa[4]); for (let x = 0; x < 32; x++) { P.set(x, 0, pa[1]); P.set(x, 23, pa[1]); P.set(x, 1, pa[4]); } for (let y = 0; y < 24; y++) { P.set(0, y, pa[1]); P.set(31, y, pa[1]); P.set(16, y, y % 2 ? pa[2] : pa[3]); }   // 地図：折り目・山・池・点線の道・しるし
  P.bits(4, 4, ['..k...k..', '.khk.khk.', 'khhhkhhhk'], { k: '#7a5a3c', h: '#c8b07c' }); P.bits(20, 5, ['.bbb.', 'bwbbb', '.bbb.'], { b: '#5a9ac0', w: '#bfe0ee' }); for (let k = 0; k < 9; k++) P.set(5 + k * 2, 17 - Math.round(Math.sin(k * .7) * 3 + k * .6), '#b8483a'); P.bits(23, 10, ['r.r', '.r.', 'r.r'], { r: '#b8483a' }); P.bits(4, 19, ['kkkkk.kkk'], { k: '#9a7a54' }); P.bits(20, 18, ['.k.', 'kkk', '.k.', '.k.'], { k: '#7a5a3c' });
  const D = hero.userData.build, y0 = -D.farm - D.hand[2] * .6, m = R.geo().quad([-.29, y0, -.3], [.29, y0, -.3], [.29, y0, .13], [-.29, y0, .13]).mesh(T.from(P, { m: 1 }), { side: true }); m.position.x = -.1; hero.userData.J.foreL.add(m); }
const deer = PK.deer({ antlers: false, s: .9 }); deer.position.set(-12, Y(-12, 12.4), 12.4); deer.rotation.y = 1.5; scene.add(deer); const fawn = PK.deer({ antlers: false, spots: true, s: .6 }); fawn.position.set(-13.4, Y(-13.4, 15), 15); fawn.rotation.y = 2.2; scene.add(fawn);
const flock = PK.flock({ n: 6, r: 10, h: 3, speed: .28, squash: .5 }); flock.position.set(0, TOP + 12, -8); scene.add(flock);
const bfs = [[2.5, 16, 0], [-2, 9.5, 0], [0, -5, TOP], [3, -12, TOP], [17, -6, 1], [18, 12, 0]].map(([x, z, y], i) => { const b = PK.butterflies({ n: 5, area: [5, 1.4, 4], fc: FC[i % 4] }); b.position.set(x, y, z); scene.add(b); return b; });
// とまっている鳥（石段・柱の上・はり・たおれた柱）。学者が近づくと飛びたち、遠ざかるともどる
const birds = [[1.4, 2.1, 4.2], [-1.2, 2.7, 3], [1.9, 3.6, 1.2], [4.2, 7, 10], [-6, TOP + 7.7, -4], [6, TOP + 7.7, -2.4], [-2.4, TOP + 1.1, -13.2], [2, TOP, -6], [1.4, TOP, -7]].map(([x, y, z], i) => { const b = R.bird(i % 3 === 0 ? { c: '#f0ece4', neck: false } : i % 3 === 1 ? { c: '#7a9ac0', belly: '#f4ead8' } : {}); b.position.set(x, y, z); b.rotation.y = i * 2.1; b.userData.home = [x, y, z, i * 2.1]; b.userData.fly = -1; scene.add(b); return b; });

const SPEED = 1.9, S0 = 0, cd = new THREE.Vector3(), cp = new THREE.Vector3();
const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
let first = true, hy = 0, cy = 0;
K.loop((dt, t) => {
  const dist = t * SPEED, u = (S0 + dist / LEN) % 1, p = path.getPointAt(u), tg = path.getTangentAt(u), ty = Y(p.x, p.z);
  if (first) { hy = ty; cd.copy(tg); } hy += (ty - hy) * (1 - Math.exp(-dt * 14)); p.y = hy;
  hero.position.copy(p); hero.rotation.y = Math.atan2(tg.x, tg.z); R.walk(hero, dist * 3.6); const J = hero.userData.J; J.armL.rotation.set(-1.15 + Math.sin(dist * 3.6) * .04, 0, .3); J.foreL.rotation.set(-.45, 0, 0); J.head.rotation.y = .28 + Math.sin(t * .5) * .2;   // 左手に地図をかかげて、見ながら歩く
  cd.lerp(tg, 1 - Math.exp(-dt * 1.7)).normalize(); const tall = innerWidth < innerHeight, D = tall ? 4 : 4.8;
  cp.set(p.x - cd.x * D, 0, p.z - cd.z * D); const gy = Math.max(Y(cp.x, cp.z) + 1.5, p.y + (tall ? 2.1 : 2.5)); if (first) cy = gy; cy += (gy - cy) * (1 - Math.exp(-dt * 4)); cp.y = cy; first = false; cam.position.copy(cp); cam.lookAt(p.x + cd.x * 3.4, p.y + (tall ? 1.6 : 1.6), p.z + cd.z * 3.4);
  sun.position.set(p.x + SUN.x * 60, p.y + SUN.y * 60, p.z + SUN.z * 60); sun.target.position.copy(p);
  R.flip(water.mat, WF, t, 4); refl.material.opacity = .46 + Math.sin(t * 1.7) * .06; flock.userData.tick(t); motes.userData.tick(t); for (const b of bfs) b.userData.tick(t); for (const s of shafts) s.userData.tick(t);
  PK.beastPose(deer, Math.sin(t * .25 + 1) > -.6 ? 'graze' : 'stand', t); PK.beastPose(fawn, Math.sin(t * .3) > .2 ? 'stand' : 'graze', t);
  for (const b of birds) { const [hx, h0, hz, hr] = b.userData.home, dh = Math.hypot(p.x - hx, p.z - hz);
    if (b.userData.fly < 0) { R.birdPose(b, h0 > 6 ? 'stand' : 'peck', t + hr * 3); if (dh < (h0 > 6 ? 4.5 : 3.4)) b.userData.fly = 0; }
    else { const f = (b.userData.fly += dt); b.visible = f < 5; b.position.set(hx + Math.cos(hr) * f * 3.2, h0 + Math.min(8, f * 2.6 - f * f * .1), hz + Math.sin(hr) * f * 3.2); b.rotation.y = Math.atan2(Math.cos(hr), Math.sin(hr)); R.birdPose(b, 'fly', t + hr);
      if (f > 5 && dh > 15) { b.userData.fly = -1; b.visible = true; b.position.set(hx, h0, hz); b.rotation.y = hr; } } }

});
