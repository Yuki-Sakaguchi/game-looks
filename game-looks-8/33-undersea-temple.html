<title>8-33 海底神殿 描きこんだテクスチャとブラウン管</title>
<style>

<div id="cap">8-33 ─ 海底神殿 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で泳ぐ）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="pack-sea.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// テイスト B。面の少ない形（柱・階段・石像・魚・えい・ダイバー）に、その場で打ったドット絵をはり、横 320 ドットほどの粗い絵に描いて、ブラウン管に映す。
// 砂の海底にしずんだ神殿。色は 水の青緑・石のクリーム・さんごの赤。柱のならぶ参道に 上から光のすじがさし、小魚の群れが柱の間をぬける。
// ダイバーが参道をまっすぐ泳ぎ、階段をのぼって神殿をくぐり、外を回ってもどる。部品は retro.js（R.〜）と pack-sea.js（S.〜）。石像・階段・はり は このページで作る
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), S = PACK_SEA(THREE, K, R), { hash } = R;
const { scene, cam, renderer, onResize } = K.stage({ fov: 46, far: 900, aa: false, fitAspect: .9, maxFov: 76 });
const env = S.underwater(scene, renderer, { depth: 'mid', top: 16, rays: 16, range: 30, hi: '#c8f8e4', mid: '#3cb8b0', low: '#1c7c8c', fog: '#30a8a4', near: 9, far: 88, sky: 0xe4fff0, ground: 0xc0c8a4, amb: 1.4, sun: 0xfff4d8, power: 1.45, ray: '#f4ffd8', rayA: .55, surf: '#8ae4d4' }), sun = env.sun;

// ---- 泳ぐ道：参道（x=0 を +z へ）→ 階段 → 神殿の中 → 外を回ってもどる ----
const path = new THREE.CatmullRomCurve3([[0, -8], [0, 8], [0, 26], [0, 44], [0, 58], [2, 68], [10, 78], [22, 76], [27, 62], [26, 40], [24, 16], [16, -6], [6, -14]].map(([x, z]) => new THREE.Vector3(x, 0, z)), true, 'centripetal'), LEN = path.getLength();
const STEP = .4, PZ = 50, PY = STEP * 6, PW = 8.5, PD = 22;   // 階段 6 段（1 段のおくゆき .7）と、神殿の台（x ±8.5、z 50〜72、高さ 2.4）
const plat = (x, z) => Math.abs(x) < PW && z > PZ - 4.2 && z < PZ + PD ? (z >= PZ ? PY : Math.abs(x) < 5.2 ? Math.max(0, Math.ceil((z - (PZ - 4.2)) / .7)) * STEP : 0) : 0;
const flat = (x, z) => Math.min(1, Math.max(0, (Math.max(Math.abs(x) - 9, -12 - z, z - 76)) / 8));   // 参道と神殿のまわりは平ら、外は砂の起伏
const H = (x, z) => flat(x, z) * (.5 + .7 * Math.sin(x * .16 + 1) * Math.cos(z * .13) + .3 * Math.sin(x * .4 + z * .33)) + .05 * Math.sin(x * .9) * Math.cos(z * .8);
const bed = S.seabed({ env, w: 124, d: 124, cell: 2, H, caustic: .4, layers: [S.tex.sand({ c: '#eadfbe' }), S.tex.grown({ base: 'rock', o: { c: '#a8a48c' }, grow: .8, seed: 1 })], mix: (x, z) => [flat(x, z) > .5 && Math.sin(x * .17 + 3) * Math.cos(z * .15) > .5 ? 1 : 0, 0] }); scene.add(bed.mesh);

// ---- 石の物：敷石・階段・台・柱・はり・石像 ----
const CREAM = '#f2e8c8', stoneT = S.tex.grown({ base: 'stone', o: { c: CREAM }, grow: .45, from: 'bottom', seed: 1 }), slabT = S.tex.grown({ base: 'cobble', o: { kind: 'slab', c: '#d8cfb4' }, grow: .5, seed: 2 }), topT = S.tex.grown({ base: 'stone', o: { c: CREAM }, grow: .3, from: 'top', seed: 2 });
const fixed = [], put = (o, x, z, ry = 0, dy = 0) => { o.position.set(x, H(x, z) + plat(x, z) + dy, z); o.rotation.y = ry; fixed.push(o); return o; };
fixed.push(R.strip([[0, 0, -14], [0, 0, 0], [0, 0, 20], [0, 0, 45.8]], 6, slabT, { lift: .05, ur: 2 }));
{ const G = R.geo(), Gs = R.geo();   // 階段と台。段の上は敷石、横は石づみ
  for (let k = 0; k < 6; k++) { G.box(10.4, STEP, .72, 0, k * STEP, PZ - 4.2 + k * .7 + .36, { m: 3, top: false, c0: .78 }); Gs.quad([-5.2, (k + 1) * STEP, PZ - 4.2 + k * .7], [5.2, (k + 1) * STEP, PZ - 4.2 + k * .7], [5.2, (k + 1) * STEP, PZ - 3.5 + k * .7], [-5.2, (k + 1) * STEP, PZ - 3.5 + k * .7], [0, 0, 3.5, .24]); }
  for (const sx of [1, -1]) G.box(1.5, PY + .5, 4.4, sx * 6, 0, PZ - 2.1, { m: 3, c0: .8 });   // 階段の両わきの そで石
  G.box(PW * 2, PY, PD, 0, 0, PZ + PD / 2, { m: 3, top: false, c0: .72 }); Gs.quad([-PW, PY, PZ], [PW, PY, PZ], [PW, PY, PZ + PD], [-PW, PY, PZ + PD], [0, 0, PW * 2 / 3, PD / 3]);
  fixed.push(G.mesh(stoneT), Gs.mesh(slabT)); }
// 石像（長い衣の人が つぼをかかえた形）。台＋像。こけ・ふじつぼは grown のテクスチャ、さんごは上にのせる
function statue(o = {}) { const g = new THREE.Group(), G = R.geo(), h = o.h || 1.3; G.box(1.7, .3, 1.7, 0, 0, 0, { m: 3 }).box(1.4, h - .55, 1.4, 0, .3, 0, { m: 3, c0: .8 }).box(1.7, .25, 1.7, 0, h - .25, 0, { m: 3 }); g.add(G.mesh(stoneT));
  if (!o.empty) { const F = R.geo().smooth(1), y = h; F.loft(8, [[y, .52, .46, 0, .75], [y + .25, .44, .4, .1, .9], [y + 1.25, .3, .26, .5, 1], [y + 1.62, .4, .27, .65, 1.05], [y + 1.78, .15, .15, .72, .9], [y + 1.86, .2, .2, .76, 1], [y + 2.06, .25, .25, .85, 1.08], [y + 2.26, .21, .21, .94, 1.1], [y + 2.38, .08, .08, 1, 1.15]], { cap: 'top', ur: 2 });
    F.loft(6, [[y + 1.05, .1, .1, .5, .8, 0, .34], [y + 1.2, .2, .2, .6, 1, 0, .34], [y + 1.42, .22, .22, .7, 1.05, 0, .34], [y + 1.52, .12, .12, .76, 1, 0, .34], [y + 1.58, .16, .16, .8, 1.1, 0, .34]], { cap: 'top' });   // かかえた つぼ
    for (const sx of [1, -1]) F.loft(5, [[y + 1.3, .08, .08, .5, .9, sx * .2, .32], [y + 1.6, .11, .11, .65, 1, sx * .42, .05]], { cap: 'both' });   // うで
    g.add(F.mesh(topT)); }
  return g; }
// 参道：柱 8 組（ところどころ折れている）と、その間の石像の台
const AV = [];
for (let k = 0; k < 8; k++) for (const sx of [1, -1]) { const z = 1 + k * 5.6, i = k * 2 + (sx > 0 ? 0 : 1), br = [3, 8, 13].includes(i); AV.push([sx * 4.3, z]);
  put(S.pillar({ h: br ? 2.2 + hash(i, 1) * 1.6 : 6.4, r: .46, c: CREAM, grow: .32, broken: br, seed: i }), sx * 4.3, z, i);
  if (br) { const f = put(S.pillar({ h: 3.2, r: .44, c: CREAM, grow: .7, base: false, seed: i + 1 }), sx * 7.4, z + 1.5, hash(i, 2) * 3, .42); f.rotation.x = 1.5708; }
  put(S.coral({ kind: ['branch', 'finger', 'fan', 'brain'][i % 4], s: .8 + hash(i, 30) * .5, c: ['#e8503a', '#f0604a', '#e8443a'][i % 3], seed: i }), sx * (3.5 + hash(i, 31) * .5), z + 2.2 + hash(i, 32) * 1.6, i, .02);
  if (k % 2 === 0) { const st = put(statue({ empty: i === 4 }), sx * 6.3, z + 2.8, -sx * 1.5708); const [x, zz] = [sx * 6.3, z + 2.8];
    put(S.coral({ kind: ['finger', 'brain', 'branch'][k / 2 % 3 | 0], s: .7, c: ['#e8503a', '#f0705a', '#e86a4a'][i % 3], seed: i }), x + .5, zz + (i === 4 ? 0 : .52), i, 1.3);
    put(S.coral({ kind: 'fan', s: .9, c: '#e8503a', seed: i }), x - sx * .1, zz - .95, 1.57); put(S.anemone({ s: 1.1, c: '#f4a070', body: '#c8483a' }), x + sx * .8, zz + .95); } }
// 神殿：台の上に 柱 2 列と正面の 4 本、はり、正面の三角。おくに大きな石像
const TP = []; for (let k = 0; k < 5; k++) for (const sx of [1, -1]) TP.push([sx * 6.4, PZ + 2.4 + k * 4.4]); for (const x of [-2.6, 2.6]) TP.push([x, PZ + 2.4]);
TP.forEach(([x, z], i) => { const br = i === 5 || i === 8; put(S.pillar({ h: br ? 3.4 : 7, r: .56, c: CREAM, grow: .35, broken: br, seed: i + 20 }), x, z, i); });
{ const G = R.geo(), y = PY + 7, P = R.geo();
  G.box(1.3, .9, 10.4, -6.4, y, PZ + 6.9, { m: 3, bottom: true, c0: .7 }); G.box(1.3, .9, 19.4, 6.4, y, PZ + 11.2, { m: 3, bottom: true, c0: .7 }); G.box(14.1, .9, 1.3, 0, y, PZ + 2.4, { m: 3, bottom: true, c0: .7 }); G.box(14.6, .22, 1.7, 0, y + .9, PZ + 2.4, { m: 3 });
  for (const dz of [-.6, .6]) P.tri([-7.2, y + 1.12, PZ + 2.4 + dz], [7.2, y + 1.12, PZ + 2.4 + dz], [0, y + 3.5, PZ + 2.4 + dz], [0, 0], [4.8, 0], [2.4, .8], [.8, .8, 1.05]); for (const sx of [1, -1]) P.quad([sx * 7.2, y + 1.12, PZ + 1.8], [sx * 7.2, y + 1.12, PZ + 3], [0, y + 3.5, PZ + 3], [0, y + 3.5, PZ + 1.8], [0, 0, 2.4, .4], sx > 0 ? 1.1 : .9);
  fixed.push(G.mesh(stoneT), P.mesh(R.mat(topT, { vc: true, side: true }))); }
const big = statue({ h: 1.1 }); big.scale.setScalar(1.7); put(big, 0, PZ + 16.5, Math.PI);
put(S.coral({ kind: 'table', s: 1.2, c: '#e8503a' }), -2.2, PZ + 16.6, 0); put(S.coral({ kind: 'branch', s: 1.1, c: '#f0705a' }), 2.1, PZ + 16.2, 1); put(S.coral({ kind: 'brain', s: .8, c: '#e86a4a' }), -6.9, PZ + 12, 0); put(S.reef({ s: .9, seed: 4, n: 4, colors: ['#e8503a', '#f0705a', '#f4b890'] }), 5.6, PZ + 19.6, 2);
// まわり：たおれた柱・石のかけら・岩・赤いさんご・海草・昆布
for (let i = 0; i < 16; i++) { const u = .52 + i / 16 * .46, p = path.getPointAt(u), tg = path.getTangentAt(u), sd = i % 2 ? 1 : -1, off = 4 + hash(i, 3) * 5, x = p.x + tg.z * sd * off, z = p.z - tg.x * sd * off; if (Math.abs(x) < 9.5 && z < 74) continue;
  if (i % 4 === 0) put(S.pillar({ h: 2 + hash(i, 4) * 2, r: .46, c: CREAM, grow: .7, broken: true, seed: i }), x, z, i); else if (i % 4 === 1) { const f = put(S.pillar({ h: 3.5, r: .44, c: CREAM, grow: .8, base: false, seed: i }), x, z, i * 1.3, .4); f.rotation.x = 1.5708; } else put(S.rock({ s: 1.2 + hash(i, 5) * 1.2, seed: i, c: '#b0a890', grow: .7 }), x, z, i, -.2);
  put(S.reef({ s: .9 + hash(i, 6) * .5, seed: i, n: 4, colors: ['#e8503a', '#f0705a', '#f4b890', '#e86a4a'] }), x + 1.8, z + 1.2, i); }
for (let i = 0; i < 90; i++) { const far = i < 30, x = far ? (hash(i, 7) - .5) * 70 : (i % 2 ? 1 : -1) * (5.2 + hash(i, 7) * 9), z = far ? -14 + hash(i, 8) * 96 : -10 + hash(i, 8) * 58, k = i % 9; if (Math.abs(x) < 3.4 || plat(x, z) > 0 || (Math.abs(x) < 9 && z > 44 && z < 73)) continue;
  put(k < 4 ? S.seagrass({ s: .6 + hash(i, 9) * .5, c: i % 3 ? '#4fa88a' : '#7ab86a', seed: i }) : k < 5 ? S.starfish({ c: '#e8503a', s: 1.2 }) : k < 6 ? S.shell({ c: '#f4e0c8', s: 1.2 }) : k < 7 && far ? S.kelp({ h: 5 + hash(i, 10) * 4, c: '#5a9a6a', seed: i }) : S.coral({ kind: ['finger', 'brain', 'branch', 'fan'][i % 4], s: .5 + hash(i, 11) * .5, c: ['#e8503a', '#f0705a', '#f4a080'][i % 3], seed: i }), x, z, i * 1.7, .01); }
scene.add(R.merge(fixed));

// ---- 生きもの：柱の間をぬける小魚の群れ・参道の上を通る えい・魚・うみがめ・かに ----
const live = [], add = (o, f) => { scene.add(o); live.push(t => { f && f(o, t); o.userData.tick(t); }); return o; };
const circ = (cx, cy, cz, rx, rz, sp, ph = 0, bob = .3) => (o, t) => { const a = t * sp + ph; o.position.set(cx + Math.cos(a) * rx, cy + Math.sin(t * .6 + ph) * bob, cz + Math.sin(a) * rz); o.rotation.y = Math.atan2(-Math.sin(a) * rx * sp, Math.cos(a) * rz * sp); };
add(S.school({ n: 64, rx: 4.3, rz: 6, h: 1.6, wide: 1.2, speed: 1.4, spread: 1.5, tints: ['#ffffff', '#fff0c0', '#ffd8c8'] })).position.set(0, 3.8, 38);   // 柱 2 本をくるむ だ円＝柱の間をぬう
add(S.school({ n: 44, rx: 4.3, rz: 5.6, h: 1.4, speed: -1.3, spread: 1.4, seed: 3 })).position.set(0, 5.4, 33.5);
add(S.school({ n: 30, kind: 'butter', c2: '#e8503a', rx: 6.4, rz: 5, h: 1.6, speed: 1, s: .8, spread: 2, seed: 5 })).position.set(0, PY + 4, PZ + 10);
add(S.school({ n: 26, kind: 'tang', rx: 5, rz: 4, h: 1.2, speed: -1.1, s: .75, spread: 2, seed: 7 })).position.set(24, 3.5, 40);
add(S.ray({ s: 1.7 }), circ(0, 6.2, 16, 7.5, 17, .2, 5.1, .5)); add(S.ray({ s: 1.2, c: '#6a7aa0' }), circ(4, 8, 54, 16, 12, -.14, 1, .5));
add(S.turtle({ s: 1.3 }), circ(-3, 5, 38, 9, 7, .17, 2.4, .4));
add(S.fish({ kind: 'angel', seed: 1 }), circ(-6.9, 3.2, 3.8, 1.5, 1.2, .6, 0, .2)); add(S.fish({ kind: 'parrot', seed: 2, c: '#e8684a', c2: '#f4d8a0' }), circ(6.9, 3, 15, 1.8, 1.4, -.5, 1, .2)); add(S.fish({ kind: 'grouper', s: .8 }), circ(0, PY + 2.2, PZ + 15, 3.4, 2.2, .3, 2, .2)); add(S.fish({ kind: 'clown', seed: 4 }), circ(-6.1, 1.9, 27.2, .7, .6, 1.3, 0, .1));
for (let i = 0; i < 2; i++) { const c = S.crab({ s: 1.6, c: '#e8553a' }), z0 = 12 + i * 20, x0 = i ? -2.4 : 2.3; add(c, (o, t) => { const s = Math.sin(t * .5 + i * 2) * 1.2; o.position.set(x0, .06, z0 + s); o.rotation.y = 1.57; }); }

// ---- 主役：泳ぐダイバー（もも色の服に白。黒い おかっぱ） ----
const hero = S.diver({ head: 'snorkel', tank: '#f4f0e0', fin: '#ffd84a', actor: { sex: 'f', hairStyle: 'bob', hair: '#2a2438', top: '#f0508a', top2: '#f4f0e0', bottom: '#d83a78', glove: '#f4f0e0', shoe: '#a02a5c', belt: '#f4f0e0' } }); scene.add(hero);
const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
const cd = new THREE.Vector3(), SPEED = 1.5, U0 = 22 / LEN; let dist = U0 * LEN, first = true, hy = 2;
K.loop((dt, t) => {
  dist += SPEED * dt; const u = (dist / LEN) % 1, p = path.getPointAt(u), tg = path.getTangentAt(u), q = path.getPointAt((u + 2.2 / LEN) % 1), gy = Math.max(H(p.x, p.z) + plat(p.x, p.z), plat(q.x, q.z)) + 1.8 + Math.sin(t * .5) * .2; hy += (gy - hy) * Math.min(1, dt * 1.6);
  hero.position.set(p.x, hy, p.z); hero.rotation.y = Math.atan2(tg.x, tg.z); S.swim(hero, t); S.breathe(hero, env.bubbles, dt);
  if (first) { cd.copy(tg); first = false; } cd.lerp(tg, 1 - Math.exp(-dt * 1.3)).normalize(); const tall = innerWidth < innerHeight, D = tall ? 3 : 3.4, Sd = tall ? .8 : 1.5;
  cam.position.set(p.x - cd.x * D + cd.z * Sd, hy + (tall ? 1.3 : .95), p.z - cd.z * D - cd.x * Sd); cam.lookAt(p.x + cd.x * 2.4, hy + (tall ? .6 : .55), p.z + cd.z * 2.4);
  sun.position.set(p.x - 8, 44, p.z + 6); sun.target.position.set(p.x, 0, p.z);
  for (const f of live) f(t); bed.follow(p.x, p.z); bed.tick(t); env.tick(t, cam, dt); crt.render(scene, cam, t);
});
</script>
