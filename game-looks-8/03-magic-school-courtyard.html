<title>8-03 魔法学校の中庭 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#f4ecf8;opacity:.9;text-shadow:0 1px 0 #000}

<div id="cap">8-03 ─ 魔法学校の中庭 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="pack-fantasy-town.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 昼のやわらかい光の、魔法学校の中庭。アーチの回廊が四方をかこみ、角に とんがり屋根の塔、奥に時計塔。色ガラスの窓が光り、光の玉がふわふわ うかぶ。
// 色の組は「石の灰むらさき・屋根の青緑・しばふの緑」＋差し色のローブのえんじと、光の玉の黄。面の少ない形にドット絵のテクスチャをはり、粗い絵に描いてブラウン管に映す。
// 主役は とんがり帽子の新入生（R.actor の toon）。噴水をまわって中庭をひとめぐりし、うしろからカメラが追う。アーチ・塔・時計塔・色ガラスは pack-fantasy-town.js（F.〜）
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), F = PACK_FTOWN(THREE, K, R), T = R.tex, { hash } = K;
const { scene, cam, renderer, onResize } = K.stage({ fov: 48, far: 700, aa: false, fitAspect: .9, maxFov: 78 });
scene.add(R.skyDome([[0, '#5a8ad0'], [.5, '#8ab8e4'], [.82, '#cfe0ee'], [1, '#f6ecdc']], { r: 340 })); scene.fog = new THREE.Fog('#e4e0ec', 50, 240);
const { sun } = K.lights(scene, renderer, { sky: 0xd8d4ff, ground: 0xb8a8b8, amb: 1.7, sun: 0xfff0dc, power: 2.2, range: 30 }), SUN = new THREE.Vector3(.45, .7, .55).normalize();

// ---- 地面：十字の敷石と、噴水のまわりの輪、回廊ぞいの道。あいだは しばふ ----
const S = 15, paved = (x, z) => Math.abs(x) < 1.9 || Math.abs(z) < 1.9 || Math.hypot(x, z) < 4.6 || Math.max(Math.abs(x), Math.abs(z)) > 9.6;
const land = R.ground({ w: 60, d: 60, cell: 1.5, layers: [T.grass({ c: '#5aa456', flowers: .35, fc: ['#ffffff', '#f4d8f0'] }), T.cobble({ kind: 'slab', c: '#b0a8bc' }), F.tex.tile({ c: '#8a84a4', c2: '#c8c0d0', kind: 'star' })],
  mix: (x, z) => [paved(x, z) ? 1 : 0, Math.abs(Math.hypot(x, z) - 3.9) < .7 ? 1 : 0] }); scene.add(land.mesh);

// ---- 回廊：アーチのならび＋さしかけ屋根＋色ガラスの窓のある かべ＋上の屋根。同じ 1 辺を 4 方に回して置く ----
const STONE = F.tex.ashlar({ c: '#a8a0b6' }), STONE2 = F.tex.ashlar({ c: '#b8b0c4' }), ROOF = F.tex.slate({ c: '#2f8c88', c2: '#3f9c8c' }), fixed = [], N = 9, SP = S * 2 / N, TH = .62, AW = SP - TH, AH = 3.3, WZ = -S - 3.3, L = S + 3.3;
const GL = [0, 1, 2].map(k => F.tex.glass({ lit: 1, cs: [['#b83a50', '#e8b83a', '#3a78c8', '#3aa890'], ['#3aa890', '#8a58b8', '#e8b83a', '#b83a50'], ['#3a78c8', '#b83a50', '#3aa890', '#e8b83a']][k], seed: k }));
const wing = k => { const g = new THREE.Group(), B = R.parts(), m = STONE.userData.m, mr = ROOF.userData.m, W = B.g(STONE2), Rf = B.g(ROOF, { side: true }), Fl = B.g(T.cobble({ kind: 'slab', c: '#9a92a8' }));
  for (let i = 0; i < N; i++) { const a = F.arch({ w: AW, h: AH, d: .8, th: TH, stone: STONE, kind: 'point' }); a.position.set(-S + SP * (i + .5), 0, -S); g.add(a); }
  W.quad([-L, 0, WZ], [L, 0, WZ], [L, 8.4, WZ], [-L, 8.4, WZ], [0, 0, 2 * L / m, 8.4 / m], .9);
  W.quad([-L, 8.4, WZ + .25], [L, 8.4, WZ + .25], [L, 8.75, WZ + .25], [-L, 8.75, WZ + .25], [0, 0, 2 * L / m, .12], 1.1).quad([-L, 8.4, WZ], [L, 8.4, WZ], [L, 8.4, WZ + .25], [-L, 8.4, WZ + .25], [0, 0, 2 * L / m, .1], .6);
  Fl.quad([-L, .16, -S + .5], [L, .16, -S + .5], [L, .16, WZ], [-L, .16, WZ], [0, 0, 2 * L / 3, 1.2]).quad([-L, 0, -S + .5], [L, 0, -S + .5], [L, .16, -S + .5], [-L, .16, -S + .5], [0, 0, 2 * L / 3, .06], .7);
  Rf.quad([-L, AH + .55, -S + .75], [L, AH + .55, -S + .75], [L, AH + 1.9, WZ], [-L, AH + 1.9, WZ], [0, 0, 2 * L / mr, 4 / mr]).quad([-L, 8.7, WZ + .6], [L, 8.7, WZ + .6], [L, 11.4, WZ - 3.4], [-L, 11.4, WZ - 3.4], [0, 0, 2 * L / mr, 5 / mr]);
  const Dr = B.g(T.door({ arch: 1, c: '#5a3a4a' }), { offset: true }); for (const i of [1, 7]) { const x = -S + SP * (i + .5); Dr.quad([x - .6, .16, WZ + .05], [x + .6, .16, WZ + .05], [x + .6, 2.5, WZ + .05], [x - .6, 2.5, WZ + .05]); }
  for (let i = 0; i < N; i++) { const x = -S + SP * (i + .5); B.g(GL[(i + k) % 3], { offset: true, glow: true }).quad([x - .62, 5.9, WZ + .06], [x + .62, 5.9, WZ + .06], [x + .62, 7.9, WZ + .06], [x - .62, 7.9, WZ + .06]); }
  g.add(B.group()); g.rotation.y = k * Math.PI / 2; return g; };
for (let k = 0; k < 4; k++) fixed.push(wing(k));
const put = (o, x, z, ry = 0, y = 0) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) put(F.tower({ r: 2.7, h: sz < 0 ? 14 : 11, stone: STONE, roof: ROOF, roofH: 7, lit: .5, flag: sx * sz > 0 ? { c: '#8a2a3c', crest: 'star', cc: '#e8c058' } : { c: '#2f8c88', crest: 'moon', cc: '#f4ecd0' } }), sx * (L + .4), sz * (L + .4), sx < 0 ? .4 : -.4);
put(F.clockTower({ w: 5, h: 21, stone: STONE, roof: ROOF, lit: true, time: 1.2, flag: { c: '#8a2a3c', crest: 'star', cc: '#e8c058' } }), 0, WZ - .6);
put(F.tower({ r: 2, h: 19, stone: STONE, roof: ROOF, roofH: 7, lit: .6 }), -9.5, WZ - 5); put(F.tower({ r: 2.3, h: 17, stone: STONE, roof: ROOF, roofH: 8, lit: .6 }), 10.5, WZ - 4.5); put(F.tower({ r: 1.8, h: 16, stone: STONE, roof: ROOF, roofH: 6 }), -L - 4, 3); put(F.tower({ r: 1.8, h: 15, stone: STONE, roof: ROOF, roofH: 6 }), L + 4, -4);
{ const G = R.geo(); G.quad([-1.3, 9.4, WZ + 2.05], [1.3, 9.4, WZ + 2.05], [1.3, 12, WZ + 2.05], [-1.3, 12, WZ + 2.05]); fixed.push(G.mesh(F.tex.glass({ kind: 'rose', lit: 1, cs: ['#b83a50', '#e8b83a', '#3aa890', '#3a78c8'] }), { offset: true, glow: true })); }   // 時計塔のばら窓
put(F.stairs({ w: 4.4, h: .5, d: 1.2, n: 3, tex: STONE2 }), 0, -S + 1.3);
for (const [x, z] of [[-9.4, -9.4], [9.4, -9.4], [-9.4, 9.4], [9.4, 9.4]]) put(F.flag({ kind: 'banner', c: '#8a2a3c', c2: '#e8c058', crest: x * z > 0 ? 'star' : 'moon', pole: 3.8 }), x, z, x < 0 ? .6 : Math.PI - .6);

// ---- 噴水・大きな木・ベンチ・あかり・花のしげみ ----
const fountain = R.fountain({ r: 2.1 }); scene.add(fountain);
put(R.tree({ h: 10, c: '#4a9a58', seed: 3 }), 6.2, -6, 1); put(R.tree({ h: 6.5, c: '#5aa860', flowers: .5, fc: ['#f4c8e0', '#ffffff'], seed: 5 }), -6.4, 6.2, 2); put(R.tree({ kind: 'tall', h: 7, c: '#3f8a62', seed: 7 }), 6.6, 6.4);
put(R.bench(), 5.4, -2.6, Math.PI); put(R.bench(), -2.6, -6, Math.PI / 2); put(R.bench(), 6, 2.6, 0); put(R.bench(), -6, 2.6, 0);
for (const [x, z] of [[2.3, 2.3], [-2.3, 2.3], [2.3, -2.3], [-2.3, -2.3], [9.2, 0], [-9.2, 0]]) put(R.lamp({ h: 2.6 }), x * (Math.abs(x) < 3 ? 2.2 : 1), z * 2.2);
for (let i = 0; i < 34; i++) { const x = (hash(i, 1) - .5) * 18, z = (hash(i, 2) - .5) * 18; if (paved(x, z) || Math.hypot(x - 6.2, z + 6) < 1.3) continue; put(i % 4 === 0 ? R.tree({ kind: 'bush', h: .9 + hash(i, 4) * .4, flowers: .7, fc: ['#f4b8d8', '#ffffff', '#f6dc5a'], seed: i }) : R.tuft({ kind: i % 2 ? 'flower' : 'grass', s: .6 + hash(i, 3) * .4, seed: i % 3 }), x, z, i); }
put(R.crate({ s: .6 }), -11.6, -12.4, .3); put(R.barrel({ h: .8, r: .3 }), 12, 12.2);
scene.add(R.merge(fixed));
for (let i = 0; i < 7; i++) { const c = R.cloud({ s: 34 + hash(i, 8) * 26, c: '#ffffff', shade: '#c4c0e0', seed: i }), a = i * .9 + .4; c.position.set(Math.cos(a) * 210, 60 + hash(i, 9) * 40, Math.sin(a) * 210); c.lookAt(0, 30, 0); scene.add(c); }

// ---- うかぶ光の玉（ドット絵の板を、いつもカメラへ向ける）と、本 ----
const orbT = c => { const P = R.Px(16), M = R.ramp(c); P.disc(7.5, 7.5, 7, M[3]); P.disc(7.5, 7.5, 5.4, M[4]); P.disc(7.5, 7.5, 3.6, M[5]); P.disc(7, 7, 1.8, '#ffffff'); P.set(3, 3, '#ffffff'); P.set(12, 4, M[5]); P.set(4, 12, M[4]); return T.from(P, { m: 1, cut: true }); };
const orbs = [...Array(12)].map((_, i) => { const s = i ? .34 + hash(i, 5) * .2 : .3, o = new THREE.Mesh(new THREE.PlaneGeometry(s, s), R.mat(orbT(['#ffe070', '#a8f0e0', '#ffd0f0'][i % 3]), { glow: true, cut: true, fog: false })); o.userData.p = [(hash(i, 1) - .5) * 20, 2.2 + hash(i, 2) * 3.4, (hash(i, 3) - .5) * 20, i * 1.7]; scene.add(o); return o; });
const glow = new THREE.PointLight('#ffe890', 5, 6, 1.6); scene.add(glow);
const bookT = c => { const P = R.Px(16), M = R.ramp(c); P.rect(0, 0, 16, 16, M[2]); P.rect(1, 1, 14, 14, M[3]); P.rect(0, 0, 3, 16, M[1]); P.rect(5, 4, 8, 1, '#e8c058'); P.rect(5, 6, 8, 1, '#e8c058'); P.rect(7, 10, 4, 3, '#e8c058'); P.rect(13, 0, 3, 16, '#f0e8d4'); P.rect(15, 0, 1, 16, '#c8bca4'); return T.from(P, { m: 1 }); };
const book = (p, c, n = 1) => { const D = p.userData.build, G = R.geo(); for (let i = 0; i < n; i++) G.box(.26, .07, .2, (i % 2) * .02, D.torso * .3 + i * .075, D.chest + .14, { m: .26 }); p.userData.J.torso.add(G.mesh(bookT(c))); return p; };

// ---- 人・ねこ・鳥（人は 5 頭身の toon。どれもこの場面のためのオリジナル） ----
const act = (o, x, z, ry) => { const p = R.actor({ build: 'toon', ...o }); p.position.set(x, 0, z); p.rotation.y = ry; scene.add(p); return p; };
const ROBE = { cloth: 'robe', top: '#8a2a3c', top2: '#e8c058', skirt: .8, shoe: '#4a3430' };
const hero = act({ ...ROBE, s: .9, hairStyle: 'bob', hair: '#d8a04a', eye: '#3a8a7a', mouth: 'smile', blush: true, hat: 'wizard', acc: '#34407a', neck: 'scarf', back: 'bag' }, 0, 0, 0);
const s1 = book(act({ ...ROBE, sex: 'f', hairStyle: 'twin', hair: '#3a2a3a', mouth: 'smile', neck: 'collar' }, 0, 0, 0), '#3a6a8a', 2), s2 = book(act({ ...ROBE, hairStyle: 'spiky', hair: '#b8482a', mouth: 'open', skin: '#d8a070', neck: 'scarf', acc: '#2f8c88' }, 0, 0, 0), '#4a8a4a');
const s3 = book(act({ ...ROBE, sex: 'f', hairStyle: 'long', hair: '#e8e0f0', eyes: 'half', mouth: 'small' }, 5.4, -2.1, Math.PI + .3), '#7a4a9a', 3), s4 = act({ ...ROBE, hairStyle: 'short', hair: '#2a3a5a', eyes: 'round', mouth: 'open', s: .92 }, 6.2, -2.2, Math.PI - .5);
const prof = act({ hairStyle: 'long', hair: '#e8e8e8', beard: 'beard', brow: 'thick', eyes: 'closed', cloth: 'robe', top: '#3a3468', top2: '#e8c058', skirt: .9, hat: 'wizard', acc: '#3a3468', neck: 'cape', shoe: '#3a3040', hold: 'staff', bulk: 1.08 }, 1.4, -11.6, .4);
const cat = R.cat({ c: '#2a2a34', belly: '#3a3a44', plain: 1 }); cat.position.set(-2.6, .52, -6); cat.rotation.y = 1.2; scene.add(cat);
const birds = [0, 1, 2, 3].map(i => { const b = R.bird({ c: i % 2 ? '#f4f0e8' : '#8a8aa8', belly: '#ffffff', neck: false, s: 1.3 }); scene.add(b); return b; });

// ---- 主役の道（まん中の道から噴水をまわり、時計塔の前を通って回廊ぞいにもどる） ----
const path = new THREE.CatmullRomCurve3([[-1, 9.4], [-1, 5.4], [-3.4, 3], [-4.6, 0], [-3.4, -3.2], [-1, -5.2], [-.6, -8.6], [-2.6, -10.8], [-7, -11.3], [-10.6, -9.8], [-11.3, -5], [-11.3, 2], [-10.6, 8], [-8, 10.9], [-4, 11.2]].map(([x, z]) => new THREE.Vector3(x, 0, z)), true, 'centripetal');
const LEN = path.getLength(), SPEED = 2.1, cd = new THREE.Vector3(), cp = new THREE.Vector3(), fx = K.fx(scene, 40), on = (u, o, side = 0) => { u = ((u % 1) + 1) % 1; const p = path.getPointAt(u), tg = path.getTangentAt(u); o.position.set(p.x + tg.z * side, 0, p.z - tg.x * side); o.rotation.y = Math.atan2(tg.x, tg.z); };
const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
let first = true, sp = 0;
K.loop((dt, t) => {
  const dist = t * SPEED, u = (dist / LEN) % 1, p = path.getPointAt(u), tg = path.getTangentAt(u);
  hero.position.copy(p); hero.rotation.y = Math.atan2(tg.x, tg.z); R.walk(hero, dist * 3.8, .9);
  if (first) { cd.copy(tg); first = false; } cd.lerp(tg, 1 - Math.exp(-dt * 1.7)).normalize(); const tall = innerWidth < innerHeight, D = tall ? 3.8 : 4.9;
  cp.set(p.x - cd.x * D, tall ? 2 : 2.15, p.z - cd.z * D); cam.position.copy(cp); cam.lookAt(p.x + cd.x * 5, tall ? 2.1 : 1.8, p.z + cd.z * 5);   // 少し見上げて、塔と時計を入れる
  sun.position.set(p.x + SUN.x * 60, SUN.y * 60, p.z + SUN.z * 60); sun.target.position.copy(p);
  // 本をかかえた生徒 2 人は、道を反対向きに歩く。ほかの人は立ち話
  on(.52 - t * 1.4 / LEN, s1, -1.2); s1.rotation.y += Math.PI; R.walk(s1, t * 5.4, .8); F.carryPose(s1); on(.9 - t * 1.25 / LEN, s2, -1.3); s2.rotation.y += Math.PI; R.walk(s2, t * 5.2, .8); F.carryPose(s2);
  R.idle(s3, t, .3 + Math.sin(t * .5) * .2); F.carryPose(s3); R.idle(s4, t + 1, -.3 + Math.sin(t * .6) * .3); R.idle(prof, t + 2, Math.sin(t * .35) * .4); R.catPose(cat, 'sit', t);
  birds.forEach((b, i) => { const a = t * (.3 + i * .05) + i * 1.6, r = 9 + i * 3; b.position.set(Math.cos(a) * r, 12 + i * 1.5 + Math.sin(t * .7 + i) * 1.1, -8 + Math.sin(a) * r); b.rotation.y = Math.atan2(-Math.sin(a), Math.cos(a)); R.birdPose(b, 'fly', t * .5 + i); });
  // 光の玉：1 つは主役についてくる。ほかは中庭をただよう
  orbs.forEach((o, i) => { const [x, y, z, ph] = o.userData.p; if (i === 0) o.position.set(p.x + tg.z * .75 + Math.sin(t * 1.3) * .2, 1.75 + Math.sin(t * 2.1) * .14, p.z - tg.x * .75 + Math.cos(t * 1.1) * .2); else o.position.set(x + Math.sin(t * .4 + ph) * 1.6, y + Math.sin(t * .9 + ph * 2) * .5, z + Math.cos(t * .33 + ph) * 1.6); o.quaternion.copy(cam.quaternion); o.scale.setScalar(1 + Math.sin(t * 3 + ph) * .12); });
  glow.position.copy(orbs[0].position);
  F.tick(t); fountain.userData.tick(t); if ((sp += dt) > .09) { sp = 0; const a = Math.random() * 6.283; fx.emit('splash', Math.cos(a) * .9, .5, Math.sin(a) * .9, { size: .5, life: .5, vy: .5, grow: .6 }); }
  fx.update(dt); crt.render(scene, cam, t);
});
</script>
