<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>8-23 草にのまれた遊園地を歩く 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#0c0c10;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#f4f0dc;opacity:.85;text-shadow:0 1px 0 #000}
</style>
<div id="cap">8-23 ─ 草にのまれた遊園地 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="pack-ruins.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 人がいなくなって長い時間がたった遊園地。昼のやわらかい光、水色の空と若草色に、さんご色とクリーム色のしま（屋根・ひさし）をさし色にする。
// さびた観覧車・止まったメリーゴーランド・つたのからむ売店は pack-ruins.js（PK.〜）。ひびわれた道の両わきに花が咲き、鳥がとまり、ちょうが舞う。
// リュックの旅人（R.actor の toon）と犬が、園内をひとまわりする道を歩き、うしろからカメラが追う。
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), PK = PACK_RUINS(THREE, K, R), T = R.tex, PT = PK.tex, { hash } = K;
const { scene, cam, renderer, onResize } = K.stage({ fov: 46, far: 900, aa: false, fitAspect: .9, maxFov: 76 });
scene.add(R.skyDome([[0, '#3a8ad8'], [.6, '#62b0ea'], [.88, '#9cd2f0'], [1, '#d6ecd8']], { r: 380 })); scene.fog = new THREE.Fog('#d0e8d4', 50, 230);
const { sun } = K.lights(scene, renderer, { sky: 0xcfe6ff, ground: 0x9ab886, amb: 1.55, sun: 0xfff0d2, power: 2.3, range: 34, map: 2048 }), SUN = new THREE.Vector3(-.45, .8, .42).normalize();

// ---- 道（園内をひとまわり）と地面：草（花つき）＋ひびわれたアスファルト＋こけた石だたみ ----
const path = new THREE.CatmullRomCurve3([[0, 24], [0, 12], [0, -3], [2.5, -12.5], [10, -17], [18.5, -13], [22, -2], [20.5, 10], [15, 20], [7, 26.5], [1.5, 29]].map(([x, z]) => new THREE.Vector3(x, 0, z)), true, 'centripetal');
const LEN = path.getLength(), PTS = path.getSpacedPoints(90), dPath = (x, z) => { let d = 1e9; for (const p of PTS) d = Math.min(d, (p.x - x) ** 2 + (p.z - z) ** 2); return Math.sqrt(d); };
const CAR = [10, 1], FER = [0, -32], plaza = (x, z) => Math.min(Math.hypot(x - CAR[0], z - CAR[1]) - 6.4, Math.max(Math.abs(x - FER[0]) - 9, Math.abs(z - FER[1] - 3) - 5));
const land = R.ground({ w: 120, d: 128, cell: 2, cx: 8, cz: -4, layers: [T.grass({ c: '#74b052', flowers: .3, fc: ['#ffffff', '#ffe27a', '#f7a8c4'] }), PT.asphalt({ c: '#8a8884', grass: .8, m: 3.5 }), T.cobble({ kind: 'slab', c: '#b8ae9a', moss: .7 })],
  mix: (x, z) => [Math.max(0, Math.min(1, .5 + (1.5 - dPath(x, z)) / 1.6)), Math.max(0, Math.min(1, .5 - plaza(x, z) / 2))],
  shade: (x, z) => { const k = Math.max(0, 1 - dPath(x, z) / 9); return [.94 + .1 * k, .97 + .06 * k, .9 + .06 * k]; } });
scene.add(land.mesh); const outer = R.ground({ w: 704, d: 704, cell: 32, layers: [T.grass({ c: '#74b052', flowers: .3, fc: ['#ffffff', '#ffe27a', '#f7a8c4'] })] }); outer.mesh.position.y = -.1; scene.add(outer.mesh);   // 遠くまでつづく草地

// ---- 遊具と売店（pack-ruins） ----
const fixed = [], put = (o, x, z, ry = 0, y = 0) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
const ferris = PK.ferris({ r: 8.5, n: 10, live: true, rot: .2, seed: 2 }); ferris.position.set(FER[0], 0, FER[1]); ferris.rotation.y = -.1; scene.add(ferris);
put(PK.carousel({ r: 4.2, n: 6, seed: 1 }), CAR[0], CAR[1], .4);
put(PK.kiosk({ seed: 1, kind: 'sun' }), -4.6, 9.5, Math.PI / 2 - .08); put(PK.kiosk({ seed: 2, c2: '#4f9a8a', c: '#f0e4c4', kind: 'wave', w: 2.8 }), -4.9, -4.5, Math.PI / 2 + .16); put(PK.kiosk({ seed: 3, c2: '#e2a83a', kind: 'dots' }), 26, 3, -Math.PI / 2 + .2);
put(PK.slide({}), -10.5, 17, .9); put(PK.bench({}), 3.2, 14, -Math.PI / 2 + .1); put(PK.bench({ c: '#c8a070' }), 3, -6.5, -Math.PI / 2 - .2); put(PK.bench({}), 18.5, 4.5, Math.PI / 2);
put(PK.vending({ seed: 1 }), -4.3, 5.6, Math.PI / 2 + .1); put(PK.vending({ c: '#d8604a', seed: 2, lean: -.16 }), -4.6, 4.3, Math.PI / 2 - .3);
put(PK.billboard({ kind: 'sun', c2: '#e0705a', w: 6, h: 3, legs: 3.4 }), -13, -15, .5); put(PK.billboard({ kind: 'arrow', c2: '#e2a83a', w: 3, h: 1.5, legs: 1.8, seed: 1, lean: -.1 }), 7.5, 16.5, -.7);
put(PK.fence({ len: 14, seed: 1, ivy: .7 }), -8.8, 2, Math.PI / 2 + .05); put(PK.fence({ len: 10, seed: 2, gap: .3 }), -9, -22, .15); put(PK.fence({ len: 12, seed: 3 }), 11, -23.5, -.12);
put(PK.rubble({ r: 2.2, h: .8, seed: 2 }), 6, -9.5); put(PK.pole({ lean: .1, seed: 1 }), 28, 16, .3); put(PK.pole({ lean: -.14, seed: 2, trans: false }), -16, 6, -.2);
// 木と草花：道のわきに花の群れ、外がわに木
for (let i = 0; i < 30; i++) { const a = hash(i, 1) * 6.283, r = 30 + hash(i, 2) * 22, x = Math.cos(a) * r * 1.15 + 2, z = Math.sin(a) * r * .95 - 5; if (Math.hypot(x - FER[0], z - FER[1]) < 17 || (Math.abs(x) < 16 && z < -6 && z > -30)) continue; put(R.tree({ kind: ['round', 'round', 'tall', 'round'][i % 4], h: 5.5 + hash(i, 3) * 4, c: ['#4f9a4a', '#5aa850', '#3f8a52'][i % 3], seed: i }), x, z, i); }
[[-11, -9, 5.5, 0], [-8.5, 13, 5, 1], [27, -12, 6.5, 0], [-15, 24, 6, 0], [15, 11, 5, 1], [26, 22, 6, 1]].forEach(([x, z, h, fl], i) => put(R.tree({ h, seed: 40 + i, ...(fl ? { c: '#f2a8c0', flowers: 1, fc: ['#ffffff', '#ffd0e0'] } : { c: '#58a64e' }) }), x, z, i));
const FC = [['#ffffff', '#ffe27a'], ['#f7a8c4', '#ffffff'], ['#ffd86a', '#f08a5a'], ['#c8b8f0', '#ffffff']];
for (let i = 0; i < 26; i++) { const u = i / 26 + hash(i, 4) * .02, p = path.getPointAt(u % 1), tg = path.getTangentAt(u % 1), s = i % 2 ? 1 : -1, o = 2.6 + hash(i, 5) * 1.6; put(PK.flowers({ n: 11, r: 1.5, seed: i, fc: FC[i % 4], s: .8 }), p.x - tg.z * s * o, p.z + tg.x * s * o); }
for (let i = 0; i < 70; i++) { const x = (hash(i, 6) - .5) * 70 + 2, z = (hash(i, 7) - .5) * 56 - 3; if (dPath(x, z) < 2 || plaza(x, z) < .5) continue; put(R.tuft({ kind: ['grass', 'bush', 'grass', 'reed', 'flower'][i % 5], s: .7 + hash(i, 8) * .7, seed: i % 3 }), x, z, i); }
for (const [x, z] of [[.6, 4], [-.5, -8], [19.5, -6]]) put(PK.decal(PT.puddle({ seed: x }), 2.6, 1.7, { ur: 1, vr: 1 }), x, z, x);
scene.add(R.merge(fixed));

// ---- 空と遠景 ----
scene.add(R.backdrop({ c: '#5a9a64', haze: '#d0e8d4', r: 240, y: -5, h: 34 }));
for (let i = 0; i < 8; i++) { const c = R.cloud({ s: 40 + hash(i, 9) * 30, c: '#ffffff', shade: '#c4d8ee', seed: i }), a = i * .82 + .4; c.position.set(Math.cos(a) * 220, 46 + hash(i, 10) * 36, Math.sin(a) * 220); c.lookAt(0, 24, 0); scene.add(c); }

// ---- 人・犬・鳥・ちょう ----
const hero = R.actor({ build: 'toon', hairStyle: 'short', bangs: 'swept', hair: '#5a3a2a', eyes: 'round', cloth: 'jacket', top: '#e8b040', top2: '#f6eed8', bottom: '#4d6f8f', lower: 'pants', shoes: 'boot', shoe: '#7a4a32', back: 'pack', acc: '#b8583a', hat: 'cap', neck: 'scarf' }); scene.add(hero);
const dog = PK.dog({ collar: '#d8504a' }); scene.add(dog);
const flock = PK.flock({ n: 6, r: 9, h: 3, speed: .3, squash: .45 }); flock.position.set(FER[0], 11, FER[1] + 3); scene.add(flock);
const bfs = [[-2.6, 14], [2.6, 6], [-2.2, -1], [5, -12], [20, 4], [12, 22]].map(([x, z], i) => { const b = PK.butterflies({ n: 5, area: [5, 1.3, 4], fc: FC[i % 4] }); b.position.set(x, 0, z); scene.add(b); return b; });
// とまっている鳥（売店の屋根・ベンチ・道）。旅人が近づくと飛びたち、遠ざかるともどる
const birds = [[-4.4, 2.82, 9], [-4.9, 2.82, 10.3], [3.5, 1.0, 14.1], [.7, 0, 8], [-.5, 0, 7.2], [.4, 0, 1.5], [-.6, 0, 2.3], [12, 0, -16.4], [21, 0, 4.5]].map(([x, y, z], i) => { const b = R.bird(i % 3 === 0 ? { c: '#f0ece4', neck: false } : i % 3 === 1 ? { c: '#7a9ac0', belly: '#f4ead8' } : {}); b.position.set(x, y, z); b.rotation.y = i * 2.1; b.userData.home = [x, y, z, i * 2.1]; b.userData.fly = -1; scene.add(b); return b; });

const SPEED = 2.2, S0 = (() => { let b = 0, bd = 1e9; for (let i = 0; i < 400; i++) { const q = path.getPointAt(i / 400), d = Math.hypot(q.x, q.z - 24.5); if (d < bd) { bd = d; b = i / 400; } } return b; })(), cd = new THREE.Vector3(), cp = new THREE.Vector3(), dp = new THREE.Vector3();
const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
let first = true;
K.loop((dt, t) => {
  const dist = t * SPEED, u = (S0 + dist / LEN) % 1, p = path.getPointAt(u), tg = path.getTangentAt(u);
  hero.position.copy(p); hero.rotation.y = Math.atan2(tg.x, tg.z); R.walk(hero, dist * 3.5);
  // 犬は少し前を、道のはしをかいで歩く
  const ud = (u + (1.9 + Math.sin(t * .4) * .5) / LEN) % 1, pd = path.getPointAt(ud), td = path.getTangentAt(ud), off = 1 + Math.sin(t * .7) * .3; dp.set(pd.x + td.z * off, 0, pd.z - td.x * off);
  dog.rotation.y = Math.atan2(dp.x - dog.position.x, dp.z - dog.position.z) || 0; dog.position.copy(dp); PK.beastPose(dog, 'walk', dist * 9);
  if (first) { cd.copy(tg); first = false; } cd.lerp(tg, 1 - Math.exp(-dt * 1.7)).normalize(); const tall = innerWidth < innerHeight, D = tall ? 4 : 5.2;
  cp.set(p.x - cd.x * D, tall ? 2.1 : 2.5, p.z - cd.z * D); cam.position.copy(cp); cam.lookAt(p.x + cd.x * 3.4, tall ? 1.6 : 1.95, p.z + cd.z * 3.4);
  sun.position.set(p.x + SUN.x * 60, SUN.y * 60, p.z + SUN.z * 60); sun.target.position.copy(p);
  ferris.userData.tick(t); flock.userData.tick(t); for (const b of bfs) b.userData.tick(t);
  for (const b of birds) { const [hx, hy, hz, hr] = b.userData.home, dh = Math.hypot(p.x - hx, p.z - hz);
    if (b.userData.fly < 0) { R.birdPose(b, hy > 0 ? 'stand' : 'peck', t + hr * 3); if (dh < (hy > 0 ? 2.4 : 3.6)) b.userData.fly = 0; }
    else { const f = (b.userData.fly += dt); b.visible = f < 5; b.position.set(hx + Math.cos(hr) * f * 3.2, hy + Math.min(8, f * 2.6 - f * f * .1), hz + Math.sin(hr) * f * 3.2); b.rotation.y = Math.atan2(Math.cos(hr), Math.sin(hr)); R.birdPose(b, 'fly', t + hr);
      if (f > 5 && dh > 15) { b.userData.fly = -1; b.visible = true; b.position.set(hx, hy, hz); b.rotation.y = hr; } } }
  crt.render(scene, cam, t);
});
</script>
</html>
