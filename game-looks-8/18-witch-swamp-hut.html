<title>8-18 魔女の沼の小屋 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#fff4f0;opacity:.95;text-shadow:0 1px 0 #4a2a4a}
</style>
<div id="cap">8-18 ─ 魔女の沼の小屋 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="pack-fantasy-wild.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 面の少ない高床の小屋・板の桟橋・枯れ木に、手で打ったドット絵（うき草とはすの葉の沼・木目の板・板ばりのかべ）をはり、横 320 ドットの粗い絵に描いてブラウン管に映す。
// 色は 夕方のもも色の空と、緑の沼。差し色は見習いのむらさきのとんがり帽子と、窓・ランタンのあたたかいあかり。こわくしない：花のさく小島、花のつた、手をふる先生、ねこ。
// とんがり帽子の見習いが、沼をめぐる板の桟橋を歩く。小屋のえんとつから けむりが上がり、光る虫がとび、しずく玉がはねる。部品は retro.js（R.〜）と pack-fantasy-wild.js（F.〜）
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), F = PACK_FWILD(THREE, K, R), T = R.tex, X = F.tex, { hash } = K, TAU = Math.PI * 2;
const { scene, cam, renderer, onResize } = K.stage({ fov: 46, far: 600, aa: false, fitAspect: .9, maxFov: 76 });
scene.add(R.skyDome([[0, '#6a5cb8'], [.4, '#e070a8'], [.75, '#ff98a0'], [1, '#ffcc9c']], { r: 300 })); scene.fog = new THREE.Fog('#ea8ea0', 26, 130);
const { sun } = K.lights(scene, renderer, { sky: 0xffd0e0, ground: 0x7aa878, amb: 1.7, sun: 0xffc8a0, power: 2.0, range: 30 }), SUN = new THREE.Vector3(.5, .55, .45).normalize();

// ---- 沼をめぐる桟橋の輪。pt(a, e) は桟橋から外へ e m の点と進む向き、off(x, z) は桟橋からのへだたり ----
const rr = a => 11.5 + 1.2 * Math.sin(2 * a) + .8 * Math.sin(3 * a + 1), DY = .34, AH = 1.0, HD = 6.4;
const pt = (a, e = 0) => { const r = rr(a) + e, a2 = a + .004, r2 = rr(a2) + e, x = Math.cos(a) * r, z = Math.sin(a) * r; return [x, z, Math.atan2(Math.cos(a2) * r2 - x, Math.sin(a2) * r2 - z)]; };
const off = (x, z) => Math.hypot(x, z) - rr(Math.atan2(z, x)), sm = (a, b, v) => { const k = Math.max(0, Math.min(1, (v - a) / (b - a))); return k * k * (3 - 2 * k); };
const [hx, hz] = pt(AH, HD), hry = Math.atan2(-Math.cos(AH), -Math.sin(AH));   // 小屋は輪の外がわ。入口は桟橋のほうを向く
// 沼の底（どろ）と、花のさく小島。小屋の下は水
const HF = (x, z) => -.7 + sm(.4, .6, F.vn(x * .13, z * .13, 3)) * sm(2.2, 4.2, Math.abs(off(x, z))) * sm(5, 7.5, Math.hypot(x - hx, z - hz)) * 1.3;
const land = R.ground({ w: 120, d: 120, cell: 2, H: HF, layers: [T.dirt({ c: '#5c6a48', pebbles: .3 }), T.grass({ c: '#6aae5a', flowers: .45, fc: ['#ff9ac0', '#ffffff', '#ffe27a'] }), X.moss({ kind: 'tile', c: '#8ad070', m: 2.5 })],
  mix: (x, z) => { const h = HF(x, z); return [h > -.02 ? 1 : 0, h > .25 && F.vn(x * .3, z * .3, 8) > .6 ? .8 : 0]; } });
const swamp = F.pool({ kind: 'swamp', r: 58, seg: 30, rings: 16, c: '#3f9280', wobble: 0, y: 0 }); scene.add(land.mesh, swamp);

// ---- 動かない物：桟橋と くい・ランタン・小屋・枯れ木と花のつた・花の木・あし・はすの花 ----
const fixed = [], ticks = [swamp.userData.tick], put = (o, x, z, ry = 0, y = Math.max(0, HF(x, z))) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); if (o.userData.tick) ticks.push(o.userData.tick); return o; };
const plankT = T.planks({ c: '#a8845c' }), [p0x, p0z] = pt(AH, .6), [p1x, p1z] = pt(AH, HD - 3.3);
fixed.push(R.strip([...Array(73)].map((_, i) => { const [x, z] = pt(i / 72 * TAU); return [x, DY, z]; }), 1.9, plankT, { lift: 0 }), R.strip([[p0x, DY - .02, p0z], [(p0x + p1x) / 2, DY - .02, (p0z + p1z) / 2], [p1x, DY - .02, p1z]], 1.5, plankT, { lift: 0 }));
const PB = R.parts(), PG = PB.g(T.bark({ c: '#6e5a50' })).smooth(1), LG = R.geo(), lampP = [];
for (let i = 0; i < 36; i++) for (const s of [-1, 1]) { const a = i / 36 * TAU, [x, z] = pt(a, s * 1.02), tallP = s > 0 && i % 4 === 1, h = tallP ? 1.5 : .62 + hash(i, s + 2) * .25; if (s > 0 && Math.abs(a - AH) < .09) continue;
  PG.at(R.TR(x, 0, z, i, (hash(i, 5) - .5) * .12, (hash(i, 6) - .5) * .12)).loft(5, [[-.8, .1, .1, 0, .6], [DY, .085, .085, .5, .9], [DY + h, .07, .07, 1, 1.05]], { cap: 'top' }); if (tallP) { LG.at(R.TR(x, DY + h, z, i)).loft(4, [[.02, .09, .09, 0], [.3, .13, .13, 1]], { rot: .5, ur: 4 }); lampP.push([x, DY + h + .16, z]); } }
PG.at(null); LG.at(null); fixed.push(PB.group()); const lampM = new THREE.Mesh(LG.build(), F.glowMat(T.lamp({}), {})); fixed.push(lampM); const lampH = lampP.map(([x, y, z]) => { const h = F.halo('#ffc878', 1.5, .5); h.position.set(x, y, z); scene.add(h); return h; });
const hut = put(F.swampHut({ w: 3.6, d: 3.1, stilt: 1.7, c: '#8a70b0', roofC: '#4a9a80', light: true, seed: 2 }), hx, hz, hry, 0); hut.updateMatrixWorld(true); const smokeP = new THREE.Vector3(...hut.userData.smoke).applyMatrix4(hut.matrixWorld);
for (let i = 0; i < 90; i++) { const a = hash(i, 7) * TAU, d = 3 + hash(i, 8) * 44, x = Math.cos(a) * d, z = Math.sin(a) * d, h = HF(x, z), isle = h > .12, q = i % 6; if (Math.abs(off(x, z)) < 2.6 || Math.hypot(x - hx, z - hz) < 5.5) continue;
  if (isle && q < 2) put(R.tree({ kind: 'round', h: 4 + hash(i, 9) * 3, c: '#5aa860', flowers: .6, fc: ['#ff9ac0', '#ffd0e0'], seed: i }), x, z, i, h); else if (isle && q === 2) put(R.rock({ s: .5 + hash(i, 9), c: '#8a8a98', moss: .9, seed: i }), x, z, i, h - .1); else if (isle) put(R.tuft({ kind: q % 2 ? 'flower' : 'bush', s: .6 + hash(i, 9) * .5, c: '#6aae5a', fc: ['#ff9ac0', '#ffffff'], seed: i % 3 }), x, z, i, h);
  else if (q < 2 && d > 6) { const th = 3.6 + hash(i, 10) * 3; put(F.deadTree({ h: th, seed: i, c: '#7a6470', branches: 4 }), x, z, i, -.3); put(F.vine({ len: 1.6 + hash(i, 11), n: 4, w: 1.6, c: '#6ab868', flowers: true, fc: ['#ff9ac0', '#ffe27a'], seed: i }), x, z, i, th * .62); }
  else if (q < 4) put(R.tuft({ kind: 'reed', s: .9 + hash(i, 12) * .6, c: '#7ab060', seed: i % 3 }), x, z, i, -.05); else put(F.bloom({ s: .45 + hash(i, 12) * .25, c: i % 2 ? '#ff9ac8' : '#fff0f4', leaf: '#5aa860' }), x, z, i, .02); }
scene.add(R.merge(fixed), R.backdrop({ c: '#5a7a6a', haze: '#ea8ea0', r: 130, h: 26, y: -1, rep: 8 }), R.backdrop({ c: '#8a6a9a', haze: '#ffc0a8', r: 190, h: 52, y: -2, rep: 6, seed: 3 }));

// ---- 人と生きもの ----
R.cfg.actorBuild = 'toon';
const hero = R.actor({ sex: 'f', hairStyle: 'long', hair: '#f08a3a', eye: '#5a8a4a', eyes: 'round', mouth: 'smile', blush: true, cloth: 'robe', lower: 'skirt', skirt: .5, top: '#6a4aa8', top2: '#ffd870', skirtC: '#6a4aa8', belt: '#ffd870', tights: '#f4ecd8', shoes: 'boot', shoe: '#8a4a3a', hat: 'wizard', acc: '#6a4aa8', back: 'bag', hold: 'staff', s: 1 }); scene.add(hero);
const witch = R.actor({ sex: 'f', hairStyle: 'bun', hair: '#e8e0e8', eyes: 'closed', mouth: 'smile', blush: true, cloth: 'robe', lower: 'skirt', skirt: .85, top: '#3f8a6a', top2: '#ffe0a0', skirtC: '#3f8a6a', shoes: 'shoe', shoe: '#5a4030', hat: 'wizard', acc: '#c8508a', neck: 'scarf', s: 1.02 }); { const [x, z] = pt(AH, 1.9); witch.position.set(x, DY, z); witch.rotation.y = hry; scene.add(witch); }
const cat = R.cat({ c: '#4a4050', belly: '#f4ecd8', s: 1.1 }); { const [x, z] = pt(AH + .1, 1.6); cat.position.set(x, DY, z); cat.rotation.y = hry - .5; scene.add(cat); }
const slimes = [[AH - .5, .5, '#8ad86a', .3, DY], [AH - .1, -.4, '#ff9ac0', .24, DY], [AH + .6, .3, '#8ad86a', .34, DY], [AH + 1.7, -.5, '#ffd870', .26, DY], [AH + 3.2, .4, '#ff9ac0', .32, DY], [AH + 4.4, -.3, '#8ad86a', .28, DY]].map(([a, e, c, s, y]) => { const g = F.slime({ c, s }), [x, z, r] = pt(a, e); g.position.set(x, y, z); g.rotation.y = r + 2.6 + e; scene.add(g); return g; });
const bugs = [...Array(12)].map((_, i) => { const g = F.bug({ c: i % 3 ? '#e8ff8a' : '#fff0a0', s: 1.6 }); g.userData.orb = [hash(i, 21) * TAU, 1.5 + hash(i, 22) * 3.5, 1 + hash(i, 23) * 1.8, .25 + hash(i, 24) * .3, i % 2 ? 1 : -1]; scene.add(g); return g; });
const motes = F.motes({ n: 70, box: [28, 5, 28], c: '#fff4b0', size: .12, rise: .12, drift: .8, y: .3 }); scene.add(motes);

// ---- 見習いの道（輪を左まわり。開いて 2.5 秒で、小屋が前に見える） ----
const path = new THREE.CatmullRomCurve3([...Array(48)].map((_, i) => { const [x, z] = pt(i / 48 * TAU); return new THREE.Vector3(x, DY, z); }), true, 'centripetal');
const LEN = path.getLength(), SPEED = 1.6, S0 = (AH - 1.0 + TAU) / TAU, cd = new THREE.Vector3(), cp = new THREE.Vector3(), fx = K.fx(scene, 40), crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
let first = true, sk = 0;
K.loop((dt, t) => {
  const dist = t * SPEED, u = (S0 + dist / LEN) % 1, p = path.getPointAt(u), tg = path.getTangentAt(u);
  hero.position.copy(p); hero.rotation.y = Math.atan2(tg.x, tg.z); R.walk(hero, dist * 3.9);
  if (first) { cd.copy(tg); first = false; } cd.lerp(tg, 1 - Math.exp(-dt * 1.7)).normalize(); const tall = innerWidth < innerHeight, D = tall ? 3.9 : 5;
  const pr = Math.hypot(p.x, p.z), ox = p.x / pr, oz = p.z / pr, sd = tall ? .4 : 1;   // 小屋は外がわにあるので、カメラは少し内がわから外を向く
  cp.set(p.x - cd.x * D - ox * .9 * sd, p.y + (tall ? 2.1 : 2.3), p.z - cd.z * D - oz * .9 * sd); cam.position.copy(cp); cam.lookAt(p.x + cd.x * 3 + ox * 1.3 * sd, p.y + 1.35, p.z + cd.z * 3 + oz * 1.3 * sd);
  sun.position.set(p.x + SUN.x * 60, SUN.y * 60, p.z + SUN.z * 60); sun.target.position.copy(p);
  // 沼・ランタン・先生・ねこ・しずく玉・光る虫・けむり
  for (const f of ticks) f(t); lampH.forEach((h, i) => { h.material.opacity = .45 + .1 * Math.sin(t * 3 + i * 2); }); if (hut.userData.light) hut.userData.light.intensity = 10 * (.9 + .1 * Math.sin(t * 7));
  R.idle(witch, t, Math.atan2(p.x - witch.position.x, p.z - witch.position.z) - witch.rotation.y); { const A = witch.userData.J; A.armR.rotation.set(-2.6 + Math.sin(t * 6) * .25, 0, -.5); A.foreR.rotation.x = -.3; }   // 先生が手をふる
  R.catPose(cat, 'sit', t);
  slimes.forEach((s, i) => F.slimePose(s, t * 1.05 + i * 1.7, .24));
  bugs.forEach((b, i) => { const [ph, r, h, sp, dir] = b.userData.orb, a = ph + t * sp * dir, cx = i < 6 ? p.x + tg.x * 4 : pt(AH + i * .9)[0], cz = i < 6 ? p.z + tg.z * 4 : pt(AH + i * .9)[1]; b.position.set(cx + Math.cos(a) * r, DY + h + Math.sin(t * 1.3 + ph) * .4, cz + Math.sin(a * 1.3) * r); b.rotation.y = Math.atan2(-Math.sin(a) * dir, Math.cos(a * 1.3) * 1.3 * dir); F.bugPose(b, t + ph); });
  if ((sk += dt) > .5) { sk = 0; fx.emit('smoke', smokeP.x, smokeP.y, smokeP.z, { size: .6, grow: 1.5, life: 2.6, vy: .6, vx: .15, spread: .1, tint: '#fff0f4' }); }
  fx.update(dt); motes.userData.tick(t, p.x, p.z); crt.render(scene, cam, t);
});
</script>
