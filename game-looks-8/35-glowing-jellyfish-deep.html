<html lang="ja">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>8-35 光るくらげの深み 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#f4f8f0;opacity:.85;text-shadow:0 1px 0 #024}
</style>
<div id="cap">8-35 ─ 光るくらげの深み / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で泳ぐ）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="pack-sea.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// テイスト B。面の少ない形（くらげ・くじら・岩・ヘルメットのダイバー）に、その場で打ったドット絵をはり、横 320 ドットほどの粗い絵に描いて、ブラウン管に映す。
// 深い青の海。色は 水のこい青と、くらげの もも・水色・むらさき の光。大小の光るくらげがただよい、光る粒がまい、遠くを くじらの親子が通る。
// 金物のヘルメットのダイバーが、ランプで前をてらしながら くらげの間を泳ぐ。うしろ斜め下からカメラが追う。部品は retro.js（R.〜）と pack-sea.js（S.〜）。ランプの光と光る粒は このページで作る
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), S = PACK_SEA(THREE, K, R), { hash } = R;
const { scene, cam, renderer, onResize } = K.stage({ fov: 50, far: 900, aa: false, fitAspect: .9, maxFov: 78 });
// 'deep' のままだと少し暗かったので、水平の色と霧を少し明るい青へ、まわりの光（amb）を上げてある。水面は遠いので出さない
const env = S.underwater(scene, renderer, { depth: 'deep', top: 34, surface: false, rays: 7, range: 30, hi: '#4a90dc', mid: '#2852b0', low: '#1a2a7c', fog: '#2448a4', near: 5, far: 66, amb: 1.55, sky: 0xa8c4ff, ground: 0x6a60c8, power: .7, rayA: .22, motes: 120 }), sun = env.sun;

// ---- 泳ぐ道（大きく ひと回り）と、海底：青い砂に岩。光る いそぎんちゃく と つつさんご ----
const path = new THREE.CatmullRomCurve3([[0, 0], [12, -6], [25, -2], [33, 9], [30, 23], [18, 30], [5, 26], [-7, 31], [-19, 24], [-22, 11], [-13, 2]].map(([x, z]) => new THREE.Vector3(x, 0, z)), true, 'centripetal'), LEN = path.getLength(), PP = path.getSpacedPoints(200);
const dP = (x, z) => { let b = 1e9; for (const p of PP) { const d = (p.x - x) ** 2 + (p.z - z) ** 2; if (d < b) b = d; } return Math.sqrt(b); };
const H = (x, z) => .5 * Math.sin(x * .17 + 1) * Math.cos(z * .15) + .25 * Math.sin(x * .41 + z * .36) + Math.min(2.4, Math.max(0, dP(x, z) - 4) * .16);
const bed = S.seabed({ env, w: 124, d: 124, cell: 2, H, caustic: 0, layers: [S.tex.sand({ c: '#a8b0e0' }), S.tex.grown({ base: 'rock', o: { c: '#6a6ab0' }, grow: .7, algae: '#4a8ac8', seed: 2 })], mix: (x, z) => [Math.min(1, Math.max(0, (dP(x, z) - 4.5) * .4)), 0] }); scene.add(bed.mesh);
const fixed = [], put = (o, x, z, ry = 0, dy = 0) => { o.position.set(x, H(x, z) + dy, z); o.rotation.y = ry; fixed.push(o); return o; };
const GC = ['#ff7ac8', '#5ae0ff', '#8858ff'];
for (let i = 0; i < 40; i++) { const u = (i + hash(i, 1) * .6) / 40, p = path.getPointAt(u), tg = path.getTangentAt(u), sd = i % 2 ? 1 : -1, off = 3.4 + hash(i, 2) * 4.5, x = p.x + tg.z * sd * off, z = p.z - tg.x * sd * off;
  put(S.rock({ s: 1 + hash(i, 3) * 1.8, seed: i, c: '#7070b8', grow: .6 }), x, z, i, -.2);
  put(S.coral({ kind: ['tube', 'finger', 'branch'][i % 3], s: .8 + hash(i, 4) * .6, c: ['#6ad8f0', '#b890f8', '#f090d0'][i % 3], tip: '#ffffff', seed: i }), x + 1.2, z + .6, i);
  if (i % 3 === 0) put(S.anemone({ s: 1.4, c: GC[i % 3], tip: '#ffffff', body: '#5a50b0', seed: i }), x - 1, z + .9); }
for (let i = 0; i < 110; i++) { const u = hash(i, 5), p = path.getPointAt(u), tg = path.getTangentAt(u), sd = i % 2 ? 1 : -1, off = 1.2 + hash(i, 6) * 4, x = p.x + tg.z * sd * off, z = p.z - tg.x * sd * off, k = i % 8;
  put(k < 4 ? S.seagrass({ s: .6 + hash(i, 7) * .5, c: i % 2 ? '#5ab8d8' : '#8a8af0', seed: i }) : k < 5 ? S.starfish({ c: '#f090d0', s: 1.2 }) : k < 6 ? S.shell({ c: '#d8e0ff', s: 1.3 }) : S.coral({ kind: ['tube', 'finger'][i % 2], s: .5, c: ['#6ad8f0', '#b890f8'][i % 2], tip: '#ffffff', seed: i }), x, z, i * 1.7, .01); }
scene.add(R.merge(fixed));

// ---- 光るくらげ：道のまわりと上に 54 ひき（大きい物は上のほう）。それぞれ ゆっくり上下にただよう。大きい 4 ひきは、まわりも色の光でてらす ----
const live = [], add = (o, f) => { scene.add(o); live.push(t => { f && f(o, t); o.userData.tick(t); }); return o; };
const jl = [];
for (let i = 0; i < 54; i++) { const u = (i + hash(i, 10) * .8) / 54, p = path.getPointAt(u), tg = path.getTangentAt(u), sd = i % 2 ? 1 : -1, big = i % 9 === 4, mid = i % 3 === 0, s = big ? 2.6 + hash(i, 11) * 1.2 : mid ? 1.3 + hash(i, 11) * .6 : .55 + hash(i, 11) * .5;
  const off = big ? hash(i, 12) * 3.5 : 1.4 + hash(i, 12) * 6.5, y = big ? 7.5 + hash(i, 13) * 3 : mid ? 3.6 + hash(i, 13) * 5 : 1.6 + hash(i, 13) * 6, x = p.x + tg.z * sd * off, z = p.z - tg.x * sd * off, c = GC[[1, 2, 0, 1, 2, 1, 0, 2][(i + (i / 3 | 0)) % 8]];
  const j = add(S.jelly({ c, s, seed: i, alpha: .9 }), (o, t) => o.position.set(x + Math.sin(t * .14 + i) * .9, H(x, z) + y + Math.sin(t * .22 + i * 2) * .7, z + Math.cos(t * .11 + i) * .9)); jl.push({ j, c, big, s }); }
// 光る小さな粒（もも・水色・白）。加算の点を主役のまわり 16 m に めぐらせる
const NG = 420, GB = 16, gpos = new Float32Array(NG * 3), gbase = new Float32Array(NG * 3), gcol = new Float32Array(NG * 3), cc = new THREE.Color();
for (let i = 0; i < NG; i++) { gbase[i * 3] = (hash(i, 20) - .5) * 2 * GB; gbase[i * 3 + 1] = hash(i, 21) * 12; gbase[i * 3 + 2] = (hash(i, 22) - .5) * 2 * GB; cc.set(['#ffb0e8', '#a0f0ff', '#ffffff', '#d0b0ff'][i % 4]); gcol.set([cc.r, cc.g, cc.b], i * 3); }
const gg = new THREE.BufferGeometry(); gg.setAttribute('position', new THREE.BufferAttribute(gpos, 3)); gg.setAttribute('color', new THREE.BufferAttribute(gcol, 3));
const glow = new THREE.Points(gg, new THREE.PointsMaterial({ size: .085, vertexColors: true, transparent: true, opacity: .95, blending: THREE.AdditiveBlending, depthWrite: false, fog: false })); glow.frustumCulled = false; scene.add(glow);
const wrap = (a, n) => ((a % n) + n) % n;
const lamps = [0, 1, 2].map(i => { const l = new THREE.PointLight(GC[i], 10, 13, 1.5); scene.add(l); return l; });   // 近くの大きなくらげ 3 びきに、色の光を持たせる

// ---- 遠くの くじらの親子、ひかる小魚の群れ、えい ----
const circ = (cx, cy, cz, rx, rz, sp, ph = 0, bob = .3) => (o, t) => { const a = t * sp + ph; o.position.set(cx + Math.cos(a) * rx, cy + Math.sin(t * .6 + ph) * bob, cz + Math.sin(a) * rz); o.rotation.y = Math.atan2(-Math.sin(a) * rx * sp, Math.cos(a) * rz * sp); };
add(S.whale({ kind: 'whale', s: 1.5, c: '#5a78c8', c2: '#c8d8f8' }), circ(6, 13, 12, 44, 36, .05, 5.72, .8)); add(S.whale({ kind: 'whale', s: .8, c: '#6a88d0', c2: '#d0e0ff' }), circ(6, 10.5, 12, 39, 31, .05, 5.9, .6));
const P0 = path.getPointAt(.04);
add(S.school({ n: 50, rx: 6, rz: 4, h: 2, wide: 1.3, speed: 1.3, spread: 2, c: '#a0d8ff', c2: '#ffffff', tints: ['#ffffff', '#c8f0ff', '#ffd0f0'] })).position.set(P0.x + 9, 4.4, P0.z - 1);
add(S.school({ n: 36, rx: 5, rz: 4, h: 1.6, speed: -1.2, spread: 2, seed: 4, c: '#a0d8ff', c2: '#ffffff', tints: ['#ffffff', '#c8f0ff'] })).position.set(path.getPointAt(.45).x, 5, path.getPointAt(.45).z);
add(S.ray({ s: 1.5, c: '#5a6ab8' }), circ(P0.x + 10, 6.5, P0.z + 8, 14, 10, .12, 3.4, .5));

// ---- 主役：ヘルメットのダイバー（黄色い服。ヘルメットの上のランプが前をてらす） ----
const hero = S.diver({ head: 'helmet', tank: '#e8843a', fin: '#f4d23a', metal: '#d8b060', actor: { hairStyle: 'short', hair: '#6a4a30', top: '#f6d83a', top2: '#e8843a', bottom: '#f0c82e', glove: '#e8843a', shoe: '#b8602a', belt: '#e8843a' } }); scene.add(hero);
// pack のヘルメットは、よこのくり返し（ur: 3）がテクスチャの金物の区画からはみ出して 2/3 が黒くなるので、ここで UV を区画の中へ折り返す
{ const hm = hero.userData.J.head.children.at(-1), uv = hm.geometry.attributes.uv, u0 = 17 / 64, w = 14 / 64; for (let i = 0; i < uv.count; i += 3) { if (uv.getY(i) > .25) continue; const k = Math.floor((Math.min(uv.getX(i), uv.getX(i + 1), uv.getX(i + 2)) - u0) / w + .001); for (let j = 0; j < 3; j++) uv.setX(i + j, uv.getX(i + j) - k * w); } uv.needsUpdate = true; }
{ const J = hero.userData.J, G = R.geo(), y = .46, L = 5.2;   // ランプの光：頭の前へのびる うすい光の板 2 枚（加算）と、ヘルメットの上の小さな あかり
  for (const [ax, ay] of [[1, 0], [0, 1]]) G.quad([-.1 * ax, y - .1 * ay, .36], [.1 * ax, y + .1 * ay, .36], [1.5 * ax, y + 1.5 * ay - .5, L], [-1.5 * ax, y - 1.5 * ay - .5, L], [0, 1, 1, .08]);
  const beam = G.mesh(S.mat(S.tex.shaft({ seed: 1 }), { glow: true, add: true, alpha: .5, side: true, color: '#ffeeb0' })); beam.castShadow = false; beam.renderOrder = 6; J.head.add(beam);
  const bulb = new THREE.Sprite(new THREE.SpriteMaterial({ map: S.tex.bubble(), color: '#fff4c0', blending: THREE.AdditiveBlending, depthWrite: false, fog: false })); bulb.material.map = bulb.material.map.clone(); bulb.material.map.repeat.set(.5, 1); bulb.material.map.needsUpdate = true; bulb.scale.setScalar(.22); bulb.position.set(0, y + .12, .34); J.head.add(bulb); }
const headLamp = new THREE.SpotLight('#ffe8b0', 60, 16, .5, .6, 1.2); scene.add(headLamp, headLamp.target);
const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
const cd = new THREE.Vector3(), SPEED = 1.3; let dist = .04 * LEN, first = true, hy = 3;
K.loop((dt, t) => {
  dist += SPEED * dt; const u = (dist / LEN) % 1, p = path.getPointAt(u), tg = path.getTangentAt(u), gy = H(p.x, p.z) + 2.6 + Math.sin(t * .5) * .25; hy += (gy - hy) * Math.min(1, dt * 2);
  hero.position.set(p.x, hy, p.z); hero.rotation.y = Math.atan2(tg.x, tg.z); S.swim(hero, t, { rate: 4.6 }); S.breathe(hero, env.bubbles, dt, 2.2);
  headLamp.position.set(p.x + tg.x * .5, hy + .5, p.z + tg.z * .5); headLamp.target.position.set(p.x + tg.x * 7, hy - 1.6, p.z + tg.z * 7);
  if (first) { cd.copy(tg); first = false; } cd.lerp(tg, 1 - Math.exp(-dt * 1.3)).normalize(); const tall = innerWidth < innerHeight, D = tall ? 3.1 : 3.5, Sd = tall ? .8 : 1.9;
  cam.position.set(p.x - cd.x * D + cd.z * Sd, hy + (tall ? .5 : .1), p.z - cd.z * D - cd.x * Sd); cam.lookAt(p.x + cd.x * 2.4, hy + (tall ? 1.2 : 1.25), p.z + cd.z * 2.4);
  // 光る粒を主役のまわりで回す。近い大きなくらげに光を持たせる
  for (let i = 0; i < NG; i++) { gpos[i * 3] = p.x + wrap(gbase[i * 3] + Math.sin(t * .3 + i) * .5 - p.x + GB, 2 * GB) - GB; gpos[i * 3 + 1] = .4 + wrap(gbase[i * 3 + 1] + t * .12 + Math.sin(t * .5 + i * 1.3) * .2, 12); gpos[i * 3 + 2] = p.z + wrap(gbase[i * 3 + 2] + Math.cos(t * .26 + i) * .5 - p.z + GB, 2 * GB) - GB; if (Math.abs(gpos[i * 3] - cam.position.x) + Math.abs(gpos[i * 3 + 1] - cam.position.y) + Math.abs(gpos[i * 3 + 2] - cam.position.z) < 4.5) gpos[i * 3 + 1] += 14; } gg.attributes.position.needsUpdate = true;
  for (const f of live) f(t);
  const near = jl.filter(a => a.s > 1.2).sort((a, b) => a.j.position.distanceToSquared(hero.position) - b.j.position.distanceToSquared(hero.position)); lamps.forEach((l, i) => { const a = near[i]; l.position.copy(a.j.position); l.position.y -= .4; l.color.set(a.c); l.intensity = (a.big ? 16 : 9) * (1 + Math.sin(t * 2.3 + i) * .12); });
  sun.position.set(p.x - 8, 44, p.z + 6); sun.target.position.set(p.x, 0, p.z);
  bed.follow(p.x, p.z); bed.tick(t); env.tick(t, cam, dt); crt.render(scene, cam, t);
});
</script>
</html>
