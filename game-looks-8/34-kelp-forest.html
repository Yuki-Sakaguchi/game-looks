<title>8-34 昆布の森 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#f4f8f0;opacity:.85;text-shadow:0 1px 0 #024}
</style>
<div id="cap">8-34 ─ 昆布の森 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で泳ぐ）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="pack-sea.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// テイスト B。面の少ない形（昆布の帯・岩・魚・かめ・かに・ダイバー）に、その場で打ったドット絵をはり、横 320 ドットほどの粗い絵に描いて、ブラウン管に映す。
// 海底から水面の近くまでのびる昆布の森。色は 昆布の緑と金・こい青緑の水。昆布の間から金色の光のすじがさしこみ、小魚の群れが光る。
// ダイバーが昆布の間の砂の道をぬって泳ぎ、うみがめが少し前をいく。うしろ斜め上からカメラが追う。部品は retro.js（R.〜）と pack-sea.js（S.〜）
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), S = PACK_SEA(THREE, K, R), { hash } = R;
const { scene, cam, renderer, onResize } = K.stage({ fov: 48, far: 900, aa: false, fitAspect: .9, maxFov: 76 });
const TOP = 15, env = S.underwater(scene, renderer, { depth: 'mid', top: TOP, rays: 20, range: 30, hi: '#e8f8a8', mid: '#2e9c8c', low: '#14606c', fog: '#238e86', near: 5, far: 58, sky: 0xf0ffc8, ground: 0x3a9a88, amb: 1.3, sun: 0xffe8a0, power: 1.5, ray: '#ffe488', rayA: .62, surf: '#b8e89a', motes: 200 }), sun = env.sun;

// ---- 泳ぐ道（昆布の間をくねって ひと回り）と、海底：金色がかった砂に、こけた岩 ----
const path = new THREE.CatmullRomCurve3([[0, 0], [10, -6], [20, -1], [25, 10], [19, 20], [24, 31], [14, 38], [3, 32], [-6, 37], [-17, 30], [-14, 18], [-22, 8], [-13, -2]].map(([x, z]) => new THREE.Vector3(x, 0, z)), true, 'centripetal'), LEN = path.getLength(), PP = path.getSpacedPoints(220);
const dP = (x, z) => { let b = 1e9; for (const p of PP) { const d = (p.x - x) ** 2 + (p.z - z) ** 2; if (d < b) b = d; } return Math.sqrt(b); };
const H = (x, z) => .35 * Math.sin(x * .21 + 1) * Math.cos(z * .18) + .18 * Math.sin(x * .47 + z * .4) + Math.min(1.2, Math.max(0, dP(x, z) - 2.5) * .12);
const bed = S.seabed({ env, w: 116, d: 116, cell: 2, H, caustic: .5, causticC: '#ffe890', layers: [S.tex.sand({ c: '#e6d8a4' }), S.tex.grown({ base: 'rock', o: { c: '#8a9478' }, grow: .9, algae: '#5a9a4a', seed: 2 })], mix: (x, z) => [Math.min(1, Math.max(0, (dP(x, z) - 3.2) * .5)) * (Math.sin(x * .3) * Math.cos(z * .27) > -.2 ? 1 : 0), 0] }); scene.add(bed.mesh);

// ---- 昆布の森：道から 2 m より外に、3 m ごとの ます目をずらして立てる。道のきわは低い海草・岩・うに・ひとで ----
const fixed = [], put = (o, x, z, ry = 0, dy = 0) => { o.position.set(x, H(x, z) + dy, z); o.rotation.y = ry; fixed.push(o); return o; };
const KC = ['#7a9a3a', '#5c9a48', '#a89c3a', '#6a8a34', '#8aa840'];
for (let j = -14; j <= 18; j++) for (let i = -14; i <= 15; i++) { const x = i * 3 + (hash(i, j, 1) - .5) * 2.6 + 2, z = j * 3 + (hash(i, j, 2) - .5) * 2.6 + 6, d = dP(x, z), k = hash(i, j, 3); if (d < 2.1 || d > 26 || k < .22) continue;
  const h = Math.min(TOP - .6, (d < 3.4 ? 7 : 9.5) + hash(i, j, 4) * 5); put(S.kelp({ h, w: .9 + hash(i, j, 5) * .5, kind: k > .86 ? 'ribbon' : 'kelp', c: KC[(i * 7 + j * 3 + 100) % 5], amp: .5, seed: i * 31 + j }), x, z, hash(i, j, 6) * 6.28, -.1);
  if (k > .6) put(S.kelp({ h: h * (.5 + hash(i, j, 7) * .3), w: .8, c: KC[(i + j + 100) % 5], seed: i + j * 17 }), x + .7, z + .5, hash(i, j, 8) * 6.28, -.1); }
for (let i = 0; i < 44; i++) { const u = (i + hash(i, 9) * .6) / 44, p = path.getPointAt(u), tg = path.getTangentAt(u), sd = i % 2 ? 1 : -1, off = 3 + hash(i, 10) * 2.6, x = p.x + tg.z * sd * off, z = p.z - tg.x * sd * off;
  put(S.rock({ s: .8 + hash(i, 11) * 1.3, seed: i, flat: .7, c: '#8a947c', grow: .9 }), x, z, i, -.15); if (i % 4 === 0) put(S.anemone({ s: 1.3, c: '#f4c060', body: '#c8703a', seed: i }), x + .9, z + .4); }
for (let i = 0; i < 150; i++) { const u = hash(i, 20), p = path.getPointAt(u), tg = path.getTangentAt(u), sd = i % 2 ? 1 : -1, off = 1.3 + hash(i, 21) * 3, x = p.x + tg.z * sd * off, z = p.z - tg.x * sd * off, k = i % 10;
  put(k < 5 ? S.seagrass({ s: .6 + hash(i, 22) * .6, c: i % 3 ? '#6aa84a' : '#a8b040', seed: i }) : k < 6 ? S.starfish({ c: ['#f0a03a', '#e8703a'][i % 2], s: 1.2 }) : k < 7 ? S.urchin({ s: 1.4, c: '#6a3a7a' }) : k < 8 ? S.shell({ c: '#f4e8c0', s: 1.2 }) : S.coral({ kind: ['finger', 'tube'][i % 2], s: .5 + hash(i, 23) * .3, c: ['#f0b040', '#e8843a'][i % 2], seed: i }), x, z, i * 1.7, .01); }
scene.add(R.merge(fixed));

// ---- 生きもの：小魚の群れ 4 つ・うみがめ 3 びき・かに・魚 ----
const P0 = path.getPointAt(.03), live = [], add = (o, f) => { scene.add(o); live.push(t => { f && f(o, t); o.userData.tick(t); }); return o; };
const circ = (cx, cy, cz, rx, rz, sp, ph = 0, bob = .3) => (o, t) => { const a = t * sp + ph; o.position.set(cx + Math.cos(a) * rx, cy + Math.sin(t * .6 + ph) * bob, cz + Math.sin(a) * rz); o.rotation.y = Math.atan2(-Math.sin(a) * rx * sp, Math.cos(a) * rz * sp); };
const GOLD = ['#fff2a8', '#ffffff', '#ffd870'];
[[.06, 60, 3.4, 1.5], [.3, 44, 4, -1.3], [.55, 50, 3.2, 1.4], [.8, 44, 4.4, -1.2]].forEach(([u, n, y, sp], i) => { const p = path.getPointAt(u); add(S.school({ n, rx: 5.5, rz: 3.6, h: 2.2, wide: 1.3, speed: sp, spread: 1.8, seed: i * 3, tints: GOLD })).position.set(p.x, y, p.z); });
add(S.school({ n: 26, kind: 'butter', rx: 3.4, rz: 2.6, h: 1.2, speed: 1, s: .8, spread: 1.6, seed: 9 })).position.set(P0.x + 9, 2.4, P0.z - 4);
const turtle = S.turtle({ s: 1.5, c: '#7a9a4a' }); scene.add(turtle);   // うみがめは、主役の少し前をいく
add(S.turtle({ s: 1.1, c: '#a8904a' }), circ(P0.x + 7, 5.2, P0.z - 2, 5, 3.4, .2, 2.2, .4)); add(S.turtle({ s: .9 }), circ(path.getPointAt(.5).x, 4, path.getPointAt(.5).z, 5, 4, -.2, 1, .4));
add(S.fish({ kind: 'grouper', s: .8, c: '#c8903a' }), circ(P0.x + 12, 1.6, P0.z - 4, 2.6, 1.6, -.25, 1)); add(S.fish({ kind: 'angel', seed: 2 }), circ(P0.x + 4, 2.4, P0.z - 5.4, 1.4, .8, .5, 2, .2)); add(S.fish({ kind: 'parrot', seed: 3, c: '#e8843a', c2: '#f4e0a0' }), circ(path.getPointAt(.2).x, 2, path.getPointAt(.2).z, 2.4, 1.6, .5, 2));
for (let i = 0; i < 4; i++) { const u = [.045, .075, .11, .4][i], p = path.getPointAt(u), tg = path.getTangentAt(u), sd = i % 2 ? 1 : -1, c = S.crab({ s: 1.7, c: i % 2 ? '#f0a03a' : '#e8553a' }), x0 = p.x + tg.z * 1.7 * sd, z0 = p.z - tg.x * 1.7 * sd; add(c, (o, t) => { const s = Math.sin(t * .5 + i * 2) * 1.1; o.position.set(x0 + tg.x * s, H(x0 + tg.x * s, z0 + tg.z * s), z0 + tg.z * s); o.rotation.y = Math.atan2(tg.z, -tg.x) + 1.57; }); }

// ---- 主役：泳ぐダイバー（白い服に赤。昆布の緑に負けない色） ----
const hero = S.diver({ tank: '#e8443a', fin: '#f0503a', actor: { hairStyle: 'tufts', hair: '#3a2a22', top: '#f6f2e8', top2: '#e8443a', bottom: '#e8443a', glove: '#e8443a', shoe: '#a02a26', belt: '#f4d23a' } }); scene.add(hero);
const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
const cd = new THREE.Vector3(), SPEED = 1.5; let dist = .03 * LEN, first = true, hy = 2;
K.loop((dt, t) => {
  dist += SPEED * dt; const u = (dist / LEN) % 1, p = path.getPointAt(u), tg = path.getTangentAt(u), gy = H(p.x, p.z) + 1.8 + Math.sin(t * .5) * .2; hy += (gy - hy) * Math.min(1, dt * 2);
  hero.position.set(p.x, hy, p.z); hero.rotation.y = Math.atan2(tg.x, tg.z); S.swim(hero, t); S.breathe(hero, env.bubbles, dt);
  if (first) { cd.copy(tg); first = false; } cd.lerp(tg, 1 - Math.exp(-dt * 1.3)).normalize(); const tall = innerWidth < innerHeight, D = tall ? 3 : 3.3, Sd = tall ? .7 : 1.3;
  cam.position.set(p.x - cd.x * D + cd.z * Sd, hy + (tall ? 1.2 : .85), p.z - cd.z * D - cd.x * Sd); cam.lookAt(p.x + cd.x * 2.2, hy + (tall ? .8 : .6), p.z + cd.z * 2.2);
  const u2 = ((dist + 3.6 + Math.sin(t * .23) * .5) / LEN) % 1, q = path.getPointAt(u2), tq = path.getTangentAt(u2); turtle.position.set(q.x - tq.z * .9, H(q.x, q.z) + 2.7 + Math.sin(t * .4) * .3, q.z + tq.x * .9); turtle.rotation.y = Math.atan2(tq.x, tq.z) + Math.sin(t * .3) * .15; turtle.userData.tick(t);
  sun.position.set(p.x - 8, 40, p.z + 6); sun.target.position.set(p.x, 0, p.z);
  for (const f of live) f(t); bed.follow(p.x, p.z); bed.tick(t); env.tick(t, cam, dt); crt.render(scene, cam, t);
});
</script>
