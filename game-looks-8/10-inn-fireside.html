<title>8-10 宿屋の中 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#ffe8c8;opacity:.9;text-shadow:0 1px 0 #000}
</style>
<div id="cap">8-10 ─ 宿屋の中 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="pack-fantasy-town.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 夜の宿屋の広間。石の暖炉の火がゆらぎ、板の床と木組みのかべを だいだいに照らす。丸いテーブルで客が食事をし、カウンターの奥に主人、たなにはびん、わきに たると階段。
// 色の組は「木の茶・しっくいのクリーム色・火のだいだい」＋差し色は窓の夜の青と、旅人のマントの青。面の少ない形にドット絵のテクスチャをはり、粗い絵に描いてブラウン管に映す。
// 主役は入ってきた旅人（R.actor の toon。青いマント）。広間をまわって暖炉のそばへ歩き、カメラは部屋の中の少し高い所から追う。部屋・暖炉・家具・ランプは pack-fantasy-town.js（F.〜）
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), F = PACK_FTOWN(THREE, K, R), T = R.tex, { hash } = K;
const { scene, cam, renderer, onResize } = K.stage({ fov: 52, far: 200, aa: false, fitAspect: .9, maxFov: 80 });
scene.background = new THREE.Color('#1c1210');
const { sun } = K.lights(scene, renderer, { sky: 0xffd0a0, ground: 0x7a5038, amb: 1.0, sun: 0xffc48c, power: .9, range: 12 }); sun.position.set(3, 16, 9); sun.target.position.set(0, 0, -1);

// ---- 部屋（手前の面はあけてある。カメラはその内がわ）と、暖炉・カウンター・たな・たる・階段 ----
const RW = 13, RD = 10, RH = 3.6, BZ = -RD / 2, fixed = [], put = (o, x, z, ry = 0, y = 0) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
put(F.room({ w: RW, d: RD, h: RH, wall: '#e2c898', wins: [-.3, 6.1 - 5.2] }), 0, 0);
const fire = F.fireplace({ w: 2.7, h: RH, power: 30, range: 13 }); fire.position.set(-3.7, 0, BZ); scene.add(fire);
put(F.counter({ w: 3.6 }), 3.3, -2.6); put(F.shelf({ w: 3.2, h: 1.7, kind: 'bottles' }), 3.3, BZ, 0, 1.15); put(F.shelf({ w: 1.6, h: 2, kind: 'mix', seed: 2 }), -RW / 2, .2, Math.PI / 2);
put(F.keg(), 5.9, -3.9, -Math.PI / 2); put(F.keg({ c: '#8a5a3a' }), 5.9, -2.8, -Math.PI / 2); put(R.barrel(), 5.8, -1.7); put(R.barrel({ h: .8, r: .32 }), -5.8, -4.2, 1); put(R.crate({ s: .7 }), -5.8, 3.2, .2);
put(F.stairs({ w: 1.5, h: RH - .1, d: 4.6, tex: T.planks({ c: '#8a6444' }), rail: 'wood' }), 5.7, 1.5);
const lamps = [[.2, -1.5], [-3, 1.9]].map(([x, z]) => { const l = F.hangLamp({ drop: .7, light: true, power: 11, range: 9 }); l.position.set(x, RH - .24, z); scene.add(l); return l; });
// テーブルといす、暖炉の前の じゅうたん、皿とジョッキ、入口の とびら
put(F.table({ w: 1.5, round: true }), .2, -1.5); put(F.chair(), -.95, -1.5, Math.PI / 2); put(F.chair(), 1.35, -1.5, -Math.PI / 2); put(F.stool(), .2, -2.6);
put(F.table({ w: 1.7, d: .9 }), 2.5, 1.5); put(F.chair(), 2.5, .75, 0); put(F.chair(), 2.5, 2.25, Math.PI);
put(F.chair({ c: '#6a4a34' }), -5, -2.6, 2.5); put(F.chair({ c: '#6a4a34' }), -2.2, -2.7, -2.5); put(F.stool(), -1.9, 3.4);
{ const B = R.parts(), Mg = B.g(T.barrel({ c: '#a8845a' })), Pl = B.g(T.goods({ fc: ['#e8c070', '#c8703a', '#8ab84a'] })), Bd = B.g(T.goods({ fc: ['#e2503c', '#f2d24a'] }));
  const mug = (x, y, z) => Mg.loft(6, [[y, .055, .055, 0, .8, x, z], [y + .14, .06, .06, 1, 1.05, x, z]], { cap: 'top' }), plate = (G, x, y, z, r = .16) => G.loft(8, [[y, r, r, 0, 1, x, z]], { cap: 'top', capRect: true, capH: .03 });
  plate(Pl, -.15, .79, -1.5); plate(Bd, .55, .79, -1.45); mug(-.1, .78, -1.1); mug(.6, .78, -1.85); plate(Pl, 2.5, .79, 1.3); mug(2.9, .78, 1.6); mug(2.6, 1.08, -2.6); mug(3.9, 1.08, -2.5); plate(Bd, 4.4, 1.09, -2.7, .2);
  B.g(F.tex.carpet({ c: '#a83a40' }), { offset: true }).quad([-5.2, .03, -1.5], [-2.2, .03, -1.5], [-2.2, .03, -3.6], [-5.2, .03, -3.6], [0, 0, 1, .7]);
  B.g(T.door({ arch: 1, c: '#6a4a34' }), { offset: true }).quad([-RW / 2 + .05, 0, 2.2], [-RW / 2 + .05, 0, 3.5], [-RW / 2 + .05, 2.3, 3.5], [-RW / 2 + .05, 2.3, 2.2]);
  const g = B.group(); g.traverse(q => { q.castShadow = false; }); fixed.push(g); }
scene.add(R.merge(fixed));

// ---- 人・ねこ（人は 5 頭身の toon。どれもこの場面のためのオリジナル） ----
const act = (o, x, z, ry, y = 0) => { const p = R.actor({ build: 'toon', ...o }); p.position.set(x, y, z); p.rotation.y = ry; scene.add(p); return p; };
// いすにすわる：こしを いすの高さへ下げ、ももを前へ、ひざから下を下へ（R.idle のあとに毎コマ）
const seat = (p, x, z, ry) => { const D = p.userData.build; p.position.set(x + Math.sin(ry) * .12, .47 - (D.thigh + D.shin + (D.foot || 0)), z + Math.cos(ry) * .12); p.rotation.y = ry; return p; };
const sitPose = p => { const J = p.userData.J; J.legL.rotation.x = J.legR.rotation.x = -1.5; J.shinL.rotation.x = J.shinR.rotation.x = 1.5; };
const hero = act({ hairStyle: 'short', hair: '#d8b060', eye: '#3a6a9a', mouth: 'smile', cloth: 'jacket', top: '#5a7a5a', top2: '#f0e4c0', bottom: '#6a5a48', shoe: '#5a4030', gloves: 'glove', glove: '#8a5a34', neck: 'cape', skirtC: '#3f6aa8', back: 'bag', acc: '#c8a05a' }, 0, 0, 0);
const keeper = act({ hairStyle: 'bald', hair: '#6a4a3a', beard: 'mustache', brow: 'thick', mouth: 'smile', cloth: 'vest', top: '#8a4a3a', top2: '#f0e8d8', bottom: '#4a4038', bulk: 1.2 }, 3.3, -3.5, 0); F.wear(keeper, 'apron', { c: '#f0e8d8' });
const g1 = seat(act({ hairStyle: 'spiky', hair: '#8a3a2a', mouth: 'open', cloth: 'tunic', top: '#c8843a', top2: '#f0e4c0', bottom: '#5a4a3a', shoe: '#5a4030' }, 0, 0, 0), -.95, -1.5, Math.PI / 2);
const g2 = seat(act({ sex: 'f', hairStyle: 'bob', hair: '#3a2a30', mouth: 'smile', blush: true, cloth: 'tunic', top: '#7a4a7a', top2: '#f0d890', lower: 'skirt', skirt: .6, shoes: 'shoe', shoe: '#5a4030' }, 0, 0, 0), 1.35, -1.5, -Math.PI / 2);
const g3 = seat(act({ hairStyle: 'bald', hair: '#e8e8e8', beard: 'beard', eyes: 'closed', brow: 'thick', cloth: 'robe', top: '#6a6a4a', top2: '#e8d8a0', skirt: .8, shoe: '#5a4030' }, 0, 0, 0), -5, -2.6, 2.5);
const g4 = seat(act({ hairStyle: 'tufts', hair: '#4a4a5a', eyes: 'half', mouth: 'line', cloth: 'armor', top: '#8a8a98', top2: '#c8a84a', bottom: '#4a4a5a', gloves: 'gauntlet', glove: '#8a8a98', shoe: '#4a4a58', shoulder: 'left', gear: '#a8a8b8' }, 0, 0, 0), 2.5, 2.25, Math.PI);
const maid = act({ sex: 'f', hairStyle: 'tail', hair: '#c8843a', mouth: 'smile', blush: true, cloth: 'tunic', top: '#4a7a6a', top2: '#f8f0e0', lower: 'skirt', skirt: .7, skirtC: '#6a4a3a', shoes: 'shoe', shoe: '#5a4030' }, 0, 0, 0); F.wear(maid, 'apron', { len: .3 }); F.wear(maid, 'basket', { fc: ['#e8c070', '#c8703a'] });
const cat = R.cat({ c: '#e8a050' }); cat.position.set(-3.1, 0, -2.3); cat.rotation.y = -2.6; scene.add(cat);
const cat2 = R.cat({ c: '#4a4a54', belly: '#e8e4dc' }); scene.add(cat2);

// ---- 主役の道（入口 → 暖炉のそば → テーブルのあいだ → カウンターの前 → 入口） ----
const path = new THREE.CatmullRomCurve3([[3.8, 2.9], [0, 3.1], [-3.4, 2.4], [-4.5, .2], [-3.7, -1.5], [-1.9, -1.2], [.2, 0], [2.3, -.5], [4.1, -1.5], [4.5, .6]].map(([x, z]) => new THREE.Vector3(x, 0, z)), true, 'centripetal');
const LEN = path.getLength(), SPEED = 1.5, cp = new THREE.Vector3(), look = new THREE.Vector3(), fx = K.fx(scene, 30), cl = (v, a, b) => Math.max(a, Math.min(b, v));
const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
let first = true, sm = 0;
K.loop((dt, t) => {
  const dist = t * SPEED + 4.5, u = (dist / LEN) % 1, p = path.getPointAt(u), tg = path.getTangentAt(u);
  hero.position.copy(p); hero.rotation.y = Math.atan2(tg.x, tg.z); R.walk(hero, dist * 3.6);
  // カメラ：手前の高い所から。かべの外に出ないように位置をおさえる
  const tall = innerWidth < innerHeight, tx = cl(p.x * .72 + .3, -5, 4), tz = Math.min(RD / 2 - .35, p.z + (tall ? 3.2 : 3.8)), k = first ? 1 : 1 - Math.exp(-dt * 2.2); first = false;
  cp.x += (tx - cp.x) * k; cp.z += (tz - cp.z) * k; cp.y = tall ? 2.2 : 2.3; cam.position.copy(cp); look.x += (p.x - look.x) * k; look.z += (p.z - 1.4 - look.z) * k; cam.lookAt(look.x, 1.15, look.z);
  // 客・主人・給仕・ねこ
  for (const [g, ph] of [[g1, 0], [g2, 1.7], [g3, 3], [g4, 4.4]]) { R.idle(g, t + ph, Math.sin(t * .5 + ph) * .3); sitPose(g); }
  for (const [g, ph, s] of [[g1, 0, 1], [g2, 1.7, -1], [g4, 4.4, 1]]) { const J = g.userData.J, e = Math.max(0, Math.sin(t * 1.3 + ph)); J.armR.rotation.x = -.7 - e * .7; J.foreR.rotation.x = -1 - e * .9; J.armL.rotation.x = -.6; J.foreL.rotation.x = -.9; }
  R.idle(keeper, t, Math.sin(t * .4) * .5); keeper.userData.J.armR.rotation.x = -.9; keeper.userData.J.foreR.rotation.x = -1 + Math.sin(t * 3) * .25; keeper.userData.J.armR.rotation.z = Math.sin(t * 3) * .2;
  const mk = (t * .07 + .1) % 1, go = mk < .5, q = go ? mk * 2 : 2 - mk * 2; maid.position.set(1.2 - q * 3, 0, -3.4); maid.rotation.y = go ? -Math.PI / 2 : Math.PI / 2; R.walk(maid, t * 5, .7);
  R.catPose(cat, 'sit', t); const ca = t * .35; cat2.position.set(-1.6 + Math.cos(ca) * 1.5, 0, 3.6 + Math.sin(ca) * .55); cat2.rotation.y = Math.atan2(-Math.sin(ca) * 1.5, Math.cos(ca) * .55); R.catPose(cat2, 'walk', t * 1.4);
  // 火とあかりのゆらぎ、火の粉
  F.tick(t); lamps.forEach((l, i) => { l.userData.light.intensity = 11 * (.92 + .06 * Math.sin(t * 7 + i * 2) + .04 * Math.sin(t * 17.3 + i)); });
  if ((sm += dt) > .35) { sm = 0; fx.emit('smoke', -3.7 + (Math.random() - .5) * .5, .7, BZ + .6, { size: .14, life: 1.1, vy: .9, grow: .4, spread: .3, tint: '#ffc060', add: true }); }
  fx.update(dt); crt.render(scene, cam, t);
});
</script>
