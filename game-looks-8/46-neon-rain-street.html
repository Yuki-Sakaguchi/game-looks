<title>8-46 雨のネオン街を かっぱで歩く 描きこんだテクスチャとブラウン管</title>
<style>

canvas{display:block}

<div id="cap">8-46 ─ 雨のネオン街を かっぱで歩く / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="pack-city.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// テイスト B。鉄の都市の下町の、雨の夜の通り。鉄板の天井の長いすき間から雨がふり、ぬれた路面に ネオンの看板が長く映る。
// 色の組は「紺（路面・かべ・かすみ）」＋ネオンの 3 色「もも・水色・黄緑」だけ。電球のだいだいは屋台の中だけにして、色をにごらせない。
// 主役は黄色いかっぱの子（子どもの大きさ）。うしろから追うカメラ。かさ・かっぱのフードはページの中で作る。部品は retro.js（R.〜）と pack-city.js（C.〜）
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), C = PACK_CITY(THREE, K, R), T = R.tex, X = C.tex, { hash } = K, PI = Math.PI;
R.cfg.actorBuild = 'toon';
const PK = '#ff5aa8', CY = '#4ae0f0', GR = '#b4f04a', NAVY = '#2c3a70';
const { scene, cam, renderer, onResize } = K.stage({ fov: 46, far: 900, aa: false, fitAspect: .9, maxFov: 76 });
scene.background = new THREE.Color(NAVY); scene.add(C.dome({ r: 420, c: '#1c2450', haze: NAVY, lights: [CY, PK, '#cfe0ff', GR, '#cfe0ff'] }), C.backdrop({ r: 200, h: 38, y: -3, c: '#28306a', haze: NAVY })); scene.fog = new THREE.Fog(NAVY, 26, 150);
const { sun } = K.lights(scene, renderer, { sky: 0x8aa8f0, ground: 0x4a5a98, amb: 1.6, sun: 0xbcd0ff, power: .6, range: 26 }), SUN = new THREE.Vector3(.2, .9, .3).normalize();

// ---- 店の区画と、ネオンの一覧（地面に焼きこむ色・路面の映りこみ） ----
const WD = [4.6, 5.6, 4.2, 6, 5], KIND = ['window', 'noren', 'shutter', 'open', 'window', 'noren', 'door'], NC = [PK, CY, GR], ICON = ['moon', 'cup', 'fish', 'star', 'heart', 'bottle', 'wave', 'ring', 'eye', 'zig'], LOTS = [], lights = [], streaks = [];
for (const s of [-1, 1]) for (let x = -50, i = 0; x < 50; i++) { const w = WD[(i + (s > 0 ? 2 : 0)) % 5], n = LOTS.length; LOTS.push({ x: x + w / 2, s, w, i: n, kind: KIND[(n * 3 + (s > 0 ? 1 : 0)) % 7], nc: NC[(i + (s > 0 ? 1 : 0)) % 3] }); x += w + .25; }
for (const l of LOTS) { lights.push({ x: l.x, z: l.s * 2.3, r: 4.6, c: l.nc, k: .8 }); streaks.push({ x: l.x, z: l.s * 2.9, h: 3.6, c: l.nc, k: .95, w: 1.5 }); }
const SIDE = []; for (let x = -42, i = 0; x <= 44; x += 6.5, i++) SIDE.push([x, i % 2 ? 1 : -1, NC[(i + 2) % 3], ICON[(i + 4) % 10], i]);   // 通りへ つき出す そで看板
for (const [x, s, c] of SIDE) { lights.push({ x, z: s * 1.4, r: 3.6, c, k: .6 }); streaks.push({ x, z: s * 1.8, h: 4.4, c, k: .8, w: .8 }); }
const YT = [[-4.5, -2.35, 0], [13, 2.35, PI]]; for (const [x, z] of YT) lights.push({ x, z: z * .6, r: 3.6, c: '#ffc890', k: .7 });
const land = R.ground({ w: 150, d: 40, cell: 1.5, layers: [X.asphalt({ wet: 1, c: '#3e4670', wetC: '#5a78c8' }), X.conc({ c: '#7c84a4' }), X.plate({ c: '#5a6490', n: 2 })], mix: (x, z) => [Math.abs(z) > 2.75 ? 1 : 0, Math.abs(z) < 2.6 && hash(Math.round(x / 7), Math.round(z / 3)) > .82 ? 1 : 0], shade: C.lightShade(lights, [.5, .56, .86]) });
scene.add(land.mesh);

// ---- 店：つぎはぎの家。かべの色も紺・青ねずに寄せて、ネオンだけを目立たせる ----
const fixed = [], put = (o, x, z, ry = 0, y = 0) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; }, CS = ['#4a5a94', '#3f6a8a', '#6a6aa0', '#5a7090', '#6a5a80', '#8a90b0'];
for (const { x, s, w, i, kind, nc } of LOTS) { const fl = 2 + (hash(i, 3) > .55 ? 1 : 0), shp = ['wide', 'sq', 'tall'][i % 3];
  put(C.shack({ w, d: 4.6, floors: fl, seed: i + 21, cs: CS, shop: kind, shopC: ['#2f4a8a', '#3a3a7a', '#2f6a7a'][i % 3], goods: ['food', 'goods', 'parts'][i % 3], lit: .8, awning: kind === 'shutter' ? false : i % 2 ? 'tin' : ['#3a4a9a', '#2f7a8a'][i % 4 >> 1], laundry: false,
    sign: { kind: shp === 'wide' && i % 2 ? 'glyphs' : ICON[i % 10], c: nc, c2: NC[(i + 1) % 3], shape: shp, side: i % 2 ? 1 : -1, flicker: i % 7 === 3 } }), x, s * 5.2, s > 0 ? PI : 0); }
const signs = SIDE.map(([x, s, c, kind, i]) => { const tall = i % 3 !== 1, n = C.neon({ kind, c, c2: NC[(i + 1) % 3], shape: tall ? 'tall' : 'sq', w: tall ? .7 : 1.3, two: true, seed: i + 5, flicker: i === 4 }); n.position.set(x, 3.1 + (i % 2) * .6, s * (2.9 - (tall ? .5 : .8))); n.rotation.y = PI / 2; fixed.push(n); return n; });
{ const G = R.geo(), tp = X.plate({ c: '#4a5280' }); for (const [x, s, , , i] of SIDE) G.box(.06, .06, 1.1, x, 3.1 + (i % 2) * .6 + (i % 3 !== 1 ? 2.1 : 1.3), s * 2.4, { m: 3 }); fixed.push(G.mesh(tp)); }

// ---- 通りの物：屋台（湯気）・自動販売機・電柱と電線・街灯・ドラムかん・木箱・自転車・マンホール。頭の上の配管と、すき間をまたぐ鉄骨 ----
YT.forEach(([x, z, ry], i) => put(C.yatai({ c: ['#3a4a9a', '#2f7a8a'][i], c2: '#e8f0ff', kind: ['wave', 'ring'][i], noren: ['#2f4a8a', '#3a3a7a'][i], seed: i }), x, z, ry));
put(C.vending({ c: '#dce6f4' }), 7.2, -2.55); put(C.vending({ c: '#4a8ad0' }), 8.3, -2.55); put(C.vending({ c: '#e86a9a' }), -13.5, 2.55, PI); put(C.drum({ c: '#3f6a8a' }), 1.6, -2.5); put(C.drum({ c: '#6a6aa0', mark: 'band' }), 2.3, -2.6); put(R.crate({ s: .6 }), 4.2, 2.45, .3); put(R.crate({ s: .5, kind: 'x' }), -8.5, -2.5, .5);
put(C.bike({ c: '#4ac0d0' }), 18.5, -2.55, .08); put(C.trash({ kind: 'bin', c: '#3f6a8a' }), -1.2, 2.5); put(C.trike({ c: '#4a5a94' }), 23, 2.3, PI - .15); put(C.bench({}), -17, -2.6); put(C.tires({ n: 2 }), 10.5, 2.5);
for (const [x, z, k] of [[-10, .5, 'round'], [3, -.7, 'grate'], [15, .6, 'round'], [26, -.4, 'plate']]) put(C.manhole({ kind: k }), x, z);
const POLES = [[-30, -2.8], [-8, 2.8], [14, -2.8], [36, 2.8]].map(([x, z]) => put(C.pole({ h: 7.4, lamp: false }), x, z, PI / 2)), tip = (p, k) => { const a = p.userData.tips[k]; return [p.position.x - a[2], a[1], p.position.z + a[0]]; };
scene.add(C.wires(POLES.slice(0, -1).flatMap((p, i) => [0, 1, 2, 3].map(k => [tip(p, k), tip(POLES[i + 1], k ^ 1), 1.1 + k * .15])), { c: '#141a3a' }));
const lamps = [[-20, -2.75, 0], [0, 2.75, PI], [21, -2.75, 0]].map(([x, z, ry], i) => put(C.streetLamp({ h: 4.6, cold: true, light: i === 1, power: 12, range: 9 }), x, z, ry + PI / 2));
fixed.push(C.pipe([[-58, 8.2, -2.7], [58, 8.2, -2.7]], .34, { c: '#5a6aa0', joint: 6 }), C.pipe([[-58, 7.4, 2.75], [58, 7.4, 2.75]], .2, { c: '#3f6a8a', joint: 5, band: '#dce6f4' }));
for (let x = -40; x <= 48; x += 16) { const t = C.truss({ len: 16, h: 1.5, w: 1, c: '#4a5488' }); t.rotation.y = PI / 2; t.position.set(x, 12.2, 0); fixed.push(t); }
scene.add(R.merge(fixed));
scene.add(C.pools([...lamps.map(l => ({ p: [l.position.x, 0, l.position.z * .7], r: 3, c: '#bfe0ff', k: .45 })), ...SIDE.map(([x, s, c]) => ({ p: [x, 2.6, s * 2.88], n: [0, 0, -s], r: 2.4, c, k: .45 }))]), C.streaks(streaks, { far: 52 }));

// ---- 天井（通りの上が長いすき間）・遠くの柱・雨 ----
scene.add(C.ceiling({ w: 256, d: 112, y: 14, c: '#34407a', leak: .5, hole: (x, z) => Math.abs(z) < 4 }));
scene.add(R.merge([[70, -3, 5.5], [-74, 2, 5.5], [40, -60, 5], [-30, 66, 5.5]].map(([x, z, r], i) => { const p = C.pillar({ r, h: 30, seed: i, c: '#5a64a0', emissive: '#28306a', lm: 60 }); p.position.set(x, 0, z); return p; })));
scene.add(C.rain({ n: 620, box: [22, 11, 22], speed: 17, slant: [.1, .05], c: '#cfe0ff', a: .55 }));

// ---- 人・ねこ ----
// かさ：8 角のかさと柄（人の根もとに付ける）。かっぱのフード：頭をうしろから つつむ とがった ずきん
const umbrella = (who, c, c2) => { const g = new THREE.Group(), G = R.geo(); G.loft(8, [[0, .64, .64, 0, .78], [.1, .5, .5, .4, .95], [.2, .26, .26, .8, 1.05], [.26, .02, .02, 1, 1.1]], { ur: 4 }); const M = R.geo(); M.box(.035, .95, .035, 0, -.82, 0, { m: .5 }); M.box(.03, .1, .03, 0, .25, 0, { m: .5 }); g.add(G.mesh(T.fabric({ c, c2, pattern: 'stripe' }), { side: true }), M.mesh(T.metal({ c: '#8a90a8' })));
  const k = who.scale.y || 1; g.position.set(.2, who.userData.height / k + .1, .12); who.add(g); who.userData.umb = true; return who; };
const umbPose = w => { const J = w.userData.J; J.armR.rotation.set(-1.25, 0, .25); J.foreR.rotation.x = -1.2; };
const hero = R.actor({ sex: 'f', hairStyle: 'bob', hair: '#3a2a34', mouth: 'smile', blush: true, cloth: 'coat', sleeve: 'long', top: '#f2c81e', top2: '#fff0a0', lower: 'shorts', bottom: '#f2c81e', belt: false, shoes: 'boot', shoe: '#e84a8a', gloves: 'none', back: 'bag', acc: '#4ac0d0', s: .76 }); scene.add(hero);
{ const G = R.geo().smooth(1), rings = [[-.03, .15, .16, 0, .8, 0, -.03], [.1, .185, .2, .3, .95, 0, -.03], [.24, .17, .19, .65, 1.05, 0, -.04], [.36, .03, .04, 1, 1.1, 0, -.1]]; G.loft(8, rings, { seg: [0, 3] }).loft(8, rings, { seg: [5, 8] }); hero.userData.J.head.add(G.mesh(T.fabric({ c: '#f2c81e', pattern: 'plain' }), { side: true, emissive: '#6a5200' })); }
const npc = (o, x, z, ry) => { const p = R.actor(o); p.position.set(x, 0, z); p.rotation.y = ry; scene.add(p); return p; };
const cook = npc({ hairStyle: 'short', hair: '#2a2a34', eyes: 'closed', beard: 'stubble', bulk: 1.1, cloth: 'tunic', top: '#e8f0ff', top2: '#3a4a9a', bottom: '#2f3a6a', hat: 'band', acc: '#e8f0ff' }, -4.5, -3.1, 0);
const guest = umbrella(npc({ sex: 'f', hairStyle: 'long', hair: '#5a3a5a', cloth: 'coat', top: '#7a5ab0', top2: '#e8e0ff', lower: 'skirt', skirt: .7, skirtC: '#3a3a7a', shoes: 'boot', shoe: '#2a2a44' }, -4.0, -1.45, PI - .15), PK, '#ffd0e6');
const walkers = [umbrella(npc({ hairStyle: 'short', hair: '#8a8a94', eyes: 'half', cloth: 'coat', top: '#3f5a8a', top2: '#c8d0e0', bottom: '#2f3450', shoes: 'shoe' }, 0, 0, 0), CY, '#e0fbff'), umbrella(npc({ sex: 'f', hairStyle: 'bun', hair: '#2a2a34', cloth: 'jacket', top: '#e8e4f4', top2: '#7a5ab0', lower: 'skirt', skirt: .8, skirtC: '#4a5a94', shoes: 'boot', shoe: '#3a3a5a' }, 0, 0, 0), GR, '#f0ffd0'), umbrella(npc({ hairStyle: 'tufts', hair: '#4a3428', cloth: 'jacket', top: '#2f7a8a', top2: '#e8f0ff', bottom: '#3a3a5a', shoes: 'boot', s: .95 }, 0, 0, 0), '#e8f0ff', '#8aa8f0')];
const cat = R.cat({ c: '#e8e4ec', belly: '#ffffff', plain: 1 }); cat.position.set(4.2, .6, 2.45); cat.rotation.y = -2.4; scene.add(cat); const cat2 = R.cat({ c: '#3a3a54', belly: '#dcdcf0' }); scene.add(cat2);
const mist = C.steam({ r: .6, rise: 2.4, n: 7, c: '#dce8ff', a: .32 }); mist.position.set(3, .08, -.7); scene.add(mist);
const follow = new THREE.PointLight('#fff0c8', 8, 8, 1.4), pk = new THREE.PointLight(PK, 10, 8, 1.5), cy = new THREE.PointLight(CY, 9, 8, 1.5); scene.add(follow, pk, cy);

// ---- 主人公：通りを東へ（はしの手前で、はじめの所へ もどる） ----
const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
const SPEED = 1.5, SPAN = 40, X0 = -14;
K.loop((dt, t) => {
  const d = (t * SPEED) % SPAN, x = X0 + d, z = Math.sin(x * .16) * .55, tall = innerWidth < innerHeight, D = tall ? 3.2 : 3.8;
  hero.position.set(x, 0, z); hero.rotation.y = PI / 2 - Math.cos(x * .16) * .09; R.walk(hero, t * SPEED * 6.4);
  cam.position.set(x - D, tall ? 1.75 : 1.8, z * .5 + .5); cam.lookAt(x + 4, tall ? 1.5 : 1.25, z * .4 - .15);
  crt.u.bright.value = Math.min(1, d / .5, (SPAN - d) / .5);
  sun.position.set(x + SUN.x * 50, SUN.y * 50, SUN.z * 50); sun.target.position.set(x, 0, 0); follow.position.set(x + 1.2, 2.4, z);
  pk.position.set(Math.round((x + 3) / 13) * 13, 2.8, -1.6); cy.position.set(Math.round((x + 9) / 13) * 13 - 6.5, 2.8, 1.6);
  R.idle(cook, t, Math.sin(t * .5) * .2); cook.userData.J.armR.rotation.x = -.9 - Math.sin(t * 3) * .15; cook.userData.J.foreR.rotation.x = -.8; R.idle(guest, t + 2, Math.sin(t * .6) * .15); umbPose(guest);
  walkers.forEach((w, i) => { const sp = [1.1, .95, 1.3][i], L = 60, ph = t * sp / L + [.57, .22, .86][i], k = ph % 2 < 1 ? ph % 1 : 1 - ph % 1, dd = (ph % 2 < 1 ? 1 : -1) * [-1, -1, 1][i]; w.position.set([1, 1, -1][i] > 0 ? 30 - k * L : -30 + k * L, 0, [-1.5, 1.7, -1.1][i]); w.rotation.y = dd * PI / 2; R.walk(w, t * sp * 4.6 + i, .8); umbPose(w); });
  R.catPose(cat, 'sit', t); const cu = (t * .9 / 40 + .35) % 1; cat2.position.set(-12 + cu * 40, 0, -2.45); cat2.rotation.y = PI / 2; R.catPose(cat2, 'walk', t * 9);
  C.update(t, cam); crt.render(scene, cam, t);
});
</script>
