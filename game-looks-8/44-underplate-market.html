<title>8-44 鉄板の下の市場通りを歩く 描きこんだテクスチャとブラウン管</title>

<div id="cap">8-44 ─ 鉄板の下の市場通りを歩く / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="pack-city.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// テイスト B。鉄の都市の下町：上の層を支える鉄板の天井と太い配管の下に、トタンと廃材の店がならぶ市場通り。空はなく、天井のつぎ目から上の層の光がもれる。
// 色の組は「青むらさきの鉄と かすみ」＋「さび赤・青みどり・からしのトタン」＋あかり（電球のだいだい、ネオンのもも・水色）。暗くしすぎず、あかりを地面に焼きこんで あたたかく。
// 主役は工具ベルトの若者。うしろから追うカメラ。部品は retro.js（R.〜）と pack-city.js（C.〜）
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), C = PACK_CITY(THREE, K, R), T = R.tex, X = C.tex, L = C.LIGHT, { hash } = K, PI = Math.PI;
R.cfg.actorBuild = 'toon';
const { scene, cam, renderer, onResize } = K.stage({ fov: 46, far: 900, aa: false, fitAspect: .9, maxFov: 76 }), HAZE = '#6e4c68';
scene.background = new THREE.Color(HAZE); scene.add(C.dome({ r: 420, haze: HAZE }), C.backdrop({ r: 200, h: 38, y: -3, haze: HAZE })); scene.fog = new THREE.Fog(HAZE, 30, 185);
const { sun } = K.lights(scene, renderer, { sky: 0x9a90d8, ground: 0x7a5248, amb: 1.5, sun: 0xdccaff, power: .75, range: 26 }), SUN = new THREE.Vector3(.25, .9, .3).normalize();

// ---- 店の区画（北がわ・南がわ）と、あかりの一覧 ----
const WD = [5, 4.4, 5.8, 4.6, 6.2, 4.2], KIND = ['noren', 'window', 'shutter', 'open', 'noren', 'door', 'window'], NEON = [L.pink, L.cyan, L.pink, L.amber, L.cyan, L.pink], ICON = ['cup', 'fish', 'gear', 'bottle', 'moon', 'star', 'wave', 'heart'], LOTS = [], lights = [], streaks = [];
for (const s of [-1, 1]) for (let x = -52, i = 0; x < 52; i++) { const w = WD[(i + (s > 0 ? 3 : 0)) % 6], n = LOTS.length; LOTS.push({ x: x + w / 2, s, w, i: n, kind: KIND[(n * 3 + (s > 0 ? 2 : 0)) % 7], nc: NEON[n % 6] }); x += w + .3 + (i % 4 === 3 ? 1.5 : 0); }
for (const l of LOTS) { if (l.kind !== 'shutter' && l.kind !== 'door') lights.push({ x: l.x, z: l.s * 3, r: 5.2, c: L.bulb, k: .8 }); if (l.kind !== 'door') { lights.push({ x: l.x, z: l.s * 2.4, r: 3.8, c: l.nc, k: .5 }); if (Math.abs(l.x) < 42 && l.i % 2) streaks.push({ x: l.x, z: l.s * 3.4, h: 3.4, c: l.nc, k: .55, w: 1.1 }); } }
for (let x = -44; x <= 44; x += 8) lights.push({ x, z: 0, r: 4.6, c: L.bulb, k: .38 }, { x: x + 4, z: 0, r: 4, c: '#ff8a3a', k: .3 });
const YT = [[-1.5, -2.75, 0, '#c2453a'], [10.5, 2.8, PI, '#2f7a8a'], [-20, 2.8, PI, '#c8a04a']]; for (const [x, z] of YT) lights.push({ x, z: z * .6, r: 4.2, c: L.bulb, k: .9 });
const land = R.ground({ w: 150, d: 44, cell: 1.5, layers: [X.asphalt({ wet: .45 }), X.conc({ c: '#9a948c' }), X.plate({ c: '#70748a', n: 2 })], mix: (x, z) => [Math.abs(z) > 3.1 ? 1 : 0, Math.abs(z) < 3 && hash(Math.round(x / 6), Math.round(z / 3)) > .78 ? 1 : 0], shade: C.lightShade(lights, [.56, .52, .66]) });
scene.add(land.mesh);

// ---- 店：つぎはぎの家（1〜3 階）。のれん・ショーウィンドウ・シャッター、ネオンの看板、室外機ふうの箱、貼り紙 ----
const fixed = [], put = (o, x, z, ry = 0, y = 0) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
for (const { x, s, w, i, kind, nc } of LOTS) { const fl = 1 + Math.floor(hash(i, 7) * 2.6), g = new THREE.Group(), shp = ['tall', 'wide', 'sq'][i % 3];
  g.add(C.shack({ w, d: 4.6, floors: fl, seed: i + 1, shop: kind, shopC: ['#2f4a8a', '#b8302a', '#2f7a5a', '#5a3a7a'][i % 4], goods: ['goods', 'food', 'parts'][i % 3], lit: .75, awning: kind === 'shutter' ? false : i % 3 === 0 ? 'tin' : ['#c2453a', '#2f7a8a', '#c8a04a'][i % 3], stairs: i % 7 === 3 ? 'r' : false,
    sign: kind === 'door' ? false : { kind: shp === 'wide' && i % 2 ? 'glyphs' : ICON[i % 8], c: nc, c2: i % 2 ? L.amber : L.cyan, shape: shp, side: i % 2 ? 1 : -1, flicker: i % 9 === 4 } }));
  if (fl > 1 && i % 2) { const a = C.acbox({ wall: true, fan: i % 4 === 1, seed: i }); a.position.set(-w / 2 + .8, 3.25, 2.5); g.add(a); }
  if (kind === 'shutter' || kind === 'door') for (let k = 0; k < 2; k++) { const p = C.poster({ kind: i + k, s: 1.1 }); p.position.set((kind === 'door' ? w * .22 : -.9) + k * .7, kind === 'door' ? 1.95 : 1.1 + k * .15, 2.36); g.add(p); }
  put(g, x, s * 5.9, s > 0 ? PI : 0); }

// ---- 頭の上：通りにそう太い配管とダクト、通りをわたる配管、高架の線路、裸電球とちょうちんの列 ----
fixed.push(C.pipe([[-58, 7.3, -2.5], [58, 7.3, -2.5]], .42, { c: '#6e7890', joint: 6 }), C.pipe([[-58, 6.5, 2.9], [58, 6.5, 2.9]], .26, { c: C.PAL[0], joint: 5, band: '#e8e4d8' }), C.duct([[-58, 8.3, .5], [58, 8.3, .5]], 1.2, .7, { joint: 4 }));
for (const [x, r, c] of [[-34, .5, C.PAL[1]], [-9, .36, '#6e7890'], [14, .5, C.PAL[2]], [39, .36, C.PAL[1]]]) fixed.push(C.pipe([[x, 15, -16], [x, 9.6, -16], [x, 9.6, 15], [x + 3, 9.6, 18], [x + 3, 15, 18]], r, { c, joint: 5, bend: 1.4 }), C.pipe([[x + 1.2, 15, -2.5], [x + 1.2, 7.3, -2.5]], .2, { c: '#6e7890' }));
{ const G = R.geo(), tp = X.plate({ c: '#4e4c5e' }); for (let x = -54; x <= 54; x += 9) { G.box(.1, 7.4, .1, x, 7.7, -2.5, { m: 3 }); G.box(.08, 8.3, .08, x + 3, 6.8, 2.9, { m: 3 }); G.box(.1, 6.2, .1, x + 5, 8.8, .5, { m: 3 }); } fixed.push(G.mesh(tp)); }
put(C.elevated({ len: 56, h: 8.6, posts: 28 }), 24, 0, PI / 2);
for (let x = -44, k = 0; x <= 44; x += 8, k++) { fixed.push(C.bulbs([x, 4.7, -3.5], [x, 4.7, 3.5], { n: 6, sag: .55, cs: k % 3 === 1 ? [L.bulb, L.pink, L.bulb, L.cyan] : [L.bulb] }), C.lanterns([x + 4, 4.9, -3.5], [x + 4, 4.9, 3.5], { n: 5, sag: .7, kinds: k % 2 ? ['red', 'white'] : ['red'] })); }

// ---- 通りの物：屋台（湯気）・ドラムかん・木箱・自動販売機・三輪の荷車・自転車・タイヤ・電柱と電線・街灯・マンホール ----
const yatai = YT.map(([x, z, ry, c], i) => put(C.yatai({ c, kind: ['wave', 'ring', 'dots'][i], noren: ['#2f4a8a', '#b8302a', '#2f7a5a'][i], seed: i }), x, z, ry));
put(C.drum(), 3.2, -3.0); put(C.drum({ c: '#c2453a', mark: 'band' }), 3.9, -3.15); put(C.drum({ c: C.PAL[2], mark: 'none' }), -8.6, 3.1); put(R.crate({ s: .7 }), 4.4, 3.0, .3); put(R.crate({ s: .55, kind: 'x' }), 5.1, 3.1, -.2); put(R.crate({ s: .6 }), -11.5, -3.1, .4);
put(C.vending({}), 15.8, -3.2); put(C.vending({ c: '#c2453a' }), -14.3, 3.2, PI); put(C.trike({}), 7, -2.9, .15); put(C.trike({ load: 'drum', c: '#c2453a' }), -25, -2.8, PI + .2); put(C.bike({}), 17.6, 3.05, PI - .1); put(C.bike({ c: '#c2453a' }), -6, -3.15, .1);
put(C.tires({ n: 3 }), 19.5, -3.1); put(C.tires({ kind: 'pile' }), -17, -3); put(C.trash({}), 1.8, 3.2); put(C.trash({ kind: 'bin', c: C.PAL[1] }), 27, 3.1); put(C.bench({}), 12.6, -3.3); put(C.scrap({ s: 1.1, seed: 1 }), 31, -3.2);
for (const [x, z, k] of [[0, 1.6, 'round'], [13, -.8, 'grate'], [-13, .4, 'plate'], [26, 1.2, 'round'], [-27, -1, 'grate']]) put(C.manhole({ kind: k }), x, z);
const POLES = [[-36, -3.45], [-12, 3.45], [12, -3.45], [36, 3.45]].map(([x, z]) => put(C.pole({ h: 7.2, lamp: false }), x, z, PI / 2)), tip = (p, k) => { const a = p.userData.tips[k]; return [p.position.x - a[2], a[1], p.position.z + a[0]]; };
scene.add(C.wires(POLES.slice(0, -1).flatMap((p, i) => [0, 1, 2, 3].map(k => [tip(p, k), tip(POLES[i + 1], k ^ 1), 1.1 + k * .15])), {}));
const lamps = [[-16, -3.4, 0], [6, 3.4, PI], [29, -3.4, 0]].map(([x, z, ry], i) => put(C.streetLamp({ h: 4.4, light: i < 2, power: 16, range: 10, flicker: i === 2 }), x, z, ry + PI / 2));
scene.add(R.merge(fixed));
// あかりが かべ・地面に落ちる輪と、ぬれた地面にのびるネオン
scene.add(C.pools([...lamps.map(l => ({ p: [l.position.x, 0, l.position.z * .72], r: 3.4, c: L.bulb, k: .55 })), ...YT.map(([x, z]) => ({ p: [x, 0, z * .45], r: 2.6, c: '#ffb868', k: .5 }))]), C.streaks(streaks, { far: 50 }));

// ---- 天井と遠景：鉄板の天井（すき間から光のすじ）と、都市を支える巨大な柱 ----
const HOLES = [[32, -4], [-16, 4], [48, 4], [72, -12], [-56, -4]], hole = (x, z) => HOLES.some(([hx, hz]) => Math.abs(x - hx) < 4 && Math.abs(z - hz) < 4);
scene.add(C.ceiling({ w: 256, d: 112, y: 15, cx: 16, leak: .7, hole })); for (const [x, z] of HOLES) { const s = C.shaft({ w: 7, h: 15.5, a: .26, lean: .06 }); s.position.set(x, 0, z); scene.add(s); }
scene.add(R.merge([[63, -1, 5.2], [-72, 1, 5.2], [44, -62, 5], [-28, 70, 5.5], [150, 44, 6], [150, -50, 6]].map(([x, z, r], i) => { const p = C.pillar({ r, h: 15.4, seed: i, c: '#6c6c92', emissive: '#342a50', lm: 60 }); p.position.set(x, 0, z); return p; })));
// 高架を走る電車（あかりの窓）
const train = new THREE.Group(); for (const dx of [-6.2, 6.2]) { const c = C.train({ lit: 1, len: 12, c: '#c2603a', seed: 2 }); c.position.x = dx; train.add(c); } train.rotation.y = PI / 2; scene.add(train);

// ---- 人・ねこ ----
const hero = R.actor({ sex: 'm', hairStyle: 'tufts', hair: '#4a3428', bangs: 'swept', brow: 'thick', mouth: 'smile', cloth: 'vest', top: '#3f8a8a', top2: '#f0e4c8', lower: 'baggy', bottom: '#6a5a4a', belt: '#8a5a2c', strap: true, gloves: 'glove', glove: '#a8743a', shoes: 'boot', shoe: '#4a3a30', hat: 'band', acc: '#e8892c', hold: 'wrench', s: 1.05 }); scene.add(hero);
{ const G = R.geo(); G.box(.1, .13, .07, -.17, -.06, .05, {}); G.box(.09, .15, .07, .18, -.08, .02, {}); G.box(.08, .1, .06, .02, -.05, -.13, {}); hero.userData.J.hips.add(G.mesh(T.crate({ kind: 'plain', c: '#a8743a' }))); }   // 工具ベルトの こしぶくろ
const npc = (o, x, z, ry) => { const p = R.actor(o); p.position.set(x, 0, z); p.rotation.y = ry; scene.add(p); return p; };
const cook = npc({ hairStyle: 'bald', hair: '#8a8a8a', eyes: 'closed', beard: 'mustache', bulk: 1.12, cloth: 'tunic', top: '#f0e8d8', top2: '#c2453a', bottom: '#4a4a5a', hat: 'band', acc: '#f0e8d8' }, -1.5, -3.55, 0), guest = npc({ sex: 'f', hairStyle: 'bob', hair: '#2a2a34', mouth: 'open', cloth: 'jacket', top: '#c8a04a', top2: '#f0e4c8', lower: 'skirt', skirt: .6, skirtC: '#5a3a5a', shoes: 'shoe', shoe: '#3a2a3a' }, -2.1, -1.75, PI - .2);
const walkers = [npc({ sex: 'f', hairStyle: 'bun', hair: '#6e4628', brow: 'soft', cloth: 'tunic', sleeve: 'long', top: '#b8506a', top2: '#f4ecd8', lower: 'skirt', skirt: .75, shoes: 'shoe', shoe: '#5a3a30', back: 'bag', acc: '#e8d8a0' }, 0, 0, 0), npc({ hairStyle: 'short', hair: '#b8b4b0', eyes: 'half', beard: 'beard', cloth: 'coat', top: '#5a6a8a', top2: '#d8d0c0', bottom: '#3a3a4a', shoes: 'shoe', hat: 'cap', acc: '#4a5a4a' }, 0, 0, 0)];
const kids = [npc({ hairStyle: 'spiky', hair: '#2a2a34', mouth: 'open', blush: true, cloth: 'overall', top: '#c2453a', top2: '#f4e8c8', lower: 'shorts', shoes: 'shoe', shoe: '#e8e0d0', s: .7 }, 0, 0, 0), npc({ sex: 'f', hairStyle: 'twin', hair: '#8a4a2a', mouth: 'open', blush: true, cloth: 'tunic', top: '#e8c040', top2: '#f4e8c8', lower: 'skirt', skirt: .5, skirtC: '#3f8a8a', shoes: 'shoe', s: .66 }, 0, 0, 0)];
const cat = R.cat({ c: '#e8a050', belly: '#f4ecd8' }); cat.position.set(4.4, .7, 3.0); cat.rotation.y = -2.2; scene.add(cat); const cat2 = R.cat({ c: '#3a3a44', belly: '#e8e4dc' }); scene.add(cat2);
// 蒸気：配管のつぎ目と、マンホール
const jets = [C.steam({ dir: [.2, -.5, 1], jet: 1, rise: 2.6, r: .5, n: 10, speed: .55, c: '#ffe8d8', a: .5 }), C.steam({ r: .6, rise: 2.6, n: 8, c: '#f0e0f0', a: .4 }), C.steam({ dir: [0, -.3, -1], jet: 1, rise: 2.2, r: .45, n: 9, speed: .5, c: '#e8e0ff', a: .45 })]; jets[0].position.set(8, 7.2, -2.1); jets[1].position.set(13, .1, -.8); jets[2].position.set(-10, 6.4, 2.6); scene.add(...jets);
const follow = new THREE.PointLight('#ffb468', 9, 9, 1.4); scene.add(follow);

// ---- 主人公の道（通りを東へ → はしで折り返して西へ） ----
const path = new THREE.CatmullRomCurve3([[-30, .8], [-12, .8], [8, .8], [30, .8], [32.4, 0], [30, -.8], [8, -.8], [-12, -.8], [-30, -.8], [-32.4, 0]].map(([x, z]) => new THREE.Vector3(x, 0, z)), true, 'centripetal');
const LEN = path.getLength(), SPEED = 2.1, S0 = 18 / LEN, cd = new THREE.Vector3(), cp = new THREE.Vector3();
const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
let first = true;
K.loop((dt, t) => {
  const dist = t * SPEED, u = (S0 + dist / LEN) % 1, p = path.getPointAt(u), tg = path.getTangentAt(u);
  hero.position.copy(p); hero.rotation.y = Math.atan2(tg.x, tg.z); R.walk(hero, dist * 4.4);
  if (first) { cd.copy(tg); first = false; } cd.lerp(tg, 1 - Math.exp(-dt * 1.5)).normalize(); const tall = innerWidth < innerHeight, D = tall ? 3.9 : 5.2;
  cp.set(p.x - cd.x * D, tall ? 2.1 : 2.2, p.z - cd.z * D - .5); cam.position.copy(cp); cam.lookAt(p.x + cd.x * 4, tall ? 1.6 : 1.35, p.z + cd.z * 4 + .3);
  sun.position.set(p.x + SUN.x * 50, SUN.y * 50, p.z + SUN.z * 50); sun.target.position.copy(p); follow.position.set(p.x + cd.x * 1.5, 2.6, p.z + cd.z * 1.5);
  // 歩く人・走る子ども・立ち話・ねこ・高架の電車
  walkers.forEach((w, i) => { const sp = [1.2, .9][i], ph = t * sp / 56 + [.63, .2][i], k = ph % 2 < 1 ? ph % 1 : 1 - ph % 1, d = ph % 2 < 1 ? 1 : -1; w.position.set(-28 + k * 56, 0, [-2.1, 2.3][i] * d); w.rotation.y = d * PI / 2; R.walk(w, t * sp * 4.6, .85); });
  kids.forEach((w, i) => { const ph = (t * 3.4 + 62 - i * 1.6) / 64, k = ph % 2 < 1 ? ph % 1 : 1 - ph % 1, d = ph % 2 < 1 ? 1 : -1; w.position.set(-32 + k * 64, 0, (1.9 + Math.sin(t * 1.3 + i) * .5) * d); w.rotation.y = d * PI / 2; R.walk(w, t * 11 + i, 1.25); });
  R.idle(cook, t, Math.sin(t * .5) * .2); cook.userData.J.armR.rotation.x = -.9 - Math.sin(t * 3) * .15; cook.userData.J.foreR.rotation.x = -.8; R.idle(guest, t + 2, Math.sin(t * .6) * .2);
  R.catPose(cat, 'sit', t); const cu = (t * .9 / 50 + .52) % 1; cat2.position.set(-22 + cu * 50, 0, -2.95); cat2.rotation.y = PI / 2; R.catPose(cat2, 'walk', t * 9);
  train.position.set(24, 8.6, ((t * 9 + 54.5) % 170) - 80);
  C.update(t, cam); crt.render(scene, cam, t);
});
</script>
