<script type="module">
// 夕方の、陽気な海賊の港町。だいだいの空の下、桟橋に赤いしまの帆の大きな船がとまり、岸には あかりのついた酒場ふうの店、たると木箱、ほした あみ、いかりと波の紋の のぼり。
// 色の組は「夕空のだいだい・海の青みどり・木の茶・帆の生成り」＋差し色の赤と、主役のバンダナの青緑。面の少ない形にドット絵のテクスチャをはり、粗い絵に描いてブラウン管に映す。
// 主役はバンダナの見習い水夫（R.actor の toon）。岸から桟橋の先まで歩いて折り返し、うしろからカメラが追う。帆船・桟橋・旗・あみは pack-fantasy-town.js（F.〜）
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), F = PACK_FTOWN(THREE, K, R), T = R.tex, { hash } = K;

// ---- 岸（石だたみ）と海。岸のふちは石がき、海は波のコマ送り ----
const PY = 1.2, land = R.ground({ w: 120, d: 60, cell: 2, cz: 29, H: (x, z) => z > 1.2 ? PY : -4, layers: [T.cobble({ c: '#b89c88' }), T.planks({ c: '#a07a4c', w: 8 }), T.grass({ c: '#7a9a4a', flowers: .2 })], mix: (x, z) => [0, z > 27 + Math.sin(x * .2) * 2 ? 1 : 0] }); scene.add(land.mesh);

{ const G = R.geo().normal([0, 1, 0]); for (let i = -4; i < 4; i++) for (let j = 0; j < 5; j++) { const x0 = i * 50, z0 = 1.4 - j * 50; G.quad([x0, 0, z0], [x0 + 50, 0, z0], [x0 + 50, 0, z0 - 50], [x0, 0, z0 - 50], [0, 0, 16, 16]); } const sea = new THREE.Mesh(G.build(), wm); sea.receiveShadow = true; scene.add(sea); }

{ const N = R.geo().normal([0, .4, 1]), W = R.geo(); for (const [x, z, ry, len] of [[-10, 6.5, .2, 5], [9, 11.6, -1.4, 4]]) { const c = Math.cos(ry), s = Math.sin(ry), a = [x - c * len / 2, z + s * len / 2], b = [x + c * len / 2, z - s * len / 2]; N.quad([a[0], PY + .25, a[1] + .5], [b[0], PY + .25, b[1] + .5], [b[0], PY + 2.1, b[1]], [a[0], PY + 2.1, a[1]], [0, 0, len / 1.2, 1.5]); for (const q of [a, b]) W.at(R.TR(q[0], PY, q[1])).loft(5, [[0, .07, .07, 0, .8], [2.25, .05, .05, 1.5, 1]], { cap: 'top' }).at(null); W.at(R.TR(x, PY + 2.1, z, ry, 0, Math.PI / 2)).loft(5, [[-len / 2 - .2, .04, .04, 0, .9], [len / 2 + .2, .04, .04, 2, 1]], {}).at(null); }

// ---- 主役の道（桟橋の先まで歩いて折り返し、岸の店の前をまわる） ----
