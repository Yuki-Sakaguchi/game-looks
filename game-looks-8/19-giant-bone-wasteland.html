<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>8-19 巨人の骨の荒野をゆく隊商 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#fff4dc;opacity:.9;text-shadow:0 1px 0 #6a2a1a}
</style>
<div id="cap">8-19 ─ 巨人の骨の荒野をゆく隊商 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="pack-fantasy-wild.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 面の少ない巨大なろっ骨のアーチと頭の骨に、手で打ったドット絵の骨のはだ（すじ・ひび・てっぺんのこけ）をはり、横 320 ドットの粗い絵に描いてブラウン管に映す。
// 色は かわいた赤土と、夕方の明るいだいだいの空、骨のクリーム色。差し色は旅人の青緑の上着と、骨のそばに咲く花。低い夕日で、骨の長い影が道に落ちる。
// 隊商（つえの旅人・荷車を引く仲間・荷を背負う仲間）が、ろっ骨のアーチの下の道を進む。野営のテントとかがり火、鳥、ミミナガ。部品は retro.js（R.〜）と pack-fantasy-wild.js（F.〜）
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), F = PACK_FWILD(THREE, K, R), T = R.tex, X = F.tex, { hash } = K, TAU = Math.PI * 2;
const { scene, cam, renderer, onResize } = K.stage({ fov: 46, far: 700, aa: false, fitAspect: .9, maxFov: 76 });
scene.add(R.skyDome([[0, '#e87a5c'], [.45, '#ffae68'], [1, '#ffe29a']], { r: 340 })); scene.fog = new THREE.Fog('#ffc284', 34, 170);
const { sun } = K.lights(scene, renderer, { sky: 0xffe4c0, ground: 0xc8805a, amb: 1.5, sun: 0xffd098, power: 2.5, range: 32 }), SUN = new THREE.Vector3(-.55, .52, .42).normalize();

// ---- 道の輪。pt(a, e) は道から外へ e m の点と進む向き、off(x, z) は道からのへだたり ----
const rr = a => 27 + 3 * Math.sin(2 * a) + 2 * Math.sin(3 * a + 1);
const pt = (a, e = 0) => { const r = rr(a) + e, a2 = a + .004, r2 = rr(a2) + e, x = Math.cos(a) * r, z = Math.sin(a) * r; return [x, z, Math.atan2(Math.cos(a2) * r2 - x, Math.sin(a2) * r2 - z)]; };
const off = (x, z) => Math.hypot(x, z) - rr(Math.atan2(z, x)), cl = v => Math.max(0, Math.min(1, v));
const HF = (x, z) => cl((Math.abs(off(x, z)) - 5) / 8) * (F.vn(x * .1, z * .1, 3) - .3) * 2.2;   // 道からはなれると、ゆるい起伏
// 骨のある場所（ろっ骨のアーチは道の上、頭の骨は道のわき）。そのまわりにだけ草と花が生える
const RIBS = [[.5, 9.5, 7.4, 5], [2.05, 8.6, 6.4, 4], [3.6, 10, 8, 5], [5.15, 8.8, 6.8, 4]], SKULLS = [[1.22, 7.8, 4.6, 1], [2.85, -7.2, 3.6, 0], [4.4, 7.4, 4.2, 0], [5.85, -7, 3.4, 1]].map(([a, e, s, horns]) => { const [x, z] = pt(a, e), [px, pz] = pt(a + .05); return { x, z, s, horns, ry: Math.atan2(px - x, pz - z) }; });
const CAMP = pt(1.02, -6), green = (x, z) => { const d = Math.abs(off(x, z)), a = (Math.atan2(z, x) + TAU) % TAU; let k = 0; for (const [ra] of RIBS) { const da = Math.abs(((a - ra + Math.PI + TAU) % TAU) - Math.PI); if (da < .27 && d > 2.4 && d < 7) k = 1; } for (const s of SKULLS) if (Math.hypot(x - s.x, z - s.z) < s.s * 1.5) k = 1; return k; };
const land = R.ground({ w: 190, d: 190, cell: 2, H: HF, layers: [T.dirt({ c: '#c4683c', pebbles: .6 }), T.dirt({ c: '#e6a66c', pebbles: .3, seed: 2 }), T.grass({ c: '#8aa84a', flowers: .5, fc: ['#ffffff', '#ffe27a', '#ff8fb0'] })],
  mix: (x, z) => [cl(1.3 - Math.abs(off(x, z)) / 1.5), green(x, z) && F.vn(x * .4, z * .4, 7) > .3 ? .85 : 0],
  shade: (x, z) => { const k = F.vn(x * .07, z * .07, 5); return [.9 + .2 * k, .86 + .2 * k, .84 + .14 * k]; } });
scene.add(land.mesh);

// ---- 動かない物：骨・岩山・枯れ木・草花・野営 ----
const fixed = [], put = (o, x, z, ry = 0, y = HF(x, z)) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
RIBS.forEach(([a, w, h, n], i) => { const [x, z, r] = pt(a); put(F.ribs({ n, w, h, gap: 3, r: .36, broken: i === 1 ? .3 : .12, lean: .7, spine: false, c: '#f0e2c0', seed: i + 2 }), x, z, r, -.15); });
SKULLS.forEach((s, i) => put(F.skull({ s: s.s, horns: !!s.horns, c: '#f0e2c0', seed: i }), s.x, s.z, s.ry, -.2));
for (let i = 0; i < 7; i++) { const [x, z, r] = pt(.9 + i * .88, (i % 2 ? -1 : 1) * (11 + hash(i, 1) * 7)); put(F.ribs({ n: 2 + (i % 2), w: 5 + hash(i, 2) * 3, h: 3 + hash(i, 3) * 2, gap: 2.2, r: .26, broken: .6, c: '#ecdcb8', seed: i + 20 }), x, z, r + hash(i, 4) * 2, -.2); }   // 遠くに半分うまった骨
for (let i = 0; i < 26; i++) { const a = hash(i, 5) * TAU, r0 = i < 6 ? 3 + hash(i, 6) * 7 : 58 + hash(i, 6) * 40, x = Math.cos(a) * r0, z = Math.sin(a) * r0, h = i < 6 ? 4 + hash(i, 7) * 4 : 8 + hash(i, 7) * 12;   // 岩山（とがった柱と台地）
  put(F.pillar({ h, r: h * (.2 + hash(i, 8) * .14), spire: i % 2 === 0, seed: i, c: '#d88458' }), x, z, i, HF(x, z) - .5); }
const free = (x, z, m) => Math.abs(off(x, z)) > m && Math.hypot(x - CAMP[0], z - CAMP[1]) > 4 && !SKULLS.some(s => Math.hypot(x - s.x, z - s.z) < s.s * .8);
for (let i = 0; i < 14; i++) { const [x, z] = pt(hash(i, 9) * TAU, (i % 2 ? 1 : -1) * (5 + hash(i, 10) * 11)); if (free(x, z, 4)) put(F.deadTree({ h: 3.6 + hash(i, 11) * 3, branches: 3 + (i % 3), seed: i, c: '#7a5a4a' }), x, z, i); }
for (let i = 0; i < 150; i++) { const [x, z] = pt(hash(i, 12) * TAU, (i % 2 ? 1 : -1) * (1.9 + hash(i, 13) ** 1.5 * 13)); if (!free(x, z, 1.8)) continue; const g = green(x, z), q = i % 5;
  if (g) put(R.tuft({ kind: q < 3 ? 'flower' : 'grass', s: .55 + hash(i, 14) * .4, c: '#7aa84a', fc: ['#ff8fb0', '#ffe27a', '#ffffff'][i % 3], seed: i % 3 }), x, z, i);
  else if (q === 0) put(R.rock({ s: .4 + hash(i, 15) * 1.2, c: '#c07850', seed: i }), x, z, i, HF(x, z) - .1); else if (q < 3) put(R.tuft({ kind: q === 1 ? 'grass' : 'bush', s: .5 + hash(i, 14) * .5, c: '#c8a04a', seed: i % 3 }), x, z, i); }
// 骨の足もとの光る花（少しだけ）
for (const s of SKULLS) for (let j = 0; j < 3; j++) { const a = s.ry + (j - 1) * .9; put(F.bloom({ s: .6 + j * .1, c: j % 2 ? '#fff0a0' : '#ffb0d0', leaf: '#5a9a4a' }), s.x + Math.sin(a) * s.s * .75, s.z + Math.cos(a) * s.s * .75, j); }
// 野営のテント（しまの布。pack に無いので、ここで作る）と、荷物
const tent = (w, d, h, c2) => { const B = R.parts(), G = B.g(T.fabric({ c: '#f0e0c0', c2, pattern: 'stripe' }), { side: true }), hw = w / 2, hd = d / 2, uv = [0, 0, d / 1.5, 1.4];
  G.quad([-hw, 0, -hd], [-hw, 0, hd], [0, h, hd], [0, h, -hd], uv, [.8, .8, 1, 1]).quad([hw, 0, hd], [hw, 0, -hd], [0, h, -hd], [0, h, hd], uv, [.95, .95, 1.1, 1.1]);
  G.tri([hw, 0, -hd], [-hw, 0, -hd], [0, h, -hd], [0, 0], [1.6, 0], [.8, 1.4], .7).tri([-hw, 0, hd], [-hw * .22, 0, hd], [0, h, hd], [0, 0], [.6, 0], [.8, 1.4], .9).tri([hw * .22, 0, hd], [hw, 0, hd], [0, h, hd], [1, 0], [1.6, 0], [.8, 1.4], 1);
  B.g(T.bark({ c: '#6a4a34' })).smooth(1).loft(5, [[0, .05, .05, 0, .8], [h + .7, .04, .04, 1.4, 1]], {}).at(R.TR(0, 0, 0)); return B.group(); };
const cr = CAMP[2] + Math.PI / 2, cx = (dx, dz) => [CAMP[0] + Math.cos(cr) * dx + Math.sin(cr) * dz, CAMP[1] - Math.sin(cr) * dx + Math.cos(cr) * dz];
put(tent(2.8, 3.2, 2.1, '#d0583a'), ...cx(-1.9, -1.2), cr + .35, 0); put(tent(2.3, 2.6, 1.7, '#3a8a8a'), ...cx(2.1, -1.5), cr - .4, 0);
put(R.crate({ s: .6 }), ...cx(-.2, -2.2), .4, 0); put(R.barrel({}), ...cx(.7, -2.4), 0, 0); put(R.crate({ s: .45, kind: 'x' }), ...cx(-.3, -2.15), 1, .6);
scene.add(R.merge(fixed));
scene.add(R.backdrop({ c: '#c06a44', haze: '#ffc284', r: 150, h: 30, y: -2, rep: 6 }), R.backdrop({ c: '#d88a5a', haze: '#ffdca0', r: 210, h: 58, y: -3, rep: 4, seed: 3 }));
for (let i = 0; i < 7; i++) { const c = R.cloud({ s: 16 + hash(i, 30) * 14, c: '#fff0d0', shade: '#f09a78' }), a = i / 7 * TAU + .4; c.position.set(Math.cos(a) * 190, 62 + hash(i, 31) * 30, Math.sin(a) * 190); c.lookAt(0, 40, 0); scene.add(c); }
// かがり火（野営に 1 つ、アーチの入口に 1 つ）と、テントの小旗
const fires = [[...cx(0, .6), 1], [...pt(3.45, 3.4), .8]].map(([x, z, s], i) => { const b = F.brazier({ s, power: 22, range: 13, seed: i }); b.position.set(x, HF(x, z), z); scene.add(b); return b; });
const flag = new THREE.Mesh(R.geo().quad([0, 0, 0], [.7, .1, 0], [.7, .42, 0], [0, .5, 0], [0, 0, .5, .35]).build(), R.mat(T.fabric({ c: '#d0583a', c2: '#f0e0c0', pattern: 'stripe' }), { side: true })); { const [x, z] = cx(-1.9, -1.2); flag.position.set(x, 2.3, z); scene.add(flag); }

// ---- 人と生きもの ----
R.cfg.actorBuild = 'toon';
const hero = R.actor({ hairStyle: 'tail', hair: '#3a2a30', eye: '#3a6a5a', cloth: 'coat', sleeve: 'long', top: '#2f8f8a', top2: '#f4e8c8', lower: 'baggy', bottom: '#e8d4a8', gloves: 'wrap', glove: '#f4e8c8', shoes: 'boot', shoe: '#7a4a30', neck: 'scarf', acc: '#f0c040', hat: 'band', back: 'bag', belt: '#7a4a30', hold: 'staff', s: 1.04 }); scene.add(hero);
const puller = R.actor({ bulk: 1.15, hairStyle: 'bald', hair: '#d8d0c8', beard: 'beard', brow: 'thick', cloth: 'vest', top: '#b8683a', top2: '#f0e0c0', lower: 'baggy', bottom: '#6a5a7a', gloves: 'glove', glove: '#7a5a3a', shoes: 'boot', shoe: '#5a4030', neck: 'scarf', acc: '#f0e0c0', s: 1.06 }); scene.add(puller);
const porter = R.actor({ sex: 'f', hairStyle: 'bob', hair: '#c8603a', eyes: 'round', mouth: 'smile', blush: true, cloth: 'tunic', sleeve: 'short', top: '#f0d8a0', top2: '#d0583a', lower: 'shorts', bottom: '#7a5a8a', shoes: 'boot', shoe: '#7a4a30', back: 'pack', acc: '#8a6a4a', strap: true, s: .96 }); scene.add(porter);
const cart = R.cart({ load: 'crates', c: '#9a6a44' }); scene.add(cart);
const camper = R.actor({ hairStyle: 'short', hair: '#5a3a2a', mouth: 'smile', cloth: 'overall', top: '#d8b05a', top2: '#f4e8c8', bottom: '#5a7a8a', shoes: 'shoe', shoe: '#5a4030', hat: 'cap', acc: '#d0583a', s: .98 }); { const [x, z] = cx(1.3, 1.1); camper.position.set(x, 0, z); camper.rotation.y = CAMP[2] + 2.2; scene.add(camper); }
const birds = [...Array(4)].map((_, i) => { const b = R.bird({ c: ['#f4f0e8', '#5a4a5a', '#f4f0e8', '#c88a5a'][i], s: 1.5 }); b.userData.orb = [hash(i, 21) * TAU, 5 + hash(i, 22) * 5, 6 + hash(i, 23) * 4, .32 + hash(i, 24) * .2]; scene.add(b); return b; });
const crits = [[.42, 2.6, '#e8c8a0'], [.7, -2.4, '#d8a070'], [2.2, 2.8, '#e8c8a0'], [3.75, -2.6, '#f0e0d0'], [5.2, 2.5, '#d8a070']].map(([a, e, c], i) => { const g = F.critter({ c, s: 1.5 }); g.userData.home = [a, e, i]; scene.add(g); return g; });
const dust = F.motes({ n: 60, box: [30, 6, 30], c: '#ffe8b0', size: .1, rise: .12, drift: .9, y: .3 }); scene.add(dust);

// ---- 隊商の道（輪を左まわり。前から 荷車を引く人・荷車・荷を背負う人・主役） ----
const path = new THREE.CatmullRomCurve3([...Array(48)].map((_, i) => { const [x, z] = pt(i / 48 * TAU); return new THREE.Vector3(x, 0, z); }), true, 'centripetal');
const LEN = path.getLength(), SPEED = 1.55, S0 = +new URLSearchParams(location.search).get('s') || .012,    cd = new THREE.Vector3(), cp = new THREE.Vector3(), fx = K.fx(scene, 60);
const at = (d, side = 0) => { const u = ((S0 + d / LEN) % 1 + 1) % 1, p = path.getPointAt(u), tg = path.getTangentAt(u); p.x += tg.z * side; p.z -= tg.x * side; return [p, Math.atan2(tg.x, tg.z), tg]; };
const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
let first = true, sk = 0;
K.loop((dt, t) => {
  const dist = t * SPEED, [p, ry, tg] = at(dist); hero.position.copy(p); hero.rotation.y = ry; R.walk(hero, dist * 3.9);
  const [p1, r1] = at(dist + 6.6); puller.position.copy(p1); puller.rotation.y = r1; R.walk(puller, dist * 3.7 + 1, .8); { const J = puller.userData.J; J.armL.rotation.set(.75, 0, .1); J.armR.rotation.set(.75, 0, -.1); J.foreL.rotation.x = J.foreR.rotation.x = -.25; J.torso.rotation.x = .16; }   // うでをうしろへ引いて、荷車の持ち手をにぎる
  const [p2, r2] = at(dist + 4.75); cart.position.copy(p2); cart.rotation.y = r2 - Math.PI / 2; cart.rotation.z = Math.sin(dist * 3) * .012;
  const [p3, r3] = at(dist + 2.5, -1.25); porter.position.copy(p3); porter.rotation.y = r3; R.walk(porter, dist * 4.1 + 2);
  if (first) { cd.copy(tg); first = false; } cd.lerp(tg, 1 - Math.exp(-dt * 1.7)).normalize(); const tall = innerWidth < innerHeight, D = tall ? 4 : 5.2;
  cp.set(p.x - cd.x * D + cd.z * .5, tall ? 1.95 : 2.05, p.z - cd.z * D - cd.x * .5); cam.position.copy(cp); cam.lookAt(p.x + cd.x * 4, tall ? 1.6 : 1.9, p.z + cd.z * 4);   // 少し見上げて、骨の大きさを見せる
  sun.position.set(p.x + SUN.x * 60, SUN.y * 60, p.z + SUN.z * 60); sun.target.position.copy(p);
  // かがり火・けむり・小旗・野営の人・鳥・ミミナガ・土ぼこり
  for (const f of fires) f.userData.tick(t); flag.rotation.y = .6 + Math.sin(t * 3.1) * .35; flag.scale.y = 1 + Math.sin(t * 6.2) * .08;
  if ((sk += dt) > .45) { sk = 0; for (const f of fires) fx.emit('smoke', f.position.x, f.position.y + 2.2, f.position.z, { size: .45, grow: 1.2, life: 2.2, vy: .8, vx: .25, spread: .1, tint: '#fff0dc' }); }
  R.idle(camper, t, Math.atan2(p.x - camper.position.x, p.z - camper.position.z) - camper.rotation.y); { const J = camper.userData.J; J.armR.rotation.set(-2.6 + Math.sin(t * 6) * .25, 0, -.5); J.foreR.rotation.x = -.3; }
  birds.forEach((b, i) => { const [ph, r, h, sp] = b.userData.orb, a = ph + t * sp, c = at(dist + 12 + i * 5)[0]; b.position.set(c.x + Math.cos(a) * r, h + Math.sin(t * .7 + ph) * .8, c.z + Math.sin(a) * r); b.rotation.y = Math.atan2(-Math.sin(a), Math.cos(a)); R.birdPose(b, 'fly', t * 1.2 + ph); });
  for (const c of crits) { const [a, e, i] = c.userData.home, a2 = a + t * .03, [x, z, r] = pt(a2, e + Math.sin(t * .3 + i) * .4); c.position.set(x, HF(x, z), z); c.rotation.y = r; F.critterPose(c, 'walk', t * 9 + i); }
  fx.update(dt); dust.userData.tick(t, p.x, p.z); crt.render(scene, cam, t);
});
</script>
</html>
