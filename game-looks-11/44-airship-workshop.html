<div id="cap">11-44 ─ 飛行船の工房 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 夕方の飛行船の工房。木と鉄の高い足場のとなりで、骨組みだけの大きな飛行船を組んでいる。前のほうには布がはられ、うしろは輪の骨がむき出し。骨のつぎ目から火花がとび、クレーンが新しい骨をつり上げる。
// 色の組は「夕焼けのだいだい・木の茶・鉄の紺むらさき」＋差し色の 火花の黄白。骨・布・足場は少ない面に手打ちのドット絵（板・びょう打ちの鉄・気のうの布・トラス）をはり、粗い絵に描いてブラウン管に映す。
// 主役は帽子にゴーグルの見習い（R.actor の toon）。高さ 9 m の足場の通路を奥へ歩き、うしろからカメラが追う。作業する人・火花・クレーン・けむり・鳥が動く。
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), F = PACK_FTOWN(THREE, K, R), C = PACK_CITY(THREE, K, R), S = PACK_STEAM1(THREE, K, R), T = R.tex, { hash } = K, PI = Math.PI, TR = R.TR;
const { scene, cam, renderer, onResize } = K.stage({ fov: 52, far: 700, aa: false, fitAspect: .9, maxFov: 80 });
scene.add(R.skyDome([[0, '#2a2a5a'], [.4, '#6a4a7a'], [.7, '#d0706a'], [.88, '#f8a860'], [1, '#ffe0a0']], { r: 400 })); scene.fog = new THREE.Fog('#c87868', 50, 240);
const { sun } = K.lights(scene, renderer, { sky: 0xc8a0c0, ground: 0x6a4a48, amb: 1.35, sun: 0xffa868, power: 2.4, range: 34 }), SUN = new THREE.Vector3(-.35, .3, -.88).normalize();

// ---- 地面：工房の庭（土と板石）。遠くに町と丘 ----
const land = R.ground({ w: 200, d: 200, cell: 2, cz: -20, layers: [T.dirt({ c: '#9a7a5a', pebbles: .6 }), T.cobble({ kind: 'slab', c: '#8a8078' }), T.grass({ c: '#6a7a48' })],
  mix: (x, z) => { const r = Math.hypot(x - 6, z + 14); return [Math.abs(x + 6) < 2.5 ? 1 : 0, r > 46 ? 1 : 0]; } });
scene.add(land.mesh);
const fixed = [], put = (o, x, z, ry = 0, y = 0) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
const WOOD = T.planks({ c: '#8a6040', w: 6 }), POST = T.bark({ c: '#7a5a40' }), IRON = F.tex.iron({ c: '#4a4a6a', rust: .3 }), RAIL = F.tex.rail({ kind: 'wood', c: '#7a5038' });

// ---- 組みかけの飛行船：輪の骨 13 本、たての骨、前の 4 割に気のうの布。下にゴンドラの骨 ----
const SX = 9.2, SY = 12.5, SZ = -14, LEN = 40, RAD = 6.2, NR = 13, rad = z => RAD * Math.sqrt(Math.max(0, 1 - (z / (LEN / 2)) ** 2)) ** .9;   // z は船の中心から
{ const B = R.parts(), Rb = B.g(F.tex.iron({ c: '#6a5a6a', rust: .1 }), { side: true }), St = B.g(F.tex.ornate({ c: '#b8903a' }), { side: true }), Cl = B.g(F.tex.balloon({ c: '#e8d8b8', c2: '#b8603c' }), { side: true }), Wd = B.g(WOOD, { side: true }), NA = 16;
  const P = (z, a, k = 1) => [SX + Math.cos(a) * rad(z) * k, SY + Math.sin(a) * rad(z) * k, SZ + z];
  for (let i = 0; i < NR; i++) { const z = LEN / 2 - 1.5 - i * (LEN - 3) / (NR - 1), r = rad(z); Rb.at(TR(SX, SY, SZ + z, 0, -PI / 2)).loft(NA, [[0, r, r, 0, 1], [.3, r, r, .3, 1]], { ur: 4 }).loft(NA, [[0, r - .25, r - .25, 0, .7], [.3, r - .25, r - .25, .3, .7]], { ur: 4 }).at(null); }
  for (let k = 0; k < NA; k += 2) { const a = k / NA * PI * 2; for (let i = 0; i < 20; i++) { const z0 = LEN / 2 - i * LEN / 20, z1 = z0 - LEN / 20, p0 = P(z0, a), p1 = P(z1, a), q0 = P(z0, a + .03), q1 = P(z1, a + .03); St.quad(p0, p1, q1, q0, [0, 0, 1, 1]); } }
  // 布：前の 4 割は全部、まん中は上のほうだけ（はっている とちゅう）
  const rings = (z0, z1, n) => [...Array(n + 1)].map((_, j) => { const z = z0 - (z0 - z1) * j / n, r = rad(z) * 1.02; return [LEN / 2 - z, r, r, j / n * 2, .95 + .1 * Math.sin(j)]; });
  Cl.at(TR(SX, SY, SZ + LEN / 2, 0, -PI / 2)).loft(NA, rings(-5, -LEN / 2 + .2, 8), { ur: 4 }).loft(NA, rings(5, -5, 3), { ur: 4, seg: [3, 7] }).at(null);
  // ゴンドラ（船の下。板の床と、はりかけの横板）
  const gy = SY - RAD - 1.6; Wd.box(2.6, .2, 12, SX, gy, SZ + 2, { m: 2 }); for (const s of [-1, 1]) Wd.box(.12, .9, 7, SX + s * 1.25, gy + .2, SZ + 4.5, { m: 2 });
  for (let k = 0; k < 6; k++) { const z = SZ + 7 - k * 2.2; for (const s of [-1, 1]) Rb.box(.1, 1.7, .1, SX + s * .9, gy + .2, z, { m: 1 }); }
  fixed.push(B.group()); }
// ---- 足場：木の柱と鉄のはり。高さ 9 m に板の通路と手すり。上の段にも足場 ----
const WY = 9, WX0 = -.5, WX1 = 3;
{ const B = R.parts(), Pt = B.g(POST), Wd = B.g(WOOD), Ir = B.g(IRON), Rl = B.g(RAIL, { side: true }), Gd = B.g(C.tex.girder({ c: '#4a4a6a' }), { side: true });
  for (let z = 10; z > -40; z -= 5) { for (const x of [WX0, WX1]) Pt.at(TR(x, 0, z)).loft(4, [[0, .2, .2, 0, .8], [WY + 5, .16, .16, 4, 1]], { cap: 'top', ur: 1 }).at(null);
    Wd.box(WX1 - WX0 + .5, .18, .3, (WX0 + WX1) / 2, WY - .3, z, { m: 2 }); Wd.box(WX1 - WX0 + .5, .18, .3, (WX0 + WX1) / 2, WY + 4.6, z, { m: 2 });
    Wd.at(TR(WX0, WY * .5, z - 2.5, 0, 0, 0)).box(.08, .14, 5.6, 0, 0, 0, { m: 2 }).at(null);
    Gd.quad([WX0 - .3, 0, z], [WX0 - .3, 0, z - 5], [WX0 - .3, WY - .3, z - 5], [WX0 - .3, WY - .3, z], [0, 0, 2.5, 4.5]); }
  for (let z = 10; z > -40; z -= 2.5) { Wd.box(WX1 - WX0 + .6, .12, 2.46, (WX0 + WX1) / 2, WY - .12, z - 1.25, { m: 2.4 });  }
  Rl.quad([WX0 - .05, WY, 10], [WX0 - .05, WY, -40], [WX0 - .05, WY + 1.05, -40], [WX0 - .05, WY + 1.05, 10], [0, 0, 50, 1]);
  // 船のほうへ のびる腕木（作業の台）
  for (const z of [4, -8, -21]) { Ir.box(2.4, .2, 1.4, WX1 + 1.2, WY - .2, z, { m: 1.5 }); }
  fixed.push(B.group()); }
// はしご、つるした ランタン、資材の山、工房の小屋
fixed.push(F.ladder({ h: WY }).translateX(WX0 - .3).translateZ(-36));
const LAMP = [[WX0 + .2, -2], [WX0 + .2, -14], [WX0 + .2, -26]]; for (const [x, z] of LAMP) put(R.lamp({ h: 1.6, c: '#3a3a4a' }), x, z, 0, WY);
[[-3, 4], [-4, -6], [-2.6, -18], [-3.6, -28], [13, 4], [16, -30]].forEach(([x, z], j) => put(j % 2 ? R.crate({ c: '#8a6a44', s: 1.2 }) : R.barrel({ c: '#6a5a4a', h: 1.1 }), x, z, j));
for (let k = 0; k < 5; k++) put(R.house({ w: 9, d: 7, h: 4, wall: T.boards({ c: '#7a5038' }), roof: T.roof({ kind: 'wave', c: '#5a5a6a' }), pitch: .4, lit: 1, chimney: true, door: T.door({ style: 'plank' }), win: T.window({ bars: 'grid', lit: 1 }), winLit: T.window({ bars: 'grid', lit: 1 }), seed: k }), -14 - (k % 2) * 11, 10 - k * 12, PI / 2);
put(S.chimney({ r: .9, h: 14, tex: T.brick({ c: '#8a4a3a' }) }), -24, -40);
put(S.chimney({ r: .7, h: 11, tex: T.brick({ c: '#9a5a44' }) }), -20, 8);
// 大きな歯車の巻き上げ機（足場の下）
const winch = S.gear({ r: 1.8, th: .4, speed: .6, c: '#b8903a' }); winch.position.set(-1.4, 2.2, -10); winch.rotation.y = PI / 2; scene.add(winch);
const winch2 = S.gear({ r: 1, th: .4, speed: -1.08, phase: .2, c: '#d8a84a' }); winch2.position.set(-1.4, 4.6, -11.2); winch2.rotation.y = PI / 2; scene.add(winch2);
scene.add(R.merge(fixed));
scene.add(R.backdrop({ c: '#6a4a6a', haze: '#e09080', r: 170, h: 40, y: -2, rep: 3 }), R.backdrop({ c: '#8a5a7a', haze: '#f0a880', r: 280, h: 70, y: -4, seed: 4 }));
const sunD = new THREE.Mesh(new THREE.CircleGeometry(18, 20), new THREE.MeshBasicMaterial({ color: '#fff0b0', fog: false, transparent: true, opacity: .9 })); sunD.position.set(-120, 60, -330); sunD.lookAt(0, 0, 0); scene.add(sunD);
for (let k = 0; k < 7; k++) { const c = R.cloud({ s: 18 + hash(k, 9) * 12, c: '#f8b8a0', shade: '#8a5a8a' }); c.position.set((hash(k, 7) - .5) * 340, 70 + hash(k, 8) * 40, -150 - hash(k, 6) * 150); scene.add(c); }

// ---- クレーン（鉄のトラスの塔。うでがゆっくり回り、新しい骨をつり上げる） ----
const crane = new THREE.Group(), CX = -9, CZ = -40; crane.position.set(CX, 0, CZ); scene.add(crane);
{ for (let k = 0; k < 2; k++) { const tw = C.truss({ len: 28, h: 1.8, w: 1.8, c: '#4a4a6a' }); tw.rotation.set(0, k * PI / 2, PI / 2); tw.position.set(0, 14, 0); crane.add(tw); } }
const jib = new THREE.Group(); jib.position.y = 28; crane.add(jib); { const j = C.truss({ len: 24, h: 1.6, w: 1.4, c: '#5a4a5a' }); j.position.x = -7; jib.add(j); const cw = R.crate({ s: 1.8, c: '#6a6a7a', kind: 'plain' }); cw.position.set(4, -1.2, 0); jib.add(cw); }
const hookG = new THREE.Group(); jib.add(hookG); hookG.position.set(-15, 0, 0);
const cable = new THREE.Mesh(R.geo().quad([-.04, -10, 0], [.04, -10, 0], [.04, 0, 0], [-.04, 0, 0]).build(), R.mat('#2a2a34', { side: true })); hookG.add(cable);
const load = new THREE.Group(); load.position.y = -10.5; hookG.add(load); { const B = R.parts(), Rb = B.g(F.tex.iron({ c: '#6a5a6a', rust: .1 }), { side: true }); Rb.at(TR(0, -2.4, 0, PI / 2, -PI / 2)).loft(16, [[0, 3, 3, 0, 1], [.3, 3, 3, .3, 1]], { ur: 2, seg: [0, 8] }).at(null); load.add(B.group()); }

// ---- 火花（骨のつぎ目）と けむり ----
const SPK = [[WX1 + 1.9, WY + 1.2, 4.2], [WX1 + 1.8, WY + 1.4, -8.2], [SX - 2, SY + RAD - .3, -2], [WX1 + 1.9, WY + 1.1, -21.2]];
SPK.forEach(([x, y, z], i) => { const s = C.sparks({ n: 22, every: 1.1 + i * .23, power: .9, phase: i * .37, floor: 9 }); s.position.set(x, y, z); scene.add(s); });
const smokes = [[-24, 14, -40], [-20, 11, 8]].map(([x, y, z], i) => { const s = C.steam({ n: 10, r: 1.4, rise: 9, a: .55, speed: .15, c: '#a88a9a', wind: [3, -1], phase: i * .4 }); s.position.set(x, y, z); scene.add(s); return s; });
const lamps = LAMP.map(([x, z]) => { const l = new THREE.PointLight('#ffb060', 5, 7, 1.6); l.position.set(x + .3, WY + 1.4, z); scene.add(l); return l; });

// ---- 人（5 頭身の toon。どれもこの場面のためのオリジナル） ----
const act = (o, x = 0, z = 0, ry = 0, y = WY) => { const p = R.actor({ build: 'toon', ...o }); p.position.set(x, y, z); p.rotation.y = ry; scene.add(p); return p; };
const hero = act({ sex: 'f', hairStyle: 'long', hair: '#d8a860', eyes: 'big', mouth: 'smile', cloth: 'coat', top: '#2e5a7a', top2: '#f0e4cc', bottom: '#5a4030', lower: 'pants', gloves: 'glove', glove: '#5a3a2a', shoes: 'boot', shoe: '#3a2a22', neck: 'scarf', acc: '#f0ece0', hat: 'cap', back: 'bag' });
S.goggles(hero, { y: .95, lens: '#f0c870' });
const welders = [[WX1 + .9, 4.6, -PI / 2 - .5], [WX1 + .8, -7.6, -PI / 2 - .3], [WX1 + .9, -20.6, -PI / 2 - .2]].map(([x, z, ry], i) => act({ hairStyle: ['short', 'spiky', 'bun'][i], hair: '#3a2a28', sex: i === 2 ? 'f' : 'm', cloth: 'overall', top: ['#4a5a78', '#6a5a3a', '#5a4a6a'][i], top2: '#d8c8a8', gloves: 'gauntlet', glove: '#6a4a34', hat: 'band', acc: '#3a3a44', hold: i === 1 ? 'wrench' : undefined }, x, z, ry));
const carrier = act({ hairStyle: 'tufts', hair: '#5a3a2a', beard: 'stubble', cloth: 'vest', top: '#8a5a3a', top2: '#e8dcc0', bottom: '#4a4450', shoe: '#3a2a22' }); F.wear(carrier, 'sack', { c: '#c8b088' });
const below = [act({ hairStyle: 'short', hair: '#2a2228', cloth: 'overall', top: '#4a5a78', top2: '#e8dcc0', hat: 'cap', acc: '#4a5a78' }, -4, 0, 0, 0), act({ sex: 'f', hairStyle: 'tail', hair: '#6a3a2a', cloth: 'tunic', top: '#a8443a', top2: '#f0e4cc', lower: 'pants', hold: 'case' }, 0, 0, 0, 0)];
const boss = act({ hairStyle: 'bald', hair: '#a8a0a0', beard: 'beard', cloth: 'coat', top: '#3a3a4a', top2: '#c8963a', bottom: '#3a3a4a', shoe: '#1e1e24' }, 1.6, -30, PI * .1);
const birds = [...Array(5)].map((_, k) => { const b = R.bird({ c: '#3a2a34', belly: '#5a4a54', neck: false, s: 1.5 }); scene.add(b); return b; });

const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
const Z0 = 9, WL = 40, SPEED = 1.3;
K.loop((dt, t) => {
  const z = Z0 - (t * SPEED) % WL, x = 1.2 + Math.sin(z * .2) * .12;
  hero.position.set(x, WY, z); hero.rotation.y = PI; R.walk(hero, t * SPEED * 3.6, .85);
  const tall = innerWidth < innerHeight, D = tall ? 3.8 : 4.3; cam.position.set(x + .1, WY + (tall ? 2.4 : 2.2), z + D); cam.lookAt(x + 1.2, WY + 1.5, z - 6);
  sun.position.set(x + SUN.x * 60, WY + SUN.y * 60, z + SUN.z * 60); sun.target.position.set(x, WY, z - 6); land.follow(x, z - 10);
  // 作業する人：火花の前で うでを動かす。荷運びは手前へ。下の人は庭を歩く
  welders.forEach((p, i) => { R.idle(p, t + i, .2); const J = p.userData.J, ph = t * 5 + i; J.armR.rotation.set(-1.3 + Math.sin(ph) * .25, 0, .1); J.foreR.rotation.x = -.5; J.armL.rotation.set(-1 + Math.sin(ph * .5) * .1, 0, -.1); });
  const cz = -38 + ((t * 1.05) % 48); carrier.position.set(.2, WY, cz); carrier.rotation.y = 0; R.walk(carrier, t * 3.8, .6);
  below.forEach((p, i) => { const u = (t * (1 + i * .2) + i * 12) % 40, dir = i ? 1 : -1; p.position.set(-5 - i * 2, 0, dir * (u - 20) - 12); p.rotation.y = dir > 0 ? 0 : PI; R.walk(p, t * 4 + i, .7); });
  R.idle(boss, t, Math.sin(t * .4) * .6); boss.userData.J.armR.rotation.set(-1.6, 0, .4);
