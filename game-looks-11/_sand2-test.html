<!doctype html><html lang="ja"><meta charset="utf-8"><title>test</title>
<style>html,body{margin:0;height:100%;background:#888;overflow:hidden}canvas{display:block}</style>
<script src="../game-looks-7/kit.js"></script><script src="../game-looks-7/retro.js"></script><script src="pack-sand2.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), SD = PACK_SAND2(THREE, K, R), T = R.tex;
const { scene, cam, renderer, onResize } = K.stage({ fov: 40, far: 300, aa: false });
scene.add(R.skyDome([[0, '#6a8ac8'], [1, '#e8d8b8']]));
K.lights(scene, renderer, { sun: 0xfff0d0, range: 10 });
const land = R.ground({ w: 30, d: 30, cell: 2, layers: [T.sand()] }); scene.add(land.mesh);
const c1 = SD.camel(); c1.position.set(-2.2, 0, 0); c1.rotation.y = Math.PI/2; scene.add(c1);
const c2 = SD.camel({ c: '#b08050' }); c2.position.set(-1.5, 0, -2.5); c2.rotation.y = 0.6; scene.add(c2);
const g = SD.goat(); g.position.set(1.2, 0, 1); g.rotation.y = Math.PI/2; scene.add(g);
const tn = SD.tent(); tn.position.set(2.5, 0, -2.5); tn.rotation.y = -.5; scene.add(tn);
const a = R.actor({ build: 'toon', hairStyle: 'short', cloth: 'robe', top: '#8a5a3a' }); a.position.set(.3, 0, 1.6); a.rotation.y = 0.3; SD.hood(a, {}); scene.add(a);
const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
K.loop((dt, t) => { SD.camelPose(c1, 'walk', t * 3); SD.camelPose(c2, 'rest', t); SD.goatPose(g, 'stand', t); R.idle(a, t, 0);
  const V=+(new URLSearchParams(location.search).get("v")||0); if(V){cam.position.set(-.3,1.6,4);cam.lookAt(-.3,.9,0);} else {cam.position.set(0, 2.2, 7); cam.lookAt(0, .9, 0);}; crt.render(scene, cam, t); });
</script></html>
