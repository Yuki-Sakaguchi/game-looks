const kids = [0, 1].map(i => act({ s: .68, skin: i ? DK : TAN, hairStyle: i ? 'bob' : 'spiky', hair: '#2a2024', mouth: 'open', blush: true, cloth: 'tunic', top: i ? '#e8b048' : '#f4e8d0', top2: RED, lower: 'shorts', bottom: '#2e6a9a', shoes: 'shoe', shoe: '#6a4028' }, -4 + i * 1.3, 8.6, PI));

  const p = act(o, x * k + (i % 2 ? .7 : -.7), z * k, Math.atan2(x, z)); if (i % 3 === 1) wrap(p, '#f4e8d0'); if (i % 3 === 2) F.wear(p, 'basket', { fc: ['#e2503c', '#f2a23a', '#8ab84a'] }); return p; });
const camels = [[-17, -12, .8], [-19.5, -9, 1.6], [18, -12, -.9]].map(([x, z, ry], i) => { const c = A.camel({ c: ['#b88050', '#c8955a', '#a87044'][i], cloth: i ? '#2e6a9a' : RED, cloth2: '#f0d8a0', load: i !== 1 }); c.position.set(x, H(x, z), z); c.rotation.y = ry; scene.add(c); return c; });
const doves = [0, 1, 2, 3, 4].map(i => { const b = R.bird({ c: '#f0ece4', belly: '#ffffff', neck: false }); const a = i * .35 + 4.3, r = RP + 1.6; b.position.set(Math.cos(a) * r, H(Math.cos(a) * r, Math.sin(a) * r / 1.15), Math.sin(a) * r / 1.15); b.rotation.y = i * 2; scene.add(b); return b; });
const birds = [0, 1, 2].map(i => { const b = R.bird({ c: '#f4f0e8', belly: '#ffffff', neck: false, s: 1.5 }); scene.add(b); return b; });

// ---- 主役の道：泉の岸の土の道をぐるりと（だ円） ----
const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
const fx = K.fx(scene, 40), ON = a => [Math.cos(a) * RW * .97, Math.sin(a) * RW * .97 / 1.15]; let sp = 0;
K.loop((dt, t) => {
  const a = 1.75 - t * .085, [x, z] = ON(a), [x2, z2] = ON(a - .05), ry = Math.atan2(x2 - x, z2 - z), y = H(x, z);
  hero.position.set(x, y, z); hero.rotation.y = ry; R.walk(hero, t * 6.2, .85); const J = hero.userData.J; J.armL.rotation.set(-2.75, 0, .2); J.foreL.rotation.x = -.9; J.head.rotation.set(0, 0, 0);
  const tall = innerWidth < innerHeight, D = tall ? 4.2 : 5, dx = Math.sin(ry), dz = Math.cos(ry), ir = Math.hypot(x, z), ix = -x / ir, iz = -z / ir;   // ix, iz は泉の方
  cam.position.set(x - dx * D - ix * 1.3, y + (tall ? 2.8 : 2.6), z - dz * D - iz * 1.3); cam.lookAt(x + dx * 5 + ix * (tall ? 1.2 : 1.8), y + .8, z + dz * 5 + iz * (tall ? 1.2 : 1.8));   // 少し泉がわを見る
  sun.position.set(x + SUN.x * 60, y + SUN.y * 60, z + SUN.z * 60); sun.target.position.set(x, y, z);
  // 道を行き来する人（逆まわり・同じまわり）と、岸で遊ぶ子ども
  walkers.forEach((p, i) => { const dir = i % 2 ? 1 : -1, b = a - .3 - i * .45 + dir * t * .05 * (i % 2 ? 1 : .2), r = RW + (i % 2 ? 1 : -1) * .9, px = Math.cos(b) * r, pz = Math.sin(b) * r / 1.15, b2 = b + dir * .05; p.position.set(px, H(px, pz), pz); p.rotation.y = Math.atan2(Math.cos(b2) * r - px, Math.sin(b2) * r / 1.15 - pz); R.walk(p, t * 6 + i, .8); });
  kids.forEach((k, i) => { const b = 1.4 + i * .35 + Math.sin(t * .9 + i * 2) * .25, r = RP + 1.9, px = Math.cos(b) * r, pz = Math.sin(b) * r / 1.15; k.position.set(px, H(px, pz) + Math.max(0, Math.sin(t * 7 + i * 2)) * .12, pz); k.rotation.y = Math.atan2(-px, -pz) + Math.cos(t * .9 + i * 2) * .8; R.walk(k, t * 10 + i, 1); });
  buyers.forEach((p, i) => { R.idle(p, t * .8 + i * 2, Math.sin(t * .4 + i) * .4); if (i % 2 === 0) p.userData.J.armR.rotation.x = -1 - Math.max(0, Math.sin(t * 1.7 + i)) * .4; });
  sellers.forEach((p, i) => { R.idle(p, t + i, Math.sin(t * .5 + i) * .5); if (i % 2) { p.userData.J.armR.rotation.x = -1.4 - Math.max(0, Math.sin(t * 2.2 + i)) * .6; } });
  camels.forEach((c, i) => A.pose(c, i === 2 ? 'stand' : 'kneel', t + i * 2)); A.pose(camels[2], 'graze', t);
  doves.forEach((b, i) => R.birdPose(b, 'peck', t + i * 1.7));
  birds.forEach((b, i) => { const q = t * (.24 + i * .04) + i * 2.1, r = 12 + i * 4; b.position.set(Math.cos(q) * r, 15 + i * 1.6, Math.sin(q) * r); b.rotation.y = Math.atan2(-Math.sin(q), Math.cos(q)); R.birdPose(b, 'fly', t * .5 + i); });
  R.flip(water.material, WF, t, 4); if ((sp += dt) > .5) { sp = 0; const q = Math.random() * 6.28, r = Math.random() * RP * .8; fx.emit('splash', Math.cos(q) * r, WY + .1, Math.sin(q) * r / 1.15, { size: .45, life: .6, vy: .2, grow: .8 }); }
  F.tick(t); fx.update(dt); crt.render(scene, cam, t);
});
</script>
