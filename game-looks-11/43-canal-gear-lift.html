  const tall = innerWidth < innerHeight, D = tall ? 4.6 : 4.9; cam.position.set(.8, wy + (tall ? 2.6 : 2.5), zb + D); cam.lookAt(0, wy + (tall ? 3.1 : 1.1), zb - 7);
  sun.position.set(SUN.x * 60, wy + SUN.y * 60, zb + SUN.z * 60); sun.target.position.set(0, wy, zb - 4); land.follow(0, zb);
  // 見物の人：手をふる・ぴょんととぶ
  watchers.forEach((p, i) => { R.idle(p, t + i, Math.sin(t * .5 + i) * .3); const J = p.userData.J; J.armR.rotation.set(-2.6 + Math.sin(t * 5 + i) * .3, 0, -.2); if (i === 5) p.position.y = TOP + 1.6 + Math.abs(Math.sin(t * 4)) * .25; });
  birds.forEach((b, i) => { const a = t * .4 + i * 1.05, r = 9 + (i % 3) * 2.5; b.position.set(Math.cos(a) * r, 14 + (i % 3) * 1.5, ZM + 4 + Math.sin(a) * r); b.rotation.y = -a; R.birdPose(b, 'fly', t * .7 + i); });
  R.flip(wm, WF, t, 4); S.tick(t); C.update(t, cam); fx.update(dt); crt.render(scene, cam, t);
});
