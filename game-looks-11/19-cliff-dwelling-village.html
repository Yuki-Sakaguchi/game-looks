<title>11-19 がけの家々 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#3a2038;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#ffe8d0;opacity:.9;text-shadow:0 1px 0 #000}
</style>
<div id="cap">11-19 ─ がけの家々 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="../game-looks-8/pack-fantasy-town.js"></script>
<script src="../game-looks-8/pack-fantasy-wild.js"></script>
<script src="pack-sand2.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 夕方の、赤いがけの村。段になったがけに土の家々がはりつき、はしごと板の通路でつながる。谷の向こうへ つり橋、家の前に洗たく物、岩の上にやぎ。
// 色の組は「赤いがけと土かべのだいだい・夕空の藤色」＋差し色の 窓のあかりと洗たく物の青。かべ・がけ・板・布はどれもドット絵のテクスチャ。
// 主役は かごを背おった村の子（R.actor の toon。黄色のずきん）。がけのふちの板の通路を左へ歩き、谷の外がわ ななめ うしろからカメラが追う。はしごをのぼる人、洗たく物をほす人、つり橋をわたる人、やぎ、つばめ、かまどのけむり。
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), F = PACK_FTOWN(THREE, K, R), FW = PACK_FWILD(THREE, K, R), SD = PACK_SAND2(THREE, K, R), T = R.tex, { hash } = K, PI = Math.PI;
const { scene, cam, renderer, onResize } = K.stage({ fov: 50, far: 800, aa: false, fitAspect: .9, maxFov: 78 });
scene.add(R.skyDome([[0, '#3a3a78'], [.45, '#8a5a90'], [.75, '#e07a5a'], [.92, '#f8b070'], [1, '#ffe0a0']], { r: 400 })); scene.fog = new THREE.Fog('#c88070', 50, 230);
const { sun } = K.lights(scene, renderer, { sky: 0xd8a8c8, ground: 0x7a4a48, amb: 1.4, sun: 0xffa868, power: 2.3, range: 34 }), SUN = new THREE.Vector3(-.75, .3, .58).normalize();

// ---- 段になったがけ：谷の底（y=0）→ 1 段め（y=6）→ 2 段め（y=11）→ 高いがけ。x<-30 は 谷の切れ目 ----
const sm = (a, b, v) => { const k = Math.max(0, Math.min(1, (v - a) / (b - a))); return k * k * (3 - 2 * k); };
const Y1 = 6, Y2 = 11, GAP = [-31, -41], inGap = x => x < GAP[0] && x > GAP[1];
const H = (x, z) => { if (inGap(x) && z < 2) return -2 + sm(-24, -40, z) * 30; const t1 = sm(-1.6, -2.2, z) * Y1, t2 = sm(-8.6, -9.2, z) * (Y2 - Y1), t3 = sm(-15.6, -16.6, z) * 18; return t1 + t2 + t3 + Math.sin(x * .3) * .1; };
const land = R.ground({ w: 140, d: 70, cell: 1, cz: -10, H, layers: [T.dirt({ c: '#b0684a', pebbles: .4 }), T.grass({ c: '#8a8a4a', flowers: .1, fc: ['#f0d070', '#ffffff'] }), T.cobble({ kind: 'slab', c: '#a8705a' })],
  mix: (x, z) => [z > 2 || (z < -16.6) ? .8 : 0, (z < -2.6 && z > -8.2) || (z < -9.6 && z > -15.4) ? .6 : 0] }); scene.add(land.mesh);
const fixed = [], put = (o, x, z, ry = 0, y = H(x, z)) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
const CL = F.tex.sandstone({ c: '#b8583a' }), CL2 = F.tex.sandstone({ c: '#c86a44', seed: 2 });
for (let k = 0; k < 7; k++) { const x = 30 - k * 9.2; if (inGap(x)) continue; put(FW.cliff({ w: 10, h: Y1 + .3, d: 1.4, lean: .04, seed: k, tex: CL }), x, -1.4, 0, -.2); put(FW.cliff({ w: 10, h: Y2 - Y1 + .3, d: 1.2, lean: .04, seed: k + 9, tex: CL2 }), x, -8.4, 0, Y1 - .2); put(FW.cliff({ w: 10, h: 22, d: 2, lean: .1, seed: k + 19, tex: CL }), x, -15.6, 0, Y2 - .2); }
for (let k = 0; k < 6; k++) put(FW.cliff({ w: 12, h: 30, d: 2, lean: .12, seed: k + 30, tex: CL2 }), -46 - k * 11, -2 - (k % 2) * 3, 0, -2);   // 谷の向こうのがけ
put(FW.cliff({ w: 12, h: 30, d: 2, lean: .1, seed: 41, tex: CL }), GAP[0] + 1, -12, -PI / 2, -2);

// ---- 土の家（平らな屋根、木の はり、小さな窓）。1 段めと 2 段めと、谷の向こう ----
const ADOBE = ['#d88a5a', '#e0a070', '#c87850'].map((c, i) => T.plaster({ frame: 'none', c, seed: i })), ROOF = T.plaster({ frame: 'none', c: '#b87048' });
const winL = T.window({ h: 32, bars: 'cross', lit: 1, curtain: '#ffd080', frame: '#6a3a28' }), winD = T.window({ h: 32, bars: 'cross', curtain: '#3a6aa8', frame: '#6a3a28' }), DOOR = T.door({ style: 'plank', c: '#6a4430' });
const home = (i, w = 4, h = 2.8) => R.house({ w, d: 3.6, h, roofKind: 'flat', wall: ADOBE[i % 3], roof: ROOF, win: winD, winLit: winL, lit: .6, door: DOOR, wins: { f: 1, b: 0, l: 1, r: 1 }, chimney: i % 3 === 0, seed: i });
const HOMES = []; for (let i = 0; i < 8; i++) { const x = 24 - i * 7.2 + hash(i, 1) * 1.5; if (x < GAP[0] + 2) continue; HOMES.push(put(home(i, 4 + hash(i, 2) * 1.4, 2.6 + hash(i, 3) * .8), x, -6.2, 0, Y1)); }
for (let i = 0; i < 7; i++) { const x = 20 - i * 7.8 + hash(i, 4) * 2; if (x < GAP[0] + 2) continue; put(home(i + 3, 4 + hash(i, 5), 2.8 + hash(i, 6) * 1.2), x, -13.2, 0, Y2); }
for (let i = 0; i < 5; i++) put(home(i + 7, 4, 3), -48 - i * 8, 1.5 + (i % 2), 0, 4 + i * 2.2);   // 向こうのがけの家（段を上がっていく）
// 板の通路（1 段めのふち。がけから はり出し、下に つっかい棒）と、外がわの手すり
{ const B = R.parts(), Pl = B.g(T.planks({ c: '#8a5a38', w: 8 })), Rl = B.g(F.tex.rail({ kind: 'wood' }), { side: true }), x0 = GAP[0] + .4, x1 = 30, L = x1 - x0;
  Pl.box(L, .18, 1.8, (x0 + x1) / 2, Y1 - .18, -1.1, { m: 2 }); for (let x = x0 + 1; x < x1; x += 3) Pl.at(R.TR(x, Y1 - .2, -.4, 0, .55)).loft(4, [[-2.4, .08, .08, 0, .8], [0, .08, .08, 1]], {}).at(null);
  Rl.quad([x0, Y1, -.2], [x1, Y1, -.2], [x1, Y1 + .9, -.2], [x0, Y1 + .9, -.2], [0, 0, L, 1]); fixed.push(B.group()); }
// はしご（1 段め→2 段め、谷の底→1 段め、2 段め→上）
const LADS = [[16.5, -8.2, Y1, 5.6], [2.3, -8.2, Y1, 5.6], [-12.4, -8.2, Y1, 5.6], [9, -.6, -.1, 6.2], [-20, -.4, -.1, 6.2], [6, -15.2, Y2, 7], [-17, -15.2, Y2, 7]];
LADS.forEach(([x, z, y, h]) => put(F.ladder({ h, w: .6 }), x, z, 0, y));
put(R.barrel({ h: .8, r: .3, c: '#8a5a3a' }), 12, -3.2, 0, Y1); put(R.crate({ s: .6, c: '#9a6a44' }), -4, -3, .3, Y1); put(R.barrel({ h: .7, r: .28 }), -18, -3.4, 0, Y1); put(R.crate({ s: .5, kind: 'x' }), 20, -10.4, .4, Y2);
for (let i = 0; i < 14; i++) { const x = 30 - hash(i, 7) * 60; if (inGap(x)) continue; put(R.tuft({ kind: i % 2 ? 'bush' : 'grass', s: .8, seed: i % 3 }), x, -2.8 - hash(i, 8) * 1.2, i, Y1); }
for (let i = 0; i < 16; i++) { const x = 34 - hash(i, 9) * 80, z = 4 + hash(i, 10) * 10; put(i % 3 ? R.rock({ s: .6 + hash(i, 11), c: '#9a5a44', seed: i }) : R.tree({ kind: 'bush', h: 1.6, c: '#6a7a3a', seed: i }), x, z, i); }
scene.add(R.merge(fixed));

// ---- つり橋（2 段めから 谷の向こうへ）、洗たく物、けむり ----
const bridge = F.ropeBridge({ from: [GAP[0] + .5, Y2, -11], to: [GAP[1] - 1, 12.4, -5], w: 1.2, sag: 1.4 }); scene.add(bridge);
const CLOTH = ['#3a6ab0', '#f0ece0', '#c84a3a', '#f0d070', '#5a9a6a'].map((c, i) => T.fabric({ c, c2: '#f4ecd8', pattern: i % 2 ? 'stripe' : 'plain' }));
const lines = [[8, 15], [-6, 0], [-22, -16]].map(([a, b], j) => { const g = new THREE.Group(), y = Y1 + 2.5, z = -3.6, rope = R.geo().quad([a, y, z], [b, y, z], [b, y + .03, z], [a, y + .03, z]).mesh(T.planks({ c: '#e8d8b8' }), { side: true }); g.add(rope); const cs = [];
  for (let k = 0; k < 5; k++) { const x = a + (b - a) * (k + .6) / 5.4, w = .5 + hash(k, j) * .3, h = .6 + hash(k, j + 3) * .4, m = R.geo().quad([-w / 2, -h, 0], [w / 2, -h, 0], [w / 2, 0, 0], [-w / 2, 0, 0]).mesh(CLOTH[(k + j) % 5], { side: true }); m.position.set(x, y - Math.sin((k + .6) / 5.4 * PI) * .2, z); g.add(m); cs.push(m); }
  scene.add(g); return cs; });
const fx = K.fx(scene, 40);

// ---- 人・やぎ・鳥 ----
const act = (o, x, z, ry = 0, y = H(x, z)) => { const p = R.actor({ build: 'toon', skin: '#c8885a', ...o }); p.position.set(x, y, z); p.rotation.y = ry; scene.add(p); return p; };
const hero = act({ s: .9, hairStyle: 'bob', hair: '#3a2420', eyes: 'big', mouth: 'smile', blush: true, cloth: 'tunic', top: '#e8b040', top2: '#f4ecd8', lower: 'shorts', bottom: '#6a3a2a', belt: '#3a6ab0', shoes: 'shoe', shoe: '#7a4a2a', neck: 'scarf', acc: '#3a6ab0', gloves: 'wrap', glove: '#f4ecd8' }, 0, -1.2, -PI / 2, Y1);
{ const b = hero.userData.build, J = hero.userData.J, Bk = R.parts(); Bk.g(F.tex.basket({ c: '#b88a50' })).loft(8, [[-.05, .14, .1, 0, .85], [.3, .19, .13, 1, 1]], { cap: 'bot' }); Bk.g(T.goods({ fc: ['#e2503c', '#f2a23a', '#8ab84a'] })).loft(8, [[.27, .18, .12, 0, 1]], { cap: 'top', capRect: true, capH: .03 }); const g = Bk.group(); g.position.set(0, b.torso * .35, -.19); J.torso.add(g); }   // 背おいかご
const climber = act({ hairStyle: 'short', hair: '#2a2420', beard: 'mustache', cloth: 'vest', top: '#6a8a4a', top2: '#e8d8b8', lower: 'baggy', bottom: '#5a4a3a', shoe: '#5a3a2a', hat: 'band', acc: '#c84a3a' }, 2.3, -7.6, PI, Y1);
const washer = act({ sex: 'f', hairStyle: 'long', hair: '#1a1418', cloth: 'robe', top: '#3a6ab0', top2: '#f0d070', skirt: .85, shoe: '#6a4a3a', neck: 'scarf', acc: '#c84a3a' }, -7, -4.3, 0, Y1);
const crosser = act({ hairStyle: 'tufts', hair: '#3a2a20', cloth: 'tunic', top: '#c84a3a', top2: '#f0e0c0', lower: 'pants', bottom: '#4a4a5a', shoe: '#5a3a2a', back: 'pack', acc: '#e0a040' }, 0, 0, 0, Y2);
const goats = [['stand', 13.5, -2.9, Y1, -1.2], ['graze', 21, -11, Y2, .5], ['walk', 0, 0, Y2, 0], ['stand', -9, -17.3, 29, .4]].map(([pose, x, z, y, ry], i) => { const g = SD.goat({ c: ['#f0e8d8', '#6a4a3a', '#e8e0d0', '#3a3030'][i], seed: i }); g.position.set(x, y, z); g.rotation.y = ry; g.userData.pose = pose; scene.add(g); return g; });
const swallows = [0, 1, 2, 3].map(i => { const b = R.bird({ c: '#2a2a3a', belly: '#f0e8e0', neck: false, s: 1.1 }); scene.add(b); return b; });

const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
const X0 = 10, LEN = 37, SPEED = 1.3;
K.loop((dt, t) => {
  const x = X0 - (t * SPEED) % LEN, z = -1.3 + Math.sin(x * .3) * .1, y = Y1;
  hero.position.set(x, y, z); hero.rotation.y = -PI / 2; R.walk(hero, t * SPEED * 4.2, .9);
  const tall = innerWidth < innerHeight; cam.position.set(x + (tall ? 2.2 : 2.9), y + (tall ? 2 : 1.9), z + (tall ? 2.3 : 2.7)); cam.lookAt(x - 2.6, y + (tall ? 1.25 : 1.2), z - 1.2);   // 谷の外がわ、ななめ うしろから
  sun.position.set(x + SUN.x * 60, y + SUN.y * 60, z + SUN.z * 60); sun.target.position.set(x, y, z - 3);
  // はしごをのぼりおりする人、洗たく物をほす人、つり橋をわたる人
  const cy = (Math.sin(t * .45) * .5 + .5) * 5.2; climber.position.set(2.3, Y1 + cy, -7.75 + cy * .12 * (5.6 - cy) / 5.6 * 0); climber.rotation.y = PI; const J = climber.userData.J, ph = t * 3.4; J.armL.rotation.x = -2.6 + Math.sin(ph) * .4; J.armR.rotation.x = -2.6 - Math.sin(ph) * .4; J.legL.rotation.x = -.6 + Math.sin(ph) * .5; J.legR.rotation.x = -.6 - Math.sin(ph) * .5; J.shinL.rotation.x = J.shinR.rotation.x = .8;
  R.idle(washer, t, Math.sin(t * .5) * .3); washer.userData.J.armR.rotation.x = -2.4 + Math.sin(t * 2) * .3; washer.userData.J.armL.rotation.x = -2.2 - Math.sin(t * 2) * .3;
  const k = (Math.sin(t * .18) * .5 + .5) * .96 + .02, bp = bridge.userData.at ? bridge.userData.at(k) : null; if (bp) { crosser.position.set(bp[0] ?? bp.x, (bp[1] ?? bp.y), bp[2] ?? bp.z); crosser.rotation.y = Math.cos(t * .18) > 0 ? -PI / 2 - .4 : PI / 2 - .4; R.walk(crosser, t * 4, .7); }
  lines.forEach((cs, j) => cs.forEach((m, i) => { m.rotation.x = Math.sin(t * 2.2 + i * .9 + j) * .25 - .15; m.rotation.y = Math.sin(t * 1.3 + i) * .15; }));
  goats.forEach((g, i) => { if (g.userData.pose === 'walk') { const gx = 10 - ((t * .7) % 20); g.position.set(gx, Y2, -10.6 + Math.sin(gx * .4) * .3); g.rotation.y = -PI / 2; SD.goatPose(g, 'walk', t * 3.2); } else SD.goatPose(g, g.userData.pose, t + i * 2); });
  swallows.forEach((b, i) => { const a = t * (.7 + i * .1) + i * 1.6, r = 5 + i * 1.5; b.position.set(x - 6 + Math.cos(a) * r, Y1 + 5 + Math.sin(t * 1.4 + i) * 1.5, -4 + Math.sin(a) * r * .5); b.rotation.y = Math.atan2(-Math.sin(a), Math.cos(a) * .5); R.birdPose(b, 'fly', t * .9 + i); });
  if (Math.floor(t * 2.2) !== Math.floor((t - dt) * 2.2)) for (const hh of HOMES) if (hh.userData.chimney || hash(Math.round(hh.position.x), 3) > .6) fx.emit('smoke', hh.position.x + .8, Y1 + 3.6, -6.8, { size: .4, life: 3.5, vy: .5, vx: -.2, grow: 1.6, spread: .1, tint: '#e8d0c8' });
  F.tick(t); fx.update(dt); crt.render(scene, cam, t);
});
</script>
