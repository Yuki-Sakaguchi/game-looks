<title>11-20 地下の水路 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#141218;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#f0e4cc;opacity:.9;text-shadow:0 1px 0 #000}
</style>
<div id="cap">11-20 ─ 地下の水路 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="../game-looks-8/pack-fantasy-wild.js"></script>
<script src="../game-looks-8/pack-ruins.js"></script>
<script src="../game-looks-9/pack-dark.js"></script>
<script src="pack-sand2.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 砂漠の下の地下水路。石を積んだ細長いトンネルが まっすぐ続き、右がわを水が流れる。9 m ごとに天井のたて穴から昼の光がすじになって落ち、水と床に白い輪が点々と奥へならぶ。
// 色の組は「石のこげ茶・水の あい色」＋差し色は 光のすじの白い黄色と、主役のランタンのだいだい。光の当たらない所は青むらさき寄りにして黒くつぶさない（D.mood の 'abyss' を上書き）。
// 主役はランタンをさげた水番の少年（R.actor の toon）。水ぞいの細い石の通路を奥へ歩き、低い うしろからカメラが追う。水が流れ、光の中にちりが舞い、こうもりが飛び、ときどき水てきが落ちる。
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), W = PACK_FWILD(THREE, K, R), PK = PACK_RUINS(THREE, K, R), D = PACK_DARK(THREE, K, R), T = R.tex, X = W.tex, { hash } = K, PI = Math.PI;
const { scene, cam, renderer, onResize } = K.stage({ fov: 54, far: 300, aa: false, fitAspect: .9, maxFov: 80 });
const hero = R.actor({ build: 'toon', hairStyle: 'spiky', hair: '#2a2228', skin: '#c88a5a', eyes: 'big', cloth: 'vest', top: '#e8d8b0', top2: '#3a6aa8', lower: 'baggy', bottom: '#3a5a8a', belt: '#a8483a', shoes: 'shoe', shoe: '#6a4a34', gloves: 'wrap', glove: '#e8d8b0', hat: 'band', acc: '#e8d8b0', back: 'bag' }); scene.add(hero);
const FOG = '#1e1c26', mood = D.mood(scene, renderer, 'abyss', { sky: [FOG, FOG, FOG, FOG], fog: [FOG, 8, 62], hemi: ['#b0a4c8', '#3a3040', 1.05], key: ['#fff0d0', .5, [.15, .95, .1]], fill: ['#6a5a7a', .35], base: [.46, .44, .62], hills: false, stars: false, shadow: false, r: 200 });

// ---- トンネルの形：左に石の通路（x -1.4〜1.1）、右に水の みぞ（x 1.1〜3.3、水面 y=-.45）。丸天井は y 2.7 から 3.9 ----
const XL = -1.4, XW = 1.1, XR = 3.3, WY = -.45, WH = 2.7, VH = 1.2, CX = (XL + XR) / 2, HWD = (XR - XL) / 2, Z1 = 14, Z0 = -130, SP = 9, SHAFTS = []; for (let z = 4; z > Z0 + 10; z -= SP) SHAFTS.push(z);
const STONE = '#8a705a', LIT = SHAFTS.map(z => ({ x: 1, y: .3, z: z - 1, c: '#fff0c8', r: 3.2, k: 1.6 }));
const bake = W.bake(LIT, mood.base), bakeC = W.bake(LIT.map(l => ({ ...l, y: WH + VH, r: 2.6, k: 1.2 })), [.4, .38, .55]);
const Q = (G, col, ...q) => G.tint(col).quad(...q).tint(null), fixed = [], put = (o, x, z, ry = 0, y = 0) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
const stoneT = D.tex.stone({ c: STONE, moss: .2, stain: .5 }), floorT = X.dungeon({ kind: 'floor', c: '#7a6a58', moss: .1 }), wetT = D.tex.wetCobble({ c: '#6a6070', wet: .6, shine: '#c8b8a0' });
{ const G = R.geo(), Gf = R.geo(), Gw = R.geo(), N = 7, P = i => { const a = PI - i / N * PI; return [CX + Math.cos(a) * HWD, WH + Math.sin(a) * VH]; }, hole = z => SHAFTS.some(s => Math.abs(z - 1 - s) < .9);
  for (let z = Z1; z > Z0; z -= 2) { const a = z - 2, b = z, c = (x, y) => bakeC(x, z - 1, y);
    for (let i = 0; i < N; i++) { const [x0, y0] = P(i), [x1, y1] = P(i + 1); if ((i === 3) && hole(z)) continue; Q(G, c((x0 + x1) / 2, y0), [x0, y0, a], [x1, y1, a], [x1, y1, b], [x0, y0, b], [i * .3, a / 3, (i + 1) * .3, b / 3]); }   // 丸天井（たて穴の所だけ まん中をあける）
    Q(G, c(XL, 1).map(v => v * .9), [XL, -.05, b], [XL, -.05, a], [XL, WH, a], [XL, WH, b], [b / 3, 0, a / 3, WH / 3]); Q(G, c(XR, 1).map(v => v * .9), [XR, WY - .8, a], [XR, WY - .8, b], [XR, WH, b], [XR, WH, a], [a / 3, 0, b / 3, (WH - WY + .8) / 3]);   // 左右のかべ
    for (const h of [0, 1]) { const za = a + h, zb = a + h + 1; Q(Gf, bake(-.2, za + .5, 0), [XL, 0, zb], [XW, 0, zb], [XW, 0, za], [XL, 0, za], [XL / 2, zb / 2, XW / 2, za / 2]); } Q(Gf, bake(1, z - 1, 0).map(v => v * .8), [XW, -.9, b], [XW, -.9, a], [XW, 0, a], [XW, 0, b], [b / 2, 0, a / 2, .45]);   // 通路と、みぞのふち
    Q(Gw, bake(2.2, z - 1, WY).map(v => v * 1.15), [XW, WY, b], [XR, WY, b], [XR, WY, a], [XW, WY, a], [0, b / 2.2, 1, a / 2.2]); }
  for (const s of SHAFTS) { const r = .85, x = CX, y0 = WH + VH - .2, y1 = y0 + 14; for (const [ax, az, bx, bz] of [[-r, r, r, r], [r, r, r, -r], [r, -r, -r, -r], [-r, -r, -r, r]]) G.quad([x + bx, y0, s - 1 + bz], [x + ax, y0, s - 1 + az], [x + ax, y1, s - 1 + az], [x + bx, y1, s - 1 + bz], [0, y0 / 3, .6, y1 / 3], [.55, .55, 1.4, 1.4]); }   // たて穴（上ほど明るい）
  { const Gs = R.geo(); for (const z of SHAFTS) Gs.quad([CX - .85, WH + VH + 13.6, z - .15], [CX + .85, WH + VH + 13.6, z - .15], [CX + .85, WH + VH + 13.6, z - 1.85], [CX - .85, WH + VH + 13.6, z - 1.85]); const sk = Gs.mesh(T.sand({ c: '#fff0d0' }), { glow: true, side: true }); scene.add(sk); }   // たて穴の上の、昼の空の光
  for (let z = Z1 - 1; z > Z0; z -= 4) for (let i = 0; i < N; i++) { const [x0, y0] = P(i), [x1, y1] = P(i + 1); if (i === 3 && hole(z + .5)) continue; Q(G, bakeC(CX, z, y0).map(v => v * 1.2), [x0 * .97 + CX * .03, y0 - .12, z - .3], [x1 * .97 + CX * .03, y1 - .12, z - .3], [x1 * .97 + CX * .03, y1 - .12, z + .3], [x0 * .97 + CX * .03, y0 - .12, z + .3], [0, 0, .3, .2]); }   // 4 m ごとの あばら石
  const m1 = G.mesh(stoneT, { side: true }), m2 = Gf.mesh(floorT), m3 = Gw.mesh(T.water({ c: '#3a5a8a' })[0]); m1.castShadow = false; fixed.push(m1, m2); scene.add(m3); var water = m3; }
const WF = T.water({ c: '#3a5a8a' }); water.material.transparent = true; water.material.opacity = .9;

// ---- 光のすじ（たて穴から）、床と水の光の輪、光の中のちり ----
const beams = SHAFTS.map((z, i) => { const s = D.shaft({ w: 1.7, h: 5, c: '#fff0c0', a: .5, lean: [-.15, .1] }); s.position.set(CX - .3, WY, z - 1.1); scene.add(s); return s; });
fixed.push(D.pools(SHAFTS.flatMap(z => [{ p: [-.1, .1, z - 1.2], r: 1.8, r2: 1.3, c: '#ffe8b0', k: 1.2 }, { p: [2.1, WY + .06, z - 1.2], r: 1.6, r2: 1.2, c: '#e8f4ff', k: 1 }])));
const motes = SHAFTS.slice(0, 6).map(z => { const m = PK.motes({ n: 8, area: [1.4, 3.5, 1.4], c: '#fff4d0', size: 1, a: .45 }); m.position.set(CX, 0, z - 1); scene.add(m); return m; });
// 通路の小物：かめ、木のおけ、水番の道具、石のふた。かべのくぼみに小さな油皿
for (let i = 0; i < 14; i++) { const z = 6 - i * 8.6 - hash(i, 1) * 3, k = i % 4; put(k === 0 ? R.barrel({ h: .6, r: .24, c: '#7a5a3a' }) : k === 1 ? R.rock({ s: .4, c: '#6a5a50', seed: i }) : k === 2 ? R.crate({ s: .45, c: '#7a6048' }) : PK.rubble({ r: .6, h: .3, slabs: 2 }), XL + .4, z, i); }
put(D.candles({ n: 3, len: .4, h: .12, light: false }), XL + .12, -21, PI / 2, 1.3); put(D.candles({ n: 2, len: .3, h: .12, light: false }), XL + .12, -57, PI / 2, 1.3);
scene.add(R.merge(fixed));
scene.add(D.flock({ kind: 'bat', n: 6, r: 1.6, h: .6, center: [CX, WH + .6, -30], s: 1.2, speed: 1.4 }), D.flock({ kind: 'bat', n: 4, r: 1.2, h: .4, center: [CX, WH + .5, -66], s: 1.1, speed: 1.6 }));
const fx = K.fx(scene, 30);

const lamp = D.lantern(hero, { hand: 'R', power: 9, range: 7, r: 2.4, k: .7 }), crt = R.crt(renderer, { noise: 0, bright: 1.08 }); onResize(crt.resize);
const ZS = 10, LEN = 72, SPEED = 1.35;
K.loop((dt, t) => {
  const z = ZS - (t * SPEED) % LEN, x = -.25 + Math.sin(z * .2) * .08;
  hero.position.set(x, 0, z); hero.rotation.y = PI; R.walk(hero, t * SPEED * 3.7, .85); D.lanternPose(hero); lamp.userData.spot.position.y = .06;
  const tall = innerWidth < innerHeight, Dc = tall ? 3.4 : 3.9; cam.position.set(x - .3, tall ? 1.85 : 1.6, z + Dc); cam.lookAt(x + .5, tall ? 1.3 : 1.25, z - 8);   // 低い うしろから、トンネルの奥の光の列を見る
  R.flip(water.material, WF, t, 6); water.material.map.offset.y = -t * .35;
   motes.forEach(m => m.userData.tick(t));
  if (Math.floor(t * 1.3) !== Math.floor((t - dt) * 1.3)) { const s = SHAFTS[Math.floor(hash(Math.floor(t * 1.3), 2) * 6)], dz = z - s; if (Math.abs(dz) < 30) fx.emit('splash', 2.2 + (hash(Math.floor(t), 3) - .5), WY + .1, s - 1, { size: .35, life: .5, vy: .6, grow: .5 }); }
  D.tick(t, cam); fx.update(dt); crt.render(scene, cam, t);
});
</script>
