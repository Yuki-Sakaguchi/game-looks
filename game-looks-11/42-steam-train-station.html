{ const B = R.parts(), Cf = B.g(F.tex.clock(), { side: true }), Ir = B.g(IRON); for (const z of [-4, -28]) { Cf.quad([-2.6, 4.1, z], [-1.4, 4.1, z], [-1.4, 5.3, z], [-2.6, 5.3, z]); Ir.box(.05, 4, .05, -2.0, 5.3, z, { m: 1 }); } fixed.push(B.group()); }
for (let z = 6; z > -46; z -= 8) put(R.lamp({ h: 3.2, c: '#3a4050' }), -4.4, z, 0, 1);
[[-4.2, -1, 'bench'], [-4.3, -17, 'bench'], [-4.1, 3, 'crate'], [-3.6, 3.4, 'crate'], [-4.2, -9, 'barrel'], [-4.2, -24, 'crate'], [-3.8, -24.6, 'crate']].forEach(([x, z, k], j) => put(k === 'bench' ? R.bench({ c: '#5a4030' }) : k === 'crate' ? R.crate({ c: ['#8a5a3a', '#6a7a5a'][j % 2], s: .7, kind: 'plain' }) : R.barrel({ c: '#7a5a3a', h: .8 }), x, z, k === 'bench' ? PI / 2 : j, 1));
put(R.cart({ load: 'crates' }), -3.4, -12, -PI / 2 + .1, 1);
put(S.gauge({ r: .3 }), XL - 1.25, -15.4, -PI / 2, 2.4);
scene.add(R.merge(fixed));
scene.add(R.backdrop({ c: '#a8987a', haze: '#f4dcb0', r: 160, h: 30, y: -2, rep: 3 }));
// 光のすじ（右上から、ガラスのすきまを ぬけて床へ）
for (const [x, z, w] of [[-.5, 4, 3], [-1.2, -6, 2.4], [-.2, -16, 3.2], [-1.6, -27, 2.6], [.4, -38, 3]]) { const s = C.shaft({ w, h: 11, c: '#ffe0a0', a: .2, lean: -.32, n: 2 }); s.position.set(x, 1, z); scene.add(s); }
// けむりと蒸気
const smoke = C.steam({ n: 14, r: 1.4, rise: 7, a: .9, speed: .2, c: '#7a7480', spread: .9, wind: [-2.2, -1.4] }); smoke.position.set(XL, 3.7, ZF - .55); scene.add(smoke);
for (const s of [-1, 1]) { const st = C.steam({ n: 7, r: .4, rise: 1.6, a: .6, speed: .5, jet: .7, dir: [s, .15, .3], phase: s * .3 }); st.position.set(XL + s * 1.3, .9, ZF - .3); scene.add(st); }
const dome = C.steam({ n: 6, r: .35, rise: 1.4, a: .5, speed: .45, jet: .5 }); dome.position.set(XL, 3.5, ZF - 4.6); scene.add(dome);

// ---- 人（5 頭身の toon。どれもこの場面のためのオリジナル） ----
const act = (o, x = 0, z = 0, ry = 0, y = 1) => { const p = R.actor({ build: 'toon', ...o }); p.position.set(x, y, z); p.rotation.y = ry; scene.add(p); return p; };
const hero = act({ sex: 'f', hairStyle: 'tail', hair: '#3a2a28', eyes: 'big', mouth: 'small', cloth: 'coat', top: '#b8423a', top2: '#f0e4cc', bottom: '#3a3a48', lower: 'skirt', skirt: .55, tights: '#3a3a48', gloves: 'glove', glove: '#5a3a2a', shoes: 'boot', shoe: '#4a3428', neck: 'scarf', acc: '#e8c060', hold: 'case' });
const porter = act({ hairStyle: 'short', hair: '#2a2228', beard: 'stubble', cloth: 'overall', top: '#4a5a78', top2: '#e8dcc0', shoe: '#2a2228', hat: 'cap', acc: '#4a5a78' }); F.wear(porter, 'box', { c: '#8a5a3a' }); F.carryPose(porter);
const conductor = act({ hairStyle: 'short', hair: '#6a6060', beard: 'mustache', cloth: 'coat', top: '#2e3a5a', top2: '#c8963a', bottom: '#2e3a5a', shoe: '#1e1e24', hat: 'cap', acc: '#2e3a5a' }, .6, ZF + 2.6, PI * .8);
const pass = [act({ sex: 'f', hairStyle: 'bun', hair: '#c88a4a', cloth: 'coat', top: '#4f8f80', top2: '#f0e8d8', lower: 'skirt', skirt: .9, shoes: 'shoe', shoe: '#3a2a28', hold: 'case' }),
  act({ hairStyle: 'spiky', hair: '#4a3a30', cloth: 'jacket', top: '#8a6a3a', top2: '#e8dcc0', bottom: '#4a4450', shoe: '#2a2228', back: 'pack' }),
  act({ s: .72, hairStyle: 'twin', hair: '#2a2228', mouth: 'open', blush: true, cloth: 'tunic', top: '#e8c060', top2: '#fff0d8', lower: 'skirt', skirt: .5, shoes: 'shoe', shoe: '#a8443a' })];
const driver = act({ hairStyle: 'short', hair: '#2a2228', beard: 'beard', cloth: 'overall', top: '#3a4a6a', top2: '#d8c8a8', hat: 'cap', acc: '#3a3a44' }, XL - .3, ZF - 6.4, -PI / 2, 1.18);
const pig = [...Array(7)].map((_, k) => { const b = R.bird({ c: '#8a8c9c', belly: '#b8b8c8', neck: true, s: 1.5 }); scene.add(b); return b; });

const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
const Z0 = 9, LEN = 34, SPEED = 1.25;
K.loop((dt, t) => {
  const z = Z0 - (t * SPEED) % LEN, x = -1.1 + Math.sin(z * .12) * .25;
  hero.position.set(x, 1, z); hero.rotation.y = PI; R.walk(hero, t * SPEED * 3.6, .8); hero.userData.J.armR.rotation.x = .05;
  const tall = innerWidth < innerHeight, D = tall ? 3.9 : 4.8; cam.position.set(x - .9, 1 + (tall ? 2.2 : 2.1), z + D); cam.lookAt(x + .9, 2.1, z - 6);
  sun.position.set(x + SUN.x * 60, SUN.y * 60, z + SUN.z * 60); sun.target.position.set(x, 1, z - 6); land.follow(x, z - 10);
  // 荷物を運ぶ人は手前へ、親子づれは奥へ、旅の人は ホームの はしで待つ
  const pz = -38 + ((t * 1.1) % 50); porter.position.set(-2.8, 1, pz); porter.rotation.y = 0; R.walk(porter, t * 4, .6); F.carryPose(porter);
  const qz = z - 5 - ((t * .3) % 4); pass[0].position.set(-2.6, 1, qz); pass[0].rotation.y = PI; R.walk(pass[0], t * 4.3, .75);
  pass[2].position.set(-2.1 + Math.sin(t * 2) * .2, 1, qz + .6); pass[2].rotation.y = PI + Math.sin(t * 2) * .3; R.walk(pass[2], t * 7, 1);
  pass[1].position.set(-1.9, 1, -20); pass[1].rotation.y = PI / 2 + Math.sin(t * .4) * .4; R.idle(pass[1], t, Math.sin(t * .5) * .6);
  R.idle(conductor, t, Math.sin(t * .4) * .4); conductor.userData.J.armR.rotation.set(-2.4 + Math.sin(t * 4) * .3, 0, .3);
  R.idle(driver, t, .3); driver.userData.J.armL.rotation.x = -.8;
  pig.forEach((b, k) => { const hx = -3.6 + hash(k, 1) * 3.2, hz = -2 - k * 3.1, d = Math.hypot(hx - x, hz - z), up = Math.max(0, 2.8 - d); b.position.set(hx - up * .6, 1 + up * 1.7, hz - up * .5); b.rotation.y = up > 0 ? PI / 2 + .4 : hash(k, 2) * 6 + Math.sin(t * .6 + k); R.birdPose(b, up > .05 ? 'fly' : 'peck', t + k); });
  S.tick(t); C.update(t, cam); crt.render(scene, cam, t);
});
