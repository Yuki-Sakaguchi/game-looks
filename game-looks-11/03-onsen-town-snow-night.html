<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>11-03 雪の温泉街 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#101830;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#f4ecdc;opacity:.9;text-shadow:0 1px 0 #000}
</style>
<div id="cap">11-03 ─ 雪の温泉街 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="../game-looks-8/pack-fantasy-town.js"></script>
<script src="../game-looks-9/pack-dark.js"></script>
<script src="pack-wa1.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 雪のふる夜の温泉街。川ぞいの雪の道に、木の 2 階建ての宿がならび、窓とちょうちんが あたたかく ともる。川からは湯けむりが立ちのぼり、先に石の太鼓橋。空には月。
// 色の組は「夜空と雪の青・宿の こげ茶の木」＋あかりの だいだい（窓・ちょうちん）。暗くはせず、月の光と窓のあかりで雪の道を明るく読ませる。
// 主役は ゆかたに羽織、赤い和がさの むすめ（R.actor の toon）。川の上から、ななめ横に追うカメラで、川・主役・宿を 1 枚に入れる。ゆかたの人・宿のおかみ・ねこ・湯けむり・雪・川が動く。部品は pack-fantasy-town.js（F.）・pack-dark.js（D. 月と雪）・pack-wa1.js（W.）
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), F = PACK_FTOWN(THREE, K, R), D = PACK_DARK(THREE, K, R), W = PACK_WA1(THREE, K, R, F), T = R.tex, { hash } = K, PI = Math.PI;
const { scene, cam, renderer, onResize } = K.stage({ fov: 40, far: 600, aa: false, fitAspect: .9, maxFov: 70 });
const hero = R.actor({ build: 'toon', sex: 'f', hairStyle: 'bun', hair: '#2a2228', mouth: 'smile', blush: true, cloth: 'robe', top: '#2e3e7a', top2: '#e8ecf4', skirt: .9, shoes: 'shoe', shoe: '#c8a070', neck: 'collar', acc: '#e8b040' }); scene.add(hero);
{ const u = W.umbrella(hero, { c: '#d84a32', c2: '#f4e8cc' }); hero.add(u); u.position.set(.1, .76, .2); u.rotation.set(-.2, 0, -.05); }
const mood = D.mood(scene, renderer, 'moon', { follow: hero, range: 26, sky: ['#121c44', '#22336a', '#3e5896', '#7a92c4'], fog: ['#4a5c8e', 26, 140], hemi: ['#b8c8f4', '#4a4e6e', 1.45], key: ['#dce6ff', 1.5, [.35, .62, -.7]], fill: ['#8a96c8', .6], hills: '#2a3660', base: [.92, .96, 1.08], stars: 160 });
scene.add(D.moon({ r: 22, az: 28, el: 30, c: '#f4f6ea' }));

// ---- 地面：雪の道（まん中は石だたみが少しのぞく）、川は低く、うしろは山 ----
const RZ0 = 2.8, RZ1 = 7.4, RC = (RZ0 + RZ1) / 2, sstep = (a, b, v) => { const k = Math.max(0, Math.min(1, (v - a) / (b - a))); return k * k * (3 - 2 * k); };
const H = (x, z) => (z > RZ0 - .2 && z < RZ1 + .2 ? -2.2 : 0) + sstep(-16, -40, z) * (9 + Math.sin(x * .07) * 4) + sstep(14, 40, z) * 6;
const LIT = []; for (let x = -50; x < 150; x += 6.6) LIT.push({ x, z: -2.2, r: 3.6, c: '#ffb860', k: 1.15 });
const land = R.ground({ w: 120, d: 110, cell: 1, cz: -8, H, layers: [T.snow({ c: '#c6d2ec' }), T.cobble({ kind: 'slab', c: '#7a7a92', moss: 0 }), T.snow({ c: '#b4c0e0', seed: 3 })], shade: mood.shade(LIT),
  mix: (x, z) => [Math.abs(z - .2) < 2.2 ? Math.max(0, Math.sin(x * .9 + z * 1.3) * Math.sin(x * .37 - z) + .35 - Math.abs(z) * .1) * 1.6 : 0, z < -8 || z > 12 ? 1 : 0] }); scene.add(land.mesh);
const fixed = [], put = (o, x, z, ry = 0, y) => { o.position.set(x, y ?? H(x, z), z); o.rotation.y = ry; fixed.push(o); return o; };

// ---- 川（石の岸。水はコマ送り）と、太鼓橋 ----
const river = F.canal({ len: 220, w: RZ1 - RZ0 - 1.2, depth: 1.4, water: '#2e4a7a', stone: F.tex.ashlar({ c: '#8a8aa0', moss: .2 }) }); river.position.set(50, 0, RC); river.rotation.y = PI / 2; scene.add(river);
const BX = 12; put(F.bridge({ span: 7.4, w: 2.6, rise: 1.4, stone: F.tex.ashlar({ c: '#a49c98', moss: .1 }) }), BX, RC, PI / 2, 0);

// ---- 宿：こげ茶の板ばり＋白かべ、雪をかぶった かわら屋根、2 階建て。窓は あかり、入口にのれん ----
const SNOWROOF = F.tex.kawara({ c: '#b4c0dc' }), SNOWROOF2 = F.tex.kawara({ c: '#a8b4d4', seed: 2 }), BOARD = T.boards({ c: '#6a4632' }), BOARD2 = T.boards({ c: '#56402e', seed: 2 }), SHIRO = F.tex.shiro({ c: '#e8e0cc', wood: '#4a3428' });
const winP = T.window({ bars: 'grid', curtain: '#f4e0b0', frame: '#3a2a22' }), winL = T.window({ bars: 'grid', lit: 1, curtain: '#ffd890', frame: '#3a2a22' }), DOOR = T.door({ style: 'glass', c: '#4a3428', lit: 1 });
const KIND = [{ w: 7.4, d: 6.4, h: 2.9, h2: 2.6, wall: BOARD, wall2: BOARD2, roof: SNOWROOF, pitch: .55, eave: 1 }, { w: 6.2, d: 6, h: 2.8, h2: 2.4, wall: SHIRO, wall2: BOARD, roof: SNOWROOF2, pitch: .6, eave: .9, ridge: 'z' }, { w: 8, d: 6.6, h: 3, h2: 2.6, wall: BOARD2, wall2: SHIRO, roof: SNOWROOF, pitch: .5, eave: 1.1 }];
const LAN = [], NOREN = ['#2a3a6a', '#7a2a2a', '#2e5a5a'];
{ let x = -46, i = 0; while (x < 150) { const k = KIND[i % 3], cx = x + k.w / 2, cz = -3.2 - k.d / 2;
    put(R.house({ ...k, win: winP, winLit: winL, lit: .85, door: DOOR, seed: i, wins: { f: 2, b: 0, l: 1, r: 1 }, wins2: { f: 3, b: 0, l: 1, r: 1 } }), cx, cz, 0);
    put(F.flag({ kind: 'drape', w: 1.3, h: .95, c: NOREN[i % 3], c2: '#f0e8d8', crest: ['wave', 'moon', 'sun'][i % 3], cc: '#f0e8d8' }), cx, -3.12, 0, 2.3);
    LAN.push([cx - k.w * .3, -2.8], [cx + k.w * .3, -2.8]); x += k.w + 1.4 + hash(i, 4) * 1.6; i++; } }
for (const [x, z] of LAN) { put(W.chochin({ s: 1 }), x, z, 0, 2.95); }
// 岸の石灯ろう・ベンチ・雪をかぶった松・たる
for (let i = 0; i < 18; i++) { const x = -40 + i * 9 + hash(i, 1) * 3; if (Math.abs(x - BX) < 3) continue; put(i % 3 === 0 ? R.tree({ kind: 'pine', h: 4.5 + hash(i, 2) * 2, c: '#3a5a66', seed: i }) : F.stoneLantern({ h: 1.4, lit: true }), x, 2.1, i); }
[[4, 'bench'], [31, 'barrel'], [48, 'bench'], [66, 'barrel']].forEach(([x, k], j) => put(k === 'bench' ? R.bench({ c: '#5a4030' }) : R.barrel({ c: '#6a4a34' }), x, k === 'bench' ? -2.2 : -2.6, 0));
// 向こう岸：雪の土手と木、湯小屋
for (let i = 0; i < 28; i++) { const x = -40 + i * 6.5 + hash(i, 6) * 3; put(R.tree({ kind: i % 3 ? 'pine' : 'tall', h: 6 + hash(i, 7) * 4, c: ['#34505e', '#3a5866'][i % 2], seed: i + 30 }), x, 12 + hash(i, 8) * 9, i); }
// 山の木（宿のうしろ）
for (let i = 0; i < 70; i++) { const x = -50 + hash(i, 11) * 200, z = -16 - hash(i, 12) * 26; put(R.tree({ kind: 'pine', h: 7 + hash(i, 13) * 6, c: ['#2e4858', '#344e5e'][i % 2], seed: i }), x, z, i); }
scene.add(R.merge(fixed));
scene.add(R.backdrop({ c: '#3a4a7a', haze: '#6a7cae', r: 170, h: 70, y: -2, rep: 2 }));

// ---- 窓とちょうちんの光（地面の輪＋主役のまわりの PointLight 3 つ） ----
scene.add(D.pools(LAN.map(([x, z]) => ({ p: [x, H(x, z) + .02, z + .6], r: 1.8, c: '#ffb050', k: .5 }))));
const pl = [0, 1, 2].map(() => { const l = new THREE.PointLight('#ffb060', 7, 8, 1.6); scene.add(l); return l; });

// ---- 人（5 頭身の toon。どれもこの場面のためのオリジナル） ----
const act = (o, x = 0, z = 0, ry = 0) => { const p = R.actor({ build: 'toon', ...o }); p.position.set(x, H(x, z), z); p.rotation.y = ry; scene.add(p); return p; };
const YU = { cloth: 'robe', skirt: .9, shoes: 'shoe', shoe: '#c8a070' };
const guestA = act({ ...YU, hairStyle: 'short', hair: '#2a2228', top: '#dce4f4', top2: '#2e3e7a', neck: 'collar' }), guestB = act({ ...YU, sex: 'f', hairStyle: 'bob', hair: '#3a2a28', mouth: 'smile', top: '#f0dce4', top2: '#8a3a4a' });
const kid = act({ ...YU, s: .72, hairStyle: 'tufts', hair: '#2a2228', mouth: 'open', blush: true, top: '#e8a43a', top2: '#f8f0e0', skirt: .4 });
const okami = act({ sex: 'f', hairStyle: 'bun', hair: '#2a2228', mouth: 'smile', cloth: 'robe', top: '#6a2a3a', top2: '#e8d8c0', skirt: .95, shoes: 'shoe', shoe: '#e8e0d0' }, 0, -2.6, 0); F.wear(okami, 'apron', { c: '#f0ece0', len: .5 });
const cat = R.cat({ c: '#f0ece4', belly: '#ffffff' }); scene.add(cat);
// 湯けむり：やわらかい丸の板（カメラを向く）が、川の上で ゆっくり のぼって消える
const puffT = (() => { const c = document.createElement('canvas'); c.width = c.height = 32; const g = c.getContext('2d'), gr = g.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.55, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 32, 32); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
const steam = [...Array(34)].map((_, i) => { const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: puffT, color: '#e8eefa', transparent: true, opacity: 0, depthWrite: false })); sp.userData.p = [hash(i, 41) * 30, hash(i, 42), hash(i, 43) * 3 + .4, .7 + hash(i, 44) * .6]; scene.add(sp); return sp; });
const snow = D.flakes({ kind: 'snow', n: 520, box: [30, 14, 30], size: 1.8 }); scene.add(snow);
const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
const SPEED = 1.15, X0 = -2, LOOP = 96; 
K.loop((dt, t) => {
  const x = X0 + (t * SPEED) % LOOP, z = .4, onB = 0; hero.position.set(x, H(x, z), z); hero.rotation.y = PI / 2; R.walk(hero, t * SPEED * 3.4, .8); hero.userData.J.armR.rotation.x = -.45; hero.userData.J.armR.rotation.z = .25; hero.userData.J.foreR.rotation.x = -1.1;
  const tall = innerWidth < innerHeight; if (tall) cam.position.set(x - 1.5, 3.1, 7.4); else cam.position.set(x - 2.4, 3.3, 8.2); cam.lookAt(x + (tall ? .9 : 1.9), .7, .2);
  // あかり：主役の近くの ちょうちん 3 つ
  LAN.slice().sort((a, b) => Math.abs(a[0] - x - 2) - Math.abs(b[0] - x - 2)).slice(0, 3).forEach(([lx, lz], k) => pl[k].position.set(lx, 2.4, lz + .3));
  // ゆかたの 2 人は向こうから来てすれちがう。子どもは前を行ったり来たり。おかみは宿の前でおじぎ
  const gx = x + 16 - ((t * 1.9) % 30); guestA.position.set(gx, H(gx, -.9), -.9); guestA.rotation.y = -PI / 2; R.walk(guestA, t * 3.6, .75); guestB.position.set(gx + .2, H(gx, -1.6), -1.6); guestB.rotation.y = -PI / 2; R.walk(guestB, t * 3.6 + 1.4, .75);
  const kx = x + 3.5 + Math.sin(t * .8) * 1.6; kid.position.set(kx, 0, 1.4); kid.rotation.y = Math.cos(t * .8) > 0 ? PI / 2 : -PI / 2; R.walk(kid, t * 8, 1); kid.position.y = Math.abs(Math.sin(t * 8)) * .06;
  const ox = Math.round((x + 6) / 20) * 20 + 3; okami.position.set(ox, 0, -2.7); R.idle(okami, t, 0); okami.userData.J.torso.rotation.x = Math.max(0, Math.sin(t * .9)) * .45;
  cat.position.set(Math.round((x + 9) / 25) * 25 + 1, 0, -2.3); cat.rotation.y = .7; R.catPose(cat, 'sit', t);
  // 湯けむり：川の上と、宿のうしろの湯小屋から
  steam.forEach(sp => { const [ox, ph, dz, sc] = sp.userData.p, f = ((t * .22 + ph) % 1), bx = x - 6 + (((ox - x) % 30) + 30) % 30; sp.position.set(bx + Math.sin(t * .5 + ph * 9) * .4 + f * 1.2, -.7 + f * 3.2, RZ0 + dz); sp.scale.setScalar((.6 + f * 1.5) * sc); sp.material.opacity = Math.sin(f * PI) * .28; });
  D.tick(t, cam); F.tick(t); crt.render(scene, cam, t);
});
</script>
</html>
