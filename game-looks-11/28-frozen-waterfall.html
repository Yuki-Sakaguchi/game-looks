<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>11-28 凍った滝 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#1c2438;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#f4f6fa;opacity:.9;text-shadow:0 1px 0 #000}
</style>
<div id="cap">11-28 ─ 凍った滝 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="../game-looks-8/pack-fantasy-wild.js"></script>
<script src="pack-snow2.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 冬の朝。高いがけから落ちる大きな滝が、そのまま青白い氷の柱の束になって凍りつき、下の滝つぼも一面の氷。右から さしこむ朝日が氷を光らせ、きらきらした粒が舞う。
// 色の組は「氷の水色・雪の白・がけの灰むらさき」＋差し色は 朝日の もも色と金。凍った滝は、たてのすじと気ほうを打った 64 ドットの絵を、ふくらみのある柱（R.geo の loft）にはって作る。
// 主役は R.actor の toon（青緑の上着の少女）。滝つぼの氷の上を、左から右へ横切る。カメラは横から少し見上げ、うしろに凍った滝の全体を入れる。氷・がけ・つらら・水は pack-fantasy-wild.js（F.〜）
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), F = PACK_FWILD(THREE, K, R), S = PACK_SNOW2(THREE, K, R), T = R.tex, X = F.tex, { hash } = K, PI = Math.PI;
const { scene, cam, renderer, onResize } = K.stage({ fov: 50, far: 800, aa: false, fitAspect: .9, maxFov: 78 });
scene.add(R.skyDome([[0, '#3a5aa8'], [.42, '#7a92d0'], [.72, '#d4b0c8'], [.88, '#f8c8a8'], [1, '#ffe4b0']], { r: 400 })); scene.fog = new THREE.Fog('#d8c4d0', 60, 280);
const { sun } = K.lights(scene, renderer, { sky: 0xd0d8ff, ground: 0x9a9ac8, amb: 1.45, sun: 0xffd0a8, power: 2.4, range: 34 }), SUN = new THREE.Vector3(.82, .3, .2).normalize();

// ---- 地面：まん中が凍った滝つぼ（だ円）。まわりは雪の土手、うしろは がけ ----
const ell = (x, z) => Math.hypot(x / 21, (z + 6.5) / 13.5), cl = v => Math.max(0, Math.min(1, v)), sstep = (a, b, v) => { const k = cl((v - a) / (b - a)); return k * k * (3 - 2 * k); };
const H = (x, z) => sstep(.97, 1.25, ell(x, z)) * (2.2 + F.vn(x * .12, z * .12, 3) * 2.2) + sstep(1.3, 2.2, ell(x, z)) * 3;
const land = R.ground({ w: 150, d: 120, cell: 2, cz: -10, H, layers: [X.ice({ c: '#8ccfee', m: 4 }), T.snow({ c: '#f2f4fa' }), T.snow({ c: '#c0c8ec', seed: 3 })],
  mix: (x, z) => { const e = ell(x, z); return [e > .97 ? 1 : F.vn(x * .3, z * .3, 6) > .72 && Math.abs(z - 1) > 2 ? .8 : 0, e > 1.05 && F.vn(x * .2, z * .2, 9) > .6 ? 1 : 0]; },   // 氷の上にも 吹きだまり
  shade: (x, z) => { const e = ell(x, z); if (e > .97) return [1, .98, 1]; const k = F.vn(x * .1, z * .1, 4), g = sstep(14, 2, Math.hypot(x, z + 13)); return [.6 + .3 * k + .3 * g, .8 + .25 * k + .2 * g, 1 + .08 * k]; } });
scene.add(land.mesh);

// ---- がけと、凍った滝 ----
const fixed = [], put = (o, x, z, ry = 0, y = H(x, z)) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
const CZ = -19.5, CH = 20, LEAN = .2, rockT = X.caveRock({ c: '#a49ab8', glint: false }), snowT = T.snow({ c: '#eef2fa' });
put(F.cliff({ w: 26, h: CH, d: 3, lean: LEAN, tex: rockT, top: snowT, seed: 2 }), -20, CZ + 2, .25, 0); put(F.cliff({ w: 26, h: CH - 2, d: 3, lean: LEAN, tex: rockT, top: snowT, seed: 5 }), 20, CZ + 2, -.25, 0); put(F.cliff({ w: 18, h: CH + 1, d: 2, lean: LEAN, tex: rockT, top: snowT, seed: 7 }), 0, CZ - 1.4, 0, 0);
// 凍った滝の絵：たてに流れる白と水色のすじ、柱のあいだの こい青、とじこめられた気ほう
const fallT = (() => { const P = R.Px(64), I = R.ramp('#8ad0f0', 6, { contrast: .9 }); P.each((x, y) => { const n = R.tn(x, y, 6, 32, 64, 64, 2), m = R.tn(x, y, 3, 8, 64, 64, 5), col = (x + Math.round(Math.sin(y * .2) * 1.5)) % 16;
    let t = n > .72 ? 5 : n > .52 ? 4 : n > .3 ? 3 : 2; if (col === 0) t = 1; else if (col === 1 || col === 15) t = Math.max(1, t - 1); if (m > .78 && t > 2) t = 5; if ((x * 7 + y * 3) % 23 === 0 && t < 5) t++; return I[t]; });
  for (let k = 0; k < 18; k++) { const x = Math.floor(hash(k, 1) * 62), y = Math.floor(hash(k, 2) * 62); P.set(x, y, '#ffffff'); P.set(x + 1, y + 1, I[2]); }
  for (let k = 0; k < 6; k++) { const x = Math.floor(hash(k, 3) * 60); for (let y = 0; y < 64; y++) if ((y + k * 7) % 13 < 6) P.set(x + (y % 9 === 0 ? 1 : 0), y, '#ffffff'); }
  return T.from(P, { m: 3 }); })();
{ const G = R.geo().smooth(1), N = 15, W = 15;
  for (let i = 0; i < N; i++) { const x0 = (i / (N - 1) - .5) * W + (hash(i, 1) - .5) * .8, r0 = .9 + hash(i, 2) * 1.1, top = CH - .5 - hash(i, 3) * (i % 4 === 0 ? 7 : 1.5), rings = [];
    for (let j = 0; j <= 8; j++) { const v = j / 8, y = v * top, bul = 1 + Math.sin(v * 9 + i * 2.3) * .22 + (1 - v) ** 3 * 1.6, zz = CZ + .9 - y * LEAN + (1 - v) ** 2 * 2.6; rings.push([y, r0 * bul * (j === 8 ? .55 : 1), r0 * .8 * bul, y / 3, .78 + v * .3, x0 + Math.sin(v * 6 + i) * .25, zz]); }
    G.loft(7, rings, { ur: Math.max(1, Math.round(r0 * 2)), rot: hash(i, 4) }); }
  // 滝の下の氷のもり上がり
  for (let i = 0; i < 9; i++) { const x = (i / 8 - .5) * 20, r = 2 + hash(i, 6) * 2; G.loft(7, [[-.2, r * 1.1, r * .9, 0, .8, x, CZ + 3.4], [r * .45, r * .78, r * .66, .5, 1, x, CZ + 3.1], [r * .85, r * .2, r * .2, 1, 1.12, x, CZ + 2.6]], { ur: 2, cap: 'top', rot: i }); }
  fixed.push(G.mesh(fallT, { emissive: '#1c4060' })); }
for (let i = 0; i < 26; i++) { const x = (hash(i, 7) - .5) * 30, y = CH - .5 - hash(i, 8) * 1.5; const sp = F.spike({ h: 1.5 + hash(i, 9) * 3, r: .25 + hash(i, 10) * .3, down: true, tex: fallT, seed: i }); sp.position.set(x, y, CZ + .6 - y * LEAN); fixed.push(sp); }   // がけの上のふちの つらら
// 岸の雪の針葉樹と岩、氷の上の大きな氷のかけら
for (let k = 0; k < 50; k++) { const a = hash(k, 11) * PI * 2, d = 1.12 + hash(k, 12) * .8, x = Math.cos(a) * 21 * d, z = -6.5 + Math.sin(a) * 13.5 * d; if (z < CZ + 3 || z > 9 || (z > 0 && Math.abs(x) < 26)) continue; put(S.snowPine({ h: 4.5 + hash(k, 13) * 4, snow: .7, seed: k, c: '#2a5a54' }), x, z, k); }
for (let k = 0; k < 16; k++) { const a = hash(k, 14) * PI * 2, x = Math.cos(a) * 21 * 1.05, z = -6.5 + Math.sin(a) * 13.5 * 1.05; if (z > -6) continue; put(R.rock({ s: .8 + hash(k, 15) * 1.4, c: '#8a86a6', seed: k }), x, z, k, H(x, z) - .3); }
for (let k = 0; k < 4; k++) { const x = (hash(k, 16) - .5) * 26, z = -13 + hash(k, 17) * 5; put(F.crystal({ h: 1 + hash(k, 18) * 1.6, n: 3, c: '#b0e4fa', seed: k }), x, z, k, -.1); }
scene.add(R.merge(fixed));
scene.add(R.backdrop({ c: '#9a90c0', haze: '#e0c4d0', r: 180, h: 46, y: -2, rep: 4 }), R.backdrop({ c: '#c4b4d8', haze: '#f0d4d4', r: 260, h: 90, y: -4, rep: 3, seed: 5 }));
const sunD = new THREE.Mesh(new THREE.CircleGeometry(12, 20), new THREE.MeshBasicMaterial({ color: '#fff0c8', fog: false })); sunD.position.copy(SUN).multiplyScalar(330); sunD.lookAt(0, 0, 0); scene.add(sunD);
for (let k = 0; k < 6; k++) { const c = R.cloud({ s: 14 + hash(k, 19) * 10, c: '#ffe4e0', shade: '#b8a0c8' }); c.position.set((hash(k, 20) - .5) * 360, 70 + hash(k, 21) * 40, -160 - hash(k, 22) * 120); scene.add(c); }

// ---- 動く物：凍りきらない細い流れ、朝日のすじ、氷のきらめき、小鳥、きつね ----
const ticks = [], add = o => { scene.add(o); if (o.userData.tick) ticks.push(o.userData.tick); return o; };
const trickle = add(F.waterfall({ w: 1.2, h: CH - 6, c: '#a8e0f8', lip: .8, bow: .1 })); trickle.position.set(6.2, 0, CZ + .6); trickle.scale.z = .6;
const glint = add(F.motes({ n: 90, box: [34, 10, 20], c: '#fff4d0', size: .14, rise: .05, drift: .3, y: .4 })); glint.position.set(0, 0, -5);
const birds = [0, 1, 2].map(k => { const b = R.bird({ c: '#4a5a7a', belly: '#e8e0d8', s: 1.3 }); scene.add(b); return b; });
const fox = R.cat({ c: '#e07a34', belly: '#f8f0e8', s: 1.25 }); scene.add(fox);
// 主役：青緑の上着の少女。はちまきと黄色い えりまき
const hero = R.actor({ build: 'toon', sex: 'f', hairStyle: 'long', hair: '#3a2a3a', mouth: 'smile', blush: true, cloth: 'coat', top: '#2e8a92', top2: '#f4ecd8', bottom: '#4a3a5a', gloves: 'glove', glove: '#f0ece0', shoes: 'boot', shoe: '#6a4a3a', neck: 'scarf', acc: '#f0c040', hat: 'band' }); scene.add(hero);
const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
const X0 = -11, LEN = 22, SPEED = 1.15, pz = x => 3.4 + Math.sin(x * .12) * .8;
K.loop((dt, t) => {
  const x = X0 + (t * SPEED) % LEN, z = pz(x), y = H(x, z);
  hero.position.set(x, y, z); hero.rotation.y = Math.atan2(1, pz(x + 1) - z); R.walk(hero, t * SPEED * 3.5, .8); hero.userData.J.head.rotation.y = -.35;   // 歩きながら 滝を見上げる
  hero.userData.J.head.rotation.x = -.2;
  const tall = innerWidth < innerHeight, Dc = tall ? 4.8 : 5.3; cam.position.set(x - 1.3, y + 1.3, z + Dc); cam.lookAt(x + .7, y + (tall ? 4.6 : 3.7), z - 8);   // 横から少し見上げる
  sun.position.set(x + SUN.x * 60, SUN.y * 60, z + SUN.z * 60); sun.target.position.set(x, 0, z - 4);
  birds.forEach((b, k) => { const a = t * (.35 + k * .05) + k * 2.1, r = 6 + k * 2; b.position.set(Math.cos(a) * r + 2, 10 + k * 2 + Math.sin(t + k) * .8, CZ + 6 + Math.sin(a) * r * .5); b.rotation.y = Math.atan2(-Math.sin(a), Math.cos(a) * .5); R.birdPose(b, 'fly', t * .6 + k); });
  const fx = 16 - ((t * 1.4) % 34), fz = -13 + Math.sin(fx * .3) * .6; fox.position.set(fx, H(fx, fz), fz); fox.rotation.y = -PI / 2; R.catPose(fox, 'walk', t * 7);
  for (const f of ticks) f(t, x, z); crt.render(scene, cam, t);
});
</script>
