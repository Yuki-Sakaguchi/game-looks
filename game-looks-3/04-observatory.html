<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3-04 星見の塔</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;image-rendering:pixelated}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#b080f0;opacity:.85}
</style>
<div id="cap">3-04 ─ 星見の塔 / 紫 1 色 ＋ 黄色い星の光　｜　見るだけ</div>
<script src="kit.js"></script><script src="diorama.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 岩山の上の天文台。色は紫の 6 段だけで、差し色は黄色（望遠鏡がとらえた星の光、星の模型、窓）。
// 丸屋根のすき間から望遠鏡が出て、その先へ黄色い光の筋がのびる。まわりを星の模型の輪が回る
import * as THREE from 'three';
const K = KIT(THREE), D = DIORAMA(THREE, K, { ramp: ['#000000', '#150a30', '#34186c', '#6a3aba', '#b282f2', '#f2e2ff'], acc: ['#6a4a00', '#d8a010', '#ffd84a', '#fff6c0'], dist: 34, height: 11, look: 5 });
const { world: w, g, a } = D, { add, box, hash } = K;
D.base(7.4, .5);
// 岩山
for (const [x, z, r, h] of [[0, 0, 4.6, 2.4], [-2.6, 1.6, 2.6, 1.6], [2.8, -1.2, 2.4, 1.4]]) { const m = add(w, new THREE.CylinderGeometry(r * .8, r, h, 8), g(.5), x, h / 2, z); m.rotation.y = x; }
// 塔の胴、階段、扉、窓
add(w, new THREE.CylinderGeometry(2.5, 2.8, 4.4, 12), g(.62), 0, 4.6, 0); add(w, new THREE.CylinderGeometry(2.9, 2.9, .3, 12), g(.82), 0, 6.9, 0); add(w, new THREE.CylinderGeometry(2.9, 2.9, .3, 12), g(.78), 0, 2.5, 0);
for (let k = 0; k < 9; k++) { const an = -.4 + k * .2; box(w, 1.3, .22, .6, g(.75), Math.cos(an) * 3.6, .3 + k * .26, Math.sin(an) * 3.6).rotation.y = -an; }
box(w, .9, 1.5, .2, g(.1), 0, 3.3, 2.74); for (let k = 0; k < 5; k++) { const an = 1 + k * 1.1; box(w, .5, .7, .16, a('#ffd84a'), Math.sin(an) * 2.62, 5.2, Math.cos(an) * 2.62).rotation.y = an; }
// 丸屋根（すき間あり）と望遠鏡
const dome = new THREE.Group(); dome.position.y = 7.05; w.add(dome);
add(dome, new THREE.SphereGeometry(2.7, 12, 7, .35, 5.6, 0, 1.571), new THREE.MeshStandardMaterial({ color: new THREE.Color(.7, .7, .7), flatShading: true, roughness: 1, side: THREE.DoubleSide }), 0, 0, 0);
const scope = new THREE.Group(); scope.rotation.set(0, .17, -.95, 'YXZ'); add(scope, new THREE.CylinderGeometry(.42, .5, 4.6, 8), g(.9), 0, 2, 0); add(scope, new THREE.CylinderGeometry(.56, .56, .4, 8), g(.5), 0, 4.3, 0); add(scope, new THREE.CylinderGeometry(.3, .3, .2, 8), a('#fff6c0'), 0, 4.52, 0); dome.add(scope);
const beamG = new THREE.ConeGeometry(1.6, 22, 10, 1, true); beamG.translate(0, -11, 0); const beam = new THREE.Mesh(beamG, new THREE.MeshBasicMaterial({ color: 0xffd84a, transparent: true, opacity: .2, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false })); beam.rotation.x = Math.PI; beam.position.y = 4.6; scope.add(beam);
// 星の模型：回る輪と小さな星
const orr = new THREE.Group(); orr.position.set(-4.6, 2.6, 2.4); w.add(orr); add(orr, new THREE.CylinderGeometry(.08, .12, 2.4, 5), g(.6), 0, -1.2, 0); add(orr, new THREE.SphereGeometry(.34, 8, 6), a('#ffd84a'), 0, 0, 0);
const rings = [1, 1.6, 2.2].map((r, i) => { const rg = add(orr, new THREE.TorusGeometry(r, .04, 4, 20), g(.85), 0, 0, 0); rg.rotation.x = 1.3 + i * .3; const p = add(rg, new THREE.SphereGeometry(.13 + i * .03, 6, 5), a(i === 1 ? '#fff6c0' : '#d8a010'), r, 0, 0); return rg; });
// 木、石碑、ふもとの小屋
for (const [x, z, h] of [[4.8, 2.6, 3.4], [5.4, .6, 2.4], [-3.4, -4.6, 3], [3, -4.8, 2.2]]) { const t = K.pine(h, '#b8b8b8', '#505050'); t.position.set(x, 0, z); w.add(t); }
box(w, 1.6, 1.2, 1.3, g(.6), 4, .6, 4.4); const hr = add(w, new THREE.ConeGeometry(1.3, .9, 4), g(.45), 4, 1.65, 4.4); hr.rotation.y = Math.PI / 4; box(w, .4, .5, .1, a('#ffd84a'), 4, .6, 5.06);
const fx = K.fx(w, 120), motes = D.motes(260, 16, 20); let sT = 0;
D.run((dt, t) => {
  dome.rotation.y = Math.sin(t * .15) * .8; scope.rotation.z = -.95 + Math.sin(t * .2) * .2; beam.material.opacity = .17 + Math.sin(t * 2.3) * .05;
  rings.forEach((r, i) => { r.rotation.z = t * (.8 - i * .22); }); orr.rotation.y = t * .3;
  if ((sT -= dt) < 0) { sT = .08; const an = Math.random() * 6.283, r = 6 + Math.random() * 9; fx.emit('spark', Math.cos(an) * r, 8 + Math.random() * 12, Math.sin(an) * r, { life: 1.4, size: .34, fog: false, tint: Math.random() < .7 ? '#ffd84a' : '#fff6c0' }); }
  fx.update(dt);
});
</script>
</html>
