<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3-08 ボス：遺跡の石の巨人</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;image-rendering:pixelated}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#b0c060;opacity:.85}
</style>
<div id="cap">3-08 ─ ボス：遺跡の石の巨人 / 苔色 1 色 ＋ だいだいの核と目　｜　見るだけ</div>
<script src="kit.js"></script><script src="diorama.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 遺跡にひざをつく石の巨人。色は苔色の 6 段だけで、差し色はだいだい（胸の核、目、うでの文字、冒険者のたいまつ）。
// 胸の核がゆっくり脈を打ち、そのたびに胸の内側とあごの下が明るくなる。体のまわりには岩のかけらが浮いて回る。
// 足もとに小さな冒険者を置いて、大きさを伝える
import * as THREE from 'three';
const K = KIT(THREE), D = DIORAMA(THREE, K, { ramp: ['#000000', '#14180c', '#343e1c', '#6a7a34', '#b0c060', '#f0ffc0'], acc: ['#6a1400', '#d8401a', '#ff8a3a', '#ffe0b0'], dist: 38, height: 12, look: 5.4, amb: .45, key: 2 });
const { world: w, g, a } = D, { add, box, hash } = K;
D.base(8, .5);
// 遺跡：柱、こわれた門、石だたみ
for (const [x, z, h] of [[-5.6, -2.4, 5], [5.6, -2.8, 3.4], [-5, 3.6, 2.2], [5.4, 3.2, 4.2]]) { add(w, new THREE.CylinderGeometry(.55, .62, h, 8), g(.66), x, h / 2, z); box(w, 1.5, .34, 1.5, g(.8), x, h + .17, z); box(w, 1.6, .3, 1.6, g(.6), x, .15, z); }
box(w, 12, .5, 1, g(.6), 0, 5.4, -3).visible = false; const lint = box(w, 5, .6, 1.2, g(.62), -3, .5, -4.6); lint.rotation.set(0, .3, .12);
for (let i = 0; i < 14; i++) { const x = (hash(i, 1) - .5) * 9, z = 1 + hash(i, 2) * 5; box(w, 1 + hash(i, 3), .1, 1 + hash(i, 4), g(.5 + hash(i, 5) * .2), x, .05, z).rotation.y = hash(i, 6); }
// 巨人
const gol = new THREE.Group(); gol.position.set(0, 0, -1); w.add(gol);
const R = (p, r, v, x, y, z, sy = 1) => { const m = add(p, new THREE.IcosahedronGeometry(r, 0), g(v), x, y, z); m.scale.y = sy; m.rotation.set(x, y, z); return m; };
const torso = new THREE.Group(); torso.position.y = 4.4; gol.add(torso);
box(torso, 5.2, 3.2, 3, g(.56), 0, 1.2, 0); box(torso, 4, 1.6, 2.6, g(.48), 0, -1, 0); box(torso, 5.6, .5, 3.3, g(.72), 0, 2.9, 0);
box(torso, 1.6, 1.8, .3, g(.06), 0, 1.2, 1.4); const core = add(torso, new THREE.IcosahedronGeometry(.62, 0), a('#ff8a3a'), 0, 1.2, 1.36); const coreL = new THREE.PointLight(0xffffff, 14, 9, 1.5); coreL.position.set(0, 1.2, 2.6); torso.add(coreL);
for (const s of [-1, 1]) { box(torso, .14, 1.9, .34, g(.7), s * .86, 1.2, 1.5); R(torso, 1.7, .64, s * 3.4, 2.6, 0, .9); R(torso, .9, .8, s * 3.9, 3.7, .3, .7); }
for (let i = 0; i < 10; i++) R(torso, .3 + hash(i, 7) * .4, .9, (hash(i, 8) - .5) * 5, 3.2, (hash(i, 9) - .5) * 2.6, .5);
const head = new THREE.Group(); head.position.set(0, 3.9, .4); box(head, 1.8, 1.5, 1.7, g(.62), 0, 0, 0); box(head, 2, .4, 1.9, g(.78), 0, .86, 0); box(head, 1.5, .4, .5, g(.5), 0, -.7, .7);
for (const s of [-1, 1]) box(head, .46, .16, .1, a('#ffe0b0'), s * .42, .12, .86); torso.add(head);
const arms = [-1, 1].map(s => { const sh = new THREE.Group(); sh.position.set(s * 3.5, 2.2, 0); box(sh, 1.3, 3.2, 1.4, g(.56), 0, -1.6, 0); const el = new THREE.Group(); el.position.y = -3.2; box(el, 1.6, 3.2, 1.7, g(.5), 0, -1.6, .2); box(el, 2.1, 1.5, 2.2, g(.66), 0, -3.6, .3); for (let k = 0; k < 3; k++) box(el, .14, .5, .1, a('#ff8a3a'), s * -.2 + (k - 1) * .4, -1 - k * .5, 1.08); sh.add(el); torso.add(sh); return { sh, el, s }; });
for (const s of [-1, 1]) { box(gol, 1.9, 2.4, 2, g(.5), s * 1.5, 2.2, s > 0 ? 1.2 : -.2); box(gol, 2.1, 1.6, 2.6, g(.6), s * 1.5, .8, s > 0 ? 2 : -1.4); }
// 浮かぶ岩、こけ、木
const floats = [...Array(9)].map((_, i) => { const m = R(w, .3 + hash(i, 10) * .5, .7, 0, 0, 0); m.userData = { an: i * .7, r: 4.6 + hash(i, 11) * 1.6, y: 5 + hash(i, 12) * 6, v: .3 + hash(i, 13) * .3 }; return m; });
for (const [x, z, h] of [[6.4, .4, 3], [-6.6, 1, 2.4], [2.6, -5.6, 3.4]]) { const t = K.pine(h, '#b8b8b8', '#505050'); t.position.set(x, 0, z); w.add(t); }
// 冒険者
const hero = new THREE.Group(); hero.position.set(1.2, 0, 5.2); box(hero, .34, .5, .26, g(.9), 0, .5, 0); add(hero, new THREE.IcosahedronGeometry(.17, 0), g(1), 0, .92, 0); box(hero, .06, .7, .06, g(.5), .26, .7, 0); box(hero, .4, .3, .06, g(.6), 0, .55, -.16); w.add(hero); const torch = new THREE.PointLight(0xffffff, 4, 4, 1.6); torch.position.set(.26, 1.2, 0); hero.add(torch);
const fx = K.fx(w, 100), motes = D.motes(120, 10, 14); let fT = 0, dT = 0;
D.run((dt, t) => {
  const pulse = .5 + .5 * Math.sin(t * 1.6), br = Math.sin(t * .8);
  torso.position.y = 4.4 + br * .12; torso.rotation.z = Math.sin(t * .4) * .03; head.rotation.y = Math.sin(t * .5) * .45; head.rotation.x = .12 + Math.sin(t * .7) * .06;
  core.scale.setScalar(.9 + pulse * .35); core.rotation.y = t; coreL.intensity = 6 + pulse * 22;
  arms.forEach(({ sh, el, s }) => { sh.rotation.z = s * (.16 + br * .03); sh.rotation.x = s > 0 ? -.3 + Math.sin(t * .6) * .14 : .1; el.rotation.x = s > 0 ? -.5 + Math.sin(t * .6 + 1) * .2 : -.12; });
  floats.forEach(f => { const an = f.userData.an + t * f.userData.v; f.position.set(Math.cos(an) * f.userData.r, f.userData.y + Math.sin(t + f.userData.an) * .4, Math.sin(an) * f.userData.r - 1); f.rotation.x = t * .5; });
  if ((fT -= dt) < 0) { fT = .08; fx.emit('flame', 1.46, 1.25, 5.2, { vy: .6, life: .4, size: .4, grow: -.3, fog: false }); fx.emit('spark', (Math.random() - .5) * 1.2, 5.6, .5, { vy: 1.2, spread: 1.4, life: 1.2, size: .22, fog: false, tint: '#ff8a3a' }); }
  if ((dT -= dt) < 0) { dT = .3; fx.emit('puff', (Math.random() - .5) * 5, 4 + Math.random() * 3, -1 + (Math.random() - .5) * 2, { vy: -1.2, life: 1.6, size: .3, grow: .8 }); }
  fx.update(dt);
});
</script>
