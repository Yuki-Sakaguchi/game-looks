<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3-10 ボス：機械じかけの大ぐも</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;image-rendering:pixelated}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#5ad0b8;opacity:.85}
</style>
<div id="cap">3-10 ─ ボス：機械じかけの大ぐも / 青緑 1 色 ＋ 赤い目と探す光　｜　見るだけ</div>
<script src="kit.js"></script><script src="diorama.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 廃品置き場を歩きまわる、機械じかけの大ぐも。色は青緑の 6 段だけで、差し色は赤（目、探す光、警告灯）。
// 8 本の足は「つけ根で持ち上げ、ひざで下ろす」2 節。となりの足と半周ずらして動かすと、その場で足ぶみして見える。
// 赤い光の筋が左右に首をふって、物かげの人を探す。背中の歯車が回り、えんとつから蒸気が出る
import * as THREE from 'three';
const K = KIT(THREE), D = DIORAMA(THREE, K, { ramp: ['#000000', '#04201e', '#0a4a44', '#1a8a7a', '#5ad0b8', '#d8fff4'], acc: ['#5a0a0a', '#c0281a', '#ff5a3a', '#ffc0a0'], dist: 38, height: 12, look: 4.6, amb: .5, key: 2.2 });
const { world: w, g, a } = D, { add, box, hash } = K;
D.base(8, .46);
// 廃品：管、箱、歯車、鉄板、くさり
for (let i = 0; i < 7; i++) { const an = hash(i, 1) * 6.283, r = 4.6 + hash(i, 2) * 2.4, p = add(w, new THREE.CylinderGeometry(.34, .34, 2 + hash(i, 3) * 2.4, 8), g(.5 + hash(i, 4) * .2), Math.cos(an) * r, .36, Math.sin(an) * r); p.rotation.set(0, an, Math.PI / 2); }
for (let i = 0; i < 9; i++) { const an = i * .7 + .2, r = 5 + hash(i, 5) * 1.8, s = .7 + hash(i, 6) * .7; box(w, s, s, s, g(.45 + hash(i, 7) * .3), Math.cos(an) * r, s / 2, Math.sin(an) * r).rotation.y = an; }
const gear = (p, r, v, x, y, z, n = 8) => { const gr = new THREE.Group(); gr.position.set(x, y, z); add(gr, new THREE.CylinderGeometry(r, r, .3, 12), g(v), 0, 0, 0); for (let k = 0; k < n; k++) { const an = k / n * 6.283; box(gr, .34, .3, .34, g(v), Math.cos(an) * (r + .1), 0, Math.sin(an) * (r + .1)).rotation.y = -an; } add(gr, new THREE.CylinderGeometry(r * .3, r * .3, .34, 8), g(v * .5), 0, 0, 0); p.add(gr); return gr; };
gear(w, 1, .5, -5.6, .2, 2.6).rotation.x = .2; gear(w, .7, .6, 5.4, .2, -3.4).rotation.z = .3;
// 大ぐも
const sp = new THREE.Group(); sp.position.y = 5; w.add(sp);
const ab = add(sp, new THREE.SphereGeometry(2.3, 10, 8), g(.6), -2.2, .5, 0); ab.scale.set(1.25, 1, 1); for (let k = 0; k < 4; k++) add(sp, new THREE.TorusGeometry(2.3 - Math.abs(k - 1.5) * .34, .1, 4, 14), g(.82), -3.6 + k * .95, .5, 0).rotation.y = Math.PI / 2;
for (let i = 0; i < 16; i++) { const an = hash(i, 8) * 6.283, ph = .3 + hash(i, 9) * 1.1; add(sp, new THREE.SphereGeometry(.12, 5, 4), g(1), -2.2 + Math.sin(ph) * Math.cos(an) * 2.9, .5 + Math.cos(ph) * 2.3, Math.sin(ph) * Math.sin(an) * 2.3); }
box(sp, 2.6, 1.5, 2.4, g(.52), .6, .1, 0); box(sp, 2.8, .2, 2.6, g(.76), .6, .92, 0);
const g1 = gear(sp, .9, .86, -1.4, 2.9, .5, 9), g2 = gear(sp, .6, .7, -.1, 2.7, -.5, 7), g3 = gear(sp, .5, .9, .7, 1.15, .7, 6); for (const q of [g1, g2]) q.rotation.x = .25;
add(sp, new THREE.CylinderGeometry(.3, .4, 1.8, 8), g(.5), -3.2, 3.4, -.6); add(sp, new THREE.CylinderGeometry(.44, .34, .3, 8), g(.7), -3.2, 4.4, -.6);
const headG = new THREE.Group(); headG.position.set(2.3, -.1, 0); box(headG, 1.3, 1.2, 1.7, g(.62), 0, 0, 0); for (const [y, z, r] of [[.2, .5, .26], [.2, -.5, .26], [-.2, .24, .16], [-.2, -.24, .16]]) add(headG, new THREE.SphereGeometry(r, 7, 5), a('#ff5a3a'), .66, y, z);
const fangs = [-1, 1].map(s => { const f = box(headG, .9, .16, .16, g(.9), .9, -.56, s * .36); f.geometry.translate(.3, 0, 0); return f; });
const scanG = new THREE.ConeGeometry(1.7, 12, 12, 1, true); scanG.translate(0, -6, 0); const scan = new THREE.Mesh(scanG, new THREE.MeshBasicMaterial({ color: 0xff5a3a, transparent: true, opacity: .2, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false })); const scanP = new THREE.Group(); scanP.position.set(.7, 0, 0); scanP.add(scan); scan.rotation.z = Math.PI / 2 - .5; headG.add(scanP); sp.add(headG);
const warn = add(sp, new THREE.SphereGeometry(.26, 7, 5), a('#ff5a3a'), .6, 1.3, -.8), warnL = new THREE.PointLight(0xffffff, 6, 6, 1.5); warnL.position.set(.6, 1.6, -.8); sp.add(warnL);
// 足 8 本
const legs = []; for (const s of [-1, 1]) for (let k = 0; k < 4; k++) { const hip = new THREE.Group(); hip.position.set(1.3 - k * .75, 0, s * 1.2); const base = -s * (Math.PI / 2 - (1.5 - k) * .42);
  const up = box(hip, 4.2, .34, .34, g(.7), 2.1, 0, 0); add(hip, new THREE.SphereGeometry(.34, 7, 5), g(.9), 0, 0, 0);
  const knee = new THREE.Group(); knee.position.x = 4.2; add(knee, new THREE.SphereGeometry(.36, 7, 5), g(.9), 0, 0, 0); box(knee, 7.5, .26, .26, g(.56), 3.75, 0, 0); box(knee, .5, .5, .5, g(.82), 7.5, 0, 0); box(knee, 1.2, .1, .1, g(.9), 1.4, .26, 0); hip.add(knee); sp.add(hip); legs.push({ hip, knee, base, ph: (k % 2 ? Math.PI : 0) + (s > 0 ? 0 : Math.PI) }); }
// 物かげにかくれる人
const hero = new THREE.Group(); hero.position.set(5.6, 0, 1.6); box(hero, .34, .44, .26, g(.95), 0, .34, 0); add(hero, new THREE.IcosahedronGeometry(.17, 0), g(1), 0, .72, 0); w.add(hero); box(w, 1.6, 1.3, .6, g(.5), 4.9, .65, 1.8).rotation.y = .5;
const fx = K.fx(w, 100), motes = D.motes(110, 10, 12); let sT = 0;
D.run((dt, t) => {
  const st = t * 1.6;
  legs.forEach(L => { const sw = Math.sin(st + L.ph), lift = Math.max(0, Math.cos(st + L.ph)); L.hip.rotation.set(0, L.base + sw * .2, 0); L.hip.rotation.order = 'YXZ'; L.hip.rotation.z = .6 + lift * .2; L.knee.rotation.z = -1.85 - lift * .1; });
  sp.position.y = 5 + Math.sin(st * 2) * .1; sp.rotation.z = Math.sin(st) * .025; sp.rotation.x = Math.cos(st) * .02;
  g1.rotation.y = t * 1.4; g2.rotation.y = -t * 2.1; g3.rotation.y = t * 2.6;
  headG.rotation.y = Math.sin(t * .5) * .5; scanP.rotation.y = Math.sin(t * .9) * .5; scan.material.opacity = .17 + Math.sin(t * 7) * .03;
  fangs.forEach((f, i) => { f.rotation.y = (i ? -1 : 1) * (.2 + Math.abs(Math.sin(t * 3)) * .3); });
  const on = Math.floor(t * 2) % 2; warn.material.color.set(on ? '#ff5a3a' : '#5a0a0a'); warnL.intensity = on ? 8 : 0;
  hero.position.y = Math.abs(Math.sin(t * 9)) * .03; hero.rotation.z = Math.sin(t * 14) * .04;
  if ((sT -= dt) < 0) { sT = .14; fx.emit('puff', -3.2, 9.7, -.6, { vy: 1.6, spread: .4, life: 2, size: .7, grow: 2.2 }); if (Math.random() < .4) fx.emit('spark', 1.3 - Math.random() * 2.4, 5, (Math.random() < .5 ? -1 : 1) * 1.2, { vy: -1, spread: 2, grav: -6, life: .6, size: .22, fog: false, tint: '#ff5a3a' }); }
  fx.update(dt);
});
</script>
</html>
