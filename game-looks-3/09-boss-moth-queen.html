<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3-09 ボス：灯りにとまる蛾の女王</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;image-rendering:pixelated}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#b8b8cc;opacity:.85}
</style>
<div id="cap">3-09 ─ ボス：灯りにとまる蛾の女王 / 銀ねず 1 色 ＋ だいだいの灯り　｜　見るだけ</div>
<script src="kit.js"></script><script src="diorama.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 古い大きな街灯にとまった、蛾の女王。色は銀ねずの 6 段だけで、差し色はだいだい（街灯の火、羽の目玉もよう）。
// 羽は平らな板で、ゆっくり開いたり閉じたりする。羽が開くと街灯の光をさえぎり、閉じると下の墓地が明るくなる。
// まわりを小さな蛾が、灯りに引かれて飛びまわる
import * as THREE from 'three';
const K = KIT(THREE), D = DIORAMA(THREE, K, { ramp: ['#000000', '#15151e', '#3a3a50', '#747490', '#b8b8cc', '#ffffff'], acc: ['#6a2a00', '#e0621a', '#ffa83a', '#ffe6a0'], dist: 38, height: 11, look: 6, amb: .4, key: 1.6 });
const { world: w, g, a } = D, { add, box, hash } = K;
D.base(7.8, .5);
const flatM = v => new THREE.MeshStandardMaterial({ color: new THREE.Color(v, v, v), flatShading: true, roughness: 1, side: THREE.DoubleSide });
// 大きな街灯
add(w, new THREE.CylinderGeometry(.9, 1.2, .8, 8), g(.5), 0, .4, 0); add(w, new THREE.CylinderGeometry(.3, .44, 7.4, 8), g(.45), 0, 4.4, 0); for (const y of [1.6, 4.4, 7.4]) add(w, new THREE.CylinderGeometry(.56, .56, .3, 8), g(.66), 0, y, 0);
const lant = new THREE.Group(); lant.position.y = 8.4; w.add(lant); add(lant, new THREE.CylinderGeometry(1.1, .7, 1.8, 6), a('#ffa83a'), 0, .7, 0); for (let k = 0; k < 6; k++) { const an = k * 1.047; box(lant, .1, 2, .1, g(.3), Math.cos(an) * .96, .7, Math.sin(an) * .96).rotation.z = Math.cos(an) * -.2; }
add(lant, new THREE.ConeGeometry(1.5, 1.1, 6), g(.4), 0, 2.1, 0); add(lant, new THREE.SphereGeometry(.2, 6, 5), g(.7), 0, 2.8, 0); add(lant, new THREE.CylinderGeometry(.9, .9, .2, 6), g(.4), 0, -.2, 0);
const lampL = new THREE.PointLight(0xffffff, 60, 18, 1.4); lampL.position.set(0, 8.9, 0); w.add(lampL);
// 蛾の女王：街灯の柱にしがみつく
const moth = new THREE.Group(); moth.position.set(0, 6.4, 1.1); moth.rotation.x = -.5; w.add(moth);
for (let k = 0; k < 6; k++) { const s = add(moth, new THREE.SphereGeometry(.9 - k * .1, 8, 6), g(k % 2 ? .78 : .92), 0, -k * .78, 0); s.scale.set(1, .7, 1); }
const th = add(moth, new THREE.SphereGeometry(1.15, 8, 6), g(1), 0, .9, 0); for (let i = 0; i < 26; i++) { const an = hash(i, 1) * 6.283, ph = hash(i, 2) * 3.1; add(moth, new THREE.ConeGeometry(.12, .5, 4), g(.95), Math.sin(ph) * Math.cos(an) * 1.1, .9 + Math.cos(ph) * 1.1, Math.sin(ph) * Math.sin(an) * 1.1).lookAt(0, .9, 0); }
const hd = new THREE.Group(); hd.position.set(0, 2.1, .2); add(hd, new THREE.SphereGeometry(.7, 8, 6), g(.85), 0, 0, 0); for (const s of [-1, 1]) { add(hd, new THREE.SphereGeometry(.34, 7, 5), g(.04), s * .46, .1, .44); add(hd, new THREE.SphereGeometry(.1, 5, 4), g(1), s * .52, .2, .7); }
const ants = [-1, 1].map(s => { const an = new THREE.Group(); an.position.set(s * .3, .5, .2); an.rotation.z = s * -.5; box(an, .06, 2.4, .06, g(.9), 0, 1.2, 0); for (let k = 0; k < 9; k++) { box(an, .7 - k * .05, .05, .05, g(.8), 0, .4 + k * .22, 0); } hd.add(an); return an; }); moth.add(hd);
for (const s of [-1, 1]) for (let k = 0; k < 3; k++) { const l = box(moth, .1, .1, 1.5, g(.5), s * .5, .6 - k * .7, -.6); l.rotation.y = s * (.5 + k * .1); }
function wing(pts, v) { const sh = new THREE.Shape(); pts.forEach(([x, y], i) => i ? sh.lineTo(x, y) : sh.moveTo(x, y)); return new THREE.ShapeGeometry(sh); }
const FORE = [[0, 0], [1.2, 1.6], [3.6, 3.2], [6, 3.4], [6.9, 2.4], [6.4, .6], [4.6, -1], [2, -1.2]], HIND = [[0, 0], [2.2, -.4], [4.6, -1.4], [5, -3], [3.8, -4.4], [2, -4.2], [.6, -2.4]];
const wings = [-1, 1].map(s => { const piv = new THREE.Group(); piv.position.set(s * .5, .9, -.1);
  const mk = (pts, v, z, sc = 1) => { const m = new THREE.Mesh(wing(pts), flatM(v)); m.scale.set(s * sc, sc, 1); m.position.z = z; piv.add(m); return m; };
  mk(HIND, .7, -.04); mk(FORE, .88, 0); mk(FORE.map(([x, y]) => [x * .86 + .5, y * .8 + .2]), .7, .02); mk(FORE.map(([x, y]) => [x * .6 + 1.2, y * .55 + .4]), .92, .04);
  for (const [x, y, r] of [[4.6, 1.6, .8], [3.2, -2.6, .62]]) { const ring = new THREE.Mesh(new THREE.CircleGeometry(r, 12), flatM(.1)); ring.position.set(s * x, y, .06); piv.add(ring); const eye = new THREE.Mesh(new THREE.CircleGeometry(r * .62, 10), new THREE.MeshBasicMaterial({ color: '#ffa83a', side: THREE.DoubleSide, fog: false })); eye.position.set(s * x, y, .08); piv.add(eye); const pup = new THREE.Mesh(new THREE.CircleGeometry(r * .26, 8), flatM(.04)); pup.position.set(s * x, y, .1); piv.add(pup); }
  for (let k = 0; k < 5; k++) { const st = new THREE.Mesh(new THREE.PlaneGeometry(.12, 2.4 - k * .2), flatM(.5)); st.position.set(s * (1.6 + k * .9), 1.2 + k * .2, .05); st.rotation.z = s * -(.5 + k * .08); piv.add(st); }
  moth.add(piv); return { piv, s }; });
// 墓地：墓石、さく、枯れ木、草
for (let i = 0; i < 9; i++) { const an = i * .72 + .3, r = 3.8 + hash(i, 3) * 2.4, x = Math.cos(an) * r, z = Math.sin(an) * r, st = box(w, .9, 1.2 + hash(i, 4) * .6, .26, g(.62), x, .6, z); st.rotation.set((hash(i, 5) - .5) * .3, -an + 1.57, (hash(i, 6) - .5) * .3); add(w, new THREE.CylinderGeometry(.45, .45, .26, 8, 1, false, 0, Math.PI), g(.62), x, 1.2 + hash(i, 4) * .3, z).rotation.set(Math.PI / 2, 0, -an + 1.57 + Math.PI / 2, 'YXZ'); }
for (let i = 0; i < 20; i++) { const an = i / 20 * 6.283, p = box(w, .1, 1.3, .1, g(.4), Math.cos(an) * 7, .65, Math.sin(an) * 7); if (i % 2) box(w, 2.2, .08, .08, g(.4), Math.cos(an) * 7, 1, Math.sin(an) * 7).rotation.y = -an + 1.57; }
{ const tr = new THREE.Group(); tr.position.set(-5.2, 0, -3); add(tr, new THREE.CylinderGeometry(.2, .44, 4.6, 6), g(.4), 0, 2.3, 0); for (let k = 0; k < 6; k++) { const b = add(tr, new THREE.CylinderGeometry(.03, .12, 2.4, 4), g(.4), 0, 3 + k * .3, 0); b.geometry.translate(0, 1.2, 0); b.rotation.set(.8 + hash(k, 7) * .5, k * 1.9, 0, 'YXZ'); } w.add(tr); }
const grass = new THREE.InstancedMesh(new THREE.ConeGeometry(.07, .8, 3), g(.5), 260), dm = new THREE.Object3D(); for (let i = 0; i < 260; i++) { const an = hash(i, 8) * 6.283, r = 1.6 + Math.sqrt(hash(i, 9)) * 5.6; dm.position.set(Math.cos(an) * r, .35, Math.sin(an) * r); dm.rotation.set((hash(i, 10) - .5) * .5, 0, (hash(i, 11) - .5) * .5); dm.updateMatrix(); grass.setMatrixAt(i, dm.matrix); } w.add(grass);
// 小さな蛾
const small = [...Array(16)].map((_, i) => { const m = new THREE.Group(); for (const s of [-1, 1]) { const wg = new THREE.Mesh(new THREE.PlaneGeometry(.34, .26), flatM(.95)); wg.position.x = s * .17; wg.userData.s = s; m.add(wg); } m.userData = { an: hash(i, 12) * 6.283, r: 1.6 + hash(i, 13) * 3, y: 7 + hash(i, 14) * 3.4, v: .8 + hash(i, 15) }; w.add(m); return m; });
const fx = K.fx(w, 100), motes = D.motes(160, 10, 14); let sT = 0;
D.run((dt, t) => {
  const open = .5 + .5 * Math.sin(t * .9);
  wings.forEach(({ piv, s }) => { piv.rotation.y = s * (.15 + open * 1.05); piv.rotation.z = s * -.08; });
  ants.forEach((an, i) => { an.rotation.x = Math.sin(t * 1.3 + i) * .2; }); hd.rotation.z = Math.sin(t * .6) * .12; moth.position.y = 6.4 + Math.sin(t * .9) * .08;
  lampL.intensity = 54 + Math.sin(t * 9) * 5 + Math.sin(t * 23) * 3;
  small.forEach((m, i) => { const an = m.userData.an + t * m.userData.v; m.position.set(Math.cos(an) * m.userData.r, m.userData.y + Math.sin(t * 3 + i) * .5, Math.sin(an) * m.userData.r); m.rotation.y = -an; m.children.forEach(wg => { wg.rotation.y = wg.userData.s * Math.sin(t * 26 + i) * .9; }); });
  if ((sT -= dt) < 0) { sT = .14; fx.emit('puff', (Math.random() - .5) * 5, 5 + Math.random() * 3, 1 + (Math.random() - .5) * 2, { vy: -.7, spread: .4, life: 2.4, size: .22, grow: .4 }); fx.emit('spark', (Math.random() - .5) * 1.4, 9 + Math.random() * .6, (Math.random() - .5) * 1.4, { vy: .8, life: 1, size: .2, fog: false, tint: '#ffa83a' }); }
  fx.update(dt);
});
</script>
