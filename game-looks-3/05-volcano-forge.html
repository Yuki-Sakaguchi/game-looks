<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3-05 火山の鍛冶場</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;image-rendering:pixelated}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#f0683a;opacity:.85}
</style>
<div id="cap">3-05 ─ 火山の鍛冶場 / 赤 1 色 ＋ 黄色い火花と溶岩　｜　見るだけ</div>
<script src="kit.js"></script><script src="diorama.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 溶岩のわく岩の上の鍛冶場。色は赤の 6 段だけで、差し色は黄色（溶岩、炉の口、打った瞬間の火花）。
// 上からの光を弱くして、炉と溶岩の明かりが下から物を照らすようにする。つちを打つたびに明かりが強くなる
import * as THREE from 'three';
const K = KIT(THREE), D = DIORAMA(THREE, K, { ramp: ['#000000', '#2a0606', '#6c0e0e', '#c2281a', '#f26a3a', '#ffd2a2'], acc: ['#8a3a00', '#f08a10', '#ffd020', '#fff6b0'], dist: 32, height: 11, look: 3, amb: .3, key: 1.2 });
const { world: w, g, a } = D, { add, box, hash } = K;
D.base(7.6, .42);
// 溶岩の割れ目と池
for (let i = 0; i < 7; i++) { const an = i * .9 + .2, c = box(w, .3, .06, 2.6 + hash(i, 1) * 2, a('#ffd020'), Math.cos(an) * 4.6, .03, Math.sin(an) * 4.6); c.rotation.y = -an + .4; }
const pool = add(w, new THREE.CylinderGeometry(1.7, 1.7, .08, 9), a('#f08a10'), -4.2, .04, -1.6); add(w, new THREE.CylinderGeometry(1, 1, .1, 7), a('#ffd020'), -4.2, .06, -1.6);
const glowL = new THREE.PointLight(0xffffff, 16, 9, 1.5); glowL.position.set(-4.2, .8, -1.6); w.add(glowL);
// 後ろの火山岩と、流れおちる溶岩
const peak = add(w, new THREE.ConeGeometry(3.4, 8, 6), g(.4), 2.2, 4, -3.8); const lava = box(w, .5, 6, .12, a('#ffd020'), 1.3, 3.6, -1.9); lava.rotation.set(-.42, 0, .16); add(w, new THREE.ConeGeometry(2, 4.4, 5), g(.34), -2.6, 2.2, -4.6);
// 炉、えんとつ、ふいご
box(w, 2.6, 2.2, 2.2, g(.55), 2.2, 1.1, .6); box(w, 1.3, 1, .1, a('#ffd020'), 2.2, .9, 1.72); box(w, 1.6, .2, .3, g(.7), 2.2, 1.5, 1.8); box(w, 1, 3, 1, g(.5), 2.6, 3.7, .2); box(w, 1.2, .3, 1.2, g(.66), 2.6, 5.3, .2);
const bel = new THREE.Group(); bel.position.set(4.2, .7, 1.2); const bag = add(bel, new THREE.CylinderGeometry(.5, .7, 1.2, 6), g(.7), 0, 0, 0); bag.rotation.z = Math.PI / 2; box(bel, .1, 1.3, .1, g(.5), .5, .6, 0); w.add(bel);
const forge = new THREE.PointLight(0xffffff, 22, 10, 1.5); forge.position.set(2.2, 1.2, 2.6); w.add(forge);
// かなとこ、打つ人、道具と作った剣
box(w, 1, .7, .7, g(.3), -.6, .35, 2.4); box(w, 1.6, .34, .6, g(.75), -.6, .86, 2.4); const blade = box(w, 1.5, .06, .16, a('#ffd020'), -.4, 1.06, 2.4);
const smith = new THREE.Group(); smith.position.set(-.6, 0, 3.6); box(smith, .7, .9, .5, g(.6), 0, 1.05, 0); add(smith, new THREE.IcosahedronGeometry(.3, 0), g(.85), 0, 1.8, 0); box(smith, .26, .6, .3, g(.45), -.18, .3, 0); box(smith, .26, .6, .3, g(.45), .18, .3, 0); box(smith, .76, .5, .1, g(.4), 0, .9, -.3);
const arm = new THREE.Group(); arm.position.set(.4, 1.4, -.1); box(arm, .2, .2, .9, g(.7), 0, 0, -.45); box(arm, .1, .1, .8, g(.4), 0, .2, -1); box(arm, .34, .34, .5, g(.9), 0, .2, -1.4); smith.add(arm); w.add(smith);
for (let k = 0; k < 4; k++) { const s = box(w, .12, 1.8 - k * .2, .06, g(.9), -3.2 + k * .4, 1.2, 3.6); s.rotation.z = .1; } box(w, 2, .1, .3, g(.5), -2.6, .4, 3.7); box(w, .1, .8, .1, g(.5), -3.5, .2, 3.7); box(w, .1, .8, .1, g(.5), -1.7, .2, 3.7);
add(w, new THREE.CylinderGeometry(.5, .4, .7, 8), g(.5), 1, .35, 3.2); add(w, new THREE.CylinderGeometry(.42, .42, .06, 8), g(.2), 1, .7, 3.2);
const fx = K.fx(w, 160), motes = D.motes(70, 9, 8); let eT = 0, sT = 0, hit = 9, prev = 0;
D.run((dt, t) => {
  const ph = (t * 1.6) % 1, sw = ph < .35 ? ph / .35 : 1 - (ph - .35) / .65; arm.rotation.x = -1.3 + sw * 1.5; hit += dt;
  if (ph < prev) { hit = 0; for (let k = 0; k < 16; k++) fx.emit('spark', -.5, 1.1, 2.4, { vx: (Math.random() - .5) * 5, vy: 2 + Math.random() * 3, vz: (Math.random() - .5) * 5, grav: -9, life: .7, size: .3, fog: false, tint: k % 3 ? '#ffd020' : '#fff6b0' }); } prev = ph;
  if ((eT -= dt) < 0) { eT = .06; fx.emit('flame', 2.2 + (Math.random() - .5) * .8, 1, 1.8, { vy: .8, life: .45, size: .7, grow: -.3, fog: false }); const an = Math.random() * 6.283; fx.emit('spark', -4.2 + Math.cos(an), .2, -1.6 + Math.sin(an), { vy: 1.5, life: 1.2, size: .22, fog: false, tint: '#ffd020' }); }
  if ((sT -= dt) < 0) { sT = .22; fx.emit('puff', 2.6, 5.6, .2, { vy: 1.4, spread: .3, life: 2.6, size: .7, grow: 2.4, tint: '#555555' }); fx.emit('spark', 1.3 + (Math.random() - .5) * .4, 1.2, -1.4, { vy: 1, spread: 1, life: .8, size: .2, fog: false, tint: '#ffd020' }); }
  fx.update(dt);
  forge.intensity = 20 + Math.sin(t * 11) * 4 + Math.max(0, .25 - hit) * 160; glowL.intensity = 14 + Math.sin(t * 3) * 4; bag.scale.x = 1 + Math.sin(t * 3.2) * .2; pool.scale.setScalar(1 + Math.sin(t * 1.3) * .04);
  lava.material.color.set(Math.sin(t * 6) > 0 ? '#ffd020' : '#f08a10'); blade.material.color.set(hit < .2 ? '#fff6b0' : '#ffd020');
});
</script>
</html>
