<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3-07 ボス：灯台をしめつける大だこ</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;image-rendering:pixelated}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#f070b0;opacity:.85}
</style>
<div id="cap">3-07 ─ ボス：灯台をしめつける大だこ / ばら色 1 色 ＋ 黄色い灯りと目　｜　見るだけ</div>
<script src="kit.js"></script><script src="diorama.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 灯台に巻きついた大だこ。色はばら色の 6 段だけで、差し色は黄色（灯台の光、たこの目）。
// かさは、横から見た輪かくを回して作った、しわのあるふくろ形。足は細い筒を 16 個つないだくさりで、
// 下側に吸ばんを 2 列ならべる。つけ根から先へ少しずつ遅らせて曲げると、うねって見える。
// 足のつけ根には水かきの膜、目にはまぶたと横長のひとみ。1 本の足は、こわれた小舟をつかんで持ち上げている
import * as THREE from 'three';
const K = KIT(THREE), D = DIORAMA(THREE, K, { ramp: ['#000000', '#2a0a22', '#6a1650', '#b82e80', '#f070b0', '#ffd8ec'], acc: ['#6a4a00', '#d8a010', '#ffd84a', '#fff6c0'], dist: 34, height: 10, look: 5.6, width: 460 });
const { world: w, g, a } = D, { add, box, hash } = K, V2 = (x, y) => new THREE.Vector2(x, y);
D.base(7.8, .5);
for (let i = 0; i < 14; i++) { const an = i / 14 * 6.283; add(w, new THREE.IcosahedronGeometry(.7 + hash(i, 1) * .9, 0), g(.42), Math.cos(an) * 5.8, .2, Math.sin(an) * 5.8).scale.y = .6; }
for (let i = 0; i < 30; i++) { const an = hash(i, 2) * 6.283, r = 3 + hash(i, 3) * 4; add(w, new THREE.ConeGeometry(.12, .2, 5), g(.9), Math.cos(an) * r, .08, Math.sin(an) * r); }
// 灯台：帯、窓、ひび、手すり
add(w, new THREE.CylinderGeometry(1.25, 1.8, 9, 12), g(.84), 0, 4.5, 0); for (let k = 0; k < 3; k++) add(w, new THREE.CylinderGeometry(1.36 + (2 - k) * .16, 1.44 + (2 - k) * .16, 1, 12), g(.46), 0, 1.6 + k * 2.6, 0);
add(w, new THREE.CylinderGeometry(1.9, 2.1, .5, 12), g(.6), 0, .25, 0); box(w, .7, 1.3, .12, g(.1), 0, 1, 1.78); box(w, .9, .14, .2, g(.6), 0, 1.72, 1.8);
for (const [y, an] of [[3.2, .6], [5.6, 2.4], [7.6, 4.4]]) { const r = 1.5 - y * .05; box(w, .4, .6, .1, g(.1), Math.sin(an) * r, y, Math.cos(an) * r).rotation.y = an; }
for (const [y, an, l] of [[2.4, 1.6, 1.4], [4.6, 3.6, 1.8], [6.4, .2, 1.2]]) { const r = 1.62 - y * .055, c = box(w, .07, l, .06, g(.2), Math.sin(an) * r, y, Math.cos(an) * r); c.rotation.set(0, an, .4); }
add(w, new THREE.CylinderGeometry(1.8, 1.5, .4, 12), g(.62), 0, 9.2, 0); add(w, new THREE.TorusGeometry(1.74, .05, 4, 16), g(.9), 0, 9.9, 0).rotation.x = Math.PI / 2; for (let k = 0; k < 12; k++) { const an = k / 12 * 6.283; box(w, .06, .56, .06, g(.9), Math.cos(an) * 1.74, 9.66, Math.sin(an) * 1.74); }
add(w, new THREE.CylinderGeometry(.9, .9, 1.5, 8), a('#ffd84a'), 0, 10.2, 0); for (let k = 0; k < 8; k++) { const an = k * .785; box(w, .08, 1.5, .08, g(.3), Math.cos(an) * .92, 10.2, Math.sin(an) * .92); }
add(w, new THREE.ConeGeometry(1.35, 1.2, 8), g(.5), 0, 11.5, 0); add(w, new THREE.SphereGeometry(.2, 6, 5), g(.8), 0, 12.2, 0); box(w, .06, .9, .06, g(.8), 0, 12.7, 0);
const lampL = new THREE.PointLight(0xffffff, 26, 14, 1.5); lampL.position.set(0, 10.2, 0); w.add(lampL);
const beam = new THREE.Group(); beam.position.y = 10.2; for (const s of [1, -1]) { const bg = new THREE.ConeGeometry(2.2, 14, 12, 1, true); bg.translate(0, -7, 0); const m = new THREE.Mesh(bg, new THREE.MeshBasicMaterial({ color: 0xffd84a, transparent: true, opacity: .2, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false })); m.rotation.z = s * Math.PI / 2; beam.add(m); } w.add(beam);
// ── 大だこ ──
const oct = new THREE.Group(); oct.position.set(-3.3, 0, -1.5); oct.rotation.y = -.42; w.add(oct);
// かさ：輪かくを回して作る。後ろへかたむけ、しわの輪と斑点、ひれを付ける
const mant = new THREE.Group(); mant.position.set(-.4, 2.9, 0); mant.rotation.z = .5; oct.add(mant);
const prof = [[0, 0], [1.5, .1], [2.3, .9], [2.75, 2.2], [2.7, 3.6], [2.2, 4.8], [1.4, 5.7], [.6, 6.2], [0, 6.35]];
const mesh = add(mant, new THREE.LatheGeometry(prof.map(p => V2(...p)), 12), g(.72), 0, 0, 0);
const radAt = y => { for (let i = 0; i < prof.length - 1; i++) if (y >= prof[i][1] && y <= prof[i + 1][1]) { const f = (y - prof[i][1]) / (prof[i + 1][1] - prof[i][1]); return prof[i][0] + (prof[i + 1][0] - prof[i][0]) * f; } return 0; };
for (const y of [1.2, 2.1, 3.1]) add(mant, new THREE.TorusGeometry(radAt(y) + .02, .09, 4, 18), g(.56), 0, y, 0).rotation.x = Math.PI / 2;
for (let i = 0; i < 46; i++) { const y = .9 + hash(i, 4) * 4.9, an = hash(i, 5) * 6.283, r = radAt(y) * .98, big = hash(i, 6) > .6, s = add(mant, new THREE.SphereGeometry(big ? .3 : .16, 6, 4), g(1), Math.cos(an) * r, y, Math.sin(an) * r); s.scale.setScalar(1); if (big) add(mant, new THREE.SphereGeometry(.16, 5, 4), g(.5), Math.cos(an) * (r + .2), y, Math.sin(an) * (r + .2)); }
const fins = [-1, 1].map(s => { const f = add(mant, new THREE.ConeGeometry(1.3, 2.4, 3), g(.66), 0, 4.6, s * 2.2); f.scale.x = .2; f.rotation.x = s * 1.1; return f; });
// 頭、まゆの盛り上がり、目（まぶたと横長のひとみ）、水をはく管
add(oct, new THREE.SphereGeometry(2.05, 10, 7), g(.66), .5, 2.5, 0).scale.set(1.1, .9, 1.1);
const eyes = [-1, 1].map(s => { const e = new THREE.Group(); e.position.set(1.9, 3.1, s * 1.35); e.rotation.y = s * -.5; add(e, new THREE.SphereGeometry(.78, 8, 6), g(.56), -.2, 0, 0); add(e, new THREE.SphereGeometry(.6, 8, 6), a('#ffd84a'), .16, 0, 0); box(e, .2, .2, .9, g(.02), .7, 0, 0); const lid = add(e, new THREE.SphereGeometry(.68, 8, 5, 0, 6.3, 0, 1.25), g(.74), .16, 0, 0); const brow = box(e, .9, .28, 1.5, g(.8), .2, .66, 0); brow.rotation.z = -.3; oct.add(e); return { e, lid }; });
const sip = add(oct, new THREE.CylinderGeometry(.34, .46, 1.5, 7), g(.6), .9, 1.9, 2); sip.rotation.set(1.1, 0, -.4); add(oct, new THREE.TorusGeometry(.34, .09, 4, 8), g(.85), 1.22, 2.34, 2.62).rotation.set(1.1, 0, -.4);
// 足のつけ根の水かき
add(oct, new THREE.ConeGeometry(3.4, 1.7, 12, 1, true), new THREE.MeshStandardMaterial({ color: new THREE.Color(.58, .58, .58), flatShading: true, roughness: 1, side: THREE.DoubleSide }), .5, 1.5, 0);
// 足：16 節のくさり＋吸ばん 2 列
function chain(parent, n, len, r0, v) { const segs = []; let p = parent; for (let i = 0; i < n; i++) { const s = new THREE.Group(); if (i) s.position.y = len; const r = r0 * Math.pow(1 - i / n, .75) + .06, geo = new THREE.CylinderGeometry(r * .88, r, len * 1.08, 7); geo.translate(0, len / 2, 0); s.add(new THREE.Mesh(geo, g(v))); for (const z of [-.34, .34]) { const sk = new THREE.Mesh(new THREE.SphereGeometry(r * .36, 5, 4), g(1)); sk.position.set(r * .82, len * .5, z * r * 2); s.add(sk); const hole = new THREE.Mesh(new THREE.SphereGeometry(r * .17, 4, 3), g(.4)); hole.position.set(r * 1.12, len * .5, z * r * 2); s.add(hole); } p.add(s); segs.push(s); p = s; } return segs; }
const ARMS = [[.5, 0, 0], [1.3, 1, 1.2], [2.3, 2, .4], [3.4, 3, 2.1], [4.4, 4, 3.3], [5.4, 5, .9]];
const free = ARMS.map(([an, i, ph]) => { const root = new THREE.Group(); root.position.set(.5 + Math.cos(an) * 2, 1.2, Math.sin(an) * 2); root.rotation.order = 'YZX'; root.rotation.y = -an; root.rotation.z = -1.3; oct.add(root); return { segs: chain(root, 16, .66, .72, .68), i, ph }; });
// こわれた小舟を、1 本の足の先でつかんでいる
{ const tip = free[1].segs[13], boat = new THREE.Group(); boat.position.set(.4, .4, 0); boat.rotation.z = 1.2; box(boat, 2.6, .5, 1, g(.5), 0, 0, 0); box(boat, 2.2, .12, .8, g(.3), 0, .28, 0); box(boat, .08, 1.8, .08, g(.6), .3, 1, 0); const sl = box(boat, .04, 1, .8, g(.95), .3, 1.2, .4); sl.rotation.x = .3; tip.add(boat); }
// 灯台に巻きつく 2 本（らせんに並べた筒＋吸ばん）
for (const [ph0, dir] of [[2.7, 1], [5.5, -1]]) { let prev = null; for (let k = 0; k <= 34; k++) { const u = k / 34, an = ph0 + dir * u * 8, rad = 1.98 - u * .52 + (k < 4 ? (4 - k) * .55 : 0), p = new THREE.Vector3(Math.cos(an) * rad, .9 + u * 8.6, Math.sin(an) * rad); if (prev) { const r = .64 * Math.pow(1 - u, .7) + .08, m = add(w, new THREE.CylinderGeometry(r * .92, r, prev.distanceTo(p) * 1.3, 7), g(.68), (p.x + prev.x) / 2, (p.y + prev.y) / 2, (p.z + prev.z) / 2); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), p.clone().sub(prev).normalize()); for (const dy of [-.2, .2]) add(w, new THREE.SphereGeometry(r * .34, 5, 4), g(1), p.x * (1 + r * .42), p.y + dy * r * 1.6, p.z * (1 + r * .42)); } prev = p; } }
const fx = K.fx(w, 80), motes = D.motes(150, 10, 14); let sT = 0;
D.run((dt, t) => {
  beam.rotation.y = t * .8; lampL.intensity = 24 + Math.sin(t * 6) * 3;
  const br = Math.sin(t * 1.2); mesh.scale.set(1 + br * .04, 1 - br * .03, 1 + br * .04); mant.rotation.z = .5 + Math.sin(t * .5) * .05; fins.forEach((f, i) => { f.rotation.z = Math.sin(t * 1.6 + i) * .25; });
  const blink = (t % 5.2) > 4.9 ? 1 : 0; eyes.forEach(({ e, lid }) => { lid.rotation.z = blink ? -1.5 : -.35; });
  for (const f of free) f.segs.forEach((s, k) => { s.rotation.z = (k < 5 ? -.07 : .13 + (k > 11 ? .12 : 0)) + Math.sin(t * 1.1 - k * .45 + f.ph) * .13; s.rotation.x = Math.cos(t * .8 - k * .36 + f.ph) * .09; });
  if ((sT -= dt) < 0) { sT = .12; const an = Math.random() * 6.283; fx.emit('puff', Math.cos(an) * 6.8, .2, Math.sin(an) * 6.8, { vy: 1.4, spread: .8, life: .9, size: .6, grow: 1.4 }); }
  fx.update(dt); motes.position.y = Math.sin(t * .3) * .3;
});
</script>
