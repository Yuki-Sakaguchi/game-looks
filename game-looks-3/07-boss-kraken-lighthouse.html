<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3-07 ボス：灯台をしめつける大だこ</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;image-rendering:pixelated}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#f070b0;opacity:.85}
</style>
<div id="cap">3-07 ─ ボス：灯台をしめつける大だこ / ばら色 1 色 ＋ 黄色い灯りと目　｜　見るだけ</div>
<script src="kit.js"></script><script src="diorama.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 灯台に巻きついた大だこ。色はばら色の 6 段だけで、差し色は黄色（灯台の光、たこの目）。
// 足は、短い筒を何個もつないだ「くさり」。つけ根から先へ少しずつ遅らせて曲げると、うねって見える。
// 灯台の光は回る円すいで、通るたびに足やかさを 1〜2 段明るくなぞる
import * as THREE from 'three';
const K = KIT(THREE), D = DIORAMA(THREE, K, { ramp: ['#000000', '#2a0a22', '#6a1650', '#b82e80', '#f070b0', '#ffd8ec'], acc: ['#6a4a00', '#d8a010', '#ffd84a', '#fff6c0'], dist: 37, height: 11, look: 5.6 });
const { world: w, g, a } = D, { add, box, hash } = K;
D.base(7.6, .5);
for (let i = 0; i < 12; i++) { const an = i / 12 * 6.283; add(w, new THREE.IcosahedronGeometry(.8 + hash(i, 1) * .9, 0), g(.42), Math.cos(an) * 5.4, .2, Math.sin(an) * 5.4).scale.y = .6; }
// 灯台
add(w, new THREE.CylinderGeometry(1.25, 1.8, 9, 10), g(.82), 0, 4.5, 0); for (let k = 0; k < 3; k++) add(w, new THREE.CylinderGeometry(1.36 + (2 - k) * .16, 1.44 + (2 - k) * .16, 1, 10), g(.45), 0, 1.6 + k * 2.6, 0);
add(w, new THREE.CylinderGeometry(1.7, 1.5, .4, 10), g(.6), 0, 9.2, 0); add(w, new THREE.CylinderGeometry(.9, .9, 1.4, 8), a('#ffd84a'), 0, 10.1, 0); add(w, new THREE.ConeGeometry(1.3, 1.2, 8), g(.5), 0, 11.4, 0); box(w, .1, .8, .1, g(.8), 0, 12.4, 0);
for (let k = 0; k < 8; k++) { const an = k * .785; box(w, .08, 1.4, .08, g(.3), Math.cos(an) * .92, 10.1, Math.sin(an) * .92); }
box(w, .7, 1.3, .1, g(.12), 0, .9, 1.76);
const lampL = new THREE.PointLight(0xffffff, 26, 14, 1.5); lampL.position.set(0, 10.2, 0); w.add(lampL);
const beam = new THREE.Group(); beam.position.y = 10.1; for (const s of [1, -1]) { const bg = new THREE.ConeGeometry(2.6, 15, 12, 1, true); bg.translate(0, -7.5, 0); const m = new THREE.Mesh(bg, new THREE.MeshBasicMaterial({ color: 0xffd84a, transparent: true, opacity: .2, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false })); m.rotation.z = s * Math.PI / 2; beam.add(m); } w.add(beam);
// 大だこ：かさ（頭）、目、灯台に巻きつく足、うねる足
const oct = new THREE.Group(); oct.position.set(-3.2, 0, -1.4); w.add(oct);
const mantle = add(oct, new THREE.SphereGeometry(2.6, 10, 8), g(.72), 0, 5.4, 0); mantle.scale.set(1, 1.35, 1.05); mantle.rotation.z = .25;
for (let i = 0; i < 18; i++) { const th = hash(i, 2) * 6.283, ph = .3 + hash(i, 3) * 1.2; add(mantle, new THREE.SphereGeometry(.2 + hash(i, 4) * .22, 5, 4), g(1), Math.sin(ph) * Math.cos(th) * 2.56, Math.cos(ph) * 2.56, Math.sin(ph) * Math.sin(th) * 2.56); }
add(oct, new THREE.SphereGeometry(2.1, 9, 6), g(.62), .4, 2.6, .2);
const eyes = [1, -1].map(s => { const e = new THREE.Group(); e.position.set(1.7, 3.5, s * 1.25 + .2); add(e, new THREE.SphereGeometry(.62, 8, 6), a('#ffd84a'), 0, 0, 0); box(e, .2, .9, .14, g(.02), .56, 0, 0).rotation.y = s * -.3; oct.add(e); return e; });
function chain(parent, n, len, r0, v) { const segs = []; let p = parent; for (let i = 0; i < n; i++) { const s = new THREE.Group(); if (i) s.position.y = len; const r = r0 * (1 - i / n * .86), geo = new THREE.CylinderGeometry(r * .82, r, len * 1.06, 6); geo.translate(0, len / 2, 0); s.add(new THREE.Mesh(geo, g(v))); if (i % 2 === 0) { const sk = new THREE.Mesh(new THREE.SphereGeometry(r * .42, 5, 4), g(1)); sk.position.set(r * .8, len * .5, 0); s.add(sk); } p.add(s); segs.push(s); p = s; } return segs; }
const free = [[1.6, 2, 2.2, -.9, 1.1], [-1.2, 1.4, 2.6, .9, 2.2], [-2.2, 1.2, -.4, 1.2, 3.4], [.2, 1.2, -2.4, -1.1, 4.6], [-1.6, 1.6, -2, 1, 5.4]].map(([x, y, z, tilt, yaw], i) => { const root = new THREE.Group(); root.position.set(x, y, z); root.rotation.set(0, yaw, tilt); oct.add(root); return { segs: chain(root, 11, .95, .62, .66), i }; });
// 灯台に巻きつく 2 本（らせんに並べた筒）
for (const [ph0, dir] of [[2.6, 1], [5.4, -1]]) { let prev = null; for (let k = 0; k <= 26; k++) { const u = k / 26, an = ph0 + dir * u * 7.4, rad = 1.95 - u * .5 + (k < 3 ? (3 - k) * .6 : 0), p = new THREE.Vector3(Math.cos(an) * rad, .8 + u * 8.4, Math.sin(an) * rad); if (prev) { const r = .58 * (1 - u * .8), m = add(w, new THREE.CylinderGeometry(r * .9, r, prev.distanceTo(p) * 1.25, 6), g(.66), (p.x + prev.x) / 2, (p.y + prev.y) / 2, (p.z + prev.z) / 2); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), p.clone().sub(prev).normalize()); if (k % 2) add(w, new THREE.SphereGeometry(r * .4, 5, 4), g(1), p.x * 1.12, p.y, p.z * 1.12); } prev = p; } }
// こわれた小舟、波のしぶき
const boat = box(w, 2.4, .5, 1, g(.5), 4.6, .5, 3); boat.rotation.set(.3, .6, .5); box(w, .08, 2, .08, g(.6), 4.9, 1.4, 3.2).rotation.z = .7;
const fx = K.fx(w, 80), motes = D.motes(150, 10, 14); let sT = 0;
D.run((dt, t) => {
  beam.rotation.y = t * .8; lampL.intensity = 24 + Math.sin(t * 6) * 3;
  mantle.scale.set(1 + Math.sin(t * 1.2) * .04, 1.35 - Math.sin(t * 1.2) * .05, 1.05 + Math.sin(t * 1.2) * .04);
  eyes.forEach(e => { e.scale.y = (t % 5) > 4.8 ? .1 : 1; });
  for (const f of free) f.segs.forEach((s, k) => { s.rotation.z = Math.sin(t * 1.1 - k * .55 + f.i * 1.7) * .22 + (k > 6 ? .22 : .04); s.rotation.x = Math.cos(t * .8 - k * .4 + f.i) * .12; });
  if ((sT -= dt) < 0) { sT = .12; const an = Math.random() * 6.283; fx.emit('puff', Math.cos(an) * 6.6, .2, Math.sin(an) * 6.6, { vy: 1.4, spread: .8, life: .9, size: .6, grow: 1.4 }); }
  fx.update(dt); motes.position.y = Math.sin(t * .3) * .3;
});
</script>
