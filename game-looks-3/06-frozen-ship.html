<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3-06 氷にとざされた船</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;image-rendering:pixelated}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#80d8e8;opacity:.85}
</style>
<div id="cap">3-06 ─ 氷にとざされた船 / 氷の青緑 1 色 ＋ 赤い旗と灯り　｜　見るだけ</div>
<script src="kit.js"></script><script src="diorama.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 氷に閉じこめられた帆船。色は氷の青緑の 6 段だけで、差し色は赤（旗、船室の灯り、小さな焚き火）。
// 雪は大きさの変わらない点で降らせる。空からは、ゆらぐ光の幕（オーロラ）がうすく下りてくる
import * as THREE from 'three';
const K = KIT(THREE), D = DIORAMA(THREE, K, { ramp: ['#000000', '#081c2a', '#12445c', '#2a8aaa', '#82dae8', '#f2ffff'], acc: ['#5a0a0a', '#c0281a', '#ff5a3a', '#ffc0a0'], dist: 34, height: 11, look: 4.4 });
const { world: w, g, a } = D, { add, box, hash } = K;
D.base(8, .75);
// 氷のとげと板
for (let i = 0; i < 22; i++) { const an = hash(i, 1) * 6.283, r = 3.6 + hash(i, 2) * 4, h = 1.2 + hash(i, 3) * 3.6, c = add(w, new THREE.ConeGeometry(.4 + hash(i, 4) * .6, h, 4), g(.8 + hash(i, 5) * .2), Math.cos(an) * r, h / 2 - .1, Math.sin(an) * r); c.rotation.set((hash(i, 6) - .5) * .6, an, (hash(i, 7) - .5) * .6); }
for (let i = 0; i < 9; i++) { const an = i * .7, p = box(w, 2 + hash(i, 8), .2, 1.4, g(.92), Math.cos(an) * 5.4, .12, Math.sin(an) * 5.4); p.rotation.set((hash(i, 9) - .5) * .3, an, (hash(i, 10) - .5) * .3); }
// 船：かたむいて氷にはまっている
const ship = new THREE.Group(); ship.rotation.set(.1, .5, .16); ship.position.set(0, .7, 0); w.add(ship);
const hull = add(ship, new THREE.SphereGeometry(1, 10, 6), g(.42), 0, .6, 0); hull.scale.set(4.4, 1.3, 1.5); box(ship, 7, .16, 2.3, g(.62), 0, 1.3, 0);
box(ship, 2.2, 1.2, 2, g(.5), -2.6, 1.9, 0); box(ship, 2.4, .16, 2.2, g(.66), -2.6, 2.56, 0); box(ship, .1, .5, .7, a('#ff5a3a'), -1.48, 1.9, 0); const cab = new THREE.PointLight(0xffffff, 6, 5, 1.6); cab.position.set(-1, 2, 0); ship.add(cab);
for (const x of [-3, -1, 1, 3]) { box(ship, .08, .5, .08, g(.7), x, 1.6, 1.1); box(ship, .08, .5, .08, g(.7), x, 1.6, -1.1); } box(ship, 6.6, .06, .06, g(.7), 0, 1.84, 1.1); box(ship, 6.6, .06, .06, g(.7), 0, 1.84, -1.1);
const bow = add(ship, new THREE.CylinderGeometry(.06, .1, 3, 5), g(.6), 4.6, 2, 0); bow.rotation.z = -1.1;
const sails = [];
for (const [x, h] of [[-.4, 7], [2, 5.6]]) { add(ship, new THREE.CylinderGeometry(.09, .13, h, 6), g(.55), x, 1.3 + h / 2, 0); for (let k = 0; k < 2; k++) { const y = 1.3 + h * (.55 + k * .3), wd = 3.2 - k * .8; box(ship, .08, .08, wd, g(.55), x, y, 0); const sl = box(ship, .04, h * .22, wd * .9, g(.9), x + .05, y - h * .12, 0); sl.geometry.translate(0, 0, 0); sails.push(sl); } add(ship, new THREE.CylinderGeometry(.3, .3, .3, 6), g(.5), x, 1.3 + h * .78, 0); }
const flag = box(ship, .7, .4, .04, a('#ff5a3a'), .0, 8.5, 0); flag.geometry.translate(.35, 0, 0); flag.position.set(-.4, 8.5, 0);
for (let i = 0; i < 12; i++) add(ship, new THREE.ConeGeometry(.07, .5 + hash(i, 11) * .6, 4), g(1), -3.2 + i * .55, 1.1 - hash(i, 11) * .2, 1.52).rotation.x = Math.PI;
// 氷の上の小さな焚き火と人、ペンギン
const cx = 3.6, cz = 3.4; for (let k = 0; k < 4; k++) add(w, new THREE.CylinderGeometry(.05, .05, .6, 4), g(.3), cx, .2, cz).rotation.set(1.2, k * 1.57, 0);
const fire = new THREE.PointLight(0xffffff, 10, 7, 1.6); fire.position.set(cx, .8, cz); w.add(fire);
for (const [dx, dz] of [[1, .2], [-.4, 1]]) { box(w, .4, .6, .34, g(.5), cx + dx, .4, cz + dz); add(w, new THREE.IcosahedronGeometry(.2, 0), g(.9), cx + dx, .86, cz + dz); }
const pens = [...Array(5)].map((_, i) => { const p = new THREE.Group(); add(p, new THREE.CylinderGeometry(.16, .22, .6, 6), g(.3), 0, .3, 0); add(p, new THREE.SphereGeometry(.17, 6, 5), g(.3), 0, .68, 0); box(p, .06, .34, .2, g(1), .16, .3, 0); p.userData = { an: 3 + i * .34 }; w.add(p); return p; });
// オーロラ（うすい光の幕）と雪
const ac = document.createElement('canvas'); ac.width = 4; ac.height = 64; { const x = ac.getContext('2d'), gr = x.createLinearGradient(0, 0, 0, 64); gr.addColorStop(0, '#000'); gr.addColorStop(.35, '#fff'); gr.addColorStop(1, '#000'); x.fillStyle = gr; x.fillRect(0, 0, 4, 64); }
const aurT = new THREE.CanvasTexture(ac);
const aur = [...Array(4)].map((_, i) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(9, 9, 12, 1), new THREE.MeshBasicMaterial({ color: 0xffffff, alphaMap: aurT, transparent: true, opacity: .1, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false })); m.position.set(-3 + i * 2, 13 + (i % 2), -3 + i * 1.6); m.rotation.y = .4 + i * .3; w.add(m); return m; });
const snow = D.motes(420, 11, 18), fx = K.fx(w, 80); let fT = 0;
D.run((dt, t) => {
  if ((fT -= dt) < 0) { fT = .07; fx.emit('flame', cx + (Math.random() - .5) * .2, .5, cz + (Math.random() - .5) * .2, { vy: .9, life: .5, size: .7, grow: -.3, fog: false, tint: '#ff7a5a' }); if (Math.random() < .3) fx.emit('spark', cx, .9, cz, { vy: 1.6, spread: 1, life: 1, size: .22, fog: false, tint: '#ff5a3a' }); }
  fx.update(dt); fire.intensity = 10 * (.8 + .2 * Math.sin(t * 13) * Math.sin(t * 7));
  flag.rotation.y = Math.sin(t * 5) * .5; sails.forEach((s, i) => { s.rotation.z = Math.sin(t * 1.3 + i) * .06; });
  pens.forEach((p, i) => { const an = p.userData.an + Math.sin(t * .2) * .3; p.position.set(Math.cos(an) * 5.6, .12, Math.sin(an) * 5.6); p.rotation.set(0, -an, Math.sin(t * 7 + i) * .14); });
  aur.forEach((m, i) => { const pos = m.geometry.attributes.position; for (let k = 0; k < pos.count; k++) pos.setZ(k, Math.sin(pos.getX(k) * .8 + t * .7 + i) * .8); pos.needsUpdate = true; m.material.opacity = .05 + Math.sin(t * .5 + i * 1.7) * .025; });
  snow.position.y = -((t * 1.1) % 2);
});
</script>
</html>
