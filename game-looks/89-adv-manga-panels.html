<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 89 会話アドベンチャー 白黒マンガ</title>
<style>
html,body{margin:0;height:100%;background:#8a8a86;overflow:hidden;display:grid;place-items:center}
canvas{width:min(100vw,160vh);aspect-ratio:8/5;display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#111;background:#f6f4ec;padding:0 6px}
</style>
<canvas id="c"></canvas>
<div id="cap">LOOK 89 ─ 会話アドベンチャー / 白黒マンガのコマ割り　｜　見るだけ（コマが順に現れ、せりふが出る）</div>
<script>
// 黒インク 1 色の原稿。灰色は使わず、濃淡は点々のトーン（細かい点・粗い点・だんだん大きくなる点）で出す。
// 会話は 1 コマずつ現れ、せりふは吹き出しの中に縦書きで 1 字ずつ出る。
// 大きな音は絵の一部として太い描き文字にし、最後のコマは中心へ向かう集中線で引きしめる
const LW = 960, LH = 600, S = Math.min(devicePixelRatio || 1, 2);
const cv = document.getElementById('c'); cv.width = LW * S; cv.height = LH * S; const g = cv.getContext('2d');
const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
const INK = '#111', PAPER = '#f6f4ec', JP = '"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif', GOTH = '"Hiragino Kaku Gothic StdN","Hiragino Sans","Yu Gothic",sans-serif';
const tone = (sp, r) => { const c = document.createElement('canvas'); c.width = c.height = sp * 2; const q = c.getContext('2d'); q.fillStyle = INK; for (const [x, y] of [[sp / 2, sp / 2], [sp * 1.5, sp * 1.5]]) { q.beginPath(); q.arc(x, y, r, 0, 7); q.fill(); } return g.createPattern(c, 'repeat'); };
const T1 = tone(3, .9), T2 = tone(4, 1.7), T3 = tone(5, 2.7);
const P = [[150, 28, 660, 190], [540, 232, 270, 340], [150, 232, 376, 130], [150, 376, 376, 196]];   // 右上から読む順
function panel(i, fn) { const [x, y, w, h] = P[i]; g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip(); g.fillStyle = PAPER; g.fillRect(x, y, w, h); g.translate(x, y); fn(w, h); g.restore(); g.strokeStyle = INK; g.lineWidth = 3; g.strokeRect(x, y, w, h); }
function bubble(x, y, w, h, text, k, spiky) {
  g.fillStyle = PAPER; g.strokeStyle = INK; g.lineWidth = 2; g.beginPath();
  if (spiky) for (let i = 0; i < 28; i++) { const a = i / 28 * 6.283, r = i % 2 ? 1 : .78; g.lineTo(x + Math.cos(a) * w / 2 * r, y + Math.sin(a) * h / 2 * r); } else g.ellipse(x, y, w / 2, h / 2, 0, 0, 7);
  g.closePath(); g.fill(); g.stroke();
  g.fillStyle = INK; g.font = `${spiky ? '900' : '600'} 19px ${spiky ? GOTH : JP}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  const cols = text.split('|'), n = Math.floor(k); let c = 0; cols.forEach((col, ci) => { for (let j = 0; j < col.length; j++) { if (c++ >= n) return; const ch = col[j], cx = x + ((cols.length - 1) / 2 - ci) * 24, cy = y - (col.length - 1) * 10.5 + j * 21; if ('ー…'.includes(ch)) { g.save(); g.translate(cx, cy); g.rotate(Math.PI / 2); g.fillText(ch, 0, 0); g.restore(); } else g.fillText(ch, cx + ('、。'.includes(ch) ? 8 : 0), cy - ('、。'.includes(ch) ? 8 : 0)); } });
  g.textBaseline = 'alphabetic';
}
function face(x, y, s, kind, scared) {
  g.save(); g.translate(x, y); g.scale(s, s); g.lineJoin = 'round'; g.lineWidth = 2.2 / s; g.strokeStyle = INK;
  g.fillStyle = PAPER; g.beginPath(); g.moveTo(-34, -20); g.quadraticCurveTo(-36, 30, 0, 50); g.quadraticCurveTo(36, 30, 34, -20); g.quadraticCurveTo(0, -56, -34, -20); g.fill(); g.stroke();
  g.fillStyle = PAPER; g.beginPath(); g.moveTo(-14, 44); g.lineTo(-18, 70); g.lineTo(-70, 86); g.lineTo(-76, 140); g.lineTo(76, 140); g.lineTo(70, 86); g.lineTo(18, 70); g.lineTo(14, 44); g.fill(); g.stroke();
  g.fillStyle = kind ? T2 : INK; g.beginPath(); g.moveTo(-70, 86); g.lineTo(-18, 70); g.lineTo(0, 96); g.lineTo(18, 70); g.lineTo(70, 86); g.lineTo(76, 140); g.lineTo(-76, 140); g.fill(); g.stroke();
  g.fillStyle = INK; g.beginPath();
  if (kind) { g.moveTo(-40, 26); g.quadraticCurveTo(-52, -52, 0, -58); g.quadraticCurveTo(52, -52, 40, 26); g.lineTo(32, -12); g.quadraticCurveTo(10, -30, -8, -14); g.quadraticCurveTo(-22, -24, -32, -8); g.closePath(); }
  else { g.moveTo(-36, -10); for (let i = 0; i <= 8; i++) { const a = Math.PI + i / 8 * Math.PI; g.lineTo(Math.cos(a) * 52, -24 + Math.sin(a) * 50 - (i % 2 ? 0 : 0)); g.lineTo(Math.cos(a + .2) * 34, -18 + Math.sin(a + .2) * 26); } g.lineTo(36, -10); g.lineTo(20, -22); g.lineTo(6, -8); g.lineTo(-10, -24); g.lineTo(-22, -6); g.closePath(); }
  g.fill();
  for (const sx of [-15, 15]) { const eh = scared ? 12 : 8; g.fillStyle = PAPER; g.beginPath(); g.ellipse(sx, 4, 9, eh, 0, 0, 7); g.fill(); g.stroke(); g.fillStyle = INK; g.beginPath(); g.ellipse(sx + (scared ? 0 : 2), 5, scared ? 3 : 5, scared ? 3 : 6, 0, 0, 7); g.fill(); g.fillStyle = PAPER; g.beginPath(); g.arc(sx + 1, 2, 1.6, 0, 7); g.fill(); g.beginPath(); g.moveTo(sx - 11, -eh - 4 + (scared ? -3 : 0)); g.lineTo(sx + 10, -eh - 6); g.stroke(); }
  g.beginPath(); if (scared) g.ellipse(0, 32, 6, 8, 0, 0, 7); else { g.moveTo(-7, 30); g.quadraticCurveTo(0, 34, 8, 29); } g.stroke();
  if (scared) { g.lineWidth = 1.4 / s; g.beginPath(); for (let i = 0; i < 4; i++) { g.moveTo(-30 + i * 5, 12); g.lineTo(-32 + i * 5, 26); } g.stroke(); }
  g.restore();
}
const LINES = ['……ここが、|最後の部屋か', '待って。|何か聞こえる', '来るぞ！'];
const start = performance.now();
function frame(now) {
  const t = ((now - start) / 1000) % 15, k = i => Math.max(0, t - [0, 2.6, 5.4, 7.6][i]);
  g.setTransform(S, 0, 0, S, 0, 0); g.fillStyle = '#8a8a86'; g.fillRect(0, 0, LW, LH); g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(128, 12, 716, 590); g.fillStyle = PAPER; g.fillRect(120, 4, 716, 590);
  // 1：廊下の奥
  if (k(0) > 0) panel(0, (w, h) => { const vx = w * .42, vy = h * .5; g.fillStyle = T1; g.fillRect(0, 0, w, h); g.fillStyle = PAPER; g.beginPath(); g.moveTo(0, 0); g.lineTo(vx - 40, vy - 34); g.lineTo(vx + 40, vy - 34); g.lineTo(w, 0); g.fill(); g.fillStyle = T3; g.beginPath(); g.moveTo(0, h); g.lineTo(vx - 40, vy + 34); g.lineTo(vx + 40, vy + 34); g.lineTo(w, h); g.fill();
    g.fillStyle = INK; g.fillRect(vx - 40, vy - 34, 80, 68); g.fillStyle = PAPER; g.fillRect(vx - 5, vy - 22, 10, 44); g.strokeStyle = INK; g.lineWidth = 1.5; g.beginPath(); for (const [cx, cy] of [[0, 0], [w, 0], [0, h], [w, h]]) { g.moveTo(cx, cy); g.lineTo(vx + (cx ? 40 : -40), vy + (cy ? 34 : -34)); } for (let i = 1; i < 6; i++) { const f = i / 6, f2 = f * f; g.moveTo(vx - 40 - (vx - 40) * f2, vy - 34 - (vy - 34) * f2); g.lineTo(vx - 40 - (vx - 40) * f2, vy + 34 + (h - vy - 34) * f2); g.moveTo(vx + 40 + (w - vx - 40) * f2, vy - 34 - (vy - 34) * f2); g.lineTo(vx + 40 + (w - vx - 40) * f2, vy + 34 + (h - vy - 34) * f2); } g.stroke();
    for (const [x, s] of [[w * .62, .34], [w * .72, .3]]) { g.fillStyle = INK; g.beginPath(); g.arc(x, h * .58, 9 * s * 3, 0, 7); g.fill(); g.fillRect(x - 11 * s * 3, h * .58 + 6, 22 * s * 3, 60); }
    bubble(w - 62, h * .5, 92, 176, LINES[0], k(0) * 9); });
  // 2：ひとりめの顔
  if (k(1) > 0) panel(1, (w, h) => { g.fillStyle = T1; g.fillRect(0, 0, w, h); face(w * .44, h * .56, 1.5, 0, false); bubble(w - 56, 96, 88, 168, LINES[1], k(1) * 9); });
  // 3：小さな音
  if (k(2) > 0) panel(2, (w, h) => { g.fillStyle = INK; g.fillRect(0, 0, w, h); g.fillStyle = PAPER; g.font = `900 60px ${GOTH}`; g.textAlign = 'center'; for (let i = 0; i < 4; i++) { g.save(); g.translate(56 + i * 88 + Math.sin(t * 30 + i) * 1.5, 66 + i * 12 + Math.cos(t * 26 + i) * 1.5); g.rotate(-.12); g.scale(1, 1 + i * .12); g.fillText('ゴ', 0, 0); g.restore(); } });
  // 4：集中線
  if (k(3) > 0) panel(3, (w, h) => { const cx = w * .5, cy = h * .5; g.fillStyle = INK; for (let i = 0; i < 90; i++) { const a = i / 90 * 6.283 + hash(i, 1) * .05, r0 = 100 + hash(i, 2) * 60, wd = .012 + hash(i, 3) * .022; g.beginPath(); g.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0 * .9); g.lineTo(cx + Math.cos(a - wd) * 500, cy + Math.sin(a - wd) * 500); g.lineTo(cx + Math.cos(a + wd) * 500, cy + Math.sin(a + wd) * 500); g.fill(); }
    face(cx - 10, cy + 6, 1.1, 1, true); g.font = `900 78px ${GOTH}`; g.lineWidth = 9; g.strokeStyle = PAPER; g.fillStyle = INK; g.textAlign = 'center'; ['ド', 'ン'].forEach((ch, i) => { g.save(); g.translate(64 + i * 30, h - 96 + i * 62); g.rotate(-.2); g.strokeText(ch, 0, 0); g.fillText(ch, 0, 0); g.restore(); });
    bubble(w - 68, 74, 104, 124, LINES[2], k(3) * 9, true); });
  g.fillStyle = INK; g.font = `12px ${JP}`; g.textAlign = 'center'; g.fillText('89', 478, 588);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
