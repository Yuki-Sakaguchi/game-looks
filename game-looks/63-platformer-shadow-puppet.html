<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 63 横スクロール 影絵芝居</title>
<style>
html,body{margin:0;height:100%;background:#1a0b03;overflow:hidden;display:grid;place-items:center}
canvas{width:min(100vw,160vh);aspect-ratio:8/5;display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#ffd98a;opacity:.85}
</style>
<canvas id="c"></canvas>
<div id="cap">LOOK 63 ─ 横スクロールアクション / 影絵芝居　｜　見るだけ（岩をとびこえる）</div>
<script>
// 布のスクリーンを後ろからランプで照らしている。人形は布にぴったり付いているので黒くてくっきり、
// 布から離れた背景ほど影がぼけて、うすくなる（このぼけ具合で奥行きを出す）。
// 人形には飾りの穴をあけ、手と体には操る棒を付ける。ランプの炎がゆれるので明るさも少しゆらぐ
const LW = 960, LH = 600, S = Math.min(devicePixelRatio || 1, 2);
const cv = document.getElementById('c'); cv.width = LW * S; cv.height = LH * S; const g = cv.getContext('2d');
const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
const weave = document.createElement('canvas'); weave.width = weave.height = 6; { const q = weave.getContext('2d'); q.fillStyle = 'rgba(80,30,0,.1)'; q.fillRect(0, 0, 6, 1); q.fillRect(0, 0, 1, 6); q.fillStyle = 'rgba(255,240,200,.07)'; q.fillRect(3, 3, 3, 1); }
const GY = 468, HX = 380, BLACK = '#170a03', HOLE = 'rgba(255,196,104,.92)';
// ぼけた影：形を画面の外に描き、その「影」だけを画面の中に落とす
function soft(blur, col, fn) { g.save(); g.shadowColor = col; g.shadowBlur = blur * S; g.shadowOffsetX = 3000 * S; g.translate(-3000, 0); g.fillStyle = col; g.strokeStyle = col; fn(); g.restore(); }
const start = performance.now();
function frame(now) {
  const t = (now - start) / 1000, wx = t * 150, fl = 1 + Math.sin(t * 11) * .025 + Math.sin(t * 6.3) * .03;
  g.setTransform(S, 0, 0, S, 0, 0);
  const bg = g.createRadialGradient(480, 330, 30, 480, 330, 600 * fl); bg.addColorStop(0, '#ffe6a2'); bg.addColorStop(.35, '#f6b85a'); bg.addColorStop(.7, '#c26a1e'); bg.addColorStop(1, '#4a1c04'); g.fillStyle = bg; g.fillRect(0, 0, LW, LH);
  // 遠い山（大きくぼける）
  soft(22, 'rgba(90,40,8,.38)', () => { g.beginPath(); g.moveTo(0, LH); for (let x = 0; x <= LW; x += 16) { const u = (x + wx * .15) * .006; g.lineTo(x, 330 - Math.abs(Math.sin(u)) * 150 - Math.sin(u * 3.1) * 24); } g.lineTo(LW, LH); g.fill(); });
  // 中くらいの木（少しぼける）
  soft(9, 'rgba(60,24,4,.62)', () => { for (let k = -1; k < 6; k++) { const n = Math.floor(wx * .45 / 230) + k, x = n * 230 - wx * .45 + hash(n, 1) * 80, h = 190 + hash(n, 2) * 90;
    g.beginPath(); g.moveTo(x - 8, GY); g.quadraticCurveTo(x - 2, GY - h * .5, x - 5 + hash(n, 3) * 20, GY - h); g.lineTo(x + 6 + hash(n, 3) * 20, GY - h); g.quadraticCurveTo(x + 10, GY - h * .5, x + 10, GY); g.fill();
    for (let i = 0; i < 7; i++) { const a = -2.7 + i * .38; g.beginPath(); g.ellipse(x + hash(n, 3) * 20 + Math.cos(a) * 50, GY - h + Math.sin(a) * 34 + 10, 46, 9, a, 0, 7); g.fill(); } } });
  // 地面と岩（くっきり）
  const rocks = []; for (let k = -1; k < 3; k++) { const n = Math.floor(wx / 520) + k; rocks.push(n * 520 + 300 - wx + HX); }
  soft(1.5, BLACK, () => { g.beginPath(); g.moveTo(0, LH); for (let x = 0; x <= LW; x += 8) g.lineTo(x, GY + Math.sin((x + wx) * .02) * 4 + ((Math.floor((x + wx) / 8)) % 3 ? 0 : -9)); g.lineTo(LW, LH); g.fill();
    for (const rx of rocks) { g.beginPath(); g.moveTo(rx - 44, GY + 4); g.lineTo(rx - 30, GY - 30); g.lineTo(rx - 6, GY - 48); g.lineTo(rx + 22, GY - 36); g.lineTo(rx + 42, GY + 4); g.fill(); } });
  // 人形
  let jy = 0; for (const rx of rocks) { const d = rx - HX; if (Math.abs(d) < 130) jy = Math.cos(d / 130 * Math.PI / 2) * 96; }
  const air = jy > 4, ph = t * 9, y = GY - jy, leg = air ? .5 : Math.sin(ph) * .6, armA = air ? -2.2 : -.6 + Math.sin(ph) * .5, armB = air ? -.9 : .9 - Math.sin(ph) * .5;
  const J = (x0, y0, a, l) => [x0 + Math.sin(a) * l, y0 + Math.cos(a) * l];
  const hip = [HX, y - 78], sh = [HX + 4, y - 150], kA = J(...hip, leg, 40), fA = J(...kA, leg - .35, 40), kB = J(...hip, -leg, 40), fB = J(...kB, -leg - .35, 40), eA = J(...sh, armA, 36), hA = J(...eA, armA - .9, 36), eB = J(...sh, armB, 36), hB = J(...eB, armB + .8, 36);
  g.strokeStyle = 'rgba(50,22,4,.55)'; g.lineWidth = 2.2; g.beginPath(); g.moveTo(...hA); g.lineTo(hA[0] - 20, LH); g.moveTo(...hB); g.lineTo(hB[0] + 30, LH); g.moveTo(HX, y - 100); g.lineTo(HX + 6, LH); g.stroke();
  soft(1.5, BLACK, () => { g.lineCap = 'round'; g.lineJoin = 'round';
    g.lineWidth = 9; g.beginPath(); g.moveTo(...hip); g.lineTo(...kA); g.lineTo(...fA); g.lineTo(fA[0] + 14, fA[1]); g.moveTo(...hip); g.lineTo(...kB); g.lineTo(...fB); g.lineTo(fB[0] + 14, fB[1]); g.stroke();
    g.lineWidth = 6; g.beginPath(); g.moveTo(...sh); g.lineTo(...eA); g.lineTo(...hA); g.moveTo(...sh); g.lineTo(...eB); g.lineTo(...hB); g.stroke();
    g.beginPath(); g.moveTo(HX - 12, y - 152); g.lineTo(HX + 18, y - 152); g.lineTo(HX + 12, y - 104); g.lineTo(HX + 30, y - 66); g.lineTo(HX - 28, y - 66); g.lineTo(HX - 8, y - 104); g.closePath(); g.fill();          // 胴とすそ
    g.beginPath(); g.moveTo(HX - 6, y - 150); g.lineTo(HX - 4, y - 166); g.lineTo(HX - 12, y - 176); g.lineTo(HX - 8, y - 196); g.lineTo(HX + 16, y - 196); g.lineTo(HX + 40, y - 178); g.lineTo(HX + 20, y - 174); g.lineTo(HX + 22, y - 166); g.lineTo(HX + 12, y - 160); g.lineTo(HX + 12, y - 150); g.closePath(); g.fill(); // 横顔
    g.beginPath(); for (let i = 0; i < 4; i++) { g.moveTo(HX - 10 + i * 8, y - 194); g.lineTo(HX - 8 + i * 8, y - 220 + i * 4); g.lineTo(HX - 2 + i * 8, y - 194); } g.fill();                                              // 冠
    for (const h of [hA, hB]) { g.beginPath(); g.arc(h[0], h[1], 6, 0, 7); g.fill(); } });
  // 飾りの穴
  g.fillStyle = HOLE; for (let i = 0; i < 4; i++) { g.beginPath(); g.arc(HX + 3, y - 142 + i * 10, 2.6, 0, 7); g.fill(); }
  g.beginPath(); g.moveTo(HX + 1, y - 96); g.lineTo(HX + 9, y - 84); g.lineTo(HX + 1, y - 72); g.lineTo(HX - 7, y - 84); g.fill(); for (const s of [-16, 18]) { g.beginPath(); g.arc(HX + s, y - 73, 2.4, 0, 7); g.fill(); }
  g.beginPath(); g.ellipse(HX + 12, y - 184, 4, 2, .3, 0, 7); g.fill();
  // 鳥の人形
  const bx = ((t * 90) % 1300) - 150, by = 150 + Math.sin(t * 1.4) * 30, wg = Math.sin(t * 10) * 26;
  g.strokeStyle = 'rgba(50,22,4,.5)'; g.lineWidth = 2; g.beginPath(); g.moveTo(bx, by); g.lineTo(bx - 10, LH); g.stroke();
  soft(4, 'rgba(30,12,3,.85)', () => { g.beginPath(); g.ellipse(bx, by, 26, 8, 0, 0, 7); g.fill(); g.beginPath(); g.moveTo(bx - 10, by); g.lineTo(bx - 4, by - 30 - wg); g.lineTo(bx + 12, by); g.fill(); g.beginPath(); g.moveTo(bx + 22, by - 3); g.lineTo(bx + 40, by); g.lineTo(bx + 22, by + 3); g.fill(); });
  // 上の幕と布目
  g.fillStyle = '#2a0f04'; g.beginPath(); g.moveTo(0, 0); g.lineTo(LW, 0); g.lineTo(LW, 34); for (let x = LW; x >= 0; x -= 60) g.quadraticCurveTo(x - 30, 70, x - 60, 34); g.fill();
  g.fillStyle = g.createPattern(weave, 'repeat'); g.fillRect(0, 0, LW, LH);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
