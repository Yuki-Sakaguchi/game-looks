<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 74 ホラー探索 ビデオテープ</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block}
#osd{position:fixed;left:50%;top:0;transform:translateX(-50%);width:min(100vw,133.33vh);height:100vh;pointer-events:none;font:700 26px/1 ui-monospace,Menlo,Consolas,monospace;color:#f4f4f4;letter-spacing:.12em;text-shadow:3px 0 0 rgba(255,40,40,.55),-3px 0 0 rgba(40,120,255,.55),0 0 8px rgba(255,255,255,.4)}
#osd span{position:absolute} #a{left:8%;top:9%} #b{right:8%;bottom:12%} #cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#ccc;opacity:.7}
</style>
<div id="osd"><span id="a">PLAY ▶</span><span id="b"></span></div>
<div id="cap">LOOK 74 ─ ホラー探索 / 古いビデオテープ　｜　見るだけ（廊下を歩く）</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 家庭用ビデオの映像にする。画面は 4:3。色は明るさよりずっと粗いので、赤と青を左右にずらして横ににじませる。
// 走査線ごとに左右へわずかにゆれ、ノイズの帯が下から上へゆっくり通り、いちばん下の数行はいつも乱れている。
// 黒は浮かせて、色はあせさせる
import * as THREE from 'three';
const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
const renderer = new THREE.WebGLRenderer({ antialias: false }); renderer.setPixelRatio(1); document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x020203); scene.fog = new THREE.Fog(0x020203, 4, 34);
const cam = new THREE.PerspectiveCamera(62, 1, .1, 80);
const wc = document.createElement('canvas'); wc.width = wc.height = 128; { const c = wc.getContext('2d'); c.fillStyle = '#b9a67c'; c.fillRect(0, 0, 128, 128); for (let x = 0; x < 128; x += 16) { c.fillStyle = '#a8946a'; c.fillRect(x, 0, 6, 128); } c.fillStyle = '#5a4630'; c.fillRect(0, 96, 128, 32); c.fillStyle = '#3c2e20'; c.fillRect(0, 92, 128, 5); }
const wt = new THREE.CanvasTexture(wc); wt.wrapS = wt.wrapT = THREE.RepeatWrapping; wt.repeat.set(40, 1); wt.colorSpace = THREE.SRGBColorSpace;
const mat = (o) => new THREE.MeshStandardMaterial({ roughness: .9, ...o });
const LEN = 144, wallM = mat({ map: wt });
for (const sx of [-1, 1]) { const w = new THREE.Mesh(new THREE.PlaneGeometry(LEN, 3), wallM); w.rotation.y = -sx * Math.PI / 2; w.position.set(sx * 1.6, 1.5, -LEN / 2 + 24); scene.add(w); }
const fl = new THREE.Mesh(new THREE.PlaneGeometry(3.2, LEN), mat({ color: '#5a2a26' })); fl.rotation.x = -Math.PI / 2; fl.position.z = -LEN / 2 + 24; scene.add(fl);
const ce = new THREE.Mesh(new THREE.PlaneGeometry(3.2, LEN), mat({ color: '#8d8a80' })); ce.rotation.x = Math.PI / 2; ce.position.set(0, 3, -LEN / 2 + 24); scene.add(ce);
const lamps = [];
for (let z = 24; z > -120; z -= 6) { const side = (Math.round(z / 6) % 2) ? 1 : -1; const d = new THREE.Mesh(new THREE.BoxGeometry(.08, 2.2, 1), mat({ color: '#2e2219' })); d.position.set(side * 1.56, 1.1, z); scene.add(d); const k = new THREE.Mesh(new THREE.SphereGeometry(.05, 6, 6), new THREE.MeshBasicMaterial({ color: 0xc9a84a })); k.position.set(side * 1.5, 1.05, z + .36); scene.add(k);
  if (Math.round(z / 6) % 2 === 0) { const l = new THREE.Mesh(new THREE.BoxGeometry(.5, .06, .5), new THREE.MeshBasicMaterial({ color: 0xfff2c8 })); l.position.set(0, 2.96, z + 3); scene.add(l); lamps.push(l); } }
scene.add(new THREE.AmbientLight(0x554a44, .5));
const L = [0, 1, 2].map(() => { const p = new THREE.PointLight(0xffe2a8, 9, 13, 1.6); scene.add(p); return p; });
const fig = new THREE.Group(); { const m = new THREE.MeshBasicMaterial({ color: 0x000000, fog: false }); const b = new THREE.Mesh(new THREE.BoxGeometry(.5, 1.5, .2), m); b.position.y = .95; const h = new THREE.Mesh(new THREE.SphereGeometry(.2, 8, 8), m); h.position.y = 1.95; const a1 = new THREE.Mesh(new THREE.BoxGeometry(.12, 1.3, .12), m); a1.position.set(-.34, .95, 0); const a2 = a1.clone(); a2.position.x = .34; fig.add(b, h, a1, a2); scene.add(fig); }
const rt = new THREE.WebGLRenderTarget(4, 4);
const post = new THREE.ShaderMaterial({ uniforms: { tD: { value: rt.texture }, time: { value: 0 }, res: { value: new THREE.Vector2() } }, vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}', fragmentShader: `
uniform sampler2D tD;uniform float time;uniform vec2 res;varying vec2 vUv;
float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
void main(){
  float w=min(1.,(4./3.)/(res.x/res.y)),x0=(1.-w)*.5;
  if(vUv.x<x0||vUv.x>1.-x0){gl_FragColor=vec4(0.,0.,0.,1.);return;}
  vec2 p=vec2((vUv.x-x0)/w,vUv.y);float line=floor(p.y*240.);
  float wob=(h(vec2(line,floor(time*30.)))-.5)*.003+sin(p.y*16.+time*3.)*.0014;
  float band=fract(time*.11),inb=smoothstep(.03,0.,abs(p.y-band));
  wob+=inb*(h(vec2(line,floor(time*60.)))-.5)*.07;
  float bot=smoothstep(.035,0.,p.y);wob+=bot*(.04+.03*sin(time*40.+line*.7));
  p.x+=wob;vec2 s=vec2(x0+clamp(p.x,0.,1.)*w,p.y);
  vec3 c;c.g=texture2D(tD,s).g;float r=0.,b=0.;
  for(int i=0;i<5;i++){float k=(.004+float(i)*.003)*w;r+=texture2D(tD,s+vec2(k,0.)).r;b+=texture2D(tD,s-vec2(k,0.)).b;}
  c.r=r/5.;c.b=b/5.;c=pow(max(c,0.),vec3(1./2.2));
  float l=dot(c,vec3(.3,.59,.11));c=mix(vec3(l),c,.85);c=c*.86+.075;
  c+=(h(p*res+fract(time)*97.)-.5)*.11;
  c+=(inb+bot)*step(.55,h(vec2(line*3.+floor(p.x*30.),floor(time*60.))))*.3;
  c*=.9+.1*sin(p.y*240.*6.2832);
  gl_FragColor=vec4(c,1.);
}` });
const ps = new THREE.Scene(); ps.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post)); const pc = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const resize = () => { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); const s = Math.min(1, 520 / h); rt.setSize(Math.round(w * s), Math.round(h * s)); post.uniforms.res.value.set(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); }; addEventListener('resize', resize); resize();
const osdB = document.getElementById('b'), osdA = document.getElementById('a');
let last = performance.now(), t = 0;
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt;
  const z = -((t * 1.5) % 24); cam.position.set(Math.sin(t * 2.8) * .06, 1.55 + Math.abs(Math.sin(t * 2.8)) * .05, z); cam.rotation.set(Math.sin(t * .7) * .03, Math.sin(t * .4) * .12, Math.sin(t * 2.8) * .008);
  const near = lamps.filter(l => l.position.z < z + 4).sort((a, b) => b.position.z - a.position.z).slice(0, 3);
  near.forEach((l, i) => { const fk = (i === 1 && hash(Math.floor(t * 14), 3) > .55) ? .08 : 1; L[i].position.set(0, 2.7, l.position.z); L[i].intensity = 9 * fk; l.material.color.setScalar(fk); });
  const show = (t % 11) > 7.5 && (t % 11) < 9.2; fig.visible = show; fig.position.set(.3, 0, z - 17);
  renderer.setRenderTarget(rt); renderer.render(scene, cam); renderer.setRenderTarget(null);
  post.uniforms.time.value = t; renderer.render(ps, pc);
  const s = Math.floor(t) + 807; osdB.textContent = 'SP  0:' + String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); osdA.style.opacity = (t % 1.4) < 1 ? 1 : 0;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
