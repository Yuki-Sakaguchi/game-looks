<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 73 ドライブ ぬり絵</title>
<style>
html,body{margin:0;height:100%;background:#fdfbf4;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#333;background:#fdfbf4;padding:0 6px}
</style>
<div id="cap">LOOK 73 ─ ドライブ / ぬり絵　｜　見るだけ（車が通ると、まわりに色がつく）</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 世界ははじめ、白い紙に黒い線だけのぬり絵。車のまわりの丸い範囲だけ色がつき、車といっしょに動く。
// 色はクレヨン風に、斜めの塗りむらと細かい塗り残しを入れる。色の境目はわざと波打たせる。
// 線は、形を少しふくらませた黒い裏面（外側の太い線）と、角の線（内側の細い線）の 2 つで出す
import * as THREE from 'three';
const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color().setStyle('#fdfbf4', THREE.LinearSRGBColorSpace);
const cam = new THREE.PerspectiveCamera(48, 1, .1, 300);
const resize = () => { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }; addEventListener('resize', resize); resize();
const U = { car: { value: new THREE.Vector3() }, rad: { value: 19 } };
const crayon = col => new THREE.ShaderMaterial({ uniforms: { uC: { value: new THREE.Color().setStyle(col, THREE.LinearSRGBColorSpace) }, car: U.car, rad: U.rad },
  vertexShader: 'varying vec3 wp;varying vec3 nn;void main(){vec4 w=modelMatrix*vec4(position,1.);wp=w.xyz;nn=normalize(mat3(modelMatrix)*normal);gl_Position=projectionMatrix*viewMatrix*w;}',
  fragmentShader: `uniform vec3 uC,car;uniform float rad;varying vec3 wp;varying vec3 nn;
float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
void main(){
  float d=distance(wp.xz,car.xz)+sin(wp.x*1.3+wp.y)*1.6+sin(wp.z*1.9+wp.y*2.)*1.4;
  float m=smoothstep(rad,rad-.6,d);
  float sh=.74+.26*max(0.,dot(normalize(nn),normalize(vec3(.4,.8,.3))));
  float st=.84+.16*sin((gl_FragCoord.x+gl_FragCoord.y)*.55+sin(gl_FragCoord.y*.05)*3.);
  float sp=step(.9,h(floor(gl_FragCoord.xy*.5)));
  vec3 col=mix(uC*sh*st,vec3(1.),sp*.5+.06);
  gl_FragColor=vec4(mix(vec3(.992,.984,.957),col,m),1.);
}` });
const INK = new THREE.MeshBasicMaterial({ color: 0x1c1c1c, side: THREE.BackSide }), LINE = new THREE.LineBasicMaterial({ color: 0x1c1c1c });
function piece(geo, col, x, y, z, parent = scene, fat = .07) {
  const gp = new THREE.Group(); gp.position.set(x, y, z); gp.add(new THREE.Mesh(geo, crayon(col)));
  geo.computeBoundingSphere(); const hull = new THREE.Mesh(geo, INK); hull.scale.setScalar(1 + fat / Math.max(.4, geo.boundingSphere.radius)); gp.add(hull);
  gp.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), LINE)); parent.add(gp); return gp;
}
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 600), crayon('#9ed36a')); ground.rotation.x = -Math.PI / 2; scene.add(ground);
const road = new THREE.Mesh(new THREE.PlaneGeometry(9, 600), crayon('#b7b2c0')); road.rotation.x = -Math.PI / 2; road.position.y = .02; scene.add(road);
for (const sx of [-4.5, 4.5]) { const l = new THREE.Mesh(new THREE.PlaneGeometry(.14, 600), new THREE.MeshBasicMaterial({ color: 0x1c1c1c })); l.rotation.x = -Math.PI / 2; l.position.set(sx, .03, 0); scene.add(l); }
const SPAN = 168, things = [];
const PAL = ['#ff8a7a', '#7ac8ff', '#ffd35a', '#c79aff', '#8fe0a0', '#ffab5e'];
for (let i = 0; i < 12; i++) { const side = i % 2 ? 1 : -1, z = -i * 14, gp = new THREE.Group(); gp.position.set(side * (11 + hash(i, 1) * 5), 0, z); gp.rotation.y = (hash(i, 2) - .5) * .5; scene.add(gp); things.push(gp);
  if (i % 3 !== 2) { const w = 3.6 + hash(i, 3) * 1.6, hh = 2.6 + hash(i, 4) * 1.4; piece(new THREE.BoxGeometry(w, hh, 3.6), PAL[i % 6], 0, hh / 2, 0, gp); const rf = piece(new THREE.ConeGeometry(w * .86, 2, 4), '#e0503c', 0, hh + 1, 0, gp); rf.rotation.y = Math.PI / 4; piece(new THREE.BoxGeometry(.9, 1.5, .2), '#9a6a3c', -side * 0 + .6, .75, 1.85, gp, .04); piece(new THREE.BoxGeometry(.9, .9, .2), '#bfe9ff', -.9, 1.7, 1.85, gp, .04); }
  else { piece(new THREE.CylinderGeometry(.3, .4, 2.2, 7), '#a8703c', 0, 1.1, 0, gp); piece(new THREE.IcosahedronGeometry(1.9, 0), '#57b85a', 0, 3.4, 0, gp); piece(new THREE.CylinderGeometry(.25, .3, 1.6, 7), '#a8703c', side * 4, .8, 3, gp); piece(new THREE.ConeGeometry(1.3, 3.2, 7), '#3fa06a', side * 4, 3, 3, gp); } }
for (let i = 0; i < 24; i++) { const d = new THREE.Group(); d.position.set(0, 0, -i * 7); piece(new THREE.BoxGeometry(.3, .06, 2.4), '#ffd84a', 0, .06, 0, d, .03); scene.add(d); things.push(d); }
for (let i = 0; i < 7; i++) { const c = new THREE.Group(); c.position.set((hash(i, 7) - .5) * 70, 14 + hash(i, 8) * 6, -i * 24); for (let k = 0; k < 3; k++) piece(new THREE.IcosahedronGeometry(2 + hash(i, k) * 1.4, 1), '#cfe8ff', (k - 1) * 2.6, hash(k, i) * .8, 0, c, .12); scene.add(c); things.push(c); }
const car = new THREE.Group(); scene.add(car);
piece(new THREE.BoxGeometry(2.2, .8, 4.2), '#e8483c', 0, .9, 0, car); piece(new THREE.BoxGeometry(1.8, .75, 2.1), '#ffe9c8', 0, 1.65, .2, car); for (const [x, z] of [[-1.1, 1.3], [1.1, 1.3], [-1.1, -1.3], [1.1, -1.3]]) { const w = piece(new THREE.CylinderGeometry(.48, .48, .4, 12), '#4a4a55', x, .48, z, car, .05); w.rotation.z = Math.PI / 2; }
let last = performance.now(), t = 0;
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt;
  const z = -t * 13; car.position.set(Math.sin(t * .5) * 1.6, Math.abs(Math.sin(t * 17)) * .04, z); car.rotation.y = -Math.cos(t * .5) * .06;
  for (const th of things) if (th.position.z > z + 26) th.position.z -= SPAN;
  ground.position.z = road.position.z = z; U.car.value.copy(car.position); U.rad.value = 19 + Math.sin(t * .8) * 2;
  cam.position.set(Math.sin(t * .2) * 4, 9.5, z + 19); cam.lookAt(0, 1.5, z - 12);
  renderer.render(scene, cam); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
