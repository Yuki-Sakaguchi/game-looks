<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 44 山歩き 等高線の地形図</title>
<style>
html,body{margin:0;height:100%;background:#f3eedd;overflow:hidden}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#5a3a1a;background:#f3eedd;padding:0 6px}
</style>
<canvas id="gl"></canvas><canvas id="ui"></canvas>
<div id="cap">LOOK 44 ─ 山歩き・探索 / 等高線の地形図　｜　見るだけ（地図の上を歩く）</div>
<script>
// 世界を紙の地形図として見せる。高さの数式から、等高線（細い茶色）、5 本ごとの太い計曲線、
// 低地は緑・高地は白っぽい段彩、北西から光を当てた陰影、海は水色と等深線、青い方眼を画素ごとに描く。
// 歩いた道は赤い破線で残す
const glc = document.getElementById('gl'), ui = document.getElementById('ui'), u = ui.getContext('2d');
const gl = glc.getContext('webgl'); gl.getExtension('OES_standard_derivatives');
const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; };
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, `#extension GL_OES_standard_derivatives : enable
precision highp float;uniform vec2 res,off;uniform float zoom;
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
float H(vec2 p){float a=.5,s=0.;for(int i=0;i<6;i++){s+=a*vn(p);p=p*2.03+7.1;a*=.5;}return s;}
float line(float v,float w){float f=abs(fract(v-.5)-.5)/fwidth(v);return 1.-smoothstep(w-.5,w+.5,f);}
void main(){
  vec2 w=(gl_FragCoord.xy-.5*res)/res.y*zoom+off;
  float h=H(w),e=.004;vec2 g=vec2(H(w+vec2(e,0.))-h,H(w+vec2(0.,e))-h)/e;
  float sea=.42,lv=(h-sea)*60.;
  vec3 c;
  if(h<sea){c=mix(vec3(.72,.86,.93),vec3(.52,.72,.88),smoothstep(0.,.12,sea-h));c=mix(c,vec3(.3,.5,.75),line(lv*.5,.6)*.5);}
  else{
    float k=(h-sea)/.45;
    c=mix(vec3(.80,.88,.68),vec3(.95,.90,.74),smoothstep(0.,.35,k));c=mix(c,vec3(.93,.86,.78),smoothstep(.35,.7,k));c=mix(c,vec3(.99,.98,.96),smoothstep(.7,1.,k));
    c*=1.+clamp(dot(g,vec2(-.7,.7))*.16,-.22,.16);
    vec3 brown=vec3(.55,.33,.16);
    c=mix(c,brown,line(lv,.55)*.7);c=mix(c,brown,line(lv/5.,1.1)*.85);
    c=mix(c,vec3(.2,.35,.6),smoothstep(1.2,0.,abs(h-sea)/fwidth(h))*.9);
  }
  vec2 gr=w*4.;c=mix(c,vec3(.25,.45,.8),max(line(gr.x,.4),line(gr.y,.4))*.22);
  c*=.97+.03*h21(floor(gl_FragCoord.xy*.5));
  gl_FragColor=vec4(c,1.);
}`));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);
let W, Hh, S;
function resize() { S = Math.min(devicePixelRatio || 1, 2); W = innerWidth; Hh = innerHeight; glc.width = ui.width = W * S; glc.height = ui.height = Hh * S; gl.viewport(0, 0, glc.width, glc.height); gl.uniform2f(U('res'), glc.width, glc.height); }
addEventListener('resize', resize); resize();

const ZOOM = 1.5, path = t => [t * .045 + Math.sin(t * .11) * .25, 3.2 + Math.sin(t * .07) * .5 + Math.cos(t * .19) * .12];
const toScreen = (p, c) => [W / 2 + (p[0] - c[0]) / ZOOM * Hh, Hh / 2 - (p[1] - c[1]) / ZOOM * Hh];
let t = 40, last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt;
  const c = path(t);
  gl.uniform2f(U('off'), c[0], c[1]); gl.uniform1f(U('zoom'), ZOOM); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  u.setTransform(S, 0, 0, S, 0, 0); u.clearRect(0, 0, W, Hh);
  // 歩いた道（赤い破線）と、休んだ所の印
  u.strokeStyle = '#d8281e'; u.lineWidth = 2.5; u.setLineDash([9, 6]); u.lineJoin = 'round'; u.beginPath();
  for (let k = 0; k <= 60; k++) { const p = toScreen(path(t - k * .6), c); k ? u.lineTo(p[0], p[1]) : u.moveTo(p[0], p[1]); } u.stroke(); u.setLineDash([]);
  for (let k = Math.floor(t / 9); k > Math.floor(t / 9) - 4; k--) { const p = toScreen(path(k * 9), c); u.fillStyle = '#fff'; u.strokeStyle = '#2a2a2a'; u.lineWidth = 1.5; u.beginPath(); u.moveTo(p[0], p[1] - 10); u.lineTo(p[0] + 10, p[1] + 7); u.lineTo(p[0] - 10, p[1] + 7); u.closePath(); u.fill(); u.stroke(); u.fillStyle = '#2a2a2a'; u.font = '11px "Helvetica Neue",Arial,sans-serif'; u.textAlign = 'center'; u.fillText('C' + k, p[0], p[1] + 20); }
  u.fillStyle = '#d8281e'; u.strokeStyle = '#fff'; u.lineWidth = 3; u.beginPath(); u.arc(W / 2, Hh / 2, 8 + Math.sin(t * 6), 0, 7); u.fill(); u.stroke();
  // 方位記号と縮尺
  u.strokeStyle = u.fillStyle = '#2a2a2a'; u.lineWidth = 1.5; const nx = W - 60, ny = 70;
  u.beginPath(); u.moveTo(nx, ny + 26); u.lineTo(nx, ny - 26); u.stroke(); u.beginPath(); u.moveTo(nx, ny - 34); u.lineTo(nx - 8, ny - 14); u.lineTo(nx, ny - 20); u.closePath(); u.fill();
  u.font = '700 14px "Helvetica Neue",Arial,sans-serif'; u.textAlign = 'center'; u.fillText('N', nx, ny - 40);
  const bar = Hh / ZOOM * .25; u.fillRect(W - 40 - bar, Hh - 44, bar / 2, 5); u.strokeRect(W - 40 - bar, Hh - 44, bar, 5);
  u.font = '11px "Helvetica Neue",Arial,sans-serif'; u.fillText('0', W - 40 - bar, Hh - 50); u.fillText('500 m', W - 40, Hh - 50); u.textAlign = 'right'; u.fillText('1:25 000　等高線間隔 10 m', W - 40, Hh - 22);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
