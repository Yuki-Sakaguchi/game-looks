<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 95 屋上ランナー ローポリの夕焼け</title>
<style>
html,body{margin:0;height:100%;background:#2a1640;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#ffd9a8;opacity:.85}
</style>
<div id="cap">LOOK 95 ─ 屋上ランナー / ローポリの夕焼けと逆光　｜　見るだけ（屋上から屋上へ跳ぶ）</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 光は 2 つだけ。奥の低い夕日からの強いだいだいの光（逆光）と、空からの弱い青紫の光。
// だから建物も人も、こちら側の面は青紫に沈み、上と太陽側の面だけがだいだいに光る（ふちが光る見え方）。
// 空は上から藍・赤紫・だいだいのグラデーション。遠い街ほど霧の桃色にとけ、窓あかりだけが黄色く残る
import * as THREE from 'three';
const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.fog = new THREE.Fog('#e8707a', 30, 170);
const skyC = document.createElement('canvas'); skyC.width = 4; skyC.height = 256; { const c = skyC.getContext('2d'), gr = c.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, '#1c1a4a'); gr.addColorStop(.35, '#6a2a6e'); gr.addColorStop(.6, '#e0506a'); gr.addColorStop(.78, '#ff9a4a'); gr.addColorStop(1, '#ffd27a'); c.fillStyle = gr; c.fillRect(0, 0, 4, 256); }
const skyT = new THREE.CanvasTexture(skyC); skyT.colorSpace = THREE.SRGBColorSpace; scene.background = skyT;
const cam = new THREE.PerspectiveCamera(42, 1, .1, 400);
const resize = () => { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }; addEventListener('resize', resize); resize();
scene.add(new THREE.HemisphereLight(0x8a7af0, 0x3a2460, 2.4));
const sun = new THREE.DirectionalLight(0xff9a40, 4.2); scene.add(sun, sun.target);
const sunDisc = new THREE.Mesh(new THREE.CircleGeometry(26, 40), new THREE.MeshBasicMaterial({ color: 0xfff0c0, fog: false })); scene.add(sunDisc);
// 窓あかりの模様
const wc = document.createElement('canvas'); wc.width = 64; wc.height = 128; { const c = wc.getContext('2d'); c.fillStyle = '#000'; c.fillRect(0, 0, 64, 128); for (let y = 6; y < 128; y += 12) for (let x = 5; x < 64; x += 10) if (Math.random() < .4) { c.fillStyle = Math.random() < .7 ? '#ffd27a' : '#ff9a5a'; c.fillRect(x, y, 5, 6); } }
const wt = new THREE.CanvasTexture(wc); wt.colorSpace = THREE.SRGBColorSpace; wt.magFilter = THREE.NearestFilter;
const bm = c => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: .9, emissive: 0xffffff, emissiveMap: wt, emissiveIntensity: .9 });
const BM = ['#7a6ab0', '#6a5fa0', '#8a6aa8', '#5f5a98'].map(c => { const m = bm(c), r = new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: .9 }); return [m, m, r, r, m, m]; }), plain = c => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: .9 });
const SP = 13, W = 10, roofH = i => 14 + Math.round(hash(i, 1) * 5 - 2) * 1.2;
const slots = [...Array(12)].map(() => { const gp = new THREE.Group(), body = new THREE.Mesh(new THREE.BoxGeometry(W, 60, 12), BM[0]); const tank = new THREE.Group(), tk = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 1.8, 7), plain('#7a5a6a')), cap = new THREE.Mesh(new THREE.ConeGeometry(1.3, .8, 7), plain('#6a4a5a')); tk.position.y = 1.9; cap.position.y = 3.2; const legs = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1, 1.6), plain('#3a2a4a')); legs.position.y = .5; tank.add(tk, cap, legs);
  const vent = new THREE.Mesh(new THREE.BoxGeometry(2, .9, 1.4), plain('#6a5a8a')), ant = new THREE.Mesh(new THREE.CylinderGeometry(.05, .05, 5, 4), plain('#2a1a3a')); gp.add(body, tank, vent, ant); scene.add(gp); return { gp, body, tank, vent, ant, i: null }; });
// 遠くの街
const far = []; for (let r = 0; r < 3; r++) for (let k = 0; k < 26; k++) { const h = 14 + hash(k, r + 5) * 40, m = new THREE.Mesh(new THREE.BoxGeometry(6 + hash(k, r) * 7, h, 8), bm(['#4a3f7a', '#5a3f78', '#6a4578'][r])); m.userData = { ox: k * 13 + hash(k, r + 9) * 5, z: -22 - r * 24, h, sp: 338 }; scene.add(m); far.push(m); }
// 走る人
const man = new THREE.Group(), skin = plain('#ffd0a0'), cloth = plain('#f24a5a'), dark = plain('#2a2040');
const part = (w, h, d, m, y) => { const p = new THREE.Group(), b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.y = -h / 2; p.add(b); p.position.y = y; man.add(p); return p; };
const torso = new THREE.Mesh(new THREE.BoxGeometry(.5, .75, .34), cloth); torso.position.y = 1.3; const head = new THREE.Mesh(new THREE.IcosahedronGeometry(.24, 0), skin); head.position.y = 1.95; man.add(torso, head);
const lL = part(.2, .85, .2, dark, .95), lR = part(.2, .85, .2, dark, .95), aL = part(.15, .65, .15, cloth, 1.62), aR = part(.15, .65, .15, cloth, 1.62); lL.position.z = .13; lR.position.z = -.13; aL.position.z = .32; aR.position.z = -.32;
const scarf = new THREE.Mesh(new THREE.BoxGeometry(1, .12, .08), new THREE.MeshBasicMaterial({ color: '#ffe26a' })); scarf.position.set(-.6, 1.72, 0); man.add(scarf); man.scale.setScalar(1.5); scene.add(man);
let last = performance.now(), t = 0, camY = 20;
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt;
  const x = t * 9, bi = Math.round(x / SP), lx = x - bi * SP, half = W / 2 - .9; let y, air = 0;
  if (Math.abs(lx) <= half) y = roofH(bi); else { const a = lx > 0 ? bi : bi - 1, f = ((lx > 0 ? lx - half : lx + SP - half)) / (SP - half * 2); y = roofH(a) + (roofH(a + 1) - roofH(a)) * f + Math.sin(f * Math.PI) * 2.6; air = 1; }
  man.position.set(x, y, 0); const ph = t * 13, sw = air ? .9 : Math.sin(ph) * 1.1; lL.rotation.z = sw; lR.rotation.z = -sw; aL.rotation.z = -sw * .9; aR.rotation.z = sw * .9; man.rotation.z = -.16; torso.position.y = 1.3 + (air ? 0 : Math.abs(Math.sin(ph)) * .05); scarf.rotation.z = Math.sin(t * 16) * .2; scarf.rotation.y = Math.sin(t * 11) * .2;
  const base = Math.floor(x / SP) - 4; slots.forEach((s, k) => { const i = base + k; if (s.i !== i) { s.i = i; const h = roofH(i); s.gp.position.set(i * SP, 0, 0); s.body.material = BM[((i % 4) + 4) % 4]; s.body.position.set(0, h - 30, 0); s.body.scale.z = 1 + hash(i, 2) * .5; s.tank.visible = hash(i, 3) > .55; s.tank.position.set(2.6, h, -3.4); s.vent.visible = hash(i, 4) > .4; s.vent.position.set(-2.8, h + .45, -3); s.ant.visible = hash(i, 5) > .6; s.ant.position.set(-3.6, h + 2.5, -4.6); } });
  for (const m of far) { const u = m.userData, fx = x * (1 - 6 / (6 - u.z * .08)); m.position.set(x - 169 + ((((u.ox - x * .0) - (x - 169)) % u.sp) + u.sp) % u.sp, u.h / 2 - 16, u.z); }
  camY += (roofH(bi) + 6 - camY) * Math.min(1, dt * 3); cam.position.set(x - 3, camY, 22); cam.lookAt(x + 4, camY - 4.6, 0);
  sunDisc.position.set(x - 60, 4, -260); sun.position.set(x - 70, 26, -46); sun.target.position.set(x, 12, 0);
  renderer.render(scene, cam); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
