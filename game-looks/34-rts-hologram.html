<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 34 宇宙RTS ホログラム作戦卓</title>
<style>
html,body{margin:0;height:100%;background:#02060c;overflow:hidden}
canvas{width:100vw;height:100vh;display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#6fe8ff;opacity:.8}
</style>
<canvas id="c"></canvas>
<div id="cap">LOOK 34 ─ 宇宙RTS / ホログラムの作戦卓　｜　見るだけ（自動で戦う）</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// 暗い部屋の卓の上に浮かぶ立体映像。面は半透明で、下から上へ流れる横じまが入り、全部を加算で重ねる（重なるほど明るい）。
// 稜線は明るい線、全体が細かくちらつき、ときどき映像が横にずれる。味方は水色、敵は橙
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x02060c);
const cam = new THREE.PerspectiveCamera(42, 1, .1, 100);
const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
const CYAN = new THREE.Color(0x4fe0ff), ORANGE = new THREE.Color(0xff8a3a);
const time = { value: 0 };
const holoMat = (color, alpha) => new THREE.ShaderMaterial({
  uniforms: { time, color: { value: color }, alpha: { value: alpha } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: `varying vec3 wp;void main(){vec4 w=modelMatrix*vec4(position,1.);wp=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
  fragmentShader: `uniform float time,alpha;uniform vec3 color;varying vec3 wp;
    void main(){float sl=.45+.55*step(.5,fract(wp.y*16.-time*1.4));float fl=.88+.12*sin(time*43.+wp.y*3.);gl_FragColor=vec4(color*sl*fl,alpha);}`
});
const lineMat = c => new THREE.LineBasicMaterial({ color: c, transparent: true, opacity: .9, blending: THREE.AdditiveBlending, depthWrite: false });
const holo = new THREE.Group(); scene.add(holo);
function solid(geo, color, alpha = .22, parent = holo) { const g = new THREE.Group(); g.add(new THREE.Mesh(geo, holoMat(color, alpha)), new THREE.LineSegments(new THREE.EdgesGeometry(geo), lineMat(color))); parent.add(g); return g; }

// 卓と投影の光
const table = new THREE.Mesh(new THREE.CylinderGeometry(7.4, 7.8, .5, 48), new THREE.MeshBasicMaterial({ color: 0x0a1420 })); table.position.y = -.9; scene.add(table);
const ring = new THREE.Mesh(new THREE.TorusGeometry(7.2, .05, 6, 80), new THREE.MeshBasicMaterial({ color: 0x4fe0ff })); ring.rotation.x = Math.PI / 2; ring.position.y = -.62; scene.add(ring);
const beam = new THREE.Mesh(new THREE.CylinderGeometry(7, 6.4, 5, 48, 1, true), new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: `varying float h;void main(){h=uv.y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader: `varying float h;void main(){gl_FragColor=vec4(.3,.88,1.,.11*(1.-h)*(1.-h));}`
})); beam.position.y = 1.85; scene.add(beam);

// 地形（線の網）
{
  const g = new THREE.PlaneGeometry(12, 12, 26, 26); g.rotateX(-Math.PI / 2); const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i), r = Math.hypot(x, z); p.setY(i, (Math.sin(x * .9) * Math.cos(z * .8) * .55 + Math.sin(x * .4 + z * .5) * .4) * Math.max(0, 1 - r / 6.4) - .3); }
  const net = new THREE.LineSegments(new THREE.WireframeGeometry(g), lineMat(0x4fe0ff)); net.material.opacity = .28; holo.add(net);
  holo.add(new THREE.Mesh(g, holoMat(CYAN, .06)));
}
// 惑星と基地
const planet = solid(new THREE.IcosahedronGeometry(1.1, 1), CYAN, .14); planet.position.set(-3.2, 2.6, -2.4);
const base = solid(new THREE.CylinderGeometry(.5, .8, 1, 6), CYAN, .25); base.position.set(-3.6, .5, 2.6);
const eBase = solid(new THREE.OctahedronGeometry(.9, 0), ORANGE, .25); eBase.position.set(3.8, 1.2, -2.8);
// 部隊
const shipG = new THREE.ConeGeometry(.16, .5, 4); shipG.rotateX(Math.PI / 2);
const unit = (color, home, i) => { const u = solid(shipG, color, .4); u.userData = { home, ph: i * 1.3, r: 1 + hash(i, 3) * 1.6 }; return u; };
const friends = [...Array(9)].map((_, i) => unit(CYAN, new THREE.Vector3(-1.5, 1.6, 1), i));
const foes = [...Array(7)].map((_, i) => unit(ORANGE, new THREE.Vector3(2, 1.9, -1.2), i + 20));
// 選択の輪と射線
const sel = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([...Array(32)].map((_, i) => new THREE.Vector3(Math.cos(i / 32 * 6.283) * .4, 0, Math.sin(i / 32 * 6.283) * .4))), lineMat(0xffffff)); holo.add(sel);
const range = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([...Array(64)].map((_, i) => new THREE.Vector3(Math.cos(i / 64 * 6.283) * 2.6, 0, Math.sin(i / 64 * 6.283) * 2.6))), lineMat(0x4fe0ff)); range.material.opacity = .35; range.position.copy(base.position).setY(.05); holo.add(range);
const shotG = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
const shots = [0, 1, 2].map(() => { const l = new THREE.Line(shotG.clone(), lineMat(0xffffff)); l.visible = false; holo.add(l); return l; });

function resize() { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

let t = 0, last = performance.now(), glitch = 0, nextGlitch = 3;
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt; time.value = t;
  const move = (u, k) => {
    const d = u.userData, a = t * .5 * k + d.ph, p = u.position, px = p.x, pz = p.z;
    p.set(d.home.x + Math.cos(a) * d.r + Math.sin(t * .2) * 1.2 * k, d.home.y + Math.sin(a * 1.7) * .4, d.home.z + Math.sin(a) * d.r);
    u.rotation.y = Math.atan2(p.x - px, p.z - pz) + Math.PI;
  };
  friends.forEach(u => move(u, 1)); foes.forEach(u => move(u, -1));
  planet.rotation.y = t * .2; eBase.rotation.y = -t * .5; range.scale.setScalar(1 + .04 * Math.sin(t * 3));
  sel.position.copy(friends[Math.floor(t / 2.5) % friends.length].position); sel.rotation.y = t * 2;
  shots.forEach((s, i) => {
    const on = (t * 2.2 + i * .37) % 1 < .16; s.visible = on;
    if (on) { const a = friends[(Math.floor(t * 2.2) + i * 3) % friends.length], b = foes[(Math.floor(t * 2.2) + i * 2) % foes.length]; s.geometry.setFromPoints(i % 2 ? [b.position, a.position] : [a.position, b.position]); s.material.color.set(i % 2 ? 0xff8a3a : 0x9ff0ff); }
  });
  // 映像の乱れ
  if (t > nextGlitch) { glitch = .12; nextGlitch = t + 2 + Math.random() * 4; }
  glitch = Math.max(0, glitch - dt); holo.position.x = glitch > 0 ? (Math.random() - .5) * .3 : 0; holo.scale.y = glitch > 0 ? 1 + (Math.random() - .5) * .08 : 1;
  cam.position.set(Math.sin(t * .1) * 14, 8.5, Math.cos(t * .1) * 14); cam.lookAt(0, .9, 0);
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
