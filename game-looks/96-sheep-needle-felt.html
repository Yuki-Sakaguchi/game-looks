<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 96 羊追い 羊毛フェルト</title>
<style>
html,body{margin:0;height:100%;background:#5d8a4a;overflow:hidden;display:grid;place-items:center}
canvas{width:min(100vw,160vh);aspect-ratio:8/5;display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#fff;opacity:.85}
</style>
<canvas id="c"></canvas>
<div id="cap">LOOK 96 ─ 羊追い / 羊毛フェルト　｜　見るだけ（犬が羊をさくへ追いこむ）</div>
<script>
// すべてを羊毛フェルトの手芸にする。形のふちは線で閉じず、短い毛を何百本も外へ向けて生やして、けばだたせる。
// 色は毛 1 本ごとに少しずつ変える。地面も、いろいろな緑の短い毛を敷きつめたフェルトの板。
// 目は黒いビーズ（白い点の映りこみ）、さくは白い糸のぬい目つきのフェルトの帯。下にやわらかい影を置く
const LW = 960, LH = 600, S = Math.min(devicePixelRatio || 1, 2);
const cv = document.getElementById('c'); cv.width = LW * S; cv.height = LH * S; const g = cv.getContext('2d');
const rnd = (a, b) => a + Math.random() * (b - a);
const shadeCol = (rgb, k) => `rgb(${rgb.map(v => Math.max(0, Math.min(255, Math.round(v * k)))).join(',')})`;
function fuzz(rx, ry, rgb, fibres = 520) {             // けばだった楕円のスプライト
  const pad = 14, c = document.createElement('canvas'); c.width = (rx * 2 + pad * 2) * S; c.height = (ry * 2 + pad * 2) * S; const q = c.getContext('2d'); q.setTransform(S, 0, 0, S, 0, 0); q.translate(rx + pad, ry + pad);
  const gr = q.createRadialGradient(-rx * .3, -ry * .35, 2, 0, 0, Math.max(rx, ry)); gr.addColorStop(0, shadeCol(rgb, 1.08)); gr.addColorStop(1, shadeCol(rgb, .82)); q.fillStyle = gr; q.beginPath(); q.ellipse(0, 0, rx, ry, 0, 0, 7); q.fill();
  q.lineCap = 'round'; for (let i = 0; i < fibres; i++) { const a = rnd(0, 6.283), d = Math.sqrt(Math.random()), x = Math.cos(a) * rx * d, y = Math.sin(a) * ry * d, fa = a + rnd(-1.2, 1.2), l = rnd(3, 9) * (d > .8 ? 1.3 : 1); q.strokeStyle = shadeCol(rgb, rnd(.78, 1.14)); q.globalAlpha = rnd(.4, .9); q.lineWidth = rnd(.5, 1.2); q.beginPath(); q.moveTo(x, y); q.quadraticCurveTo(x + Math.cos(fa) * l * .5 + rnd(-2, 2), y + Math.sin(fa) * l * .5 + rnd(-2, 2), x + Math.cos(fa) * l, y + Math.sin(fa) * l); q.stroke(); }
  return { c, w: rx * 2 + pad * 2, h: ry * 2 + pad * 2 };
}
const put = (s, x, y, rot = 0, sx = 1) => { g.save(); g.translate(x, y); g.rotate(rot); g.scale(sx, 1); g.drawImage(s.c, -s.w / 2, -s.h / 2, s.w, s.h); g.restore(); };
const bead = (x, y, r) => { g.fillStyle = '#17120f'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(x - r * .3, y - r * .35, r * .32, 0, 7); g.fill(); };
// 地面
const ground = document.createElement('canvas'); ground.width = LW; ground.height = LH; { const q = ground.getContext('2d'); q.fillStyle = '#6a9a52'; q.fillRect(0, 0, LW, LH); q.lineCap = 'round'; for (let i = 0; i < 16000; i++) { const x = rnd(0, LW), y = rnd(0, LH), a = rnd(0, 6.283), l = rnd(3, 11), v = rnd(.8, 1.2), path = Math.abs(y - (300 + Math.sin(x * .008) * 70)) < 34; q.strokeStyle = path ? shadeCol([196, 170, 120], v) : shadeCol([104, 152, 80], v); q.globalAlpha = rnd(.3, .8); q.lineWidth = rnd(.5, 1.3); q.beginPath(); q.moveTo(x, y); q.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); q.stroke(); } }
const SP = { body: fuzz(24, 19, [246, 240, 226], 700), head: fuzz(10, 9, [70, 58, 54], 200), dog: fuzz(22, 13, [176, 112, 60], 420), dhead: fuzz(11, 10, [150, 92, 46], 220), ear: fuzz(5, 7, [90, 56, 30], 80), bush: fuzz(34, 26, [70, 124, 62], 600), fl: [fuzz(5, 5, [240, 110, 120], 60), fuzz(5, 5, [250, 210, 90], 60), fuzz(5, 5, [250, 250, 245], 60)], post: fuzz(7, 22, [150, 104, 66], 200), cloud: fuzz(40, 16, [255, 255, 255], 500) };
const PEN = { x: 770, y: 300, r: 96 };
const sheep = [...Array(11)].map(() => ({ x: rnd(120, 520), y: rnd(120, 480), vx: 0, vy: 0, ph: rnd(0, 6), in: 0 })), dog = { x: 80, y: 300, a: 0 }, deco = [...Array(26)].map(() => ({ x: rnd(20, 940), y: rnd(20, 580), k: Math.floor(rnd(0, 3)) })), bushes = [[90, 70], [300, 540], [560, 60], [900, 540], [60, 520]];
let last = performance.now(), t = 0, hold = 0;
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt;
  // 犬：さくから一番遠い羊の「向こう側」へ回りこむ
  const out = sheep.filter(s => !s.in); let far = null, fd = -1; for (const s of out) { const d = Math.hypot(s.x - PEN.x, s.y - PEN.y); if (d > fd) { fd = d; far = s; } }
  if (far) { const ux = (far.x - PEN.x) / fd, uy = (far.y - PEN.y) / fd, tx = far.x + ux * 60, ty = far.y + uy * 60, dx = tx - dog.x, dy = ty - dog.y, dd = Math.hypot(dx, dy) || 1, sp = Math.min(190, dd * 3); dog.x += dx / dd * sp * dt; dog.y += dy / dd * sp * dt; if (dd > 4) dog.a = Math.atan2(dy, dx); hold = 0; }
  else if ((hold += dt) > 3) { for (const s of sheep) { s.in = 0; s.x = rnd(120, 520); s.y = rnd(120, 480); } dog.x = 80; dog.y = 300; }
  for (const s of sheep) { let ax = 0, ay = 0; const dx = s.x - dog.x, dy = s.y - dog.y, d = Math.hypot(dx, dy) || 1; if (d < 150 && !s.in) { ax += dx / d * (150 - d) * 6; ay += dy / d * (150 - d) * 6; }
    for (const o of sheep) if (o !== s) { const ex = s.x - o.x, ey = s.y - o.y, e = Math.hypot(ex, ey) || 1; if (e < 44) { ax += ex / e * (44 - e) * 10; ay += ey / e * (44 - e) * 10; } }
    const px = PEN.x - s.x, py = PEN.y - s.y, pd = Math.hypot(px, py); if (pd < PEN.r - 14) s.in = 1; if (s.in && pd > PEN.r - 30) { ax += px / pd * 300; ay += py / pd * 300; } if (!s.in && pd < PEN.r + 26 && Math.abs(Math.atan2(-py, -px)) < 2.5) { ax -= px / pd * 240; ay -= py / pd * 240; ax -= 60; }
    s.vx = (s.vx + ax * dt) * (1 - 3 * dt); s.vy = (s.vy + ay * dt) * (1 - 3 * dt); s.x = Math.max(40, Math.min(920, s.x + s.vx * dt)); s.y = Math.max(50, Math.min(550, s.y + s.vy * dt)); s.ph += Math.hypot(s.vx, s.vy) * dt * .12; }
  g.setTransform(S, 0, 0, S, 0, 0); g.drawImage(ground, 0, 0);
  for (const d of deco) put(SP.fl[d.k], d.x, d.y);
  // さく（左側が開いている）
  const posts = []; for (let i = 0; i < 15; i++) { const a = -2.4 + i / 14 * 4.8; posts.push([PEN.x + Math.cos(a) * PEN.r, PEN.y + Math.sin(a) * PEN.r]); }
  g.lineCap = 'round'; for (const off of [-8, 6]) { g.strokeStyle = '#b98a5a'; g.lineWidth = 7; g.beginPath(); posts.forEach(([x, y], i) => i ? g.lineTo(x, y + off) : g.moveTo(x, y + off)); g.stroke(); g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 1.3; g.setLineDash([5, 5]); g.stroke(); g.setLineDash([]); }
  // 上から下の順に重ねる
  const items = [...sheep.map(s => ({ y: s.y, s })), { y: dog.y, dog: 1 }, ...bushes.map(b => ({ y: b[1], b })), ...posts.map(p => ({ y: p[1] + 10, p }))].sort((a, b) => a.y - b.y);
  for (const it of items) {
    if (it.p) { put(SP.post, it.p[0], it.p[1] - 8); continue; }
    if (it.b) { g.fillStyle = 'rgba(30,50,20,.25)'; g.beginPath(); g.ellipse(it.b[0] + 6, it.b[1] + 22, 36, 10, 0, 0, 7); g.fill(); put(SP.bush, it.b[0], it.b[1]); put(SP.fl[0], it.b[0] - 12, it.b[1] - 6); put(SP.fl[1], it.b[0] + 14, it.b[1] + 4); continue; }
    if (it.dog) { const face = Math.cos(dog.a) < 0 ? -1 : 1, bob = Math.abs(Math.sin(t * 14)) * 3; g.fillStyle = 'rgba(30,50,20,.28)'; g.beginPath(); g.ellipse(dog.x + 4, dog.y + 16, 24, 7, 0, 0, 7); g.fill(); put(SP.ear, dog.x - face * 24, dog.y - 6 - bob, face * -.9); put(SP.dog, dog.x, dog.y - bob); put(SP.dhead, dog.x + face * 22, dog.y - 9 - bob); put(SP.ear, dog.x + face * 16, dog.y - 20 - bob, face * .5); bead(dog.x + face * 26, dog.y - 11 - bob, 2.4); bead(dog.x + face * 33, dog.y - 6 - bob, 3); continue; }
    const s = it.s, face = s.vx < -4 ? -1 : 1, bob = Math.abs(Math.sin(s.ph)) * 3;
    g.fillStyle = 'rgba(30,50,20,.28)'; g.beginPath(); g.ellipse(s.x + 4, s.y + 20, 26, 8, 0, 0, 7); g.fill();
    g.strokeStyle = '#463a36'; g.lineWidth = 5; g.beginPath(); for (const lx of [-12, -4, 6, 13]) { g.moveTo(s.x + lx, s.y + 10); g.lineTo(s.x + lx + Math.sin(s.ph + lx) * 3, s.y + 22); } g.stroke();
    put(SP.body, s.x, s.y - bob); put(SP.head, s.x + face * 22, s.y - 4 - bob); bead(s.x + face * 25, s.y - 6 - bob, 2.2);
  }
  put(SP.cloud, ((t * 14) % 1200) - 100, 60); g.globalAlpha = .12; g.fillStyle = '#1e3214'; g.beginPath(); g.ellipse(((t * 14) % 1200) - 60, 130, 60, 16, 0, 0, 7); g.fill(); g.globalAlpha = 1;
  g.fillStyle = '#fff'; g.font = '700 16px "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif'; g.textAlign = 'right'; g.fillText('さくの中  ' + sheep.filter(s => s.in).length + ' / ' + sheep.length, LW - 24, 34);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
