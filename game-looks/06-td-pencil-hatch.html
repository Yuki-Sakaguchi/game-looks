<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 06 タワーディフェンス 色鉛筆</title>
<style>
html,body{margin:0;height:100%;background:#f6f1e3;overflow:hidden}
canvas{width:100vw;height:100vh;display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#3a3048}
</style>
<canvas id="c"></canvas>
<div id="cap">LOOK 06 ─ タワーディフェンス / 色鉛筆のハッチング　｜　見るだけ（自動で進む）</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// ふつうに塗ったローポリの箱庭を、最後に「紙＋色鉛筆」に描き直す
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8fcdf0);
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, .1, 100);
cam.position.set(12, 12, 12); cam.lookAt(0, 0, 0);
scene.add(new THREE.AmbientLight(0xffffff, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 2.6); sun.position.set(4, 10, -3); scene.add(sun);

const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
const lam = c => new THREE.MeshLambertMaterial({ color: c, flatShading: true });
const mesh = (geo, m, x = 0, y = 0, z = 0) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); return o; };
const GX = 12, GZ = 8, wx = gx => gx - 5.5, wz = gz => gz - 3.5;

// 道（マス目の座標）
const ROUTE = [[-1, 2], [3, 2], [3, 5], [7, 5], [7, 1], [10, 1], [10, 6], [12, 6]];
const isPath = new Set();
const segs = []; let total = 0;
for (let i = 0; i < ROUTE.length - 1; i++) {
  const [ax, az] = ROUTE[i], [bx, bz] = ROUTE[i + 1], len = Math.abs(bx - ax) + Math.abs(bz - az);
  for (let k = 0; k <= len; k++) isPath.add((ax + Math.sign(bx - ax) * k) + ',' + (az + Math.sign(bz - az) * k));
  segs.push({ ax, az, bx, bz, len, at: total }); total += len;
}
function posAt(d, out) {
  for (const s of segs) if (d <= s.at + s.len) {
    const f = (d - s.at) / s.len;
    return out.set(wx(s.ax + (s.bx - s.ax) * f), 0, wz(s.az + (s.bz - s.az) * f));
  }
  return out.set(wx(12), 0, wz(6));
}

// 島
const tileG = new THREE.BoxGeometry(1, .4, 1);
const grass = [lam(0x8cc152), lam(0x7ab648)], sand = lam(0xe8cf8f);
const TOWERS = [[1, 3], [4, 4], [6, 3], [8, 2], [9, 5], [5, 6]];
const towerAt = new Set(TOWERS.map(p => p.join(',')));
const treeG = new THREE.ConeGeometry(.3, .75, 5), trunkG = new THREE.CylinderGeometry(.06, .08, .25, 5);
for (let x = 0; x < GX; x++) for (let z = 0; z < GZ; z++) {
  const key = x + ',' + z, p = isPath.has(key);
  scene.add(mesh(tileG, p ? sand : grass[(x + z) % 2], wx(x), p ? -.26 : -.2, wz(z)));
  if (!p && !towerAt.has(key) && hash(x, z) > .72) {
    const ox = (hash(x, z + 9) - .5) * .4, oz = (hash(z, x + 3) - .5) * .4;
    scene.add(mesh(trunkG, lam(0x8a5a3a), wx(x) + ox, .12, wz(z) + oz), mesh(treeG, lam(0x3f8f4a), wx(x) + ox, .6, wz(z) + oz));
  }
}
scene.add(mesh(new THREE.BoxGeometry(GX + .4, 1, GZ + .4), lam(0x9a6b4a), 0, -.92, 0));
const sea = mesh(new THREE.PlaneGeometry(80, 80), lam(0xb4e0fa), 0, -1.2, 0); sea.rotation.x = -Math.PI / 2; scene.add(sea);

// 塔
const baseG = new THREE.CylinderGeometry(.3, .38, .8, 6), rimG = new THREE.CylinderGeometry(.4, .4, .16, 6), roofG = new THREE.ConeGeometry(.46, .55, 6);
const stone = lam(0xbdb6cc), roofs = [lam(0xe2574c), lam(0x4f7fd8), lam(0xf0b03a)];
const towers = TOWERS.map(([x, z], i) => {
  const g = new THREE.Group(); g.position.set(wx(x), 0, wz(z));
  g.add(mesh(baseG, stone, 0, .4, 0), mesh(rimG, stone, 0, .86, 0), mesh(roofG, roofs[i % 3], 0, 1.2, 0));
  scene.add(g); return { g, cd: i * .3 };
});

// 敵と弾
const enemyG = new THREE.IcosahedronGeometry(.24, 0), enemyM = [lam(0xb05cc8), lam(0xf07a3a)];
const enemies = [...Array(9)].map((_, i) => {
  const m = mesh(enemyG, enemyM[i % 2]); scene.add(m);
  return { m, d: 6 - i * 1.6, hp: 12, pop: 0, ph: i };
});
const shotG = new THREE.SphereGeometry(.1, 6, 4), shotM = new THREE.MeshBasicMaterial({ color: 0xffe066 });
const shots = [...Array(10)].map(() => { const m = mesh(shotG, shotM); m.visible = false; scene.add(m); return { m, a: 1, from: new THREE.Vector3(), e: null }; });

// 仕上げ: 色は薄い下塗りにし、暗い面ほど斜線を重ねる（1 段目は右上がり、2 段目は逆向き、3 段目で密に）。
// 色の境目を鉛筆の輪郭線にして、線全体を 1 秒に 6 回だけ揺らす
const rt = new THREE.WebGLRenderTarget(4, 4, { samples: 4 });
const post = new THREE.ShaderMaterial({
  uniforms: { t: { value: rt.texture }, res: { value: new THREE.Vector2() }, dpr: { value: 1 }, seed: { value: 0 } },
  vertexShader: `varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,
  fragmentShader: `
    uniform sampler2D t;uniform vec2 res;uniform float dpr,seed;varying vec2 vUv;
    float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
    float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
      return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
    vec3 S(vec2 uv){return pow(texture2D(t,uv).rgb,vec3(.4545));}
    float hatch(vec2 p,float dir,float off){
      float v=(p.x+dir*p.y)/7.+off+vn(p*.02+seed)*.6;
      return smoothstep(.22,.12,abs(fract(v)-.5))*smoothstep(.2,.45,vn(p*.11+seed*3.));}
    void main(){
      vec2 px=dpr/res,p=gl_FragCoord.xy/dpr;
      vec2 uv=vUv+(vec2(vn(p*.06+seed*7.),vn(p*.06+seed*7.+31.))-.5)*px*3.;
      vec3 c=S(uv);
      float e=length(c-S(uv+vec2(px.x*1.3,0.)))+length(c-S(uv+vec2(0.,px.y*1.3)));
      float d=1.-dot(c,vec3(.3,.59,.11));
      vec3 paper=vec3(.965,.945,.89);
      vec3 pen=mix(c/max(max(c.r,c.g),max(c.b,.001)),c,.5);
      vec3 o=mix(paper,pen,.3+.12*vn(p*.3));
      float ink=hatch(p,1.,0.)*smoothstep(.2,.36,d);
      ink=max(ink,hatch(p,-1.,.3)*smoothstep(.4,.55,d));
      ink=max(ink,hatch(p,1.,.5)*smoothstep(.6,.75,d));
      o=mix(o,pen*.5,ink*.85);
      o=mix(o,vec3(.2,.17,.26),smoothstep(.07,.2,e)*.9*(.7+.3*vn(p*.4+seed)));
      o*=.95+.05*vn(p*1.7);
      gl_FragColor=vec4(o,1.);
    }`
});
const ps = new THREE.Scene(); const pq = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post); pq.frustumCulled = false; ps.add(pq);
const pc = new THREE.Camera();

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  const s = renderer.getDrawingBufferSize(new THREE.Vector2());
  rt.setSize(s.x, s.y); post.uniforms.res.value.copy(s); post.uniforms.dpr.value = renderer.getPixelRatio();
  const a = innerWidth / innerHeight, h = Math.max(6.6, 8.2 / a);
  cam.left = -h * a; cam.right = h * a; cam.top = h; cam.bottom = -h; cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const v = new THREE.Vector3();
let t = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;

  for (const e of enemies) {
    e.d += 1.4 * dt; if (e.d > total) e.d = 0;
    e.pop = Math.max(0, e.pop - dt * 5);
    e.m.visible = e.d >= 0;
    posAt(Math.max(0, e.d), e.m.position);
    e.m.position.y = .25 + Math.abs(Math.sin(t * 7 + e.ph)) * .16;
    e.m.rotation.y += dt * 2; e.m.scale.setScalar(1 + e.pop * .7);
  }
  for (const tw of towers) {
    if ((tw.cd -= dt) > 0) continue;
    const target = enemies.find(e => e.d >= 0 && e.m.position.distanceTo(tw.g.position) < 2.7);
    const s = target && shots.find(s => s.a >= 1);
    if (!s) continue;
    tw.cd = 1.1; s.a = 0; s.e = target; s.from.copy(tw.g.position).setY(1.5); s.m.visible = true;
  }
  for (const s of shots) if (s.a < 1) {
    s.a += dt * 4;
    if (s.a >= 1) {
      s.m.visible = false; s.e.pop = 1;
      if (--s.e.hp <= 0) { s.e.hp = 12; s.e.d = -1 - Math.random() * 3; }
      continue;
    }
    s.m.position.copy(s.from).lerp(v.copy(s.e.m.position), s.a); s.m.position.y += Math.sin(s.a * Math.PI) * .8;
  }

  post.uniforms.seed.value = Math.floor(t * 6) % 97;
  renderer.setRenderTarget(rt); renderer.render(scene, cam);
  renderer.setRenderTarget(null); renderer.render(ps, pc);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
