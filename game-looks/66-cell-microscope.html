<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 66 細胞捕食 顕微鏡の視野</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;display:grid;place-items:center}
canvas{width:min(100vw,160vh);aspect-ratio:8/5;display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#bbb;opacity:.8}
</style>
<canvas id="c"></canvas>
<div id="cap">LOOK 66 ─ 細胞捕食 / 顕微鏡の視野　｜　見るだけ（小さい細胞を食べて、ふえる）</div>
<script>
// 明るい下からの光に、うすく染めた透明な細胞をのせる。色は乗算で重ねるので、重なった所ほど濃くなる。
// ふちには赤紫と緑のにじみ（レンズの色ずれ）を 1.5 ピクセルずらして引く。
// ピントの外にあるごみは、大きくてぼんやりした影として漂わせる。視野は丸く、外はまっ黒
const LW = 960, LH = 600, S = Math.min(devicePixelRatio || 1, 2), CX = 480, CY = 300, FR = 282;
const cv = document.getElementById('c'); cv.width = LW * S; cv.height = LH * S; const g = cv.getContext('2d');
const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
const rnd = (a, b) => a + Math.random() * (b - a);
const mk = edge => { const a = rnd(0, 6.283), d = edge ? FR + 30 : rnd(40, FR - 30); return { x: CX + Math.cos(a) * d, y: CY + Math.sin(a) * d, r: rnd(9, 24), vx: rnd(-8, 8), vy: rnd(-8, 8), id: Math.random() * 1000, hue: rnd(0, 1) }; };
let cells = [...Array(16)].map(() => mk(false)); const me = { x: CX, y: CY, r: 36, id: 7, vx: 0, vy: 0 };
const rods = [...Array(34)].map((_, i) => ({ x: CX + rnd(-FR, FR), y: CY + rnd(-FR, FR), a: rnd(0, 6.283) }));
const dust = [...Array(9)].map((_, i) => ({ x: rnd(200, 760), y: rnd(40, 560), r: rnd(40, 100), vx: rnd(-4, 4), vy: rnd(-3, 3) }));
function blob(c, t, big) {
  const pts = [], n = 28, sp = Math.hypot(c.vx, c.vy), ma = Math.atan2(c.vy, c.vx);
  for (let i = 0; i < n; i++) { const a = i / n * 6.283; let r = c.r * (1 + (big ? .1 : .05) * Math.sin(a * 3 + t * (big ? 1.6 : .8) + c.id) + (big ? .07 : .03) * Math.sin(a * 5 - t * 1.1 + c.id * 2)); if (big) r += Math.max(0, Math.cos(a - ma)) ** 3 * Math.min(14, sp * .35); pts.push([c.x + Math.cos(a) * r, c.y + Math.sin(a) * r]); }
  const path = (ox = 0) => { g.beginPath(); pts.forEach(([x, y], i) => { const [nx, ny] = pts[(i + 1) % n]; i ? 0 : g.moveTo((x + pts[n - 1][0]) / 2 + ox, (y + pts[n - 1][1]) / 2); g.quadraticCurveTo(x + ox, y, (x + nx) / 2 + ox, (y + ny) / 2); }); g.closePath(); };
  const col = big ? '120,90,190' : c.hue > .5 ? '110,140,200' : '170,110,180';
  const gr = g.createRadialGradient(c.x, c.y, c.r * .1, c.x, c.y, c.r * 1.1); gr.addColorStop(0, `rgba(${col},.16)`); gr.addColorStop(.8, `rgba(${col},.3)`); gr.addColorStop(1, `rgba(${col},.5)`);
  path(); g.fillStyle = gr; g.fill();
  g.lineWidth = 1.4; g.strokeStyle = 'rgba(255,40,140,.3)'; path(1.5); g.stroke(); g.strokeStyle = 'rgba(40,190,110,.3)'; path(-1.5); g.stroke(); g.strokeStyle = `rgba(${col},.75)`; path(); g.stroke();
  g.fillStyle = `rgba(70,40,120,${big ? .55 : .45})`; g.beginPath(); g.ellipse(c.x + Math.cos(c.id) * c.r * .2, c.y + Math.sin(c.id) * c.r * .2, c.r * .32, c.r * .26, c.id, 0, 7); g.fill();
  g.fillStyle = `rgba(${col},.5)`; for (let i = 0; i < (big ? 16 : 5); i++) { const a = hash(i, c.id) * 6.283 + t * .3, d = hash(i, c.id + 1) * c.r * .8; g.beginPath(); g.arc(c.x + Math.cos(a) * d, c.y + Math.sin(a) * d, 1 + hash(i, 3) * 1.6, 0, 7); g.fill(); }
}
let last = performance.now(), t = 0;
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt;
  // 動き
  let best = null, bd = 1e9; for (const c of cells) { c.x += (c.vx + Math.sin(t * 3 + c.id) * 6) * dt; c.y += (c.vy + Math.cos(t * 2.7 + c.id) * 6) * dt; const dc = Math.hypot(c.x - CX, c.y - CY); if (dc > FR + 40) Object.assign(c, mk(true), { vx: (CX - c.x) * .03, vy: (CY - c.y) * .03 });
    const d = Math.hypot(c.x - me.x, c.y - me.y); if (c.r < me.r * .8 && d < bd && dc < FR - 20) { bd = d; best = c; } if (d < me.r && c.r < me.r * .8) { c.r -= dt * 30; me.r += dt * 2.6; if (c.r < 3) Object.assign(c, mk(true)); } }
  if (best) { me.vx += ((best.x - me.x) / bd * 46 - me.vx) * dt * 2; me.vy += ((best.y - me.y) / bd * 46 - me.vy) * dt * 2; } me.x += me.vx * dt; me.y += me.vy * dt;
  if (me.r > 54) { me.r = 36; cells.push({ x: me.x + 30, y: me.y, r: 30, vx: 26, vy: -8, id: Math.random() * 1000, hue: .2 }); if (cells.length > 22) cells.shift(); }
  // 絵
  g.setTransform(S, 0, 0, S, 0, 0); g.globalCompositeOperation = 'source-over'; g.fillStyle = '#000'; g.fillRect(0, 0, LW, LH);
  g.save(); g.beginPath(); g.arc(CX, CY, FR + 4, 0, 7); g.clip();
  const bg = g.createRadialGradient(CX - 40, CY - 30, 20, CX, CY, FR); bg.addColorStop(0, '#fffbee'); bg.addColorStop(.7, '#f3ead2'); bg.addColorStop(1, '#d9cba6'); g.fillStyle = bg; g.fillRect(0, 0, LW, LH);
  g.globalCompositeOperation = 'multiply';
  for (const d of dust) { d.x += d.vx * dt; d.y += d.vy * dt; if (Math.hypot(d.x - CX, d.y - CY) > FR + d.r) { d.vx *= -1; d.vy *= -1; } const gr = g.createRadialGradient(d.x, d.y, d.r * .3, d.x, d.y, d.r); gr.addColorStop(0, 'rgba(150,130,100,.14)'); gr.addColorStop(.7, 'rgba(150,130,100,.1)'); gr.addColorStop(1, 'rgba(150,130,100,0)'); g.fillStyle = gr; g.beginPath(); g.arc(d.x, d.y, d.r, 0, 7); g.fill(); }
  g.strokeStyle = 'rgba(80,120,90,.55)'; g.lineWidth = 2.6; g.lineCap = 'round'; for (const r of rods) { r.x += rnd(-1, 1) * 40 * dt; r.y += rnd(-1, 1) * 40 * dt; r.a += rnd(-1, 1) * 3 * dt; g.beginPath(); g.moveTo(r.x - Math.cos(r.a) * 4, r.y - Math.sin(r.a) * 4); g.lineTo(r.x + Math.cos(r.a) * 4, r.y + Math.sin(r.a) * 4); g.stroke(); }
  for (const c of cells) blob(c, t, false); blob(me, t, true);
  g.globalCompositeOperation = 'source-over';
  // 目盛り線と縮尺
  g.strokeStyle = 'rgba(40,40,40,.28)'; g.lineWidth = 1; g.beginPath(); g.moveTo(CX - FR, CY); g.lineTo(CX + FR, CY); g.moveTo(CX, CY - FR); g.lineTo(CX, CY + FR); for (let i = -13; i <= 13; i++) { g.moveTo(CX + i * 20, CY - (i % 5 ? 3 : 7)); g.lineTo(CX + i * 20, CY + (i % 5 ? 3 : 7)); } g.stroke();
  g.fillStyle = 'rgba(30,30,30,.8)'; g.fillRect(CX + 90, CY + 190, 80, 2.5); g.fillRect(CX + 90, CY + 185, 2, 12); g.fillRect(CX + 168, CY + 185, 2, 12); g.font = '13px "Helvetica Neue",Arial,sans-serif'; g.textAlign = 'center'; g.fillText('50 µm', CX + 130, CY + 180);
  g.restore();
  const edge = g.createRadialGradient(CX, CY, FR - 26, CX, CY, FR + 5); edge.addColorStop(0, 'rgba(0,0,0,0)'); edge.addColorStop(.75, 'rgba(0,0,0,.6)'); edge.addColorStop(1, '#000'); g.fillStyle = edge; g.fillRect(0, 0, LW, LH);
  g.fillStyle = '#9a9a9a'; g.font = '12px ui-monospace,Menlo,Consolas,monospace'; g.textAlign = 'left'; g.fillText('400×  BRIGHT FIELD', 24, 34); g.fillText('CELLS ' + cells.length + '   SIZE ' + me.r.toFixed(0) + ' µm', 24, 54);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
