<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 20 ランナー コミック</title>
<style>
html,body{margin:0;height:100%;background:#fff;overflow:hidden}
canvas{position:fixed;inset:14px;width:calc(100vw - 38px);height:calc(100vh - 38px);display:block;border:5px solid #111}
#pow{position:fixed;left:54%;top:22%;font:900 72px Impact,"Arial Black","Hiragino Kaku Gothic StdN",sans-serif;color:#ffe94a;-webkit-text-stroke:3px #111;paint-order:stroke fill;text-shadow:5px 5px 0 #111;transform:rotate(-8deg) scale(0);transition:transform .12s cubic-bezier(.2,2,.5,1)}
#cap{position:fixed;left:30px;bottom:30px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#111;background:#fff;border:2px solid #111;padding:2px 8px}
</style>
<canvas id="c"></canvas>
<div id="pow"></div>
<div id="cap">LOOK 20 ─ 三人称ランナー / コミック　｜　見るだけ（自動で走って跳ぶ）</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// 漫画の印刷風: 陰影は 3 段のべた塗り、輪郭は黒い太線（ひと回り大きい黒い裏面を重ねる）、
// 暗い面には斜め 45 度の網点。空は黄色に網点のグラデーションと集中線。効果音の文字を跳ぶ瞬間に出す
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(55, 1, .1, 120);
scene.add(new THREE.AmbientLight(0xffffff, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 2.4); sun.position.set(3, 6, 4); scene.add(sun);

const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
const steps = new THREE.DataTexture(new Uint8Array([90, 90, 90, 255, 175, 175, 175, 255, 255, 255, 255, 255]), 3, 1); steps.minFilter = steps.magFilter = THREE.NearestFilter; steps.needsUpdate = true;
const toon = c => new THREE.MeshToonMaterial({ color: c, gradientMap: steps });
const INK = new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.BackSide });
function part(geo, color, x = 0, y = 0, z = 0, line = 1.08) {
  const o = new THREE.Mesh(geo, toon(color)); o.position.set(x, y, z);
  const h = new THREE.Mesh(geo, INK); h.scale.setScalar(line); o.add(h); return o;
}
const boxG = (w, h, d) => new THREE.BoxGeometry(w, h, d);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), toon(0x5a6088)); ground.rotation.x = -Math.PI / 2; scene.add(ground);
const WRAP = 60, scroll = [], COLORS = [0x35c6d8, 0xe84a9a, 0x7a5ae0, 0xf2f2f2];
for (let i = 0; i < 16; i++) for (const s of [-1, 1]) {
  const h = 3 + hash(i, s) * 7, w = 2.4 + hash(i, s + 3) * 1.6;
  const b = part(boxG(w, h, 3.2), COLORS[(i + (s > 0 ? 1 : 0)) % 4], s * (4.6 + hash(i, s + 5) * 2.5), h / 2, -WRAP + i * 3.75 + 6, 1.03); scene.add(b); scroll.push(b);
}
for (let i = 0; i < 15; i++) { const d = new THREE.Mesh(boxG(.25, .02, 1.6), new THREE.MeshBasicMaterial({ color: 0xffffff })); d.position.set(1.6, .01, -WRAP + i * 4 + 6); scene.add(d); scroll.push(d); }
const crates = [0, 1, 2, 3].map(i => { const c = part(boxG(1, 1, 1), 0xf08a2a, 0, .5, -14 - i * 15); scene.add(c); scroll.push(c); return c; });

// 主人公
const hero = new THREE.Group(); scene.add(hero);
hero.add(part(boxG(.5, .7, .35), 0x2a6fe8, 0, 1.15, 0), part(boxG(.4, .4, .4), 0xffd0a8, 0, 1.75, 0));
const limb = (c, w, h, x, y) => { const g = new THREE.Group(); g.position.set(x, y, 0); g.add(part(boxG(w, h, w), c, 0, -h / 2, 0)); hero.add(g); return g; };
const legL = limb(0x1a2a4a, .2, .8, -.14, .8), legR = limb(0x1a2a4a, .2, .8, .14, .8), armL = limb(0x2a6fe8, .16, .6, -.36, 1.45), armR = limb(0x2a6fe8, .16, .6, .36, 1.45);
const cape = new THREE.Group(); cape.position.set(0, 1.45, .2); cape.add(part(boxG(.6, .05, 1.1), 0xe8332a, 0, 0, .55, 1.06)); hero.add(cape);

const rt = new THREE.WebGLRenderTarget(4, 4, { samples: 4 });
const post = new THREE.ShaderMaterial({
  uniforms: { t: { value: rt.texture }, dpr: { value: 1 }, time: { value: 0 } },
  vertexShader: `varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,
  fragmentShader: `
    uniform sampler2D t;uniform float dpr,time;varying vec2 vUv;
    void main(){
      vec4 s=texture2D(t,vUv);vec3 c=pow(s.rgb,vec3(.4545));
      vec2 q=mat2(.707,-.707,.707,.707)*gl_FragCoord.xy/dpr/7.;float d=length(fract(q)-.5);
      if(s.a<.5){
        c=mix(vec3(1.,.87,.25),vec3(1.,.5,.18),step(d,(vUv.y-.42)*.9));
        vec2 v=vUv-vec2(.5,.42);float a=floor(atan(v.y,v.x)*36.);
        float ln=step(.9,fract(sin(a*91.7+floor(time*10.))*43758.5))*step(.22+.1*fract(sin(a*13.)*99.),length(v));
        c=mix(c,vec3(1.),ln);
      }else{
        float dark=1.-dot(c,vec3(.3,.59,.11));
        c=mix(c,c*.42,step(d,(dark-.4)*.95));
      }
      gl_FragColor=vec4(c,1.);
    }`
});
const ps = new THREE.Scene(); const pq = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post); pq.frustumCulled = false; ps.add(pq);
const pc = new THREE.Camera();
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false);
  const s = renderer.getDrawingBufferSize(new THREE.Vector2()); rt.setSize(s.x, s.y); post.uniforms.dpr.value = renderer.getPixelRatio();
  cam.aspect = w / h; cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const pow = document.getElementById('pow'), WORDS = ['ダッ!', 'ZOOM', 'ひょい!', 'JUMP!'];
const V = 9;
let t = 0, last = performance.now(), y = 0, vy = 0, powT = 0, wi = 0;
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt;
  for (const o of scroll) { o.position.z += V * dt; if (o.position.z > 6) o.position.z -= WRAP; }
  if (y === 0 && crates.some(c => c.position.z > -3.6 && c.position.z < -2.6)) { vy = 7.6; pow.textContent = WORDS[wi++ % 4]; pow.style.transform = 'rotate(-8deg) scale(1)'; powT = .55; }
  vy -= 18 * dt; y = Math.max(0, y + vy * dt); if (y === 0) vy = 0;
  if (powT > 0 && (powT -= dt) <= 0) pow.style.transform = 'rotate(-8deg) scale(0)';
  const air = y > 0, sw = air ? .9 : Math.sin(t * 13) * .9;
  legL.rotation.x = sw; legR.rotation.x = air ? -.5 : -sw; armL.rotation.x = -sw; armR.rotation.x = air ? -2.4 : sw;
  hero.position.y = y + (air ? 0 : Math.abs(Math.sin(t * 13)) * .06); hero.rotation.x = air ? -.15 : .12;
  cape.rotation.x = .25 + Math.sin(t * 16) * .12 - vy * .03;
  cam.position.set(2.3, 2.7 + y * .25, 5.2); cam.lookAt(0, 1.3 + y * .4, -3);
  post.uniforms.time.value = t;
  renderer.setRenderTarget(rt); renderer.render(scene, cam);
  renderer.setRenderTarget(null); renderer.render(ps, pc);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
