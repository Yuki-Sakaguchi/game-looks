<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 58 お店経営 レシートの感熱紙</title>
<style>
html,body{margin:0;height:100%;background:#1c1a1f;overflow:hidden;display:grid;place-items:center}
canvas{width:min(100vw,160vh);aspect-ratio:8/5;display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#cfc9d6;opacity:.8}
</style>
<canvas id="c"></canvas>
<div id="cap">LOOK 58 ─ お店経営 / レシートの感熱紙　｜　見るだけ（1 日の結果が印字されて出てくる）</div>
<script>
// 経営の結果を、画面ではなく「出てくるレシート」として見せる。字は紫がかった黒 1 色。
// 行ごとに濃さがむらになり、印字ヘッドの欠けた点が縦の白い筋になり、古い行ほどあせる。
// グラフも記号の文字で打つ。紙は上へ行くほど丸まって暗くなる
const LW = 960, LH = 600, S = Math.min(devicePixelRatio || 1, 2);
const cv = document.getElementById('c'); cv.width = LW * S; cv.height = LH * S; const g = cv.getContext('2d');
const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
const PX = 290, PW = 380, LHT = 23, SLOT = 508, COLS = 30, MONO = 'ui-monospace,Menlo,Consolas,"Courier New",monospace';
const ITEMS = ['COFFEE', 'TOAST SET', 'CURRY', 'PUDDING', 'SODA', 'SANDWICH', 'MILK TEA'];
const LOGO = ['..################..', '.##################.', '.#.#.#.#.#.#.#.#.##.', '.##################.', '..#..............#..', '..#.####..######.#..', '..#.#..#..#....#.#..', '..#.#..#..#....#.#..', '..#.#.##..######.#..', '..#.#..#.........#..', '..################..'];
const pad = (a, b) => a + ' '.repeat(Math.max(1, COLS - a.length - b.length)) + b, num = n => n.toLocaleString('en-US');
function day(d) {
  const L = [{ logo: 1 }, '', '', '', '', pad('KADO SHOP #58', 'DAY ' + String(d).padStart(3, '0')), '-'.repeat(COLS)]; let tot = 0;
  for (let i = 0; i < 5; i++) { const it = ITEMS[(d + i * 3) % 7], n = 3 + Math.floor(hash(d, i) * 22), pr = n * (180 + Math.floor(hash(i, 3) * 6) * 90); tot += pr; L.push(pad(it.padEnd(10) + ' x' + String(n).padStart(2), num(pr))); }
  const pc = Math.min(20, Math.round(tot / 2600));
  L.push('-'.repeat(COLS), pad('TOTAL', num(tot)), '', 'SALES  ' + '#'.repeat(pc) + '.'.repeat(20 - pc), 'GUESTS ' + 'o'.repeat(4 + Math.floor(hash(d, 9) * 16)), 'MOOD   ' + (hash(d, 8) > .4 ? ':-)  GOOD' : ':-|  SO-SO'));
  if (hash(d, 5) > .45) L.push('', '** LOW STOCK: ' + ITEMS[d % 7] + ' **');
  L.push('', { bar: d }, '', pad('THANK YOU', 'SEE YOU TOMORROW'), '', '- - - - - - - - - - - - - - -', '');
  return L;
}
let lines = [], d = 12; const need = n => { while (lines.length <= n) lines.push(...day(d++)); };
const start = performance.now();
function frame(now) {
  const t = (now - start) / 1000, n = Math.floor(t / .2), fr = (t / .2) % 1; need(n + 1);
  g.setTransform(S, 0, 0, S, 0, 0);
  const bgG = g.createLinearGradient(0, 0, 0, LH); bgG.addColorStop(0, '#2a2630'); bgG.addColorStop(1, '#151318'); g.fillStyle = bgG; g.fillRect(0, 0, LW, LH);
  g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(PX + 14, 0, PW, SLOT);
  g.fillStyle = '#f6f3ea'; g.fillRect(PX, 0, PW, SLOT);
  g.save(); g.beginPath(); g.rect(PX, 0, PW, SLOT); g.clip(); g.textBaseline = 'alphabetic'; g.font = `600 17px ${MONO}`;
  const cw = (PW - 40) / COLS;
  for (let k = 0; k < 26; k++) {
    const idx = n - k; if (idx < 0) break; const ln = lines[idx], y = SLOT - 6 - (k + fr) * LHT, a = (.62 + .38 * hash(idx, 1)) * (1 - k * .012);
    g.fillStyle = `rgba(44,36,58,${a})`;
    if (typeof ln === 'string') for (let i = 0; i < ln.length; i++) g.fillText(ln[i], PX + 20 + i * cw, y);
    else if (ln.logo) LOGO.forEach((row, r) => { for (let i = 0; i < row.length; i++) if (row[i] === '#') g.fillRect(PX + 20 + 120 + i * 5, y - 14 + r * 8, 5, 8); });   // 店の印（下の空き行にかぶせて打つ）
    else for (let i = 0, x = PX + 30; x < PX + PW - 30; i++) { const wd = 1.5 + Math.floor(hash(ln.bar, i) * 3) * 1.5; if (i % 2 === 0) g.fillRect(x, y - 18, wd, 20); x += wd; }
  }
  // 印字ヘッドの欠け（縦の白い筋）と、いま打っている行
  g.fillStyle = '#f6f3ea'; g.fillRect(PX + 131, 0, 1.6, SLOT); g.fillRect(PX + 262, 0, 1, SLOT); g.fillRect(PX + 20 + (PW - 40) * fr, SLOT - LHT * fr - 26, PW, 30);
  // 紙の丸まり
  const curl = g.createLinearGradient(0, 0, 0, 170); curl.addColorStop(0, 'rgba(60,50,70,.75)'); curl.addColorStop(.5, 'rgba(60,50,70,.15)'); curl.addColorStop(1, 'rgba(60,50,70,0)'); g.fillStyle = curl; g.fillRect(PX, 0, PW, 170);
  const side = g.createLinearGradient(PX, 0, PX + PW, 0); side.addColorStop(0, 'rgba(60,50,70,.18)'); side.addColorStop(.08, 'rgba(60,50,70,0)'); side.addColorStop(.92, 'rgba(60,50,70,0)'); side.addColorStop(1, 'rgba(60,50,70,.22)'); g.fillStyle = side; g.fillRect(PX, 0, PW, SLOT);
  g.restore();
  // 印字機
  const body = g.createLinearGradient(0, SLOT - 10, 0, LH); body.addColorStop(0, '#4a4652'); body.addColorStop(.12, '#2e2b34'); body.addColorStop(1, '#201e25'); g.fillStyle = body; g.beginPath(); g.roundRect(PX - 70, SLOT - 6, PW + 140, 140, 18); g.fill();
  g.fillStyle = '#0c0b0e'; g.fillRect(PX - 10, SLOT - 2, PW + 20, 7); g.fillStyle = '#6b6675'; for (let x = PX - 6; x < PX + PW + 6; x += 6) { g.beginPath(); g.moveTo(x, SLOT - 2); g.lineTo(x + 3, SLOT - 7); g.lineTo(x + 6, SLOT - 2); g.fill(); }
  g.fillStyle = Math.sin(t * 20) > 0 ? '#5dff8a' : '#2a7a44'; g.beginPath(); g.arc(PX + PW + 36, SLOT + 34, 5, 0, 7); g.fill(); g.fillStyle = '#8a8594'; g.font = `11px ${MONO}`; g.fillText('FEED', PX - 46, SLOT + 38);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
