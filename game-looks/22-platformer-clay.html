<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 22 パズルアクション 粘土のコマ撮り</title>
<style>
html,body{margin:0;height:100%;background:#f3d9b8;overflow:hidden}
canvas{width:100vw;height:100vh;display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#5a3a2a}
</style>
<canvas id="c"></canvas>
<div id="cap">LOOK 22 ─ 3Dパズルアクション / 粘土のコマ撮り　｜　見るだけ（自動で跳ぶ）</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// 油粘土の人形をコマ撮りしたように見せる: 角を丸めた形、表面に指あとの凹凸、つやの少ない材質とやわらかい影。
// 動きは 1 秒に 12 コマだけ進め、コマごとに表面のでこぼこを 3 通りで入れ替える（粘土が「わなわな」する）
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf3d9b8);
const cam = new THREE.PerspectiveCamera(36, 1, .1, 100); cam.position.set(0, 5.2, 15); cam.lookAt(0, 1.6, 0);
scene.add(new THREE.HemisphereLight(0xfff4e0, 0xd8a880, 1.5));
const key = new THREE.DirectionalLight(0xfff0d8, 2.4); key.position.set(-5, 9, 6); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 6;
Object.assign(key.shadow.camera, { left: -10, right: 10, top: 10, bottom: -6, near: 1, far: 30 }); scene.add(key);

const hash = (a, b = 0, c = 0) => { const n = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return n - Math.floor(n); };
// 指あとの凹凸
const fp = document.createElement('canvas'); fp.width = fp.height = 256;
{
  const x = fp.getContext('2d'); x.fillStyle = '#808080'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 26; i++) { const cx = Math.random() * 256, cy = Math.random() * 256; x.strokeStyle = `rgba(${i % 2 ? 255 : 0},${i % 2 ? 255 : 0},${i % 2 ? 255 : 0},.14)`; x.lineWidth = 1.5; for (let r = 4; r < 34; r += 4) { x.beginPath(); x.ellipse(cx, cy, r, r * .7, i, 0, 7); x.stroke(); } }
  for (let i = 0; i < 5000; i++) { const v = Math.random() < .5 ? 0 : 255; x.fillStyle = `rgba(${v},${v},${v},.1)`; x.fillRect(Math.random() * 256, Math.random() * 256, 2, 2); }
}
const bump = new THREE.CanvasTexture(fp); bump.wrapS = bump.wrapT = THREE.RepeatWrapping;
const clay = c => new THREE.MeshStandardMaterial({ color: c, roughness: .82, metalness: 0, bumpMap: bump, bumpScale: 1.6 });

// 角を丸めて、でこぼこ違いを 3 つ作る
function lumps(geo, r, box) {
  const p = geo.attributes.position, n = geo.attributes.normal, v = new THREE.Vector3(), q = new THREE.Vector3();
  if (box) for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i); q.set(Math.max(-box[0] / 2 + r, Math.min(box[0] / 2 - r, v.x)), Math.max(-box[1] / 2 + r, Math.min(box[1] / 2 - r, v.y)), Math.max(-box[2] / 2 + r, Math.min(box[2] / 2 - r, v.z)));
    v.sub(q); if (v.lengthSq() > 1e-8) { v.normalize(); n.setXYZ(i, v.x, v.y, v.z); p.setXYZ(i, q.x + v.x * r, q.y + v.y * r, q.z + v.z * r); }
  }
  return [0, 1, 2].map(k => {
    const g2 = geo.clone(), p2 = g2.attributes.position;
    for (let i = 0; i < p2.count; i++) {
      v.fromBufferAttribute(p2, i); q.fromBufferAttribute(n, i);
      const d = (hash(Math.round(v.x * 40), Math.round(v.y * 40), Math.round(v.z * 40) + k * 9) - .5) * .05 + Math.sin(v.x * 4 + k) * Math.sin(v.y * 5 + k * 2) * Math.sin(v.z * 4.5) * .035;
      p2.setXYZ(i, v.x + q.x * d, v.y + q.y * d, v.z + q.z * d);
    }
    return g2;
  });
}
const boil = [];
function add(variants, color, x, y, z, parent = scene) { const m = new THREE.Mesh(variants[0], clay(color)); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); boil.push({ m, variants }); return m; }
const rbox = (w, h, d, r = .25) => lumps(new THREE.BoxGeometry(w, h, d, 8, 6, 8), r, [w, h, d]);
const ball = (r, sx = 1, sy = 1, sz = 1) => { const g = new THREE.SphereGeometry(r, 20, 14); g.scale(sx, sy, sz); return lumps(g, 0, null); };

// 足場
const PLAT = [[-6, 0], [-3, 1], [0, .4], [3, 1.6], [6, 2.4]];
const top = rbox(2.2, .5, 2.2), soil = rbox(2, 1.4, 2, .35);
for (const [x, y] of PLAT) { add(soil, 0xb8734a, x, y - .9, 0); add(top, 0x8fcf5a, x, y - .1, 0); }
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 30), new THREE.MeshStandardMaterial({ color: 0xf3d9b8, roughness: 1 })); floor.rotation.x = -Math.PI / 2; floor.position.y = -2.2; floor.receiveShadow = true; scene.add(floor);
const cloudG = ball(.7, 1.5, .8, 1);
const clouds = [[-5, 5.5, -3], [2, 6.4, -4], [7, 5, -3]].map(([x, y, z]) => add(cloudG, 0xffffff, x, y, z));
// 旗と星
add(rbox(.14, 1.8, .14, .06), 0x8a5a3a, 6.7, 3.4, 0); add(rbox(.8, .5, .1, .05), 0xe8433a, 7.15, 4, 0);
const star = add(lumps(new THREE.OctahedronGeometry(.4, 1), 0, null), 0xffd040, 0, 2.6, 0);
// 主人公
const hero = new THREE.Group(); scene.add(hero);
add(ball(.55, 1, .92, 1), 0x4a8fe0, 0, .5, 0, hero);
for (const sx of [-.2, .2]) { add(ball(.13), 0xffffff, sx, .68, .44, hero); add(ball(.06), 0x222222, sx, .68, .55, hero); }
add(ball(.12, 1.6, .7, 1), 0xf08a3a, 0, .48, .52, hero);

function resize() { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const HOP = .5, REST = .34, CYCLE = HOP + REST;
let t = 0, last = performance.now(), step = -1;
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt;
  const s = Math.floor(t * 12);
  if (s !== step) {
    step = s; const tq = s / 12;   // コマ撮りの時間（1/12 秒きざみ）
    for (const b of boil) b.m.geometry = b.variants[(s + b.m.id) % 3];
    const total = CYCLE * (PLAT.length - 1) + 1.6, u = tq % total, i = Math.min(PLAT.length - 2, Math.floor(u / CYCLE)), f = Math.min(1, (u - i * CYCLE) / HOP);
    const done = u >= CYCLE * (PLAT.length - 1), a = done ? PLAT[PLAT.length - 1] : PLAT[i], b = done ? a : PLAT[i + 1];
    const k = done ? 1 : f;
    hero.position.set(a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k + (done ? Math.abs(Math.sin(u * 9)) * .5 : Math.sin(k * Math.PI) * 1.5) + .15, 0);
    const squash = !done && (f >= 1 || f < .12) ? .78 : 1; hero.scale.set(1 / squash, squash, 1 / squash); hero.rotation.y = done ? u * 6 : .5;
    star.visible = !(u > CYCLE * 2 - .2 && u < total - .3); star.rotation.y = tq * 3; star.position.y = 2.6 + Math.sin(tq * 3) * .15;
    clouds.forEach((c, n) => c.position.x = ((n * 6 + tq * .5 + 9) % 20) - 10);
    renderer.render(scene, cam);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
