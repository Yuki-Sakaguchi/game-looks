<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 29 ウォーキングシム 油絵</title>
<style>
html,body{margin:0;height:100%;background:#2a2420;overflow:hidden}
canvas{width:100vw;height:100vh;display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#fff;text-shadow:0 1px 2px #000}
</style>
<canvas id="c"></canvas>
<div id="cap">LOOK 29 ─ ウォーキングシム / 油絵の厚塗り　｜　見るだけ（丘を歩く）</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// ローポリの風景を半分の解像度で描き、各画素のまわり 4 方向の小窓のうち「色のばらつきが一番小さい窓」の平均色に置き換える。
// 細部がつぶれて筆で置いたような色の面になり、境目は残る。最後に色を濃くして、筆あとの凹凸の明暗を重ねる
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
const scene = new THREE.Scene();
const SKY = 0xf2c9a0; scene.background = new THREE.Color(SKY); scene.fog = new THREE.Fog(SKY, 30, 110);
const cam = new THREE.PerspectiveCamera(55, 1, .1, 300);
scene.add(new THREE.HemisphereLight(0xffe2c0, 0x3a5a7a, 1.3));
const sun = new THREE.DirectionalLight(0xffd090, 3); sun.position.set(-6, 5, -8); scene.add(sun);

const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
const lam = c => new THREE.MeshLambertMaterial({ color: c, flatShading: true });
const mesh = (geo, m, x = 0, y = 0, z = 0) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); return o; };
const TAU = Math.PI * 2, L = 100;
const sm = (a, b, x) => { x = Math.min(1, Math.max(0, (x - a) / (b - a))); return x * x * (3 - 2 * x); };
function hgt(x, zl) { const u = (zl + 50) / L * TAU; return sm(1.5, 9, Math.abs(x)) * (2.2 + 1.6 * Math.sin(u * 2 + x * .2) + 1.1 * Math.sin(u * 3 + x * .45 + 1) + .8 * Math.sin(x * .6 + u)) + sm(25, 70, Math.abs(x)) * 16; }
function chunk() {
  let g = new THREE.PlaneGeometry(220, L, 60, 30); g.rotateX(-Math.PI / 2);
  const p0 = g.attributes.position; for (let i = 0; i < p0.count; i++) p0.setY(i, hgt(p0.getX(i), p0.getZ(i)));
  g = g.toNonIndexed(); g.computeVertexNormals();
  const p = g.attributes.position, col = new Float32Array(p.count * 3), c = new THREE.Color();
  const PAL = [0x7fae3a, 0xb8c040, 0x4f8a3a, 0xd8b040, 0x3a7a5a].map(h => new THREE.Color(h)), PATH = new THREE.Color(0xd89a5a);
  for (let i = 0; i < p.count; i += 3) {
    const cx = (p.getX(i) + p.getX(i + 1) + p.getX(i + 2)) / 3;
    c.copy(Math.abs(cx) < 1.6 ? PATH : PAL[Math.floor(hash(i, 2) * 5)]).multiplyScalar(.85 + hash(i, 3) * .3);
    for (let k = 0; k < 3; k++) c.toArray(col, (i + k) * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }));
}
const chunks = [chunk(), chunk()]; chunks[0].position.z = -30; chunks[1].position.z = -130; scene.add(...chunks);
// 木（秋の色）と遠くの山、太陽
const scroll = [], LEAF = [0xe8662a, 0xf0a020, 0xc83a2a, 0x5a9a3a, 0xf0c838];
const crownG = new THREE.IcosahedronGeometry(1.5, 0), trunkG = new THREE.CylinderGeometry(.18, .26, 2.4, 5);
for (let i = 0; i < 90; i++) {
  const x = (i % 2 ? 1 : -1) * (3.5 + Math.pow(hash(i, 1), 1.4) * 34), z = -180 + hash(i, 2) * 200, s = .8 + hash(i, 3) * 1.2, g = new THREE.Group();
  g.add(mesh(trunkG, lam(0x5a3a2a), 0, 1.2, 0), mesh(crownG, lam(LEAF[i % 5]), 0, 3.2, 0), mesh(crownG, lam(LEAF[(i + 2) % 5]), .7, 2.6, .5));
  g.children[2].scale.setScalar(.7); g.scale.setScalar(s); g.rotation.y = i; g.position.set(x, hgt(x, z + 30) - .1, z); scene.add(g); scroll.push(g);
}
for (let i = 0; i < 9; i++) scene.add(mesh(new THREE.ConeGeometry(30 + hash(i, 5) * 20, 26 + hash(i, 6) * 22, 5), new THREE.MeshBasicMaterial({ color: i % 2 ? 0x8a7ab0 : 0x6a8ab8, fog: false }), -160 + i * 40, 8, -190));
scene.add(mesh(new THREE.SphereGeometry(14, 16, 10), new THREE.MeshBasicMaterial({ color: 0xfff0b0, fog: false }), -50, 46, -200));
// 歩く人
const hero = new THREE.Group(); scene.add(hero);
hero.add(mesh(new THREE.BoxGeometry(.5, .8, .3), lam(0xc8382e), 0, 1.2, 0), mesh(new THREE.BoxGeometry(.3, .3, .3), lam(0xf0c8a0), 0, 1.8, 0), mesh(new THREE.ConeGeometry(.42, .3, 8), lam(0xe8c070), 0, 2.05, 0));
const leg = x => { const g = new THREE.Group(); g.position.set(x, .8, 0); g.add(mesh(new THREE.BoxGeometry(.2, .8, .2), lam(0x2a3a5a), 0, -.4, 0)); hero.add(g); return g; };
const legL = leg(-.14), legR = leg(.14);

const rt = new THREE.WebGLRenderTarget(4, 4);
const post = new THREE.ShaderMaterial({
  uniforms: { t: { value: rt.texture }, px: { value: new THREE.Vector2() } },
  vertexShader: `varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,
  fragmentShader: `
    uniform sampler2D t;uniform vec2 px;varying vec2 vUv;
    float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
    void main(){
      vec3 best=vec3(0.);float bv=1e9;
      for(int q=0;q<4;q++){
        vec2 o=vec2(q==1||q==3?0.:-4.,q>1?0.:-4.);vec3 m=vec3(0.),s=vec3(0.);
        for(int j=0;j<=4;j++)for(int i=0;i<=4;i++){vec3 c=texture2D(t,vUv+(o+vec2(float(i),float(j)))*px).rgb;m+=c;s+=c*c;}
        m/=25.;s=abs(s/25.-m*m);float v=s.r+s.g+s.b;if(v<bv){bv=v;best=m;}
      }
      vec3 c=pow(best,vec3(.4545));
      c=mix(vec3(dot(c,vec3(.3,.59,.11))),c,1.45);
      vec2 p=gl_FragCoord.xy;float br=h21(floor(vec2(p.x*.5+p.y*.5,p.y-p.x)*.35))-.5;
      c*=1.+br*.12+ (h21(p)-.5)*.04;
      gl_FragColor=vec4(c,1.);
    }`
});
const ps = new THREE.Scene(); const pq = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post); pq.frustumCulled = false; ps.add(pq);
const pc = new THREE.Camera();
function resize() {
  const h = Math.min(innerHeight, 540), w = Math.round(h * innerWidth / innerHeight);
  renderer.setSize(w, h, false); rt.setSize(w, h); post.uniforms.px.value.set(1 / w, 1 / h); cam.aspect = w / h; cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const V = 3.2;
let t = 0, last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt;
  for (const c of chunks) { c.position.z += V * dt; if (c.position.z > 70) c.position.z -= 200; }
  for (const o of scroll) { o.position.z += V * dt; if (o.position.z > 20) o.position.z -= 200; }
  const sw = Math.sin(t * 5) * .6; legL.rotation.x = sw; legR.rotation.x = -sw; hero.position.y = Math.abs(Math.sin(t * 5)) * .05;
  cam.position.set(1.6 + Math.sin(t * .15) * .8, 3.2, 7); cam.lookAt(0, 2.2, -8);
  renderer.setRenderTarget(rt); renderer.render(scene, cam);
  renderer.setRenderTarget(null); renderer.render(ps, pc);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
