<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 08 フライト 文字の画面</title>
<style>
html,body{margin:0;height:100%;background:#061018;overflow:hidden}
canvas{width:100vw;height:100vh;display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#eaf6ff;background:#061018;padding:0 6px}
</style>
<canvas id="c"></canvas>
<div id="cap">LOOK 08 ─ フライト / 文字の画面　｜　マウスの左右で旋回（放っておくと自動）</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// ローポリの場面を「文字のマス目」の解像度で描き、1 マスを 1 文字に置き換える。
// 明るいマスほど黒い部分の多い文字、海だけは波の文字。文字色はその場所の色、背景は同じ色を暗くしたもの
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const SKY = 0x7fc8f0;
renderer.setClearColor(SKY, 0); scene.fog = new THREE.Fog(SKY, 40, 170);
const cam = new THREE.PerspectiveCamera(58, 1, .1, 400);
scene.add(new THREE.HemisphereLight(0xcfeaff, 0x2a5a8a, 1.5));
const sunL = new THREE.DirectionalLight(0xfff2d0, 2.6); sunL.position.set(-4, 10, 3); scene.add(sunL);

const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
const lam = c => new THREE.MeshLambertMaterial({ color: c, flatShading: true });
const mesh = (geo, m, x = 0, y = 0, z = 0) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); return o; };
const boxG = (w, h, d) => new THREE.BoxGeometry(w, h, d);

// 海（面ごとに濃淡を変えた青。10 ずつ流して繰り返す）
{
  let g = new THREE.PlaneGeometry(400, 400, 40, 40); g.rotateX(-Math.PI / 2); g = g.toNonIndexed();
  const n = g.attributes.position.count, col = new Float32Array(n * 3), a = new THREE.Color(0x1f6fc0), b = new THREE.Color(0x3fa0e0), c = new THREE.Color();
  for (let i = 0; i < n; i += 3) { c.copy(a).lerp(b, hash(i, 1)); for (let k = 0; k < 3; k++) c.toArray(col, (i + k) * 3); }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  var sea = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true })); sea.position.z = -100; scene.add(sea);
}
const sun = mesh(new THREE.SphereGeometry(12, 12, 8), new THREE.MeshBasicMaterial({ color: 0xfff6c0, fog: false }), -50, 55, -190); scene.add(sun);

// 島・雲・くぐる輪（世界と一緒に流れる）
const scroll = [];
const green = lam(0x4fae5a), sandM = lam(0xf0dc9a), snow = lam(0xffffff), cloudM = lam(0xffffff);
for (let i = 0; i < 12; i++) {
  const g = new THREE.Group(), r = 6 + hash(i, 1) * 8, h = 4 + hash(i, 2) * 9;
  g.add(mesh(new THREE.CylinderGeometry(r * 1.2, r * 1.3, .5, 9), sandM, 0, .25, 0), mesh(new THREE.ConeGeometry(r, h, 7), green, 0, h / 2 + .4, 0));
  if (h > 9) g.add(mesh(new THREE.ConeGeometry(r * .3, h * .3, 7), snow, 0, h * .86 + .4, 0));
  g.position.set((i % 2 ? 1 : -1) * (14 + hash(i, 3) * 55), 0, -230 + i * 20 + hash(i, 4) * 8); g.rotation.y = i;
  scene.add(g); scroll.push({ o: g, wrap: 240 });
}
for (let i = 0; i < 9; i++) {
  const g = new THREE.Group();
  for (let k = 0; k < 3; k++) g.add(mesh(boxG(5 + hash(i, k) * 5, 2 + hash(k, i) * 2, 4 + hash(i + k, 7) * 3), cloudM, (k - 1) * 4, hash(i, k + 3) * 1.5, hash(k, i + 5) * 2));
  g.position.set((hash(i, 8) - .5) * 150, 20 + hash(i, 9) * 12, -230 + i * 27); scene.add(g); scroll.push({ o: g, wrap: 243 });
}
const ringG = new THREE.TorusGeometry(2.4, .3, 6, 14), ringM = new THREE.MeshBasicMaterial({ color: 0xffd84a });
const rings = [...Array(5)].map((_, i) => {
  const o = mesh(ringG, ringM, Math.sin(i * 2.4) * 7, 8, -40 - i * 44); scene.add(o); scroll.push({ o, wrap: 220, ring: true }); return o;
});

// 自機
const plane = new THREE.Group(); scene.add(plane);
const red = lam(0xe8433a), white = lam(0xf6f6f0);
plane.add(mesh(boxG(.7, .7, 2.8), red), mesh(boxG(4.8, .12, 1), white, 0, .1, -.2), mesh(boxG(1.6, .1, .5), white, 0, .1, 1.2), mesh(boxG(.1, .8, .5), red, 0, .5, 1.2));
const prop = mesh(boxG(1.6, .1, .06), lam(0x222833), 0, 0, -1.45); plane.add(prop);
plane.position.y = 8;

// 文字の一覧（上の段: ふつうの面、下の段: 海）
const RAMP = [' .:-=+*#%@', ' .--~~~≈≈≈'], GW = 18, GH = 32;
const ac = document.createElement('canvas'); ac.width = GW * 10; ac.height = GH * 2;
{
  const a = ac.getContext('2d'); a.fillStyle = '#000'; a.fillRect(0, 0, ac.width, ac.height);
  a.fillStyle = '#fff'; a.font = `bold ${GH * .8}px Menlo,Consolas,monospace`; a.textAlign = 'center'; a.textBaseline = 'middle';
  RAMP.forEach((row, j) => [...row].forEach((ch, i) => a.fillText(ch, i * GW + GW / 2, j * GH + GH / 2)));
}
const atlas = new THREE.CanvasTexture(ac); atlas.minFilter = THREE.LinearFilter; atlas.generateMipmaps = false;

const rt = new THREE.WebGLRenderTarget(4, 4);
rt.texture.minFilter = rt.texture.magFilter = THREE.NearestFilter;
const post = new THREE.ShaderMaterial({
  uniforms: { t: { value: rt.texture }, atlas: { value: atlas }, grid: { value: new THREE.Vector2() }, cell: { value: new THREE.Vector2() } },
  vertexShader: `void main(){gl_Position=vec4(position.xy,0.,1.);}`,
  fragmentShader: `
    uniform sampler2D t,atlas;uniform vec2 grid,cell;
    void main(){
      vec2 id=floor(gl_FragCoord.xy/cell),f=fract(gl_FragCoord.xy/cell);
      vec4 s=texture2D(t,(id+.5)/grid);
      float sky=1.-step(.5,s.a);
      vec3 c=mix(pow(s.rgb,vec3(.4545)),vec3(.5,.78,.94)*mix(1.2,.8,id.y/grid.y),sky);
      float l=dot(c,vec3(.3,.59,.11));
      float water=(1.-sky)*step(c.r,.36)*step(c.g,c.b);
      float i=mix(floor(clamp(l*1.15,0.,.999)*10.),1.,sky);
      float m=texture2D(atlas,vec2((i+f.x)/10.,(1.-water+f.y)*.5)).r;
      vec3 fg=c/max(max(c.r,c.g),max(c.b,.001))*mix(.75,1.,l);
      gl_FragColor=vec4(mix(c*mix(.3,.6,sky),fg,m),1.);
    }`
});
const ps = new THREE.Scene(); const pq = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post); pq.frustumCulled = false; ps.add(pq);
const pc = new THREE.Camera();

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  const s = renderer.getDrawingBufferSize(new THREE.Vector2()), d = renderer.getPixelRatio();
  const cols = Math.max(8, Math.floor(s.x / (9 * d))), rows = Math.max(4, Math.floor(s.y / (16 * d)));
  rt.setSize(cols, rows); post.uniforms.grid.value.set(cols, rows); post.uniforms.cell.value.set(s.x / cols, s.y / rows);
  cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
let mx = 0, mouseT = -9;
addEventListener('pointermove', e => { mx = e.clientX / innerWidth * 2 - 1; mouseT = t; });

const V = 30;
let t = 0, last = performance.now(), vx = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
  sea.position.z += V * dt; if (sea.position.z > -90) sea.position.z -= 10;
  for (const s of scroll) {
    s.o.position.z += V * dt;
    if (s.o.position.z > 20) { s.o.position.z -= s.wrap; if (s.ring) s.o.position.x = (Math.random() - .5) * 16; }
    if (s.ring) s.o.rotation.z += dt;
  }
  // 次の輪に向かう
  let next = null; for (const r of rings) if (r.position.z < -2 && (!next || r.position.z > next.position.z)) next = r;
  const tx = t - mouseT < 2.5 ? mx * 10 : next ? next.position.x : 0;
  const px = plane.position.x;
  plane.position.x += (tx - px) * Math.min(1, dt * 1.6);
  vx += ((plane.position.x - px) / Math.max(dt, .001) - vx) * Math.min(1, dt * 5);
  plane.rotation.z = -vx * .1; plane.rotation.y = -vx * .03;
  plane.position.y = 8 + Math.sin(t * 1.3) * .4;
  prop.rotation.z += dt * 40;
  cam.position.set(plane.position.x * .6, 10.6, 9.5); cam.lookAt(plane.position.x * .8, 7.4, -10);

  renderer.setRenderTarget(rt); renderer.render(scene, cam);
  renderer.setRenderTarget(null); renderer.render(ps, pc);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
