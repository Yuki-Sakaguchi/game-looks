<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 40 見下ろし戦車 スプライト重ね</title>
<style>
html,body{margin:0;height:100%;background:#1c2a1c;overflow:hidden;display:grid;place-items:center}
canvas{width:min(100vw,160vh);aspect-ratio:8/5;display:block;image-rendering:pixelated}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#e8f0d8;background:#1c2a1c;padding:0 6px}
</style>
<canvas id="c"></canvas>
<div id="cap">LOOK 40 ─ 見下ろし戦車アクション / ドット絵の輪切り重ね　｜　見るだけ（自動で走る）</div>
<script>
// 立体に見えるが、3D は使っていない。物を水平に輪切りにしたドット絵を何枚も用意し、
// 1 枚ごとに 1 画素ずつ上にずらして、同じ角度に回して重ねる。視点が回ると、重なりがずれて厚みに見える
const LW = 320, LH = 200;
const cv = document.getElementById('c'); cv.width = LW; cv.height = LH;
const g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
// 輪切りの束を作る: fn(層, x, y) が色を返す
function stack(w, h, layers, fn) {
  return [...Array(layers)].map((_, l) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { const col = fn(l, i, j); if (col) { x.fillStyle = col; x.fillRect(i, j, 1, 1); } } return c; });
}
const HULL = stack(22, 14, 7, (l, x, y) => {
  if (l < 3) return (y < 3 || y > 10) ? ((x + l) % 3 ? '#2a2e2a' : '#4a4e48') : (l === 2 && x > 1 && x < 20 ? '#3f6a3a' : null);
  if (x < 2 || x > 19 || y < 2 || y > 11) return null; return l === 6 ? ((x + y) % 5 ? '#6fa85a' : '#8fc470') : '#4f8444';
});
const TURRET = stack(22, 14, 5, (l, x, y) => {
  const d = Math.hypot(x - 9, y - 6.5); if (d < 4.6 - l * .3) return l === 4 ? '#9ad27a' : '#5f9a4c';
  if (l >= 1 && l <= 2 && x > 12 && x < 22 && y >= 6 && y <= 7) return l === 2 ? '#cfd8c8' : '#7a8478'; return null;
});
const TREE = stack(16, 16, 14, (l, x, y) => { const d = Math.hypot(x - 7.5, y - 7.5); if (l < 4) return d < 1.6 ? '#6a4a2a' : null; const r = 7.5 - (l - 4) * .72; return d < r ? (hash(x, y + l) > .7 ? '#3f9a4a' : l > 10 ? '#7fd070' : '#2f7a3c') : null; });
const HOUSE = stack(24, 18, 16, (l, x, y) => {
  if (l < 8) return (x === 0 || x === 23 || y === 0 || y === 17) ? ((x + y) % 7 === 3 && l > 2 && l < 6 ? '#8fd0f0' : '#e8d8b8') : (l === 7 ? '#c8b898' : null);
  const inset = (l - 8) * 1.1; if (y < inset || y > 17 - inset) return null; return (y - inset < 1 || 17 - inset - y < 1) ? '#8a2f2a' : (x % 4 ? '#c8483a' : '#a83a30');
});
const ROCK = stack(10, 10, 5, (l, x, y) => Math.hypot(x - 4.5, y - 4.5) < 4.5 - l * .8 ? (l > 2 ? '#b0b4b8' : '#7a7e84') : null);

// 地面（1 枚の絵）
const WORLD = 512, ground = document.createElement('canvas'); ground.width = ground.height = WORLD;
{
  const x = ground.getContext('2d'); x.fillStyle = '#4f8a3f'; x.fillRect(0, 0, WORLD, WORLD);
  for (let i = 0; i < 9000; i++) { x.fillStyle = hash(i, 1) > .5 ? '#5f9a4a' : '#437a37'; x.fillRect(Math.floor(hash(i, 2) * WORLD), Math.floor(hash(i, 3) * WORLD), 2, 2); }
  x.strokeStyle = '#b89a62'; x.lineWidth = 26; x.beginPath(); x.arc(256, 256, 130, 0, 7); x.stroke();
  x.strokeStyle = '#a08552'; x.lineWidth = 2; x.setLineDash([6, 10]); x.beginPath(); x.arc(256, 256, 124, 0, 7); x.stroke(); x.beginPath(); x.arc(256, 256, 136, 0, 7); x.stroke();
}
const objs = [];
for (let i = 0; i < 46; i++) { const a = hash(i, 5) * 6.28, r = hash(i, 6) > .5 ? 30 + hash(i, 7) * 78 : 158 + hash(i, 7) * 90; objs.push({ x: 256 + Math.cos(a) * r, y: 256 + Math.sin(a) * r, a: hash(i, 8) * 6, s: i % 7 === 0 ? HOUSE : i % 5 === 0 ? ROCK : TREE }); }
const tank = { x: 386, y: 256, a: 0, ta: 0 }, shells = [], puffs = [];

let t = 0, last = performance.now(), shotT = 2, camA = 0;
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt; camA = t * .22;
  const wa = t * .32; tank.x = 256 + Math.cos(wa) * 130; tank.y = 256 + Math.sin(wa) * 130; tank.a = wa + Math.PI / 2;
  const tgt = objs[Math.floor(t / 2.4) % objs.length]; const want = Math.atan2(tgt.y - tank.y, tgt.x - tank.x); tank.ta += Math.atan2(Math.sin(want - tank.ta), Math.cos(want - tank.ta)) * Math.min(1, dt * 4);
  if ((shotT -= dt) <= 0) { shotT = 2.4; shells.push({ x: tank.x, y: tank.y, tx: tgt.x, ty: tgt.y, f: 0 }); }
  const cs = Math.cos(-camA), sn = Math.sin(-camA);
  const scr = (x, y) => { const dx = x - tank.x, dy = y - tank.y; return [LW / 2 + dx * cs - dy * sn, LH / 2 + 14 + (dx * sn + dy * cs) * .78]; };

  g.fillStyle = '#437a37'; g.fillRect(0, 0, LW, LH);
  g.save(); g.translate(LW / 2, LH / 2 + 14); g.scale(1, .78); g.rotate(-camA); g.drawImage(ground, -tank.x, -tank.y); g.restore();
  // 奥から順に重ねて描く
  const list = objs.map(o => ({ p: scr(o.x, o.y), a: o.a, s: [o.s] }));
  list.push({ p: scr(tank.x, tank.y), a: tank.a, s: [HULL, TURRET], a2: tank.ta });
  list.sort((a, b) => a.p[1] - b.p[1]);
  for (const o of list) {
    if (o.p[0] < -30 || o.p[0] > LW + 30 || o.p[1] < -30 || o.p[1] > LH + 40) continue;
    g.fillStyle = 'rgba(10,30,10,.35)'; g.beginPath(); g.ellipse(o.p[0] + 3, o.p[1] + 2, o.s[0][0].width * .5, o.s[0][0].width * .3, 0, 0, 7); g.fill();
    let z = 0;
    o.s.forEach((st, k) => { for (const sl of st) { g.save(); g.translate(Math.round(o.p[0]), Math.round(o.p[1] - z)); g.scale(1, .78); g.rotate((k ? o.a2 : o.a) - camA); g.drawImage(sl, -sl.width / 2 + (k ? 2 : 0), -sl.height / 2); g.restore(); z++; } });
  }
  // 砲弾と土けむり
  for (let i = shells.length - 1; i >= 0; i--) {
    const s = shells[i]; s.f += dt * 1.6; const p = scr(s.x + (s.tx - s.x) * s.f, s.y + (s.ty - s.y) * s.f);
    if (s.f >= 1) { for (let k = 0; k < 10; k++) puffs.push({ x: s.tx, y: s.ty, vx: (hash(k, t) - .5) * 40, vy: (hash(t, k) - .5) * 40, a: 0 }); shells.splice(i, 1); continue; }
    g.fillStyle = '#fff2a0'; g.fillRect(Math.round(p[0]) - 1, Math.round(p[1] - 8 - Math.sin(s.f * Math.PI) * 26) - 1, 3, 3);
  }
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i]; p.a += dt * 1.4; if (p.a >= 1) { puffs.splice(i, 1); continue; } p.x += p.vx * dt; p.y += p.vy * dt;
    const q = scr(p.x, p.y), r = Math.round(2 + p.a * 4); g.fillStyle = p.a < .3 ? '#ffd060' : p.a < .6 ? '#c8c0b0' : '#8a8478'; g.fillRect(Math.round(q[0] - r / 2), Math.round(q[1] - 6 - p.a * 14 - r / 2), r, r);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
