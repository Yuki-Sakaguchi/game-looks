<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 24 スネーク 編み物</title>
<style>
html,body{margin:0;height:100%;background:#3a2e36;overflow:hidden;display:grid;place-items:center}
canvas{width:min(100vw,146.67vh);aspect-ratio:880/600;display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#f4ead8;background:#3a2e36;padding:0 6px}
</style>
<canvas id="c"></canvas>
<div id="cap">LOOK 24 ─ スネーク / 編み物　｜　見るだけ（自動で動く）</div>
<script>
// 画面全体が 1 枚のセーター。1 マスを 1 つの編み目（V の字）で描き、段を少し重ねて編み地にする。
// 毛糸は「太く暗い線」の上に「細く明るい線」を重ねて丸みを出す。上下は北欧風の編みこみ模様
const COLS = 44, ROWS = 30, SW = 20, SH = 20, LW = COLS * SW, LH = ROWS * SH, S = Math.min(devicePixelRatio || 1, 2);
const cv = document.getElementById('c'); cv.width = LW * S; cv.height = LH * S;
const g = cv.getContext('2d');
const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
const YARN = ['#f1e6d0', '#c8382e', '#2f4f8f', '#f0b83a', '#f7f2e8', '#2f7a5a'];
const [CREAM, RED, NAVY, GOLD, WHITE, GREEN] = [0, 1, 2, 3, 4, 5];
const shade = (hex, f) => '#' + [1, 3, 5].map(i => Math.max(0, Math.min(255, Math.round(parseInt(hex.slice(i, i + 2), 16) * f))).toString(16).padStart(2, '0')).join('');
const DARK = YARN.map(c => shade(c, .7)), LIGHT = YARN.map(c => shade(c, 1.12));

const MOTIF = ['...X....', '..X.X...', '.X.X.X..', '..X.X...', '...X....'];
const TOP = 6, BOT = 24, L = 2, R = 41;   // 遊ぶ範囲（マス）
const cells = new Uint8Array(COLS * ROWS);
function pattern() {
  cells.fill(CREAM);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const band = y < TOP ? y : y >= BOT ? ROWS - 1 - y : -1;
    if (band === 0) cells[y * COLS + x] = NAVY;
    else if (band >= 1 && band <= 5) cells[y * COLS + x] = MOTIF[band - 1][x % 8] === 'X' ? (band === 3 ? RED : NAVY) : CREAM;
    else if (band === -1 && (x < L || x > R)) cells[y * COLS + x] = (x + y) % 2 ? NAVY : CREAM;
  }
}

// スネーク
let snake, dir, food, timer = 0, grow = 0;
function placeFood() { do { food = [L + Math.floor(Math.random() * (R - L + 1)), TOP + Math.floor(Math.random() * (BOT - TOP))]; } while (snake.some(s => s[0] === food[0] && s[1] === food[1])); }
function reset() { snake = [[12, 15], [11, 15], [10, 15], [9, 15]]; dir = [1, 0]; grow = 0; placeFood(); }
reset();
const free = (x, y) => x >= L && x <= R && y >= TOP && y < BOT && !snake.slice(0, -1).some(s => s[0] === x && s[1] === y);
function step() {
  const [hx, hy] = snake[0];
  const opts = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(d => !(d[0] === -dir[0] && d[1] === -dir[1]) && free(hx + d[0], hy + d[1]));
  if (!opts.length || snake.length > 36) return reset();
  opts.sort((a, b) => (Math.abs(hx + a[0] - food[0]) + Math.abs(hy + a[1] - food[1]) - (a[0] === dir[0] && a[1] === dir[1] ? .5 : 0)) - (Math.abs(hx + b[0] - food[0]) + Math.abs(hy + b[1] - food[1]) - (b[0] === dir[0] && b[1] === dir[1] ? .5 : 0)));
  dir = opts[0]; snake.unshift([hx + dir[0], hy + dir[1]]);
  if (snake[0][0] === food[0] && snake[0][1] === food[1]) { grow += 3; placeFood(); }
  if (grow > 0) grow--; else snake.pop();
}

// 編み目のゆらぎ（マスごとに固定）
const JIT = new Float32Array(COLS * ROWS * 2); for (let i = 0; i < JIT.length; i++) JIT[i] = (hash(i, 3) - .5) * 1.6;
let t = 0, last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt;
  if ((timer -= dt) <= 0) { timer = .11; step(); }
  pattern();
  snake.forEach((s, i) => cells[s[1] * COLS + s[0]] = i === 0 ? WHITE : i % 3 === 2 ? GOLD : RED);
  cells[food[1] * COLS + food[0]] = Math.floor(t * 4) % 2 ? GREEN : GOLD;

  g.setTransform(S, 0, 0, S, 0, 0); g.fillStyle = '#5a4a44'; g.fillRect(0, 0, LW, LH);
  g.lineCap = 'round';
  // 下の段から順に、色ごとにまとめて描く
  for (let y = ROWS - 1; y >= 0; y--) for (let col = 0; col < YARN.length; col++) {
    const p = new Path2D(); let any = false;
    for (let x = 0; x < COLS; x++) {
      const i = y * COLS + x; if (cells[i] !== col) continue; any = true;
      const cx = x * SW + SW / 2 + JIT[i * 2], by = y * SH + SH * 1.02 + JIT[i * 2 + 1], ty = y * SH - SH * .32;
      p.moveTo(cx - SW * .36, ty); p.quadraticCurveTo(cx - SW * .3, by - SH * .3, cx, by);
      p.moveTo(cx + SW * .36, ty); p.quadraticCurveTo(cx + SW * .3, by - SH * .3, cx, by);
    }
    if (!any) continue;
    g.strokeStyle = DARK[col]; g.lineWidth = SW * .5; g.stroke(p);
    g.strokeStyle = YARN[col]; g.lineWidth = SW * .36; g.stroke(p);
    g.strokeStyle = LIGHT[col]; g.lineWidth = SW * .1; g.stroke(p);
  }
  // 毛羽
  g.strokeStyle = 'rgba(255,250,240,.16)'; g.lineWidth = .6; g.beginPath();
  for (let i = 0; i < 700; i++) { const x = hash(i, 5) * LW, y = hash(i, 6) * LH, a = hash(i, 7) * 6.28; g.moveTo(x, y); g.lineTo(x + Math.cos(a) * 5, y + Math.sin(a) * 5); }
  g.stroke();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
