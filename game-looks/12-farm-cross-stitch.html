<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 12 農場 クロスステッチ</title>
<style>
html,body{margin:0;height:100%;background:#3a2e2a;overflow:hidden;display:grid;place-items:center}
canvas{width:min(100vw,145.45vh);aspect-ratio:896/616;display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#fbf7ea;background:#3a2e2a;padding:0 6px}
</style>
<canvas id="c"></canvas>
<div id="cap">LOOK 12 ─ 農場 / クロスステッチ　｜　見るだけ（自動で進む）</div>
<script>
// 64×44 のドット絵を、1 ドット = 1 つの「×」の糸で刺した刺繍として描く。
// 下の糸（＼）は暗く、上の糸（／）は明るく、その上に細いつや。地面は刺さずに布を見せる
const GW = 64, GH = 44, CS = 14, LW = GW * CS, LH = GH * CS, S = Math.min(devicePixelRatio || 1, 2);
const cv = document.getElementById('c'); cv.width = LW * S; cv.height = LH * S;
const g = cv.getContext('2d');
const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
const THREAD = [null, '#8a5a3c', '#6b432c', '#5a9e4a', '#2f6e3a', '#9ccc5a', '#c8382e', '#8e2420', '#f0c040', '#e8862e', '#4a86c8', '#9cc8e8', '#fbf7ea', '#3a2e2a', '#f0c8a0', '#7a4a2a', '#e88aa0', '#a8a096'];
const [SOIL, SOILD, GREEN, DGREEN, LGREEN, RED, DRED, YELLOW, ORANGE, BLUE, LBLUE, WHITE, BLACK, SKIN, BROWN, PINK, GRAY] = THREAD.map((_, i) => i).slice(1);
const shade = (hex, f) => '#' + [1, 3, 5].map(i => Math.max(0, Math.min(255, Math.round(parseInt(hex.slice(i, i + 2), 16) * f))).toString(16).padStart(2, '0')).join('');
const DARK = THREAD.map(c => c && shade(c, .68));

const buf = new Uint8Array(GW * GH);
const px = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < GW && y < GH) buf[y * GW + x] = c; };
const rect = (x, y, w, h, c) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) px(x + i, y + j, c); };
const spr = (x, y, rows, key, flip) => rows.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== '.') px(x + (flip ? row.length - 1 - i : i), y + j, key[ch]); }));
const ping = (v, n) => { v %= n * 2; return v < n ? v : n * 2 - v; };

const KEY = { Y: YELLOW, S: SKIN, B: BLUE, K: BLACK, R: RED, W: WHITE, O: ORANGE };
const FARMER = [['.YYY.', 'YYYYY', '.SSS.', '.BBB.', 'SBBBS', '.BBB.', '.K.K.'], ['.YYY.', 'YYYYY', '.SSS.', '.BBB.', 'SBBBS', '.BBB.', '..KK.']];
const HEN = ['.R.', 'WWO', 'WW.'], DUCK = ['WWO', 'WW.'];
const FRUIT = [RED, YELLOW, ORANGE, PINK, RED, YELLOW];

function scene(t) {
  buf.fill(0);
  // 縁かざり
  for (let x = 1; x < GW - 1; x++) { px(x, 1 + x % 2, RED); px(x, GH - 2 - x % 2, RED); }
  for (let y = 3; y < GH - 3; y++) { px(1 + y % 2, y, RED); px(GW - 2 - y % 2, y, RED); }
  // 納屋
  for (let k = 0; k < 4; k++) rect(8 - k, 5 + k, 6 + k * 2, 1, DRED);
  rect(6, 9, 10, 6, RED); rect(9, 11, 4, 4, DRED); rect(8, 10, 6, 1, WHITE);
  for (let k = 0; k < 4; k++) { px(9 + k, 11 + k, WHITE); px(12 - k, 11 + k, WHITE); }
  // りんごの木
  for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) if (dx * dx + dy * dy < 18) px(22 + dx, 8 + dy, dx + dy < -2 ? LGREEN : dx + dy > 3 ? DGREEN : GREEN);
  px(20, 8, RED); px(23, 6, RED); px(24, 10, RED); rect(21, 12, 2, 3, BROWN);
  // お日さま（光の向きが入れ替わる）
  for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) if (dx * dx + dy * dy < 7) px(56 + dx, 7 + dy, YELLOW);
  const diag = Math.floor(t * 2) % 2;
  for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2 + (diag ? Math.PI / 4 : 0); px(56 + Math.cos(a) * 4.2, 7 + Math.sin(a) * 4.2, ORANGE); }
  // 池とあひる
  for (let y = 10; y <= 16; y++) for (let x = 38; x <= 54; x++) {
    const dx = (x - 46) / 7.5, dy = (y - 13) / 3.4;
    if (dx * dx + dy * dy < 1) px(x, y, (x + Math.floor(t * 2)) % 5 === 0 && y % 2 === 0 ? LBLUE : BLUE);
  }
  const dk = ping(t * 1.5, 7); spr(42 + dk, 12, DUCK, KEY, Math.floor(t * 1.5 / 7) % 2 === 1);
  // 柵
  for (let x = 4; x < 60; x++) { if (x >= 30 && x <= 33) continue; px(x, 18, GRAY); if (x % 4 === 0) { px(x, 17, BROWN); px(x, 18, BROWN); px(x, 19, BROWN); } }
  // 畑と作物（芽 → 葉 → 実 をくり返す）
  [6, 24, 42].forEach((fx, a) => [21, 31].forEach((fy, b) => {
    const plot = a + b * 3;
    for (let j = 0; j < 8; j++) rect(fx, fy + j, 16, 1, j % 2 ? SOILD : SOIL);
    for (let i = 0; i < 5; i++) for (let j = 0; j < 3; j++) {
      const x = fx + 2 + i * 3, y = fy + 2 + j * 2, st = Math.floor((t * .25 + plot * .6 + hash(i + plot * 7, j) * .6) % 4);
      if (st === 1) px(x, y, LGREEN);
      if (st === 2) { px(x, y, GREEN); px(x + 1, y, LGREEN); }
      if (st === 3) { px(x, y, GREEN); px(x + 1, y, LGREEN); px(x, y - 1, FRUIT[plot]); }
    }
  }));
  // にわとりと農夫
  for (let i = 0; i < 3; i++) { const v = Math.sin(t * .7 + i * 2); spr(9 + i * 7 + v * 4, 14 + (i % 2), HEN, KEY, Math.cos(t * .7 + i * 2) < 0); }
  spr(5 + ping(t * 4, 50), 23, FARMER[Math.floor(t * 4) % 2], KEY);
}

// 布（一度だけ描く）
const cloth = document.createElement('canvas'); cloth.width = LW * S; cloth.height = LH * S;
{
  const c = cloth.getContext('2d'); c.setTransform(S, 0, 0, S, 0, 0);
  c.fillStyle = '#e9dfc6'; c.fillRect(0, 0, LW, LH);
  for (let i = 0; i < 9000; i++) { c.fillStyle = `rgba(${Math.random() < .5 ? '255,250,235' : '150,130,95'},.08)`; c.fillRect(Math.random() * LW, Math.random() * LH, 2 + Math.random() * 10, 1); }
  c.strokeStyle = 'rgba(160,140,105,.28)'; c.lineWidth = 1; c.beginPath();
  for (let x = 0; x <= GW; x++) { c.moveTo(x * CS, 0); c.lineTo(x * CS, LH); }
  for (let y = 0; y <= GH; y++) { c.moveTo(0, y * CS); c.lineTo(LW, y * CS); }
  c.stroke();
  c.fillStyle = '#b5a888';
  for (let x = 0; x <= GW; x++) for (let y = 0; y <= GH; y++) { c.beginPath(); c.arc(x * CS, y * CS, 1.5, 0, 7); c.fill(); }
}
// 針目のわずかな不ぞろい（マスごとに固定）
const JIT = new Float32Array(GW * GH * 4); for (let i = 0; i < JIT.length; i++) JIT[i] = (hash(i, 5) - .5) * 1.3;

let t = 0, last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt;
  scene(t);
  g.setTransform(S, 0, 0, S, 0, 0); g.drawImage(cloth, 0, 0, LW, LH);
  g.lineCap = 'round';
  const reveal = t * 700, a = CS * .16, b = CS * .84;
  for (let col = 1; col < THREAD.length; col++) {
    const back = new Path2D(), front = new Path2D(), shine = new Path2D(); let any = false;
    for (let i = 0; i < buf.length; i++) {
      if (buf[i] !== col || i > reveal) continue;
      any = true;
      const x = (i % GW) * CS, y = Math.floor(i / GW) * CS, k = i * 4;
      back.moveTo(x + a + JIT[k], y + a + JIT[k + 1]); back.lineTo(x + b + JIT[k + 2], y + b + JIT[k + 3]);
      front.moveTo(x + a + JIT[k + 1], y + b + JIT[k]); front.lineTo(x + b + JIT[k + 3], y + a + JIT[k + 2]);
      shine.moveTo(x + a + 2.5 + JIT[k + 1], y + b - 3.5 + JIT[k]); shine.lineTo(x + b - 3.5 + JIT[k + 3], y + a + 2.5 + JIT[k + 2]);
    }
    if (!any) continue;
    g.lineWidth = CS * .3; g.strokeStyle = DARK[col]; g.stroke(back);
    g.strokeStyle = THREAD[col]; g.stroke(front);
    g.lineWidth = CS * .07; g.strokeStyle = 'rgba(255,255,255,.3)'; g.stroke(shine);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
