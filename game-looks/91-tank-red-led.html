<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 91 戦車 3D 赤色 LED の単色画面</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#ff5a4a;opacity:.85}
</style>
<div id="cap">LOOK 91 ─ 戦車 3D / 赤色 LED だけの単色画面　｜　見るだけ（砲塔から見て進む）</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 色は赤 1 色、明るさは「消灯・弱・中・強」の 4 段だけ。まず 3D の場面を横 192 ドットの小さな絵に描き、
// 明るさを 4 段に丸めてから、1 ドットを 1 個の丸い赤 LED として並べる。形は面の明るさの差と、明るいふち線で読ませる。
// 黒い所は本当に光らないので、背景はまっ黒のまま
import * as THREE from 'three';
const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
const renderer = new THREE.WebGLRenderer({ antialias: false }); renderer.setPixelRatio(1); document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0); scene.fog = new THREE.Fog(0, 30, 120);
const cam = new THREE.PerspectiveCamera(60, 1, .1, 300);
const gray = v => new THREE.MeshBasicMaterial({ color: new THREE.Color(v, v, v) }), LINE = new THREE.LineBasicMaterial({ color: 0xffffff });
function solid(geo, v, x, y, z, parent = scene) { const m = new THREE.Mesh(geo, gray(v)); m.position.set(x, y, z); m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 20), LINE)); parent.add(m); return m; }
const grid = new THREE.GridHelper(600, 100, 0x888888, 0x555555); scene.add(grid);
const things = []; for (let i = 0; i < 46; i++) { const k = i % 3, s = 2 + hash(i, 1) * 4, geo = k === 0 ? new THREE.ConeGeometry(s, s * 1.6, 4) : k === 1 ? new THREE.BoxGeometry(s, s, s) : new THREE.CylinderGeometry(s * .5, s * .5, s * 1.4, 6); const m = solid(geo, .22 + hash(i, 2) * .2, (hash(i, 3) - .5) * 240, k === 0 ? s * .8 : k === 1 ? s / 2 : s * .7, (hash(i, 4) - .5) * 240); m.rotation.y = hash(i, 5) * 3; things.push(m); }
const mtn = []; for (let i = 0; i < 16; i++) { const a = i / 16 * 6.283, m = solid(new THREE.ConeGeometry(30 + hash(i, 6) * 30, 30 + hash(i, 7) * 40, 4), .12, Math.cos(a) * 230, 14, Math.sin(a) * 230); mtn.push([m, a]); }
const foes = [0, 1, 2].map(i => { const gp = new THREE.Group(); solid(new THREE.BoxGeometry(4, 1.4, 6), .5, 0, .7, 0, gp); solid(new THREE.BoxGeometry(2.4, 1.2, 2.8), .7, 0, 2, 0, gp); const b = solid(new THREE.CylinderGeometry(.22, .22, 4, 6), .9, 0, 2.1, 3, gp); b.rotation.x = Math.PI / 2; scene.add(gp); return { gp, a: i * 2.1, r: 30 + i * 14 }; });
const shell = solid(new THREE.SphereGeometry(.5, 6, 4), 1, 0, -10, 0); let shellT = 9; const sv = new THREE.Vector3();
const boom = solid(new THREE.IcosahedronGeometry(1, 0), 1, 0, -10, 0); let boomT = 9;
const barrel = solid(new THREE.CylinderGeometry(.16, .2, 3.4, 8), .55, 0, -.75, -2.4, cam); barrel.rotation.x = Math.PI / 2; scene.add(cam);
// 仕上げ：4 段に丸めて、LED の粒にする
const GW = 192; const rt = new THREE.WebGLRenderTarget(GW, 120); rt.texture.minFilter = rt.texture.magFilter = THREE.NearestFilter;
const post = new THREE.ShaderMaterial({ uniforms: { tD: { value: rt.texture }, grid: { value: new THREE.Vector2(GW, 120) } }, vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}', fragmentShader: `
uniform sampler2D tD;uniform vec2 grid;varying vec2 vUv;
void main(){
  vec2 cell=floor(vUv*grid),f=fract(vUv*grid)-.5;
  float l=dot(texture2D(tD,(cell+.5)/grid).rgb,vec3(.3333));
  float q=floor(clamp(l,0.,1.)*3.+.5)/3.;
  float dotm=smoothstep(.48,.3,length(f));
  vec3 led=vec3(1.,.07,.03)*q*dotm+vec3(.09,.0,.0)*dotm;
  led+=vec3(1.,.25,.15)*q*q*smoothstep(.22,.0,length(f))*.5;
  gl_FragColor=vec4(led,1.);
}` });
const ps = new THREE.Scene(); ps.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post)); const pc = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const resize = () => { const w = innerWidth, h = innerHeight, gh = Math.max(60, Math.round(GW * h / w)); renderer.setSize(w, h); rt.setSize(GW, gh); post.uniforms.grid.value.set(GW, gh); cam.aspect = w / h; cam.updateProjectionMatrix(); }; addEventListener('resize', resize); resize();
let last = performance.now(), t = 0, heading = 0, px = 0, pz = 0;
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt; shellT += dt; boomT += dt;
  // いちばん近い敵の方へ向きを変えながら進む
  let best = foes[0], bd = 1e9; for (const f of foes) { f.a += dt * .12; f.gp.position.set(px + Math.cos(f.a) * f.r, 0, pz + Math.sin(f.a) * f.r - 20); f.gp.rotation.y = -f.a; const d = f.gp.position.distanceTo(cam.position); if (d < bd) { bd = d; best = f; } }
  const want = Math.atan2(-(best.gp.position.x - px), -(best.gp.position.z - pz)); let da = want - heading; while (da > Math.PI) da -= 6.283; while (da < -Math.PI) da += 6.283; heading += Math.max(-.5 * dt, Math.min(.5 * dt, da));
  px -= Math.sin(heading) * 7 * dt; pz -= Math.cos(heading) * 7 * dt; cam.position.set(px, 2.6 + Math.sin(t * 9) * .05, pz); cam.rotation.set(0, heading, 0);
  if (shellT > 3 && Math.abs(da) < .08) { shellT = 0; shell.position.copy(cam.position).add(new THREE.Vector3(-Math.sin(heading) * 3, -.7, -Math.cos(heading) * 3)); sv.set(-Math.sin(heading) * 70, 2, -Math.cos(heading) * 70); }
  if (shellT < 2) { sv.y -= 9 * dt; shell.position.addScaledVector(sv, dt); if (shell.position.distanceTo(best.gp.position) < 4 || shell.position.y < 0) { boom.position.copy(shell.position); boomT = 0; shell.position.y = -10; shellT = 2; if (shell.position.y < 0 && boom.position.distanceTo(best.gp.position) < 5) best.a += 2.5; } }
  boom.scale.setScalar(boomT < .6 ? 1 + boomT * 14 : .001); boom.rotation.y = t * 5;
  for (const m of things) { if (m.position.x - px > 120) m.position.x -= 240; if (m.position.x - px < -120) m.position.x += 240; if (m.position.z - pz > 120) m.position.z -= 240; if (m.position.z - pz < -120) m.position.z += 240; if (Math.hypot(m.position.x - px, m.position.z - pz) < 14) m.position.x += 90; }
  for (const [m, a] of mtn) m.position.set(px + Math.cos(a) * 230, 14, pz + Math.sin(a) * 230);
  grid.position.set(Math.round(px / 6) * 6, 0, Math.round(pz / 6) * 6);
  renderer.setRenderTarget(rt); renderer.render(scene, cam); renderer.setRenderTarget(null); renderer.render(ps, pc);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
