<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 67 ビリヤード 幾何の作図</title>
<style>
html,body{margin:0;height:100%;background:#dcd6c4;overflow:hidden;display:grid;place-items:center}
canvas{width:min(100vw,160vh);aspect-ratio:8/5;display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#2a3550;background:#f5f1e4;padding:0 6px}
</style>
<canvas id="c"></canvas>
<div id="cap">LOOK 67 ─ ビリヤード / 幾何の作図　｜　見るだけ（はね返るたびに角度が書きこまれる）</div>
<script>
// 台も球も、定規とコンパスで引いた線だけで表す。予定の道は細い破線、通った道は赤い実線、
// はね返った所には青い法線（壁に垂直な線）と、入る角・出る角の弧と名前を書きこむ。
// 紙はうすい青の方眼紙。色は黒・赤・青の 3 本のペンだけ
const LW = 960, LH = 600, S = Math.min(devicePixelRatio || 1, 2);
const cv = document.getElementById('c'); cv.width = LW * S; cv.height = LH * S; const g = cv.getContext('2d');
const X0 = 130, X1 = 830, Y0 = 120, Y1 = 460, R = 11, INK = '#1d2233', RED = '#c8322a', BLUE = '#2a5fc0', SERIF = 'Georgia,"Times New Roman",serif';
let P, pts, norms, seglen, total, dist, hold;
function shot(from) {
  const a = Math.random() * 6.283; let p = from.slice(), d = [Math.cos(a), Math.sin(a)]; if (Math.abs(d[0]) < .25 || Math.abs(d[1]) < .25) d = [.8, .6 * (Math.random() < .5 ? 1 : -1)];
  pts = [p.slice()]; norms = []; seglen = []; total = 0;
  for (let k = 0; k < 5; k++) { const tx = d[0] > 0 ? (X1 - R - p[0]) / d[0] : (X0 + R - p[0]) / d[0], ty = d[1] > 0 ? (Y1 - R - p[1]) / d[1] : (Y0 + R - p[1]) / d[1], tt = Math.min(tx, ty) * (k === 4 ? .6 : 1);
    p = [p[0] + d[0] * tt, p[1] + d[1] * tt]; pts.push(p.slice()); seglen.push(tt); total += tt; if (tx < ty) { norms.push([-Math.sign(d[0]), 0]); d = [-d[0], d[1]]; } else { norms.push([0, -Math.sign(d[1])]); d = [d[0], -d[1]]; } }
  dist = 0; hold = 0;
}
shot([300, 300]);
const SUB = '₁₂₃₄₅';
let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now;
  if (dist < total) dist = Math.min(total, dist + dt * 260); else if ((hold += dt) > 1.6) shot(pts[5]);
  g.setTransform(S, 0, 0, S, 0, 0); g.fillStyle = '#f5f1e4'; g.fillRect(0, 0, LW, LH);
  g.strokeStyle = 'rgba(80,130,200,.2)'; g.lineWidth = .6; g.beginPath(); for (let x = 10; x < LW; x += 20) { g.moveTo(x, 0); g.lineTo(x, LH); } for (let y = 0; y < LH; y += 20) { g.moveTo(0, y); g.lineTo(LW, y); } g.stroke();
  // 台
  g.strokeStyle = INK; g.lineWidth = 1.6; g.strokeRect(X0, Y0, X1 - X0, Y1 - Y0); g.lineWidth = .8; g.strokeRect(X0 - 24, Y0 - 24, X1 - X0 + 48, Y1 - Y0 + 48);
  g.beginPath(); for (let i = 1; i < 8; i++) { const x = X0 + (X1 - X0) * i / 8; g.moveTo(x, Y0 - 16); g.lineTo(x, Y0 - 8); g.moveTo(x, Y1 + 8); g.lineTo(x, Y1 + 16); } for (let i = 1; i < 4; i++) { const y = Y0 + (Y1 - Y0) * i / 4; g.moveTo(X0 - 16, y); g.lineTo(X0 - 8, y); g.moveTo(X1 + 8, y); g.lineTo(X1 + 16, y); } g.stroke();
  for (const [x, y] of [[X0, Y0], [X1, Y0], [X0, Y1], [X1, Y1], [(X0 + X1) / 2, Y0 - 4], [(X0 + X1) / 2, Y1 + 4]]) { g.fillStyle = '#f5f1e4'; g.beginPath(); g.arc(x, y, 15, 0, 7); g.fill(); g.lineWidth = 1.2; g.stroke(); g.save(); g.clip(); g.lineWidth = .6; g.beginPath(); for (let k = -20; k < 20; k += 4) { g.moveTo(x + k - 16, y + 16); g.lineTo(x + k + 16, y - 16); } g.stroke(); g.restore(); }
  g.setLineDash([3, 5]); g.lineWidth = .7; g.beginPath(); g.moveTo(X0, (Y0 + Y1) / 2); g.lineTo(X1, (Y0 + Y1) / 2); g.moveTo((X0 + X1) / 2, Y0); g.lineTo((X0 + X1) / 2, Y1); g.stroke();
  // 予定の道（破線）
  g.setLineDash([7, 5]); g.strokeStyle = 'rgba(29,34,51,.5)'; g.lineWidth = .9; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke(); g.setLineDash([]);
  // 通った道（赤）と球の位置
  let rem = dist, bp = pts[0], done = 0; g.strokeStyle = RED; g.lineWidth = 1.8; g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 0; i < 5; i++) { const f = Math.min(1, rem / seglen[i]); bp = [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f]; g.lineTo(bp[0], bp[1]); rem -= seglen[i]; if (rem < 0) break; done = i + 1; } g.stroke();
  // はね返りの作図
  const notes = [];
  for (let i = 0; i < Math.min(done, 4); i++) { const p = pts[i + 1], n = norms[i], a = [pts[i][0] - p[0], pts[i][1] - p[1]], b = [pts[i + 2][0] - p[0], pts[i + 2][1] - p[1]], an = Math.atan2(n[1], n[0]), aa = Math.atan2(a[1], a[0]), ab = Math.atan2(b[1], b[0]);
    g.strokeStyle = BLUE; g.lineWidth = 1; g.setLineDash([5, 4]); g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(p[0] + n[0] * 70, p[1] + n[1] * 70); g.stroke(); g.setLineDash([]);
    const arc = (to, rad) => { let d = to - an; while (d > Math.PI) d -= 6.283; while (d < -Math.PI) d += 6.283; g.beginPath(); g.arc(p[0], p[1], rad, an, an + d, d < 0); g.stroke(); const m = an + d / 2; g.beginPath(); g.moveTo(p[0] + Math.cos(m) * (rad - 4), p[1] + Math.sin(m) * (rad - 4)); g.lineTo(p[0] + Math.cos(m) * (rad + 4), p[1] + Math.sin(m) * (rad + 4)); g.stroke(); return [m, Math.abs(d)]; };
    const [m1, th] = arc(aa, 30); const [m2] = arc(ab, 36);
    g.fillStyle = BLUE; g.font = `italic 15px ${SERIF}`; g.textAlign = 'center'; g.fillText('θ' + SUB[i], p[0] + Math.cos(m1) * 48, p[1] + Math.sin(m1) * 48 + 5); g.fillText('θ' + SUB[i] + '′', p[0] + Math.cos(m2) * 54, p[1] + Math.sin(m2) * 54 + 5);
    g.fillStyle = INK; g.beginPath(); g.arc(p[0] - n[0] * R, p[1] - n[1] * R, 2.2, 0, 7); g.fill(); notes.push('θ' + SUB[i] + ' = θ' + SUB[i] + '′ = ' + (th * 57.2958).toFixed(1) + '°'); }
  // 球（コンパスで描いた円）と名前
  g.strokeStyle = BLUE; g.lineWidth = .8; g.setLineDash([3, 3]); g.beginPath(); g.arc(pts[0][0], pts[0][1], 26, 0, 7); g.stroke(); g.setLineDash([]);
  g.fillStyle = INK; g.font = `italic 17px ${SERIF}`; g.textAlign = 'left'; g.fillText('A', pts[0][0] + 16, pts[0][1] - 16); g.beginPath(); g.arc(pts[0][0], pts[0][1], 2, 0, 7); g.fill();
  g.fillStyle = '#f5f1e4'; g.beginPath(); g.arc(bp[0], bp[1], R, 0, 7); g.fill(); g.strokeStyle = INK; g.lineWidth = 1.6; g.stroke(); g.fillStyle = INK; g.beginPath(); g.arc(bp[0], bp[1], 1.8, 0, 7); g.fill();
  g.lineWidth = .7; for (let k = 0; k < 3; k++) { g.beginPath(); g.arc(bp[0] - 3, bp[1] - 3, R - 1 + k * 2.2, .5, 1.9); g.stroke(); }
  if (dist >= total) g.fillText('A′', bp[0] + 16, bp[1] - 14);
  // 見出しと記録
  g.fillStyle = INK; g.textAlign = 'left'; g.font = `700 20px ${SERIF}`; g.fillText('PROP. LXVII', 40, 44); g.font = `italic 16px ${SERIF}`; g.fillText('The angle of incidence is equal to the angle of reflection.', 190, 44);
  g.font = `15px ${SERIF}`; notes.forEach((s, i) => g.fillText(s, 106 + i * 196, 530)); g.fillStyle = RED; g.font = `italic 15px ${SERIF}`; g.fillText('AA′ = ' + (dist / 3.5).toFixed(0) + ' cm', 106, 560);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
