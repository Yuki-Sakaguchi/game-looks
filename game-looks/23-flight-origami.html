<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 23 フライト 折り紙</title>
<style>
html,body{margin:0;height:100%;background:#f1e7d4;overflow:hidden}
canvas{width:100vw;height:100vh;display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#5a4a3a}
</style>
<canvas id="c"></canvas>
<div id="cap">LOOK 23 ─ 折り鶴のフライト / 折り紙　｜　マウスの左右で旋回（放っておくと自動）</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// 全部を「折った紙」にする: 面は平らで折り目がくっきり、色紙の裏は白、表には小さな柄、
// 紙の繊維のむら、机に落ちるやわらかい影。雲と星は糸でつるす
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const BG = 0xf1e7d4;
const scene = new THREE.Scene(); scene.background = new THREE.Color(BG); scene.fog = new THREE.Fog(BG, 40, 95);
const cam = new THREE.PerspectiveCamera(48, 1, .1, 200);
scene.add(new THREE.HemisphereLight(0xffffff, 0xe0cdb0, 1.7));
const sun = new THREE.DirectionalLight(0xfff2dc, 2.2); sun.position.set(-12, 22, 8); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 5;
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 30, bottom: -60, near: 1, far: 80 }); scene.add(sun, sun.target); sun.target.position.set(0, 0, -15);

const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
// 紙のテクスチャ（繊維のむら＋色紙の小さな柄）
function paperTex(pattern) {
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  x.fillStyle = pattern ? '#d2d2d2' : '#fff'; x.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 900; i++) { x.fillStyle = `rgba(120,100,80,${Math.random() * .08})`; x.fillRect(Math.random() * 128, Math.random() * 128, 1 + Math.random() * 6, 1); }
  if (pattern) { x.fillStyle = 'rgba(255,255,255,.9)'; for (let j = 0; j < 8; j++) for (let i = 0; i < 8; i++) { x.beginPath(); x.arc(i * 16 + (j % 2 ? 8 : 0) + 4, j * 16 + 4, 2.4, 0, 7); x.fill(); } }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
}
const plain = paperTex(false), dots = paperTex(true);
const paper = (c, pat, side = THREE.FrontSide) => new THREE.MeshLambertMaterial({ color: c, flatShading: true, map: pat ? dots : plain, side });
const mesh = (geo, m, x = 0, y = 0, z = 0) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; return o; };
// 三角形の並びから紙の面を作る（表は色、裏は白）
function folded(tris, color, pat) {
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(tris.flat(2), 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(tris.flat().flatMap(p => [p[0] * .4, p[2] * .4]), 2)); g.computeVertexNormals();
  const grp = new THREE.Group(); grp.add(mesh(g, paper(color, pat)), mesh(g, paper(0xffffff, false, THREE.BackSide))); return grp;
}

// 机（折りすじの入った大きな紙）
const desk = mesh(new THREE.PlaneGeometry(240, 240, 24, 24), paper(0xf6eedf, false)); desk.rotation.x = -Math.PI / 2; desk.castShadow = false;
{ const p = desk.geometry.attributes.position; for (let i = 0; i < p.count; i++) p.setZ(i, (hash(i, 1) - .5) * .5); desk.geometry.computeVertexNormals(); }
scene.add(desk);

const WRAP = 110, scroll = [], COL = [0x2f4f8f, 0x2f9a8a, 0xe0a030, 0xe86a8a, 0x7a5ab0];
for (let i = 0; i < 26; i++) {
  const g = new THREE.Group(), r = 3 + hash(i, 1) * 5, h = 4 + hash(i, 2) * 9, sides = 4 + (i % 2);
  g.add(mesh(new THREE.ConeGeometry(r, h, sides), paper(COL[i % 5], i % 3 === 0), 0, h / 2, 0));
  if (h > 8) g.add(mesh(new THREE.ConeGeometry(r * .36, h * .36, sides), paper(0xffffff), 0, h * .83, 0));
  g.position.set((i % 2 ? 1 : -1) * (9 + hash(i, 3) * 30), 0, -WRAP + i * (WRAP / 26) + 10); g.rotation.y = hash(i, 4) * 3; scene.add(g); scroll.push(g);
}
// 糸でつるした雲と星
const line = new THREE.LineBasicMaterial({ color: 0x9a8a78 });
const hang = (obj, x, y, z) => { const g = new THREE.Group(); g.position.set(x, y, z); g.add(obj, new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 40, 0)]), line)); scene.add(g); scroll.push(g); return g; };
const cloudG = new THREE.IcosahedronGeometry(2, 0); cloudG.scale(1.8, .7, 1);
for (let i = 0; i < 8; i++) hang(mesh(cloudG, paper(0xffffff)), (hash(i, 6) - .5) * 60, 13 + hash(i, 7) * 6, -WRAP + i * 14 + 10);
const starG = new THREE.OctahedronGeometry(.8, 0); starG.scale(1, 1, .4);
const stars = [...Array(6)].map((_, i) => hang(mesh(starG, paper(0xf0c030, true)), Math.sin(i * 2.1) * 6, 8, -WRAP + i * 18 + 16));

// 折り鶴
const crane = new THREE.Group(); scene.add(crane);
const RED = 0xe8433a;
crane.add(folded([[[0, .5, -1.2], [-.5, 0, 0], [.5, 0, 0]], [[0, .5, -1.2], [.5, 0, 0], [0, .6, 1.2]], [[0, .5, -1.2], [0, .6, 1.2], [-.5, 0, 0]], [[-.5, 0, 0], [0, .6, 1.2], [.5, 0, 0]]], RED, true));
crane.add(folded([[[0, .5, -1.2], [-.12, .3, -1], [0, 1.5, -2]], [[0, .5, -1.2], [0, 1.5, -2], [.12, .3, -1]], [[0, 1.5, -2], [-.08, 1.4, -1.95], [0, 1.2, -2.5]], [[0, 1.5, -2], [0, 1.2, -2.5], [.08, 1.4, -1.95]]], RED, false));
crane.add(folded([[[0, .6, 1.2], [.14, .3, 1], [0, 1.7, 2.1]], [[0, .6, 1.2], [0, 1.7, 2.1], [-.14, .3, 1]]], RED, false));
const wing = s => { const w = folded([[[0, 0, -.6], [0, 0, .7], [s * 2.6, 0, .1]], [[0, 0, -.6], [s * 2.6, 0, .1], [s * 1.2, 0, -.9]]].map(t => s > 0 ? [t[0], t[2], t[1]] : t), RED, true); w.position.y = .35; crane.add(w); return w; };
const wingL = wing(-1), wingR = wing(1);
crane.position.y = 8; crane.scale.setScalar(1.5);

function resize() { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let mx = 0, mouseT = -9;
addEventListener('pointermove', e => { mx = e.clientX / innerWidth * 2 - 1; mouseT = t; });

const V = 13;
let t = 0, last = performance.now(), vx = 0;
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt;
  for (const o of scroll) { o.position.z += V * dt; if (o.position.z > 12) o.position.z -= WRAP; }
  for (const s of stars) { s.children[0].rotation.y = t * 2; s.rotation.z = Math.sin(t * 1.5 + s.position.z) * .08; }
  let next = null; for (const s of stars) if (s.position.z < -2 && (!next || s.position.z > next.position.z)) next = s;
  const tx = t - mouseT < 2.5 ? mx * 9 : next ? next.position.x : 0, px = crane.position.x;
  crane.position.x += (tx - px) * Math.min(1, dt * 1.5);
  vx += ((crane.position.x - px) / Math.max(dt, .001) - vx) * Math.min(1, dt * 5);
  crane.rotation.z = -vx * .09; crane.position.y = 8 + Math.sin(t * 1.2) * .5;
  const flap = Math.sin(t * 5) * .55 + .15; wingL.rotation.z = -flap; wingR.rotation.z = flap;
  cam.position.set(crane.position.x * .6 + 3, 11.5, 11); cam.lookAt(crane.position.x * .8, 7.4, -8);
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
