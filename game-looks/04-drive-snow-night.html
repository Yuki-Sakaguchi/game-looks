<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 04 ドライブ 雪の夜道</title>
<style>
html,body{margin:0;height:100%;background:#070a22;overflow:hidden}
canvas{width:100vw;height:100vh;display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#dfe8ff;text-shadow:0 1px 0 #070a22}
</style>
<canvas id="c"></canvas>
<div id="cap">LOOK 04 ─ ドライブ / 雪の夜道　｜　マウスの左右でハンドル（放っておくと自動）　｜　<a href="../games/02-snow-night-rally.html" style="color:#7dffc0">▶ このルックのレースゲームで遊ぶ</a></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// 立体はなめらかな解像度のローポリ。空・雪・雪けむり・きらめきだけをドット絵にする
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const FOG = 0x232c66;
scene.fog = new THREE.Fog(FOG, 18, 95);
const cam = new THREE.PerspectiveCamera(55, 1, .1, 300);
const hash = (a, b = 0, c = 0) => { const n = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return n - Math.floor(n); };
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + .5) / 16);

// 空: 96×64 のドット絵を毎秒 10 回描き直す（帯のグラデーション、星、三日月、オーロラ）
const sky = document.createElement('canvas'); sky.width = 96; sky.height = 64;
const sx = sky.getContext('2d');
const skyTex = new THREE.CanvasTexture(sky);
skyTex.magFilter = skyTex.minFilter = THREE.NearestFilter; skyTex.generateMipmaps = false; skyTex.colorSpace = THREE.SRGBColorSpace;
scene.background = skyTex;
const BANDS = ['#070a22', '#0b1030', '#101844', '#172054', '#1d2760', '#232c66'];
const AUR = ['#7dffc0', '#34c9a0', '#3a7fc0', '#5a4fd0'];
function drawSky(t) {
  for (let y = 0; y < 64; y++) for (let x = 0; x < 96; x++) {
    const f = Math.min(4.999, y / 34 * 5), i = Math.floor(f);
    sx.fillStyle = BANDS[Math.min(5, i + (f - i > BAY[(y & 3) * 4 + (x & 3)] ? 1 : 0))]; sx.fillRect(x, y, 1, 1);
  }
  for (let i = 0; i < 44; i++) if (Math.sin(t * 3 + i * 2.1) > -.4) {
    sx.fillStyle = i % 5 ? '#aebcf0' : '#ffffff'; sx.fillRect(Math.floor(hash(i, 1) * 96), Math.floor(hash(i, 2) * 30), 1, 1);
  }
  for (let y = -6; y <= 6; y++) for (let x = -6; x <= 6; x++)
    if (Math.hypot(x, y) < 5.5 && Math.hypot(x - 2.5, y + 1.5) > 5) { sx.fillStyle = '#fff6d8'; sx.fillRect(76 + x, 9 + y, 1, 1); }
  for (let x = 0; x < 96; x++) {
    const base = 13 + 5 * Math.sin(x * .13 + t * .3) + 3 * Math.sin(x * .31 - t * .5);
    const len = 10 + 6 * Math.sin(x * .2 + t * .4 + 2), power = .5 + .5 * Math.sin(x * .09 + t * .25);
    for (let k = 0; k < len; k++) {
      const y = Math.round(base + len - k), f = k / len;
      if (y < 0 || BAY[(y & 3) * 4 + (x & 3)] > power * (1 - f * .8)) continue;
      sx.fillStyle = AUR[f < .25 ? 0 : f < .55 ? 1 : f < .8 ? 2 : 3]; sx.fillRect(x, y, 1, 1);
    }
  }
  skyTex.needsUpdate = true;
}

// 光: 青い月明かり、暖色のヘッドライト、赤いテールランプ
scene.add(new THREE.HemisphereLight(0x3a4a9a, 0x10142e, 1.5));
const moon = new THREE.DirectionalLight(0x8fa8ff, 2.4); moon.position.set(-30, 40, -20); scene.add(moon);

// 地形: 奥行き 100 で繰り返す波。道の両脇が盛り上がり、遠くは山になる
const TAU = Math.PI * 2, L = 100;
const sm = (a, b, x) => { x = Math.min(1, Math.max(0, (x - a) / (b - a))); return x * x * (3 - 2 * x); };
function hgt(x, zl) {
  const u = (zl + 50) / L * TAU, ax = Math.abs(x);
  return sm(4.5, 11, ax) * (1.1 + Math.sin(u * 2 + x * .31) + .7 * Math.sin(u * 5 + x * .73 + 1.3) + .5 * Math.sin(x * .9 + u * 3))
    + sm(22, 60, ax) * 13 * (.6 + .4 * Math.sin(u * 3 + x * .21));
}
function chunk() {
  let g = new THREE.PlaneGeometry(200, L, 64, 32); g.rotateX(-Math.PI / 2);
  const p0 = g.attributes.position;
  for (let i = 0; i < p0.count; i++) p0.setY(i, hgt(p0.getX(i), p0.getZ(i)));
  g = g.toNonIndexed(); g.computeVertexNormals();
  const p = g.attributes.position, col = new Float32Array(p.count * 3);
  const road = new THREE.Color(0x7f8fc8), lo = new THREE.Color(0xc8d6ff), hi = new THREE.Color(0xffffff), c = new THREE.Color();
  for (let i = 0; i < p.count; i += 3) {
    const cx = (p.getX(i) + p.getX(i + 1) + p.getX(i + 2)) / 3, cy = (p.getY(i) + p.getY(i + 1) + p.getY(i + 2)) / 3;
    if (Math.abs(cx) < 4.2) c.copy(road); else c.copy(lo).lerp(hi, Math.min(1, cy / 8));
    c.multiplyScalar(.94 + hash(i, 4) * .1);
    for (let k = 0; k < 3; k++) c.toArray(col, (i + k) * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }));
}
const chunks = [chunk(), chunk()];
chunks[0].position.z = -30; chunks[1].position.z = -130; scene.add(...chunks);

const lam = c => new THREE.MeshLambertMaterial({ color: c, flatShading: true });
const basic = c => new THREE.MeshBasicMaterial({ color: c });
const box = (w, h, d, m, x = 0, y = 0, z = 0) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); return o; };

// 道ばたの木と標識柱（世界と一緒に流れる）
const scroll = [];
const pineG = new THREE.ConeGeometry(1.3, 2.4, 6), pineG2 = new THREE.ConeGeometry(1, 2, 6), trunkG = new THREE.CylinderGeometry(.18, .22, 1, 5);
const pineM = lam(0x1c4a52), snowM = lam(0xeaf2ff), trunkM = lam(0x3a2a30);
for (let i = 0; i < 70; i++) {
  const g = new THREE.Group(), x = (i % 2 ? 1 : -1) * (6.5 + Math.pow(hash(i, 1), 1.5) * 30), z = -180 + hash(i, 2) * 200;
  const a = new THREE.Mesh(trunkG, trunkM); a.position.y = .5;
  const b = new THREE.Mesh(pineG, pineM); b.position.y = 1.9;
  const c = new THREE.Mesh(pineG2, snowM); c.position.y = 3.1;
  g.add(a, b, c); g.scale.setScalar(.8 + hash(i, 3) * .9); g.rotation.y = i;
  g.position.set(x, hgt(x, z + 30) - .15, z); scene.add(g); scroll.push(g);
}
const postM = lam(0x20264a), refM = basic(0xffb347);
for (let i = 0; i < 20; i++) for (const s of [-1, 1]) {
  const g = new THREE.Group(); g.add(box(.12, 1, .12, postM, 0, .5, 0), box(.18, .18, .05, refM, 0, .9, .08));
  g.position.set(s * 4.6, 0, -180 + i * 10); scene.add(g); scroll.push(g);
}

// 車
const car = new THREE.Group(); scene.add(car);
car.add(box(1.8, .55, 3.8, lam(0xe8563a), 0, .6, 0), box(1.5, .5, 1.9, lam(0x1a2148), 0, 1.1, .25), box(1.45, .1, 1.8, lam(0xf2f6ff), 0, 1.4, .25));
const wheelG = new THREE.CylinderGeometry(.4, .4, .3, 8); wheelG.rotateZ(Math.PI / 2);
for (const x of [-.9, .9]) for (const z of [-1.2, 1.2]) { const w = new THREE.Mesh(wheelG, lam(0x15182e)); w.position.set(x, .4, z); car.add(w); }
for (const x of [-.6, .6]) car.add(box(.4, .14, .04, basic(0xff2848), x, .7, 1.91), box(.4, .16, .04, basic(0xfff2c8), x, .65, -1.91));
const spot = new THREE.SpotLight(0xffd39a, 1400, 50, .6, .7, 1.6); spot.position.set(0, 1.2, -1.8);
spot.target.position.set(0, -1, -22); car.add(spot, spot.target);
const tail = new THREE.PointLight(0xff2040, 5, 7, 2); tail.position.set(0, .7, 2.6); car.add(tail);

// ドット絵のテクスチャ
function pix(n, fn) {
  const c = document.createElement('canvas'); c.width = 8 * n; c.height = 8; const g = c.getContext('2d');
  for (let f = 0; f < n; f++) for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    const col = fn(f, x, y); if (col) { g.fillStyle = col; g.fillRect(f * 8 + x, y, 1, 1); }
  }
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; t.colorSpace = THREE.SRGBColorSpace; t.repeat.set(1 / n, 1);
  return t;
}
const flakeTex = pix(1, (f, x, y) => {
  const a = Math.abs(x - 3.5), b = Math.abs(y - 3.5);
  return ((a < 1 || b < 1) && a + b < 4.2) || (a === b && a < 3) ? '#ffffff' : null;
});
const puffTex = pix(5, (f, x, y) => {
  const d = Math.hypot(x - 3.5, y - 3.5), r = 1.4 + f * .7;
  if (d > r || (f > 2 && hash(x, y, f) < (f - 2) * .3)) return null;
  return x + y * .6 < 5 - f * .2 ? '#ffffff' : '#aebcf0';
});
const starTex = pix(4, (f, x, y) => {
  const a = Math.abs(x - 3.5), b = Math.abs(y - 3.5), s = [1, 2.6, 4.2, 2.6][f];
  return ((a < 1 || b < 1) && a + b < s) || (f === 2 && a === b && a < 2) ? (a + b < 1.5 ? '#ffffff' : '#fff2b0') : null;
});
const sprites = (tex, n, opt = {}) => [...Array(n)].map(() => {
  const t = tex.clone(); t.needsUpdate = true;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, alphaTest: .5, depthWrite: false, ...opt }));
  s.visible = false; s.userData.a = 9; scene.add(s); return s;
});
const puffs = sprites(puffTex, 20, { color: 0xdfe6ff });
const stars = sprites(starTex, 12);

// 降る雪
const N = 700, fp = new Float32Array(N * 3);
for (let i = 0; i < N; i++) { fp[i * 3] = (hash(i, 1) - .5) * 50; fp[i * 3 + 1] = hash(i, 2) * 14; fp[i * 3 + 2] = -45 + hash(i, 3) * 57; }
const flakeG = new THREE.BufferGeometry(); flakeG.setAttribute('position', new THREE.BufferAttribute(fp, 3));
const flakes = new THREE.Points(flakeG, new THREE.PointsMaterial({ map: flakeTex, size: .42, transparent: true, alphaTest: .5, color: 0xdfe8ff, depthWrite: false }));
flakes.frustumCulled = false; scene.add(flakes);

function resize() { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let mx = 0, mouseT = -9;
addEventListener('pointermove', e => { mx = e.clientX / innerWidth * 2 - 1; mouseT = t; });

const V = 24;
let t = 0, last = performance.now(), s = 0, skyT = 0, puffT = 0, puffSide = 1, starT = 0, carV = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt; s += V * dt;
  if ((skyT -= dt) <= 0) { skyT = .1; drawSky(t); }

  for (const c of chunks) { c.position.z += V * dt; if (c.position.z > 70) c.position.z -= 200; }
  for (const o of scroll) { o.position.z += V * dt; if (o.position.z > 20) o.position.z -= 200; }

  // 車
  const tx = t - mouseT < 2.5 ? mx * 3.2 : Math.sin(t * .35) * 2.8 * Math.sin(t * .13 + 1);
  const px = car.position.x;
  car.position.x += (tx - px) * Math.min(1, dt * 2.5);
  carV += ((car.position.x - px) / Math.max(dt, .001) - carV) * Math.min(1, dt * 6);
  car.rotation.y = -carV * .06; car.rotation.z = carV * .012;
  car.position.y = Math.sin(t * 17) * .012;
  cam.position.set(car.position.x * .5, 3.4, 9.5); cam.lookAt(car.position.x * .7, 1, -8);

  // 雪けむり
  if ((puffT -= dt) <= 0) {
    puffT = .05; puffSide *= -1;
    const p = puffs.find(p => !p.visible);
    if (p) { p.visible = true; p.userData.a = 0; p.userData.vx = puffSide * (.4 + Math.random() * .6); p.position.set(car.position.x + puffSide * .85, .3, 2); }
  }
  for (const p of puffs) if (p.visible) {
    const a = (p.userData.a += dt / .6);
    if (a >= 1) { p.visible = false; continue; }
    p.position.x += p.userData.vx * dt; p.position.y += 1.1 * dt; p.position.z += V * .2 * dt;
    p.scale.setScalar(.5 + a * 1.2); p.material.map.offset.x = Math.floor(a * 5) / 5;
  }
  // 雪面のきらめき
  if ((starT -= dt) <= 0) {
    starT = .09;
    const st = stars.find(o => !o.visible);
    if (st) {
      const x = (Math.random() < .5 ? -1 : 1) * (4.8 + Math.random() * 9), z = -30 + Math.random() * 24;
      st.position.set(x, hgt(x, z - s + 30) + .35, z); st.visible = true; st.userData.a = 0; st.scale.setScalar(.7 + Math.random() * .5);
    }
  }
  for (const st of stars) if (st.visible) {
    const a = (st.userData.a += dt / .45);
    if (a >= 1) { st.visible = false; continue; }
    st.position.z += V * dt; st.material.map.offset.x = Math.floor(a * 4) / 4;
  }
  // 雪
  for (let i = 0; i < N; i++) {
    const k = i * 3;
    fp[k] += Math.sin(t + i) * .4 * dt; fp[k + 1] -= (1.3 + (i % 5) * .2) * dt; fp[k + 2] += V * .5 * dt;
    if (fp[k + 1] < 0) fp[k + 1] += 14;
    if (fp[k + 2] > 12) fp[k + 2] -= 57;
  }
  flakeG.attributes.position.needsUpdate = true;

  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
