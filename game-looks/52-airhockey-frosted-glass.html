<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 52 エアホッケー すりガラス越し</title>
<style>
html,body{margin:0;height:100%;background:#0a0d14;overflow:hidden;display:grid;place-items:center}
canvas{width:min(100vw,160vh);aspect-ratio:8/5;display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#dfe8f0;opacity:.8}
</style>
<canvas id="c"></canvas>
<div id="cap">LOOK 52 ─ エアホッケー / くもったガラス越し　｜　見るだけ（指でぬぐった所だけはっきり見える）</div>
<script>
// 試合は別の画面にふつうに描き、それを 1/12 に縮めてから引きのばして「くもり」にする。
// 指でぬぐった跡と、そこから垂れたしずくの筋だけ、縮めていない絵を切りぬいて重ねる
const LW = 960, LH = 600, S = Math.min(devicePixelRatio || 1, 2);
const cv = document.getElementById('c'); cv.width = LW * S; cv.height = LH * S; const g = cv.getContext('2d');
const mkc = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const sc = mkc(LW, LH), s = sc.getContext('2d'), small = mkc(80, 50), sm = small.getContext('2d');
const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
const grain = mkc(240, 150); { const q = grain.getContext('2d'), im = q.createImageData(240, 150); for (let i = 0; i < im.data.length; i += 4) { const v = Math.random(); im.data[i] = im.data[i + 1] = im.data[i + 2] = 255; im.data[i + 3] = v * v * 60; } q.putImageData(im, 0, 0); }
const X0 = 90, X1 = 870, Y0 = 90, Y1 = 510;
const puck = { x: 480, y: 300, vx: 420, vy: 230 }, mal = [{ x: 200, y: 300, c: '#ff3fa0' }, { x: 760, y: 300, c: '#3dff9a' }];
const glow = (x, y, r, c) => { s.shadowColor = c; s.shadowBlur = 30; s.fillStyle = c; s.beginPath(); s.arc(x, y, r, 0, 7); s.fill(); s.shadowBlur = 0; s.fillStyle = 'rgba(255,255,255,.7)'; s.beginPath(); s.arc(x, y, r * .45, 0, 7); s.fill(); };
// ぬぐった跡（指の通り道）と、垂れた筋
const wipe = [[250, 400], [330, 330], [420, 270], [520, 250], [610, 280], [680, 340]], drips = [[300, 400, 150], [470, 300, 210], [640, 330, 120], [560, 290, 260]];
const drops = [...Array(46)].map((_, i) => ({ x: hash(i, 1) * LW, y: hash(i, 2) * LH, r: 2 + hash(i, 3) * 5 }));
let last = performance.now(), t = 0;
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt;
  puck.x += puck.vx * dt; puck.y += puck.vy * dt;
  if (puck.x < X0 + 16) { puck.x = X0 + 16; puck.vx = Math.abs(puck.vx); } if (puck.x > X1 - 16) { puck.x = X1 - 16; puck.vx = -Math.abs(puck.vx); }
  if (puck.y < Y0 + 16) { puck.y = Y0 + 16; puck.vy = Math.abs(puck.vy); } if (puck.y > Y1 - 16) { puck.y = Y1 - 16; puck.vy = -Math.abs(puck.vy); }
  mal.forEach((m, i) => {
    const mine = i ? puck.x > 480 : puck.x < 480, tx = mine ? puck.x + (i ? 40 : -40) : (i ? 760 : 200), ty = mine ? puck.y : 300 + Math.sin(t * 1.3 + i) * 80;
    m.x += (tx - m.x) * Math.min(1, dt * 5); m.y += (ty - m.y) * Math.min(1, dt * 6); m.x = i ? Math.max(500, Math.min(X1 - 30, m.x)) : Math.max(X0 + 30, Math.min(460, m.x));
    const dx = puck.x - m.x, dy = puck.y - m.y, d = Math.hypot(dx, dy); if (d < 46 && d > 0) { const sp = 560; puck.vx = dx / d * sp; puck.vy = dy / d * sp + (hash(t, i) - .5) * 200; puck.x = m.x + dx / d * 46; puck.y = m.y + dy / d * 46; }
  });
  // 試合の絵
  s.fillStyle = '#0b1230'; s.fillRect(0, 0, LW, LH); s.fillStyle = '#101c48'; s.beginPath(); s.roundRect(X0, Y0, X1 - X0, Y1 - Y0, 40); s.fill();
  s.strokeStyle = '#3fd8ff'; s.lineWidth = 5; s.shadowColor = '#3fd8ff'; s.shadowBlur = 24; s.beginPath(); s.roundRect(X0, Y0, X1 - X0, Y1 - Y0, 40); s.stroke();
  s.lineWidth = 3; s.beginPath(); s.moveTo(480, Y0); s.lineTo(480, Y1); s.stroke(); s.beginPath(); s.arc(480, 300, 70, 0, 7); s.stroke(); s.shadowBlur = 0;
  s.fillStyle = '#ffe14a'; s.fillRect(X0 - 6, 230, 12, 140); s.fillRect(X1 - 6, 230, 12, 140);
  for (const m of mal) glow(m.x, m.y, 30, m.c); glow(puck.x, puck.y, 16, '#fff06a');
  // くもりガラス
  sm.drawImage(sc, 0, 0, 80, 50);
  g.setTransform(S, 0, 0, S, 0, 0); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high'; g.drawImage(small, 0, 0, LW, LH);
  g.fillStyle = 'rgba(190,210,225,.2)'; g.fillRect(0, 0, LW, LH);
  for (let y = 0; y < LH; y += 150) for (let x = 0; x < LW; x += 240) g.drawImage(grain, x, y);
  // ぬぐった所だけ、はっきり
  g.save(); g.beginPath();
  for (let i = 0; i < wipe.length - 1; i++) for (let k = 0; k < 8; k++) { const x = wipe[i][0] + (wipe[i + 1][0] - wipe[i][0]) * k / 8, y = wipe[i][1] + (wipe[i + 1][1] - wipe[i][1]) * k / 8, r = 46 + Math.sin(i * 3 + k) * 7; g.moveTo(x + r, y); g.arc(x, y, r, 0, 6.3); }
  for (const [x, y, len] of drips) { const l = len * (.7 + .3 * Math.sin(t * .2 + x)); g.rect(x - 3, y, 6, l); g.moveTo(x + 6, y + l); g.arc(x, y + l, 6, 0, 6.3); }
  g.clip(); g.drawImage(sc, 0, 0); g.fillStyle = 'rgba(190,210,225,.05)'; g.fillRect(0, 0, LW, LH); g.restore();
  // 水滴
  for (const d of drops) { const gr = g.createRadialGradient(d.x - d.r * .3, d.y + d.r * .4, 0, d.x, d.y, d.r); gr.addColorStop(0, 'rgba(255,255,255,.55)'); gr.addColorStop(.6, 'rgba(255,255,255,.08)'); gr.addColorStop(1, 'rgba(0,10,30,.45)'); g.fillStyle = gr; g.beginPath(); g.arc(d.x, d.y, d.r, 0, 7); g.fill(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
