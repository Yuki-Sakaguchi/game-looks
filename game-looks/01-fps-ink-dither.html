<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 01 FPS インクとディザ</title>
<style>
html,body{margin:0;height:100%;background:#1a1433;overflow:hidden}
canvas{width:100vw;height:100vh;display:block;image-rendering:pixelated;cursor:crosshair}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#f2e8c9;text-shadow:0 1px 0 #1a1433}
</style>
<canvas id="c"></canvas>
<div id="cap">LOOK 01 ─ FPS / インクとディザ　｜　マウスで見回す・クリックで撃つ</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// 立体は灰色だけで描き、最後に 4 色のインク＋差し色 1 色へ落とす
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
const H = 180; let W = 320;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(new THREE.Color(.02, .02, .02), 5, 38);
const cam = new THREE.PerspectiveCamera(72, 16 / 9, .05, 140);
cam.rotation.order = 'YXZ'; cam.position.set(0, 1.6, 0); scene.add(cam);
const rt = new THREE.WebGLRenderTarget(W, H);
rt.texture.minFilter = rt.texture.magFilter = THREE.NearestFilter;

const gray = v => new THREE.MeshLambertMaterial({ color: new THREE.Color(v, v, v), flatShading: true });
const box = (w, h, d, m) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
const hash = (a, b, c) => { const s = Math.sin(a * 12.9898 + b * 78.233 + c * 37.719) * 43758.5453; return s - Math.floor(s); };

// 空（灰色のグラデーション。ディザで帯になる）と月
{
  const g = new THREE.PlaneGeometry(420, 90, 1, 10);
  const p = g.attributes.position, col = [];
  for (let i = 0; i < p.count; i++) { const f = (p.getY(i) + 45) / 90; const v = .42 * Math.pow(1 - f, 2.2) + .004; col.push(v, v, v); }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  const sky = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, fog: false }));
  sky.position.set(0, 42, -125); scene.add(sky);
  const moon = new THREE.Mesh(new THREE.CircleGeometry(9, 28), new THREE.MeshBasicMaterial({ color: new THREE.Color(1, 1, 1), fog: false }));
  moon.position.set(24, 30, -122); scene.add(moon);
}

scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, .55));
const moonLight = new THREE.DirectionalLight(0xffffff, 2.4); moonLight.position.set(24, 30, -60); scene.add(moonLight);
const torch = new THREE.PointLight(0xffffff, 14, 18, 2); cam.add(torch);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(18, 100), gray(.32));
floor.rotation.x = -Math.PI / 2; floor.position.z = -42; scene.add(floor);

// 列柱の遺跡。カメラは動かさず、世界を手前に流して繰り返す
const L = 40, movers = [];
for (let i = 0; i < 8; i++) {
  const g = new THREE.Group(); g.position.z = -i * 5;
  for (const s of [-1, 1]) {
    const broken = s > 0 && i % 3 === 1;
    const h = broken ? 1.5 : 4.2;
    const p = box(.9, h, .9, gray(.6)); p.position.set(s * 3.4, h / 2, 0); g.add(p);
    if (!broken) { const c = box(1.25, .3, 1.25, gray(.75)); c.position.set(s * 3.4, 4.35, 0); g.add(c); }
    if (i % 4 !== 3) { const w = box(.6, 2.4, 5, gray(.28)); w.position.set(s * 6.6, 1.2, 0); g.add(w); }
  }
  if (i % 2 === 0) { const b = box(7.9, .5, .7, gray(.5)); b.position.set(0, 4.75, 0); g.add(b); }
  const line = box(7, .02, .18, gray(.12)); line.position.y = .01; g.add(line);
  if (i % 3 === 2) { const cr = box(.8, .8, .8, gray(.45)); cr.position.set(i % 2 ? 2.2 : -2.3, .4, 1.5); cr.rotation.y = i; g.add(cr); }
  scene.add(g); movers.push(g);
}

// 8×8 のドット絵のコマを横に並べたテクスチャ
function atlas(n, fn) {
  const c = document.createElement('canvas'); c.width = 8 * n; c.height = 8;
  const g = c.getContext('2d');
  for (let f = 0; f < n; f++) for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    const col = fn(f, x, y); if (col) { g.fillStyle = col; g.fillRect(f * 8 + x, y, 1, 1); }
  }
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; t.repeat.set(1 / n, 1);
  return t;
}
const HOT = '#ff0050', WHITE = '#ffffff';
const boomTex = atlas(6, (f, x, y) => {
  const d = Math.hypot(x - 3.5, y - 3.5), r = .6 + f * .75;
  if (f < 2) return d < r + .6 ? (d < r - .4 ? WHITE : HOT) : null;
  return Math.abs(d - r) < .8 && hash(x, y, f) > .2 + f * .08 ? (hash(y, x, f) > .6 ? WHITE : HOT) : null;
});
const flashTex = atlas(3, (f, x, y) => {
  const a = Math.abs(x - 3.5), b = Math.abs(y - 3.5);
  const on = f === 0 ? (a < 1 || b < 1) && a + b < 4.6 : f === 1 ? a + b < 3.2 : Math.abs(a - b) < 1 && a < 3.6;
  return on ? (a + b < 2 ? WHITE : HOT) : null;
});
const sprite = (tex, size) => {
  const t = tex.clone(); t.needsUpdate = true;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, alphaTest: .5, fog: false }));
  s.scale.set(size, size, 1); s.visible = false; return s;
};

// 敵は差し色だけで塗る（霧もかけない）
const accent = new THREE.MeshBasicMaterial({ color: new THREE.Color(1, 0, .3), fog: false });
const enemies = [];
function respawn(m, z) {
  m.position.set((Math.random() * 2 - 1) * 2.4, 1 + Math.random() * 1.6, z ?? -38 - Math.random() * 6);
  m.userData.ph = Math.random() * 6; m.userData.y = m.position.y;
}
for (let i = 0; i < 6; i++) {
  const m = new THREE.Mesh(new THREE.OctahedronGeometry(.5), accent);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(.78, .07, 4, 8), gray(.95)); m.add(ring);
  respawn(m, -9 - i * 5); scene.add(m); enemies.push(m);
}

// 銃
const gun = new THREE.Group(); gun.position.set(.3, -.28, -.55); cam.add(gun);
// 銃は手元の灯りで白く飛ぶので、光を受けない固定の灰色で塗る
const flat = v => new THREE.MeshBasicMaterial({ color: new THREE.Color(v, v, v), fog: false });
gun.add(box(.1, .14, .5, flat(.035)));
const top = box(.1, .02, .5, flat(.3)); top.position.y = .08; gun.add(top);
const barrel = box(.05, .05, .35, flat(.16)); barrel.position.set(0, .03, -.4); gun.add(barrel);
const grip = box(.08, .18, .1, flat(.008)); grip.position.set(0, -.14, .15); gun.add(grip);
const muzzle = new THREE.Object3D(); muzzle.position.set(0, .03, -.62); gun.add(muzzle);
const flash = sprite(flashTex, .36); flash.material.depthTest = false; muzzle.add(flash);
const tracer = box(.05, .05, 1, accent); tracer.visible = false; scene.add(tracer);
const booms = [0, 1, 2, 3].map(() => { const s = sprite(boomTex, 2.4); scene.add(s); return s; });

// 仕上げ: 明るさを 4 段のインクに落とし、段の境目を 4×4 のディザで混ぜる。赤みの強い画素だけ差し色にする
const post = new THREE.ShaderMaterial({
  uniforms: { t: { value: rt.texture } },
  vertexShader: `varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,
  fragmentShader: `
    uniform sampler2D t;varying vec2 vUv;
    float b2(vec2 a){a=floor(a);return fract(a.x/2.+a.y*a.y*.75);}
    float b4(vec2 a){return b2(.5*a)*.25+b2(a);}
    void main(){
      vec3 c=texture2D(t,vUv).rgb;
      float l=pow(clamp(dot(c,vec3(.3,.59,.11)),0.,1.),.5);
      float i=floor(l*3.+b4(gl_FragCoord.xy));
      vec3 p0=vec3(.102,.078,.2),p1=vec3(.25,.22,.5),p2=vec3(.46,.7,.68),p3=vec3(.95,.91,.79);
      vec3 o=i<.5?p0:i<1.5?p1:i<2.5?p2:p3;
      if(c.r-c.g>.3)o=vec3(1.,.3,.46);
      gl_FragColor=vec4(o,1.);
    }`
});
const ps = new THREE.Scene(); const pq = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post); pq.frustumCulled = false; ps.add(pq);
const pc = new THREE.Camera();

function resize() {
  W = Math.round(H * innerWidth / innerHeight);
  renderer.setSize(W, H, false); rt.setSize(W, H);
  cam.aspect = W / H; cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let mx = 0, my = 0;
addEventListener('pointermove', e => { mx = e.clientX / innerWidth * 2 - 1; my = e.clientY / innerHeight * 2 - 1; });
addEventListener('pointerdown', () => fire());

const v1 = new THREE.Vector3(), v2 = new THREE.Vector3();
let cool = 1, kick = 0, tracerT = 0, flashF = 9, aim = 0;
function nearest() {
  let best = null;
  for (const e of enemies) { const z = e.position.z; if (z < -5 && z > -26 && (!best || z > best.position.z)) best = e; }
  return best;
}
function fire() {
  const e = nearest(); if (!e) return;
  cool = .6; kick = 1;
  cam.updateMatrixWorld(); muzzle.getWorldPosition(v1); v2.copy(e.position);
  tracer.position.copy(v1).lerp(v2, .5); tracer.lookAt(v2); tracer.scale.z = v1.distanceTo(v2);
  tracer.visible = true; tracerT = .07;
  flash.visible = true; flashF = 0;
  const b = booms.find(b => !b.visible) || booms[0];
  b.position.copy(v2); b.visible = true; b.userData.a = 0;
  respawn(e);
}

const SPEED = 5;
let last = performance.now(), t = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
  for (const g of movers) { g.position.z += SPEED * dt; if (g.position.z > 5) g.position.z -= L; }
  for (const e of enemies) {
    e.position.z += SPEED * .55 * dt; e.position.y = e.userData.y + Math.sin(t * 2 + e.userData.ph) * .15;
    e.rotation.y += dt * 2; e.rotation.x += dt;
    if (e.position.z > -1) respawn(e);
  }
  const target = nearest();
  aim += ((target ? Math.atan2(-target.position.x, -target.position.z) : 0) - aim) * Math.min(1, dt * 5);
  cam.rotation.y = aim * .7 - mx * .5 + Math.sin(t * .3) * .04;
  cam.rotation.x = -my * .25;
  cam.position.y = 1.6 + Math.sin(t * 7) * .035;

  cool -= dt; if (cool <= 0) fire();
  kick = Math.max(0, kick - dt * 7);
  gun.position.z = -.55 + kick * .07; gun.rotation.x = kick * .12;
  gun.position.y = -.28 + Math.sin(t * 7) * .008;
  if (tracer.visible && (tracerT -= dt) <= 0) tracer.visible = false;
  if (flash.visible) { flashF += dt * 36; if (flashF >= 3) flash.visible = false; else flash.material.map.offset.x = Math.floor(flashF) / 3; }
  for (const b of booms) if (b.visible) {
    b.userData.a += dt * 14; b.position.z += SPEED * .55 * dt;
    if (b.userData.a >= 6) b.visible = false; else b.material.map.offset.x = Math.floor(b.userData.a) / 6;
  }

  renderer.setRenderTarget(rt); renderer.render(scene, cam);
  renderer.setRenderTarget(null); renderer.render(ps, pc);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
