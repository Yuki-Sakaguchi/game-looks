<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 15 深海探索 生物発光</title>
<style>
html,body{margin:0;height:100%;background:#01040c;overflow:hidden}
canvas{width:100vw;height:100vh;display:block;cursor:none}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#8fe8ff;opacity:.7}
</style>
<canvas id="c"></canvas>
<div id="cap">LOOK 15 ─ 深海探索 / 生物発光　｜　マウスで探査機を動かす（放っておくと自動）</div>
<script>
// まっ暗な海に、光る点だけで生き物を描く。点はぼんやりした光の粒を加算で重ねる。
// 探査機が近づいたプランクトンだけが光り、通ったあとに光の帯が残る
const cv = document.getElementById('c'), g = cv.getContext('2d');
let W, H, S;
function resize() { S = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * S; cv.height = H * S; g.setTransform(S, 0, 0, S, 0, 0); }
addEventListener('resize', resize); resize();
const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
function glow(rgb) {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, `rgba(255,255,255,1)`); gr.addColorStop(.12, `rgba(${rgb},.9)`); gr.addColorStop(.4, `rgba(${rgb},.18)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64); return c;
}
const CYAN = glow('90,230,255'), TEAL = glow('80,255,190'), VIOLET = glow('170,120,255'), PINK = glow('255,120,200'), AMBER = glow('255,190,90'), WHITE = glow('230,240,255');
const dot = (x, y, r, spr, a) => { if (a <= .01) return; g.globalAlpha = Math.min(1, a); g.drawImage(spr, x - r, y - r, r * 2, r * 2); };

const plankton = [...Array(320)].map((_, i) => ({ x: hash(i, 1), y: hash(i, 2), b: 0, wait: -1 }));
const jellies = [...Array(5)].map((_, i) => ({ x: hash(i, 3), y: hash(i, 4), s: 38 + hash(i, 5) * 44, ph: i * 1.7, spr: i % 2 ? PINK : VIOLET }));
const schools = [0, 1].map(i => ({ ph: i * 3, spr: i ? TEAL : AMBER, fish: [...Array(26)].map((_, k) => ({ ox: (hash(k, i + 7) - .5) * 150, oy: (hash(k, i + 8) - .5) * 70, ph: hash(k, i + 9) * 6 })) }));
const snow = [...Array(90)].map((_, i) => ({ x: hash(i, 11), y: hash(i, 12), v: 6 + hash(i, 13) * 10 }));
const sub = { x: 300, y: 300, trail: [] };
let mx = null, my = null, mouseT = -9;
addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; mouseT = t; });

let t = 0, last = performance.now(), scroll = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt; scroll += 14 * dt;
  // 前のコマを 7 割に暗くしてから、ごく薄い青を足す（光の尾が残り、消え残りは出ない）
  g.globalAlpha = 1; g.globalCompositeOperation = 'multiply'; g.fillStyle = '#b4b4b4'; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'lighter'; g.fillStyle = 'rgb(0,1,4)'; g.fillRect(0, 0, W, H);
  const wrapX = x => ((x * W * 1.2 - scroll) % (W * 1.2) + W * 1.2) % (W * 1.2) - W * .1;

  // 探査機
  const tx = t - mouseT < 3 ? mx : W * (.5 + .32 * Math.sin(t * .23)), ty = t - mouseT < 3 ? my : H * (.5 + .3 * Math.sin(t * .37 + 1));
  sub.x += (tx - sub.x) * Math.min(1, dt * 2); sub.y += (ty - sub.y) * Math.min(1, dt * 2);
  sub.trail.unshift([sub.x, sub.y]); if (sub.trail.length > 40) sub.trail.pop();
  sub.trail.forEach(([x, y], i) => { if (i % 3 === 0) dot(x + scroll * 0 - i * .25, y, 7 - i * .12, CYAN, .5 - i * .012); });
  dot(sub.x, sub.y, 70, CYAN, .22); dot(sub.x, sub.y, 16, WHITE, 1);

  // 降る雪（マリンスノー）
  for (const s of snow) dot(wrapX(s.x), (s.y * H + t * s.v) % H, 2.2, WHITE, .16);

  // プランクトン: 近づくと、距離に応じた遅れで光る（光の波になる）
  for (const p of plankton) {
    const x = wrapX(p.x), y = p.y * H + Math.sin(t * .5 + p.x * 40) * 6, d = Math.hypot(x - sub.x, y - sub.y);
    if (d < 130 && p.wait < 0 && p.b < .2) p.wait = d / 320;
    if (p.wait >= 0 && (p.wait -= dt) < 0) p.b = 1;
    p.b = Math.max(0, p.b - dt * .7);
    dot(x, y, 4 + p.b * 8, p.b > .5 ? WHITE : CYAN, .16 + p.b);
  }

  // くらげ（かさの縁の点と、ゆれる足の点）
  for (const j of jellies) {
    const pulse = .5 + .5 * Math.sin(t * 1.6 + j.ph), x = wrapX(j.x) + Math.sin(t * .3 + j.ph) * 20;
    const y = ((j.y * H - t * 9) % (H + 200) + H + 200) % (H + 200) - 100 - pulse * 8, w = j.s * (.8 + .25 * pulse), h = j.s * (.75 - .2 * pulse);
    for (let k = 0; k <= 14; k++) { const a = Math.PI + k / 14 * Math.PI; dot(x + Math.cos(a) * w, y + Math.sin(a) * h, 6, j.spr, .75); }
    for (let k = 0; k < 6; k++) { const a = Math.PI + (k + .5) / 6 * Math.PI; dot(x + Math.cos(a) * w * .5, y + Math.sin(a) * h * .5, 4, WHITE, .35); }
    for (let k = 0; k < 5; k++) for (let n = 1; n <= 9; n++)
      dot(x + (k - 2) * w * .42 + Math.sin(t * 2 + n * .7 + k + j.ph) * n * 1.4, y + n * j.s * .2, 4.5 - n * .3, j.spr, .55 - n * .05);
  }

  // 魚の群れ（頭の点と、うしろに 2 点）
  for (const sc of schools) {
    const cx = W * (.5 + .45 * Math.sin(t * .17 + sc.ph)), cy = H * (.5 + .32 * Math.sin(t * .29 + sc.ph * 2));
    const vx = Math.cos(t * .17 + sc.ph), vy = Math.cos(t * .29 + sc.ph * 2) * .6, l = Math.hypot(vx, vy) || 1;
    for (const f of sc.fish) {
      const x = cx + f.ox + Math.sin(t * 1.3 + f.ph) * 12, y = cy + f.oy + Math.cos(t * 1.7 + f.ph) * 8;
      dot(x, y, 5, sc.spr, .9); dot(x - vx / l * 7, y - vy / l * 7, 3.5, sc.spr, .5); dot(x - vx / l * 13, y - vy / l * 13, 2.5, sc.spr, .3);
    }
  }

  // ちょうちんあんこう: 明かりだけ見えていて、近づくと口の形が浮かぶ
  const ax = W * .82 + Math.sin(t * .2) * 40, ay = H * .72 + Math.sin(t * .31) * 30, near = Math.max(0, 1 - Math.hypot(ax - sub.x, ay - sub.y) / 260);
  dot(ax, ay, 12 + 4 * Math.sin(t * 5), AMBER, .7 + .3 * Math.sin(t * 5));
  for (let k = 0; k <= 12; k++) { const a = .3 + k / 12 * 2.5; dot(ax + 46 + Math.cos(a) * 44, ay + 52 + Math.sin(a) * 30, 4, PINK, near * .8); if (k % 2) dot(ax + 46 + Math.cos(a) * 34, ay + 52 + Math.sin(a) * 20, 3, WHITE, near * .9); }
  dot(ax + 30, ay + 26, 5, WHITE, near);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
