<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 30 ゴルフ 点描</title>
<style>
html,body{margin:0;height:100%;background:#f1ead8;overflow:hidden}
canvas{width:100vw;height:100vh;display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#3a3a4a;background:#f1ead8;padding:0 6px}
</style>
<canvas id="c"></canvas>
<div id="cap">LOOK 30 ─ ゴルフ / 点描　｜　見るだけ（自動で打つ）</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// 画面を小さな絵の具の点だけで作る。少しずつずらした格子の点を 2 層重ね、点の色はその場所の色を濃くしたもの。
// 3 割の点はわざと色相をずらす（緑の中に黄や青の点がまじり、離れて見ると混ざって見える）。点のすきまは紙の色
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fd0f0); scene.fog = new THREE.Fog(0xbfe0f0, 40, 140);
const cam = new THREE.PerspectiveCamera(50, 1, .1, 300); cam.position.set(0, 3.4, 14); cam.lookAt(0, 1.5, -20);
scene.add(new THREE.HemisphereLight(0xffffff, 0x4a7a4a, 1.6));
const sun = new THREE.DirectionalLight(0xfff0c0, 2.2); sun.position.set(-6, 10, 4); scene.add(sun);

const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
const lam = c => new THREE.MeshLambertMaterial({ color: c });
const mesh = (geo, m, x = 0, y = 0, z = 0) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); scene.add(o); return o; };
const flat = (r, sx, sz, c, x, y, z) => { const g = new THREE.CircleGeometry(r, 28); g.rotateX(-Math.PI / 2); g.scale(sx, 1, sz); return mesh(g, lam(c), x, y, z); };

flat(160, 1, 1, 0x3f8a3a, 0, 0, -40);                         // ラフ
flat(9, 1, 3.6, 0x7fc84a, 0, .02, -12); flat(8, 1.2, 1, 0xa8e060, 1, .04, -42);   // フェアウェイ、グリーン
flat(3, 1.4, 1, 0xf0e0a8, -9, .03, -34); flat(2.4, 1, 1.5, 0xf0e0a8, 9, .03, -26); flat(6, 1.6, 1, 0x4a90d8, 13, .03, -48);   // バンカー、池
flat(1.6, 1, 1, 0x6fb04a, 0, .03, 8);
for (let i = 0; i < 46; i++) {
  const s = i % 2 ? 1 : -1, x = s * (11 + hash(i, 1) * 26), z = 6 - hash(i, 2) * 90, r = 1.6 + hash(i, 3) * 1.8;
  mesh(new THREE.CylinderGeometry(.2, .3, r * 1.4, 6), lam(0x6a4a2a), x, r * .7, z);
  mesh(new THREE.SphereGeometry(r, 10, 8), lam([0x2f7a3a, 0x4f9a3a, 0x6f8a2a, 0x2a6a4a][i % 4]), x, r * 1.9, z);
}
for (let i = 0; i < 6; i++) { const c = mesh(new THREE.SphereGeometry(5, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, fog: false }), -70 + i * 30, 30 + hash(i, 7) * 12, -120); c.scale.set(2 + hash(i, 8), .6, 1); }
mesh(new THREE.CylinderGeometry(.05, .05, 3, 6), lam(0xffffff), 1, 1.5, -42);
const flag = mesh(new THREE.BoxGeometry(1.1, .7, .04), lam(0xe8332a), 1.55, 2.6, -42);
const ball = mesh(new THREE.SphereGeometry(.22, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }), 0, .22, 8);
// 打つ人
const golfer = new THREE.Group(); golfer.position.set(-.9, 0, 8.2); scene.add(golfer);
const part = (w, h, d, c, x, y, z) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), lam(c)); o.position.set(x, y, z); golfer.add(o); return o; };
part(.5, .8, .3, 0xe8433a, 0, 1.3, 0); part(.32, .32, .32, 0xf0c8a0, 0, 1.9, 0); part(.2, .9, .2, 0x2a3a6a, -.14, .45, 0); part(.2, .9, .2, 0x2a3a6a, .14, .45, 0);
const club = new THREE.Group(); club.position.set(.3, 1.5, 0); golfer.add(club); { const s = new THREE.Mesh(new THREE.BoxGeometry(.06, 1.5, .06), lam(0xdddddd)); s.position.y = -.75; club.add(s); }

const rt = new THREE.WebGLRenderTarget(4, 4);
const post = new THREE.ShaderMaterial({
  uniforms: { t: { value: rt.texture }, res: { value: new THREE.Vector2() }, dpr: { value: 1 } },
  vertexShader: `void main(){gl_Position=vec4(position.xy,0.,1.);}`,
  fragmentShader: `
    uniform sampler2D t;uniform vec2 res;uniform float dpr;
    float h1(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
    vec4 layer(vec2 p,float seed){
      vec2 ip=floor(p);float best=9.;vec2 bc=ip,bi=ip;
      for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){vec2 id=ip+vec2(float(i),float(j));vec2 c=id+.5+(vec2(h1(id+seed),h1(id+seed+7.3))-.5)*.75;float d=length(p-c);if(d<best){best=d;bc=c;bi=id;}}
      vec3 c=pow(texture2D(t,(bc-seed*.5)*6.*dpr/res).rgb,vec3(.4545));
      float h=h1(bi+seed*3.1);
      c=mix(vec3(dot(c,vec3(.3,.59,.11))),c,1.6);
      if(h>.7)c=mix(c,c.gbr,.4);else if(h<.12)c=mix(c,c.brg,.35);
      c+=(h1(bi+2.)-.5)*.14;
      return vec4(clamp(c,0.,1.),smoothstep(.5,.4,best));
    }
    void main(){
      vec2 p=gl_FragCoord.xy/dpr/6.;
      vec3 o=vec3(.945,.92,.85);
      vec4 a=layer(p+.5,1.),b=layer(p,0.);
      o=mix(o,a.rgb,a.a);o=mix(o,b.rgb,b.a);
      gl_FragColor=vec4(o,1.);
    }`
});
const ps = new THREE.Scene(); const pq = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post); pq.frustumCulled = false; ps.add(pq);
const pc = new THREE.Camera();
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  const s = renderer.getDrawingBufferSize(new THREE.Vector2()); rt.setSize(s.x, s.y); post.uniforms.res.value.copy(s); post.uniforms.dpr.value = renderer.getPixelRatio();
  cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let t = 0, last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt;
  const u = t % 6;   // 0〜1 構える、1 で打つ、1〜4 飛ぶ、4〜6 転がって止まる
  club.rotation.z = u < .8 ? -u * 2.2 : u < 1 ? -1.76 + (u - .8) * 22 : Math.max(.4, 2.6 - (u - 1) * 2);
  if (u < 1) ball.position.set(0, .22, 8);
  else { const f = Math.min(1, (u - 1) / 3), g = Math.min(1, Math.max(0, (u - 4) / 1.5)); ball.position.set(f * .6 + g * .3, .22 + Math.sin(f * Math.PI) * 13, 8 - f * 47 - g * (2 - g) * 1.5); }
  flag.rotation.y = Math.sin(t * 3) * .3;
  renderer.setRenderTarget(rt); renderer.render(scene, cam);
  renderer.setRenderTarget(null); renderer.render(ps, pc);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
