<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 26 3Dパズル 影だけの白い世界</title>
<style>
html,body{margin:0;height:100%;background:#fff;overflow:hidden}
canvas{width:100vw;height:100vh;display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#8a93b8}
</style>
<canvas id="c"></canvas>
<div id="cap">LOOK 26 ─ 3Dパズル / 影だけの白い世界　｜　見るだけ（光がまわると形が現れる）</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// 床も壁も玉もすべて真っ白で、陰影もつけない。見えるのは青みがかった「影」だけ。
// 光の向きがゆっくり回るので、影の伸び方から建物の形や高さが読める。色はゴールの赤ひとつ
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xffffff);
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, .1, 100); cam.position.set(14, 14, 14); cam.lookAt(0, .5, 0);
const sun = new THREE.DirectionalLight(0xffffff, 1); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.radius = 3; sun.shadow.bias = -.0006; sun.shadow.normalBias = .03;
Object.assign(sun.shadow.camera, { left: -13, right: 13, top: 13, bottom: -13, near: 1, far: 60 }); scene.add(sun);

const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
const WHITE = new THREE.MeshBasicMaterial({ color: 0xffffff });
const SHADE = new THREE.ShadowMaterial({ color: 0x4a5a9a, opacity: .5, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 });
// 白い本体（影を落とす）と、影だけを映す薄皮を重ねる
function solid(geo, x, y, z, parent = scene) {
  const g = new THREE.Group(); g.position.set(x, y, z);
  const a = new THREE.Mesh(geo, WHITE); a.castShadow = true; const b = new THREE.Mesh(geo, SHADE); b.receiveShadow = true; g.add(a, b); parent.add(g); return g;
}
const box = (w, h, d, x, z, y = 0) => solid(new THREE.BoxGeometry(w, h, d), x, y + h / 2, z);

solid(new THREE.BoxGeometry(18, .4, 18), 0, -.2, 0);
// 塔、壁、階段、門、円柱
const G = 1.5, blocked = new Set();
for (let x = -5; x <= 5; x++) for (let z = -5; z <= 5; z++) {
  const h = hash(x, z);
  if ((x + z) % 2 === 0 && h > .45 && !(Math.abs(x) < 1 && Math.abs(z) < 1)) { blocked.add(x + ',' + z); box(G * .8, .6 + Math.floor(h * 5) * .7, G * .8, x * G, z * G); }
}
for (let i = 0; i < 5; i++) box(.7, .25 * (i + 1), 1.4, -7.6 + i * .7, 7.2);
box(.4, 3, .4, 6.4, -7.6); box(.4, 3, .4, 8, -7.6); box(2, .4, .5, 7.2, -7.6, 3);
solid(new THREE.CylinderGeometry(.5, .5, 3.4, 20), -7.4, 1.7, -7.4); solid(new THREE.ConeGeometry(.9, 1.2, 20), -7.4, 4, -7.4);
solid(new THREE.TorusGeometry(1, .16, 10, 28), 7.4, 1.4, 7.4);
// 玉とゴール
const ball = solid(new THREE.SphereGeometry(.38, 20, 14), 0, .38, 0);
const goal = new THREE.Mesh(new THREE.BoxGeometry(.5, .34, .08), new THREE.MeshBasicMaterial({ color: 0xe8433a })); scene.add(goal);
const pole = box(.07, 1.3, .07, 0, 0);

// 玉は空いているマスを渡り歩く
let cell = [1, 0], target = [1, 0], from = [1, 0], f = 1, dest;
const open = (x, z) => Math.abs(x) <= 5 && Math.abs(z) <= 5 && !blocked.has(x + ',' + z);
function newGoal() { do { dest = [Math.floor(Math.random() * 11) - 5, Math.floor(Math.random() * 11) - 5]; } while (!open(...dest)); pole.position.set(dest[0] * G + .5, .65, dest[1] * G + .5); goal.position.set(dest[0] * G + .78, 1.1, dest[1] * G + .5); }
newGoal();
function next() {
  // 幅優先でゴールまでの次の一歩を探す
  const q = [cell], prev = new Map([[cell.join(), null]]);
  while (q.length) {
    const c = q.shift(); if (c[0] === dest[0] && c[1] === dest[1]) { let p = c; while (prev.get(p.join()) && prev.get(p.join()) !== cell) p = prev.get(p.join()); return p; }
    for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const n = [c[0] + dx, c[1] + dz]; if (open(...n) && !prev.has(n.join())) { prev.set(n.join(), c); q.push(n); } }
  }
  newGoal(); return cell;
}

function resize() { renderer.setSize(innerWidth, innerHeight, false); const a = innerWidth / innerHeight, h = Math.max(9, 13 / a); cam.left = -h * a; cam.right = h * a; cam.top = h; cam.bottom = -h; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

let t = 0, last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt;
  const a = t * .25, el = .5 + .3 * Math.sin(t * .11);
  sun.position.set(Math.cos(a) * 20 * Math.cos(el), 20 * Math.sin(el) + 4, Math.sin(a) * 20 * Math.cos(el));
  f += dt * 3;
  if (f >= 1) { cell = target; if (cell[0] === dest[0] && cell[1] === dest[1]) newGoal(); from = cell; target = next(); f = 0; }
  const k = f * f * (3 - 2 * f);
  ball.position.set((from[0] + (target[0] - from[0]) * k) * G, .38 + Math.sin(k * Math.PI) * .25, (from[1] + (target[1] - from[1]) * k) * G);
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
