<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 76 ロケット 科学雑誌の断面図</title>
<style>
html,body{margin:0;height:100%;background:#d8cfb8;overflow:hidden;display:grid;place-items:center}
canvas{width:min(100vw,160vh);aspect-ratio:8/5;display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#222;background:#efe7d2;padding:0 6px}
</style>
<canvas id="c"></canvas>
<div id="cap">LOOK 76 ─ ロケット打ち上げ / 昔の科学雑誌の断面図　｜　見るだけ（上がりながら段を切りはなす）</div>
<script>
// 2 色刷りの図解ページ。使うのは黒と朱の 2 版だけで、うすい色は網点（小さな点の集まり）で出す。
// 朱の版は黒から 2 ピクセルずらして重ねる（昔の印刷の版ずれ）。機体は中身が見える断面図で、
// 番号つきの引き出し線と右の説明欄がつながる。切りはなした段の説明には線が引かれる
const LW = 960, LH = 600, S = Math.min(devicePixelRatio || 1, 2);
const cv = document.getElementById('c'); cv.width = LW * S; cv.height = LH * S; const g = cv.getContext('2d');
const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
const INK = '#1c1a17', RED = '#e2552d', PAPER = '#efe7d2', SANS = '"Futura","Avenir Next Condensed","Arial Narrow",Arial,sans-serif';
const tint = (col, r) => { const c = document.createElement('canvas'); c.width = c.height = 6; const q = c.getContext('2d'); q.fillStyle = col; q.beginPath(); q.arc(1.5, 1.5, r, 0, 7); q.arc(4.5, 4.5, r, 0, 7); q.fill(); return g.createPattern(c, 'repeat'); };
const T_RED = tint(RED, 1.25), T_INK = tint(INK, .8), T_INK2 = tint(INK, 1.3);
const X0 = 30, X1 = 610, RX = 320;                    // 絵の欄と、ロケットの中心
const sm = v => { v = Math.max(0, Math.min(1, v)); return v * v * (3 - 2 * v); };
function tag(n, x, y, tx, ty) { g.strokeStyle = INK; g.lineWidth = 1; g.beginPath(); g.moveTo(x, y); g.lineTo(tx, ty); g.stroke(); g.fillStyle = INK; g.beginPath(); g.arc(x, y, 2, 0, 7); g.fill(); g.fillStyle = PAPER; g.beginPath(); g.arc(tx, ty, 10, 0, 7); g.fill(); g.stroke(); g.fillStyle = INK; g.font = `700 12px ${SANS}`; g.textAlign = 'center'; g.fillText(n, tx, ty + 4.5); }
const start = performance.now(), T = 22;
function frame(now) {
  const t = ((now - start) / 1000) % T, lift = sm((t - 2) / 4), alt = t < 2 ? 0 : Math.pow(t - 2, 2) * 40, s1 = t > 9, s2 = t > 15, d1 = Math.max(0, t - 9), d2 = Math.max(0, t - 15);
  g.setTransform(S, 0, 0, S, 0, 0); g.fillStyle = PAPER; g.fillRect(0, 0, LW, LH);
  g.save(); g.beginPath(); g.rect(X0, 30, X1 - X0, 540); g.clip();
  // 空：高くなるほど黒い網点が濃くなり、星が出る
  const dark = sm(alt / 4000); g.globalAlpha = dark; g.fillStyle = T_INK2; g.fillRect(X0, 30, X1 - X0, 540); g.globalAlpha = dark * dark; g.fillStyle = INK; g.fillRect(X0, 30, X1 - X0, 540); g.globalAlpha = 1;
  g.fillStyle = PAPER; for (let i = 0; i < 40; i++) { g.globalAlpha = dark; const y = (hash(i, 2) * 540 + alt * .02) % 540; g.fillRect(X0 + hash(i, 1) * 580, 30 + y, 2, 2); } g.globalAlpha = 1;
  // 雲と地面（下へ流れていく）
  for (let i = 0; i < 7; i++) { const y = 300 - i * 420 + alt * .6; if (y < -60 || y > 640) continue; const x = X0 + 60 + hash(i, 5) * 440; g.fillStyle = PAPER; g.strokeStyle = INK; g.lineWidth = 1.4; g.beginPath(); g.ellipse(x, y, 70, 18, 0, 0, 7); g.ellipse(x + 40, y - 12, 40, 16, 0, 0, 7); g.fill(); g.stroke(); g.fillStyle = T_INK; g.beginPath(); g.ellipse(x, y + 6, 60, 10, 0, 0, 7); g.fill(); }
  const gy = 520 + alt; if (gy < 640) { g.fillStyle = T_INK2; g.fillRect(X0, gy, 600, 200); g.fillStyle = INK; g.fillRect(X0, gy, 600, 2.5); g.strokeStyle = INK; g.lineWidth = 2; g.beginPath(); for (let k = 0; k < 6; k++) { g.moveTo(RX + 70, gy - k * 44); g.lineTo(RX + 110, gy - k * 44); g.moveTo(RX + 70, gy - k * 44); g.lineTo(RX + 110, gy - k * 44 - 44); } g.moveTo(RX + 70, gy); g.lineTo(RX + 70, gy - 264); g.moveTo(RX + 110, gy); g.lineTo(RX + 110, gy - 264); g.stroke(); }
  // ロケット（2 版に分けて描く：0 = 朱、1 = 黒）
  const by = 500 - lift * 150 + Math.sin(t * 40) * (t > 2 ? .8 : 0);
  for (const plate of [0, 1]) { g.save(); if (!plate) { g.translate(2.2, 1.6); g.globalCompositeOperation = 'multiply'; }
    const stage = (y0, h, w, n, off, rot) => { g.save(); g.translate(RX + off, by - y0 + (off ? d1 * d1 * 18 * (n === 1 ? 1 : 0) + d2 * d2 * 18 * (n === 2 ? 1 : 0) : 0)); g.rotate(rot);
      if (!plate) { g.fillStyle = T_RED; g.fillRect(-w + 5, -h + 8, w - 8, h * .42); g.fillStyle = RED; g.fillRect(3, -h * .5, w - 8, h * .44); }
      else { g.strokeStyle = INK; g.lineWidth = 2; g.strokeRect(-w, -h, w * 2, h); g.lineWidth = 1; g.strokeRect(-w + 5, -h + 8, w - 8, h * .42); g.strokeRect(-w + 5, -h * .5, w - 8, h * .44); g.strokeRect(3, -h + 8, w - 8, h * .42); g.strokeRect(3, -h * .5, w - 8, h * .44); g.fillStyle = T_INK; g.fillRect(3, -h + 8, w - 8, h * .42);
        g.fillStyle = INK; for (const ex of [-w * .5, w * .5]) { g.beginPath(); g.moveTo(ex - 6, 0); g.lineTo(ex + 6, 0); g.lineTo(ex + 11, 14); g.lineTo(ex - 11, 14); g.fill(); } }
      g.restore(); };
    if (!s1 || d1 < 3) stage(0, 150, 30, 1, s1 ? -d1 * 26 : 0, s1 ? -d1 * .25 : 0);
    if (!s2 || d2 < 3) stage(152, 100, 24, 2, s2 ? d2 * 26 : 0, s2 ? d2 * .25 : 0);
    // カプセル
    g.save(); g.translate(RX, by - 254);
    if (!plate) { g.fillStyle = RED; g.beginPath(); g.arc(0, -22, 9, 0, 7); g.fill(); g.fillStyle = T_RED; g.beginPath(); g.moveTo(-22, 0); g.lineTo(22, 0); g.lineTo(8, -56); g.lineTo(-8, -56); g.fill(); }
    else { g.strokeStyle = INK; g.lineWidth = 2; g.beginPath(); g.moveTo(-24, 0); g.lineTo(24, 0); g.lineTo(9, -58); g.quadraticCurveTo(0, -76, -9, -58); g.closePath(); g.stroke(); g.lineWidth = 1; g.beginPath(); g.arc(0, -22, 9, 0, 7); g.stroke(); g.fillStyle = INK; g.fillRect(-9, -12, 18, 10); g.fillRect(-1, -92, 2, 20); }
    g.restore();
    // 炎
    if (t > 2) { const fy = by - (s1 ? 152 : 0) - (s2 ? 100 : 0) + 14, fl = 60 + hash(Math.floor(t * 30), 1) * 40; g.save(); g.translate(RX, fy);
      if (!plate) { g.fillStyle = RED; g.beginPath(); g.moveTo(-22, 0); g.quadraticCurveTo(-28, fl * .5, 0, fl); g.quadraticCurveTo(28, fl * .5, 22, 0); g.fill(); g.fillStyle = T_RED; g.beginPath(); g.ellipse(0, fl + 30, 60, 46, 0, 0, 7); g.fill(); }
      else { g.strokeStyle = INK; g.lineWidth = 1.2; g.beginPath(); for (let k = -3; k <= 3; k++) { g.moveTo(k * 6, 4); g.lineTo(k * 9, fl * (.5 + hash(k, Math.floor(t * 20)) * .4)); } g.stroke(); }
      g.restore(); }
    g.restore(); }
  g.restore();
  g.strokeStyle = INK; g.lineWidth = 2; g.strokeRect(X0, 30, X1 - X0, 540);
  // 引き出し線
  tag('1', RX + 4, by - 290, RX - 120, by - 320); if (!s2) { tag('2', RX - 12, by - 220, RX - 130, by - 230); tag('3', RX + 12, by - 180, RX + 130, by - 200); } if (!s1) { tag('4', RX - 15, by - 110, RX - 140, by - 110); tag('5', RX + 15, by - 30, RX + 140, by - 50); }
  // 高度の目盛り
  g.fillStyle = INK; g.font = `600 11px ${SANS}`; g.textAlign = 'left'; for (let k = 0; k < 9; k++) { const km = Math.floor(alt / 400) + k - 1, y = 500 - (km * 400 - alt) * .5; if (y < 40 || y > 560 || km < 0) continue; g.fillRect(X0, y, 14, 1.5); g.fillText(km * 10 + ' km', X0 + 18, y + 4); }
  // 説明欄
  g.textAlign = 'left'; g.fillStyle = INK; g.font = `800 34px ${SANS}`; g.fillText('HOW A', 640, 70); g.fillText('ROCKET', 640, 106); g.fillStyle = RED; g.fillText('CLIMBS', 640, 142); g.fillStyle = INK; g.fillRect(640, 154, 290, 3);
  g.font = `600 12px ${SANS}`; g.fillText('FIG. 76 — A MACHINE IN THREE PARTS, CUT OPEN', 640, 176);
  [['1', 'CREW CAPSULE', 'The only part that comes home.', false], ['2', 'UPPER FUEL TANK', 'Burns last, in thin air.', s2], ['3', 'UPPER OXIDISER', 'Lets fuel burn with no air.', s2], ['4', 'BOOSTER TANKS', 'Empty in about two minutes.', s1], ['5', 'MAIN ENGINES', 'Dropped with the booster.', s1]].forEach(([n, a, b, gone], i) => { const y = 214 + i * 58; g.globalAlpha = gone ? .4 : 1; g.strokeStyle = INK; g.lineWidth = 1.2; g.beginPath(); g.arc(654, y - 4, 11, 0, 7); g.stroke(); g.fillStyle = INK; g.font = `700 13px ${SANS}`; g.textAlign = 'center'; g.fillText(n, 654, y + .5); g.textAlign = 'left'; g.font = `700 16px ${SANS}`; g.fillText(a, 676, y); g.font = '13px Georgia,serif'; g.fillText(b, 676, y + 19); if (gone) { g.fillStyle = RED; g.fillRect(672, y - 6, 200, 2); } g.globalAlpha = 1; });
  g.fillStyle = RED; g.fillRect(640, 506, 290, 40); g.fillStyle = PAPER; g.font = `800 18px ${SANS}`; g.fillText(t < 2 ? 'T MINUS ' + (2 - t).toFixed(1) : 'ALTITUDE  ' + (alt / 40).toFixed(0) + ' KM', 654, 532);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
