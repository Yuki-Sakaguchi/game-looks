<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>好みに合わせたルック 20 案 一覧</title>
<style>
html,body{margin:0;background:#15161a;color:#e8e6df;font:13px/1.5 "Hiragino Sans","Yu Gothic",system-ui,sans-serif}
header{padding:18px 20px 6px}
h1{margin:0;font-size:18px;font-weight:700}
header p{margin:4px 0 0;color:#9a988f;font-size:12px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding:14px 20px 40px}
a.card{display:block;color:inherit;text-decoration:none;background:#1e2026;border:1px solid #2c2f38;border-radius:6px;overflow:hidden}
a.card:hover,a.card:focus-visible{border-color:#e8b44a;outline:none}
.view{position:relative;aspect-ratio:8/5;background:#0c0d10;overflow:hidden}
.view img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.meta{display:flex;gap:10px;padding:8px 10px 9px;align-items:baseline}
.no{font:700 15px ui-monospace,Menlo,monospace;color:#e8b44a}
.genre{color:#9a988f;font-size:11px}
.look{font-weight:600}
.tag{margin-left:auto;font:10px ui-monospace,Menlo,monospace;color:#7fa8d8;border:1px solid #3a4a60;border-radius:3px;padding:0 4px;white-space:nowrap}
</style>
<header>
  <h1>好みに合わせたルック 20 案</h1>
  <p>気に入ってもらった 20 案の傾向（奥行きと光のある場面、ローポリ、ドット絵、カメラごしの映像、小さな模型）で作った第 2 集です。サムネは 3 秒ほどの GIF です。カードを押すと、実際に動くページを別タブで開きます。「3D」は three.js を CDN から読むのでネット接続が要ります。</p>
</header>
<div id="grid"></div>
<script>
// [ファイル名, ジャンル, ルック, 3D なら 1, （あれば）別の場所にあるページ { href, thumb, no, tag }]
const LOOKS = [
  ['01-campfire-night-forest', '焚き火キャンプ', 'ローポリの夜の森 ＋ ドット絵の炎', 1],
  ['02-lake-fishing-dawn-mist', '湖の釣り', 'ローポリの朝霧 ＋ ドット絵の水しぶき', 1],
  ['03-flight-cloud-sea-sunset', '雲海フライト', 'ローポリの夕焼け雲', 1],
  ['04-deepsea-submersible', '深海潜水艇', 'ローポリの深海とサーチライト', 1],
  ['05-ski-alpenglow', '雪山スキー', 'ローポリの朝焼け ＋ ドット絵の雪けむり', 1],
  ['06-delivery-rainy-miniature', '配達ドライブ', '雨の夜の街をミニチュア撮影', 1],
  ['07-mars-rover-navcam', '火星ローバー', '探査カメラが送ってきた映像', 1],
  ['08-drone-coast-aerial', '空撮探索', 'ドローンの映像', 1],
  ['08-island-walk', '島あるき（あそべる TPS）', '08 の島を自分で歩く', 1, { href: '../island/index.html', thumb: '../island/thumb-plaza.jpg', no: '08+', tag: 'あそべる' }],
  ['09-haunted-house-8mm', '廃屋ホラー', '古い 8 ミリフィルム', 1],
  ['10-skate-fisheye-camcorder', 'スケート', '魚眼レンズのビデオカメラ', 1],
  ['11-coast-race-retro3d', '海岸レース', '初期の 3D ゲーム機風、夕方', 1],
  ['12-village-rpg-iso-night', '夜の村 RPG', '斜め見下ろしのドット絵、雪と窓あかり', 0],
  ['13-naval-battle-spritestack', '海戦', 'ドット絵の輪切りを重ねた帆船', 0],
  ['14-amusement-park-night', '夜の遊園地', 'ローポリ × ドット絵の電飾と花火', 1],
  ['15-wooden-toy-train', '木の汽車', '積み木の町と木のレール', 1],
  ['16-popup-book-adventure', '絵本の冒険', '飛び出す絵本', 1],
  ['17-dollhouse-cute-remake', '謎解きの家', 'ドールハウスの作りなおし', 1],
  ['18-rooftop-runner-remake', '屋上ランナー', '夕日とふちの光の作りなおし', 1],
  ['19-farm-riso-3d', '農場', '立体を 2 色のインクで刷る', 1],
  ['20-canoe-watercolor-3d', '渓谷カヌー', '立体を水彩で描く', 1],
];
const grid = document.getElementById('grid');
for (const [file, genre, look, is3d, ext] of LOOKS) {
  const a = document.createElement('a'); a.className = 'card'; a.href = ext ? ext.href : file + '.html'; a.target = '_blank'; 
  a.innerHTML = `<div class="view"><img loading="lazy" src="${ext ? ext.thumb : 'thumbs/' + file.split('-')[0] + '.gif'}" alt="${look}"></div><div class="meta"><span class="no">${ext ? ext.no : file.split('-')[0]}</span><span><span class="look">${look}</span><br><span class="genre">${genre}</span></span>${ext ? `<span class="tag">${ext.tag}</span>` : is3d ? '<span class="tag">3D</span>' : ''}</div>`;
  grid.appendChild(a);
}
</script>
</html>
