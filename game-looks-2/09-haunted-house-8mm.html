<html lang="ja">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2-09 廃屋ホラー 8 ミリフィルム</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#e8d8a8;opacity:.7}
</style>
<div id="cap">2-09 ─ 廃屋ホラー / 古い 8 ミリフィルム　｜　見るだけ（家へ近づいていく）</div>
<script src="kit.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 手持ちの 8 ミリカメラで撮ったフィルム。1 秒 16 コマで、コマごとに絵が上下左右にわずかにずれ、明るさもふらつく。
// 色はあせて黄ばみ、黒は浮く。粗い粒、縦の傷、ほこりの影がコマごとに変わり、
// ときどきフィルムのはしから、だいだいの光がもれてくる。画面は 4:3 で、角は丸く暗い
import * as THREE from 'three';
const K = KIT(THREE), { scene, cam, renderer, onResize } = K.stage({ fov: 50 }), { add, box, flat, glow, hash } = K;
scene.background = K.sky([[0, '#5a5a66'], [.45, '#a09a8a'], [.62, '#d8c890'], [1, '#6a665a']]); scene.fog = new THREE.Fog('#a8a08a', 12, 90);
scene.add(new THREE.HemisphereLight(0xd8d8e8, 0x6a6a56, 2)); const sun = new THREE.DirectionalLight(0xffe2a0, 2); sun.position.set(-30, 16, 34); scene.add(sun);
const C = K.colors('#5a6a3a', '#66703e', '#4e5e36', '#6a6040');
const H = (x, z) => Math.sin(x * .12) * Math.cos(z * .1) * .7 + Math.sin(x * .05 + z * .07) * 1.2;
scene.add(K.terrain(H, 60, 60, 2, (y, x, z) => Math.abs(x + Math.sin(z * .2) * 1.5) < 1.6 && z > -2 ? C[3] : C[Math.floor(hash(Math.round(x * .5), Math.round(z * .5)) * 3)]).mesh);
// 家：板ばりの 2 階建て、切妻屋根、ポーチ
const hy = H(0, -8), W = '#6a5a4c', W2 = '#5c4e42'; const house = new THREE.Group(); house.position.set(0, hy, -8); scene.add(house);
box(house, 11, 7.6, 8, W, 0, 3.8, 0); for (let k = 0; k < 12; k++) box(house, 11.06, .06, 8.06, W2, 0, .6 + k * .6, 0);
const roofG = new THREE.CylinderGeometry(.01, 5.2, 3.4, 4, 1); const roof = add(house, roofG, '#3a3438', 0, 9.3, 0); roof.rotation.y = Math.PI / 4; roof.scale.set(1.6, 1, 1.16);
box(house, 1.3, 3, 1.3, '#4a3a34', 3.2, 10, -1); box(house, 12, .3, 3, '#4a3e36', 0, 3.4, 5.2); for (const x of [-5.4, -1.8, 1.8, 5.4]) box(house, .3, 3.2, .3, W2, x, 1.7, 6.4); box(house, 12, .3, 3, '#4a3e36', 0, .15, 5.2);
const door = box(house, 1.5, 2.7, .1, '#2a2220', -.3, 1.6, 4.12); door.rotation.y = -.5; box(house, 1.6, 2.8, .1, glow('#0a0808'), 0, 1.6, 4.02);
const wins = []; for (const [x, y] of [[-3.6, 2], [3.6, 2], [-3.6, 5.6], [0, 5.6], [3.6, 5.6]]) { wins.push(box(house, 1.5, 1.9, .1, glow('#141418'), x, y, 4.03)); box(house, 1.7, .12, .16, W2, x, y - 1, 4.08); box(house, .08, 1.9, .14, W2, x, y, 4.08); box(house, 1.5, .08, .14, W2, x, y, 4.08); }
const shut = box(house, .8, 1.9, .08, W2, 4.7, 2, 4.1); shut.rotation.z = .25;
const ghost = new THREE.Group(); box(ghost, .6, 1.2, .1, glow('#000'), 0, 0, 0); add(ghost, new THREE.CircleGeometry(.3, 10), glow('#000'), 0, .85, 0); ghost.position.set(0, 5.3, 3.95); house.add(ghost);
// さく、枯れ木、ぶらんこ、井戸、墓、草
for (let i = -12; i <= 12; i++) { if (Math.abs(i) < 2) continue; const x = i * 1.3, p = box(scene, .22, 1.6, .1, '#8a8478', x, H(x, 10) + .8, 10 + Math.sin(i) * .2); p.rotation.z = (hash(i, 1) - .5) * .5; if (hash(i, 2) > .8) p.rotation.x = 1.2; } box(scene, 14, .1, .08, '#8a8478', -9.4, H(-9, 10) + 1.1, 10); box(scene, 14, .1, .08, '#8a8478', 9.4, H(9, 10) + 1.1, 10.1).rotation.z = .03;
function deadTree(x, z, s) { const g = new THREE.Group(); g.position.set(x, H(x, z), z); add(g, new THREE.CylinderGeometry(.18 * s, .4 * s, 5 * s, 6), '#3a322c', 0, 2.5 * s, 0); for (let k = 0; k < 7; k++) { const b = add(g, new THREE.CylinderGeometry(.03 * s, .12 * s, (2 + hash(k, x) * 2) * s, 4), '#3a322c', 0, (3 + k * .4) * s, 0); b.geometry.translate(0, 1.2 * s, 0); b.rotation.set(.7 + hash(k, z) * .6, k * 1.9, 0, 'YXZ'); } scene.add(g); return g; }
deadTree(-11, 2, 1.5); deadTree(12, -2, 1.3); deadTree(8, 14, 1); deadTree(-16, -14, 1.7); deadTree(18, 8, 1.2);
const swing = new THREE.Group(); { const x = -11, z = 2, y = H(x, z) + 5.6; swing.position.set(x + 2.2, y, z + .6); for (const s of [-.4, .4]) box(swing, .03, 3.6, .03, '#2a2622', s, -1.8, 0); box(swing, 1, .08, .34, '#5a4a3c', 0, -3.6, 0); scene.add(swing); }
{ const x = 9, z = 5, y = H(x, z); add(scene, new THREE.CylinderGeometry(1.1, 1.1, 1, 8), '#7a7670', x, y + .5, z); for (const s of [-1, 1]) box(scene, .14, 2.2, .14, '#4a3e36', x + s, y + 1.6, z); box(scene, 2.6, .14, 1.2, '#3a3438', x, y + 2.8, z).rotation.z = .08; }
for (let i = 0; i < 5; i++) { const x = -18 + i * 1.8, z = 6 + (i % 2), g = box(scene, .9, 1.3 - (i % 3) * .2, .2, '#8a8a84', x, H(x, z) + .5, z); g.rotation.z = (hash(i, 3) - .5) * .4; }
const grass = new THREE.InstancedMesh(new THREE.ConeGeometry(.08, 1, 3), flat('#7a7a44'), 900), dm = new THREE.Object3D(); for (let i = 0; i < 900; i++) { const x = (hash(i, 4) - .5) * 70, z = (hash(i, 5) - .5) * 70; if (Math.abs(x + Math.sin(z * .2) * 1.5) < 1.4 && z > -2) { dm.position.set(0, -9, 0); } else dm.position.set(x, H(x, z) + .4, z); dm.rotation.set((hash(i, 6) - .5) * .5, 0, (hash(i, 7) - .5) * .5); dm.scale.setScalar(.6 + hash(i, 8)); dm.updateMatrix(); grass.setMatrixAt(i, dm.matrix); } scene.add(grass);
const crows = [...Array(6)].map((_, i) => { const g = new THREE.Group(); for (const s of [-1, 1]) { const w = box(g, .7, .04, .26, glow('#15131a'), s * .32, 0, 0); w.userData.s = s; } scene.add(g); return g; });
const post = K.post(renderer, `uniform float fr;
void main(){float asp=res.x/res.y,w=min(1.,(4./3.)/asp),x0=(1.-w)*.5;vec2 p=vec2((vUv.x-x0)/w,vUv.y);
p+=vec2(h(vec2(fr,1.))-.5,h(vec2(fr,2.))-.5)*.007;p=(p-.5)*1.05+.5;
vec3 c=vec3(0.);if(p.x>0.&&p.x<1.&&p.y>0.&&p.y<1.)c=src(vec2(x0+p.x*w,p.y));
float l=dot(c,vec3(.3,.59,.11));c=mix(vec3(l),c,.66);c=c*vec3(1.1,1.,.74)+vec3(.075,.062,.02);
c*=.86+.26*h(vec2(fr,3.));
c+=(h(floor(p*size*.45)+fr)-.5)*.17;
float sx=h(vec2(floor(fr/9.),5.));c+=smoothstep(.0016,0.,abs(p.x-sx-sin(p.y*20.)*.001))*.4*step(.35,h(vec2(fr,9.)));
float sx2=h(vec2(floor(fr/5.),6.));c-=smoothstep(.001,0.,abs(p.x-sx2))*.25*step(.6,h(vec2(fr,8.)));
vec2 dp=vec2(h(vec2(fr,11.)),h(vec2(fr,12.)));c-=smoothstep(.014,.004,length((p-dp)*vec2(1.33,1.)))*.7*step(.55,h(vec2(fr,13.)));
float lk=smoothstep(.72,1.,sin(time*.8)*.5+.5);c+=vec3(1.,.42,.08)*lk*smoothstep(.5,0.,p.x+sin(p.y*3.+time)*.1)*.8;
vec2 e=abs(p-.5)*2.;c*=smoothstep(1.,.92,max(e.x,e.y))*smoothstep(1.36,1.24,length(e));c*=1.-dot(p-.5,p-.5)*.7;
if(vUv.x<x0||vUv.x>1.-x0)c=vec3(0.);gl_FragColor=vec4(c,1.);}`, { fr: { value: 0 } }); onResize(post.resize);
let acc = 1, fr = 0;
K.loop((dt, t) => {
  acc += dt; if (acc < 1 / 16) return; acc = 0; fr++;                       // 1 秒 16 コマ
  const u = (t % 24) / 24, z = 34 - u * 27, x = -Math.sin(z * .2) * 1.5 + Math.sin(t * .5) * .3;
  cam.position.set(x, H(x, z) + 1.6 + Math.abs(Math.sin(t * 2.2)) * .07, z); cam.lookAt(Math.sin(t * .3) * 3, hy + 3.4 + Math.sin(t * .23) * 1.4, -8); cam.rotation.z += Math.sin(t * 1.1) * .02;
  ghost.visible = (t % 9) > 6.2 && (t % 9) < 7.4; wins[3].material.color.set(ghost.visible ? '#d8c890' : '#141418'); wins[0].material.color.set(hash(Math.floor(t * 8), 1) > .93 ? '#8a8060' : '#141418');
  swing.rotation.x = Math.sin(t * 1.3) * .28; door.rotation.y = -.5 + Math.sin(t * .6) * .12;
  crows.forEach((c, i) => { const a = t * .25 + i * 1.05; c.position.set(Math.cos(a) * (10 + i * 2), hy + 14 + Math.sin(a * 2 + i) * 2, -8 + Math.sin(a) * (8 + i)); c.rotation.y = -a; c.children.forEach(w => { w.rotation.z = w.userData.s * Math.sin(t * 9 + i) * .7; }); });
  post.u.fr.value = fr; post.render(scene, cam, t);
});
</script>
