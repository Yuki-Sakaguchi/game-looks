<script type="module">
// 2-19（2 色刷りの農場）を、歩いて撃てる一人称にしたもの。場面のつくりと刷り方は 2-19 と同じ。
// ちがうのは 3 つ：自分で歩ける、カラスを撃っておいはらえる、紙と 2 つのインクの色を選べる
import * as THREE from 'three';
const K = KIT(THREE), { scene, cam, renderer, onResize } = K.stage({ fov: 68, far: 400 }), { add, box, flat, hash } = K;
const $ = id => document.getElementById(id), TOUCH = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window; document.body.classList.toggle('touch', TOUCH);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
scene.background = new THREE.Color('#f4f0e4'); scene.fog = new THREE.Fog('#f4f0e4', 70, 220);
scene.add(new THREE.HemisphereLight(0xffffff, 0x9ab0a0, 1.5)); const sun = new THREE.DirectionalLight(0xfff2dc, 2.6); sun.position.set(-30, 40, 20); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 5, far: 150 }); sun.shadow.bias = -.001; scene.add(sun);

const C = K.colors('#a8d8c0', '#8fcab0', '#f2c8a0', '#f6dcb8', '#7abca4');
const H = (x, z) => Math.sin(x * .04) * Math.cos(z * .05) * 2 + Math.max(0, Math.hypot(x, z) - 50) * .25;
const fieldAt = (x, z) => x > 6 && x < 44 && z > -30 && z < 6;
const land = K.terrain(H, 90, 90, 2.6, (y, x, z) => fieldAt(x, z) ? (Math.floor((z + 100) / 2.6) % 2 ? C[2] : C[3]) : y > 5 ? C[4] : C[hash(Math.round(x * .3), Math.round(z * .3)) > .5 ? 0 : 1]); land.mesh.receiveShadow = true; scene.add(land.mesh);

// ぶつかる物の表。丸（x, z, r）と四角（x0〜x1, z0〜z1）。top はその高さより上なら弾が通りぬける
const walls = [], circle = (x, z, r, top = 9, bot = -9) => walls.push({ x, z, r, top, bot }), rect = (x0, x1, z0, z1, top) => walls.push({ x0, x1, z0, z1, top });

// 納屋、サイロ、母屋、風車、さく、木、わらの束（2-19 と同じ）

{ const g = new THREE.Group(); g.position.set(-14, H(-14, -8), -8); S(box(g, 10, 6, 14, RED, 0, 3, 0)); for (const s of [-1, 1]) { const r = S(box(g, 6.6, .5, 15, DARK, s * 2.7, 7.3, 0)); r.rotation.z = -s * .62; } S(box(g, 4, 4.4, .3, CREAM, 0, 2.2, 7.1)); for (const a of [-1, 1]) { const d = box(g, 5.6, .3, .1, RED, 0, 2.2, 7.3); d.rotation.z = a * .83; } S(box(g, 1.6, 1.6, .3, CREAM, 0, 6.6, 7.1)); scene.add(g); rect(-19, -9, -15, -.7, 9); }

{ const g = new THREE.Group(); g.position.set(-2, H(-2, 14), 14); S(box(g, 7, 4, 6, CREAM, 0, 2, 0)); const r = S(add(g, new THREE.ConeGeometry(5.6, 3, 4), TEAL, 0, 5.5, 0)); r.rotation.y = Math.PI / 4; box(g, 1.2, 2.2, .2, RED, -1.4, 1.1, 3.05); box(g, 1.4, 1.2, .2, DARK, 1.4, 2.4, 3.05); S(box(g, 1, 2, 1, RED, 2, 6, -1)); scene.add(g); rect(-5.5, 1.5, 11, 17, 6); }
const mill = new THREE.Group(); { const x = 20, z = 16, y = H(x, z); for (const [a, b] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { const l = S(box(scene, .2, 12, .2, DARK, x + a * 1.2, y + 6, z + b * 1.2)); l.rotation.set(b * .1, 0, -a * .1); circle(x + a * 1.5, z + b * 1.5, .25, 3); } mill.position.set(x, y + 12, z + .6); for (let k = 0; k < 10; k++) { const bl = S(box(mill, .7, 3, .06, CREAM, 0, 0, 0)); bl.geometry.translate(0, 1.9, 0); bl.rotation.z = k * .628; } box(mill, .1, .1, 3, DARK, 0, 0, -1.5); box(mill, .06, 1.6, 1.6, RED, 0, 0, -3); scene.add(mill); }

{ const m = new THREE.Mesh(new THREE.CircleGeometry(16, 40), new THREE.MeshBasicMaterial({ color: '#ff9a84', fog: false })); m.position.set(-150, 120, -210); m.lookAt(0, 0, 0); scene.add(m); }
const clouds = [...Array(9)].map((_, i) => { const g = new THREE.Group(), mat = new THREE.MeshBasicMaterial({ color: '#c4e2dc', fog: false }); for (let k = 0; k < 4; k++) { const m = new THREE.Mesh(new THREE.IcosahedronGeometry(7 + hash(i, k) * 5, 0), mat); m.position.set(k * 9 - 13, hash(k, i) * 3, hash(i, k + 5) * 6); m.scale.y = .45; g.add(m); } g.position.set(hash(i, 30) * 500 - 250, 62 + hash(i, 31) * 30, -200 + hash(i, 32) * 400); g.scale.setScalar(1 + hash(i, 33)); scene.add(g); return g; });

add(gun, new THREE.CylinderGeometry(.075, .055, .13, 8), TEAL, 0, .14, .08); box(gun, .09, .26, .11, DARK, 0, -.19, .14).rotation.x = .3; box(gun, .15, .13, .3, '#f6dcb8', .03, -.22, .24); box(gun, .03, .05, .03, DARK, 0, .1, -.2);
const shots = [...Array(24)].map(() => { const m = add(scene, new THREE.IcosahedronGeometry(.13, 0), new THREE.MeshBasicMaterial({ color: RED })); m.visible = false; return { m, v: new THREE.Vector3(), life: 0 }; }); let shotI = 0;

  { name: '青緑 × 朱（もとの色）', paper: '#f4eddb', a: '#1a808f', b: '#ff5c3d' },

{ const q = new URLSearchParams(location.search).get('c'); let s = 0; try { s = +localStorage.getItem('riso-fps-pal') || 0; } catch (e) { } setPal(q ? q - 1 : s); }

// 操作。パソコンはマウスを画面にとじこめて見まわす。スマホは左で歩き、右で見まわす
const P = { x: 1, z: 9, y: 0, vy: 0, yaw: -1.05, pitch: -.02, bob: 0, ground: true }, keys = {}, inp = { mx: 0, mz: 0, fire: false, jump: false };
let playing = false, cd = 0, kick = 0, hitT = 0;
const begin = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (ac && ac.state === 'suspended') ac.resume(); playing = true; $('start').style.display = 'none'; if (!TOUCH) { try { const r = renderer.domElement.requestPointerLock(); if (r && r.catch) r.catch(() => { }); } catch (e) { } } };
$('start').addEventListener('click', begin);
document.addEventListener('pointerlockchange', () => { if (!document.pointerLockElement && !TOUCH) { playing = false; inp.fire = false; $('start').style.display = 'grid'; $('start').querySelector('.go .pc').textContent = 'クリックして続ける'; } });
addEventListener('mousemove', e => { if (document.pointerLockElement && Math.abs(e.movementX) < 250 && Math.abs(e.movementY) < 250) { P.yaw -= e.movementX * .0022; P.pitch = Math.max(-1.45, Math.min(1.45, P.pitch - e.movementY * .0022)); } });
addEventListener('mousedown', e => { if (playing && e.button === 0 && !TOUCH) inp.fire = true; }); addEventListener('mouseup', () => { if (!TOUCH) inp.fire = false; });
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') e.preventDefault(); if (/^Digit[1-9]$/.test(e.code) && +e.code[5] <= PALS.length) setPal(+e.code[5] - 1); if (e.code === 'KeyC') setPal(palI + 1); });
addEventListener('keyup', e => { keys[e.code] = false; }); addEventListener('blur', () => { for (const k in keys) keys[k] = false; inp.fire = false; });
if (TOUCH) { // 指ごとに役目を決める：左半分＝歩く、右半分＝見まわす、「うつ」の上から始めたら撃ちながら見まわす
  const T = {}, stick = $('stick'), nub = stick.firstElementChild, inBtn = (t, el) => { const r = el.getBoundingClientRect(); return Math.hypot(t.clientX - r.left - r.width / 2, t.clientY - r.top - r.height / 2) < r.width / 2 + 8; };
  addEventListener('touchstart', e => { if (!playing) return; e.preventDefault(); for (const t of e.changedTouches) { const o = { x: t.clientX, y: t.clientY, ox: t.clientX, oy: t.clientY };
      if (inBtn(t, $('jump'))) { o.k = 'jump'; inp.jump = true; } else if (inBtn(t, $('fire'))) { o.k = 'look'; o.fire = inp.fire = true; } else if (t.clientX < innerWidth * .45) { o.k = 'move'; stick.style.display = 'block'; stick.style.left = o.ox + 'px'; stick.style.top = o.oy + 'px'; nub.style.transform = ''; } else o.k = 'look'; T[t.identifier] = o; } }, { passive: false });
  addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) { const o = T[t.identifier]; if (!o) continue;
      if (o.k === 'look') { P.yaw -= (t.clientX - o.x) * .006; P.pitch = Math.max(-1.45, Math.min(1.45, P.pitch - (t.clientY - o.y) * .006)); }
      if (o.k === 'move') { let dx = (t.clientX - o.ox) / 48, dy = (t.clientY - o.oy) / 48; const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; } inp.mx = dx; inp.mz = dy; nub.style.transform = `translate(${dx * 30}px,${dy * 30}px)`; }
      o.x = t.clientX; o.y = t.clientY; } }, { passive: false });
  const end = e => { for (const t of e.changedTouches) { const o = T[t.identifier]; if (!o) continue; if (o.k === 'move') { inp.mx = inp.mz = 0; stick.style.display = 'none'; } if (o.fire) inp.fire = false; if (o.k === 'jump') inp.jump = false; delete T[t.identifier]; } };
  addEventListener('touchend', end); addEventListener('touchcancel', end);
}

const fwd = new THREE.Vector3(), muz = new THREE.Vector3(), tv = new THREE.Vector3(), tq = new THREE.Vector3();
// 丸や四角にめりこんだら外へ押しもどす
function pushOut(r) { for (const w of walls) { if (w.air) continue; if (w.r) { const dx = P.x - w.x, dz = P.z - w.z, d = Math.hypot(dx, dz), m = w.r + r; if (d < m && P.y - 1.7 < H(w.x, w.z) + w.top) { const k = m / (d || 1); P.x = w.x + dx * k; P.z = w.z + dz * k; } } else if (P.x > w.x0 - r && P.x < w.x1 + r && P.z > w.z0 - r && P.z < w.z1 + r) { const a = P.x - (w.x0 - r), b = (w.x1 + r) - P.x, c = P.z - (w.z0 - r), d = (w.z1 + r) - P.z, m = Math.min(a, b, c, d); if (m === a) P.x = w.x0 - r; else if (m === b) P.x = w.x1 + r; else if (m === c) P.z = w.z0 - r; else P.z = w.z1 + r; } }
  const d = Math.hypot(P.x, P.z); if (d > 86) { P.x *= 86 / d; P.z *= 86 / d; } }
function blocked(p) { const g = H(p.x, p.z); if (p.y < g) return true; for (const w of walls) { if (w.r) { if (Math.hypot(p.x - w.x, p.z - w.z) < w.r) { const y = p.y - H(w.x, w.z); if (y < w.top && y > w.bot) return true; } } else if (p.x > w.x0 && p.x < w.x1 && p.z > w.z0 && p.z < w.z1 && p.y - g < w.top) return true; } return false; }
function shoot() {
  cd = .2; kick = 1; cam.getWorldDirection(fwd); gun.updateWorldMatrix(true, false); muz.set(0, .03, -.8).applyMatrix4(gun.matrixWorld);
  tv.copy(cam.position).addScaledVector(fwd, 60).sub(muz).normalize();   // 銃口から、照準の先 60 m の点へ向けて飛ばす
  const s = shots[shotI++ % shots.length]; s.m.position.copy(muz); s.v.copy(tv).multiplyScalar(95); s.life = 1.6; s.m.visible = true;
  fx.emit('spark', muz.x + tv.x * .2, muz.y + tv.y * .2, muz.z + tv.z * .2, { life: .12, size: .5, tint: '#ff9a84' }); beep(520, 140, .09);
}
function hitBird(b) { b.st = 'fall'; b.t = 0; if (b.target) { b.target.taken = false; b.target = null; } b.v.set((Math.random() - .5) * 4, 3, (Math.random() - .5) * 4); score++; $('sc').textContent = score; hitT = .18; const p = b.g.position;
  for (let k = 0; k < 7; k++) fx.emit(k % 2 ? 'puff' : 'spark', p.x, p.y, p.z, { spread: 6, vy: 2, grav: -6, life: .7, size: k % 2 ? .9 : .7, grow: 1, tint: k % 2 ? '#3a6a7a' : '#ff8a70' }); beep(900, 1500, .12, 'triangle', .09); }

K.loop((dt, t) => {
  // まわりの動き（2-19 と同じ）：風車、畑を行き来するトラクター、牛、にわとり、雲
  mill.rotation.z = t * 1.2; const u = (t * .05) % 1, lap = Math.floor(t * .05), row = lap % 11, dir = lap % 2 ? -1 : 1, tx = dir > 0 ? 8 + u * 34 : 42 - u * 34, tz = -28 + row * 2.6; tr.position.set(tx, H(tx, tz), tz); tr.rotation.y = dir > 0 ? Math.PI / 2 : -Math.PI / 2; tr.children.forEach(o => { if (o.userData.w) o.rotation.x = t * 5; }); tr.position.y += Math.sin(t * 20) * .03; trWall.x = tx; trWall.z = tz;
  if ((pT -= dt) < 0) { pT = .2; fx.emit('puff', tx - dir * 1.2, H(tx, tz) + .6, tz, { vy: 1, spread: .8, life: 1.4, size: .9, grow: 1.8, tint: '#e8c8a0' }); fx.emit('smoke', tx + dir * 1, H(tx, tz) + 3.4, tz + .5, { vy: 1.6, life: 1.2, size: .5, grow: 1.6, tint: '#5a7a84' }); }
  cows.forEach((c, i) => { c.children[4].rotation.x = Math.max(0, Math.sin(t * .6 + i * 2)) * .5; const h = c.userData.hop = Math.max(0, c.userData.hop - dt * 2.4); c.position.y = H(c.position.x, c.position.z) + Math.sin(h * Math.PI) * .7; });
  hens.forEach((h, i) => { h.userData.a += dt * (.3 + (i % 3) * .2); const x = -2 + Math.cos(h.userData.a) * h.userData.r, z = 22 + Math.sin(h.userData.a) * h.userData.r * .6; h.position.set(x, H(x, z) + Math.abs(Math.sin(t * 8 + i)) * .1, z); h.rotation.y = -h.userData.a; });
  clouds.forEach(c => { c.position.x += dt * 1.5; if (c.position.x > 260) c.position.x = -260; });

  if (playing) {
    // 歩く：向いている方角を基準に、前後左右へ。地面の高さに合わせ、物にぶつかったら押しもどす
    let mx = inp.mx + (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0), mz = inp.mz + (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0); const l = Math.hypot(mx, mz); if (l > 1) { mx /= l; mz /= l; }
    const sp = (keys.ShiftLeft || keys.ShiftRight || (TOUCH && l > .95) ? 11 : 7) * dt, sn = Math.sin(P.yaw), cs = Math.cos(P.yaw); P.x += (mx * cs + mz * sn) * sp; P.z += (mz * cs - mx * sn) * sp; pushOut(.55);
    if ((keys.Space || inp.jump) && P.ground) { P.vy = 7.5; P.ground = false; } P.vy -= 22 * dt; P.y += P.vy * dt; const gy = H(P.x, P.z) + 1.7; if (P.y <= gy || (P.ground && P.vy <= 0)) { P.y = gy; P.vy = 0; P.ground = true; }
    if (P.ground && l > .1) P.bob += dt * (sp / dt) * 1.25;
    cd -= dt; if (inp.fire && cd <= 0) shoot();
  } else if (!P.y) P.y = H(P.x, P.z) + 1.7;
  kick = Math.max(0, kick - dt * 7);
  cam.position.set(P.x, P.y + Math.sin(P.bob) * .05, P.z); cam.rotation.set(P.pitch + kick * .012, P.yaw, 0);
  gun.position.set(gunX + Math.cos(P.bob * .5) * .006, -.19 + Math.sin(P.bob) * .006 + kick * .008, -.42 + kick * .04); gun.rotation.set(kick * .16, .05, 0);
  if (hitT > 0) hitT -= dt; $('cross').classList.toggle('hit', hitT > 0);

  // 弾：少しずつ進めて、カラス・地面・建物に当たったか調べる
  for (const s of shots) { if (s.life <= 0) continue; s.life -= dt; s.v.y -= 6 * dt; let done = s.life <= 0;
    for (let k = 0; k < 4 && !done; k++) { s.m.position.addScaledVector(s.v, dt / 4); const p = s.m.position;
      for (const b of birds) if ((b.st === 'in' || b.st === 'peck' || b.st === 'out') && p.distanceToSquared(b.g.position) < 1.5) { hitBird(b); done = true; break; }
      if (!done) for (const c of cows) if (tq.copy(c.position).setY(c.position.y + 1.4).distanceToSquared(p) < 1.6 && !c.userData.hop) { c.userData.hop = 1; beep(190, 120, .35, 'sawtooth', .05); }
      if (!done && blocked(p)) { done = true; fx.emit('puff', p.x, p.y, p.z, { life: .4, size: .7, grow: 1.5, tint: '#ffb8a4' }); } }
    if (done) { s.life = 0; s.m.visible = false; } }

  // カラス。数はおいはらうほど増える（3 羽から 12 羽まで）
  const active = Math.min(birds.length, 3 + Math.floor(score / 4));
  birds.forEach((b, i) => { const p = b.g.position, flap = Math.sin(t * 13 + b.ph);
    if (b.st === 'wait') { if (i < active && playing && (b.t -= dt) < 0) launch(b); return; }
    if (b.st === 'in') { const c = b.target; tv.set(c.x - p.x, 0, c.z - p.z); const d = tv.length(), sp = 11 + Math.min(6, score * .1); tv.multiplyScalar(Math.min(1, sp * dt / (d || 1))); p.x += tv.x; p.z += tv.z; const ty = c.y + .9 + Math.min(34, Math.max(0, d - 1.5) * .34) + Math.sin(t * 1.7 + b.ph) * Math.min(1.5, d * .1); p.y += (ty - p.y) * Math.min(1, dt * 3);
      b.g.rotation.y = Math.atan2(c.x - p.x, c.z - p.z); b.b.rotation.x = d > 8 ? .25 : 0; b.wings.forEach((w, k) => w.rotation.z = (k ? -1 : 1) * flap * .7); if (d < .4) { b.st = 'peck'; b.t = 3.4; } }
    else if (b.st === 'peck') { b.t -= dt; b.b.rotation.x = Math.max(0, Math.sin(t * 9 + b.ph)) * .7; b.wings.forEach((w, k) => w.rotation.z = (k ? 1 : -1) * 1.25); if (b.t < 0) { removeCrop(b.target); b.target = null; b.st = 'out'; b.t = 0; b.b.rotation.x = 0; b.v.set(Math.sin(b.g.rotation.y) * 9, 5, Math.cos(b.g.rotation.y) * 9); beep(300, 200, .2, 'sawtooth', .03); } }
    else if (b.st === 'out') { b.t += dt; p.addScaledVector(b.v, dt); b.b.rotation.x = -.3; b.wings.forEach((w, k) => w.rotation.z = (k ? -1 : 1) * flap * .8); if (b.t > 7) { b.st = 'wait'; b.t = 1.5; b.g.visible = false; } }
    else if (b.st === 'fall') { b.t += dt; b.v.y -= 16 * dt; p.addScaledVector(b.v, dt); b.b.rotation.x += dt * 9; b.b.rotation.z += dt * 6; b.wings.forEach((w, k) => w.rotation.z = (k ? 1 : -1) * 1.1); if (p.y < H(p.x, p.z) + .3 || b.t > 3) { fx.emit('puff', p.x, p.y + .4, p.z, { life: .6, size: 1.4, grow: 1.6, tint: '#d8e8e0' }); b.st = 'wait'; b.t = 2 + Math.random() * 3; b.g.visible = false; } } });
  fx.update(dt);
  post.render(scene, cam, t);
});
