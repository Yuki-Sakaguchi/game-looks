<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2-05 雪山スキー ローポリの朝焼け</title>
<style>
html,body{margin:0;height:100%;background:#e8c8d0;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#3a3a6a;opacity:.85}
</style>
<div id="cap">2-05 ─ 雪山スキー / ローポリの朝焼け ＋ ドット絵の雪けむり　｜　見るだけ</div>
<script src="kit.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 雪は白く塗るだけで、色はぜんぶ光から来る。横から差す朝日の桃色と、空からの青紫。
// 面をぼかさないので、日の当たる面は桃色、日かげの面は青紫と、斜面が 2 色のかけらに分かれて起伏が読める。
// 滑ったあとの雪けむりと、雪面のきらめきはドット絵の板
import * as THREE from 'three';
const K = KIT(THREE), { scene, cam, renderer } = K.stage({ fov: 46, far: 900 }), { add, box, flat, glow, hash } = K;
scene.background = K.sky([[0, '#2a3a80'], [.38, '#7c72b8'], [.56, '#f0a2a6'], [.7, '#ffdcb8'], [1, '#dfe6f6']]); scene.fog = new THREE.Fog('#ecc8d2', 40, 280);
scene.add(new THREE.HemisphereLight(0x8a9cf0, 0x6a70b0, 1.5)); const sun = new THREE.DirectionalLight(0xffa890, 3.2); scene.add(sun, sun.target);
const C = K.colors('#f6f8ff', '#eef2ff', '#8a84a0');
const H = (x, z) => z * .3 + Math.sin(x * .07 + z * .03) * 3 + Math.sin(z * .1) * 1.4 + Math.sin(x * .23 + z * .19) * .5 + Math.abs(x) * Math.abs(x) * .012;
const rocky = (x, z) => Math.sin(x * .13 + 2) * Math.cos(z * .11) > .82;
const land = K.terrain(H, 76, 86, 2.5, (y, x, z) => rocky(x, z) ? C[2] : C[hash(Math.round(x), Math.round(z)) > .5 ? 0 : 1]); scene.add(land.mesh);
const path = t => Math.sin(t * .9) * 9 + Math.sin(t * .37) * 4;
// 滑る人
const sk = new THREE.Group(); scene.add(sk);
box(sk, .55, .7, .4, '#e0483c', 0, 1.25, 0); add(sk, new THREE.IcosahedronGeometry(.27, 0), '#f6e6c8', 0, 1.86, 0); box(sk, .5, .14, .2, '#2a3a5a', 0, 1.9, -.2); box(sk, .56, .2, .5, '#2f6ac0', 0, 2.02, 0);
for (const s of [-1, 1]) { box(sk, .2, .7, .22, '#34405a', s * .16, .6, 0); box(sk, .16, .06, 2, '#f2c230', s * .2, .22, -.1); const pl = box(sk, .04, 1.2, .04, '#3a3a44', s * .5, .9, .2); pl.rotation.x = .5; box(sk, .14, .5, .14, '#e0483c', s * .4, 1.3, .1).rotation.z = s * .3; }
const scarf = box(sk, .12, .1, .9, glow('#ffe26a'), 0, 1.66, .6);
// 木・岩・旗門（先へ送りなおす）、遠い山
const SPAN = 240, props = [];
for (let i = 0; i < 90; i++) { const k = i % 6 === 5 ? 1 : 0, g = k ? new THREE.Group() : K.pine(5 + hash(i, 3) * 7, '#2f5f4e', '#4a3428', '#f6f8ff'); if (k) add(g, new THREE.IcosahedronGeometry(1 + hash(i, 4) * 1.6, 0), '#8a84a0', 0, .5, 0); g.userData = { x: (hash(i, 1) < .5 ? -1 : 1) * (15 + hash(i, 2) * 62), oz: hash(i, 5) * SPAN }; scene.add(g); props.push(g); }
const gates = [...Array(8)].map((_, i) => { const g = new THREE.Group(); for (const s of [-1, 1]) { add(g, new THREE.CylinderGeometry(.05, .05, 2.2, 4), '#3a3a44', s * 2.6, 1.1, 0); box(g, .9, .5, .04, glow(i % 2 ? '#e0403a' : '#2f6ae0'), s * 2.6 + .5, 1.8, 0); } scene.add(g); return g; });
const peaks = [...Array(9)].map((_, i) => { const g = new THREE.Group(), r = 60 + hash(i, 6) * 60, h = 90 + hash(i, 7) * 80; add(g, new THREE.ConeGeometry(r, h, 6), '#b4aedc', 0, 0, 0).rotation.y = i; add(g, new THREE.ConeGeometry(r * .42, h * .42, 6), '#f6f8ff', 0, h * .29, 0).rotation.y = i; g.userData = { x: (i - 4) * 110 + hash(i, 8) * 40, y: -h * .2 - 70 }; scene.add(g); return g; });
const sg = new THREE.BufferGeometry(), sa = new Float32Array(500 * 3); for (let i = 0; i < 500; i++) { sa[i * 3] = (hash(i, 11) - .5) * 80; sa[i * 3 + 1] = hash(i, 12) * 30; sa[i * 3 + 2] = (hash(i, 13) - .5) * 80; } sg.setAttribute('position', new THREE.BufferAttribute(sa, 3));
const flakes = new THREE.Points(sg, new THREE.PointsMaterial({ color: '#ffffff', size: 2, sizeAttenuation: false })); scene.add(flakes);
const fx = K.fx(scene, 160); let pT = 0, kT = 0;
K.loop((dt, t) => {
  const z = -t * 15, x = path(t), y = H(x, z), vx = (path(t + .05) - path(t - .05)) / .1, sl = (H(x, z - 1) - H(x, z + 1)) / 2;
  sk.position.set(x, y, z); sk.rotation.set(-sl * .8 - .15, -Math.atan2(vx, 15) * 1.2, -vx * .05); scarf.rotation.y = Math.sin(t * 15) * .3;
  land.follow(x * .4, z, -70);
  for (const g of props) { const gz = z + 30 - ((((z + 30 - g.userData.oz) % SPAN) + SPAN) % SPAN) * -1 - SPAN, pz = z + 30 - ((((g.userData.oz - z) % SPAN) + SPAN) % SPAN); g.position.set(g.userData.x, H(g.userData.x, pz) - .3, pz); }
  gates.forEach((g, i) => { const n = Math.floor((-z + 20) / 34) - i + 6, gz = -n * 34, gt = -gz / 15; g.position.set(path(gt), H(path(gt), gz), gz); });
  for (const p of peaks) p.position.set(x * .7 + p.userData.x, y + p.userData.y + 60, z - 420);
  sun.position.set(x - 120, y + 40, z - 60); sun.target.position.set(x, y, z);
  if ((pT -= dt) < 0) { pT = .035; const k = Math.min(1, Math.abs(vx) / 8); for (let q = 0; q < 2; q++) fx.emit('puff', x - Math.sign(vx) * .3, y + .3, z + .8, { vx: -vx * .5, vy: 1.2 + k * 2, vz: 3, spread: 1.6, life: .7 + k * .5, size: .7 + k * .8, grow: 1.8, tint: '#fff6fa' }); }
  if ((kT -= dt) < 0) { kT = .05; const px = x + (Math.random() - .5) * 40, pz = z - Math.random() * 40; fx.emit('spark', px, H(px, pz) + .25, pz, { life: .45, size: .5, add: true, fog: false, tint: '#fff0f4' }); }
  fx.update(dt);
  flakes.position.set(x, y - ((t * 3) % 6), z - 14);
  cam.position.set(x * .55 + 3, y + 6.5, z + 13.5); cam.lookAt(x * .9, y + 1, z - 12);
  renderer.render(scene, cam);
});
</script>
</html>
