<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">

import * as THREE from 'three';

  const m = wallM(COL[((i % 4) + 4) % 4], ((i % 3) + 3) % 3, 4, 14), top = flat('#6a5aa0'); const body = new THREE.Mesh(new THREE.BoxGeometry(W, 70, D), [m, m, top, top, m, m]); body.position.y = h - 35; g.add(body);

  if (r(3) > .4) { B(g, 2.2, 1, 1.5, '#7a6ab0', -3.4, h + .5, -4); B(g, 2.24, .08, 1.54, RIM, -3.4, h + 1.04, -4); const fan = B(g, 1.2, .06, .2, '#2a1a3a', -3.4, h + 1.1, -4); fan.userData.fan = 1; }

// 遠くの街（3 層）と、高架を走る電車
const far = []; for (let r = 0; r < 3; r++) for (let k = 0; k < 26; k++) { const h = 20 + hash(k, r + 5) * 46, w = 7 + hash(k, r) * 8, t = WIN[k % 3].clone(); t.repeat.set(3, Math.round(h / 4)); t.needsUpdate = true; const mm = flat(['#4a3f88', '#5a3f84', '#6a4580'][r], { emissive: '#ffffff', emissiveMap: t, emissiveIntensity: .8 }), o = new THREE.Mesh(new THREE.BoxGeometry(w, h, 9), mm); o.userData = { ox: k * 15 + hash(k, r + 9) * 6, z: -26 - r * 30, h }; scene.add(o); far.push(o); if (k % 3 === 0) { const e = B(o, w + .1, .2, 9.1, RIM, 0, h / 2 + .1, 0); } }
const railY = 9, rail = B(scene, 900, .8, 2.4, '#3a2a5a', 0, railY, -17); const train = new THREE.Group(); for (let k = 0; k < 5; k++) { B(train, 7.4, 2.4, 2.2, '#c8c2e0', k * 7.8, 1.8, 0); B(train, 6.4, .9, 2.24, glow('#fff0c0'), k * 7.8, 2.2, 0); B(train, 7.44, .1, 2.24, RIM, k * 7.8, 3.05, 0); } train.position.z = -17; scene.add(train);
// 走る人：首巻きは 6 節のリボン
const man = new THREE.Group(), body = flat('#f24a5a'), dark = flat('#2a2040');
const part = (w, h, d, m, y) => { const p = new THREE.Group(), b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.y = -h / 2; p.add(b); p.position.y = y; man.add(p); return p; };
B(man, .56, .8, .38, body, 0, 1.36, 0); B(man, .5, .16, .4, RIM, 0, 1.8, 0).visible = false; const head = new THREE.Mesh(new THREE.IcosahedronGeometry(.27, 0), flat('#ffd0a0')); head.position.y = 2.02; man.add(head); B(man, .5, .2, .5, dark, 0, 2.2, 0);
const lL = part(.22, .9, .22, dark, 1), lR = part(.22, .9, .22, dark, 1), aL = part(.16, .7, .16, body, 1.7), aR = part(.16, .7, .16, body, 1.7); lL.position.z = .14; lR.position.z = -.14; aL.position.z = .34; aR.position.z = -.34; man.scale.setScalar(1.35); scene.add(man);
const ribbon = [...Array(7)].map((_, k) => { const m = new THREE.Mesh(new THREE.BoxGeometry(.5, .16 - k * .012, .1), glow('#ffe26a')); scene.add(m); return { m, p: new THREE.Vector3() }; });
const fx = K.fx(scene, 80); let wasAir = 0, camY = 22;
K.loop((dt, t) => {
  const x = t * 10, bi = Math.round(x / SP), lx = x - bi * SP, half = W / 2 - .6; let y, air = 0;
  if (Math.abs(lx) <= half) y = roofH(bi) + .65; else { const a = lx > 0 ? bi : bi - 1, f = (lx > 0 ? lx - half : lx + SP - half) / (SP - half * 2); y = roofH(a) + .65 + (roofH(a + 1) - roofH(a)) * f + Math.sin(f * Math.PI) * 3; air = 1; }
  man.position.set(x, y, 0); const ph = t * 13, sw = air ? 1 : Math.sin(ph) * 1.15; lL.rotation.z = sw; lR.rotation.z = -sw; aL.rotation.z = -sw * .9; aR.rotation.z = sw * .9; man.rotation.z = -.2 - air * .1;
  if (wasAir && !air) for (let k = 0; k < 6; k++) fx.emit('puff', x, y + .2, (Math.random() - .5) * .6, { vx: -2 - Math.random() * 2, vy: 1, spread: 1.2, life: .7, size: .7, grow: 1.6, tint: '#ffd8b8' }); wasAir = air;
  let prev = new THREE.Vector3(x - .3, y + 2.5, 0); ribbon.forEach((r, k) => { const tgt = prev.clone().add(new THREE.Vector3(-.5, Math.sin(t * 9 - k * .9) * .12 - .04, Math.sin(t * 7 - k) * .1)); r.p.lerp(tgt, Math.min(1, dt * 22)); r.m.position.copy(r.p); r.m.rotation.z = Math.sin(t * 9 - k * .9) * .4; prev = r.p; });
  const base = Math.floor(x / SP) - 3; slots.forEach((s, k) => { const i = base + k; if (s.i !== i) { s.i = i; build(s, i); } s.g.traverse(o => { if (o.userData.fan) o.rotation.y = t * 9; if (o.userData.cloth !== undefined) { o.rotation.x = Math.sin(t * 3 + o.userData.cloth) * .25; } });
    for (const b of s.birds) { const near = Math.abs(s.i * SP - x) < 5; if (near) b.t += dt; if (b.t > 0) { b.b.position.set(b.base.x + b.t * 4, b.base.y + b.t * 3.2, b.base.z - b.t * 3); b.b.children.forEach(w => { w.rotation.z = w.userData.s * Math.sin(t * 22) * .9; }); } } });
  for (const m of far) { const u = m.userData; m.position.set(x - 195 + ((((u.ox - x * (1 + u.z * .012) * 0) - (x - 195)) % 390) + 390) % 390, u.h / 2 - 22, u.z); }
  rail.position.x = x; train.position.set(x + 160 - ((t * 26) % 420), railY, -17);
