<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2-13 海戦 輪切り重ねの帆船</title>
<style>
html,body{margin:0;height:100%;background:#12324a;overflow:hidden;display:grid;place-items:center}
canvas{width:min(100vw,160vh);aspect-ratio:8/5;display:block;image-rendering:pixelated}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#eaffff;opacity:.85}
</style>
<canvas id="c" width="400" height="250"></canvas>
<div id="cap">2-13 ─ 海戦 / ドット絵の輪切りを重ねた帆船　｜　見るだけ</div>
<script>
// 3D は使わない。船を「下から上へ薄く輪切りにしたドット絵」20 枚ほどで持ち、
// 同じ角度で回しながら 1 ドットずつ上へずらして重ねると、回しても立体に見える。島も灯台も同じ作り。
// 海は 2 色の波もようを流し、船のうしろに白い泡を残す。砲煙としぶきは小さなドットのかたまり
const cv = document.getElementById('c'), g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
const mk = (w, h, fn) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { const col = fn(i, j); if (col) { x.fillStyle = col; x.fillRect(i, j, 1, 1); } } return c; };
// 船：長さ 30 ×幅 12 の輪切り。x が船の前後（右が船首）
function shipSlices(sail, flag) {
  const L = [], hull = (i, j, in_) => { const u = (i - 14.5) / 14.5, w = (u > 0 ? 5.2 * Math.sqrt(Math.max(0, 1 - u * u * .95)) : 5.2 - u * u * 1.4) - in_; return Math.abs(j - 5.5) < w && Math.abs(u) < 1 - in_ * .04; };
  for (let k = 0; k < 5; k++) L.push(mk(30, 12, (i, j) => hull(i, j, (4 - k) * .5) ? (k < 2 ? '#3a2418' : hull(i, j, (4 - k) * .5 + 1) ? '#6a4428' : '#4a2e1c') : null));
  L.push(mk(30, 12, (i, j) => hull(i, j, 0) ? (hull(i, j, 1) ? ((i % 3) ? '#c89a62' : '#a87e4c') : '#4a2e1c') : null));                      // 甲板
  for (let k = 0; k < 3; k++) L.push(mk(30, 12, (i, j) => (i < 7 && i > 1 && Math.abs(j - 5.5) < 3.6) ? (k === 2 ? '#8a5a34' : (i === 6 || Math.abs(j - 5.5) > 2.6 ? '#6a4428' : '#3a2418')) : hull(i, j, 0) && !hull(i, j, 1) && k === 0 ? '#4a2e1c' : (i === 12 || i === 21) && (j === 5 || j === 6) ? '#3a2418' : null)); // 船尾の部屋、手すり、柱
  for (let k = 0; k < 11; k++) L.push(mk(30, 12, (i, j) => (i === 12 || i === 21) && (j === 5 || j === 6) ? '#3a2418' : (k > 0 && k < 10 && (i === 13 || i === 22) && j > 0 + (k > 6 ? 1 : 0) && j < 11 - (k > 6 ? 1 : 0)) ? (k % 4 === 0 ? '#c8b890' : sail) : (k === 10 && (i === 12 || i === 21) && j === 5) ? flag : null)); // 帆
  L.push(mk(30, 12, (i, j) => (i > 9 && i < 13 && j === 5) ? flag : null));
  return L;
}
const SH = { me: shipSlices('#f4ecd8', '#2a6ae0'), foe: shipSlices('#3a3440', '#d8302a') };
// 島：丸い輪切り（砂 → 草 → 岩）と、やしの木
function isle(r, seed) { const L = [], sz = r * 2 + 4, edge = (i, j, rr) => Math.hypot(i - sz / 2, (j - sz / 2) * 1.2) < rr + Math.sin(Math.atan2(j - sz / 2, i - sz / 2) * 5 + seed) * r * .14;
  for (let k = 0; k < 9; k++) { const rr = r * (1 - k * .1); L.push(mk(sz, sz, (i, j) => edge(i, j, rr) ? (k < 2 ? (edge(i, j, rr - 1.5) ? '#f0dca0' : '#ffeec0') : k < 6 ? (hash(i, j + k) > .5 ? '#5aa85a' : '#4a9450') : '#8a8478') : null)); }
  return L; }
const ISLES = [[90, -60, isle(22, 1)], [-140, 40, isle(28, 3)], [60, 150, isle(18, 5)], [-60, -170, isle(24, 7)], [220, 60, isle(16, 2)]];
const palm = [...Array(10)].map((_, k) => mk(13, 13, (i, j) => k < 7 ? (Math.hypot(i - 6, j - 6) < 1 ? '#6a4a2a' : null) : (Math.abs(i - 6) + Math.abs(j - 6) < 6 - (k - 7) * 2 && ((i + j) % 2 === 0 || Math.abs(i - 6) < 2 || Math.abs(j - 6) < 2)) ? (k === 9 ? '#6ad06a' : '#3a9a4a') : null));
const lightH = [...Array(16)].map((_, k) => mk(9, 9, (i, j) => { const r = Math.hypot(i - 4, j - 4); return k < 12 ? (r < 3.4 - k * .08 ? (Math.floor(k / 3) % 2 ? '#d8302a' : '#f4f4f4') : null) : k < 14 ? (r < 2.2 ? '#fff0a0' : null) : (r < 3 - (k - 14) ? '#d8302a' : null); }));
const wave = mk(32, 32, (i, j) => ((i + Math.floor(Math.sin(j * .4) * 3)) % 16 < 5 && j % 8 < 2) ? '#3aa0c8' : hash(i, j) > .97 ? '#6ac8e0' : null);
function stack(L, x, y, a, step = 1) { for (let k = 0; k < L.length; k++) { g.save(); g.translate(Math.round(x), Math.round(y - k * step)); g.rotate(a); g.drawImage(L[k], -L[k].width / 2, -L[k].height / 2); g.restore(); } }
const ships = [{ x: 0, y: 0, a: 0, me: 1, cd: 1, hp: 3 }, { x: 120, y: -40, a: 2, cd: 2 }, { x: -110, y: 90, a: 4, cd: 3 }, { x: -40, y: -120, a: 1, cd: 2.5 }];
let balls = [], parts = [], wake = [], last = performance.now(), t = 0;
const puff = (x, y, n, col, sp = 14, life = .8) => { for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - .5) * sp, vy: (Math.random() - .5) * sp - 3, l: life * (.6 + Math.random() * .6), m: life, c: col, s: 1 + Math.floor(Math.random() * 3) }); };
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt; const me = ships[0];
  for (const s of ships) {
    let want; if (s.me) { const tg = ships.slice(1).sort((p, q) => Math.hypot(p.x - me.x, p.y - me.y) - Math.hypot(q.x - me.x, q.y - me.y))[0]; want = Math.atan2(tg.y - me.y, tg.x - me.x) + 1.2; } else want = Math.atan2(me.y - s.y, me.x - s.x) + (Math.hypot(me.x - s.x, me.y - s.y) < 90 ? 1.5 : .2);
    for (const [ix, iy, L] of ISLES) { const d = Math.hypot(s.x - ix, s.y - iy), r = L[0].width / 2 + 22; if (d < r) want = Math.atan2(s.y - iy, s.x - ix) + .6; }
    let da = want - s.a; while (da > Math.PI) da -= 6.283; while (da < -Math.PI) da += 6.283; s.a += Math.max(-.7 * dt, Math.min(.7 * dt, da)); const v = s.me ? 30 : 24; s.x += Math.cos(s.a) * v * dt; s.y += Math.sin(s.a) * v * dt;
    if (Math.random() < .5) wake.push({ x: s.x - Math.cos(s.a) * 14 + (Math.random() - .5) * 6, y: s.y - Math.sin(s.a) * 14 + (Math.random() - .5) * 6, l: 2.4 });
    if ((s.cd -= dt) < 0) { const tg = s.me ? ships.slice(1).sort((p, q) => Math.hypot(p.x - s.x, p.y - s.y) - Math.hypot(q.x - s.x, q.y - s.y))[0] : me, d = Math.hypot(tg.x - s.x, tg.y - s.y); if (d < 130) { s.cd = s.me ? 1.1 : 2.6; const a = Math.atan2(tg.y - s.y, tg.x - s.x) + (Math.random() - .5) * .25; balls.push({ x: s.x, y: s.y, vx: Math.cos(a) * 90, vy: Math.sin(a) * 90, l: d / 90, m: d / 90, from: s }); puff(s.x + Math.cos(a) * 8, s.y + Math.sin(a) * 8 - 6, 7, '#e8e8f0', 12, .9); } else s.cd = .3; }
    if (!s.me && Math.hypot(s.x - me.x, s.y - me.y) > 260) { const a = Math.random() * 6.283; s.x = me.x + Math.cos(a) * 200; s.y = me.y + Math.sin(a) * 200; }
  }
  for (const b of balls) { b.x += b.vx * dt; b.y += b.vy * dt; b.l -= dt; if (b.l <= 0) { const hit = ships.find(s => s !== b.from && Math.hypot(s.x - b.x, s.y - b.y) < 14); if (hit) { puff(b.x, b.y - 6, 14, '#ffb040', 30, .5); puff(b.x, b.y - 6, 8, '#4a3a34', 16, 1.2); if (!hit.me && Math.random() < .4) { puff(hit.x, hit.y - 6, 26, '#ff7a2a', 40, .8); const a = Math.random() * 6.283; hit.x = me.x + Math.cos(a) * 210; hit.y = me.y + Math.sin(a) * 210; } } else puff(b.x, b.y, 9, '#eaffff', 18, .6); } }
  balls = balls.filter(b => b.l > 0); for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 4 * dt; p.l -= dt; } parts = parts.filter(p => p.l > 0); for (const w of wake) w.l -= dt; wake = wake.filter(w => w.l > 0);
  // 絵
  const cx = me.x - 200, cy = me.y - 125; g.fillStyle = '#1a6a94'; g.fillRect(0, 0, 400, 250);
  const ox = -(((cx + t * 4) % 32) + 32) % 32, oy = -(((cy + t * 2) % 32) + 32) % 32; for (let y = oy; y < 250; y += 32) for (let x = ox; x < 400; x += 32) g.drawImage(wave, Math.round(x), Math.round(y));
  for (let c = 0; c < 3; c++) { const sx = ((c * 190 + t * 6 - cx * .3) % 600 + 600) % 600 - 100, sy = 40 + c * 80 - cy * .3 % 250; g.fillStyle = 'rgba(8,40,70,.25)'; for (let y = -10; y < 10; y++) { const w = Math.round(Math.sqrt(100 - y * y) * 3.4); g.fillRect(Math.round(sx - w), Math.round(((sy % 290) + 290) % 290 - 20 + y), w * 2, 1); } }
  for (const w of wake) { g.fillStyle = w.l > 1.4 ? '#eaffff' : w.l > .7 ? '#9adcf0' : '#5ab8d8'; const s = w.l > 1.4 ? 2 : 1; g.fillRect(Math.round(w.x - cx), Math.round(w.y - cy), s, s); }
  const items = [...ISLES.map(([x, y, L], i) => ({ y, f: () => { stack(L, x - cx, y - cy, 0); stack(palm, x - cx - 5, y - cy - 9, t * .2 + i, 1.2); if (i % 2 === 0) stack(palm, x - cx + 8, y - cy - 7, 1 + i, 1.1); if (i === 1) { stack(lightH, x - cx + 12, y - cy - 9, 0); const la = t * 1.4; g.fillStyle = 'rgba(255,240,160,.3)'; for (let q = 4; q < 60; q += 2) g.fillRect(Math.round(x - cx + 12 + Math.cos(la) * q), Math.round(y - cy - 22 + Math.sin(la) * q * .7), 1 + (q >> 4), 1 + (q >> 4)); } } })), ...ships.map(s => ({ y: s.y, f: () => { g.fillStyle = 'rgba(8,40,70,.35)'; for (let y = -4; y < 5; y++) { const w = Math.round(Math.sqrt(25 - y * y) * 3); g.fillRect(Math.round(s.x - cx - w + 3), Math.round(s.y - cy + 3 + y), w * 2, 1); } stack(s.me ? SH.me : SH.foe, s.x - cx, s.y - cy + Math.sin(t * 2 + s.x) * .6, s.a); } }))].sort((a, b) => a.y - b.y);
  for (const it of items) it.f();
  for (const b of balls) { const h = Math.sin((1 - b.l / b.m) * Math.PI) * 14; g.fillStyle = 'rgba(8,40,70,.4)'; g.fillRect(Math.round(b.x - cx), Math.round(b.y - cy), 2, 1); g.fillStyle = '#20202a'; g.fillRect(Math.round(b.x - cx), Math.round(b.y - cy - 8 - h), 2, 2); }
  for (const p of parts) { g.fillStyle = p.c; g.globalAlpha = p.l / p.m > .3 ? 1 : .5; g.fillRect(Math.round(p.x - cx), Math.round(p.y - cy), p.s, p.s); } g.globalAlpha = 1;
  for (let i = 0; i < 4; i++) { const bx = ((t * 20 + i * 130) % 500) - 50, by = 30 + i * 50 + Math.sin(t + i) * 8, f = Math.sin(t * 8 + i) > 0 ? 1 : 0; g.fillStyle = '#f4f4f4'; g.fillRect(Math.round(bx) - 2, Math.round(by) - f, 2, 1); g.fillRect(Math.round(bx) + 1, Math.round(by) - f, 2, 1); g.fillRect(Math.round(bx), Math.round(by), 1, 1); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
