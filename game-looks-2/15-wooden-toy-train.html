<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">

import * as THREE from 'three';

renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

scene.add(new THREE.HemisphereLight(0xfff4e2, 0xc8a880, 1.1)); const sun = new THREE.DirectionalLight(0xffdcae, 2.6); sun.position.set(-18, 26, 12); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 5; sun.shadow.bias = -.0006; Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 2, far: 80 }); scene.add(sun);
function wood(base, planks) { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); x.fillStyle = base; x.fillRect(0, 0, 256, 256); for (let i = 0; i < 44; i++) { const y0 = Math.random() * 256, a = 2 + Math.random() * 6, f = .01 + Math.random() * .02, p = Math.random() * 6; x.strokeStyle = `rgba(60,30,10,${.05 + Math.random() * .12})`; x.lineWidth = .6 + Math.random() * 1.6; x.beginPath(); for (let u = 0; u <= 256; u += 8) x.lineTo(u, y0 + Math.sin(u * f + p) * a); x.stroke(); } if (planks) { x.fillStyle = 'rgba(50,25,8,.45)'; for (let i = 0; i < 4; i++) { x.fillRect(0, i * 64, 256, 2); x.fillRect((i * 97) % 256, i * 64, 2, 64); } } const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; }
const W = Object.fromEntries(Object.entries({ nat: '#e6c48e', red: '#d05a44', blue: '#4a88bc', yel: '#e8bc48', grn: '#62a466', wht: '#f4ecdc', dark: '#8a5a38' }).map(([k, c]) => [k, new THREE.MeshStandardMaterial({ map: wood(c), roughness: .55 })]));

const P = (geo, mat, x, y, z, p = scene) => { const m = S(new THREE.Mesh(geo, mat)); m.position.set(x, y, z); p.add(m); return m; };
const B = (w, h, d, mat, x, y, z, p) => P(new THREE.BoxGeometry(w, h, d), mat, x, y, z, p);
const ft = wood('#d8bc90', true); ft.repeat.set(7, 7); const fl = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ map: ft, roughness: .7 })); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; scene.add(fl);
const rug = new THREE.Mesh(new THREE.CircleGeometry(21, 40), new THREE.MeshStandardMaterial({ color: '#8fb8a0', roughness: 1 })); rug.rotation.x = -Math.PI / 2; rug.position.y = .02; rug.receiveShadow = true; scene.add(rug); const rug2 = new THREE.Mesh(new THREE.RingGeometry(19.4, 20.2, 40), new THREE.MeshStandardMaterial({ color: '#f4ecdc', roughness: 1 })); rug2.rotation.x = -Math.PI / 2; rug2.position.y = .03; scene.add(rug2);

for (let i = 0; i < 44; i++) { const u = i / 44 * 6.283, [x, z] = rail(u), [x2, z2] = rail(u + .01), a = Math.atan2(x2 - x, z2 - z), g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = a; B(1.9, .28, 1.75, W.nat, 0, .14, 0, g); for (const s of [-.5, .5]) { const gr = new THREE.Mesh(new THREE.BoxGeometry(.2, .05, 1.76), new THREE.MeshStandardMaterial({ color: '#b08a58', roughness: .8 })); gr.position.set(s, .285, 0); g.add(gr); } scene.add(g); }
// 橋とトンネル
for (const s of [-1, 1]) { B(.5, 3, 3.6, W.red, 0 + s * 1.5, 1.5, -RZ); } B(3.5, .5, 3.6, W.red, 0, 3.1, -RZ); const arch = P(new THREE.CylinderGeometry(1.75, 1.75, 3.6, 16, 1, false, 0, Math.PI), W.red, 0, 3.3, -RZ); arch.rotation.set(Math.PI / 2, 0, Math.PI / 2);
B(4, 2.6, 3.4, W.grn, RX, 1.3, 0).visible = false; for (const s of [-1, 1]) B(.6, 2.6, 4.4, W.grn, RX + s * 1.5, 1.3, 0); B(3.6, .6, 4.4, W.grn, RX, 2.9, 0); P(new THREE.ConeGeometry(.9, 1.6, 8), W.grn, RX - .8, 4, .6); P(new THREE.ConeGeometry(.7, 1.3, 8), W.grn, RX + .7, 3.85, -.8);
// 積み木の町（レールの内がわ）
const cols = [W.red, W.blue, W.yel, W.grn, W.wht, W.nat];
function tower(x, z, n, w, seed) { let y = 0; for (let k = 0; k < n; k++) { const h = .9 + hash(seed, k) * .7, m = cols[Math.floor(hash(seed + k, 3) * 6)]; const b = hash(seed, k + 9) > .75 ? P(new THREE.CylinderGeometry(w * .5, w * .5, h, 16), m, x, y + h / 2, z) : B(w, h, w, m, x + (hash(k, seed) - .5) * .12, y + h / 2, z + (hash(seed, k + 4) - .5) * .12); b.rotation.y = (hash(seed, k + 5) - .5) * .3; y += h; } const top = hash(seed, 20); if (top > .5) P(new THREE.ConeGeometry(w * .72, w * .9, 4), W.red, x, y + w * .45, z).rotation.y = Math.PI / 4; else { const a = P(new THREE.CylinderGeometry(w * .5, w * .5, w, 3), W.blue, x, y + w * .25, z); a.rotation.set(0, 0, Math.PI / 2); a.rotation.x = Math.PI / 2; } }
[[-6, -3, 4, 2], [-2.6, -4, 3, 1.8], [1.2, -3.4, 5, 2], [5, -2.6, 3, 1.9], [-7, 2.4, 3, 2.2], [-3, 3.4, 2, 2.6], [2, 3, 4, 1.8], [6, 3.4, 2, 2.2], [-.6, .2, 6, 1.7]].forEach(([x, z, n, w], i) => tower(x, z, n, w, i * 7 + 1));
for (const [x, z] of [[-9.6, -.4], [8.8, 0], [3.8, .4], [-4.6, .6], [0, -6.4], [-12, 12], [12.6, -11.6], [-17, -3], [17.4, 5]]) { P(new THREE.CylinderGeometry(.16, .16, 1.2, 8), W.dark, x, .6, z); P(new THREE.ConeGeometry(.95, 2, 12), W.grn, x, 2.1, z); }
for (const [x, z, c] of [[-4.6, -1], [3.2, -.9], [.6, 5.4], [-8.6, 5]].map((p, i) => [...p, [W.red, W.blue, W.yel, W.wht][i]])) { P(new THREE.CylinderGeometry(.32, .4, .9, 12), c, x, .45, z); P(new THREE.SphereGeometry(.34, 12, 10), W.nat, x, 1.15, z); }
B(2, 1, 3.4, W.wht, -15, .5, 9).rotation.y = .5; B(1.2, 1.2, 1.2, W.yel, -17.5, .6, 6).rotation.y = .3; P(new THREE.CylinderGeometry(.6, .6, 1.2, 16), W.blue, 15.4, .6, 11).rotation.z = Math.PI / 2; B(1.4, .7, 1.4, W.red, 13, .35, 13).rotation.y = .7;
// 汽車：機関車 ＋ 3 両
function wheels(g, zs, r = .36) { const ws = []; for (const z of zs) for (const s of [-.62, .62]) { const w = P(new THREE.CylinderGeometry(r, r, .2, 14), W.dark, s, r, z, g); w.rotation.z = Math.PI / 2; ws.push(w); } return ws; }
const train = [], allW = [];
{ const g = new THREE.Group(); B(1.1, .3, 2.6, W.red, 0, .7, 0, g); const bo = P(new THREE.CylinderGeometry(.5, .5, 1.5, 16), W.blue, 0, 1.3, .4, g); bo.rotation.x = Math.PI / 2; B(1.1, 1.3, .9, W.red, 0, 1.5, -.8, g); B(1.3, .16, 1.1, W.yel, 0, 2.2, -.8, g); P(new THREE.CylinderGeometry(.16, .2, .7, 10), W.dark, 0, 2.1, .8, g); P(new THREE.CylinderGeometry(.24, .16, .2, 10), W.dark, 0, 2.5, .8, g); P(new THREE.SphereGeometry(.2, 10, 8), W.yel, 0, 1.9, .2, g); const f = new THREE.Mesh(new THREE.CircleGeometry(.3, 14), new THREE.MeshBasicMaterial({ color: '#fff4c8' })); f.position.set(0, 1.3, 1.16); g.add(f); allW.push(...wheels(g, [-.8, .1, .9])); scene.add(g); train.push(g); }
[[W.yel, 0], [W.grn, 1], [W.blue, 2]].forEach(([m, k]) => { const g = new THREE.Group(); B(1.1, .3, 2, W.nat, 0, .7, 0, g); if (k === 0) { for (let q = 0; q < 3; q++) { const l = P(new THREE.CylinderGeometry(.22, .22, 1.8, 10), W.dark, -.26 + q * .26, 1.08 + (q === 1 ? .36 : 0), 0, g); l.rotation.x = Math.PI / 2; } } else if (k === 1) { B(.9, .8, .8, W.grn, 0, 1.25, -.4, g); B(.7, .6, .7, W.red, 0, 1.15, .5, g); B(.5, .5, .5, W.yel, 0, 1.9, -.4, g); } else { B(1, 1, 1.7, m, 0, 1.35, 0, g); B(1.1, .14, 1.9, W.red, 0, 1.92, 0, g); } allW.push(...wheels(g, [-.6, .6], .32)); scene.add(g); train.push(g); });
const fx = K.fx(scene, 60); let pT = 0;
const post = K.post(renderer, `void main(){float rad=smoothstep(.12,.5,abs(vUv.y-.52))*4.5;vec3 c=vec3(0.);for(int i=-2;i<=2;i++)for(int j=-2;j<=2;j++)c+=src(vUv+vec2(float(i),float(j))*rad/size);c/=25.;
float l=dot(c,vec3(.3,.59,.11));c=mix(vec3(l),c,1.12);c*=1.-dot(vUv-.5,vUv-.5)*.35;gl_FragColor=vec4(c,1.);}`, {}, { scale: .8 }); onResize(post.resize);
K.loop((dt, t) => {
  const u0 = t * .34; train.forEach((g, k) => { const u = u0 - k * .215 - (k ? .03 : 0), [x, z] = rail(u), [x2, z2] = rail(u + .02); g.position.set(x, .28, z); g.rotation.y = Math.atan2(x2 - x, z2 - z); g.rotation.z = Math.sin(t * 9 + k) * .012; });

  if ((pT -= dt) < 0) { pT = .22; const e = train[0], sx = e.position.x + Math.sin(e.rotation.y) * .8, sz = e.position.z + Math.cos(e.rotation.y) * .8; fx.emit('puff', sx, 3.1, sz, { vy: 1.7, life: 1.8, size: .9, grow: 1.8, spread: .3, fog: false }); }
  fx.update(dt);
  const a = .5 + Math.sin(t * .08) * .5; cam.position.set(Math.sin(a) * 44, 26 + Math.sin(t * .11) * 3, Math.cos(a) * 44); cam.lookAt(train[0].position.x * .25, 1.4, train[0].position.z * .25);
  post.render(scene, cam, t);
});
