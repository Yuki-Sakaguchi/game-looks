<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2-02 湖の釣り ローポリの朝霧</title>
<style>
html,body{margin:0;height:100%;background:#d8c8d0;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#3a3048;opacity:.85}
</style>
<div id="cap">2-02 ─ 湖の釣り / ローポリの朝霧 ＋ ドット絵の水しぶき　｜　見るだけ</div>
<script src="kit.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 朝のうすい霧。遠くの森ほど霧の桃色にとけて、形だけが重なって見える（霧を濃く、近くから始める）。
// 低い朝日のだいだいと、空からの青い光の 2 色で、木の片側だけが暖かく染まる。
// 水面は 1 枚の平らな板。動きは、魚がはねたときのドット絵の水しぶきと、広がる輪で出す
import * as THREE from 'three';
const K = KIT(THREE), { scene, cam, renderer } = K.stage({ fov: 38 }), { add, box, flat, glow, hash } = K;
scene.background = K.sky([[0, '#5f7cb4'], [.42, '#c9b2cc'], [.6, '#ffd2b4'], [.74, '#ffeacc'], [1, '#c4ccd8']]); scene.fog = new THREE.Fog('#e6cdd2', 16, 150);
scene.add(new THREE.HemisphereLight(0xcfd8ff, 0x6a7a6a, 1.25)); const sun = new THREE.DirectionalLight(0xffc49a, 2.4); sun.position.set(-60, 16, -200); scene.add(sun);
add(scene, new THREE.CircleGeometry(15, 30), glow('#fff4dc', { fog: false }), -70, 18, -300);
const water = add(scene, new THREE.PlaneGeometry(700, 700), new THREE.MeshStandardMaterial({ color: '#9fb8c6', roughness: .3, metalness: .2 }), 0, 0, 0); water.rotation.x = -Math.PI / 2;
const C = K.colors('#e0cfa0', '#7fa26a', '#6a9060', '#5a7f58');
const H = (x, z) => { const r = Math.hypot(x * .8, z); return Math.min(9, (r - 34) * .2) + Math.sin(x * .11) * Math.cos(z * .09) * 1.6 * Math.max(0, Math.min(1, (r - 30) / 20)); };
scene.add(K.terrain(H, 80, 80, 2.6, (y, x, z) => y < .5 ? C[0] : C[1 + Math.floor(hash(Math.round(x * .3), Math.round(z * .3)) * 3)]).mesh);
const LEAF = ['#4a7a5a', '#3f6f56', '#56866a'];
for (let i = 0; i < 130; i++) { const a = hash(i, 1) * 6.283, r = 40 + hash(i, 2) * 46, x = Math.cos(a) * r / .8, z = Math.sin(a) * r, y = H(x, z); if (y < .6) continue; const t = K.pine(5 + hash(i, 3) * 8, LEAF[i % 3], '#5a4636'); t.position.set(x, y - .2, z); scene.add(t); }
for (let i = 0; i < 40; i++) { const a = hash(i, 4) * 6.283, x = Math.cos(a) * 34 / .8 + (hash(i, 5) - .5) * 5, z = Math.sin(a) * 34 + (hash(i, 6) - .5) * 5; for (let k = 0; k < 4; k++) add(scene, new THREE.ConeGeometry(.07, 1.6 + hash(i, k) * 1.2, 3), '#7a8a4a', x + k * .25, .8, z + hash(k, i) * .5); }
// 桟橋
for (let k = 0; k < 13; k++) { box(scene, 2.2, .14, .8, k % 2 ? '#a88660' : '#96744e', 0, .55, 34 - k * .9); if (k % 4 === 0) for (const s of [-1, 1]) add(scene, new THREE.CylinderGeometry(.12, .12, 1.8, 5), '#6a5038', s * 1, .1, 34 - k * .9); }
// 小舟と釣り人
const boat = new THREE.Group(); boat.position.set(5, 0, 12); boat.rotation.y = .5; scene.add(boat);
box(boat, 1.3, .45, 3, '#b0584a', 0, .2, 0); const bow = add(boat, new THREE.ConeGeometry(.75, 1.2, 4), '#b0584a', 0, .2, -2.05); bow.rotation.set(-Math.PI / 2, Math.PI / 4, 0); bow.scale.z = .45; box(boat, 1.1, .08, .4, '#e8d8b0', 0, .42, .5);
box(boat, .55, .66, .4, '#3f6a9a', 0, .9, .5); add(boat, new THREE.IcosahedronGeometry(.25, 0), '#f0cfa8', 0, 1.48, .5); add(boat, new THREE.ConeGeometry(.5, .22, 8), '#e8d08a', 0, 1.72, .5);
const rod = add(boat, new THREE.CylinderGeometry(.015, .03, 3.4, 4), '#4a3828', .9, 1.9, -.6); rod.rotation.set(-.7, 0, -.55);
const bob = add(scene, new THREE.SphereGeometry(.14, 6, 5), glow('#e0402e'), 8.6, .05, 8.4);
const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: .6 })); scene.add(line);
// 霧の帯（いつもカメラを向く、ふちがぼけた板）
const mc = document.createElement('canvas'); mc.width = 128; mc.height = 32; { const x = mc.getContext('2d'); x.scale(1, .25); const g = x.createRadialGradient(64, 64, 2, 64, 64, 64); g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 128, 128); }
const mt = new THREE.CanvasTexture(mc), mists = [...Array(16)].map((_, i) => { const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: mt, color: '#fff0ea', transparent: true, opacity: .22, depthWrite: false })); m.scale.set(46 + hash(i, 1) * 40, 5 + hash(i, 2) * 5, 1); m.userData = { a: hash(i, 3) * 6.283, r: 24 + hash(i, 4) * 40, y: 1.2 + hash(i, 5) * 3 }; scene.add(m); return m; });
// 広がる輪、はねる魚、鳥
const rings = [...Array(8)].map(() => { const m = add(scene, new THREE.RingGeometry(.9, 1, 20), new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0, depthWrite: false }), 0, .03, 0); m.rotation.x = -Math.PI / 2; m.userData.k = 9; return m; });
const ripple = (x, z, d = 0) => { const r = rings.find(q => q.userData.k > 1.6) || rings[0]; r.position.set(x, .03, z); r.userData.k = -d; };
const fish = add(scene, new THREE.ConeGeometry(.16, .7, 4), '#c8d4dc', 0, -5, 0); let jump = { t: 9 }, nextJ = 2, biteT = 5;
const birds = [...Array(5)].map((_, i) => { const g = new THREE.Group(); for (const s of [-1, 1]) { const w = box(g, .9, .04, .3, glow('#3a3048'), s * .42, 0, 0); w.userData.s = s; } g.userData.o = i; scene.add(g); return g; });
const fx = K.fx(scene, 60);
K.loop((dt, t) => {
  if ((nextJ -= dt) < 0) { nextJ = 2 + Math.random() * 3; const a = Math.random() * 6.283, r = 6 + Math.random() * 18; jump = { t: 0, x: Math.cos(a) * r, z: Math.sin(a) * r, d: Math.random() * 6.283 }; ripple(jump.x, jump.z); for (let k = 0; k < 4; k++) fx.emit('splash', jump.x, .5, jump.z, { vy: 2.5, spread: 2, life: .6, size: 1, grav: -6 }); }
  jump.t += dt; if (jump.t < .8) { const u = jump.t / .8; fish.position.set(jump.x + Math.cos(jump.d) * u * 2.4, Math.sin(u * Math.PI) * 1.5, jump.z + Math.sin(jump.d) * u * 2.4); fish.rotation.set(0, -jump.d, -Math.PI / 2 + (u - .5) * 2.4); if (u > .92 && !jump.done) { jump.done = 1; ripple(fish.position.x, fish.position.z); fx.emit('splash', fish.position.x, .4, fish.position.z, { vy: 2, life: .5, size: 1.1 }); } } else fish.position.y = -5;
  if ((biteT -= dt) < 0) { biteT = 5 + Math.random() * 4; ripple(bob.position.x, bob.position.z); ripple(bob.position.x, bob.position.z, .4); fx.emit('splash', bob.position.x, .3, bob.position.z, { vy: 1.6, life: .5, size: .8 }); }
  for (const r of rings) { r.userData.k += dt; const k = Math.max(0, r.userData.k); r.scale.setScalar(.4 + k * 2.4); r.material.opacity = r.userData.k < 0 ? 0 : Math.max(0, .7 - k * .45); }
  fx.update(dt);
  boat.position.y = Math.sin(t * 1.1) * .05; boat.rotation.z = Math.sin(t * .9) * .03; bob.position.y = .04 + Math.sin(t * 2.2) * .04 - (biteT > 4.4 ? .12 : 0);
  const tip = new THREE.Vector3(.9 - 1.0, 3.15, -1.75).applyMatrix4(boat.matrixWorld); line.geometry.setFromPoints([tip, bob.position]);
  for (const m of mists) { const a = m.userData.a + t * .012; m.position.set(Math.cos(a) * m.userData.r, m.userData.y, Math.sin(a) * m.userData.r); }
  birds.forEach((b, i) => { const u = ((t * .03 + i * .013) % 1); b.position.set(-90 + u * 180 + i * 3, 22 + Math.sin(i * 2) * 2 + Math.sin(t + i) * .5, -60 - i * 4); b.children.forEach(w => { w.rotation.z = w.userData.s * Math.sin(t * 6 + i) * .6; }); });
  const a = .9 + Math.sin(t * .06) * .5; cam.position.set(4 + Math.cos(a) * 27, 5.5 + Math.sin(t * .1) * .8, 11 + Math.sin(a) * 27); cam.lookAt(3, 1, 9);
  renderer.render(scene, cam);
});
</script>
</html>
