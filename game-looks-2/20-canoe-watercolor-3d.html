<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2-20 渓谷カヌー 水彩の立体</title>
<style>
html,body{margin:0;height:100%;background:#f6f1e4;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#4a5a6a;background:#f6f1e4;padding:0 6px}
</style>
<div id="cap">2-20 ─ 渓谷カヌー / 立体の場面を水彩で描く　｜　見るだけ</div>
<script src="kit.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 前の 28（水彩）を奥行きのある立体でやりなおした。ローポリの渓谷を描いてから、画面全体を水彩に変える。
// 色の境目をゆらゆらとゆがめ、同じ色の面のふちに絵の具がたまった濃い線を置き、色はうすめて紙の白を透かす。
// 明るい所は塗り残して紙のまま。紙の目のざらつきを掛け、画面のはしは塗らずに余白にする
import * as THREE from 'three';
const K = KIT(THREE), { scene, cam, renderer, onResize } = K.stage({ fov: 50, far: 600 }), { add, box, flat, hash } = K;
scene.background = K.sky([[0, '#8ab4dc'], [.45, '#cfe2ee'], [.62, '#fbf2dc'], [1, '#e8eef0']]); scene.fog = new THREE.Fog('#dfe9ee', 30, 240);
scene.add(new THREE.HemisphereLight(0xeaf4ff, 0x8a9a80, 1.5)); const sun = new THREE.DirectionalLight(0xfff0d0, 2.4); scene.add(sun, sun.target);
const C = K.colors('#7fae6a', '#6a9e62', '#c9a878', '#a88a6a', '#8fa0a8', '#e8dcb0');
const river = z => Math.sin(z * .035) * 12 + Math.sin(z * .011) * 9;
const H = (x, z) => { const d = Math.abs(x - river(z)); return Math.min(34, Math.max(-3, (d - 7) * .9)) * (0.7 + .3 * Math.sin(z * .05 + x * .03)) + Math.sin(x * .2) * Math.cos(z * .17) * 1.2 * Math.min(1, d / 12) + Math.max(0, d - 30) * .3; };
const land = K.terrain(H, 80, 96, 2.5, (y, x, z) => y < .6 ? C[5] : y < 3 ? C[hash(Math.round(x), Math.round(z)) > .5 ? 0 : 1] : y < 16 ? (Math.sin(y * 1.1 + x * .1) > 0 ? C[2] : C[3]) : y < 22 ? C[4] : C[1]); scene.add(land.mesh);
const water = add(scene, new THREE.PlaneGeometry(900, 900), new THREE.MeshStandardMaterial({ color: '#5a9ab8', roughness: .35 }), 0, 0, 0); water.rotation.x = -Math.PI / 2;
// 木・岩・滝（先へ送りなおす）
const SPAN = 260, props = [];
for (let i = 0; i < 110; i++) { const k = i % 5, g = k < 3 ? K.pine(4 + hash(i, 1) * 6, ['#4f8a5a', '#3f7a54', '#6a9a5a'][k], '#6a5038') : new THREE.Group(); if (k === 3) { add(g, new THREE.CylinderGeometry(.3, .4, 3, 5), '#6a5038', 0, 1.5, 0); add(g, new THREE.IcosahedronGeometry(2.4, 0), '#e0a84a', 0, 4.4, 0); } if (k === 4) add(g, new THREE.IcosahedronGeometry(1 + hash(i, 2) * 2, 0), '#8a8a90', 0, .4, 0); g.userData = { off: (hash(i, 3) < .5 ? -1 : 1) * (8 + hash(i, 4) * (k === 4 ? 4 : 40)), oz: hash(i, 5) * SPAN }; scene.add(g); props.push(g); }
const falls = [...Array(3)].map((_, i) => { const g = new THREE.Group(); add(g, new THREE.PlaneGeometry(3, 22), new THREE.MeshBasicMaterial({ color: '#f4fbff', side: THREE.DoubleSide }), 0, 11, 0); g.userData = { oz: i * 90 + 30, side: i % 2 ? 1 : -1 }; scene.add(g); return g; });
const peaks = [...Array(6)].map((_, i) => { const m = add(scene, new THREE.ConeGeometry(50 + hash(i, 6) * 40, 80 + hash(i, 7) * 60, 6), '#a8b4c8'); m.userData = { x: (i - 2.5) * 120 }; return m; });
// カヌー
const cn = new THREE.Group(); scene.add(cn);
const hull = add(cn, new THREE.SphereGeometry(1, 10, 6), flat('#c8503c'), 0, .2, 0); hull.scale.set(.75, .4, 3.2); box(cn, 1, .08, 4.4, '#e8d0a0', 0, .42, 0);
box(cn, .6, .8, .44, '#f2c230', 0, 1, -.3); add(cn, new THREE.IcosahedronGeometry(.28, 0), '#f0cfa8', 0, 1.66, -.3); add(cn, new THREE.ConeGeometry(.5, .3, 8), '#e8dcb0', 0, 1.92, -.3); box(cn, .5, .5, .5, '#6a8a5a', 0, .7, .9);
const paddle = new THREE.Group(); paddle.position.set(0, 1.3, -.2); box(paddle, 3.2, .07, .07, '#8a6a4a', 0, 0, 0); for (const s of [-1, 1]) box(paddle, .7, .06, .34, '#8a6a4a', s * 1.6, 0, 0); cn.add(paddle);
const birds = [...Array(5)].map((_, i) => { const g = new THREE.Group(); for (const s of [-1, 1]) { const w = box(g, 1, .04, .34, new THREE.MeshBasicMaterial({ color: '#4a5a6a' }), s * .46, 0, 0); w.userData.s = s; } scene.add(g); return g; });
const fx = K.fx(scene, 100); let pT = 0;
const post = K.post(renderer, `float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*n2(p);p=p*2.1+3.1;a*=.5;}return s;}
void main(){vec2 asp=vec2(res.x/res.y,1.),p=vUv*asp;
vec2 w=vec2(fbm(p*5.+1.),fbm(p*5.+9.))-.5;vec2 uv=vUv+w*.012;
vec3 c=vec3(0.);for(int i=-2;i<=2;i++)for(int j=-2;j<=2;j++)c+=src(uv+vec2(float(i),float(j))*2.2/size);c/=25.;
vec2 d=3./size;float l0=dot(c,vec3(.33)),gx=dot(src(uv+vec2(d.x,0.))-src(uv-vec2(d.x,0.)),vec3(.33)),gy=dot(src(uv+vec2(0.,d.y))-src(uv-vec2(0.,d.y)),vec3(.33));float edge=smoothstep(.04,.22,length(vec2(gx,gy)));
float lum=dot(c,vec3(.3,.59,.11));c=mix(vec3(lum),c,1.15);c=mix(c,vec3(1.),.22+.18*smoothstep(.55,.95,lum));
float gran=fbm(p*60.);c*=1.-edge*.34;c*=.9+.16*gran;c=mix(c,c*c*1.05,.25*fbm(p*3.+4.));
vec3 paper=vec3(.965,.945,.895)*(.96+.06*fbm(p*140.));
vec2 e=abs(vUv-.5)*2.;float m=smoothstep(.97,.86,max(e.x,e.y)+ (fbm(p*7.)-.5)*.16);
c=mix(paper,c*paper*1.04,m);gl_FragColor=vec4(c,1.);}`); onResize(post.resize);
K.loop((dt, t) => {
  const z = -t * 7, x = river(z), dx = (river(z - 1) - river(z + 1)) / 2;
  cn.position.set(x, Math.sin(t * 2) * .05, z); cn.rotation.set(0, Math.atan(dx), Math.sin(t * 1.5) * .05); const st = Math.sin(t * 2.4); paddle.rotation.set(st * .5, 0, st * .7);
  land.follow(x, z, -84);
  for (const g of props) { const pz = z + 26 - ((((g.userData.oz - z) % SPAN) + SPAN) % SPAN), px = river(pz) + g.userData.off; g.position.set(px, Math.max(-.2, H(px, pz)) - .2, pz); }
  for (const g of falls) { const pz = z + 20 - ((((g.userData.oz - z) % 270) + 270) % 270), px = river(pz) + g.userData.side * 9.5; g.position.set(px, 0, pz); g.rotation.y = g.userData.side * -1.2; if (Math.random() < .5 && Math.abs(pz - z) < 120) fx.emit('puff', px - g.userData.side * 1.5, .6, pz + (Math.random() - .5) * 3, { vy: 2, spread: 2, life: 1, size: 1.6, grow: 1.5, tint: '#ffffff' }); }
  for (const m of peaks) m.position.set(x * .6 + m.userData.x, 20, z - 380);
  sun.position.set(x - 60, 70, z - 40); sun.target.position.set(x, 0, z);
  if ((pT -= dt) < 0) { pT = .1; fx.emit('splash', x + Math.sign(st) * 1.5, .2, z - .2, { vy: 1.4, spread: 1, life: .6, size: .8 }); fx.emit('puff', x, .15, z + 3.2, { life: 1.4, size: .8, grow: 2, tint: '#eaf6ff' }); }
  fx.update(dt);
  birds.forEach((b, i) => { const a = t * .3 + i * 1.2; b.position.set(x + Math.cos(a) * (14 + i * 3), 16 + i * 1.4 + Math.sin(a * 2) * 2, z - 30 + Math.sin(a) * 16); b.rotation.y = -a; b.children.forEach(w => { w.rotation.z = w.userData.s * Math.sin(t * 5 + i) * .6; }); });
  const cz = z + 12, cx = river(cz) + Math.sin(t * .13) * 3; cam.position.set(cx, 4.4 + Math.sin(t * .2) * .8, cz); cam.lookAt(river(z - 14), 2.2, z - 14);
  post.render(scene, cam, t);
});
</script>
</html>
