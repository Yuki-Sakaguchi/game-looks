<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2-01 焚き火キャンプ ローポリの夜の森</title>
<style>
html,body{margin:0;height:100%;background:#070a1c;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#ffd9a8;opacity:.85}
</style>
<div id="cap">2-01 ─ 焚き火キャンプ / ローポリの夜の森 ＋ ドット絵の炎　｜　見るだけ</div>
<script src="kit.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 光は 2 つ。森ぜんたいを沈める弱い青（月と空）と、まん中の焚き火のだいだい。
// 焚き火の光は距離で急に弱くなるので、火に近い面だけが暖かく浮かび、奥の木は青い影絵になる。
// 炎・火の粉・煙・蛍だけは 8×8 のドット絵の板で描き、立体の場面にのせる
import * as THREE from 'three';
const K = KIT(THREE), { scene, cam, renderer } = K.stage({ fov: 40 }), { add, box, flat, glow, hash } = K;
scene.background = K.sky([[0, '#060818'], [.5, '#111a38'], [.8, '#22304e'], [1, '#0a1020']]); scene.fog = new THREE.Fog('#0b1126', 16, 80);
scene.add(K.stars(420)); add(scene, new THREE.SphereGeometry(9, 12, 10), glow('#fff4d0', { fog: false }), -90, 120, -210);
scene.add(new THREE.HemisphereLight(0x5a74d0, 0x0a1020, .55)); const moon = new THREE.DirectionalLight(0x8aa4ff, .55); moon.position.set(-9, 12, -20); scene.add(moon);
const fire = new THREE.PointLight(0xff9440, 70, 30, 1.7); fire.position.set(0, 1.1, 0); scene.add(fire);
const G = K.colors('#1c3a2a', '#22442e', '#2a4a30', '#3a3a2a');
const H = (x, z) => { const r = Math.hypot(x, z); return Math.sin(x * .17) * Math.cos(z * .14) * .5 * Math.min(1, r / 6) + Math.max(0, r - 14) * .1; };
scene.add(K.terrain(H, 50, 50, 1.6, (y, x, z) => Math.hypot(x, z) < 3.2 ? G[3] : G[Math.floor(hash(Math.round(x), Math.round(z)) * 3)]).mesh);
// 焚き火：石の輪、組んだ薪、おき火、三脚となべ
for (let i = 0; i < 9; i++) { const a = i / 9 * 6.283; add(scene, new THREE.IcosahedronGeometry(.3 + hash(i, 1) * .12, 0), '#6a6a74', Math.cos(a) * 1.15, .16, Math.sin(a) * 1.15).rotation.y = i; }
for (let i = 0; i < 5; i++) { const l = add(scene, new THREE.CylinderGeometry(.11, .13, 1.5, 5), '#4a3020', 0, .34, 0); l.rotation.set(1.05, i * 1.257, 0); }
add(scene, new THREE.IcosahedronGeometry(.36, 0), glow('#ff7a2a'), 0, .22, 0);
for (let i = 0; i < 3; i++) { const a = i * 2.094 + .5, p = add(scene, new THREE.CylinderGeometry(.04, .04, 3.4, 4), '#3a3030', Math.cos(a) * .85, 1.5, Math.sin(a) * .85); p.rotation.set(Math.sin(a) * -.52, 0, Math.cos(a) * .52); }
add(scene, new THREE.CylinderGeometry(.34, .28, .4, 8), '#2a2a34', 0, 1.75, 0); add(scene, new THREE.CylinderGeometry(.015, .015, 1.1, 3), '#2a2a34', 0, 2.5, 0);
// テント、ランタン、荷物
const tent = add(scene, new THREE.ConeGeometry(2.6, 2.5, 4), flat('#d98a3a', { emissive: '#ff8a30', emissiveIntensity: .32 }), -5.2, 1.25, -2.6); tent.rotation.y = .5;
const door = add(scene, new THREE.ConeGeometry(.8, 1.5, 3), glow('#3a1c10'), -3.9, .75, -1.35); door.rotation.y = .5; door.scale.z = .1;
box(scene, .3, .4, .3, glow('#ffe08a'), -3.2, 1.9, .4); add(scene, new THREE.CylinderGeometry(.03, .03, 1.9, 4), '#3a3030', -3.2, .95, .4); const lan = new THREE.PointLight(0xffd070, 9, 9, 1.6); lan.position.set(-3.2, 1.9, .4); scene.add(lan);
box(scene, .9, .6, .6, '#3f6a9a', -3.6, .3, 1.6).rotation.y = .4; box(scene, .5, .5, .5, '#b0483c', 3.9, .25, -2.6);
// 丸太のいすと、2 人と 1 匹
const seat = (x, z, ry) => { const s = add(scene, new THREE.CylinderGeometry(.32, .32, 2.2, 7), '#5a3c28', x, .32, z); s.rotation.set(0, ry, Math.PI / 2); };
seat(0, 3.2, 0); seat(3.1, .6, 1.3);
function camper(x, z, ry, coat, hatC) { const g = new THREE.Group(); g.position.set(x, .62, z); g.rotation.y = ry; box(g, .62, .72, .42, coat, 0, .42, 0); add(g, new THREE.IcosahedronGeometry(.27, 0), '#f0cfa8', 0, 1.03, 0); add(g, new THREE.ConeGeometry(.3, .34, 6), hatC, 0, 1.32, 0); box(g, .22, .2, .62, '#34405a', -.17, .02, .3); box(g, .22, .2, .62, '#34405a', .17, .02, .3); scene.add(g); return g; }
const c1 = camper(0, 3.15, Math.PI, '#d8483c', '#f2e2c0'), c2 = camper(3.05, .6, -1.85, '#3f8a7a', '#e0b84a');
const stick = add(c1, new THREE.CylinderGeometry(.02, .02, 2, 3), '#6a4a30', .35, .5, 1.1); stick.rotation.x = 1.35; const mallow = box(c1, .14, .14, .14, glow('#fff8ec'), .35, .28, 2.05);
const dog = new THREE.Group(); dog.position.set(-1.9, 0, 2.5); dog.rotation.y = 2.2; box(dog, .4, .36, .8, '#c8905a', 0, .32, 0); box(dog, .36, .34, .36, '#c8905a', 0, .56, .5); box(dog, .1, .16, .08, '#7a5030', -.13, .8, .46); box(dog, .1, .16, .08, '#7a5030', .13, .8, .46); const tail = box(dog, .08, .08, .36, '#c8905a', 0, .46, -.5); scene.add(dog);
// 森
const LEAF = ['#1f4a38', '#255640', '#1a3e34'];
for (let i = 0; i < 90; i++) { const a = hash(i, 1) * 6.283, r = 17.5 + hash(i, 2) * 26, x = Math.cos(a) * r, z = Math.sin(a) * r, t = K.pine(4.5 + hash(i, 3) * 6, LEAF[i % 3], '#3a2a20'); t.position.set(x, H(x, z) - .1, z); t.rotation.y = i; scene.add(t); }
for (let i = 0; i < 26; i++) { const a = hash(i, 4) * 6.283, r = 5 + hash(i, 5) * 14, x = Math.cos(a) * r, z = Math.sin(a) * r; add(scene, new THREE.IcosahedronGeometry(.3 + hash(i, 6) * .5, 0), i % 2 ? '#4a4a58' : '#2a5238', x, H(x, z) + .1, z); }
const fx = K.fx(scene, 200); let fT = 0, sT = 0, gT = 0;
K.loop((dt, t) => {
  if ((fT -= dt) < 0) { fT = .045; fx.emit('flame', (Math.random() - .5) * .7, .55, (Math.random() - .5) * .7, { vy: 1.8, life: .55, size: 1.25, grow: -.35, add: true, fog: false }); if (Math.random() < .35) fx.emit('spark', (Math.random() - .5) * .5, 1.2, (Math.random() - .5) * .5, { vy: 3.2, spread: 2, life: 1.3, size: .3, grav: -.6, add: true, fog: false, tint: '#ffb060' }); }
  if ((sT -= dt) < 0) { sT = .3; fx.emit('smoke', 0, 2.3, 0, { vy: 1.3, vx: .5, life: 3.4, size: 1, grow: 2.6, tint: '#5a5a70' }); }
  if ((gT -= dt) < 0) { gT = .2; const a = Math.random() * 6.283, r = 4 + Math.random() * 14; fx.emit('spark', Math.cos(a) * r, .6 + Math.random() * 2.4, Math.sin(a) * r, { life: 2.2, size: .32, spread: .5, add: true, fog: false, tint: '#b8ff8a' }); }
  fx.update(dt);
  fire.intensity = 70 * (.85 + .15 * Math.sin(t * 13) * Math.sin(t * 7.1) + .08 * Math.sin(t * 31)); fire.position.x = Math.sin(t * 9) * .12;
  tail.rotation.y = Math.sin(t * 12) * .6; c2.rotation.z = Math.sin(t * .9) * .04; stick.rotation.z = Math.sin(t * .7) * .05; mallow.position.x = .35 - Math.sin(t * .7) * .08;
  const a = t * .08 + .9; cam.position.set(Math.cos(a) * 12.5, 4.2 + Math.sin(t * .15) * .8, Math.sin(a) * 12.5); cam.lookAt(-.6, 1.5, 0);
  renderer.render(scene, cam);
});
</script>
</html>
