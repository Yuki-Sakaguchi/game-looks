<title>12-17 空の大陸の水晶の塔 描きこんだテクスチャとブラウン管</title>
<style>

canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#fff8e8;opacity:.9;text-shadow:0 1px 0 #000}

<div id="cap">12-17 ─ 空の大陸の水晶の塔 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="../game-looks-8/pack-fantasy-town.js"></script>
<script src="../game-looks-8/pack-fantasy-wild.js"></script>
<script src="../game-looks-11/pack-sand1.js"></script>
<script src="pack-realm2.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 昼。雲の海に浮かぶ大陸の草原の道。大陸のはしの向こう、別の浮き島から、空のてっぺんまで水晶の塔がのびる。塔のまわりを水晶のかけらの輪がゆっくり回り、帆の飛空艇が横切る。
// 色の組は「空の青・草原のみどり・雲の白」＋差し色の水晶の水色の光と、道ばたの旗の赤。塔の石の土台・水晶の柱・浮き島は、少ない面に手打ちのドット絵。
// 主役は赤いマントの旅の剣士（R.actor の toon）。草原の道を塔へ向かって歩き、低い うしろ ななめからカメラが追って、塔を見上げる。ひつじ・荷馬車・鳥・飛空艇・旗・雲が動く。
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), F = PACK_FTOWN(THREE, K, R), FW = PACK_FWILD(THREE, K, R), A = PACK_SAND1(THREE, K, R), Q = PACK_REALM2(THREE, K, R, F), T = R.tex, X = FW.tex, { hash } = K, PI = Math.PI;
const { scene, cam, renderer, onResize } = K.stage({ fov: 50, far: 1400, aa: false, fitAspect: .9, maxFov: 78 });
scene.add(R.skyDome([[0, '#1e58c0'], [.45, '#4a8ee0'], [.8, '#9ccaf2'], [1, '#eaf4ff']], { r: 900 })); scene.fog = new THREE.Fog('#d8e8f8', 220, 1500);
const { sun } = K.lights(scene, renderer, { sky: 0xd8e8ff, ground: 0x8aa868, amb: 1.55, sun: 0xfff2d8, power: 2.5, range: 40 }), SUN = new THREE.Vector3(.55, .7, .3).normalize();

// ---- 大陸の草原：ゆるい丘と、塔へ向かう まがった道。大陸のはし（z < -70）で がけになって雲の海へ落ちる ----
const sm = (a, b, v) => { const k = Math.max(0, Math.min(1, (v - a) / (b - a))); return k * k * (3 - 2 * k); };
const roadX = z => Math.sin(z * .035) * 6 - z * .06;
const EZ = x => -76 + Math.max(0, x - 6) * 1.5 + Math.sin(x * .3) * 2;   // 大陸のはしの線（右ほど手前へ来る）
const H = (x, z) => { const e = z - EZ(x); return Math.sin(x * .09 + 1) * Math.cos(z * .07) * .5 + Math.max(0, -x - 30) * .3 + z * .02 - sm(12, 0, e) * 1.6 - sm(0, -5, e) * 60; };   // はしへ ゆるく下り、がけで落ちる   // 大陸のはしへ ゆるく下る
const land = R.ground({ w: 220, d: 170, cell: 2, cz: -10, H, layers: [T.grass({ c: '#5aa04c', flowers: .25, fc: ['#f8f0d8', '#f0d040', '#e888b0'] }), T.dirt({ c: '#b8925e', pebbles: .5 }), T.rock({ c: '#8a8098' })],
  mix: (x, z) => [Math.abs(x - roadX(z)) < 1.5 ? 1 : 0, z - EZ(x) < 1.5 ? 1 : 0] }); scene.add(land.mesh);
const fixed = [], put = (o, x, z, ry = 0, y = H(x, z)) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };

// ---- 大陸の下の岩はだ（はしから下へ。雲の海の上に、うらがわが見える） ----
const ROCK = X.caveRock({ c: '#8a7a88', glint: false, moss: .25, mossC: '#5a8a4a' });
{ const G = R.geo(); for (let i = -10; i < 12; i++) { const x0 = i * 8, x1 = x0 + 8, z0 = EZ(x0) - 1, z1 = EZ(x1) - 1, y0 = H(x0, z0 + 3) - 1.5, y1 = H(x1, z1 + 3) - 1.5, d0 = 30 + hash(i, 1) * 40, d1 = 30 + hash(i + 1, 1) * 40;
  G.quad([x0, y0 - d0, z0 - 6], [x1, y1 - d1, z1 - 6], [x1, y1, z1], [x0, y0, z0], [x0 / 4, -d0 / 4, x1 / 4, 0], .9); G.tri([x0, y0 - d0, z0 - 6], [x1, y1 - d1, z1 - 6], [(x0 + x1) / 2, y0 - d0 - 30 - hash(i, 2) * 30, (z0 + z1) / 2 - 14], [0, 0], [2, 0], [1, 6], .7); } fixed.push(G.mesh(ROCK)); }   // がけの はだと、下へとがる大陸のうら

// ---- 雲の海（大陸の下。遠くまで白い）と、ちぎれ雲 ----
{ const sea = R.ground({ w: 1600, d: 1400, cell: 40, cz: -500, H: (x, z) => -70 + Math.sin(x * .02) * Math.cos(z * .025) * 6, layers: [T.snow({ c: '#f2f4ff' })], mix: () => [0, 0], shade: (x, z) => .95 + Math.sin(x * .013 + z * .017) * .05 }); scene.add(sea.mesh); }
for (let k = 0; k < 26; k++) { const c = R.cloud({ s: 40 + hash(k, 1) * 70, c: '#ffffff', shade: '#a8b8e0', seed: k }), a = hash(k, 2) * PI * 2, d = 260 + hash(k, 3) * 400; c.position.set(Math.sin(a) * d, -40 + hash(k, 4) * 120, -Math.abs(Math.cos(a)) * d - 60); c.lookAt(0, c.position.y, 0); scene.add(c); }

// ---- 水晶の塔：遠くの浮き島の上に。石の土台（アーチの窓）→ 6 角の水晶の柱を何段も重ね、空まで ----
const TX = 120, TZ = -440, TY = -40, TOWER = new THREE.Group(); TOWER.position.set(TX, TY, TZ); scene.add(TOWER);
{ const isle = FW.floatIsle({ r: 90, h: 150, grass: T.grass({ c: '#5a9a50' }), rock: ROCK, seed: 3 }); isle.position.set(0, 0, 0); TOWER.add(isle);
  const stoneT = F.tex.ashlar({ c: '#d8d0c0', moss: .2 }), base = F.tower({ r: 34, h: 40, stone: stoneT, top: 'crenel', wins: true }); TOWER.add(base);
  for (const [ax, az, r, h] of [[-50, 10, 8, 40], [48, 18, 7, 34], [-26, 50, 6, 28], [36, -40, 7, 34]]) { const t = F.tower({ r, h, stone: stoneT, roof: F.tex.slate({ c: '#3a6ab0' }), top: 'cone', roofH: r * 2.2, flag: { c: '#c8403a', crest: 'star', cc: '#f8e8a0', w: 4, h: 2.4, pole: 6 } }); t.position.set(ax, 0, az); TOWER.add(t); }
  const CR = X.crystal({ c: '#4aaee8', seed: 1 }), CR2 = X.crystal({ c: '#7a78e0', seed: 2 }), G = R.geo(), G2 = R.geo();
  // まん中の柱：段ごとに少し細くなり、段の間に細い くびれ。てっぺんは高い所で とがる
  let y = 38; const segs = [[30, 70], [26, 80], [22.5, 90], [19, 90], [15.5, 80], [12, 70], [8.5, 60]];
  segs.forEach(([r, h], i) => { const g = i % 2 ? G2 : G; g.loft(6, [[y, r * .82, r * .82, 0, .7], [y + 4, r, r, .06, 1], [y + h - 6, r * .95, r * .95, .94, 1.1], [y + h, r * .7, r * .7, 1, .9]], { ur: 2, rot: i * .08 }); y += h; });
  G.loft(6, [[y, 6.5, 6.5, 0, .9], [y + 80, .3, .3, 1, 1.3]], { ur: 2 }); const TOP = y + 80;
  // まわりの小さな水晶の柱（土台から斜めに）
  for (let k = 0; k < 10; k++) { const a = k / 10 * PI * 2 + .3, d = 30, h = 50 + hash(k, 5) * 80, r = 4 + hash(k, 6) * 4; (k % 2 ? G2 : G).at(R.TR(Math.sin(a) * d, 36, Math.cos(a) * d, a, .22 + hash(k, 7) * .2, 0)).loft(6, [[0, r * .8, r * .8, 0, .7], [h * .75, r, r, .75, 1], [h, .2, .2, 1, 1.25]], { ur: 2 }).at(null); }
  const m1 = G.mesh(CR, { emissive: '#0e3050' }), m2 = G2.mesh(CR2, { emissive: '#1e1a50' }); m1.castShadow = m2.castShadow = false; TOWER.add(m1, m2);
  const hl2 = FW.halo('#c8f0ff', 70, .45); hl2.position.set(0, TOP - 40, 0); TOWER.add(hl2);
  TOWER.userData.top = TOP; }
// 塔のまわりを回る、水晶のかけらの輪（3 段）
const rings = [[170, 140, 14, .05], [300, 110, 12, -.035], [430, 80, 10, .03]].map(([h, rr, n, sp], j) => { const G = R.geo(); for (let k = 0; k < n; k++) { const a = k / n * PI * 2, s = 4 + hash(k, j) * 5; const s2 = s * 2.4; G.at(R.TR(Math.sin(a) * rr, (hash(k, j + 3) - .5) * 16, Math.cos(a) * rr, a, .4, hash(k, j + 5))).loft(5, [[-s2, .1, .1, 0, .8], [0, s2 * .35, s2 * .35, .5, 1.1], [s2, .1, .1, 1, 1]], { ur: 1 }).at(null); }
  const me = G.mesh(X.crystal({ c: j === 1 ? '#c8b8ff' : '#9ae0ff', seed: j }), { emissive: '#123048' }); me.castShadow = false; me.position.set(TX, TY + h, TZ); scene.add(me); return { me, sp }; });

// ---- 遠くの浮き島（ゆっくり上下）と、そこから落ちる細い滝 ----
const isles = [[-160, -300, 10, 26], [-60, -220, -6, 14], [190, -260, 30, 18], [-250, -520, 60, 40], [240, -600, 90, 34], [10, -160, -24, 9]].map(([x, z, y, r], i) => { const g = FW.floatIsle({ r, seed: i + 5, rock: ROCK, grass: T.grass({ c: '#5aa04c', flowers: .3 }) }); g.position.set(x, y, z); scene.add(g);
  if (r > 12) { const t = R.tree({ kind: 'round', h: r * .5, c: '#4a8a44', seed: i }); t.position.set(r * .2, 0, 0); g.add(t); }
  if (i % 2 === 0) { const wf = FW.waterfall({ w: r * .12, h: r * 3, c: '#eaf4ff', lip: 1 }); wf.position.set(0, -r * 3, r * .8); g.add(wf); g.userData.wf = wf; }
  return { g, y, ph: i * 1.3 }; });

// ---- 道のそば：丸い石の塔の小さな見はり所、風車、道しるべの旗、石がき、木、花 ----
const RD = (z, dx) => roadX(z) + dx;
const stoneW = F.tex.ashlar({ c: '#d8c8a8', moss: .3 }), roofR = F.tex.slate({ c: '#b84a3a', c2: '#8a3a34' });
put(F.tower({ r: 2.6, h: 9, stone: stoneW, roof: roofR, top: 'cone', roofH: 4, lit: 0, flag: { c: '#3a6ab0', crest: 'tower', cc: '#f8e8a0', w: 1.8, h: 1.1 } }), RD(-34, -9), -34);
put(R.house({ w: 5, d: 4.4, h: 2.8, wall: T.plaster({ c: '#f0e4c8', frame: 'cross' }), roof: T.thatch({ c: '#c8a058' }), chimney: true, door: T.door({ style: 'plank', arch: 1 }), seed: 3 }), RD(-30, -14), -30, .5);
put(F.windmill({ h: 9, stone: stoneW, roof: roofR, c: '#f4ecd8', speed: .5 }), RD(-50, -24), -50, .6);
for (const [z, dx, c, cr] of [[2, 2.4, '#c8403a', 'star'], [-16, -2.4, '#3a6ab0', 'tower'], [-40, 2.6, '#e8b830', 'sun'], [-58, -2.5, '#c8403a', 'star']]) put(F.flag({ kind: 'banner', w: .8, h: 2, pole: 4, c, crest: cr, cc: '#f8f0d8' }), RD(z, dx), z);
for (let i = 0; i < 40; i++) { const z = 20 - hash(i, 1) * 85, sx = i % 2 ? 1 : -1, x = RD(z, sx * (4 + hash(i, 2) * 26)); const k = i % 4; put(k === 0 ? R.tree({ kind: 'round', h: 4 + hash(i, 3) * 3, c: '#4a8a44', flowers: i % 3 ? 0 : .3, fc: ['#f8f0f0'], seed: i }) : k === 1 ? R.rock({ s: .6 + hash(i, 4), c: '#9a90a0', moss: .3, seed: i }) : R.tuft({ kind: k === 2 ? 'flower' : 'bush', s: .9, seed: i % 3 }), x, z, i); }
for (let i = 0; i < 50; i++) { const z = 16 - i * 1.6, sx = i % 2 ? 1 : -1; put(R.tuft({ kind: i % 3 ? 'grass' : 'flower', s: .7 }), RD(z, sx * (1.8 + hash(i, 9))), z, i); }
{ const G = R.geo(); for (let z = 10; z > -60; z -= 2) { const x = RD(z, -3.2), x2 = RD(z - 2, -3.2); G.box(.5, .7, 2.1, (x + x2) / 2, H(x, z) - .2, z - 1, { m: 1.5 }); } fixed.push(G.mesh(F.tex.ashlar({ c: '#a8a098', moss: .5 }))); }   // 道の左の低い石がき
scene.add(R.merge(fixed));

// ---- 飛空艇（1 そうは近くを横切り、1 そうは塔のほうへ遠く） ----
const ship = Q.skyShip({ s: 1.4, c: '#8a5a3a', c2: '#c8403a', sail: '#f4ecd8', sail2: '#c8403a', crest: 'star', cc: '#c8403a', wing: '#f4ecd8' }); scene.add(ship);
const ship2 = Q.skyShip({ s: 2.2, c: '#6a4a3a', c2: '#3a6ab0', sail: '#eef0f8', sail2: '#3a6ab0', wing: '#eef0f8' }); scene.add(ship2);
const birds = [0, 1, 2, 3, 4].map(i => { const b = R.bird({ c: '#f4f0f0', belly: '#ffffff', neck: false, s: 1.6 }); scene.add(b); return b; });

// ---- 人と生きもの：主役、荷馬車の商人、ひつじ ----
R.cfg.actorBuild = 'toon';
const hero = R.actor({ hairStyle: 'spiky', hair: '#e8c070', eye: '#3a6ab0', eyes: 'big', cloth: 'tunic', sleeve: 'long', top: '#3a5a9a', top2: '#f0e4c8', lower: 'pants', bottom: '#4a3a34', belt: '#8a5a34', shoes: 'boot', shoe: '#6a4434', gloves: 'glove', glove: '#8a5a34', shoulder: 'pad', neck: 'cape', acc: '#c8403a', back: 'sword' }); scene.add(hero);
const horse = A.horse({ c: '#8a5a3a', mane: '#3a2a24', saddle: '#c8403a', s: .95 }); scene.add(horse);
const wagon = F.wagon({ cover: '#f0e4c8', load: 'crates' }); scene.add(wagon);
const driver = R.actor({ hairStyle: 'short', hair: '#6a4a3a', beard: 'beard', eyes: 'half', cloth: 'tunic', top: '#4a7a4a', top2: '#e8d8b0', bottom: '#5a4a3a', hat: 'cap', acc: '#8a6a3a' }); scene.add(driver);
const sheep = [[-14, -6], [-17, -9], [-12, -12], [-20, -4], [16, -18], [19, -21]].map(([dx, z], i) => { const s = A.sheep({ s: .9 }); s.position.set(RD(z, dx), H(RD(z, dx), z), z); s.rotation.y = i * 1.7; scene.add(s); return s; });

const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
const Z0 = 14, LEN = 56, SPEED = 1.5;
K.loop((dt, t) => {
  const dist = (t * SPEED) % LEN, z = Z0 - dist, x = roadX(z), y = H(x, z), dx = roadX(z - .5) - x;
  hero.position.set(x, y, z); hero.rotation.y = PI + Math.atan2(dx, .5) * -1; R.walk(hero, t * SPEED * 3.6, .85);
  const tall = innerWidth < innerHeight, Dc = tall ? 4.4 : 5.6;
  cam.position.set(x + (tall ? .6 : 1.6), y + 1.2, z + Dc); cam.lookAt(x + (tall ? 1 : 2.6), y + (tall ? 4.4 : 3.6), z - 10);   // 低く うしろ右から、塔を見上げる
  sun.position.set(x + SUN.x * 60, y + SUN.y * 60, z + SUN.z * 60); sun.target.position.set(x, y, z - 6); land.follow(x, z - 20);
  // 荷馬車は道を こちらへ（主役とすれちがう）
  const wz = -60 + ((t * 1.1) % 80), wx = RD(wz, 1.2), wy = H(wx, wz); wagon.position.set(wx, wy, wz); wagon.rotation.y = 0; horse.position.set(wx, wy, wz + 3.1); horse.rotation.y = 0; A.pose(horse, 'walk', t * 2.2);
  driver.position.set(wx, wy + .78, wz + 1.2); driver.rotation.y = 0; R.idle(driver, t, .2); driver.userData.J.legL.rotation.x = driver.userData.J.legR.rotation.x = -1.4; driver.userData.J.shinL.rotation.x = driver.userData.J.shinR.rotation.x = 1.4;
  (wagon.userData.wheels || []).forEach(w => w.rotation.x = t * 2.4);
  sheep.forEach((s, i) => A.pose(s, i % 3 ? 'graze' : 'stand', t + i));
  ship.position.set(-120 + ((t * 6) % 260), 30 + Math.sin(t * .2) * 2, -130); ship.rotation.y = PI / 2;
  ship2.position.set(TX - 160 + t * 2, 70, TZ + 120); ship2.rotation.y = PI / 2 + .3;
  birds.forEach((b, i) => { const a = t * .35 + i * 1.25; b.position.set(x + 10 + Math.sin(a) * 16, y + 14 + Math.sin(a * 2 + i) * 2, z - 30 + Math.cos(a) * 10); b.rotation.y = a + PI / 2; R.birdPose(b, 'fly', t * 1.4 + i); });
  rings.forEach(r => { r.me.rotation.y = t * r.sp; });
  isles.forEach(o => { o.g.position.y = o.y + Math.sin(t * .3 + o.ph) * 1.5; o.g.userData.wf?.userData.tick?.(t); });
  F.tick(t); Q.tick(t); crt.render(scene, cam, t);
});
</script>
