<style>

<div id="cap">12-44 ─ 浮かぶ島々の電脳の祭り / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="../game-looks-8/pack-fantasy-wild.js"></script>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 日の暮れの、空に浮かぶ白い島々の祭り。島と島を光の道がつなぎ、島ごとに 屋台・記号の回転木馬・踊りの舞台・的あてがあり、空には星やハートの記号の花火がひらく。
// 色の組は「白い島・うすむらさきの夕空・島の下の青むらさきの影」＋差し色の もも色（屋根の布・花火・ちょうちんの記号）。白は面取りと目地の段で読ませる。
// 主役は うさぎの耳の子（ももの はっぴふうの上着）。島から島へ光の道を歩き、カメラは右うしろの上から見下ろして、まわりの島々と花火を入れる。
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), FW = PACK_FWILD(THREE, K, R), CY = PACK_CYBER1(THREE, K, R, FW), T = R.tex, { hash } = K, PI = Math.PI, AC = CY.AC;
const { scene, cam, renderer, onResize } = K.stage({ fov: 50, far: 1000, aa: false, fitAspect: .9, maxFov: 80 });
scene.add(R.skyDome([[0, '#6a70b8'], [.4, '#9a94cc'], [.7, '#cdb8dc'], [.88, '#f0c8d4'], [1, '#f8dcd0']], { r: 800 })); scene.fog = new THREE.Fog('#cfc2dc', 70, 700);
const { sun } = K.lights(scene, renderer, { sky: 0xe0d8ff, ground: 0xc8b8d8, amb: 1.95, sun: 0xffe0d0, power: 1.35, range: 30 }), SUN = new THREE.Vector3(-.4, .5, .75).normalize();
for (let i = 0; i < 18; i++) { const c = R.cloud({ s: 50 + hash(i, 1) * 70, c: '#f0e8f4', shade: '#b0a4cc', seed: i % 3 }), a = hash(i, 2) * PI * 2, d = 120 + hash(i, 3) * 300; c.position.set(Math.sin(a) * d, -40 + hash(i, 4) * 30, Math.cos(a) * d - 60); c.lookAt(0, c.position.y, 0); scene.add(c); }

// ---- 島々（[x, y, z, 半径, 何があるか]） ----
const ISL = [[0, 0, 0, 9, 'stalls'], [6, 1.5, -34, 9, 'carousel'], [-24, 3, -58, 8, 'stage'], [26, 4, -66, 7, 'target'], [-6, 6, -96, 12, 'tower'], [-58, 10, -30, 10, 'tower2'], [54, 14, -20, 9, 'stalls2'], [40, 22, -140, 14, 'tower3'], [-60, 18, -150, 16, 'tower4']];
const isles = ISL.map(([x, y, z, r], i) => { const g = CY.island({ r, h: r * 1.1, seed: i * 3 + 1, ac: [AC.pink, AC.mint, AC.lemon, AC.sky][i % 4], underC: '#ccc8e4' }); g.position.set(x, y, z); scene.add(g); return g; });
const live = [], fixed = [];
const onIsle = (i, o, dx, dz, ry = 0) => { const [x, y, z] = ISL[i]; o.position.set(x + dx, y, z + dz); o.rotation.y = ry; return o; };
// 屋台：白い台＋しまの布の屋根＋品物の記号
const stall = (c, kind) => { const B = R.parts(), P = B.g(CY.tex.panel({ kind: 'band', ac: c, m: 2 })), F = B.g(T.fabric({ c: '#f4f0f4', c2: c, pattern: 'stripe', scallop: true }), { side: true });
  P.box(2.4, .95, 1, 0, 0, 0, { m: 2 }); for (const sx of [-1, 1]) for (const sz of [-1, 1]) P.box(.08, 2.2, .08, sx * 1.15, 0, sz * .45, { m: 2 });
  F.quad([-1.4, 2.6, -.7], [1.4, 2.6, -.7], [1.4, 2.1, .9], [-1.4, 2.1, .9]).quad([-1.4, 2.1, .9], [1.4, 2.1, .9], [1.4, 1.8, .95], [-1.4, 1.8, .95]);
  const g = B.group(); for (let k = 0; k < 4; k++) { const s = CY.glyphSprite(kind[k % kind.length], [AC.pink, AC.sky, AC.lemon, AC.mint][k], .36); s.position.set(-.85 + k * .56, 1.15, .1); g.add(s); } return g; };
[[0, -4.5, -2, .35, AC.pink, ['heart', 'star']], [0, -5, -6, .9, AC.sky, ['fish', 'drop']], [0, -3.6, 4.6, 2.4, AC.lemon, ['note', 'moon']], [6, -3, 4, 2.6, AC.mint, ['diamond', 'plus']], [6, 3, 4, -2.6, AC.pink, ['paw', 'heart']]].forEach(([i, dx, dz, ry, c, k]) => scene.add(onIsle(i === 6 ? 6 : 0, stall(c, k), dx, dz, ry)));
// 記号の回転木馬（まん中の柱のまわりを、大きな記号がまわる）
{ const g = new THREE.Group(), B = R.parts(), P = B.g(CY.tex.panel({ kind: 'band', ac: AC.mint, m: 3 }));
  CY.prism(P, [[0, 3.4, 3.4], [.3, 3.4, 3.4]], 12, { m: 3 }); CY.prism(B.g(CY.tex.floor({ seed: 9, m: 2 })), [[.3, 3.4, 3.4], [.3, 0, 0]], 12, {}); CY.prism(P, [[.3, .25, .25], [4.2, .25, .25]], 6, { m: 3 }); CY.prism(B.g(T.fabric({ c: '#f4f0f4', c2: AC.mint, pattern: 'stripe' }), { side: true }), [[4.2, 3.8, 3.8], [5.4, .3, .3]], 12, { m: 2 });
  g.add(B.group()); const rot = new THREE.Group(); g.add(rot); ['star', 'heart', 'fish', 'note', 'moon', 'diamond'].forEach((k, j) => { const s = CY.glyphSprite(k, [AC.pink, AC.sky, AC.lemon, AC.mint, AC.lilac, AC.peach][j], 1.1); const a = j / 6 * PI * 2; s.position.set(Math.sin(a) * 2.6, 1.6, Math.cos(a) * 2.6); s.userData.a = a; rot.add(s); });
  onIsle(1, g, 0, -1); scene.add(g); live.push(t => { rot.rotation.y = t * .6; rot.children.forEach((s, j) => s.position.y = 1.4 + Math.sin(t * 2.4 + j) * .35); }); }
// 舞台と、踊るアバター
{ const B = R.parts(), P = B.g(CY.tex.panel({ kind: 'band', ac: AC.lemon, m: 3 })); CY.prism(P, [[0, 4, 3, PI / 4], [.6, 4, 3, PI / 4]], 4, { m: 3 }); CY.prism(B.g(CY.tex.floor({ kind: 'path', ac: AC.lemon, seed: 4, m: 2 })), [[.6, 4, 3, PI / 4], [.6, 0, 0, PI / 4]], 4, {}); scene.add(onIsle(2, B.group(), 0, 0, .5));
  const b = CY.board({ w: 5, h: 2.6, ac: AC.lemon, kind: 'face', seed: 7 }); onIsle(2, b, -.6, -2.6, .5); b.position.y += 4.2; scene.add(b); }
// 的あて（大きな輪の的と、浮かぶ玉）
{ const tg = CY.glyphSprite('ring', AC.pink, 3.2); onIsle(3, tg, 0, -2); tg.position.y += 2.6; scene.add(tg); const tg2 = CY.glyphSprite('star', AC.lemon, 1.2); onIsle(3, tg2, 0, -1.9); tg2.position.y += 2.6; scene.add(tg2); live.push(t => { tg2.material.rotation = t; }); }
// 遠くの島の塔
[[4, 'halo', 60, 6], [5, 'spire', 46, 5], [7, 'round', 80, 8], [8, 'twist', 90, 9]].forEach(([i, kind, h, r]) => scene.add(onIsle(i, CY.tower({ kind, h, r, m: 8, seed: i, ac: [AC.pink, AC.mint, AC.sky, AC.lemon][i % 4] }), 0, 0)));

// ---- 光の道（島と島をつなぐ。主役の道は ISL[0] → [1] → [2] → [4]） ----
const pathPts = [[2, 0, 6], [2.5, 0, -8], [5, 1.5, -26], [6, 1.5, -34], [0, 1.5, -40], [-18, 3, -54], [-24, 3, -58], [-14, 3, -66], [-8, 6, -86], [-6, 6, -96]];
const seg = []; let tot = 0; for (let i = 0; i < pathPts.length - 1; i++) { const a = pathPts[i], b = pathPts[i + 1], l = Math.hypot(b[0] - a[0], b[2] - a[2]); seg.push([a, b, l, tot]); tot += l; }
const along = d => { d = Math.max(0, Math.min(tot - .01, d)); for (const [a, b, l, s0] of seg) if (d <= s0 + l) { const k = (d - s0) / l; return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k, Math.atan2(b[0] - a[0], b[2] - a[2])]; } };
{ const G = R.geo(), off = 1.1; for (const [a, b, l] of seg) { const dx = (b[0] - a[0]) / l, dz = (b[2] - a[2]) / l, px = -dz * off, pz = dx * off;
    G.quad([a[0] - px, a[1] - .02, a[2] - pz], [a[0] + px, a[1] - .02, a[2] + pz], [b[0] + px, b[1] - .02, b[2] + pz], [b[0] - px, b[1] - .02, b[2] - pz], [0, 0, 1, l / 3]);
    for (const s of [-1, 1]) scene.add(CY.line([[a[0] + s * px, a[1] + .05, a[2] + s * pz], [b[0] + s * px, b[1] + .05, b[2] + s * pz]], { c: AC.pink, w: .14, speed: 3, rep: 4 })); }
  const pt = CY.tex.floor({ kind: 'path', ac: AC.pink, seed: 11, m: 2.2, c: '#e8dcec' }); scene.add(new THREE.Mesh(G.build(), FW.glowMat(pt, { side: true }))); }
// 島どうしを結ぶ、ほかの光の道（遠く）
[[1, 3], [3, 7], [4, 8], [2, 5], [5, 8], [4, 7], [0, 5]].forEach(([a, b], i) => { const A = ISL[a], B2 = ISL[b], pts = []; for (let k = 0; k <= 12; k++) { const u = k / 12; pts.push([A[0] + (B2[0] - A[0]) * u, A[1] + (B2[1] - A[1]) * u - Math.sin(u * PI) * 6 - 1.5, A[2] + (B2[2] - A[2]) * u]); } scene.add(CY.line(pts, { c: [AC.mint, AC.sky, AC.lemon, AC.pink][i % 4], w: .45, speed: 6, rep: 8 })); });
// 記号のちょうちん（島の上にわたした線から下がる）
[[0, [-8, 3.4, -5], [-3, 3.4, 4]], [0, [-6, 3.4, 6], [-1, 3.4, 7]], [1, [-7, 3.4, 4], [-3, 3.4, -5]], [6, [-6, 3.4, 3], [6, 3.4, 3]]].forEach(([i, a, b], j) => { const [x, y, z] = ISL[i], A = [x + a[0], y + a[1], z + a[2]], B2 = [x + b[0], y + b[1], z + b[2]], pts = []; for (let k = 0; k <= 10; k++) { const u = k / 10; pts.push([A[0] + (B2[0] - A[0]) * u, A[1] - Math.sin(u * PI) * .8, A[2] + (B2[2] - A[2]) * u]); } scene.add(CY.line(pts, { c: AC.lemon, w: .05, speed: 1, rep: 2 }));
  for (let k = 1; k < 10; k += 1) { const s = CY.glyphSprite(['heart', 'star', 'diamond', 'ring'][(k + j) % 4], [AC.pink, AC.lemon, AC.sky, AC.mint][(k + j) % 4], .45); s.position.set(pts[k][0], pts[k][1] - .3, pts[k][2]); scene.add(s); } });
scene.add(R.merge(fixed));

// ---- 記号の花火 ----
const KINDS = ['star', 'heart', 'diamond', 'note', 'ring'], COLS = [AC.pink, AC.lemon, AC.sky, AC.mint, AC.lilac];
const fireworks = [[-30, 26, -120, 0], [34, 34, -150, 1.3], [0, 44, -190, 2.6], [-60, 22, -90, 3.4], [56, 24, -80, 4.4], [-10, 30, -110, 1.9]].map(([x, y, z, ph], i) => { const g = new THREE.Group(); g.position.set(x, y, z); scene.add(g); const n = 18, sp = [];
  for (let k = 0; k < n; k++) { const s = CY.glyphSprite(KINDS[(i + (k % 2)) % 5], COLS[(i + (k % 3)) % 5], 3, { fog: false }); const a = k / n * PI * 2, e = (hash(k, i) - .5) * 1.2; s.userData.d = [Math.cos(a) * Math.cos(e), Math.sin(a) * Math.cos(e) * .9, Math.sin(e)]; g.add(s); sp.push(s); }
  const core = CY.glyphSprite(KINDS[i % 5], '#ffffff', 5, { fog: false }); g.add(core); return { g, sp, core, ph, per: 5.5 }; });

// ---- 人 ----
const hero = CY.avatar({ sex: 'f', hairStyle: 'bob', hair: '#f4f0f8', eyes: 'big', blush: true, cloth: 'jacket', top: '#f08cb8', top2: '#ffffff', lower: 'shorts', bottom: '#6a60a8', shoes: 'shoe', shoe: '#f4f4f8', ears: 'bunny', earC: '#ffffff', earIn: '#f4a8c8', tail: 'bunny', icon: 'star', iconC: AC.lemon, seed: 1 }); scene.add(hero);
const dancers = [[2, -1.2, .6], [2, 1.2, .2], [2, 0, -.9], [0, -4.5, -.5], [0, 4, -1.6], [0, -1.8, 3], [1, 3.8, 2.2], [1, -3.6, 2.6], [3, 1.5, 1]].map(([i, dx, dz], j) => { const HS = ['spiky', 'twin', 'tail', 'short', 'bun', 'tufts', 'long', 'bob', 'spiky'][j], EA = ['cat', 'fox', 'bear', 'horn', 'cat', 'antenna', 'bunny', 'fox', 'bear'][j], hc = ['#4a4a6a', '#f4c890', '#8a6a5a', '#c8b8f0', '#f4a8c8', '#78c8a8', '#f4f4f8', '#f0d468', '#5a4a6a'][j];
  const a = CY.avatar({ sex: j % 2 ? 'f' : 'm', hairStyle: HS, hair: hc, cloth: ['tunic', 'jacket', 'coat', 'robe', 'vest'][j % 5], top: COLS[j % 5], top2: '#ffffff', bottom: '#f4f4f8', ears: EA, earC: hc, tail: j % 3 ? ['cat', 'fox'][j % 2] : null, tailC: hc, icon: j % 2 ? KINDS[j % 5] : null, iconC: COLS[(j + 2) % 5], s: j === 5 ? .8 : 1, seed: j + 3 });
  onIsle(i, a, dx, dz); a.position.y += i === 2 ? .6 : 0; scene.add(a); return [a, i, j]; });
const motes = FW.motes({ n: 60, box: [30, 12, 40], c: '#fff0c0', size: .16, rise: .4, drift: .8 }); scene.add(motes);
const crt = R.crt(renderer, { noise: 0, bloom: .14 }); onResize(crt.resize);
const LOOP = tot / 1.3 + 2;
K.loop((dt, t) => {
  const d = ((t % LOOP) * 1.3) + 3, [x, y, z, dir] = along(d); hero.position.set(x, y, z); hero.rotation.y = dir; R.walk(hero, t * 5.6, .9);
  const tall = innerWidth < innerHeight, ca = dir + PI + .5, D = tall ? 4.4 : 5.2; cam.position.set(x + Math.sin(ca) * D, y + (tall ? 3.8 : 3.4), z + Math.cos(ca) * D); cam.lookAt(x + Math.sin(dir) * 5, y + (tall ? 1.1 : 1.2), z + Math.cos(dir) * 5);   // 右うしろの上から見下ろす
  sun.position.set(x + SUN.x * 60, y + SUN.y * 60, z + SUN.z * 60); sun.target.position.set(x, y, z);
  dancers.forEach(([a, i, j]) => { const J = a.userData.J, b = Math.sin(t * 5 + j); R.idle(a, t + j, Math.sin(t + j) * .4); a.rotation.y = Math.sin(t * .8 + j) * .8 + j; a.position.y = ISL[i][1] + (i === 2 ? .6 : 0) + Math.max(0, b) * .18; J.armR.rotation.set(-2.4 + b * .4, 0, -.3); J.armL.rotation.set(-2.4 - b * .4, 0, .3); });
  isles.forEach((g, i) => { if (i > 3) g.position.y = ISL[i][1] + Math.sin(t * .4 + i) * .6; });
  fireworks.forEach(f => { const u = ((t + f.ph) % f.per) / f.per, p = Math.min(1, u * 2.2), s = u < .55 ? 1 : Math.max(0, 1 - (u - .55) / .3); f.sp.forEach(sp => { const [a, b, c] = sp.userData.d; sp.position.set(a * p * 30, b * p * 30 - u * u * 10, c * p * 30); sp.scale.setScalar(5.5 * s * (.6 + p * .5)); sp.visible = s > 0; }); f.core.scale.setScalar(5 * Math.max(0, 1 - u * 4)); f.core.visible = u < .25; });
  for (const f of live) f(t); motes.userData.tick(t, x, z); CY.tick(t); crt.render(scene, cam, t);
});
</script>
