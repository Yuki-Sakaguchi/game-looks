// 夜の森の中の広場に、旅芸人の一座が来ている。赤と白のしまの大きなテント（中のあかりで布が光る）、色とりどりのほろ馬車、ちょうちんのつな、たき火、木の舞台でお手玉をする芸人と、それを見る村の人々。

import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), F = PACK_FTOWN(THREE, K, R), FW = PACK_FWILD(THREE, K, R), D = PACK_DARK(THREE, K, R), T = R.tex, { hash } = K, PI = Math.PI, TAU = PI * 2;

// ---- 広場（まん中 PC）と、森から来る小道。たき火・テントの口・舞台・ちょうちんの下を明るく焼きこむ ----
const PC = [0, -22], TENT = [0, -46], STAGE = [-10, -23], FIRE = [6, -14], SRY = .85, LIT = [];

  mix: (x, z) => [Math.hypot(x - PC[0], z - PC[1]) < 17 + Math.sin(Math.atan2(z - PC[1], x) * 5) * 1.5 || Math.abs(x - pathX(z)) < 1.4 ? 1 : 0, Math.hypot(x - PC[0], z - PC[1]) < 19 && Math.hypot(x - PC[0], z - PC[1]) > 16.5 ? .6 : 0],
  shade: D.lightShade(LIT, [.5, .52, .78]) }); scene.add(land.mesh);
const fixed = [], put = (o, x, z, ry = 0, y = 0) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };

// ---- 森：広場を高い木がかこむ。手前の小道の両がわにも ----

// ---- 大きなテント：赤白しまの かべ、とがった屋根 2 つ、ふちの ひだ飾り、てっぺんの旗。入口から中のあかり ----
const TENTS = [[0, 0, 12, 5.5, 19], [-17, 4, 6.5, 4, 11]];
{ const B = R.parts(), Wl = B.g(T.fabric({ pattern: 'stripe', c: '#c8302e', c2: '#f4e8d0', w: 8 }), { emissive: '#4a1a10' }), Rf = B.g(T.fabric({ pattern: 'stripe', c: '#c8302e', c2: '#f4e8d0', w: 8 }), { emissive: '#3a1408' }),
    Sc = B.g(T.fabric({ pattern: 'stripe', c: '#e8b830', c2: '#3a5aa8', w: 4, scallop: true }), { side: true, emissive: '#3a2a08' }), Pl = B.g(T.bark({ c: '#6a4a34' }));
  for (const [x, z, r, wh, h] of TENTS) { const n = 16, ur = Math.round(r * 1.2);

    Rf.loft(n, [[wh, r * 1.04, r * 1.04, 0, 1, x, z], [wh + (h - wh) * .45, r * .55, r * .55, .5, 1.05, x, z], [h, .3, .3, 1, 1.15, x, z]], { ur, cap: 'top' });

    for (let k = 0; k < 8; k++) { const a = k / 8 * TAU, ex = x + Math.cos(a) * (r + 3.5), ez = z + Math.sin(a) * (r + 3.5); Pl.loft(4, [[0, .1, .1, 0, .9, ex, ez], [1, .06, .06, .5, 1, ex, ez]], { cap: 'top' }); B.g(F.tex.rope(), { side: true }).quad([ex, 1, ez], [ex + .05, 1, ez], [x + Math.cos(a) * r * 1.04 + .05, wh, z + Math.sin(a) * r * 1.04], [x + Math.cos(a) * r * 1.04, wh, z + Math.sin(a) * r * 1.04], [0, 0, 1, 4]); } }
  const g = B.group(); g.position.set(TENT[0], 0, TENT[1]); fixed.push(g); }

{ const r = 12, ex = TENT[0], ez = TENT[1] + r - .02, G = R.geo(); G.quad([-2, 0, 0], [2, 0, 0], [2, 4.2, 0], [-2, 4.2, 0], [0, 0, 1, 1]); const m = G.mesh(T.window({ lit: 1, glass: '#ffc070', curtain: '#ffe0a0', bars: 'none', arch: 1, h: 48, frame: '#7a2a20' }), { glow: true }); m.position.set(ex, 0, ez + .1); scene.add(m);

// ---- 舞台：木の台、うしろの幕、両わきの旗、前のろうそく。左に階段 ----

for (const [x, z] of [[-6, -6], [6, -6], [-7, -26], [8, -26], [0, -34]]) put(R.geo().loft(5, [[0, .12, .12, 0, .8], [(x === 0 ? 6 : z < -20 ? 5 : 4) + .2, .1, .1, 3, 1]], { cap: 'top' }).mesh(T.bark({ c: '#5a4030' })), x, z);
{ const Rp = R.geo(); for (const [a, b] of ROPES) { const n = 9, pt = u => [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u - Math.sin(u * PI) * .8, a[2] + (b[2] - a[2]) * u];

{ const G = R.geo(); LANT.forEach(([x, y, z], i) => { G.tint(1).loft(6, [[y - .5, .1, .1, 0, 1, x, z], [y - .38, .2, .2, .3, 1, x, z], [y - .2, .2, .2, .7, 1, x, z], [y - .1, .08, .08, 1, 1, x, z]], { cap: 'both' }); });

// ---- たき火：まるた、石の輪、火。まわりに すわる丸太 ----
{ const B = R.parts(), Bk = B.g(T.bark({ c: '#6a4a34' })); for (let k = 0; k < 5; k++) { const a = k / 5 * TAU; Bk.at(R.TR(FIRE[0], .12, FIRE[1], a, PI / 2 - .35)).loft(5, [[-.1, .1, .1, 0, .8], [.9, .08, .08, 1, 1]], {}).at(null); }

const fiddler = sitters[1];
const WK = [[-1.2, 0, '#6a8a3a', 'tufts', 'm', .75], [1.4, 3, '#c85a3a', 'twin', 'f', .72], [-.8, 7, '#4a5a8a', 'short', 'm', 1], [1, 9.5, '#8a4a6a', 'bun', 'f', 1]];
const walkers = WK.map(([dx, off, c, hs, sx, sc]) => act({ s: sc, sex: sx, hairStyle: hs, hair: '#4a3a30', mouth: 'smile', blush: true, cloth: 'tunic', top: c, top2: '#f0e4c8', bottom: '#4a3a34', lower: sx === 'f' ? 'skirt' : 'pants', skirtC: c }));
const dog = R.cat({ c: '#c8a070', belly: '#f0e4c8', s: 1.4 }); scene.add(dog);
const pl = new THREE.PointLight('#ffa050', 22, 16, 1.4); pl.position.set(FIRE[0], 1.4, FIRE[1]); scene.add(pl);

const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);

  sun.position.set(x - 20, 40, z - 30); sun.target.position.set(x, 0, z);

  { const J = juggler.userData.J; R.idle(juggler, t, 0); J.armL.rotation.set(-1.1 + Math.sin(t * 6) * .25, 0, .3); J.armR.rotation.set(-1.1 - Math.sin(t * 6) * .25, 0, -.3); J.foreL.rotation.x = J.foreR.rotation.x = -.6;
    const fwd = new THREE.Vector3(Math.sin(juggler.rotation.y), 0, Math.cos(juggler.rotation.y)), side = new THREE.Vector3(fwd.z, 0, -fwd.x);
    balls.forEach((b, i) => { const ph = (t * 1.5 + i / 3) % 1, s = Math.cos(ph * TAU) * .32, h = Math.sin(ph * PI) * 1.1; b.position.set(sg.x + fwd.x * .45 + side.x * s, SY + 1.35 + h, sg.z + fwd.z * .45 + side.z * s); }); }
  { const J = dancer.userData.J, a = t * .9; dancer.position.set(sg.x + Math.cos(a) * 1.4 + .5, SY, sg.z + Math.sin(a) * 1.2); dancer.rotation.y = -a; R.walk(dancer, t * 5, .5); J.armL.rotation.set(-2.6, 0, .5); J.armR.rotation.set(-.4, 0, -1.2); }
  crowd.forEach((p, i) => { const J = p.userData.J, ch = Math.max(0, Math.sin(t * 2 + i * 1.7)); R.idle(p, t + i, Math.sin(t * .3 + i) * .2); if (i % 3 === 0) { J.armL.rotation.set(-2.4 * ch, 0, .3); J.armR.rotation.set(-2.4 * ch, 0, -.3); } else if (i % 3 === 1) { J.armL.rotation.set(-1.2, 0, .5 + Math.sin(t * 8 + i) * .2); J.armR.rotation.set(-1.2, 0, -.5 - Math.sin(t * 8 + i) * .2); J.foreL.rotation.x = J.foreR.rotation.x = -1.2; } p.position.y = Math.abs(Math.sin(t * 4 + i)) * .06 * (i % 3 === 0 ? 1 : 0); });
  walkers.forEach((p, i) => { const k = WK[i], v = k[5] < .8 ? 1.9 : 1.2, wz = 2 - ((t * v + k[1] * 1.3) % 22); p.position.set(pathX(wz) + k[0], 0, wz); p.rotation.y = PI; if (k[5] < .8) { R.walk(p, t * 9 + i, 1.2); p.position.y = Math.abs(Math.sin(t * 9 + i)) * .12; } else R.walk(p, t * 4.4 + i, .8); });
  sitters.forEach((p, i) => { const J = p.userData.J; J.head.rotation.y = Math.sin(t * .4 + i * 2) * .4; J.armL.rotation.x = -.8; J.foreL.rotation.x = -1; J.armR.rotation.x = -.8 + (i === 1 ? Math.sin(t * 7) * .2 : 0); J.foreR.rotation.x = -1; });
  { const a = t * .5; dog.position.set(FIRE[0] + Math.cos(a) * 4.6, 0, FIRE[1] + Math.sin(a) * 4.6); dog.rotation.y = -a; R.catPose(dog, 'walk', t * 1.4); }
  bugs.forEach((b, i) => { const a = t * .3 + i * .9; b.position.set(x + Math.sin(a + i) * (4 + i % 4), 1 + Math.sin(t * .7 + i) * .8 + (i % 3) * .6, z - 3 + Math.cos(a * 1.3) * 5); b.rotation.y = a; FW.bugPose(b, t + i); });
  fh.material.opacity = .7 + Math.sin(t * 9) * .08 + Math.sin(t * 13) * .05; pl.intensity = 22 + Math.sin(t * 11) * 3;
  F.tick(t); D.tick(t, cam); crt.render(scene, cam, t);
});
