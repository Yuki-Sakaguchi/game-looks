<html lang="ja">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>12-22 線路ぞいの屋台町と巨大な柱 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#0e1022;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#ffe9c8;opacity:.88;text-shadow:0 1px 0 #000}
</style>
<div id="cap">12-22 ─ 線路ぞいの屋台町と巨大な柱 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="../game-looks-8/pack-city.js"></script>
<script src="pack-under1.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 夜、線路ぞいに屋台がならぶ下層の町。線路の向こう、町なみの上に、上の都市をささえる巨大な柱がそびえ、その胴を あかりの列（荷を運ぶ かご）が ゆっくり登っていく。柱の上には、冷たく白く光る台のふちと塔。
// 色の組は「紺の夜・青むらさきの鉄」＋「屋台の電球の だいだい」、差し色は上の都市の 冷たい白。下はあたたかく にぎやかに、上は しずかに光る。
// 主役は かばんを さげた帽子の少年（R.actor の toon）。屋台の前の道を右へ歩き、カメラは横から ならんで進む（すこし下から見上げて、柱と上の都市まで入れる）。
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), C = PACK_CITY(THREE, K, R), U = PACK_UNDER1(THREE, K, R, C), T = R.tex, X = C.tex, L = C.LIGHT, { hash } = K, PI = Math.PI;
R.cfg.actorBuild = 'toon';
const { scene, cam, renderer, onResize } = K.stage({ fov: 54, far: 1600, aa: false, fitAspect: .9, maxFov: 82 }), HAZE = '#3a3458';
scene.add(R.skyDome([[0, '#0a0c22'], [.6, '#1e2048'], [.9, '#3e3a66'], [1, '#5a4a70']], { r: 1200 })); scene.fog = new THREE.Fog(HAZE, 60, 1300);
const { sun } = K.lights(scene, renderer, { sky: 0x6a70b8, ground: 0x6a4a50, amb: 1.4, sun: 0xb8c8ff, power: .5, range: 30 }), SUN = new THREE.Vector3(-.3, .8, -.4).normalize();

// ---- 道（x の向き）・屋台・線路。あかりの一覧 ----
const TZ = -9, lights = [], STALL = [];
for (let x = -60, i = 0; x < 120; x += 4.6 + hash(i, 1) * 1.4, i++) { STALL.push({ x, i }); lights.push({ x, z: -1.6, r: 4.4, c: L.bulb, k: .95 }); }
for (let x = -60; x < 120; x += 9) lights.push({ x, z: TZ, r: 3, c: '#8aa0ff', k: .25 });
const land = R.ground({ w: 220, d: 70, cell: 1.5, cx: 30, cz: -12, layers: [X.asphalt({ wet: .5, c: '#4a4a60' }), T.dirt({ c: '#6a6070', pebbles: .9 }), X.plate({ c: '#5a5a70', n: 2 })],
  mix: (x, z) => [Math.abs(z - TZ) < 2.4 ? 1 : 0, z < -3.4 && z > -6 ? 1 : 0], shade: C.lightShade(lights, [.42, .42, .6]) }); scene.add(land.mesh);
const fixed = [], put = (o, x, z, ry = 0, y = 0) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
{ const G = R.geo(); for (let x = -80; x < 140; x += 6) C.trackQuad(G, x, x + 6, .06, TZ); fixed.push(G.mesh(X.track(), { offset: true })); }
// 屋台（のれん・湯気）と、その うしろの低い柵
STALL.forEach(({ x, i }) => { put(C.yatai({ c: ['#c2453a', '#2f7a8a', '#c8a04a', '#6a3a7a'][i % 4], kind: ['wave', 'ring', 'dots', 'bars'][i % 4], noren: ['#2f4a8a', '#b8302a', '#2f7a5a', '#e8e0d0'][i % 4], seed: i }), x, -3.2, 0);
  if (i % 3 === 1) put(R.crate({ s: .55, kind: 'x' }), x + 2.2, -2.4, .3); if (i % 4 === 2) put(C.drum({ c: C.PAL[i % 3] }), x + 2.3, -3.6); if (i % 5 === 0) put(R.bench({ w: 1.4 }), x + .2, -1.2, PI); });
fixed.push(C.fence({ len: 200, h: 1.2, kind: 'mesh' })); fixed[fixed.length - 1].position.set(30, 0, -6.2);
// 頭の上：屋台の前をわたる 裸電球とちょうちん、電柱と電線
const POLES = []; for (let x = -58, k = 0; x < 120; x += 12, k++) POLES.push(put(C.pole({ h: 6.4, lamp: false }), x, -4.6, PI / 2));
for (let k = 0; k < POLES.length - 1; k++) { const a = POLES[k].position, b = POLES[k + 1].position; fixed.push(C.bulbs([a.x, 4.2, -4.4], [b.x, 4.2, -4.4], { n: 9, sag: .9, cs: k % 2 ? [L.bulb] : [L.bulb, L.pink, L.bulb, L.amber] }), C.lanterns([a.x, 3.6, -4.3], [b.x, 3.6, -4.3], { n: 6, sag: .5, kinds: ['red', 'white', 'yellow'] })); }
// 線路の向こうの町：つぎはぎの家（2〜4 階）、給水タンク、ふみきりの信号
for (let x = -70, i = 0; x < 140; i++) { const w = 4.5 + hash(i, 3) * 2.5; put(C.shack({ w, d: 5, floors: 1 + Math.floor(hash(i, 4) * 2.2), seed: i + 20, shop: ['window', 'shutter', 'door', 'noren'][i % 4], lit: .85, awning: i % 3 ? 'tin' : false, laundry: i % 3 === 0, antenna: i % 2 === 0, tank: i % 4 === 1, sign: i % 3 === 1 ? { kind: ['ring', 'fish', 'star', 'cup'][i % 4], c: [L.pink, L.cyan, L.amber][i % 3], shape: 'tall', side: 1 } : false }), x + w / 2, -15.5, 0); x += w + .4; }
const sigs = [-14, 46].map(x => put(C.signal({ h: 3, cs: ['#ff5a4a', '#ff5a4a'], blink: true }), x, -6.6, 0));
scene.add(R.merge(fixed));

// ---- 遠く：上の都市をささえる巨大な柱と、柱の上の台（ふちが白く光る）と塔 ----
const PX = 40, PZ = -330, PH = 150, PR = 22;
const pillar = C.pillar({ r: PR, h: PH, seed: 2, c: '#8a88b8', emissive: '#3e3658', lm: 30 }); pillar.position.set(PX, 0, PZ); scene.add(pillar);
const pillar2 = C.pillar({ r: 12, h: PH, seed: 5, c: '#6a6898', emissive: '#2e2c52', lm: 50 }); pillar2.position.set(-240, 0, PZ - 60); scene.add(pillar2);
const city = U.city({ r: 180, n: 26, seed: 7, hmin: 50, hmax: 210, glow: '#dce6ff', light: [.3, .6, .8], plate: { th: 22, cone: 1.6, pipes: 30, lampC: '#e8f0ff', lampR: 3, rimGlow: '#c8d4f0', emissive: '#1a1a34' } }); city.position.set(PX - 50, PH + 24, PZ - 150); scene.add(city);
scene.add(C.backdrop({ r: 420, h: 60, y: -2, haze: '#4a4068', c: '#22203a' }));
// 柱を登りおりする あかりの列（荷を運ぶ かご）：4 本の すじ
const LANES = [-.5, -.18, .2, .52], CABS = 5, climb = U.lights([...Array(LANES.length * CABS)].map(() => [0, 0, 0]), { c: '#ffe0a0', r: 3.2, fog: false });
scene.add(climb);
scene.add(U.lights([...Array(9)].map((_, k) => [PX + Math.sin(k / 8 * 2.4 - 1.2) * (PR * 1.5), 6 + (k % 2) * 4, PZ + Math.cos(k / 8 * 2.4 - 1.2) * (PR * 1.5)]), { c: '#ffb070', r: 6, k: .5 }));   // 柱の根もとを照らす 町のあかり

// ---- 人 ----
const npc = (o, x, z, ry) => { const p = R.actor(o); p.position.set(x, 0, z); p.rotation.y = ry; scene.add(p); return p; };
const TOPS = ['#5a6a8a', '#8a5a3a', '#3f7a6a', '#a8743a', '#6a4a6a', '#b05a4a', '#7a7a5a'], HAIR = ['#2a2a34', '#6a3a2a', '#8a6a4a', '#b8b4b0'];
const vendors = STALL.map(({ x, i }) => npc({ hairStyle: ['bald', 'bun', 'short', 'tail'][i % 4], hair: HAIR[i % 4], beard: i % 3 === 0 ? 'mustache' : undefined, eyes: ['closed', 'big', 'half'][i % 3], mouth: 'smile', cloth: 'tunic', top: '#f0e8d8', top2: TOPS[i % 7], bottom: '#4a4a5a', hat: 'band', acc: TOPS[(i + 2) % 7], sex: i % 2 ? 'f' : 'm' }, x, -3.95, 0));
const guests = []; STALL.forEach(({ x, i }) => { if (i % 2) return; guests.push(npc({ sex: i % 4 ? 'm' : 'f', hairStyle: ['short', 'bob', 'spiky', 'bun'][i % 4], hair: HAIR[(i + 1) % 4], cloth: ['coat', 'jacket', 'overall'][i % 3], top: TOPS[(i + 3) % 7], bottom: '#3a3a4a', lower: i % 4 ? 'pants' : 'skirt', skirt: .6, hat: i % 6 === 2 ? 'cap' : undefined, acc: TOPS[i % 7] }, x + (i % 3 - 1) * .5, -2.05, PI + (hash(i, 9) - .5) * .6)); });
const walkers = [...Array(12)].map((_, i) => ({ p: npc({ sex: i % 2 ? 'f' : 'm', hairStyle: ['tufts', 'bob', 'short', 'tail', 'bald', 'twin'][i % 6], hair: HAIR[i % 4], cloth: ['coat', 'tunic', 'jacket', 'vest', 'robe'][i % 5], top: TOPS[i % 7], top2: '#e8dcc0', bottom: ['#4a4a5a', '#5a4a3a'][i % 2], lower: i % 2 ? 'skirt' : 'baggy', skirt: .7, shoes: 'shoe', back: i % 3 === 0 ? 'pack' : undefined, hat: i % 4 === 1 ? 'cap' : undefined, s: i % 5 === 4 ? .72 : 1 }, 0, 0, 0), z: [-.4, .9, 1.6, -.9][i % 4], sp: .7 + hash(i, 2) * .7, dir: i % 3 ? -1 : 1, ph: hash(i, 3) * 160 }));
const hero = npc({ sex: 'm', hairStyle: 'spiky', hair: '#3a2a24', bangs: 'jag', eyes: 'big', mouth: 'open', cloth: 'vest', top: '#3f8a5a', top2: '#f0e4c8', lower: 'shorts', bottom: '#6a5a4a', shoes: 'boot', shoe: '#5a3a2a', hat: 'cap', acc: '#e8892c', neck: 'scarf', strap: true, hold: 'case', s: .92 }, 0, .3, PI / 2);
const cat = R.cat({ c: '#3a3a44', belly: '#e8e4dc' }); scene.add(cat);
const steam = STALL.map(({ x }) => { const s = C.steam({ r: .35, rise: 1.9, n: 6, c: '#ffe8d8', a: .42 }); s.position.set(x, 1.25, -3.2); scene.add(s); return s; });
// 線路を走る 夜の電車
const train = new THREE.Group(); for (const dx of [-12.6, 0, 12.6]) { const c = C.train({ lit: 1, len: 12, c: '#c2603a', seed: 1 }); c.position.x = dx; train.add(c); } train.position.z = TZ; scene.add(train);
const follow = new THREE.PointLight('#ffb468', 7, 8, 1.4); scene.add(follow);

const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
const X0 = -6, SPEED = 1.1;
K.loop((dt, t) => {
  const x = X0 + t * SPEED; hero.position.set(x, 0, .3); hero.rotation.y = PI / 2; R.walk(hero, t * SPEED * 4.4, .85); hero.userData.J.armR.rotation.x = .1;
  const tall = innerWidth < innerHeight, D = tall ? 4.3 : 4.8; cam.position.set(x + .9, tall ? 1.05 : 1, D); cam.lookAt(x + .9, tall ? 6.4 : 5.4, -20);   // 横から、すこし見上げる
  sun.position.set(x + SUN.x * 50, SUN.y * 50, SUN.z * 50); sun.target.position.set(x, 0, 0); follow.position.set(x, 2.6, 1.5);
  walkers.forEach((w, i) => { const u = (t * w.sp + w.ph) % 120, wx = w.dir > 0 ? -50 + u : 70 - u; w.p.position.set(wx, 0, w.z); w.p.rotation.y = w.dir * PI / 2; R.walk(w.p, t * w.sp * 4.4 + i, w.p.scale.x < .8 ? 1.2 : .8); });
  vendors.forEach((v, i) => { R.idle(v, t + i * 1.7, Math.sin(t * .5 + i) * .3); if (i % 2 === 0) { v.userData.J.armR.rotation.x = -.9 - Math.sin(t * 3 + i) * .25; v.userData.J.foreR.rotation.x = -.8; } });
  guests.forEach((g, i) => { R.idle(g, t + i, Math.sin(t * .3 + i * 2) * .4); g.userData.J.armR.rotation.x = -.6 - Math.sin(t * 1.4 + i) * .4; g.userData.J.foreR.rotation.x = -1.3; });
  cat.position.set(x + 3.5 + Math.sin(t * .2) * .5, 0, -1.2); cat.rotation.y = PI / 2; R.catPose(cat, 'walk', t * 7);
  train.position.x = 140 - ((t * 11 + 120) % 260);
  LANES.forEach((ln, k) => { for (let c = 0; c < CABS; c++) { const up = k % 2 === 0, u = ((t * .018 * (1 + k * .15) + c / CABS) % 1), y = PH * .08 + (up ? u : 1 - u) * PH * .8, a = ln; climb.userData.set(k * CABS + c, PX + Math.sin(a) * (PR + .6), y, PZ + Math.cos(a) * (PR + .6), .8 + .3 * Math.sin(t * 3 + c)); } });
  C.update(t, cam); crt.render(scene, cam, t);
});
</script>
