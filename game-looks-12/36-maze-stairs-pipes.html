  const kx = -4 + ((t * 2.2) % 8); kid.position.set(kx, FH, -6); kid.rotation.y = PI / 2; R.walk(kid, t * 12, 1.1);
  R.idle(hanger, t + 1, 0); hanger.userData.J.armR.rotation.x = hanger.userData.J.armL.rotation.x = -2.4 + Math.sin(t * 1.5) * .2;
  const rz = 4 - ((t * 1.3) % 8); runner.position.set(6, -2 * FH, rz); runner.rotation.y = PI; R.walk(runner, t * 6);
  R.idle(shopkeep, t + 2, Math.sin(t * .7) * .4); chat.forEach((p, i) => { R.idle(p, t + i * 2, Math.sin(t * .8 + i) * .5); p.userData.J.armR.rotation.x = -.4 + Math.sin(t * 2.3 + i * 2) * .3; });
  const ca = (t * .5) % 6; cat.position.set(-5.6 + ca * .1, FH * 2 * 0 + 0, -4.2 + ca * .9); cat.rotation.y = .1; R.catPose(cat, 'walk', t * 8);
  flMat.color.setScalar(hash(Math.floor(t * 13), 7) > .78 ? .25 : 1);
  N.tick(t); C.update(t, cam); crt.render(scene, cam, t);
});
