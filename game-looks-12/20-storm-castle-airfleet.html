<html lang="ja">

<title>12-20 嵐の夜の城と飛空艇の艦隊 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#dfe6ff;opacity:.9;text-shadow:0 1px 0 #000}
</style>
<div id="cap">12-20 ─ 嵐の夜の城と飛空艇の艦隊 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="../game-looks-8/pack-fantasy-town.js"></script>
<script src="../game-looks-8/pack-fantasy-wild.js"></script>
<script src="../game-looks-9/pack-dark.js"></script>
<script src="pack-realm2.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 嵐の夜。がけの上の城の城壁。深い谷の霧の向こうから、黒い帆の飛空艇の艦隊が赤い灯をともして近づいてくる。いなずまが光るたびに、艦隊と遠くの山が白い空に浮かぶ。うしろの本丸の窓には あかり。
// 色の組は「青黒の空と石・いなずまの白・かがり火の だいだい」＋差し色は艦隊の赤い灯。暗い所は青むらさき寄りにして黒くつぶさず、ふちの光と あかりの輪で読ませる（D.mood の 'storm'）。
// 主役は青いマントの若い騎士（R.actor の toon）。がけのふちの城壁の上を前の本丸へ歩き、右うしろの高い所から肩ごしに見るカメラが追う。番兵・旗・雨・霧・からす・艦隊のプロペラが動く。帆の飛空艇は pack-realm2.js
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), F = PACK_FTOWN(THREE, K, R), FW = PACK_FWILD(THREE, K, R), D = PACK_DARK(THREE, K, R), Q = PACK_REALM2(THREE, K, R, F), T = R.tex, { hash } = K, PI = Math.PI;
const { scene, cam, renderer, onResize } = K.stage({ fov: 52, far: 1000, aa: false, fitAspect: .9, maxFov: 78 });
const hero = R.actor({ build: 'toon', hairStyle: 'spiky', hair: '#c8b088', eye: '#4a6aa8', eyes: 'sharp', cloth: 'armor', top: '#5a6a98', top2: '#c8c0a8', bottom: '#3a3c58', shoes: 'boot', shoe: '#4a3a34', gloves: 'gauntlet', glove: '#8a8aa0', shoulder: 'pad', neck: 'cape', acc: '#3a5ab8', back: 'sword' }); scene.add(hero);
const mood = D.mood(scene, renderer, 'storm', { follow: hero, range: 34, r: 700, dir: [0, .5, -1] });

// ---- 地形：城の台地（x > -6, y=0）。左（-x）は深い谷へ落ちる がけ。城壁は がけのふちを z の向きに走る ----
const WX = -4, WH = 6;
const LIT = [[3, -8], [6, -40], [22, -80]].map(([x, z]) => ({ x, z, r: 9, c: '#ffa850', k: 1 }));
const land = R.ground({ w: 120, d: 200, cell: 2, cx: 50, cz: -60, H: (x, z) => x > -5 ? Math.sin(z * .2) * .2 : -60, layers: [D.tex.deadGrass({ c: '#4a5654' }), D.tex.wetCobble({ c: '#5e6684' })], mix: (x, z) => [x > 8 && x < 14 ? 1 : 0, 0], shade: mood.shade(LIT) }); scene.add(land.mesh);
const fixed = [], put = (o, x, z, ry = 0, y = 0) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
const STONE = F.tex.ashlar({ c: '#5c6282', moss: .3 }), ROCK = FW.tex.caveRock({ c: '#4a4c68', glint: false, moss: .2, mossC: '#3e5a50' });
// がけ（城の下）と、谷の向こうの がけと山
for (let i = 0; i < 9; i++) put(FW.cliff({ w: 26, h: 110, d: 4, lean: .06, seed: i, tex: ROCK, top: D.tex.deadGrass({ c: '#4a5654' }) }), WX - 3, 20 - i * 25, -PI / 2, -110);
for (let i = 0; i < 9; i++) put(FW.cliff({ w: 70, h: 80 + hash(i, 1) * 90, d: 6, lean: .1, seed: i + 20, tex: ROCK }), -300 - hash(i, 2) * 60, 120 - i * 70, PI / 2, -110);

// ---- 城壁（主役の通路。外がわに のこぎり形の胸壁）、角の塔、前の本丸（窓のあかり） ----
{ const wall = F.wall({ len: 160, h: WH, th: 4, stone: STONE, crenel: false }); put(wall, WX, -40, PI / 2);
  put(F.wall({ len: 160, h: .7, th: .7, stone: STONE }), WX - 1.65, -40, PI / 2, WH);
  put(F.wall({ len: 160, h: .5, th: .4, stone: STONE, crenel: false }), WX + 1.8, -40, PI / 2, WH);
  for (const z of [-30, 14]) put(F.tower({ r: 3.6, h: 15, stone: STONE, roof: F.tex.slate({ c: '#2e3658' }), top: 'cone', roofH: 7, lit: 1, flag: { c: '#3a5ab8', crest: 'star', cc: '#d8d0b8', w: 2.2, h: 1.3 } }), WX, z); }
const castle = F.castle({ s: 2.6, stone: F.tex.ashlar({ c: '#565c7c', moss: .3 }), roof: F.tex.slate({ c: '#2e3658' }), c: '#3a5ab8', crest: 'star', cc: '#d8d0b8', lit: 1 }); castle.position.set(34, 0, -100); castle.rotation.y = .6; fixed.push(castle);
castle.updateMatrixWorld(true);
for (const [x, y, z] of [[-6, 10, 8], [4, 12, 8], [12, 8, 6], [-12, 8, 6], [0, 18, 2], [8, 22, -2], [-4, 26, -2], [16, 15, 4]]) { const w = D.windowLight({ w: 1.2, h: 2.2, kind: 'lancet', c: '#ffb060', k: 1, pool: 0 }); w.position.copy(new THREE.Vector3(x, y, z).applyMatrix4(castle.matrixWorld)); w.rotation.y = castle.rotation.y - .9; scene.add(w); }
// かがり火（城壁の上）
const FIRES = [[WX + .6, -2], [WX + .6, -20], [WX + .6, -44]];
for (const [x, z] of FIRES) put(D.brazier({ s: 1, light: z === -2 }), x, z, 0, WH);
scene.add(D.pools(FIRES.map(([x, z]) => ({ p: [x, WH + .02, z], r: 3.4, c: '#ff9a48', k: .7 }))));
scene.add(R.merge(fixed));

// ---- 艦隊：黒い帆の飛空艇（赤い灯）。谷の向こうから城へ向かう（+x の向き）。いちばん大きい旗艦がまん中 ----
const FLEET = [[-46, 26, -64, 2.8], [-80, 12, -112, 2], [-34, 44, -140, 2.2], [-120, 30, -150, 1.8], [-66, 62, -205, 1.8], [-160, 18, -215, 1.6], [-24, 74, -265, 1.6], [-120, 50, -285, 1.5], [-200, 40, -300, 1.4], [6, 30, -210, 1.8]];
const ships = FLEET.map(([x, y, z, s], i) => { const sh = Q.skyShip({ s, c: '#2a2a36', c2: '#4a2430', sail: '#34344a', sail2: '#2a2a38', wing: '#30304a', rib: '#22202a', iron: '#3a3a48', lamp: '#ff5038', crest: 'none', flag: 'none' }); sh.position.set(x, y, z); sh.rotation.y = PI / 2 + .25; scene.add(sh);
  const hl = D.halo({ c: '#ff4830', r: 1.8 * s, k: .8 }); hl.position.set(0, 3.3, 6.4); sh.children[0].add(hl); const h2 = D.halo({ c: '#ff6040', r: 1.4 * s, k: .6 }); h2.position.set(0, 3.9, -5.6); sh.children[0].add(h2);
  sh.userData.base = [x, y, z]; return sh; });

// ---- 天気：雲・雨・いなずま・谷の霧・からす ----
scene.add(D.clouds({ n: 12, r: 420, y: 150, s: 160, c: '#56648e', shade: '#2a3254', speed: .02 }), D.rain({ n: 900, slant: [.3, .2] }), D.lightning(mood, { first: 3.6, every: 5.5, az: -70, spread: 60, dist: 300 }));
scene.add(D.groundFog({ n: 40, box: [300, 300], y: -40, h: 18, w: 60, c: '#7a8ab8', a: .3, wind: [1.2, .3] }));
const flock = D.flock({ n: 9, r: 14, h: 4, center: [WX - 20, WH + 14, -30], s: 1.6 }); scene.add(flock);

// ---- 人：主役、番兵 2 人（やり）、旗 ----
R.cfg.actorBuild = 'toon';
const guards = [-16, -36].map((z, i) => { const g = R.actor({ hairStyle: 'short', hair: '#3a2a24', cloth: 'armor', top: '#4a5070', top2: '#a8a090', bottom: '#2e3048', hat: 'helm', hold: 'spear', neck: 'cape', acc: '#8a2a3a', shoes: 'boot' }); g.position.set(WX - .5, WH, z); g.rotation.y = -PI / 2; scene.add(g); return g; });
const flags = [-10, -26, -52].map((z, i) => { const f = F.flag({ kind: 'flag', w: 2, h: 1.2, pole: 3.6, c: i % 2 ? '#3a5ab8' : '#8a7a5a', crest: 'star', cc: '#d8d0b8' }); f.position.set(WX - 1.6, WH + .3, z); scene.add(f); return f; });
const lamp = D.lantern(hero, { hand: 'R', power: 8, range: 7, r: 2.4, k: .6 });

const crt = R.crt(renderer, { noise: 0, bright: 1.08 }); onResize(crt.resize);
const Z0 = 8, LEN = 30, SPEED = 1.2;
K.loop((dt, t) => {
  const z = Z0 - (t * SPEED) % LEN, y = WH, x = WX + .2;
  hero.position.set(x, y, z); hero.rotation.y = PI + .15; R.walk(hero, t * SPEED * 3.6, .8); D.lanternPose(hero); hero.userData.J.head.rotation.y = .5 + Math.sin(t * .4) * .15; lamp.userData.spot.position.y = y + .06;
  const tall = innerWidth < innerHeight; cam.position.set(x + (tall ? 1.1 : 1.8), y + (tall ? 2.6 : 2.4), z + (tall ? 4 : 4.8)); cam.lookAt(x - (tall ? 4 : 6), y + (tall ? 3 : 2.6), z - 30);   // 右うしろの高めから、肩ごしに谷の艦隊と前の本丸を見る
  guards.forEach((g, i) => { R.idle(g, t + i * 2, Math.sin(t * .3 + i) * .4); g.userData.J.armR.rotation.x = -.4; });
  ships.forEach((s, i) => { const b = s.userData.base; s.position.set(b[0] + t * 2.2, b[1] + Math.sin(t * .3 + i) * 1.5, b[2] + t * .5); });
  F.tick(t); Q.tick(t); D.tick(t, cam); crt.render(scene, cam, t);
});
</script>
