<title>12-33 港のジャンク船と夜景 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#e8e4ff;opacity:.85;text-shadow:0 1px 0 #000}
</style>
<div id="cap">12-33 ─ 港のジャンク船と夜景 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="../game-looks-8/pack-city.js"></script>
<script src="pack-neon1.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 夜の港。木の桟橋を主役が歩き、その向こうの海を 赤い帆のジャンク船と あかりのついた渡し船が ゆきかう。対岸には 山を背に高層の棟がびっしり立ち、屋上に巨大なネオンの看板。あかりが水面にたてに長く映る。
// 色の組は「こい あい色（海・空・山）」＋「こがね色（対岸の窓あかり・ちょうちん）」。差し色は 巨大な看板と帆の もも色・朱。海は黒くせず、紺に こがねの映りこみ。
// 主役は からし色のコートの女の人。カメラは桟橋の横、少し うしろから 主役と対岸を いっしょに見る（横からの絵）。船・つり人・ゆれるちょうちん・ちらつく看板・波が動く。
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), C = PACK_CITY(THREE, K, R), N = PACK_NEON1(THREE, K, R, C), T = R.tex, { hash } = K, PI = Math.PI;
R.cfg.actorBuild = 'toon';
const GOLD = '#ffc860', PK = '#ff4a9a', CY = '#4ae0e8', NAVY = '#1a2050';
const { scene, cam, renderer, onResize } = K.stage({ fov: 48, far: 1200, aa: false, fitAspect: .9, maxFov: 76 });
scene.add(R.skyDome([[0, '#0c1032'], [.55, '#1e2460'], [.85, '#3a3878'], [1, '#6a4a80']], { r: 900 })); scene.fog = new THREE.Fog('#2a2a62', 200, 1000);
scene.add(R.backdrop({ c: '#1e2650', haze: '#2a2a62', r: 520, h: 150, y: -6, rep: 3, seed: 2 }));   // 対岸のうしろの山
const { sun } = K.lights(scene, renderer, { sky: 0x8a90e0, ground: 0x3a4a90, amb: 1.6, sun: 0xb8c8ff, power: .5, range: 20 });

// ---- 海（コマ送りの波）と、水面に映る 対岸のあかり ----
const WF = T.water({ c: '#1e3070' }), wm = R.mat(WF[0], { vc: true, smooth: true, color: '#c8d0ff' });
{ const G = R.geo().normal([0, 1, 0]); for (let i = -12; i < 12; i++) for (let j = -2; j < 8; j++) { const x0 = i * 40, z0 = -j * 40; G.quad([x0, 0, z0 + 40], [x0 + 40, 0, z0 + 40], [x0 + 40, 0, z0], [x0, 0, z0], [0, 0, 13, 13]); } const sea = new THREE.Mesh(G.build(), wm); sea.receiveShadow = true; scene.add(sea); }

// ---- 対岸の夜景：山を背に、高層の棟がびっしり。屋上に巨大な看板 ----
const fixed = [], put = (o, x, z, ry = 0, y = 0) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; }, streaks = [];
const WALLC = ['#7a7ea8', '#8a8aa0', '#6a7a98', '#9a8a9a', '#7a8a9a'];
for (let row = 0; row < 3; row++) for (let x = -420, i = 0; x < 420; i++) { const w = 18 + hash(i, row, 1) * 16, h = (row === 0 ? 26 : row === 1 ? 50 : 80) + hash(i, row, 2) * (row === 2 ? 110 : 50), z = -270 - row * 45 - hash(i, row, 3) * 20;
  put(N.tower({ w, d: 20, h, c: WALLC[(i + row) % 5], seed: 300 + i * 3 + row, lit: .3 + row * .04, roof: row === 0, acBox: 0, grad: [.42, .62], step: hash(i, row, 4) > .6 ? h * .7 : 0 }), x + w / 2, z, 0);
  if (row === 0 && i % 2 === 0) streaks.push({ x: x + w / 2, z: z + 12, h: h * .5, c: GOLD, k: .55, w: w * .35, len: 70 });
  x += w + 4 + hash(i, row, 5) * (row === 2 ? 40 : 14); }
const BIG = [[-40, -262, 58, 'h', 4, PK, CY, 84], [120, -266, 48, 'h', 3, CY, PK, 60], [230, -300, 70, 'v', 4, GOLD, PK, 20], [-200, -296, 62, 'v', 3, PK, GOLD, 18], [40, -330, 150, 'h', 2, '#f0f0ff', PK, 50]];
for (const [x, z, y, kind, n, c, c2, w] of BIG) { const sg = N.sign({ kind, n, c, c2, w, seed: x | 0, bulbs: kind === 'h', depth: 1.2 }); sg.position.set(x, y, z); fixed.push(sg); const G = R.geo(); G.box(.6, y, .6, x - w * .3, 0, z - 1, { m: 4 }); G.box(.6, y, .6, x + w * .3, 0, z - 1, { m: 4 }); fixed.push(G.mesh(T.metal({ c: '#3a3c58' })));
  streaks.push({ x, z: z + 20, h: y, c, k: .8, w: w * .4, len: 160 }); }   // 屋上の巨大な看板と、その足
{ const t = C.neon({ kind: 'fish', c: CY, c2: PK, shape: 'sq', w: 36, two: true, seed: 4 }); t.position.set(-120, 42, -262); fixed.push(t); streaks.push({ x: -120, z: -240, h: 80, c: CY, k: .6, w: 10, len: 120 }); }

// ---- 桟橋：板の床・くい・係船柱・つなぎ綱・街灯・木箱・ちょうちんのひも ----
const DY = 1.2, B = R.parts(), deck = B.g(T.planks({ c: '#8a6a50', w: 3 })), post = B.g(T.bark({ c: '#5a4434' })).smooth(1);
deck.box(130, .25, 4.4, 0, DY - .25, 0, { m: 2 }); deck.box(130, .3, .25, 0, DY - .55, 2.2, { m: 2 }); deck.box(130, .3, .25, 0, DY - .55, -2.2, { m: 2 });
for (let x = -64; x <= 64; x += 3) for (const z of [-2.2, 2.2]) post.loft(6, [[-1.5, .17, .17, 0, .7, x, z], [DY + (z < 0 ? .5 : -.25), .15, .15, 1, 1, x, z]], { cap: 'top' });
for (let x = -60; x <= 60; x += 9) B.g(T.metal({ c: '#4a4c60' })).smooth(1).loft(8, [[DY, .18, .18, 0, x, -2], [DY + .45, .16, .16, .8, 1, x, -2], [DY + .55, .24, .24, 1, 1, x, -2]], { cap: 'top' });
fixed.push(B.group());
const lamps = []; for (let x = -54; x <= 60; x += 12) { lamps.push(put(C.streetLamp({ h: 4.2, light: Math.abs(x - 6) < 1, power: 10, range: 10 }), x, -1.9, -PI / 2)); }
put(R.crate({ s: .7 }), -2, 1.5, .3, DY); put(R.crate({ s: .5, kind: 'x' }), -1.5, 1.6, .9, DY + .7); put(C.drum({ c: '#3f6a8a' }), 9, 1.6, 0, DY); put(R.barrel({ c: '#7a5a3a' }), 16, -1.4, 0, DY); put(C.bench({}), 24, 1.6, PI, DY);
scene.add(R.merge(fixed));
for (let k = 0; k < 10; k++) { const x = -54 + k * 12; scene.add(C.lanterns([x, DY + 3.8, -1.9], [x + 12, DY + 3.8, -1.9], { n: 6, sag: .5, kind: k % 2 ? 'red' : 'yellow', r: .16 })); streaks.push({ x: x + 6, z: -3.5, h: 4.6, c: '#ffb050', k: .5, w: 1.2, len: 6 }); }
scene.add(C.streaks(streaks, { far: 900, y: .04 }));

// ---- 船：赤い帆のジャンク船 2 そう、茶色の帆 1 そう、渡し船 2 そう、小舟 ----
const boats = [[N.junk({ len: 14, sail: '#c8442e' }), -16, .55, 98], [N.junk({ len: 12, sail: '#a8582e', masts: 3 }), -30, -.45, 83], [N.junk({ len: 10, sail: '#d8603a' }), -52, .35, 222], [N.ferry({ len: 18, c: '#2a7a5a' }), -75, -.7, 237], [N.ferry({ len: 16, c: '#3a5a9a' }), -110, .8, 112]].map(([b, z, sp, ph]) => { scene.add(b); return { b, z, sp, ph }; });
const halos = boats.map(({ b }) => { const s = C.halo({ c: GOLD, r: 1.6, k: .7 }); b.add(s); s.position.set(-b.userData.len * .4, 2.6, 0); return s; });

// ---- 人：主役・つり人・待つ人・ねこ ----
const hero = R.actor({ sex: 'f', hairStyle: 'long', hair: '#2a2030', eyes: 'big', mouth: 'smile', cloth: 'coat', sleeve: 'long', top: '#e0a83a', top2: '#f8ecd0', lower: 'pants', bottom: '#2a2a48', shoes: 'boot', shoe: '#6a3a2a', neck: 'scarf', acc: '#c8302e' }); scene.add(hero);
const npc = (o, x, z, ry) => { const p = R.actor(o); p.position.set(x, DY, z); p.rotation.y = ry; scene.add(p); return p; };
const fishers = [[-14, -1.7], [3, -1.75], [31, -1.7]].map(([x, z], i) => { const p = npc(N.extra(i + 120, { hat: 'cap' }), x, z, PI); const G = R.geo(); G.box(.03, .03, 3, 0, 0, -1.5, { m: 1 }); const rod = G.mesh(T.metal({ c: '#8a7a5a' })); rod.position.set(.2, .9, .2); rod.rotation.x = -.6; p.add(rod); return p; });
const waiters = [[20, 1.2, -1.4], [21, .7, -2], [-24, 1.4, -.5]].map(([x, z, ry], i) => npc(N.extra(i + 140), x, z, ry));
const walkers = [...Array(4)].map((_, i) => ({ p: npc(N.extra(i + 160), 0, 0, 0), dir: i === 1 ? 1 : -1, z: [-1, -1.3, -1.1, -1.25][i], sp: i === 1 ? .45 : .7 + hash(i, 4) * .4, off: hash(i, 5) * 60 }));
const cat = R.cat({ c: '#d8a868', belly: '#f8ecd0' }); cat.position.set(-1.6, DY + .6, 1.5); cat.rotation.y = 2; scene.add(cat);

// ---- 主人公：桟橋を +x へ。カメラは横、少しうしろから ----
const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
const SPEED = 1.1, X0 = -12;
K.loop((dt, t) => {
  const x = X0 + t * SPEED, z = .1, tall = innerWidth < innerHeight;
  hero.position.set(x, DY, z); hero.rotation.y = PI / 2; R.walk(hero, t * SPEED * 6.4);
  if (tall) { cam.position.set(x - 1.4, DY + 1.5, 4.6); cam.lookAt(x + 6, DY + 3.2, -24); } else { cam.position.set(x - 2.6, DY + 1.5, 4.4); cam.lookAt(x + 3.2, DY + 2.2, -24); }
  sun.position.set(x + 10, 40, 20); sun.target.position.set(x, 0, 0);
  boats.forEach(({ b, z, sp, ph }, i) => { const W = 240, u = ((ph + t * sp * 3 + i * 47) % W + W) % W - W / 2 + 10; b.position.set(u, Math.sin(t * 1.1 + i) * .08, z); b.rotation.y = sp > 0 ? 0 : PI; b.rotation.z = Math.sin(t * .9 + i * 2) * .03; for (const s of b.userData.sails || []) s.rotation.y = .5 + Math.sin(t * .5 + i) * .08; });
  walkers.forEach(c => { const W = 40, b = c.off + t * c.sp * c.dir - x + 10, px = x - 10 + ((b % W) + W) % W; c.p.position.set(px, DY, c.z); c.p.rotation.y = c.dir > 0 ? PI / 2 : -PI / 2; R.walk(c.p, t * c.sp * 5 + c.off, .8); });
  fishers.forEach((p, i) => { R.idle(p, t + i, Math.sin(t * .3 + i) * .15); p.userData.J.armR.rotation.x = -.7 + Math.sin(t * 1.3 + i) * .05; });
  waiters.forEach((p, i) => R.idle(p, t * .8 + i * 2, Math.sin(t * .4 + i) * .4));
  R.catPose(cat, 'sit', t); R.flip(wm, WF, t, 3);
  C.update(t, cam); N.tick(t); crt.render(scene, cam, t);
});
</script>
