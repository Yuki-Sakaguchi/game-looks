<div id="cap">12-45 ─ 巨大な守り神の像 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 朝の やわらかい光の、白い広場。正面に、すわった けもの（大きな耳と長いしっぽの、この場面のための守り神）の高さ 45 m の白い像がそびえる。体には回路の彫り、顔には ドット絵の目と ほおの模様、ひたいに光る ひし形。
// 色の組は「白い石・うすい金色の朝の空・青むらさきの影」＋差し色の ミント（目・回路・頭の上の輪）。白は石の目地と彫りの段で読ませる。
// 主役は 角の生えた子（水色のマント）。像へ向かって歩き、カメラは低いうしろから見上げて、主役と像の顔までを入れる。まわりのアバターも像を見上げる。
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), FW = PACK_FWILD(THREE, K, R), CY = PACK_CYBER1(THREE, K, R, FW), T = R.tex, { hash } = K, PI = Math.PI, AC = CY.AC;
const { scene, cam, renderer, onResize } = K.stage({ fov: 60, far: 1000, aa: false, fitAspect: .9, maxFov: 82 });
scene.add(R.skyDome([[0, '#9ab0d8'], [.45, '#c8cce0'], [.78, '#ece2d8'], [.92, '#f6e4c4'], [1, '#faf0dc']], { r: 800 })); scene.fog = new THREE.Fog('#ece4dc', 150, 700);
const { sun } = K.lights(scene, renderer, { sky: 0xfff4e4, ground: 0xd0c8dc, amb: 1.5, sun: 0xfff0d8, power: 1.7, range: 60, map: 2048 }), SUN = new THREE.Vector3(-.55, .55, .6).normalize();

// ---- 広場（同心の輪の板）と、まわりの低い白い建物・遠くの塔 ----
const land = R.ground({ w: 400, d: 400, cell: 2, layers: [CY.tex.floor({ seed: 3 }), CY.tex.floor({ kind: 'ring', ac: AC.mint, seed: 6, c: '#dcdce6' }), CY.tex.floor({ kind: 'path', ac: AC.mint, seed: 7 })],
  mix: (x, z) => { const r = Math.hypot(x, z + 0); return r < 70 ? [Math.floor(r / 6) % 2, Math.abs(x) < 2.2 && z > 18 ? 1 : 0] : [0, 0]; } }); scene.add(land.mesh);
const fixed = [], put = (o, x, y, z, ry = 0) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
for (let i = 0; i < 16; i++) { const a = PI * .25 + i / 16 * PI * 1.5 + PI, d = 85 + hash(i, 1) * 30; put(CY.tower({ kind: ['slab', 'stack', 'round', 'slab'][i % 4], h: 14 + hash(i, 2) * 26, r: 4 + hash(i, 3) * 4, m: 6, seed: i, ac: [AC.mint, AC.sky, AC.pink][i % 3] }), Math.sin(a) * d, 0, Math.cos(a) * d, hash(i, 4) * PI); }
for (let i = 0; i < 10; i++) { const a = PI + (i / 9 - .5) * 2.2, d = 260 + hash(i, 5) * 120; put(CY.tower({ kind: ['spire', 'twist', 'halo', 'round'][i % 4], h: 100 + hash(i, 6) * 120, r: 10 + hash(i, 7) * 8, m: 16, seed: 20 + i, ac: [AC.mint, AC.sky, AC.lemon][i % 3] }), Math.sin(a) * d, 0, Math.cos(a) * d); }
// 道のわきの柱と記号
for (let k = 0; k < 7; k++) for (const sx of [-1, 1]) { const z = 24 + k * 9, P = R.parts(), Q = P.g(CY.tex.panel({ kind: 'fin', ac: AC.mint, m: 3, seed: k })); CY.prism(Q, [[0, .45, .45], [3.6, .3, .3], [4, .5, .5]], 6, { m: 3, cap: true }); put(P.group(), sx * 5, 0, z);
  const g = CY.glyphSprite(['diamond', 'star', 'ring', 'plus', 'moon', 'note', 'heart'][k], [AC.mint, AC.sky, AC.pink][(k + (sx > 0 ? 1 : 0)) % 3], .8); g.position.set(sx * 5, 4.7, z); scene.add(g); }

// ---- 守り神の像（この場面のための手打ちの絵：石と回路・顔） ----
const STONE = (() => { const P = R.Px(64), A = R.ramp('#d8d6e4', 7, { contrast: .85 }), Q = R.ramp(AC.mint, 6);
  P.each((x, y) => { const bx = (x + ((y >> 4) % 2) * 16) % 32, by = y % 16; return bx === 0 || by === 0 ? A[1] : bx === 1 || by === 1 ? A[6] : bx === 31 || by === 15 ? A[2] : hash(x >> 2, y >> 2, 3) > .85 ? A[3] : A[4]; });
  for (let k = 0; k < 5; k++) { let x = 4 + k * 13, y = 0; const c = k % 2 ? Q[4] : A[2]; while (y < 64) { P.set(x, y, c); P.set(x + 1, y, A[5]); y++; if (y % 11 === 0) { const dx = hash(k, y) > .5 ? 1 : -1; for (let i = 0; i < 5; i++) { x += dx; P.set(x, y, c); P.set(x, y + 1, A[5]); } P.rect(x - 1, y - 1, 3, 3, k % 2 ? Q[5] : A[1]); } } }
  return T.from(P, { m: 6 }); })();
const FACE = (() => { const P = R.Px(48, 40), A = R.ramp('#e8e6ee', 7, { contrast: .7 }), Q = R.ramp(AC.mint, 6), Pk = R.ramp(AC.pink, 6), dk = '#3a3a5a';
  P.each((x, y) => (hash(x >> 1, y >> 1, 5) > .88 ? A[3] : A[4]));
  for (const sx of [-1, 1]) { const cx = 24 + sx * 11;
    for (let i = -6; i <= 6; i++) { const yy = 15 + Math.round((i * sx) * .25) - Math.round(Math.cos(i / 6 * 1.3) * 3); P.set(cx + i, yy, dk); P.set(cx + i, yy - 1, A[1]); }   // まぶたの線（つり上がる）
    for (let j = 0; j < 7; j++) for (let i = -5; i <= 5; i++) { const e = (i / 5.5) ** 2 + ((j - 2) / 4.2) ** 2; if (e < 1 && j >= 0) P.set(cx + i, 16 + j, j < 2 ? Q[1] : e < .3 ? Q[5] : Q[3]); }   // 光る目
    P.rect(cx - 1, 18, 2, 3, '#ffffff'); P.rect(cx - 5, 23, 11, 1, A[1]);
    for (let k = 0; k < 3; k++) { P.line(cx + sx * (2 + k * 3), 27, cx + sx * (4 + k * 3), 33, Pk[3]); P.line(cx + sx * (3 + k * 3), 27, cx + sx * (5 + k * 3), 33, Pk[4]); } }   // ほおの 3 本のすじ
  P.rect(20, 2, 8, 1, A[1]); for (let y = 2; y < 12; y++) { P.set(23, y, Q[3]); P.set(24, y, Q[4]); }   // ひたいの回路
  for (let y = 0; y < 40; y++) { P.set(0, y, A[2]); P.set(47, y, A[2]); }
  return T.from(P, { m: 1 }); })();
const statue = (() => { const B = R.parts(), S = B.g(STONE), F = B.g(FACE), RX = R.TR(0, 0, 0, 0, -PI / 2), g = new THREE.Group();
  CY.prism(B.g(CY.tex.panel({ kind: 'band', ac: AC.mint, m: 6 })), [[0, 18, 18], [3, 18, 18]], 12, { m: 6 }); CY.prism(B.g(CY.tex.floor({ seed: 2, m: 6 })), [[3, 18, 18], [3, 16, 16]], 12, {}); CY.prism(S, [[3, 16, 16], [6, 16, 16]], 12, {}); CY.prism(B.g(CY.tex.floor({ seed: 4, m: 6 })), [[6, 16, 16], [6, 0, 0]], 12, {});   // 台座 2 段
  const Y = 6;
  S.loft(10, [[Y, 9.5, 10, 0, .9, 0, -4], [Y + 5, 10, 10.5, .2, 1, 0, -4], [Y + 10, 8, 8.5, .4, 1, 0, -3.5], [Y + 13, 5, 5, .5, 1, 0, -3]], { cap: 'top' });   // おしり
  S.loft(10, [[Y, 7.5, 7, 0, .9, 0, -1], [Y + 8, 7.4, 6.8, .3, 1, 0, 0], [Y + 16, 6.4, 6, .6, 1.02, 0, 1], [Y + 22, 4.6, 4.4, .85, 1.03, 0, 2], [Y + 25, 3.8, 3.8, 1, 1, 0, 2.6]], { cap: 'top' });   // 胸（前へ起きる）
  for (const sx of [-1, 1]) { S.loft(8, [[Y, 2.8, 3.4, 0, .9, sx * 3.8, 6.2], [Y + 1.6, 2.6, 3.2, .1, 1, sx * 3.8, 6], [Y + 2.6, 1.9, 2, .2, 1, sx * 3.8, 5], [Y + 12, 1.8, 1.8, .7, 1, sx * 3.9, 4.4], [Y + 17, 2.4, 2.4, 1, 1, sx * 4.2, 3]], { cap: 'top' });   // 前足
    S.loft(8, [[Y, 3.2, 4.2, 0, .9, sx * 7.5, -1], [Y + 1.6, 3, 4, .3, 1, sx * 7.8, -1.2], [Y + 6, 4.6, 6, .8, 1, sx * 8.4, -4], [Y + 10, 3, 4, 1, 1, sx * 8.2, -5]], { cap: 'top' }); }   // うしろ足（ももの ふくらみ）
  S.loft(8, [[Y + 24, 3.8, 3.8, 0, 1, 0, 2.4], [Y + 28, 3.4, 3.2, 1, 1, 0, 3.2]], {});   // 首
  const hy = Y + 27, hc = 3.4; S.loft(8, [[hy, 3.8, 3.6, 0, .9, 0, hc], [hy + 3, 5, 4.4, .4, 1, 0, hc], [hy + 6.5, 4.4, 4, .8, 1.04, 0, hc - .3], [hy + 8, 2.4, 2.2, 1, 1.06, 0, hc - .4]], { cap: 'top' });   // 頭
  const fz = hc + 4.25; F.quad([-4.4, hy + 1.6, fz], [4.4, hy + 1.6, fz], [4.4, hy + 7.4, fz - .3], [-4.4, hy + 7.4, fz - .3]);   // 顔（前の面に絵）
  S.at(R.TR(0, hy + 2.4, fz - 1.2, 0, PI / 2)).loft(8, [[0, 2.2, 1.6, 0, 1.1], [2.2, 1.9, 1.4, .5, 1.15], [3.1, 1.3, 1, 1, 1.2], [3.4, .4, .4, 1, 1.2]], { cap: 'top' }).at(null);   // 鼻づら
  for (const sx of [-1, 1]) { const b = [sx * 3.4, hy + 6.6, hc], L = 8, tip = [sx * 6.2, hy + 6.6 + L, hc - 1], f0 = [sx * 1.3, hy + 7.2, hc + .6], f1 = [sx * 5.2, hy + 5.4, hc + .9], bk = [sx * 3.4, hy + 6.4, hc - 2];
    const a1 = sx > 0 ? f0 : f1, a2 = sx > 0 ? f1 : f0; S.tri(a1, a2, tip, [0, 0], [1, 0], [.5, 1.2], 1.05).tri(a2, bk, tip, [0, 0], [1, 0], [.5, 1.2], .85).tri(bk, a1, tip, [0, 0], [1, 0], [.5, 1.2], .85); }   // 大きな耳
  FW.tube(S, [[0, Y + 2, -12, 2.4], [5, Y + 1.5, -15, 2.6], [11, Y + 1.5, -10, 2.4], [13, Y + 2, -2, 2.2], [12, Y + 2.5, 5, 1.8], [8, Y + 4, 10, 1.4], [5, Y + 7, 11, .6]], 8, { cap: true, m: 6, ur: 2 });   // しっぽ（前へまわす）
  g.add(B.group());
  const gem = CY.glyphSprite('diamond', AC.mint, 3.2, { fog: false }); gem.position.set(0, hy + 7.8, fz + .4); g.add(gem); const gh = CY.halo(AC.mint, 9, .6); gh.position.copy(gem.position); g.add(gh);
  const collar = []; for (let k = 0; k <= 24; k++) { const a = k / 24 * PI * 2; collar.push([Math.sin(a) * 4.3, Y + 24.6 - Math.cos(a) * .8, 2.4 + Math.cos(a) * 4.3]); } g.add(CY.line(collar, { c: AC.mint, w: .6, speed: 4, rep: 6 }));
  const ring = []; for (let k = 0; k <= 32; k++) { const a = k / 32 * PI * 2; ring.push([Math.sin(a) * 9, 0, Math.cos(a) * 9]); } const halo = CY.line(ring, { c: AC.lemon, w: 1.1, speed: 6, rep: 10 }); halo.position.set(0, hy + 13, hc - 1); g.add(halo);
  g.userData = { halo, hy, gem }; return g; })();
statue.position.set(0, 0, -8); statue.rotation.y = .45; scene.add(statue);
scene.add(R.merge(fixed));

// ---- 浮かぶ板と、のぼる記号の粒、空を行く乗りもの ----
const boards = [[-16, 9, 6, 'list', AC.sky, .5], [17, 11, 2, 'chart', AC.pink, -.5], [-9, 20, -2, 'icon', AC.mint, .3]].map(([x, y, z, k, c, ry], i) => { const b = CY.board({ w: 4, h: 2.5, ac: c, kind: k, seed: 50 + i }); b.position.set(x, y, z); b.rotation.y = ry; scene.add(b); return b; });
const rise = []; for (let i = 0; i < 26; i++) { const s = CY.glyphSprite(['diamond', 'star', 'plus', 'ring', 'heart'][i % 5], [AC.mint, AC.sky, AC.lemon, AC.pink][i % 4], .5 + hash(i, 1) * .5); scene.add(s); rise.push([s, (hash(i, 2) - .5) * 40, -8 + (hash(i, 3) - .5) * 40, hash(i, 4) * 40, .8 + hash(i, 5)]); }
const pods = [0, 1, 2, 3].map(i => { const p = CY.pod({ s: 1.6, ac: [AC.sky, AC.pink, AC.mint, AC.lemon][i] }); scene.add(p); return p; });

// ---- 人：主役と、見上げるアバターたち ----
const hero = CY.avatar({ sex: 'm', hairStyle: 'spiky', hair: '#f4f4f8', eyes: 'big', cloth: 'tunic', top: '#78b4f0', top2: '#ffffff', lower: 'pants', bottom: '#4a5a8a', shoes: 'boot', shoe: '#f4f4f8', ears: 'horn', earC: '#f0e0b0', icon: 'tri', iconC: AC.sky, seed: 1 }); scene.add(hero);
const FOLK = [[-3.4, 40, 'look'], [3.6, 37, 'point'], [-6.5, 33, 'look'], [7, 34, 'bow'], [-2, 30, 'look'], [9.5, 48, 'walk'], [-9, 52, 'walk'], [2.5, 31, 'point']].map(([x, z, k], j) => { const HS = ['twin', 'bob', 'tufts', 'long', 'bun', 'tail', 'short', 'twin'][j], hc = ['#f4a8c8', '#5a4a6a', '#f0d468', '#c8b8f0', '#78c8a8', '#f8b088', '#4a4a6a', '#f4f4f8'][j];
  const a = CY.avatar({ sex: j % 2 ? 'm' : 'f', hairStyle: HS, hair: hc, cloth: ['robe', 'jacket', 'coat', 'tunic', 'vest', 'overall', 'jacket', 'coat'][j], top: [AC.pink, '#f4f4f8', AC.lemon, AC.lilac, AC.mint, AC.peach, AC.sky, '#f4f4f8'][j], top2: '#ffffff', bottom: '#f4f4f8', skirt: j % 3 === 0 ? .6 : 0, ears: ['cat', 'fox', 'bunny', 'bear', 'cat', 'antenna', 'fox', 'bunny'][j], earC: hc, tail: j % 2 ? 'fox' : 'cat', tailC: hc, icon: j % 3 ? ['heart', 'star', 'note', 'moon'][j % 4] : null, iconC: [AC.pink, AC.lemon, AC.sky, AC.mint][j % 4], s: j === 4 ? .8 : 1, seed: j + 4 });
  a.position.set(x, 0, z); scene.add(a); return [a, x, z, k, j]; });
const crt = R.crt(renderer, { noise: 0, bloom: .12 }); onResize(crt.resize);
K.loop((dt, t) => {
  const z = 56 - (t * 1.1) % 20, x = .6; hero.position.set(x, 0, z); hero.rotation.y = PI; R.walk(hero, t * 4.8, .8); hero.userData.J.head.rotation.x = -.35;
  const tall = innerWidth < innerHeight; cam.position.set(x + (tall ? 1.1 : 1.6), tall ? 1 : .9, z + (tall ? 4.4 : 5.4)); cam.lookAt(x - .8, tall ? 9 : 6.6, z - 16);   // 低いうしろから見上げる
  sun.position.set(SUN.x * 90, SUN.y * 90, SUN.z * 90 + z * .5); sun.target.position.set(0, 0, z * .5); land.follow(0, z);
  FOLK.forEach(([a, px, pz, k, j]) => { const J = a.userData.J;
    if (k === 'walk') { const zz = pz - ((t * 1.0 + j * 3) % 18); a.position.set(px, 0, zz); a.rotation.y = PI + (px > 0 ? -.2 : .2); R.walk(a, t * 4.6 + j, .8); J.head.rotation.x = -.25; return; }
    a.rotation.y = PI + Math.atan2(px, -(pz + 8)) * -.2; R.idle(a, t + j, Math.sin(t * .3 + j) * .15); J.head.rotation.x = -.45;
    if (k === 'point') { J.armR.rotation.set(-2.6, 0, -.1); J.foreR.rotation.x = -.1; }
    if (k === 'bow') { const b = Math.max(0, Math.sin(t * .9 + j)); J.torso.rotation.x = b * .5; J.head.rotation.x = b * .3; } });
  statue.userData.halo.rotation.y = t * .15; statue.userData.halo.position.y = statue.userData.hy + 13 + Math.sin(t * .6) * .5;
  rise.forEach(([s, rx, rz, ry, sp], i) => { s.position.set(rx + Math.sin(t * .5 + i) * .8, (ry + t * sp * 1.5) % 44, rz); });
  pods.forEach((p, i) => { const an = t * (.1 + i * .02) + i * 1.6, rr = 45 + i * 12; p.position.set(Math.sin(an) * rr, 30 + i * 7, Math.cos(an) * rr - 10); p.rotation.y = an + PI / 2; });
  CY.tick(t); crt.render(scene, cam, t);
});
