<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>12-35 屋上の洗たく物と低く飛ぶ飛行機 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#fffaf0;opacity:.9;text-shadow:0 1px 0 #000}
</style>
<div id="cap">12-35 ─ 屋上の洗たく物と低く飛ぶ飛行機 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="../game-looks-8/pack-city.js"></script>
<script src="../game-looks-8/pack-ruins.js"></script>
<script src="pack-neon1.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 晴れた昼。ぎっしり ならんだ集合住宅の屋上の海。物干しに色とりどりの洗たく物がはためき、テレビのアンテナと水のタンクが林のように立つ。そのすぐ頭上を、大きな旅客機が低く横切っていく。
// 色の組は「空の青」＋「白ちゃけた クリーム（屋上・かべ）」。差し色は 洗たく物と主役のぼうしの 赤。遠くは みどりの山と かすんだ高層の棟。
// 主役は 赤いぼうしの男の子。カメラは 屋上の低い所から 主役ごしに空を見上げ、飛行機の腹と つばさを大きく入れる。はとが ついばみ、群れが回り、洗たく物が風にゆれる。
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), C = PACK_CITY(THREE, K, R), PK = PACK_RUINS(THREE, K, R), N = PACK_NEON1(THREE, K, R, C), T = R.tex, { hash } = K, PI = Math.PI;
R.cfg.actorBuild = 'toon';
const RED = '#e8302a';
const { scene, cam, renderer, onResize } = K.stage({ fov: 56, far: 1400, aa: false, fitAspect: .9, maxFov: 82 });
scene.add(R.skyDome([[0, '#2a6ad0'], [.5, '#5a9ae8'], [.85, '#a8d0f4'], [1, '#e8f0f4']], { r: 1000 })); scene.fog = new THREE.Fog('#c8dcec', 140, 900);
scene.add(R.backdrop({ c: '#5a8a6a', haze: '#b8d0e0', r: 700, h: 160, y: -10, rep: 3, seed: 5 }));   // 遠くの みどりの山
const { sun } = K.lights(scene, renderer, { sky: 0xd8ecff, ground: 0xc8b8a0, amb: 1.5, sun: 0xfff2dc, power: 2.4, range: 26 }), SUN = new THREE.Vector3(.35, .8, .45).normalize();
for (let k = 0; k < 7; k++) { const c = R.cloud({ s: 70 + hash(k, 1) * 60, seed: k }); c.position.set(-400 + k * 130, 160 + hash(k, 2) * 80, -500 - hash(k, 3) * 200); scene.add(c); }

// ---- 屋上の海：主役の棟（屋上が y = H0）と、まわりに ぎっしり ならぶ棟 ----
const H0 = 33, fixed = [], put = (o, x, z, ry = 0, y = 0) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
const WALLC = ['#e8dcc4', '#d8d0c0', '#e0d0b8', '#c8d4d0', '#e8d4c8', '#d0c8b8'];
put(N.tower({ w: 34, d: 16, h: H0, c: '#e4d8c0', seed: 700, roof: false, acBox: .3, cage: .6 }), 0, 0);
for (let i = -6; i <= 6; i++) for (let j = -6; j <= 2; j++) { if (j === 0 && Math.abs(i) < 2) continue; const w = 13 + hash(i, j, 1) * 6, d = 13 + hash(i, j, 2) * 4, far = Math.max(Math.abs(i) * .6, -j), h = H0 + Math.floor((hash(i, j, 3) - .55) * 5 + far * 1.2) * 3;
  put(N.tower({ w, d, h, c: WALLC[((i + 7) * 3 + j + 7) % 6], seed: 710 + (i + 7) * 13 + j + 7, acBox: Math.abs(i) + Math.abs(j) < 4 ? .25 : 0, wash: .5 }), i * 19 + (j % 2) * 5, j * 18 + (j > 0 ? 4 : 0), hash(i, j, 4) > .5 ? 0 : PI); }
for (let k = 0; k < 16; k++) put(N.tower({ w: 24, d: 22, h: 90 + hash(k, 1) * 90, c: '#c8ccd8', seed: 800 + k, roof: false, acBox: 0, grad: [1, 1.05] }), -360 + k * 48 + hash(k, 2) * 20, -300 - hash(k, 3) * 120);   // 遠くの高層の棟（かすむ）

// ---- 主役の屋上の物：物干しの台・アンテナ・タンク・はしご小屋・植木ばち・鳥小屋 ----
{ const B = R.parts(), pole = B.g(T.bark({ c: '#c8b078' })).smooth(1); for (const z of [-5, -2.2, 1.8]) for (let x = -14; x <= 14; x += 7) pole.loft(5, [[H0, .05, .05, 0, 1, x, z], [H0 + 2.3, .045, .045, 1, 1, x, z]]); fixed.push(B.group()); }
for (const [x, z, h] of [[-12, -6.5, 4.5], [-9, -6.8, 3.4], [6, -7, 5.2], [13, 6.5, 3.8], [10, -6.6, 4]]) put(N.antenna({ h, n: 6 }), x, z, x * .3, H0);
for (const [x, z, r] of [[-15, 5.5, 1.1], [-12.3, 5.6, .9], [15, -5.8, 1]]) put(C.tank({ r, h: 2, c: ['#4f8f88', '#a8a49a', '#c8a04a'][Math.round(x) & 1 ? 0 : 1], legs: .9 }), x, z, 0, H0);
put(C.shack({ w: 4, d: 3.4, floors: 1, seed: 7, shop: 'door', lit: 0, awning: 'tin', laundry: false, sign: false }), 4, 5.6, PI, H0);
for (let k = 0; k < 7; k++) { const G = R.geo().smooth(1); G.loft(8, [[0, .22, .22, 0, .8], [.4, .3, .3, 1, 1]], { cap: 'top' }); put(G.mesh(T.brick({ c: '#c86a4a' })), -6 + k * 1.1, 7.3, 0, H0); put(R.tuft({ kind: k % 2 ? 'bush' : 'flower', s: .7 }), -6 + k * 1.1, 7.3, k, H0 + .4); }
put(R.crate({ s: .6 }), 9, 2.6, .3, H0); put(R.crate({ s: .5, kind: 'x' }), 9.6, 3.4, .8, H0); put(C.drum({ c: '#4f8f88' }), -3, 6.4, 0, H0);
scene.add(R.merge(fixed));
const wash = []; for (const z of [-5, -2.2, 1.8]) for (let x = -14; x < 14; x += 7) { const l = N.laundry([x, H0 + 2.2, z], [x + 7, H0 + 2.2, z], { seed: Math.round(x * 3 + z * 7), n: 6, sag: .18 }); scene.add(l); wash.push(l); }
for (let k = 0; k < 18; k++) { const x = -110 + hash(k, 1) * 220, z = -100 + hash(k, 2) * 120; if (Math.abs(x) < 20 && Math.abs(z) < 12) continue; const y = H0 + Math.floor((hash(k, 3) - .3) * 6) * 3 + 1.8; scene.add(N.laundry([x, y, z], [x + 6, y, z + (hash(k, 4) - .5) * 3], { seed: k + 40, n: 5 })); }   // まわりの屋上の洗たく物

// ---- 生きもの：はと（ついばむ）・回る群れ ----
const pigeons = [[-4, -.6], [-3.2, .3], [-2.4, -.3], [7.5, 1], [8.2, .4]].map(([x, z]) => { const b = R.bird({ c: '#8a8a9a', belly: '#b8b8c8', neck: '#4a8a7a', s: 1.1 }); b.position.set(x, H0, z); scene.add(b); return b; });
const flock = PK.flock({ n: 9, r: 16, h: 5, c: '#9a9aa8', s: 2.2, speed: .35 }); flock.position.set(-10, H0 + 16, -30); scene.add(flock);

// ---- 飛行機：右から左へ、主役の頭上を低く横切る（30 秒ごと） ----
const plane = N.plane({ c: '#2a6ac8' }); plane.scale.setScalar(1.15); scene.add(plane);

// ---- 人：主役と、洗たく物を干す おばあさん ----
const hero = R.actor({ hairStyle: 'short', hair: '#2a2030', eyes: 'round', mouth: 'smile', cloth: 'tunic', top: '#f4f0e8', top2: '#3a6ac8', lower: 'shorts', bottom: '#3a4a8a', shoes: 'shoe', shoe: RED, hat: 'cap', acc: RED, s: .86 }); scene.add(hero);
const gran = R.actor({ sex: 'f', hairStyle: 'bun', hair: '#c8c4c8', eyes: 'closed', cloth: 'tunic', top: '#7ab0a0', top2: '#f4ecd8', lower: 'pants', bottom: '#5a5a6a', shoes: 'shoe', shoe: '#3a3a44', s: .92 }); gran.position.set(11, H0, -1.4); gran.rotation.y = PI; scene.add(gran);

// ---- 主人公：屋上を -x へ歩く。カメラは低い所から 主役ごしに空を見上げる ----
const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
const SPEED = .8, X0 = 6;
K.loop((dt, t) => {
  const x = X0 - t * SPEED, z = -.6 + Math.sin(t * .4) * .2, tall = innerWidth < innerHeight;
  hero.position.set(x, H0, z); hero.rotation.y = -PI / 2; R.walk(hero, t * SPEED * 7.4, .9); hero.userData.J.head.rotation.x = -.3 - Math.max(0, Math.sin(t * .5)) * .2;
  if (tall) { cam.position.set(x - 3.2, H0 + .7, z + 3.4); cam.lookAt(x + 1.4, H0 + 7, z - 10); } else { cam.position.set(x - 3.4, H0 + .75, z + 3.2); cam.lookAt(x + 2, H0 + 4.6, z - 10); }
  sun.position.set(x + SUN.x * 60, H0 + SUN.y * 60, SUN.z * 60); sun.target.position.set(x, H0, 0);
  const u = ((t + 1) % 30), px = 70 - u * 14; plane.position.set(px, H0 + 30 - u * .5, -24 + u * .3); plane.rotation.set(0, -.18, .04); plane.visible = px > -260;
  pigeons.forEach((b, i) => R.birdPose(b, i % 3 === 2 ? 'stand' : 'peck', t * 1.2 + i * 1.7));
  R.idle(gran, t, Math.sin(t * .6) * .2); gran.userData.J.armL.rotation.set(-2.4 - Math.sin(t * 1.4) * .2, 0, .1); gran.userData.J.armR.rotation.set(-2.3 - Math.cos(t * 1.4) * .2, 0, -.1);
  flock.userData.tick(t); C.update(t, cam); N.tick(t); crt.render(scene, cam, t);
});
</script>
