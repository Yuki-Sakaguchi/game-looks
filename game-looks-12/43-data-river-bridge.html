<title>12-43 データの川と光の橋 描きこんだテクスチャとブラウン管</title>
<style>

canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#fff;opacity:.92;text-shadow:0 1px 0 #3a3a6a,0 0 3px #3a3a6a}

<div id="cap">12-43 ─ データの川と光の橋 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="../game-looks-8/pack-fantasy-wild.js"></script>
<script src="pack-cyber1.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 夕方の、白い電脳の町を流れる「データの川」。光のすじと四角い粒が手前へ流れ、記号の魚がはねる。川には光る板をならべた太鼓橋がかかり、上流の岸には白い塔が遠くまで続く。
// 色の組は「白い岸・うすい水色の川・夕方の うすむらさきの空」＋差し色の ミント（橋の光と魚）。川は光る材質で、すじと粒の段で読ませる。
// 主役は くまの耳の小さな子（レモン色のつなぎ）。橋を左から右へわたり、カメラは下流がわの前からななめに、主役と、上流へ続く川と塔を入れる。
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), FW = PACK_FWILD(THREE, K, R), CY = PACK_CYBER1(THREE, K, R, FW), { hash } = K, PI = Math.PI, AC = CY.AC;
const { scene, cam, renderer, onResize } = K.stage({ fov: 50, far: 1200, aa: false, fitAspect: .9, maxFov: 80 });
scene.add(R.skyDome([[0, '#8a90c8'], [.4, '#aeaad8'], [.72, '#d8cce4'], [.9, '#f0d8e0'], [1, '#f8e4dc']], { r: 900 })); scene.fog = new THREE.Fog('#e0d6e8', 70, 800);
const { sun } = K.lights(scene, renderer, { sky: 0xe0dcff, ground: 0xd8d0e4, amb: 1.45, sun: 0xffe0cc, power: 1.5, range: 26 }), SUN = new THREE.Vector3(.35, .7, .6).normalize();

// ---- 岸と川底：川は z の向き（手前 +z が下流）。はば 16 m ----
const RW = 10, H = (x, z) => Math.abs(x) < RW ? -2.2 : 0;
const land = R.ground({ w: 220, d: 700, cell: 2, cz: -250, H, layers: [CY.tex.floor({ seed: 2 }), CY.tex.floor({ kind: 'path', ac: AC.mint, seed: 5 })], mix: (x, z) => [Math.abs(x) > RW + 1 && Math.abs(x) < RW + 4 ? 1 : 0, 0] }); scene.add(land.mesh);
const fixed = [], put = (o, x, y, z, ry = 0) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
{ const B = R.parts(), G = B.g(CY.tex.panel({ kind: 'band', ac: AC.sky, m: 3, c: '#dcdce8' })); G.quad([-RW, -2.2, 40], [-RW, -2.2, -660], [-RW, .05, -660], [-RW, .05, 40], [0, 0, 700 / 3, 2.25 / 3]).quad([RW, -2.2, -660], [RW, -2.2, 40], [RW, .05, 40], [RW, .05, -660], [0, 0, 700 / 3, 2.25 / 3]);
  fixed.push(B.group()); }
// 川の面（光る材質。テクスチャを送って流す）
const rt = CY.tex.river({ seed: 1 }).clone(); rt.needsUpdate = true; rt.wrapS = rt.wrapT = THREE.RepeatWrapping;
{ const G = R.geo(); for (let z = 40; z > -660; z -= 10) for (let x = -RW; x < RW; x += 4) G.quad([x, -1.1, z], [x + 4, -1.1, z], [x + 4, -1.1, z - 10], [x, -1.1, z - 10], [x / 4, -z / 4, (x + 4) / 4, -(z - 10) / 4]); scene.add(new THREE.Mesh(G.build(), FW.glowMat(rt, { own: true }))); }

// ---- 光の橋（太鼓橋。光る板の床と光の手すり） ----
const BL = 13, RISE = 2.4, BW = 2.8, deckY = x => Math.abs(x) > BL ? 0 : RISE * (1 - (x / BL) ** 2) * (1 - .1 * (x / BL) ** 2);
{ const G = R.geo(), n = 24, Gs = R.geo(); for (let i = 0; i < n; i++) { const x0 = -BL + i / n * BL * 2, x1 = x0 + BL * 2 / n, y0 = deckY(x0), y1 = deckY(x1), u0 = (x0 + BL) / 3, u1 = (x1 + BL) / 3;
    G.quad([x0, y0, BW / 2], [x1, y1, BW / 2], [x1, y1, -BW / 2], [x0, y0, -BW / 2], [u0, 0, u1, 1]);
    for (const sz of [-1, 1]) Gs.quad([x0, y0 - .35, sz * BW / 2], [x1, y1 - .35, sz * BW / 2], [x1, y1 + .02, sz * BW / 2], [x0, y0 + .02, sz * BW / 2], [u0, 0, u1, .12]); }
  scene.add(new THREE.Mesh(G.build(), FW.glowMat(CY.tex.floor({ kind: 'path', ac: AC.mint, seed: 8, c: '#e8f4f0', m: 3 }), {})));
  scene.add(new THREE.Mesh(Gs.build(), FW.glowMat(CY.tex.panel({ kind: 'band', ac: AC.mint, m: 3, c: '#d8ece8' }), {})));
  for (const sz of [-1, 1]) { const top = [], mid = []; for (let k = 0; k <= 24; k++) { const x = -BL - 1 + k / 24 * (BL * 2 + 2); top.push([x, deckY(x) + .62, sz * (BW / 2 - .05)]); } scene.add(CY.line(top, { c: AC.mint, w: .12, speed: 2.5, rep: 4 }));
    for (let k = 0; k <= 8; k++) { const x = -BL + k / 8 * BL * 2, P = R.parts(), Q = P.g(CY.tex.panel({ kind: 'fin', ac: AC.mint, m: 2, seed: 4 })); CY.prism(Q, [[0, .07, .07], [.62, .07, .07], [.74, .13, .13]], 6, { m: 2, cap: true }); put(P.group(), x, deckY(x), sz * (BW / 2 - .05)); } }
  const arc = []; for (let k = 0; k <= 24; k++) { const x = -BL + k / 24 * BL * 2; arc.push([x, deckY(x) - .9 - (1 - (x / BL) ** 2) * .6, 0]); } scene.add(CY.line(arc, { c: AC.mint, w: .22, speed: 3, rep: 6 })); }

// ---- 岸の物：上流へ続く白い塔、岸の柱と記号、浮かぶ板 ----
const ACS = [AC.mint, AC.sky, AC.pink, AC.lemon, AC.lilac];
for (let i = 0; i < 18; i++) { const sx = i % 2 ? 1 : -1, z = -30 - i * 34 - hash(i, 1) * 10, x = sx * (RW + 14 + hash(i, 2) * 30), h = 30 + hash(i, 3) * 90 + i * 4; put(CY.tower({ kind: ['slab', 'round', 'stack', 'twist', 'slab', 'spire'][i % 6], h, r: 6 + hash(i, 4) * 6, m: 10, seed: i, ac: ACS[i % 5] }), x, 0, z, hash(i, 5) * PI); }
{ const big = CY.tower({ kind: 'halo', h: 300, r: 30, m: 20, seed: 40, ac: AC.mint }); big.position.set(0, -20, -720); scene.add(big); }
for (let k = 0; k < 9; k++) for (const sx of [-1, 1]) { const z = 24 - k * 16, P = R.parts(), Q = P.g(CY.tex.panel({ kind: 'fin', ac: AC.sky, m: 3, seed: k })); CY.prism(Q, [[0, .35, .35], [3.2, .25, .25], [3.5, .4, .4]], 6, { m: 3, cap: true }); put(P.group(), sx * (RW + .8), 0, z);
  if (k % 2 === 0) { const g = CY.glyphSprite(['note', 'star', 'drop', 'diamond', 'plus'][(k / 2 + (sx > 0 ? 2 : 0)) % 5], ACS[(k + (sx > 0 ? 1 : 0)) % 5], .7); g.position.set(sx * (RW + .8), 4.1, z); scene.add(g); } }
const boards = [[-14, 3.4, -10, 'wave', AC.sky, .6], [15, 3.8, -22, 'list', AC.pink, -.5], [-12, 5, -46, 'chart', AC.mint, .5]].map(([x, y, z, k, c, ry], i) => { const b = CY.board({ w: 3, h: 1.9, ac: c, kind: k, seed: i + 30 }); b.position.set(x, y, z); b.rotation.y = ry; scene.add(b); return b; });
scene.add(R.merge(fixed));

// ---- 記号の魚（はねる）と、川の上をただよう光の粒 ----
const fishes = []; for (let i = 0; i < 9; i++) { const f = CY.glyphSprite('fish', [AC.mint, AC.sky, AC.pink, AC.lemon][i % 4], .9 + hash(i, 1) * .5); scene.add(f); const sp = CY.halo('#ffffff', 1.6, 0); scene.add(sp); fishes.push({ f, sp, x: (hash(i, 2) - .5) * 12, z: 9 - hash(i, 3) * 16 - (i > 6 ? 20 : 0), ph: hash(i, 4) * 5, per: 3 + hash(i, 5) * 2.5, dir: hash(i, 6) > .5 ? 1 : -1 }); }
const motes = FW.motes({ n: 70, box: [16, 3, 60], c: '#c8fff0', size: .16, rise: .2, drift: .8, y: -1 }); scene.add(motes);
const bits = []; for (let i = 0; i < 30; i++) { const b = CY.glyphSprite(['diamond', 'plus', 'ring', 'tri'][i % 4], ACS[i % 5], .28); scene.add(b); bits.push([b, (hash(i, 1) - .5) * 14, hash(i, 2) * 80, .2 + hash(i, 3) * .7]); }

// ---- 人：主役と、岸の 3 人 ----
const hero = CY.avatar({ sex: 'm', hairStyle: 'short', hair: '#8a6a5a', eyes: 'round', blush: true, cloth: 'overall', top: '#f0d468', top2: '#ffffff', shoes: 'shoe', shoe: '#f4f4f8', ears: 'bear', earC: '#8a6a5a', earIn: '#e8c8b0', icon: 'drop', iconC: AC.sky, s: .86, seed: 1 }); scene.add(hero);
const bank = [
  [CY.avatar({ sex: 'f', hairStyle: 'twin', hair: '#78c8a8', cloth: 'tunic', top: '#e8f4f0', top2: '#6fd8c0', lower: 'skirt', skirt: .5, ears: 'cat', earC: '#78c8a8', tail: 'cat', tailC: '#78c8a8', icon: 'fish', iconC: AC.mint, seed: 2 }), -RW - 1.2, -6, 'wave'],
  [CY.avatar({ sex: 'm', hairStyle: 'spiky', hair: '#f4f4f8', cloth: 'coat', top: '#d8dcec', top2: '#a898f0', ears: 'horn', earC: '#c8b8f0', ring: AC.lilac, seed: 3 }), RW + 1.5, -14, 'idle'],
  [CY.avatar({ sex: 'f', hairStyle: 'bob', hair: '#f4a8c8', cloth: 'jacket', top: '#f08cb8', top2: '#ffffff', lower: 'shorts', bottom: '#f4f4f8', ears: 'bunny', earC: '#ffffff', tail: 'bunny', icon: 'heart', iconC: AC.pink, seed: 4 }), RW + 2.5, 30, 'walk']];
bank.forEach(([a]) => scene.add(a));
const crt = R.crt(renderer, { noise: 0, bloom: .12 }); onResize(crt.resize);
K.loop((dt, t) => {
  const x = -13 + (t * 1.2) % 28, y = deckY(x); hero.position.set(x, y, .2); hero.rotation.y = PI / 2 - .05; R.walk(hero, t * 5.8, .85); if (Math.abs(x) < BL) hero.rotation.x = 0;
  const tall = innerWidth < innerHeight; const cx = x + (tall ? 1.6 : 2.1); cam.position.set(cx, y + (tall ? 1.55 : 1.4), tall ? 3.6 : 4.3); cam.lookAt(x - (tall ? .3 : 1), y + (tall ? 1.3 : 1.15), -6);   // 下流がわの前から、ななめに。主役のうしろに上流の川と塔   // 下流がわの横から。うしろに上流の川と塔
  sun.position.set(x + SUN.x * 60, SUN.y * 60, SUN.z * 60); sun.target.position.set(x, 0, 0); land.follow(x, 0);
  rt.offset.y = t * .35;
  fishes.forEach(o => { const u = ((t + o.ph) % o.per) / 1.4; if (u < 1) { const yy = -1.1 + Math.sin(u * PI) * 2.6, xx = o.x + o.dir * (u - .5) * 3; o.f.position.set(xx, yy, o.z); o.f.material.rotation = -o.dir * (u - .5) * 2 + (o.dir < 0 ? PI : 0); o.f.material.map.flipY = true; o.f.visible = true; o.f.scale.x = Math.abs(o.f.scale.x) * 1; } else o.f.visible = false;
    const sp = Math.max(0, 1 - Math.abs(u - 1) * 4); o.sp.position.set(o.x + o.dir * 1.5, -1, o.z); o.sp.material.opacity = sp * .6; });
  bits.forEach(([b, bx, bz, s], i) => { const z = 40 - ((bz + t * 6 * s) % 100); b.position.set(bx + Math.sin(t + i) * .3, -.7 + Math.sin(t * 2 + i) * .15, z); });
  bank.forEach(([a, bx, bz, k], i) => { if (k === 'walk') { const z = bz - (t * 1.1) % 60; a.position.set(bx, 0, z); a.rotation.y = PI; R.walk(a, t * 5.2, .8); } else { a.position.set(bx, 0, bz); a.rotation.y = bx < 0 ? PI / 2 : -PI / 2; R.idle(a, t + i); if (k === 'wave') { a.userData.J.armR.rotation.set(-2.6, 0, -.3 + Math.sin(t * 6) * .3); a.userData.J.foreR.rotation.x = -.4; } } });
  motes.userData.tick(t, 0, -10); CY.tick(t); crt.render(scene, cam, t);
});
</script>
