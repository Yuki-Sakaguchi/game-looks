<title>12-30 下層の屋上から見る上層の花火 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#0e0e24;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#ffeccc;opacity:.9;text-shadow:0 1px 0 #000}
</style>
<div id="cap">12-30 ─ 下層の屋上から見る上層の花火 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（カメラが自動でゆれる）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="../game-looks-8/pack-city.js"></script>
<script src="../game-looks-8/pack-fantasy-town.js"></script>
<script src="pack-under2.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 夜。下層の古い建物の屋上。せんたく物のひもと、たるやかんに植えた草花の間に、近所の人々が集まって空を見上げる。
// ずっと向こう、空にうかぶ「上の都市」の白と金の塔の上で、花火があがる。手はとどかないが、光だけは ここまで とどき、みんなの顔をそめる。
// 色の組は「夜の紺・コンクリートと鉄の灰」＋ちょうちんの だいだい、差し色は花火の もも・水色・金。主役は らんかんに こしかけた赤い服の少年（R.actor の toon）。カメラは屋上のうしろの高めから、人々の背中ごしに塔と花火を見上げ、ゆっくり横へゆれる。
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), C = PACK_CITY(THREE, K, R), F = PACK_FTOWN(THREE, K, R), U = PACK_UNDER2(THREE, K, R), T = R.tex, X = C.tex, { hash } = K, PI = Math.PI;
R.cfg.actorBuild = 'toon';
const HAZE = '#2a2444';
const { scene, cam, renderer, onResize } = K.stage({ fov: 54, far: 1200, aa: false, fitAspect: .9, maxFov: 80 });
scene.add(R.skyDome([[0, '#080a20'], [.55, '#141634'], [.85, '#2a2850'], [1, '#4a3a5a']], { r: 1100 })); scene.fog = new THREE.Fog(HAZE, 40, 260);
const { sun } = K.lights(scene, renderer, { sky: 0x8a8ad0, ground: 0x4a3a40, amb: 1.2, sun: 0xc0c8ff, power: .5, range: 20 }), SUN = new THREE.Vector3(.3, .9, -.4).normalize();
// 星
{ const p = []; for (let i = 0; i < 260; i++) { const a = hash(i, 1) * PI * 2, e = .25 + hash(i, 2) * 1.2; p.push(Math.cos(a) * Math.cos(e) * 900, Math.sin(e) * 900, Math.sin(a) * Math.cos(e) * 900); } const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: '#c8d0ff', size: 1.5, sizeAttenuation: false, fog: false }))); }

// ---- 屋上（y = 0）：コンクリートと鉄板の床、ひくい らんかん（前のはしは z = -6）、物置、水そう、アンテナ ----
const lights = [{ x: -2, z: -1, r: 5, c: '#ffb060', k: .6 }, { x: 3, z: 1.5, r: 4.5, c: '#ffb060', k: .5 }];
const land = R.ground({ w: 18, d: 14, cell: 1, cz: -.5, layers: [X.conc({ c: '#7a7a84' }), X.plate({ c: '#6a6a7a', n: 2, rust: .6 }), X.tile({ c: '#8a6a5a', c2: '#6a5a4a', check: true })], mix: (x, z) => [hash(Math.round(x / 3), Math.round(z / 3)) > .7 ? 1 : 0, x > 4 && z > 0 ? 1 : 0], shade: C.lightShade(lights, [.4, .4, .55]) });
scene.add(land.mesh);
const fixed = [], put = (o, x, z, ry = 0, y = 0) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
{ const G = R.geo(); G.box(18, .9, .35, 0, 0, -6.6, { m: 2 }); G.box(.35, .9, 13.4, -9, 0, -.5, { m: 2 }); G.box(.35, .9, 13.4, 9, 0, -.5, { m: 2 }); fixed.push(G.mesh(X.conc({ c: '#8a8690' }))); }   // らんかん
{ const G = R.geo(); G.box(18.4, .12, .5, 0, -9.5, -6.7, { m: 2 }); for (let y = -9; y < 0; y += 3) G.box(18.4, 2.6, .2, 0, y, -6.62, { m: 3 }); fixed.push(G.mesh(X.tin({ c: '#6a5a5a', rust: .6 }))); }   // 建物の前のかべ（屋上の下）
put(C.tank({ r: 1.1, h: 2, kind: 'v', c: '#4f8f88', legs: true }), 6.6, 4.2); put(C.acbox({ fan: true }), 7.6, -3.6, -PI / 2); put(C.shack({ w: 4, d: 3, floors: 1, seed: 5, lit: 1, shop: 'door', antenna: true }), -6, 4.4, 0);
// 植木：たる・ドラムかん・木箱に草花
for (const [x, z, k, s] of [[-7.8, -5.4, 'flower', 1], [-6.6, -5.5, 'bush', 1.2], [7.8, -5.4, 'flower', .9], [4.8, -5.5, 'grass', 1], [-8, 1.5, 'bush', 1.3], [8, 1, 'flower', 1], [-3, 5.6, 'grass', 1], [1.6, 5.6, 'flower', 1.1]]) {
  const pot = (x + z) % 2 > 0 ? R.barrel({ h: .6, r: .32, c: '#7a5a40' }) : C.drum({ c: ['#b5603c', '#4f8f88', '#c8a04a'][Math.abs(Math.round(x)) % 3], mark: 'none', h: .5, r: .3 }); put(pot, x, z); put(R.tuft({ kind: k, s }), x, z, x, .55); }
put(R.tree({ kind: 'bush', h: 2.2, c: '#4a7a4a', seed: 3 }), -7.8, -2.4); put(R.bench({ w: 1.6 }), -4.2, -4.6); put(R.crate({ s: .5 }), 3.4, -4.9, .4); put(R.crate({ s: .4, kind: 'x' }), 3.9, -5, .9, .5);
// まわりの屋根（下に見える下町）
for (let i = 0; i < 40; i++) { const a = hash(i, 1) * PI * 2, d = 16 + hash(i, 2) * 70, x = Math.cos(a) * d, z = Math.sin(a) * d - 10; if (z > -8 && Math.abs(x) < 20) continue; put(C.shack({ w: 5 + hash(i, 3) * 3, d: 5, floors: 2 + Math.floor(hash(i, 4) * 3), seed: i, lit: .5, laundry: i % 2 === 0, antenna: i % 3 === 0, tank: i % 4 === 1 }), x, z, hash(i, 5) * PI, -14 + hash(i, 6) * 6); }
scene.add(R.merge(fixed));
scene.add(C.backdrop({ r: 240, h: 40, y: -30, haze: HAZE }));
// せんたく物のひも（風でゆれる）と、ちょうちんの列
const LAUN = X.laundry(), wash = [[-8.6, 2.3, -2.6, -3.4, -.6], [3.6, 2.4, -1.4, 8.6, -3.2]].map(([x0, y, z0, x1, z1]) => { const g = new THREE.Group(), G = R.geo(), len = Math.hypot(x1 - x0, z1 - z0); G.quad([0, -.75, 0], [len, -.75, 0], [len, 0, 0], [0, 0, 0], [0, 0, len / 3, 1]); g.add(G.mesh(LAUN, { side: true })); g.position.set(x0, y, z0); g.rotation.y = -Math.atan2(z1 - z0, x1 - x0); scene.add(g); return g; });
scene.add(C.lanterns([-8.7, 2.7, -5.6], [-8.7, 2.9, 5], { n: 8, sag: .6, kinds: ['red', 'white'] }), C.lanterns([8.7, 2.7, -5.6], [8.7, 2.9, 5], { n: 8, sag: .6, kinds: ['yellow', 'red'] })); 
const lant = new THREE.PointLight('#ffb060', 9, 12, 1.4); lant.position.set(-1, 2.6, -3); scene.add(lant);

// ---- 上の都市と花火（はるか向こう。台の上の白と金の塔。その上で花火が開く） ----
const UP = [-30, -380]; { const up = U.upper({ r: 150, y: 50, th: 30, towers: 20, tall: .55, glow: true, tint: .66, haze: '#8a80b0', hazeK: .16, seed: 11, hang: 8, dotSize: 2 }); up.position.set(UP[0], -40, UP[1]); scene.add(up);
  const h = U.halo({ c: '#ffe8b8', r: 190, k: .12 }); h.position.set(UP[0], 120, UP[1] - 40); scene.add(h); }
const fw = U.fireworks({ n: 6, center: [UP[0] + 20, 175, UP[1] + 60], spread: [340, 60, 60], per: 4.4, R0: 38, size: 4.4, cs: [['#ff7aa8', '#ffe0f0'], ['#7ae0ff', '#e0fbff'], ['#ffd060', '#fff4c0'], ['#ffffff', '#fff8e0'], ['#a8ff90', '#f0ffe0'], ['#ff9a50', '#fff0d0']] }); scene.add(fw);
const flashL = new THREE.DirectionalLight('#ffd8e8', 0); flashL.position.set(0, 40, -100); scene.add(flashL);

// ---- 人：主役（らんかんに こしかける）、肩車の親子、ならんで立つ人々、いすの おばあさん、はねる子 ----
const act = (o, x = 0, z = 0, ry = 0) => { const p = R.actor({ build: 'toon', ...o }); p.position.set(x, 0, z); p.rotation.y = ry; scene.add(p); return p; };
const hero = act({ s: .85, hairStyle: 'spiky', hair: '#2a2228', bangs: 'jag', eyes: 'big', mouth: 'open', blush: true, cloth: 'jacket', sleeve: 'short', top: '#c8402e', top2: '#f0e4c8', lower: 'shorts', bottom: '#3a3a4a', shoes: 'shoe', shoe: '#e8e0d0', neck: 'scarf', acc: '#f0c040' }, .8, -6.45, PI);
const NB = [[-2.4, -4.8, PI + .2, { sex: 'f', hairStyle: 'long', hair: '#3a2a20', cloth: 'tunic', sleeve: 'long', top: '#4f8f88', lower: 'skirt', skirt: .7, skirtC: '#3a3a4a' }], [-1.5, -4.9, PI - .1, { hairStyle: 'short', hair: '#2a2228', beard: 'stubble', cloth: 'vest', top: '#c8a04a', top2: '#e8dcc0', bottom: '#4a4a5a' }],
  [-5.6, -4.4, PI + .3, { hairStyle: 'tufts', hair: '#5a3a28', cloth: 'overall', top: '#5a6a8a', top2: '#e8dcc0', bottom: '#5a6a8a', hat: 'cap', acc: '#b5603c' }], [4.2, -4.6, PI - .2, { sex: 'f', hairStyle: 'bun', hair: '#8a8a8a', cloth: 'coat', top: '#8a5a7a', top2: '#e8d8c0', lower: 'skirt', skirt: .9, skirtC: '#4a3a4a' }],
  [4.8, -4.4, PI - .3, { sex: 'f', hairStyle: 'twin', hair: '#6a3a24', mouth: 'open', blush: true, cloth: 'tunic', top: '#e8c040', lower: 'skirt', skirt: .5, skirtC: '#c8402e', s: .68 }], [6, -3, PI - .5, { hairStyle: 'bald', hair: '#8a8a8a', beard: 'beard', cloth: 'robe', top: '#6a5a4a', top2: '#d8ccb0', skirt: 1 }], [-.2, -3.2, PI, { sex: 'f', hairStyle: 'tail', hair: '#2a2228', cloth: 'jacket', top: '#e8e0cc', top2: '#4f8f88', lower: 'pants', bottom: '#3a4a5a' }]];
const folk = NB.map(([x, z, ry, o]) => act({ mouth: 'smile', shoes: 'shoe', ...o }, x, z, ry));
const dad = folk[2], kid = act({ hairStyle: 'bob', hair: '#5a3a28', mouth: 'open', blush: true, cloth: 'tunic', top: '#d8402c', lower: 'shorts', shoes: 'shoe', s: .6 }); dad.userData.J.torso.add(kid); kid.position.set(0, .5, .02); kid.rotation.y = 0;
const granny = folk[5]; granny.position.y = .22; const stool = F.stool(); stool.position.set(6, 0, -2.8); scene.add(stool);
const cat = R.cat({ c: '#3a3a44', belly: '#e8e4dc' }); cat.position.set(-.6, .9, -6.55); cat.rotation.y = PI; scene.add(cat);
const pl = new THREE.PointLight('#ffffff', 0, 30, 1.2); pl.position.set(0, 10, -14); scene.add(pl);

const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
const tgt = new THREE.Vector3();
K.loop((dt, t) => {
  // 花火の光で、屋上の人の顔がそまる
  const flash = fw.userData.flash || 0; pl.intensity = flash * 30; flashL.intensity = flash * 1.6;
  const tall = innerWidth < innerHeight, sw = Math.sin(t * .1);
  cam.position.set(1.8 + sw * 1.4, tall ? 1.9 : 2, tall ? .6 : .9); tgt.set(-.2 + sw * .6, tall ? 6.2 : 4.8, -20); cam.lookAt(tgt);   // 屋上のうしろの高めから、集まった人々の背中ごしに、塔と花火を見上げる（ゆっくり横へゆれる）
  sun.position.set(SUN.x * 40, SUN.y * 40, SUN.z * 40);
  // 主役：らんかんに こしかけ、足をぶらぶら、空を見上げる
  { const J = hero.userData.J; hero.position.y = .52; R.idle(hero, t, Math.sin(t * .3) * .2); J.legL.rotation.x = J.legR.rotation.x = -1.5; J.shinL.rotation.x = 1.2 + Math.sin(t * 2.4) * .25; J.shinR.rotation.x = 1.2 + Math.sin(t * 2.4 + 1.6) * .25; J.head.rotation.x = -.45; J.armL.rotation.set(.3, 0, .5); J.armR.rotation.set(.3, 0, -.5); if (flash > .4) { J.armR.rotation.set(-2.6, 0, -.3); } }
  folk.forEach((p, i) => { const J = p.userData.J; R.idle(p, t + i, Math.sin(t * .3 + i) * .25); J.head.rotation.x = -.4;
    if (i === 4) { MOjump(p, t); } else if (i === 5) { J.legL.rotation.x = J.legR.rotation.x = -1.4; J.shinL.rotation.x = J.shinR.rotation.x = 1.4; }
    else if (i === 2) { J.armL.rotation.set(-2.6, 0, .5); J.armR.rotation.set(-2.6, 0, -.5); J.foreL.rotation.x = J.foreR.rotation.x = -.6; }
    else if (i === 0 || i === 6) { const k = Math.max(0, Math.sin(t * .7 + i)); J.armR.rotation.set(-1.6 - k * 1.2, 0, -.2); J.foreR.rotation.x = -.2; } });
  { const J = kid.userData.J; R.idle(kid, t, 0); J.legL.rotation.set(-1.4, 0, .5); J.legR.rotation.set(-1.4, 0, -.5); J.shinL.rotation.x = J.shinR.rotation.x = 1.2; J.armL.rotation.set(-2.8 - Math.sin(t * 5) * .2, 0, .3); J.armR.rotation.set(-2.8 + Math.sin(t * 5) * .2, 0, -.3); J.head.rotation.x = -.4; }
  wash.forEach((g, i) => { g.children[0].rotation.x = Math.sin(t * 1.6 + i) * .18; });
  R.catPose(cat, 'sit', t);
  U.update(t); C.update(t, cam); F.tick?.(t); crt.render(scene, cam, t);
});
function MOjump(p, t) { const J = p.userData.J, k = Math.abs(Math.sin(t * 3.2)); p.position.y = k * .25; J.armL.rotation.set(-2.6, 0, .4); J.armR.rotation.set(-2.6, 0, -.4); J.shinL.rotation.x = J.shinR.rotation.x = (1 - k) * .6; }
</script>
