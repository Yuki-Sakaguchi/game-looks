<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>12-29 雨の台の下の家々 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#0e1220;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#e8ecff;opacity:.88;text-shadow:0 1px 0 #000}
</style>
<div id="cap">12-29 ─ 雨の台の下の家々 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="../game-looks-8/pack-city.js"></script>
<script src="../game-looks-9/pack-dark.js"></script>
<script src="pack-under2.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 雨の夜。頭の上は「上の都市」の台の裏が天井のようにおおい、そのふち（家なみの向こう）から、上でたまった雨水が何本もの たきになって落ちてくる。
// その下に、つぎはぎの家が 2 列 3 列と重なり、窓だけが黄色くともる。路地を、かさをさした人々が行きかう。台のふちの窓は白く光り、上の世界がそこにあることだけが分かる。
// 色の組は「雨の紺と青ねず・ぬれた鉄」＋窓の黄、差し色は主役の赤いかさ。主役は つぎの当たった赤いかさの少女（R.actor の toon）。カメラは路地の横から、ならんで歩く（横スクロールの向き）。D.mood の 'blackout' を使う
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), C = PACK_CITY(THREE, K, R), D = PACK_DARK(THREE, K, R), U = PACK_UNDER2(THREE, K, R), T = R.tex, X = C.tex, { hash } = K, PI = Math.PI;
R.cfg.actorBuild = 'toon';
const { scene, cam, renderer, onResize } = K.stage({ fov: 54, far: 900, aa: false, fitAspect: .9, maxFov: 80 });
const hero = R.actor({ sex: 'f', hairStyle: 'bob', hair: '#2a2228', bangs: 'straight', eyes: 'big', mouth: 'small', blush: true, cloth: 'coat', top: '#e8d8a8', top2: '#5a6a8a', lower: 'skirt', skirt: .6, skirtC: '#3a4a6a', shoes: 'boot', shoe: '#c8402e', neck: 'scarf', acc: '#4f8f88', back: 'bag', s: .92 }); scene.add(hero);
const HAZE = '#232a40', YEL = '#ffd070';
const mood = D.mood(scene, renderer, 'blackout', { follow: hero, hills: false, range: 26, level: .95, fog: [HAZE, 14, 110], hemi: ['#94a0c8', '#303244', 1.2], key: ['#b8c4f0', 1.1, [-.3, .8, .5]], fill: ['#6a6a90', .55] });
U.umbrella(hero, { c: '#d8402c', c2: '#b83020', patch: '#e8c040', s: 1.05 });

// ---- 家：路地の奥がわ（z = -5.6 から奥へ 3 列）。窓のあかりは地面に焼きこむ ----
const fixed = [], put = (o, x, z, ry = 0, y = 0) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; }, lights = [], gut = [];
const CS = ['#6a5a5a', '#4f6f78', '#8a6a4a', '#5a5a72', '#7a5a48', '#5a6a5a'];
for (let row = 0; row < 3; row++) for (let x = -70, i = 0; x < 90; i++) { const w = [4.6, 5.4, 4, 6, 4.8][(i + row) % 5], cx = x + w / 2, z = -5.6 - row * 7, fl = 1 + row + Math.floor(hash(i, row, 3) * 2), lit = .55;
  const s = C.shack({ w, d: 5, floors: fl, seed: i * 3 + row * 50, cs: CS, lit, shop: ['door', 'window', 'shutter', 'noren', 'door'][(i + row) % 5], awning: row === 0 && i % 2 === 0 ? 'tin' : false, laundry: (i + row) % 3 === 1, antenna: i % 3 === 0, tank: i % 4 === 1, stairs: row === 0 && i % 6 === 3 ? 'r' : false });
  put(s, cx, z - 2.5 + 2.5, 0, row * .4); if (row === 0) { lights.push({ x: cx, z: -2.4, r: 3.8, c: YEL, k: .7 }); if (i % 2) gut.push([cx + w / 2 - .3, (s.userData.h || fl * 3) - .2, z + 2.6]); }
  x += w + .2; }
const land = R.ground({ w: 140, d: 50, cell: 1, layers: [X.asphalt({ wet: 1, c: '#3a4252', wetC: '#6a80a8' }), X.plate({ c: '#4a5266', n: 2, rust: .5 }), X.conc({ c: '#5a6070' })], mix: (x, z) => [z < -2.6 ? 1 : 0, z > 2.5 ? 1 : 0], shade: mood.shade(lights) });
scene.add(land.mesh);
for (let i = 0; i < 14; i++) { const x = -40 + i * 7 + hash(i, 1) * 3; if (i % 3 === 0) put(C.drum({ c: CS[i % 6], mark: 'band' }), x, -2.7); else if (i % 3 === 1) put(C.trash({ kind: 'bin', c: '#4f6f78' }), x, -2.8); else put(R.crate({ s: .6, c: '#7a5a40' }), x, -2.8, i); }
const lamps = [-24, -4, 16, 36, 56].map((x, i) => put(C.streetLamp({ h: 4.2, light: i < 3, power: 12, range: 9, flicker: i === 3 }), x, -2.9, PI / 2));
for (const l of lamps) lights.push({ x: l.position.x, z: -1.6, r: 3.6, c: '#ffc070', k: .55 });
scene.add(R.merge(fixed));
scene.add(D.streaks(lights.filter((_, i) => i % 2 === 0).map(l => ({ x: l.x, z: l.z + 1.4, h: 3, c: l.c, w: 1, k: .45 })), {}));

// ---- 頭の上：上の都市の台の裏（天井のように手前までおおう）。家なみの向こうのふちから、雨水のたき ----
const UR = 300, UY = 34, RIM = -46; { const up = U.upper({ r: UR, y: UY, th: 26, towers: 0, glow: true, tint: .9, seed: 2, hang: 0, lamps: .9, dotSize: 2, underGlow: '#2a2c44', underTint: .9 }); up.position.set(0, 0, RIM + UR); scene.add(up); }
const FALLS = [[-46, 9], [-24, 6], [-4, 12], [18, 7], [40, 10], [64, 7]].map(([x, w], i) => { const f = U.cascade({ w, h: UY - 1, speed: 1.6 + i * .1, a: .85 }); f.position.set(x, UY - 1.4, RIM + UR - Math.sqrt(UR * UR - x * x) + 1); scene.add(f); const h = U.halo({ c: '#c8d8ff', r: w * 1.3, k: .18 }); h.position.set(x, UY - 3, f.position.z + 1); scene.add(h); return f; });
// 台のふちの向こう：雨にかすむ、別の上の都市の塔の群れ（遠くで白く光る）
{ const far = U.upper({ r: 160, y: 46, th: 22, towers: 16, tall: .8, glow: true, tint: .75, haze: '#5a6488', hazeK: .35, seed: 9, hang: 4, dotSize: 2 }); far.position.set(60, 0, -560); scene.add(far); const h = U.halo({ c: '#d8e0ff', r: 200, k: .1 }); h.position.set(60, 150, -620); scene.add(h); }
// 屋根の雨どいから落ちる細い水
const drips = gut.map(([x, y, z]) => { const f = U.cascade({ w: .35, h: y, speed: 2.2, a: .6 }); f.position.set(x, y, z); scene.add(f); return f; });
const rain = D.rain({ n: 900, box: [30, 14, 22], speed: 22, slant: [.12, .06], a: .5 }); scene.add(rain);

// ---- 人：かさの人々（行きかう）、のき下で雨やどりする 2 人、ねこ ----
const act = (o, x = 0, z = 0, ry = 0) => { const p = R.actor({ build: 'toon', ...o }); p.position.set(x, 0, z); p.rotation.y = ry; scene.add(p); return p; };
const UC = [['#2a4a7a', null], ['#4a6a3a', '#8a6a4a'], ['#e8e0cc', null], ['#5a3a6a', '#c8a040'], ['#3a3a44', null], ['#2f7a8a', '#d8402c']];
const walkers = UC.map(([c, patch], i) => { const p = act({ sex: i % 2 ? 'm' : 'f', hairStyle: ['long', 'short', 'bun', 'tufts', 'tail', 'bald'][i], hair: ['#2a2228', '#5a3a28', '#8a8a8a'][i % 3], cloth: ['coat', 'jacket', 'coat', 'tunic', 'coat', 'jacket'][i], sleeve: 'long', top: ['#5a5a6a', '#6a4a3a', '#3a4a5a', '#7a6a4a', '#4a5a4a', '#6a5a6a'][i], top2: '#d8ccb0', bottom: '#2a2a3a', lower: i % 2 ? 'pants' : 'skirt', skirt: .8, skirtC: '#3a3a4a', shoes: 'boot', back: i % 3 === 0 ? 'bag' : undefined, s: i === 4 ? .72 : 1 });
  U.umbrella(p, { c, patch, seed: i }); p.userData.dir = i % 2 ? 1 : -1; p.userData.v = .9 + hash(i, 1) * .5; p.userData.off = i * 13; p.userData.z = [1.2, -1, .4, -1.6, 1.8, -.3][i]; return p; });
const shelter = [act({ hairStyle: 'spiky', hair: '#3a2a20', mouth: 'open', blush: true, cloth: 'overall', top: '#c8a04a', top2: '#e8dcc0', lower: 'shorts', shoes: 'shoe', s: .7 }, 6.2, -2.7, .4), act({ sex: 'f', hairStyle: 'twin', hair: '#6a3a24', mouth: 'smile', blush: true, cloth: 'tunic', top: '#4f8f88', lower: 'skirt', skirt: .5, shoes: 'shoe', s: .68 }, 7.1, -2.8, -.5)];
const cat = R.cat({ c: '#e8a050', belly: '#f4ecd8' }); cat.position.set(-7.8, .02, -2.6); cat.rotation.y = .5; scene.add(cat);
const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
const SPEED = .95;
K.loop((dt, t) => {
  const x = -10 + (t * SPEED) % 40, z = .1;
  hero.position.set(x, 0, z); hero.rotation.y = PI / 2; R.walk(hero, t * SPEED * 4.8, .7);
  { const J = hero.userData.J; J.armR.rotation.set(-1.25, 0, .25); J.foreR.rotation.x = -1.05; J.head.rotation.set(-.15, .35 + Math.sin(t * .4) * .2, 0); }   // かさを持つ うで、ときどき台のほうを見上げる
  const tall = innerWidth < innerHeight;
  cam.position.set(x + (tall ? .2 : .9), tall ? 1.1 : 1.1, tall ? 5 : 6.2); cam.lookAt(x + (tall ? .2 : .9), tall ? 5 : 4.2, -6);   // 路地の横から。家なみと、その上の台のふちと たきまで
  walkers.forEach((p, i) => { const u = p.userData, span = 70, k = ((t * u.v * u.dir + u.off) % span + span) % span, wx = x - 35 + k; p.position.set(wx, 0, u.z); p.rotation.y = u.dir * PI / 2; R.walk(p, t * u.v * 4.6 + i, .7); const J = p.userData.J; J.armR.rotation.set(-1.25, 0, .25); J.foreR.rotation.x = -1.05; });
  shelter.forEach((p, i) => { R.idle(p, t + i * 3, Math.sin(t * .5 + i) * .4 + (i ? -.3 : .3)); if (i === 0) { p.userData.J.armL.rotation.set(-2.6 - Math.sin(t * 2) * .2, 0, .3); p.userData.J.head.rotation.x = -.4; } });
  R.catPose(cat, 'sit', t);
  U.update(t); D.tick(t, cam); C.update(t, cam); mood.tick?.(t, cam); crt.render(scene, cam, t);
});
</script>
