<title>12-38 高層ビルの中の小さな寺 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#1a1420;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#fff0dc;opacity:.9;text-shadow:0 1px 0 #000}
</style>
<div id="cap">12-38 ─ 高層ビルの中の小さな寺 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="../game-looks-8/pack-fantasy-town.js"></script>
<script src="../game-looks-8/pack-city.js"></script>
<script src="pack-neon2.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// ネオンの港町の夕方。三方を 50〜100 m の集合住宅にかこまれた、小さな寺の庭。赤い柱と金のかざりのお堂の軒から、うずまきの線香がいくつも下がり、けむりが上の細い空へのぼる。
// 色の組は「赤（柱）・みどりの瓦・夕方の あんず色の空と、ビルの上だけに当たる日」＋差し色の 金（かざりと線香の火）。見上げるとビルの壁と、ともりはじめた看板。
// 主役は線香の束を持って参る少女（R.actor の toon）。お堂へ歩く うしろ姿を、低い所から見上げるカメラが追う。参る人・はと・けむり・ちらつく看板が動く。
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), F = PACK_FTOWN(THREE, K, R), C = PACK_CITY(THREE, K, R), N = PACK_NEON2(THREE, K, R, C), T = R.tex, X = C.tex, { hash } = K, PI = Math.PI;
R.cfg.actorBuild = 'toon';
const RED = '#c8302a', GOLD = '#e8b040', JADE = '#3a8a6a';
const { scene, cam, renderer, onResize } = K.stage({ fov: 54, far: 900, aa: false, fitAspect: .9, maxFov: 84 });
scene.add(R.skyDome([[0, '#4a4a8a'], [.45, '#a86a8a'], [.8, '#f0a070'], [1, '#ffd8a0']], { r: 600 })); scene.fog = new THREE.Fog('#c8889a', 60, 380);
const { sun } = K.lights(scene, renderer, { sky: 0xe8b0b8, ground: 0x6a4a5a, amb: 1.45, sun: 0xffb070, power: 1.6, range: 40 }), SUN = new THREE.Vector3(.75, .32, -.3).normalize();

// ---- 庭：お堂の前の石だたみ。まわりの低いかべ ----
const fixed = [], put = (o, x, z, ry = 0, y = 0) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
const land = R.ground({ w: 120, d: 120, cell: 2, layers: [T.cobble({ kind: 'slab', c: '#a89890' }), X.asphalt({ wet: 0, c: '#5a5060' }), T.brickFloor({ c: '#a8705a' })], mix: (x, z) => [Math.abs(x) > 9 || z > 13 ? 1 : 0, Math.abs(x) < 1.4 && z > -2 && z < 12 ? 1 : 0] });
scene.add(land.mesh);
const hall = put(F.eastHall({ w: 9, d: 7, h: 3.8, tiers: 2, c: RED, roof: JADE, lit: true }), 0, -6);
// お堂の正面の金のかざり板（架空の字の額）と、赤いちょうちん
{ const s = N.sign({ n: 3, dir: 'h', style: 'box', bg: '#2a1a1a', c: GOLD, c2: GOLD, seed: 300, px: .045, flat: true }); s.position.set(0, 3.8, -6 + 3.6); fixed.push(s); }
for (const x of [-2.6, 2.6]) { const l = C.lantern({ kind: 'red', r: .4 }); l.position.set(x, 4.2, -2.2); fixed.push(l); }
// 庭の大きな香炉（青銅の鼎）。三本足と取っ手
const urn = new THREE.Group(); { const G = R.geo().smooth(1); G.loft(10, [[.25, .55, .55, 0, .7], [.5, .95, .95, .3, .9], [1.1, 1, 1, .6, 1], [1.35, .82, .82, .8, 1], [1.45, .9, .9, 1, 1.1]], { ur: 3, cap: 'bot' }); const bz = T.metal({ c: '#6a5a3a' }); urn.add(G.mesh(bz));
  const L = R.geo(); for (let k = 0; k < 3; k++) { const a = k / 3 * PI * 2; L.at(R.TR(Math.cos(a) * .6, 0, Math.sin(a) * .6, -a, 0, 0)).box(.16, .5, .16, 0, 0, 0, { taper: .7 }); } L.at(null); for (const s of [-1, 1]) L.box(.12, .45, .4, s * .95, 1.35, 0); urn.add(L.mesh(bz)); urn.position.set(0, 0, 1.5); scene.add(urn); }
const urnSmoke = C.steam({ r: .55, rise: 7, n: 12, c: '#f0e8f0', a: .5, speed: .22, wind: [.6, .1] }); urnSmoke.position.set(0, 1.4, 1.5); scene.add(urnSmoke);
// 軒からさがる うずまきの線香（お堂の前と横）。先は赤くともり、細いけむり
const coils = [], tips = [];
for (const [x, y, z, r] of [[-3.6, 4.1, -2.1, .42], [-1.8, 4.3, -2.3, .36], [1.8, 4.3, -2.3, .36], [3.6, 4.1, -2.1, .42], [-4.9, 4.0, -4.5, .38], [4.9, 4.0, -4.5, .38], [-2.6, 3.4, -3.2, .5], [2.6, 3.4, -3.2, .5], [0, 3.3, -3.4, .55], [-1.2, 3.2, -4.4, .45], [1.2, 3.2, -4.4, .45]]) {
  const c = N.coil({ r: r * 1.45, turns: 6, c: '#e8b060', th: .05 }); c.position.set(x, y, z); scene.add(c); coils.push(c);
  const sm = C.steam({ r: .14, rise: 2.4, n: 5, c: '#f4eef4', a: .38, speed: .25, wind: [.2, 0] }); sm.position.set(x, y - r * 2.25, z); scene.add(sm);
  const tip = C.halo({ c: '#ff8040', r: .12, k: .9 }); tip.position.set(x, y - r * 2.3, z); scene.add(tip); }
// 庭のすみ：石の灯ろう、植木ばち、線香立て、ベンチ
for (const [x, z] of [[-5.5, 2.5], [5.5, 2.5]]) put(F.stoneLantern({ h: 1.6, lit: true }), x, z);
for (const [x, z] of [[-7.5, -1], [-7.5, 3], [7.5, -1], [7.5, 3], [-6, 8]]) put(R.tree({ kind: 'bush', h: 1.3, c: '#4a7a4a', seed: x * z }), x, z);
put(R.bench({ c: '#6a3a2a' }), -6.8, 5.6, PI / 2); put(R.bench({ c: '#6a3a2a' }), 6.8, 5.6, -PI / 2);
// 寺の門（主役のうしろ。少しだけ画面に入る）
put(F.torii({ w: 4, h: 4.8, c: RED }), 0, 12.5);
// ---- 三方の集合住宅：上だけに夕日が当たる。下の階の看板が ともりはじめる ----
const WALLC = ['#a8909a', '#b0a090', '#9a9aa8', '#a88a80', '#90a0a0', '#b8a0a0'];
const ring = [[-16, -26, 1, 0], [-4, -27, 1, 0], [8, -26, 1, 0], [20, -25, 1, 0], [-17, -10, 0, PI / 2], [-18, 4, 0, PI / 2], [-17, 18, 0, PI / 2], [17, -10, 0, -PI / 2], [18, 4, 0, -PI / 2], [17, 18, 0, -PI / 2]];
ring.forEach(([x, z, , ry], i) => { const h = 50 + hash(i, 1) * 50; put(N.tower({ w: 12 + hash(i, 2) * 4, d: 12, h, c: WALLC[i % 6], seed: i + 7, lit: .22, shops: true, awning: ['#3a4a8a', '#a8443a'][i % 2] }), x, z, ry);
  put(N.tower({ w: 12, d: 12, h: h + 20 + hash(i, 3) * 30, c: WALLC[(i + 2) % 6], seed: i + 40, lit: .15 }), x * 1.5 + (ry ? 0 : (hash(i, 4) - .5) * 8), z < -20 ? z - 16 : z, ry); });
// 看板：ビルの正面の 3〜20 m に、通りのほうへ
for (const [x, z, ry, k] of [[-22, -20, 0, 0], [-10, -21, 0, 1], [2, -20, 0, 2], [14, -19, 0, 3], [-11, -16, PI / 2, 4], [-12, -2, PI / 2, 5], [-11, 12, PI / 2, 6], [11, -4, -PI / 2, 7], [12, 10, -PI / 2, 8], [11, -16, -PI / 2, 9]]) {
  const g = N.signs({ x0: 0, x1: 12, z: 0, y0: 3.8, y1: 20, n: 7, seed: k + 80, box: .45, horiz: .2, reach: 1.4, px: .07, flat: .3, flick: .12 }); g.position.set(x, 0, z); g.rotation.y = ry; if (ry > 0) g.position.z += 0; fixed.push(g); }
scene.add(R.merge(fixed));
scene.add(C.backdrop({ r: 420, h: 160, y: -6, c: '#6a4a7a', haze: '#e8a080', rep: 4 }));
// ---- 人・はと ----
const act = (o, x = 0, z = 0, ry = 0) => { const p = R.actor(o); p.position.set(x, 0, z); p.rotation.y = ry; scene.add(p); return p; };
const hero = act({ build: 'toon', sex: 'f', hairStyle: 'long', hair: '#1e1620', eyes: 'big', mouth: 'small', blush: true, cloth: 'tunic', sleeve: 'long', top: '#f0e8d8', top2: JADE, lower: 'skirt', skirt: .85, skirtC: '#3a4a6a', shoes: 'shoe', shoe: '#3a2a2a', back: 'bag', acc: GOLD });
const stick = (p, n = 5) => { const g = new THREE.Group(), m = R.mat('#c87a3a'); for (let k = 0; k < n; k++) { const s = new THREE.Mesh(new THREE.CylinderGeometry(.008, .008, .45, 3), m); s.position.set((k - n / 2) * .012, .22, 0); s.rotation.z = (k - n / 2) * .04; g.add(s); } const tp = C.halo({ c: '#ff7040', r: .08, k: .9 }); tp.position.y = .45; g.add(tp); g.position.set(0, -.12, .04); p.userData.J.foreR.add(g); return g; };
stick(hero);
const pray = [[-1.6, -.6, 0], [1.4, -.4, 0], [-.4, -1.1, 0], [2.8, .6, -.4], [-3, .9, .3]].map(([x, z, ry], k) => { const p = act(N.folk(k + 200, { eyes: 'closed' }), x, z, PI + ry); stick(p, 3); return p; });
const walkers = [act(N.folk(220), 0, 0), act(N.folk(221, { hairStyle: 'bald', beard: 'beard' }), 0, 0)];
const birds = [...Array(7)].map((_, k) => { const b = R.bird({ c: '#8a8c9c', belly: '#b8b8c8', neck: true, s: 1.5 }); scene.add(b); return b; });
const warm = new THREE.PointLight('#ffb070', 10, 10, 1.3); warm.position.set(0, 3, -1.5); scene.add(warm);

const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
const SPEED = .55, Z0 = 9, LEN = 6.2, v = new THREE.Vector3();
K.loop((dt, t) => {
  const u = (t * SPEED) % (LEN + 2.5), walking = u < LEN, z = Z0 - Math.min(u, LEN), x = 1.5, tall = innerWidth < innerHeight;
  hero.position.set(x, 0, z); hero.rotation.y = PI; if (walking) R.walk(hero, t * 5, .8); else R.idle(hero, t, 0);
  const J = hero.userData.J; J.armR.rotation.x = -1.1; J.foreR.rotation.x = -.9; J.armR.rotation.z = .3; if (!walking) { const b = Math.sin((u - LEN) * 2.4) * .25 + .2; J.torso.rotation.x = b; }
  // 低い所から見上げる（主役のうしろ）。ビルの壁と、上の細い空が入る
  cam.position.set(x + 1.1, tall ? 1.0 : .95, z + (tall ? 4.2 : 4.0)); cam.lookAt(x - 1.3, tall ? 5.4 : 4.0, z - 9);
  crt.u.bright.value = Math.min(1, u / .4, Math.abs(LEN + 2.5 - u) / .4);
  sun.position.set(SUN.x * 80, SUN.y * 80, SUN.z * 80); sun.target.position.set(0, 0, -4);
  pray.forEach((p, k) => { R.idle(p, t + k, 0); const b = Math.max(0, Math.sin(t * 1.3 + k * 1.7)) * .5; p.userData.J.torso.rotation.x = b; p.userData.J.armR.rotation.x = p.userData.J.armL.rotation.x = -1.2; p.userData.J.foreR.rotation.x = p.userData.J.foreL.rotation.x = -1; p.userData.J.armR.rotation.z = .35; p.userData.J.armL.rotation.z = -.35; });
  walkers.forEach((p, k) => { const a = t * .25 + k * PI; p.position.set(Math.cos(a) * 4.6, 0, 1.5 + Math.sin(a) * 2.6); p.rotation.y = -a + (k ? PI : 0); R.walk(p, t * 4.5 + k, .7); });
  birds.forEach((b, k) => { if (k < 4) { const a = t * .4 + k * 1.6, r = 9 + k * 1.5; b.position.set(Math.cos(a) * r, 13 + k * 1.4 + Math.sin(t + k), -6 + Math.sin(a) * r * .7); b.rotation.y = -a; R.birdPose(b, 'fly', t * .7 + k); } else { b.position.set(-3 + (k - 4) * 1.6 + Math.sin(t * .3 + k) * .4, 0, 4.5 + (k % 2)); b.rotation.y = t * .3 + k; R.birdPose(b, 'peck', t + k); } });
  coils.forEach((c, k) => c.rotation.y = t * .15 + k);
  F.tick(t); N.tick(t); C.update(t, cam); crt.render(scene, cam, t);
});
</script>
