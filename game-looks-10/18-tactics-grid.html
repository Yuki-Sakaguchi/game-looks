    for (const u of U) if (!u.dead && u.hp > 0) { const s = H.project(headP(u)); if (s.on && s.y > top + 30) { const x = Math.round(s.x) - 7, y = Math.round(s.y) - 5; H.rect(x - 1, y - 1, 16, 4, '#080814'); H.rect(x, y, 14, 2, '#40202c'); H.rect(x, y, Math.max(1, Math.round(14 * u.hp / u.hpMax)), 2, u.team ? '#ff6a5a' : '#6ad0ff'); } }

    const cu = S.sel || (C.q.length ? null : unitAt(C.i, C.j)), uw = tall ? 112 : 118; if (cu && !S.zoomOn) { const r = H.place('左下', uw, 40); unitWin(cu, r.x, r.y, r.w); }
    if (!S.zoomOn && !(S.side === 1 && !S.fore)) { const ci = Math.round(C.fi), cj = Math.round(C.fj), r = H.place('右下', tall ? 62 : 70, 27); H.win(r.x, r.y, r.w, r.h, WINN); H.text(kindName(ci, cj), r.x + 6, r.y + 3, {}); H.text('たかさ', r.x + 6, r.y + 15, { size: 8, c: '#c8d8ff' }); H.num(String(Math.max(0, hgt(ci, cj))), r.x + r.w - 7, r.y + 16, { align: 'r', c: B.PAL.gold }); }
    // こうげきの前の予想の窓
    if (S.fore) { const f = S.fore, fw = 122, fh = f.list ? 22 + f.list.length * 11 : f.note ? 53 : 42, r = tall ? H.place('左下', fw, fh, 0, -44) : H.place('下', fw, fh, 26, 0); H.win(r.x, r.y, r.w, r.h, { ...(f.a.team ? WINR : WINB), title: 'よそう' });
      if (f.list) { H.text(f.spell, r.x + 7, r.y + 6, { c: '#ffb060' }); H.text('あたえる', r.x + r.w - 7, r.y + 7, { size: 8, align: 'r', c: '#c8d8ff' }); f.list.forEach(([u, n], k) => { H.text(u.name, r.x + 9, r.y + 19 + k * 11, { size: 8 }); H.num(String(n), r.x + r.w - 8, r.y + 20 + k * 11, { align: 'r', c: n >= u.hp ? '#ff9a80' : '#ffffff' }); }); }
      else { const w1 = H.text(f.a.name, r.x + 7, r.y + 6, { size: 8, c: B.PAL.gold }); H.icon('tri', r.x + 10 + w1, r.y + 8, { c: '#ffffff' }); H.text(f.d.name, r.x + 18 + w1, r.y + 6, { size: 8 });
        H.text('あたる', r.x + 7, r.y + 18, {}); H.num(f.hit + '%', r.x + 66, r.y + 20, { align: 'r' }); H.text('あたえる', r.x + 7, r.y + 30, {}); H.num(String(f.dmg), r.x + 66, r.y + 32, { align: 'r', c: '#ffe060' });
        const bx = r.x + 72, bw = r.w - 79, v = f.d.hp / f.d.hpMax, v1 = Math.max(0, f.d.hp - f.dmg) / f.d.hpMax; H.num('HP', bx, r.y + 20, { small: true, c: '#9ad0ff' }); H.num(String(Math.round(f.d.hp)), bx + bw, r.y + 19, { align: 'r', small: true }); H.bar(bx, r.y + 27, bw, 6, blink ? v : v1, { c: f.d.team ? '#ff7a5a' : '#5ce070', v2: v, c2: '#ffffff' }); H.icon('tri', bx + 2, r.y + 36, { c: '#ffe060' }); H.num(String(Math.max(0, f.d.hp - f.dmg)), bx + bw, r.y + 36, { align: 'r', c: '#ffe060' });
        if (f.note) H.text(f.note, r.x + r.w / 2, r.y + 42, { size: 8, align: 'c', c: B.PAL.gold }); } }
    if (S.cmd) { const ms = H.menuSize(S.cmd.items), s = H.project(headP(oz)), r = { x: cl(Math.round(s.x) + 12, 6, W - ms.w - 6), y: cl(Math.round(s.y) - 20, top + 30, HH - ms.h - 50) }; H.win(r.x, r.y, ms.w, ms.h, WINB); H.menu(r.x + 4, r.y + 6, S.cmd.items, S.cmd.sel, { t }); }
    if (S.zoomOn && S.label) H.msg(S.label, '上', { dy: top + 32, c: '#8e4a1a', c2: '#3a1808', tc: '#ffe0a0' });
    if (S.banner) { const k = (now - S.banner.t0) / S.banner.len; if (k < 1) H.banner(S.side ? 'てきの ばん' : 'みかたの ばん', k, { sub: 'ターン ' + S.turn, c: S.side ? '#8e2a34' : '#22408e', y: Math.round(HH * .46) }); else S.banner = null; } }
  H.end(dt);
}

// ---- カメラ：ななめ上からの盤の絵。こうげきでは寄りの絵に切りかわる ----
const cp = V(), ct = V(), p2 = V(), t2 = V(), foc = V(cx(2.5), 0, cz(4.5)), fw = V();
function moveCam(t, dt, snap) {
  const tall = innerWidth < innerHeight, yaw = .36, pitch = .72;
  S.zoom += ((S.zoomOn ? 1 : 0) - S.zoom) * Math.min(1, dt * 4);
  if (S.focusU) fw.copy(S.focusU.o.position); else fw.set(cx(C.fi), topY(Math.round(C.fi), Math.round(C.fj)), cz(C.fj)); if (S.sel && !S.focusU) { fw.x = (fw.x + S.sel.o.position.x) / 2; fw.z = (fw.z + S.sel.o.position.z) / 2; }
  if (S.zoomOn) fw.set(cx(6.6), .3, cz(5)); fw.x = cl(fw.x, tall ? -5 : -2.8, tall ? 5 : 3.2); fw.z = cl(fw.z, -2.2, 2.4); fw.y = Math.max(0, fw.y) * .6;
  foc.lerp(fw, snap ? 1 : Math.min(1, dt * 2.6));
  const D = (tall ? 8.2 : 9.3) * (1 - S.zoom * .22); cp.set(foc.x + Math.sin(yaw) * Math.cos(pitch) * D, foc.y + Math.sin(pitch) * D, foc.z + Math.cos(yaw) * Math.cos(pitch) * D); ct.copy(foc).setY(foc.y + .5);
  if (S.battle) { const b = S.battle, A = b.a.o.position, Dp = b.d.o.position, dx = Dp.x - A.x, dz = Dp.z - A.z, L = Math.hypot(dx, dz) || 1, ux = dx / L, uz = dz / L; let nx = -uz, nz = ux; if (nz < 0) { nx = -nx; nz = -nz; } const my = (A.y + Dp.y) / 2, mx = (A.x + Dp.x) / 2, mz = (A.z + Dp.z) / 2, sway = Math.sin(t * .5) * .25;
    if (b.ranged) { const sd = tall ? .9 : 1.7; cp.set(A.x - ux * 2.5 + nx * sd + sway * .4, A.y + 1.95, A.z - uz * 2.5 + nz * sd); ct.set(lerp(A.x, Dp.x, .5), lerp(A.y, Dp.y, .5) + .75, lerp(A.z, Dp.z, .5)); }
    else { const d = (tall ? 5.4 : 3.6) + L * .5; cp.set(mx + nx * d + ux * sway, my + 1.3, mz + nz * d + uz * sway); ct.set(mx, my + .78, mz); } }
  shake = Math.max(0, shake - dt * 1.8); cp.x += Math.sin(t * 71) * shake * .06; cp.y += Math.sin(t * 93) * shake * .06; cam.position.copy(cp); cam.lookAt(ct);
}

function step(dt, t, snap) {
  now += dt; if (now >= LOOP) { reset(); now = 0; prev = -1; snap = true; }
  for (const [tm, fn] of EV) if (tm > prev && tm <= now) fn(tm); prev = now;
  if (cut) { cut.t += dt; if (cut.fn && cut.t >= .12) { cut.fn(); cut.fn = null; snap = true; foc.copy(fw); } cutK = cut.t < .12 ? 1 - cut.t / .12 : Math.min(1, (cut.t - .12) / .16); if (cut.t > .3) { cut = null; cutK = 1; } }
  moveUnits(t, dt); moveCam(t, dt, snap); F.update(dt); drawHud(t, dt);
}
const T0 = +(new URLSearchParams(location.search).get('t') || 0);
reset(); for (let s = 0; s < T0; s += 1 / 30) step(1 / 30, s, true);
K.loop((dt, t) => {
  step(dt, t + T0, now < .05);
  FT.tick(t); R.flip(wm, WF, t, 4);
  if (flash.userData.t !== undefined) { flash.userData.t += dt; flash.intensity = Math.max(0, 1 - flash.userData.t / .3) * 16; }
  crt.u.bright.value = Math.min(1, now / .4, (LOOP - now) / .5) * cutK;
  crt.render(scene, cam, t);
});
