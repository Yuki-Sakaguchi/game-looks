  // 相手：歩く → うでを ふり下ろす → 蒸気でひるむ（とびらがひらく）→ おこる → ふたが落ちて ひざをつく → しんの光が消える
  const bwalk = Math.hypot(bx2 - bx, bz2 - bz) > .003 ? 1 : 0, slam = seg(tt, 4.2, 5.4) - seg(tt, 6.6, 7.6) + seg(tt, 24.6, 25.8) * (tt < T_DROP ? 1 : 0), hit = seg(tt, T_SLAM - .25, T_SLAM) * (1 - seg(tt, 6.6, 7.6));
  const steam = tt > T_STEAM && tt < 15.2, rec = Math.max(0, 1 - hitT / .7), stag = Math.max(seg(tt, T_STEAM + .3, 11.4) * (1 - seg(tt, 18, 19)) * .6 + rec * .6, seg(tt, T_DROP, T_DROP + .2) * (1 - seg(tt, 28.4, 29.4)));
  const open = seg(tt, 12.6, 13.6) * (1 - seg(tt, 17.6, 18.2)) + seg(tt, T_DROP + .4, 28.6), kneel = seg(tt, T_DROP, 28.6), rage = seg(tt, 18.4, 19.2) * (1 - seg(tt, T_DROP, 28)), dead = seg(tt, LAST + .2, 32.2), wake = seg(tt, 36.4, 36.7);
  bpos.set(bx, 0, bz); boss.position.copy(bpos); boss.rotation.y = Math.atan2(hx - bx, hz - bz) + Math.sin(t * 17) * stag * .04;
  BM.pose(boss, { t, ph: t * (rage ? 5 : 3.2), walk: bwalk, slam, hit, stagger: stag, open, kneel, rage, core: open * (1 - dead * .9) * (.9 + Math.sin(t * 6) * .2) + rec * .6, eye: (1 - dead) * (.75 + Math.sin(t * 2.3) * .25) + wake * (Math.sin(t * 30) > 0 ? 1 : .2) });
  boss.updateMatrixWorld(true); BJ.body.localToWorld(corePos.set(0, 1.5, 1.6)); BJ.head.localToWorld(stack.set(-.75, 1.9, -.4));
  coreL.position.copy(corePos); coreL.intensity = open * (1 - dead) * 9 + rec * 14;
  // えんとつの けむり、蒸気、弁
  if (Math.floor(t * (rage ? 16 : 6)) !== Math.floor((t - dt) * (rage ? 16 : 6)) && dead < .9) puff(stack, tmp2.set((hash(t, 1) - .5) * .5, 1.6 + rage * 1.5, (hash(t, 2) - .5) * .5), { c: rage ? '#5a4a4a' : '#8a807c', s: .9 + rage * .5, life: 1.5 });
  if (steam && Math.floor(t * 24) !== Math.floor((t - dt) * 24)) puff(tmp.set(...NOZ), tmp2.set((hash(t, 3) - .5) * 1.4, .6 + hash(t, 4) * 1.4, 5.5 + hash(t, 5) * 2), { s: 1.5, life: 1.1 });
  wheel.rotation.z = -seg(tt, 8.9, 10.6) * 7;
  // 予告の輪（うでが落ちる所）
  const w1 = tt > 4.3 && tt < T_SLAM, w2 = tt > 24.7 && tt < T_DROP; warn.visible = w1 || w2; if (warn.visible) { const [wx, wz] = w1 ? [-1.2, 1.3] : [LEVER[0] + .4, LEVER[1] - .9]; warn.position.set(wx, .05, wz); warn.children.forEach(m => m.material.opacity = m.userData.a * (Math.sin(tt * 24) > -.2 ? 1 : .4)); }
  // つり下げた ふた：レバーで落ちて、相手の頭に当たり、わきへ ころがる
  const fall = cl((tt - T_PULL - .3) / (T_DROP - T_PULL - .3)), off = seg(tt, T_DROP + .1, 28.8); lid.position.set(HOIST[0] + off * 2.6, 6 - fall * fall * .9 - off * 5.1 + Math.sin(off * PI) * .8, HOIST[1] - off * 1.6); lid.rotation.z = -off * 1.1; lid.userData.ch.visible = tt < T_PULL + .3;
  lever.userData.arm.rotation.z = -.5 + seg(tt, T_PULL - .1, T_PULL + .3) * 1;
  // 主役：かまえて うつ／よける／レバーへ走る／引く
  const moving = Math.hypot(hx2 - hx, hz2 - hz) > .004, aim = Math.max(cl((tt - .3) / .4) * cl((4.9 - tt) / .3), cl((tt - 12.8) / .5) * cl((19.6 - tt) / .4), cl((tt - 29.4) / .5) * cl((32 - tt) / .5)), dodge = tt > 4.9 && tt < 5.9, pull = seg(tt, 26.2, 26.7) - seg(tt, 27.3, 28);
  hero.position.set(hx, 0, hz); const toBoss = Math.atan2(corePos.x - hx, corePos.z - hz), runDir = Math.atan2(hx2 - hx, hz2 - hz);
  hero.rotation.y = pull > 0 ? toBoss + (-PI / 2 - toBoss) * pull : moving && !dodge && tt > 20 ? runDir : toBoss;
  if (moving) MO.play(hero, tt > 20 ? 'run' : 'walk', dodge ? -t * 1.6 : t, { speed: tt > 20 ? 1.2 : .9 }); else MO.play(hero, 'stand', t);
  const kick = Math.max(0, 1 - flashT / .18);
  if (aim > 0) { HJ.armR.rotation.set(-1.5 * aim - kick * .45, 0, .1 * aim); HJ.foreR.rotation.x = -.14; HJ.armL.rotation.set(-1.25 * aim - kick * .3, 0, -.55 * aim); HJ.foreL.rotation.x = -.5 * aim; HJ.torso.rotation.y = -.3 * aim; HJ.torso.rotation.x = -.12 * aim - kick * .1; HJ.head.rotation.y = .25 * aim; HJ.head.rotation.x = -.2 * aim; if (!moving) { HJ.legL.rotation.x = -.2 * aim; HJ.legR.rotation.x = .22 * aim; } }
  else { HJ.armR.rotation.set(-.5, 0, .1); HJ.foreR.rotation.x = -.9; HJ.armL.rotation.set(-.7, 0, -.4); HJ.foreL.rotation.x = -.8; }
  if (pull > 0) { HJ.armL.rotation.set(-1.4 * pull, 0, .2); HJ.foreL.rotation.x = -.3; HJ.torso.rotation.x = .2 * pull; }
  if (tt > 33) { HJ.head.rotation.y = -seg(tt, 34, 35) * .8; HJ.head.rotation.x = -seg(tt, 34, 35) * .4; }
  hero.updateMatrixWorld(true); rifle.getWorldPosition(muzzle); tmp.set(0, rifle.userData.tip || .8, 0); rifle.localToWorld(tmp); muzzle.copy(tmp);
  aimAt.copy(corePos); if (tt < 5) aimAt.y += .3;
  heroL.position.set(hx, 1.7, hz + .6);
  // 仲間：足場を走る → 弁を回す → 手をふって知らせる → よろこぶ
  pal.position.set(px, CY, pz); const prun = Math.abs(px2 - px) > .003, turn = tt > 8.8 && tt < 10.8;
  pal.rotation.y = prun ? -PI / 2 : turn ? PI : tt > 33 ? .4 : .5;
  if (prun) MO.play(pal, 'run', t); else if (turn) { MO.play(pal, 'stand', t); const s = Math.sin(t * 7); PJ.armL.rotation.set(-1.5 + s * .4, 0, .2); PJ.armR.rotation.set(-1.5 - s * .4, 0, -.2); PJ.foreL.rotation.x = PJ.foreR.rotation.x = -.3; PJ.torso.rotation.z = s * .12; }
  else if (tt > 32.4) MO.play(pal, 'cheer', t); else if (tt > 10.8 && tt < 13 || tt > 19.5 && tt < 24) MO.play(pal, 'wave', t); else { MO.play(pal, 'stand', t); PJ.head.rotation.x = .3; }
  flashT += dt; hitT += dt; flash.intensity = Math.max(0, 1 - flashT / .14) * 30; fireL.intensity = 20 + Math.sin(t * 9) * 3 + Math.sin(t * 23) * 2;
}

// ---- 画面の表示：かまえたときだけ（心ぱくの線と、たまの数）。仲間の声は 小さな 1 行 ----
const ST_C = ['#5ce070', '#ffd040', '#ff5a4a'], ST_N = ['よし', 'ちゅうい', 'きけん'];
function ecg(x, y, w, h, st, t) { const c = ST_C[st], per = [30, 22, 15][st], n = w - 6, head = (t * [26, 34, 44][st]) % n; H.rect(x, y, w, h, '#140e0c', .9); H.rect(x, y, w, 1, '#6a5a48', 1); H.rect(x, y + h - 1, w, 1, '#2c221c', 1); H.rect(x, y, 1, h, '#6a5a48', 1); H.rect(x + w - 1, y, 1, h, '#2c221c', 1);
  let py = null; for (let i = 0; i < n; i++) { const ph = i % per, v = ph === 3 ? 2 : ph === 4 ? -3 : ph === 5 ? 7 : ph === 6 ? 3 : ph === 7 ? -2 : ph === 11 ? 1 : ph === 12 ? 2 : ph === 13 ? 1 : 0, yy = y + Math.round(h * .62) - Math.round(v * (h - 8) / 10), a = 1 - ((head - i + n) % n) / n; if (a > .12) { const y0 = py === null ? yy : Math.min(py, yy), y1 = py === null ? yy : Math.max(py, yy); H.rect(x + 3 + i, y0, 1, y1 - y0 + 1, a > .9 ? '#ffffff' : c, cl(a * 1.2)); } py = yy; } }
function drawHud(tt, t, dt) {
  H.begin(); const tall = H.tall, st = tt > T_SLAM - .3 && tt < 20 ? 1 : 0, aim = Math.max(cl((tt - .4) / .3) * cl((4.9 - tt) / .3), cl((tt - 12.9) / .3) * cl((19.5 - tt) / .3), cl((tt - 29.5) / .3) * cl((31.9 - tt) / .3)), ammo = 8 - ALL.filter(s => tt >= s).length;
  if (aim > 0 && Math.sin(aim * 40) > -.5) { const a = H.place('左下', 66, 30, 2, -2); ecg(a.x, a.y + 10, 66, 20, st, t); H.text(ST_N[st], a.x + 1, a.y - 2, { size: 10, c: ST_C[st] });
    const b = H.place('右下', 70, 28, -2, -2); H.rect(b.x, b.y + 10, 70, 18, '#18100c', .85); H.rect(b.x, b.y + 10, 70, 1, '#806a50', 1); H.rect(b.x, b.y + 27, 70, 1, '#3a2c20', 1); H.text('ながじゅう', b.x + 1, b.y - 2, { size: 10, c: '#f0d8a0' }); for (let i = 0; i < 8; i++) H.icon('bullet', b.x + 4 + i * 6, b.y + 16, { c: i < ammo ? '#ffd870' : '#4a3c34' }); H.num(String(ammo), b.x + 66, b.y + 16, { align: 'r', c: ammo < 3 ? B.PAL.warn : '#ffffff' }); }
  const say = tt > 7.2 && tt < 9.6 ? 'ロク「べんを まわす！」' : tt > 10.4 && tt < 12.6 ? 'ロク「いまだ、しんを ねらえ！」' : tt > 20.4 && tt < 23.6 ? 'ロク「レバーへ！ ふたを おとせ！」' : tt > 1 && tt < 4 ? 'てつの からだに はじかれる…' : '';

  H.end(dt);
}

reset();
K.loop((dt, t) => {
  const tt = (t + T0) % LOOP; if (tt < prev) { reset(); prev = prev > 1e8 ? T0 - .001 : -1; }
  moveAll(tt, t, dt);
  for (const [tm, fn] of EV) if (tm > prev && tm <= tt) fn(tm);
  prev = tt;
  // カメラは置きっぱなし。時刻で ぱっと切りかえるだけ
  let c = CAMS[0][1]; for (const q of CAMS) if (tt >= q[0]) c = q[1]; const tall = innerWidth < innerHeight; cam.position.set(...c[tall ? 2 : 0]); cam.lookAt(...c[tall ? 3 : 1]);
  crt.u.bright.value = 1.08 * Math.min(1, tt / .6, (LOOP - tt - .1) / .8);
  tickPuffs(dt); D.tick(t, cam); F.update(dt); drawHud(tt, t, dt); crt.render(scene, cam, t);
});
