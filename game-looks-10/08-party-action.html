    if (ready2 && Math.floor(t * 6) % 2 === 0) H.rect(r.x + 3, r.y + 5 + 3 * 12, r.w - 6, 12, '#ffe060', .35);
    H.menu(r.x + 4, r.y + 7, CMD, sel, { t, dim: ready2 ? [] : [3] });
    if (tt >= 8.9 && tt < 10.4) { const m2 = H.menuSize(SPELL), r2 = H.place('左下', m2.w, m2.h, r.w - 6, tall ? -22 : -20); H.win(r2.x, r2.y, r2.w, r2.h, { c: '#2a5ab0', c2: '#10204a', edge: '#f4fff0' }); H.menu(r2.x + 3, r2.y + 6, SPELL, 0, { t, cursor: tt < 9.4 || Math.floor(t * 10) % 2 === 0 }); }
    // 合図：ひるんだ敵に「いまだ！」
    if (tt >= 17.8 && tt < 19.5) { const k = cl((tt - 17.8) / .2), w = 62, r3 = { x: r.x, y: r.y - 21 - Math.round((1 - k) * 4) }; H.win(r3.x, r3.y, w, 17, { c: '#e0a020', c2: '#a04a10', edge: '#fffbe0' }); H.icon('star', r3.x + 5, r3.y + 5, { c: '#fffbe0' }); if (Math.floor(t * 7) % 3) H.text('いまだ！', r3.x + 16, r3.y + 4, { c: '#ffffff', outline: '#5a2800' });
      const s = H.project(eAt(big, 2.5)); H.text('いまだ！', s.x, s.y - 14 + Math.round(Math.sin(t * 10) * 2), { align: 'c', scale: 2, c: '#ffe860', outline: '#5a2800' }); } }
  // 右下：主役の顔と体力の輪・MP のバー。その上に仲間 2 人
  { const r = H.place('右下', 54, 54, 0, tall ? -4 : -1), cx = r.x + 27, cy = r.y + 27, low = hero.hp / hero.hpMax < .3;
    H.ring(cx, cy, 26, hero.hpShow / hero.hpMax, { th: 4, c: '#e04848', back: '#2a2c40' }); H.ring(cx, cy, 26, hero.hp / hero.hpMax, { th: 4, c: low ? '#ffb040' : B.PAL.hp, back: 'rgba(0,0,0,0)' });
    H.face(cx - 14, cy - 14, { ...hero.face, scale: 2, hurt: hero.hurtT < .5, bg: '#2a7ac0' });
    H.bar(cx - 27 - 44, cy + 18, 42, 6, hero.mp / 80, { c: B.PAL.mp, ticks: 4 }); H.num('MP', cx - 27 - 52, cy + 19, { small: true, c: '#9ad0ff', outline: '#080814' }); H.num('HP', cx - 27 - 30, cy + 9, { small: true, c: '#a8f0b0', outline: '#080814' }); H.num(String(Math.round(hero.hp)), cx - 30, cy + 7, { align: 'r', outline: '#080814' });
    [gantz, popo].forEach((p, i) => { const ax = cx + 14, ay = cy - 42 - i * 27; H.ring(ax, ay, 12, p.hpShow / p.hpMax, { th: 3, c: B.PAL.hp }); H.face(ax - 7, ay - 7, { ...p.face, hurt: p.hurtT < .5, bg: i ? '#8a3a5a' : '#3a5a9a' }); H.text(p.name, ax - 15, ay - 3, { align: 'r', size: 8, outline: '#080814' }); }); }
  // 右上：ほしくず（ひろった星の数）。つづけて当てた数
  { const r = H.place('右上', 58, 15, 0, tall ? 38 : 12); H.win(r.x, r.y, r.w, r.h, WIN); H.icon('star', r.x + 5, r.y + 4, { c: '#ffe060' }); H.num(String(Math.round(dustShow)), r.x + r.w - 6, r.y + 4, { align: 'r', c: dust - dustShow > 1 ? '#ffe890' : '#ffffff' });
    comboT += dt; if (comboT > 1.6) combo = 0; if (combo > 1) { const pop = Math.max(0, 1 - comboT * 5); H.num(String(combo), r.x + r.w - 30, r.y + 24 - Math.round(pop * 3), { align: 'r', scale: 2, c: GOLD, outline: '#080814' }); H.text('れんげき', r.x + r.w - 27, r.y + 28, { size: 8, c: '#ffffff', outline: '#080814' }); } }
  if (banner) H.banner(banner.text, (tt - banner.t0) / banner.len, { sub: banner.sub, c: banner.c, y: tall ? H.H * .26 : 52 });
  H.end(dt);
}

// ---- カメラ：主役のななめうしろ。動きに合わせて回りこみ、寄り引きする。[時刻, 向き, きょり, 高さ, 見る高さ, 大きな影へ寄せる量] ----
const CK = [[0, .2, 6.6, 2.9, 1, 0], [2.4, .2, 6.6, 2.9, 1, 0], [3.2, .45, 5.2, 2.3, 1, 0], [4.5, .3, 5.2, 2.3, 1, 0], [5.4, -.35, 5.4, 1.9, 1.5, 0], [6.2, -.55, 5.8, 1.5, 2.3, 0], [7, -.45, 5.8, 1.6, 2, 0], [7.6, -.2, 5.6, 2.5, 1, 0], [9.2, -.85, 6.2, 2.5, 1.1, 0], [10.6, -.8, 6.4, 2.6, 1.1, 0], [11.6, .1, 6.2, 3.3, .8, 0], [13.4, .45, 6.2, 4.2, .6, 0], [14.3, .5, 5.6, 3.4, .7, 0], [15.3, 1.5, 5.6, 3.2, .8, 0], [16.2, .75, 6.6, 2.3, 1.5, .35], [17.9, .4, 6.4, 1.8, 1.9, .5], [19.5, .3, 6.2, 1.7, 2, .5], [20.3, .05, 6.4, 1.1, 3.7, .2], [21, .1, 6.6, 1.6, 2.6, .6], [21.1, -.5, 7.2, 2.3, 1.6, 1], [22.4, .5, 7.2, 2.3, 1.6, 1], [23, .25, 7.6, 2.6, 1.5, .8], [24.6, .4, 6.4, 2.4, 1.2, 0], [25.6, 2.75, 4.4, 1.5, 1.05, 0], [27.6, 3.05, 4.4, 1.5, 1.05, 0], [30, 6.48, 6.2, 2.7, 1, 0], [34, 6.48, 6.6, 2.9, 1, 0]];
const cf = V(0, 0, 2.6), cp = V(0, 0, 0);
function moveCam(tt, t, dt, snap) {
  const tall = innerWidth < innerHeight, [yaw, dist, h, ly, w] = key(CK, tt, 5), D = dist * (tall ? 1.2 : 1), fx = lerp(hero.pos.x, big.pos.x, w), fz = lerp(hero.pos.z, big.pos.z, w), fy = heroY * .55 * (1 - w);
  cp.set(fx, fy, fz); if (snap) cf.copy(cp); else cf.lerp(cp, Math.min(1, dt * (tt > 21 && tt < 23 ? 9 : 5)));
  shake = Math.max(0, shake - dt * 1.7); const sx = Math.sin(t * 71) * shake * .08, sy = Math.sin(t * 93) * shake * .08;
  cam.position.set(cf.x + Math.sin(yaw) * D + sx, cf.y * .6 + h + (tall ? .5 : 0) + sy, cf.z + Math.cos(yaw) * D); cam.lookAt(cf.x - Math.sin(yaw) * 1.6, cf.y + ly + (tall ? .2 : 0), cf.z - Math.cos(yaw) * 1.6);
}

reset();
// ?t=秒 で途中から始めるときは、そこまでの出来事を絵なしで早送りしてから始める
const step = (tt, t, dt, snap) => { for (const [tm, fn] of EV) if (tm > prev && tm <= tt) fn(tm); prev = tt; moveHero(tt, t, dt); moveAllies(tt, t, dt); moveFoes(tt, t, dt); moveOrbs(tt, t, dt); moveCam(tt, t, dt, snap); };
K.loop((dt, t) => {
  const tt = (t + T0) % LOOP; if (tt < prev) { reset(); if (prev > 1e8 && T0 > 0) { prev = -1; for (let s = 0; s < T0 % LOOP; s += 1 / 30) { step(s, s, 1 / 30, true); F.update(1 / 30); drawHud(s, s, 1 / 30); } } else prev = -1; }
  step(tt, t, dt, false);
  fountain.userData.tick(t); FT.tick(t); R.catPose(cat, 'sit', t); npcs.forEach((n, i) => MO.play(n, tt > 24.4 && tt < 29 ? 'cheer' : i === 2 ? 'wave' : 'look', t + i * 1.3));
  if (flash.userData.t !== undefined) { flash.userData.t += dt; flash.intensity = Math.max(0, 1 - flash.userData.t / .35) * 26; }
  crt.u.bright.value = Math.min(1, tt / .4, (LOOP - tt) / .5);
  F.update(dt); drawHud(tt, t, dt); crt.render(scene, cam, t);
});
