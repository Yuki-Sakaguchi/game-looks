    if (tt > 17.2 && tt < 18.5) { const u = pulse(tt, 17.2, 18.5); J.armL.rotation.set(-2.5 * u, 0, .15); J.foreL.rotation.x = -1 * u; J.head.rotation.x = -.3 * u; }
    if (tt > 20.6 && tt < 23.3) { const k = seg(tt, 20.6, 21.1), sh = Math.sin(t * 40) * .012 * seg(tt, 21, 23.3); MO.reset(a); MO.squat(a, .4 * k); J.legL.rotation.x -= .4 * k; J.legR.rotation.x += .32 * k; J.shinR.rotation.x += .2 * k; J.torso.rotation.set(.08 * k, .5 * k, 0); J.armR.rotation.set(-1.25 * k + sh, 0, -.2); J.foreR.rotation.x = -.14 - .6 * k; twoHand(J); J.head.rotation.y = -.4 * k; }
    if (tt >= 23.3 && tt < 24.1) { MO.play(a, 'swing', .44 + (tt - 23.3)); twoHand(J); a.position.x += Math.sin(kai.ry) * seg(tt, 23.3, 23.5) * .7; a.position.z += Math.cos(kai.ry) * seg(tt, 23.3, 23.5) * .7; }
    if (s.mode === 'stay') for (const [a0, b0] of COW) cower(kai, t, pulse(tt, a0, b0));
    const use = s.mode === 'run' ? -.1 : s.mode === 'roll' ? -.42 : tt > 20.6 && tt < 23.3 ? -.13 : tt > 23.3 && tt < 23.6 ? -.9 : .2; sta = cl(sta + use * dt, .04, 1); }
  // ドン：足をたたく → 尾にとばされる → 起きる → とんで たたく
  { const s = hunter(don, trD, tt, t, dt, 1), J = don.J, a = don.a;
    for (const t0 of SWD) if (tt >= t0 && tt < t0 + 1.05) { MO.play(a, 'swing', tt - t0); twoHand(J); }
    if (tt >= 21.9 && tt < 22.95) { MO.play(a, 'swing', tt - 21.9); twoHand(J); a.position.y += Math.sin(cl((tt - 21.9) / .66) * PI) * 1.7; J.legL.rotation.x = -.8; J.legR.rotation.x = .3; J.shinL.rotation.x = 1.1; J.shinR.rotation.x = .9; }

// ---- 竜の動き：位置と向きはここで決め、関節は GD.pose にまかせる ----
function moveDragon(tt, t, dt) { let i = 0; while (i < DK.length - 2 && tt >= DK[i + 1][0]) i++; const a = DK[i], b = DK[i + 1], k = ease(cl((tt - a[0]) / (b[0] - a[0]))), moving = b[4] - a[4] > .01;

  const low = cl(seg(tt, 3.6, 5.2) * (1 - seg(tt, 22.3, 22.9)) + seg(tt, 26.2, 27.4)), fk = fa ? fa.k : 0, inh = fa ? seg(fk, 0, .2) * (1 - seg(fk, .22, .32)) : 0, fl = fa ? seg(fk, .24, .34) * (1 - seg(fk, .86, 1)) : 0;
  GD.pose(drg, { t, walk: (a[4] + (b[4] - a[4]) * k) / DU.cycle, walkAmt: moving ? Math.min(1, (tt - a[0]) / .4, (b[0] - tt) / .4) : 0, look: [lookY, .1 + .4 * (1 - low)], low, acts });
  DU.at('head', head); DU.at('mouth', mouth); glow.intensity = 0;

    glow.position.copy(mouth).addScaledVector(dir, 5); glow.intensity = (70 + Math.sin(t * 31) * 18) * fl; if (tt - lastFire > .26 || tt < lastFire) { lastFire = tt; F.fire(V(aim.x + (hash(tt, 1) - .5) * 2, 0, aim.z + (hash(tt, 2) - .5) * 2), { s: 2.4 }); } }
  else if (inh > 0) { glow.position.copy(mouth); glow.intensity = 30 * inh; }
  if (flashT < .4) { flashT += dt; glow.position.copy(head); glow.color.set('#fff4d0'); glow.intensity = Math.max(glow.intensity, (1 - flashT / .4) * 120); } else glow.color.set('#ffb050');
  const roar = acts.find(q => q.name === 'roar'); if (roar && roar.k > .22 && roar.k < .84) shake = Math.max(shake, .55);
  if (acts.some(q => q.name === 'tail' && q.k > .3 && q.k < .78)) shake = Math.max(shake, .22);

}

// ---- 画面の表示 ----
function drawHud(tt, t, dt) {
  H.begin(); const tall = H.tall, top = tall ? 36 : 11, p = H.place('左上', 116, 58, 0, top), x = p.x, y = p.y;

  H.rect(x - 2, y - 2, 114, 35, '#101828', .42); H.text(kai.name, x, y, { size: 10, c: '#ffffff' });
  { const ch = tt > 20.8 && tt < 23.4 ? 1 + (tt > 21.5) + (tt > 22.2) : 0; for (let i = 0; i < 3; i++) if (tt > 20.6 && tt < 23.5) H.icon('star', x + 30 + i * 10, y + 2, { c: i < ch ? ['#a8d8ff', '#fff08a', '#ff9a4a'][ch - 1] : '#404860' }); }
  H.icon('heart', x, y + 12, { c: '#ff6a7a' }); H.bar(x + 10, y + 12, 100, 5, kai.hp / kai.hpMax, { c: kai.hp / kai.hpMax < .45 ? B.PAL.warn : B.PAL.hp, v2: kai.hpShow / kai.hpMax });
  H.icon('bolt', x + 1, y + 19, { c: '#ffd040' }); H.bar(x + 10, y + 20, 84, 3, sta, { c: sta < .25 ? '#ff8a3a' : '#ffd040' });
  { const sharp = 6 - DULL.filter(q => tt >= q).length; H.icon('sword', x, y + 26, { c: '#d8e4f4' }); for (let i = 0; i < 6; i++) H.rect(x + 10 + i * 7, y + 28, 6, 3, i < sharp ? (sharp < 4 ? '#ffb050' : '#8ad8ff') : '#283048', 1); }
  [mio, don].forEach((h, i) => { const yy = y + 38 + i * 10; H.rect(x - 2, yy - 1, 82, 9, '#101828', .42); H.text(h.name, x, yy - 1, { size: 8, c: '#e8ecf8' }); H.bar(x + 26, yy + 2, 50, 3, h.hp / h.hpMax, { c: B.PAL.hp, v2: h.hpShow / h.hpMax }); });
  // 右上：残り時間
  { const r = H.place('右上', 54, 15, 0, top), left = 1360 - tt, mm = Math.floor(left / 60), ss = Math.floor(left % 60); H.win(r.x, r.y, r.w, r.h, { c: '#3a3044', a: .8 }); H.ring(r.x + 9, r.y + 7.5, 5, left / 2100, { c: '#ffe890', back: '#1c1828', th: 2 }); H.num(mm + ':' + String(ss).padStart(2, '0'), r.x + r.w - 5, r.y + 4, { align: 'r', c: '#ffffff' }); }
  // 右下：道具の枠（左右に送る）

    H.win(cx - 34, r.y + 5, 16, 16, { c: '#283048', a: .7 }); H.win(cx + 18, r.y + 5, 16, 16, { c: '#283048', a: .7 }); H.win(cx - 13, r.y, 26, 26, { c: used ? '#5a8a5a' : '#30406e', edge: '#ffe890', a: .88 });
    H.icon(it(-1)[0], cx - 30, r.y + 9, { c: '#8088a0' }); H.icon(it(1)[0], cx + 22, r.y + 9, { c: '#8088a0' }); H.icon(it(0)[0], cx - 7 - Math.round(fr * 16), r.y + 6, { scale: 2, c: '#ffffff' });
    const n = it(0)[2] - (it(0)[0] === 'potion' && tt >= 17.6 ? 1 : 0); H.num('x' + n, cx + 11, r.y + 19, { small: true, align: 'r', c: '#fff08a' });
    for (let i = 0; i < 4; i++) H.rect(cx - 40 + i, r.y + 13 - i, 1, i * 2 + 1, '#ffe890', 1); H.icon('tri', cx + 37, r.y + 10, { c: '#ffe890' }); H.text(it(0)[1], cx, r.y + 29, { size: 8, align: 'c', c: '#ffffff' }); }
  if (msg && tt < msg.until && tt > msg.until - 3) H.msg(msg.text, '上', { dy: tall ? 98 : 30 });

}

// ---- カメラ：カイのうしろから竜を見上げる引きが基本。ほえる・火・弓・ため・ひるむ所で切りかえる ----
const cp = V(), ct = V(), p2 = V(), t2 = V(), VIEW = (QS.get('v') || '').split(',').map(Number);
const follow = (P, C, dist, h, side, lk, ly) => { dir.set(kai.p.x - dp.x, 0, kai.p.z - dp.z).normalize(); per.set(dir.z, 0, -dir.x); P.copy(kai.p).addScaledVector(dir, dist).addScaledVector(per, side); P.y = h; C.copy(kai.p).lerp(dp, lk); C.y = ly; };
const SHOTS = [[0, 0, 0], [5.4, 1, 1], [9.4, 2, 1], [13.1, 3, 0], [17.15, 4, 0], [19.9, 5, 0], [23.3, 6, 0], [25.3, 7, 0], [32.8, 2, 1.2]];
function shot(id, tt, t, P, C) { const tall = innerWidth < innerHeight, Z = tall ? 1.3 : 1;
  if (id === 0) { const c = seg(tt, 3.4, 5); follow(P, C, (7.5 + c * .5) * Z, 1.4 + c * 1.2, -2.2 - c * 6.8, .5, (tall ? 5.4 : 5) - c * .4); }

  else if (id === 2) { follow(P, C, 15 * Z, 1.3, -4, 0, 0); C.copy(kai.p).lerp(head, .5); C.y = head.y * (tall ? .46 : .4); }

  else if (id === 4) { dir.set(mio.p.x - dp.x, 0, mio.p.z - dp.z).normalize(); per.set(dir.z, 0, -dir.x); P.copy(mio.p).addScaledVector(dir, (tall ? 3.6 : 5.5)).addScaledVector(per, tall ? -1.5 : 2); P.y = tall ? 2.1 : 2.8; DU.at('wingL', C); C.lerp(mio.p, .3); C.y = tall ? 4.6 : 2.8; }
  else if (id === 5) follow(P, C, 6.5 * Z, 2.6, -3, .5, (tall ? 4.2 : 3.2) - seg(tt, 22.7, 23.4) * .8);

reset();
K.loop((dt, t) => {
  const tt = (t + T0) % LOOP; if (tt < prev) { reset(); prev = prev > 1e8 ? T0 - .001 : -1; }
  // 竜 → 人 → 竜の順に決める（人は竜の位置を見て向きを決め、竜はカイの位置を見て首をふる）
  moveDragon(tt, t, 0); moveParty(tt, t, dt); moveDragon(tt, t, dt);
  for (const [tm, fn] of EV) if (tm > prev && tm <= tt) fn(tm);
  prev = tt; moveCam(tt, t, dt);
  birds.forEach((b, i) => { const [ph, r, h, sp] = b.userData.orb, a = ph + t * sp; b.position.set(dp.x + Math.cos(a) * r, h + Math.sin(t * .7 + ph) * .8, dp.z + Math.sin(a) * r); b.rotation.y = Math.atan2(-Math.sin(a), Math.cos(a)); R.birdPose(b, 'fly', t * 1.2 + ph); });
  crits.forEach((c, i) => { const a = 1.2 + i * 2.4 + t * .09 * (i ? 1 : -1), r = 26 + i * 3; c.position.set(Math.cos(a) * r, 0, Math.sin(a) * r); c.rotation.y = Math.atan2(-Math.sin(a), Math.cos(a)) + (i ? 0 : PI); FW.critterPose(c, 'walk', t * 10 + i); });
