const flash = new THREE.PointLight('#ffe8b0', 0, 12, 1.2); scene.add(flash);
const crt = R.crt(renderer, { noise: 0, bright: 1.08 }); onResize(crt.resize);
const H = B.hud(scene, cam, crt), F = B.fx(scene, cam);

// ---- 時間の表 ----
const LOOP = 31, T0 = +(new URLSearchParams(location.search).get('t') || 0), SHOTS = [13.9, 15.2, 16.4, 20], T_HIT = 17.95, T_CURE = 23.3; let prev = 1e9, flashT = 9, hurtT = 9;
const HPATH = [[0, -8.8, 0], [4.7, -2, 0], [5.9, -2, 0], [10.9, 6.4, 0], [18.2, 6.4, 0], [19.6, 7.5, .3], [24.6, 7.5, .3], [28.6, 12.25, -1], [29.5, 12.25, -1], [30.7, 13.7, -1]];
const SPATH = [[12.2, 2, -2.6], [13.6, 3.7, -2.5], [13.9, 3.8, -2.45], [14.5, 3.8, -2.45], [15.2, 4.4, -1.9], [15.8, 4.4, -1.9], [16.4, 4.95, -1.4], [17, 4.95, -1.4], [17.5, 5.4, -.95]];
// カメラ 4 か所：[いつから, 位置, 見る先, たて長のときの見る先]
const CAMS = [[0, [2.6, 2.9, -.25], [-4, .5, .1], [-2.4, .1, .1]], [8, [12.6, 4.05, 1.7], [4, .7, -1]], [13, [11.5, .6, 1.25], [3.2, 1.45, -1.75], [3.2, 1.1, -1.75]], [21, [12.6, 4.05, 1.7], [4, .7, -1]], [24.6, [3.5, 4.05, .5], [12.4, .7, -.9]]];
const rattle = (tt, list) => { let k = 0; for (const tm of list) { const u = tt - tm; if (u > 0 && u < .55) k = Math.max(k, Math.sin(u / .55 * PI)); } return k; };
const muzzle = V(), aimAt = V(), tmp = V();
function reset() { F.clear(); fd.name = 'idle'; fd.t = 0; flashT = hurtT = 9; }
const EV = [
  ...SHOTS.map((tm, i) => [tm, () => { flashT = 0; flash.position.copy(muzzle); F.spark(muzzle, { c: '#ffe8a0', n: 5, s: .6 }); F.shot(muzzle, aimAt.clone(), { c: '#ffe8a0', speed: 40, s: .8, onHit: () => { fd.set(i === 3 ? 'down' : 'hurt'); F.spark(aimAt, { c: '#c8b8ff', n: 8, s: 1 }); } }); }]),
  [4.6, () => F.dust([-3, 2.1, -CW + .2], { n: 3, s: .5, c: '#b8c0d0' })], [9.6, () => F.dust([3.15, 2.1, -2.6], { n: 3, s: .5, c: '#b8c0d0' })],
  [17.4, () => fd.set('attack')], [T_HIT, () => { hurtT = 0; F.spark(tmp.copy(hero.position).setY(1), { c: '#c8b8ff', n: 6, s: .8 }); }],
  [21.2, () => F.dust(foe.position, { n: 7, s: 1.2, c: '#8a80c0' })]];

// ---- 主役と影を動かす ----
function moveAll(tt, t, dt) {
  const [hx, hz] = keys(HPATH, tt), [hx2, hz2] = keys(HPATH, tt + .05), moving = Math.hypot(hx2 - hx, hz2 - hz) > .01, back = tt > 18.2 && tt < 19.6;
  const [sx, sz] = keys(SPATH, tt), [sx2, sz2] = keys(SPATH, tt + .05), out = tt > 12.2 && tt < 21.2;
  hero.position.set(hx, 0, hz); foe.position.set(sx, 0, sz); foe.visible = out; foe.rotation.y = Math.atan2(hx - sx, hz - sz);
  // 影：歩く・ひるむ・うでをふる・くずれる
  if (out) { const walking = Math.hypot(sx2 - sx, sz2 - sz) > .004; if (fd.name === 'idle' && walking) fd.name = 'walk'; else if (fd.name === 'walk' && !walking) fd.name = 'idle'; fd.update(dt); foe.scale.setScalar(1 - seg(tt, 20.6, 21.2) * .5); foe.position.y = -seg(tt, 20.5, 21.2) * .6; }
  // 主役の向き：歩く向き → 音のしたとびらを ふり返る → 影にむく
  const look = seg(tt, 4.75, 5.2) - seg(tt, 5.55, 5.95), aim = seg(tt, 10.9, 11.4) - seg(tt, 20.5, 21), reach = seg(tt, 28.5, 28.9) - seg(tt, 29.3, 29.6);
  let yaw = PI / 2 + look * 2.2; if (tt >= 10.9 && tt < 24.6) { const tx = tt < 12.6 ? 3 : sx, tz = tt < 12.6 ? -2.6 : sz, ya = Math.atan2(tx - hx, tz - hz); yaw = PI / 2 + ((ya - PI / 2 + PI * 3) % (PI * 2) - PI) * seg(tt, 10.9, 11.4) * (1 - seg(tt, 24, 24.6)); } else if (tt >= 24.6) yaw = Math.atan2(hx2 - hx || 1, hz2 - hz);
  hero.rotation.y = yaw;
  if (moving) MO.play(hero, 'walk', back ? -t * .9 : t, { speed: tt < 10.9 ? 1.1 : .85 }); else MO.play(hero, 'stand', t);
  D.lanternPose(hero, 1 + look * .6);
  // かまえる・うつ（はねる）・ひるむ・とびらに手をのばす
  const kick = Math.max(0, 1 - flashT / .16), fl = Math.sin(cl(hurtT / .5) * PI) * (hurtT < .5 ? 1 : 0);
  if (aim > 0) { HJ.armR.rotation.set(-1.5 * aim - kick * .4, 0, .12 * aim); HJ.foreR.rotation.x = -.14 - .05 * aim; HJ.torso.rotation.y = -.25 * aim; HJ.head.rotation.y = .2 * aim; if (!moving) { HJ.legL.rotation.x = -.18 * aim; HJ.legR.rotation.x = .2 * aim; } }
  if (fl > 0) { HJ.torso.rotation.x = -.4 * fl; HJ.head.rotation.x = -.3 * fl; hero.position.x += fl * .2; }
  if (reach > 0) { HJ.armR.rotation.set(-1.3 * reach, 0, -.1); HJ.foreR.rotation.x = -.3; }
  hero.updateMatrixWorld(true); gun.getWorldPosition(muzzle); muzzle.y += .04; aimAt.set(sx, 1.15 - seg(tt, 20.5, 21.2) * .4, sz);
  // とびら：がたつく／ひらく
  doorA.rotation.y = Math.sin(t * 61) * .035 * rattle(tt, [4.6, 5.25]); doorB.rotation.y = -PI / 2 + Math.sin(t * 61) * .035 * rattle(tt, [9.6, 10.3, 11]) + seg(tt, 11.6, 12.9) * 1.2; doorC.rotation.y = -PI / 2 + seg(tt, 28.7, 29.6) * 1.25;
  flashT += dt; hurtT += dt; flash.intensity = Math.max(0, 1 - flashT / .12) * 26;
  clock.userData.pend.rotation.z = Math.sin(t * PI) * .16; R.catPose(cat, 'sit', t);
}

// ---- 画面の表示：かまえたときだけ。心ぱくの線は自分で描く（色で 3 段階） ----
const ST_C = ['#5ce070', '#ffd040', '#ff5a4a'], ST_N = ['よし', 'ちゅうい', 'きけん'];
function ecg(x, y, w, h, st, t) { const c = ST_C[st], per = [30, 22, 15][st], n = w - 6, head = (t * [26, 34, 44][st]) % n; H.rect(x, y, w, h, '#0a1410', .9); H.rect(x, y, w, 1, '#3a5a48', 1); H.rect(x, y + h - 1, w, 1, '#1c2c24', 1); H.rect(x, y, 1, h, '#3a5a48', 1); H.rect(x + w - 1, y, 1, h, '#1c2c24', 1);
  let py = null; for (let i = 0; i < n; i++) { const ph = i % per, v = ph === 3 ? 2 : ph === 4 ? -3 : ph === 5 ? 7 : ph === 6 ? 3 : ph === 7 ? -2 : ph === 11 ? 1 : ph === 12 ? 2 : ph === 13 ? 1 : 0, yy = y + Math.round(h * .62) - Math.round(v * (h - 8) / 10), a = 1 - ((head - i + n) % n) / n; if (a > .12) { const y0 = py === null ? yy : Math.min(py, yy), y1 = py === null ? yy : Math.max(py, yy); H.rect(x + 3 + i, y0, 1, y1 - y0 + 1, a > .9 ? '#ffffff' : c, cl(a * 1.2)); } py = yy; } }
function drawHud(tt, t, dt) {
  H.begin(); const tall = H.tall, st = tt >= T_HIT && tt < T_CURE ? 1 : 0, aim = cl((tt - 11) / .3) * cl((21 - tt) / .3), inv = tt > 21.4 && tt < 24.1, ammo = 5 - SHOTS.filter(s => tt >= s).length;
  if (aim > 0 && Math.sin(aim * 40) > -.5) { const a = H.place('左下', 66, 30, 2, -2); ecg(a.x, a.y + 10, 66, 20, st, t); H.text(ST_N[st], a.x + 1, a.y - 2, { size: 10, c: ST_C[st] });
    const b = H.place('右下', 52, 18, -2, -2); H.rect(b.x, b.y, 52, 18, '#0c1018', .85); H.rect(b.x, b.y, 52, 1, '#5a6480', 1); H.rect(b.x, b.y + 17, 52, 1, '#20283a', 1); for (let i = 0; i < 5; i++) H.icon('bullet', b.x + 4 + i * 6, b.y + 6, { c: i < ammo ? '#ffd870' : '#3a3c4c' }); H.num(String(ammo), b.x + 48, b.y + 6, { align: 'r', c: ammo < 3 ? B.PAL.warn : '#ffffff' }); }
  if (inv) { const items = [['bullet', 'ピストルのたま', 'x' + ammo], ['potion', 'くすりびん', tt < T_CURE ? 'x1' : 'x0'], ['bulb', 'ランタン', ''], ['star', 'ふるい おまもり', '']], sel = tt < 22.2 ? 0 : 1, w = Math.min(H.W - 16, 164), r = H.place('中', w, 84, 0, tall ? -20 : -6);
    H.win(r.x, r.y, r.w, r.h, { c: '#1c2a26', c2: '#0e1614', edge: '#c8d4c8', title: 'もちもの' });
    items.forEach(([ic, nm, ct], i) => { const x = r.x + 9 + i * 26, y = r.y + 12, on = i === sel; H.rect(x, y, 22, 22, on ? '#3a5a4a' : '#0c1210', .95); H.rect(x, y, 22, 1, on ? '#ffe890' : '#4a5a52', 1); H.rect(x, y + 21, 22, 1, on ? '#ffe890' : '#28322c', 1); H.rect(x, y, 1, 22, on ? '#ffe890' : '#4a5a52', 1); H.rect(x + 21, y, 1, 22, on ? '#ffe890' : '#28322c', 1); H.icon(ic, x + 7, y + 7, { c: ic === 'potion' && tt >= T_CURE ? '#4a5a52' : ic === 'potion' ? '#7ae0a0' : ic === 'bullet' ? '#ffd870' : ic === 'bulb' ? '#ffc060' : '#c8b8ff' }); if (ct) H.num(ct, x + 20, y + 15, { small: true, align: 'r', c: '#ffffff' }); });
    H.text(items[sel][1], r.x + 9, r.y + 39, { size: 10, c: '#ffffff' }); if (sel === 1) H.text(tt < T_CURE ? 'つかう' : 'つかった', r.x + r.w - 9, r.y + 39, { size: 10, c: B.PAL.gold, align: 'r' });
    ecg(r.x + 9, r.y + 56, r.w - 60, 20, st, t); H.text(ST_N[st], r.x + r.w - 9, r.y + 59, { size: 10, c: ST_C[st], align: 'r' }); if (sel === 1 && tt < T_CURE) H.icon('hand', r.x + 9 + 26 - 9 + Math.round(Math.sin(t * 9)), r.y + 20); }
  H.end(dt);
}

reset();
K.loop((dt, t) => {
  const tt = (t + T0) % LOOP; if (tt < prev) { reset(); prev = prev > 1e8 ? T0 - .001 : -1; }
  moveAll(tt, t, dt);
  for (const [tm, fn] of EV) if (tm > prev && tm <= tt) fn(tm);
  prev = tt;
  // カメラは置きっぱなし。時刻で ぱっと切りかえるだけ（ゆれも なし）
  let c = CAMS[0]; for (const q of CAMS) if (tt >= q[0]) c = q; cam.position.set(...c[1]); cam.lookAt(...(innerWidth < innerHeight && c[3] || c[2]));
  crt.u.bright.value = 1.08 * Math.min(1, tt / .6, (LOOP - tt - .1) / .8);
  D.tick(t, cam); F.update(dt); drawHud(tt, t, dt); crt.render(scene, cam, t);
});
</script>
