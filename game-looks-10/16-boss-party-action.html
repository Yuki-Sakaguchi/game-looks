  { const bw = tall ? H.W - 16 : 210, r = H.place('上', bw, 19, 0, tall ? 36 : 12), n = Math.max(1, Math.ceil(boss.hp - 1e-6)), fr = boss.hp - (n - 1), fr2 = Math.min(1, boss.hpShow - (n - 1)), broke = tt - brk < .7 && tt >= brk, bx = r.x, by = r.y + 11, w2 = bw - 30;
    H.rect(r.x - 3, r.y - 1, bw + 6, 21, '#100818', .5); H.text(boss.name, r.x + 1, r.y, { size: 10, c: '#fff0c0', outline: '#080814' });
    H.bar(bx, by, w2, 8, fr, { c: LC[n - 1], back: n > 1 ? LC[n - 2] : '#2a2c40', v2: fr2, c2: '#ffffff' }); if (n > 1) H.rect(bx + 1, by + 5, w2 - 2, 2, '#080814', .35); if (broke && Math.floor(t * 16) % 2) H.rect(bx + 1, by + 1, w2 - 2, 6, '#ffffff', .8);
    H.num('x' + n, r.x + bw - 1, by, { align: 'r', c: broke ? '#ffffff' : LC[n - 1], scale: 1, outline: '#080814' }); for (let i = 0; i < 5; i++) H.rect(r.x + bw - 28 + i * 6, r.y + 3, 5, 5, '#080814'), H.rect(r.x + bw - 27 + i * 6, r.y + 4, 3, 3, i < n ? LC[i] : '#3a3048');
    if (broke) { for (let i = 0; i < 7; i++) { const k = (tt - brk) / .7; H.rect(bx + 10 + i * (w2 / 7) + Math.sin(i * 3) * 4, by + 6 + k * k * (18 + i * 3), 3, 2, LC[Math.min(4, n)]); } H.text('1 ぽん けずった！', bx + w2 / 2, by + 11, { align: 'c', size: 8, c: '#ffffff', outline: '#080814' }); } }
  // 敵の頭の上の名前と体力（小さな敵も点にならないように、名札を出す）。ロックオンは胸のハート
  for (const f of foes) { if (!f.e.visible || f.hp <= 0) continue; const s = H.project(eAt(f, 2.6)); if (s.on) H.tag(s.x, s.y - 4, f.name, f.hp / f.hpMax, { w: 26 }); }
  if (lockOn) { const s = H.project(tt > 14.4 && tt < 22 ? headP() : heart()); if (s.on) H.lock(s.x, s.y, tt > 14.4 && tt < 22 ? 13 : 9, t, { tight: Math.min(1, (tt - 5.4) * 3) }); }
  // はじき返す合図：主役のまわりで ちぢむ輪と「はじけ！」
  if (parry && tt < parry.hit + .1 && !parry.ok) { const s = H.project(hAt(1)), k = cl((tt - parry.t0) / (parry.hit - parry.t0)), near = k > .82; circle(s.x, s.y, 11, near ? '#ffffff' : '#a0e8ff'); circle(s.x, s.y, 11 + (1 - k) * 26, near && Math.floor(t * 14) % 2 ? '#ffffff' : '#ffe060'); H.text('はじけ！', s.x, s.y - 34 + Math.round(Math.sin(t * 10) * 1.5), { align: 'c', scale: near ? 2 : 1, c: near ? '#ffffff' : '#ffe860', outline: '#5a2800' }); }
  // 左下：コマンド（へんしん中は 中身が変わる）
  { const items = form ? CMD2 : CMD, ms = H.menuSize(items), r = H.place('左下', ms.w + 2, ms.h + 2, 0, tall ? -4 : -2); H.win(r.x, r.y, r.w, r.h, form ? { c: '#b8860a', c2: '#5a2a08', edge: '#fffbe0', title: 'ほしピエロ' } : { ...WIN, title: 'コマンド' });
    if (okForm && Math.floor(t * 6) % 2 === 0) H.rect(r.x + 3, r.y + 5 + 3 * 12, r.w - 6, 12, '#ffe060', .4);
    H.menu(r.x + 4, r.y + 7, items, sel, { t, dim: form ? [] : okForm ? [] : [3] });
    if (note && tt < note.until) { H.win(r.x, r.y - 20, 92, 17, WIN); H.text(note.text, r.x + 6, r.y - 16, { size: 8, c: '#ffffff' }); } }
  // 右下：主役の顔と体力の輪・MP。その上に へんしんのゲージと仲間 2 人
  { const r = H.place('右下', 54, 54, 0, tall ? -4 : -1), cx = r.x + 27, cy = r.y + 27, low = gauge < .25;
    H.ring(cx, cy, 26, hero.hpShow / hero.hpMax, { th: 4, c: '#e04848', back: '#2a2c40' }); H.ring(cx, cy, 26, hero.hp / hero.hpMax, { th: 4, c: B.PAL.hp, back: 'rgba(0,0,0,0)' });
    H.face(cx - 14, cy - 14, { ...hero.face, scale: 2, hurt: hero.hurtT < .5, bg: form ? '#e0a020' : '#2a7ac0' }); if (form) for (let i = 0; i < 28; i++) { H.rect(cx - 14 + i, cy - 14, 1, 1, '#fff6a0'); H.rect(cx - 14 + i, cy + 13, 1, 1, '#fff6a0'); H.rect(cx - 14, cy - 14 + i, 1, 1, '#fff6a0'); H.rect(cx + 13, cy - 14 + i, 1, 1, '#fff6a0'); }
    H.bar(cx - 27 - 44, cy + 18, 42, 6, hero.mp / 120, { c: B.PAL.mp, ticks: 4 }); H.num('MP', cx - 27 - 52, cy + 19, { small: true, c: '#9ad0ff', outline: '#080814' }); H.num('HP', cx - 27 - 30, cy + 9, { small: true, c: '#a8f0b0', outline: '#080814' }); H.num(String(Math.round(hero.hp)), cx - 30, cy + 7, { align: 'r', outline: '#080814' });
    // へんしんのゲージ
    { const gx = cx - 27 - 52, gy = cy - 8, c = form ? (low ? (Math.floor(t * 8) % 2 ? '#ff5a4a' : '#ffb040') : '#ffe060') : okForm ? (Math.floor(t * 6) % 2 ? '#ffffff' : '#6af0e0') : '#6af0e0'; H.text('へんしん', gx, gy - 10, { size: 8, c: form ? '#ffe890' : '#c0fff0', outline: '#080814' }); H.bar(gx, gy, 50, 7, gauge, { c, back: '#2a2c40', ticks: 5 }); H.icon('star', gx + 40, gy - 9, { c }); }
    const al = form ? [tonta] : [tonta, lulu]; al.forEach((p, i) => { const ax = cx + 14, ay = cy - 42 - i * 27; H.ring(ax, ay, 12, p.hp / p.hpMax, { th: 3, c: B.PAL.hp }); if (p.face) H.face(ax - 7, ay - 7, { ...p.face, bg: '#8a3a7a' }); else { H.rect(ax - 7, ay - 7, 14, 14, '#3a5a9a'); [['..rrrrrr..', '.rrrrrrrr.', '.rkkkkkkr.', '.rkgkkgkr.', '.rkkkkkkr.', '.rrrrrrrr.', '..yy..yy..', '.rrrrrrrr.', '.r.rrrr.r.'].forEach((row, j) => [...row].forEach((ch, q) => { const c = { r: '#d8483a', k: '#202838', g: '#8affd0', y: '#ffd23a' }[ch]; if (c) H.rect(ax - 5 + q, ay - 5 + j, 1, 1, c); }))]; } H.text(p.name, ax - 15, ay - 3, { align: 'r', size: 8, outline: '#080814' }); }); }
  // 右上：つづけて当てた数
  { const r = H.place('右上', 58, 15, 0, tall ? 62 : 36); comboT += dt; if (comboT > 1.8) combo = 0; if (combo > 1) { const pop = Math.max(0, 1 - comboT * 5); H.num(String(combo), r.x + r.w - 30, r.y + 2 - Math.round(pop * 3), { align: 'r', scale: 2, c: combo >= 10 ? '#ffe060' : GOLD, outline: '#080814' }); H.text('れんげき', r.x + r.w - 27, r.y + 6, { size: 8, c: '#ffffff', outline: '#080814' }); if (heroY > 2) H.text('くうちゅう', r.x + r.w - 27, r.y - 3, { size: 8, c: '#8af0e0', outline: '#080814' }); } }
  if (band) strip(band.text, band.sub, (tt - band.t0) / band.len, band.c, band.y);
  H.end(dt);
}

// ---- カメラ：主役のうしろの低い所から、ボスを見上げる。空中の連続技では 主役の高さまで上がって寄る。[時刻, 向き, きょり, 高さ, 見る高さ, ボスへ寄せる量, 主役の高さに ついていく量] ----
const CK = [[0, .18, 7.2, 1.5, 3.6, 0, 0], [2.4, .18, 7, 1.2, 3.5, 0, 0], [3.2, .5, 5, 1.7, 1.5, 0, 0], [4.6, .5, 5, 1.7, 1.6, 0, 0], [5.8, .3, 7.6, 1.1, 3.7, 0, 0], [7.2, .95, 7, 1.2, 3.1, .12, 0], [8.6, 1, 7, 1.2, 3.2, .15, 0], [9.8, .5, 6.2, 1.4, 2.8, 0, 0], [10.6, 2.75, 3.6, 1.2, 1.15, 0, .8], [12.6, 3.05, 3.5, 1.1, 1.1, 0, .8], [13.4, .2, 5.6, 1.3, 2.6, 0, 0], [14.3, .45, 6, 1, 4.2, .2, .4], [15, .75, 4.6, .7, .7, .25, 1], [18, .3, 4.4, .5, .6, .25, 1], [21.4, -.5, 4.8, .8, .5, .25, 1], [22.4, -.2, 5.6, -1.2, 1.4, .2, 1], [23.6, .25, 9.5, 1.6, 4.4, .55, 0], [25, .3, 8.6, 1.5, 3, .5, 0], [25.8, 2.8, 4, 1.3, 1.1, 0, 0], [27.8, 3.1, 4, 1.3, 1.1, 0, 0], [28.8, 2.3, 4.6, 1.5, 1.1, 0, 0], [30, .9, 6.4, 1.4, 3, .1, 0], [32.5, .18, 7, 1.3, 3.5, 0, 0], [40, .18, 7.2, 1.5, 3.6, 0, 0]];
const cf = V(0, 0, -.8), cp = V(0, 0, 0);

  const tall = innerWidth < innerHeight, [yaw, dist, h, ly, w, ak] = key(CK, tt, 6), D = dist * (tall ? 1.12 : 1);
  cp.set(lerp(hero.pos.x, boss.pos.x, w), heroY * ak, lerp(hero.pos.z, boss.pos.z, w)); if (snap) cf.copy(cp); else cf.lerp(cp, Math.min(1, dt * (heroY > 2 ? 8 : 5)));
  shake = Math.max(0, shake - dt * 1.7); const sx = Math.sin(t * 71) * shake * .08, sy = Math.sin(t * 93) * shake * .08;

  if (CAMQ.length === 6) { cam.position.set(CAMQ[0], CAMQ[1], CAMQ[2]); cp.set(CAMQ[3], CAMQ[4], CAMQ[5]); }
  cam.lookAt(cp); cam.updateMatrixWorld();
}

reset();
// ?t=秒 で途中から始めるときは、そこまでの出来事を絵なしで早送りしてから始める
const step = (tt, t, dt, snap) => { prevT = tt; for (const [tm, fn] of EV) if (tm > prev && tm <= tt) fn(tm); prev = tt; moveHero(tt, t, dt); moveAllies(tt, t, dt); moveFoes(tt, t, dt); moveCam(tt, t, dt, snap); };
K.loop((dt, t) => {
  const tt = (t + T0) % LOOP; if (tt < prev) { reset(); if (prev > 1e8 && T0 > 0) { prev = -1; for (let s = 0; s < T0 % LOOP; s += 1 / 30) { step(s, s, 1 / 30, true); F.update(1 / 30); drawHud(s, s, 1 / 30); } } else prev = -1; }
  step(tt, t, dt, false);
  FT.tick(t); balloons.forEach(m => { const [x, y, z, ph] = m.userData.b; m.position.set(x + Math.sin(t * .4 + ph) * .6, y + Math.sin(t * .5 + ph) * 1.2, z); m.rotation.z = Math.sin(t * .8 + ph) * .15; });
