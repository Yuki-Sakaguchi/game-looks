const SP = [[0, .14], [6, .14], [9, 0], [12.5, 0], [14, .1175], [17, .1175], [18, 0], [22, 0], [23, .143], [25.5, .143], [26.5, 0], [36, 0]];

const GRIP = [[10.6, 1], [17.8, .8], [21.6, .2], [22, .2], [26.3, .74], [29.6, .6], [30.8, 0], [32.6, 0], [36, .5]], STABS = [27.2, 28.45], T_THROW = 30.8, T_LAND = 32.6, T_JUMP = 10;

  else if (tt < T_THROW) { const q = keys(QK, tt), sk = seg(tt, 18, 18.7) - seg(tt, 21, 21.9), th = seg(tt, 29.5, 30.1); climbAt(q);
    if (q < 9) { const moving = tt < 18.5 || tt > 21.9; if (sk > .3) { MO.play(hero, 'dangle', t); rig.rotateX(sk * (.55 + Math.sin(t * 4.6) * .4)); rig.rotateZ(Math.sin(t * 3.1) * .3 * sk); } else MO.play(hero, 'climb', t, { amp: moving ? 1 : .15 }); }
    else { let st = -1; for (const s of STABS) if (tt >= s) st = tt - s; if (th > 0) { MO.play(hero, 'crouch', t); HJ.armL.rotation.set(-.3, 0, .5); HJ.armR.rotation.set(-.2, 0, -.5); hero.rotation.z = Math.sin(t * 9) * .2 * th; hero.rotation.x = Math.sin(t * 7) * .15 * th; }
      else if (st >= 0 && st < 1.15) MO.play(hero, 'stab', st); else if (st >= 1.15) { MO.play(hero, 'stab', 1.15 - cl((st - 1.15) / .3) * .7); } else { MO.play(hero, 'stand', t); HJ.head.rotation.x = .3; } }
    if (tt > 26.3) (launch = launch || V()).copy(rig.position); }
  else if (tt < T_LAND) { if (!launch) launch = top.clone(); const k = (tt - T_THROW) / (T_LAND - T_THROW); rig.position.lerpVectors(launch, LAND, k); rig.position.y = launch.y + 7 * k - (launch.y + 7) * k * k + .5; rig.rotation.set(k * 10, 1, k * 3); hero.position.y = -.6; MO.play(hero, 'fall', t); }
  else { const k = seg(tt, T_LAND, T_LAND + .8), up2 = seg(tt, 34, 35); rig.position.copy(LAND).addScaledVector(tmp.set(.6, 0, .8), k * 1.6); rig.rotation.y = Math.atan2(col.position.x - LAND.x, ZC - LAND.z); MO.play(hero, 'crouch', t); HJ.torso.rotation.x = .9 - k * .5 - up2 * .2; HJ.head.rotation.x = -.1 - up2 * .5; HJ.armL.rotation.set(-.9, 0, .2); HJ.foreL.rotation.x = -.3; }
  hw.copy(rig.position);
}

// ---- 画面の表示 ----
function drawHud(tt, t, dt) {
  H.begin(); const tall = H.tall, grip = keys(GRIP, tt, false), r = H.place('右下', 64, 28, -2, -2), cx = r.x + r.w - 14, cy = r.y + 13, low = grip < .3, blink = low && Math.sin(t * 14) > 0;
  hpShow += (hp - hpShow) * Math.min(1, dt * 1.6); chpShow += (chp - chpShow) * Math.min(1, dt * 1.4);
  const gc = low ? (blink ? '#ffffff' : B.PAL.warn) : grip < .55 ? B.PAL.gold : '#f4f0dc', jx = low ? Math.round(Math.sin(t * 40)) : 0;
  H.ring(cx + jx, cy, 11, 1, { c: '#1c2026', back: '#1c2026', th: 5 }); H.ring(cx + jx, cy, 11, grip, { c: gc, back: '#4a4e58', th: 3 }); H.icon('hand', cx - 4 + jx, cy - 3, { c: gc });
  H.icon('heart', r.x, r.y + r.h - 8, { c: '#f06858' }); H.bar(r.x + 10, r.y + r.h - 6, 30, 3, hp, { c: B.PAL.hp, v2: hpShow, c2: '#ffffff', back: '#1c2026' });
  const bk = seg(tt, STABS[0] + .5, STABS[0] + .8) * (1 - seg(tt, 31.6, 32.4));
  if (bk > .02) { const w = Math.min(H.W - 30, 170), b = H.place('上', w, 14, 0, (tall ? 36 : 14) - Math.round((1 - bk) * 8)); H.text('コケオイ', b.x, b.y - 2, { size: 10, c: '#f4f0dc' }); H.bar(b.x, b.y + 11, Math.round(w * bk), 4, chp, { c: '#9af0e0', v2: chpShow, c2: '#ffffff', back: '#1c2026', ticks: 4 }); }
  H.end(dt);
}

// ---- カメラ：見上げる引き → うしろから追う → のぼる所を引きで → 頭の上で寄る → 地面からの引き ----
const cp = V(), ct = V();
function moveCam(tt, t, dt) {
  const tall = innerWidth < innerHeight, cx = col.position.x;
  if (tt < 5.6) { cp.set(7.5 + tt * .08, 1, 16.5); ct.set(cx + 3, tall ? 13 : 9.5, ZC); }
  else if (tt < 10.4) { const k = seg(tt, 5.6, 10.4); cp.copy(hw).addScaledVector(RUN, tall ? -5 : -5.6).addScaledVector(SIDE, 1.5); cp.y = 1.1 + k * .3; ct.copy(hw).addScaledVector(RUN, 12); ct.y = 5 + k * (tall ? 10 : 5); }
  else if (tt < 17.6) { cp.set(hw.x + 4, Math.max(1, hw.y - (tall ? 4.5 : 2.4)), hw.z + (tall ? 8.5 : 9)); ct.set(hw.x - 1.5, hw.y + (tall ? 4.6 : 2), hw.z - 3); }
  else if (tt < 22) { if (tall) { cp.set(hw.x - 5, hw.y - 1.5, hw.z + 3.6); ct.set(hw.x + 1.5, hw.y + 2.6, hw.z - 1); } else { cp.set(hw.x - 5, hw.y + .8, hw.z + 3.4); ct.set(hw.x + 1.5, hw.y + .4, hw.z - .6); } }
  else if (tt < 26.2) { cp.set(hw.x - 6, hw.y + 2.8, hw.z + 1.6); ct.copy(hw).lerp(top, tall ? .3 : .1); ct.y += .2; }
  else if (tt < 29.6) { const k = seg(tt, 26.2, 29.6); cp.set(top.x - 2.2 - k * .8, top.y + 1.7 + k * .4, top.z + 4.5); ct.set(top.x - .5, top.y + (tall ? 1.3 : .75), top.z); }
  else { const k = seg(tt, 30.9, 32.6); cp.set(X6 + 26, 1.5, ZC + 34.5); ct.set(X6 + 5, tall ? 15 : 12.5, ZC + 4).lerp(tmp.copy(hw).setY(hw.y + 1.2), k * .8); }
  shake = Math.max(0, shake - dt * 1.3); cp.x += Math.sin(t * 61) * shake * .12; cp.y += Math.sin(t * 83) * shake * .16;
  cam.position.copy(cp); cam.lookAt(ct);
}

reset();
K.loop((dt, t) => {
  const tt = (t + T0) % LOOP; if (tt < prev) { const first = prev > 1e8; reset(); prev = first ? T0 - .001 : -1; if (first) { if (tt > STABS[0] + .56) chp = chpShow = tt > STABS[1] + .56 ? .64 : .84; if (tt > T_LAND) hp = hpShow = .58; } }
  for (const [tm, fn] of EV) if (tm > prev && tm <= tt) fn(tm);
  prev = tt;
  moveCol(tt, t, dt); moveHero(tt, t, dt); moveCam(tt, t, dt);
  flock.userData.tick(t); flock2.userData.tick(t); motes.position.set(cam.position.x, 1, cam.position.z - 8); motes.userData.tick(t);
  crt.u.bright.value = Math.min(1, tt / .5, (LOOP - tt) / .6);
  F.update(dt); drawHud(tt, t, dt); crt.render(scene, cam, t);
});
</script>
