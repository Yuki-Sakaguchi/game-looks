  if (tt >= 19.2 && tt < 20.7) blend(1, -.3 - (tt - 19.2) * .2, 2.1, 2.4 * D, -3.6, 1.7, -.7);
  else if (tt >= 20.7 && tt < 22.6) blend(1, -2.9 + (tt - 20.7) * .15, .7, 3.7 * D, -3.3, 1.9, .2);
  else if (tt >= 22.6 && tt < 23.75) blend(1, yoru.home.x - 2.3 * D, .95, yoru.home.z - 1.5 * D, yoru.home.x, 1.3 + (tt - 22.6) * .15, yoru.home.z);
  else if (tt >= 23.75 && tt < 25.4) blend(1, .6 * D, 4.6, 4.6 * D, big.home.x, 2.6, big.home.z);
  // ひるむ：大きい敵へ寄る
  blend((seg(tt, 25.4, 25.5) - seg(tt, 27, 27.5)) * .8, 2.2, 2.6, 5.2 * D, -3.6, 1.7, -.3);
  shake = Math.max(0, shake - dt * 1.6); cp.x += Math.sin(t * 71) * shake * .08; cp.y += Math.sin(t * 93) * shake * .08;
  cam.position.copy(cp); cam.lookAt(ct);
}

reset();
// ?t=秒 で途中から始めるときは、そこまでの出来事を絵なしで早送りしてから始める（HP や たおれた敵をそろえるため）
const step = (tt, t, dt) => { for (const [tm, fn] of EV) if (tm > prev && tm <= tt) fn(tm); prev = tt; moveParty(tt, t, dt); moveFoes(tt, t, dt); moveCam(tt, t, dt); };
K.loop((dt, t) => {
  const tt = (t + T0) % LOOP; if (tt < prev) { reset(); if (prev > 1e8 && T0 > 0) { prev = -1; for (let s = 0; s < T0 % LOOP; s += 1 / 30) { step(s, s, 1 / 30); F.update(1 / 30); drawHud(s, s, 1 / 30); } } else prev = -1; }
  step(tt, t, dt);
  for (const o of live) o.userData.tick(t);
  if (flash.userData.t !== undefined) { flash.userData.t += dt; flash.intensity = Math.max(0, 1 - flash.userData.t / .35) * 26; }
  crt.u.bright.value = Math.min(1, tt / .4, (LOOP - tt) / .5);
  F.update(dt); drawHud(tt, t, dt); crt.render(scene, cam, t);
});
</script>
