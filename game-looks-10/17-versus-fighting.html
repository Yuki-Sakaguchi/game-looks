// ---- 2 人の格闘家。ナギ（素手。前に出すのは左）と ゲンサイ（棒。前に出すのは右） ----
function staffMesh() { const G = R.geo().smooth(1), a = -.6, b = 1; G.loft(6, [[a, .034, .034, 0, .9], [a + .04, .056, .056, .05, 1.15], [a + .18, .038, .038, .14, 1], [b - .18, .038, .038, .86, 1], [b - .04, .056, .056, .95, 1.15], [b, .034, .034, 1, .9]], { cap: 'both' }); return G.mesh(FT.tex.lacquer({ c: '#c0402e', band: true })); }
const mkF = (name, o, dir, lead, x0, face) => { const a = R.actor(o); a.rotation.order = 'YXZ'; scene.add(a); return { a, J: a.userData.J, name, dir, ld: lead, rr: lead === 'L' ? 'R' : 'L', s: lead === 'L' ? 1 : -1, yaw0: dir * (PI / 2 - .45), x0, face, y: 0, pitch: 0, yawAdd: 0, dx: 0, piv: 0, x: x0, py: 0 }; };

// ---- 動き（かまえ・ステップ・パンチ・キック・足ばらい・ガード・投げ・のけぞる・たおれる・必殺技）。k は その動きの 0〜1 ----
const strike = k => k < .32 ? ease(k / .32) : k < .5 ? 1 : 1 - ease((k - .5) / .5);
const armS = (f, sd, ax, fx, az = .1) => { f.J['arm' + sd].rotation.set(ax, 0, sd === 'L' ? az : -az); f.J['fore' + sd].rotation.x = fx; };
const legS = (f, sd, lx, sx) => { f.J['leg' + sd].rotation.x = lx; f.J['shin' + sd].rotation.x = sx; };
// 棒の向き：0 で真上、PI/2 で前、PI で真下（うでと胴の曲がりを引いて、手首の角度にする）
const aim = (f, ang) => { if (f.w) f.w.rotation.x = ang - f.J['arm' + f.ld].rotation.x - f.J['fore' + f.ld].rotation.x - f.J.torso.rotation.x; };

  if (f.w) { armS(f, f.ld, -.75, -.6, .12); armS(f, f.rr, -.95, -.75, -.3); aim(f, .8); } else { armS(f, f.ld, -1, -1.35, .08); armS(f, f.rr, -.5, -1.95, .12); } };

  dash(f, k, g) { MO.play(f.a, 'run', g * 1.2); if (f.w) { armS(f, f.ld, -.6, -.7, .2); aim(f, 1.2); } },

  cross(f, k) { const u = strike(k); armS(f, f.rr, -.5 - u * 1.05, -1.95 + u * 1.9, .02); armS(f, f.ld, -.8, -1.8, .15); f.J.torso.rotation.set(.1 + u * .12, f.s * u * .6, 0); f.dx = u * .16; },
  body(f, k, g) { const u = strike(k); base(f, g, .24 + u * .3); armS(f, f.rr, -.2 - u * .75, -1.7 + u * 1.1, .02); f.J.torso.rotation.set(.1 + u * .3, f.s * u * .5, 0); f.dx = u * .14; },
  highKick(f, k) { const u = strike(k); legS(f, f.rr, .34 - u * 2.3, .2 + (k < .32 ? Math.sin(k / .32 * PI) * .9 : 0)); f.J.torso.rotation.set(.1 - u * .42, f.s * u * .4, 0); armS(f, f.ld, -.7, -1.7, .1); armS(f, f.rr, .2 + u * .5, -.7, .35); f.yawAdd = f.s * u * .45; f.dx = u * .08; },
  sweep(f, k, g) { const u = strike(k); base(f, g, .24 + u * .66); legS(f, f.ld, -.6 - u * .95, .5 - u * .4); f.J.torso.rotation.set(.1 + u * .45, 0, 0); armS(f, f.ld, -.9 + u * 1.2, -.9, .3); armS(f, f.rr, -.6, -1.4, .2); f.yawAdd = -f.s * u * .3; f.dx = u * .1; },
  upper(f, k, g) { if (k < .35) { const c = ease(k / .35); base(f, g, .24 + c * .42); armS(f, f.rr, -.2, -1.6, .1); f.J.torso.rotation.x = .1 + c * .25; } else { const u = ease(cl((k - .35) / .28)); base(f, g, .66 - u * .52); armS(f, f.rr, -.3 - u * 2.55, -1.5 + u * 1.25, .05); f.J.torso.rotation.set(.35 - u * .6, f.s * u * .3, 0); f.J.head.rotation.x = -u * .25; f.y = Math.sin(cl((k - .35) / .65) * PI) * .32; } },

  hurt(f, k) { const a = Math.sin(k * PI); f.J.torso.rotation.set(.1 - a * .55, f.s * a * .2, 0); f.J.head.rotation.x = -a * .4; armS(f, f.ld, -.7 - a * .4, -.9, .15 + a * .5); armS(f, f.rr, -.3 + a * .6, -1.1, .15 + a * .45); aim(f, .5); f.dx = -a * .06; },
  hurtLow(f, k) { const a = Math.sin(k * PI); f.J.torso.rotation.x = .1 + a * .65; f.J.head.rotation.x = a * .3; armS(f, f.ld, -.7, -1.3, -.1); armS(f, f.rr, -.6, -1.5, -.2); aim(f, 1); f.dx = -a * .06; },

  kneel(f, k, g) { const u = Math.min(1, k * 5, (1 - k) * 4); base(f, g, .24 + u * .62); f.J.torso.rotation.x = .1 + u * .5 + Math.sin(g * 5) * .03; f.J.head.rotation.x = u * .3; armS(f, f.ld, -.9 * u - .3, -.5, .1); armS(f, f.rr, -.3, -.9, .25); },

    H.rect(x - 2, y0 - 2, bw + 4, 12, '#080814'); H.rect(x - 1, y0 - 1, bw + 2, 1, '#f4ecd0'); H.rect(x - 1, y0 + 8, bw + 2, 1, '#8a7a6a'); H.rect(x, y0, bw, 8, '#40202c');
    const fx = left ? x + bw - fw : x, sx = left ? x + bw - sw : x + fw; if (sw > fw) H.rect(sx, y0, sw - fw, 8, '#e83838'); if (fw > 0) { H.rect(fx, y0, fw, 8, c); H.rect(fx, y0, fw, 2, '#fff6c0'); H.rect(fx, y0 + 6, fw, 2, low ? '#c85a20' : '#d89a20'); }
    H.face(left ? x : x + bw - 14, y0 + 13, { ...f.face, hurt: f.hurtT < .35 }); H.text(f.name, left ? x + 18 : x + bw - 18, y0 + 15, { align: left ? 'l' : 'r', outline: '#080814' });
    for (let i = 0; i < 2; i++) H.icon('star', left ? x + bw - 8 - i * 10 : x + 1 + i * 10, y0 + 14, { c: i < f.wins ? (f.starT < 1.2 && blink ? '#ffffff' : '#ffd83a') : '#4a4460' });
    if (f.wins && f.starT < .5) { const s = 1 + Math.round((1 - f.starT / .5) * 2); H.icon('star', (left ? x + bw - 8 : x + 1) - (s - 1) * 3, y0 + 14 - (s - 1) * 3, { c: '#ffffff', scale: s }); }
    // 必殺技のゲージ（中央へ向けてたまる）と、連続で当てた数
    const gw = tall ? 72 : 104, gx = left ? 8 : W - 8 - gw, gy = HH - 16, full = f.gaugeShow >= .995, gf = Math.round((gw - 2) * cl(f.gaugeShow)), gc = full ? (blink ? '#ffffff' : '#8aecff') : '#3aa8f0';
    H.text('ひっさつ', left ? gx : gx + gw, gy - 10, { size: 8, align: left ? 'l' : 'r', c: '#ffe890', outline: '#080814' }); H.rect(gx - 1, gy - 1, gw + 2, 9, '#080814'); H.rect(gx, gy - 1, gw, 1, '#f4ecd0'); H.rect(gx + 1, gy + 1, gw - 2, 5, '#1c2440');
    if (gf > 0) { const x1 = left ? gx + 1 : gx + gw - 1 - gf; H.rect(x1, gy + 1, gf, 5, gc); H.rect(x1, gy + 1, gf, 1, mix(gc, '#ffffff', .6)); } for (let i = 1; i < 3; i++) H.rect(gx + Math.round(gw * i / 3), gy + 1, 1, 5, '#080814', .8);
    if (full) H.num('MAX', left ? gx + gw : gx, gy - 9, { align: left ? 'r' : 'l', c: blink ? '#ffffff' : '#ffd83a', outline: '#080814' });
    if (f.combo >= 2 && g - f.comboAt < 1.3) { const fresh = g - f.comboAt < .1, sc = (tall ? 2 : 3) + (fresh ? 1 : 0), y = y0 + 36 - (fresh ? 3 : 0), tw = H.textW('ヒット'), cc = f.combo >= 10 ? '#ff8a5a' : '#ffe060';
      if (left) { const nw = H.num(String(f.combo), 9, y, { scale: sc, c: cc, outline: '#080814' }); H.text('ヒット', 12 + nw, y + sc * 7 - 11, { outline: '#080814' }); } else { H.text('ヒット', W - 9, y + sc * 7 - 11, { align: 'r', outline: '#080814' }); H.num(String(f.combo), W - 12 - tw, y, { scale: sc, c: cc, outline: '#080814', align: 'r' }); } } }
  H.win(cx - 15, y0 - 7, 30, 23, { c: '#6a2434', c2: '#2a1020', edge: '#f4ecd0' }); H.num(String(time).padStart(2, '0'), cx + 1, y0 - 2, { scale: 2, align: 'c', c: time <= 10 ? '#ff7a5a' : '#fff6d0' });
  if (big) { const k = (rt - big.rt0) / big.len; if (k >= 1) big = null; else if (!(k > .85 && Math.floor(rt * 20) % 2)) { let sc = 3; while (sc > 1 && H.textW(big.text, { size: 12 }) * sc > W - 14) sc--; const pop = k < .08 ? 1 : 0, y = Math.round(HH * (big.low ? (tall ? .66 : .64) : tall ? .22 : .26)), th = 12 * (sc + pop);
      H.rect(0, y - 4, W, th + 9, '#180a1c', .5); H.rect(0, y - 5, W, 1, '#ffe890', .9); H.rect(0, y + th + 5, W, 1, '#ffe890', .9); H.text(big.text, cx, y, { size: 12, scale: sc + pop, align: 'c', c: big.c, outline: '#3a1008' }); } }
  if (banner) { const k = (rt - banner.rt0) / banner.len; if (k >= 1) banner = null; else H.banner(banner.text, k, { sub: banner.sub, c: banner.c, y: Math.round(HH * (tall ? .7 : .73)) }); }
  H.end(dt);
}

// ---- カメラ：横から。2 人の間かくで寄り引き。必殺技で顔へ寄り、決め技で回りこみ、勝ったほうへ寄る ----
const cp = V(), ct = V(), p2 = V(), t2 = V(); let cMid = 0, cSep = 3.2, cY = 0;
function moveCam(t, dt, snap) {
  const tall = innerWidth < innerHeight, k = snap ? 1 : 1 - Math.exp(-dt * 6); cMid += ((A.x + G2.x) / 2 - cMid) * k; cSep += (Math.abs(G2.x - A.x) - cSep) * k; cY += (Math.max(A.py, G2.py) - cY) * k;
  const D = tall ? 3.5 + Math.max(0, cSep - .9) * 1.15 + cY * .7 : 4.5 + Math.max(0, cSep - .9) * 1.3 + cY * .5; let yaw = (tall ? .8 : 0) + Math.sin(t * .3) * .05, cx = cMid, h = 1.05 + D * .04 + cY * .45, ly = (tall ? 1.25 : 1.12) + cY * .45, d = D;
  // 決め技：ゲンサイのまわりを回りこむ
  const wf = seg(rt, finRT, finRT + .5) - seg(rt, finRT + 2.5, finRT + 3.4); if (wf > 0) { yaw += wf * (.75 + seg(rt, finRT, finRT + 2.6) * .45) * (tall ? .5 : 1); d = lerp(d, tall ? 5.6 : 4.4, wf); h = lerp(h, 1.9, wf); ly = lerp(ly, .75, wf); cx = lerp(cx, G2.x - .3, wf); }
  cp.set(cx + Math.sin(yaw) * d, h, Math.cos(yaw) * d); ct.set(cx + (tall ? .3 : 0), ly, 0);
  // 必殺技のはじまり：ナギの顔へ寄る
  const ws = seg(rt, superRT, superRT + .22) - seg(rt, superRT + 1, superRT + 1.3); if (ws > 0) { p2.set(A.x + (tall ? .55 : .6), .9, tall ? 2.3 : 1.6); t2.set(A.x - .15, 1.02, 0); cp.lerp(p2, ws); ct.lerp(t2, ws); }
  // 勝ったナギへ寄る
  const ww = seg(g, 23.3, 24.4); if (ww > 0) { p2.set(A.x + .5 + Math.sin(t * .4) * .2, 1.15, tall ? 4.4 : 3.3); t2.set(A.x + (tall ? 0 : .35), tall ? .95 : 1, 0); cp.lerp(p2, ww); ct.lerp(t2, ww); }
  shake = Math.max(0, shake - dt * 1.8); cp.x += Math.sin(t * 71) * shake * .07; cp.y += Math.sin(t * 93) * shake * .07; cam.position.copy(cp); cam.lookAt(ct);
  // 暗い幕は、2 人のうしろ 1.6 m に、カメラを向けて置く
  dark += ((darkOn ? 1 : 0) - dark) * Math.min(1, dt * 9); const on = dark > .01; veil.visible = streak.visible = on;
  if (on) { p2.set(ct.x - cp.x, 0, ct.z - cp.z).normalize(); veil.position.set(cMid + p2.x * 1.7, 4, p2.z * 1.7); veil.lookAt(cp.x, 4, cp.z); streak.position.set(cMid + p2.x * 1.6, 2.4, p2.z * 1.6); streak.lookAt(cp.x, 2.4, cp.z); veil.material.opacity = dark * .8; streak.material.opacity = dark * .9; streakT.offset.x = -rt * 2.6; streakT.offset.y = rt * .15; }
  hemi.intensity = 1.55 * (1 - dark * .55); sun.intensity = 2.5 * (1 - dark * .6); aura.intensity = dark * 3.5; aura.position.set(cMid, 2.4 + cY * .5, 2.4);
}

// ---- ひとコマ進める。必殺技のはじまりは ほぼ止まり、決め技はスローになる ----
const RATE = v => v >= 19.72 && v < 19.8 ? .07 : v >= 21.86 && v < 22.3 ? .2 : 1;
function step(dt, t, snap) {
  stopT = Math.max(0, stopT - dt); const dg = dt * RATE(g) * (stopT > 0 ? .15 : 1); g += dg; rt += dt; if (g >= GEND) { reset(); g = 0; rt = 0; prev = -1; }
  for (const [tm, fn] of EV) if (tm > prev && tm <= g) fn(tm); prev = g;
  for (const f of [A, G2]) { f.dg = dg; moveF(f, g); f.hurtT += dg; f.starT += dt; if (g - f.hitAt > .45) f.hpShow += (f.hp - f.hpShow) * Math.min(1, dg * 5); if (f.hpShow - f.hp < .6) f.hpShow = f.hp; f.gaugeShow += (f.gauge - f.gaugeShow) * Math.min(1, dt * 6); }
  if (g > 19.72 && g < 22) A.gauge = Math.max(0, 1 - (g - 19.72) / 2.2);
  moveCam(t, dt, snap); F.update(Math.max(dg, dt * .45)); drawHud(t, dt);
}
const T0 = +(new URLSearchParams(location.search).get('t') || 0);
reset(); for (let s = 0; s < T0; s += 1 / 30) step(1 / 30, s, true);
K.loop((dt, t) => {
  step(dt, t + T0, rt < .05);
  FT.tick(t); R.catPose(cat, 'sit', t); const ex = g > 19.7 && g < 28.6; npcs.forEach((n, i) => MO.play(n, ex || (i + Math.floor(t / 2.6)) % 3 === 0 ? 'cheer' : i % 2 ? 'wave' : 'look', t + i * 1.3));
  leaves.forEach(o => { const [x, y, z, ph, v] = o.userData.p, fy = ((y - t * v) % 8 + 8) % 8; o.position.set(x + Math.sin(t * .9 + ph) * .8 + t * .0, fy, z + Math.cos(t * .7 + ph) * .6); o.rotation.set(t * 1.3 + ph, t * .9 + ph, ph); });
  lampL.forEach((l, i) => { l.intensity = 9 + Math.sin(t * 7 + i * 2) * .8; });
