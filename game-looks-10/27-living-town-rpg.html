  else if (act === 'sit' || act === 'eat') { MO.play(a, 'sit', ph); a.position.y = -.1; if (act === 'eat') { const u = Math.sin(ph * 3) * .5 + .5; J.armR.rotation.set(-.9 - u * .5, 0, -.1); J.foreR.rotation.x = -1.2 - u * .6; } }
  else if (act === 'hammer') { MO.play(a, 'stand', ph); const k = (ph * 1.5) % 1, u = k < .7 ? ease(k / .7) : 1 - ease((k - .7) / .3); J.armR.rotation.set(-.5 - u * 1.7, 0, -.2); J.foreR.rotation.x = -.9 + u * .5; J.torso.rotation.x = .3 - u * .2; J.armL.rotation.set(-.6, 0, .1); J.foreL.rotation.x = -.7; }
  else if (act === 'hoe') MO.play(a, 'swing', ph * .7);
  else if (act === 'dance') { MO.play(a, 'stand', ph); J.armL.rotation.set(-2.5 + Math.sin(ph * 3) * .4, 0, .5); J.armR.rotation.set(-2.5 - Math.sin(ph * 3) * .4, 0, -.5); J.foreL.rotation.x = J.foreR.rotation.x = -.4; J.hips.position.y += Math.abs(Math.sin(ph * 5.2)) * .07; J.legL.rotation.x = -Math.max(0, Math.sin(ph * 2.6)) * .6; J.shinL.rotation.x = Math.max(0, Math.sin(ph * 2.6)) * .9; }
  else if (act === 'sweep') { MO.play(a, 'stand', ph); const u = Math.sin(ph * 3.2); J.torso.rotation.set(.3, u * .35, 0); J.armL.rotation.set(-.9, 0, -.2); J.armR.rotation.set(-.7, 0, .2); J.foreL.rotation.x = J.foreR.rotation.x = -.5; }
  else if (act === 'water') { MO.play(a, 'stand', ph); J.torso.rotation.x = .22; J.armR.rotation.set(-1 + Math.sin(ph * 2) * .15, 0, -.1); J.foreR.rotation.x = -.5; }
  else if (act === 'pray') { MO.play(a, 'stand', ph); J.armL.rotation.set(-.9, 0, -.45); J.armR.rotation.set(-.9, 0, .45); J.foreL.rotation.x = J.foreR.rotation.x = -1.5; J.head.rotation.x = .25; }
  else if (act === 'watch') MO.play(a, tt > 24.9 && tt < 26.8 ? 'cheer' : n.i % 2 ? 'look' : 'wave', ph);
  else if (act === 'wave') MO.play(a, 'wave', ph * .8); else if (act === 'look') MO.play(a, 'look', ph); else MO.play(a, 'stand', ph);
  // ミーナ：話すときの手ぶり
  if (n === mina && tt > 8.6 && tt < 15.2) { const g = Math.sin(t * 4) * .5 + .5; J.armR.rotation.set(-.7 - g * .4, 0, -.35); J.foreR.rotation.x = -1.1 - g * .5; J.head.rotation.z = Math.sin(t * 1.7) * .08; if (tt > 11.9) J.head.rotation.x = .12; }
}

// ---- まものの動き ----
function moveFoes(tt, t, dt) { const field = tt >= 32.4 && tt < 40.2;
  for (const f of foes) { const p = FOE0[f.i], e = f.e; if (!field) { e.visible = false; f.on = false; continue; } if (!f.on && f.deadT < 0) { f.on = true; e.visible = true; }
    f.showT -= dt; let x = lerp(p[0], p[2], seg(tt, 32.4, 33.9)), z = lerp(p[1], p[3], seg(tt, 32.4, 33.9)); const q = FOEQ[f.i]; if (q) { const k = seg(tt, 35.2, 36.1); x = lerp(x, QC[0] + q[0], k); z = lerp(z, QC[1] + q[1], k); }
    if (f.i === 6) { const k = seg(tt, 36.6, 36.9) - seg(tt, 37, 37.3); x = lerp(x, norn.x + 1, k); z = lerp(z, norn.z - .2, k); }
    if (f.hp <= 0 && f.deadT >= 0) { f.deadT += dt; x += (f.i < 3 || f.i === 5 ? -1 : 0) * Math.min(1.6, f.deadT * 5); if (f.on && f.deadT > .55) { F.dust(V(x, .3, z), { n: 6, s: 1.1, c: f.beast ? '#a880d8' : '#ffc890' }); f.on = false; e.visible = false; } }
    f.x = x; f.z = z; const hop = f.hp > 0 ? Math.abs(Math.sin(t * 5 + f.i * 1.3)) * (f.beast ? .06 : .16) : 0; e.position.set(x, hop, z);
    const moving = (tt < 33.9) || (q && tt > 35.2 && tt < 36.1); if (f.d.name === 'idle' && moving) f.d.name = 'walk'; else if (f.d.name === 'walk' && !moving) f.d.name = 'idle';
    const tg = tt > 35.3 && q ? ALLY[f.i % 3] : hero; let d = Math.atan2(tg.x - x, tg.z - z) - e.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); e.rotation.y += d * Math.min(1, snapAll ? 1 : dt * 6); f.d.update(dt); }
  if (tt >= 36.55 && prevT < 36.55) foes[6].d.set('attack'); }
let prevT = 0;

// ---- ける物の動き（時刻だけで決まる）----
function moveProps(tt, t) {
  const tb = tt - KICK.barrel, k = cl(tb / .28), dd = tb > 0 ? 4.2 * (1 - Math.exp(-tb * 2)) : 0; barrel.position.set(BR0[0] + BRD[0] * dd, lerp(.475, .36, k) + Math.sin(k * PI) * .4, BR0[1] + BRD[1] * dd); bTilt.rotation.z = -k * PI / 2; bMesh.rotation.y = dd / .36;
  const ts = tt - KICK.sign; sign.rotation.y = .5 + (ts > 0 ? 15 * (1 - Math.exp(-ts * 1.5)) : 0); sign.rotation.z = ts > 0 ? Math.sin(ts * 20) * .2 * Math.exp(-ts * 3) : 0;
  loot.forEach((s, i) => { const on = tb > 0 && tb < 1.15; s.visible = on; if (!on) return; const a = i * 1.3 + .4, u = Math.min(tb, .7), px = BR0[0] + Math.cos(a) * u * 1.6, pz = BR0[1] + .3 + Math.sin(a) * u * 1.2, py = Math.max(.14, .5 + u * 4.4 - u * u * 8.2), k2 = ease(cl((tb - .75 - i * .04) / .3)); s.position.set(lerp(px, hero.x, k2), lerp(py, 1, k2), lerp(pz, hero.z, k2)); });
}

// ---- カメラ：町では主役のななめうしろ。会話と けっとうの前後は顔の見える寄り。CUTS2 の時刻では ぱっと切りかえる ----
const CUTS2 = [3.4, 4.9, 8.5, 11.9, 15.3, 17.15, 18, 19.3, 24.85, 30.4, 32.4, 33.9, 35.3, 36, 38.5, 40.2], cp = V(0, 0, 0), cq = V(0, 0, 0), wp = V(0, 0, 0), wl = V(0, 0, 0);
function camWant(tt, t) { const hp = hero, tall = innerWidth < innerHeight;
  const follow = (yaw, D, h, ly, ahead = 1.4) => { wp.set(hp.x + Math.sin(yaw) * D, h, hp.z + Math.cos(yaw) * D); wl.set(hp.x - Math.sin(yaw) * ahead, ly, hp.z - Math.cos(yaw) * ahead); };
  const two = (A, Bp, side, back, h, off, aim, ly) => { const ax = Bp.x - A.x, az = Bp.z - A.z, L = Math.hypot(ax, az) || 1, ux = ax / L, uz = az / L; wp.set(A.x - ux * back + uz * side * off, h, A.z - uz * back - ux * side * off); wl.set(lerp(A.x, Bp.x, aim), ly, lerp(A.z, Bp.z, aim)); };
  let far = tall ? 1.14 : 1;
  if (tt < 3.4) follow(-PI / 2 + .12, 4.8, 2.2, 1.1, 2.4);
  else if (tt < 4.9) follow(-PI / 2 + .7, 4.2, 1.9, .9, 1.6);
  else if (tt < 8.5) follow(-PI / 2 + lerp(.3, .1, seg(tt, 6.6, 8.4)), 4.6, 2.2, 1.1, 2.2);
  else if (tt < 11.9) two(hp, mina, -1, 2.1, 1.55, 1.6, .8, .85);
  else if (tt < 15.3) { two(hp, mina, -1, -.3, 1.3, .85, 1, 1); far = tall ? 1.1 : 1; }
  else if (tt < 17.15) follow(-PI / 2 + .75, 4.1, 2, 1);
  else if (tt < 18) { two(hp, gan, -1, 1, 1.6, 1, 1, 1.2); far = tall ? 1.12 : 1; }
  else if (tt < 19.3) { wp.set(-1.5, 1.6, 4.9); wl.set(.5, .95, -.6); }
  else if (tt < 24.85) { const mx = (hp.x + gan.x) / 2, mz = (hp.z + gan.z) / 2; wp.set(mx + Math.sin(t * .5) * .5, 1.45 + hp.y * .25, mz + 4.3); wl.set(mx, 1 + hp.y * .4, mz); }
  else if (tt < 26.7) { two(hp, gan, -1, .9, 1.65, 1.5, 1, 1.4); far = tall ? 1.12 : 1; }
  else if (tt < 30.4) two(hp, gan, -1, 2.3, 1.6, 1.9, .6, .95);
  else if (tt < 32.4) { wp.set(3.3, 1.9, 2.3); wl.set(6.5, 1, 7.4); }
  else if (tt < 33.9) follow(PI / 2 - .2, 5.8, 3.3, .6, 2.4);
  else if (tt < 35.3) follow(PI / 2 - 1, 6.2, 2.3, .9, .3);
  else if (tt < 36) follow(-PI / 2 + .35, 5, 2.6, 1, 2);
  else if (tt < 38.5) { wp.set(-54.6, 3.5, 3.4); wl.set(QC[0] + .4, .6, 0); }
  else if (tt < 40.2) { wp.set(-42.6, 1.5, .5); wl.set(-45.6, 1.05, .1); }
  else follow(-PI / 2 + .25, 5.4, 2.6, 1.2, 2.6);
  if (far !== 1) wp.lerpVectors(wl, wp, far); }
function moveCam(tt, t, dt, snap) { camWant(tt, t); const fast = (tt > 19.3 && tt < 24.85) || (tt > 33.9 && tt < 35.3), k = snap ? 1 : 1 - Math.exp(-dt * (fast ? 7 : 3.2)); cp.lerp(wp, k); cq.lerp(wl, k);
  shake = Math.max(0, shake - dt * 1.7); cam.position.set(cp.x + Math.sin(t * 71) * shake * .08, cp.y + Math.sin(t * 93) * shake * .08, cp.z); cam.lookAt(cq); }

reset();
const step = (tt, t, dt, snap) => { for (const [tm, fn] of EV) if (tm > prev && tm <= tt) fn(tm); const cutNow = snap || CUTS2.some(c => c > prev && c <= tt); if (cutNow) snapAll = true; prevT = prev; prev = tt;
  moveHero(tt, t, dt); for (const n of NPC) moveNPC(n, tt, t, dt); moveFoes(tt, t, dt); moveProps(tt, t); moveCam(tt, t, dt, cutNow); for (const p of [hero, ...ALLY]) p.hpShow += (p.hp - p.hpShow) * Math.min(1, dt * 2.5); snapAll = false; };
K.loop((dt, t) => {
  const tt = (t + T0) % LOOP; let snap = false; if (tt < prev) { reset(); snap = true; if (prev > 1e8 && T0 > 0) { prev = -1; for (let s = 0; s < T0 % LOOP; s += 1 / 30) { step(s, s, 1 / 30, s === 0); F.update(1 / 30); H.begin(); H.end(1 / 30); } } else prev = -1; }
  step(tt, t, dt, snap);
  // 光と空：時刻で変わる。夕方は家の窓に 3 組ずつ あかりが付き、街灯がともる
  const h = clock(tt); light(h); const fx = (cp.x + cq.x) / 2, fz = (cp.z + cq.z) / 2; sun.position.set(fx + sunOff.x, sunOff.y, fz + sunOff.z); sun.target.position.set(fx, 0, fz);
  [18.15, 18.55, 18.95].forEach((lh, i) => { const on = h >= lh; dayM[i].visible = !on; litM[i].visible = on; }); const dusk = cl((h - 17.9) / 1.2); lampL.forEach(l => { l.intensity = dusk * 16; });
  for (const c of clouds) c.material.color.lerpColors(c1.set('#ffffff'), c2.set('#ffb49a'), cl((h - 17) / 1.6));
  // じん形の線
  setLines(links(tt), .2 + Math.sin(t * 14) * .04, t);
  dagger.visible = tt >= 32.4 && tt < 40.2;
  fountain.userData.tick(t); FT.tick(t);
  if (flash.userData.t !== undefined) { flash.userData.t += dt; flash.intensity = Math.max(0, 1 - flash.userData.t / .35) * 26; }
  crt.u.bright.value = Math.min(1, tt / .4, (LOOP - tt) / .5, Math.abs(tt - 30.4) / .3, Math.abs(tt - 32.4) / .3, Math.abs(tt - 40.2) / .35);
  F.update(dt); drawHud(tt, t, dt); crt.render(scene, cam, t);
});
