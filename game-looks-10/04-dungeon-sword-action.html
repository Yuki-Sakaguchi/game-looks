  [4.35, () => foes[2].d.set('attack')], [13.65, () => foes[2].d.set('attack')],

  [9.9, t => { S.sel = 0; S.selT = 0; say('いやしのみずを のんだ', t, 1.8); }],

for (const f of foes) f.hpMax = 0; for (const [, fi] of COMBOS) foes[fi].hpMax += DMG[0] + DMG[1] + DMG[2];
function reset() { F.clear(); Object.assign(S, { hp: 96, hpShow: 96, wet: .62, xp: .1, xpShow: .1, lv: 2, wear: .3, items: [3, 1, 5, 2], shake: 0, hurtT: 9, flashT: 9, msg: null, lvT: -9, sel: -1, selT: 9, gain: 9 }); for (const o of ORB) { o.on = false; o.s.visible = false; }

// ---- 主役の動き ----
function poseHero(tt, t, dt) {

  const cb = COMBOS.find(c => tt >= c[0] && tt < c[0] + 1.5), gd = GUARD.find(g => tt >= g[0] && tt < g[1]), hop = HOPS.find(h => tt >= h[0] && tt < h[1]);

    if (i === 0) { J.armR.rotation.set(-1.35, 0, -1.2 + w * 2); J.foreR.rotation.x = -.25; J.torso.rotation.set(.18, .6 - w * 1.2, 0); }
    else if (i === 1) { J.armR.rotation.set(-1.35, 0, .8 - w * 2); J.foreR.rotation.x = -.25; J.torso.rotation.set(.18, -.6 + w * 1.2, 0); }
    else { J.armR.rotation.set(-3 + w * 2.5, 0, -.15); J.foreR.rotation.x = -.6 + w * .45; J.torso.rotation.set(-.3 + w * .75, 0, 0); J.head.rotation.x = -.2 + w * .3; hero.position.y = Math.sin(cl(p / .5) * PI) * .28; }
    hero.position.x += Math.sin(yaw) * lunge * .12; hero.position.z += Math.cos(yaw) * lunge * .12; }
  if (gd) { const k = Math.min(seg(tt, gd[0], gd[0] + .2), 1 - seg(tt, gd[1] - .2, gd[1])); MO.squat(hero, .18 + k * .22); J.legL.rotation.x -= .35; J.legR.rotation.x += .35; J.shinR.rotation.x += .2; J.armL.rotation.set(-.7 - k * .75, 0, .12 - k * .6); J.foreL.rotation.x = -1.05 - k * .35; J.armR.rotation.set(-.75 + k * 1, 0, -.3 - k * .2); J.torso.rotation.set(k * .22, -k * .35, 0); J.head.rotation.x = -k * .1; }

  if (tt >= ITEM[0] && tt < ITEM[1]) { const k = Math.min(seg(tt, ITEM[0], ITEM[0] + .3), 1 - seg(tt, ITEM[1] - .3, ITEM[1])); J.armL.rotation.set(-.7 - k * 1.6, 0, .12 - k * .4); J.foreL.rotation.x = -1.05 - k * .6; J.head.rotation.x = -k * .4; J.torso.rotation.x = -k * .12; J.armR.rotation.set(-.2, 0, -.25); J.foreR.rotation.x = -.3; }

function moveFoes(tt, t, dt) {

function moveOrbs(tt, dt) { S.gain += dt; for (const o of ORB) { if (!o.on) continue; o.age += dt; if (o.age < 0) continue; const a = o.age, fa = Math.min(a, .55), s = o.s; s.visible = true; s.position.copy(o.from).addScaledVector(o.v, fa * .6); s.position.y = Math.max(.15, o.from.y + o.v.y * fa - 9 * fa * fa);

// ---- 画面の表示 ----
const bits = (rows, x, y, map, sc = 1) => rows.forEach((r, j) => [...r].forEach((ch, i) => { const c = map[ch]; if (c) H.rect(x + i * sc, y + j * sc, sc, sc, c); }));
const KEY = ['.kkkk.........', 'kwwwwk........', 'kw..wkkkkkkkk.', 'kw..wwwwwwwwwk', 'kw..wkkkwkwkk.', 'kwwwwk.kwkwk..', '.kkkk...k.k...'], KEYC = { k: '#101824', w: '#e8ecf8' };

  { const r = H.place('左上', 94, 63, 0, top), bx = r.x + 46, bw = r.w - 52; H.win(r.x, r.y, r.w, r.h, WIN);
    H.icon('heart', r.x + 5, r.y + 6, { c: '#ff6a6a' }); H.text('いのち', r.x + 14, r.y + 4, { size: 8 }); H.bar(bx, r.y + 6, bw, 6, S.hp / 120, { v2: S.hpShow / 120, c: S.hp < 40 ? B.PAL.warn : B.PAL.hp });
    H.icon('drop', r.x + 5, r.y + 17, { c: '#7ad8ff' }); H.text('うるおい', r.x + 14, r.y + 15, { size: 8 }); H.bar(bx, r.y + 17, bw, 6, S.wet, { c: '#58b8ff' });
    H.rect(r.x + 4, r.y + 27, r.w - 8, 1, '#f0e8d8', .35); H.icon('sword', r.x + 6, r.y + 32, { c: tt - S.lvT < 2.4 && Math.floor(t * 10) % 2 ? '#ffe070' : '#e8ecf8', scale: 2 });
    H.text('つるぎ', r.x + 24, r.y + 29, { size: 8, c: B.PAL.gold }); H.num('LV' + S.lv, r.x + r.w - 6, r.y + 31, { align: 'r', small: true, c: tt - S.lvT < 2.4 ? '#ffffff' : B.PAL.gold });
    H.text('つよさ', r.x + 24, r.y + 39, { size: 8 }); H.bar(bx + 6, r.y + 41, bw - 6, 5, S.xpShow, { c: S.gain < .25 ? '#ffffff' : '#ffd040' }); H.text('きず', r.x + 24, r.y + 49, { size: 8 }); H.bar(bx + 6, r.y + 51, bw - 6, 5, S.wear, { c: '#e8743a' }); }
  // 右上：階の数と小さな地図
  { const r = H.place('右上', 60, 60, 0, top), mx = r.x + 5, my = r.y + 17; H.win(r.x, r.y, r.w, r.h, WIN); H.text('ちか 3かい', r.x + r.w / 2, r.y + 4, { size: 8, align: 'c', c: B.PAL.gold });
    H.rect(mx, my, 50, 38, '#0c0e1c'); H.rect(mx + 9, my + 9, 28, 22, '#5a6aa0'); H.rect(mx + 10, my + 10, 26, 20, '#2a3260'); H.rect(mx + 19, my + 30, 8, 8, '#2a3260'); H.rect(mx + 18, my + 31, 1, 7, '#5a6aa0'); H.rect(mx + 27, my + 31, 1, 7, '#5a6aa0');
    const op = tt > 31.2; H.rect(mx + 29, my + 6, 3, 4, op ? '#2a3260' : '#c8803c'); for (let i = 0; i < 22; i += 2) { H.rect(mx + 20 + i, my + 1, 1, 1, '#5a6aa0', op ? 1 : .5); if (i < 6) { H.rect(mx + 20, my + 1 + i, 1, 1, '#5a6aa0', op ? 1 : .5); H.rect(mx + 41, my + 1 + i, 1, 1, '#5a6aa0', op ? 1 : .5); } }
    const mp = (x, z) => [mx + 10 + cl((x + 8) / 16) * 25, my + 10 + Math.min(27, Math.max(0, (z + 8) / 16) * 19)]; if (tt < 26.6) { const [cx, cy] = mp(-1.5, -6.3); H.rect(cx, cy, 2, 2, '#ffd040'); }

  // 右下：道具のショートカット（十字にならぶ 4 つの枠）

    SLOT.forEach(([ic, c], i) => { const x = r.x + SP[i][0], y = r.y + SP[i][1], on = S.sel === i && S.selT < 1.1; H.win(x, y, 18, 18, on ? { c: '#b88a2a', c2: '#6a4a1a', edge: '#ffffff' } : WIN); H.icon(ic, x + 5, y + 4, { c }); H.num('x' + S.items[i], x + 16, y + 11, { small: true, align: 'r', c: on ? '#ffffff' : '#e8e4f4' }); }); }
  if (S.msg && tt < S.msg.until) H.msg(S.msg.text, tall ? '下' : '上', { dy: tall ? -62 : 14, ...WIN });

// ---- カメラ：少し高めのうしろから。向きは変えず、主役について行く ----
const hc = V(), cp = V(), ct = V();

  const pan = seg(tt, 31, 31.8) * (1 - seg(tt, 33.6, 35.2)), fx = hc.x + ((tall ? 4.2 : (hc.x + 4.2) / 2) - hc.x) * pan, back = cl((-1.6 - hc.z) / 3);

reset();
K.loop((dt, t) => {
  const tt = (t + T0) % LOOP; if (tt < prev) { reset(); if (prev > 1e8 && T0 > 0) { S.quiet = true; for (const [tm, fn] of EV) if (tm <= T0) fn(tm); S.quiet = false; if (S.xp >= .999) { S.xp -= 1; S.lv++; S.wear = .08; } S.hpShow = S.hp; S.xpShow = S.xp; S.msg = null; S.sel = -1; prev = T0; } else prev = -1; }

  for (const [tm, fn] of EV) if (tm > prev && tm <= tt) fn(tm);
  prev = tt; moveOrbs(tt, dt); moveCam(tt, t, dt); snap = false;
  const co = seg(tt, 26.4, 27.2); chest.userData.lid.rotation.x = -co * 1.9; chestGlow.visible = chestIn.visible = co > .05; chestGlow.material.opacity = co * (.5 + Math.sin(t * 5) * .08); chestL.intensity = co * 9;
