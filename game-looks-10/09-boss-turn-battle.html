      if (dead) H.text('こわれた', r.x + r.w - 7, y, { size: 8, align: 'r', c: '#8088a0' }); else if (core) H.text('じゃくてん', r.x + r.w - 7, y, { size: 8, align: 'r', c: blink ? '#ffe060' : '#ff9a50' }); else H.bar(r.x + 62, y + 2, r.w - 69, 5, hpB(id, tt) / PART[id].max, { c: '#e8a040', back: '#3a2028' }); }); }
  if (msg && tt < msg.until) H.msg(msg.text, tall ? '上' : '右上', { dy: top + (tall ? 24 : 20), c: '#3a2a5e' });
  if (banner) H.banner(banner.text, (tt - banner.t0) / banner.len, { sub: banner.sub, c: banner.c, y: tall ? H.H * (banner.low ? .74 : .22) : banner.low ? 124 : 50 });
  H.end(dt);
}

// ---- カメラ：ななめ上からの引きが基本。形態の変化で寄り、きはくわざ では人のまわりを回って、とぶ所を下から見上げる ----
const cp = V(), ct = V(), p2 = V(), t2 = V(), DBG = (QS.get('cam') || '').split(',').map(Number);
function moveCam(tt, t, dt) {
  const tall = innerWidth < innerHeight, Z = tall ? 1.3 : 1, hp = haga.a.position;
  if (tall) { cp.set(6.4 + Math.sin(t * .2) * .3, 4.7, 10.2); ct.set(-1, 1.15, -.9); } else { cp.set(.5 + Math.sin(t * .2) * .3, 1.9, 12.4); ct.set(.5, 1.32, .4); }
  { const w = 1 - seg(tt, 0, 2.2), k = Math.max(seg(tt, 6, 6.7) - seg(tt, 7.4, 8.1), seg(tt, 36, 36.7) - seg(tt, 37.4, 38.2)); cp.z += w * 1.8 + k * (tall ? 0 : 1.6); ct.y += w * .7 + k * (tall ? 0 : .3); }
  // 力をためる所と、形態が変わる所で、味方の頭の上からボスへ寄る
  { const w = Math.max(seg(tt, 19, 19.9) - seg(tt, 21.4, 22.2), (seg(tt, 12.6, 13.2) - seg(tt, 13.2, 13.8)) * .4); if (w > 0) { p2.copy(bp).addScaledVector(FW, 12 * Z).addScaledVector(SD, -.6); p2.y = 4.6; t2.copy(bp); t2.y = tall ? 2.2 : 2.5; cp.lerp(p2, w); ct.lerp(t2, w); } }
  // きはくわざ：ハガネの前から右へ回る → 味方の肩ごしに、かけよるハガネを追う → とぶ所を横の低い所から見上げる → もとへ
  if (tt >= 24 && tt < 26.2) { const a = FACE_P + .15 + seg(tt, 24, 26.2) * 1.05, d = tall ? 4.8 : 3.5; cp.set(hp.x + Math.sin(a) * d, .7 + seg(tt, 24, 26.2) * .5, hp.z + Math.cos(a) * d); ct.set(hp.x, tall ? 1 : 1.12, hp.z); }
  else if (tt >= 26.2 && tt < 27.62) { cp.copy(bp).addScaledVector(FW, 13.2 * Z).addScaledVector(SD, -1.6); cp.y = 1.3; ct.copy(bp).addScaledVector(FW, 2); ct.y = tall ? 1.8 : 2.3; }
  else if (tt >= 27.62 && tt < 30.6) { const w = 1 - seg(tt, 29.7, 30.6); p2.copy(bp).addScaledVector(FW, 3.6).addScaledVector(SD, -11.5 * Z); p2.y = 1; t2.copy(bp).addScaledVector(FW, 2); t2.y = tall ? 2.6 : 3.1; cp.lerp(p2, w); ct.lerp(t2, w); }
  shake = Math.max(0, shake - dt * 1.6); cp.x += Math.sin(t * 71) * shake * .09; cp.y += Math.sin(t * 93) * shake * .09;
  if (DBG.length >= 6) { cp.set(DBG[0], DBG[1], DBG[2]); ct.set(DBG[3], DBG[4], DBG[5]); }
  cam.position.copy(cp); cam.lookAt(ct);
}

// はじめに 1 度、ふだんの姿のボスから「ハサミの位置」と「コアの前の立ち位置」を取る
boss.position.copy(BH); GB.pose(boss, {}); DU.at('claw', clawHome); PC.copy(BH).addScaledVector(FW, 4.1); PC2.copy(BH).addScaledVector(FW, 3.5);
K.loop((dt, t) => {
  const tt = (t + T0) % LOOP; if (tt < prev) { reset(tt); prev = prev > 1e8 ? tt - .001 : -1; }
  moveBoss(tt, t, dt); moveParty(tt, t, dt);
  for (const [tm, fn] of EV) if (tm > prev && tm <= tt) fn(tm);
  prev = tt; moveCam(tt, t, dt);
  if (flash.userData.t !== undefined) { flash.userData.t += dt; flash.intensity = Math.max(0, 1 - flash.userData.t / .4) * 60; }
  if (tt > 24 && tt < 28.75 && flash.intensity < 9) { flash.position.copy(haga.a.position).setY(haga.a.position.y + 1.4); flash.intensity = 6 * seg(tt, 24, 24.6); }
  crt.u.bright.value = Math.min(1, tt / .4, (LOOP - tt) / .5);
  F.update(dt); C.update(t, cam); drawHud(tt, t, dt); crt.render(scene, cam, t);
});
