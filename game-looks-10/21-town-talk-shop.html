  const follow = (yaw, D, h, ly, ahead = 1.4) => { wp.set(hp.x + Math.sin(yaw) * D * tk, h + (tall ? .4 : 0), hp.z + Math.cos(yaw) * D * tk); wl.set(hp.x - Math.sin(yaw) * ahead, ly, hp.z - Math.cos(yaw) * ahead); };
  const two = (A, Bp, side, back, h, off, aim, ly) => { const ax = Bp.x - A.x, az = Bp.z - A.z, L = Math.hypot(ax, az), ux = ax / L, uz = az / L; const t2 = tall ? 1.08 : 1; wp.set(A.x - ux * back * t2 + uz * side * off * t2, h, A.z - uz * back * t2 - ux * side * off * t2); wl.set(lerp(A.x, Bp.x, aim), ly, lerp(A.z, Bp.z, aim)); };
  const hn = hana.position, kp = keeper.position;
  if (tt < 1.6) follow(-PI / 2 + .5, 4.3, 2.1, 1);
  else if (tt < 7.6) two(hp, hn, -1, 2.2, 1.55, 1.7, .8, .8);
  else if (tt < 9) two(hp, hn, -1, .9, 1.38, .5, 1, .86);
  else if (tt < 10.7) two(hn, hp, 1, .9, 1.4, .8, 1, .88);
  else if (tt < 13.5) two(hp, hn, 1, .2, 1.3, 3.1, .5, .75);
  else if (tt < 18.2) follow(-PI / 2 + lerp(.25, .75, seg(tt, 14, 17.5)), 4.2, 2.1, 1);
  else if (tt < 20.6) { wp.set(1.05, 1.5, IZ - .1 + (tall ? .9 : 0)); wl.set(kp.x - .25, 1.2, kp.z); }
  else if (tt < 25.25) { const u = (tt - 20.6) / 4.6; wp.set(1.5 - u * .3, 1.65, IZ + .8 + (tall ? 1 : 0)); wl.set(kp.x - (tall ? .5 : .75), tall ? 1.1 : .92, kp.z); }
  else if (tt < 27.3) { wp.set(.95, 1.4, IZ - 1.3); wl.set(hp.x - .1, tall ? 1.15 : 1.3, hp.z); }
  else if (tt < 29) { wp.set(1.05, 1.5, IZ - .1 + (tall ? .9 : 0)); wl.set(kp.x - .25, 1.2, kp.z); }
  else if (tt < 31.4) follow(lerp(-PI / 2 + .9, .35, seg(tt, 29.6, 31.4)), 4.2, 2.1, 1);
  else if (tt < 36.9) follow(lerp(.35, .6, seg(tt, 31.4, 36)), lerp(4.2, tall ? 2.6 : 3.1, seg(tt, 31.4, 33)), lerp(2.1, tall ? 1.3 : 1.6, seg(tt, 31.4, 33)), .8, 1.2);
  else { wp.set(13.7, 1.25, -4.3 + (tall ? .5 : 0)); wl.set(lerp(hp.x, catP.x, tall ? .45 : .7), .8, lerp(hp.z, catP.z, tall ? .45 : .7)); } }
function moveCam(tt, t, dt, snap) { camWant(tt, t); const k = snap ? 1 : 1 - Math.exp(-dt * 3.2); cp.lerp(wp, k); cl2.lerp(wl, k); cam.position.copy(cp); cam.lookAt(cl2); }

reset();
const step = (tt, t, dt, snap) => { for (const [tm, fn] of EV) if (tm > prev && tm <= tt) fn(tm); const cut = snap || CUTS.some(c => c > prev && c <= tt); prev = tt; moveHero(tt, t, dt, snap); moveTown(tt, t, dt); moveCam(tt, t, dt, cut); };
K.loop((dt, t) => {
  const tt = (t + T0) % LOOP; let snap = false; if (tt < prev) { reset(); snap = true; if (prev > 1e8 && T0 > 0) { prev = -1; for (let s = 0; s < T0 % LOOP; s += 1 / 30) { step(s, s, 1 / 30, s === 0); F.update(1 / 30); drawHud(s, s, 1 / 30); } } else prev = -1; }
  step(tt, t, dt, snap);
  // 外と店の中を切りかえる（光と空も）
  const inn = inside(tt); OUT.visible = sky.visible = !inn; INN.visible = inn; scene.fog = inn ? null : FOG; scene.background = inn ? new THREE.Color('#1c1210') : null; sun.intensity = inn ? .6 : 2.7; hemi.intensity = inn ? 1 : 1.5; shopL.intensity = inn ? 11 : 0; shopL.position.set(.2, 2.5, IZ - .2);
  if (inn) { sun.position.set(3, 16, IZ + 9); sun.target.position.set(0, 0, IZ - 1); } else { sun.position.set(hp.x - 24, 22, hp.z + 16); sun.target.position.set(hp.x, 0, hp.z); }
  fountain.userData.tick(t); FT.tick(t);
  crt.u.bright.value = Math.min(1, tt / .4, (LOOP - tt) / .5, Math.abs(tt - 18.2) / .45, Math.abs(tt - 29) / .45);
  F.update(dt); drawHud(tt, t, dt); crt.render(scene, cam, t);
});
</script>
