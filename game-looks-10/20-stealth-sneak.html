  if (tall) { cam.position.set(cf.x - 4.3, 8.2, cf.z + 5.6); cam.lookAt(cf.x + .9, .6, cf.z - .9); } else { cam.position.set(cf.x, 6.8, cf.z + 5.9); cam.lookAt(cf.x, .55, cf.z - .7); }
}

let prev = 1e9;
K.loop((dt, t) => {
  const tt = (t + T0) % LOOP; if (tt < prev) { F.clear(); snap = true; ST.got = ST.noise = 9; prev = prev > 1e8 ? tt - .001 : -1; }
  ST.got += dt; ST.noise += dt; moveHero(tt, t, dt); moveGuards(tt, t, dt);
  for (const [tm, fn] of EV) if (tm > prev && tm <= tt) fn(tm);
  prev = tt; moveCam(tt, t, dt); snap = false;
  R.catPose(cat, 'sit', t);
  crt.u.bright.value = Math.min(1, tt / .4, (LOOP - tt) / .5);
  F.update(dt); C.update(t, cam); D.tick(t, cam); drawHud(tt, t, dt); crt.render(scene, cam, t);
});
