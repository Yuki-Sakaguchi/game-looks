  S.hpShow += (S.hp - S.hpShow) * Math.min(1, dt * 2.5); if (S.hpShow - S.hp < .5) S.hpShow = S.hp; S.moneyShow = Math.min(S.money, S.moneyShow + dt * 60); S.en = Math.min(1, S.en + dt * (ch ? 0 : .16));
  // ロックオンの印と、相手の名前・体力
  if (foe) { const c = center(foe, tmp), s0 = H.project(c), s1 = H.project(tmp2.copy(c).setY(c.y + (foe.e.userData.fly ? foe.e.userData.r * 1.3 : foe.e.userData.h * .5))), r = cl(Math.abs(s1.y - s0.y) * 1.25, 9, tall ? 40 : 46), k = cl((tt - lk[0]) / .4);
    H.lock(s0.x, s0.y, r, t, { tight: ease(k), c: ch ? (Math.floor(t * 10) % 2 ? '#ffffff' : '#ff8a5a') : '#ffd040' }); H.tag(s0.x, s0.y - r - 10, foe.name, foe.hp / foe.hpMax, { w: 34 });
    if (tt - lk[0] < .9 && Math.floor((tt - lk[0]) * 8) % 2 === 0) H.text('ロックオン', s0.x, s0.y + r + 7, { align: 'c', size: 8, c: '#ffd040', outline: '#080814' }); }
  // 左：体力の たてゲージと、武器のエネルギー
  { const gh = tall ? 92 : 74, r = H.place('左', 31, gh + 26, 0, tall ? 30 : 8); H.win(r.x, r.y, r.w, r.h, { c: '#1e5a5a', c2: '#123040', edge: '#e8f4e0' });
    H.icon('heart', r.x + 5, r.y + 5, { c: '#ff6a6a' }); H.vbar(r.x + 5, r.y + 14, 9, gh, S.hp / 100, { v2: S.hpShow / 100, ticks: 5, c: S.hp < 40 ? B.PAL.warn : B.PAL.hp });
    H.icon('bolt', r.x + 19, r.y + 4, { c: '#8af8e8' }); H.vbar(r.x + 19, r.y + 14, 6, gh, ch ? cv : S.en, { c: ch && Math.floor(t * 12) % 2 ? '#ffffff' : '#6ae8d8', ticks: 4 });
    H.num(String(Math.round(S.hp)), r.x + r.w / 2, r.y + gh + 17, { small: true, align: 'c', c: '#e8f4e0' }); }
  // 右上：拾ったお金（光るつぶ）の数
  { const r = H.place('右上', 60, 16, 0, tall ? 26 : 13), up = S.gain < .25; H.win(r.x, r.y, r.w, r.h, { c: '#1e5a5a', c2: '#123040', edge: '#e8f4e0' }); bits(GEM, r.x + 5, r.y + 4, GEMC); H.num(String(Math.round(S.moneyShow)).padStart(5, '0'), r.x + r.w - 6, r.y + 5 - (up ? 1 : 0), { align: 'r', c: up ? '#ffffff' : B.PAL.gold }); }
  // 右下：武器の絵と、ための段
  { const r = H.place('右下', 66, 33, 0, 0); H.win(r.x, r.y, r.w, r.h, { c: '#1e5a5a', c2: '#123040', edge: '#e8f4e0', title: 'ぶき' }); bits(GUN, r.x + 6, r.y + 8, GUNC); if (ch) H.rect(r.x + 6 + 17, r.y + 10, 4, 4, Math.floor(t * 14) % 2 ? '#ffffff' : '#ffd040');
    H.text('うでづつ', r.x + 34, r.y + 7, { size: 8, c: '#e8f4e0' }); for (let i = 0; i < 3; i++) { const on = ch ? cv > (i + .5) / 3 : false; H.rect(r.x + 6 + i * 9, r.y + 21, 8, 6, '#080814'); H.rect(r.x + 7 + i * 9, r.y + 22, 6, 4, on ? '#ffd040' : '#2a4a50'); if (on) H.rect(r.x + 7 + i * 9, r.y + 22, 6, 1, '#fff4c0'); }
    H.text(ch ? 'ため' : 'れんしゃ', r.x + 34, r.y + 19, { size: 8, c: ch ? '#ffd040' : '#8af8e8' }); }
  if (S.msg && tt < S.msg.until) H.msg(S.msg.text, '下', { dy: -8, c: '#1e5a5a', c2: '#123040', edge: '#e8f4e0' });
  H.end(dt);
}

// ---- カメラ：主役のうしろ。ロックオン中は、相手と主役が両方入るよう、相手と主役をむすぶ線の先へ回る ----
const aim = V(), aimT = V(0, 1, -2), hc = V(), cp = V(), cpT = V(), ct = V(), dir = V();
function moveCam(tt, t, dt) {
  const tall = innerWidth < innerHeight, lk = lockAt(tt), k1 = snap ? 1 : 1 - Math.exp(-dt * 5); if (lk[1] >= 0 && !foes[lk[1]].gone) center(foes[lk[1]], aimT); else if (tt < 1.6) center(foes[WA], aimT);
  aim.lerp(aimT, k1); hc.lerp(hp0, snap ? 1 : 1 - Math.exp(-dt * 9)); dir.set(hc.x - aim.x, 0, hc.z - aim.z); const len = dir.length(); dir.normalize();
  const D = tall ? 4 : 4.5, sd = tall ? .3 : 1.15; cpT.set(hc.x + dir.x * D + dir.z * sd, tall ? 2.7 : 2.35, hc.z + dir.z * D - dir.x * sd); cp.lerp(cpT, snap ? 1 : 1 - Math.exp(-dt * 4.5));
  const w = cl(.3 + len * .03, .35, .55); ct.set(hc.x + (aim.x - hc.x) * w, (tall ? 1.75 : 1.05) + (aim.y - 1) * .25, hc.z + (aim.z - hc.z) * w);
  S.shake = Math.max(0, S.shake - dt * 1.8); cam.position.set(cp.x + Math.sin(t * 71) * S.shake * .08, cp.y + Math.sin(t * 93) * S.shake * .08, cp.z); cam.lookAt(ct);
}

reset();
K.loop((dt, t) => {
  const tt = (t + T0) % LOOP; if (tt < prev) { reset(); if (prev > 1e8 && T0 > 0) { S.quiet = true; for (const [tm, fn] of EV) if (tm <= T0) fn(tm); S.quiet = false; S.hpShow = S.hp; S.moneyShow = S.money; prev = T0; } else prev = -1; }
  poseHero(tt, t, dt); moveFoes(tt, t, dt);
  for (const [tm, fn] of EV) if (tm > prev && tm <= tt) fn(tm);
  prev = tt; moveOrbs(dt); moveCam(tt, t, dt); snap = false;
  S.flashT += dt; flash.intensity = Math.max(0, 1 - S.flashT / .3) * S.flashK; glowL.intensity = 8 + Math.sin(t * 2.2) * 2; glyphM.color.setScalar(.82 + Math.sin(t * 2.2) * .18); bandM.color.setScalar(.8 + Math.sin(t * 1.7 + 1) * .2);
  for (const s of shafts) s.userData.tick(t); motes.userData.tick(t); for (const b of bfs) b.userData.tick(t); flock.userData.tick(t);
  crt.u.bright.value = Math.min(1, tt / .4, (LOOP - tt) / .5);
  F.update(dt); drawHud(tt, t, dt); crt.render(scene, cam, t);
});
</script>
