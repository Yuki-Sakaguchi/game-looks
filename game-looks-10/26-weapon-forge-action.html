    { const ang = (cur - curS) * PI / 2 - PI / 2, pop = Math.max(0, 1 - swapT * 5), px = Math.round(cx + Math.cos(ang) * 17 - 11), py = Math.round(cy + Math.sin(ang) * 17 - 11 - pop * 3); H.rect(px - 1, py - 1, 24, 24, pop > 0 ? '#ffffff' : ELC[W0.el]); cell(px, py, WCV[W0.ic], true, { s: 22 }); }
    const tx = r.x, ty = r.y + 6; H.text(W0.n, tx + 72, ty, { align: 'r', size: 8, c: swapT < .4 && blink ? '#ffffff' : GOLD, outline: OL }); elem(W0.el, tx + 4, ty + 13); H.text(ELN[W0.el], tx + 14, ty + 12, { size: 8, c: ELC[W0.el], outline: OL }); H.num('LV' + lv[cur], tx + 72, ty + 14, { align: 'r', small: true, c: lvT < 1.5 && blink ? '#ffe860' : '#ffffff', outline: OL });
    H.text('こわれ', tx + 2, ty + 24, { size: 8, c: low && blink ? '#ff7060' : '#c8e8dc', outline: OL }); H.bar(tx + 28, ty + 26, 44, 5, dur[cur], { c: low ? '#ff5a4a' : '#8ad0c0', ticks: 4 });
    H.text('けいけん', tx + 2, ty + 35, { size: 8, c: '#c8e8dc', outline: OL }); H.bar(tx + 36, ty + 37, 36, 5, exp[cur], { c: '#ffd040' });
    if (low && blink) H.text('こわれそう！', tx + 72, ty - 12, { align: 'r', size: 8, c: '#ff7060', outline: OL });
    if (chargeK > .1) { const s = H.project(hAt(2.3)); H.bar(s.x - 15, s.y, 30, 5, chargeK, { c: chargeK > .95 ? (blink ? '#ffffff' : '#ffe040') : '#ffb040' }); H.text('ためる', s.x, s.y - 11, { align: 'c', size: 8, c: '#ffe860', outline: OL }); } }
  if (combo > 1) { const r = H.place('右', 60, 20, 0, tall ? -40 : -30), p = Math.max(0, 1 - comboT * 6); H.num(String(combo), r.x + r.w - 30, r.y - Math.round(p * 3), { align: 'r', scale: 2, c: '#ffb060', outline: OL }); H.text('れんげき', r.x + r.w - 27, r.y + 4, { size: 8, c: '#ffffff', outline: OL }); }
  if (lvT < 2.4) { const k = Math.min(1, lvT / .15, (2.4 - lvT) / .15); if (k > .5 || blink) H.msg(LIST[[0, 3, 2, 4][cur]][0] + 'が レベル ' + lv[cur] + ' に なった！', '上', { dy: top + (tall ? 50 : 26), c: '#c8801a', c2: '#6a3a10', edge: '#fffbe0' }); }
  if (tt > TB + .5 && tt < TB + 2.6) { const k = Math.min(1, (tt - TB - .5) / .2, (TB + 2.6 - tt) / .2); if (k > .5) H.msg('こけの いせき　ちか 2 かい', '上', { dy: top + (tall ? 50 : 26), ...WIN }); }
}
function drawHud(tt, t, dt) { H.begin(); if (tt < 14.6) drawForge(tt, t); else drawBattle(tt, t, dt);
  if (banner) H.banner(banner.text, (tt - banner.t0) / banner.len, { sub: banner.sub, c: banner.c, y: H.tall ? H.H * .12 + 30 : 30 }); H.end(dt); }

// ---- カメラ ----
const CK = [[15, 0.1, 4.93, 2.35, 1], [16.4, 0.25, 4.66, 2.26, 1], [18, 0.1, 4.66, 2.35, 1], [19.8, -0.25, 4.93, 2.35, 1.1], [21.3, -0.1, 5.19, 1.97, 1.5], [22.3, 0.2, 5.46, 2.82, 1], [23.8, -0.2, 5.81, 3.01, 1], [25, -0.75, 4.93, 2.26, 1.3], [27, -0.6, 5.1, 2.35, 1.3], [28.6, -0.2, 5.28, 2.63, 1.1], [29.6, 0.5, 4.75, 2.16, 1.3], [31.4, 0.35, 4.93, 2.26, 1.3], [32.6, 0.15, 5.28, 1.97, 1.6], [33.6, 0.2, 5.63, 2.44, 1.4], [34.8, 0.5, 4.93, 2.16, 1.1], [35.8, 2.6, 3.7, 1.41, 1.05], [37.2, 2.9, 3.7, 1.41, 1.05], [39.5, 6.38, 4.93, 2.35, 1], [40, 6.38, 4.93, 2.35, 1]];

  if (tt < TB) { const ev = seg(tt, EVO + .2, EVO + 1) - seg(tt, 13.6, 14.4), px = HP.pos.x, pz = HP.pos.z, slow = Math.sin(tt * .25) * .25;
    if (tall) { cam.position.set(px - .6 + slow + sx, 2.3 - ev * .3 + sy, pz + 5.2 - ev * 1.2); cam.lookAt(px - .5, -.55 + ev * .25, pz); } else { cam.position.set(px + 1.5 + slow - ev * .4 + sx, 1.75 + sy, pz + 4.7 - ev * 1.3); cam.lookAt(px + 1.25 - ev * .45, .95 + ev * .15, pz); } cf.copy(HP.pos); return; }
  const [yaw, dist, h, ly] = key(CK, tt, 4), D = dist * (tall ? .9 : 1), w = tt > 19.8 && tt < 34 && big.on ? .22 : 0; cp.set(lerp(HP.pos.x, big.pos.x, w), HP.y * .4, lerp(HP.pos.z, big.pos.z, w)); if (snap || tt < TB + .1) cf.copy(cp); else cf.lerp(cp, Math.min(1, dt * (tt > 22.5 && tt < 23.9 ? 10 : 5)));
  let cx = cf.x + Math.sin(yaw) * D, cz = cf.z + Math.cos(yaw) * D; cx = cl(cx, -7.2, 7.2); if (cf.z < 7) cz = Math.min(cz, 7.3 + Math.max(0, 2.6 - Math.abs(cx)) * 2);
  cam.position.set(cx + sx, cf.y * .6 + h + sy, cz); cam.lookAt(cf.x - Math.sin(yaw) * 1.4, cf.y + ly + (tall ? -.25 : 0), cf.z - Math.cos(yaw) * 1.4);
}

reset();
const step = (tt, t, dt, snap) => { for (const [tm, fn] of EV) if (tm > prev && tm <= tt) fn(tm); prev = tt; moveHero(tt, t, dt); if (tt >= TB) moveFoes(tt, t, dt); moveCam(tt, t, dt, snap); };
K.loop((dt, t) => {
  const tt = (t + T0) % LOOP; if (tt < prev) { reset(); if (prev > 1e8 && T0 > 0) { prev = -1; for (let s = 0; s < T0 % LOOP; s += 1 / 30) { step(s, s, 1 / 30, true); F.update(1 / 30); drawHud(s, s, 1 / 30); } } else prev = -1; }
  step(tt, t, dt, false);
  for (const f of ticks) f(t); motes.userData.tick(t, 0, 0); forgeL.intensity = 10 + Math.sin(t * 9) * 1.5 + Math.sin(t * 23) * 1;
  if (flash.userData.t !== undefined) { flash.userData.t += dt; flash.intensity = Math.max(0, 1 - Math.max(0, flash.userData.t) / .4) * 22; }
