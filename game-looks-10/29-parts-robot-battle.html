  if (tt < TB) drawPrep(tt, t); else { const c = CMDS.find(q => tt >= q.t0 && tt < q.t1), top = tall ? 34 : 13;
    panel(H.place('左上', 64, 61, 0, top), A, 'みかた', '#22407e', t, c ? HERO : null); panel(H.place('右上', 64, 61, 0, top), E, 'あいて', '#7a2a3a', t, null); track(tt, t); if (c) cmdWin(c, tt, t);
    if (msg && tt < msg.until) H.msg(msg.text, '上', { dy: tall ? 97 : top });
    if (tt > PRIZE + 1.3 && tt < 38.8) { const q = H.place('下', 132, 30, 0, -35); H.win(q.x, q.y, q.w, q.h, { c: '#8a6418' }); chip(q.x + 7, q.y + 6, 2); H.text('はさみアーム', q.x + 17, q.y + 4, { c: GOLD }); H.text('ランタロから 1 つ もらった！', q.x + q.w / 2, q.y + 17, { size: 8, align: 'c' }); } }
  if (banner) H.banner(banner.text, (tt - banner.t0) / banner.len, { c: banner.c, y: tall ? H.H * .3 : 34 });
  H.end(dt); }

// ---- カメラ：場を横から少し見下ろす引きが基本。技のときは切りかえて寄る（たて長は、味方のうしろから） ----
const cp = V(), ct = V(), CAMQ = (new URLSearchParams(location.search).get('cam') || '').split(',').map(Number).filter(v => !isNaN(v)).length === 6 ? new URLSearchParams(location.search).get('cam').split(',').map(Number) : null;   // 確かめ用：?cam=x,y,z,tx,ty,tz でカメラを固定
const SHOTS = [[13.5, 15.6, (u, Z) => { cp.set(-.25 + u * .2, .8, .8 + 2.1 * Z); ct.set(0, .33, .8); }], [19.1, 20.38, (u, Z) => { cp.set(-.2 + u * .12, 1.25 * Z, .8 - 1.95 * Z); ct.set(0, .33, .8); }], [20.38, 21.9, (u, Z) => { cp.set(-.6 + u * .12, .78, .8 + 2 * Z); ct.set(-.08, .3, .85); }],
  [22.2, 23.4, (u, Z) => { cp.set(.5 * Z, .8, 1.45 * Z); ct.set(-.4, .36, 0); }], [23.4, 24.5, (u, Z) => { cp.set(-.7 + u * .1, .75, .8 + 1.7 * Z); ct.set(-1.95, .45, .85); }],
  [27.3, 28.95, (u, Z) => { cp.set(-1.6 - u * .08, .98, .8 + .8 * Z); ct.set(.6, .3, .72); }], [28.95, 30.3, (u, Z) => { cp.set(1.6 - 1.55 * Z, .8, 1.55 + u * .1); ct.set(1.6, .38, .9); }],
  [PRIZE + 1, 38.9, (u, Z) => { cp.set(-1.6 + u * .05, 1.05, .9 + 2.5 * Z); ct.set(-2.05, .86, 1); }]];
function moveCam(tt, t, dt) { const tall = innerWidth < innerHeight, Z = tall ? 1.3 : 1;
  if (tt < TB) { if (tall) { cp.set(Math.sin(t * .4) * .05, CR + .66, PZ + 1.85); ct.set(0, CR + .2, PZ); } else { cp.set(Math.sin(t * .4) * .06, CR + .5, PZ + 1.95); ct.set(0, CR + .3, PZ); } }
  else { if (tall) { cp.set(-4.3, 2.9, 1.7); ct.set(.3, .1, .15); } else { cp.set(Math.sin(t * .2) * .2, 2.05, 4.6); ct.set(0, .32, 0); } for (const [a, b, f] of SHOTS) if (tt >= a && tt < b) f(tt - a, Z); }
  shake = Math.max(0, shake - dt * 1.8); cp.x += Math.sin(t * 71) * shake * .03; cp.y += Math.sin(t * 93) * shake * .03; if (CAMQ) { cp.set(CAMQ[0], CAMQ[1], CAMQ[2]); ct.set(CAMQ[3], CAMQ[4], CAMQ[5]); } cam.position.copy(cp); cam.lookAt(ct); }

K.loop((dt, t) => {
  const tt = (t + T0) % LOOP; if (tt < prev) { reset(); prev = -1; }
  quiet = tt - prev > .6; for (const [tm, fn] of EV) if (tm > prev && tm <= tt) fn(tm); quiet = false; prev = tt;
  for (const r of BOTS) drive(r, tt, t, dt); moveLoose(dt);
  // 組みかえの間は、主役機を木箱の上で回して見せる。入れかえた部品は ふくらんで出る
  const prep = tt < TB, sw = tt >= SWAP; altArm.visible = !sw; HERO.P.armL.visible = sw; spare[0].visible = !sw; spare[1].visible = sw && prep; spare[2].visible = prep;
  if (prep) { const g = HERO.g, jump = tt > GO ? Math.abs(Math.sin((tt - GO) * 9)) * .1 * (1 - seg(tt, GO, GO + 1.1)) : 0; g.position.set(0, CR + jump, PZ); g.rotation.y = Math.sin(tt * 1.1) * .7 * (1 - seg(tt, 5, 5.4)) + seg(tt, 5.2, 6.9) * PI * 2 + Math.sin(tt * 1.1) * .3 * seg(tt, 6.9, 7.3);
    altArm.rotation.set(altArm.userData.rest + Math.sin(t * 2.2) * .05, 0, -.12); const pk = cl((tt - SWAP) / .45); HERO.P.armL.scale.setScalar(1 + Math.sin(pk * PI) * .4); if (sw && tt < SWAP + 2.4) HERO.P.armL.userData.spin.rotation.y += dt * 30; if (sw && tt < SWAP + 1.2) HERO.P.armL.rotation.x = lerp(1.5, HERO.P.armL.userData.rest, seg(tt, SWAP + .7, SWAP + 1.2)); } else HERO.P.armL.scale.setScalar(1);
  if (sw && prev - dt < SWAP && prep && !quiet && tt - SWAP < .1 && !HERO.swapFx) { HERO.swapFx = true; HERO.g.updateMatrixWorld(true); const p = HERO.P.armL.localToWorld(V(0, .15, 0)); F.spark(p, { c: '#fff0a0', s: .9, n: 10 }); F.ring(V(0, CR + .02, PZ), { c: '#ffe080', s: .5, life: .4 }); } if (!sw) HERO.swapFx = false;
  // もらう部品：相手のリーダーの はさみが、弧をえがいて持ち主の子の頭の上へ
  { const m = BOSS.P.armL; if (tt >= PRIZE && !prizeOut) { BOSS.g.updateMatrixWorld(true); scene.attach(m); m.userData.from = m.position.clone(); prizeOut = true; }
    if (prizeOut) { const u = seg(tt, PRIZE, PRIZE + 1), to = V(KA[0].position.x + .5, 1.02 + Math.sin(t * 3) * .03, KA[0].position.z + .15); m.position.lerpVectors(m.userData.from, to, u); m.position.y += Math.sin(u * PI) * 1.3; m.rotation.set(0, t * 2.2, -1.15); m.scale.setScalar(1.2 * (1 + u * .25)); } }
  movePeople(tt, t); moveCam(tt, t, dt);
  birds.forEach((b, i) => R.birdPose(b, 'peck', t + i * .7)); R.catPose(cat, 'sit', t);
  if (flash.userData.t !== undefined) { flash.userData.t += dt; flash.intensity = Math.max(0, 1 - flash.userData.t / .3) * 9; }
  crt.u.bright.value = Math.min(1, tt / .4, Math.abs(tt - TB) / .35, (LOOP - tt) / .5);
  F.update(dt); drawHud(tt, t, dt); crt.render(scene, cam, t);
});
