}

// ---- 主役と乗り物を動かす ----
const nrm = V(), ax = V(), ay = V(), az = V(), m4 = new THREE.Matrix4(), qa = new THREE.Quaternion(), qb = new THREE.Quaternion(), pa = V(), pb = V(), launch = V(), seat = V(), UPV = V(0, 1, 0);
// 体の上の置き場所。mode 0 = 立つ／1 = はりつく（頭が背のほう）／2 = ふせる（頭が相手の頭のほう）
function bodyPose(s, phi, mode, q, p) {
  BS.frame(spine, s, FH); const r = BS.rad(s) * (.95 + .08 * Math.sin(phi) ** 2);
  nrm.copy(FH.U).multiplyScalar(Math.cos(phi)).addScaledVector(FH.S, Math.sin(phi));
  if (mode === 0) { ay.copy(nrm); az.copy(FH.T); } else if (mode === 1) { ay.copy(FH.U).multiplyScalar(Math.sin(phi)).addScaledVector(FH.S, -Math.cos(phi)); az.copy(nrm).negate(); } else { ay.copy(FH.T); az.copy(nrm).negate(); }
  ax.crossVectors(ay, az).normalize(); az.crossVectors(ax, ay); q.setFromRotationMatrix(m4.makeBasis(ax, ay, az));
  p.copy(FH.p).addScaledVector(nrm, r + (mode ? .3 : .02)); if (mode) p.addScaledVector(ay, -.95); }
function onBody(s, phi, m0, m1, k) { bodyPose(s, phi, m0, qa, pa); if (k > 0) { bodyPose(s, phi, m1, qb, pb); qa.slerp(qb, k); pa.lerp(pb, k); } rig.quaternion.copy(qa); rig.position.copy(pa); }
function moveMount(tt, t) {
  mountAt(tt, mpos); mountAt(tt + .1, mnext); const lp1 = Math.sin(cl((tt - 10.5) / 1.1) * PI), lp2 = Math.sin(cl((tt - 34.3) / 1.1) * PI), lp = Math.max(lp1, lp2) * (tt > 10.5 && tt < 35.4 ? 1 : 0);
  mpos.y = sea.h(mpos.x, mpos.z, t) - .12 + lp * 1.5; mount.position.copy(mpos); mount.rotation.set(0, Math.atan2(mnext.x - mpos.x, mnext.z - mpos.z), 0); mount.rotateX(-(lp1 > 0 ? Math.cos(cl((tt - 10.5) / 1.1) * PI) : lp2 > 0 ? Math.cos(cl((tt - 34.3) / 1.1) * PI) : 0) * .5 * (lp > 0 ? 1 : 0));
  BS.mountPose(mount, t, { swim: 1, leap: lp }); mount.updateMatrixWorld(true); seat.set(...mount.userData.seat); mount.localToWorld(seat);
  if (Math.floor(t * 12) !== Math.floor((t - .017) * 12) && lp < .3) { tmp.copy(mpos).addScaledVector(tmp2.subVectors(mpos, mnext).normalize(), 2.2).setY(.05); F.dust(tmp, { n: 1, s: 1.3, c: '#fff2e6' }); }
}
function moveHero(tt, t, dt) {
  hero.position.set(0, 0, 0); hero.rotation.set(0, 0, 0); rig.rotation.set(0, 0, 0); sword.visible = true;
  const riding = tt < T_JUMP || tt >= T_CATCH;
  if (riding) { rig.position.copy(seat); rig.quaternion.copy(mount.quaternion); hero.position.y = -.36; const up = seg(tt, 10.2, 10.9); MO.play(hero, 'ride', t);
    if (up > 0 && tt < T_JUMP) { HJ.hips.position.y = hero.userData.hipY * (.62 + up * .2); HJ.legL.rotation.set(-1.25 + up * .5, 0, .5 - up * .4); HJ.legR.rotation.set(-1.25 + up * .5, 0, -.5 + up * .4); hero.position.y = -.36 + up * .3; HJ.torso.rotation.x = .3 + up * .25; }
    if (tt >= T_CATCH) { const k = seg(tt, T_CATCH, T_CATCH + .5); HJ.torso.rotation.x = .8 - k * .5; HJ.head.rotation.x = -.3 - seg(tt, 36, 37) * .35; HJ.head.rotation.y = -seg(tt, 36, 37) * .5; } else { HJ.head.rotation.y = -.45 + seg(tt, 6.4, 7) * .2; } }
  else if (tt < T_GRAB) { const k = (tt - T_JUMP) / (T_GRAB - T_JUMP); onBody(keys(HS, T_GRAB), .9, 1, 1, 0); launch.copy(seat); rig.position.lerpVectors(launch, pa, k); rig.position.y += Math.sin(k * PI) * 1.6; qb.copy(mount.quaternion); rig.quaternion.slerpQuaternions(qb, qa, ease(k)); MO.play(hero, 'fall', t * .4); HJ.armL.rotation.set(-2.6, 0, .3); HJ.armR.rotation.set(-2.4, 0, -.3); HJ.legL.rotation.x = -.9 * (1 - k); HJ.legR.rotation.x = .5; }
  else if (tt < T_THROW) { const s = keys(HS, tt), phi = keys(HPHI, tt), rollK = seg(tt, 16.3, 16.9) - seg(tt, 18.6, 19.2), diveK = seg(tt, 22.1, 22.7) - seg(tt, 26.6, 27.1), thK = seg(tt, 32.7, 33.1);
    const climbK = 1 - seg(tt, 14, 14.7);
    if (climbK > 0) { onBody(s, phi, 0, 1, climbK); if (tt < 12.3) { MO.play(hero, 'dangle', t); } else MO.play(hero, 'climb', t, { amp: 1 }); }
    else if (rollK > 0) { onBody(s, .12, 0, 1, rollK); MO.play(hero, rollK > .5 ? 'dangle' : 'crouch', t); if (rollK > .5) rig.rotateZ(Math.sin(t * 3.4) * .25 * rollK); }
    else if (diveK > 0 || thK > 0) { const k = Math.max(diveK, thK); onBody(s, 0, 0, 2, k); MO.play(hero, k > .4 ? 'cling' : 'crouch', t); if (thK > 0) rig.rotateY(Math.sin(t * 9) * .12 * thK); }
    else { onBody(s, phi, 0, 0, 0); let st = -1; for (const q of STABS) if (tt >= q) st = tt - q; const moving = Math.abs(keys(HS, tt + .1) - s) > .02;
      if (st >= 0 && st < 1.15) MO.play(hero, 'stab', st); else if (st >= 1.15 && st < 2.2) MO.play(hero, 'stab', 1.15 - cl((st - 1.15) / .4) * .7);
      else if (moving) { MO.play(hero, 'run', t, { speed: tt > 27 ? 1.35 : 1.1 }); HJ.torso.rotation.x += .12; } else { MO.play(hero, 'stand', t); HJ.head.rotation.x = -.2; } } }
  else { const k = (tt - T_THROW) / (T_CATCH - T_THROW); spineAt(T_THROW, keys(HS, T_THROW), launch); launch.y += BS.rad(23) + .5; rig.position.lerpVectors(launch, seat, k); rig.position.y += Math.sin(k * PI) * 5.5; rig.rotation.set(k * 9 * (1 - k * .5), 1, k * 2.5 * (1 - k)); hero.position.y = -.6; MO.play(hero, 'fall', t); }
  hw.copy(rig.position); if (riding) hw.y += .2;
}

// ---- 画面の表示（最小）：右下に にぎる力の輪（中は 手の絵）・体力・笛。相手の名前は 出たときと、ついたあとだけ ----
const HAND = ['..#.#.#....', '..#.#.#.#..', '..#.#.#.#..', '..#.#.#.#..', '#.#.#.#.#..', '#.#######..', '#########..', '#########..', '.########..', '..######...', '..######...'];
const GRAB = ['###########', '###########', '...........', '..#.#.#.#..', '#.#.#.#.#..', '#.#######..', '#########..', '#########..', '.########..', '..######...', '..######...'];
const HORN = ['......###', '....##..#', '..##...#.', '##...##..', '#..##....', '###......'];
const bits = (rows, x, y, c) => rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) if (r[i] === '#') H.rect(x + i, y + j, 1, 1, c, 1); });
function drawHud(tt, t, dt) {
  H.begin(); const tall = H.tall, grip = keys(GRIP, tt, false), r = H.place('右下', 92, 34, -2, -2), cx = r.x + r.w - 17, cy = r.y + 16, low = grip < .3, blink = low && Math.sin(t * 14) > 0, holding = tt >= T_GRAB && tt < T_THROW;
  hpShow += (hp - hpShow) * Math.min(1, dt * 1.6); bhpShow += (bhp - bhpShow) * Math.min(1, dt * 1.4);
  const gc = low ? (blink ? '#ffffff' : B.PAL.warn) : grip < .55 ? B.PAL.gold : '#f4f0dc', jx = low ? Math.round(Math.sin(t * 40)) : 0;
  H.ring(cx + jx, cy, 15, 1, { c: '#1c2026', back: '#1c2026', th: 16 }); H.ring(cx + jx, cy, 15, grip, { c: gc, back: '#4a4e58', th: 3 }); bits(holding ? GRAB : HAND, cx + jx - 5, cy - 5, '#101420'); bits(holding ? GRAB : HAND, cx + jx - 6, cy - 6, gc);
  H.icon('heart', r.x + 14, r.y + r.h - 9, { c: '#f06858' }); H.bar(r.x + 24, r.y + r.h - 7, 34, 4, hp, { c: B.PAL.hp, v2: hpShow, c2: '#ffffff', back: '#1c2026', ticks: 3 });
  // 笛（ミズハネを呼ぶ）。ふり落とされたときに光る
  const call = tt > T_THROW && tt < T_CATCH, hx = r.x + 30, hy = r.y + 6; H.rect(hx - 3, hy - 3, 15, 12, call && Math.sin(t * 20) > 0 ? '#ffe890' : '#1c2026', .9); bits(HORN, hx, hy, call ? '#3a2a10' : '#d8c8a0'); if (call) H.text('よぶ', hx - 22, hy - 4, { size: 10, c: '#ffe890' });
  // 出たときの名前
  const nk = seg(tt, 1.2, 1.8) * (1 - seg(tt, 5, 5.8)); if (nk > .02) { const b = H.place('上', 120, 30, 0, tall ? 44 : 20); H.text('やきものの うみへび', b.x + 60, b.y - Math.round((1 - nk) * 4), { size: 10, c: '#ffe8b0', align: 'c' }); H.text('カケツギ', b.x + 60, b.y + 11, { size: 10, scale: 2, c: '#ffffff', align: 'c', outline: '#3a2a5a' }); }
  // ついたあとの、相手の細い帯と 弱点の数
  const bk = Math.max(seg(tt, T_HIT[0], T_HIT[0] + .3) * (1 - seg(tt, 24.2, 25)), seg(tt, T_HIT[1], T_HIT[1] + .3) * (1 - seg(tt, 37, 38)));
  if (bk > .02) { const w = Math.min(H.W - 40, 150), b = H.place('上', w, 16, 0, (tall ? 38 : 16) - Math.round((1 - bk) * 8)), left = tt < T_HIT[0] ? 3 : tt < T_HIT[1] ? 2 : 1; H.text('カケツギ', b.x, b.y - 2, { size: 10, c: '#f4f0dc' }); for (let i = 0; i < 3; i++) H.icon('star', b.x + w - 30 + i * 10, b.y + 1, { c: i < left ? '#ffd860' : '#4a4e58' });
    H.bar(b.x, b.y + 11, Math.round(w * bk), 4, bhp, { c: '#ffd860', v2: bhpShow, c2: '#ffffff', back: '#1c2026', ticks: 3 }); }
  if (tt > 6.6 && tt < T_SLAP) { const p = H.project(tmp.copy(warn.position).setY(3)); if (p.on && Math.sin(tt * 22) > -.2) H.text('!', p.x, p.y - 6, { size: 10, scale: 2, c: '#ff5a4a', align: 'c', outline: '#ffffff' }); }
  H.end(dt);
}

// ---- カメラ：うしろから追う → 引きで体当たり → とび移る所を寄りで → 背の上 → ひねられる横顔 → つく → 水の中 → 首へ走る → つく → ふり落とされる引き → 乗って見上げる ----
const cp = V(), ct = V();
function moveCam(tt, t, dt) {
  const tall = innerWidth < innerHeight, o = (x, y, z) => cp.copy(hw).add(tmp.set(x, y, z)), l = (x, y, z) => ct.copy(hw).add(tmp.set(x, y, z));
  if (LOOKQ) { const [s, dx, dy, dz] = LOOKQ.split(',').map(Number); spine(s, ct); cp.copy(ct).add(tmp.set(dx, dy, dz)); }
  else if (tt < 6.3) { if (tall) { o(-5, 2.9, 4); l(16, 2, -9); } else { o(-6.2, 3.1, 5.4); l(16, .4, -7.4); } }
  else if (tt < 9.3) { cp.set(mpos.x - (tall ? 7 : 9), 4.6, mpos.z + (tall ? 9 : 10)); ct.set(mpos.x + (tall ? 2 : 5), 1.6, axisZ(mpos.x) + 9); }
  else if (tt < 12.4) { if (tall) { o(-3, 1.9, 3.6); l(1.5, .9, -3); } else { o(-3.6, 1.9, 3.6); l(2.6, .6, -3); } }
  else if (tt < 16.3) { if (tall) { o(-2.6, 1.9, 3.4); l(1.4, .8, -1.2); } else { o(-3, 1.9, 3.4); l(2.6, .7, -1.4); } }
  else if (tt < 19.2) { o(-1, .9, tall ? 3.8 : 4); l(.4, .6, 0); }
  else if (tt < 20.9) { o(-3, 2.2, 4.2); l(.6, tall ? 1.2 : .8, 0); }
  else if (tt < 22.2) { if (tall) { o(-4, 2.8, 1.4); l(6, 1.2, -.5); } else { o(-4.8, 2.7, 2.2); l(8, .9, -1); } }
  else if (tt < 26.9) { o(-1.8, 1.7, tall ? 3.8 : 4); l(.5, .5, 0); }
  else if (tt < 30.4) { if (tall) { o(-4, 2.8, 1.4); l(6, 1.2, -.5); } else { o(-4.8, 2.7, 2.2); l(8, .9, -1); } }
  else if (tt < 32.75) { o(-3, 2.2, 4.2); l(.6, tall ? 1.2 : .8, 0); }
  else if (tt < T_THROW) { o(-1.5, 1.2, tall ? 7 : 7.5); l(.5, .8, 0); }
  else if (tt < T_CATCH) { o(-2, 3, tall ? 7 : 7.5); l(.3, .3, 0); }
  else { if (tall) { o(-4.4, 3.3, 3); l(5, 1.6, -5); } else { o(-5.4, 3.4, 4.4); l(6, 1, -6.5); } }
  shake = Math.max(0, shake - dt * 1.3); cp.x += Math.sin(t * 61) * shake * .12; cp.y += Math.sin(t * 83) * shake * .16;
  const lvl = sea.h(cp.x, cp.z, t); if (Math.abs(cp.y - lvl) < .35) cp.y = lvl + (cp.y > lvl - .1 ? .35 : -.35);
  cam.position.copy(cp); cam.lookAt(ct);
  // 水の中：霧を青くし、空と海面をかくす
  if (tt > 23.4 && tt < 26.4) cp.y = Math.min(cp.y, lvl - .7); const u = cp.y < lvl; if (u !== under) { under = u; scene.fog.color.set(u ? DEEP : HAZE); scene.fog.near = u ? 2 : 90; scene.fog.far = u ? 46 : 330; dome.visible = far1.visible = far2.visible = sunDisc.visible = sea.mesh.visible = !u; hemi.intensity = u ? 2.1 : 1.65; hemi.color.set(u ? '#9fd8ff' : '#ffdcd4'); }
}

reset();
K.loop((dt, t) => {
  const tt = (t + T0) % LOOP; if (tt < prev) { const first = prev > 1e8; reset(); prev = first ? T0 - .001 : -1; if (first) { bhp = bhpShow = tt > T_HIT[1] ? .4 : tt > T_HIT[0] ? .7 : 1; if (tt > T_THROW) hp = hpShow = .78; } }
  TT = tt;
  moveBoss(tt, t, dt); moveMount(tt, t); moveHero(tt, t, dt);
  for (const [tm, fn] of EV) if (tm > prev && tm <= tt) fn(tm);
  prev = tt;
  moveCam(tt, t, dt);
  // 水の中の あわ（主役とマントから のぼる）
  if (under && Math.floor(t * 20) !== Math.floor((t - dt) * 20)) burst(tmp.copy(hw).add(tmp2.set((hash(t, 1) - .5) * 3, .5, (hash(t, 2) - .5) * 2)), 2, { sp: .6, up: 2.6, g: -1.5, life: 1.4, c: '#d8f4ff', s: .15, vx: -3 });
  tickDrops(dt);
  dome.position.set(cam.position.x, 0, cam.position.z); far1.position.x = far2.position.x = cam.position.x; far1.position.z = far2.position.z = cam.position.z;
  sunDisc.position.set(cam.position.x + 250, 30, cam.position.z - 215);
  sun.target.position.copy(hw); sun.position.set(hw.x + 14, hw.y + 40, hw.z + 34); heroL.position.copy(cam.position).lerp(hw, .55).y += 1.2; heroL.intensity = under ? 9 : 5;
  gulls.forEach((g, i) => { const a = t * .35 + i * 1.05, r = 9 + i * 2.5; g.position.set(VB * tt - 8 + Math.cos(a) * r, 16 + i * 1.3 + Math.sin(t + i) * 1.2, axisZ(VB * tt) + Math.sin(a) * r); g.rotation.y = -a; g.userData.tick(t + i, .3); });
  S.tick(t); sea.tick(t, cam.position.x, cam.position.z);
  crt.u.bright.value = Math.min(1, tt / .5, (LOOP - tt) / .6);
  F.update(dt); drawHud(tt, t, dt); crt.render(scene, cam, t);
});
