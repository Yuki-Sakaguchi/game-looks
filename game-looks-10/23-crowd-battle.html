    if (bossOn && bossSt !== 4 && blink) { const bx = Math.round(X(boss.pos.x)), by = Math.round(Z(boss.pos.z)); H.rect(bx - 2, by - 2, 4, 4, OL); H.rect(bx - 1, by - 1, 2, 2, '#ff40c0'); }
    { const bx = Math.round(X(hero.pos.x)), by = Math.round(Z(hero.pos.z)); H.rect(bx - 2, by - 2, 5, 5, OL); H.rect(bx - 1, by - 1, 3, 3, blink ? '#ffffff' : '#ffe040'); }
    H.text('せんじょう', r.x + 4, r.y + mh + 1, { size: 8, c: '#f4f0d0', outline: OL }); }
  // 右下：たおした数（大きく数えあがる）と、つづけて当てた数
  { const r = H.place('右下', 84, 40, 0, tall ? -6 : -2), pop = Math.max(0, 1 - koT * 7), big = mile && mile.age < .5; koT += dt; comboT += dt; if (comboT > 2.2) combo = 0;
    H.num(String(ko), r.x + r.w - 2, r.y + 2 - Math.round(pop * 4), { align: 'r', scale: big ? 4 : 3, c: pop > .3 ? '#ffffff' : GOLD, outline: OL }); H.text('にん げきは！', r.x + r.w - 1, r.y + 28, { align: 'r', size: 10, c: '#ffffff', outline: OL });
    if (combo > 1) { const p2 = Math.max(0, 1 - comboT * 6); H.num(String(combo), r.x + r.w - 32, r.y - 18 - Math.round(p2 * 3), { align: 'r', scale: 2, c: '#ff9a40', outline: OL }); H.text('れんさ', r.x + r.w - 29, r.y - 14, { size: 8, c: '#ffffff', outline: OL }); H.bar(r.x + r.w - 60, r.y - 2, 58, 3, 1 - comboT / 2.2, { c: '#ff9a40' }); } }
  // 100 にんごとの大きな知らせ（金の札が右から入る）
  if (mile) { if (!(banner && tt > banner.t0 && tt < banner.t0 + banner.len)) mile.age += dt; const k = mile.age / 2.2; if (k >= 1) mile = null; else if (mile.age > 0) { const str = mile.n + ' にん とっぱ！', sl = Math.round((1 - ease(cl(k / .12))) * 120 + ease(cl((k - .88) / .12)) * 160), w = Math.min(H.W - 12, H.textW(str) * 2 + 34), r = H.place('上', w, 30, 0, top + (tall ? 58 : 38)); r.x += sl;
      if (r.x < H.W - 20) { H.win(r.x + sl * 0, r.y, r.w, r.h, { c: '#e0a020', c2: '#a04a10', edge: '#fffbe0' }); if (k < .25 && Math.floor(t * 20) % 2) H.rect(r.x + 2, r.y + 2, r.w - 4, r.h - 4, '#ffffff', .5); H.icon('star', r.x + 5, r.y + 11, { c: '#fffbe0' }); H.icon('star', r.x + r.w - 13, r.y + 11, { c: '#fffbe0' }); H.text(str, r.x + r.w / 2, r.y + 5, { align: 'c', scale: 2, c: '#ffffff', outline: '#5a2800' }); } } }
  // 上の知らせ
  for (const [a, b, str, c] of MSG) if (tt >= a && tt < b) { const k = Math.min(1, (tt - a) / .15, (b - tt) / .15); if (k > .5 || blink) H.msg(str, '上', { dy: top + (tall ? 58 : 38) + (mile ? 33 : 0), c, c2: R.mix(c, '#000010', .5), edge: '#fffbe0', w: Math.min(H.W - 12, H.textW(str) + 18) }); }
  if (banner) H.banner(banner.text, (tt - banner.t0) / banner.len, { sub: banner.sub, c: banner.c, y: tall ? H.H * .3 : 76 });
  H.end(dt);
}

// ---- カメラ：主役のうしろ少し高め。[時刻, 向き, きょり, 高さ, 見る高さ]。大技のあいだは ぐるりと 1 周する ----
const TP = PI * 2, CK = [[0, 0.14, 5.92, 3.15, 1.1], [1.2, 0.1, 5.76, 3.06, 1.1], [3.2, -0.14, 5.84, 3.15, 1.1], [5.3, -0.25, 6.08, 2.88, 1.3], [6.6, 0.2, 5.84, 3.06, 1.1], [8.2, 0.1, 6, 3.15, 1.1], [9.5, 0.5, 5.6, 2.34, 1.4], [12, 0.62, 5.36, 2.16, 1.4], [13.3, 0.95, 4.32, 1.71, 1.4], [14.4, 0.7, 5.28, 2.16, 1.5], [15.4, 0.3, 6.24, 2.88, 1.4], [18.2, TP + 0.3, 7.04, 3.6, 1.3], [18.8, TP + 0.55, 5.6, 2.25, 1.4], [20, TP + 0.3, 5.76, 2.88, 1.2], [22.1, TP + 0.1, 5.84, 3.15, 1.1], [24.6, TP - 0.2, 6, 3.15, 1.2], [25.8, TP - 0.5, 6.24, 1.98, 2.5], [27.8, TP - 0.36, 6.08, 2.16, 2.3], [29, TP + 0, 5.84, 3.15, 1.1], [33, TP + 0.22, 6, 3.15, 1.2], [36, TP + 0.1, 6.08, 3.06, 1.3], [39.5, TP + 0, 8.4, 5.04, 2.6], [40, TP + 0, 8.4, 5.04, 2.6]];
const cf = V(0, 0, 11), cp = V(0, 0, 0);

  const tall = innerWidth < innerHeight, [yaw, dist, h, ly] = key(CK, tt, 4), D = dist * (tall ? .74 : 1);
  const wB = bossOn ? (seg(tt, 8.8, 9.8) - seg(tt, 14.6, 15.4)) * .5 : 0; cp.set(lerp(hero.pos.x, boss.pos.x, wB), heroY * .5, lerp(hero.pos.z, boss.pos.z, wB)); if (snap) cf.copy(cp); else cf.lerp(cp, Math.min(1, dt * 6));
  shake = Math.max(0, shake - dt * 1.8); const sx = Math.sin(t * 71) * shake * .09, sy = Math.sin(t * 93) * shake * .09;
  cam.position.set(cf.x + Math.sin(yaw) * D + sx, cf.y * .6 + h * (tall ? .86 : 1) + sy, cf.z + Math.cos(yaw) * D); cam.lookAt(cf.x - Math.sin(yaw) * 2, cf.y + ly + (tall ? .25 : 0), cf.z - Math.cos(yaw) * 2);
  sun.position.set(cf.x + 20, 34, cf.z + 22); sun.target.position.set(cf.x, 0, cf.z);
}

reset();
const step = (tt, t, dt, snap) => { for (const [tm, fn] of EV) if (tm > prev && tm <= tt) fn(tm); prev = tt; moveHero(tt, t, dt); moveBoss(tt, t, dt); moveSoldiers(tt, t, dt); moveCam(tt, t, dt, snap);
  if (capK > 0 && capK < 1) capK = Math.min(1, capK + dt / 1.1); flagR.visible = capK < .5; flagB.visible = capK >= .5; { const f = capK < .5 ? flagR : flagB, k = capK < .5 ? 1 - capK * 2 : capK * 2 - 1; f.scale.set(1, 1, 1); f.children.forEach(c => { if (c.userData.dyn) c.position.y = -(1 - k) * 4.6; }); } };
K.loop((dt, t) => {
  const tt = (t + T0) % LOOP; if (tt < prev) { reset(); if (prev > 1e8 && T0 > 0) { prev = -1; for (let s = 0; s < T0 % LOOP; s += 1 / 30) { step(s, s, 1 / 30, true); F.update(1 / 30); drawHud(s, s, 1 / 30); } } else prev = -1; }
  step(tt, t, dt, false);
  FT.tick(t); for (const b of fires) b.userData.tick(t);
  for (const q of smoke) { const k = (t * .09 + q.j / 9 + q.k * .37) % 1, s = q.s; s.position.set(q.p.x + k * k * 9 + Math.sin(k * 9 + q.k) * .5, 1.4 + k * 17, q.p.z - k * 3); s.scale.setScalar(1.4 + k * 5.5); s.material.opacity = Math.min(1, k * 8) * (1 - k) * .85; }
