<script type="module">
// こい霧の海に立つ、さびた鉄の足場。細い わたり板の先の やぐらと鉄塔の てっぺんで、赤い警告灯が ゆっくり明るくなり、暗くなり、霧を赤くそめる。

{ const mm = sea.mat.map.userData.m || 8; for (const [x0, x1, z0, z1] of [[-352, -75, -352, 352], [75, 352, -352, 352], [-75, 75, -352, -75], [-75, 75, 75, 352]]) { const nx = Math.ceil((x1 - x0) / 26), nz = Math.ceil((z1 - z0) / 26), g = new THREE.PlaneGeometry(x1 - x0, z1 - z0, nx, nz); g.rotateX(-Math.PI / 2); g.translate((x0 + x1) / 2, -.02, (z0 + z1) / 2);

fixed.push(P.group());
// 台の上：鉄塔（てっぺんに警告灯）、やぐら（鉄骨の骨組み）、水のタンク、木箱とたる
const rustT = PT.rust({ c: '#80503e', panel: 0, seed: 1 }), PH = 21, pylon = put(PK.pylon({ h: PH, w: 4.6, c: '#7a4e40', seed: 1 }), TX, TZ, .3, DH), TOP = [TX, DH + PH, TZ];

[[2.6, PZ + 6.6, 0], [3.4, PZ + 6.2, 1], [-1.9, PZ + 6.9, 2], [6.6, PZ - .5, 3], [-6.6, PZ - 3, 4]].forEach(([x, z, i]) => put(i % 2 ? R.barrel({ c: '#5a6a66' }) : R.crate({ s: .7 + (i % 3) * .1, c: '#7a6a58' }), x, z, i, DH));
put(R.crate({ s: .55, c: '#7a6a58' }), 1.12, 4.5, .3, DH); put(R.barrel({ c: '#6a5048', h: .8 }), -1.1, -6.5, 0, DH); put(R.crate({ s: .5, kind: 'x', c: '#7a6a58' }), -1.05, -7.4, .5, DH);

const far = [[-24, -52, .1, 24, 1], [27, -66, -.14, 26, 2], [-34, 4, .2, 20, 3], [40, -20, -.08, 24, 4]].map(([x, z, ln, h, i]) => put(PK.pylon({ h, w: 5, base: 6, lean: ln, leanX: (i % 2 - .5) * .1, c: '#74504a', seed: i }), x, z, i * .7));

[[1.5, DH - .1, 14, 1.9], [-1.5, DH - .1, 7.5, 1.6], [1.5, DH - .1, 1, 2], [-1.5, DH - .1, -5, 1.7], [-3.6, DH + 5.9, PZ + 5.1, 3.2], [-6.8, DH + 8.9, PZ + 5.1, 2.6], [3, DH + PH * .64 - .5, TZ + 1, 4]].forEach(([x, y, z, len], i) => { const c = D.chain({ len, sway: .1 + (i % 3) * .04, seed: i, c: '#6a5a58' }); c.position.set(x, y, z); c.rotation.y = i; scene.add(c); });
