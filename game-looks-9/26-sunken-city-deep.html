<title>9-26 沈んだ都市 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#d8e0f4;opacity:.85;text-shadow:0 1px 0 #012}
</style>
<div id="cap">9-26 ─ 沈んだ都市 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で泳ぐ）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="../game-looks-8/pack-ruins.js"></script>
<script src="../game-looks-8/pack-sea.js"></script>
<script src="pack-dark.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// テイスト B。面の少ない形（ビル・車・街灯・海草・魚・ヘルメットのダイバー）に、その場で打ったドット絵をはり、横 320 ドットほどの粗い絵に描いて、ブラウン管に映す。
// 深い青の底に沈んだ都市の通り。色は こい青の水と、ランプの白の 2 つ（差し色は主役のだいだい）。両がわにビルがならび、窓はガラスのぬけた暗い穴。かべに ふじつぼ と も、道に海草、止まった車、たおれた街灯。
// 魚の群れが通りをぬけ、上から うすい光のすじがさす。だいだいの服のダイバーが、ランプで前をてらしながら通りを泳ぐ。通りは 96 m ごとに同じ並びをくり返す（主役の位置を折り返して、終わりなく続く）
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), PK = PACK_RUINS(THREE, K, R), S = PACK_SEA(THREE, K, R), D = PACK_DARK(THREE, K, R), { hash } = R, T = R.tex;
const { scene, cam, renderer, onResize } = K.stage({ fov: 52, far: 900, aa: false, fitAspect: .9, maxFov: 78 });
// 'deep' を こい青へ暗く。上からの光は弱く残す（うすい光のすじ 13 本）。遠くのビルは青い水にとけて、暗いシルエットになる
const env = S.underwater(scene, renderer, { depth: 'deep', top: 44, surface: false, rays: 13, range: 34, hi: '#2c62b8', mid: '#18408e', low: '#0c1c52', fog: '#153886', near: 4, far: 62, amb: 1.18, sky: 0x86a8ff, ground: 0x4850a8, power: .75, rayA: .28, motes: 130 }), sun = env.sun;

// ---- 通り（z の向き。はば 10 m の車道と歩道）。z = 0 に交差点。96 m ごとにくり返す ----
const LP = 96, wrap = (a, n) => ((a % n) + n) % n, wz = z => wrap(z + LP / 2, LP) - LP / 2;
const H = (x, z) => .1 * Math.sin(x * .9) * Math.cos(z * Math.PI * 2 / LP * 9);
const road = (x, z) => Math.abs(x) < 5 || Math.abs(wz(z)) < 5;
const bed = S.seabed({ env, w: 124, d: 124, cell: 2, H, caustic: .1, layers: [PK.tex.asphalt({ c: '#7c84a0', grass: 0, crack: .8, line: 'none' }), PK.tex.concrete({ c: '#98a0b4', moss: .2, crack: .7 }), S.tex.sand({ c: '#8c98c0' })],
  mix: (x, z) => { const s = .5 + .5 * Math.sin(x * .55 + 1) * Math.cos(wz(z) * Math.PI * 2 / LP * 5 + x * .2); return [road(x, z) ? 0 : 1, s > .78 ? 1 : 0]; } }); scene.add(bed.mesh);
// かべ：ガラスのぬけた窓のかべ（PK.paint.ruinWall）に、ふじつぼ と も（S.crust）をのせた 3 枚
const WALL = ['#8e98ae', '#7c8aa6', '#a09eb0'].map((c, i) => T.from(S.crust(PK.paint.ruinWall({ c, holes: 1, plants: 0, moss: .15, seed: i }), { grow: .5, algae: '#3a8c94', seed: i + 1 }), { m: 6 }));
const fixed = [], put = (mk, x, z, ry = 0, dy = 0) => { for (const k of [-1, 0, 1]) { const o = mk(); o.position.set(x, H(x, z) + dy, z + k * LP); o.rotation.y = ry; fixed.push(o); } };
// ビル：[x の側, z のまん中, おくゆき d, はば w, 階, 欠け]。交差点（z = -6〜6）をあけて、両がわに 6 むねずつ
const BL = [[-1, -42, 12, 12, 7, .2], [-1, -28.5, 15, 9, 4, .5], [-1, -13.5, 15, 12, 9, .25], [-1, 13.5, 15, 12, 6, .35], [-1, 27, 12, 9, 8, .15], [-1, 40.5, 15, 12, 5, .45],
  [1, -40.5, 15, 12, 5, .4], [1, -27, 12, 9, 9, .2], [1, -13.5, 15, 12, 6, .3], [1, 12, 12, 9, 8, .2], [1, 25.5, 15, 12, 4, .55], [1, 40.5, 15, 12, 7, .25]];
BL.forEach(([sx, z, d, w, fl, br], i) => put(() => PK.building({ w, d, floors: fl, c: ['#8e98ae', '#7c8aa6', '#a09eb0'][i % 3], wall: WALL[i % 3], broken: br, corner: i % 4, seed: i + 1, moss: .2, holes: 1, plants: 0, ivy: 0, roofGreen: 0, tree: false, flowers: 0 }), sx * (8.4 + w / 2), z));
for (const sx of [-1, 1]) put(() => PK.building({ w: 12, d: 15, floors: sx > 0 ? 11 : 8, c: '#7c8aa6', wall: WALL[1], broken: .3, corner: sx > 0 ? 1 : 2, seed: 20, holes: 1, plants: 0, ivy: 0, roofGreen: 0, tree: false }), sx * 34, sx * 1.5);   // 交差点の横道のおくに、もう 1 むね
// 街灯：先細りの柱と、うでと、かさ。立ってかたむいた物と、たおれた物
const rustT = PK.tex.rust({ paint: '#7a8aa0', peel: .6, panel: 0, m: 1.5 });
const streetlight = () => { const G = R.geo().smooth(1); G.loft(6, [[0, .2, .2, 0, .8], [.5, .11, .11, .3, .9], [5.6, .07, .07, 3.6, 1]], { ur: 1 }); G.at(R.TR(0, 5.5, 0, 0, 0, -1.1)).loft(5, [[0, .06, .06, 0, .9], [1.7, .05, .05, 1, 1]], { ur: 1 }).at(null); G.smooth(0).box(.3, .14, .7, 1.6, 6.2, 0, { m: 1.5, c0: .7 }); return G.mesh(rustT); };
[[-5.6, -36, .14, 0], [5.6, -24, -1.36, 1], [-5.6, -9, .3, 2], [5.6, 8.5, .1, 3], [-5.6, 21, 1.42, 4], [5.6, 34, -.22, 5], [-5.6, 45, -.1, 6]].forEach(([x, z, ln, i]) => put(() => { const g = new THREE.Group(), m = streetlight(); m.rotation.z = ln; m.rotation.y = x < 0 ? 0 : Math.PI; g.add(m); return g; }, x, z, 0, Math.abs(ln) > 1 ? .12 : -.05));
// 止まった車、信号、電柱、がれき
[[2.6, -31, .15, '#b8a04a', 'sedan'], [-2.4, -18.5, 3.3, '#8a98a8', 'van'], [3.1, -5.5, 1.2, '#a8584a', 'sedan'], [-2.8, 10, -.1, '#9aa4b0', 'sedan'], [2.4, 22, 3.0, '#6a8a9a', 'van'], [-1.2, 36.5, .6, '#b8a04a', 'sedan'], [11, 1.8, 1.7, '#9aa4b0', 'sedan']].forEach(([x, z, ry, c, kind], i) => put(() => PK.wreck({ c, kind, seed: i, moss: .5, grass: 0 }), x, z, ry));
put(() => PK.signal({ h: 6, arm: 3.6, lean: -.22, leanX: .1, seed: 1, ivy: 0 }), -5.8, -6.2); put(() => PK.signal({ h: 5.6, arm: 2.4, lean: .3, seed: 2, ivy: 0 }), 5.8, 6.2, Math.PI);
[[-7.2, -22, 1], [7.2, 17, 2], [-7, 31, 3], [7.2, -44, 4]].forEach(([x, z, sd]) => put(() => PK.rubble({ r: 2, h: .9, slabs: 4, tufts: 0, grass: 0, seed: sd }), x, z, sd));
// 海草：道のわれ目と歩道から のびる帯の海草、ビルの足もとの も
for (let i = 0; i < 46; i++) { const sx = i % 2 ? 1 : -1, x = sx * (i % 5 === 0 ? 1 + hash(i, 1) * 3 : 5.4 + hash(i, 1) * 2.6), z = -48 + (i + hash(i, 2) * .8) * (LP / 46); if (Math.abs(z) < 5) continue;
  put(() => S.kelp({ h: 2.5 + hash(i, 3) * 6, w: .7 + hash(i, 4) * .4, kind: i % 3 ? 'ribbon' : 'kelp', c: ['#2f8a8a', '#3a7a9a', '#4a9a7a'][i % 3], amp: .4, seed: i }), x, z, hash(i, 5) * 6.28, -.1); }
for (let i = 0; i < 60; i++) { const x = (hash(i, 6) - .5) * 16, z = -48 + hash(i, 7) * LP; put(() => i % 4 ? S.seagrass({ s: .5 + hash(i, 8) * .6, c: i % 2 ? '#3a8a9a' : '#5a9a8a', seed: i }) : i % 8 ? S.shell({ c: '#c8d0e8', s: 1.2 }) : S.urchin({ s: 1.3, c: '#4a3a7a' }), x, z, i * 1.7, .02); }
scene.add(R.merge(fixed));

// ---- 生きもの：通りをぬける魚の群れ（細長い輪）、高い所の えい。位置は主役のまわりへ折り返す ----
const live = [], add = (o, x, y, z0, f) => { scene.add(o); live.push((t, hz) => { o.position.set(x, y, hz + wz(z0 - hz)); f && f(o, t); o.userData.tick(t); }); return o; };
add(S.school({ n: 60, s: 1.7, rx: 2.6, rz: 13, h: 2.2, wide: 1.2, speed: 1.1, spread: 1.6, c: '#9ab8e8', c2: '#e8f0ff', tints: ['#ffffff', '#b8d0f8'] }), 0, 4.6, -16);
add(S.school({ n: 44, s: 1.6, rx: 2.2, rz: 11, h: 1.8, speed: -1.0, spread: 1.5, seed: 4, c: '#88a8d8', c2: '#d8e8ff', tints: ['#ffffff', '#b8d0f8'] }), -1.5, 7.5, 18);
add(S.school({ n: 36, s: 1.6, rx: 12, rz: 2.2, h: 1.6, speed: .9, spread: 1.4, seed: 7, c: '#9ab8e8', c2: '#e8f0ff' }), 0, 3.6, 0);
add(S.ray({ s: 1.6, c: '#4a5ea8' }), 0, 11, -4, (o, t) => { o.position.x = Math.sin(t * .1) * 4; o.rotation.y = Math.PI; }); add(S.ray({ s: 1.2, c: '#4a5ea8' }), 2, 9, 34, (o, t) => { o.position.x = 2 + Math.cos(t * .12) * 3; });

// ---- 主役：ヘルメットのダイバー（だいだいの服に 白いボンベ。ヘルメットの上のランプが前をてらす） ----
const hero = S.diver({ head: 'helmet', tank: '#e8ecf4', fin: '#f4b03a', metal: '#b8c0cc', actor: { hairStyle: 'short', hair: '#3a3038', top: '#f08a2a', top2: '#f4e8d0', bottom: '#e07a24', glove: '#f4e8d0', shoe: '#9a5a24', belt: '#f4e8d0' } }); scene.add(hero);
// pack のヘルメットは、よこのくり返し（ur: 3）がテクスチャの金物の区画からはみ出すので、ここで UV を区画の中へ折り返す（第 8 集の 35 と同じ）
{ const hm = hero.userData.J.head.children.at(-1), uv = hm.geometry.attributes.uv, u0 = 17 / 64, w = 14 / 64; for (let i = 0; i < uv.count; i += 3) { if (uv.getY(i) > .25) continue; const k = Math.floor((Math.min(uv.getX(i), uv.getX(i + 1), uv.getX(i + 2)) - u0) / w + .001); for (let j = 0; j < 3; j++) uv.setX(i + j, uv.getX(i + j) - k * w); } uv.needsUpdate = true; }
{ const J = hero.userData.J, G = R.geo(), y = .46, L = 6.4;   // ランプの光：頭の前へのびる 光の円すい（うすい板 2 枚を十字に。加算）と、ヘルメットの上の小さな あかり
  for (const [ax, ay] of [[1, 0], [0, 1]]) G.quad([-.1 * ax, y - .1 * ay, .36], [.1 * ax, y + .1 * ay, .36], [1.8 * ax, y + 1.8 * ay - .5, L], [-1.8 * ax, y - 1.8 * ay - .5, L], [0, 1, 1, .08]);
  const beam = G.mesh(S.mat(S.tex.shaft({ seed: 1 }), { glow: true, add: true, alpha: .6, side: true, color: '#e8f0ff' })); beam.castShadow = false; beam.renderOrder = 6; J.head.add(beam);
  const bulb = new THREE.Sprite(new THREE.SpriteMaterial({ map: S.tex.bubble(), color: '#f4f8ff', blending: THREE.AdditiveBlending, depthWrite: false, fog: false })); bulb.material.map = bulb.material.map.clone(); bulb.material.map.repeat.set(.5, 1); bulb.material.map.needsUpdate = true; bulb.scale.setScalar(.26); bulb.position.set(0, y + .12, .34); J.head.add(bulb); }
const headLamp = new THREE.SpotLight('#e8f0ff', 80, 24, .5, .7, 1.1); scene.add(headLamp, headLamp.target);
const selfLight = new THREE.PointLight('#c8d8ff', 2.2, 4, 1.4); scene.add(selfLight);   // 主役の体が暗くつぶれないための、ごく弱い光
const crt = R.crt(renderer, { noise: 0, bright: 1.06 }); onResize(crt.resize);
const SPEED = 1.25; let dist = -30 + LP / 2, hy = 2.8;
K.loop((dt, t) => {
  dist += SPEED * dt; const z = wz(dist - LP / 2), x = Math.sin(dist * .07) * 1.6, dx = Math.cos(dist * .07) * 1.6 * .07, gy = 2.7 + Math.sin(t * .5) * .25; hy += (gy - hy) * Math.min(1, dt * 2);
  hero.position.set(x, hy, z); hero.rotation.y = Math.atan2(dx, 1); S.swim(hero, t, { rate: 4.4 }); S.breathe(hero, env.bubbles, dt, 2.2);
  headLamp.position.set(x, hy + .5, z + .5); headLamp.target.position.set(x + dx * 8, hy - 1.3, z + 8); selfLight.position.set(x, hy + 1.4, z - 1.2);
  const tall = innerWidth < innerHeight, Dc = tall ? 3.3 : 4.4, Sd = tall ? .5 : 1.3;
  cam.position.set(x * .6 + Sd, hy + (tall ? .9 : .7), z - Dc); cam.lookAt(x * .8, hy + (tall ? 1.6 : 1.15), z + 3);
  for (const f of live) f(t, z);
  sun.position.set(x - 8, 46, z + 6); sun.target.position.set(x, 0, z);
  bed.follow(x, z); bed.tick(t); env.tick(t, cam, dt); D.tick(t, cam); crt.render(scene, cam, t);
});
</script>
