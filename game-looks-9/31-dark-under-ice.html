<title>9-31 氷の下のやみ 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#d8e8f4;opacity:.85;text-shadow:0 1px 0 #012}
</style>
<div id="cap">9-31 ─ 氷の下のやみ / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で泳ぐ）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="../game-looks-8/pack-sea.js"></script>
<script src="pack-dark.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// テイスト B。面の少ない形（つらら・氷のかたまり・古い船の底・くじら・ヘルメットのダイバー）に、その場で打ったドット絵をはり、横 320 ドットほどの粗い絵に描いて、ブラウン管に映す。
// 厚い氷にふさがれた、暗い海。色は 水と氷の黒青と、氷のわれ目から落ちる光のすじの水色。下は底の見えない まっ黒な深み。
// われ目の下にだけ、細い光のすじが何本も落ちる。氷には つららと、とじこめられた古い船の底。だいだいの服のダイバーが、光のすじの間を泳ぐ。遠くに くじらの影。
// 水の中の光は S.underwater（'ice' を暗く上書き。光のすじは出さない）。われ目・光のすじ・つらら・氷のかたまりは このページで作る
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), S = PACK_SEA(THREE, K, R), D = PACK_DARK(THREE, K, R), { hash } = R;
const { scene, cam, renderer, onResize } = K.stage({ fov: 50, far: 900, aa: false, fitAspect: .9, maxFov: 78 });
const TOP = 13, env = S.underwater(scene, renderer, { depth: 'ice', top: TOP, rays: 0, range: 30, hi: '#1c3c60', mid: '#0c2244', low: '#01040c', fog: '#081c38', near: 4, far: 50, amb: 1.0, sky: 0x4878b0, ground: 0x0c1838, sun: 0x80b8e0, power: .45, surf: '#41688c', motes: 130 }), sun = env.sun; env.surface.material.color.set('#4c6c8c');   // 見上げた氷は、暗い青にしずめる（明るいのは われ目だけ）

// ---- 泳ぐ道（ひと回り）。海底は作らない（下は まっ黒） ----
const path = new THREE.CatmullRomCurve3([[0, 0], [12, -6], [25, -2], [33, 9], [30, 23], [18, 30], [5, 26], [-7, 31], [-19, 24], [-22, 11], [-13, 2]].map(([x, z]) => new THREE.Vector3(x, 0, z)), true, 'centripetal'), LEN = path.getLength(), PP = path.getSpacedPoints(200);
const dP = (x, z) => { let b = 1e9; for (const p of PP) { const d = (p.x - x) ** 2 + (p.z - z) ** 2; if (d < b) b = d; } return Math.sqrt(b); };
const fixed = [], iceT = S.tex.under({ kind: 'ice', c: '#5c88ac', frames: 1, m: 2.5 })[0], iceM = S.mat(iceT, { emissive: '#0c2034' });

// ---- 氷のわれ目：道をななめに横切る、ぎざぎざの線 12 本。線は明るい水面の絵で光り、その下に 細い光のすじ（加算の たて長の板）がならんで落ちる ----
const CR = []; for (let i = 0; i < 12; i++) { const u = (i + .82) / 12, p = path.getPointAt(u), tg = path.getTangentAt(u), ang = Math.atan2(tg.x, tg.z) + 1.1 + (hash(i, 1) - .5) * .9, n = 7, L = 2.3, pts = []; let x = p.x - Math.sin(ang) * n * L / 2, z = p.z - Math.cos(ang) * n * L / 2;
  for (let k = 0; k <= n; k++) { pts.push([x, z]); const a = ang + (hash(i, k, 2) - .5) * 1.3; x += Math.sin(a) * L; z += Math.cos(a) * L; } CR.push(pts); }
const dCrack = (x, z) => { let b = 1e9; for (const c of CR) for (const [cx, cz] of c) b = Math.min(b, Math.hypot(x - cx, z - cz)); return b; };
const crackF = S.tex.under({ c: '#e8ffff', m: 3 }), GC = R.geo(), GS = [R.geo(), R.geo(), R.geo()], SL = [2.6, -.4], DEEP = 12.5;
CR.forEach((pts, i) => { for (let k = 0; k < pts.length - 1; k++) { const [ax, az] = pts[k], [bx, bz] = pts[k + 1], dx = bx - ax, dz = bz - az, l = Math.hypot(dx, dz), w = .16 + hash(i, k, 3) * .26, nx = -dz / l * w, nz = dx / l * w, y = TOP - .05;
    GC.quad([ax - nx, y, az - nz], [bx - nx, y, bz - nz], [bx + nx, y, bz + nz], [ax + nx, y, az + nz], [ax / 3, az / 3, bx / 3, az / 3 + .3]);
    for (let h = 0; h < 3; h++) { if (hash(i, k, 4 + h) < .2) continue; const f0 = h / 3 + .03, f1 = h / 3 + .31, dp = DEEP * (.6 + hash(i, k, 6 + h) * .4), sx = SL[0] * dp / DEEP, sz = SL[1] * dp / DEEP;   // 1 区切りを 3 本の細いすじに。長さはまちまち
      GS[(i + k + h) % 3].quad([ax + dx * f0 + sx, y - dp, az + dz * f0 + sz], [ax + dx * f1 + sx, y - dp, az + dz * f1 + sz], [ax + dx * f1, y, az + dz * f1], [ax + dx * f0, y, az + dz * f0], [0, 0, 1, 1]); } } });
const crackM = new THREE.MeshBasicMaterial({ map: crackF[0], side: THREE.DoubleSide, fog: false }), crack = new THREE.Mesh(GC.build(), crackM); scene.add(crack);
const shaftM = GS.map((G, i) => { const m = S.mat(S.tex.shaft({ seed: i }), { glow: true, add: true, alpha: 1, side: true, color: '#86e0ff', key: 'c' + i }), me = new THREE.Mesh(G.build(), m); me.renderOrder = 4; me.frustumCulled = false; scene.add(me); return m; });
const CV = CR.flatMap(c => c.filter((_, k) => k % 3 === 1).map(([x, z]) => new THREE.Vector3(x, TOP - 1.6, z))), crackL = [0, 1, 2].map(() => { const l = new THREE.PointLight('#bfefff', 9, 13, 1.3); scene.add(l); return l; });

// ---- 氷の天井：つらら（先のとがった つつ）・下がった氷のかたまり。われ目のふちには つららがならぶ ----
const GI = R.geo().smooth(1), ice = (x, z, len, r, n = 5, sk = 0, y0 = TOP + .05) => GI.loft(n, [[y0, r, r, 0, 1.1, x, z], [y0 - len * .35, r * .7, r * .7, len * .35 / 2.5, 1, x + sk * .3, z], [y0 - len * .75, r * .34, r * .34, len * .75 / 2.5, .92, x + sk * .7, z + sk * .2], [y0 - len, .02, .02, len / 2.5, .8, x + sk, z + sk * .3]], { rot: hash(x, z) });
const lump = (x, z, w, dp, sd) => GI.loft(7, [[TOP + .05, w, w * (.7 + hash(sd, 1) * .5), 0, 1.12, x, z], [TOP - dp * .4, w * .82, w * .7, dp * .4 / 2.5, 1, x + .2, z], [TOP - dp * .8, w * .5, w * .4, dp * .8 / 2.5, .9, x + .3, z + .2], [TOP - dp, w * .16, w * .12, dp / 2.5, .78, x + .4, z + .2]], { cap: 'bot', capUV: [.5, .5], rot: hash(sd, 2) });
// 氷にとじこめられた古い船：甲板は氷の上。船の底だけが 水の中へつき出ている
const SP = path.getPointAt(.16), ST = path.getTangentAt(.16), SX = SP.x - ST.z * 8.5, SZ = SP.z + ST.x * 8.5, ship = S.ship({ s: 1.45, c: '#6a5a58', deck: '#7a6a60', grow: .25, sail: false, seed: 2 }); ship.position.set(SX, TOP - 3.9, SZ); ship.rotation.set(.06, Math.atan2(ST.x, ST.z) + .5, .1); fixed.push(ship);
const dShip = (x, z) => Math.hypot(x - SX, z - SZ);
for (let j = -12; j <= 17; j++) for (let i = -13; i <= 16; i++) { const x = i * 2.6 + (hash(i, j, 1) - .5) * 2.4 + 3, z = j * 2.6 + (hash(i, j, 2) - .5) * 2.4 + 9, d = dP(x, z), k = hash(i, j, 3); if (d > 26 || dCrack(x, z) < .9 || dShip(x, z) < 7) continue;
  if (k > .88 && d > 3.4) { lump(x, z, 1.6 + hash(i, j, 4) * 1.8, 2.2 + hash(i, j, 5) * 2.8, i * 31 + j); for (let m = 0; m < 4; m++) ice(x + (hash(i, j, 6 + m) - .5) * 4, z + (hash(i, j, 10 + m) - .5) * 4, 1 + hash(i, j, 14 + m) * 1.6, .22); }
  else if (k > .3) { const n = 1 + (hash(i, j, 7) * 3 | 0), near = d < 2.2; for (let m = 0; m < n; m++) ice(x + (hash(i, j, 8 + m) - .5) * 1.4, z + (hash(i, j, 12 + m) - .5) * 1.4, Math.min(near ? 1.5 : 4.5, .6 + hash(i, j, 16 + m) * (m ? 1.4 : 3.4)), .16 + hash(i, j, 20 + m) * .2, 5, (hash(i, j, 24 + m) - .5) * .3); } }
CR.forEach((pts, i) => pts.forEach(([x, z], k) => { for (const s of [-1, 1]) ice(x + s * (.75 + hash(i, k, 30)) * .9, z + s * hash(i, k, 31) * .8, .7 + hash(i, k, 32 + s) * 1.7, .26, 5, 0); }));
for (let m = 0; m < 16; m++) { const a = m / 16 * 6.283, r = 4.6 + hash(m, 40) * 2; ice(SX + Math.cos(a) * r * .7, SZ + Math.sin(a) * r, .9 + hash(m, 41) * 2, .3); }   // 船のまわりの つらら
fixed.push(GI.mesh(iceM)); scene.add(R.merge(fixed));

// ---- 生きもの：遠くの くじらの影、光のすじを横切る小魚の群れ、えい ----
const live = [], add = (o, f) => { scene.add(o); live.push(t => { f && f(o, t); o.userData.tick(t); }); return o; };
const circ = (cx, cy, cz, rx, rz, sp, ph = 0, bob = .3) => (o, t) => { const a = t * sp + ph; o.position.set(cx + Math.cos(a) * rx, cy + Math.sin(t * .6 + ph) * bob, cz + Math.sin(a) * rz); o.rotation.y = Math.atan2(-Math.sin(a) * rx * sp, Math.cos(a) * rz * sp); };
add(S.whale({ kind: 'whale', s: 1.7, c: '#4a6c9c', c2: '#8aa8c8' }), circ(6, 5, 12, 38, 31, .045, 5.03, .6));
const TINT = ['#c8e4f4', '#a8d0e8', '#e8f4f8'];
add(S.school({ n: 60, rx: 7, rz: 4.5, h: 2, wide: 1.3, speed: 1.3, spread: 2, tints: TINT })).position.set(path.getPointAt(.1).x + 3, 9.6, path.getPointAt(.1).z);
add(S.school({ n: 44, rx: 6, rz: 4, h: 1.8, speed: -1.2, spread: 2, seed: 3, tints: TINT })).position.set(path.getPointAt(.4).x, 9, path.getPointAt(.4).z);
add(S.school({ n: 44, rx: 6, rz: 4, h: 1.8, speed: 1.2, spread: 2, seed: 6, tints: TINT })).position.set(path.getPointAt(.7).x, 9.4, path.getPointAt(.7).z);
add(S.ray({ s: 1.6, c: '#3a5a88' }), circ(path.getPointAt(.2).x, 4.5, path.getPointAt(.2).z + 4, 15, 11, .1, 3.6, .5));

// ---- 主役：ヘルメットのダイバー（だいだいの服に白い帯。赤銅のヘルメット）と、ヘッドランプの光の円すい ----
const hero = S.diver({ head: 'helmet', tank: '#e8ecf0', fin: '#f08a28', metal: '#c88a58', actor: { hairStyle: 'short', hair: '#3a2a20', top: '#f08a28', top2: '#f4f4f0', bottom: '#e07a20', glove: '#f4f4f0', shoe: '#7a3a18', belt: '#f4f4f0' } }); scene.add(hero);
// pack のヘルメットは、よこのくり返しがテクスチャの金物の区画からはみ出して黒くなるので、UV を区画の中へ折り返す（第 8 集の 35 と同じ直し）
{ const hm = hero.userData.J.head.children.at(-1), uv = hm.geometry.attributes.uv, u0 = 17 / 64, w = 14 / 64; for (let i = 0; i < uv.count; i += 3) { if (uv.getY(i) > .25) continue; const k = Math.floor((Math.min(uv.getX(i), uv.getX(i + 1), uv.getX(i + 2)) - u0) / w + .001); for (let j = 0; j < 3; j++) uv.setX(i + j, uv.getX(i + j) - k * w); } uv.needsUpdate = true; }
const LAMP = (() => { const L = 7, G = R.geo().at(R.TR(0, 0, 0, 0, Math.PI / 2, 0)); G.loft(8, [[.1, .07, .07, 1, 1], [L * .35, .6, .6, .7, 1], [L * .7, 1.15, 1.15, .38, 1], [L, 1.6, 1.6, .04, 1]], { ur: 4 }); G.at(null);
  const cone = new THREE.Mesh(G.build(), S.mat(S.tex.shaft({ seed: 1 }), { glow: true, add: true, alpha: .26, side: true, color: '#ffe4a8' })); cone.renderOrder = 6; cone.frustumCulled = false;
  const bulb = D.halo({ c: '#fff0c0', r: .3, k: 1 }), spot = new THREE.SpotLight('#ffe4b0', 34, 22, .46, .6, 1.1), p = new THREE.Vector3(); scene.add(cone, bulb, spot, spot.target);
  return { tick(dir) { hero.updateMatrixWorld(true); hero.userData.J.head.getWorldPosition(p); p.y += .2; cone.position.copy(p).addScaledVector(dir, .3); bulb.position.copy(cone.position); cone.lookAt(p.x + dir.x * 9, p.y + dir.y * 9, p.z + dir.z * 9); spot.position.copy(p); spot.target.position.copy(p).addScaledVector(dir, 9); } }; })();

const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
const cd = new THREE.Vector3(), ld = new THREE.Vector3(), SPEED = 1.35; let dist = .035 * LEN, first = true, hy = 8;
K.loop((dt, t) => {
  dist += SPEED * dt; const u = (dist / LEN) % 1, p = path.getPointAt(u), tg = path.getTangentAt(u), gy = 8 + Math.sin(t * .4) * .35; hy += (gy - hy) * Math.min(1, dt * 2);
  hero.position.set(p.x, hy, p.z); hero.rotation.y = Math.atan2(tg.x, tg.z); S.swim(hero, t, { rate: 4.6 }); S.breathe(hero, env.bubbles, dt, 2.4);
  const sw = Math.sin(t * .4) * .35; ld.set(tg.x * Math.cos(sw) + tg.z * Math.sin(sw), .32 + Math.sin(t * .3) * .12, tg.z * Math.cos(sw) - tg.x * Math.sin(sw)).normalize(); LAMP.tick(ld);   // ランプは少し上の氷をなめる
  if (first) { cd.copy(tg); first = false; } cd.lerp(tg, 1 - Math.exp(-dt * 1.3)).normalize(); const tall = innerWidth < innerHeight, Dd = tall ? 3.3 : 3.9, Sd = tall ? .8 : 1.9;
  cam.position.set(p.x - cd.x * Dd + cd.z * Sd, hy + (tall ? .3 : -.1), p.z - cd.z * Dd - cd.x * Sd); cam.lookAt(p.x + cd.x * 2.6, hy + (tall ? .9 : .75), p.z + cd.z * 2.6);
  R.flip(crackM, crackF, t, 4); shaftM.forEach((m, i) => { m.opacity = .85 * (.7 + .3 * Math.sin(t * .9 + i * 2.1)); });
  CV.sort((a, b) => a.distanceToSquared(hero.position) - b.distanceToSquared(hero.position)); crackL.forEach((l, i) => l.position.copy(CV[i]));
  sun.position.set(p.x - 8, 44, p.z + 6); sun.target.position.set(p.x, 0, p.z);
  for (const f of live) f(t); D.tick(t, cam); env.tick(t, cam, dt); crt.render(scene, cam, t);
});
</script>
