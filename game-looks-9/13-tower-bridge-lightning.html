<div id="cap">9-13 ─ いなずまの夜の、やみの塔への橋 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="../game-looks-8/pack-fantasy-town.js"></script>
<script src="../game-looks-8/pack-fantasy-wild.js"></script>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 深い谷にかかる長い石の橋。その先の岩山の上に、窓に緑のあかりが ともる高い塔。強い風の雨の中を、とんがり帽子の旅人がマントをなびかせて歩く。
// 色の組は「空と石の青黒・いなずまの白」＋塔の窓と つえの先の 緑。だいだいの あかりは置かない。
// 塔は いなずまで白くなる空の前のシルエットで読ませ、橋と主役は ななめ うしろからの ふちの光と つえの あかりで読ませる（D.mood の 'storm'）。
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), F = PACK_FTOWN(THREE, K, R), W = PACK_FWILD(THREE, K, R), D = PACK_DARK(THREE, K, R), T = R.tex, { hash } = K, PI = Math.PI;
const { scene, cam, renderer, onResize } = K.stage({ fov: 58, far: 900, aa: false, fitAspect: .9, maxFov: 80 });
const hero = R.actor({ build: 'toon', hairStyle: 'short', hair: '#c8c4dc', cloth: 'robe', skirt: .75, top: '#7650c0', top2: '#e8d27a', bottom: '#3c3a5c', belt: '#c8a84a', shoe: '#4a3c50', gloves: 'glove', glove: '#4a4468', hat: 'wizard', acc: '#6a46b4', neck: 'cape' }); scene.add(hero);
const mood = D.mood(scene, renderer, 'storm', { follow: hero, range: 34, sky: ['#0a0e22', '#1c2644', '#34466a', '#62769a'], fog: ['#35435f', 26, 230], dir: [.6, .5, -.62] });

// ---- 地形：手前のがけ（z > 24）、深い谷、むこうの岩山（まん中が 0, -71）。橋の先の道だけ、石段に合わせて まっすぐ上がる ----
const sm = (a, b, v) => { const k = Math.max(0, Math.min(1, (v - a) / (b - a))); return k * k * (3 - 2 * k); }, TZ = -50, TY = 10;
const stepY = z => TY * Math.max(0, Math.min(1, (-21.5 - z) / 18)), q = (x, z) => Math.hypot(x / 30, (z + 50) / 30);
const H = (x, z) => { const e = q(x, z), n = W.vn(x * .14, z * .14, 4), crag = sm(1.12, .92, e), near = sm(21.5, 26, z), top = TY * sm(.95, .3, e) + (n - .5) * 5 * sm(.25, .55, e) + sm(.5, .85, e) * sm(1.1, .8, e) * W.vn(x * .4, z * .4, 9) * 4;
  const y = -38 * (1 - Math.max(crag, near)) + crag * top + (1 - crag) * (1 - near) * (n - .5) * 6, k = sm(3.6, 2.2, Math.abs(x)) * sm(-19.5, -21.5, z) * sm(-45, -41, z); return y + (stepY(z) - .2 - y) * k; };
const GATE = -20.5, FIRES = [[-3.1, GATE + 2.2], [3.1, GATE + 2.2]], LIT = FIRES.map(([x, z]) => ({ x, z, r: 9, c: '#58f0a0', k: 1.1 }));
const land = R.ground({ w: 170, d: 190, cell: 2.5, cz: -30, H, layers: [W.tex.caveRock({ c: '#4c5270', glint: false, seed: 2 }), D.tex.deadGrass({ c: '#465258' }), D.tex.wetCobble({ c: '#5c6482' })],
  mix: (x, z) => [z > 24 && W.vn(x * .3, z * .3, 6) > .4 ? .8 : 0, (z > 23 && Math.abs(x) < 2.6) || (Math.abs(x) < 4.5 && z < GATE + 4 && z > GATE - 2) ? 1 : 0], shade: mood.shade(LIT) }); scene.add(land.mesh);

// ---- 橋：5 つのアーチをつないだ長い石の橋（z の向き）と、谷の底へ下りる橋きゃく、らんかんの柱 ----
const fixed = [], put = (o, x, z, ry = 0, y = H(x, z)) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
const stone = D.tex.stone({ c: '#646a8a', moss: .25 }), deck = D.tex.wetCobble({ c: '#626a8a', wet: .6 }), SPAN = 14.3, BW = 3.8, G = R.geo();
for (let i = 0; i < 3; i++) put(W.stoneBridge({ len: SPAN, w: BW, rise: 0, rail: .85, tex: stone, deck, drop: 6.5, thick: .8, n: 10 }), 0, 24 - SPAN * (i + .5), PI / 2, 0);
for (let i = 0; i <= 3; i++) { const z = 24 - SPAN * i; if (i > 0 && i < 3) G.box(BW + 1.2, 44, 3, 0, -46, z, { m: 3, c0: .55 }).box(BW + 2, 1, 3.8, 0, -3, z, { m: 3, c0: .8 }); for (const sx of [-1, 1]) G.box(.8, 1.3, .9, sx * (BW / 2 - .05), -.3, z, { m: 3, c0: .75 }).box(1, .16, 1.1, sx * (BW / 2 - .05), 1, z, { m: 3 }); }
fixed.push(G.mesh(stone));
for (const sx of [-1, 1]) put(D.statue({ kind: 'knight', s: 1.5, seed: sx + 3, c: '#7a80a0' }), sx * 6.3, GATE + 1.5, -sx * .3);

// ---- 岩山の上の塔：高い主塔（窓に緑のあかり）と、わきの低い塔、橋の先の門と石段、門の両わきの緑の火 ----
const ash = F.tex.ashlar({ c: '#565c7e', moss: .25 }), slate = F.tex.slate({ c: '#2a3256' }), TR0 = 4.8, TH = 30, ty = H(0, TZ) - .6;
put(F.tower({ r: TR0, h: TH, stone: ash, roof: slate, roofH: 12, wins: false, flag: { c: '#3c8a5c', crest: 'moon', cc: '#c8f0d0', w: 2.2, h: 1.4 } }), 0, TZ, 0, ty);
put(F.tower({ r: 2.5, h: 17, stone: ash, roof: slate, roofH: 7, wins: false }), 7.6, TZ + 3.5, .4, H(7.6, TZ + 3.5) - 1.5); put(F.tower({ r: 2.1, h: 11, stone: ash, top: 'crenel', wins: false }), -7.4, TZ + 2, .2, H(-7.4, TZ + 2) - 1.5);
put(F.tower({ r: 1.7, h: 9, stone: ash, roof: slate, roofH: 5, wins: false }), -3.4, TZ - 1.5, 0, ty + 19);   // 主塔のとちゅうから つき出た小さな塔
put(F.wall({ len: 9, h: 6, stone: ash }), 5, TZ + 5.5, -.5, H(5, TZ + 5) - 1.5); put(F.wall({ len: 8, h: 5, stone: ash }), -5, TZ + 5, .45, H(-5, TZ + 5) - 1.5);
put(F.gate({ w: 8.4, h: 8.2, d: 2.8, aw: 3.5, ah: 4.9, arch: 'point', door: 'portcullis', open: .55, stone: ash, crest: 'moon' }), 0, GATE, 0, -.1); put(F.stairs({ w: 4.2, h: TY, d: 18, tex: F.tex.ashlar({ c: '#5c6284' }) }), 0, -30.5, 0, -.1);
// 緑の窓：主塔の正面と ななめの面に、らせんに上がる。にじみと、かべの光の輪
const winT = T.window({ lit: 1, glass: '#46ff90', curtain: false, bars: 'cross', arch: 1, h: 48 }), WG = R.geo(), WINS = [[0, 6, 1], [1, 10.5, 1], [0, 15, 1.1], [-1, 19, 1], [0, 23.5, 1.25], [1, 26.5, 1], [0, 28.2, .8]], wallGlow = [];
for (const [f, y, s] of WINS) { const a = f * PI / 4, d = TR0 * .924 + .08, cx = Math.sin(a) * d, cz = TZ + Math.cos(a) * d, tx = Math.cos(a) * .5 * s, tz = -Math.sin(a) * .5 * s; WG.quad([cx - tx, ty + y, cz - tz], [cx + tx, ty + y, cz + tz], [cx + tx, ty + y + 1.7 * s, cz + tz], [cx - tx, ty + y + 1.7 * s, cz - tz]);
  const h = D.halo({ c: '#40ff88', r: 2.6 * s, k: .8 }); h.position.set(cx + Math.sin(a) * .8, ty + y + .9 * s, cz + Math.cos(a) * .8); scene.add(h); wallGlow.push({ p: [cx + Math.sin(a) * .04, ty + y + .8 * s, cz + Math.cos(a) * .04], n: [Math.sin(a), 0, Math.cos(a)], r: 2.6, r2: 3.4, c: '#38e880', k: .55 }); }
for (const [x, y, z] of [[7.6, H(7.6, TZ + 3.5) + 9.5, TZ + 3.5 + 2.5 * .924 + .08], [0, 5.6, GATE + 1.5]]) { WG.quad([x - .4, y, z], [x + .4, y, z], [x + .4, y + 1.3, z], [x - .4, y + 1.3, z]); const h = D.halo({ c: '#40ff88', r: 1.8, k: .7 }); h.position.set(x, y + .7, z + .6); scene.add(h); }
const wins = WG.mesh(winT, { glow: true, fog: false, color: '#a8ffc8' }); wins.castShadow = false; scene.add(wins);
for (const [x, z] of FIRES) put(D.brazier({ s: 1.25, c: '#58ffa0', light: x < 0 }), x, z, 0);
fixed.push(D.pools([...wallGlow, ...FIRES.map(([x, z]) => ({ p: [x * 1.05, 3.6, GATE + 1.46], n: [0, 0, 1], r: 4.4, r2: 4, c: '#48e890', k: .7 }))]), D.streaks(FIRES.map(([x, z]) => ({ x: x * .5, z, h: 1.4, c: '#58f0a0', k: .6, w: 1 }))));

// ---- 谷から立つ岩の柱、岩山の とがった岩、がけの上の枯れ木 ----
const rockT = W.tex.caveRock({ c: '#4a5070', glint: false });
for (let i = 0; i < 22; i++) { const sx = i % 2 ? 1 : -1, x = sx * (11 + hash(i, 1) * 40), z = 18 - hash(i, 2) * 40, h = 22 + hash(i, 3) * 26; put(W.pillar({ h, r: 2.6 + hash(i, 4) * 3, spire: true, seed: i, tex: rockT }), x, z, i, -40); }
for (let i = 0; i < 20; i++) { const a = i / 20 * PI * 2 + hash(i, 5), r = 11 + hash(i, 6) * 13, x = Math.sin(a) * r, z = TZ + Math.cos(a) * r * .95; if (Math.abs(x) < 5 && z > TZ) continue; put(W.pillar({ h: 6 + hash(i, 7) * 12, r: 1.6 + hash(i, 8) * 2, spire: true, seed: i + 30, tex: rockT }), x, z, i, H(x, z) - 2); }
for (let i = 0; i < 9; i++) { const sx = i % 2 ? 1 : -1, x = sx * (4.5 + hash(i, 9) * 16), z = 26 + hash(i, 10) * 10; put(i % 3 ? D.deadTree({ h: 6 + hash(i, 11) * 4, seed: i }) : R.rock({ s: 1.6, c: '#565c78', seed: i }), x, z, i); }
for (const [x, z, h] of [[-9, TZ + 9, 7], [10.5, TZ + 10, 8], [-13, TZ + 2, 6]]) put(D.deadTree({ h, seed: h }), x, z, h);
scene.add(R.merge(fixed));

// ---- 空と天気：雷雲、強い風の雨、いなずま（塔のむこう）、谷の霧、こうもりの群れ ----
scene.add(D.clouds({ n: 8, r: 185, y: 62, s: 95, c: '#2e3a62', shade: '#1c2446', speed: .02, seed: 3 }), D.rain({ n: 1100, slant: [.7, .16], speed: 30, len: .9, box: [28, 14, 28] }), D.lightning(mood, { first: 2.3, every: 6, az: -6, spread: 46, dist: 200, power: 1.1 }));
scene.add(D.groundFog({ n: 44, box: [90, 90], H: () => -9, c: '#7e90ba', a: .26, h: 5, w: 18, wind: [1.6, .3] }));
const batC = [0, 3, 0], bats = D.flock({ kind: 'bat', n: 12, r: 7, h: 2.5, center: batC, s: .9 }); scene.add(bats, D.flock({ kind: 'bat', n: 16, r: 10, h: 5, center: [0, ty + 24, TZ], s: 3 }));

// ---- 主役：つえ（先に緑白い あかり）。マントは風で横へ なびく ----
const staff = F.wear(hero, 'staff', { len: 1.5, c: '#4a3c50' }), B = hero.userData.build, tipY = -B.farm - B.hand[2] * .5 + 1.5 * (B.thigh + B.shin + B.torso) / 1.1 * .6;
const orb = W.crystal({ h: .16, n: 3, c: '#8affc0', halo: false }), orbH = D.halo({ c: '#70ffb0', r: .28, k: .5 }), orbL = new THREE.PointLight('#8affc0', 2.5, 6, 1.5); orb.position.set(0, tipY - .05, .06); orbH.position.set(0, tipY + .05, .06); orbL.position.copy(orbH.position); staff.add(orb, orbH, orbL);
const spot = D.spot({ c: '#60f0a8', r: 2.4, k: .3 }); scene.add(spot);
const crt = R.crt(renderer, { noise: 0, bright: 1.08 }); onResize(crt.resize);
const Z0 = 18, LEN = 20, SPEED = 1.6, T0 = +new URLSearchParams(location.search).get('t0') || 0, J = hero.userData.J;   // ?t0=秒 で、とちゅうから見る
K.loop((dt, t) => { t += T0;
  const z = Z0 - (t * SPEED) % LEN, sway = Math.sin(t * .3) * .45;
  hero.position.set(sway, 0, z); hero.rotation.y = PI + Math.cos(t * .3) * .08; R.walk(hero, t * SPEED * 3.6); J.torso.rotation.x += .1;
  const gust = .5 + .5 * Math.sin(t * .9) * Math.sin(t * .37 + 1); J.cape.rotation.set(-(.6 + gust * .35 + Math.sin(t * 7) * .08), 0, .1 + gust * .1 + Math.sin(t * 5.3) * .04);
  spot.position.set(sway - .35, .07, z - .1); orbL.intensity = 2.5 * (.85 + .15 * Math.sin(t * 3.1)); batC[0] = Math.sin(t * .2) * 3; batC[2] = z - 9;
  const tall = innerWidth < innerHeight, Dc = tall ? 4.1 : 4.8, far = (18 - z) / 20; cam.position.set(sway * .6 + 1, tall ? 1.7 : .95, z + Dc); cam.lookAt(sway * .3 - (tall ? .3 : .9), (tall ? 4.4 : 3.5) + far * 1.1, z - 7);   // 低い所から見上げて、主役と塔の高さを 1 枚に入れる
  land.follow(0, -30); D.tick(t, cam); F.tick(t); crt.render(scene, cam, t);
});
</script>
