<!doctype html>
<html lang="ja">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>9-09 からすの麦畑 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#ffe6e0;opacity:.9;text-shadow:0 1px 0 #000}
</style>
<div id="cap">9-09 ─ からすの麦畑 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="../game-looks-8/pack-fantasy-town.js"></script>
<script src="pack-dark.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 日がしずんだあとの、枯れた麦畑。赤むらさきの空と低い赤い月の下、畑の中の道を、むぎわら帽子の農夫がランタンをさげて帰る。
// 道の両がわに かかしが何本も立ち、うでに からすが とまっていて、近づくと飛びたつ。遠くに、風車と納屋の黒い影。
// 色の組は「赤むらさきの空・黒い影・麦の黄土」＋ランタンの黄。空の明るい地平線の前に、かかしと風車を影絵にして読ませる（D.mood の 'blood'）。
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), F = PACK_FTOWN(THREE, K, R), D = PACK_DARK(THREE, K, R), T = R.tex, { hash } = K;
const { scene, cam, renderer, onResize } = K.stage({ fov: 50, far: 900, aa: false, fitAspect: .9, maxFov: 76 });
const hero = R.actor({ build: 'toon', hairStyle: 'short', hair: '#6a4a34', beard: 'stubble', cloth: 'overall', top: '#4e6290', top2: '#e0d4b4', bottom: '#4e6290', shoe: '#5a4030', gloves: 'glove', glove: '#8a6a48', neck: 'scarf', acc: '#d8b848' }); scene.add(hero);
F.wear(hero, 'strawHat', { c: '#e4cc80', c2: '#a8483c', wide: true });
const moon = D.moon({ red: true, az: 12, el: 15, r: 30, halo: 2.4 }); scene.add(moon);
const mood = D.mood(scene, renderer, 'blood', { follow: hero, range: 30, dir: [moon.userData.dir.x, .42, moon.userData.dir.z], hillsY: -5 });

// ---- 地面：畑の土と、まがる土の道 ----
const pathX = z => Math.sin(z * .11) * 1.8 + Math.sin(z * .05 + 1) * .8, cl = v => Math.max(0, Math.min(1, v));
const land = R.ground({ w: 130, d: 150, cell: 2, cz: -20, layers: [T.dirt({ c: '#5c4a44' }), T.dirt({ c: '#8a745e', pebbles: .5 }), D.tex.deadGrass({ c: '#6a6444' })],
  mix: (x, z) => [cl(1.5 - Math.abs(x - pathX(z)) / 1.1), cl((Math.sin(x * .9 + z * .3) * Math.sin(z * .7) - .1) * 2)], shade: mood.shade([{ x: 23.5, z: -42, r: 6, c: '#ffb050', k: .8 }]) }); scene.add(land.mesh);

// ---- 麦：枯れた麦のうねを、道にそって何列も。ところどころ たおれて低い ----
const wheat = [T.tuft({ kind: 'wheat', c: '#b8922e' }), T.tuft({ kind: 'wheat', c: '#9c7c30', seed: 2 })], GW = [R.geo().normal([0, 1, 0]), R.geo().normal([0, 1, 0])], off = x => x - pathX(0);
for (let i = -34; i <= 34; i++) { if (Math.abs(i) < 2) continue; const dx = i * .85 + (i > 0 ? .5 : -.5); for (let z = 22; z > -64; z -= 2.4) { const x0 = pathX(z) * Math.max(0, 1 - Math.abs(i) / 14) + dx, x1 = pathX(z - 2.4) * Math.max(0, 1 - Math.abs(i) / 14) + dx, n = R.tn(x0 * 3 + 200, z * 3 + 300, 14, 14, 600, 600, 4), h = n > .72 ? .35 : .85 + hash(i, Math.round(z)) * .55, sh = .62 + hash(i, z | 0, 3) * .2;
  if (n > .8) continue; const a = [x0, 0, z], b = [x1, 0, z - 2.4], c = [x1 + .12, h, z - 2.4], d = [x0 + .12, h, z], uv = [0, 0, 2.4 / (h > .5 ? 1 : .6), 1], vc = [sh, sh, 1.08, 1.08]; if (i < 0) GW[(i + 40) % 2].quad(a, b, c, d, uv, vc); else GW[(i + 40) % 2].quad(b, a, d, c, uv, vc); } }   // 表の面を、いつも道のほうへ向ける
for (let k = 0; k < 150; k++) { const x = (hash(k, 1) - .5) * 58, z = 22 - hash(k, 2) * 84; if (Math.abs(x - pathX(z)) < 2.2) continue; const h = .9 + hash(k, 3) * .5; GW[k % 2].quad([x - 1.3, 0, z], [x + 1.3, 0, z], [x + 1.3, h, z + .1], [x - 1.3, h, z + .1], [0, 0, 2.6, 1], [.65, .65, 1.05, 1.05]); }
const fixed = GW.map((g, i) => { const m = g.mesh(wheat[i], { side: true }); m.castShadow = false; return m; }), put = (o, x, z, ry = 0, y = 0) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };

// ---- かかし：道の両がわに何本も。うでに からすが とまる ----
const SC = [[-2.6, 6.5, 1.45, .5, '#5a4a6a'], [3, 1, 1.6, -.6, '#6a3a40'], [-3.2, -6, 1.5, .4, '#4a5a5a'], [2.8, -12.5, 1.7, -.4, '#5a4a6a'], [-3, -20, 1.55, .6, '#6a3a40'], [3.4, -28, 1.75, -.5, '#4a4a66'], [-7.5, -3, 1.5, .9, '#5a4a6a'], [9, -9, 1.6, -.9, '#6a3a40'], [-11, -22, 1.7, .7, '#4a5a5a'], [13, -30, 1.8, -.6, '#5a4a6a'], [-5, -37, 1.7, .3, '#6a3a40']], perch = [];
SC.forEach(([dx, z, s, ry, c], i) => { const x = pathX(z) + dx; put(D.scarecrow({ s, c }), x, z, ry).rotation.z = (hash(i, 9) - .5) * .16; if (i !== 2) for (const sx of i % 3 ? [-1, 1] : [1]) perch.push([x + Math.cos(ry) * sx * .5 * s, 1.44 * s, z - Math.sin(ry) * sx * .5 * s, ry + sx]); if (i % 2 === 0) perch.push([x, 2.02 * s, z, ry + 2]); });

// ---- 遠くの影：風車と納屋、くずれた さく、こわれた荷車、枯れ木 ----
const mill = F.windmill({ h: 13, stone: '#3c2c3c', roof: '#2c2030', c: '#5a3a44', speed: .35 }); mill.position.set(-17, 0, -50); mill.rotation.y = .5; scene.add(mill);
put(R.house({ w: 9, d: 7, h: 4.2, wall: T.boards({ c: '#3e2e3a' }), roof: T.shingle({ c: '#2e2430' }), roofKind: 'gable', pitch: 1.1, win: T.window({ lit: 1, bars: 'cross' }), lit: .5, wins: [1], door: T.door({ style: 'plank', frame: '#3a2a30' }), seed: 3 }), 22, -46, -.5);
for (const [x, z, ry, lean] of [[-2.4, 14, 1.5, .1], [2.9, 9, 1.62, -.12], [-2.9, -14, 1.5, .08], [3, -21, 1.6, -.1]]) put(R.fence({ len: 4.5, kind: 'rail', c: '#4a3a40' }), pathX(z) + x, z, ry).rotation.z = lean;
put(D.wreckCart({ c: '#4a3c44' }), pathX(10) + 4.6, 10.5, .7);
const trees = [[-14, 4, 9], [16, -4, 10], [-21, -28, 12], [10, -44, 11], [26, -20, 10]].map(([x, z, h], i) => put(D.deadTree({ h, seed: i + 60, c: '#3e3040' }), x, z, i * 2));
scene.add(R.merge(fixed));

// ---- 空と空気：赤い月の前を流れる雲、畑をはう もや、風にまう麦のくず ----
scene.add(D.clouds({ n: 10, r: 250, y: 70, s: 100, c: '#6a2c40', shade: '#2e1226', speed: .016, phase: 1.2 }), D.groundFog({ n: 44, box: [60, 60], y: .5, c: '#d88a80', a: .17, h: 1.3, w: 8, wind: [.8, .2] }), D.flakes({ kind: 'dust', n: 160, c: '#e8c070', box: [22, 6, 22], size: 1.4, vy: -.15, wind: [1.2, .3] }));

// ---- からす：かかしと木に とまり、主役が近づくと飛びたつ。遠くに輪をかく群れ ----
const perchOf = (i, k) => { const t = trees[i]; t.updateMatrixWorld(); return t.userData.perch[k].clone().applyMatrix4(t.matrixWorld); };
scene.add(D.perched([...perch, [...perchOf(0, 0).toArray(), 1], [...perchOf(1, 1).toArray(), 2], [pathX(3) - .4, 0, 3, 1], [pathX(-9) + .6, 0, -9, 2.4]], { watch: hero, near: 5.2 }));
scene.add(D.flock({ n: 12, r: 12, h: 3, center: [-6, 9, -30], s: 1.6 }), D.flock({ n: 7, r: 7, h: 2, center: [9, 6, -10], s: 1.5, speed: .7 }));

const lamp = D.lantern(hero, { hand: 'L', c: '#ffd060', power: 10, range: 8, r: 3, k: .7 }), crt = R.crt(renderer, { noise: 0, bright: 1.06 }); onResize(crt.resize);
const Z0 = 13, LEN = 40, SPEED = 1.5;
K.loop((dt, t) => {
  const z = Z0 - (t * SPEED) % LEN, x = pathX(z), tx = pathX(z - 1) - x;
  hero.position.set(x, 0, z); hero.rotation.y = Math.PI - Math.atan2(tx, 1); R.walk(hero, t * SPEED * 3.6, .9); D.lanternPose(hero);
  const tall = innerWidth < innerHeight, Dc = tall ? 4.1 : 5.4; cam.position.set(x * .7 + .8, tall ? 2.2 : 1.65, z + Dc); cam.lookAt(x * .7 - .3, tall ? 2.4 : 2.6, z - 6);   // 低い所から少し見上げて、かかしの影と赤い月を入れる
  D.tick(t, cam); F.tick(t); crt.render(scene, cam, t);
});
</script>
</html>
