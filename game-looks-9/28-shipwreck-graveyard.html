<title>9-28 船の墓場 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#d8e0f4;opacity:.85;text-shadow:0 1px 0 #012}
</style>
<div id="cap">9-28 ─ 船の墓場 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で泳ぐ）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="../game-looks-8/pack-sea.js"></script>
<script src="pack-dark.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// テイスト B。面の少ない形（帆船・帆柱・いかり・たる・くらげ・ヘルメットのダイバー）に、その場で打ったドット絵をはり、横 320 ドットほどの粗い絵に描いて、ブラウン管に映す。
// 海底にならぶ難破船の墓場。色は 緑がかった暗い青の水と、くらげの青白い光の 2 つ（差し色は主役の赤）。船は かたむき、へさきや ともを砂にうずめ、折れた帆柱が林のように立つ。いかりと くさり、こわれた たる。
// うすく光るくらげが帆柱の間をただよい、近くの船と柱を青白くてらす。赤い服のダイバーが、ランプで前をてらしながら船の間を泳ぐ。水の中の光は S.underwater（deep を緑がかった暗い色に上書き）。くさりは pack-dark.js（D.chain）
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), S = PACK_SEA(THREE, K, R), D = PACK_DARK(THREE, K, R), { hash } = R, T = R.tex;
const { scene, cam, renderer, onResize } = K.stage({ fov: 52, far: 900, aa: false, fitAspect: .9, maxFov: 78 });
const env = S.underwater(scene, renderer, { depth: 'deep', top: 40, surface: false, rays: 8, range: 34, hi: '#1f6676', mid: '#0f3c4e', low: '#061622', fog: '#0c3242', near: 4, far: 56, amb: .98, sky: 0x8ad0d8, ground: 0x3a6078, sun: 0xa8e8e0, ray: '#9ae8d8', power: .55, rayA: .2, motes: 130 }), sun = env.sun;

// ---- 泳ぐ道（大きく ひと回り）と、海底：暗い緑の砂と、もの ついた岩 ----
const path = new THREE.CatmullRomCurve3([[0, 0], [12, -6], [25, -2], [33, 9], [30, 23], [18, 30], [5, 26], [-7, 31], [-19, 24], [-22, 11], [-13, 2]].map(([x, z]) => new THREE.Vector3(x, 0, z)), true, 'centripetal'), LEN = path.getLength(), PP = path.getSpacedPoints(200);
const dP = (x, z) => { let b = 1e9; for (const p of PP) { const d = (p.x - x) ** 2 + (p.z - z) ** 2; if (d < b) b = d; } return Math.sqrt(b); };
const H = (x, z) => .5 * Math.sin(x * .17 + 1) * Math.cos(z * .15) + .25 * Math.sin(x * .41 + z * .36) + Math.min(1.6, Math.max(0, dP(x, z) - 8) * .1);
const bed = S.seabed({ env, w: 124, d: 124, cell: 2, H, caustic: .08, layers: [S.tex.sand({ c: '#8aa8a0' }), S.tex.grown({ base: 'rock', o: { c: '#5a7078' }, grow: .7, algae: '#3a8a6a', seed: 2 })], mix: (x, z) => [Math.min(1, Math.max(0, .5 + .9 * Math.sin(x * .31 + 2) * Math.cos(z * .27))), 0] }); scene.add(bed.mesh);
const fixed = [], put = (o, x, z, ry = 0, dy = 0) => { o.position.set(x, H(x, z) + dy, z); o.rotation.y = ry; fixed.push(o); return o; };
const side = (u, sd, off) => { const p = path.getPointAt(u % 1), tg = path.getTangentAt(u % 1); return [p.x + tg.z * sd * off, p.z - tg.x * sd * off, Math.atan2(tg.x, tg.z)]; };

// ---- 難破船：道の両がわに 10 せき。よこへ かたむき（lean）、前後にも かしいで（dip）砂にうずまる。帆の のこる船と、柱だけの船 ----
// [道の上の位置 u, 側, 道からの きょり, 向き（道に対して）, 大きさ, lean, dip, しずみ, 帆]
const SHIPS = [[.085, 1, 8.5, .5, 1.1, .28, -.1, .7, 1], [.13, -1, 9, 2.5, 1, -.42, .22, 1.3, 0], [.2, 1, 10, -1.1, 1.25, .2, .3, 1.8, 1], [.3, -1, 8.5, .3, .9, .5, -.16, .8, 0], [.39, 1, 9.5, 2.1, 1.1, -.3, -.3, 1.7, 1],
  [.49, -1, 9, -.6, 1.2, .34, .12, .9, 0], [.59, 1, 9, 1.2, 1, -.5, -.2, 1.2, 1], [.69, -1, 10, 2.8, 1.3, .24, .28, 1.9, 0], [.8, 1, 8.5, -.3, .95, .4, -.12, .8, 1], [.93, -1, 9.5, 1.8, 1.1, -.3, .18, 1.2, 1]];
const CHAINS = [], V = new THREE.Vector3();
SHIPS.forEach(([u, sd, off, ry, s, lean, dip, sink, sail], i) => { const [x, z, a] = side(u, sd, off), g = new THREE.Group(); g.add(S.ship({ s, c: ['#74604e', '#66584e', '#7a6850'][i % 3], deck: '#8e8468', grow: .8, sail: sail ? ['#a8b0a0', '#98a4a0'][i % 2] : false, seed: i }));
  g.rotation.order = 'YXZ'; g.rotation.set(dip, a + ry, lean); put(g, x, z, a + ry, -sink); g.rotation.set(dip, a + ry, lean); g.updateMatrixWorld(true);
  CHAINS.push(g.localToWorld(V.set(0, 4.4 * s, 6.5 * s)).clone()); if (i % 2) CHAINS.push(g.localToWorld(V.set(-2.2 * s, 4.2 * s, -5 * s)).clone()); });
// 帆柱の林：砂から ななめに立つ折れた柱（横木つき）。船のまわりと、船の間に
const mastT = S.tex.grown({ base: 'planks', o: { c: '#6e5c4c' }, grow: .7, algae: '#3a8a6a', seed: 5 });
const mast = (h, r, yards, broken, sd) => { const G = R.geo().smooth(1); G.loft(6, [[-.6, r * 1.15, r * 1.15, 0, .7], [h * .5, r * .9, r * .9, h / 3, .9], [h, r * (broken ? .8 : .5), r * (broken ? .8 : .5), h / 1.5, 1]], { cap: 'top', ur: 1 });
  for (let k = 0; k < yards; k++) { const y = h * (.92 - k * .3), len = (2.2 + hash(sd, k) * 1.6) * (1 - k * .15); G.at(R.TR(0, y, 0, 0, 0, Math.PI / 2 + (hash(sd, k, 2) - .5) * .5)).loft(5, [[-len / 2, .07, .07, 0, .8], [len / 2, .07, .07, len / 1.5, 1]], { cap: 'both' }).at(null); }
  if (broken) G.at(R.TR(r * .5, h, 0, 0, 0, -2.2)).loft(5, [[0, r * .7, r * .7, 0, .8], [h * .35, r * .45, r * .45, 1, 1]], { cap: 'top' }).at(null); return G.mesh(mastT); };
for (let i = 0; i < 52; i++) { const u = (i + hash(i, 1) * .7) / 52, [x, z] = side(u, i % 2 ? 1 : -1, 3.4 + hash(i, 2) * 8), h = 5 + hash(i, 3) * 7, m = mast(h, .2 + h * .018, i % 3 === 2 ? 0 : 1 + (i % 2), i % 3 === 2, i); m.rotation.order = 'YXZ'; put(m, x, z, hash(i, 4) * 6.28, -.2); m.rotation.z = (hash(i, 5) - .5) * .7; m.rotation.x = (hash(i, 6) - .5) * .4; }
// いかり、たる、つぼ、箱、岩、海草
for (let i = 0; i < 12; i++) { const [x, z, a] = side((i + .5) / 12, i % 2 ? -1 : 1, 2.6 + hash(i, 7) * 2.4), an = put(S.anchor({ s: 1.1 + hash(i, 8) * .5, grow: .7 }), x, z, a + i, .12); an.rotation.z = i % 3 ? -1.2 : .35; an.rotation.x = .15; if (i % 3 === 0) CHAINS.push(new THREE.Vector3(x, H(x, z) + 2.4, z)); }
for (let i = 0; i < 40; i++) { const [x, z] = side(hash(i, 9), i % 2 ? 1 : -1, 1.8 + hash(i, 10) * 5.5), k = i % 5;
  const o = k < 2 ? R.barrel({ c: i % 2 ? '#6a5a48' : '#5e5a50' }) : k < 3 ? S.pot({ s: 1, c: '#7a8a88', c2: '#b8c0a8', grow: .7, seed: i }) : k < 4 ? R.crate({ s: .8, c: '#665a4a' }) : S.rock({ s: .7 + hash(i, 11) * .8, seed: i, c: '#5a7078', grow: .7 }); put(o, x, z, i * 1.9, k < 4 ? -.12 : -.2); if (k < 4) { o.rotation.z = (hash(i, 12) - .3) * 1.6; o.rotation.x = (hash(i, 13) - .5) * .8; } }
put(S.chest({ s: 1.3, open: 0, c: '#5e5648' }), ...side(.07, -1, 2.6), -.12).rotation.z = .3;
for (let i = 0; i < 70; i++) { const [x, z] = side(hash(i, 14), i % 2 ? 1 : -1, 1.5 + hash(i, 15) * 9); put(i % 4 === 0 ? S.kelp({ h: 2.5 + hash(i, 16) * 4, w: .7, kind: 'ribbon', c: '#3a8a6a', amp: .4, seed: i }) : S.seagrass({ s: .5 + hash(i, 17) * .6, c: i % 2 ? '#3a8a7a' : '#5a9a6a', seed: i }), x, z, i * 1.7, -.02); }
scene.add(R.merge(fixed));
// くさり：へさきや いかりから まっすぐ下がる（ゆっくり ゆれる）
CHAINS.forEach((p, i) => { const c = D.chain({ len: Math.max(1.2, p.y - H(p.x, p.z) + .2), sway: .05, seed: i, c: '#7a8a90' }); c.position.copy(p); c.rotation.y = i; scene.add(c); });

// ---- うすく光る 青白いくらげ：帆柱の間に 44 ひき。ゆっくり上下にただよう。近い大きな 3 びきは、まわりの船と柱も青白くてらす ----
const live = [], add = (o, f) => { scene.add(o); live.push(t => { f && f(o, t); o.userData.tick(t); }); return o; };
const jl = [], JC = ['#c8ecff', '#a8dcf8', '#e0f4ff'];
for (let i = 0; i < 44; i++) { const u = (i + hash(i, 20) * .8) / 44, big = i % 6 === 2, s = big ? 1.7 + hash(i, 21) * .8 : .5 + hash(i, 21) * .6, [x, z] = side(u, i % 2 ? 1 : -1, big ? 2.5 + hash(i, 22) * 3.5 : 1 + hash(i, 22) * 8), y = big ? 5.5 + hash(i, 23) * 3 : 1.8 + hash(i, 23) * 7;
  const j = add(S.jelly({ c: JC[i % 3], s, seed: i, alpha: .85 }), (o, t) => o.position.set(x + Math.sin(t * .13 + i) * .9, H(x, z) + y + Math.sin(t * .2 + i * 2) * .7, z + Math.cos(t * .1 + i) * .9)); jl.push({ j, big }); }
const lamps = [0, 1, 2].map(() => { const l = new THREE.PointLight('#b8e4ff', 16, 15, 1.4); scene.add(l); return l; });
const P0 = path.getPointAt(.11);
add(S.school({ n: 34, s: 1.4, rx: 6, rz: 4, h: 2, speed: 1, spread: 1.6, c: '#88b8b8', c2: '#d8f0f0', tints: ['#ffffff', '#c8f0e8'] })).position.set(P0.x, 5.5, P0.z);
add(S.school({ n: 28, s: 1.4, rx: 5, rz: 4, h: 1.6, speed: -1, spread: 1.6, seed: 4, c: '#88b8b8', c2: '#d8f0f0' })).position.set(path.getPointAt(.55).x, 5, path.getPointAt(.55).z);

// ---- 主役：ヘルメットのダイバー（赤い服に 生成りのボンベ。ヘルメットの上のランプが前をてらす） ----
const hero = S.diver({ head: 'helmet', tank: '#e8e0c8', fin: '#e8d8a0', metal: '#c0a060', actor: { hairStyle: 'short', hair: '#3a3030', top: '#e04a44', top2: '#f0e4c8', bottom: '#c83c3c', glove: '#f0e4c8', shoe: '#7a3030', belt: '#f0e4c8' } }); scene.add(hero);
// pack のヘルメットは、よこのくり返し（ur: 3）がテクスチャの金物の区画からはみ出すので、ここで UV を区画の中へ折り返す（第 8 集の 35 と同じ）
{ const hm = hero.userData.J.head.children.at(-1), uv = hm.geometry.attributes.uv, u0 = 17 / 64, w = 14 / 64; for (let i = 0; i < uv.count; i += 3) { if (uv.getY(i) > .25) continue; const k = Math.floor((Math.min(uv.getX(i), uv.getX(i + 1), uv.getX(i + 2)) - u0) / w + .001); for (let j = 0; j < 3; j++) uv.setX(i + j, uv.getX(i + j) - k * w); } uv.needsUpdate = true; }
{ const J = hero.userData.J, G = R.geo(), y = .46, L = 6.4;   // ランプの光：頭の前へのびる 光の円すい（うすい板 2 枚を十字に。加算）と、ヘルメットの上の小さな あかり
  for (const [ax, ay] of [[1, 0], [0, 1]]) G.quad([-.1 * ax, y - .1 * ay, .36], [.1 * ax, y + .1 * ay, .36], [1.8 * ax, y + 1.8 * ay - .5, L], [-1.8 * ax, y - 1.8 * ay - .5, L], [0, 1, 1, .08]);
  const beam = G.mesh(S.mat(S.tex.shaft({ seed: 1 }), { glow: true, add: true, alpha: .6, side: true, color: '#e8f0ff' })); beam.castShadow = false; beam.renderOrder = 6; J.head.add(beam);
  const bulb = new THREE.Sprite(new THREE.SpriteMaterial({ map: S.tex.bubble(), color: '#f4f8ff', blending: THREE.AdditiveBlending, depthWrite: false, fog: false })); bulb.material.map = bulb.material.map.clone(); bulb.material.map.repeat.set(.5, 1); bulb.material.map.needsUpdate = true; bulb.scale.setScalar(.26); bulb.position.set(0, y + .12, .34); J.head.add(bulb); }
const headLamp = new THREE.SpotLight('#eaf4ff', 75, 22, .5, .7, 1.1); scene.add(headLamp, headLamp.target);
const selfLight = new THREE.PointLight('#c8e8f0', 2.2, 4, 1.4); scene.add(selfLight);   // 主役の体が暗くつぶれないための、ごく弱い光
const crt = R.crt(renderer, { noise: 0, bright: 1.08 }); onResize(crt.resize);
const cd = new THREE.Vector3(), SPEED = 1.2; let dist = .035 * LEN, first = true, hy = 3;
K.loop((dt, t) => {
  dist += SPEED * dt; const u = (dist / LEN) % 1, p = path.getPointAt(u), tg = path.getTangentAt(u), gy = H(p.x, p.z) + 2.7 + Math.sin(t * .5) * .25; hy += (gy - hy) * Math.min(1, dt * 2);
  hero.position.set(p.x, hy, p.z); hero.rotation.y = Math.atan2(tg.x, tg.z); S.swim(hero, t, { rate: 4.4 }); S.breathe(hero, env.bubbles, dt, 2.2);
  headLamp.position.set(p.x + tg.x * .5, hy + .5, p.z + tg.z * .5); headLamp.target.position.set(p.x + tg.x * 8, hy - 1.2, p.z + tg.z * 8); selfLight.position.set(p.x - tg.x * 1.2, hy + 1.4, p.z - tg.z * 1.2);
  if (first) { cd.copy(tg); first = false; } cd.lerp(tg, 1 - Math.exp(-dt * 1.3)).normalize(); const tall = innerWidth < innerHeight, Dc = tall ? 3.3 : 4, Sd = tall ? .8 : 1.8;
  cam.position.set(p.x - cd.x * Dc + cd.z * Sd, hy + (tall ? .9 : .7), p.z - cd.z * Dc - cd.x * Sd); cam.lookAt(p.x + cd.x * 2.6, hy + (tall ? 1.6 : 1.5), p.z + cd.z * 2.6);
  for (const f of live) f(t);
  const near = jl.filter(a => a.big).sort((a, b) => a.j.position.distanceToSquared(hero.position) - b.j.position.distanceToSquared(hero.position)); lamps.forEach((l, i) => { l.position.copy(near[i].j.position); l.position.y -= .4; l.intensity = 16 * (1 + Math.sin(t * 1.7 + i * 2) * .15); });
  sun.position.set(p.x - 8, 44, p.z + 6); sun.target.position.set(p.x, 0, p.z);
  bed.follow(p.x, p.z); bed.tick(t); env.tick(t, cam, dt); D.tick(t, cam); crt.render(scene, cam, t);
});
</script>
