<!doctype html>
<html lang="ja">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>9-02 月夜の墓地と礼拝堂 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#dff4ee;opacity:.9;text-shadow:0 1px 0 #000}
</style>
<div id="cap">9-02 ─ 月夜の墓地と礼拝堂 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="../game-looks-8/pack-fantasy-town.js"></script>
<script src="pack-dark.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 月夜の墓地。大きな月と流れる雲の下、かたむいた墓石のあいだの小道を、花のかごとランタンを持った人が礼拝堂へ歩く。さびしく、きれいに（こわすぎない）。
// 色の組は「月の青緑・地をはう霧の白・窓とろうそくの黄」＋鬼火のうすみどり。月の光が ななめ うしろから墓石と人の ふちを照らし、
// 礼拝堂の窓と ろうそくのあかりは、地面の明るさに焼きこんで輪にする（D.mood の 'moon'）。
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), F = PACK_FTOWN(THREE, K, R), D = PACK_DARK(THREE, K, R), T = R.tex, { hash } = K;
const { scene, cam, renderer, onResize } = K.stage({ fov: 50, far: 900, aa: false, fitAspect: .9, maxFov: 76 });
const hero = R.actor({ build: 'toon', sex: 'f', hairStyle: 'long', hair: '#ead9a8', mouth: 'small', cloth: 'robe', top: '#7a4a78', top2: '#e8dcc0', skirt: .85, skirtC: '#5a3a64', shoe: '#4a3a40', neck: 'scarf', acc: '#e8e0c8' }); scene.add(hero);
F.wear(hero, 'basket', { hand: 'R', c: '#b89868', fc: ['#ffffff', '#f4b8d0', '#f8e488'] });
const moon = D.moon({ az: -10, el: 21, r: 30 }), mood = D.mood(scene, renderer, 'moon', { follow: hero, range: 32 }); scene.add(moon);

// ---- 地面：枯れ草の中の土の小道。礼拝堂の前だけ石だたみ。窓・とびら・ろうそくのあかりを焼きこむ ----
const CH = [6.8, -18.5], CRY = -.32, CS = 1.25, pathX = z => Math.sin(z * .13) * 1.3 + (z < -8 ? (z + 8) * -.22 : 0);
const CANDLE = [[-3.4, 5.2], [3.6, -4.6], [-4.2, -13.5]], cw = (lx, lz) => [CH[0] + CS * (lx * Math.cos(CRY) + lz * Math.sin(CRY)), CH[1] + CS * (-lx * Math.sin(CRY) + lz * Math.cos(CRY))];
const LIT = [...CANDLE.map(([x, z]) => ({ x, z: z + .7, r: 4.2, c: '#ffc060', k: 1 })), ...[[0, 6.6, 6.5, 1.3], [-4.6, 1.5, 4.5, .9], [-4.6, -1.5, 4.5, .9], [4.6, 1.5, 4.5, .7], [4.6, -1.5, 4.5, .7]].map(([lx, lz, r, k]) => { const [x, z] = cw(lx, lz); return { x, z, r, c: '#ffc868', k }; })];
const land = R.ground({ w: 120, d: 120, cell: 2, cz: -10, layers: [D.tex.deadGrass({ c: '#4c6c62' }), T.dirt({ c: '#6c7068' }), D.tex.wetCobble({ c: '#5e7480', wet: .3, shine: '#b8e0dc' })],
  mix: (x, z) => { const [dx, dz] = [x - CH[0], z - CH[1]]; return [Math.max(0, Math.min(1, 1.25 - Math.abs(x - pathX(z)) / 1.5)) * (z > -20 ? 1 : 0), Math.hypot(dx, dz) < 10 ? 1 : 0]; }, shade: mood.shade(LIT) }); scene.add(land.mesh);

// ---- 礼拝堂、墓石、さく、像、枯れ木 ----
const fixed = [], put = (o, x, z, ry = 0, y = 0) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
const chapel = put(D.chapel({ lit: 1, stone: '#7c84a0' }), CH[0], CH[1], CRY); chapel.scale.setScalar(CS);
const clear = (x, z) => Math.abs(x - pathX(z)) > 2.3 && Math.hypot(x - CH[0], z - CH[1]) > 10.5 && !CANDLE.some(([cx, cz]) => Math.hypot(x - cx, z - cz) < 1.6);
put(D.graves({ n: 40, area: [12, 46], seed: 3, keep: (x, z) => clear(x - 8.5, z - 6) }), -8.5, -6); put(D.graves({ n: 36, area: [12, 44], seed: 11, keep: (x, z) => clear(x + 8.5, z - 5) }), 8.5, -5);
CANDLE.forEach(([x, z], i) => { put(D.grave({ kind: ['round', 'point', 'round'][i], s: 1.35, seed: i + 30, lean: (i - 1) * .08 }), x, z, x < 0 ? .5 : -.5); put(D.candles({ n: 4, len: .8, seed: i }), x + (x < 0 ? .35 : -.35), z + .7, x < 0 ? .5 : -.5); });
put(R.tuft({ kind: 'flower', s: .9 }), CANDLE[0][0] + .9, CANDLE[0][1] + .6);
put(D.statue({ kind: 'angel', s: 1.45 }), -4.6, -5.5, .7); put(D.bier({}), 4.4, 4.5, .4); put(D.column({ h: 2.2 }), -6.5, 9, 1);
for (const [x, z, ry, len] of [[-16.5, -6, Math.PI / 2, 48], [17, -6, Math.PI / 2, 48], [0, -38, 0, 34]]) for (let k = 0; k < len / 6; k++) { const f = (k + .5) * 6 - len / 2; put(D.fence({ len: 6, lean: (hash(k, x) - .5) * .25, seed: k }), x + (ry ? 0 : f), z + (ry ? f : 0), ry); }
const trees = [[-7.5, 11, 7], [6.5, 9.5, 8], [-11, -2, 9.5], [12.5, -7, 9], [-8, -19, 8.5], [-2.5, -30, 10], [15, -30, 11], [-14, 16, 9], [13, 17, 8], [-19, -22, 12], [21, 4, 11]].map(([x, z, h], i) => put(D.deadTree({ h, seed: i + 20, c: '#4e5c66' }), x, z, i));
for (let i = 0; i < 14; i++) { const x = (hash(i, 21) - .5) * 30, z = 14 - hash(i, 22) * 44; if (clear(x, z)) put(i % 3 ? R.tuft({ kind: 'reed', s: 1.1 }) : D.thorns({ len: 2.6, h: .9, seed: i }), x, z, i); }
scene.add(R.merge(fixed));

// ---- 空と空気：月の前を流れる雲、地をはう白い霧、ただよう ほこりの光 ----
scene.add(D.clouds({ n: 10, r: 250, y: 74, s: 96, c: '#4a7c86', shade: '#1e4456', speed: .022, phase: .5 }), D.groundFog({ n: 60, box: [58, 58], c: '#d4ecec', a: .3, h: 1.6, w: 9, wind: [.55, .12] }), D.flakes({ kind: 'dust', n: 120, c: '#c8f0e8', box: [22, 6, 22], size: 1.3 }));

// ---- 生きもの・影：鬼火 3 つ、ふくろう、黒いねこ、からす、遠くの うすい人かげ ----
[[-5.2, 1.2, 2.5, '#8ef0d0'], [-6.5, 1.4, -9, '#a8e8ff'], [4.6, 1.2, -3.5, '#8ef0d0']].forEach(([x, y, z, c], i) => { const w = D.wisp({ c, seed: i * 2 + 1, light: i === 0, r: .85 }); w.position.set(x, y, z); scene.add(w); });
const perchOf = (i, k) => { const t = trees[i]; t.updateMatrixWorld(); return t.userData.perch[k].clone().applyMatrix4(t.matrixWorld); };
const owl = D.owl({ s: 1.7 }), op = perchOf(1, 0); owl.position.copy(op); owl.rotation.y = -2.3; scene.add(owl);
const cat = D.cat({ s: 1.15 }); cat.position.set(-2.5, 0, 6.1); cat.rotation.y = 2.4; scene.add(cat);
scene.add(D.perched([[CANDLE[1][0], 1.42, CANDLE[1][1], 1], [-4.6, 3.3, -5.5, 2.5], [...perchOf(4, 1).toArray(), 1]], { watch: hero, near: 3.2 }), D.flock({ kind: 'bat', n: 8, r: 6, h: 2, center: [CH[0] - 2, 9, CH[1]] }));
const ghost = D.ghost({ h: 2, a: .42 }); ghost.position.set(-12, 0, -24); scene.add(ghost);

const lamp = D.lantern(hero, { hand: 'L', c: '#ffc060', power: 9, range: 8, r: 3, k: .7 }), crt = R.crt(renderer, { noise: 0, bright: 1.06 }); onResize(crt.resize);
const Z0 = 13, LEN = 27, SPEED = 1.5;
K.loop((dt, t) => {
  const z = Z0 - (t * SPEED) % LEN, x = pathX(z), tx = pathX(z - 1) - x;
  hero.position.set(x, 0, z); hero.rotation.y = Math.PI - Math.atan2(tx, 1); R.walk(hero, t * SPEED * 3.6, .85); D.lanternPose(hero);
  const tall = innerWidth < innerHeight, Dc = tall ? 4.1 : 5.4; cam.position.set(x * .6 - .7, tall ? 2.2 : 1.65, z + Dc); cam.lookAt(x * .5 + .6, tall ? 2.5 : 2.6, z - 6);   // 低い所から少し見上げて、月と礼拝堂を入れる
  R.catPose(cat, 'sit', t); D.tick(t, cam); F.tick(t); crt.render(scene, cam, t);
});
</script>
</html>
