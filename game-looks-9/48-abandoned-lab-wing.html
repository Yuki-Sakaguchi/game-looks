{ const W = []; for (let i = 0; i < 16; i++) { const z = 12 - i * 3.2 - hash(i, 1) * 2, x = (hash(i, 2) - .5) * 5; W.push([[x, CH - .1, z], [x + (hash(i, 3) - .5) * 2.4, CH - .1, z - 1.5 - hash(i, 4) * 3], 1 + hash(i, 5) * 1.6]); } scene.add(C.wires(W, { c: '#55688c' })); }

{ const P = R.parts(), M = P.g(T.metal({ c: '#7a889c' })), Pn = P.g(X.panel({ c: '#5a7488' }));
  const tab = (m, w = 1.7) => { M.at(m).box(w, .06, .8, 0, .78, 0, { bottom: true }); for (const [x, z] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) M.box(.06, .78, .06, x * (w / 2 - .08), 0, z * .32, { top: false }); M.at(null); };

{ const P = R.Px(16); P.fill('#c8d0d8'); for (let y = 2; y < 15; y += 2) P.rect(2, y, 9 + (y * 5) % 4, 1, '#7a8494'); const G = R.geo(); for (let i = 0; i < 16; i++) { const x = (hash(i, 61) - .5) * 4, z = 8 - hash(i, 62) * 36, a = hash(i, 63) * 6, c = Math.cos(a) * .16, s = Math.sin(a) * .16; G.quad([x - c + s, .025, z - s - c], [x + c + s, .025, z + s - c], [x + c - s, .025, z + s + c], [x - c - s, .025, z - s + c]); } fixed.push(G.mesh(T.from(P, { m: 1 }))); }
