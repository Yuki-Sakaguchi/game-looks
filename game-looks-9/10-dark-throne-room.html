<div id="cap">9-10 ─ 玉座の間 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 大きな柱と とがりアーチのならぶ、石の広間。長い じゅうたんの上を、たてを背おい 剣をさげた騎士が、奥の高い玉座へ歩く。
// 玉座には、目だけが光る大きな影。そのうしろの暗い色ガラスから、赤い光がさす。両がわに かがり火と たれ幕。
// 色の組は「石の黒むらさき・窓の赤・火の だいだい」＋騎士の よろいの銀。奥からの赤い光が ふちの光になり、かがり火の輪を床に焼きこんで読ませる。
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), F = PACK_FTOWN(THREE, K, R), D = PACK_DARK(THREE, K, R), T = R.tex, { hash } = K;
const { scene, cam, renderer, onResize } = K.stage({ fov: 50, far: 400, aa: false, fitAspect: .9, maxFov: 76 });
const hero = R.actor({ build: 'toon', hairStyle: 'short', hair: '#d8c890', cloth: 'armor', top: '#7c88b4', top2: '#d0a848', bottom: '#444a70', gear: '#b4bedc', shoe: '#6a7090', gloves: 'gauntlet', glove: '#9aa4c4', shoulder: 'both', hat: 'helm', hold: 'sword' }); scene.add(hero);
{ const P = R.Px(32, 48), B = hero.userData.build; P.clip = true; P.each((x, y) => { const hw = y < 14 ? 14.5 : 14.5 * Math.sqrt(Math.max(0, 1 - ((y - 14) / 33) ** 1.7)), d = hw - Math.abs(x - 15.5); if (d < 0 || y < 1) return null; if (d < 2 || y < 3) return d < 1 ? '#8a6a30' : '#e0bc58'; const dm = Math.abs(x - 15.5) + Math.abs(y - 19) * .8; return dm < 6 ? (dm < 4 ? '#f0d478' : '#b88c38') : (x > 15.5) === (y > 19) ? '#a83440' : '#8a2438'; });   // 背中の たて（赤の地に金のふちと ひし形。自作の図形）
  const sh = R.geo().quad([.27, -.36, 0], [-.27, -.36, 0], [-.27, .4, -.05], [.27, .4, -.05]).mesh(T.from(P, { m: 1, cut: true }), { side: true }); sh.scale.setScalar(.62); sh.position.set(0, B.torso * .5, -(B.waistD || .1) - .1); hero.userData.J.torso.add(sh); }
const mood = D.mood(scene, renderer, 'blood', { follow: hero, range: 26, hills: false, stars: false, r: 180, sky: ['#120c1c', '#1a1228', '#221630', '#2a1a38'], fog: ['#1e1630', 16, 84], hemi: ['#9484cc', '#3a2c48', 1.05], key: ['#ff6450', 1.35, [.12, .5, -1]], fill: ['#6a5a9c', .5], base: [.8, .72, .98] });

// ---- 床：黒むらさきの市松の石。かがり火と、窓の赤い光を焼きこむ。まん中に長い じゅうたん ----
const ZW = -38, ZP = -32, PH = 1.8, HX = 4.75, TOP = 11.5, ARCH = [11, 4, -3, -10, -17, -24], FIRE = [[-3.1, 7.5], [3.1, 7.5], [-3.1, -6.5], [3.1, -6.5], [-3.1, -20.5], [3.1, -20.5]];
const LIT = [...FIRE.map(([x, z]) => ({ x, z, r: 6.5, c: '#ff9a48', k: 1.25 })), { x: 0, z: -27, r: 8, c: '#ff4a40', k: .8 }];
const land = R.ground({ w: 44, d: 84, cell: 2, cz: -8, layers: [F.tex.tile({ c: '#54507a', c2: '#3c3858', kind: 'check' })], shade: mood.shade(LIT) }); scene.add(land.mesh);
const carpetT = F.tex.carpet({ c: '#7c2436', c2: '#c09440', c3: '#40305c' }), carpet = R.strip(Array.from({ length: 26 }, (_, i) => [0, .03, 22 - i * 2]), 2.7, carpetT); scene.add(carpet);

// ---- 広間：とがりアーチの仕切りと太い柱の列、わきの通路、かべ、天井 ----
const fixed = [], put = (o, x, z, ry = 0, y = 0) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
const stone = D.tex.stone({ c: '#625c80', moss: 0, stain: .5 }), stone2 = D.tex.stone({ c: '#565074', moss: 0, stain: .6, seed: 4 }), G = R.geo(), Gc = R.geo();
for (const z of ARCH) { put(F.arch({ w: 8.6, h: 10.4, d: 1, th: .9, kind: 'point', stone }), 0, z); for (const sx of [-1, 1]) { put(F.column({ h: 7.2, r: .78, tex: stone2 }), sx * HX, z + .75); G.box(5.1, TOP - 6.4, 1, sx * 8.05, 6.4, z, { m: 3, c0: .8 }); } }
for (let z = 18; z > ZW; z -= 7) for (const sx of [-1, 1]) G.box(1, TOP, 7, sx * 11, 0, z - 3.5, { m: 3, c0: .7 });
G.box(23, TOP, 1, 0, 0, ZW - .5, { m: 3, c0: .7 }); G.box(23, TOP, 1, 0, 0, 22, { m: 3 });
for (let z = 18; z > ZW; z -= 7) for (let x = -11; x < 11; x += 5.5) Gc.quad([x, TOP, z - 7], [x + 5.5, TOP, z - 7], [x + 5.5, TOP, z], [x, TOP, z], [0, 0, 1.8, 2.3], .6);   // 天井
fixed.push(G.mesh(stone2), Gc.mesh(stone));

// ---- 奥：石段の上の玉座。うしろに大きな暗い色ガラス（赤い光） ----
put(F.stairs({ w: 10, h: PH, d: 4, n: 8, tex: stone }), 0, ZP + 2);
const Gt = R.geo(), Go = R.geo(), Gp = R.geo();
Gp.box(21, PH, 6, 0, 0, (ZW + ZP) / 2, { m: 3 }); Gt.box(2.3, .95, 1.7, 0, PH, -36, { m: 1.5 }); Gt.box(2.7, 5.2, .5, 0, PH, -37, { m: 1.5, c0: .8 }); for (const sx of [-1, 1]) { Gt.box(.45, 1.7, 1.7, sx * 1.2, PH, -36, { m: 1.5 }); Gt.box(.5, 6.2, .55, sx * 1.6, PH, -37, { m: 1.5, c0: .8 }); }
Gt.tri([-1.35, PH + 5.2, -36.74], [1.35, PH + 5.2, -36.74], [0, PH + 7, -36.74], [0, 0], [1.8, 0], [.9, 1.2]);
for (const y of [PH + .7, PH + 4.7]) Go.quad([-1.35, y, -36.73 + (y < 3 ? 1.6 : 0)], [1.35, y, -36.73 + (y < 3 ? 1.6 : 0)], [1.35, y + .26, -36.73 + (y < 3 ? 1.6 : 0)], [-1.35, y + .26, -36.73 + (y < 3 ? 1.6 : 0)], [0, 0, 5, 1]);
fixed.push(Gp.mesh(stone), Gt.mesh(D.tex.stone({ c: '#4e4870', moss: 0, m: 1.5, seed: 7 })), Go.mesh(F.tex.ornate({ c: '#b08a3c', gem: '#c03044' }), { offset: true }), R.geo().quad([-1.35, PH + .03, ZP], [1.35, PH + .03, ZP], [1.35, PH + .03, -35.1], [-1.35, PH + .03, -35.1], [0, 0, .9, 1]).mesh(carpetT, { offset: true }));
const RED = ['#a8242e', '#d8442c', '#701c2c', '#c0642c', '#54184a'], Gg = R.geo(), WIN = [[0, 4.6, 3.4, 6.6], [-3.9, 4.9, 2.1, 5], [3.9, 4.9, 2.1, 5]];
for (const [x, y, w, h] of WIN) Gg.quad([x - w / 2, y, ZW + .06], [x + w / 2, y, ZW + .06], [x + w / 2, y + h, ZW + .06], [x - w / 2, y + h, ZW + .06]);
const glass = Gg.mesh(D.tex.glass({ kind: 'lancet', lit: .5, cs: RED, glow: '#ff7050' }), { glow: true, offset: true, fog: false, color: '#ff9c8c' }); glass.castShadow = false; scene.add(glass);
scene.add(D.pools([...WIN.map(([x, y, w, h]) => ({ p: [x, y + h / 2, ZW + .1], n: [0, 0, 1], r: w * .9 + 1, r2: h * .62, c: '#ff3a30', k: .45 })), { p: [0, .05, -26.5], r: 5, r2: 6.5, c: '#ff3a30', k: .5 }, { p: [0, PH + .05, -34.2], r: 6, r2: 2.4, c: '#ff3a30', k: .4 }]));
for (const [x, w, a] of [[0, 5, .09], [-3.9, 3, .2], [3.9, 3, .2]]) { const s = D.shaft({ w, h: 9.5, c: '#ff4a38', a, lean: [0, -7.5] }); s.position.set(x, .1, -29.5); scene.add(s); }
const shade = D.loomer({ w: 8.4, h: 7.6, c: '#140e1e', eye: '#ffe890', gap: .15, eyeY: .52 }); shade.position.set(0, PH + .5, -35.9); scene.add(shade);   // 玉座の大きな影。目だけが光り、ときどき またたく
const eyes = [-1, 1].flatMap(sx => [D.halo({ c: '#ffb040', r: 1, k: .9 }), D.halo({ c: '#fff4c0', r: .34, k: 1 })].map(e => { e.position.set(sx * .62, PH + 4.45, -35.2); scene.add(e); return e; }));   // 遠くからでも読めるように、目の にじみを大きく足す

// ---- かがり火、たれ幕、くさり、くもの巣 ----
FIRE.forEach(([x, z], i) => put(D.brazier({ s: 1.3, light: i === 0 || i === 3, power: 14, range: 11, seed: i + 1 }), x, z)); for (const sx of [-1, 1]) put(D.brazier({ s: 1.2, seed: 9 + sx }), sx * 4.2, -34.3, 0, PH);
ARCH.forEach((z, i) => { for (const sx of [-1, 1]) { const f = F.flag({ kind: 'drape', w: 1.7, h: 5.4, c: i % 2 ? '#4a2058' : '#6a1c34', c2: '#b08a3c', crest: i % 2 ? 'moon' : 'crown', cc: '#c8a050' }); f.position.set(sx * 7.6, 10.6, z + .56); scene.add(f); } });
for (const [x, z, len] of [[-2.2, .5, 3.4], [2.6, -13.5, 4.2], [-2.8, -27.5, 3]]) { const c = D.chain({ len, sway: .08 }); c.position.set(x, TOP - .4, z); scene.add(c); }
for (const [z, sx] of [[11, -1], [-3, 1], [-17, -1]]) { const w = D.web({ s: 2 }); w.position.set(sx * (HX + .95), 6.4, z + .52); w.scale.x = sx; fixed.push(w); }
scene.add(R.merge(fixed));

// ---- 空気：赤い光の中の ほこり、のぼる火の粉、柱のあいだを飛ぶ こうもり、床をはう うすい もや ----
scene.add(D.flakes({ kind: 'dust', n: 150, c: '#ff9a88', box: [20, 9, 22], size: 1.3 }), D.flakes({ kind: 'ember', n: 60, box: [9, 6, 30], size: 1.6 }), D.flock({ kind: 'bat', n: 9, r: 4.5, h: 1.5, center: [0, 7.6, -14], fog: true }), D.groundFog({ n: 26, box: [18, 50], y: .1, c: '#a878c0', a: .14, h: 1, w: 7, wind: [.2, .35] }));
const glow = new THREE.PointLight('#ffb478', 7, 8, 1.4); scene.add(glow);   // かがり火の てり返し（主役のよろいを読ませる）

const crt = R.crt(renderer, { noise: 0, bright: 1.1 }); onResize(crt.resize);
const Z0 = -3.5, LEN = 19, SPEED = 1.3;
K.loop((dt, t) => {
  const z = Z0 - (t * SPEED) % LEN, x = Math.sin(t * .35) * .35;
  hero.position.set(x, 0, z); hero.rotation.y = Math.PI + Math.cos(t * .35) * .05; R.walk(hero, t * SPEED * 3.4, .9); glow.position.set(x + 1.4, 2, z + 1.8); { const b = (t * .11) % 1, k = b > .93 ? 0 : .8 + .2 * Math.sin(t * 1.7); eyes.forEach((e, i) => { e.material.opacity = k * (i % 2 ? 1 : .9); }); }
  const tall = innerWidth < innerHeight, Dc = tall ? 4.1 : 5.4; cam.position.set(x * .5 + .75, tall ? 2.2 : 1.6, z + Dc); cam.lookAt(x * .3, tall ? 2.8 : 2.95, z - 6);   // 低い所から少し見上げて、アーチの重なりと 奥の玉座と窓を入れる
  D.tick(t, cam); F.tick(t); crt.render(scene, cam, t);
});
</script>
