<html lang="ja">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>7-13 海ぞいのドライブ 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#fff4d8;opacity:.85;text-shadow:0 1px 0 #000}
</style>
<div id="cap">7-13 ─ 海ぞいのドライブ / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で走る）</div>
<script src="kit.js"></script>
<script src="retro.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 面の少ない車・家・木に、その場で打ったドット絵のテクスチャ（ひびの入った道路、波の 4 コマ、砂、かわら）をはり、横 320 ドットの粗い絵に描く。
// 色は海と空の青・草の緑・砂と夕方近い日の黄にしぼり、色数を落としてディザにかけ、ブラウン管に映してにじませる。
// 岬をぐるりとまわる海ぞいの道。赤い車をうしろから追い、対向車とすれちがう。道ばたで 5 頭身の人（R.actor の toon）が手をふり、路肩を歩く。部品はぜんぶ retro.js（R.〜）
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), T = R.tex, { hash } = K;
const { scene, cam, renderer, onResize } = K.stage({ fov: 44, far: 1400, aa: false, fitAspect: .9, maxFov: 74 });
scene.add(R.skyDome([[0, '#2a62bc'], [.6, '#4a94dc'], [.86, '#8cc8ec'], [.96, '#cfe8ee'], [1, '#f4ecd0']], { r: 600 })); scene.fog = new THREE.Fog('#b8dcee', 90, 640);
const { sun } = K.lights(scene, renderer, { sky: 0xbcdcff, ground: 0xb0a47c, amb: 1.5, sun: 0xffe2b0, power: 2.7, range: 32 }), SUN = new THREE.Vector3(.55, .5, .62).normalize();

// ---- 道の輪（岬のまわり。外がわが海）。pt(a, e) は輪から外へ e m の点と、進む向き。off(x, z) は道からのへだたり（＋が海がわ） ----
const rr = a => 120 + 9 * Math.sin(3 * a) + 5 * Math.sin(5 * a + 1), TAU = Math.PI * 2;
const pt = (a, e = 0) => { const r = rr(a) + e, a2 = a + .002, r2 = rr(a2) + e, x = Math.cos(a) * r, z = Math.sin(a) * r; return [x, z, Math.atan2(Math.cos(a2) * r2 - x, Math.sin(a2) * r2 - z)]; };
const off = (x, z) => Math.hypot(x, z) - rr(Math.atan2(z, x));
const hill = (x, z) => { const d = off(x, z); return d > 7 ? Math.max(-3.2, -(d - 7) * .32) : d < -15 ? (-d - 15) ** 1.15 * .22 * (1 + .35 * Math.sin(x * .05) * Math.cos(z * .06)) : 0; };
const land = R.ground({ w: 440, d: 440, cell: 4, H: hill, layers: [T.grass({ c: '#6aa24e', flowers: .3 }), T.sand(), T.dirt({ c: '#b09a74' })],
  mix: (x, z) => { const d = off(x, z); return [Math.max(0, Math.min(1, (d - 3.6) / 2.4)), d < -3.3 && d > -4.8 ? .7 : 0]; },
  shade: (x, z) => { const d = off(x, z); return d < -15 ? .86 + .2 * hash(Math.round(x / 8), Math.round(z / 8)) : 1; } });
scene.add(land.mesh);
const N = 200, ring = e => [...Array(N + 1)].map((_, i) => { const [x, z] = pt(i / N * TAU, e); return [x, 0, z]; });
scene.add(R.strip(ring(0), 6.4, T.road({ line: 'both' })));

// ---- 海（波の 4 コマを送る）・沖の小島と灯台・舟 ----
const waves = T.water({ c: '#3a8cc8' }), seaG = R.geo(), SEG = 120, BAND = [6, 14, 30, 70, 200, 800];   // 海は道の外がわだけ、輪の形に細かく割って作る（大きすぎる面は頂点の丸めでくずれる）
for (let i = 0; i < SEG; i++) for (let k = 0; k < 5; k++) { const q = [[i, k], [i, k + 1], [i + 1, k + 1], [i + 1, k]].map(([j, b]) => { const [x, z] = pt(j / SEG * TAU, BAND[b]); return [x, -.7, z]; }), uv = q.map(v => [v[0] / 3, -v[2] / 3]); seaG.tri(q[0], q[2], q[1], uv[0], uv[2], uv[1]).tri(q[0], q[3], q[2], uv[0], uv[3], uv[2]); }
const sea = seaG.mesh(waves[0]); sea.castShadow = false; scene.add(sea);
const fixed = [], put = (o, x, z, ry = 0, y = 0) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
const lighthouse = () => { const B = R.parts(); B.g(T.plaster({ c: '#f2ece0' })).smooth(1).loft(8, [[0, 1.5, 1.5, 0, .75], [3, 1.3, 1.3, 1, .9], [6, 1.12, 1.12, 2, 1], [9, .95, .95, 3, 1.05]], { ur: 3 });
  B.g(T.fabric({ c: '#c8443a', pattern: 'plain' })).smooth(1).loft(8, [[2.6, 1.34, 1.34, 0, .9], [4.4, 1.22, 1.22, 1, 1]], { ur: 3 }).smooth(0).loft(8, [[9, 1.3, 1.3, 0, .8], [9.25, 1.3, 1.3, .2, 1]], { cap: 'top', ur: 3 }).loft(8, [[10.4, 1.1, 1.1, 0, .9], [11.5, .05, .05, 1, 1.1]], { ur: 3 });
  B.g(T.lamp({}), { glow: true }).loft(8, [[9.25, .7, .7, 0], [10.4, .7, .7, 1]], { ur: 4 }); return B.group(); };
[[.62, 46, 1], [2.3, 60, 0], [4.25, 40, 1], [5.4, 70, 0]].forEach(([a, e, lh], i) => { const [x, z] = pt(a, e); put(R.rock({ s: 9, c: '#9a968c', moss: .5, seed: i }), x, z, i, -2.4); put(R.rock({ s: 5, c: '#9a968c', seed: i + 5 }), x + 7, z + 3, i, -1.6); if (lh) put(lighthouse(), x, z, 0, 4.2); else put(R.tree({ kind: 'round', h: 6, seed: i }), x - 1, z, 0, 4.4); });
const boats = [.2, .95, 1.6, 2.7, 3.4, 4.6, 5.1, 5.9].map((a, i) => { const [x, z, ry] = pt(a, 22 + hash(i, 3) * 26), b = R.boat({ sail: ['#f4eedc', '#f0c060', '#e8705a'][i % 3] }); b.position.set(x, -.75, z); b.rotation.y = ry + i; b.scale.setScalar(1.5); scene.add(b); return b; });

// ---- 道ぞい：さく・標識・家・木・岩 ----
for (let i = 0; i < 196; i++) { if (i % 14 === 13) continue; const [x, z, ry] = pt((i + .5) / 196 * TAU, 4.3); put(R.fence({ len: 4.05, h: .85, kind: 'rail', c: '#e8e2d4' }), x, z, ry + Math.PI / 2); }
['arrow', 'warn', 'no', 'plate', 'arrow', 'warn', 'stop', 'arrow', 'no', 'warn', 'arrow', 'plate'].forEach((kind, i) => { const [x, z, ry] = pt(.1 + i * TAU / 12 + (i % 2) * .09, 3.7); put(R.roadSign({ kind }), x, z, ry + Math.PI); });
const win = T.window({ shutters: 1, box: 1 }), win2 = T.window({ curtain: '#f0e4c8' });
const KIND = [
  { w: 7, d: 5.6, wall: T.plaster({ c: '#f2ead8' }), roof: T.roof({ c: '#d8703a', kind: 'wave' }), win, door: T.door({ style: 'panel', c: '#3f7ab0' }), chimney: true },
  { w: 5.6, d: 5.4, h2: 2.4, wall: T.plaster({ c: '#f0e2c4' }), wall2: T.boards({ c: '#7fb0c0' }), roof: T.roof({ c: '#4a7ab0', kind: 'slate' }), ridge: 'z', win: win2, awning: T.fabric({ scallop: 1, c: '#e8a83a' }) },
  { w: 6.4, d: 5.4, wall: T.boards({ c: '#e8dcc0' }), roof: T.shingle(), pitch: .7, eave: .7, win: win2, sign: T.sign({ kind: 'mug' }) },
  { w: 5, d: 5, h: 3, h2: 2.4, wall: T.stone({ c: '#b8b0a0' }), wall2: T.plaster({ frame: 'box', c: '#f2ead8' }), roofKind: 'hip', roof: T.roof({ c: '#c85a3a' }), win, door: T.door({ arch: 1 }) }];
[.3, .42, .52, 1.25, 1.36, 2.05, 2.16, 2.26, 3.1, 3.22, 3.95, 4.06, 4.9, 5.02, 5.12, 5.85].forEach((a, i) => { const q = KIND[i % 4], [x, z, ry] = pt(a, -8.2 - q.d / 2); put(R.house({ ...q, seed: i }), x, z, ry - Math.PI / 2);
  const [fx, fz, fr] = pt(a + .028, -6.4); if (i % 3 === 0) { put(R.barrel(), fx, fz, i); put(R.crate({ s: .7 }), fx + .9, fz + .2, .4); } else if (i % 3 === 1) put(R.fence({ len: 3, c: '#f0e8d8' }), fx, fz, fr + Math.PI / 2); else put(R.car({ c: ['#e8c040', '#5a9a6a', '#d8d8e0'][i % 3], kind: i % 2 ? 'van' : 'sedan' }), fx, fz, fr); });
for (let i = 0; i < 230; i++) { const a = hash(i, 1) * TAU, e = -6.5 - hash(i, 2) ** 2 * 64, [x, z] = pt(a, e), k = i % 5; put(R.tree({ kind: ['round', 'tall', 'round', 'bush', 'round'][k], h: k === 3 ? 1.4 : 5 + hash(i, 3) * 4, c: ['#4f9448', '#3f8452', '#6aa63f'][i % 3], flowers: k === 3 ? .5 : 0, seed: i }), x, z, i, hill(x, z) - .1); }
for (let i = 0; i < 90; i++) { const a = hash(i, 5) * TAU, s = i % 3, [x, z] = pt(a, s ? 5.4 + hash(i, 6) * 2.6 : -5.2 - hash(i, 6) * 2); if (s === 1) put(R.rock({ s: .5 + hash(i, 7) * .9, c: '#a8a296', seed: i }), x, z, i, hill(x, z) - .1); else put(R.tuft({ kind: s ? 'reed' : 'flower', s: .8 + hash(i, 7) * .4, seed: i % 3 }), x, z, i, hill(x, z)); }
scene.add(R.merge(fixed));

// ---- 空：遠くの山なみ・雲・日 ----
scene.add(R.backdrop({ c: '#4f7fa8', haze: '#d8ecf4', r: 560, h: 80, y: -10, rep: 5 }));
for (let i = 0; i < 12; i++) { const c = R.cloud({ s: 70 + hash(i, 8) * 50, c: '#ffffff', shade: '#b8d0ec', seed: i }), a = i * .55 + hash(i, 4); c.position.set(Math.cos(a) * 520, 80 + hash(i, 9) * 90, Math.sin(a) * 520); c.lookAt(0, 40, 0); scene.add(c); }
const sunD = new THREE.Mesh(new THREE.CircleGeometry(22, 16), new THREE.MeshBasicMaterial({ color: '#fff8dc', fog: false })); sunD.position.set(SUN.x * 560, 210, SUN.z * 560); sunD.lookAt(0, 0, 0); scene.add(sunD);

// ---- 車（左がわ通行。主役は海がわの車線を左まわり、対向車は陸がわを右まわり）・かもめ ----
const lane = e => new THREE.CatmullRomCurve3(ring(e).slice(0, N).map(q => new THREE.Vector3(...q)), true, 'centripetal'), mine = lane(1.55), theirs = lane(-1.55), LEN = mine.getLength();
const car = R.car({ c: '#d8452e' }); scene.add(car);
const others = ['#3f7ab0', '#f2f0e8', '#e8c040', '#5a9a6a', '#8a6ab0', '#e8884a', '#d8d8e0'].map((c, i) => { const o = R.car({ c, kind: i % 3 === 1 ? 'van' : 'sedan' }); scene.add(o); return o; });
const gulls = [0, 1, 2, 3].map(i => { const b = R.bird({ c: '#f2f2ee', belly: '#ffffff', neck: false, s: 1.6 }); scene.add(b); return b; });
// ---- 道ばたの人（新しい作り R.actor の 5 頭身）。海がわの さくの手前で車に手をふる人と、陸がわの路肩を歩く人 ----
R.cfg.actorBuild = 'toon';
const LOOKS = [{ sex: 'f', hairStyle: 'bob', hair: '#c8743a', eye: '#3a9a8a', mouth: 'open', blush: true, cloth: 'tunic', top: '#f2c84a', top2: '#f4f0e8', lower: 'skirt', skirt: .45, skirtC: '#f4f0e8', shoes: 'shoe', shoe: '#c8453a' },
  { hairStyle: 'spiky', hair: '#2a2a34', mouth: 'open', blush: true, cloth: 'tunic', top: '#e8704a', top2: '#f4f0e8', lower: 'shorts', bottom: '#3a5a8a', shoes: 'shoe', shoe: '#f4f0e8', hat: 'cap', acc: '#c8453a', s: .74 },
  { hairStyle: 'bald', hair: '#e0e0e0', skin: '#d8a070', eyes: 'closed', brow: 'thick', beard: 'beard', cloth: 'vest', top: '#3f7ab0', top2: '#f0e6d0', bottom: '#b0a080', hat: 'cap', acc: '#f2f0e8' },
  { sex: 'f', hairStyle: 'tail', hair: '#3a2a22', eye: '#6a4a2a', cloth: 'overall', top: '#5a9a6a', top2: '#f4ecd0', hat: 'band', acc: '#e8c040', gloves: 'glove', glove: '#f0ece0' },
  { hairStyle: 'tufts', hair: '#d8b04a', eye: '#3a7aa8', cloth: 'jacket', sleeve: 'short', top: '#f2f0e8', top2: '#3f7ab0', lower: 'shorts', bottom: '#d8452e', shoes: 'shoe', shoe: '#5a4030' },
  { sex: 'f', hairStyle: 'bun', hair: '#8a4a2a', skin: '#e0b088', brow: 'soft', cloth: 'tunic', top: '#e8884a', top2: '#f4f0e8', lower: 'skirt', skirt: .7, skirtC: '#3f7ab0', shoes: 'shoe' }];
const wavers = [.465, .477, .6, .86, .872, 1.3, 1.9, 1.912, 2.6, 3.45, 3.462, 4.1, 4.7, 5.6, 5.612, 6].map((a, i) => { const [x, z] = pt(a, 3.75), p = R.actor(LOOKS[i % 6]); p.position.set(x, 0, z); scene.add(p); return p; });
const hikers = [.56, 2.2, 3.9, 5.3].map((a, i) => { const p = R.actor({ ...LOOKS[[4, 3, 2, 0][i]], back: 'pack', acc: ['#b08a4a', '#c8553a', '#6a8a5a', '#8a6ab0'][i] }); p.userData.a = a; scene.add(p); return p; });
const drive = (o, curve, u, t, v, ph = 0, back = 0) => { const p = curve.getPointAt(u), g = curve.getTangentAt(u); o.position.set(p.x, .02 + Math.abs(Math.sin(t * 9 + ph)) * .015, p.z); o.rotation.y = Math.atan2(g.x, g.z) + back; for (const w of o.userData.wheels) w.rotation.x = t * v / .36; return [p, g]; };
const SPEED = 12.5, S0 = .035, cd = new THREE.Vector3(), cp = new THREE.Vector3(), fx = K.fx(scene, 40), mod = (v, m) => ((v % m) + m) % m;
const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
let first = true, du = 0;
K.loop((dt, t) => {
  const [p, tg] = drive(car, mine, (S0 + t * SPEED / LEN) % 1, t, SPEED); car.rotation.z = Math.sin(t * 1.3) * .012;
  others.forEach((o, i) => drive(o, theirs, mod(S0 + .075 + i / 7 - t * 9 / LEN, 1), t, 9, i, Math.PI));
  // うしろから追うカメラ（向きはゆっくり追いつく。たて長では近づく）
  if (first) { cd.copy(tg); first = false; } cd.lerp(tg, 1 - Math.exp(-dt * 2.2)).normalize(); const tall = innerWidth < innerHeight, D = tall ? 5.6 : 7.2;
  cp.set(p.x - cd.x * D, tall ? 2.6 : 3, p.z - cd.z * D); cam.position.copy(cp); cam.lookAt(p.x + cd.x * 6, .8, p.z + cd.z * 6);
  sun.position.set(p.x + SUN.x * 60, SUN.y * 60, p.z + SUN.z * 60); sun.target.position.copy(p);
  // 道ばたの人：近くの人は車のほうを向いて右手をふる（子どもは はねる）。歩く人は路肩を車と同じ向きに進む
  wavers.forEach((w, i) => { const dx = p.x - w.position.x, dz = p.z - w.position.z, near = Math.hypot(dx, dz) < 60, kid = i % 6 === 1; w.visible = near; if (!near) return; w.rotation.y = Math.atan2(dx, dz); R.idle(w, t + i, 0);
    w.userData.J.armR.rotation.set(0, 0, -2.5 + Math.sin(t * 8 + i) * .4); w.userData.J.foreR.rotation.z = -.25; if (kid) { w.position.y = Math.abs(Math.sin(t * 6 + i)) * .14; w.userData.J.armL.rotation.set(0, 0, 2.5 - Math.sin(t * 8 + i) * .4); } });
  hikers.forEach((h, i) => { const [x, z, ry] = pt(h.userData.a + t * 1.3 / 116, -4.1); h.position.set(x, 0, z); h.rotation.y = ry; h.visible = Math.hypot(p.x - x, p.z - z) < 70; R.walk(h, t * 6.5 + i * 2, .9); });
  // 海・舟・かもめ・砂ぼこり
  R.flip(sea.material, waves, t, 5); boats.forEach((b, i) => { b.position.y = -.75 + Math.sin(t * 1.4 + i * 2) * .08; b.rotation.z = Math.sin(t * 1.1 + i) * .06; });
  gulls.forEach((b, i) => { const a = t * (.5 + i * .07) + i * 1.7, r = 5 + i * 1.6; b.position.set(p.x + tg.x * (16 + i * 5) + tg.z * 9 + Math.cos(a) * r, 5.5 + i * 1.1 + Math.sin(t * .8 + i) * .8, p.z + tg.z * (16 + i * 5) - tg.x * 9 + Math.sin(a) * r); b.rotation.y = -a; R.birdPose(b, 'fly', t + i); });
  if ((du += dt) > .12) { du = 0; fx.emit('puff', p.x - tg.x * 1.9, .25, p.z - tg.z * 1.9, { size: .4, life: .7, vy: .3, grow: 1.4, spread: .3, tint: '#e8e0d0' }); }
  fx.update(dt); crt.render(scene, cam, t);
});
</script>
</html>
