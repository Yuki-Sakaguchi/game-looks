<title>7-19 湖の小舟とつり 描きこんだテクスチャとブラウン管</title>
<style>

<div id="cap">7-19 ─ 湖の小舟とつり / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動でこぐ）</div>
<script src="kit.js"></script>
<script src="retro.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 方向 B。面の少ない形（小舟・小屋・松・人）に、その場で打ったドット絵（板・板ぶき屋根・水のコマ送り・草）をはり、横 320 ドットほどの粗い絵に描く。
// 色数を落としたディザとブラウン管（横のにじみ・走査線・わずかな丸み）で、ドットと面の粗さをとかす。色は水の青緑・松の緑・朝の淡い空だけ。
// 朝霧の湖。小舟がゆっくり進み、板の桟橋と湖畔の小屋に寄っていく。舟のうしろ斜め上からカメラが追う。部品はぜんぶ retro.js（R.〜）
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), T = R.tex, { hash } = K;
const { scene, cam, renderer, onResize } = K.stage({ fov: 44, far: 900, aa: false, fitAspect: .9, maxFov: 74 });
scene.add(R.skyDome([[0, '#8fbcd8'], [.5, '#bcd8e0'], [.8, '#d6e4dc'], [1, '#f0e6cc']], { r: 380 })); scene.fog = new THREE.Fog('#d4ded6', 8, 100);
const { sun } = K.lights(scene, renderer, { sky: 0xd4e4f0, ground: 0x8aa890, amb: 1.45, sun: 0xffe6c0, power: 2.1, range: 30 }), SUN = new THREE.Vector3(.62, .4, -.5).normalize();

// ---- 地形：湖のくぼみ（まん中に小島）と岸。水は 4 コマのドット絵を送る ----
const fL = (x, z) => Math.hypot(x / 50, z / 32) - 1 + .05 * Math.sin(x * .13 + 1) + .05 * Math.sin(z * .19 + 2);   // 負なら湖の中
const H = (x, z) => { const f = fL(x, z); return Math.max(Math.min(f * 14, .6 + f * 5), Math.min(1.2, 1.7 - Math.hypot(x + 5, z - .5) / 2.8)); };
const land = R.ground({ w: 228, d: 174, cell: 3, H, layers: [T.grass({ c: '#5f9a58', flowers: .3 }), T.sand({ c: '#d8cca4' }), T.dirt({ c: '#8a8062' })], mix: (x, z) => { const h = H(x, z); return [Math.max(0, Math.min(1, .5 + (.42 - h) * 2)), h < -.25 ? 1 : 0]; } });
const WF = T.water({ c: '#68aab4' }), water = R.ground({ w: 132, d: 96, cell: 4, layers: [WF[0]], shade: (x, z) => { const k = Math.max(0, Math.min(1, (fL(x, z) + .2) * 5)); return [1 - .3 * k, 1 - .16 * k, 1 - .22 * k]; } });   // 岸の近くは木のかげの色
water.mesh.receiveShadow = true; scene.add(land.mesh, water.mesh);
let XS = 40; while (fL(XS, -1) < 0) XS += .25;   // 東の岸（桟橋のつけ根）

// ---- 湖畔の小屋（板ばりのかべ・板ぶき屋根）と、板の桟橋 ----
const fixed = [], put = (o, x, z, ry = 0, y = H(x, z)) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
const hut = put(R.house({ w: 5.6, d: 4.6, h: 2.7, wall: T.boards({ c: '#8c6c4c' }), roof: T.shingle({ c: '#6e6a66' }), eave: .6, chimney: { x: 1.6 }, win: T.window({ curtain: '#e8dcc0' }), winLit: T.window({ lit: 1 }), lit: .7, door: T.door({ c: '#4a7a70' }), wins: { f: [-1.7], r: 1, l: 1, b: 2 }, doorX: .6, seed: 2 }), XS + 7.5, 1.2, -Math.PI / 2, H(XS + 7.5, 1.2) - .12);
hut.updateMatrixWorld(); const smokeAt = hut.localToWorld(new THREE.Vector3(1.6, hut.userData.top + .9, -4.6 * .18));
// 桟橋：板の床と、水に立つ丸太のくい（行列でずらして並べ、1 つの形にまとめる）
const deck = R.geo().box(13, .1, 1.7, XS - 4.5, .42, -1, { m: 2, c0: .7, bottom: true }).mesh(T.planks({ c: '#9a7a54' })), posts = R.geo().smooth(1);
for (let i = 0; i < 6; i++) for (const s of [-1, 1]) posts.at(R.TR(XS - 10.6 + i * 2.44, 0, -1 + s * .78)).loft(6, [[-1.3, .11, .11, 0, .55], [.8 + hash(i, s) * .3, .085, .085, 1, 1]], { cap: 'top' });
fixed.push(deck, posts.at(null).mesh(T.planks({ c: '#6e5238' })));
put(R.barrel({ h: .8, r: .3 }), XS - 3.2, -.5, 1, .52); put(R.crate({ s: .6 }), XS - 4.1, -.45, .3, .52); put(R.crate({ s: .5, kind: 'x' }), XS + 4.2, -2.6, .5); put(R.barrel(), XS + 4.6, 4.6, 2); put(R.bench({ w: 1.4 }), XS + 4.3, 3, -Math.PI / 2);
put(R.fence({ len: 5, kind: 'rail' }), XS + 6, -3.6, .1); put(R.boat({ c: '#7a8a6a' }), XS - .6, 2.4, 1.9, .16).rotation.z = .22;   // 岸にあげた舟

// ---- 岸：松・岩・あし・草 ----
const ring = (a, f) => { let r = 30; const c = Math.cos(a), s = Math.sin(a); while (fL(c * r * 1.5, s * r) < f && r < 90) r += .25; return [c * r * 1.5, s * r]; };   // 岸から f だけ外（内）の点
for (let i = 0; i < 64; i++) { const [x, z] = ring(i / 64 * 6.283 + hash(i, 1) * .08, .1 + hash(i, 2) ** 2 * .5); if (Math.hypot(x - XS - 6, z) < 9) continue; put(R.tree({ kind: i % 7 === 3 ? 'round' : 'pine', h: 6 + hash(i, 3) * 5, c: i % 7 === 3 ? '#6a9a4a' : i % 2 ? '#2f6f56' : '#3a7a52', seed: i }), x, z, i); }
for (let i = 0; i < 26; i++) { const [x, z] = ring(hash(i, 4) * 6.283, -.03 + hash(i, 5) * .09); if (Math.hypot(x - XS, z + 1) < 5) continue; put(R.rock({ s: .6 + hash(i, 6) * 1.3, moss: i % 2 ? .6 : 0, seed: i }), x, z, i, Math.max(H(x, z), -.3) - .1); }
for (let i = 0; i < 70; i++) { const a = Math.floor(hash(i, 7) * 16) / 16 * 6.283 + hash(i, 8) * .22, [x, z] = ring(a, -.05 + hash(i, 9) * .06); if (Math.hypot(x - XS + 4, z + 1) < 5) continue; put(R.tuft({ kind: 'reed', s: 1.1 + hash(i, 10) * .7, c: i % 3 ? '#6a9a4e' : '#9aa85a', seed: i % 3 }), x, z, i, Math.max(H(x, z), -.04)); }
for (let i = 0; i < 40; i++) { const [x, z] = ring(hash(i, 11) * 6.283, .05 + hash(i, 12) * .25); put(R.tuft({ kind: ['grass', 'flower', 'bush'][i % 3], s: .6 + hash(i, 13) * .4, seed: i % 3 }), x, z, i); }
// 小島（松 2 本・岩・あし）
put(R.tree({ kind: 'pine', h: 6.5, seed: 5 }), -5.4, .2); put(R.tree({ kind: 'pine', h: 4.4, c: '#3a7a52', seed: 8 }), -3.6, 1.6); put(R.rock({ s: 1.1, moss: .7, seed: 3 }), -6.8, 1.8, 1); put(R.rock({ s: .7, seed: 9 }), -3.2, -1.4, 2);
for (let i = 0; i < 9; i++) { const a = i * .7; put(R.tuft({ kind: 'reed', s: 1.2, seed: i % 3 }), -5 + Math.cos(a) * 4.5, .5 + Math.sin(a) * 4.5, i, 0); }
for (let i = 0; i < 8; i++) put(R.tuft({ kind: 'reed', s: 1.3 + hash(i, 20) * .5, seed: i % 3 }), XS - 3 + hash(i, 21) * 3.5, (i % 2 ? 1.2 : -3.4) + hash(i, 22) * 1.4, i, -.02);
scene.add(R.merge(fixed));

// ---- 空：遠くの山・雲（霧は Fog と、山のすその かすみ） ----
scene.add(R.backdrop({ c: '#4e7284', haze: '#d4e2dc', r: 215, h: 70, y: 1, seed: 2 }), R.backdrop({ c: '#7a9cb0', haze: '#dce8e0', r: 240, h: 130, y: 0, rep: 3, seed: 6 }));
for (let i = 0; i < 5; i++) { const c = R.cloud({ s: 34 + hash(i, 14) * 20, c: '#fffaf0', shade: '#d8e0e4', seed: i }), a = i * 1.26; c.position.set(Math.cos(a) * 205, 62 + hash(i, 15) * 26, Math.sin(a) * 205); c.lookAt(0, 30, 0); scene.add(c); }

// ---- 舟と人・つり人・鳥 ----
const rod = (len = 2.3) => R.geo().smooth(1).loft(4, [[-.25, .022, .022, 0, .7], [len, .008, .008, 2, 1]], { cap: 'top' }).mesh(T.planks({ c: '#b89a5a' }));
const boat = new THREE.Group(), hull = R.boat({ c: '#a8744a' }); hull.scale.setScalar(1.25); boat.add(hull); scene.add(boat);
const hero = R.person({ face: 0, cloth: 'vest', top: '#c2553a', top2: '#f0e0b8', bottom: '#4a5a6a', hat: 'straw', acc: '#e0c070', hair: '#5a3a28', s: 1.05 }); hero.position.set(0, -.34, -.75); boat.add(hero);
const r1 = rod(2.1); r1.position.set(.42, .5, -1.5); r1.rotation.set(-.55, 0, -.1); boat.add(r1); const pail = R.barrel({ h: .3, r: .16, c: '#8a9aa8' }); pail.position.set(-.2, .2, .7); boat.add(pail);
const fisher = R.person({ face: 6, cloth: 'jacket', top: '#5a7a5a', bottom: '#5a4a3a', hat: 'cap', acc: '#3a5a8a', hair: '#d8d8d8', boots: true }); fisher.position.set(XS - 9.4, .52, -1.5); fisher.rotation.y = Math.PI; scene.add(fisher);
const r2 = rod(2.6); r2.position.y = -.3; r2.rotation.x = 2.5; fisher.userData.J.foreR.add(r2);
const bob = R.barrel({ h: .2, r: .09, c: '#d8503c' }); scene.add(bob);
const cat = R.cat({ c: '#e8e4dc', plain: true }); cat.position.set(XS - 8.3, .52, -.6); cat.rotation.y = 2.6; scene.add(cat);
const birds = [...Array(5)].map((_, i) => { const b = R.bird({ c: '#f0f0ec', neck: false, s: 1.5 }); scene.add(b); return b; }), duck = [0, 1].map(i => { const b = R.bird({ c: i ? '#8a6a4a' : '#e8e4dc', s: 1.6 }); scene.add(b); return b; });

// ---- 舟の道（湖をひと回り。桟橋の先に寄るときは おそくなる） ----
const PX = XS - 13.6, path = new THREE.CatmullRomCurve3([[-30, 1], [-24, -8], [-8, -12], [10, -11.5], [PX - 9, -9], [PX - 2, -5], [PX, .5], [PX - 3.5, 7], [PX - 15, 12], [-8, 12.5], [-23, 9]].map(([x, z]) => new THREE.Vector3(x, 0, z)), true, 'centripetal');
const LEN = path.getLength(), SPEED = 1.9, cd = new THREE.Vector3(), cp = new THREE.Vector3(), fx = K.fx(scene, 70), tip = new THREE.Vector3(PX, 0, -1);
let dist = 0, bd = 1e9; for (let i = 0; i < 400; i++) { const q = path.getPointAt(i / 400), d = Math.hypot(q.x - (PX - 13), q.z + 10); if (d < bd) { bd = d; dist = i / 400 * LEN; } }
const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);   // ざらつきは切る（ほかは既定の強さ）
let first = true, sm = 0, wk = 0, row = 0;
K.loop((dt, t) => {
  const u0 = (dist / LEN) % 1, p0 = path.getPointAt(u0), v = SPEED * (.14 + .86 * Math.min(1, Math.max(0, p0.distanceTo(tip) - 2.4) / 9)); dist += v * dt; row += dt * (1.2 + v);
  const u = (dist / LEN) % 1, p = path.getPointAt(u), tg = path.getTangentAt(u);
  boat.position.set(p.x, .03 + Math.sin(t * 1.7) * .025, p.z); boat.rotation.set(Math.sin(t * 1.3) * .025, Math.atan2(tg.x, tg.z), Math.sin(t * 1.1 + 1) * .04);
  // こぐ人（すわって、うでを前後に）
  const J = hero.userData.J, s = Math.sin(row * 1.6); R.idle(hero, t, Math.sin(t * .3) * .35); for (const n of ['L', 'R']) { J['leg' + n].rotation.x = -1.42; J['shin' + n].rotation.x = 1.25; J['arm' + n].rotation.x = -.85 + s * .32; J['fore' + n].rotation.x = -.55 - s * .3; } J.torso.rotation.x = .12 + s * .1;
  // うしろ斜め上から追うカメラ（向きはゆっくり追いつく。たて長では近づく）
  if (first) { cd.copy(tg); first = false; } cd.lerp(tg, 1 - Math.exp(-dt * 1.2)).normalize(); const tall = innerWidth < innerHeight, D = tall ? 4.8 : 6.3;
  cp.set(p.x - cd.x * D, tall ? 3.2 : 3.5, p.z - cd.z * D); cam.position.copy(cp); cam.lookAt(p.x + cd.x * 4, .7, p.z + cd.z * 4);
  sun.position.set(p.x + SUN.x * 60, SUN.y * 60, p.z + SUN.z * 60); sun.target.position.copy(p);
  R.flip(water.mat, WF, t, 4);
  // つり人・うき・ねこ・鳥
  R.idle(fisher, t, Math.sin(t * .4) * .2); const F = fisher.userData.J; F.armR.rotation.x = -.95 + Math.sin(t * .9) * .05; F.foreR.rotation.x = -.55; bob.position.set(XS - 9.5, -.08 + Math.sin(t * 2.3) * .03, -5.2); R.catPose(cat, 'sit', t);
  birds.forEach((b, i) => { const a = t * .16 + i * .5, r = 15 + i * 2.2; b.position.set(PX - 12 + Math.cos(a) * r, 6.5 + i * .7 + Math.sin(t * .5 + i) * .8, Math.sin(a) * r * .7); b.rotation.y = Math.atan2(-Math.sin(a), Math.cos(a) * .7); R.birdPose(b, 'fly', t + i); });
  duck.forEach((b, i) => { const a = t * .07 + i * .35; b.position.set(PX - 7 + Math.cos(a) * (5 + i), -.1, 4 + Math.sin(a) * (3 + i)); b.rotation.y = Math.atan2(-Math.sin(a), Math.cos(a)); R.birdPose(b, 'stand', t); });
  // 舟のあとの波・かいのしぶき・えんとつのけむり
  if ((wk += dt * v) > .5) { wk = 0; for (const sx of [-1, 1]) fx.emit('splash', p.x - tg.x * 1.8 + tg.z * sx * .5, .05, p.z - tg.z * 1.8 - tg.x * sx * .5, { size: .34, life: 1.1, grow: 1.6, tint: '#eaf6f4' }); if (s > .5) for (const sx of [-1, 1]) fx.emit('splash', p.x + tg.z * sx * 1.5, .1, p.z - tg.x * sx * 1.5, { size: .3, life: .5, vy: .5, grow: .8 }); }
  if ((sm += dt) > .6) { sm = 0; fx.emit('smoke', smokeAt.x, smokeAt.y, smokeAt.z, { size: .5, life: 3.6, vy: .7, vx: -.25, grow: 1.6, spread: .1, tint: '#f0f0ec' }); }
  fx.update(dt); crt.render(scene, cam, t);
});
</script>
