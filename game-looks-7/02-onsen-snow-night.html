<!doctype html>
<html lang="ja">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>7-02 雪の温泉街の夜歩き こまかいローポリ</title>
<style>
html,body{margin:0;height:100%;background:#1f2c5c;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#f4e2c4;background:#18214a;padding:0 6px}
</style>
<div id="cap">7-02 ─ 雪の温泉街の夜歩き / 面を増やして形を作りこんだローポリを、夜の青紫・雪の白・あかりのだいだいで　｜　見るだけ（自動で歩く）</div>
<script src="kit.js"></script>
<script src="model.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 方向 A「こまかいローポリ」。箱は使わず、部品集の人・宿（2 階建ての家）・雪の針葉樹・街灯・橋と、回転体のちょうちん・湯ぶねで作る。
// 色は 3 つだけ：夜の青紫、雪の白、あかりのだいだい。面はカクカクのまま頂点の色でぬり、仕上げの加工はなし。
// 光は「いつもの光」の夜：月の青い光とやわらかい影、窓・ちょうちん・街灯のあかり（近くの街灯 3 本だけ本物の点の光）、ふる雪と湯けむり
import * as THREE from 'three';
const K = KIT(THREE), M = MODEL(THREE, K), { hash } = K, { lerp, smooth, P } = M;
const { scene, cam, renderer, onResize } = K.stage({ fov: 40, fitAspect: .95, maxFov: 72, far: 400 });
const L = M.look(scene, renderer, 'night', { range: 28, fog: [20, 118], dir: [-.5, .66, .42], set: { amb: 1.5, pw: 1.3 } });
const stars = K.stars(260, 300, 1.6); scene.add(stars);

// ── 地形：川ぞいの坂道。道は x の方向へ、ずっと上り（S）。PER ごとに同じ形で、1 周ごとに S×PER だけ高くなる ──
const PER = 200, S = .05, k1 = Math.PI * 2 / PER, mod = (a, n) => ((a % n) + n) % n;
const road = x => Math.sin(x * k1) * 7 + Math.sin(x * k1 * 3 + 1.2) * 1.6, rise = x => S * x + Math.sin(x * k1 * 2 + .6) * .7;
const RV = 8.4, RW = 3.1, riverY = x => rise(x) - 1.35;                                    // 川：道の右がわ（+z）。まん中までの距離と、半分のはば
const H = (x, z) => { const d = z - road(x), a = Math.abs(d); return rise(x) + smooth(4, 10, a) * .2 + smooth(14, 62, a) * (8 + 4 * Math.sin(x * k1 * 3 + z * .04)) + Math.sin(x * k1 * 6 + z * .13) * .12 * smooth(3, 8, a) - 2.1 * smooth(RW + 1.5, RW - .8, Math.abs(d - RV)); };
const G = M.ground(H, { nx: 96, nz: 64, cell: 2, grass: ['#dfe6f6', '#eef2fb', '#d2dcf0', '#f6f8fd'], patch: .06, jit: .025,
  paths: [{ d: (x, z) => Math.abs(z - road(x)), w: 1.7, color: '#8d8fae', edge: '#c2cbe4' }, { d: (x, z) => Math.abs(z - road(x) - RV), w: RW - .4, color: '#6a6f96', edge: '#9aa2c4', rough: .3 }], slope: { color: '#9a9cbc', from: .7, to: 1.3 } });
scene.add(G.mesh);
// 石だたみの道と、川の水面（どちらも線にそう帯。1 周ぶんを 2 つ置いて、主役の前後へ送る）
const linePts = off => [...Array(PER / 1 + 1)].map((_, i) => [i, road(i) + off]);
const WATER = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: .22, emissive: '#2a3f8a', emissiveIntensity: .22 });
const strips = [0, 1].map(() => { const g = new THREE.Group(); g.add(M.ribbon(linePts(0), { w: 2.9, H: G.h, color: '#6c6f94', edge: '#e4eaf8', ew: .35, lift: .02 }), M.ribbon(linePts(RV), { w: RW * 2 + 2.4, H: x => riverY(x), lift: 0, color: '#3f5aa8', jit: .07, mat: WATER })); scene.add(g); return g; });

// ── 置く物は 40m ごとのまとまり（chunk）に入れ、主役が進んだら 1 周先（と、そのぶん高い所）へ送りなおす ──
const CH = 40, chunks = [...Array(PER / CH)].map(() => { const g = new THREE.Group(); scene.add(g); return g; }), ci = x => Math.floor(mod(x, PER) / CH), chunkOf = x => chunks[ci(x)];
const put = (obj, x, z, ry = 0, dy = 0) => { obj.position.set(x, G.h(x, z) + dy, z); obj.rotation.y = ry; chunkOf(x).add(obj); return obj; };
const side = (x, s, dist) => [x, road(x) + s * dist], tilt = x => Math.atan(road(x + .5) - road(x - .5)), face = (x, s) => (s > 0 ? Math.PI : 0) - tilt(x);

// 石だたみ：面取りした平たい石を、目地をずらして 4 列にしく（まとめて描く。色は 1 枚ずつ少しちがう）
const SLAB = M.join([P(M.cbox(.64, .07, .7, .025), '#9698ba', 0, 0, 0, { jit: .03 })]), SL = chunks.map(() => []);
for (let i = 0; i < PER / .72; i++) for (let k = 0; k < 4; k++) { const x = i * .72, z = road(x) + (k - 1.5) * .72 + (i % 2 ? .18 : -.18); SL[ci(x)].push([x, G.h(x, z) + .07, z, -tilt(x), 1, ['#ffffff', '#e0e2f4', '#cdd0ea', '#f2eaf6'][Math.floor(hash(i, k) * 4)]]); }
SL.forEach((list, c) => chunks[c].add(M.scatter(SLAB, list, { cast: false })));
// 宿：2 階建ての木の家。下は黒い板、上は白いかべ、屋根は雪。のき下に、ちょうちんを並べる
const GLOW = M.glowMat('#e08a48', '#ff9440'); GLOW.emissiveIntensity = 1.5;
const chochin = list => { const q = [], gl = []; for (const [x, y, z] of list) { gl.push(P(M.lathe([[0, 0], [.09, 0], [.17, .1], [.17, .26], [.09, .36], [0, .36]], 8), '#fff', x, y, z)); q.push(P(M.cyl(.085, .085, .05, 6), '#2a2238', x, y + .385, z), P(M.cyl(.07, .07, .04, 6), '#2a2238', x, y - .02, z), P(M.tube([[x, y + .4, z], [x, y + .64, z]], .012, 3), '#2a2238')); }
  const g = new THREE.Group(), m = M.join(gl, GLOW); m.castShadow = false; g.add(M.join(q), m); return g; };
const WOOD = '#6b4b40', PLASTER = '#e8dcc6', SNOW = '#edf2fa', inns = [];
const INNS = [
  [14, -1, 7.6, { w: 7.4, d: 4.8, roof: 'hip' }], [31, -1, 7.4, { w: 6, d: 4.6, gableFront: true, wall2: '#dccfb8' }], [52, -1, 8, { w: 8, d: 5, floors: 3, h: 2.5, roof: 'hip' }], [72, -1, 7.4, { w: 6.4, d: 4.6 }],
  [93, -1, 7.8, { w: 7.2, d: 4.8, gableFront: true }], [114, -1, 7.4, { w: 6, d: 4.4, roof: 'hip', wall2: '#dccfb8' }], [136, -1, 8, { w: 8, d: 5, floors: 3, h: 2.5 }], [158, -1, 7.4, { w: 6.6, d: 4.6, roof: 'hip' }], [180, -1, 7.6, { w: 6.2, d: 4.6, gableFront: true }],
  [24, 1, 18.4, { w: 7, d: 5 }], [62, 1, 18.8, { w: 8, d: 5, roof: 'hip', floors: 3, h: 2.5 }], [84, 1, 18.2, { w: 6, d: 4.6, gableFront: true }], [126, 1, 18.6, { w: 7.4, d: 5, roof: 'hip' }], [148, 1, 18.2, { w: 6, d: 4.6 }], [190, 1, 18.8, { w: 7.6, d: 5, gableFront: true, floors: 3, h: 2.5 }],
];
INNS.forEach(([x, s, dist, o], i) => { const [hx, hz] = side(x, s, dist), ry = face(x, s), fh = o.h || 2.7;
  const h = put(M.house({ floors: 2, wall: WOOD, wall2: PLASTER, timber: '#44302a', trim: '#4e3a32', roofColor: SNOW, door: '#b4553a', base: '#8b8aa2', chimney: false, windows: [s > 0 ? 1 : 3], ...o, lit: L.lit * (.8 + hash(i, 3) * .4), found: 1.4, seed: i + 1 }), hx, hz, ry);
  const fx = hx + Math.sin(ry) * (o.d / 2 + .2), fz = hz + Math.cos(ry) * (o.d / 2 + .2); h.position.y = G.h(fx, fz) + .02; inns.push([hx, hz, Math.max(o.w, o.d)]);
  const nf = Math.max(1, Math.round(o.w / 1.75)), doorX = ((nf > 2 ? 1.5 : .5) / nf - .5) * o.w * .92, list = []; for (let u = -o.w / 2 + .55; u < o.w / 2 - .3; u += 1.15) if (Math.abs(u - doorX) > .95) list.push([u, .3 + fh - .68, o.d / 2 + .3]);
  h.add(chochin(list));
  if (s < 0) { const n = 6, pts = [...Array(n)].map((_, k) => [lerp(fx, x, k / (n - 1)), lerp(fz, road(x) - 1.3, k / (n - 1))]); chunkOf(x).add(M.ribbon(pts, { w: 1.2, H: G.h, color: '#a0a3c2', lift: .05, jit: .08 })); }
});
// 雪をかぶった針葉樹：形のちがう 4 本を作っておき、同じ形はまとめて描く。宿のうら山と、川の向こう
const TV = [M.conifer({ h: 7.5, seed: 1, seg: 6, leaf: M.LEAF.dusk, snow: SNOW }), M.conifer({ h: 6, seed: 3, tiers: 5, seg: 6, leaf: M.LEAF.dusk, snow: SNOW }), M.conifer({ h: 9, seed: 5, tiers: 5, seg: 6, wide: .85, leaf: ['#4a7486', '#3c6478'], snow: SNOW }), M.rock({ r: .7, n: 2, color: '#e9eff9', d: .5, seed: 2 })];
const TL = chunks.map(() => TV.map(() => [])), free = (x, z, r) => inns.every(([hx, hz, hs]) => Math.hypot(x - hx, z - hz) > hs * .72 + r);
for (let i = 0; i < 150; i++) { const x = hash(i, 11) * PER, s = hash(i, 12) < .6 ? -1 : 1, a = (s < 0 ? 11 : 15) + Math.pow(hash(i, 13), 1.3) * 50, z = road(x) + s * a; if (free(x, z, 2.2)) TL[ci(x)][i % 3].push([x, G.h(x, z) - .1, z, hash(i, 14) * 6, .75 + hash(i, 15) * .6]); }
for (let i = 0; i < 46; i++) { const x = hash(i, 21) * PER, s = i % 2 ? 1 : -1, z = road(x) + s * (s < 0 ? 2.6 + hash(i, 22) * 2 : 3.9 + hash(i, 22) * .4); if (free(x, z, .8)) TL[ci(x)][3].push([x, G.h(x, z) - .12, z, i, .5 + hash(i, 23) * .7]); }   // 道ばたの雪の山
TL.forEach((vs, c) => vs.forEach((list, v) => { if (list.length) chunks[c].add(M.scatter(TV[v].children[0], list)); }));
[[8, -1, 4.4, 5.4, 2], [43, -1, 4.6, 6.2, 4], [103, -1, 4.4, 5.6, 6], [168, -1, 4.6, 6, 8], [40, 1, 13.4, 6.4, 3], [106, 1, 13.6, 7, 7], [170, 1, 13.4, 6, 9]].forEach(([x, s, d, h, seed]) => put(M.conifer({ h, seed, leaf: M.LEAF.dusk, snow: SNOW, tiers: 5 }), ...side(x, s, d), seed, -.05));
// 橋（川をわたる）・川べりのさく・街灯・看板・足湯とベンチ
const BX = [46, 146], lamps = [], steams = [];
BX.forEach(bx => { const b = put(M.bridge({ len: RW * 2 + 5, w: 2.4, rise: .8, color: '#8a5f4c', rail: '#c2553c' }), ...side(bx, 1, RV), -tilt(bx)); b.position.y = rise(bx) + .16; });
const along = (x0, x1, s, dist, step = 1.7) => { const p = []; for (let x = x0; x <= x1 + .01; x += step) p.push(side(x, s, dist)); return p; };
[[0, 20], [20, 44], [48, 80], [80, 120], [120, 144], [148, 180], [180, 200]].forEach(([x0, x1]) => chunkOf(x0).add(M.fence(along(x0, x1, 1, 3.5), { H: G.h, h: .9, color: '#6b4b40' })));
for (let i = 0; i < 16; i++) { const x = 6 + i * 12.5, s = i % 2 ? 1 : -1; lamps.push(put(M.lamp({ lit: L.lit, kind: i % 2 ? 'top' : 'arm', color: '#2e2a44' }), ...side(x, s, s > 0 ? 3.0 : 2.7), s > 0 ? Math.PI / 2 : -Math.PI / 2)); }
put(M.sign({ kind: 'hang', color: '#f4e6c8', post: '#4e3a32', mark: '#c2553c' }), ...side(27.5, -1, 4.2), Math.PI * .5); put(M.sign({ color: '#e4d2ae', post: '#4e3a32' }), ...side(49.5, 1, 2.9), -.6); put(M.sign({ kind: 'hang', color: '#f4e6c8', post: '#4e3a32', mark: '#c2553c' }), ...side(120, -1, 4.2), Math.PI * .5);
const bath = () => { const g = new THREE.Group(), w = M.join([P(M.lathe([[1.05, .36], [0, .36]], 10), '#fff')], M.glowMat('#7fb4d8', '#5a9ad8')); w.material.emissiveIntensity = .5; w.castShadow = false;
  g.add(M.join([P(M.lathe([[0, 0], [1.4, 0, .04], [1.45, .3, .05], [1.3, .46, .04], [1.05, .46], [1.02, .2], [0, .2]], 10), '#8b8aa2', 0, 0, 0, { jit: .1 }), P(M.blob(.42, { d: .5, j: .2, flat: .5 }), '#77768e', -1.1, .5, -.6), P(M.blob(.2, { d: 0, j: .1, flat: .3 }), SNOW, -1.1, .86, -.6), P(M.tube([[-1.1, .62, -.5], [-.8, .7, -.3], [-.62, .6, -.2]], .05, 5), '#6b4b40')]), w); return g; };
[[62.5, -1, 4.6], [128, -1, 4.8]].forEach(([x, s, d]) => { const [bx, bz] = side(x, s, d); put(bath(), bx, bz, .5, -.04); steams.push([bx, G.h(bx, bz) + .5, bz, 1]); const bn = put(M.bench({ color: '#8a5f4c' }), ...side(x + 2.4, s, d + .3), face(x, s) + .5); bn.userData.x = x; });
for (let i = 0; i < 10; i++) { const x = 10 + i * 20 + hash(i, 31) * 6, z = road(x) + RV + (hash(i, 32) - .5) * 3; steams.push([x, riverY(x) + .1, z, 0]); }          // 川から立つ湯けむり
for (let i = 0; i < 16; i++) { const x = hash(i, 41) * PER, z = road(x) + RV + (hash(i, 42) - .5) * 4.4; put(M.rock({ r: .3 + hash(i, 43) * .45, n: 1 + i % 2, color: '#77768e', d: .5, seed: i }), x, z, i).position.y = riverY(x) - .12; }

// ── 人 ──
const hero = M.person({ h: 1.5, head: .26, top: '#d8643c', bottom: '#3a3f6e', coat: true, buttons: '#f4e6c8', scarf: '#f6ecd6', hairStyle: 'bob', hair: '#3a2a30', hat: 'beanie', hatColor: '#f6ecd6', hatBand: '#d8643c', shoes: '#4e3a32' }); scene.add(hero);
const walker = M.person({ top: '#5a64a8', bottom: '#2e3358', coat: true, scarf: '#f0a03c', hairStyle: 'short', hair: '#2a2238', hat: 'beanie', hatColor: '#3a3f6e' }); scene.add(walker);
const onBridge = [[-.5, .38, { top: '#e9dcc6', bottom: '#5a64a8', coat: true, scarf: '#d8643c', hairStyle: 'bun', hair: '#3a2a30' }], [.45, .46, { age: 'child', top: '#f0a03c', bottom: '#3a3f6e', coat: true, hat: 'beanie', hatColor: '#d8643c', scarf: '#f6ecd6' }]].map(([dx, u, o]) => { const p = M.person(o), [bx, bz] = side(BX[0] + dx, 1, RV + (u - .5) * (RW * 2 + 5)); put(p, bx, bz, Math.PI * .5 + dx); p.position.y = rise(BX[0]) + .16 + .8 * (1 - (2 * u - 1) ** 2) + .05; return p; });

// ── ふる雪：小さな 8 面の粒をまとめて描き、主役のまわりの箱の中でくり返す ──
const NS = 520, snow = new THREE.InstancedMesh(M.gem(.03), new THREE.MeshBasicMaterial({ color: '#f2f6ff' }), NS), dm = new THREE.Object3D(); snow.frustumCulled = false; scene.add(snow);
const steam = M.puffs(scene, { n: 60, color: '#e6ecff', opacity: .42 }), PL = [0, 1, 2].map(() => { const p = new THREE.PointLight('#ffb468', 0, 11, 1.5); scene.add(p); return p; });

Object.assign(steam.mesh.material, { emissive: new THREE.Color('#7f8fd0'), emissiveIntensity: .55, depthWrite: false });   // 湯けむりは夜でも白くうかぶように、少し光らせる
// ── 毎コマ ──
const X0 = +new URLSearchParams(location.search).get('x') || 33, SPD = 1.3; let dist = 0, px = X0, pz = road(X0), tall = false, stT = 0;   // ?x=数 で歩きはじめる場所を変えられる（確かめ用）
onResize((w, h) => { tall = w < h; });
K.loop((dt, t) => {
  const x = X0 + t * SPD, z = road(x) - .35, y = G.h(x, z); dist += Math.hypot(x - px, z - pz); px = x; pz = z;
  hero.position.set(x, y, z); hero.rotation.y = Math.atan2(1, (road(x + .3) - road(x - .3)) / .6); M.pose(hero, 'walk', dist / hero.userData.rig.stride * Math.PI);
  // 向こうから下りてくる人（すれちがったら 1 周先へ）、橋の上で川を見る 2 人
  const wx = x + mod(X0 + 17 - t * 1.1 - x + 60, PER) - 60, wz = road(wx) + 1.0; walker.position.set(wx, G.h(wx, wz), wz); walker.rotation.y = Math.atan2(-1, -(road(wx + .3) - road(wx - .3)) / .6); M.pose(walker, 'walk', t * 1.1 / walker.userData.rig.stride * Math.PI);
  onBridge.forEach((p, i) => M.pose(p, i ? 'wave' : 'stand', t * (i ? 2.4 : 1.2)));
  // 地面・帯・まとまりを主役の前後へ送る（1 周先は S×PER だけ高い）
  G.follow(x + 44, z); chunks.forEach((g, c) => { const k = Math.round((x + 50 - (c + .5) * CH) / PER); g.position.set(k * PER, k * PER * S, 0); }); strips.forEach((r, i) => { const k = Math.floor((x - 70) / PER) + i; r.position.set(k * PER, k * PER * S, 0); });
  // 湯けむり（近くの湯ぶねと川から）
  stT += dt; if (stT > .1) { stT = 0; const near = steams.filter(e => Math.abs(mod(e[0] - x - 14 + PER / 2, PER) - PER / 2) < 30), e = near[Math.floor(Math.random() * near.length)], k = e ? Math.round((x + 14 - e[0]) / PER) : 0, ex = e ? e[0] + k * PER : 0; if (e) steam.emit(ex + (Math.random() - .5) * (e[3] ? 1.2 : 2), e[1] + k * PER * S, e[2] + (Math.random() - .5) * (e[3] ? 1.2 : 2), { life: 5.5, size: e[3] ? .3 : .5, grow: 3.4, vy: .55, vx: .16, vz: -.1 }); } steam.update(dt);
  // 近くの街灯 3 本に、本物の点の光を回す（遠ざかると消えてから次の街灯へ移る）
  const i0 = Math.round((x + 6 - 6) / 12.5); for (let i = i0 - 1; i <= i0 + 1; i++) { const p = PL[mod(i, 3)], lx = 6 + i * 12.5, s = mod(i, 2) ? 1 : -1, lz = road(lx) + (s > 0 ? 2.4 : -2.1); p.position.set(lx, G.h(lx, lz) + 2.75, lz); p.intensity = 30 * smooth(18.5, 10, Math.abs(lx - x - 6)); }
  // 雪：それぞれの粒は世界の決まった所を落ち、主役のまわりの箱（34×15×28）から出たら反対がわへ
  const cx = x + 9, cy = y + 5;
  for (let i = 0; i < NS; i++) { const f = .7 + hash(i, 4) * .9, sx = hash(i, 1) * 34 + Math.sin(t * .7 + i) * .4 + t * .5, sy = hash(i, 2) * 15 - t * f * 1.5, sz = hash(i, 3) * 28 + Math.cos(t * .6 + i * 1.7) * .4; dm.position.set(cx + mod(sx - cx, 34) - 17, cy + mod(sy - cy, 15) - 7.5, z + mod(sz - z, 28) - 14); dm.rotation.set(i, t * f, 0); dm.scale.setScalar(.7 + hash(i, 5) * 1.1); dm.updateMatrix(); snow.setMatrixAt(i, dm.matrix); } snow.instanceMatrix.needsUpdate = true;
  L.follow(x + 5, y, z); stars.position.copy(cam.position);
  // うしろから追うカメラ（たて長では少し寄る）
  const back = tall ? 4.0 : 4.9, cmx = x - back, cmz = lerp(road(cmx), z, .45) + (tall ? .5 : 1.15) + Math.sin(t * .13) * (tall ? .2 : .45), cmy = Math.max(G.h(cmx, cmz) + 1.2, y + (tall ? 1.75 : 1.95));
  cam.position.set(cmx, cmy, cmz); cam.lookAt(x + 5, G.h(x + 5, road(x + 5)) + (tall ? 1.65 : 1.2), lerp(road(x + 5), z, .45) + (tall ? 0 : .6));
  renderer.render(scene, cam);
});
</script>
