<title>7-12 雪の村の夜を歩く RPG 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#dfe8ff;opacity:.85;text-shadow:0 1px 0 #000}

<div id="cap">7-12 ─ 雪の村の夜を歩く RPG / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="kit.js"></script>
<script src="retro.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 面の少ない家・人・松に、その場で打ったドット絵のテクスチャ（雪・木組みのかべ・雪をのせた屋根がわら）をはり、横 320 ドットの粗い絵に描く。
// 色は紺（空・雪のかげ）とだいだい（窓と街灯）の 2 つにしぼり、色数を落としてディザにかけ、ブラウン管に映してにじませる。
// 雪の夜の村。マントの主人公が、踏み固めた道を輪にそって歩き、村人とすれちがう。部品はぜんぶ retro.js（R.〜）
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), T = R.tex, { hash } = K;
const { scene, cam, renderer, onResize } = K.stage({ fov: 44, far: 900, aa: false, fitAspect: .9, maxFov: 74 });
scene.add(R.skyDome([[0, '#0a1034'], [.5, '#17235c'], [.8, '#2c3f86'], [1, '#4a5ea8']], { r: 380 })); scene.fog = new THREE.Fog('#2a3a7c', 30, 150);
const { sun } = K.lights(scene, renderer, { sky: 0x7088e8, ground: 0x8090c8, amb: 1.5, sun: 0xa8bcff, power: 1.5, range: 30 }), SUN = new THREE.Vector3(.5, .62, .6).normalize();

// ---- 道の輪（長円）。pt(a, 外へのずれ) で輪にそった点、off(x, z) で道からのへだたり ----
const A = 21, B = 9, pt = (a, e = 0) => { const nx = Math.cos(a) / A, nz = Math.sin(a) / B, l = Math.hypot(nx, nz); return [Math.cos(a) * A + nx / l * e, Math.sin(a) * B + nz / l * e, Math.atan2(-nx, -nz)]; };
const off = (x, z) => { const r = Math.hypot(x / A, z / B) || 1e-3; return (r - 1) * Math.hypot(x, z) / r; };
const LAMPS = [.35, 1.2, 1.95, 2.8, 3.5, 4.35, 5.1, 5.95].map((a, i) => pt(a, i % 2 ? 2.3 : -2.3)), GLOW = [...LAMPS];

// ---- テクスチャ：雪をのせた屋根（かわらの上に雪を打つ。のき先だけ かわらが見える）----
const snowP = R.paint.snow({}), snowRoof = (c, kind) => { const P = R.paint.roof({ c, kind }); P.each((x, y) => { const e = 50 + Math.sin(x * .39) * 3 + Math.sin(x * .98 + 1) * 2, hole = Math.sin(x * .294 + 2) + Math.sin(y * .392 + x * .098) > 1.55; return y < e && !hole ? (y > e - 2 ? '#9fb0dc' : snowP.get(x, y)) : undefined; }); return T.from(P, { m: 3 }); };
const roofA = snowRoof('#8a4a48'), roofB = snowRoof('#4f5a86', 'slate'), roofC = snowRoof('#6a5a4a', 'wave');
const win = T.window({ lit: 1 }), winD = T.window({ curtain: '#c8b8a0' }), winS = T.window({ shutters: 1, lit: 1 }), winSD = T.window({ shutters: 1 }), winA = T.window({ h: 48, arch: 1, bars: 'grid', lit: 1 });
const KIND = [
  { w: 7, d: 6, h2: 2.5, wall: T.stone({ c: '#8a8ea4' }), wall2: T.plaster({ frame: 'cross', c: '#d8d4d8' }), roof: roofA, chimney: true, sign: T.sign({ kind: 'mug' }), win: winD, winLit: win },
  { w: 5.6, d: 5.4, h2: 2.4, jut: .2, wall: T.plaster({ frame: 'box', c: '#d8d0c8' }), wall2: T.plaster({ frame: 'diag', c: '#d8d0c8' }), roof: roofB, ridge: 'z', win: winSD, winLit: winS, door: T.door({ style: 'panel', c: '#4a6a7a' }) },
  { w: 7.4, d: 5.4, wall: T.plaster({ frame: 'beam', c: '#e0d8cc' }), roof: roofC, pitch: 1.05, eave: .7, win: winD, winLit: win, chimney: { x: -2.2 } },
  { w: 5, d: 5, h: 3, h2: 2.6, jut: .25, wall: T.boards({ c: '#7a6a5a' }), wall2: T.plaster({ frame: 'cross', c: '#d8d4d8' }), roofKind: 'hip', roof: roofB, win: winD, winLit: winA, door: T.door({ arch: 1 }) },
  { w: 6.2, d: 5.6, h2: 2.4, wall: T.brick({ c: '#9a6a5a' }), wall2: T.plaster({ frame: 'box', c: '#e0d8cc' }), roof: roofA, ridge: 'z', chimney: true, sign: T.sign({ kind: 'bread' }), win: winSD, winLit: winS }];
const fixed = [], smokes = [], put = (o, x, z, ry = 0, y = 0) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
[.12, .62, 1.12, 1.57, 2.02, 2.52, 3.02, 3.6, 4.1, 4.71, 5.3, 5.82].forEach((a, i) => { const k = [0, 1, 2, 3, 4, 1, 0, 2, 3, 4, 2, 1][i], q = KIND[k], [x, z, ry] = pt(a, 5.6 + q.d / 2), h = put(R.house({ ...q, lit: .8, seed: i }), x, z, ry);
  GLOW.push(pt(a, 3.6)); if (q.chimney) { const c = q.chimney === true ? {} : q.chimney; h.updateMatrixWorld(); smokes.push(h.localToWorld(new THREE.Vector3(c.x ?? q.w * .24, h.userData.top + .9, -q.d * .18))); } });

// ---- 地面：雪（下地）＋踏み固めた道。街灯と窓の下は だいだいに、木のかげは紺に焼きこむ ----
const land = R.ground({ w: 150, d: 110, cell: 2, layers: [T.snow(), T.snow({ c: '#8c9ac6', seed: 2 }), T.dirt({ c: '#8a86a0' })],
  mix: (x, z) => { const d = Math.abs(off(x, z)); return [Math.max(0, Math.min(1, 1.25 - d / 2.2)), d < .7 && hash(Math.round(x / 2), Math.round(z / 2)) > .55 ? .62 : 0]; },
  shade: (x, z) => { let k = 0; for (const [lx, lz] of GLOW) k = Math.max(k, 1 - Math.hypot(x - lx, z - lz) / 6); k = Math.max(0, k) ** 2; return [.8 + 1 * k, .84 + .3 * k, 1 - .62 * k]; } });
scene.add(land.mesh);

// ---- 松（枝の段ごとに雪のかさ）・雪だるま・小物 ----
const pine = (h, seed) => { const g = new THREE.Group(), G = R.geo().smooth(2); g.add(R.tree({ kind: 'pine', h, c: '#2c6a5c', seed }));
  for (let k = 0; k < 4; k++) { const y0 = h * (.16 + k * .19), r = h * (.25 - k * .048); G.loft(6, [[y0 + h * .13, r * .7, r * .7, 0, .72], [y0 + h * .2, r * .5, r * .5, .4, 1], [y0 + h * .37, .03, .03, 1, 1.1]], { rot: k * .5, ur: 2 }); } g.add(G.mesh(T.snow({ m: 2 }))); return g; };
const faceP = R.paint.snow({ seed: 1 }); faceP.bits(28, 18, ['#.....#', '.......', '...oo..', '..ooo..', '.......', '#.....#', '.#####.'], { '#': '#1e2030', o: '#f08a3a' }); for (const y of [40, 48, 56]) faceP.rect(31, y, 2, 2, '#1e2030');
const snowman = () => { const G = R.geo().smooth(1), ball = (y, r) => [[-1, .25], [-.7, .72], [-.2, .98], [.3, .95], [.75, .66], [1, .1]].map(([t, k]) => [y + t * r, k * r, k * r, 0, .7 + (t + 1) * .2]), g = new THREE.Group();
  G.loft(8, ball(.5, .56).map((q, i) => (q[3] = .35 * i / 5, q)), { cap: 'top' }).loft(8, ball(1.22, .4).map((q, i) => (q[3] = .3 + .3 * i / 5, q)), { cap: 'top' }).loft(8, ball(1.78, .29).map((q, i) => (q[3] = .5 + .5 * i / 5, q)), { cap: 'top', rot: 0 }); g.add(G.mesh(T.from(faceP, { m: 1 })));
  g.add(R.geo().smooth(0).loft(8, [[1.96, .34, .34, 0, .8], [1.99, .34, .34, .1, 1], [2, .2, .2, .2, .8], [2.3, .19, .19, .9, 1]], { cap: 'top' }).mesh(T.fabric({ c: '#b8443a', pattern: 'stripe' })));
  const W = R.geo().smooth(0); for (const s of [-1, 1]) W.at(R.TR(s * .34, 1.3, 0, 0, 0, s * -1.1)).loft(4, [[0, .03, .03, 0, .8], [.6, .015, .015, 1, 1]], { cap: 'top' }); g.add(W.at(null).mesh(T.bark())); return g; };
const facing = (x, z) => Math.atan2(-x / A / A, -z / B / B) + Math.PI;   // 道のほうを向く（輪の内がわの物）
put(snowman(), ...pt(-.8, -2.6)); put(snowman(), 3.5, .8, 1.1).scale.setScalar(.7);
put(R.well({ stone: T.stone({ c: '#8a8ea4' }) }), -3, 0, .4); put(pine(8.5, 3), 1.5, -1.6); put(pine(6, 5), -9, 1.5); put(pine(5.2, 7), 10, .6); put(R.bench(), 6.3, -1.2, .3); put(R.bench(), -6.4, 2.6, Math.PI - .2);
for (const [x, z] of LAMPS) put(R.lamp(), x, z);
for (let i = 0; i < 46; i++) { const a = hash(i, 1) * 6.283, [x, z] = pt(a, 15 + hash(i, 2) * 26); put(pine(5 + hash(i, 3) * 5, i), x, z, i); }
[.38, .88, 1.36, 1.8, 2.28, 2.78, 3.32, 3.86, 4.42, 5.02, 5.56, 6.08].forEach((a, i) => { const [x, z, ry] = pt(a, 3.6), k = i % 4;
  if (k === 0) { put(R.barrel(), x, z, i); put(R.barrel({ h: .8, r: .32 }), x + .8, z + .15, 1); } if (k === 1) { put(R.crate(), x, z, .3 + ry); put(R.crate({ s: .55, kind: 'x' }), x + .1, z + .05, .9, .8); }
  if (k === 2) put(R.fence({ len: 4, kind: 'rail' }), x, z, ry); if (k === 3) { put(R.rock({ s: .7, c: '#c8d2e8', seed: i }), x, z, i); put(pine(2.6, i), ...pt(a + .04, 5)); } });
scene.add(R.merge(fixed));

// ---- 空：山なみ・月・星、あかり、ふる雪 ----
scene.add(R.backdrop({ c: '#1c2858', haze: '#5a6cb0', r: 240, y: -4, h: 46 }));
const moon = new THREE.Mesh(new THREE.CircleGeometry(9, 16), new THREE.MeshBasicMaterial({ color: '#f4f0d8', fog: false })); moon.position.set(SUN.x * 260, 120, SUN.z * 260 - 200); moon.lookAt(0, 10, 0); scene.add(moon);
const starG = new THREE.BufferGeometry(); starG.setAttribute('position', new THREE.Float32BufferAttribute([...Array(160)].flatMap((_, i) => { const a = hash(i, 11) * 6.283, e = .12 + hash(i, 12) * 1.2; return [Math.cos(a) * Math.cos(e) * 340, Math.sin(e) * 340, Math.sin(a) * Math.cos(e) * 340]; }), 3));
scene.add(new THREE.Points(starG, new THREE.PointsMaterial({ color: '#dfe6ff', size: 2.2, sizeAttenuation: false, fog: false })));
for (const i of [0, 2, 3, 5, 6]) { const l = new THREE.PointLight('#ffa850', 22, 10, 1.5); l.position.set(LAMPS[i][0], 3.1, LAMPS[i][1]); scene.add(l); }
const NS = 220, flakeG = new THREE.BufferGeometry(), fp = new Float32Array(NS * 3); flakeG.setAttribute('position', new THREE.BufferAttribute(fp, 3));
const flakes = new THREE.Points(flakeG, new THREE.PointsMaterial({ color: '#eef2ff', size: .055, fog: false })); flakes.frustumCulled = false; scene.add(flakes);
const mod = (v, m) => ((v % m) + m) % m;

// ---- 人 ----
const hero = R.person({ face: 1, cloth: 'tunic', top: '#3a5c9a', top2: '#e8dcc0', bottom: '#5a4a44', boots: true, cape: '#d8482e', hair: '#5a3a28', s: 1.05 }); scene.add(hero);
const npc = (o, x = 0, z = 0, ry = 0) => { const p = R.person(o); p.position.set(x, 0, z); p.rotation.y = ry; scene.add(p); return p; };
const walkers = [npc({ face: 6, cloth: 'jacket', top: '#8a6a3a', bottom: '#4a4a5a', hair: '#d8d8d8', hat: 'cap', acc: '#a04a3a', boots: true }), npc({ face: 3, cloth: 'robe', skirt: 1, top: '#7a5a9a', hair: '#e6c46a', hat: 'cone', acc: '#7a5a9a' }), npc({ face: 2, cloth: 'vest', top: '#4a7a6a', hair: '#c8843a', pack: true, boots: true })];
const [kx, kz] = pt(-.74, -2), kid = npc({ face: 5, cloth: 'stripe', top: '#e8704a', s: .76, head: 1.16, hat: 'cap', acc: '#3a6ab0' }, kx, kz, Math.atan2(pt(-.8, -2.6)[0] - kx, pt(-.8, -2.6)[1] - kz));
const chatA = npc({ face: 4, cloth: 'apron', top: '#b0586a', skirt: .8, hair: '#6e4628' }, ...pt(2.86, 1.5), 1.9), chatB = npc({ face: 7, cloth: 'jacket', top: '#5a6a8a', hair: '#3a2a3a', hat: 'straw' }, ...pt(2.93, 1.2), -1.4);

// ---- 主人公の道（輪を左まわり。村人は右まわりで来て、すれちがう） ----
const path = new THREE.CatmullRomCurve3([...Array(28)].map((_, i) => { const [x, z] = pt(-i / 28 * 6.283, .5); return new THREE.Vector3(x, 0, z); }), true, 'centripetal'), back = new THREE.CatmullRomCurve3([...Array(28)].map((_, i) => { const [x, z] = pt(i / 28 * 6.283, -.7); return new THREE.Vector3(x, 0, z); }), true, 'centripetal');
const LEN = path.getLength(), SPEED = 1.7, S0 = .03, cd = new THREE.Vector3(), cp = new THREE.Vector3(), fx = K.fx(scene, 60);
const crt = R.crt(renderer, { noise: 0, bright: 1.08 }); onResize(crt.resize);
let first = true, sm = 0;
K.loop((dt, t) => {
  const dist = t * SPEED, u = (S0 + dist / LEN) % 1, p = path.getPointAt(u), tg = path.getTangentAt(u);
  hero.position.copy(p); hero.rotation.y = Math.atan2(tg.x, tg.z); R.walk(hero, dist * 4);
  if (first) { cd.copy(tg); first = false; } cd.lerp(tg, 1 - Math.exp(-dt * 1.7)).normalize(); const tall = innerWidth < innerHeight, D = tall ? 4.3 : 5.9;
  cp.set(p.x - cd.x * D, tall ? 2.5 : 2.9, p.z - cd.z * D); cam.position.copy(cp); cam.lookAt(p.x + cd.x * 3, 1.4, p.z + cd.z * 3);
  sun.position.set(p.x + SUN.x * 60, SUN.y * 60, p.z + SUN.z * 60); sun.target.position.copy(p);
  // 村人
  walkers.forEach((w, i) => { const v = [1.5, 1.2, 1.7][i], wu = mod(1 - S0 - .115 - i * .33 + t * v / LEN, 1), q = back.getPointAt(wu), g = back.getTangentAt(wu); w.position.copy(q); w.rotation.y = Math.atan2(g.x, g.z); R.walk(w, t * v * 3.6 + i, .85); });
  R.idle(kid, t, Math.sin(t * .9) * .3); kid.userData.J.armR.rotation.x = -1.6 - Math.sin(t * 3) * .3; R.idle(chatA, t + 1, .2 + Math.sin(t * .8) * .1); R.idle(chatB, t + 3, -.15 + Math.sin(t * .7 + 1) * .1); chatB.userData.J.armL.rotation.x = -.5 - Math.max(0, Math.sin(t * 2.2)) * .5; chatB.userData.J.foreL.rotation.x = -1.1;
  // ふる雪（カメラのまわりの箱の中でくり返す）・えんとつのけむり
  for (let i = 0; i < NS; i++) { const f = .7 + hash(i, 4) * .8; fp[i * 3] = cp.x + mod(hash(i, 1) * 30 + Math.sin(t * .7 + i) * .4 + t * .4 - cp.x, 30) - 15; fp[i * 3 + 1] = mod(hash(i, 2) * 12 - t * f * 1.3, 12); fp[i * 3 + 2] = cp.z + mod(hash(i, 3) * 30 + Math.cos(t * .6 + i * 1.7) * .4 - cp.z, 30) - 15; } flakeG.attributes.position.needsUpdate = true;
  if ((sm += dt) > .55) { sm = 0; for (const s of smokes) if (Math.hypot(s.x - p.x, s.z - p.z) < 50) fx.emit('smoke', s.x, s.y, s.z, { size: .5, life: 3.2, vy: .8, vx: .3, grow: 1.5, spread: .12, tint: '#aab4dc' }); }
  fx.update(dt); crt.render(scene, cam, t);
});
</script>
