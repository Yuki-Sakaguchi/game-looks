  band.position.set(cx, .02, cz);
  for (let i = 0; i < NG; i++) { const d = 4 + Math.pow(i / NG, 1.7) * 230, w = .45 + d * .019, gx = Math.round((cx + SUN[0] * d - SUN[1] * (hash(i, 7) - .5) * 2 * w) / .9) * .9, gz = Math.round((cz + SUN[1] * d + SUN[0] * (hash(i, 7) - .5) * 2 * w) / .9) * .9, f = Math.sin(t * (1.5 + hash(gx, gz) * 3) + hash(gz, gx) * 40), s = G.h(gx, gz) > -.1 ? 0 : Math.max(0, f * .6 + .4) * (.4 + d * .013);
    dm.position.set(gx, .04, gz); dm.rotation.set(0, -SAZ + Math.PI / 2, 0); dm.scale.set(s, 1, s); dm.updateMatrix(); glit.setMatrixAt(i, dm.matrix); } glit.instanceMatrix.needsUpdate = true;
  renderer.render(scene, cam);
});
