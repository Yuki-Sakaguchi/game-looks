<title>7-16 麦畑の村の荷車 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#ffe9c8;opacity:.85;text-shadow:0 1px 0 #000}
</style>
<div id="cap">7-16 ─ 麦畑の村の荷車 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="kit.js"></script>
<script src="retro.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 方向 B。面の少ない形に、その場で打ったドット絵のテクスチャ（わらぶき・しっくいと木組み・土の道・麦の穂の切りぬき）をはり、横 320 ドットほどの粗い絵に描く。
// 色数を落としてディザにかけ、ブラウン管に映す（横のにじみ・走査線・わずかな丸み）。夕方の金色の光の村：麦畑をまわる土の道を、農夫が干し草の荷車を引いて歩く。
// ななめうしろから追うカメラ。部品はぜんぶ retro.js（R.〜）。麦は切りぬきの板を 3 千本ほど（3 つの束に分け、束ごとに風でかたむける）
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), T = R.tex, { hash } = K;
const { scene, cam, renderer, onResize } = K.stage({ fov: 44, far: 900, aa: false, fitAspect: .9, maxFov: 74 });
scene.add(R.skyDome([[0, '#4a5aa8'], [.4, '#8a7ab4'], [.66, '#e89a7a'], [.84, '#ffc878'], [1, '#fff0b0']], { r: 380 })); scene.fog = new THREE.Fog('#f2c088', 38, 190);
const { sun } = K.lights(scene, renderer, { sky: 0xb4a4e4, ground: 0xc89c68, amb: 1.25, sun: 0xffc070, power: 2.8, range: 30 }), SUN = new THREE.Vector3(-.74, .34, .46).normalize();

// ---- 道（麦畑をひとまわりする輪）と、道からの距離 ----
const path = new THREE.CatmullRomCurve3([...Array(18)].map((_, i) => { const a = i / 18 * 6.283, k = 1 + .07 * Math.sin(a * 3 + 1); return new THREE.Vector3(Math.cos(a) * 27 * k, 0, Math.sin(a) * 14.5 * k); }), true, 'centripetal');
const LEN = path.getLength(), SAMP = path.getSpacedPoints(180);
const near = (x, z) => { let d = 1e9; for (const q of SAMP) { const e = (x - q.x) ** 2 + (z - q.z) ** 2; if (e < d) d = e; } return Math.sqrt(d); };
const field = (x, z) => { const d = near(x, z), ins = Math.hypot(x / 27, z / 14.5) < 1; return d > 2.9 && (ins || (z < -3 - Math.abs(x) * .12 && d < 26 && Math.abs(x) < 46)); };   // 輪の中と、北がわの外が麦畑
const side = (u, off) => { const p = path.getPointAt(u % 1), t = path.getTangentAt(u % 1); return [p.x + t.z * off, p.z - t.x * off, Math.atan2(-t.z * Math.sign(off), t.x * Math.sign(off)), Math.atan2(t.x, t.z)]; };   // 道の外（＋）・内（−）へ off はなれた場所と、道を向く角度
const land = R.ground({ w: 150, d: 110, cell: 2, layers: [T.grass({ c: '#84a04c', flowers: .4 }), T.dirt({ c: '#b08a5c' }), T.dirt({ c: '#a8884a', pebbles: 0 })],
  mix: (x, z) => [Math.max(0, Math.min(1, .5 + (1.75 - near(x, z)) / 2)), field(x, z) ? 1 : 0] });
scene.add(land.mesh);

// ---- 麦：切りぬきの板を InstancedMesh で。3 つの束は matrix をかたむけて、風の波にする ----
const wheat = [0, 1, 2].map(k => { const src = R.tuft({ kind: 'wheat', s: 1, seed: k, c: ['#c89a30', '#d4a63a', '#bc8c2c'][k] }), M = []; return { src, M }; }), m4 = new THREE.Matrix4();
for (let gx = -48; gx < 48; gx += .78) for (let gz = -40; gz < 15; gz += .78) { const x = gx + (hash(gx, gz) - .5) * .6, z = gz + (hash(gz, gx, 2) - .5) * .6; if (!field(x, z)) continue; const s = .72 + hash(gx, gz, 3) * .34; wheat[(Math.floor((x * .8 + z) / 2.6) % 3 + 3) % 3].M.push(R.TR(x, 0, z, hash(gx, gz, 4) * 3, 0, 0, [1.25, s, 1.25])); }
for (const w of wheat) { const im = new THREE.InstancedMesh(w.src.geometry, w.src.material, w.M.length); w.M.forEach((m, i) => { im.setMatrixAt(i, m); const v = .8 + hash(i, 7) * .3; im.setColorAt(i, new THREE.Color(v, v * .74, v * .36)); }); im.matrixAutoUpdate = false; im.frustumCulled = false; im.receiveShadow = true; scene.add(im); w.im = im; }

// ---- 家（わらぶき）・井戸・さく・干し草・木 ----
const win = T.window({ curtain: '#f0e4c8' }), winL = T.window({ lit: 1 }), winS = T.window({ shutters: 1, box: 1 }), winSL = T.window({ shutters: 1, box: 1, lit: 1 }), thatch = T.thatch();
const KIND = [
  { w: 7.6, d: 5.4, wall: T.plaster(), roof: thatch, pitch: 1.05, eave: .7, win, winLit: winL, chimney: { x: -2.2 } },
  { w: 6, d: 5.2, wall: T.plaster({ frame: 'cross' }), roof: thatch, pitch: 1.1, eave: .7, ridge: 'z', win: winS, winLit: winSL, door: T.door({ c: '#4a7a6a' }) },
  { w: 6.6, d: 5.6, h2: 2.3, wall: T.stone(), wall2: T.plaster({ frame: 'diag' }), roof: thatch, pitch: 1, eave: .7, win, winLit: winL, chimney: true, door: T.door({ arch: 1 }) },
  { w: 5.2, d: 6.5, h: 3.2, wall: T.boards({ c: '#8a6a4a' }), roof: T.thatch({ c: '#b89a58' }), pitch: 1.15, eave: .6, ridge: 'z', win: false, wins: { f: [], l: [], r: [], b: [] }, door: T.door({ style: 'plank', c: '#6a4a34' }), doorS: 1.35, base: false }];
const fixed = [], smokes = [], put = (o, x, z, ry = 0, y = 0) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
[[.09, 0], [.155, 2], [.215, 1], [.275, 3], [.335, 0], [.4, 2], [.46, 1], [.02, 3]].forEach(([u, k], i) => { const o = KIND[k], [x, z, ry] = side(u, 5 + o.d / 2 + hash(i, 1) * 1.5), h = put(R.house({ ...o, lit: .6, seed: i }), x, z, ry);
  if (o.chimney) { const c = o.chimney === true ? {} : o.chimney; h.updateMatrixWorld(); smokes.push(h.localToWorld(new THREE.Vector3(c.x ?? o.w * .24, h.userData.top + .9, -o.d * .18))); } });
{ const [x, z, ry] = side(.245, 3.6); put(R.well({ roof: thatch }), x, z, ry); const [x2, z2] = side(.25, 4.6); put(R.barrel({ h: .7, r: .3 }), x2, z2); }
for (let i = 0; i < 44; i++) { const u = i / 44; for (const off of [-2.5, 2.5]) { if (hash(i, off) < .16 || (off > 0 && u > .01 && u < .49 && i % 4 !== 1)) continue; const [x, z, , ta] = side(u + .011, off); put(R.fence({ len: LEN / 44 * (1 - off * .012), kind: 'rail', h: 1 }), x, z, ta - Math.PI / 2); } }   // 畑がわは さく、家のがわは ところどころ
const hay = (s, sd) => R.geo().smooth(1).loft(8, [[0, s * 1.05, s * 1.05, 0, .7], [s * .7, s * 1.1, s * 1.1, .5, .95], [s * 1.3, s * .72, s * .72, .9, 1.05], [s * 1.62, s * .2, s * .2, 1.1, 1.12]], { cap: 'top', ur: 3, rot: sd }).mesh(thatch);
[[.12, 5.5], [.3, 6.5], [.31, 8.6], [.43, 5], [.5, 4.4], [.19, 13]].forEach(([u, off], i) => { const [x, z] = side(u, off); put(hay(1 + hash(i, 5) * .5, i * .3), x, z, i); });
for (let i = 0; i < 30; i++) { const a = hash(i, 11) * 6.283, r = 1.25 + hash(i, 12) * 1.1, x = Math.cos(a) * 27 * r + 2, z = Math.sin(a) * 14.5 * r + 9; if (field(x, z) || near(x, z) < 9 || z < -6) continue; put(R.tree({ kind: ['round', 'round', 'tall'][i % 3], h: 5 + hash(i, 13) * 3.5, c: i % 2 ? '#6a9a48' : '#5a8a4a', seed: i }), x, z, i); }
for (let i = 0; i < 60; i++) { const u = hash(i, 21), off = (i % 2 ? 1 : -1) * (1.9 + hash(i, 22) * (i % 2 ? 9 : .6)), [x, z] = side(u, off); if (!field(x, z) && near(x, z) > 1.8) put(R.tuft({ kind: ['grass', 'flower', 'grass', 'bush'][i % 4], s: .55 + hash(i, 23) * .4, seed: i % 3 }), x, z, i); }
{ const [x, z, ry] = side(.36, 3.2); put(R.bench(), x, z, ry); const [x2, z2] = side(.13, 3.4); put(R.crate({ s: .7 }), x2, z2, .4); put(R.barrel(), x2 + .9, z2 + .2); }
scene.add(R.merge(fixed));

// ---- 遠くの丘・雲・夕日 ----
scene.add(R.backdrop({ c: '#8a8a56', haze: '#f8cc90', r: 150, h: 26, y: -3, rep: 3 }), R.backdrop({ c: '#7a6a8a', haze: '#fad2a0', r: 250, h: 52, y: -4, seed: 3 }));
for (let i = 0; i < 7; i++) { const c = R.cloud({ s: 34 + hash(i, 8) * 22, c: '#ffe0b8', shade: '#d89aa0', seed: i }), a = 1.6 + i * .44; c.position.set(Math.cos(a) * 205, 44 + hash(i, 9) * 30, Math.sin(a) * 205); c.lookAt(0, 20, 0); scene.add(c); }
const sunD = new THREE.Mesh(new THREE.CircleGeometry(15, 16), new THREE.MeshBasicMaterial({ color: '#fff6c8', fog: false })); sunD.position.set(SUN.x * 270, 44, SUN.z * 270); sunD.lookAt(0, 10, 0); scene.add(sunD);

// ---- 農夫と荷車（干し草をつむ）、村の人、にわとり代わりの鳥、ねこ ----
const hero = R.person({ face: 4, cloth: 'vest', top: '#a8603a', top2: '#f0e4c8', bottom: '#5a6a4a', boots: true, hat: 'straw', hair: '#6e4628', s: 1.05 }); scene.add(hero);
const cart = R.cart(); { const h = R.geo().smooth(1).loft(8, [[.6, .7, .42, 0, .75], [.88, .76, .47, .4, 1], [1.12, .52, .33, .8, 1.06], [1.25, .18, .12, 1, 1.12]], { cap: 'top', ur: 2 }).mesh(thatch); cart.add(h); } scene.add(cart);
const npc = (o, u, off, turn = 0) => { const p = R.person(o), [x, z, ry] = side(u, off); p.position.set(x, 0, z); p.rotation.y = ry + turn; scene.add(p); return p; };
const wellW = npc({ face: 3, cloth: 'apron', top: '#c2586a', skirt: .8, hair: '#e6c46a', bun: true }, .238, 2.9, 2.6), oldMan = npc({ face: 6, cloth: 'jacket', top: '#8a7a5a', bottom: '#4a4a5a', hair: '#d8d8d8', hat: 'cap', acc: '#6a5a4a' }, .365, 3.5, 0);
const reaper = npc({ face: 2, cloth: 'shirt', top: '#e8dcc0', bottom: '#6a5440', hat: 'straw', skin: '#d8a070' }, .3, -4.6, 0), kid = npc({ face: 5, cloth: 'stripe', top: '#e8704a', shorts: 1, sleeve: 'short', s: .76, head: 1.16 }, 0, 0);
const hens = [[.2, 3.4], [.203, 4.3], [.196, 4], [.21, 3], [.32, 3.6], [.326, 4.4], [.42, 3.2]].map(([u, off], i) => { const b = R.bird({ c: i % 3 === 1 ? '#b8703a' : '#f4ecd8', belly: i % 3 === 1 ? '#d89a5a' : '#ffffff', neck: false, s: 2 }), [x, z] = side(u, off); b.position.set(x, 0, z); b.userData.h = [x, z, i * 2.3]; scene.add(b); return b; });
const cat = R.cat({ c: '#5a5a66', belly: '#e8e4dc' }); { const [x, z, ry] = side(.13, 3.4); cat.position.set(x, .7, z); cat.rotation.y = ry; } scene.add(cat);

const SPEED = 1.45, S0 = .139, cd = new THREE.Vector3(), cp = new THREE.Vector3(), fx = K.fx(scene, 60);
const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
let first = true, sm = 0;
K.loop((dt, t) => {
  const dist = t * SPEED, u = (S0 + dist / LEN) % 1, p = path.getPointAt(u), tg = path.getTangentAt(u), q = path.getPointAt((u - 2.05 / LEN + 1) % 1), J = hero.userData.J;
  hero.position.copy(p); hero.rotation.y = Math.atan2(tg.x, tg.z); R.walk(hero, dist * 3.6, .9); J.torso.rotation.x = .2; for (const n of ['L', 'R']) { J['arm' + n].rotation.set(.62, 0, n === 'L' ? .1 : -.1); J['fore' + n].rotation.x = -.12; }   // 前かがみで、うしろ手に持ち手を引く
  cart.position.set(q.x, Math.abs(Math.sin(dist * 2.1)) * .02, q.z); cart.rotation.set(0, Math.atan2(p.x - q.x, p.z - q.z) - Math.PI / 2, .15 + Math.sin(dist * 3.6) * .012);
  // ななめうしろから追うカメラ（荷車ごしに農夫が見える。たて長では近づく）
  if (first) { cd.copy(tg); first = false; } cd.lerp(tg, 1 - Math.exp(-dt * 1.6)).normalize(); const tall = innerWidth < innerHeight, D = tall ? 5.4 : 6.5, S = tall ? 1 : 2.1;
  cp.set(p.x - cd.x * D + cd.z * S, tall ? 3.1 : 3.4, p.z - cd.z * D - cd.x * S); cam.position.copy(cp); cam.lookAt(p.x + cd.x * 2.4, 1.2, p.z + cd.z * 2.4);
  sun.position.set(p.x + SUN.x * 60, SUN.y * 60, p.z + SUN.z * 60); sun.target.position.copy(p);
  // 風にゆれる麦（束ごとに少しずつおくれて かたむく）
  wheat.forEach((w, k) => { const a = .1 + Math.sin(t * 1.2 - k * 2.1) * .085 + Math.sin(t * 3.1 + k) * .02; w.im.matrix.set(1, a, 0, 0, 0, 1, 0, 0, 0, a * .5, 1, 0, 0, 0, 0, 1); w.im.matrixWorldNeedsUpdate = true; });
  R.idle(wellW, t, Math.sin(t * .5) * .3); R.idle(oldMan, t + 2, Math.sin(t * .35) * .5); R.idle(reaper, t + 1, Math.sin(t * .6) * .4); reaper.userData.J.armR.rotation.x = -1.2 - Math.sin(t * 1.6) * .5; reaper.userData.J.foreR.rotation.x = -.6;
  const ku = (1 - (t * .026 + .52) % 1), kp = path.getPointAt(ku), kt = path.getTangentAt(ku); kid.position.set(kp.x + kt.z * .9, 0, kp.z - kt.x * .9); kid.rotation.y = Math.atan2(-kt.x, -kt.z); R.walk(kid, t * 12, 1.3);
  hens.forEach((b, i) => { const [hx, hz, hr] = b.userData.h, w = Math.sin(t * .4 + hr) > .55; if (w) { b.position.x = hx + Math.sin(t * .4 + hr) * 1.2; b.position.z = hz + Math.cos(t * .31 + hr) * .8; } b.rotation.y = hr + Math.sin(t * .23 + i) * 1.5; R.birdPose(b, w ? 'stand' : 'peck', t + hr * 3); b.position.y = w ? Math.abs(Math.sin(t * 9)) * .03 : 0; });
  R.catPose(cat, 'sit', t);
  if ((sm += dt) > .55) { sm = 0; for (const s of smokes) if (Math.hypot(s.x - p.x, s.z - p.z) < 60) fx.emit('smoke', s.x, s.y, s.z, { size: .5, life: 3.2, vy: .8, vx: .4, grow: 1.5, spread: .12, tint: '#f0d8c0' }); }
  fx.update(dt); crt.render(scene, cam, t);
});
</script>
