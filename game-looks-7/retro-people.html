<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>7 人の体つきの見くらべ（描きこんだテクスチャとブラウン管）</title>
<style>
html,body{margin:0;height:100%;background:#0c0c10;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#d8d0c0;opacity:.85}
#cap a{color:#ffd27a}
.tag{position:fixed;transform:translate(-50%,0);font:700 12px/1.3 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;color:#fff6dc;text-align:center;text-shadow:0 1px 3px #000,0 0 6px #000;white-space:nowrap;pointer-events:none}
.tag small{display:block;font-weight:400;font-size:10px;color:#ffd9a0}
</style>
<div id="cap">7 ─ 人の体つきの見くらべ / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（?raw=1 でブラウン管なし、?set=2 で服ちがい、?only=real,chibi で絞る）</div>
<script src="kit.js"></script>
<script src="retro.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// R.person の体つき（build）を横にならべて見くらべる確認用のページ（一覧には入れない）。
// 同じ顔・同じ服のまま、頭の大きさ・足と胴の長さ・手足の太さだけを変えている。どの人もその場で歩き、ゆっくり回る。?set=2 で服と顔のちがう組になる
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), T = R.tex, q = new URLSearchParams(location.search);
const { scene, cam, renderer, onResize } = K.stage({ fov: 30, far: 400, aa: false, fitAspect: .5, maxFov: 40 });
scene.add(R.skyDome([[0, '#3a5a9a'], [.6, '#8ab4d8'], [1, '#f4e6c8']], { r: 200 })); scene.fog = new THREE.Fog('#dcd6c8', 30, 120);
const { sun } = K.lights(scene, renderer, { sun: 0xfff0d8, power: 2.3, amb: 1.5, pos: [-8, 14, 12], range: 14 });
scene.add(R.ground({ w: 60, d: 40, cell: 2, layers: [T.cobble({ kind: 'slab' }), T.grass()], mix: (x, z) => [z < -5 ? 1 : 0, 0] }).mesh);
const NAMES = { classic: ['いまの形', 'classic'], hero: ['RPG の主人公', 'hero'], real: ['じっさいの人に近い', 'real'], tall: ['すらりと長い', 'tall'], stocky: ['がっしり', 'stocky'], child: ['子ども', 'child'], chibi: ['デフォルメ', 'chibi'], sd: ['ちびキャラ', 'sd'] };
const only = q.get('only') ? q.get('only').split(',') : Object.keys(NAMES), set = +q.get('set') || 1;
const LOOKS = set === 2
  ? [{ face: 3, cloth: 'apron', top: '#4a8a6a', top2: '#f4ead0', skirt: .7, skirtC: '#7a4a5a', hair: '#3a2a22', tail: true }, { face: 5, cloth: 'jacket', top: '#8a5a3a', bottom: '#3a4a5a', hat: 'cap', acc: '#b03a2e', pack: true }]
  : [{ face: 0, cloth: 'tunic', top: '#3f72b0', top2: '#f0e0b8', bottom: '#6a5440', boots: true, cape: '#c2453a', hair: '#6e4628' }, { face: 2, cloth: 'shirt', top: '#e8dcc0', bottom: '#4a5a8a', hair: '#2a2420', hat: 'straw', acc: '#e8c878' }];
const GAP = 1.45, list = only.filter(n => NAMES[n]), wideNow = () => innerWidth >= innerHeight, rows = [], STEP = 1.05, half = Math.ceil(list.length / 2);
// 横長では 2 段のひな壇（うしろの段は 1 m 高い）に 4 人ずつ、たて長では 1 列にならべて横へ流す
list.forEach((n, i) => { const a = R.person({ ...LOOKS[(set - 1) % 2 ? 1 : 0], build: n }); scene.add(a);
  const el = document.createElement('div'); el.className = 'tag'; el.innerHTML = `${NAMES[n][0]}<small>${a.userData.heads.toFixed(1)} 頭身 ・ ${a.userData.height.toFixed(2)} m ・ build: '${n}'</small>`; document.body.appendChild(el);
  rows.push({ a, el, i }); });
const SW = half * GAP / 2 + .6, stepG = R.geo(); stepG.px(0, 0, 64, 64, 64, 64).quad([-SW, 0, -1.5], [SW, 0, -1.5], [SW, STEP, -1.5], [-SW, STEP, -1.5], [0, 0, SW * 2 / 3, STEP / 3]).quad([-SW, STEP, -1.5], [SW, STEP, -1.5], [SW, STEP, -3.4], [-SW, STEP, -3.4], [0, 0, SW * 2 / 3, 1.9 / 3]); const step = stepG.mesh(T.planks()); scene.add(step);   // ひな壇（前の面と上の面）
function place() { const w = wideNow(); step.visible = w; for (const r of rows) { const back = w && r.i >= half, k = w ? (back ? r.i - half : r.i) : r.i, n = w ? (back ? list.length - half : half) : list.length; r.x = (k - (n - 1) / 2) * GAP; r.y = back ? STEP : 0; r.z = back ? -2.4 : 0; r.a.position.set(r.x, r.y, r.z); } }
const crt = R.crt(renderer, q.get('raw') ? { blur: 0, bleed: 0, scan: 0, bloom: 0, curve: 0, vignette: 0, mask: 0, noise: 0, width: 640 } : { noise: 0, width: 360 }); onResize(crt.resize);
const v = new THREE.Vector3();
K.loop((dt, t) => {
  place(); const w = wideNow(), span = (list.length - 1) * GAP;
  if (w) { const vw = half * GAP + .9, d = vw / 2 / Math.tan(cam.fov * Math.PI / 360) / cam.aspect; cam.position.set(0, 2.5, Math.max(8, d)); cam.lookAt(0, 1.3, -1.2); }
  else { const cx = Math.sin(t * .2) * (span / 2); cam.position.set(cx, 1.25, 9.5); cam.lookAt(cx, .78, 0); }          // たて長：2 人分ずつ、横へゆっくり流す
  for (const r of rows) { R.walk(r.a, t * 7); r.a.rotation.y = Math.sin(t * .5 + r.i * .4) * .9 + .2;
    v.set(r.x, r.y - .06, r.z + .25).project(cam); r.el.style.left = (v.x * .5 + .5) * innerWidth + 'px'; r.el.style.top = (-v.y * .5 + .5) * innerHeight + 'px'; r.el.style.display = Math.abs(v.x) < 1.05 ? '' : 'none'; }
  crt.render(scene, cam, t);
});
</script>
</html>
