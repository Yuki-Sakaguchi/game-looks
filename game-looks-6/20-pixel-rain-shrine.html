<title>6-20 雨の森の神社 13 色のドット絵</title>
<style>
html,body{margin:0;height:100%;background:#0e1a1a;overflow:hidden}
canvas{display:block;image-rendering:pixelated}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#d0d8d0;background:#0e1a1a;padding:0 6px}
</style>
<div id="cap">6-20 ─ 雨の森の神社 / 杉林の石段の立体を、緑と灰の 10 色＋鳥居の赤・あかりの黄のドット絵に描き直す　｜　見るだけ（自動でのぼる）</div>
<script src="kit.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// ローポリの杉林と石段をふつうに描いてから、横 240 ドットの粗い絵にして、13 色（緑と灰の 10 色＋鳥居の赤 2 段＋あかりの黄）だけに丸める。
// 遠くの杉は雨のもやの灰色にとけ、その段々は点の並びで混ぜる。雨は たての短いドットの線、灯ろうのまわりは黄色い点でにじませる。
// かさの人をうしろから追い、16 秒で鳥居に着く（始めと終わりは暗くとける）
import * as THREE from 'three';
const K = KIT(THREE), { scene, cam, renderer, onResize } = K.stage({ fov: 56 }), { add, box, hash, glow, flat } = K;
const PAL = ['#0e1a1a', '#1a2e2a', '#2a4438', '#3a5a48', '#527a5a', '#7a9a78', '#4a5258', '#7a848a', '#a8b0b0', '#d0d8d0', '#d8402a', '#8a2a22', '#f8d060'];
scene.background = new THREE.Color('#a8b0b0'); scene.fog = new THREE.Fog('#a8b0b0', 9, 62);
const { sun } = K.lights(scene, renderer, { range: 30, sky: '#d0d8d0', ground: '#3a5a48', amb: 1.7, power: .9, pos: [-12, 40, 4] }); sun.target.position.set(0, 6, 16);
// 石段：1 段の奥行き 1、高さ R。32 段の上は平らな境内。両わきは こけの土手
const R = .4, TOP = 32 * R, stepY = z => { const k = Math.floor(z), f = z - k; return Math.min(TOP, (k + 1) * R + R * Math.min(1, Math.max(0, (f - .7) / .3))); };
const H = (x, z) => { const b = Math.max(0, Math.min(1, (Math.abs(x) - 2.3) * .5)); return Math.min(32, Math.max(-12, z)) * R - .3 + b * (1 + Math.sin(x * .7 + z * .4) * .5 + Math.sin(z * .9) * .3) + (z > 32 ? .25 * (1 - b) : 0); };
const C = K.colors('#3a5a48', '#2a4438', '#7a848a');
const land = K.terrain(H, 50, 50, 1.6, (y, x, z) => z > 32.5 && Math.abs(x) < 6 && z < 48 ? C[2] : C[hash(Math.round(x * .5), Math.round(z * .5)) > .5 ? 0 : 1]); land.follow(0, 22); land.mesh.receiveShadow = true; scene.add(land.mesh);
for (let k = 0; k < 32; k++) box(scene, 4.8, 1, 1, k % 2 ? '#7a848a' : '#868e92', 0, (k + 1) * R - .5, k + .5).receiveShadow = true;
// 杉：高い幹の上に葉の段。石灯ろう：台・柱・あかり・かさ
for (let i = 0; i < 46; i++) { const x = (i % 2 ? 1 : -1) * (5.6 + hash(i, 1) * 20), z = -6 + hash(i, 2) * 60; if (z > 33 && Math.abs(x) < 8) continue; const g = new THREE.Group(), h = 9 + hash(i, 3) * 5; add(g, new THREE.CylinderGeometry(.28, .42, h, 5), '#4a4a44', 0, h / 2, 0); const p = K.pine(h * 1.1, ['#2a4438', '#3a5a48', '#1a2e2a'][i % 3], '#4a4a44'); p.position.y = h * .55; g.add(p); g.position.set(x, H(x, z) - .2, z); K.shadow(g, true, false); scene.add(g); }
const toro = (x, z, y) => { const g = new THREE.Group(); box(g, .7, .3, .7, '#7a848a', 0, .15, 0); box(g, .28, 1, .28, '#7a848a', 0, .8, 0); box(g, .56, .46, .56, glow('#f8d060'), 0, 1.53, 0); box(g, .9, .16, .9, '#4a5258', 0, 1.84, 0); box(g, .5, .16, .5, '#4a5258', 0, 2, 0); g.position.set(x, y, z); K.shadow(g, true, false); scene.add(g); };
for (const z of [3.5, 9.5, 15.5, 21.5, 27.5]) for (const x of [-3, 3]) toro(x, z, H(x, z) + .1); toro(-3.4, 39, TOP); toro(3.4, 39, TOP);
// 赤い鳥居（石段の上）と小さな社（その奥）
{ const g = new THREE.Group(), RED = flat('#d8402a', { fog: false }); for (const x of [-2.7, 2.7]) { add(g, new THREE.CylinderGeometry(.26, .3, 5.6, 8), RED, x, 2.8, 0); box(g, .8, .4, .8, '#4a5258', x, .2, 0); } box(g, 6.4, .36, .3, RED, 0, 4.3, 0); box(g, 7.6, .42, .5, RED, 0, 5.6, 0); box(g, 8, .2, .66, '#1a2e2a', 0, 5.9, 0); box(g, .5, .9, .2, RED, 0, 4.95, 0); g.position.set(0, TOP, 32.6); K.shadow(g); scene.add(g); }
{ const g = K.shadow(K.house(4.6, 2.8, 4.4, '#d0d8d0', '#2a4438', '#f8d060', true)); g.rotation.y = Math.PI; g.position.set(0, TOP + .7, 43); scene.add(g); box(scene, 5.8, .7, 5.6, '#7a848a', 0, TOP + .35, 43).receiveShadow = true; box(scene, 2.4, .35, 1.2, '#7a848a', 0, TOP + .17, 39.9); box(scene, 1.5, 1.5, .1, glow('#f8d060'), 0, TOP + 1.6, 40.75); }
// 主役：赤いかさをさした人
const hero = K.person({ top: '#d0d8d0', bottom: '#4a5258', hat: '#1a2e2a' }); add(hero, new THREE.ConeGeometry(1.05, .42, 8), '#d8402a', .12, 2.3, 0); box(hero, .05, 1.2, .05, '#1a2e2a', .12, 1.7, 0); K.shadow(hero); scene.add(hero);
// 水たまりの輪
const rings = [...Array(12)].map((_, i) => { const m = add(scene, new THREE.RingGeometry(.3, .4, 10).rotateX(-Math.PI / 2), glow('#d0d8d0', { transparent: true, depthWrite: false })); m.userData.p = i / 12; return m; });
const post = K.post(renderer, 'uniform float fade;\n' + K.PALETTE(PAL, .1, `float g=0.;for(int i=0;i<8;i++){float a=float(i)*.785+.39;vec2 d=vec2(cos(a),sin(a))*px;vec3 s=src(uv+d*2.5),s2=src(uv+d*5.);g+=max(min(s.r,s.g)-s.b-.25,0.)+max(min(s2.r,s2.g)-s2.b-.25,0.)*.6;}c+=g*vec3(.5,.4,.12);
float col=h(vec2(q.x,7.)),ry=mod(q.y+time*(80.+col*40.)+h(vec2(q.x,3.))*500.,36.+col*44.);if(ry<3.&&col>.55)c=mix(c,vec3(.82,.85,.82),.5);c*=fade;`), { fade: { value: 1 } }, { width: 240 }); onResize(post.resize);
K.loop((dt, t) => {
  const u = (t % 16) / 16, z = 5 + u * 25.5, x = Math.sin(t * .4) * .5, y = stepY(z); hero.position.set(x, y, z); K.walk(hero, z * Math.PI * 2, .55); hero.userData.P.armR.rotation.x = -1.3;
  rings.forEach((m, i) => { const p = (m.userData.p + t * .9) % 1, n = Math.floor(m.userData.p + t * .9) * 12 + i; if (m.userData.n !== n) { m.userData.n = n; const rz = z - 1 + hash(n, 1) * 9, rx = (hash(n, 2) - .5) * 4.2; m.position.set(rx, Math.min(TOP + .25, (Math.floor(rz) + 1) * R) + .03, rz < 32 ? Math.floor(rz) + .5 : rz); } m.scale.setScalar(.3 + p * 1); m.material.opacity = 1 - p; });
  post.u.fade.value = Math.min(1, u * 16 / .8, (1 - u) * 16 / .8);
  cam.position.set(x * .5 + 1.1, y + 3.3, z - 6.3); cam.lookAt(x * .5, y + 2.6, z + 8);
  post.render(scene, cam, t);
});
</script>
