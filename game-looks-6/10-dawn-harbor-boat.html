<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6-10 漁 夜明けの港を逆光のローポリで</title>
<style>
html,body{margin:0;height:100%;background:#f8a068;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#ffe6c8;background:#4a3a80;padding:0 6px}
</style>
<div id="cap">6-10 ─ 漁 / 夜明けの港を、朝焼けの逆光と水面の光の道で描く　｜　見るだけ（自動で港を出る）</div>
<script src="kit.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 絵の決まり：仕上げの加工は使わない。色は朝焼けのだいだいと紫の 2 つ。太陽を正面に置く逆光で、船と港は紫の暗い形にし、上の面とふちだけにだいだいの光を当てる。
// 水面はゆれるローポリの面で、カメラから太陽へのびる帯の中の三角だけを、こまかく入れかわる金色にぬる（光の道）。差し色は灯台と窓の黄
import * as THREE from 'three';
const K = KIT(THREE), { scene, cam, renderer } = K.stage({ fov: 45 }), { add, box, flat, glow, hash } = K;
scene.background = K.sky([[0, '#4a3a80'], [.16, '#a8588a'], [.27, '#f8885e'], [.33, '#ffc070'], [1, '#ffc070']]); scene.fog = new THREE.Fog('#fbaa6a', 50, 250);
const { sun } = K.lights(scene, renderer, { sky: 0xc4a0cc, ground: 0x3a2a5c, amb: 1.25, sun: 0xffa858, power: 3.4, range: 42 });
add(scene, new THREE.CircleGeometry(30, 24), glow('#ffd890', { fog: false, transparent: true, opacity: .45 }), 0, 8, -382); add(scene, new THREE.CircleGeometry(19, 24), glow('#fff4c0', { fog: false }), 0, 8, -380);
// 水面：毎コマ高さを動かし、三角ごとに色を決める
const W = (x, z, t) => Math.sin(x * .3 + t * 1.2) * .12 + Math.sin(z * .25 - t) * .14 + Math.sin((x + z) * .13 + t * .7) * .1;
const N = 90, CELL = 3, OZ = -75, wg = new THREE.PlaneGeometry(N * CELL, N * CELL, N, N).toNonIndexed(); wg.rotateX(-Math.PI / 2); wg.translate(0, 0, OZ);
const wp = wg.attributes.position.array, col = new Float32Array(wp.length); wg.setAttribute('color', new THREE.BufferAttribute(col, 3));
const sea = new THREE.Mesh(wg, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: .95 })); sea.receiveShadow = true; scene.add(sea);
const WC = K.colors('#54468c', '#7458a0', '#ff9a5e', '#ffe6a0');
function water(t, cx, cz) { const fl = Math.floor(t * 6);
  for (let i = 0; i < wp.length; i += 9) { let hy = 0, mx = 0, mz = 0; for (let k = 0; k < 3; k++) { const x = wp[i + k * 3], z = wp[i + k * 3 + 2], y = W(x, z, t); wp[i + k * 3 + 1] = y; hy += y / 3; mx += x / 3; mz += z / 3; }
    const dx = Math.abs(mx - cx * (mz + 380) / (cz + 380)), w = 4 + (cz - mz) * .045, g = hash(i, fl), c = WC[mz < cz && dx < w && g > .3 + .6 * dx / w ? (g > .8 ? 3 : 2) : hy > .06 ? 1 : 0];
    for (let k = 0; k < 3; k++) { col[i + k * 3] = c.r; col[i + k * 3 + 1] = c.g; col[i + k * 3 + 2] = c.b; } }
  wg.attributes.position.needsUpdate = true; wg.attributes.color.needsUpdate = true; }
// 港：左の岸壁と倉庫、右の防波堤と赤白の灯台、とまっている舟
const STONE = '#9a8294', port = new THREE.Group(); scene.add(port);
box(port, 52, 2, 70, STONE, -35, .2, 27); box(port, 130, 2, 40, STONE, 0, .2, 42); box(port, 4, 2.2, 54, STONE, 15, .3, -4); add(port, new THREE.CylinderGeometry(3.6, 3.9, 2.2, 8), STONE, 15, .3, -31); box(port, 3.4, 2, 14, STONE, -10.7, .2, -14);
for (const [x, z, r] of [[-14.5, -3, 0], [-16, 13, 0], [-30, -1, 1.57]]) { const h = K.house(7, 4.5, 11, '#c88a7c', '#5a3a60', '#ffd870', true); h.position.set(x, 1.2, z); h.rotation.y = r; port.add(h); }
for (let i = 0; i < 9; i++) box(port, .5, .6, .5, '#5a3a60', -9.8, 1.5, -5 + i * 3.2); for (let i = 0; i < 7; i++) box(port, 1.1, 1.1, 1.1, i % 2 ? '#c88a7c' : '#e8a070', -12.5 - (i % 3) * 1.3, 1.75 + (i % 2) * 1.1, 6 + (i % 4) * 1.3).rotation.y = i;
{ const g = new THREE.Group(); g.position.set(15, 1.4, -31); for (let k = 0; k < 5; k++) add(g, new THREE.CylinderGeometry(1.35 - k * .1, 1.45 - k * .1, 1.6, 8), k % 2 ? '#fff4e8' : '#e8503a', 0, .8 + k * 1.6, 0); add(g, new THREE.CylinderGeometry(1.5, 1.5, .25, 8), '#5a3a60', 0, 8.1, 0); add(g, new THREE.CylinderGeometry(.75, .75, 1.2, 8), glow('#fff0a0', { fog: false }), 0, 8.8, 0); add(g, new THREE.ConeGeometry(1.15, 1.1, 8), '#e8503a', 0, 9.95, 0); port.add(g); }
add(port, new THREE.CylinderGeometry(.18, .18, 2.6, 5), '#fff4e8', -10.7, 2.5, -20); add(port, new THREE.BoxGeometry(.5, .5, .5), glow('#fff0a0'), -10.7, 4, -20); K.shadow(port);
const moored = [[-7.3, -3, '#e8503a', 1], [-7.3, 4, '#fff4e8', 0], [-7.3, 11, '#4a7ab0', 0], [11.3, 2, '#fff4e8', 1], [11.3, -10, '#e8a040', 0]].map(([x, z, c, sail], i) => { const b = K.shadow(K.boat(c, sail ? '#fff4e8' : null)); b.position.set(x, 0, z); b.rotation.y = Math.PI + (i % 2 - .5) * .2; scene.add(b); return b; });
for (const [x, z, s] of [[-150, -210, 1], [-95, -230, .6], [170, -200, .9], [120, -240, .5]]) { const m = add(scene, new THREE.DodecahedronGeometry(40 * s, 0), '#5a4080', x, 0, z); m.scale.set(2.2, .5, 1); }
// 漁船（前は +z なので、うしろ向きに回して −z へ進める）と、かもめ
const ship = K.boat('#fff4e8', null); box(ship, 1.52, .16, 3.5, '#3a6a9a', 0, .52, -.1); box(ship, .95, .9, 1.1, '#fff4e8', 0, 1, -.7); box(ship, 1.15, .14, 1.35, '#e8503a', 0, 1.5, -.7); box(ship, .7, .3, .06, glow('#ffe89a'), 0, 1.1, -.14);
add(ship, new THREE.CylinderGeometry(.05, .05, 2.2, 5), '#5a3a60', 0, 1.7, .5); add(ship, new THREE.BoxGeometry(.22, .22, .22), glow('#fff0a0'), 0, 2.85, .5); box(ship, .6, .4, .6, '#e8a040', 0, .75, 1); K.shadow(ship); ship.scale.setScalar(1.5); scene.add(ship);
const gulls = [...Array(7)].map((_, i) => { const g = new THREE.Group(), m = glow('#46305c'); box(g, .22, .18, .7, m, 0, 0, 0); g.userData.w = [-1, 1].map(s => { const w = box(g, 1.15, .06, .4, m, 0, 0, 0); w.geometry.translate(s * .58, 0, 0); return w; }); scene.add(g); return g; });
const fx = K.fx(scene, 100), T = 16, sm = v => v * v * (3 - 2 * v); let wT = 0, kT = 0;
K.loop((dt, t) => {
  const tt = t % T, bz = 13 - tt * 3.3, bx = -3 + 5 * sm(tt / T), by = W(bx, bz, t);
  ship.position.set(bx, by + .05, bz); ship.rotation.set(Math.sin(t * 1.7) * .04, Math.PI - Math.sin(tt / T * 3.14) * .14, Math.sin(t * 1.3) * .05);
  moored.forEach((b, i) => { b.position.y = W(b.position.x, b.position.z, t) * .8; b.rotation.z = Math.sin(t * 1.1 + i * 2) * .06; });
  gulls.forEach((g, i) => { const a = t * (.35 + i * .04) + i * 2.4, r = 7 + i * 2.2; g.position.set(bx + 4 + Math.cos(a) * r, 6.5 + (i % 4) * 1.6 + Math.sin(t + i) * .6, bz - 20 + Math.sin(a) * r); g.rotation.y = -a; g.userData.w.forEach((w, k) => { w.rotation.z = (k ? 1 : -1) * Math.sin(t * 7 + i) * .55; }); });
  cam.position.set(bx + 3.5, 5.2, bz + 13); cam.lookAt(bx * .3, 2.2, bz - 14); water(t, cam.position.x, cam.position.z);
  if ((wT -= dt) < 0) { wT = .09; fx.emit('splash', bx + (Math.random() - .5) * 1.4, .25, bz + 3, { vy: 1, vz: 1.2, spread: .7, grav: -3, life: .6, size: .55, grow: 1, tint: '#ffe0c8' }); }
  if ((kT -= dt) < 0) { kT = .05; const z = bz - 6 - Math.random() * 90; fx.emit('spark', cam.position.x * (z + 380) / (cam.position.z + 380) + (Math.random() - .5) * 9, .4, z, { life: .5, size: .7 + (bz - z) * .025, add: true, fog: false }); }
  fx.update(dt); sun.target.position.set(bx, 0, bz); sun.position.set(bx - 8, 11, bz - 55);
  renderer.domElement.style.opacity = Math.min(1, tt / .6, (T - tt) / .6);   // 一巡のつなぎ目は朝焼けの色へとかす
  renderer.render(scene, cam);
});
</script>
</html>
