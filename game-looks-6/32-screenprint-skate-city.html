<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6-32 坂の街のスケート シルクスクリーン</title>
<style>
html,body{margin:0;height:100%;background:#f6f1e6;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#1c2a5c;background:#f6f1e6;padding:0 6px}
</style>
<div id="cap">6-32 ─ 坂の街のスケート / 立体の街を、3 段のべたと朱の版のシルクスクリーンで刷る　｜　見るだけ（自動で坂を下る）</div>
<script src="kit.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// シルクスクリーンの決まり：ローポリの海辺の坂道をふつうに描いてから、仕上げで明るさを 3 段に分け、明るい所は紙の白のまま、
// 中くらいは水色の版、暗い所はこい紺の版をべたで刷る。赤い物だけは朱の版にする。版は 2〜3 ドットずつずらして重ね、
// ふちに紙の白や重なりがのぞく。インクのふちはくっきり、輪郭線は引かない。影は 1 段暗い色に落ちる
import * as THREE from 'three';
const K = KIT(THREE), { scene, cam, renderer, onResize } = K.stage({ fov: 44, fitAspect: .75, far: 900 }), { add, box, hash } = K;
const WHITE = '#f0ece4', MID = '#7898a8', NAVY = '#22305a', RED = '#f03a20', SEA = -29;
scene.background = K.sky([[0, '#7fb2d2'], [.36, '#7fb2d2'], [.365, '#ffffff'], [1, '#ffffff']]); scene.fog = new THREE.Fog('#ffffff', 90, 380);
const { sun } = K.lights(scene, renderer, { range: 34, amb: 1.5, power: 2.2 });
const road = x => Math.sin(x * .05) * 6, RY = x => -x * .16 - Math.max(0, x - 172) * .6;
const H = (x, z) => { const d = z - road(x); return Math.max(SEA - 2, RY(x) + (d < -9 ? Math.min(16, (-d - 9) * .4) : d > 9 ? -(d - 9) * .9 : 0)); };
const C = K.colors(MID, '#6a8c9e');
const land = K.terrain(H, 120, 120, 2.5, (y, x, z) => C[hash(Math.round(x * .12), Math.round(z * .12)) > .5 ? 0 : 1]); land.mesh.receiveShadow = true; scene.add(land.mesh);
// 道とふち石は、道の曲がりにそった帯で作る（d0〜d1 は道の中心からの横の位置）
const strip = (d0, d1, col, x0 = -40, x1 = 240, up = .08) => { const v = [], ix = []; let i = 0; for (let x = x0; x <= x1 + .01; x += 2, i++) { v.push(x, RY(x) + up, road(x) + d0, x, RY(x) + up, road(x) + d1); if (i) ix.push(i * 2 - 2, i * 2 - 1, i * 2, i * 2, i * 2 - 1, i * 2 + 1); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3)); g.setIndex(ix); g.computeVertexNormals(); add(scene, g, K.flat(col)).receiveShadow = true; };
strip(-4.4, 4.4, WHITE); strip(-5.6, -4.4, '#c8d0d4', -40, 240, .2); strip(4.4, 5.6, '#c8d0d4', -40, 240, .2); for (let x = -30; x < 230; x += 9) strip(-.2, .2, MID, x, x + 4, .12);
// 海：水色のべたに、紺と白の短い波の線
{ const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); g.fillStyle = '#5a94bc'; g.fillRect(0, 0, 128, 128); for (let i = 0; i < 44; i++) { g.fillStyle = i % 3 ? '#16224e' : '#ffffff'; g.fillRect(hash(i, 1) * 128, hash(i, 2) * 128, 8 + hash(i, 3) * 22, 2); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(30, 30); t.colorSpace = THREE.SRGBColorSpace; const m = add(scene, new THREE.PlaneGeometry(1800, 1800), K.glow('#ffffff', { map: t }), 100, SEA, 0); m.rotation.x = -Math.PI / 2; m.rotation.z = Math.PI / 2; }
// ヤシの木：少し曲がった幹と、たれた葉 8 枚
function palm(h) { const g = new THREE.Group(); let px = 0; for (let k = 0; k < 4; k++) { add(g, new THREE.CylinderGeometry(.2, .27, h / 4 + .15, 6), NAVY, px, h / 8 + k * h / 4, 0).rotation.z = -.14; px += h * .035; }
  for (let k = 0; k < 8; k++) { const l = new THREE.Group(); l.position.set(px, h, 0); l.rotation.order = 'YXZ'; l.rotation.set(.28 + (k % 2) * .25, k * .785 + .3, 0); box(l, .95, .1, 2.3, '#2a4a5a', 0, 0, 1.15); box(l, .7, .1, 1.9, '#2a4a5a', 0, -.58, 2.95).rotation.x = .66; g.add(l); } return K.shadow(g, true, false); }
for (let i = 0; i < 34; i++) { const x = -20 + i * 8 + hash(i, 4) * 3, s = i % 2 ? 1 : -1, p = palm(6.5 + hash(i, 5) * 3); p.position.set(x, RY(x), road(x) + s * 6.6); p.rotation.y = hash(i, 6) * 6; scene.add(p); }
// 山側の白い家（屋根は朱）、海側の白い柵、沖の小舟、朱の太陽
for (let i = 0; i < 16; i++) { const x = -10 + i * 15 + hash(i, 7) * 5, z = road(x) - 12 - hash(i, 8) * 12, hs = K.shadow(K.house(5.5, 3.6 + (i % 3) * 1.6, 6.5, '#f4f0e8', RED, NAVY)); hs.position.set(x, H(x, z) - .4, z); hs.rotation.y = (hash(i, 9) - .5) * .6; scene.add(hs); }
for (let x = -20; x < 230; x += 4) box(scene, .3, 1.1, .3, '#f4f0e8', x, RY(x) + .55, road(x) + 8.2).castShadow = true;
for (let i = 0; i < 5; i++) { const b = K.boat(i % 2 ? RED : '#f4f0e8', '#f4f0e8'); b.scale.setScalar(4); b.position.set(120 + i * 60, SEA, 50 + hash(i, 10) * 120); b.rotation.y = 1 + i; scene.add(b); }
const disc = add(scene, new THREE.CircleGeometry(34, 40), K.glow(RED, { fog: false })); disc.rotation.y = -Math.PI / 2; disc.userData.noEdge = true;
// 主役：板に横向きに乗った子（朱の服と帽子）。前は +z
const hero = new THREE.Group(), kid = K.person({ top: RED, hat: RED, bottom: NAVY, skin: '#a8a098' }), P = kid.userData.P; hero.rotation.order = 'YXZ';
box(hero, .56, .08, 2.2, RED, 0, .2, 0); for (const z of [-.6, .6]) box(hero, .56, .16, .2, '#f4f0e8', 0, .09, z); kid.position.y = .1; kid.rotation.y = 1.3; hero.add(kid); scene.add(K.shadow(hero, true, false));
const clouds = [...Array(7)].map((_, i) => { const c = K.cloud(3 + hash(i, 11) * 2); scene.add(c); return c; });
const post = K.post(renderer, `float redA(vec3 c){return smoothstep(.24,.3,c.r-max(c.g,c.b));}
void main(){vec2 o1=vec2(2.5,-1.5)/res,o2=vec2(-2.,2.5)/res;vec3 a=src(vUv),b=src(vUv+o1),r=src(vUv+o2);
float kb=smoothstep(.745,.725,luma(a))*(1.-redA(a));       // 水色の版：中くらいから暗い所
float kn=smoothstep(.43,.41,luma(b))*(1.-redA(b));          // 紺の版：暗い所（少しずらす）
float kr=redA(r);                                             // 朱の版：赤い物（逆へずらす）
vec3 c=vec3(.965,.945,.9);c*=mix(vec3(1.),vec3(.47,.76,.9),kb);c*=mix(vec3(1.),vec3(.2,.22,.42),kn);c*=mix(vec3(1.),vec3(.98,.3,.16),kr);
gl_FragColor=vec4(c,1.);}`); onResize(post.resize);
K.loop((dt, t) => {
  const x = 4 + (t % 15) * 10, z = road(x), y = RY(x), sl = Math.cos(x * .05) * .3, sw = Math.sin(t * 2.2);
  hero.position.set(x, y + .08, z); hero.rotation.set(.16, Math.atan2(1, sl), -sl * .5 + sw * .05);
  P.legL.rotation.z = -.36; P.legR.rotation.z = .36; P.armL.rotation.x = 1.25 + sw * .25; P.armR.rotation.x = -1.1 + sw * .25; P.body.rotation.z = sw * .06; kid.rotation.y = 1.3 + sw * .08;
  clouds.forEach((c, i) => c.position.set(x + 260 + hash(i, 12) * 200, y + 30 + hash(i, 13) * 110, z - 260 + i * 80));
  land.follow(x + 60, z); sun.position.set(x - 30, y + 30, z - 14); sun.target.position.set(x, y, z); disc.position.set(x + 600, y - 18, z + 190);
  const cx = x - 6.8; cam.position.set(cx, RY(cx) + 2.5, road(cx) * .5 + z * .5 + .6); cam.lookAt(x + 9, RY(x + 9) + 1.5, road(x + 9));
  post.render(scene, cam, t);
});
</script>
</html>
