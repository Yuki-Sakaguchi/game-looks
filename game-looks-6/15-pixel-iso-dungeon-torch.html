<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6-15 ダンジョン 等角のドット絵とたいまつの光</title>
<style>
html,body{margin:0;height:100%;background:#120e24;overflow:hidden}
canvas{display:block;image-rendering:pixelated}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#fde9a0;background:#120e24;padding:0 6px}
</style>
<div id="cap">6-15 ─ ダンジョン / 等角の石の部屋を 12 色のドット絵で。たいまつのまわりだけ暖かい色　｜　見るだけ（自動で歩く）</div>
<script src="kit.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 石のダンジョンを、遠近のない斜め見下ろし（等角）で横 240 ドットに粗く描き、12 色のいちばん近い色に丸める。
// 光は冒険者のたいまつ（点の光と影）だけが暖かく、近くは黄〜だいだい、はなれるほど赤茶 → 青紫の暗がりへ、色の段と点の並びで落ちていく
import * as THREE from 'three';
const K = KIT(THREE), { scene, renderer, onResize } = K.stage(), { add, box, hash, flat, glow } = K;
const PAL = ['#120e24', '#231c44', '#3a2f6b', '#5a4a92', '#8a7ab8', '#6b2a3a', '#a8482c', '#dc7a2c', '#f4b548', '#fde9a0', '#3f8f7a', '#f6f2e6'];
scene.background = new THREE.Color(PAL[0]);
// 等角のカメラ：画面の形に合わせて見える広さを決める（たて長でも横に 13 ぶんは見える）
const oc = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 160);
onResize((w, h) => { const a = w / h, V = Math.max(7.6, 6.5 / a); Object.assign(oc, { left: -V * a, right: V * a, top: V, bottom: -V }); oc.updateProjectionMatrix(); });
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
scene.add(new THREE.HemisphereLight('#5a5ae0', '#2a2058', 1.5));
// 地図：. が床、# が岩。カメラは +x +z のがわから見るので、床の手前にくる岩は低くして中が見えるようにする
const M = ['################', '#......###.....#', '#......###.....#', '#..............#', '#......###.....#', '#......###.....#', '###.######.#####', '###.######.#####', '###........#####', '################'], S = 2;
const fl = (i, j) => !!M[j] && M[j][i] === '.', dm = new THREE.Object3D();
const inst = (geo, mat, list) => { const m = new THREE.InstancedMesh(geo, mat, list.length); list.forEach(([i, j, y, c], k) => { dm.position.set(i * S, y, j * S); dm.updateMatrix(); m.setMatrixAt(k, dm.matrix); if (c) m.setColorAt(k, c); }); m.castShadow = m.receiveShadow = true; scene.add(m); return m; };
const cells = [...Array(M.length * 16)].map((_, k) => [k % 16, Math.floor(k / 16)]), FC = K.colors('#c8c0d4', '#b0a8c4');
inst(new THREE.BoxGeometry(S * .95, .3, S * .95), flat('#ffffff'), cells.filter(([i, j]) => fl(i, j)).map(([i, j]) => [i, j, -.15, FC[(i + j) % 2]])).castShadow = false;
const low = ([i, j]) => fl(i - 1, j) || fl(i, j - 1) || fl(i - 1, j - 1), rock = cells.filter(([i, j]) => !fl(i, j));
inst(new THREE.BoxGeometry(S, 3.2, S), flat('#6e648e'), rock.filter(c => !low(c)).map(([i, j]) => [i, j, 1.2]));
inst(new THREE.BoxGeometry(S, .9, S), flat('#6e648e'), rock.filter(low).map(([i, j]) => [i, j, .15]));
// 柱、宝箱、扉、骨、つぼ
const put = (g, i, j, ry = 0) => { g.position.set(i * S, 0, j * S); g.rotation.y = ry; K.shadow(g); scene.add(g); return g; };
for (const [i, j] of [[5, 2], [5, 4], [12, 2], [12, 4]]) { const g = new THREE.Group(); box(g, 1.3, .4, 1.3, '#c8c0d4', 0, .2, 0); add(g, new THREE.CylinderGeometry(.46, .46, 2.4, 8), '#c8c0d4', 0, 1.6, 0); box(g, 1.2, .4, 1.2, '#c8c0d4', 0, 3, 0); put(g, i, j); }
const chest = (i, j, ry) => { const g = new THREE.Group(); box(g, 1.3, .7, .9, '#3f8f7a', 0, .35, 0); box(g, 1.36, .4, .96, '#3f8f7a', 0, .9, 0); box(g, 1.4, .14, 1, '#f4b548', 0, .7, 0); box(g, .24, .3, .1, '#fde9a0', 0, .7, .5); return put(g, i, j, ry); };
const ch = chest(1.2, 1.2, .6); chest(14, 1.3, -.5);
{ const g = new THREE.Group(); for (const z of [-.9, .9]) box(g, .36, 3.2, .36, '#c8c0d4', 0, 1.6, z); const d = box(g, .16, 2.7, 1.5, '#3f8f7a', -.7, 1.35, .82); d.rotation.y = 1.25; box(g, .2, .2, 1.52, '#f4b548', -.7, 2, .82).rotation.y = 1.25; put(g, 8, 3); }
const bones = (i, j, ry) => { const g = new THREE.Group(); box(g, .42, .4, .44, '#f6f2e6', 0, .2, 0); box(g, .3, .12, .1, '#231c44', 0, .24, .23); for (const [x, z, r] of [[.7, .2, .5], [.5, -.5, 2], [-.6, .4, 1.2], [-.4, -.5, 2.6]]) box(g, .8, .12, .14, '#f6f2e6', x, .06, z).rotation.y = r; put(g, i, j, ry); };
bones(13.2, 4.8, .8); bones(2, 4.6, 2.4); bones(6, 8, 1);
for (const [i, j] of [[6, 1], [6.5, 5], [10.2, 1], [14, 5]]) { const g = new THREE.Group(); add(g, new THREE.CylinderGeometry(.3, .42, .8, 7), '#a8482c', 0, .4, 0); add(g, new THREE.CylinderGeometry(.22, .3, .2, 7), '#a8482c', 0, .9, 0); put(g, i, j); }
// 冒険者：右手を前に出して、たいまつを立てて持つ。光は炎の位置にある点の光（影つき）
const hero = K.person({ s: 1.6, top: '#f6f2e6', bottom: '#5a4a92', hat: '#a8482c' }), HP = hero.userData.P; scene.add(hero);
box(HP.body, .8, .9, .3, '#3f8f7a', 0, .5, -.4).castShadow = true;
const stick = box(HP.armR, .13, .13, 1.5, '#a8482c', 0, -.95, .75), tip = new THREE.Object3D(); tip.position.set(0, -.95, 1.6); HP.armR.add(tip); HP.armR.traverse(m => m.castShadow = false);
const lamp = new THREE.PointLight('#ffb060', 62, 0, 1.25); lamp.castShadow = true; lamp.shadow.mapSize.set(512, 512); lamp.shadow.camera.near = .3; lamp.shadow.camera.far = 40; lamp.shadow.bias = -.004; lamp.shadow.normalBias = .06; scene.add(lamp);
const fx = K.fx(scene, 60); let fT = 0, sT = 1;
const post = K.post(renderer, K.PALETTE(PAL, .06), {}, { width: 240 }); onResize(post.resize);
// 道順：部屋 → 通路 → となりの部屋 → 下の通路 → 帰ってくる（ひとまわり 15 秒）
const W = [[3, 8], [3, 3], [10, 3], [10, 8], [3, 8]], at = s => { s = ((s % 48) + 48) % 48; for (let k = 0; k < 4; k++) { const [a, b] = W[k], [c, d] = W[k + 1], len = (Math.abs(c - a) + Math.abs(d - b)) * S; if (s <= len) return [(a + (c - a) * s / len) * S, (b + (d - b) * s / len) * S]; s -= len; } return [6, 16]; };
const tp = new THREE.Vector3(); let ang = Math.PI;
K.loop((dt, t) => {
  const s = 5 + t * 3.2, [x, z] = at(s), [x2, z2] = at(s + .6), want = Math.atan2(x2 - x, z2 - z);
  ang += Math.atan2(Math.sin(want - ang), Math.cos(want - ang)) * Math.min(1, dt * 9); hero.position.set(x, 0, z); hero.rotation.y = ang; K.walk(hero, t * 7, .6); HP.armR.rotation.x = -1.5 + Math.sin(t * 7) * .05; hero.updateMatrixWorld();
  tip.getWorldPosition(tp); lamp.position.set(tp.x, tp.y + 1, tp.z); lamp.intensity = 62 * (.9 + .1 * Math.sin(t * 17) * Math.sin(t * 7.3));
  if ((fT -= dt) < 0) { fT = .06; fx.emit('flame', tp.x, tp.y + .35, tp.z, { vy: 1.7, spread: .3, life: .4, size: 1.05 }); }
  if ((sT -= dt) < 0) { sT = .5; const c = hash(Math.floor(t * 2), 3) < .5 ? ch.position : { x: 28, z: 2.6 }; fx.emit('spark', c.x + (Math.random() - .5), 1.5 + Math.random() * .6, c.z + (Math.random() - .5), { life: .6, size: .7 }); } fx.update(dt);
  oc.position.set(x + 24, 31, z + 24); oc.lookAt(x, 1.3, z);
  post.render(scene, oc, t);
});
</script>
</html>
