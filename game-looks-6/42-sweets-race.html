{ const r = add(scene, new THREE.RingGeometry(RR - 3, RR + 3, 64), gloss(CREAM, .35), 0, .03, 0); r.rotation.x = -Math.PI / 2; r.receiveShadow = true;

{ const n = 36, cr = new THREE.InstancedMesh(new THREE.SphereGeometry(1.5, 12, 8), gloss('#ffffff', .22), n * 2), o = new THREE.Object3D(); for (let i = 0; i < n; i++) { const a = i / n * 6.283; o.position.copy(at(a, 18.8, .5)); o.scale.set(1, .75, 1); o.updateMatrix(); cr.setMatrixAt(i * 2, o.matrix); o.position.y = 1.5; o.scale.setScalar(.55); o.updateMatrix(); cr.setMatrixAt(i * 2 + 1, o.matrix);

for (const r of [RR - 3.4, RR + 3.4]) S(add(scene, new THREE.CylinderGeometry(.28, .28, 5.4, 8), gloss(CHOCO, .35), ...at(4.2, r, 2.7).toArray())); { const g = S(box(scene, 7.6, 1.3, .4, flat(BISC), ...at(4.2, RR, 5.2).toArray())); g.rotation.y = -4.2 + Math.PI / 2; for (let k = 0; k < 8; k++) box(g, .95, 1.32, .42, k % 2 ? PINK : CREAM, -3.33 + k * .95, 0, 0); }
