<title>6-36 サファリ 折り紙の箱庭</title>
<style>
html,body{margin:0;height:100%;background:#f6ecd6;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#3a4a5a;background:#f6ecd6;padding:0 6px}
</style>
<div id="cap">6-36 ─ サファリ / 折り紙の動物と草原を、べた色の紙と折り目の明暗で見せる　｜　見るだけ（自動でジープが走る）</div>
<script src="kit.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 折り紙の決まり：動物は「背中の折り目から左右に開いた 1 枚の紙」。横から見た形を少ない多角形で書き、背中（開き 0）から足（開き 1）へ広げる。
// 色は紙 6 色のべた（白＝紙の裏・青・だいだい・こん・茶・赤）と草の 2 色だけ。もようは付けず、面ごとの明暗とやわらかい影だけで形を見せる
import * as THREE from 'three';
const K = KIT(THREE), { scene, cam, renderer, onResize } = K.stage({ fov: 36, maxFov: 52 }), { add, box, hash } = K, BG = '#f6ecd6';
scene.background = new THREE.Color(BG); scene.fog = new THREE.Fog(BG, 40, 105);
const { sun } = K.lights(scene, renderer, { range: 26, amb: 1.3, power: 2.3, ground: 0xe0cca0 }); sun.shadow.radius = 5;
const COL = K.colors('#fbf6ea', '#6a94c8', '#f2a03a', '#3a4a5a', '#c8642a', '#e8503a'), [WHITE, BLUE, ORANGE, NAVY, BROWN, RED] = ['#fbf6ea', '#6a94c8', '#f2a03a', '#3a4a5a', '#c8642a', '#e8503a'], GREEN = '#4a9a68';
const paper = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, side: THREE.DoubleSide, roughness: 1 });
// 折る：polys = [色の番号, x, y, 開き, x, y, 開き, …]。左右に写して 1 つの形にする。w は開き 1 のときの半分の幅
function fold(polys, w) { const p = [], c = []; for (const [ci, ...v] of polys) for (const sg of [1, -1]) for (let k = 1; k < v.length / 3 - 1; k++) for (const j of [0, k, k + 1]) { p.push(v[j * 3], v[j * 3 + 1], v[j * 3 + 2] * w * sg); c.push(COL[ci].r, COL[ci].g, COL[ci].b); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(c, 3)); g.computeVertexNormals(); const m = new THREE.Mesh(g, paper); m.castShadow = true; return m; }
const KINDS = [
  () => fold([[1, -1.5, 2.3, 0, 1, 2.6, 0, 1.2, 1.1, 1, -1.4, 1.1, 1], [1, 1.2, 1.1, 1, .5, 1.1, 1, .55, 0, .9, 1.1, 0, .9], [1, -.7, 1.1, 1, -1.4, 1.1, 1, -1.35, 0, .9, -.8, 0, .9],      // ぞう：胴・あし
    [1, 1, 2.6, 0, 2.1, 2.3, 0, 2, 1.4, .45, 1.2, 1.1, 1], [1, 2.1, 2.3, 0, 2.6, 1, 0, 2, 1.4, .45], [1, 2.6, 1, 0, 2.8, .35, 0, 2.25, 1.15, .3],                                       // 頭・鼻
    [0, 1.1, 2.5, .25, 1.6, 1.3, 1.6, .3, 1.6, 1.5], [0, 2, 1.4, .5, 2.55, 1.1, .6, 2.05, 1.15, .5], [1, -1.5, 2.3, 0, -1.9, 1.3, 0, -1.45, 1.8, .3]], .9),                               // 耳ときば（紙の裏の白）・しっぽ
  () => fold([[2, -1, 2.6, 0, .8, 2.9, 0, .9, 1.9, 1, -.9, 1.8, 1], [0, .9, 1.9, 1, .45, 1.9, 1, .55, 0, .8, .85, 0, .8], [0, -.5, 1.8, 1, -.9, 1.8, 1, -.85, 0, .8, -.55, 0, .8],       // きりん：胴・あし（白）
    [2, .3, 2.85, 0, .9, 2.2, .8, 1.9, 4.9, .35, 1.5, 5.2, 0], [2, 1.5, 5.2, 0, 2.6, 4.95, 0, 2.55, 4.7, .2, 1.9, 4.9, .35],                                                              // 首・頭
    [4, .1, 2.9, 0, 1.5, 5.25, 0, 1.2, 5.35, 0, -.1, 3.2, 0], [4, 1.6, 5.2, .12, 1.7, 5.7, .16, 1.9, 5.15, .12], [4, -1, 2.6, 0, -1.3, 1.5, 0, -1, 2, .2]], .55),                          // たてがみ・つの・しっぽ
  () => fold([...[0, 1, 2, 3, 4].map(k => [k % 2 ? 3 : 0, -1.1 + k * .44, 2.2, 0, -.66 + k * .44, 2.2, 0, -.56 + k * .44, 1.15, 1, -1 + k * .44, 1.15, 1]),                                // しまうま：胴は白とこんの帯
    [0, 1.2, 1.15, 1, .85, 1.15, 1, .9, 0, .8, 1.15, 0, .8], [0, -.65, 1.15, 1, -1, 1.15, 1, -.95, 0, .8, -.7, 0, .8], [0, .6, 2.2, 0, 1.2, 1.5, .9, 1.9, 2.9, .3, 1.5, 3.2, 0],
    [3, 1.5, 3.2, 0, 1.9, 2.9, .3, 2.5, 2.5, .15, 2.5, 2.75, 0], [3, .6, 2.25, 0, 1.5, 3.25, 0, 1.3, 3.45, 0, .45, 2.55, 0], [3, -1.1, 2.2, 0, -1.4, 1.3, 0, -1.05, 1.7, .2]], .55),
  () => fold([[2, -1.2, 1.9, 0, .7, 2, 0, .8, 1, 1, -1.1, 1, 1], [2, .8, 1, 1, .4, 1, 1, .45, 0, .85, .8, 0, .85], [2, -.7, 1, 1, -1.1, 1, 1, -1.05, 0, .85, -.7, 0, .85],                 // ライオン：胴・あし
    [4, .5, 2.5, 0, 1.5, 2.6, 0, 1.7, 1.2, 1.2, .5, .9, 1.3], [2, 1.5, 2.6, 0, 2.2, 2, 0, 2.1, 1.5, .4, 1.7, 1.2, 1.2],                                                                    // たてがみ（茶）・顔
    [2, -1.2, 1.9, 0, -2, 2.3, 0, -1.9, 2.1, .12], [4, -2, 2.3, 0, -2.3, 2.75, 0, -2.2, 2.2, .2]], .6)];
// 草原：大きな三角に折った 1 枚の紙。道のまわりだけ平ら
const H = (x, z) => Math.min(1, Math.max(0, (Math.abs(z) - 3) / 9)) * (Math.abs(((x * .04 + z * .07) % 2 + 2) % 2 - 1) * 1.8 + Math.abs(((x * .023 - z * .05) % 2 + 2) % 2 - 1) * 1.4);
const GC = K.colors('#bcd472', '#aecb64', '#f0d898');
const land = K.terrain(H, 56, 30, 3, (y, x, z) => Math.abs(z) < 3 ? GC[2] : GC[hash(Math.round(x * .11), Math.round(z * .11)) > .5 ? 0 : 1]); land.mesh.receiveShadow = true; scene.add(land.mesh);
// 置く物：木（アカシアふうの平たい三角すい）・しげみ・山・動物。x は 140 ごとにくり返す
const P = 140, things = [], put = (g, x, z, o = {}) => { g.userData = { x, z, v: 0, ...o }; scene.add(g); things.push(g); return g; };
const acacia = s => { const g = new THREE.Group(); add(g, new THREE.ConeGeometry(.45 * s, 3.2 * s, 3), BROWN, 0, 1.6 * s, 0).castShadow = true; for (const [r, y, x] of [[2.6, 3.5, 0], [1.6, 4.1, .8]]) { const m = add(g, new THREE.ConeGeometry(r * s, .9 * s, 4), GREEN, x * s, y * s, 0); m.rotation.y = r; m.castShadow = true; } return g; };
for (let i = 0; i < 26; i++) { const z = i % 5 === 4 ? 5 + hash(i, 2) * 4 : -7 - hash(i, 2) * 30, x = i * P / 26 + hash(i, 1) * 3; if (i % 3 && z < 0) put(acacia(.9 + hash(i, 3) * .7), x, z); else { const b = new THREE.Group(), m = add(b, new THREE.ConeGeometry(1.1, 1.3, 4), GREEN, 0, .65, 0); m.castShadow = true; m.rotation.y = i; put(b, x, z > 0 ? z : z * .5 - 2); } }
for (let i = 0; i < 5; i++) { const g = new THREE.Group(), s = 9 + hash(i, 4) * 6; add(g, new THREE.ConeGeometry(s * 1.3, s, 4), BLUE, 0, s * .5, 0).rotation.y = .5 + i; add(g, new THREE.ConeGeometry(s * .46, s * .35, 4), WHITE, 0, s * .84, 0).rotation.y = .5 + i; put(g, i * P / 5 + 12, -46 - hash(i, 5) * 14); }
[[0, 29, -8, 1.5, 1], [1, 20, -12, 1.35, 1], [2, 36, -5.5, 1.25, -1], [3, 15, -6, 1.3, 1], [2, 52, -9, 1.25, 1], [1, 62, -7, 1.35, -1], [0, 74, -10, 1.5, -1], [3, 92, -6, 1.3, 1], [2, 110, -8, 1.25, 1], [1, 124, -12, 1.35, 1]]
  .forEach(([k, x, z, s, dir], i) => { const g = new THREE.Group(), m = KINDS[k](); m.scale.setScalar(s); g.add(m); g.rotation.y = dir > 0 ? 0 : Math.PI; put(g, x, z, { v: dir * (.9 + (i % 3) * .3), animal: m, ph: i * 1.7 }); });
// ジープ（赤い紙の箱）。前は +x
const jeep = new THREE.Group(), jb = new THREE.Group(); jeep.add(jb); jeep.scale.setScalar(1.25);
box(jb, 3.6, .8, 1.9, RED, 0, 1, 0); box(jb, 1.2, .35, 1.7, RED, 1.15, 1.55, 0); box(jb, .1, .8, 1.8, WHITE, .5, 1.8, 0); box(jb, .12, 1.1, 1.8, NAVY, -.9, 1.9, 0); box(jb, 1.5, .1, 1.8, WHITE, -.2, 2.45, 0); box(jb, .5, .5, .5, '#f2c8a0', -.2, 1.85, .35); box(jb, .6, .14, .6, ORANGE, -.2, 2.14, .35);
const wheels = [[1.15, 1], [1.15, -1], [-1.15, 1], [-1.15, -1]].map(([x, z]) => { const w = add(jeep, new THREE.CylinderGeometry(.55, .55, .4, 6), NAVY, x, .55, z); w.rotation.x = Math.PI / 2; return w; }); add(jb, new THREE.CylinderGeometry(.5, .5, .3, 6), NAVY, -1.95, 1.3, 0).rotation.z = Math.PI / 2;
K.shadow(jeep, true, false); scene.add(jeep);
add(scene, new THREE.CircleGeometry(7, 8), K.glow(ORANGE, { fog: false }), 0, 0, 0).name = 'sun'; const disc = scene.getObjectByName('sun');
const fx = K.fx(scene, 40); let pT = 0;
// 仕上げは軽く：すみを少し落とし、色をわずかにあざやかにするだけ
const post = K.post(renderer, `void main(){vec3 c=src(vUv);c=mix(vec3(luma(c)),c,1.12);c*=1.-.22*pow(length(vUv-.5)*1.25,2.6);gl_FragColor=vec4(c,1.);}`); onResize(post.resize);
K.loop((dt, t) => {
  const jx = 4 + t * 7; jeep.position.set(jx, 0, 0); jb.position.y = Math.abs(Math.sin(t * 9)) * .06; jb.rotation.z = Math.sin(t * 4.3) * .02; wheels.forEach(w => w.rotation.y = -t * 10);
  for (const g of things) { const u = g.userData; u.x += u.v * dt; const x = jx + ((u.x - jx + P / 2) % P + P) % P - P / 2; g.position.set(x, H(x, u.z), u.z); if (u.animal) { const s = t * 5 + u.ph; u.animal.position.y = Math.abs(Math.sin(s)) * .22; u.animal.rotation.z = Math.sin(s) * .07; } }
  if ((pT -= dt) < 0) { pT = .12; fx.emit('puff', jx - 2.6, .5, (Math.random() - .5) * 1.6, { vx: -1, vy: .8, spread: .6, life: 1, size: .8, grow: 1.6, tint: '#f6e4b4' }); } fx.update(dt);
  land.follow(jx, 0); sun.position.set(jx - 14, 30, 16); sun.target.position.set(jx, 0, -4); disc.position.set(jx + 22, 15, -90);
  cam.position.set(jx + 1 + Math.sin(t * .25) * 1.5, 7.6, 20.5); cam.lookAt(jx + 1, 2.2, -2);
  post.render(scene, cam, t);
});
</script>
