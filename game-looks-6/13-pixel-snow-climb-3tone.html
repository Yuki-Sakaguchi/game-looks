<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6-13 登山 白・黒・青 3 色のドット絵</title>
<style>
html,body{margin:0;height:100%;background:#0c0c18;overflow:hidden}
canvas{display:block;image-rendering:pixelated}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#f6f8ff;background:#0c0c18;padding:0 6px}
</style>
<div id="cap">6-13 ─ 登山 / 雪の尾根を白・黒・青の 3 色だけのドット絵で描く　｜　見るだけ（自動で頂上へ登る）</div>
<script src="kit.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// ローポリの雪の尾根を横 220 ドットで粗く描き、白・黒・青の 3 色のいちばん近い色に丸める。日なたの雪は白、影は青のべた、
// そのあいだの斜面は白と青の点の並び（ディザ）。空と岩は黒。近くの物のふちには黒い 1 ドットの線を引く
import * as THREE from 'three';
const K = KIT(THREE), { scene, cam, renderer, onResize } = K.stage({ fov: 45, far: 800 }), { add, box, hash, flat, glow } = K;
cam.near = .5; cam.updateProjectionMatrix();
const BLACK = '#0c0c18', BLUE = '#2a5ad8', WHITE = '#f6f8ff';
scene.background = new THREE.Color(BLACK); scene.add(K.stars(110, 500, 1.2));
const { sun } = K.lights(scene, renderer, { sky: '#3060ff', ground: '#3060ff', amb: 2, sun: '#ffffff', power: 3, range: 26 });
// 尾根は x の方向へ登り、x = 60 が頂上。両がわは急に落ちる
const TOP = 60, crest = x => Math.sin(x * .08) * 2.5;
const H = (x, z) => { const d = Math.abs(z - crest(x)); return (x < TOP ? x * .42 : TOP * .42 - (x - TOP) * 1.1) - Math.pow(d, 1.2) * .3 + Math.sin(x * .31 + z * .2) * Math.cos(z * .27 - x * .11) * 1.3 * Math.min(1, d / 6); };
const C = K.colors('#ffffff', '#3a4a8a');
const land = K.terrain(H, 76, 76, 2.5, (y, x, z) => { const d = Math.abs(z - crest(x)); return C[d > 6 && hash(Math.round(x * .17), Math.round(z * .17)) > .84 ? 1 : 0]; }); land.mesh.receiveShadow = true; scene.add(land.mesh);
// 遠くの峰、尾根の岩、頂上の旗
for (let i = 0; i < 7; i++) { const r = 50 + hash(i, 1) * 40, m = add(scene, new THREE.ConeGeometry(r, r * (.7 + hash(i, 2) * .4), 5), flat('#ffffff'), 170 + hash(i, 3) * 160, -22 + hash(i, 4) * 26, (i - 3) * 95 + hash(i, 5) * 40); m.rotation.y = i * 1.3; m.userData.noEdge = true; }
for (let i = 0; i < 12; i++) { const x = 6 + i * 4.6, s = i % 2 ? 1 : -1, z = crest(x) + s * (1.6 + hash(i, 6) * 2.4), r = K.rock(.5 + hash(i, 7) * .7, '#3a4a8a'); r.position.set(x, H(x, z) - .1, z); scene.add(r); }
const flag = new THREE.Group(); flag.position.set(TOP, H(TOP, crest(TOP)), crest(TOP)); add(flag, new THREE.CylinderGeometry(.08, .08, 4.6, 5), glow(WHITE), 0, 2.3, 0);
const cloth = add(flag, new THREE.PlaneGeometry(2.2, 1.3, 4, 1), glow(BLUE, { side: THREE.DoubleSide }), 0, 3.9, 1.1); cloth.rotation.y = Math.PI / 2; box(flag, .5, .5, .5, '#14141c', .3, .1, .3); scene.add(flag);
// 登山者：青い上着、白いぼうしと荷物、黒いズボン。右手にピッケル
const hero = K.person({ top: BLUE, bottom: '#14141c', skin: '#ffffff', hat: WHITE }), HP = hero.userData.P; hero.rotation.order = 'ZYX'; scene.add(hero);
box(HP.body, .46, .5, .26, glow(WHITE), 0, .34, -.27); box(HP.body, .5, .12, .3, glow(BLUE), 0, .5, -.27);
box(HP.armR, .07, 1.25, .07, '#14141c', 0, -.95, .1); box(HP.armR, .5, .09, .09, glow(WHITE), 0, -.42, .16);
hero.traverse(m => { if (m.isMesh && m.material.color.getHexString() === '2a5ad8') m.material = glow(BLUE); });
const fx = K.fx(scene, 170); let pT = 0;
const post = K.post(renderer, K.PALETTE([BLACK, BLUE, WHITE], .26, `float e=edge(uv+px*.5,1.,1.15,.1)*(1.-smoothstep(22.,34.,dep(uv)));c=mix(c,vec3(.04,.04,.08),e);`), {}, { width: 220, gbuf: true }); onResize(post.resize);
K.loop((dt, t) => {
  const x = 8 + (t % 15.6) * 3.2, z = crest(x), y = H(x, z);
  hero.position.set(x, y, z); hero.rotation.set(0, Math.atan2(1, Math.cos(x * .08) * .2), -.22); K.walk(hero, t * 5.5, .55); HP.armR.rotation.x = -.75 + Math.sin(t * 5.5) * .45;
  const pos = cloth.geometry.attributes.position; for (let i = 0; i < pos.count; i++) pos.setZ(i, Math.sin(pos.getX(i) * 2.4 - t * 7) * .22 * (pos.getX(i) + 1.1)); pos.needsUpdate = true;
  // 風で尾根から流れる雪けむり（奥へ流れる）と、頂上からのびる雪の旗
  if ((pT -= dt) < 0) { pT = .045; const px = x + 1 + Math.random() * 34, pz = crest(px) - Math.random() * 1.5; fx.emit('puff', px, H(px, pz) + .2, pz, { vx: 1.5, vy: .8, vz: -6, spread: 1, life: 1.4, size: .5, grow: 1.8 });
    fx.emit('puff', TOP + Math.random() * 2, H(TOP, crest(TOP)) + .3, crest(TOP), { vx: 2.5, vy: 1, vz: -6, spread: 1.2, life: 1.8, size: .9, grow: 2.2 });
    fx.emit('puff', x + 14 - Math.random() * 24, y + 1 + Math.random() * 7, z + 5, { vx: 1, vy: -.4, vz: -10, life: 1.3, size: .2, fade: false }); } fx.update(dt);
  land.follow(x, z); sun.position.set(x - 14, y + 30, z + 24); sun.target.position.set(x, y, z);
  const tall = cam.aspect < 1, D = tall ? 5.2 : 6.6; cam.position.set(x - D, y - D * .42 + (tall ? 2 : 2.3), z + 2.4); cam.lookAt(x + 8, y + (tall ? 4.6 : 4.2), crest(x + 8) * .5 + z * .5);
  post.render(scene, cam, t);
});
</script>
</html>
