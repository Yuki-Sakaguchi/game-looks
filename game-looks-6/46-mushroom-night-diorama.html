<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6-46 箱庭 光るきのこの森 夜のドット絵ジオラマ</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;image-rendering:pixelated}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#8aeaff;background:#000;padding:0 6px}
</style>
<div id="cap">6-46 ─ 箱庭 / 黒い空間に浮かぶ、光るきのこの森のドット絵ジオラマ　｜　見るだけ（自動で小人が歩く）</div>
<script src="kit.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 絵の決まり：黒い空間に、丸い土台の夜の森を 1 つだけ浮かべる。色は紺の段々と、きのこの光 3 色（水色・もも・黄緑）と、ランタンの橙だけ。
// 光は加算のにじみ（丸いぼかしの板）で足し、仕上げで粗いドットにして決めた色へ丸める。
// 小人が道を一周し、近くのきのこだけが明るくなる。カメラはゆっくり回る
import * as THREE from 'three';
const K = KIT(THREE), { scene, cam, renderer, onResize } = K.stage({ fov: 36, fitAspect: 1.4 }), { add, box, hash } = K;
scene.background = new THREE.Color('#000000');
K.lights(scene, renderer, { sky: '#6a8ae0', ground: '#1a2a5a', amb: 1.1, sun: '#9ab8ff', power: 1.0, pos: [-12, 24, 10], range: 14 });
const R = 10, PR = 6, flatX = m => { m.rotation.x = -Math.PI / 2; return m; };
// 土台：上はこけ、横は土、下は岩のとがり
add(scene, new THREE.CylinderGeometry(R, R * .8, 2.4, 20), '#1a2450', 0, -1.3, 0); add(scene, new THREE.CylinderGeometry(R * .8, 1.5, 5, 9), '#10183a', 0, -5, 0);
add(scene, new THREE.CylinderGeometry(R, R, .2, 20), '#1f4a4a', 0, 0, 0).receiveShadow = true;
flatX(add(scene, new THREE.RingGeometry(PR - .7, PR + .7, 40), '#4a62b0', 0, .12, 0)).receiveShadow = true;                 // 道
flatX(add(scene, new THREE.CircleGeometry(2.1, 10), K.glow('#2e88b0'), 0, .14, 0));                                          // 池
box(scene, R - 1.7, .06, 1.2, K.glow('#2e88b0'), (R + 1.9) / 2, .15, 0); box(scene, .3, 4.4, 1.2, K.glow('#3aa8c8'), R + .1, -2, 0);   // 小川と、ふちから落ちる水
box(scene, 1.6, .14, 2.8, '#8aa0e0', PR, .55, 0).castShadow = true; for (const s of [-1, 1]) box(scene, .1, .45, 2.8, '#8aa0e0', PR + s * .75, .85, 0);   // 橋
for (let i = 0; i < 16; i++) { const a = hash(i, 11) * 6.283, r = i % 2 ? 2.8 + hash(i, 12) * 2 : 7.6 + hash(i, 12) * 1.9, x = Math.cos(a) * r, z = Math.sin(a) * r; if (x > 0 && Math.abs(z) < 1.4) continue;
  const m = add(scene, new THREE.IcosahedronGeometry(.5 + hash(i, 13) * .5, 0), '#2f6a5a', x, .2, z); m.scale.y = .5; m.rotation.y = i; }   // こけのかたまり
for (let i = 0; i < 7; i++) { const a = i * .9 + .5, p = K.shadow(K.pine(3.6 + hash(i, 14) * 2, '#1c3a5a', '#141e44')); p.position.set(Math.cos(a) * 8.9, .1, Math.sin(a) * 8.9); scene.add(p); }
// 光のにじみに使う、丸いぼかしの絵
const gt = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.35, 'rgba(255,255,255,.2)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
const halo = (col, s) => { const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: gt, color: col, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false })); sp.scale.setScalar(s); return sp; };
// きのこ：じく・かさ（自分で光る）・空中のにじみ・地面に落ちる光
const COL = ['#5ad8ff', '#ff8ac8', '#b8f05a'], mush = [];
function mushroom(x, z, h, ci) { const g = new THREE.Group(), col = new THREE.Color(COL[ci]); g.position.set(x, .1, z);
  add(g, new THREE.CylinderGeometry(h * .09, h * .13, h * .62, 6), K.flat('#cfe0f0', { emissive: col, emissiveIntensity: .15 }), 0, h * .31, 0);
  const capM = K.flat(COL[ci], { emissive: col }), cap = add(g, new THREE.SphereGeometry(h * .42, 7, 3, 0, 6.283, 0, 1.571), capM, 0, h * .56, 0); cap.scale.y = .8; cap.castShadow = true;
  const sp = halo(col, h * 1.9); sp.position.y = h * .7; g.add(sp);
  const fl = flatX(add(g, new THREE.CircleGeometry(h * 1.1, 12), new THREE.MeshBasicMaterial({ map: gt, color: col, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }), 0, .08, 0));
  scene.add(g); mush.push({ x, z, capM, sp, fl, k: 0, ph: hash(x, z) * 6 }); }
mushroom(-2.4, -1.8, 5, 0); mushroom(7.9, 3.2, 3, 1); mushroom(-3.5, 8, 4.2, 2); mushroom(2.6, 2.6, 2.6, 1); mushroom(-8.4, -2.6, 3, 0);
for (let i = 0; i < 24; i++) { const a = hash(i, 1) * 6.283, r = i % 2 ? 2.6 + hash(i, 2) * 2.2 : 7.7 + hash(i, 2) * 1.7, x = Math.cos(a) * r, z = Math.sin(a) * r; if (x > 0 && Math.abs(z) < 1.3) continue; mushroom(x, z, .7 + hash(i, 3) * 1.2, i % 3); }
// 小人：とんがり帽子とランタン
const gn = K.shadow(K.person({ top: '#f4fbff', bottom: '#5a6ab0', s: 1.5 })), GP = gn.userData.P; add(GP.head, new THREE.ConeGeometry(.45, 1.1, 6), K.flat('#ffd88a', { emissive: '#d88a3a', emissiveIntensity: .6 }), 0, 1.15, 0);
box(GP.armR, .3, .36, .3, K.glow('#ffd88a'), 0, -1.1, .1); const lh = halo('#ffb050', 1.5); lh.position.set(0, -1.1, .1); GP.armR.add(lh);
const lamp = new THREE.PointLight('#ffe0a0', 3, 6); lamp.position.set(.5, 1, .5); gn.add(lamp); scene.add(gn);
// ただよう光の粒
const NF = 60, fp = new Float32Array(NF * 3), fg = new THREE.BufferGeometry(); fg.setAttribute('position', new THREE.BufferAttribute(fp, 3));
scene.add(new THREE.Points(fg, new THREE.PointsMaterial({ color: '#c8f06a', size: 1.6, sizeAttenuation: false, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false })));
const post = K.post(renderer, K.PALETTE(['#000000', '#0a1028', '#141e44', '#1e2e60', '#2c4484', '#4a62b0', '#1f4a4a', '#2f6a5a', '#2e88b0', '#5ad8ff', '#b4f2ff', '#ff8ac8', '#7aa83a', '#b8f05a', '#f4fbff', '#d88a3a', '#ffd88a'], .05), {}, { width: 300 }); onResize(post.resize);
K.loop((dt, t) => {
  const g = t * .35 - .6, gx = Math.sin(g) * PR, gz = Math.cos(g) * PR, up = gx > 0 ? Math.max(0, 1 - (gz / 1.7) ** 2) * .5 : 0;   // 橋の上では少し高く
  gn.position.set(gx, .1 + up, gz); gn.rotation.y = g + Math.PI / 2; K.walk(gn, t * 7, .6);
  for (const m of mush) { const d = Math.hypot(m.x - gx, m.z - gz), tg = 1 - THREE.MathUtils.smoothstep(d, 2.5, 6.5); m.k += (tg - m.k) * Math.min(1, dt * 3);
    const v = m.k + Math.sin(t * 1.3 + m.ph) * .06; m.capM.emissiveIntensity = .22 + v * .55; m.sp.material.opacity = .06 + v * .3; m.fl.material.opacity = .1 + v * .4; }
  for (let i = 0; i < NF; i++) { const a = hash(i, 21) * 6.283, r = Math.sqrt(hash(i, 22)) * 9; fp[i * 3] = Math.cos(a) * r + Math.sin(t * .5 + i) * .6; fp[i * 3 + 1] = .5 + (hash(i, 23) * 7 + t * (.2 + hash(i, 24) * .3)) % 7; fp[i * 3 + 2] = Math.sin(a) * r + Math.cos(t * .4 + i * 2) * .6; } fg.attributes.position.needsUpdate = true;
  const a = t * .1, tall = innerWidth < innerHeight, cr = tall ? 19 : 27; cam.position.set(Math.sin(a) * cr, tall ? 24 : 14, Math.cos(a) * cr); cam.lookAt(0, tall ? 0 : 1.2, 0);
  post.render(scene, cam, t);
});
</script>
</html>
