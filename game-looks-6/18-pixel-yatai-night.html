<html lang="ja">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6-18 夜の屋台通り 16 色のドット絵</title>
<style>
html,body{margin:0;height:100%;background:#0a0e2a;overflow:hidden}
canvas{display:block;image-rendering:pixelated}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#fcd870;background:#0a0e2a;padding:0 6px}
</style>
<div id="cap">6-18 ─ 夜の屋台通り / お祭りの通りの立体を、夜の紺とあかりの 16 色のドット絵に描き直す　｜　見るだけ（自動で歩く）</div>
<script src="kit.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// ローポリの屋台の通りをふつうに描いてから、横 256 ドットの粗い絵にして、16 色（夜の紺 6 段＋あかりの赤・だいだい・黄・もも＋水色 1 つ）だけに丸める。
// 明るい所のまわりへ光を少し足してから丸めるので、ちょうちんや屋台のまわりは点の並びでにじんで見える。
// ゆかたの子どもを、うしろから追う
import * as THREE from 'three';
const K = KIT(THREE), { scene, cam, renderer, onResize } = K.stage({ fov: 48 }), { add, box, hash, glow } = K;
const PAL = ['#0a0e2a', '#141a44', '#22286a', '#3a3a8a', '#5a4a9a', '#8a6a9a', '#7a1a3a', '#c8283a', '#e8503a', '#f08a3a', '#f8b04a', '#fcd870', '#fff2c0', '#f08ab0', '#f8c0d0', '#2a7a9a'];
scene.background = K.sky([[0, '#0a0e2a'], [.45, '#141a44'], [.7, '#22286a'], [1, '#22286a']]); scene.fog = new THREE.Fog('#141a44', 16, 54);
scene.add(new THREE.HemisphereLight('#6a6ac0', '#f08a3a', 1.3)); const lamp = new THREE.PointLight('#ffc070', 14, 15, 1.5); scene.add(lamp);
const street = box(scene, 8.4, .2, 140, glow('#3a3a8a'), 0, -.1, 0), dark = box(scene, 120, .2, 140, glow('#141a44'), 0, -.2, 0), stars = K.stars(160, 200, 1); scene.add(stars);
// あかりが地面に落ちる丸い光（まん中が明るく、外へ消える）
const hc = document.createElement('canvas'); hc.width = hc.height = 64; { const x = hc.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, '#fff'); g.addColorStop(.5, '#666'); g.addColorStop(1, '#000'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); }
const halo = new THREE.CanvasTexture(hc), pool = c => glow(c, { map: halo, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
// 屋台：柱 4 本、しまの屋根、台、のれん、ちょうちん、奥のあかり。品物は 4 種（わたあめ・金魚・りんごあめ・お面）。通り側が −x
const L = 48, things = [], AW = ['#c8283a', '#2a7a9a', '#f08ab0', '#f8b04a'], put = (g, z0) => { g.userData.z0 = z0; scene.add(g); things.push(g); return g; };
for (let i = 0; i < 16; i++) { const g = new THREE.Group(), a = AW[(i * 3 + (i >> 3)) % 4], kind = (i + (i >> 3)) % 4, side = i < 8 ? 1 : -1;
  for (const [x, z] of [[-1.3, -1.8], [1.3, -1.8], [-1.3, 1.8], [1.3, 1.8]]) box(g, .12, 2.7, .12, '#7a1a3a', x, 1.35, z);
  for (let k = 0; k < 6; k++) box(g, 3.3, .12, .68, glow(k % 2 ? '#fff2c0' : a), 0, 2.9, -1.7 + k * .68).rotation.z = -.2;
  box(g, .7, 1, 3.7, '#7a1a3a', -1.1, .5, 0); box(g, .1, 1.7, 3.7, glow('#f8b04a'), 1.3, 1.85, 0); box(g, .1, 1, 3.7, glow('#f08a3a'), 1.3, .5, 0);
  for (let k = 0; k < 5; k++) box(g, .05, .55, .62, glow(k % 2 ? a : '#fff2c0'), -1.62, 2.75, -1.48 + k * .74);
  for (const z of [-2.05, 2.05]) add(g, new THREE.SphereGeometry(.3, 6, 5), glow('#e8503a'), -1.6, 2.1, z).scale.y = 1.25;
  if (kind === 0) for (let k = 0; k < 4; k++) { add(g, new THREE.IcosahedronGeometry(.32, 0), glow(k % 2 ? '#f8c0d0' : '#f08ab0'), -1.1, 1.75, -1.2 + k * .8); box(g, .05, .5, .05, glow('#fff2c0'), -1.1, 1.25, -1.2 + k * .8); }
  if (kind === 1) { box(g, 1.3, .4, 2.8, '#22286a', -2.3, .2, 0); box(g, 1.1, .06, 2.6, glow('#2a7a9a'), -2.3, .42, 0); for (let k = 0; k < 9; k++) box(g, .16, .06, .1, glow(k % 3 ? '#e8503a' : '#fff2c0'), -2.7 + hash(i, k) * .8, .46, -1.1 + hash(k, i) * 2.2); }
  if (kind === 2) for (let k = 0; k < 6; k++) { add(g, new THREE.IcosahedronGeometry(.2, 1), glow('#c8283a'), -1.1, 1.5, -1.4 + k * .56); box(g, .04, .4, .04, glow('#fff2c0'), -1.1, 1.2, -1.4 + k * .56); }
  if (kind === 3) for (let k = 0; k < 8; k++) box(g, .08, .4, .4, glow(['#fff2c0', '#f08ab0', '#2a7a9a', '#c8283a'][k % 4]), 1.2, 1.5 + (k >> 2) * .6, -1.2 + (k % 4) * .8);
  add(g, new THREE.PlaneGeometry(9, 9).rotateX(-Math.PI / 2), pool(kind === 1 ? '#5a4a9a' : '#b0603a'), -3, .03, 0);
  g.position.x = side * 5.7; if (side < 0) g.rotation.y = Math.PI; put(g, (i % 8) * 6); }
// 通りの上にわたした ちょうちんの列、屋台の前の人かげ
for (let i = 0; i < 8; i++) { const g = new THREE.Group(); box(g, 8.6, .04, .04, '#0a0e2a', 0, 4.5, 0); for (let k = 0; k < 5; k++) add(g, new THREE.SphereGeometry(.3, 6, 5), glow(k % 2 ? '#fcd870' : '#e8503a'), -3 + k * 1.5, 4.25 - Math.cos((k - 2) * .7) * .5 + .5, 0).scale.y = 1.25; put(g, i * 6 + 3); }
const folk = [...Array(11)].map((_, i) => { const c = i % 3 ? '#22286a' : '#141a44', p = K.person({ top: c, bottom: c, skin: c, s: .9 + hash(i, 1) * .2 }); p.position.x = (i % 2 ? 1 : -1) * (2.9 + hash(i, 2) * .7); p.rotation.y = (i % 2 ? 1 : -1) * 1.4; return put(p, hash(i, 3) * L); });
// 主役：ゆかたの子ども（クリーム色のゆかた、赤い帯、手にちょうちん）
const S = .9, hero = K.person({ top: '#fff2c0', bottom: '#f8c0d0', skin: '#f8c0d0', hat: '#0a0e2a', s: S }), P = hero.userData.P; scene.add(hero);
box(P.body, .58 * S, .62 * S, .36 * S, '#fff2c0', 0, -.3 * S, 0); box(P.body, .56 * S, .17 * S, .38 * S, '#c8283a', 0, .2 * S, 0); box(P.body, .34 * S, .26 * S, .12 * S, '#c8283a', 0, .24 * S, -.24 * S); box(P.head, .46 * S, .3 * S, .12 * S, '#0a0e2a', 0, .26 * S, -.2 * S);
box(P.armR, .22 * S, .28 * S, .22 * S, glow('#fcd870'), 0, -.8 * S, 0);
const post = K.post(renderer, K.PALETTE(PAL, .14, 'vec3 g=vec3(0.);for(int i=0;i<8;i++){float a=float(i)*.785+.39;vec2 d=vec2(cos(a),sin(a))*px;g+=max(src(uv+d*2.5)-.78,0.)+max(src(uv+d*5.)-.78,0.)*.6;}c+=g*vec3(.24,.15,.09);'), {}, { width: 256 }); onResize(post.resize);
K.loop((dt, t) => {
  const z = t * 1.6, x = Math.sin(t * .3) * 1.1; hero.position.set(x, 0, z); hero.rotation.y = Math.cos(t * .3) * .2; K.walk(hero, t * 6.5, .5);
  for (const g of things) g.position.z = g.userData.z0 + Math.round((z + 16 - g.userData.z0) / L) * L;
  folk.forEach((p, i) => { p.rotation.z = Math.sin(t * 1.3 + i) * .04; });
  street.position.z = dark.position.z = z + 30; lamp.position.set(x + .4, 2.4, z - 1.2); stars.position.set(x, 0, z);
  cam.position.set(x * .5 + .7, 2.5, z - 5.3); cam.lookAt(x * .5, 1.25, z + 5);
  post.render(scene, cam, t);
});
</script>
</html>
