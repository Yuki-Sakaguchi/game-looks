<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6-07 旅 月夜の砂漠を 2 段の青で</title>
<style>
html,body{margin:0;height:100%;background:#16245a;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#dfe6ff;background:#16245a;padding:0 6px}
</style>
<div id="cap">6-07 ─ 旅 / 月夜の砂漠を、明るい青と暗い青の 2 段と焚き火のだいだいで描く　｜　見るだけ（自動で尾根を進む）</div>
<script src="kit.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 絵の決まり：仕上げの加工は使わない。砂丘の三角は、月の光が当たるか当たらないかで「明るい青／暗い青」の 2 色だけにぬり分ける（面の向きと月の向きから決める）。
// 色は青の 2 段と月の白。差し色は遠いオアシスの焚き火と先頭のランタンのだいだいだけ。遠くは霧で空の色へとける
import * as THREE from 'three';
const K = KIT(THREE), { scene, cam, renderer } = K.stage({ fov: 40 }), { add, box, flat, glow, hash } = K;
scene.background = K.sky([[0, '#16245a'], [.3, '#3856a6'], [.43, '#6484cc'], [1, '#6484cc']]); scene.fog = new THREE.Fog('#6484cc', 85, 215);
const L = new THREE.Vector3(-.8, .45, -.4).normalize();
const { sun } = K.lights(scene, renderer, { sky: 0xa8b8ff, ground: 0x3a4a90, amb: 1.5, sun: 0xdfe8ff, power: 1.3, range: 22 });
// 砂丘：尾根がうねりながら x の方向へのびる。カメラがわが急な面（かげ）、向こうがわがゆるい面（月の光）
const cz = x => 14 * Math.sin(x * .03), sm = v => v * v * (3 - 2 * v);
const H = (x, z) => { const p = (((z - cz(x)) / 44 + .78) % 1 + 1) % 1; return sm(p < .78 ? p / .78 : (1 - p) / .22) * (6.5 + 1.5 * Math.sin(x * .05 + z * .04)); };
const C = K.colors('#8fa9ea', '#2f4290');
const land = K.terrain(H, 100, 80, 3, (y, x, z) => { const nx = H(x - 1, z) - H(x + 1, z), nz = H(x, z - 1) - H(x, z + 1); return (nx * L.x + 2 * L.y + nz * L.z) / Math.hypot(nx, 2, nz) > .33 ? C[0] : C[1]; }); land.mesh.receiveShadow = true; scene.add(land.mesh);
// 月（カメラについてくる大きな円）と星
const moon = new THREE.Group(); add(moon, new THREE.CircleGeometry(31, 24), glow('#8aa4e6', { fog: false, transparent: true, opacity: .35 })); add(moon, new THREE.CircleGeometry(24, 24), glow('#f6f8ff', { fog: false }), 0, 0, .5);
for (const [x, y, r] of [[-8, 6, 5], [7, -4, 6.5], [-3, -12, 3.5], [10, 11, 3]]) add(moon, new THREE.CircleGeometry(r, 9), glow('#d4dcf6', { fog: false }), x, y, 1); scene.add(moon);
const stars = K.stars(260, 300, 1.6); scene.add(stars);
// らくだ：箱の体、こぶ、首、4 本の足（つけ根で回す）。前は +z
function camel() { const g = new THREE.Group(), c = flat('#e6eafc', { emissive: '#4a5a96' }), legs = []; box(g, .95, 1.05, 2.5, c, 0, 2.1, 0); add(g, new THREE.ConeGeometry(.78, 1, 4), c, 0, 3, -.1).rotation.y = .785;
  box(g, 1.02, .62, 1.1, '#e88a3a', 0, 2.36, -.1); box(g, 1.3, .5, .6, '#2a3a84', 0, 2.2, -.1); const n = box(g, .4, 1.5, .42, c, 0, 2.95, 1.45); n.rotation.x = .5; box(g, .44, .44, .9, c, 0, 3.6, 2.05); box(g, .14, .8, .14, c, 0, 2.1, -1.3).rotation.x = -.3;
  for (const [x, z] of [[-.3, .95], [.3, .95], [-.3, -.95], [.3, -.95]]) { const pv = new THREE.Group(); pv.position.set(x, 1.7, z); box(pv, .24, 1.7, .24, c, 0, -.85, 0); g.add(pv); legs.push(pv); } g.userData.legs = legs; return K.shadow(g); }
const lead = K.shadow(K.person({ top: '#eef0fa', bottom: '#2a3a84', skin: '#c9a48c', hat: '#e88a3a', s: 1.15 })); add(lead.userData.P.armR, new THREE.BoxGeometry(.3, .4, .3), glow('#ffb04a'), 0, -.8, .15);
const lamp = new THREE.PointLight(0xff9a3a, 16, 10); lamp.position.set(.5, 1, .5); lead.add(lamp);
const team = [[lead, 4.2], [camel(), 0], [camel(), -4.7], [camel(), -9.4]]; team.forEach(([o]) => scene.add(o));
// オアシス：池、やしの木、テント、焚き火（ドット絵の炎）。隊の進みに合わせて、見えない所で先へ置きなおす
const oasis = new THREE.Group(); add(oasis, new THREE.CylinderGeometry(6, 6, .2, 9), glow('#86b4f4'), -2, .1, 0); add(oasis, new THREE.ConeGeometry(2.6, 3, 4), '#dfe3f6', 6, 1.5, -3).rotation.y = .6;
for (let i = 0; i < 5; i++) { const p = new THREE.Group(), h = 5 + hash(i, 1) * 2.5; p.position.set(-2 + Math.cos(i * 1.4) * 7, 0, Math.sin(i * 1.4) * 5 - 1); add(p, new THREE.CylinderGeometry(.2, .3, h, 5), '#24366e', 0, h / 2, 0); for (let k = 0; k < 6; k++) { const lf = add(p, new THREE.ConeGeometry(.6, 3.2, 4), '#1f6a7a', Math.cos(k * 1.05) * 1.3, h - .2, Math.sin(k * 1.05) * 1.3); lf.rotation.set(Math.sin(k * 1.05) * 1.9, 0, -Math.cos(k * 1.05) * 1.9); } p.rotation.z = (hash(i, 2) - .5) * .3; oasis.add(p); }
const fire = new THREE.PointLight(0xff8a2a, 140, 45); fire.position.set(5, 2, 4); oasis.add(fire); for (let k = 0; k < 3; k++) box(oasis, .3, .3, 2, '#24366e', 5, .2, 4).rotation.y = k * 1.05; scene.add(oasis);
const fx = K.fx(scene, 90); let fT = 0, dT = 0;
K.loop((dt, t) => {
  const x = 30 + t * 2.2, zc = cz(x - 3), yc = H(x - 3, zc);
  team.forEach(([o, dx], i) => { const xi = x + dx, zi = cz(xi); o.position.set(xi, H(xi, zi) + (i ? Math.abs(Math.sin(t * 3.6 + i)) * .06 : 0), zi); o.rotation.y = Math.atan2(1, .42 * Math.cos(xi * .03));
    if (i) o.userData.legs.forEach((l, k) => { l.rotation.x = Math.sin(t * 3.6 + i + (k % 3 ? 3.14 : 0)) * .42; }); else K.walk(o, t * 6.5, .55); });
  const ox = Math.round((x - 50) / 90) * 90 + 50, oz = cz(ox) - 34; oasis.position.set(ox, H(ox, oz), oz); fire.intensity = 140 + Math.sin(t * 17) * 25;
  if ((fT -= dt) < 0) { fT = .07; fx.emit('flame', ox + 5, H(ox, oz) + 1.6, oz + 4, { vy: 2.4, spread: 1, life: .7, size: 3.4, fog: false }); }
  if ((dT -= dt) < 0) { dT = .35; const [o] = team[1 + Math.floor(Math.random() * 3)]; fx.emit('puff', o.position.x, o.position.y + .2, o.position.z, { vy: .5, spread: .7, life: 1.1, size: .7, grow: 1.4, tint: '#9fb6ee' }); }
  fx.update(dt); land.follow(x, zc - 60);
  sun.target.position.set(x - 3, yc, zc); sun.position.copy(sun.target.position).addScaledVector(L, 60);
  cam.position.set(x - 1, yc + 4.6, zc + 21); cam.lookAt(x - 3, yc + 3.4, zc);
  moon.position.set(cam.position.x - 44, cam.position.y + 38, cam.position.z - 230); moon.lookAt(cam.position); stars.position.copy(cam.position);
  renderer.render(scene, cam);
});
</script>
</html>
