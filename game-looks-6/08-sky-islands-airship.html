<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6-08 空の旅 朝の浮島と飛行船のローポリ</title>
<style>
html,body{margin:0;height:100%;background:#ffd6cc;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#7a4a5a;background:#ffe6e0;padding:0 6px}
</style>
<div id="cap">6-08 ─ 空の旅 / 雲海の浮島を、もも色と水色の朝の光だけで描く　｜　見るだけ（自動で島をめぐる）</div>
<script src="kit.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 絵の決まり：仕上げの加工は使わない。色は朝のもも色・水色・草の緑の 3 つにしぼり、遠くの島はもも色の霧にとかす。
// 島は「草の上面＋土のふち＋さかさの岩」の 3 つの形だけ。差し色は家の窓と飛行船の窓の黄。滝の下にはドット絵の霧
import * as THREE from 'three';
const K = KIT(THREE), { scene, cam, renderer } = K.stage({ fov: 45 }), { add, box, flat, glow, hash } = K;
scene.background = K.sky([[0, '#62b4ec'], [.2, '#b4dcf6'], [.37, '#ffd6cc'], [1, '#ffd6cc']]); scene.fog = new THREE.Fog('#ffd6cc', 60, 230);
const { sun } = K.lights(scene, renderer, { sky: 0xe4f2ff, ground: 0xffc4bc, amb: 1.5, sun: 0xffe6cc, power: 2.5, range: 44 });
// 雲海：でこぼこのローポリの面。高い所が白、低い所がもも色
const CC = K.colors('#ffffff', '#ffd9d4', '#eeb4c8');
const sea = K.terrain((x, z) => Math.sin(x * .15) * Math.cos(z * .13) * 2.6 + Math.sin(x * .041 + z * .053) * 2.2, 70, 70, 5, y => CC[y > 1.2 ? 0 : y > -1.2 ? 1 : 2]); sea.mesh.receiveShadow = true; scene.add(sea.mesh);
// 浮島：kind は 1=家、2=風車、4=滝 の足し算
const cyl = (a, b, h, n = 8) => new THREE.CylinderGeometry(a, b, h, n), mills = [], falls = [];
function island(a, rad, y, r, kind) {
  const g = new THREE.Group(); g.position.set(Math.cos(a) * rad, y, Math.sin(a) * rad); g.rotation.y = a * 3 + r;
  add(g, cyl(r, r * .84, 1.4), '#7ccf6a', 0, -.7, 0); add(g, cyl(r * .84, r * .55, 1.8), '#c89a78', 0, -2.3, 0); add(g, new THREE.ConeGeometry(r * .56, r * 1.5, 7), '#9a86a8', 0, -3.2 - r * .75, 0).rotation.x = Math.PI;
  for (let k = 0; k < (r > 5 ? 4 : 1); k++) { const tr = K.tree(2.2 + hash(k, r) * 1.8, '#4aa868', '#7a5a44', '#6cc47a'); tr.position.set(Math.cos(k * 1.9 + 2.2) * r * .6, 0, Math.sin(k * 1.9 + 2.2) * r * .6); g.add(tr); }
  if (kind & 1) { const h = K.house(2.4, 1.7, 3, '#fff4e0', '#ff7a6a', '#ffe27a', true); h.position.set(-r * .12, 0, r * .25); g.add(h); }
  if (kind & 2) { const m = new THREE.Group(); m.position.set(r * .1, 0, -r * .4); add(m, cyl(.5, .95, 3.6, 6), '#fff4e0', 0, 1.8, 0); add(m, new THREE.ConeGeometry(.8, 1, 6), '#ff7a6a', 0, 4.1, 0); const bl = new THREE.Group(); bl.position.set(0, 3.2, .9); for (let k = 0; k < 4; k++) { const b = box(bl, .4, 2.4, .08, '#fff4e0', 0, 0, 0); b.geometry.translate(0, 1.3, 0); b.rotation.z = k * Math.PI / 2; } m.add(bl); mills.push(bl); g.add(m); }
  K.shadow(g);
  if (kind & 4) { const L = y + 1.5, f = { L, st: [], p: new THREE.Vector3(r * .97, -y + .6, 0) }; add(g, cyl(r * .32, r * .32, .1, 7), glow('#9adcf8'), r * .6, .06, 0); box(g, 1.3, L, .4, glow('#c4eeff', { transparent: true, opacity: .8 }), r * .97, -L / 2, 0); for (let k = 0; k < 4; k++) f.st.push(box(g, .28, 1.5, .46, glow('#ffffff'), r * .97 + (k % 2 - .5) * .6, 0, 0)); g.updateMatrixWorld(); g.localToWorld(f.p); falls.push(f); }
  scene.add(g);
}
island(0, 0, 15, 12, 7); for (const [a, rad, y, r, kind] of [[.5, 72, 11, 12, 3], [1.4, 23, 9, 9, 4], [2.3, 73, 14, 13, 5], [3.2, 24, 8, 8, 2], [4.1, 72, 12, 12, 1], [5, 23, 10, 9, 4], [5.9, 72, 9, 11, 7]]) island(a, rad, y, r, kind);
for (let i = 0; i < 8; i++) island(i * .8 + .3, 90 + (i % 3) * 22, 5 + hash(i, 3) * 16, 2 + hash(i, 4) * 1.5, 0);
for (let i = 0; i < 7; i++) { const c = K.cloud(1.5 + hash(i, 5), i % 2 ? '#ffffff' : '#ffe9e4'); c.position.set(Math.cos(i * .9) * (90 + hash(i, 6) * 50), 22 + hash(i, 7) * 18, Math.sin(i * .9) * (90 + hash(i, 8) * 50)); scene.add(c); }
// 飛行船：丸い気のう、赤い帯と尾びれ、ゴンドラ、回るプロペラ。前は +z
const ship = new THREE.Group(); { const e = new THREE.SphereGeometry(2, 8, 6); e.rotateX(Math.PI / 2); e.scale(1, 1, 2.3); add(ship, e, flat('#fff4e4', { emissive: '#6a5c50' })); const bd = new THREE.SphereGeometry(2.05, 8, 6); bd.rotateX(Math.PI / 2); bd.scale(1, 1, .55); add(ship, bd, '#ff7a6a');
  box(ship, .16, 1.5, 1.5, '#ff7a6a', 0, 1.5, -3.6); box(ship, .16, 1.2, 1.3, '#ff7a6a', 0, -1.4, -3.6); for (const sx of [-1, 1]) box(ship, 1.4, .16, 1.4, '#ff7a6a', sx * 1.5, 0, -3.6);
  box(ship, 1.2, .9, 2.8, '#8a5a4a', 0, -2.5, .2); box(ship, 1.26, .34, 2, glow('#ffe27a'), 0, -2.35, .3); for (const z of [-.8, 1.2]) box(ship, .1, .8, .1, '#8a5a4a', 0, -1.9, z); }
const prop = box(ship, .12, 1.8, .22, '#fff4e4', 0, -2.5, -1.4); K.shadow(ship); scene.add(ship);
const fx = K.fx(scene, 90); let mT = 0;
K.loop((dt, t) => {
  const a = -.785 + t * Math.PI / 10, c = Math.cos(a), s = Math.sin(a), R = 42, x = c * R, z = s * R, y = 13 + Math.sin(t * .8) * .8;   // 20 秒で一周
  ship.position.set(x, y, z); ship.rotation.set(Math.sin(t * .8 + 1.5) * .05, Math.atan2(-s, c), -.1, 'YXZ'); prop.rotation.z = t * 22;
  mills.forEach((m, i) => { m.rotation.z = t * (1.4 + i * .2); });
  falls.forEach(f => f.st.forEach((q, k) => { q.position.y = -((t * 9 + k * f.L / 4) % f.L); }));
  if ((mT -= dt) < 0) { mT = .12; for (const f of falls) fx.emit('puff', f.p.x, f.p.y, f.p.z, { vy: 1.2, spread: 3, life: 1.6, size: 2.2, grow: 1.6 }); }
  fx.update(dt); sea.follow(x, z);
  sun.target.position.set(x, 8, z); sun.position.set(x - 40, 40, z + 30);
  cam.position.set(x + s * 13 + c * 9, y + 4, z - c * 13 + s * 9); cam.lookAt(x - s * 5 - c * 2, y + .6, z + c * 5 - s * 2);
  renderer.render(scene, cam);
});
</script>
</html>
