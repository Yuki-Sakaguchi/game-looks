<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6-38 夕方の駅 ミニチュア撮影</title>
<style>
html,body{margin:0;height:100%;background:#f6c8a0;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#4a3a4a;background:#f6e2c8;padding:0 6px}
</style>
<div id="cap">6-38 ─ 夕方の駅 / 上下を大きくぼかして、町を小さな模型のように撮る　｜　見るだけ（自動で電車が着いて出る）</div>
<script src="kit.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// ミニチュア撮影の決まり：望遠ぎみのカメラで上からななめに見下ろし、仕上げで画面のまん中の帯だけピントを合わせ、上と下へ行くほど強くぼかす。
// 色はあざやかめに上げる。光は夕方の低い太陽（長い影・だいだい色）と、窓・街灯・電車のあかり。物は箱でできた模型
import * as THREE from 'three';
const K = KIT(THREE), { scene, cam, renderer, onResize } = K.stage({ fov: 27, maxFov: 46 }), { add, box, hash, glow } = K;
scene.background = new THREE.Color('#f6c8a0'); scene.fog = new THREE.Fog('#f6c8a0', 110, 260);
K.lights(scene, renderer, { range: 46, pos: [-36, 20, 24], sun: 0xffb868, power: 3.7, sky: 0xc4ccff, ground: 0xf0c090, amb: 1.75 }).sun.shadow.radius = 3;
const S = g => K.shadow(g), LIT = '#ffe08a', TEAL = '#1f9ab0', CREAM = '#f8f0e0', DARK = '#3a4458';
// 地面・畑・線路・ホーム・道
const GC = K.colors('#8fd070', '#7fc668'), land = K.terrain(() => 0, 60, 60, 8, (y, x, z) => GC[hash(Math.round(x * .06), Math.round(z * .06)) > .5 ? 0 : 1]); land.mesh.receiveShadow = true; scene.add(land.mesh);
const slab = (w, h, d, c, x, y, z) => { const m = box(scene, w, h, d, c, x, y, z); m.receiveShadow = true; return m; };
slab(22, .12, 12, '#f4d05a', -30, .06, -17); slab(18, .12, 10, '#e8a04a', 34, .06, -30); slab(400, .24, 3.6, '#c8b49a', 0, .12, 0); for (const z of [-.8, .8]) slab(400, .16, .16, DARK, 0, .32, z);
slab(40, .8, 5, '#efe4d0', 0, .4, 4.6).castShadow = true; slab(40, .04, .3, '#f6c21c', 0, .82, 2.7); slab(400, .1, 4.4, '#a4a8b8', 0, .05, 14); slab(5, .1, 9, '#a4a8b8', 24, .05, 9.5);
for (let i = -6; i <= 6; i++) { const g = new THREE.Group(); box(g, .22, 5.4, .22, DARK, 0, 2.7, 0); box(g, .16, .16, 2.6, DARK, 0, 5, 1.2); g.position.set(i * 18 + 9, 0, -2.4); scene.add(S(g)); }
// 駅舎・家・木・街灯（あかりは光る色）
{ const st = S(K.house(7, 3.4, 9, CREAM, '#e8503a', LIT, true)); st.position.set(25.5, 0, 4.5); st.rotation.y = -Math.PI / 2; scene.add(st); box(scene, 3, 1, .2, '#3a7ab8', -14, 2.6, 6.6).castShadow = true; for (const x of [-15.2, -12.8]) box(scene, .16, 2.2, .16, DARK, x, 1.6, 6.6); for (const x of [-5, 6]) box(scene, 2.4, .5, .7, '#b8704a', x, 1.05, 6.4).castShadow = true; }
const ROOF = ['#e8503a', '#3a7ab8', '#f2a03a', '#2f9a8a'];
for (let i = 0; i < 22; i++) { const back = i < 14, x = back ? -78 + (i % 7) * 26 + hash(i, 1) * 8 : -70 + (i - 14) * 20 + hash(i, 1) * 6, z = back ? -10 - (i > 6 ? 16 : 0) - hash(i, 2) * 5 : 22 + hash(i, 2) * 8; if (Math.abs(x + 30) < 13 && back || Math.abs(x - 24) < 5 && !back) continue; const h = S(K.house(4.4 + hash(i, 3) * 2, 2.8 + hash(i, 4), 5.4, i % 3 ? CREAM : '#f6dcc0', ROOF[i % 4], LIT, true)); h.position.set(x, 0, z); h.rotation.y = (i % 2) * 1.57; scene.add(h); }
for (let i = 0; i < 46; i++) { const x = (hash(i, 5) - .5) * 190, z = i % 3 ? -6 - hash(i, 6) * 46 : 18 + hash(i, 6) * 16, t = K.tree(3 + hash(i, 7) * 2.4, '#3fa860', '#7a5038', '#6cc46a'); t.position.set(x, 0, z); t.rotation.y = i; scene.add(t); }
const halo = new THREE.MeshBasicMaterial({ color: '#ffb850', transparent: true, opacity: .34, blending: THREE.AdditiveBlending, depthWrite: false });
for (let i = 0; i < 9; i++) { const x = i < 5 ? -16 + i * 8 : -60 + (i - 5) * 34, z = i < 5 ? 6.7 : 11.2, y0 = i < 5 ? .8 : 0; box(scene, .14, 3.6, .14, DARK, x, y0 + 1.8, z).castShadow = true; add(scene, new THREE.SphereGeometry(.38, 10, 8), glow('#fff2c0'), x, y0 + 3.7, z); add(scene, new THREE.CircleGeometry(2.6, 20), halo, x, y0 + .06, z - .4).rotation.x = -Math.PI / 2; }
// 電車 3 両（前は +x）。窓の帯と前のあかりが光る。とびらは開くと明るくなる
const train = new THREE.Group(), doorMat = K.flat('#157a90'), doorOpen = glow('#fff6d0'), doors = []; scene.add(train);
for (let k = 0; k < 3; k++) { const c = new THREE.Group(); c.position.x = (k - 1) * 9.5; box(c, 9, 1.3, 2.6, TEAL, 0, 1.25, 0); box(c, 9, 1.3, 2.6, CREAM, 0, 2.55, 0); box(c, 8.6, .3, 2.1, '#e4e6ea', 0, 3.35, 0); box(c, 8, .5, 2, DARK, 0, .45, 0); S(c); box(c, 7.8, .72, 2.66, glow(LIT), 0, 2.6, 0); for (const x of [-2.5, 2.5]) doors.push(box(c, 1.2, 2.1, 2.7, doorMat, x, 2.05, 0)); box(c, .5, .5, .3, DARK, 0, 3.7, 0); train.add(c); }
for (const z of [-.8, .8]) { box(train, .1, .3, .4, glow('#fff6c0'), 14.05, 1.3, z); box(train, .1, .3, .4, glow('#ff5040'), -14.05, 1.3, z); } box(train, .1, .8, 2, glow(LIT), 14.03, 2.6, 0);
// 人：おりる 6 人と、乗る 2 人。車が 1 台
const TOP = ['#e8503a', '#f2c84a', '#3a7ab8', '#f6f0e4', '#e87aa0', '#3fa860', '#f2a03a', '#7a5ac8'], folk = TOP.map((c, i) => { const g = S(K.person({ top: c, bottom: DARK, s: 1.3, hat: i % 3 ? null : '#f6f0e4' })); g.userData.dx = [-12.5, -7, -3, 2, 7, 11.5, 4.5, -9.5][i]; scene.add(g); return g; });
const car = S(K.car('#f2c84a')); car.rotation.y = -Math.PI / 2; scene.add(car); const car2 = S(K.car('#e8503a', '#f8f0e0')); car2.rotation.y = Math.PI / 2; scene.add(car2);
let tall = false; onResize((w, h) => tall = w < h);
// 仕上げ：まん中から上下へはなれるほど大きな円でぼかす（うずまき状に 32 点）。色をあざやかに、暗い所を少ししめる
const post = K.post(renderer, `void main(){float r=smoothstep(.06,.5,abs(vUv.y-.5))*res.y*.022;vec3 c=vec3(0.);for(int i=0;i<32;i++){float a=float(i)*2.39996,q=sqrt((float(i)+.5)/32.)*r;c+=src(vUv+vec2(cos(a),sin(a))*q/res);}c/=32.;
c=mix(vec3(luma(c)),c,1.32);c=mix(c,c*c*(3.-2.*c),.28);c*=1.-.18*pow(length(vUv-.5)*1.3,2.6);gl_FragColor=vec4(c,1.);}`); onResize(post.resize);
K.loop((dt, t) => {
  const u = t % 16, k = Math.min(1, u / 3.2), tx = u < 10 ? -1 - 80 * (1 - k) * (1 - k) : -1 + 120 * ((u - 10) / 6) ** 2, open = u > 3.6 && u < 9.3; train.position.set(tx, 0, 0); train.position.y = u < 3.2 || u > 10 ? Math.sin(t * 22) * .015 : 0; doors.forEach(d => d.material = open ? doorOpen : doorMat);
  folk.forEach((g, i) => { const dx = g.userData.dx, lane = 3.7 + (i % 3) * .75;
    if (i < 6) { const s = u - 3.9 - i * .3; g.visible = s > 0; if (s < 1.1) { g.position.set(dx, .8, 1.7 + Math.max(0, s) / 1.1 * (lane - 1.7)); g.rotation.y = 0; } else { const x = dx + (s - 1.1) * 3.6; g.visible = x < 21.5; g.position.set(x, x > 20 ? 0 : .8, lane); g.rotation.y = Math.PI / 2; } K.walk(g, t * 10 + i, .7); }
    else { const s = u - 7.6 - (i - 6) * .4; g.visible = u < 8.9 || u > 13.5; g.position.set(dx, .8, 3.5 - Math.min(1, Math.max(0, s)) * 1.9); g.rotation.y = Math.PI; K.walk(g, t * 10, s > 0 && s < 1 ? .7 : 0); } });
  car.position.set(70 - (t * 8 + 50) % 140, 0, 13); car2.position.set((t * 7 + 30) % 150 - 80, 0, 15.2);
  const a = Math.sin(t * .2) * 2; if (tall) { cam.position.set(-30 + a, 45, 30); cam.lookAt(1, 1, 2.5); } else { cam.position.set(6 + a * 2, 40, 42); cam.lookAt(2.5, 1, 1); }
  post.render(scene, cam, t);
});
</script>
