<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6-29 冬の村のそり 白黒のリノカット</title>
<style>
html,body{margin:0;height:100%;background:#121214;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#121214;background:#f5f2e8;padding:0 6px}
</style>
<div id="cap">6-29 ─ 冬の村のそり / 黒インクと紙の白だけのリノカット　｜　見るだけ（自動ですべる）</div>
<script src="kit.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// リノカット（版画）の決まり：色は黒インクと紙の白の 2 つだけ。明るい面は白、影は黒べた。
// 中間の明るさは「彫り刀のあと」＝向きのそろった短い線にする。線の向きは面の向き（法線）で決まり、暗いほど黒が太る。
// 空は黒、雪は白い点。白い物どうしの境は黒い線、黒い物どうしの境は白い線（彫った線）
import * as THREE from 'three';
const K = KIT(THREE), { scene, cam, renderer, onResize } = K.stage({ fov: 44 }), { add, box, hash } = K;
scene.background = new THREE.Color('#000000'); scene.fog = new THREE.Fog('#000000', 90, 175);
const { sun } = K.lights(scene, renderer, { amb: .5, ground: 0xffffff, sun: 0xffffff, power: 2.6, range: 48 });
const H = (x, z) => z * .2 + Math.sin(x * .05) * Math.cos(z * .04) * 2.5 + Math.sin(z * .021 + x * .03) * 3, pathX = z => Math.sin(z * .025) * 9;   // −z へ下る雪の丘
const W = new THREE.Color('#ffffff'), land = K.terrain(H, 70, 70, 3, () => W); land.mesh.receiveShadow = true; scene.add(land.mesh);
const INK = '#1a1a1a', WALL = '#d4d4d4', P = 150, things = [];
const bare = h => { const g = new THREE.Group(); add(g, new THREE.CylinderGeometry(h * .03, h * .06, h, 5), INK, 0, h / 2, 0); for (let k = 0; k < 5; k++) { const b = add(g, new THREE.CylinderGeometry(h * .012, h * .026, h * .45, 4), INK, 0, h * (.42 + k * .11), 0); b.geometry.translate(0, h * .225, 0); b.rotation.set(0, k * 2.4, .7 + (k % 2) * .3); } return g; };
const church = () => { const g = K.house(5, 4, 9, WALL, '#ffffff', '#ffffff', true); box(g, 2.8, 9, 2.8, WALL, 0, 4.5, -5.6); add(g, new THREE.ConeGeometry(2.3, 4.5, 4), '#ffffff', 0, 11.2, -5.6).rotation.y = Math.PI / 4; box(g, .16, 1.5, .16, INK, 0, 14, -5.6); box(g, .8, .16, .16, INK, 0, 14.2, -5.6); return g; };
for (let i = 0; i < 44; i++) { const side = i % 2 ? 1 : -1, g = i === 5 ? church() : i % 5 === 0 ? K.house(4, 2.8, 5, WALL, '#ffffff', '#ffffff', true) : i % 3 === 0 ? K.pine(5 + hash(i, 4) * 3, '#5a5a5a', INK, '#ffffff') : bare(5 + hash(i, 4) * 3);
  g.rotation.y = i === 5 ? -.5 : hash(i, 5) * 6; scene.add(K.shadow(g)); things.push({ g, off: i === 5 ? 13 : side * (5.5 + hash(i, 1) * 30), z0: i === 5 ? -112 : hash(i, 2) * P }); }
// 主役：そりに乗った子ども（前は −z）
const sled = new THREE.Group(); for (const s of [-1, 1]) box(sled, .08, .12, 2, INK, s * .36, .06, 0); box(sled, .86, .08, 1.4, '#8a8a8a', 0, .3, 0);
const kid = K.person({ top: INK, bottom: '#4a4a4a', skin: '#ffffff', hat: '#ffffff', s: .9 }); kid.position.set(0, -.3, .2); kid.userData.P.legL.rotation.x = kid.userData.P.legR.rotation.x = 1.4; kid.userData.P.armL.rotation.x = kid.userData.P.armR.rotation.x = .9; sled.add(kid);
const scarf = box(sled, .16, .06, 1, '#ffffff', 0, 1, 0); scarf.geometry.translate(0, 0, .5); scarf.position.z = .3; sled.scale.setScalar(1.35); sled.rotation.order = 'YXZ'; K.shadow(sled, true, false); scene.add(sled);
const fx = K.fx(scene, 40); let pT = 0, cy = null;
const post = K.post(renderer, `mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
void main(){vec2 p=vUv*res;vec3 n=nrm(vUv);float d=dep(vUv),l=luma(src(vUv)),f=smoothstep(.8,.48,l);            // f＝黒インクの量
vec2 q=rot(-atan(n.y,n.x+.001))*p;float ln=abs(fract(q.x/7.)-.5)*2.,nick=step(.22,fract(q.y/30.+h(vec2(floor(q.x/7.),3.))));   // 彫りあとの線は、面の向きに直角
float v=1.-step(ln,f*1.15-.08)*mix(1.,nick,step(f,.75));if(d>nf.y*.9)v=0.;
vec2 o=px*2.5;float a=luma(src(vUv+vec2(o.x,0.))),b=luma(src(vUv-vec2(o.x,0.))),c=luma(src(vUv+vec2(0.,o.y))),e=luma(src(vUv-vec2(0.,o.y)));
if(edge(vUv,2.,.5,.05)>.5){if(min(min(a,b),min(c,e))>.6)v=0.;else if(max(max(a,b),max(c,e))<.5)v=1.;}            // 白どうしの境は黒い線、黒どうしは白い線
for(int i=0;i<2;i++){float s=i==0?42.:25.;vec2 g=p/s+vec2(time*.3,time*(i==0?1.5:.9))+float(i)*7.;vec2 ce=floor(g);if(length(fract(g)-.2-.6*vec2(h(ce),h(ce+9.)))<(i==0?.075:.06))v=1.;}   // 雪
gl_FragColor=vec4(mix(vec3(.07,.07,.08),vec3(.96,.95,.91),v),1.);}`, {}, { gbuf: true }); onResize(post.resize);
K.loop((dt, t) => {
  const z = -t * 12, x = pathX(z), y = H(x, z), k = innerHeight > innerWidth ? .7 : 1; cy = cy === null ? y : cy + (y - cy) * Math.min(1, dt * 6);
  sled.position.set(x, cy + .05, z); sled.rotation.set(-Math.atan((H(x, z + 1.5) - H(x, z - 1.5)) / 3), Math.atan(Math.cos(z * .025) * .225), Math.sin(t * 9) * .03); scarf.rotation.set(Math.sin(t * 11) * .2 + .15, Math.sin(t * 7) * .3, 0);
  for (const o of things) { const oz = z + 22 - (((z + 22 - o.z0) % P) + P) % P, ox = pathX(oz) + o.off; o.g.position.set(ox, H(ox, oz) - .1, oz); }
  if ((pT -= dt) < 0) { pT = .07; fx.emit('puff', x + (Math.random() - .5), cy + .3, z + 1.4, { vy: 1.6, vz: -5, spread: 1.2, life: .7, size: .7, grow: 1.6 }); } fx.update(dt);
  land.follow(x, z, -60); sun.position.set(x - 30, cy + 22, z - 14); sun.target.position.set(x, cy, z - 8);
  cam.position.set(x * .7 + 1.2, cy + 4.6, z + 9 * k); cam.lookAt(x, cy - .6, z - 8);
  post.render(scene, cam, t);
});
</script>
