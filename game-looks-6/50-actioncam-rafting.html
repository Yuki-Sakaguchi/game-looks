<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6-50 川下り 防水カメラのラフティング映像</title>
<style>
html,body{margin:0;height:100%;background:#d4f4f4;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#fff;background:#1a7a8a;padding:0 6px}
</style>
<div id="cap">6-50 ─ 川下り / 急流のラフティングを、ボートにつけた防水カメラの映像で見る　｜　見るだけ（自動で下る）</div>
<script src="kit.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 絵の決まり：ゴムボートにのせたカメラから、こぐ人のうしろ姿ごしにローポリの川をふつうに描き、仕上げで「防水カメラの映像」にする。
// 広い画角をたる型にゆがめる、レンズの水滴（その所だけ景色を小さくゆがめる）がゆっくり流れる、強い日ざしで色はあざやかに。
// 汚しは入れず、緑と水色と、ボートの黄色だけで見せる
import * as THREE from 'three';
const K = KIT(THREE), { scene, cam, renderer, onResize } = K.stage({ fov: 82, maxFov: 100, far: 700 }), { add, box, hash } = K; cam.near = .2;
scene.background = K.sky([[0, '#2a9af0'], [.45, '#9adcff'], [1, '#e8fbff']]); scene.fog = new THREE.Fog('#d4f4f4', 80, 240);
const { sun } = K.lights(scene, renderer, { range: 60, power: 3, amb: 1.5, sky: '#e8f8ff', ground: '#8ad080' });
// 川は x の方向へ流れる。400 でひとまわりする式だけで作る
const W = Math.PI * 2 / 400, riv = x => Math.sin(x * W * 2) * 14 + Math.sin(x * W * 5) * 4, dR = x => (Math.cos(x * W * 2) * 28 + Math.cos(x * W * 5) * 20) * W, lane = x => Math.sin(x * W * 6) * 2.6;
const sm = (a, b, v) => { v = Math.min(1, Math.max(0, (v - a) / (b - a))); return v * v * (3 - 2 * v); };
const H = (x, z) => { const a = Math.abs(z - riv(x)), k = sm(7, 20, a); return -1.4 + k * 9 + Math.max(0, a - 20) * .35 + Math.sin(x * W * 9 + z * .09) * Math.sin(z * .12 - x * W * 4) * 2.5 * k; };
const C = K.colors('#e4dcc0', '#5ccc4e', '#4aba4e', '#3ea250');
const land = K.terrain(H, 80, 80, 4, (y, x, z) => y < .7 ? C[0] : y > 13 ? C[3] : C[1 + (hash(Math.round(x * .3), Math.round(z * .3)) > .5)]); land.mesh.receiveShadow = true; scene.add(land.mesh);
const P = (xx, off, o) => { const s = dR(xx), l = Math.hypot(1, s); return o.set(xx - s / l * off, 0, riv(xx) + off / l); }, v3 = new THREE.Vector3();
// 水面：川にそった帯に、白い流れのすじのドット模様をはって、下流へ流す
const wtex = K.pix((i, j) => hash(j, 9) > .55 && hash(i >> 3, j) > .6 ? '#eafcff' : hash(i >> 2, j >> 1) > .5 ? '#30c2d6' : '#3ccde0', 32); wtex.minFilter = THREE.LinearMipmapLinearFilter;
{ const v = [], uv = [], idx = []; let n = 0; for (let x = 0; x <= 660; x += 3, n++) { for (const o of [-12, 12]) { P(x, o, v3); v.push(v3.x, 0, v3.z); uv.push(x / 14, o / 12); } if (n) idx.push(n * 2 - 2, n * 2 - 1, n * 2, n * 2 - 1, n * 2 + 1, n * 2); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, K.flat('#ffffff', { map: wtex, roughness: .5 })); m.receiveShadow = true; m.frustumCulled = false; scene.add(m); }
// 岩：ボートの通り道の反対がわに置き、まわりに白い泡の輪
const rocks = []; for (let i = 0; i < 64; i++) { const j = i % 32, x = (j + .5) * 12.5 + hash(j, 1) * 6 + (i >= 32 ? 400 : 0), off = (lane(x) > 0 ? -1 : 1) * (4 + hash(j, 2) * 3), r = .9 + hash(j, 3) * 1.1, g = K.rock(r, ['#8c929a', '#a2a6aa'][j % 2]);
  P(x, off, g.position).y = -.25; g.rotation.y = j; const f = add(g, new THREE.RingGeometry(r * .8, r * 1.5, 10), K.glow('#ffffff', { transparent: true, opacity: .8 }), 0, .3, 0); f.rotation.x = -Math.PI / 2; scene.add(g); rocks.push(g); }
// 両岸の森（まとめて描く。2 周ぶん）
const NT = 520, trunkI = new THREE.InstancedMesh(new THREE.CylinderGeometry(.25, .4, 2.4, 5), K.flat('#7a5a3c'), NT * 2), leafI = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1.9, 0), K.flat('#ffffff'), NT * 2), dm = new THREE.Object3D(), LC = K.colors('#3fb84a', '#2fa04a', '#62d050');
for (let i = 0; i < NT * 2; i++) { const j = i % NT, x = hash(j, 4) * 400 + (i >= NT ? 400 : 0), a = 13 + hash(j, 5) ** 2 * 80, z = riv(x) + (hash(j, 6) < .5 ? -a : a), s = .9 + hash(j, 7) * 1.1, y = H(x, z);
  dm.position.set(x, y + 1.2 * s, z); dm.scale.setScalar(s); dm.rotation.set(0, j, 0); dm.updateMatrix(); trunkI.setMatrixAt(i, dm.matrix); dm.position.y = y + 3.4 * s; dm.rotation.set(j, j * 2, 0); dm.updateMatrix(); leafI.setMatrixAt(i, dm.matrix); leafI.setColorAt(i, LC[j % 3]); }
for (const m of [trunkI, leafI]) { m.castShadow = true; m.frustumCulled = false; scene.add(m); }
const sky = new THREE.Group(); for (let i = 0; i < 5; i++) { const c = K.cloud(4); c.position.set(260 + hash(i, 8) * 80, 70 + hash(i, 9) * 50, (i - 2) * 110); sky.add(c); } scene.add(sky);
// ゴムボートと、前でこぐ 2 人。カメラはボートのうしろに固定する（ボートと一緒にゆれる）
const raft = new THREE.Group(), Y = '#ffb428', tube = (r, len, x, y, z, ax) => { add(raft, new THREE.CylinderGeometry(r, r, len, 8), Y, x, y, z).rotation[ax] = Math.PI / 2; };
tube(.45, 5, -1.1, .35, .2, 'x'); tube(.45, 5, 1.1, .35, .2, 'x'); tube(.45, 2.7, 0, .6, 2.75, 'z'); box(raft, 1.9, .12, 5, '#3a4654', 0, .12, .2); K.shadow(raft); raft.rotation.order = 'YXZ'; scene.add(raft);
const crew = [-1, 1].map(s => { const p = K.shadow(K.person({ top: '#f04a3a', bottom: '#2a4a7a', hat: '#ffffff' })), Q = p.userData.P; p.position.set(s * .8, -.05, 1.5); Q.legL.rotation.x = Q.legR.rotation.x = -1.5; raft.add(p);
  const pd = new THREE.Group(); add(pd, new THREE.CylinderGeometry(.06, .06, 1.9, 5), '#f4f0e4', 0, -.6, 0); box(pd, .08, .65, .42, '#f2c84a', 0, -1.6, 0); pd.position.set(s * 1.3, 1.3, 1.6); pd.rotation.z = s * .35; raft.add(K.shadow(pd)); return { p, Q, pd, s }; });
raft.add(cam); cam.rotation.order = 'YXZ'; onResize((w, h) => { cam.position.set(0, 1.85, w < h ? -2.3 : -.9); cam.rotation.set(w < h ? .1 : -.07, Math.PI, 0); });   // たて長では少し下がって、2 人が切れないようにする
const fx = K.fx(scene, 200);
const post = K.post(renderer, `void main(){vec2 d=vUv-.5;float asp=res.x/res.y,r2=dot(d*vec2(asp,1.),d*vec2(asp,1.))/(asp*asp*.25+.25),hl=0.,rim=0.;vec2 uv=.5+d*(1.+.3*r2)/1.3;   // たる型のゆがみ
for(int i=0;i<6;i++){float f=float(i),y=1.08-fract(h(vec2(f,3.))+time*(.02+.03*h(vec2(f,2.))))*1.16,r=.03+.03*h(vec2(f,4.));vec2 c0=vec2(.08+.84*h(vec2(f,1.))+sin(y*18.+f)*.012,y);
vec2 e=(vUv-c0)*res/min(res.x,res.y)*vec2(1.,.8)/r;float q=length(e);if(q<1.){uv-=(vUv-c0)*(1.-q*q)*1.5;hl+=smoothstep(.4,0.,length(e-vec2(-.35,.4)))*.5;rim+=smoothstep(.65,1.,q)*.22;}}   // レンズの水滴
vec3 c=src(uv);float l=luma(c);c=mix(vec3(l),c,1.2)*1.06;                                                                                  // 強い日ざし、あざやかな色
c+=vec3(1.,.95,.8)*.16*smoothstep(1.1,0.,length((vUv-vec2(.86,1.))*vec2(asp,1.)));c=c*(1.-rim)+hl;c*=1.-.25*r2*r2;gl_FragColor=vec4(c,1.);}`); onResize(post.resize);
let x = 30, sT = 0;
K.loop((dt, t) => {
  x = (x + 10 * dt / Math.hypot(1, dR(x))) % 400; const off = lane(x), s = dR(x), l = Math.hypot(1, s);
  P(x, off, raft.position).y = Math.sin(t * 3.1) * .14 + Math.sin(t * 1.9) * .08; raft.rotation.set(Math.sin(t * 2.6) * .07, Math.atan2(1, s) - Math.cos(x * W * 6) * .12, Math.sin(t * 1.7 + 1) * .06);   // 上下にゆれる
  for (const c of crew) { const ph = t * 4.5 + (c.s > 0 ? .5 : 0); c.pd.rotation.x = Math.sin(ph) * .6; c.Q.armL.rotation.x = c.Q.armR.rotation.x = -1.1 + Math.sin(ph) * .4; c.p.rotation.x = Math.sin(ph) * .12; }
  wtex.offset.x = -t * .25; land.follow(x + 100, riv(x)); sun.target.position.set(x + 30, 0, riv(x)); sun.position.set(x, 40, riv(x) + 20); sky.position.set(x, 0, riv(x));
  if ((sT -= dt) < 0) { sT = .06;                                                  // しぶき：へさき、パドル、近くの岩
    raft.localToWorld(v3.set((Math.random() - .5) * 2.6, .3, 3.2)); fx.emit('splash', v3.x, v3.y, v3.z, { vx: 9 / l, vz: 9 * s / l, vy: 2.5 + Math.random() * 2, spread: 2.5, grav: -7, life: .7, size: .6 + Math.random() * .6 });
    raft.localToWorld(v3.set(Math.random() < .5 ? -1.9 : 1.9, .1, 1.8)); fx.emit('splash', v3.x, v3.y, v3.z, { vx: 10 / l, vz: 10 * s / l, vy: 2, spread: 1.2, grav: -7, life: .45, size: .45 });
    for (let k = 0; k < 3; k++) { const r = rocks[Math.random() * 64 | 0].position; if (Math.abs(r.x - x - 30) < 40) fx.emit('splash', r.x + (Math.random() - .5) * 2, .3, r.z + (Math.random() - .5) * 2, { vy: 2 + Math.random() * 2, spread: 2, grav: -6, life: .8, size: 1 + Math.random() }); } }
  fx.update(dt); post.render(scene, cam, t);
});
</script>
</html>
