<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6-19 雲の上の空中戦 夕日 12 色のドット絵</title>
<style>
html,body{margin:0;height:100%;background:#141a44;overflow:hidden}
canvas{display:block;image-rendering:pixelated}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#fff0c0;background:#141a44;padding:0 6px}
</style>
<div id="cap">6-19 ─ 雲の上の空中戦 / 夕日の雲海の立体を、紺から クリームまでの 12 色のドット絵に描き直す　｜　見るだけ（自動で飛ぶ）</div>
<script src="kit.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// ローポリの雲海と飛行機をふつうに描いてから、横 256 ドットの粗い絵にして、夕日の 12 色（紺・あい・紫・赤紫・ばら・赤・だいだい・こはく・黄・クリーム・うす紫・うすもも）だけに丸める。
// 空のぼかしも雲のかげも、同じ 12 色を点の並びで混ぜて作る。赤いプロペラ機をうしろから追い、前の敵機 2 機をうつ
import * as THREE from 'three';
const K = KIT(THREE), { scene, cam, renderer, onResize } = K.stage({ fov: 52, far: 900 }), { add, box, hash, flat, glow } = K;
const PAL = ['#141a44', '#2a2a6a', '#5a3a8a', '#9a3a7a', '#d04a6a', '#e8503a', '#f08a3a', '#f8b050', '#fcd870', '#fff0c0', '#c8a0c8', '#f0a0a0'];
scene.background = K.sky([[0, '#141a44'], [.2, '#2a2a6a'], [.36, '#5a3a8a'], [.48, '#d04a6a'], [.56, '#f08a3a'], [.64, '#fcd870'], [1, '#fff0c0']]); scene.fog = new THREE.Fog('#f8b050', 70, 400);
const { sun } = K.lights(scene, renderer, { range: 30, sky: '#d8b0d8', ground: '#d04a6a', amb: 2, sun: '#ffd8a0', power: 2.4, pos: [-30, 26, 30] });
// 雲海：なだらかな地面を雲の色でぬる（高い所はクリーム、谷はうす紫）。その上にローポリの雲のかたまり
const H = (x, z) => (Math.sin(x * .05) + Math.cos(z * .045 + x * .02)) * 3 + Math.sin(x * .13 + 1) * Math.cos(z * .11) * 2.5 - 15;
const C = K.colors('#fff0c0', '#f0a0a0', '#c8a0c8');
const sea = K.terrain(H, 70, 70, 6, y => y > -13 ? C[0] : y > -17 ? C[1] : C[2]); sea.mesh.receiveShadow = true; scene.add(sea.mesh);
const L = 320, puffs = [...Array(26)].map((_, i) => { const g = new THREE.Group(), s = 1.4 + hash(i, 1) * 2.6, m = flat('#fff0c0'); for (const [x, y, z, r] of [[0, 0, 0, 3], [3, -.5, .5, 2.2], [-3, -.6, -.4, 2.4], [1, 1.6, -.3, 2.1], [-1.4, 1, .6, 1.7]]) add(g, new THREE.IcosahedronGeometry(r * s, 0), m, x * s, y * s, z * s).scale.y = .66;
  g.position.set((hash(i, 2) < .5 ? -1 : 1) * (12 + hash(i, 3) * 70), -11 + hash(i, 4) * 14, 0); g.userData.z0 = hash(i, 5) * L; scene.add(g); return g; });
const sunDisc = add(scene, new THREE.CircleGeometry(46, 24), glow('#fff0c0', { fog: false, side: THREE.DoubleSide }));
// 飛行機：胴・主つばさ・尾つばさ・風防・プロペラ。前は +z
function plane(c1, c2, c3) { const g = new THREE.Group(); box(g, .9, .9, 4.2, c1, 0, 0, 0); box(g, 6.6, .14, 1.3, c2, 0, .12, .5); box(g, 2.4, .1, .7, c2, 0, .12, -1.9); box(g, .12, 1, .7, c1, 0, .55, -1.9); box(g, .6, .42, .9, c3, 0, .6, .3);
  for (const x of [-2.9, 2.9]) box(g, .8, .16, 1.34, c1, x, .12, .5); add(g, new THREE.ConeGeometry(.42, .6, 6).rotateX(Math.PI / 2), '#fcd870', 0, 0, 2.4); g.userData.prop = box(g, 2.3, .16, .05, '#141a44', 0, 0, 2.5); scene.add(g); return K.shadow(g); }
const hero = plane('#e8503a', '#fcd870', '#2a2a6a'), foes = [plane('#2a2a6a', '#5a3a8a', '#fcd870'), plane('#2a2a6a', '#5a3a8a', '#fcd870')];
const shots = [...Array(10)].map(() => { const m = box(scene, .14, .14, 2.4, glow('#fcd870', { fog: false }), 0, 0, 0); m.visible = false; m.userData.v = new THREE.Vector3(); return m; });
const fx = K.fx(scene, 90), post = K.post(renderer, K.PALETTE(PAL, .1), {}, { width: 256 }); onResize(post.resize);
let sT = 0, si = 0, kT = 0; const boom = [0, 0], tp = new THREE.Vector3();
K.loop((dt, t) => {
  const z = t * 28, x = Math.sin(t * .5) * 4, y = Math.sin(t * .37) * 1.2; hero.position.set(x, y, z); hero.rotation.set(-Math.cos(t * .37) * .08, Math.cos(t * .5) * .1, -Math.cos(t * .5) * .42); hero.userData.prop.rotation.z = t * 37;
  // 敵機：7 秒で一巡（横から入る → にげる → 4.5 秒で当たって爆発 → けむりを引いて落ちる）。2 機は半分ずらす
  let aim = null; foes.forEach((f, i) => { const p = (t + 2 + i * 3.5) % 7, hit = p > 4.5, fall = hit ? p - 4.5 : 0;
    f.position.set(x * .4 + (i ? 5 : -5) + Math.sin(t * .6 + i * 2.4) * 6 + Math.max(0, 1 - p / .9) * (i ? 40 : -40), 1.6 + i * 1.4 + Math.sin(t * .8 + i) * 1.4 - fall * fall * 5, z + 15 + i * 5 + Math.sin(t * .4 + i) * 3 - fall * 5);
    f.rotation.set(fall * .5, 0, -Math.cos(t * .6 + i * 2.4) * .5 + fall * 2.2); f.userData.prop.rotation.z = t * 31; f.visible = p < 6.6;
    if (!hit) { boom[i] = 0; if (p > 2.2 && (!aim || p > aim.p)) aim = { f, p }; }
    else if (!boom[i]) { boom[i] = 1; for (let k = 0; k < 9; k++) fx.emit(k % 3 ? 'puff' : 'spark', f.position.x, f.position.y, f.position.z, { spread: 9, vz: 22, life: .7 + k * .06, size: 2 + k * .3, grow: 1.4, tint: ['#fcd870', '#f08a3a', '#fff0c0'][k % 3], fog: false, fade: false }); }
    else if (f.visible && (kT -= dt) < 0) { kT = .05; fx.emit('smoke', f.position.x, f.position.y, f.position.z, { vz: 14, vy: 1, spread: 1.5, life: 1.1, size: 1.3, grow: 1.6, tint: '#5a3a8a', fog: false, fade: false }); } });
  // 弾：ねらった敵機へまっすぐ飛ぶ光の棒。当たる前の 1 秒は敵機に火花
  if (aim && (sT -= dt) < 0) { sT = .11; const m = shots[si = (si + 1) % 10]; m.position.set(x + (si % 2 ? 1.6 : -1.6), y, z + 2); tp.copy(aim.f.position).sub(m.position).normalize(); m.userData.v.copy(tp).multiplyScalar(85); m.userData.v.z += 28; m.lookAt(m.position.x + tp.x, m.position.y + tp.y, m.position.z + tp.z); m.userData.life = .3; m.visible = true;
    if (aim.p > 3.6) fx.emit('spark', aim.f.position.x + (Math.random() - .5) * 2, aim.f.position.y + .4, aim.f.position.z - 1.5, { vz: 26, life: .25, size: 1.4, fog: false, fade: false }); }
  for (const m of shots) if (m.visible) { m.position.addScaledVector(m.userData.v, dt); if ((m.userData.life -= dt) < 0) m.visible = false; }
  fx.update(dt);
  for (const g of puffs) g.position.z = g.userData.z0 + Math.round((z + 140 - g.userData.z0) / L) * L;
  sea.follow(x, z, 170); sun.position.set(x - 30, 26, z + 30); sun.target.position.set(x, 0, z); sunDisc.position.set(x * .9 - 70, 14, z + 640);
  cam.position.set(x * .6, y * .6 + 4.4, z - 8.5); cam.lookAt(x * .8, y * .6 - .5, z + 16);
  post.render(scene, cam, t);
});
</script>
</html>
