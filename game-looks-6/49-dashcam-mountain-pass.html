<html lang="ja">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6-49 峠のドライブ ドライブレコーダーの映像</title>
<style>
html,body{margin:0;height:100%;background:#eef8f8;overflow:hidden}
canvas{display:block}
#hud{position:fixed;left:0;top:0;pointer-events:none}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#fff;background:#2a4a6a;padding:0 6px}
</style>
<div id="cap">6-49 ─ 峠のドライブ / 新緑の山道を、ドライブレコーダーの映像で走る　｜　見るだけ（自動で走る）</div>
<script src="kit.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 絵の決まり：車の前のカメラから見たローポリの山道をふつうに描き、仕上げで「ドライブレコーダーの映像」にする。
// 広い画角をたる型にゆがめる、はしの色ずれ、白くとびぎみの空、トンネルでは明るさが遅れて合う。下にボンネット、すみに日時と速度（2D の Canvas）。
// 汚しは入れず、すっきりした緑と青だけで見せる
import * as THREE from 'three';
const K = KIT(THREE), { scene, cam, renderer, onResize } = K.stage({ fov: 72, far: 900 }), { add, box, hash } = K; cam.near = .3;
scene.background = K.sky([[0, '#b8e0f4'], [.4, '#f0fafc'], [1, '#ffffff']]); scene.fog = new THREE.Fog('#eef8f8', 90, 250);
const { sun } = K.lights(scene, renderer, { range: 70, power: 2.6, amb: 1.4, sky: '#eaf6ff', ground: '#9ac890' });
// 道は x の方向へのびる。400 でひとまわりする式だけで作り、つなぎ目をなくす
const W = Math.PI * 2 / 400, road = x => Math.sin(x * W * 2) * 16 + Math.sin(x * W * 5) * 5, dR = x => (Math.cos(x * W * 2) * 32 + Math.cos(x * W * 5) * 25) * W, Hr = x => Math.sin(x * W) * 4 + Math.sin(x * W * 3) * 1.5;
const sm = (a, b, v) => { v = Math.min(1, Math.max(0, (v - a) / (b - a))); return v * v * (3 - 2 * v); }, T0 = 236, T1 = 296, tun = x => { x = (x % 400 + 400) % 400; return sm(T0 - 22, T0 - 2, x) - sm(T1 + 2, T1 + 22, x); };
// 左は山、右は谷（トンネルの所だけ右も山になる）
const H = (x, z) => { const d = z - road(x), a = Math.abs(d), k = sm(9, 23, a), w = tun(x), far = Math.max(0, a - 23), n = Math.sin(x * W * 7 + z * .07) * Math.sin(z * .13 - x * W * 3) * 2.5 * k;
  return Hr(x) - .3 + n + (d < 0 ? k * 16 + far * .45 : k * (-14 + 30 * w) + far * (-.05 + .5 * w) + sm(55, 110, a) * 45 * (1 - w)); };
const C = K.colors('#7ed45e', '#6cc65a', '#58b45c', '#a4b294');
const land = K.terrain(H, 80, 80, 4, (y, x, z) => { const a = Math.abs(z - road(x)); return a < 8 ? C[3] : C[(hash(Math.round(x * .3), Math.round(z * .3)) * 2 | 0) + (a > 60 ? 1 : 0)]; }); land.mesh.receiveShadow = true; scene.add(land.mesh);
// 道にそった帯：(はしからの横の位置, 高さ) の 2 点を道にそってつなぐ。路面・線・ガードレール・トンネルのかべに使う
function ribbon(x0, x1, oa, ya, ob, yb, mat, dash) { const v = [], idx = []; let n = 0; for (let x = x0; x <= x1; x += 2, n++) { const s = dR(x), l = Math.hypot(1, s), y = Hr(x), z = road(x); v.push(x - s / l * oa, y + ya, z + oa / l, x - s / l * ob, y + yb, z + ob / l); if (n && (!dash || (n >> 1) % 2)) idx.push(n * 2 - 2, n * 2 - 1, n * 2, n * 2 - 1, n * 2 + 1, n * 2); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3)); g.setIndex(idx); g.computeVertexNormals(); const m = new THREE.Mesh(g, mat); m.receiveShadow = true; m.frustumCulled = false; scene.add(m); return m; }
const line = K.flat('#f6f8f6', { side: 2, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }), L = 660;
ribbon(0, L, -3.5, 0, 3.5, 0, K.flat('#5e6872')); ribbon(0, L, -.1, .03, .1, .03, line, 1); ribbon(0, L, -3.3, .03, -3.1, .03, line); ribbon(0, L, 3.1, .03, 3.3, .03, line); ribbon(0, L, 4.3, .4, 4.3, .85, K.glow('#eef3f1', { side: 2 }));
// トンネル：光を受けない暗い色のかべ・天井・路面と、橙のあかり。入口と出口には門
const wall = K.glow('#3e474d', { side: 2, fog: false }); ribbon(T0, T1, -4, 0, -4, 5.2, wall); ribbon(T0, T1, 4, 0, 4, 5.2, wall); ribbon(T0, T1, -4, 5.2, 4, 5.2, K.glow('#2e353a', { side: 2, fog: false })).castShadow = true;
ribbon(T0, T1, -4, .06, 4, .06, K.glow('#343b41', { side: 2, fog: false, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 })); ribbon(T0, T1, -.1, .1, .1, .1, K.glow('#c8ccc8', { side: 2 }), 1);
for (let x = T0 + 3; x < T1; x += 6) for (const o of [-1.6, 1.6]) { const s = dR(x), l = Math.hypot(1, s); box(scene, 1.2, .1, .4, K.glow('#ffd890'), x - s / l * o, Hr(x) + 5.12, road(x) + o / l).rotation.y = -Math.atan(s); }
for (const x of [T0, T1]) { const g = new THREE.Group(), c = '#c4cac4'; g.position.set(x, Hr(x), road(x)); g.rotation.y = -Math.atan(dR(x)); for (const s of [-1, 1]) box(g, 1.2, 9, 13, c, 0, 4.5, s * 10.5); box(g, 1.2, 3.8, 34, c, 0, 7.1, 0); scene.add(K.shadow(g)); }
// 新緑の木（まとめて描く。2 周ぶん並べて、ひとまわりしても同じ並びにする）
const NT = 520, trunkI = new THREE.InstancedMesh(new THREE.CylinderGeometry(.25, .4, 2.4, 5), K.flat('#7a5a3c'), NT * 2), leafI = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1.9, 0), K.flat('#ffffff'), NT * 2), dm = new THREE.Object3D(), LC = K.colors('#6ad04a', '#4eb452', '#8ee05e');
for (let i = 0; i < NT * 2; i++) { const j = i % NT, x = hash(j, 1) * 400 + (i >= NT ? 400 : 0), a = 11 + hash(j, 2) ** 2 * 90, z = road(x) + (hash(j, 3) < .5 ? -a : a), s = .8 + hash(j, 4) * .9, y = H(x, z);
  dm.position.set(x, y + 1.2 * s, z); dm.scale.setScalar(s); dm.rotation.set(0, j, 0); dm.updateMatrix(); trunkI.setMatrixAt(i, dm.matrix); dm.position.y = y + 3.4 * s; dm.rotation.set(j, j * 2, 0); dm.updateMatrix(); leafI.setMatrixAt(i, dm.matrix); leafI.setColorAt(i, LC[j % 3]); }
for (const m of [trunkI, leafI]) { m.castShadow = true; m.frustumCulled = false; scene.add(m); }
const mt = new THREE.Group(); for (let i = 0; i < 9; i++) { const a = i / 9 * 6.283; add(mt, new THREE.ConeGeometry(170 + hash(i, 5) * 60, 70 + hash(i, 6) * 60, 7), K.glow(['#a9d2dc', '#93c4d0'][i % 2], { fog: false }), Math.cos(a) * 420, 20, Math.sin(a) * 420).rotation.y = i; } scene.add(mt);   // 遠くの山
const cars = ['#e8503a', '#f2c84a'].map(c => { const g = K.shadow(K.car(c)); scene.add(g); return g; });
scene.add(cam); const bon = box(cam, 2.4, .5, 2.2, '#2f62a8', 0, -1.3, -2.3); bon.rotation.x = .06; bon.receiveShadow = true; onResize(() => bon.position.z = -2.3 + (cam.fov - 72) * .04);   // たて長では手前に寄せて、見える量をそろえる   // ボンネットの先
const hud = Object.assign(document.createElement('canvas'), { id: 'hud' }), hx = hud.getContext('2d'); document.body.append(hud); onResize((w, h) => { hud.width = w; hud.height = h; });
function drawHud(t, kmh) { const w = hud.width, h = hud.height, f = Math.max(13, Math.min(w, h) * .036), n = 10 * 3600 + 24 * 60 + 30 + t, p = v => String(v | 0).padStart(2, '0'); hx.clearRect(0, 0, w, h);
  hx.font = `600 ${f}px ui-monospace,Menlo,monospace`; hx.fillStyle = '#fff'; hx.strokeStyle = 'rgba(20,40,60,.75)'; hx.lineWidth = f * .16; hx.lineJoin = 'round'; hx.textBaseline = 'top';
  const put = (s, x, y, al) => { hx.textAlign = al; hx.strokeText(s, x, y); hx.fillText(s, x, y); }; put(`2026/05/03 ${p(n / 3600)}:${p(n / 60 % 60)}:${p(n % 60)}`, f, f, 'left'); put(`${kmh} km/h`, w - f, f, 'right'); }
const post = K.post(renderer, `uniform float ex;
void main(){vec2 d=vUv-.5;float asp=res.x/res.y,r2=dot(d*vec2(asp,1.),d*vec2(asp,1.))/(asp*asp*.25+.25);vec2 u=d*(1.+.24*r2)/1.24;   // たる型のゆがみ
vec3 c=vec3(src(.5+u*1.004).r,src(.5+u).g,src(.5+u*.996).b)*ex;                                                                    // はしの色ずれ
float l=luma(c);c=mix(vec3(l),c,1.12);c=mix(c,vec3(1.),smoothstep(.78,1.1,l)*.85);                                                  // 明るい所は白くとぶ
c*=vec3(.98,1.01,1.03)*(1.-.3*r2*r2);gl_FragColor=vec4(c,1.);}`, { ex: { value: 1 } }); onResize(post.resize);
const P = (xx, off, o) => { const s = dR(xx), l = Math.hypot(1, s); return o.set(xx - s / l * off, Hr(xx), road(xx) + off / l); }, tgt = new THREE.Vector3();
let x = 20, ex = 1, hT = 0;
K.loop((dt, t) => {
  const v = 15 + Math.sin(t * .4) * 1.5; x = (x + v * dt / Math.hypot(1, dR(x))) % 400;                    // 左の車線を、道のりで同じ速さになるように進む
  P(x, -1.75, cam.position).y += 1.3; P(x + 14, -1.75, tgt).y += 1.4; cam.lookAt(tgt);
  land.follow(x + 100, road(x)); sun.target.position.set(x + 30, 0, road(x)); sun.position.set(x, 40, road(x) + 20); mt.position.set(x, 0, road(x));
  cars.forEach((c, i) => { const cx = x + 190 - ((t * 30 + i * 130) % 260); P(cx, 1.75, c.position); c.rotation.y = Math.atan2(-1, -dR(cx)); });   // 対向車
  ex += ((x > T0 + 4 && x < T1 - 8 ? 1.35 : 1) - ex) * Math.min(1, dt * 1.5); post.u.ex.value = ex; bon.material.color.set('#2f62a8').multiplyScalar(1 - (ex - 1) * 1.6);
  if ((hT -= dt) < 0) { hT = .5; drawHud(t, Math.round(v * 2.9)); }
  post.render(scene, cam, t);
});
</script>
