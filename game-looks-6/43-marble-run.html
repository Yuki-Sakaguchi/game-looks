<title>6-43 玉ころがし 木のレールとガラスのビー玉</title>
<style>
html,body{margin:0;height:100%;background:#f6f4ee;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#7a5a3a;background:#f6f4ee;padding:0 6px}
</style>
<div id="cap">6-43 ─ 玉ころがし / 明るい木のおもちゃと、つやのあるガラス玉　｜　見るだけ（自動でころがる）</div>
<script src="kit.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 絵の決まり：白い背景に、明るい木の色のべた塗り（濃さ 3 段）と、少しの木目の線だけ。
// 色がつくのはビー玉 3 つ（赤・青緑・黄）とかねだけ。ビー玉は半透明の玉の中に色のうずを入れ、つやの点を光らせる。
// 仕上げは軽く：やわらかい影と、画面の上下の少しのぼかし
import * as THREE from 'three';
const K = KIT(THREE), { scene, cam, renderer, onResize } = K.stage({ fov: 40 }), { add, box, flat, glow } = K;
scene.background = new THREE.Color('#f6f4ee'); scene.fog = new THREE.Fog('#f6f4ee', 30, 90);
const { sun } = K.lights(scene, renderer, { pos: [-10, 26, 22], range: 15, sky: 0xffffff, ground: 0xf4ece0, amb: 2, power: 2.1 });
const W1 = '#f6e6c6', W2 = '#eed3a4', W3 = '#ddb986', S = m => { m.castShadow = m.receiveShadow = true; return m; };
// ビー玉の通り道：[時刻, x, y, z] の点の列。といや階段は、この点に合わせて作る
const P = [[0, -8, 20, 0]]; let T = 0; const seg = (x, y, z, d) => { T += d; P.push([T, x, y, z]); };
const leg = (x, y, z = -1.05) => S(box(scene, .36, y - 2.6, .36, W3, x, (y + 2.6) / 2, z));
const trough = (ax, ay, bx, by, k1 = .1, k2 = .9) => { const g = new THREE.Group(), A = new THREE.Vector3(ax, ay, 0), B = new THREE.Vector3(bx, by, 0), len = A.distanceTo(B) + .8; g.position.copy(A).lerp(B, .5); g.lookAt(B); S(box(g, 1.5, .25, len, W2, 0, -.62, 0)); for (const s of [-1, 1]) { S(box(g, .18, .42, len, W3, s * .75, -.44, 0)); box(g, .02, .05, len * .6, W2, s * .85, -.4, 0); } scene.add(g);
  for (const k of [k1, k2]) { const q = A.clone().lerp(B, k); leg(q.x, q.y - .2); } };
seg(4, 18.2, 0, 1.6); trough(-8.6, 20.1, 4, 18.2, .5, .97); seg(5, 17, 0, .3); seg(-2, 15.6, 0, 1.3); trough(5.4, 17.1, -1.6, 15.7);
const FX = -4.5, fy = r => 13.85 + (r - .7) / 2.2 * 1.3 + .46;                      // うずまきのじょうご
for (let k = 1; k <= 36; k++) { const a = k / 36 * 15.7, r = 2.45 - 1.95 * (k / 36) ** 1.3; seg(FX + Math.cos(a) * r, fy(r), Math.sin(a) * r, .1 - k * .0012); }
{ const f = S(add(scene, new THREE.CylinderGeometry(2.95, .72, 1.3, 28, 1, true), flat(W1, { side: THREE.DoubleSide, flatShading: false }), FX, 14.5, 0)); S(add(scene, new THREE.TorusGeometry(2.95, .14, 6, 28), W3, FX, 15.15, 0)).rotation.x = Math.PI / 2; leg(FX, 14.9, -3.1); }
seg(FX, 12.1, 0, .35); seg(1, 11.2, 0, 1.2); trough(FX - .2, 12.13, 1.2, 11.17);
for (let k = 1; k <= 5; k++) { seg(.4 + k * 1.2, 11.5 - k * .6, 0, .14); seg(1 + k * 1.2, 11.2 - k * .6, 0, .14); S(box(scene, 1.2, 1.2, 1.5, k % 2 ? W1 : W2, 1 + k * 1.2, 10.1 - k * .6, 0)); leg(1 + k * 1.2, 10.7 - k * .6); }   // 階段
seg(7.8, 7.1, 0, .3); seg(-8.4, 4.7, 0, 2.6); trough(8.2, 7.16, -8.2, 4.73); seg(-9.2, 4.5, 0, .2); seg(-9.2, 20.4, 0, 3.2); seg(-8, 20, 0, .3);
const at = (tt, v) => { tt = ((tt % T) + T) % T; let i = 1; while (P[i][0] < tt) i++; const a = P[i - 1], b = P[i], k = (tt - a[0]) / (b[0] - a[0]); return v.set(a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k, a[3] + (b[3] - a[3]) * k); };
// うしろの板（木目の線つき）、台、リフトの柱と受け皿、かね
for (let i = 0; i < 7; i++) box(scene, 5 + (i * 7 % 5) * 2, .02, .05, W3, -7 + (i * 5.3) % 13, 2.61, -3.6 + i);
S(box(scene, 24, .8, 9, W1, -.6, 2.2, -.5)); const floor = add(scene, new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ opacity: .12 }), 0, 1.8, 0); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
S(box(scene, .5, 19, .5, W3, -10.3, 12, 0));  const cupL = new THREE.Group(); S(box(cupL, 1.5, .25, 1.5, W2, 0, -.62, 0)); S(box(cupL, .2, .7, 1.5, W3, .7, -.3, 0)); S(box(cupL, .5, .5, .8, W3, -.9, -.5, 0)); scene.add(cupL); let cupY = 4.5;
const bell = new THREE.Group(); bell.position.set(-2, 8.3, 0); S(add(bell, new THREE.SphereGeometry(.85, 14, 8, 0, 6.283, 0, 1.57), new THREE.MeshStandardMaterial({ color: '#f2b83a', roughness: .25, metalness: .3, side: THREE.DoubleSide }), 0, -1.5, 0)); add(bell, new THREE.CylinderGeometry(.04, .04, 1.9, 4), W3, 0, -.9, 0); add(bell, new THREE.SphereGeometry(.2, 8, 6), W3, 0, -1.9, 0); scene.add(bell); leg(-2, 8.6); S(box(scene, .3, .3, 1.2, W3, -2, 8.4, -.5)); let ring = 0;
// ガラスのビー玉 3 つ：半透明の玉と、中でまわる色のうず
const balls = ['#e8503a', '#2f9a9a', '#f2b83a'].map((c, i) => { const g = new THREE.Group(), o = add(g, new THREE.SphereGeometry(.5, 20, 14), new THREE.MeshStandardMaterial({ color: c, roughness: .05, transparent: true, opacity: .5 })); o.castShadow = true;
  const sw = add(g, new THREE.TorusKnotGeometry(.2, .09, 40, 5, 1, 2), glow(c)); sw.scale.set(1, 1.5, 1); add(g, new THREE.SphereGeometry(.09, 6, 5), glow('#ffffff'), -.2, .3, .3); g.userData = { sw, off: i * T / 3, px: 0 }; scene.add(g); return g; });
const fx = K.fx(scene, 30), look = new THREE.Vector3(), v = new THREE.Vector3(); let first = true;
const post = K.post(renderer, `void main(){float b=smoothstep(.22,.52,abs(vUv.y-.5));vec3 c=vec3(0.);for(int i=0;i<12;i++){float a=float(i)*2.4,r=sqrt(float(i)+.5)*.29;c+=src(vUv+vec2(cos(a)*res.y/res.x,sin(a))*r*b*.01);}c/=12.;
c=mix(vec3(luma(c)),c,1.12);c*=1.-.2*dot(vUv-.5,vUv-.5);gl_FragColor=vec4(c,1.);}`); onResize(post.resize);
K.loop((dt, t) => {
  let lift = 0;
  balls.forEach(b => { const u = b.userData, p = at(t + u.off, v); if (u.px > -2 && p.x <= -2 && p.y < 7) { ring = 1; for (let k = 0; k < 5; k++) fx.emit('spark', -2, 6.6, .6, { spread: 2.4, vy: 1, life: .6, size: .6, add: true, fog: false }); }
    if (p.x < -9.1 && p.y > 4.5) lift = p.y; u.px = p.x; b.position.copy(p); u.sw.rotation.set(t * 6 + u.off, t * 4, 0); });
  cupY = lift || Math.max(4.5, cupY - dt * 14); cupL.position.set(-9.2, cupY, 0); ring *= Math.exp(-dt * 1.6); bell.rotation.z = Math.sin(t * 14) * ring * .5; fx.update(dt);
  const h = balls[0].position; look.lerp(h, first ? 1 : Math.min(1, dt * 5)); first = false;
  cam.position.set(look.x * .7 + 3, look.y + 1.9, 6.4); cam.lookAt(look.x, look.y - .3, 0); sun.position.set(look.x - 10, look.y + 14, 22); sun.target.position.set(look.x, look.y, 0);
  post.render(scene, cam, t);
});
</script>
