<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6-22 海水浴場 3 色刷り</title>
<style>
html,body{margin:0;height:100%;background:#fbf7ea;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#2a5ab8;background:#fbf7ea;padding:0 6px}
</style>
<div id="cap">6-22 ─ 海水浴場 / 黄・青・蛍光ピンクの 3 色刷り（網点の重ね）　｜　見るだけ（自動でボールを追う）</div>
<script src="kit.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 3 色刷り（リソグラフ）の決まり：ローポリの海水浴場をふつうに描いてから、色を「青・蛍光ピンク・黄」の 3 つのインクの量に分け、
// それぞれ角度の違う網点にして紙へ刷り重ねる。重なった所が緑・紫・だいだいになる。3 つの版は少しずつずらす（版ずれ）。
// 主役はビーチボールを追いかける子ども。カメラは斜め上からゆっくりついていく
import * as THREE from 'three';
const K = KIT(THREE), { scene, cam, renderer, onResize } = K.stage({ fov: 38 }), { add, box, hash } = K;
scene.background = new THREE.Color('#fffaf0');
K.lights(scene, renderer, { range: 36, amb: 1.7, power: 2.2, pos: [-22, 40, 14] });
const PK = '#ff4a9a', YE = '#ffd820', BL = '#2a8ae8', WH = '#ffffff', INK = [PK, YE, BL, '#ff8a3a', '#8a5ad8', '#4ac878'], SKIN = '#ffc8a0';
const H = (x, z) => Math.min(3.2, Math.max(-2, z * .11)) + (z > 3 ? Math.sin(x * .3) * Math.cos(z * .4) * .1 : 0) + Math.max(0, z - 30) * .3;
const C = K.colors('#fff0b4', '#ffdc8a', '#8ad88a');
const land = K.terrain(H, 64, 48, 2.5, (y, x, z) => z > 31 ? C[2] : z < 2.6 ? C[1] : C[0]); land.mesh.receiveShadow = true; scene.add(land.mesh);
box(scene, 400, .1, 60, '#6ad4c0', 0, -.12, -29); box(scene, 400, .1, 200, BL, 0, -.06, -109);            // 浅い所の緑と、沖の青
const waves = [0, 1, 2, 3].map(() => box(scene, 160, .06, .6, WH, 0, 0, 0));
const parasol = (x, z, i) => { const g = new THREE.Group(); g.position.set(x, H(x, z), z); box(g, .14, 3.2, .14, WH, 0, 1.6, 0); add(g, new THREE.ConeGeometry(2.3, .9, 8), INK[i % 6], 0, 3.5, 0); box(g, 1.3, .08, 2.6, INK[(i + 2) % 6], 1.3, .06, .4); g.rotation.set(0, hash(i, 9) * 3, .08); scene.add(K.shadow(g)); };
for (let i = 0; i < 16; i++) { const x = -34 + (i >> 1) * 9.4 + (i % 2) * 4.6, z = i % 2 ? 21.5 : 15.5; if (Math.abs(x - 17) > 5) parasol(x + hash(i, 1) * 2, z + hash(i, 2) * 1.5, i); }
{ const g = new THREE.Group(), x = 17, z = 18.5; g.position.set(x, H(x, z), z); box(g, 5, 2.8, 4, '#fff4dc', 0, 1.4, 0); for (let k = 0; k < 6; k++) box(g, 1, .2, 5.6, k % 2 ? WH : PK, -2.5 + k, 3.1, -.5).rotation.x = .12; box(g, 3.6, 1, .2, BL, 0, 1.9, -2.05); scene.add(K.shadow(g)); }      // 売店（しまの屋根）
for (let i = 0; i < 7; i++) { const p = K.person({ s: 1.2, top: INK[i % 6], bottom: INK[(i + 3) % 6], skin: SKIN }), x = -30 + i * 10 + hash(i, 3) * 4, z = 3 + hash(i, 4) * 16; if (z > 3.5 && z < 12.5) p.position.set(x, H(x, 13.5), 13.5); else p.position.set(x, H(x, z), z); p.rotation.y = hash(i, 5) * 6; scene.add(K.shadow(p)); }
const rings = [0, 1, 2, 3, 4].map(i => { const g = new THREE.Group(); add(g, new THREE.TorusGeometry(.75, .28, 6, 12), i % 2 ? YE : PK, 0, 0, 0).rotation.x = Math.PI / 2; box(g, .5, .5, .5, SKIN, 0, .45, 0); box(g, .54, .16, .54, INK[i + 1], 0, .72, 0); g.position.set(-22 + i * 10 + hash(i, 6) * 4, .1, -3 - hash(i, 7) * 8); scene.add(g); return g; });
const yachts = [0, 1].map(i => { const b = K.boat(i ? YE : PK, WH); b.scale.setScalar(2.2); b.rotation.y = Math.PI / 2; scene.add(b); return b; });
const kid = K.shadow(K.person({ s: 1.5, top: PK, bottom: '#2a6ad8', skin: SKIN, hat: YE })); scene.add(kid);
const bg = new THREE.IcosahedronGeometry(.75, 0), bc = new Float32Array(180), cols = K.colors(PK, WH, BL, YE); for (let i = 0; i < 60; i++) cols[(i / 3 | 0) % 4].toArray(bc, i * 3); bg.setAttribute('color', new THREE.BufferAttribute(bc, 3));
const ball = add(scene, bg, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true })); ball.castShadow = true;
const fx = K.fx(scene, 40); let pT = 0;
const post = K.post(renderer, `mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float dotp(vec2 p,float ang,float v){vec2 f=fract(rot(ang)*p/5.2)-.5;return smoothstep(.08,-.08,length(f)-sqrt(clamp(v,0.,1.))*.72);}
vec3 sep(vec3 c){float b=clamp((1.-c.r)/.88,0.,1.),p=clamp((1.-c.g-b*.5)/.68,0.,1.),y=clamp((1.-c.b-b*.1-p*.4)/.9,0.,1.);return vec3(b,p,y);}   // 青・ピンク・黄のインクの量
void main(){vec2 p=vUv*res,o1=vec2(2.5,-1.5),o2=vec2(-2.,2.);
float k1=dotp(p,.26,sep(src(vUv)).x),k2=dotp(p+o1,1.31,sep(src(vUv+o1/res)).y),k3=dotp(p+o2,.79,sep(src(vUv+o2/res)).z);
vec3 c=vec3(.99,.97,.92)*mix(vec3(1.),vec3(1.,.88,.1),k3*.95)*mix(vec3(1.),vec3(1.,.3,.6),k2*.9)*mix(vec3(1.),vec3(.1,.5,.9),k1*.92);
gl_FragColor=vec4(c,1.);}`); onResize(post.resize);
K.loop((dt, t) => {
  const a = t * .39 + 1.2, hx = Math.cos(a) * 13, hz = 8 + Math.sin(a) * 4, bx = Math.cos(a + .3) * 13, bz = 8 + Math.sin(a + .3) * 4, tall = innerHeight > innerWidth, D = tall ? 15 : 20;
  kid.position.set(hx, H(hx, hz), hz); kid.rotation.y = Math.atan2(-Math.sin(a) * 13, Math.cos(a) * 4); K.walk(kid, t * 11, 1);
  ball.position.set(bx, H(bx, bz) + .75 + Math.abs(Math.sin(t * 4.2)) * 1.8, bz); ball.rotation.set(t * 3, t * 2, 0);
  if ((pT -= dt) < 0) { pT = .22; fx.emit('puff', hx, H(hx, hz) + .3, hz, { vy: .8, spread: .6, life: .7, size: .5, grow: 1.5, tint: '#ffe6a0' }); }
  fx.update(dt);
  waves.forEach((w, i) => { const u = (t * .12 + i / 4) % 1; w.position.set(Math.sin(i * 2) * 20, .02, -26 + u * 25.4); w.scale.set(1, 1, 1.6 - u); });
  rings.forEach((g, i) => { g.position.y = .12 + Math.sin(t * 2 + i * 2) * .12; g.rotation.y = Math.sin(t * .5 + i) * .6; });
  yachts.forEach((b, i) => { b.position.set(((t * 1.6 + i * 45) % 90) - 45, 0, -20 - i * 12); b.rotation.z = Math.sin(t + i) * .05; });
  cam.position.set(hx * .8 + Math.sin(t * .2) * 3, D * .78, hz + D * .7); cam.lookAt(hx * .9, 1.2, hz - 2.5);
  post.render(scene, cam, t);
});
</script>
