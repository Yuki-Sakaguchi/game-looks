<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6-33 山歩き 地形図の立体</title>
<style>
html,body{margin:0;height:100%;background:#efe6d2;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#6a4a34;background:#efe6d2;padding:0 6px}
</style>
<div id="cap">6-33 ─ 山歩き / 紙の地形図が立体に起き上がる（高さの色分けと等高線）　｜　見るだけ（自動で山小屋へ歩く）</div>
<script src="kit.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 地形図の決まり：地面の色は「その場所の高さ」だけで決める。高さを段に分けて 緑→黄土→茶→白 にぬり、1 段ごとに茶色の等高線
// （5 本に 1 本は太い）。川と湖は水色、森は緑の点々、道は赤い破線、うすい方眼。物は白い箱と記号だけ。
// 光と影は地図の「ぼかし」として北西から当て、仕上げでは物と尾根のふちに細い線を足すだけ
import * as THREE from 'three';
const K = KIT(THREE), { scene, cam, renderer, onResize } = K.stage({ fov: 36, fitAspect: .8 }), { add, box, hash } = K;
scene.background = new THREE.Color('#efe6d2');
const { sun } = K.lights(scene, renderer, { range: 30, amb: 1.7, power: 1.9, pos: [-28, 40, 14], ground: 0xd8d0c0 });
const WL = .8, pathZ = x => -6 + 8 * Math.sin(x * .07 + 1), riverZ = x => 8 + 4 * Math.sin(x * .12), forest = (x, z) => Math.sin(x * .13) + Math.cos(z * .11 + x * .04) > .45;
const bump = (x, z, cx, cz, h, w) => h * Math.exp(-((x - cx) ** 2 + (z - cz) ** 2) / w);
const H = (x, z) => { let y = 2.6 + Math.sin(x * .09) * Math.cos(z * .08) * 1.5 + Math.sin(x * .035 + z * .05) * 1.5 + Math.sin(x * .29 + 1) * Math.cos(z * .25) * .5 + bump(x, z, 36, -16, 16, 420) + bump(x, z, 4, -26, 9, 160) + bump(x, z, -30, -22, 8, 200) + bump(x, z, 20, 30, 7, 300) - bump(x, z, -15, 13, 6, 70);
  if (x > -10) y -= 1.1 * Math.exp(-((z - riverZ(x)) ** 2) / 2.5); const f = Math.min(1, Math.max(0, (47 - Math.max(Math.abs(x), Math.abs(z))) / 5)); return Math.max(WL, WL + (y - WL) * f); };
const land = K.terrain(H, 100, 100, 1, () => new THREE.Color(1, 1, 1)); land.mesh.receiveShadow = true; scene.add(land.mesh);
const V = c => { const q = new THREE.Color(c); return `vec3(${q.r.toFixed(3)},${q.g.toFixed(3)},${q.b.toFixed(3)})`; };
land.mesh.material.onBeforeCompile = s => {   // 地面の色を、高さと場所から地図の決まりでぬる
  s.vertexShader = s.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 wp;').replace('#include <begin_vertex>', '#include <begin_vertex>\nwp=(modelMatrix*vec4(transformed,1.)).xyz;');
  s.fragmentShader = s.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 wp;').replace('#include <color_fragment>', `
float f=wp.y/.7,b=floor(f+.5),m=max(abs(wp.x),abs(wp.z));
vec3 col=b<5.?${V('#b9d69c')}:b<8.?${V('#dfe2a6')}:b<12.?${V('#ecd49a')}:b<16.?${V('#dcb27e')}:b<21.?${V('#c8946a')}:${V('#fbf8f0')};
bool water=(wp.y<${WL}+.03&&m<40.)||(wp.x>-10.&&abs(wp.z-(8.+4.*sin(wp.x*.12)))<.75);
if(b<8.&&!water&&sin(wp.x*.13)+cos(wp.z*.11+wp.x*.04)>.45){vec2 q=wp.xz/1.5;q.x+=.5*mod(floor(q.y),2.);if(length(fract(q)-.5)<.24)col=${V('#4f9a5c')};}   // 森の記号
float d=abs(fract(f)-.5)/max(fwidth(f),1e-4),big=step(abs(mod(b,5.)),.1);col=mix(col,${V('#9a6a44')},(1.-smoothstep(.5+big*.7,1.5+big*.7,d))*.85);        // 等高線
vec2 g=abs(fract(wp.xz/8.)-.5)/fwidth(wp.xz/8.);col=mix(col,${V('#5a6a8a')},(1.-smoothstep(.3,1.2,min(g.x,g.y)))*.28);                                // 方眼
if(water)col=${V('#8cc8e8')};
float pz=-6.+8.*sin(wp.x*.07+1.);if(!water&&abs(wp.z-pz)<.3&&fract(wp.x/1.6)<.62&&wp.x>-40.&&wp.x<30.)col=${V('#e23a2a')};                                    // 道
if(m>46.)col=${V('#f6efdd')};if(m>45.6&&m<46.)col=${V('#6a4a34')};
diffuseColor.rgb=col;`); };
box(scene, 100, .8, 100, '#f6efdd', 0, .38, 0).receiveShadow = true;   // 紙の厚み
// 物は白い箱と記号：森の白い木、道しるべ、山小屋（赤い屋根と旗）、山頂の三角
const W = K.flat('#ffffff'), cones = new THREE.InstancedMesh(new THREE.ConeGeometry(.5, 1.5, 5), W, 150), dm = new THREE.Object3D(); let n = 0;
for (let i = 0; i < 900 && n < 150; i++) { const x = (hash(i, 1) - .5) * 88, z = (hash(i, 2) - .5) * 88, y = H(x, z); if (!forest(x, z) || y > 5.4 || y < WL + .2 || Math.abs(z - pathZ(x)) < 1.5 || Math.abs(z - riverZ(x)) < 1.5) continue; dm.position.set(x, y + .7, z); dm.scale.setScalar(.7 + hash(i, 3) * .7); dm.updateMatrix(); cones.setMatrixAt(n++, dm.matrix); }
cones.count = n; cones.castShadow = true; scene.add(cones);
for (let x = -30; x < 28; x += 10) { const z = pathZ(x) - 1.2, y = H(x, z); box(scene, .16, 1.3, .16, W, x, y + .65, z).castShadow = true; box(scene, .8, .3, .1, W, x + .3, y + 1.2, z).castShadow = true; }
const HX = 31, HZ = pathZ(HX) - 2.4, hut = K.shadow(K.house(3, 1.9, 3.6, '#ffffff', '#e23a2a', '#b8c0c8')); hut.position.set(HX, H(HX, HZ) - .2, HZ); scene.add(hut);
box(scene, .1, 3.4, .1, W, HX + 2.4, H(HX, HZ) + 1.7, HZ + 1); const flag = box(scene, 1, .6, .06, '#e23a2a', HX + 2.95, H(HX, HZ) + 3.1, HZ + 1);
add(scene, new THREE.ConeGeometry(.9, 1.6, 3), W, 36, H(36, -16) + .8, -16).castShadow = true;
const hero = K.shadow(K.person({ top: '#ffffff', bottom: '#ffffff', skin: '#ffffff', hat: '#e23a2a', s: 1.8 }), true, false); box(hero, .72, .9, .44, '#e23a2a', 0, 1.86, -.5); scene.add(hero);
const fx = K.fx(scene, 30); let pT = 0; const look = new THREE.Vector3();
const post = K.post(renderer, `void main(){vec3 c=src(vUv);float e=edge(vUv,1.4,3.,.03);c=mix(c,vec3(.36,.26,.2),e*.7);
vec2 v=vUv-.5;c*=vec3(1.,.985,.95)*(1.-dot(v,v)*.16);gl_FragColor=vec4(c,1.);}`, {}, { gbuf: true }); onResize(post.resize);
K.loop((dt, t) => {
  const tt = t % 18, u = Math.min(1, tt / 15), x = -34 + u * 64, z = pathZ(x), y = H(x, z), there = u >= 1;
  hero.position.set(x, y, z); hero.rotation.y = Math.atan2(1, 8 * .07 * Math.cos(x * .07 + 1)); K.walk(hero, there ? 0 : t * 9, there ? 0 : .7); hero.userData.P.armR.rotation.x = there ? -2.8 + Math.sin(t * 9) * .3 : hero.userData.P.armR.rotation.x;
  if (there && (pT -= dt) < 0) { pT = .12; fx.emit('spark', HX + (Math.random() - .5) * 5, y + 3 + Math.random() * 3, HZ + (Math.random() - .5) * 4, { life: .6, size: 1.2 }); } fx.update(dt);
  flag.rotation.y = Math.sin(t * 5) * .3;
  look.lerp(hero.position, t < .1 ? 1 : Math.min(1, dt * 3)); sun.position.set(look.x - 28, 40, look.z + 14); sun.target.position.copy(look);
  cam.position.set(look.x - 3 + Math.sin(t * .17) * 3, look.y + 21, look.z + 20); cam.lookAt(look.x + 1.5, look.y + 1, look.z - 1.5);
  post.render(scene, cam, t);
});
</script>
