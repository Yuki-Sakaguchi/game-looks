<title>LOOK 02 蝶あつめ 青写真（サイアノタイプ）</title>
<style>

<canvas id="c"></canvas>
<div id="cap">LOOK 02 ─ 蝶あつめ / 青写真（サイアノタイプ）　｜　見るだけ（自動で蝶を追う）</div>
<script>
// 青写真（日光写真のフォトグラム）に見立てる。色はプルシアンブルーと、物を置いた影の白だけ。
// 地は刷毛で薬を塗ったむらと、紙のふちの塗り残し。草や蝶は白い影絵で、うすい羽や葉は半透明の水色、線は使わず面で置く。
// 動く物は露光のあいだに動いた分だけ白い尾をひく。つかまえた蝶は上の標本の列で、黄緑の未露光からだんだん白く浮き出る
const cv = document.getElementById('c'), g = cv.getContext('2d');
const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const PAPER = '#ebe5d4', BLUE = [15, 50, 94], WH = '#f2f7fb';
let W, H, S, bg, trail, tg, C, ph, gy, mn, slots = [], spr = [];

// 蝶（真上から見た形。f は羽の開きぐあい 0〜1、kind で形が少し変わる）
function bfly(x, px, py, s, f, rot, a, kind) {
  x.save(); x.translate(px, py); x.rotate(rot); x.fillStyle = x.strokeStyle = WH; x.lineWidth = Math.max(1, s * .045); x.lineJoin = 'round';
  const k = [1, .8, 1.15, .95, 1.05, .88][kind % 6], tail = kind % 3 === 0;
  for (const sd of [-1, 1]) {
    x.save(); x.scale(sd * (f * .88 + .12), 1); x.beginPath();
    x.moveTo(0, -.05 * s); x.bezierCurveTo(.25 * s, -.8 * s * k, .98 * s, -.72 * s * k, .9 * s, -.2 * s); x.bezierCurveTo(.86 * s, .05 * s, .3 * s, .1 * s, 0, .05 * s);
    x.moveTo(0, .05 * s); x.bezierCurveTo(.5 * s, .1 * s, .78 * s / k, .45 * s, .5 * s, .7 * s); if (tail) x.lineTo(.5 * s, 1.02 * s); x.bezierCurveTo(.3 * s, .86 * s, .08 * s, .5 * s, 0, .2 * s);
    x.globalAlpha = a * .5; x.fill(); x.globalAlpha = a * .9; x.stroke();                       // うすい羽は半透明、ふちだけ濃い
    x.beginPath(); for (const [vx, vy] of [[.8, -.55 * k], [.9, -.25], [.55, -.68 * k], [.5, .6], [.62, .35]]) { x.moveTo(.04 * s, 0); x.lineTo(vx * s * .9, vy * s * .9); }
    x.lineWidth = Math.max(.7, s * .02); x.globalAlpha = a * .55; x.stroke(); x.lineWidth = Math.max(1, s * .045);

  x.restore();
}

// 蝶は種類ごとに 1 枚の絵にしておき、はばを縮めて羽ばたかせる（1 匹 = 1 回の描画ですむ）
function fly(x, px, py, s, f, rot, a, kind) { const w = s * 2.4 * (f * .88 + .12); x.save(); x.translate(px, py); x.rotate(rot); x.globalAlpha = a; x.drawImage(spr[kind % 6], -w / 2, -s * 1.15, w, s * 2.4); x.restore(); }
// 太い棒と丸（人の影絵は、これを 1 つの面にまとめて塗る）
function bar(x1, y1, x2, y2, w) { w /= 2; const dx = x2 - x1, dy = y2 - y1, l = Math.hypot(dx, dy) || 1, nx = dy / l * w, ny = -dx / l * w; g.moveTo(x1 + nx, y1 + ny); g.lineTo(x2 + nx, y2 + ny); g.lineTo(x2 - nx, y2 - ny); g.lineTo(x1 - nx, y1 - ny); g.closePath(); dot(x1, y1, w); dot(x2, y2, w); }

function resize() {

  const per = W > H ? 6 : 3, sw = Math.min(C.w / (per + .6), mn * .17), sh = sw * .86;

      x.beginPath(); x.moveTo(C.x + l0 + hash(row, j + 80) * mn * .035 * (1 + e), yy); x.lineTo(C.x + C.w + r0 - hash(row, j + 120) * mn * .035 * (1 + e), yy + (hash(row, 7) - .5) * 3); x.stroke(); }

  for (let i = 0; i < 260; i++) { const yy = C.y + hash(i, 9) * C.h, x0 = C.x + ins * .6 + hash(i, 10) * C.w * .5, l = C.w * (.2 + hash(i, 11) * .5); x.strokeStyle = hash(i, 12) < .5 ? 'rgba(120,170,215,.07)' : 'rgba(4,20,48,.10)'; x.lineWidth = 1 + hash(i, 13) * 4; x.beginPath(); x.moveTo(x0, yy); x.lineTo(Math.min(C.x + C.w - ins * .6, x0 + l), yy); x.stroke(); }
  for (let i = 0; i < 9; i++) { const cx = C.x + hash(i, 14) * C.w, cy = C.y + hash(i, 15) * C.h, r = mn * (.15 + hash(i, 16) * .25), gr = x.createRadialGradient(cx, cy, 0, cx, cy, r); gr.addColorStop(0, i % 2 ? 'rgba(70,130,190,.13)' : 'rgba(2,14,40,.16)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = gr; x.save(); x.beginPath(); x.rect(C.x + ins, C.y + ins, C.w - 2 * ins, C.h - 2 * ins); x.clip(); x.fillRect(cx - r, cy - r, r * 2, r * 2); x.restore(); }

  x.fillStyle = x.strokeStyle = WH; const by = C.y + C.h - ins * .6, n = Math.round(C.w / (mn * .075));
  const blade = (bx, len, lean, w, a) => { x.globalAlpha = a; x.beginPath(); x.moveTo(bx - w, by); x.quadraticCurveTo(bx + lean * .3, by - len * .6, bx + lean, by - len); x.quadraticCurveTo(bx + lean * .4 + w, by - len * .5, bx + w, by); x.fill(); };

    for (let k = 0; k < 15; k++) { const u = .16 + k / 15 * .84, v = 1 - u, px = v * v * bx + 2 * v * u * bx + u * u * (bx + lean), py = v * v * by + 2 * v * u * (by - len * .6) + u * u * (by - len), l = len * .21 * (1 - u * .85), tn = Math.atan2(-len * .8, lean * u * 2);
      for (const sd of [-1, 1]) { const an = tn + sd * 1.15; x.globalAlpha = a * (.55 + hash(k, bx) * .4); x.beginPath(); x.ellipse(px + Math.cos(an) * l * .5, py + Math.sin(an) * l * .5, l * .5, l * .15, an, 0, 7); x.fill(); } } };
  const puff = (bx, len, a) => { x.globalAlpha = a; x.lineWidth = Math.max(1, mn * .004); x.beginPath(); x.moveTo(bx, by); x.quadraticCurveTo(bx + len * .06, by - len * .5, bx, by - len); x.stroke(); const r = len * .16; x.lineWidth = Math.max(.7, mn * .0016); x.globalAlpha = a * .6; x.beginPath(); for (let k = 0; k < 34; k++) { const an = k / 34 * 6.283, rr = r * (.8 + hash(k, bx) * .3); x.moveTo(bx, by - len); x.lineTo(bx + Math.cos(an) * rr, by - len + Math.sin(an) * rr); } x.stroke(); x.globalAlpha = a * .8; for (let k = 0; k < 34; k++) { const an = k / 34 * 6.283, rr = r * (.8 + hash(k, bx) * .3); x.beginPath(); x.arc(bx + Math.cos(an) * rr, by - len + Math.sin(an) * rr, Math.max(.8, mn * .003), 0, 7); x.fill(); } };

  for (let i = 0; i < n * 5; i++) blade(C.x + ins + hash(i, 20) * (C.w - 2 * ins), ph * (.12 + hash(i, 21) * .3), (hash(i, 22) - .5) * ph * .2, mn * (.003 + hash(i, 23) * .004), .45 + hash(i, 24) * .5);
  for (let i = 0; i < n; i++) { const bx = C.x + ins * 1.5 + (i + .2 + hash(i, 25) * .6) / n * (C.w - 3 * ins), k = hash(i, 26), sz = ph * (.5 + hash(i, 27) * .45), side = Math.abs((bx - C.x) / C.w - .5) * 2, tall = sz * (.75 + side * .7);
    if (k < .34) fern(bx, tall, (hash(i, 28) - .5) * ph * .3, .92); else if (k < .58) puff(bx, sz * .9, .9); else if (k < .82) leaf(bx, tall * .8, (hash(i, 29) - .5) * ph * .3, 1); else { blade(bx, tall, ph * .1, mn * .006, .8); blade(bx + mn * .01, tall * .8, -ph * .12, mn * .005, .6); } }
  x.globalAlpha = 1;

  x.strokeStyle = 'rgba(242,247,251,.5)'; x.lineWidth = 1; x.setLineDash([2, 4]); for (const s of slots) x.strokeRect(s.x - s.w * .46, s.y - s.h * .46, s.w * .92, s.h * .92); x.setLineDash([]);
}
addEventListener('resize', resize); resize();

// ── 場面
const amb = [...Array(4)].map((_, i) => ({ i }));
let t = 0, last = performance.now(), px = 0, dir = 1, st = 0, mode = 'chase', caught = [], nth = 0, bx = 0, byy = 0, hx = 0, hy = 0, wash = 0, started = false, sw = 0;
function target(tt) { const cx = C.x + C.w / 2, ax = Math.max(0, C.w / 2 - ph * .75); return [cx + ax * Math.sin(tt * .55 + nth * 2.1) * .9 + ph * .12 * Math.sin(tt * 2.3), gy - ph * (1.12 + .2 * Math.sin(tt * 1.7 + nth))]; }

  if (!started) { started = true; px = C.x + C.w * .42; caught = [{ k: 0, born: -9 }, { k: 1, born: -9 }]; nth = 2; st = 1.2; [bx, byy] = target(t); }
  const top = slots[slots.length - 1].y + slots[0].h * .5;

  const restX = px + dir * ph * .42, restY = gy - ph * 1.2;
  if (mode === 'chase') {
    [bx, byy] = target(t); byy = Math.max(byy, top + ph * .2);
    const want = bx - dir * ph * .42, d = want - px; if (Math.abs(bx - px) > ph * .15) dir = bx > px ? 1 : -1; px += Math.max(-ph * 1.5 * dt, Math.min(ph * 1.5 * dt, d)); px = Math.max(C.x + ph * .3, Math.min(C.x + C.w - ph * .3, px));

  } else if (mode === 'swing') {
    const e = Math.min(1, st / .22), ee = e * e * (3 - 2 * e); hx = restX + (bx - restX) * ee; hy = restY + (byy - restY) * ee;
    if (st > .22) { mode = 'hold'; st = 0; }

  g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(bg, 0, 0); g.setTransform(S, 0, 0, S, 0, 0);
