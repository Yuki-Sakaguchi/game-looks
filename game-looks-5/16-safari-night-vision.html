<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 暗視スコープ（光を増幅する管）ごしの映像に見立てる。場面は灰色だけの 3D を小さな正方形の絵に描き、

import * as THREE from 'three';

const DPR = Math.min(devicePixelRatio || 1, 2);

const hud = document.getElementById('hud'), g = hud.getContext('2d');
const RT = new THREE.WebGLRenderTarget(448, 448);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1a1a1a); scene.fog = new THREE.Fog(0x121212, 30, 95);
const cam = new THREE.PerspectiveCamera(10, 1, .5, 200); cam.position.set(0, 1.7, 0);

  scene.add(im); }

{ const sp = new Float32Array(600); for (let i = 0; i < 200; i++) { const a = (hash(i, 41) - .5) * 2.2, e = .06 + hash(i, 42) * .5; sp[i * 3] = Math.sin(a) * 150; sp[i * 3 + 1] = Math.sin(e) * 150; sp[i * 3 + 2] = -Math.cos(a) * 150; } const ge = new THREE.BufferGeometry(); ge.setAttribute('position', new THREE.BufferAttribute(sp, 3)); scene.add(new THREE.Points(ge, new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, sizeAttenuation: false, fog: false }))); }

// しか
const deer = new THREE.Group(), dNeck = new THREE.Group(), dHead = new THREE.Group(), dLegs = [];
{ deer.add(box(.44, .52, 1.2, FUR, 0, 1.02, 0), box(.1, .14, .1, WHT, 0, 1.2, -.64));

  dNeck.add(dHead); deer.add(dNeck); const x = -3.4, z = -23.4; deer.position.set(x, gh(x, z), z); scene.add(deer); }
// きつね

{ fox.add(box(.2, .22, .62, FUR, 0, .4, 0)); for (const [x, z] of [[-.07, .24], [.07, .24], [-.07, -.24], [.07, -.24]]) { const l = box(.06, .32, .06, FUR2, x, .16, z); fox.add(l); fLegs.push(l); }
  fHead.position.set(0, .52, .36); const sn = new THREE.Mesh(new THREE.ConeGeometry(.07, .2, 4), WHT); sn.rotation.x = Math.PI / 2; sn.position.set(0, -.03, .18); fHead.add(box(.2, .17, .17, FUR), sn, eye(.03, -.06, .03, .085), eye(.03, .06, .03, .085));
  for (const s of [-1, 1]) { const e = new THREE.Mesh(new THREE.ConeGeometry(.05, .15, 3), FUR); e.position.set(s * .07, .15, -.02); fHead.add(e); }
  fTail.position.set(0, .42, -.3); const tl = new THREE.Mesh(new THREE.ConeGeometry(.1, .5, 5), FUR); tl.rotation.x = -Math.PI / 2; tl.position.z = -.25; const tp = new THREE.Mesh(new THREE.ConeGeometry(.06, .16, 5), WHT); tp.rotation.x = -Math.PI / 2; tp.position.z = -.5; fTail.add(tl, tp); fox.add(fHead, fTail); scene.add(fox); }
// ふくろう（枯れ木の枝の上）
const owl = new THREE.Group(), oHead = new THREE.Group(), oEyes = [], OW = [8.5, 3.55, -17];
{ const tx = OW[0] + .5, tz = OW[2], tr = new THREE.Mesh(new THREE.CylinderGeometry(.16, .3, 5.4, 5), lam(0x3a3a3a)); tr.position.set(tx, gh(tx, tz) + 2.7, tz); const br = new THREE.Mesh(new THREE.CylinderGeometry(.06, .1, 2.2, 4), lam(0x3a3a3a)); br.rotation.z = Math.PI / 2 - .12; br.position.set(tx - 1, OW[1] - .08, tz); const b2 = new THREE.Mesh(new THREE.CylinderGeometry(.04, .08, 1.6, 4), lam(0x3a3a3a)); b2.rotation.z = -.9; b2.position.set(tx + .6, 4.6, tz); scene.add(tr, br, b2);
  const bd = new THREE.Mesh(new THREE.IcosahedronGeometry(.2, 0), FUR); bd.scale.set(.95, 1.35, .85); bd.position.y = .27; const bl = new THREE.Mesh(new THREE.IcosahedronGeometry(.13, 0), WHT); bl.scale.set(1, 1.3, .6); bl.position.set(0, .24, .1);
  oHead.position.y = .58; const hd = new THREE.Mesh(new THREE.IcosahedronGeometry(.17, 1), FUR); hd.scale.y = .85; oHead.add(hd); for (const s of [-1, 1]) { const e = eye(.05, s * .07, .01, .135); oEyes.push(e); const tf = new THREE.Mesh(new THREE.ConeGeometry(.04, .13, 3), FUR2); tf.position.set(s * .11, .15, 0); tf.rotation.z = -s * .4; oHead.add(e, tf); } const bk = new THREE.Mesh(new THREE.ConeGeometry(.025, .07, 3), DRK); bk.rotation.x = Math.PI; bk.position.set(0, -.04, .165); oHead.add(bk);
  owl.add(bd, bl, oHead); owl.position.set(...OW); owl.rotation.y = Math.atan2(-OW[0], -OW[2]); scene.add(owl); }
// 見つける相手: 名前、ねらう点、画角、枠の大きさ（m）、発見している時間
const TG = [{ n: 'シカ', o: deer, dy: 1.05, fov: 12.5, s: 2.7, a: 1.2, b: 5.4, pt: 100 }, { n: 'キツネ', o: fox, dy: .42, fov: 4.6, s: 1.1, a: 8, b: 10.8, pt: 150 }, { n: 'フクロウ', o: owl, dy: .4, fov: 3.6, s: .86, a: 13.2, b: 16, pt: 300 }];
// 仕上げ: 緑 1 色、にじみ、粒、丸い視野
const post = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({ depthTest: false, uniforms: { tD: { value: RT.texture }, uC: { value: new THREE.Vector2() }, uR: { value: 1 }, uSeed: { value: 0 }, uCell: { value: 3 } },
  vertexShader: 'void main(){gl_Position=vec4(position.xy,0.,1.);}',
  fragmentShader: `uniform sampler2D tD;uniform vec2 uC;uniform float uR,uSeed,uCell;

 for(int i=0;i<8;i++){float a=float(i)*.7854+.3;vec2 d=vec2(cos(a),sin(a));b+=max(L(uv+d*.011)-.62,0.)+.7*max(L(uv-d.yx*.027)-.62,0.)+.4*max(L(uv+d*.05)-.7,0.);}

 l+=(n-.5)*.17*(1.2-min(l,1.))+step(.9975,n)*.5; // 粗い粒と、ときどきの光る点

 vec3 c=vec3(.0,.045,.012)+vec3(.13,1.,.3)*l+vec3(.75,.25,.7)*smoothstep(.9,1.5,l);
 c*=smoothstep(1.01,.8,r)*(1.-.25*r*r);
 gl_FragColor=vec4(c,1.);}` }));
const pScene = new THREE.Scene(); pScene.add(post); const pCam = new THREE.Camera();
let W = 1, H = 1, R = 1;
const resize = () => { W = innerWidth; H = innerHeight; renderer.setSize(W, H); hud.width = W * DPR; hud.height = H * DPR; R = Math.min(Math.max(W, H) * .37, Math.min(W, H) * .76); const u = post.material.uniforms; u.uC.value.set(W * DPR / 2, H * DPR / 2); u.uR.value = R * DPR; u.uCell.value = Math.max(2, Math.round(R * DPR / 150)); };
addEventListener('resize', resize); resize();
const aim = new THREE.Vector3(), v = new THREE.Vector3(), v2 = new THREE.Vector3();
const tpos = (k, out) => out.copy(TG[k].o.position).setY(TG[k].o.position.y + TG[k].dy);
let last = performance.now(), t = 0, fxPrev = 0;
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt; const tt = t % 18;
  // 動物の動き
  const down = tt < 3 ? 1 - ss(.4, 1.2, tt) : ss(6.2, 7.4, tt); dNeck.rotation.x = .35 + down * 1.75; dHead.rotation.x = -.3 - down * .9; dNeck.rotation.y = (1 - down) * -.55 + Math.sin(t * .7) * .05 * (1 - down);
  deer.rotation.y = Math.atan2(-deer.position.x, -deer.position.z) + .6; dHead.children[5].rotation.x = Math.max(0, Math.sin(t * 2.3)) > .96 ? .5 : 0;
  const fx = 9.4 - 2.4 * ss(5.5, 8, tt) - 3 * ss(10.9, 13.5, tt), fz = -14.5 + Math.sin(fx * .6) * .5, sp = Math.min(1, Math.abs(fx - fxPrev) / Math.max(dt, .001) / .9); fxPrev = fx;
  fox.position.set(fx, gh(fx, fz) + .02, fz); fox.rotation.y = -Math.PI / 2 + .25; const still = ss(7.6, 8.1, tt) * (1 - ss(10.7, 11, tt)); fHead.rotation.y = still * 1.2; fHead.rotation.x = (1 - still) * .25; fLegs.forEach((l, i) => l.rotation.x = Math.sin(t * 9 + (i % 3 ? 0 : Math.PI)) * .55 * sp); fTail.rotation.y = Math.sin(t * 2.2) * .35; fTail.rotation.x = .25;
  const ow = ss(12.6, 13.2, tt) * (1 - ss(16.1, 16.6, tt)); oHead.rotation.y = (1 - ow) * Math.sin(t * .9) * 1.3; oHead.rotation.z = ow * Math.sin(t * 1.3) * .22; const blink = (tt > 14.6 && tt < 14.78) || (t * .37 % 1 < .03) ? .08 : 1; oEyes.forEach(e => e.scale.y = blink);
  glints.forEach((m, i) => { m.visible = hash(i, Math.floor(t * 5 + i * .37)) > .45; m.position.x = POND[0] - 3.5 + hash(i, 2) * 7 + Math.sin(t + i) * .2; });

  const k1 = ss(5.6, 7.3, tt), k2 = ss(11, 12.7, tt), k3 = ss(16.2, 17.8, tt), mv = Math.sin(Math.PI * k1) + Math.sin(Math.PI * k2) + Math.sin(Math.PI * k3);
  tpos(0, aim); aim.lerp(tpos(1, v), k1).lerp(tpos(2, v), k2).lerp(tpos(0, v), k3);
  const fov = TG[0].fov + (TG[1].fov - TG[0].fov) * k1 + (TG[2].fov - TG[1].fov) * k2 + (TG[0].fov - TG[2].fov) * k3 + mv * 3;
  const sw = fov * .0035 * (1 + mv * 3), d = aim.length(); aim.x += (Math.sin(t * 1.1) + Math.sin(t * 2.7) * .5) * sw * d * .25 + mv * Math.sin(t * .9) * .5; aim.y += (Math.sin(t * 1.4 + 1) + Math.sin(t * 3.1) * .4) * sw * d * .2 - mv * .35;
  cam.fov = fov * (H > W ? 1.25 : 1); cam.updateProjectionMatrix(); cam.lookAt(aim);

  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, W, H); const cx = W / 2, cy = H / 2, u = R / 100; g.strokeStyle = g.fillStyle = '#b8ffc4'; g.shadowColor = '#3cff6a'; g.shadowBlur = 6; g.lineWidth = Math.max(1, u * .5); g.lineCap = 'butt';
  g.globalAlpha = .75; g.beginPath(); for (const s of [-1, 1]) { g.moveTo(cx + s * u * 5, cy); g.lineTo(cx + s * u * 62, cy); g.moveTo(cx, cy + s * u * 5); g.lineTo(cx, cy + s * u * 62); for (let i = 1; i <= 6; i++) { const q = i * 9 * u + u * 5, l = (i % 2 ? 1.6 : 3) * u; g.moveTo(cx + s * q, cy - l); g.lineTo(cx + s * q, cy + l); g.moveTo(cx - l, cy + s * q); g.lineTo(cx + l, cy + s * q); } } g.stroke();
  g.globalAlpha = .35; g.beginPath(); g.arc(cx, cy, u * 34, 0, 7); g.stroke(); g.globalAlpha = .9; g.fillRect(cx - u * .6, cy - u * .6, u * 1.2, u * 1.2);

  TG.forEach((T, k) => { if (tt >= T.a) found++; if (tt < T.a || tt > T.b) return; tpos(k, v).project(cam); const kk = 1 - .07 * (1 - Math.min(1, v.x * v.x + v.y * v.y)), sx = cx + v.x / kk * R, sy = cy - v.y / kk * R, e = tt - T.a, op = 1 + 1.2 * (1 - ss(0, .35, e)), hs = T.s / (2 * Math.tan(cam.fov * Math.PI / 360) * tpos(k, v2).distanceTo(cam.position)) * R * op, c = hs * .32;
    if (e < .5 && Math.floor(e * 16) % 2) return; g.globalAlpha = 1; g.lineWidth = Math.max(1.5, u * .9); g.beginPath(); for (const [ax, ay] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) { g.moveTo(sx + ax * hs, sy + ay * (hs - c)); g.lineTo(sx + ax * hs, sy + ay * hs); g.lineTo(sx + ax * (hs - c), sy + ay * hs); } g.stroke();

  g.globalAlpha = .85; const m = Math.max(14, Math.min(W, H) * .04), sc = TG.reduce((s, T) => s + (tt >= T.a ? T.pt : 0), 0), z = n => String(n).padStart(2, '0');
  g.textAlign = 'left'; g.fillText(`暗視 ×${(60 / cam.fov).toFixed(1)}`, m, m + 6); g.fillText(`方位 ${String(Math.round((Math.atan2(aim.x, -aim.z) * 57.3 + 360) % 360)).padStart(3, '0')}°`, m, m + 6 + fs * 1.5);
  g.textAlign = 'right'; g.fillText(`02:${z(14 + Math.floor(t / 60) % 40)}:${z(Math.floor(t % 60))}`, W - m, m + 6); g.fillText(`みつけた ${found}/3　${String(sc).padStart(4, '0')} 点`, W - m, m + 6 + fs * 1.5);
