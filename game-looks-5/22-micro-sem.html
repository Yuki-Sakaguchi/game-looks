<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 走査型電子顕微鏡（SEM）の写真に見立てる。白黒だけ。光の向きは使わず、

const FS = `uniform float uTime,uFlat,uBump,uGain;uniform vec2 uRes;varying vec3 vN,vV,vP;

const mat = (bump, gain = 1, flat = 0) => new THREE.ShaderMaterial({ uniforms: { ...U, uBump: { value: bump }, uGain: { value: gain }, uFlat: { value: flat } }, vertexShader: VS, fragmentShader: FS });
const L = 60, K = Math.PI * 2 / L, SPEED = 3;
const hgt = (x, z) => Math.sin(x * .33 + Math.sin(z * K * 2) * 1.2) * .5 + Math.sin(z * K * 3 + x * .21) * .6 + Math.sin(x * 1.3 + z * K * 9) * .12 + x * x * .014 - .6;
// 地面（でこぼこの面。進む向きに L でくり返す）
const gg = new THREE.PlaneGeometry(64, L * 3, 40, 100); gg.rotateX(-Math.PI / 2); gg.translate(0, 0, -L);
{ const p = gg.attributes.position; for (let i = 0; i < p.count; i++) p.setY(i, hgt(p.getX(i), p.getZ(i))); gg.computeVertexNormals(); }
const ground = new THREE.Mesh(gg, mat(2.6, .62)); scene.add(ground);
// 流れてくる物（z は「何 μm 先か」。L でくり返す）
const things = [], M4 = new THREE.Matrix4(), Q = new THREE.Quaternion(), V3 = (x, y, z) => new THREE.Vector3(x, y, z), UP = V3(0, 1, 0);

const inst = (geo, m, list) => { const im = new THREE.InstancedMesh(geo, m, list.length); list.forEach((a, i) => { Q.setFromUnitVectors(UP, a.dir.clone().normalize()); im.setMatrixAt(i, M4.compose(a.pos, Q, a.scl)); }); im.frustumCulled = false; return im; };
// 花粉: 球にとげ
const sphG = new THREE.IcosahedronGeometry(1, 3), spkG = new THREE.ConeGeometry(.085, .46, 6); spkG.translate(0, .2, 0);
const pollen = (x, z, s, y, k) => { const gp = new THREE.Group(), list = []; const n = 110; for (let i = 0; i < n; i++) { const yy = 1 - (i + .5) / n * 2, r = Math.sqrt(1 - yy * yy), a = i * 2.39996 + k; const d = V3(Math.cos(a) * r, yy, Math.sin(a) * r); list.push({ pos: d.clone().multiplyScalar(.98), dir: d, scl: V3(1, 1, 1) }); } gp.add(new THREE.Mesh(sphG, mat(7, 1)), inst(spkG, mat(9, 1.15), list)); gp.scale.setScalar(s); gp.rotation.set(k, k * 2, 0); return put(gp, x, z, y, .12 + hash(k) * .2); };
pollen(-5.2, 13, 2.3, 2.4, 1); pollen(4.6, 22, 1.5, 3.6, 2); pollen(6.8, 3, 1.9, 1.7, 3); pollen(-7.5, 37, 2.6, 2.2, 4); pollen(3.9, 46, 1.3, 4.4, 5); pollen(-3.6, 55, 1.2, 4.8, 6); pollen(10, 31, 2.9, 2.4, 7);
// 結晶の林: 六角柱（先がとがる）
const cryG = new THREE.LatheGeometry([new THREE.Vector2(0, 0), new THREE.Vector2(1, 0), new THREE.Vector2(1, 1), new THREE.Vector2(0, 1.28)], 6);
{ const list = [], cm = mat(14, 1.05, 1); [[7, 14], [-8.5, 24], [5.5, 34], [-5, 44], [8, 52], [-9, 4], [12, 44], [-13, 14], [14, 24], [-13, 50]].forEach(([cx, cz], c) => { const gp = new THREE.Group(), l = []; for (let i = 0; i < 9; i++) { const a = hash(c, i) * 6.28, r = i ? .4 + hash(i, c + 5) * 1.6 : 0, w = .32 + hash(c + 9, i) * .5; l.push({ pos: V3(Math.cos(a) * r, -.4, Math.sin(a) * r), dir: V3(Math.cos(a) * r * .32, 1, Math.sin(a) * r * .32), scl: V3(w, (i ? 2 : 5) + hash(i, c) * 4.5, w) }); } gp.add(inst(cryG, cm, l)); put(gp, cx, cz); }); }
// 毛: 細長い円すいの束
const hairG = new THREE.ConeGeometry(1, 1, 5, 6); hairG.translate(0, .5, 0);
{ const p = hairG.attributes.position; for (let i = 0; i < p.count; i++) { const y = p.getY(i); p.setX(i, p.getX(i) + y * y * 2.2); } hairG.computeVertexNormals(); } // しなり
{ const hm = mat(30, 1.1);[[-4.2, 5], [4.4, 9], [-6.5, 18], [9, 20], [-4.4, 29], [4.2, 40], [-9.5, 43], [7, 58], [-6, 50], [-11, 33], [11, 10]].forEach(([cx, cz], c) => { const gp = new THREE.Group(), l = []; for (let i = 0; i < 7; i++) { const a = hash(c, i + 20) * 6.28, r = hash(i, c + 30) * 1.3, w = .07 + hash(c, i + 40) * .06; l.push({ pos: V3(Math.cos(a) * r, -.3, Math.sin(a) * r), dir: V3(Math.cos(a) * .25, 1, Math.sin(a) * .25), scl: V3(w, 3 + hash(i + 50, c) * 6, w) }); } const im = inst(hairG, hm, l); gp.add(im); gp.rotation.y = hash(c, 77) * 6.28; put(gp, cx, cz); }); }
// 胞子: 小さな粒をたくさん
{ const l = []; for (let i = 0; i < 260; i++) { const x = (hash(i, 60) - .5) * 44, z = hash(i, 61) * L * 3 - L * 2.5, s = .1 + hash(i, 62) * hash(i, 63) * .55; l.push({ pos: V3(x, hgt(x, z) + s * .6, z), dir: UP, scl: V3(s, s * .85, s) }); } const im = inst(new THREE.IcosahedronGeometry(1, 1), mat(5, .95), l); ground.add(im); }
// ダニ: 丸い体に 8 本の足と毛
const mite = new THREE.Group(), legs = [];
{ const bm = mat(6, 1), body = new THREE.Mesh(sphG, bm); body.scale.set(1.7, 1.15, 2.2); body.position.y = 1.7; const head = new THREE.Mesh(sphG, bm); head.scale.set(.8, .6, .9); head.position.set(0, 1.35, -2.4); mite.add(body, head);
  const segG = new THREE.CylinderGeometry(.07, .17, 1, 7); segG.translate(0, .5, 0); const lm = mat(12, 1.1);
  for (let i = 0; i < 8; i++) { const sd = i < 4 ? 1 : -1, k = i % 4, lg = new THREE.Group(), up = new THREE.Mesh(segG, lm), lo = new THREE.Mesh(segG, lm); up.scale.set(1.2, 1.7, 1.2); up.rotation.z = -sd * 1.05; lo.scale.set(.8, 2.1, .8); lo.position.set(sd * 1.47, .85, 0); lo.rotation.z = -sd * 2.75; lg.add(up, lo); lg.position.set(sd * 1.1, 1.3, -1.5 + k * .9); lg.userData = { y: sd * (-.75 + k * .5), ph: k * 1.7 + (sd > 0 ? 0 : 3.14) }; mite.add(lg); legs.push(lg); }
  const l = []; for (let i = 0; i < 26; i++) { const a = hash(i, 80) * 6.28, e = .2 + hash(i, 81) * 1.1, d = V3(Math.cos(a) * Math.sin(e), Math.cos(e), Math.sin(a) * Math.sin(e)); l.push({ pos: V3(d.x * 1.65, 1.7 + d.y * 1.1, d.z * 2.15), dir: d, scl: V3(.035, .9 + hash(i, 82) * .8, .035) }); } mite.add(inst(hairG, mat(30, 1.2), l));
  mite.rotation.y = -1.0; put(mite, -6.2, 21, 0); }
// 探査機（主役）: 丸い胴に輪とアンテナ。帯電したように強く光る
const probe = new THREE.Group();
{ const pm = mat(20, 1.55), b = new THREE.Mesh(sphG, pm); b.scale.set(.55, .45, .75); const ring = new THREE.Mesh(new THREE.TorusGeometry(.86, .07, 8, 28), pm); ring.rotation.x = Math.PI / 2; const eye = new THREE.Mesh(sphG, pm); eye.scale.setScalar(.2); eye.position.set(0, -.05, -.74); probe.add(b, ring, eye);
  for (let i = 0; i < 3; i++) { const a = i * 2.094 + .52, pod = new THREE.Mesh(sphG, pm); pod.scale.setScalar(.17); pod.position.set(Math.cos(a) * .86, 0, Math.sin(a) * .86); probe.add(pod); }
  for (const sx of [-1, 1]) { const an = new THREE.Mesh(hairG, pm); an.scale.set(.03, 1.1, .03); an.position.set(sx * .25, .3, .35); an.rotation.set(.5, 0, -sx * .3); probe.add(an); } probe.scale.setScalar(1.35); scene.add(probe); }
let tall = false; const cap = document.getElementById('cap');
// 走査の細かさは画面によらず約 42 万画素に決め、それを画面いっぱいに引きのばす（少しやわらかい、走査像らしい絵になる）
const resize = () => { renderer.setPixelRatio(Math.min(devicePixelRatio, 2, Math.sqrt(420000 / (innerWidth * innerHeight)))); renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; tall = cam.aspect < 1; cam.fov = tall ? 74 : 50; cam.updateProjectionMatrix(); renderer.getDrawingBufferSize(U.uRes.value); document.getElementById('bar').style.paddingBottom = cap.offsetHeight + 12 + 'px'; };
addEventListener('resize', resize); resize();
const smp = document.getElementById('smp'); let last = performance.now(), t = 0, shown = -1;
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt; U.uTime.value = t;
  const s = t * SPEED; ground.position.z = s % L;
  for (const g of things) { const zr = (((g.userData.z - s + 14) % L) + L) % L - 14; g.position.z = -zr; if (g.userData.spin) g.rotation.y += dt * g.userData.spin; }
  for (const lg of legs) lg.rotation.y = lg.userData.y + Math.sin(t * 3 + lg.userData.ph) * .22; mite.position.y = hgt(-6.2, -21) + Math.sin(t * 3) * .05;

  probe.position.set(px, py, 0); probe.rotation.set(Math.sin(w * 5) * .08, -Math.cos(w * 2) * .3, -Math.cos(w * 2) * .35); probe.children[1].rotation.z = t * 2.2;

  const n = Math.floor(s / 10); if (n !== shown) { shown = n; smp.textContent = 'SAMPLE ' + String(n % 1000).padStart(3, '0'); }

requestAnimationFrame(frame);
