    const t2 = tab(d * .6); t2.rotation.set(Math.PI / 2 - .12, 0, 0); t2.rotation.order = 'YXZ'; t2.rotation.y = Math.PI / 2; t2.position.set(w / 2, .03, 0); gp.add(t2);
    const t3 = tab(h * .6, .22); t3.rotation.order = 'YXZ'; t3.rotation.z = -Math.PI / 2; t3.rotation.y = -.5; t3.position.set(w / 2 * k, h / 2, d / 2); gp.add(t3);   // 角ののりしろが少し開いている

// コース（角丸の長円）。白いふちのある灰色の紙に、白い破線
const A = 5.2, RR = 3.7, TW = 3.3, PER = 4 * A + 2 * Math.PI * RR;
function onTrack(s, off) { s = ((s % PER) + PER) % PER; const r = RR + off;
  if (s < 2 * A) return [-A + s, r, 0];
  s -= 2 * A; if (s < Math.PI * RR) { const a = s / RR; return [A + Math.sin(a) * r, Math.cos(a) * r, -a]; }

function stadium(r) { const s = new THREE.Shape(); s.moveTo(-A, r); s.lineTo(A, r); s.absarc(A, 0, r, Math.PI / 2, -Math.PI / 2, true); s.lineTo(-A, -r); s.absarc(-A, 0, r, -Math.PI / 2, Math.PI / 2, true); return s; }
function ring(ro, ri, col, y) { const s = stadium(ro); s.holes.push(stadium(ri)); const m = new THREE.Mesh(new THREE.ShapeGeometry(s, 24), new THREE.MeshStandardMaterial({ color: col, roughness: .95 })); m.rotation.x = -Math.PI / 2; m.position.y = y; m.receiveShadow = true; m.castShadow = true; scene.add(m); }
ring(RR + TW / 2 + .22, RR - TW / 2 - .22, PAPERW, .05); ring(RR + TW / 2, RR - TW / 2, '#767c86', .07);
{ const dash = new THREE.BoxGeometry(.7, .01, .12), dm = new THREE.MeshStandardMaterial({ color: '#fbf8ee' }); for (let s = 0; s < PER; s += 1.45) { const [x, z, a] = onTrack(s, 0), m = new THREE.Mesh(dash, dm); m.position.set(x, .085, -z); m.rotation.y = a; scene.add(m); }
  for (let i = 0; i < 12; i++) { const [x, z, a] = onTrack(i / 12 * PER + 1, TW / 2 + .2), t = tab(1.5, .42); t.rotation.order = 'YXZ'; t.rotation.x = -Math.PI / 2; t.rotation.y = a; t.position.set(x, .04, -z); scene.add(t); }     // コースのふちののりしろ
  const c = cvs(32, 128), x = c.getContext('2d'); for (let i = 0; i < 2; i++) for (let k = 0; k < 8; k++) { x.fillStyle = (i + k) % 2 ? '#20242c' : '#fbf8ee'; x.fillRect(i * 16, k * 16, 16, 16); } const st = plane(.8, TW, new THREE.MeshStandardMaterial({ map: tex(c) })); st.rotation.x = -Math.PI / 2; st.position.set(-1.5, .09, -RR); st.castShadow = false; scene.add(st); }

// 家・木・スタートの門
function house(x, z, ry, col, roofCol) { const gp = box(2.6, 1.7, 2, col, { front: 'house', noTop: true }); const sl = 1.5, an = Math.atan2(.95, 1);
  for (const sd of [1, -1]) { const r = plane(2.9, sl, faceMat(roofCol, 2, 'roof')); r.position.set(0, 1.7 + .47, sd * .5); r.rotation.x = sd * (Math.PI / 2 - an) - Math.PI / 2 + (sd < 0 ? 0 : 0); r.rotation.x = -Math.PI / 2 + sd * an; gp.add(r); }
  for (const sd of [1, -1]) { const s = new THREE.Shape(); s.moveTo(-1, 0); s.lineTo(1, 0); s.lineTo(0, .95); s.closePath(); const m = new THREE.Mesh(new THREE.ShapeGeometry(s), white); m.rotation.y = Math.PI / 2; m.position.set(sd * 1.27, 1.7, 0); m.castShadow = true; gp.add(m); }
  gp.position.set(x, 0, z); gp.rotation.y = ry; scene.add(gp); }
house(-1.6, .3, .25, '#f2c14e', '#d2553a'); house(2.2, -.5, -.3, '#8fc7e8', '#3f5fa8'); house(-12.2, -7.2, .7, '#f0a07a', '#7a4a8a'); house(12.5, 7, -2.4, '#bfe0a0', '#c8452c');
{ const c = cvs(128, 192), x = c.getContext('2d'); x.fillStyle = PAPERW; x.beginPath(); x.moveTo(64, 2); x.lineTo(124, 150); x.lineTo(76, 150); x.lineTo(76, 190); x.lineTo(52, 190); x.lineTo(52, 150); x.lineTo(4, 150); x.closePath(); x.fill();
  x.fillStyle = '#3f9a5a'; x.beginPath(); x.moveTo(64, 16); x.lineTo(112, 143); x.lineTo(16, 143); x.closePath(); x.fill(); x.fillStyle = '#8a5a34'; x.fillRect(57, 150, 14, 36);
  x.strokeStyle = 'rgba(20,30,20,.5)'; x.lineWidth = 2; x.setLineDash([7, 5]); x.beginPath(); x.moveTo(64, 20); x.lineTo(64, 186); x.stroke(); x.fillStyle = 'rgba(20,30,20,.6)'; x.font = '700 13px ui-monospace,monospace'; x.fillText('T4', 70, 136);
  const tm = new THREE.MeshStandardMaterial({ map: tex(c), alphaTest: .5, side: THREE.DoubleSide, roughness: .95 }), dm = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: tm.map, alphaTest: .5 });
  for (const [x0, z0, s] of [[-4.4, -.6, 1.2], [4.9, .7, 1.4], [0.3, 1.3, 1], [-11.6, 6.6, 1.5], [-9.3, 8.2, 1.1], [11.8, -6.4, 1.4], [9.2, -8, 1.1], [0, -8.6, 1.3], [-3.5, 8.9, 1.2], [5, 9, 1]])
    for (const ry of [.3, .3 + Math.PI / 2]) { const m = plane(1.6 * s, 2.4 * s, tm); m.customDepthMaterial = dm; m.position.set(x0, 1.2 * s, z0); m.rotation.y = ry + x0; scene.add(m); } }     // 十字に組んだ木
{ const c = cvs(256, 64), x = c.getContext('2d'); x.fillStyle = PAPERW; x.fillRect(0, 0, 256, 64); x.fillStyle = '#d2553a'; x.fillRect(5, 5, 246, 54); x.fillStyle = '#fffdf4'; x.font = '900 40px "Arial Black",Arial,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('START', 128, 35);
  const b = plane(TW + 1, 1, new THREE.MeshStandardMaterial({ map: tex(c), side: THREE.DoubleSide })); b.rotation.y = Math.PI / 2; b.position.set(-1.5, 3, -RR); scene.add(b);
  for (const sd of [1, -1]) { const p = box(.3, 3.4, .3, '#fbf8ee', { tabs: false }); p.position.set(-1.5, 0, -RR + sd * (TW / 2 + .45)); scene.add(p); const t = tab(.8, .4); t.rotation.x = -Math.PI / 2; t.rotation.z = sd > 0 ? Math.PI : 0; t.position.set(-1.5, .04, -RR + sd * (TW / 2 + .6)); scene.add(t); } }
// 机の上の道具: のり（筒）と、はさみの大きな影
const props = new THREE.Group(); scene.add(props);
{ const glue = new THREE.Group(), b1 = new THREE.Mesh(new THREE.CylinderGeometry(.75, .75, 3.4, 20), new THREE.MeshStandardMaterial({ color: '#f2b63a', roughness: .6 })), b2 = new THREE.Mesh(new THREE.CylinderGeometry(.78, .78, 1.1, 20), new THREE.MeshStandardMaterial({ color: '#d2553a', roughness: .6 })); b2.position.y = 2.2; b1.castShadow = b2.castShadow = true; glue.add(b1, b2); glue.rotation.z = Math.PI / 2; glue.rotation.y = .5; glue.position.set(-12.5, .76, 9.6); props.add(glue);

// 紙の車
function car(col, num) { const gp = new THREE.Group(), body = box(2.1, .5, 1.05, col, { side: 'stripe', top: 'stripe', tabs: false }), cab = box(1, .42, .9, col, { front: 'win', side: 'win', top: String(num), tabs: false });

const cars = [car('#e0483a', 1), car('#3a78d8', 2), car('#f2c230', 3)].map((m, i) => ({ m, i, s: 6 + i * 3.2 }));

let t = 0, last = performance.now(), stepN = -1;
