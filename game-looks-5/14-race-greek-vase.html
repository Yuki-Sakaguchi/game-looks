  // 3) 壺の輪郭に合わせて、横の帯ごとに幅を変えて画面へ
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#14100d'; g.fillRect(0, 0, cv.width, cv.height);
  const gr = g.createRadialGradient(cv.width / 2, cv.height * .45, 0, cv.width / 2, cv.height * .45, Math.max(cv.width, cv.height) * .6); gr.addColorStop(0, '#4a3a2c'); gr.addColorStop(1, '#14100d'); g.fillStyle = gr; g.fillRect(0, 0, cv.width, cv.height);
  if (W <= H) { const hy = (yc - 1.75 * R0) * ps; g.strokeStyle = '#0d0907'; g.lineWidth = 26 * ps; for (const s of [-1, 1]) { g.beginPath(); g.moveTo(cv.width / 2 + s * 112 * ps, hy - 150 * ps); g.bezierCurveTo(cv.width / 2 + s * 270 * ps, hy - 190 * ps, cv.width / 2 + s * 290 * ps, hy + 40 * ps, cv.width / 2 + s * 215 * ps, hy + 110 * ps); g.stroke(); } }   // 取っ手
  const sh = (W > H ? 3 : 1) * S; for (let y = 0; y < ch; y += sh) { const r = prof((y / ps - yc) / R0) / R0; if (r > 0) g.drawImage(cyl, 0, y, cw, sh, cv.width / 2 - Rpx * S * r, y, 2 * Rpx * S * r, sh + .5); }
  requestAnimationFrame(frame);
}
