<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// うしろから押すと金属のピンが前に出るおもちゃ（ピンスクリーン）に見立てる。色は使わず、絵は「ピンの高さ」だけ。

import * as THREE from 'three';
const TALL = innerHeight > innerWidth * 1.1;                      // たて長の画面では、たて長の盤にする
const GW = TALL ? 40 : 60, GH = TALL ? 60 : 40, N = GW * GH, HUD = 7;

renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15; document.body.prepend(renderer.domElement);

  renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
  const th = Math.tan(cam.fov * Math.PI / 360), d = Math.max((GH / 2 + 5) / th, (GW / 2 + 5) / (th * cam.aspect)) * 1.04;
  const dir = new THREE.Vector3(-.13, -.32, 1).normalize(); cam.position.copy(dir.multiplyScalar(d)); cam.lookAt(0, -.5, 0);
}; addEventListener('resize', resize); resize();
// 金属のうつりこみ用の部屋（明るい窓 2 枚と暗い壁）をその場で作る
{ const es = new THREE.Scene(), bx = new THREE.Mesh(new THREE.BoxGeometry(40, 40, 40), new THREE.MeshBasicMaterial({ color: '#15161a', side: THREE.BackSide })); es.add(bx);
  const pan = (c, w, h, x, y, z) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(4), side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); es.add(m); };
  pan('#ffffff', 16, 10, -12, 14, 12); pan('#aab8d8', 10, 22, 17, -2, 8); pan('#ffd9b0', 12, 5, 0, -17, 10); pan('#6a7080', 30, 30, 0, 0, 19);
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(es, .03).texture; }
const sun = new THREE.DirectionalLight(0xffffff, 4.5); sun.position.set(-34, 30, 24); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
{ const c = sun.shadow.camera, r = Math.max(GW, GH) * .62; c.left = -r; c.right = r; c.top = r; c.bottom = -r; c.near = 5; c.far = 120; sun.shadow.bias = -.0015; sun.shadow.normalBias = .05; } scene.add(sun);
// 黒い板とふち
const board = new THREE.Mesh(new THREE.PlaneGeometry(GW + 1.4, GH + 1.4), new THREE.MeshStandardMaterial({ color: '#050506', roughness: .55, metalness: .2 })); board.position.z = .12; board.receiveShadow = true; scene.add(board);
{ const fm = new THREE.MeshStandardMaterial({ color: '#101114', roughness: .35, metalness: .6 }); for (const [w, h, x, y] of [[GW + 5, 1.8, 0, GH / 2 + 1.6], [GW + 5, 1.8, 0, -GH / 2 - 1.6], [1.8, GH + 1.4, GW / 2 + 1.6, 0], [1.8, GH + 1.4, -GW / 2 - 1.6, 0]]) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 3.4), fm); m.position.set(x, y, .4); m.castShadow = m.receiveShadow = true; scene.add(m); } }
// ピン: 丸い頭の金属の棒。1 本ずつ前後（z）にだけ動く
const pinG = new THREE.CapsuleGeometry(.43, 3, 2, 7); pinG.rotateX(Math.PI / 2);
const pins = new THREE.InstancedMesh(pinG, new THREE.MeshStandardMaterial({ color: '#e4e8f0', metalness: 1, roughness: .2, envMapIntensity: 1.25 }), N); pins.castShadow = pins.receiveShadow = true; pins.frustumCulled = false; scene.add(pins);
const M = pins.instanceMatrix.array, col = new Float32Array(N * 3); pins.instanceColor = new THREE.InstancedBufferAttribute(col, 3);
for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) { const k = (j * GW + i) * 16; M[k] = M[k + 5] = M[k + 10] = M[k + 15] = 1; M[k + 12] = i - (GW - 1) / 2; M[k + 13] = (GH - 1) / 2 - j; }
const tg = new Float32Array(N), h = new Float32Array(N), v = new Float32Array(N), trail = new Float32Array(N);
const put = (i, j, a) => { if (i >= 0 && j >= 0 && i < GW && j < GH) { const k = j * GW + i; if (a > tg[k]) tg[k] = a; } };
const box = (x, y, w, hh, a) => { for (let j = y; j < y + hh; j++) for (let i = x; i < x + w; i++) put(i, j, a); };
const DIG = ['111101101101111', '010110010010111', '111001111100111', '111001111001111', '101101111001001', '111100111001111', '111100111101111', '111001010010010', '111101111101111', '111101111001111'];

// ゲーム（ます目の単位）
const COLS = Math.floor((GW - 4) / 6), ROWS = TALL ? 6 : 4, BX0 = Math.floor((GW - COLS * 6 + 1) / 2), BY0 = HUD + 3;
const bricks = []; for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) bricks.push({ x: BX0 + c * 6, y: BY0 + r * 3, r, alive: true, s: 1, born: 0 });
const PY = GH - 4, SPD = 30; let bx, by, vx, vy, px, score = 0, lives = 3, waves = [], roundT = 0;
function serve() { bx = GW * .4; by = PY - 9; const a = -.95; vx = Math.cos(a) * SPD; vy = Math.sin(a) * SPD; px = bx; }
serve();
function sim(dt, t) {
  roundT += dt;
  if (bricks.every(b => !b.alive) || roundT > 19) { roundT = 0; bricks.forEach((b, i) => { b.alive = true; b.born = t + (b.r * COLS + i % COLS) * .035; }); }
  for (let s = 0; s < 4; s++) {
    const d = dt / 4; bx += vx * d; by += vy * d;
    if (bx < 1.6) { bx = 1.6; vx = Math.abs(vx); } if (bx > GW - 2.6) { bx = GW - 2.6; vx = -Math.abs(vx); }
    if (by < HUD + 1.6) { by = HUD + 1.6; vy = Math.abs(vy); }
    if (vy > 0 && by > PY - 1.2 && by < PY + 1 && Math.abs(bx - px) < 6) { const o = (bx - px) / 6, a = -Math.PI / 2 + o * .95 + (Math.abs(o) < .15 ? .22 * Math.sign(vx || 1) : 0); vx = Math.cos(a) * SPD; vy = Math.sin(a) * SPD; waves.push({ x: bx, y: PY, t, a: .16 }); }
    if (by > GH + 3) serve();
    for (const b of bricks) if (b.alive && t > b.born && bx > b.x - .9 && bx < b.x + 5.9 && by > b.y - .9 && by < b.y + 2.9) {
      b.alive = false; score = (score + 1) % 1000; waves.push({ x: b.x + 2.5, y: b.y + 1, t, a: .42 });
      const ox = Math.min(bx - (b.x - .9), b.x + 5.9 - bx), oy = Math.min(by - (b.y - .9), b.y + 2.9 - by); if (ox < oy) vx = -vx; else vy = -vy; break;
    }
  }
  // パドルは、玉が落ちてくる所へ先まわりする
  let aim = bx; if (vy > 0) { let x = bx + vx * (PY - by) / vy, lo = 1.6, hi = GW - 2.6, w = hi - lo; x = ((x - lo) % (2 * w) + 2 * w) % (2 * w); aim = lo + (x > w ? 2 * w - x : x); }
  px += Math.max(-46 * dt, Math.min(46 * dt, aim - px)); px = Math.max(5.5, Math.min(GW - 6.5, px));
  waves = waves.filter(w => t - w.t < 1.6);
}
function paint(dt, t) {
  tg.fill(0);
  for (let j = HUD; j < GH; j++) { put(0, j, .5); put(GW - 1, j, .5); } for (let i = 0; i < GW; i++) put(i, HUD, .5);
  const sc = String(score).padStart(3, '0'); for (let d = 0; d < 3; d++) for (let q = 0; q < 15; q++) if (DIG[+sc[d]][q] === '1') put(GW - 13 + d * 4 + q % 3, 1 + (q / 3 | 0), .8);
  for (let l = 0; l < lives; l++) box(2 + l * 4, 2, 2, 2, .8);
  for (const b of bricks) { b.s += ((b.alive && t > b.born ? 1 : 0) - b.s) * Math.min(1, dt * 14); if (b.s > .02) { const a = (1 - b.r * .1) * b.s; box(b.x, b.y, 5, 2, a); } }
  const pl = Math.round(px); box(pl - 4, PY, 9, 2, .85); put(pl - 5, PY, .5); put(pl + 5, PY, .5); put(pl - 5, PY + 1, .5); put(pl + 5, PY + 1, .5);
  const R = 2.5, ex = Math.exp(-dt * 3.2);
  for (let k = 0; k < N; k++) trail[k] *= ex;
  for (let j = Math.floor(by - R); j <= by + R; j++) for (let i = Math.floor(bx - R); i <= bx + R; i++) { const d2 = (i - bx) ** 2 + (j - by) ** 2; if (d2 < R * R) { put(i, j, 1.3 * Math.sqrt(1 - d2 / (R * R)) + .15); if (i >= 0 && j >= 0 && i < GW && j < GH) trail[j * GW + i] = .32; } }
  for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
    const k = j * GW + i; let a = tg[k] + (tg[k] < .3 ? trail[k] : 0);
    for (const w of waves) { const age = t - w.t, ph = Math.hypot(i - w.x, j - w.y) - age * 22; a += w.a * Math.exp(-age * 2.4) * Math.cos(ph * .8) * Math.exp(-ph * ph / 14); }

  }

}

</script>
