<title>LOOK 06 陣取りストラテジー 厚紙を重ねた地形模型</title>
<style>
html,body{margin:0;height:100%;background:#2c5d50;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#eaf3e6;opacity:.9}
#hud{position:fixed;top:14px;left:0;right:0;display:flex;justify-content:center;gap:10px;font:700 20px/1 ui-monospace,Menlo,monospace;pointer-events:none}
#hud b{display:block;min-width:54px;padding:8px 10px 8px 22px;text-align:right;color:#fff;box-shadow:2px 3px 0 rgba(0,0,0,.28);position:relative;transform:rotate(-2deg)}

<div id="hud"><b id="sr" style="background:#e2463c">0</b><b id="sb" style="background:#2f55c8">0</b></div>
<div id="cap">LOOK 06 ─ 陣取りストラテジー / 厚紙を重ねた地形模型　｜　見るだけ（自動で旗を立てあう）</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 見立て: カッターマットの上に置いた、厚紙を等高線の形に切って重ねた島の地形模型。
// 決まり: 地形は「同じ厚さの板」を積むだけ（斜面なし）。板の上面は色紙、切り口は段ボールの波の断面。
// 海は青い紙の台。低い斜めの光 1 つで段ごとに影を落とす。コマは木の棒の紙旗と丸シール、本陣は待ち針
import * as THREE from 'three';
const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#2c5d50');
const cam = new THREE.PerspectiveCamera(30, 1, .5, 300);
const resize = () => { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }; addEventListener('resize', resize); resize();
scene.add(new THREE.HemisphereLight(0xffffff, 0x8b8f9c, 1.25));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.7); sun.position.set(-9, 4.6, 3.5); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 30 }); sun.shadow.bias = -.0004; sun.shadow.normalBias = .015; scene.add(sun);
renderer.shadowMap.autoUpdate = false; renderer.shadowMap.needsUpdate = true;   // 影は、旗がささった時だけ描き直す（軽くするため）

// 紙の地（細かいむら）、段ボールの切り口、カッターマットの方眼
const tex = (w, h, draw, rx = 1, ry = 1) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d')); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 8; return t; };
const paperT = tex(128, 128, c => { const im = c.createImageData(128, 128); for (let i = 0; i < 128 * 128; i++) { const v = 242 + Math.random() * 13; im.data.set([v, v, v, 255], i * 4); } c.putImageData(im, 0, 0); c.strokeStyle = 'rgba(255,255,255,.5)'; for (let i = 0; i < 60; i++) { c.beginPath(); const x = Math.random() * 128, y = Math.random() * 128; c.moveTo(x, y); c.lineTo(x + Math.random() * 14 - 7, y + Math.random() * 14 - 7); c.stroke(); } }, .7, .7);
const drawFlute = c => { c.fillStyle = '#d2b383'; c.fillRect(0, 0, 64, 32); c.fillStyle = '#9c7848'; c.fillRect(0, 0, 64, 5); c.fillRect(0, 27, 64, 5); c.fillStyle = '#5d4426'; c.fillRect(0, 5, 64, 22); c.strokeStyle = '#c9a674'; c.lineWidth = 3.2; c.beginPath(); for (let x = -2; x <= 66; x++) { const y = 16 + Math.sin(x / 64 * Math.PI * 8) * 9.5; x < 0 ? c.moveTo(x, y) : c.lineTo(x, y); } c.stroke(); };
const TH = .17, fluteT = tex(64, 32, drawFlute, 3, 1 / TH), fluteB = tex(64, 32, drawFlute, 40, 2);
const matT = tex(128, 128, c => { c.fillStyle = '#2c5d50'; c.fillRect(0, 0, 128, 128); c.strokeStyle = '#6fa894'; c.lineWidth = 2; c.strokeRect(0, 0, 128, 128); c.strokeStyle = 'rgba(111,168,148,.45)'; c.lineWidth = 1; for (let i = 1; i < 4; i++) { c.beginPath(); c.moveTo(i * 32, 0); c.lineTo(i * 32, 128); c.moveTo(0, i * 32); c.lineTo(128, i * 32); c.stroke(); } }, 80, 80);
const paper = c => new THREE.MeshStandardMaterial({ color: c, map: paperT, roughness: 1 });
const sideM = new THREE.MeshStandardMaterial({ map: fluteT, roughness: 1 }), sideB = new THREE.MeshStandardMaterial({ map: fluteB, roughness: 1 });
const mat = new THREE.Mesh(new THREE.PlaneGeometry(160, 160), new THREE.MeshStandardMaterial({ map: matT, roughness: .8 })); mat.rotation.x = -Math.PI / 2; mat.position.y = -.34; mat.receiveShadow = true; scene.add(mat);
const seaM = paper('#2a6da6'), board = new THREE.Mesh(new THREE.BoxGeometry(13.4, .34, 10.6), [sideB, sideB, seaM, seaM, sideB, sideB]); board.position.y = -.17; board.castShadow = board.receiveShadow = true; scene.add(board);

// 島: いくつかの山を、それぞれ等高線の輪（角度ごとの半径）で決める。高さ k の板 = その輪で切った厚紙
const HILLS = [{ x: -.5, z: -.2, R: 3.9, top: 8, ox: .7, oz: -.5, p: 1.3 }, { x: -3.3, z: 1.7, R: 2.5, top: 4, ox: -.2, oz: .3, p: 4.1 }, { x: 2.9, z: -1.9, R: 2.6, top: 5, ox: .5, oz: -.2, p: 2.2 }, { x: 4.6, z: 2.9, R: 1.25, top: 2, ox: 0, oz: 0, p: 5.5 }, { x: 1.2, z: 2.6, R: 1.9, top: 3, ox: .1, oz: .2, p: .4 }];
const COL = ['#86c0dc', '#eedda6', '#c3d98c', '#93c172', '#62a55e', '#dcc46e', '#cb9c57', '#a9754b', '#f3eee4'];
const ctr = (h, k) => [h.x + h.ox * k / h.top, h.z + h.oz * k / h.top];
const rAt = (h, k, a) => h.R * (k === 0 ? 1.17 : Math.pow(1 - (k - 1) / h.top, .85)) * (1 + .15 * Math.sin(3 * a + h.p) + .09 * Math.sin(5 * a + h.p * 2.3) + .045 * Math.sin(9 * a + h.p * 3.1) + .035 * Math.sin(4 * a + k * 1.7));
const levelAt = (x, z) => { let L = -1; for (const h of HILLS) for (let k = h.top; k > L; k--) { const [cx, cz] = ctr(h, k), dx = x - cx, dz = z - cz; if (Math.hypot(dx, dz) < rAt(h, k, Math.atan2(dz, dx))) { L = k; break; } } return L; };
const topM = COL.map(paper);
for (const h of HILLS) for (let k = 0; k <= h.top; k++) {
  const [cx, cz] = ctr(h, k), pts = []; for (let i = 0; i < 80; i++) { const a = i / 80 * Math.PI * 2, r = rAt(h, k, a); pts.push(new THREE.Vector2(cx + Math.cos(a) * r, -(cz + Math.sin(a) * r))); }
  const g = new THREE.ExtrudeGeometry(new THREE.Shape(pts), { depth: TH, bevelEnabled: false }); g.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, [topM[k], sideM]); m.position.y = k * TH + hash(k, h.p) * .002; m.castShadow = m.receiveShadow = true; scene.add(m);
}

// 陣地のマス（六角にならべた点のうち、平らな陸の上にあるもの）
const SP = .84, sites = [];
for (let j = -8; j <= 8; j++) for (let i = -10; i <= 10; i++) { const x = (i + (j & 1) * .5) * SP, z = j * SP * .866, L = levelAt(x, z); if (L < 1) continue; if ([[.17, 0], [-.17, 0], [0, .17], [0, -.17]].some(([a, b]) => levelAt(x + a, z + b) !== L)) continue; sites.push({ x, z, y: (L + 1) * TH, own: 0, at: -9, nb: [] }); }
sites.forEach((s, i) => sites.forEach((o, k) => { if (i !== k && Math.hypot(s.x - o.x, s.z - o.z) < SP * 1.6) s.nb.push(k); }));
const TEAM = [null, '#e2463c', '#2f55c8'], wood = new THREE.MeshStandardMaterial({ color: '#dcc095', roughness: .8 });
const flagM = TEAM.map(c => c && new THREE.MeshStandardMaterial({ color: c, map: paperT, roughness: 1, side: THREE.DoubleSide })), headM = TEAM.map(c => c && new THREE.MeshStandardMaterial({ color: c, roughness: .25 }));
const tri = new THREE.BufferGeometry(); tri.setAttribute('position', new THREE.Float32BufferAttribute([0, .78, 0, 0, .46, 0, .46, .62, 0], 3)); tri.computeVertexNormals();
for (const s of sites) {
  const gp = new THREE.Group(), pole = new THREE.Mesh(new THREE.CylinderGeometry(.028, .028, .8, 6), wood); pole.position.y = .4; pole.castShadow = true;
  s.flag = new THREE.Mesh(tri, flagM[1]); s.flag.castShadow = true; gp.add(pole, s.flag); gp.rotation.y = (hash(s.x, s.z) - .5) * .9;
  s.dot = new THREE.Mesh(new THREE.CircleGeometry(.27, 20), flagM[1]); s.dot.rotation.x = -Math.PI / 2; s.dot.position.set(s.x, s.y + .006, s.z); s.dot.receiveShadow = true;
  s.gp = gp; gp.visible = s.dot.visible = false; scene.add(gp, s.dot);
}
// 本陣の待ち針
const byX = sites.filter(s => s.nb.length >= 4).sort((a, b) => (a.x - a.z * .3) - (b.x - b.z * .3)), bases = [null, byX[0], byX[byX.length - 1]];
[1, 2].forEach(tm => { const b = bases[tm], pin = new THREE.Group(), n = new THREE.Mesh(new THREE.CylinderGeometry(.018, .018, 1.2, 6), new THREE.MeshStandardMaterial({ color: '#c8ccd2', metalness: .8, roughness: .3 })), hd = new THREE.Mesh(new THREE.SphereGeometry(.17, 16, 12), headM[tm]); n.position.y = .6; hd.position.y = 1.25; n.castShadow = hd.castShadow = true; pin.add(n, hd); pin.position.set(b.x + .22, b.y, b.z + .1); pin.rotation.z = tm === 1 ? .12 : -.1; scene.add(pin); b.base = tm; });

// 陣取りの進み方: 0.42 秒ごとに交代で、自分の陣地のとなりを 1 マス取る（空きマス優先、なければ相手のマス）
let last = performance.now(), t = 0, round = 0, tick = 0, turn = 0, seed = 1;
const sr = document.getElementById('sr'), sb = document.getElementById('sb');
function take(tm, now) {
  const mine = sites.filter(s => s.own === tm), cand = new Set(); for (const s of mine) for (const k of s.nb) if (sites[k].own !== tm && !sites[k].base) cand.add(k);
  let list = [...cand].filter(k => sites[k].own === 0); if (!list.length || hash(seed, 7) < .22) list = [...cand].length ? [...cand] : list; if (!list.length) return;
  const s = sites[list[Math.floor(hash(seed++, 3) * list.length)]]; s.own = tm; s.at = now;
}
function reset(now) { for (const s of sites) { s.own = s.base || 0; s.at = now - 9; } for (let i = 0; i < 10; i++) take(1 + i % 2, now - 9); turn = 0; tick = 0; }
reset(0);
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt; round += dt; tick += dt;
  if (round > 17) { round = 0; reset(t); for (const s of sites) if (s.own) s.at = t - hash(s.x, 9) * .4 + .4; }
  else if (round < 15.6 && tick > .34) { tick = 0; take(1 + turn++ % 2, t); }
  const leave = Math.max(0, (round - 16.2) / .8); let n1 = 0, n2 = 0; if (leave > 0 || round < .1) renderer.shadowMap.needsUpdate = true;
  for (const s of sites) {
    const on = s.own > 0; s.gp.visible = s.dot.visible = on; if (!on) continue; s.own === 1 ? n1++ : n2++;
    const a = Math.min(1, Math.max(0, (t - s.at) / .32)), b = Math.max(0, t - s.at - .32); if (b > 0 && b < .7) renderer.shadowMap.needsUpdate = b - dt <= 0 || b > .62 || renderer.shadowMap.needsUpdate; s.flag.castShadow = b > 0;   // 上から落ちてきて、ささって少しゆれる
    s.flag.material = s.dot.material = flagM[s.own]; s.dot.visible = a > .9; s.dot.scale.setScalar(Math.min(1, .5 + b * 5));
    s.gp.position.set(s.x, s.y - .1 + (1 - a * a) * 2.6 + (s.base ? 0 : leave * leave * 5), s.z); s.gp.rotation.z = Math.exp(-b * 6) * Math.sin(b * 34) * .16; s.gp.visible = a > 0;
    if (leave > 0 && !s.base) s.dot.scale.setScalar(Math.max(.001, 1 - leave * 1.6));
  }
  sr.textContent = n1; sb.textContent = n2;
  const asp = cam.aspect, d = Math.max(20.5, 13 / (.536 * asp)), a = t * .035 + .62, e = .68;
  cam.position.set(Math.sin(a) * d * Math.cos(e), d * Math.sin(e), Math.cos(a) * d * Math.cos(e)); cam.lookAt(0, asp < 1 ? -.6 : .35, 0);
  renderer.render(scene, cam); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
