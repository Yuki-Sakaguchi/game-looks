<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 10 旅 ライトテーブルの砂絵</title>
<style>
html,body{margin:0;height:100%;background:#120804;overflow:hidden}
canvas{width:100vw;height:100vh;display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#ffd98a;background:rgba(18,8,4,.75);padding:0 6px}
</style>
<canvas id="c"></canvas>
<div id="cap">LOOK 10 ─ 旅 / ライトテーブルの砂絵　｜　見るだけ（らくだの隊列が進み、景色が描きかえられる）</div>
<script>
// 見立て: 下から光るガラス板に砂をまき、指でなぞって絵にするサンドアニメーション（砂絵）。
// 決まり: 持っているのは「砂の厚さ」の絵 1 枚だけ。厚い所ほど光を通さず黒く、うすい所は琥珀色、砂のない所は白く光る（色相は 1 つ）。
// 描く手は 3 つ: 砂をまく（厚くなる・ふちがぼける）／指でなぞる（砂がどいて明るい線、わきに砂が盛り上がる）／腕でならして消す。手の影も映る
const cv = document.getElementById('c'), gl = cv.getContext('webgl', { antialias: false });
const mk = () => { const c = document.createElement('canvas'); return [c, c.getContext('2d')]; };
const [bgc, bg] = mk(), [frc, fr] = mk(), [edc, ed] = mk();
const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
// 砂の厚さ → 光の色（粒ごとに厚さがばらつき、うすい所は粒がまばらになる）
const prog = gl.createProgram();
for (const [type, src] of [[gl.VERTEX_SHADER, 'attribute vec2 p; varying vec2 v; void main(){ v = vec2(p.x * .5 + .5, .5 - p.y * .5); gl_Position = vec4(p, 0., 1.); }'], [gl.FRAGMENT_SHADER, `precision highp float; uniform sampler2D t; uniform float gs; varying vec2 v;
float h(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
void main(){ float th = texture2D(t, v).r; vec2 gc = floor(gl_FragCoord.xy / gs); float g1 = h(gc), g2 = h(gc + 17.3);

  c = mix(c, vec3(.9, .52, .1), smoothstep(.07, .4, T)); c = mix(c, vec3(1., .83, .45), smoothstep(.34, .74, T)); c = mix(c, vec3(1., .98, .88), smoothstep(.7, 1., T));
  vec2 q = v - .5; gl_FragColor = vec4(c * (1.04 - dot(q, q) * .5), 1.); }`]]) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); gl.attachShader(prog, s); }
gl.linkProgram(prog); gl.useProgram(prog); gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.bindAttribLocation(prog, 0, 'p'); gl.linkProgram(prog); gl.useProgram(prog); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.bindTexture(gl.TEXTURE_2D, gl.createTexture()); for (const [k, val] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, val);

let TW, TH, U, ops = [], scene = 0, sc = 0, t = 0, hx = 0, hy = 0, wipe = null;
const D = 6.5, BASE = 32, gray = v => { v = Math.max(0, Math.min(255, Math.round(v))); return `rgb(${v},${v},${v})`; };
const ridge = x => TH * .665 + Math.sin(x / TW * 5 + 1) * TH * .034 + Math.sin(x / TW * 11 + 2) * TH * .011;
const far = x => TH * .53 + Math.sin(x / TW * 4 + 2.4) * TH * .045;
// 点の列を作る道具
const curve = (f, x0, x1) => { const p = []; for (let x = x0; x <= x1; x += 3 * U) p.push([x, f(x)]); return p; };
const arc = (cx, cy, r, a0, a1) => { const p = [], n = Math.max(4, Math.ceil(Math.abs(a1 - a0) * r / (3 * U))); for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return p; };

    for (const [px, s] of [[.2, 1], [.34, .78]]) { const x = TW * px, y = ridge(x) + 4 * U, tx = x + 14 * U * s, ty = y - 108 * U * s; pline(quad(x, y, x - 6 * U * s, y - 60 * U * s, tx, ty), 7 * U * s, .75, 1.9, 2.3); for (let i = 0; i < 6; i++) { const a = -2.9 + i * .56, l = 46 * U * s; pline(quad(tx, ty, tx + Math.cos(a) * l * .6, ty + Math.sin(a) * l * .7 - 12 * U * s, tx + Math.cos(a) * l, ty + Math.sin(a) * l * .5 + 12 * U * s), 5.5 * U * s, .7, 2.3 + i * .07, 2.5 + i * .07); } }
    finger(arc(TW * .72, TH * .22, 27 * U, -1.9, 1.5), 11 * U, 2.75, 3.25);
    for (let i = 0; i < 11; i++) dot(TW * (.08 + hash(i, 3) * .84), TH * (.06 + hash(i, 4) * .36), (2.2 + hash(i, 5) * 1.6) * U, 3.3 + i * .07);
  } else {                                                              // 町: 丸屋根と塔の影、低い夕日、窓
    const dome = (x, wd, ht) => { const y = ridge(x) + 6 * U; pour([[x - wd, y], [x - wd, y - ht], ...arc(x, y - ht, wd, Math.PI, 2 * Math.PI), [x + wd, y]], .66, 1.2, 2.1); pline(seg(x, y - ht - wd, x, y - ht - wd - 12 * U), 2.5 * U, .7, 2.1, 2.2); };
    const tower = (x, wd, ht) => { const y = ridge(x) + 6 * U; pour([[x - wd, y], [x - wd, y - ht], [x - wd * 1.5, y - ht], [x - wd * 1.5, y - ht - 6 * U], [x, y - ht - 26 * U], [x + wd * 1.5, y - ht - 6 * U], [x + wd * 1.5, y - ht], [x + wd, y - ht], [x + wd, y]], .66, 1.3, 2.2); };
    dome(TW * .3, 36 * U, 34 * U); dome(TW * .47, 22 * U, 22 * U); tower(TW * .15, 7 * U, 104 * U); tower(TW * .4, 6 * U, 76 * U); tower(TW * .56, 5 * U, 52 * U);
    finger(spiral(TW * .8, TH * .36, 42 * U, 10 * U), 13 * U, 2.1, 3.0);
    [[.3, 30], [.27, 12], [.33, 12], [.47, 18], [.15, 80], [.15, 56], [.4, 54]].forEach(([px, up], i) => dot(TW * px, ridge(TW * px) - up * U, 2.6 * U, 3.05 + i * .07));
    finger(arc(TW * .3, ridge(TW * .3) + 2 * U, 9 * U, Math.PI, 2 * Math.PI), 3 * U, 3.55, 3.75);
  }
  pour(below(ridge), .62, 1.0, 1.9);                                    // 手前の砂丘と、指でつけた風の筋
  for (let i = 0; i < 4; i++) { const a = TW * (.04 + hash(n, i) * .42), b = a + TW * (.3 + hash(n, i + 5) * .25); finger(curve(x => ridge(x) + (16 + i * 21) * U + Math.sin(x / (38 * U) + i) * 5 * U, a, Math.min(b, TW + 10)), 5 * U, 3.75 + i * .32, 4.2 + i * .32); }
  for (const p of o) { p.f = 0; p.i = 0; p.c = 0; } return o;
}
const path = (x, pts, i0, i1) => { x.beginPath(); x.moveTo(pts[i0][0], pts[i0][1]); for (let i = i0 + 1; i <= i1; i++) x.lineTo(pts[i][0], pts[i][1]); };
// 場面の時刻 lt まで絵を進める。戻り値は手のある所
function advance(lt) {

  if (lt < 1.1) {                                                       // 腕でならして消す（上半分を右へ、下半分を左へ）

    if (!wipe || wipe.ps !== ps) wipe = { ps, x }; const xa = Math.min(wipe.x, x), xb = Math.max(wipe.x, x); wipe.x = x;
    bg.globalCompositeOperation = 'source-over'; bg.globalAlpha = .94; bg.fillStyle = gray(BASE); bg.fillRect(xa - 1, y0, xb - xa + 2, y1 - y0); bg.globalAlpha = .55;
    for (let i = 0; i < 16; i++) { bg.fillStyle = gray(hash(i, ps + scene) < .5 ? BASE + 34 : 6); bg.fillRect(xa - 1, y0 + hash(i, ps + 7 + scene) * (y1 - y0), xb - xa + 2, (1 + hash(i, 9) * 2.2) * U); } bg.globalAlpha = 1;

  } else wipe = null;
  for (const p of ops) { if (lt < p.t0) continue; const f = Math.min(1, (lt - p.t0) / (p.t1 - p.t0)); if (p.f >= 1) continue;

    else if (p.k === 'dot') { bg.globalCompositeOperation = 'lighter'; bg.fillStyle = gray(40); bg.beginPath(); bg.arc(p.x, p.y, p.r + 3 * U, 0, 7); bg.fill(); bg.globalCompositeOperation = 'source-over'; bg.fillStyle = gray(4); bg.beginPath(); bg.arc(p.x, p.y, p.r, 0, 7); bg.fill(); hand = { x: p.x, y: p.y }; }
    else { const i1 = Math.floor(f * (p.pts.length - 1)); if (i1 > p.i) { path(bg, p.pts, p.i, i1);
        if (p.k === 'pline') { bg.globalCompositeOperation = 'lighter'; bg.lineCap = 'butt'; bg.strokeStyle = gray(p.amt * 255); bg.lineWidth = p.wd; bg.stroke(); }
        else { bg.globalCompositeOperation = 'lighter'; bg.lineCap = 'butt'; bg.strokeStyle = gray(46); bg.lineWidth = p.wd + 8 * U; bg.stroke(); bg.globalCompositeOperation = 'source-over'; bg.lineCap = 'round'; bg.strokeStyle = gray(4); bg.lineWidth = p.wd; bg.stroke(); }   // わきに砂が寄る → まん中の砂がどく
        p.i = i1; } hand = { x: p.pts[i1][0], y: p.pts[i1][1], pinch: p.k === 'pline' }; }
    p.f = f; }

}
function camel(x, s, ph, kind) {            // 砂を盛って作った影絵（右向き）。足は 1 秒 8 コマで動く
  const y = ridge(x) + 3 * U, sl = Math.atan((ridge(x + 6) - ridge(x - 6)) / 12) * .7; fr.save(); fr.translate(x, y); fr.rotate(sl); fr.fillStyle = fr.strokeStyle = gray(205); fr.lineCap = 'round';
  const ln = (x1, y1, x2, y2, wd) => { fr.lineWidth = wd * s; fr.beginPath(); fr.moveTo(x1 * s, y1 * s); fr.lineTo(x2 * s, y2 * s); fr.stroke(); }, el = (cx, cy, rx, ry, r = 0) => { fr.beginPath(); fr.ellipse(cx * s, cy * s, rx * s, ry * s, r, 0, 7); fr.fill(); };
  const a = Math.sin(ph) * .2, b = Math.sin(ph + 1.9) * .2;
  if (kind) { ln(-.08, -.5, -.08 - a * .8, 0, .11); ln(.08, -.5, .08 + a * .8, 0, .11); fr.beginPath(); fr.moveTo(-.2 * s, -.42 * s); fr.lineTo(0, -1.12 * s); fr.lineTo(.2 * s, -.42 * s); fr.fill(); el(0, -1.2, .12, .12); ln(.3, -1.3, .34, 0, .045); ln(.05, -.9, .3, -.8, .08); }
  else { ln(-.44, -.85, -.44 - a, 0, .1); ln(-.3, -.85, -.3 + a, 0, .1); ln(.34, -.85, .34 - b, 0, .1); ln(.46, -.85, .46 + b, 0, .1);
    el(0, -1.02, .62, .3); el(-.06, -1.34, .3, .24); ln(.48, -1.08, .82, -1.62, .17); el(.96, -1.68, .2, .1, .15); ln(-.6, -1.1, -.72, -.74, .05); fr.fillRect(-.26 * s, -1.66 * s, .4 * s, .16 * s); }

function render() {

let hand = {};
function start() {

let last = performance.now();
function frame(now) {
