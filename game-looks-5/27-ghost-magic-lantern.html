<script>
// 暗い部屋のかべに、幻灯機（ろうそくの光でガラス絵を映す昔の映写機）の丸い光が当たっている。

const cv = document.getElementById('c'), g = cv.getContext('2d');
let seed = 11; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

function path(c, pts, close) { c.beginPath(); pts.forEach(([px, py], i) => { const jx = px + (rnd() - .5) * 2.6, jy = py + (rnd() - .5) * 2.6; i ? c.lineTo(jx, jy) : c.moveTo(jx, jy); }); if (close) c.closePath(); }

function ink(c, pts, w = 4, close = 0) { c.strokeStyle = INK; c.lineJoin = c.lineCap = 'round'; c.lineWidth = w; path(c, pts, close); c.stroke(); c.lineWidth = w * .45; path(c, pts, close); c.stroke(); }

  shape(c, [[150, 430], [158, 392], [170, 410], [184, 370], [198, 408], [210, 388], [222, 430]], RED, 2.5); shape(c, [[168, 430], [176, 408], [186, 396], [196, 412], [204, 430]], YEL, 2);

  for (let i = 0; i < 6; i++) { const a = i / 5 * 1.57; ink(c, [[640, 0], [640 - Math.cos(a) * 150, Math.sin(a) * 150]], 1.3); } for (const r of [50, 95, 140]) ink(c, ell(640, 0, r, r, 8, Math.PI / 2, Math.PI), 1.3);

  shape(c, ell(300, 552, 190, 46, 22), BLU, 4);

}
// ---- 子ども（腕だけ 2 枚の絵。ランプを下げた絵と、かかげた絵） ----
const kid = [0, 1].map(pose => {
  const k = mk(250, 300), c = k.getContext('2d'); c.translate(20, 50);
  black(c, ell(68, 238, 17, 8, 10)); black(c, ell(104, 238, 17, 8, 10));

  black(c, ell(94, 68, 3.5, 4.5, 8)); ink(c, [[92, 82], [100, 80]], 2.5);
  if (!pose) { shape(c, [[90, 104], [104, 100], [142, 132], [132, 146]], BLU, 4); shape(c, ell(140, 142, 8, 8, 10), '#f8d4a4', 3); ink(c, [[142, 148], [142, 166]], 3); shape(c, box(128, 166, 28, 34), YEL, 4); shape(c, [[124, 166], [142, 154], [160, 166]], BRN, 3); ink(c, [[124, 200], [160, 200]], 5); }
  else {
    for (let i = 0; i < 11; i++) { const a = -Math.PI * .05 - i / 10 * Math.PI * .9 - .0, r0 = 34, r1 = 62 + (i % 2) * 26, cx = 146, cy = 30, da = .1; shape(c, [[cx + Math.cos(a - da) * r0, cy + Math.sin(a - da) * r0], [cx + Math.cos(a) * r1, cy + Math.sin(a) * r1], [cx + Math.cos(a + da) * r0, cy + Math.sin(a + da) * r0]], YEL, 2.2); }
    shape(c, [[90, 108], [102, 98], [142, 60], [152, 72]], BLU, 4); shape(c, ell(148, 62, 8, 8, 10), '#f8d4a4', 3); ink(c, [[148, 56], [147, 48]], 3); shape(c, box(132, 14, 28, 34), CLR, 4); shape(c, [[128, 14], [146, 2], [164, 14]], BRN, 3); ink(c, [[128, 48], [164, 48]], 5); shape(c, [[142, 42], [146, 26], [150, 42]], YEL, 2);
  }
  return k;
});
// ---- おばけ（別のガラス板。すきとおった青緑なので、うしろの絵がすけて見える） ----
const ghost = [0, 1].map(pose => {
  const k = mk(180, 200), c = k.getContext('2d'); c.translate(5, 5);
  shape(c, pose ? [[30, 96], [4, 60], [0, 76], [26, 122]] : [[30, 100], [8, 108], [6, 124], [30, 126]], TEAL, 4); shape(c, pose ? [[140, 96], [166, 60], [170, 76], [144, 122]] : [[140, 100], [162, 108], [164, 124], [140, 126]], TEAL, 4);
  shape(c, [[30, 176], [27, 120], [28, 80], ...ell(85, 80, 57, 62, 14, Math.PI, Math.PI * 2), [143, 120], [142, 176], [124, 158], [106, 178], [88, 158], [68, 178], [50, 158]], TEAL, 5.5);
  black(c, ell(66, 80, 10, pose ? 15 : 12, 12)); black(c, ell(106, 80, 10, pose ? 15 : 12, 12)); c.fillStyle = CLR; c.beginPath(); c.arc(69, 76, 3, 0, 7); c.arc(109, 76, 3, 0, 7); c.fill();
  if (pose) { black(c, ell(86, 124, 13, 18, 12)); ink(c, [[52, 58], [74, 50]], 3.5); ink(c, [[120, 58], [98, 50]], 3.5); } else { ink(c, [[52, 60], [76, 68]], 3.5); ink(c, [[120, 60], [96, 68]], 3.5); black(c, [[62, 112], [74, 122], [86, 114], [98, 122], [110, 112], [100, 134], [86, 128], [72, 134]]); }
  return k;
});
// ---- レンズのほこりと毛（映る絵の上でいつも同じ場所にある） ----
const dust = mk(U, U);
{ const c = dust.getContext('2d'); for (let i = 0; i < 16; i++) { const px = 60 + rnd() * 520, py = 60 + rnd() * 520, r = 3 + rnd() * 9, gr = c.createRadialGradient(px, py, 0, px, py, r); gr.addColorStop(0, 'rgba(20,10,0,.34)'); gr.addColorStop(1, 'rgba(20,10,0,0)'); c.fillStyle = gr; c.fillRect(px - r, py - r, r * 2, r * 2); }
  c.strokeStyle = 'rgba(20,10,0,.3)'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(430, 90); c.bezierCurveTo(470, 120, 440, 170, 492, 190); c.moveTo(120, 470); c.bezierCurveTo(150, 462, 150, 500, 186, 494); c.stroke(); }
const P = mk(U, U), pc = P.getContext('2d'), CH = [0, 1, 2].map(() => mk(U, U)), vig = mk(U, U);
{ const c = vig.getContext('2d'), gr = c.createRadialGradient(U / 2, U / 2, 0, U / 2, U / 2, U / 2); gr.addColorStop(0, '#fffaec'); gr.addColorStop(.5, '#fff0c8'); gr.addColorStop(.76, '#f0b060'); gr.addColorStop(.9, '#8a3c10'); gr.addColorStop(.97, '#1c0800'); gr.addColorStop(1, '#000'); c.fillStyle = gr; c.fillRect(0, 0, U, U); }
// ---- かべ（しっくいと、うすいしま模様のかべ紙。下は腰板） ----
let W = 0, H = 0, wall = null, wallDim = null, D = 0, CX = 0, CY = 0;
function resize() {
  const d = Math.min(devicePixelRatio || 1, 2); W = cv.width = Math.round(innerWidth * d); H = cv.height = Math.round(innerHeight * d);
  D = Math.min(W * .97, H * .93); CX = W / 2; CY = H * (W > H ? .5 : .44);
  wall = mk(W, H); const c = wall.getContext('2d'), s = Math.max(W, H) / 1280; seed = 5;
  c.fillStyle = '#cfc2a6'; c.fillRect(0, 0, W, H);
  for (let x = 0; x < W; x += 46 * s) { c.fillStyle = 'rgba(120,96,60,.08)'; c.fillRect(x, 0, 16 * s, H); c.fillStyle = 'rgba(120,96,60,.13)'; c.fillRect(x + 24 * s, 0, 2 * s, H); }
  for (let i = 0; i < 5000; i++) { c.fillStyle = rnd() < .5 ? 'rgba(60,40,20,.07)' : 'rgba(255,250,230,.07)'; const r = (1 + rnd() * 5) * s; c.fillRect(rnd() * W, rnd() * H, r, r); }
  c.strokeStyle = 'rgba(50,34,20,.5)'; c.lineWidth = 1.5 * s; c.beginPath(); let px = W * .7, py = 0; c.moveTo(px, py); for (let i = 0; i < 16; i++) { px += (rnd() - .6) * 40 * s; py += rnd() * 36 * s; c.lineTo(px, py); } c.stroke();
  const ry = H * .9; c.fillStyle = '#a48f6c'; c.fillRect(0, ry, W, H - ry); c.fillStyle = '#6e563a'; c.fillRect(0, ry - 12 * s, W, 16 * s); c.fillStyle = '#d8c8a4'; c.fillRect(0, ry - 12 * s, W, 3 * s); c.fillStyle = 'rgba(40,26,14,.5)'; c.fillRect(0, ry + 4 * s, W, 5 * s);
  for (let x = 30 * s; x < W; x += 150 * s) { c.strokeStyle = 'rgba(60,44,26,.5)'; c.lineWidth = 3 * s; c.strokeRect(x, ry + 22 * s, 120 * s, H); }
  wallDim = mk(W, H); const w = wallDim.getContext('2d'); w.drawImage(wall, 0, 0); w.globalCompositeOperation = 'multiply'; w.fillStyle = '#17110e'; w.fillRect(0, 0, W, H);
}
addEventListener('resize', resize); resize();
const ease = f => f * f * (3 - 2 * f), cl = f => Math.max(0, Math.min(1, f));
const SD = 8, POS = [0, U + GAP];
let last = performance.now(), t = 0;
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt;
  const si = Math.floor(t / SD) % 2, st = t % SD, raised = st > 4.6 && st < 6.5;
  // 板を手で押してすべらせる（止まるときに少し行きすぎて戻る）
  let f = cl((st - 7) / .9); f = ease(f) + Math.sin(f * Math.PI) * .0 + (f > 0 ? Math.sin(cl((st - 7.7) / .3) * Math.PI) * .012 : 0);
  const jolt = Math.exp(-Math.abs(st - 4.6) * 14) * (st > 4.6 ? 3 : 0) + Math.exp(-Math.abs(st - 6.5) * 14) * (st > 6.5 ? 2 : 0);
  const off = POS[si] + (POS[1 - si] - POS[si]) * f + Math.sin(t * 1.7) * .8, oy = Math.sin(t * 1.1) * .6 + jolt;
  pc.globalCompositeOperation = 'source-over'; pc.fillStyle = INK; pc.fillRect(0, 0, U, U);
  pc.drawImage(strip, -off, oy);
  for (let k = 0; k < 2; k++) { const kx = POS[k] - off + (k ? 190 : 215); if (kx > -260 && kx < U) pc.drawImage(kid[k === si && raised ? 1 : 0], kx, 292 + oy); }
  // おばけの板: すべって入ってきて、ただよい、ランプの光でいっせいに外へすべり出る
  pc.globalCompositeOperation = 'multiply';
  const pin = ease(cl((st - .3) / 1.4)), pout = cl((st - 4.75) / .8), pres = pin * (1 - pout * pout), sc = st > 4.6 ? 1 : 0;
  for (let i = 0; i < 2; i++) { const hx = (i ? 300 : 440) + 46 * Math.sin(t * .8 + i * 2.4) - (st > 3 && st < 4.6 ? (st - 3) * (i ? 22 : 40) : st >= 4.6 ? 1.6 * (i ? 22 : 40) : 0), hy = (i ? 70 : 190) + 26 * Math.sin(t * 1.15 + i * 1.3), ox = i ? 380 : 700, oyy = i ? -230 : 150;
    pc.drawImage(ghost[sc], ox + (hx - ox) * pres, oyy + (hy - oyy) * pres); }
  pc.drawImage(dust, 0, 0); pc.drawImage(vig, 0, 0);
  // 赤・緑・青に分け、ふちへ行くほど少しずつずらして重ねる（レンズの色のにじみ）
  const cols = ['#ff0000', '#00ff00', '#0000ff'];
  for (let k = 0; k < 3; k++) { const c = CH[k].getContext('2d'); c.globalCompositeOperation = 'source-over'; c.drawImage(P, 0, 0); c.globalCompositeOperation = 'multiply'; c.fillStyle = cols[k]; c.fillRect(0, 0, U, U); }
  const fl = .9 + .06 * Math.sin(t * 13.1) * Math.sin(t * 7.3) + .04 * Math.sin(t * 31.7 + Math.sin(t * 3.1) * 4);   // ほのおのゆらぎ
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1; g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'lighter'; g.globalAlpha = fl; g.imageSmoothingQuality = 'high';
  const wob = Math.sin(t * 9.7) * D * .0012;
  for (let k = 0; k < 3; k++) { const s = D * (1 + (1 - k) * .013); g.drawImage(CH[k], CX - s / 2 + wob, CY - s / 2, s, s); }
  g.globalAlpha = .09 * fl; let gr = g.createRadialGradient(CX, CY, D * .3, CX, CY, D * .95); gr.addColorStop(0, '#ffb050'); gr.addColorStop(1, '#000'); g.fillStyle = gr; g.fillRect(0, 0, W, H);   // 円の外にもれる光
  g.globalAlpha = 1; g.globalCompositeOperation = 'multiply'; g.drawImage(wall, 0, 0);
  g.globalCompositeOperation = 'lighter'; g.drawImage(wallDim, 0, 0);
  // 光のすじの中をただようほこり
  for (let i = 0; i < 14; i++) { const a = i * 2.4 + t * .05 * (1 + i % 3), r = D * (.08 + (i * .37 % 1) * .36), px = CX + Math.cos(a) * r + Math.sin(t * .5 + i) * D * .02, py = CY + Math.sin(a * 1.3) * r - ((t * 4 * (1 + i % 4) + i * 50) % (D * .2)) + D * .1; g.globalAlpha = .1 + .08 * Math.sin(t * 2 + i * 1.7); g.fillStyle = '#ffe2b0'; g.beginPath(); g.arc(px, py, D * (.0022 + (i % 3) * .0012), 0, 7); g.fill(); }
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';

}
