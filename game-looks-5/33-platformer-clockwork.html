<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>

// 奥の大きな輪列（暗い）

{ const arm = new THREE.Mesh(new THREE.BoxGeometry(.14, 1.7, .1), steel); arm.position.y = .55; const bar = new THREE.Mesh(new THREE.BoxGeometry(1.5, .14, .1), steel); bar.position.y = -.3; fork.add(arm, bar); for (const sx of [-1, 1]) { const pj = new THREE.Mesh(new THREE.BoxGeometry(.12, .34, .14), ruby); pj.position.set(sx * .7, -.42, 0); fork.add(pj); } fork.rotation.z = Math.atan2(-(BX - fork.position.x), BY - fork.position.y); }

{ const rim = new THREE.Mesh(new THREE.TorusGeometry(1.75, .13, 10, 56), gold); const sp = new THREE.Mesh(new THREE.BoxGeometry(3.4, .2, .1), gold); bal.add(rim, sp); for (let i = 0; i < 14; i++) { const a = i * Math.PI / 7 + .2, w = new THREE.Mesh(new THREE.CylinderGeometry(.07, .07, .16, 8), gold); w.position.set(Math.cos(a) * 1.9, Math.sin(a) * 1.9, 0); w.rotation.z = a - Math.PI / 2; bal.add(w); } }

{ const cock = new THREE.Mesh(new THREE.BoxGeometry(.8, 3.6, .14), steel); cock.position.set(BX + .75, BY + 1.3, -.45); cock.rotation.z = -.52; scene.add(cock); const j = new THREE.Mesh(new THREE.SphereGeometry(.2, 16, 10), ruby); j.scale.z = .5; j.position.set(BX, BY, -.34); const rg = new THREE.Mesh(new THREE.TorusGeometry(.27, .07, 8, 20), gold); rg.position.copy(j.position); scene.add(j, rg); screw(BX + 1.25, BY + 2.2, -.34, .2); screw(BX + 1.6, BY + 2.8, -.34, .2); }

// ── ぜんまいじかけの人形（赤いほうろうの胴、真鍮の頭、背中のねじ）
const man = new THREE.Group(), enamel = new THREE.MeshPhongMaterial({ color: '#d8261c', shininess: 120, specular: '#ffffff', envMap: envT, reflectivity: .2 });
const body = new THREE.Mesh(new THREE.CylinderGeometry(.17, .24, .5, 12), enamel); body.position.y = .5; const head = new THREE.Mesh(new THREE.SphereGeometry(.19, 14, 10), gold); head.position.y = .93; const hat = new THREE.Mesh(new THREE.ConeGeometry(.16, .3, 10), enamel); hat.position.y = 1.2;

const wind = new THREE.Group(); { const st = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, .2, 6), gold); st.rotation.z = Math.PI / 2; const lp = new THREE.Mesh(new THREE.TorusGeometry(.1, .035, 6, 14), gold); lp.position.x = -.18; lp.rotation.y = Math.PI / 2; wind.add(st, lp); wind.position.set(-.3, .55, 0); }

// とびうつる途中で取る小さなルビー
const gems = [0, 1, 2, 3].map(i => { const a = plat[i], b = plat[i + 1], m = new THREE.Mesh(new THREE.OctahedronGeometry(.24), ruby); m.position.set((a.x + b.x) / 2, (a.top + b.top) / 2 + 1.75, 0); m.userData.hide = 0; scene.add(m); return m; });

const SEQ = [4, 3, 2, 1, 0, 1, 2, 3], STAY = 1.25, HOP = .75;
