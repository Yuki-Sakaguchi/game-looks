    K.position.y = Y0 + Math.abs(Math.cos(ph)) * .16 * w; K.rotation.z = Math.sin(ph) * .05 * w;
    bodyG.rotation.z = -.14 + roar * .32 - swipe * .12; bodyG.rotation.x = Math.sin(ph) * .05 * w;
    head.rotation.z = Math.sin(ph * 2) * .06 + roar * .55; jaw.rotation.z = -.1 - .25 * Math.max(0, Math.sin(tq * 3.1)) - roar * .55 - swipe * .3;
    arms.forEach((a, i) => a.rotation.z = (i ? 1 : -1) * Math.sin(ph) * .35 * w + roar * 1.1 - swipe * .9 + .2);
    tails.forEach((g, i) => { g.rotation.z = .1 + Math.sin(ph - i * .9) * .16; g.rotation.y = Math.sin(ph * .5 - i * .8) * .32; });
    cars.forEach((c, i) => { c.position.x = (i ? 5.3 : -.6) + ((tq * (i ? .8 : -.6) + 30) % 3 - 1.5); });
    // カメラは怪獣を少し追う。たて長では引く
    const a = cam.aspect, k = Math.max(1, BA / a), follow = a < 1 ? .72 : .22;
    tgt.set(kx * follow, a < 1 ? 1.2 : 2, a < 1 ? 1 : 0); cam.position.set(tgt.x * .9, tgt.y + 4.6 * k, tgt.z + 15 * k); cam.lookAt(tgt);
    renderer.render(scene, cam);
  }
  requestAnimationFrame(frame);
}
