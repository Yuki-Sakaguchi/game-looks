{ const sh = new THREE.Shape(); for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5, r = i % 2 ? .16 : .42; i ? sh.lineTo(Math.cos(a) * r, Math.sin(a) * r) : sh.moveTo(r, 0); } const g = new THREE.ExtrudeGeometry(sh, { depth: .07, bevelEnabled: true, bevelSize: .04, bevelThickness: .04, bevelSegments: 2 }); g.rotateX(-Math.PI / 2); add(g, new THREE.MeshStandardMaterial({ color: 0xee7a3a, roughness: .6 }), -4.6, .04, -3.6).rotation.y = .5; }

      c.g.rotation.y = Math.atan2(-v4.z, v4.x) + (c.hermit ? 0 : Math.PI / 2);         // かには横歩き
      c.legs.forEach((l, i) => l.rotation.z = Math.sin(simT * 16 + i * 1.7) * .5);
    } else if (c.dead > 0) { c.dead -= dt; const k = 1 - c.dead / .8; c.b.rotation.x = Math.min(1, k * 3) * Math.PI; c.b.position.y = Math.sin(Math.min(1, k * 2) * Math.PI) * .6 - Math.max(0, k - .6) * 1.2; if (c.dead <= 0) c.g.visible = false; }
  }
  for (const T of towers) {
    T.cd -= dt; T.sq *= Math.exp(-dt * 7); T.g.scale.set(1 + T.sq * .1, 1 - T.sq * .14, 1 + T.sq * .1); T.s.visible = T.cd < .25;
    if (T.cd > 0) continue; let best = null;
    for (const c of crabs) if (c.alive && c.u > .12 && Math.hypot(c.g.position.x - T.x, c.g.position.z - T.z) < 3.3 && (!best || c.u > best.u)) best = c;
    const s = best && shots.find(s => s.t >= 1); if (!s) continue;
    T.cd = 1.05; T.sq = 1; s.t = 0; s.from.set(T.x, 1.4, T.z); s.to = best;
  }
  for (const s of shots) {
    if (s.t >= 1) { s.m.visible = false; continue; } s.t += dt / .42; s.m.visible = true; const c = s.to;
    s.m.position.lerpVectors(s.from, c.g.position, Math.min(1, s.t)); s.m.position.y += Math.sin(Math.min(1, s.t) * Math.PI) * 1.3 + .15; s.m.rotation.x += dt * 14; s.m.rotation.z += dt * 9;
    if (s.t >= 1 && c.alive) { burst(c.g.position.x, .1, c.g.position.z); if (--c.hp <= 0) { c.alive = false; c.dead = .8; if (!quiet) { score++; } } }
  }
  for (let i = 0; i < NP; i++) if (pl[i] > 0) { pl[i] -= dt; const j = i * 3; pv[j + 1] -= 9 * dt; pp[j] += pv[j] * dt; pp[j + 1] += pv[j + 1] * dt; pp[j + 2] += pv[j + 2] * dt; if (pl[i] <= 0) pp[j + 1] = -9; }
  pGeo.attributes.position.needsUpdate = true;
}
for (let i = 0; i < 320; i++) sim(.05, true);       // 開いたときから列ができているように、先に進めておく

const CYCLE = 12, sm = v => { v = Math.max(0, Math.min(1, v)); return v * v * (3 - 2 * v); };
let t = 0, last = performance.now(), wetLine = 7.2, prevEdge = 9;
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt; sim(dt, false);
  // 波: 1.4 秒から上がり、3.6 秒でいちばん上、そのあとゆっくり引く
  const tc = t % CYCLE, up = sm((tc - 1.4) / 2.2), down = sm((tc - 3.6) / 3.6), reach = up * (1 - down);
  const edge = 7.4 + Math.sin(t * 1.1) * .25 - reach * 4.6;
  wetLine = Math.min(edge - .15, wetLine + dt * .42);               // ぬれたあとは、少しずつかわいて手前へもどる
  if (edge > prevEdge && prevEdge < 4.5 && U.foamA.value < .5) { U.foamZ.value = prevEdge; U.foamA.value = 1; }   // 引きはじめに泡の線を残す
  U.foamA.value = Math.max(0, U.foamA.value - dt * .2); prevEdge = edge;
  U.edge.value = edge; U.wet.value = wetLine; U.t.value = t;
  if (edge < tallyZ + .4 || score > 10) score = 0;
  marks.forEach((m, i) => m.visible = i < score);
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
