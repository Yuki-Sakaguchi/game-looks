<title>LOOK 34 祭りの行列 和紙の灯籠の山車</title>
<style>
html,body{margin:0;height:100%;background:#04050a;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#ffd9a0;opacity:.85}

<div id="cap">LOOK 34 ─ 祭りの行列 / 針金と和紙の灯籠の山車　｜　見るだけ（とらの山車が夜の通りを進む）</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 見立て: 針金の骨組みに和紙を貼り、中の電球で光らせる大きな灯籠の山車（とら）。まわりは夜で、人も家も黒い影。
// 紙の面は「中の電球からの近さ」と「面の向き」で明るさにむらを出し、骨（三角のへり）はうすい影の線、ふちは太い墨の線（裏返しの黒い殻）。
// もようは墨の黒と、ろうを引いた白ぬきの線、染料の赤・青・黄・緑だけ。明るい所は自作のブルームでにじませ、ぬれた路面に逆さに映す
import * as THREE from 'three';
const renderer = new THREE.WebGLRenderer({ antialias: false }); const PR = Math.min(devicePixelRatio, 1.5); document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#04050a');
const cam = new THREE.PerspectiveCamera(38, 1, .1, 300);
const rtS = new THREE.WebGLRenderTarget(4, 4, { samples: 4 }), rtA = new THREE.WebGLRenderTarget(4, 4), rtB = new THREE.WebGLRenderTarget(4, 4);
const resize = () => { const w = innerWidth, h = innerHeight, a = w / h; renderer.setPixelRatio(PR); renderer.setSize(w, h); cam.aspect = a; cam.fov = a >= 1.3 ? 38 : Math.min(82, 2 * Math.atan(Math.tan(19 * Math.PI / 180) * 1.3 / a) * 180 / Math.PI); cam.updateProjectionMatrix(); rtS.setSize(w * PR | 0, h * PR | 0); rtA.setSize(w * PR / 4 | 0, h * PR / 4 | 0); rtB.setSize(w * PR / 4 | 0, h * PR / 4 | 0); }; addEventListener('resize', resize); resize();

// ── 和紙の面の描き方（山車の中の座標 fp で、電球からの明るさを決める）
const BULB = { value: [[3.3, 5.5, 0], [.8, 4.5, 0], [-2.4, 4.2, 0], [-4.8, 6.8, 0], [0, 1.7, 0], [-1.5, 7.2, -1.7]].map(p => new THREE.Vector3(...p)) };
const paper = (c1, c2, mode = 0, ax = [1, 0, 0], gain = 1) => new THREE.ShaderMaterial({
  uniforms: { uBulb: BULB, uC: { value: new THREE.Color(c1) }, uC2: { value: new THREE.Color(c2) }, uMode: { value: mode }, uAx: { value: new THREE.Vector3(...ax) }, uGain: { value: gain } },
  vertexShader: `attribute vec3 bc; attribute vec3 fp; varying vec3 vB, vF, vL; void main(){ vB=bc; vF=fp; vL=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform vec3 uBulb[6]; uniform vec3 uC, uC2, uAx; uniform float uMode, uGain; varying vec3 vB, vF, vL;
  void main(){
    vec3 n=normalize(cross(dFdx(vF),dFdy(vF))); float g=0., f=0.;
    for(int i=0;i<6;i++){ vec3 d=vF-uBulb[i]; float w=1./(1.+dot(d,d)*.42); g+=w; f+=w*abs(dot(n,normalize(d))); }
    float lum=(.16+1.0*g*(.3+.7*f/max(g,.001)))*uGain;                    // 電球に近く、電球を向いた面ほど明るい
    vec3 col=mix(uC2,uC,smoothstep(-.6,.6,vL.y)); float ink=0., wax=0.;      // 上下のぼかし染め
    if(uMode==1.){ float q=dot(vL,uAx), s=sin(q*8.5+sin(vL.y*5.+vL.z*4.)*1.2), up=smoothstep(-.55,-.05,vL.y);
      ink=smoothstep(.5,.62,s)*up; wax=(smoothstep(.22,.32,s)-smoothstep(.5,.62,s))*up; col=mix(vec3(1.,.95,.82),col,smoothstep(-.8,-.3,vL.y)); }
    else if(uMode==2.){ float s=sin(vF.x*2.4+vF.y*4.5+sin(vF.y*5.+vF.z*2.2)*1.5); wax=smoothstep(.55,.7,s); ink=smoothstep(.2,.3,s)-smoothstep(.42,.52,s); }
    else if(uMode==3.){ col=mix(uC2,uC,step(.5,fract((vL.x+vL.z)*.9))); ink=step(.47,abs(vL.y)/1.3)*step(vL.y,0.); }
    col=mix(col,vec3(1.,.96,.84),wax)*min(lum,1.25);                         // ろうの所は染まらず、白く明るくぬける
    col=mix(col,vec3(.012,.01,.014),ink);                                    // 墨
    float e=min(vB.x,min(vB.y,vB.z)), wire=1.-smoothstep(.6,1.8,e/fwidth(e)); col*=1.-.42*wire;   // 針金の骨の影
    gl_FragColor=vec4(col,1.);
  }` });
const inkM = new THREE.MeshBasicMaterial({ color: '#020203', side: THREE.BackSide }), blkM = new THREE.MeshBasicMaterial({ color: '#020203' });
const flt = new THREE.Group(); scene.add(flt);
function part(geo, mat, p, s = [1, 1, 1], r = [0, 0, 0], ol = .08) {
  const g = geo.index ? geo.toNonIndexed() : geo.clone(), n = g.attributes.position.count, bc = new Float32Array(n * 3); for (let i = 0; i < n; i++) bc[i * 3 + i % 3] = 1; g.setAttribute('bc', new THREE.BufferAttribute(bc, 3));
  const m = new THREE.Mesh(g, mat); m.position.set(...p); m.scale.set(...s); m.rotation.set(...r); m.updateMatrix(); const fp = g.attributes.position.clone(); fp.applyMatrix4(m.matrix); g.setAttribute('fp', fp);
  if (ol) { const o = new THREE.Mesh(g, inkM); o.scale.setScalar(1 + ol); m.add(o); } flt.add(m); return m;
}
const blk = (geo, p, s = [1, 1, 1], r = [0, 0, 0]) => { const m = new THREE.Mesh(geo, blkM); m.position.set(...p); m.scale.set(...s); m.rotation.set(...r); flt.add(m); };
const ICO = new THREE.IcosahedronGeometry(1, 1), ICO0 = new THREE.IcosahedronGeometry(1, 0);
const tiger = paper('#ffb400', '#ff5a08', 1), tigerV = paper('#ffb400', '#ff5a08', 1, [0, 1, 0]), white = paper('#fff2d8', '#ffe2a8'), red = paper('#f01818', '#b00a18'), wave = paper('#2a6cff', '#0c1fb0', 2), green = paper('#3ad03a', '#0a8a3a'), yel = paper('#ffc81e', '#ff7a10');
// 台（紅白の幕）と波
part(new THREE.BoxGeometry(11.6, 1.3, 5.2, 6, 1, 3), paper('#e81a1a', '#fff2d8', 3, [1, 0, 0], .5), [0, .95, 0], [1, 1, 1], [0, 0, 0], 0);
for (const [x, y, z, sx, sy, sz] of [[4.6, 2, 1.5, 1.5, 1, 1.2], [4.9, 1.9, -1.2, 1.3, .9, 1.2], [2, 1.9, 2, 1.5, .9, 1], [-1.2, 2, 2.1, 1.7, 1, 1], [-4.2, 2, 1.4, 1.6, 1.1, 1.3], [-4.6, 1.9, -1.3, 1.4, 1, 1.2], [.2, 1.9, -2, 1.8, .9, 1], [2.9, 1.8, -2, 1.3, .8, .9], [-2.5, 1.8, -2.1, 1.4, .9, 1], [5.6, 2.5, .2, .8, 1.3, .9]]) part(ICO, wave, [x, y, z], [sx, sy, sz], [0, x, 0]);
// とら
part(ICO, tiger, [-.6, 4.3, 0], [3.1, 1.65, 1.6], [0, 0, .12]); part(ICO, tiger, [1.7, 4.7, 0], [1.7, 1.8, 1.55]); part(ICO, tiger, [3.3, 5.7, 0], [1.6, 1.5, 1.55], [0, 0, -.1]);
part(ICO, white, [4.5, 5.2, 0], [.9, .72, 1.05]); part(ICO0, red, [4.75, 4.55, 0], [.6, .38, .7], [0, 0, -.2], .12); blk(ICO0, [5.38, 5.5, 0], [.2, .17, .3]);
for (const s of [1, -1]) {
  part(ICO, white, [4.35, 6.1, s * .72], [.4, .46, .34], [0, 0, 0], .16); blk(ICO0, [4.72, 6.08, s * .74], [.14, .22, .16]); blk(new THREE.BoxGeometry(.3, .16, .95), [4.5, 6.62, s * .7], [1, 1, 1], [s * .42, 0, -.2]);
  part(new THREE.ConeGeometry(.5, .9, 4), yel, [2.9, 7.2, s * 1], [1, 1, 1], [s * .3, .8, 0], .14); part(ICO0, white, [3.9, 5.2, s * 1.3], [.5, .62, .45], [0, 0, 0], .12);
  part(new THREE.ConeGeometry(.14, .5, 4), white, [5.05, 4.7, s * .36], [1, 1, 1], [Math.PI, 0, 0], .2);
  part(ICO, tigerV, [2.7, 3.1, s * 1.3], [.68, 1.5, .7], [0, 0, -.55]); part(ICO0, white, [3.7, 2.1, s * 1.35], [.85, .5, .75], [0, 0, 0], .1);
  part(ICO, tigerV, [-2.6, 3.3, s * 1.35], [1.15, 1.55, .85], [0, 0, .2]); part(ICO0, white, [-1.9, 2.1, s * 1.5], [.95, .48, .72], [0, 0, 0], .1);
}
[[-3.7, 4.7], [-4.6, 5.2], [-5.25, 6.1], [-5.3, 7.2], [-4.75, 8.05], [-3.9, 8.3]].forEach(([x, y], i) => part(ICO0, i === 5 ? white : tigerV, [x, y, 0], [.62, .68, .55], [0, 0, i * .6], .12));
// 竹（緑）
for (const [x, z, h, tz] of [[-1.3, -1.7, 6.4, .06], [-.3, -2, 7.4, -.05], [-2.6, -1.9, 5.6, .12]]) { part(new THREE.CylinderGeometry(.2, .24, h, 5, 3), green, [x, 2 + h / 2, z], [1, 1, 1], [0, 0, tz], .25); for (let i = 0; i < 4; i++) part(new THREE.ConeGeometry(.34, 1.9, 4), green, [x - tz * h / 2 + Math.cos(i * 1.7) * .9, 2 + h - .3 - i * .5, z + Math.sin(i * 2.3) * .5], [1, 1, .35], [0, i, Math.PI / 2 + Math.cos(i * 1.7) * 1.1], .16); }
const mir = flt.clone(true); mir.scale.y = -1; scene.add(mir);

// ── ぬれた路面（水たまりの所ほど よく映る）
const ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), new THREE.ShaderMaterial({ transparent: true, uniforms: { uS: { value: 0 } },
  vertexShader: `varying vec3 vW; void main(){ vW=(modelMatrix*vec4(position,1.)).xyz; gl_Position=projectionMatrix*viewMatrix*vec4(vW,1.); }`,
  fragmentShader: `varying vec3 vW; uniform float uS; float h(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); } float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y); }
  void main(){ vec2 p=vW.xz+vec2(uS,0.); float pud=smoothstep(.4,.62,n(p*.3)*.7+n(p*1.1)*.3); float a=mix(.84,.3,pud)+n(p*9.)*.05; a=mix(a,1.,smoothstep(24.,70.,length(vW.xz)));
    vec3 col=mix(vec3(.011,.012,.02),vec3(.003,.004,.009),pud); gl_FragColor=vec4(col,a); }` }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
// ── 家なみ（黒い影と、少しの窓あかり）と、ちょうちんの列
const wc = document.createElement('canvas'); wc.width = 32; wc.height = 32; { const c = wc.getContext('2d'); c.fillStyle = '#05060c'; c.fillRect(0, 0, 32, 32); for (let i = 0; i < 5; i++) { c.fillStyle = ['#6a4a1a', '#3a2a12', '#54401c'][i % 3]; c.fillRect(3 + (i * 13) % 26, 5 + (i * 7) % 22, 3, 4); } }
const wt = new THREE.CanvasTexture(wc); wt.colorSpace = THREE.SRGBColorSpace; wt.magFilter = THREE.NearestFilter;
const houses = [...Array(16)].map((_, i) => { const h = 5 + (i * 37 % 7), m = new THREE.Mesh(new THREE.BoxGeometry(6.4, h, 5), new THREE.MeshBasicMaterial({ map: wt })); m.position.set(0, h / 2, -13 - (i % 3)); m.userData.ox = i * 6.6; scene.add(m); return m; });
const NL = 44, lant = new THREE.InstancedMesh(new THREE.SphereGeometry(.3, 8, 6), new THREE.MeshBasicMaterial({ color: '#ff5a22' }), NL); scene.add(lant);
// ── はねる人たち（黒い影。花がさだけ少し色）
const NH = 34, hb = new THREE.InstancedMesh(new THREE.BoxGeometry(.55, 1, .32), new THREE.MeshBasicMaterial({ color: '#07080f' }), NH), hh = new THREE.InstancedMesh(new THREE.SphereGeometry(.2, 8, 6), new THREE.MeshBasicMaterial({ color: '#07080f' }), NH), hat = new THREE.InstancedMesh(new THREE.ConeGeometry(.4, .2, 8), new THREE.MeshBasicMaterial({ color: '#4a1626' }), NH); scene.add(hb, hh, hat);
const rnd = (() => { let s = 11; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const hop = [...Array(NH)].map((_, i) => i < 14 ? { x: -10 + i * 1.5 + rnd(), z: 4.6 + rnd() * 2.6, ph: rnd(), s: .7 + rnd() * .2 } : i < 22 ? { x: 8 + rnd() * 6, z: -4 + rnd() * 5, ph: rnd(), s: .8 + rnd() * .2 } : { x: -10 + rnd() * 20, z: -3.6 - rnd() * 2.5, ph: rnd(), s: .9 + rnd() * .2 });
const O = new THREE.Object3D();

// ── 画面の仕上げ: 明るい所だけを取り出して ぼかし、足す（ブルーム）
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2)), qs = new THREE.Scene(), qc = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1); qs.add(quad);
const VS = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`;
const blur = new THREE.ShaderMaterial({ uniforms: { tex: { value: null }, dir: { value: new THREE.Vector2() }, thr: { value: 0 } }, vertexShader: VS, depthTest: false,
  fragmentShader: `uniform sampler2D tex; uniform vec2 dir; uniform float thr; varying vec2 vUv; vec3 f(vec2 o){ return max(texture2D(tex,vUv+o).rgb-thr,0.); }
  void main(){ gl_FragColor=vec4(f(vec2(0.))*.227+(f(dir*1.385)+f(-dir*1.385))*.316+(f(dir*3.23)+f(-dir*3.23))*.07,1.); }` });
const comp = new THREE.ShaderMaterial({ uniforms: { tex: { value: rtS.texture }, bl: { value: rtB.texture } }, vertexShader: VS, depthTest: false,
  fragmentShader: `uniform sampler2D tex, bl; varying vec2 vUv; void main(){ vec3 c=texture2D(tex,vUv).rgb+texture2D(bl,vUv).rgb*1.15; vec2 q=vUv-.5; c*=1.-dot(q,q)*.7; gl_FragColor=vec4(c,1.);
    #include <colorspace_fragment>
  }` });
const pass = (mat, target) => { quad.material = mat; renderer.setRenderTarget(target); renderer.render(qs, qc); };
const doBlur = (src, dst, dx, dy, thr) => { blur.uniforms.tex.value = src.texture; blur.uniforms.dir.value.set(dx / rtA.width, dy / rtA.height); blur.uniforms.thr.value = thr; pass(blur, dst); };

let last = performance.now(), t = 0;
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt;
  // 山車は かつぎ手の足なみで ゆれ、ときどき向きを変えて見せる
  const yaw = -.62 + Math.sin(t * Math.PI * 2 / 16 + .6) * .26, tilt = Math.sin(t * 2.1) * .022, bob = Math.abs(Math.sin(t * 4.2)) * .07, sc = t * 1.5;
  flt.rotation.set(0, yaw, tilt); flt.position.y = bob; mir.rotation.set(0, yaw, -tilt); mir.position.y = -bob;
  ground.material.uniforms.uS.value = sc;
  for (const m of houses) m.position.x = ((m.userData.ox - sc) % 105.6 + 105.6) % 105.6 - 60;
  for (let i = 0; i < NL; i++) { const x = ((i * 1.5 - sc) % 66 + 66) % 66 - 36, u = (i % 8) / 8; O.position.set(x, 5.2 - Math.sin(u * Math.PI) * .7 + Math.sin(t * 1.3 + i) * .04, -9.5); O.scale.set(1, 1.3, 1); O.rotation.set(0, 0, 0); O.updateMatrix(); lant.setMatrixAt(i, O.matrix); } lant.instanceMatrix.needsUpdate = true;
  hop.forEach((p, i) => { const b = (t * 2.1 + p.ph * .25 + (i % 2) * .5) % 1, y = Math.sin(b * Math.PI) * .75 * p.s, lean = Math.sin(t * 4.2 + i) * .18;
    O.rotation.set(0, 0, lean); O.scale.setScalar(p.s); O.position.set(p.x, .95 * p.s + y, p.z); O.updateMatrix(); hb.setMatrixAt(i, O.matrix);
    O.position.set(p.x - lean * .7, 1.7 * p.s + y, p.z); O.updateMatrix(); hh.setMatrixAt(i, O.matrix); O.position.y += .2 * p.s; O.updateMatrix(); hat.setMatrixAt(i, O.matrix); });
  hb.instanceMatrix.needsUpdate = hh.instanceMatrix.needsUpdate = hat.instanceMatrix.needsUpdate = true;
  cam.position.set(9.6 + Math.sin(t * .21) * .8, 3, 14.6); cam.lookAt(-.2, 4.3, 0);
  renderer.setRenderTarget(rtS); renderer.render(scene, cam);
  doBlur(rtS, rtA, 1, 0, .58); doBlur(rtA, rtB, 0, 1, 0); doBlur(rtB, rtA, 2.6, 0, 0); doBlur(rtA, rtB, 0, 2.6, 0);
  pass(comp, null); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
