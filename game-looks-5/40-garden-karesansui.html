<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 40 庭づくりパズル 枯山水の石庭</title>
<style>
html,body{margin:0;height:100%;background:#d9d5ca;overflow:hidden}
canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#f1e6d2;background:#3a2816cc;padding:0 6px}
</style>
<canvas id="c"></canvas>
<canvas id="o"></canvas>
<div id="cap">LOOK 40 ─ 庭づくりパズル / 枯山水の石庭　｜　見るだけ（自動で熊手が砂紋を引く）</div>
<script>
// 真上から見た枯山水。砂紋は「高さの場」（1 ますに 1 つの高さ）として持ち、熊手が通った所だけ、歯の形のみぞで上書きする。
// 絵は素の WebGL で、高さのかたむきから面の向きを出して、左上の低い朝の光で照らす（みぞの片側が明るく、片側が影）。
// 石は長い影を引き、まわりを苔がふちどる。砂には粒のざらつき。色は砂の白・石の灰・苔の緑だけで、下のはしに木の縁側が見える。
// 動かないもの（石・苔・影・砂の粒・縁側）は、はじめに 1 回だけ別の絵に焼いておき、毎コマは「熊手が砂を書きかえた四角」の中だけ、砂の明暗を描き直す
const cv = document.getElementById('c'), ov = document.getElementById('o'), o = ov.getContext('2d');
const gl = cv.getContext('webgl', { antialias: false, alpha: false, preserveDrawingBuffer: true });
const P = 6, TINES = 5, HALF = P * TINES / 2;       // みぞの間かく（ます）、熊手の歯の数、熊手の半分の幅
const VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS = `precision highp float;
uniform vec2 uRes; uniform float uTex, uGy;
uniform vec4 uSt[5]; uniform vec4 uSb[5]; uniform vec4 uIsl[3];
float hash(vec2 p){ p=fract(p*vec2(.1031,.1030)); p+=dot(p,p.yx+33.33); return fract((p.x+p.y)*p.x); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
void main(){
  vec2 fc=vec2(gl_FragCoord.x, uRes.y-gl_FragCoord.y), p=fc/uTex;
  vec3 L=normalize(vec3(-.8,-.38,.42)); vec2 Lxy=normalize(L.xy);
  float grain=hash(floor(fc)); vec3 col; float al=1.;
  if(fc.y<uGy){
    float sh=0.; bool stone=false, moss=false;
    // 苔の島（でこぼこのふち、こんもりした明暗、砂に落ちる短い影）
    for(int i=0;i<3;i++){ vec4 I=uIsl[i]; float m=I.z*.86, k=float(i)*7.;
      vec2 d=p-I.xy; float e=length(d)+(vn(p*.07+k)-.5)*I.z*.35+(vn(p*.3)-.5)*I.z*.08;
      if(e<m){ vec2 gr=vec2(vn(p*.5+vec2(.6,0.))-vn(p*.5-vec2(.6,0.)), vn(p*.5+vec2(0.,.6))-vn(p*.5-vec2(0.,.6)));
        float edge=smoothstep(m,m-5.,e); float md=dot(normalize(vec3(-gr*2.6+normalize(d)*(1.-edge)*1.3,1.)),L);
        col=mix(vec3(.14,.22,.09),vec3(.46,.56,.24),smoothstep(0.,.8,md))*(.8+.35*vn(p*1.1+3.))*(.9+.2*grain); moss=true;
      } else { vec2 q=p+Lxy*3.5; float e2=length(q-I.xy)+(vn(q*.07+k)-.5)*I.z*.35+(vn(q*.3)-.5)*I.z*.08; sh=max(sh,.55*smoothstep(m,m-1.5,e2)); }
    }
    // 石（ゆがんだ長丸のこぶ。面をけずったような明暗）と、その長い影
    for(int i=0;i<5;i++){ vec4 A=uSt[i], B=uSb[i]; float c=cos(B.x), s=sin(B.x);
      vec2 d=p-A.xy, q=vec2(c*d.x+s*d.y,-s*d.x+c*d.y)/A.zw; float e=length(q)+(vn(p*.11+B.z)-.5)*.3;
      if(e<1.){ float z=sqrt(1.-e*e); vec2 gq=q/max(e,.001)*e/(z+.25), gw=vec2(c*gq.x-s*gq.y,s*gq.x+c*gq.y);
        vec2 fac=vec2(vn(p*.17+B.z*3.)-.5,vn(p*.17+B.z*5.+7.)-.5)*1.8;
        float sd=dot(normalize(vec3(gw*B.y*.9+fac,1.)),L);
        col=mix(vec3(.15,.16,.18),vec3(.80,.79,.76),smoothstep(-.15,.85,sd))*(.82+.3*vn(p*1.4+B.z))*(.9+.14*grain)*(.65+.35*smoothstep(1.,.82,e));
        stone=true;
      } else { float Ls=B.y*A.z*3.3;
        for(int k=1;k<=16;k++){ float f=float(k)/16.; vec2 d2=p+Lxy*f*Ls-A.xy, q2=vec2(c*d2.x+s*d2.y,-s*d2.x+c*d2.y)/A.zw; float w=1.-.6*f; sh=max(sh,(1.-.25*f)*smoothstep(w,w-.3,length(q2))); }
      }
    }
    if(!stone&&!moss){ col=vec3(sh,grain,vn(fc*.3)); al=0.; } else if(!stone) col*=mix(vec3(1.),vec3(.50,.54,.68),sh);
  } else {
    // 縁石と、木の縁側（板の合わせ目と木目）
    float y=fc.y-uGy, kerb=uTex*6.;
    if(y<kerb){ float bx=floor(fc.x/(uTex*30.)), f=fract(fc.x/(uTex*30.)); col=vec3(.50,.50,.49)*(.75+.35*hash(vec2(bx,3.)))*(.85+.3*vn(fc*.25))*(.6+.4*smoothstep(0.,.03,f))*(y<uTex*1.2?1.2:1.)*(.92+.12*grain); }
    else { float bw=uTex*17., row=floor((y-kerb)/bw), fy=fract((y-kerb)/bw);
      float gn=vn(vec2(fc.x*.012+row*17.,y*.6)), gn2=vn(vec2(fc.x*.05+row*5.,y*1.9));
      col=mix(vec3(.36,.23,.12),vec3(.68,.48,.27),gn*.6+gn2*.4)*(.85+.25*hash(vec2(row,1.)))*(.55+.45*smoothstep(0.,.07,fy))*(.93+.1*grain)*(1.-.3*smoothstep(uTex*8.,0.,y-kerb));
    }
  }
  gl_FragColor=vec4(col,al);
}`;
// 毎コマのシェーダー: 砂の所だけ、高さのかたむき → 面の向き → 低い光で明暗。そこへ焼いておいた影と粒をかける
const FS2 = `precision highp float;
uniform sampler2D uH, uB; uniform vec2 uRes, uField; uniform float uTex;
float Hh(vec2 p){ return texture2D(uH,(p+.5)/uField).r; }
void main(){
  vec4 b=texture2D(uB,gl_FragCoord.xy/uRes); if(b.a>.5){ gl_FragColor=vec4(b.rgb,1.); return; }
  vec2 p=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y)/uTex; vec3 L=normalize(vec3(-.8,-.38,.42));
  float h=Hh(p), hx=Hh(p+vec2(1.,0.))-Hh(p-vec2(1.,0.)), hy=Hh(p+vec2(0.,1.))-Hh(p-vec2(0.,1.));
  float dif=dot(normalize(vec3(-hx*1.5,-hy*1.5,1.)),L);
  vec3 col=mix(vec3(.60,.61,.66),vec3(1.,.975,.93),smoothstep(.02,.82,dif));
  col*=(.92+.08*h)*(.9+.14*b.g+.06*(b.b-.5)); col+=step(.988,b.g)*step(.45,dif)*.1;
  gl_FragColor=vec4(col*mix(vec3(1.),vec3(.44,.48,.62),b.r),1.);
}`;
const sh = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(x)); return x; };
const prog = fs => { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.bindAttribLocation(p, 0, 'a'); gl.linkProgram(p); return p; };
const prBake = prog(FS), pr = prog(FS2);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const htex = gl.createTexture(), btex = gl.createTexture(), fbo = gl.createFramebuffer(); gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
for (const [t, flt] of [[htex, gl.LINEAR], [btex, gl.NEAREST]]) { gl.bindTexture(gl.TEXTURE_2D, t); for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, flt], [gl.TEXTURE_MAG_FILTER, flt], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v); }

let W, H, S, tex, FW, FH, gw, gh, hf, isl, lanes, rake, queue, lane = 0, dirty = null;
const groove = d => 128 - 127 * Math.cos(d / P * 6.2832);     // みぞの断面（0 が底）
function build() {
  S = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; for (const c of [cv, ov]) { c.width = W * S; c.height = H * S; }
  tex = Math.max(W, H) / 560; FW = Math.ceil(W / tex) + 2; FH = Math.ceil(H / tex) + 2; const EH = Math.max(64, Math.min(120, H * .125));
  gw = W / tex; gh = (H - EH) / tex; const m = Math.min(gw, gh), wide = W > H;
  isl = (wide ? [[.24, .41, .125], [.70, .31, .105], [.56, .78, .075]] : [[.35, .2, .17], [.65, .5, .15], [.37, .8, .12]]).map(([x, y, r]) => ({ x: x * gw, y: y * gh, r: r * m, ok: 1 }));
  lanes = wide ? [.6, .1] : [.35, .66];
  // 石: 島ごとに 1〜2 個（位置、半径 2 つ、回り、高さ、たね）
  const st = [[0, -.1, -.08, .64, .44, .35, 1.1, 1], [0, .52, .34, .26, .19, -.5, .7, 2], [1, .08, -.12, .56, .46, 1.2, 1.3, 3], [1, -.46, .36, .36, .22, .2, .55, 4], [2, 0, -.04, .66, .44, -.3, .8, 5]].map(([i, dx, dy, rx, ry, rot, h, sd]) => [isl[i].x + dx * isl[i].r, isl[i].y + dy * isl[i].r, rx * isl[i].r, ry * isl[i].r, rot, h, sd * 3.7, 0]);
  // 動かないものを 1 回だけ焼く
  gl.viewport(0, 0, cv.width, cv.height); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, btex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, cv.width, cv.height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, btex, 0);
  let U = n => gl.getUniformLocation(prBake, n); gl.useProgram(prBake); gl.uniform2f(U('uRes'), cv.width, cv.height); gl.uniform1f(U('uTex'), tex * S); gl.uniform1f(U('uGy'), (H - EH) * S);
  gl.uniform4fv(U('uSt'), st.flatMap(s => s.slice(0, 4))); gl.uniform4fv(U('uSb'), st.flatMap(s => s.slice(4))); gl.uniform4fv(U('uIsl'), isl.flatMap(i => [i.x, i.y, i.r, 0]));
  gl.drawArrays(gl.TRIANGLES, 0, 3); gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  U = n => gl.getUniformLocation(pr, n); gl.useProgram(pr); gl.uniform2f(U('uRes'), cv.width, cv.height); gl.uniform2f(U('uField'), FW, FH); gl.uniform1f(U('uTex'), tex * S); gl.uniform1i(U('uH'), 0); gl.uniform1i(U('uB'), 1);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, htex);
  // はじめの庭: 横のまっすぐな砂紋と、島のまわりの輪
  hf = new Uint8Array(FW * FH);
  for (let y = 0; y < FH; y++) for (let x = 0; x < FW; x++) { let v = groove(y); for (const I of isl) { const d = Math.hypot(x - I.x, y - I.y) - I.r; if (d < 0) v = 150; else if (d < P * TINES) v = groove(d); } hf[x + y * FW] = v; }
  rake = { x: -HALF, y: lanes[0] * gh, dx: 1, dy: 0, down: 1, lift: 0 }; queue = []; lane = 0; plan(); advance(1.7); dirty = [0, 0, FW, FH];
}
// 熊手の歯で、いまの場所の砂を上書きする（熊手の横 1 列ぶん）
function stamp(x, y, dx, dy) {
  const r = HALF + 3; dirty = dirty ? [Math.min(dirty[0], x - r), Math.min(dirty[1], y - r), Math.max(dirty[2], x + r), Math.max(dirty[3], y + r)] : [x - r, y - r, x + r, y + r];
  for (let py = Math.max(0, Math.floor(y - r)); py <= Math.min(FH - 1, y + r); py++) for (let px = Math.max(0, Math.floor(x - r)); px <= Math.min(FW - 1, x + r); px++) {
    const ex = px - x, ey = py - y, a = -dy * ex + dx * ey, b = dx * ex + dy * ey; if (Math.abs(a) > HALF || Math.abs(b) > 1.3) continue;   // a: 熊手の横、b: 進む向き
    if (isl.some(I => Math.hypot(px - I.x, py - I.y) < I.r)) continue; hf[px + py * FW] = groove(a + HALF);
  }
}
// つぎの手を決める: 輪がくずれた島があれば、その島をひと回り。なければ、庭を横切る波の筋を 1 本
function plan() {
  const I = isl.find(i => !i.ok); let seg;
  if (I) { const rc = I.r + HALF + .5, a0 = Math.atan2(rake.y - I.y, rake.x - I.x); seg = { dur: rc * 6.6 / 85, at: f => [I.x + Math.cos(a0 + f * 6.6) * rc, I.y + Math.sin(a0 + f * 6.6) * rc], end: () => { I.ok = 1; } }; }
  else { const y0 = lanes[lane % lanes.length] * gh, ph = lane * 2.1, dir = lane % 2 ? -1 : 1, amp = gh * .045; lane++; seg = { dur: (gw + HALF * 2) / 95, pass: 1, at: f => { const x = dir > 0 ? -HALF + f * (gw + HALF * 2) : gw + HALF - f * (gw + HALF * 2); return [x, y0 + Math.sin(x * .045 + ph) * amp]; } }; }
  const s = seg.at(0), d = Math.hypot(s[0] - rake.x, s[1] - rake.y), x0 = rake.x, y0 = rake.y;
  if (d > 2) queue.push({ dur: Math.max(.45, d / 190), up: 1, at: f => { const e = f * f * (3 - 2 * f); return [x0 + (s[0] - x0) * e, y0 + (s[1] - y0) * e]; } });
  seg.t = 0; queue.push(seg); queue[0].t = 0;
}
function advance(dt) {
  while (dt > 0) {
    const sg = queue[0], step = Math.min(dt, .004); dt -= step; sg.t = (sg.t || 0) + step;
    const f = Math.min(1, sg.t / sg.dur), [nx, ny] = sg.at(f), [ax, ay] = sg.at(Math.min(1, f + .01)), mx = ax - nx, my = ay - ny, ml = Math.hypot(mx, my);
    if (ml > 1e-4 && !sg.up) { rake.dx = mx / ml; rake.dy = my / ml; }
    if (sg.up && ml > 1e-4) { const k = Math.min(1, step * 5); rake.dx += (mx / ml - rake.dx) * k; rake.dy += (my / ml - rake.dy) * k; const l = Math.hypot(rake.dx, rake.dy) || 1; rake.dx /= l; rake.dy /= l; }
    rake.x = nx; rake.y = ny; rake.down = !sg.up; rake.lift += ((sg.up ? 1 : 0) - rake.lift) * Math.min(1, step * 9);
    if (!sg.up) { stamp(nx, ny, rake.dx, rake.dy); if (sg.pass) for (const I of isl) if (Math.hypot(nx - I.x, ny - I.y) < I.r + P * TINES + HALF - P) I.ok = 0; }
    if (f >= 1) { if (sg.end) sg.end(); queue.shift(); if (!queue.length) plan(); else queue[0].t = 0; }
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; advance(dt);
  if (dirty) { // 書きかわった四角だけ、高さを送り直して描き直す
    const x0 = Math.max(0, Math.floor(dirty[0])), y0 = Math.max(0, Math.floor(dirty[1])), x1 = Math.min(FW, Math.ceil(dirty[2])), y1 = Math.min(FH, Math.ceil(dirty[3])), k = tex * S;
    if (x1 > x0 && y1 > y0) {
      if (x1 - x0 === FW && y1 - y0 === FH) gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, FW, FH, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, hf); else gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, y0, FW, y1 - y0, gl.LUMINANCE, gl.UNSIGNED_BYTE, hf.subarray(y0 * FW, y1 * FW));
      gl.enable(gl.SCISSOR_TEST); gl.scissor(Math.floor(x0 * k), Math.floor(cv.height - y1 * k), Math.ceil((x1 - x0) * k) + 1, Math.ceil((y1 - y0) * k) + 1); gl.drawArrays(gl.TRIANGLES, 0, 3); gl.disable(gl.SCISSOR_TEST);
    }
    dirty = null;
  }
  // 上に重ねる絵: 熊手（木の柄と歯の横木）とその影、石の輪のしるし
  o.setTransform(1, 0, 0, 1, 0, 0); o.clearRect(0, 0, ov.width, ov.height); o.setTransform(S * tex, 0, 0, S * tex, 0, 0); o.lineCap = 'round';
  const L = rake.lift, rk = (ox, oy, c1, c2) => { o.save(); o.translate(rake.x + ox, rake.y + oy); o.transform(rake.dx, rake.dy, -rake.dy, rake.dx, 0, 0); const k = 1 + L * .06; o.scale(k, k); o.strokeStyle = c1; o.lineWidth = 2.4; o.beginPath(); o.moveTo(2, 0); o.lineTo(96, 0); o.stroke(); o.strokeStyle = c2; o.lineWidth = 4.2; o.lineCap = 'butt'; o.beginPath(); o.moveTo(1, -HALF - 1); o.lineTo(1, HALF + 1); o.stroke(); if (c1 !== c2) { o.strokeStyle = '#3d2814'; o.lineWidth = 1.6; o.beginPath(); for (let i = 0; i < TINES; i++) { const a = -HALF + (i + .5) * P; o.moveTo(-1.6, a); o.lineTo(.6, a); } o.stroke(); o.strokeStyle = 'rgba(255,235,200,.45)'; o.lineWidth = .6; o.beginPath(); o.moveTo(4, -.7); o.lineTo(95, -.7); o.stroke(); } o.restore(); };
  rk(4 + L * 9, 2 + L * 4.5, 'rgba(45,50,80,.4)', 'rgba(45,50,80,.4)'); rk(0, 0, '#a47a48', '#7a5530');
  o.setTransform(S, 0, 0, S, 0, 0); const u = Math.sqrt(W * H) / 900, hx = W / 2, hy = 30 * u; o.font = `600 ${15 * u}px "Hiragino Mincho ProN","Yu Mincho",serif`; o.textAlign = 'right'; o.textBaseline = 'middle'; o.fillStyle = 'rgba(70,72,76,.9)'; o.fillText('石の輪', hx - 30 * u, hy);
  isl.forEach((I, i) => { o.beginPath(); o.arc(hx - 10 * u + i * 26 * u, hy, 8 * u, 0, 7); o.lineWidth = 2 * u; o.strokeStyle = 'rgba(70,72,76,.9)'; o.stroke(); if (I.ok) { o.beginPath(); o.arc(hx - 10 * u + i * 26 * u, hy, 4.4 * u, 0, 7); o.fillStyle = '#5d7a34'; o.fill(); } });
  requestAnimationFrame(frame);
}
addEventListener('resize', build); build(); requestAnimationFrame(frame);
</script>
