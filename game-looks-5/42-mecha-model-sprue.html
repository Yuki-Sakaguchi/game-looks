<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOK 42 ロボット組み立て プラモデルのランナー</title>
<style>
html,body{margin:0;height:100%;background:#17463a;overflow:hidden}
canvas{width:100vw;height:100vh;display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#d9f2e4}
</style>
<canvas id="c"></canvas>
<div id="cap">LOOK 42 ─ ロボット組み立て / プラモデルのランナー　｜　見るだけ（自動で組み上がる）</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// プラモデルの部品わく（ランナー）に見立てる: 色は成形色の白・青・赤だけで、ぬり分けはしない。つやのあるプラスチックに照明の映りこみ。
// 四角いわく、部品をつなぐ細い棒（ゲート）、部品番号のタグ。部品には切りはなしたあとの小さな突起が残る。
// 部品は 1 つずつ「ぱちん」と切りはなされ、弧をえがいて飛び、最後は少し手前から「かちっ」と押しこまれる。下はカッターマット
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x17463a);
const cam = new THREE.PerspectiveCamera(36, 1, .1, 120);
scene.add(new THREE.HemisphereLight(0xffffff, 0x2a4a40, .7));
const key = new THREE.DirectionalLight(0xfff6e8, 2.2); key.position.set(-6, 14, 7); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 4; key.shadow.bias = -.0005;
Object.assign(key.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 40 }); scene.add(key);
// つやの映りこみ用に、照明の箱を置いた小さな部屋を作る
{
  const es = new THREE.Scene(); es.add(new THREE.Mesh(new THREE.SphereGeometry(30, 16, 8), new THREE.MeshBasicMaterial({ color: 0x30363a, side: THREE.BackSide })));
  const lamp = (w, h, x, y, z, v) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(v, v, v * .95), side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); es.add(m); };
  lamp(14, 9, -6, 16, 4, 5); lamp(4, 12, 16, 6, 6, 2.5); lamp(10, 3, 0, 5, 18, 1.5);
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(es, .03).texture;
}

let seed = 3; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
function tex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; }
// カッターマット: 緑の地に 1 cm の方眼、目もり、ななめの線、刃のあと
const matT = tex(1024, 1024, (x) => {
  x.fillStyle = '#1f6a55'; x.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i <= 1024; i += 32) { const b = i % 160 === 0; x.fillStyle = b ? 'rgba(215,240,200,.75)' : 'rgba(205,235,190,.3)'; x.fillRect(i - (b ? 1 : .5), 0, b ? 2 : 1, 1024); x.fillRect(0, i - (b ? 1 : .5), 1024, b ? 2 : 1); }
  x.strokeStyle = 'rgba(215,240,200,.4)'; x.lineWidth = 1.5; for (const a of [.5, 1, 2]) { x.beginPath(); x.moveTo(160, 864); x.lineTo(160 + 640, 864 - 640 * a > 64 ? 864 - 640 * a : 64); x.stroke(); }
  x.fillStyle = 'rgba(225,245,210,.8)'; x.font = 'bold 20px ui-monospace,monospace'; for (let i = 1; i < 6; i++) { x.fillText(String(i * 5), i * 160 + 5, 1016); x.fillText(String(i * 5), 6, 1024 - i * 160 - 5); }
  for (let i = 0; i < 40; i++) { x.strokeStyle = `rgba(${rnd() < .5 ? '10,50,38' : '160,215,180'},.35)`; x.lineWidth = 1; x.beginPath(); const a = rnd() * 1024, b = rnd() * 1024, r = rnd() * 6; x.moveTo(a, b); x.lineTo(a + Math.cos(r) * 150 * rnd(), b + Math.sin(r) * 150 * rnd()); x.stroke(); }
});
matT.wrapS = matT.wrapT = THREE.RepeatWrapping; matT.repeat.set(2, 2);
const mat = new THREE.Mesh(new THREE.PlaneGeometry(64, 64), new THREE.MeshStandardMaterial({ map: matT, roughness: .6, envMapIntensity: .35 })); mat.rotation.x = -Math.PI / 2; mat.receiveShadow = true; scene.add(mat);

// 成形色は 3 つだけ
const COL = { A: 0xe8e5da, B: 0x2659c0, C: 0xd3372b }, PL = {};
for (const k in COL) PL[k] = new THREE.MeshStandardMaterial({ color: COL[k], roughness: .22, metalness: 0, envMapIntensity: 1.1 });
const cyl = (r, len, mat, parent, x, y, z, axis = 'x') => { const g = new THREE.CylinderGeometry(r, r, len, 8); if (axis === 'x') g.rotateZ(Math.PI / 2); if (axis === 'z') g.rotateX(Math.PI / 2); const m = new THREE.Mesh(g, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; };
const bx = (w, h, d, mat, parent, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; };

// 部品: [名前, わく, 組み上がりの位置, 箱のならび [w,h,d,x,y,z]...]
const DEF = [
  ['footL', 'C', [-.36, .12, 0], [[.52, .24, .8, 0, 0, .08], [.4, .12, .3, 0, .1, .3]]],
  ['footR', 'C', [.36, .12, 0], [[.52, .24, .8, 0, 0, .08], [.4, .12, .3, 0, .1, .3]]],
  ['legL', 'A', [-.36, .69, 0], [[.4, .9, .44, 0, 0, 0], [.3, .26, .12, 0, .16, .25], [.46, .16, .5, 0, -.3, 0]]],
  ['legR', 'A', [.36, .69, 0], [[.4, .9, .44, 0, 0, 0], [.3, .26, .12, 0, .16, .25], [.46, .16, .5, 0, -.3, 0]]],
  ['hip', 'B', [0, 1.3, 0], [[1.06, .32, .52, 0, 0, 0], [.3, .42, .12, 0, -.06, .3]]],
  ['torso', 'A', [0, 1.86, 0], [[1.1, .8, .62, 0, 0, 0], [.5, .12, .4, 0, .46, 0], [.9, .2, .7, 0, -.22, 0]]],
  ['chest', 'B', [0, 1.98, .37], [[.74, .36, .14, 0, 0, 0], [.2, .1, .08, -.2, .02, .09], [.2, .1, .08, .2, .02, .09]]],
  ['pack', 'B', [0, 1.92, -.45], [[.72, .62, .28, 0, 0, 0], [.2, .3, .2, -.2, -.36, 0], [.2, .3, .2, .2, -.36, 0]]],
  ['shL', 'C', [-.84, 2.1, 0], [[.5, .42, .64, 0, 0, 0], [.56, .12, .4, 0, .2, 0]]],
  ['armL', 'A', [-.84, 1.48, 0], [[.3, .82, .34, 0, 0, 0], [.36, .28, .4, 0, -.5, 0]]],
  ['shR', 'C', [.84, 2.1, 0], [[.5, .42, .64, 0, 0, 0], [.56, .12, .4, 0, .2, 0]]],
  ['armR', 'A', [.84, 1.48, 0], [[.3, .82, .34, 0, 0, 0], [.36, .28, .4, 0, -.5, 0]]],
  ['head', 'A', [0, 2.57, 0], [[.56, .48, .56, 0, 0, 0], [.7, .2, .2, 0, -.02, 0], [.3, .1, .4, 0, .27, -.02]]],
  ['visor', 'B', [0, 2.6, .29], [[.46, .13, .08, 0, 0, 0]]],
  ['fin', 'C', [0, 2.86, .26], [[.12, .16, .08, 0, 0, 0], [.4, .07, .06, -.2, .1, 0, .5], [.4, .07, .06, .2, .1, 0, -.5]]],
];
// わく（ランナー）: 四角いわくと、中の横棒・たて棒。部品は 3 列 × 2 段のますに置く
const S = 1.15, RW = 4.5, RD = 3.2, CX = [-1.45, 0, 1.45], CZ = [-.78, .78], runners = {}, parts = [];
const tagT = (txt, col) => tex(64, 40, (x) => { const c = new THREE.Color(col), s = c.getStyle(); x.fillStyle = s; x.fillRect(0, 0, 64, 40); x.font = 'bold 26px ui-monospace,Menlo,monospace'; x.textAlign = 'center'; x.fillStyle = 'rgba(0,0,0,.3)'; x.fillText(txt, 33, 31); x.fillStyle = 'rgba(255,255,255,.6)'; x.fillText(txt, 31, 29); });
for (const k of ['A', 'B', 'C']) {
  const g = new THREE.Group(), m = PL[k]; scene.add(g); runners[k] = { g, n: 0 };
  for (const z of [-RD / 2, 0, RD / 2]) cyl(.07, RW, m, g, 0, .09, z, 'x');
  for (const x of [-RW / 2, -.72, .72, RW / 2]) cyl(.07, RD, m, g, x, .09, 0, 'z');
  for (const x of [-RW / 2, RW / 2]) for (const z of [-RD / 2, RD / 2]) { const s = new THREE.Mesh(new THREE.SphereGeometry(.075, 8, 6), m); s.position.set(x, .09, z); g.add(s); }
  // わくの記号の札
  const tm = new THREE.MeshStandardMaterial({ map: tagT(k, COL[k]), roughness: .22 }); const b = bx(.7, .08, .42, [m, m, tm, m, m, m], g, -RW / 2 + .6, .09, -RD / 2 - .26);
}
DEF.forEach(([name, k, pos, boxes], idx) => {
  const R = runners[k], i = R.n++, cx = CX[i % 3], cz = CZ[(i / 3) | 0], m = PL[k], g = new THREE.Group(); scene.add(g);
  let top = 0, bot = 0;
  boxes.forEach(([w, h, d, x, y, z, rz], j) => { const b = bx(w, h, d, m, g, x, y, z); if (rz) b.rotation.z = rz; if (!j) { top = h / 2; bot = -h / 2; } });
  // ゲートのあと（切りはなしても残る小さな突起）
  for (const y of [top + .03, bot - .03]) cyl(.035, .06, m, g, 0, y, 0, 'y');
  // わくの側: ますの上下の棒から部品までのびるゲートと、番号のタグ
  const zc = cz < 0 ? [-RD / 2, 0] : [0, RD / 2], hs = top * S;
  cyl(.035, cz - hs - zc[0], m, R.g, cx, .09, (zc[0] + cz - hs) / 2, 'z'); cyl(.035, zc[1] - cz - hs, m, R.g, cx, .09, (zc[1] + cz + hs) / 2, 'z');
  const tm = new THREE.MeshStandardMaterial({ map: tagT(k + (i + 1), COL[k]), roughness: .22 }); bx(.42, .07, .24, [m, m, tm, m, m, m], R.g, cx + .42, .09, zc[0] + .2);
  cyl(.03, .12, m, R.g, cx + .42, .09, zc[0] + .08, 'z');
  const home = new THREE.Vector3(cx, Math.max(.09, boxes[0][2] / 2 * S + .01), cz);
  parts.push({ name, g, R, home, local: new THREE.Vector3(...pos), idx, hp: new THREE.Vector3(), hq: new THREE.Quaternion() });
});
// ニッパー
const nip = new THREE.Group(); scene.add(nip);
{
  const grip = new THREE.MeshStandardMaterial({ color: 0xe0a01a, roughness: .55 }), steel = new THREE.MeshStandardMaterial({ color: 0xb8bcc2, roughness: .25, metalness: .9 });
  for (const s of [-1, 1]) { const h = bx(2.1, .22, .34, grip, nip, -1.25, .13, .34 * s); h.rotation.y = -.13 * s; const j = bx(1.0, .16, .26, steel, nip, .55, .1, .1 * s); j.rotation.y = .1 * s; const tip = bx(.5, .12, .14, steel, nip, 1.2, .08, .05 * s); tip.rotation.y = .08 * s; }
  cyl(.2, .2, steel, nip, .1, .12, 0, 'y');
}
// 切りくず（ゲートの切れはし）
for (let i = 0; i < 9; i++) { const k = 'ABC'[i % 3], c = cyl(.035, .12 + rnd() * .15, PL[k], nip, 1.6 + rnd() * 1.6, .04, -1 + rnd() * 2, 'x'); c.rotation.y = rnd() * 3; }
// 切りはなす瞬間の小さな光
const spark = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex(64, 64, (x) => { x.translate(32, 32); x.fillStyle = '#fff'; for (let i = 0; i < 4; i++) { x.rotate(Math.PI / 4); x.beginPath(); x.moveTo(0, -30 + (i % 2) * 12); x.lineTo(4, 0); x.lineTo(0, 30 - (i % 2) * 12); x.lineTo(-4, 0); x.fill(); } }), transparent: true, depthTest: false })); spark.visible = false; scene.add(spark);

// 置き方: 横長はわくを左と奥、ロボットを右手前。たて長はわくを奥へたてに 3 枚
const ROOT = new THREE.Vector3(), QX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2);
function resize() {
  const a = innerWidth / innerHeight, tall = a < 1; renderer.setSize(innerWidth, innerHeight, false); cam.aspect = a;
  const L = tall ? { A: [0, -2.6, .03], B: [0, -6.2, -.02], C: [0, -9.8, .02] } : { A: [-4.1, -2.4, .05], B: [1.0, -2.9, -.04], C: [-4.4, 1.6, -.06] };
  for (const k in L) { runners[k].g.position.set(L[k][0], 0, L[k][1]); runners[k].g.rotation.y = L[k][2]; runners[k].g.updateMatrixWorld(true); }
  tall ? ROOT.set(.5, 0, 1.6) : ROOT.set(4.6, 0, 1.0);
  tall ? nip.position.set(-.9, 0, 4.9) : nip.position.set(-.2, 0, 3.6); nip.rotation.y = tall ? .25 : .5;
  for (const p of parts) { p.hp.copy(p.home).applyMatrix4(p.R.g.matrixWorld); p.hq.copy(p.R.g.quaternion).multiply(QX); }
  if (tall) { cam.fov = 50; cam.position.set(0, 17.5, 10.5); cam.lookAt(0, .6, -2.9); } else { cam.fov = 36; const k = Math.max(1, 1.45 / a); cam.position.set(.6, 9.6 * k, 12.5 * k); cam.lookAt(.4, 1.0, -.4); }
  cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const STEP = .65, FLY = .62, N = parts.length, T_ASM = N * STEP, T_BACK = 13.7, CYCLE = 16;
const cl = v => Math.max(0, Math.min(1, v)), sm = v => { v = cl(v); return v * v * (3 - 2 * v); };
const tp = new THREE.Vector3(), tq = new THREE.Quaternion(), qy = new THREE.Quaternion(), qp = new THREE.Quaternion(), UP = new THREE.Vector3(0, 1, 0), AX = new THREE.Vector3(1, 0, 0), AZ = new THREE.Vector3(0, 0, 1), piv = new THREE.Vector3();
let t = 6.3, last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt;
  const tc = t % CYCLE, pose = sm((tc - T_ASM - .1) / .45) * (1 - sm((tc - T_BACK + .5) / .4));
  const ry = -.45 * pose + Math.sin(tc * 2.2) * .05 * pose, hop = Math.abs(Math.sin(cl((tc - T_ASM - .1) / .5) * Math.PI)) * .35;
  qy.setFromAxisAngle(UP, ry); spark.visible = false;
  for (const p of parts) {
    const g = tc < T_BACK ? cl((tc - p.idx * STEP) / FLY) : 1 - cl((tc - T_BACK - (N - 1 - p.idx) * .08) / .5);
    // 組み上がりの位置。ポーズでは右うでを上げ、左うでを腰に、頭を少し向ける
    tp.copy(p.local); qp.identity();
    if (p.name === 'armR') { piv.set(.84, 2.1, 0); qp.setFromAxisAngle(AX, -2.6 * pose); tp.sub(piv).applyQuaternion(qp).add(piv); }
    if (p.name === 'armL') { piv.set(-.84, 2.1, 0); qp.setFromAxisAngle(AZ, -.5 * pose); tp.sub(piv).applyQuaternion(qp).add(piv); }
    if (p.name === 'head' || p.name === 'visor' || p.name === 'fin') { piv.set(0, 2.3, 0); qp.setFromAxisAngle(UP, .35 * pose); tp.sub(piv).applyQuaternion(qp).add(piv); }
    if (p.name.endsWith('L') && p.name !== 'shL' && p.name !== 'armL') tp.x -= .1 * pose;
    tp.multiplyScalar(S).applyQuaternion(qy).add(ROOT); tp.y += hop; tq.copy(qy).multiply(qp);
    if (g >= 1) { p.g.position.copy(tp); p.g.quaternion.copy(tq); p.g.scale.setScalar(S); continue; }
    if (g <= 0) { p.g.position.copy(p.hp); p.g.quaternion.copy(p.hq); p.g.scale.setScalar(S); continue; }
    // 飛ぶ: 0〜.12 は切りはなし（ふるえて光る）、そのあと弧をえがき、最後は手前から押しこむ
    if (g < .12 && tc < T_BACK) { p.g.position.copy(p.hp); p.g.position.x += Math.sin(g * 400) * .02; p.g.quaternion.copy(p.hq); spark.visible = true; spark.position.copy(p.hp); spark.position.y += .5; spark.scale.setScalar(.5 + g * 9); continue; }
    const f = sm((g - .12) / .7), snap = cl((g - .82) / .18), e = 1 - (1 - snap) * (1 - snap);
    p.g.position.lerpVectors(p.hp, tp, f); p.g.position.y += Math.sin(f * Math.PI) * 2.2; p.g.position.z += (1 - e) * .45 * f;
    p.g.quaternion.slerpQuaternions(p.hq, tq, sm((g - .15) / .55)); p.g.scale.setScalar(S * (1 + Math.sin(snap * Math.PI) * .1));
  }
  PL.B.emissive.setScalar(pose * (.5 + .5 * Math.sin(tc * 9)) * .12);
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
