<div id="cap">LOOK 24 ─ 散歩 / 赤外線写真　｜　見るだけ（並木道をゆっくり歩く）</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 赤外線フィルムの写真に見立てる。木の葉と草は雪のように白く（うすい桃色に）光り、空は黒に近いこい青、水は黒、雲は白くくっきり。
// 色はこの「白桃・こい青・黒」だけ。影は深く、遠くは白くとける。明るい所は小さく描いた絵をぼかして重ね、にじませる（ハレーション）。

import * as THREE from 'three';
const hash = (a, b = 0) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); document.body.prepend(renderer.domElement);

const skyC = document.createElement('canvas'); skyC.width = 4; skyC.height = 256; { const c = skyC.getContext('2d'), gr = c.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, '#01020a'); gr.addColorStop(.4, '#06143a'); gr.addColorStop(.62, '#163872'); gr.addColorStop(1, '#2a4c88'); c.fillStyle = gr; c.fillRect(0, 0, 4, 256); }

const cam = new THREE.PerspectiveCamera(60, 1, .1, 900);
scene.add(new THREE.HemisphereLight(0xb0b6d4, 0xfff0f4, 2.3));
const sun = new THREE.DirectionalLight(0xffffff, 3.7); sun.position.set(30, 40, -30); scene.add(sun, sun.target);
const lam = (c, o = {}) => new THREE.MeshLambertMaterial({ color: c, flatShading: true, ...o }), bas = (c, o = {}) => new THREE.MeshBasicMaterial({ color: c, ...o });
const LEAF = lam('#f6e4ea'), TRUNK = lam('#0d0b13'), SHADOW = bas('#06050d', { transparent: true, opacity: .97, depthWrite: false });
// でこぼこの葉のかたまり（ローポリ）
const blobG = new THREE.IcosahedronGeometry(1, 1); { const p = blobG.attributes.position, seen = {}; for (let i = 0; i < p.count; i++) { const k = [p.getX(i), p.getY(i), p.getZ(i)].map(v => v.toFixed(2)).join(), s = seen[k] ??= .8 + hash(i, 3) * .4; p.setXYZ(i, p.getX(i) * s, p.getY(i) * s, p.getZ(i) * s); } blobG.computeVertexNormals(); }

// ── くり返す近景（並木・影・街灯・しげみ）。30 m ごとに同じ並びで、4 つ分をまとめて置く

const leaves = [], trunks = [], shB = [], shT = [], lamps = [], heads = [];

  trunks.push([V(x, h * .4, z), [0, hash(id, 1) * 6, (hash(id, 2) - .5) * .12], V(.7 + r * .12, h * .8, .7 + r * .12)]);
  const cs = [[0, h, 0, r], [(hash(id, 3) - .5) * 2, h - r * .45, (hash(id, 4) - .5) * 2.4, r * .72], [(hash(id, 5) - .5) * 1.4, h + r * .62, (hash(id, 6) - .5) * 1.4, r * .62]];
  for (const [dx, y, dz, rr] of cs) { leaves.push([V(x + dx, y, z + dz), [hash(id, y) * 6, hash(id, dx) * 6, 0], V(rr, rr * .8, rr)]); shB.push([V(x + dx - y * SD, .03, z + dz + y * SD), [0, Math.PI / 4, 0], V(rr * 1.45, 1, rr * .98)]); }
  shT.push([V(x - h * SD * .5, .03, z + h * SD * .5), [0, Math.PI / 4, 0], V(h * 1.06, 1, .34)]);
};
for (let k = 0; k < 4; k++) { const z0 = (1 - k) * L;
  for (let i = 0; i < 5; i++) { const z = z0 - i * 6 - 3; tree(3.8 + (hash(i, 11) - .5) * .5, z + (hash(i, 12) - .5), 5.3 + hash(i, 13) * .9, 2 + hash(i, 14) * .5, i + 10); tree(-3.8 + (hash(i, 15) - .5) * .5, z + (hash(i, 16) - .5), 5.3 + hash(i, 17) * .9, 2 + hash(i, 18) * .5, i + 30); }
  for (let i = 0; i < 7; i++) { const x = -9 - hash(i, 21) * 34, z = z0 - hash(i, 22) * L, r = 1 + hash(i, 23) * 1.6; if (i < 2) tree(x - 4, z, 5.5 + hash(i, 24) * 2, 2.8, i + 50); else { leaves.push([V(x, r * .5, z), [0, hash(i, 25) * 6, 0], V(r * 1.3, r * .75, r * 1.2)]); shB.push([V(x - r * .9, .03, z + r * .9), [0, Math.PI / 4, 0], V(r * 1.6, 1, r * 1.1)]); } }
  lamps.push([V(-1.95, 1.6, z0 - 15), [0, 0, 0], V(1, 3.2, 1)]); heads.push([V(-1.95, 3.3, z0 - 15), [0, 0, 0], V(.22, .3, .22)]); shT.push([V(-1.95 - 1.7 * SD, .03, z0 - 15 + 1.7 * SD), [0, Math.PI / 4, 0], V(3.6, 1, .1)]);
}
inst(blobG, LEAF, leaves, near); inst(new THREE.CylinderGeometry(.13, .22, 1, 6), TRUNK, trunks, near);
const flatG = g => { g.rotateX(-Math.PI / 2); return g; };
inst(flatG(new THREE.CircleGeometry(1, 9)), SHADOW, shB, near).renderOrder = 2; inst(flatG(new THREE.PlaneGeometry(1, 1)), SHADOW, shT, near).renderOrder = 2;
inst(new THREE.CylinderGeometry(.035, .05, 1, 5), TRUNK, lamps, near); inst(blobG, TRUNK, heads, near);
// 白鳥（黒い水の上の白い形）
for (const [x, z, ry] of [[11, -20, .4], [13.5, -23.5, .9], [19, -62, -.6]]) { const s = new THREE.Group(), w = bas('#ffffff', { fog: false }), b = new THREE.Mesh(blobG, w), n = new THREE.Mesh(new THREE.CylinderGeometry(.07, .1, .8, 5), w), h = new THREE.Mesh(blobG, w); b.scale.set(.42, .3, .75); n.position.set(0, .5, -.55); n.rotation.x = -.25; h.scale.set(.11, .11, .2); h.position.set(0, .92, -.72); s.add(b, n, h); s.position.set(x, -.1, z); s.rotation.y = ry; near.add(s); }

// ── カメラについてくる遠景（地面・湖・対岸・山・雲）
const far = new THREE.Group(); scene.add(far);
const slab = (x0, x1, y, m, ro = 0) => { const p = new THREE.Mesh(flatG(new THREE.PlaneGeometry(x1 - x0, 900)), m); p.position.set((x0 + x1) / 2, y, 0); p.renderOrder = ro; far.add(p); };
slab(-500, 6.9, 0, bas('#fff4f7')); slab(-1.5, 1.5, .012, bas('#565160'), 1); slab(6.9, 7.2, .0, bas('#2c2832'));
slab(7.2, 420, -.25, bas('#020309', { fog: false })); slab(98, 500, .05, bas('#efe0e6', { fog: false }));
{ const l = [], lf = lam('#f6e4ea', { fog: false }); for (let z = -300; z < 80; z += 8) { const r = 4 + hash(z, 31) * 3; l.push([V(96 + hash(z, 32) * 8, r * .5, z), [0, hash(z, 33) * 6, 0], V(r * 1.3, r, r * 1.5)]); const q = 5 + hash(z, 34) * 4; l.push([V(-74 - hash(z, 35) * 14, q * .5, z + 3), [0, hash(z, 36) * 6, 0], V(q * 1.3, q, q * 1.5)]); } inst(blobG, lf, l, far);
  const hills = [], hm = lam('#ead8df', { fog: false });[[170, -120, 60, 20], [200, -20, 70, 26], [150, -240, 60, 16], [230, -200, 80, 30], [60, -330, 70, 18], [-40, -340, 80, 22], [-150, -300, 80, 26], [-190, -150, 70, 22], [-220, -20, 80, 28], [130, 60, 60, 18]].forEach(([x, z, r, h]) => hills.push([V(x, h / 2 - 1, z), [0, hash(x, z) * 6, 0], V(r, h, r)])); inst(new THREE.ConeGeometry(1, 1, 7), hm, hills, far);
  // 水面の細い照り返し
  const gl = []; for (let i = 0; i < 26; i++) gl.push([V(12 + hash(i, 41) * 80, -.2, -200 + hash(i, 42) * 230), [0, 0, 0], V(3 + hash(i, 43) * 9, 1, .07)]); inst(flatG(new THREE.PlaneGeometry(1, 1)), bas('#8f94a6', { fog: false }), gl, far); }
const clouds = new THREE.Group(), CM = new THREE.MeshLambertMaterial({ color: '#ffffff', emissive: '#a6a6b4', flatShading: true, fog: false }); far.add(clouds);
{ const l = [];[[70, 62, -210, 1.3], [-95, 78, -240, 1.5], [165, 50, -170, 1], [5, 100, -270, 1.9], [240, 70, -70, 1.4], [-190, 56, -130, 1.1], [120, 112, -250, 1.4], [-35, 46, -265, .9], [40, 150, -150, 1.6]].forEach(([x, y, z, s], c) => { for (let i = 0; i < 6; i++) { const r = (9 + hash(c, i) * 9) * s * (i > 3 ? .6 : 1); l.push([V(x + (i - 2.5) * 9 * s + hash(i, c) * 5, y + hash(c + 5, i) * 4 * s + (i % 2) * 3 * s, z + hash(c, i + 9) * 12), [0, hash(i, c + 3) * 6, 0], V(r * 1.25, r * .58, r)]); } }); inst(blobG, CM, l, clouds); }

// ── ハレーション: 小さく描いた絵の明るい所だけを横・たてにぼかし、最後に上から足す
let rtS, rtA, rtB;
const fsq = new THREE.PlaneGeometry(2, 2), pCam = new THREE.Camera(), VS = 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}';
const blur = new THREE.ShaderMaterial({ uniforms: { tD: { value: null }, uDir: { value: new THREE.Vector2() }, uThr: { value: 0 } }, vertexShader: VS, depthTest: false,
  fragmentShader: `uniform sampler2D tD;uniform vec2 uDir;uniform float uThr;varying vec2 vUv;
  void main(){vec3 a=vec3(0.);float w[5];w[0]=.18;w[1]=.15;w[2]=.12;w[3]=.09;w[4]=.05;
    for(int i=-4;i<=4;i++){vec3 c=texture2D(tD,vUv+uDir*float(i)).rgb;if(uThr>0.)c=max(c-uThr,0.)*2.4;a+=c*w[i<0?-i:i];}
    gl_FragColor=vec4(a,1.);}` });
const comp = new THREE.ShaderMaterial({ uniforms: { tB: { value: null }, uSeed: { value: 0 }, uAsp: { value: 1 } }, vertexShader: VS, depthTest: false, transparent: true, blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
  fragmentShader: `uniform sampler2D tB;uniform float uSeed,uAsp;varying vec2 vUv;
  void main(){vec3 b=texture2D(tB,vUv).rgb;
    vec3 add=sqrt(b)*vec3(1.,.84,.9)*.75;                                   // にじみは少し桃色
    vec2 q=(vUv-.5)*vec2(min(uAsp,1.),min(1./uAsp,1.));float vig=smoothstep(.3,.78,length(q))*.45; // 四すみの落ちこみ
    float gr=fract(sin(dot(floor(gl_FragCoord.xy/1.5)+uSeed,vec2(12.9898,78.233)))*43758.5453)-.5; // 粒子
    gl_FragColor=vec4(add+max(gr,0.)*.035,vig+max(-gr,0.)*.07);}` });
const pScene = new THREE.Scene(), pQuad = new THREE.Mesh(fsq, blur); pScene.add(pQuad);
let tall = false;
function resize() {
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2, Math.sqrt(640000 / (innerWidth * innerHeight)))); // フィルムらしく少しやわらかい絵にする（約 64 万画素）
  renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; tall = cam.aspect < 1; cam.fov = tall ? 84 : 60; cam.updateProjectionMatrix();
  const w = Math.max(64, Math.round(innerWidth / 4)), h = Math.max(64, Math.round(innerHeight / 4));
  for (const r of [rtS, rtA, rtB]) if (r) r.dispose(); rtS = new THREE.WebGLRenderTarget(w, h, { depthBuffer: true }); rtA = new THREE.WebGLRenderTarget(w, h, { depthBuffer: false }); rtB = new THREE.WebGLRenderTarget(w, h, { depthBuffer: false });
  comp.uniforms.uAsp.value = cam.aspect;
}
addEventListener('resize', resize); resize();
const pass = (m, to) => { pQuad.material = m; renderer.setRenderTarget(to); renderer.render(pScene, pCam); };
let last = performance.now(), t = 0;
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt;
  const s = t * 1.8, w = t * Math.PI * 2 / (L / 1.8), z = -s;          // 30 m で一巡（約 17 秒）
  near.position.z = -Math.floor(s / L) * L; far.position.z = z; clouds.position.x = Math.sin(w) * 14;
  const yaw = .24 + .22 * Math.sin(w - .4), step = t * 2.7;
  cam.position.set(Math.sin(step) * .05, 1.62 + Math.abs(Math.sin(step)) * .05, z);
  cam.lookAt(cam.position.x + Math.sin(yaw) * 10, 1.62 + (tall ? 1.6 : 1.9) + Math.sin(w * 2) * .5, z - Math.cos(yaw) * 10);
  sun.position.set(30, 40, z - 30); sun.target.position.set(0, 0, z);
  renderer.setRenderTarget(rtS); renderer.render(scene, cam);
  blur.uniforms.tD.value = rtS.texture; blur.uniforms.uDir.value.set(1.7 / rtS.width, 0); blur.uniforms.uThr.value = .6; pass(blur, rtA);
  blur.uniforms.tD.value = rtA.texture; blur.uniforms.uDir.value.set(0, 1.7 / rtS.height); blur.uniforms.uThr.value = 0; pass(blur, rtB);
  renderer.setRenderTarget(null); renderer.render(scene, cam);
  comp.uniforms.tB.value = rtB.texture; comp.uniforms.uSeed.value = Math.floor(t * 4) * 7.3; renderer.autoClear = false; pass(comp, null); renderer.autoClear = true;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
