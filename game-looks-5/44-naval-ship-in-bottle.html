  const sink = sm((tc - 11) / 1) * (1 - sm((tc - 12.2) / .3));       // 最後に青がかたむいて、また立て直す
  for (const [S, i] of [[A, 0], [B, 1]]) {
    S.kick *= Math.exp(-dt * 3); S.hit *= Math.exp(-dt * 2.2);
    S.g.position.copy(S.base); S.g.position.y += Math.sin(t * 1.7 + i * 2) * .025 - (i ? sink * .12 : 0); S.g.position.z += Math.sin(t * .5 + i) * .08;
    S.g.rotation.set(0, S.ry + Math.sin(t * .4 + i) * .05, 0);
    S.hull.rotation.x = Math.sin(t * 1.9 + i * 1.3) * .05 + (i ? -1 : 1) * (S.kick * .16 - S.hit * .2 * Math.sin(t * 14)) + (i ? sink * .45 : 0); S.hull.rotation.z = Math.sin(t * 1.3 + i) * .03 + (i ? sink * .12 : 0);
    S.fl.rotation.y = Math.sin(t * 6 + i) * .4;
  }
  if (k < PLAN.length) {
    const from = k % 2 ? B : A, to = k % 2 ? A : B, f = (tc - k * SHOT) / FLY, hit = PLAN[k];
    m0.copy(from.base).add(m1.set(k % 2 ? -.42 : .42, .3, .12)); m1.copy(to.base).add(new THREE.Vector3(k % 2 ? .2 : -.2, hit ? .38 : -.02, hit ? .1 : .75));
    if (cyc + k !== lastShot) { lastShot = cyc + k; from.kick = 1; const p = puffs[puffI++ % puffs.length]; p.t0 = t; p.g.position.copy(m0); p.vx = k % 2 ? -1 : 1; }
    ball.visible = f < 1; if (f < 1) { ball.position.lerpVectors(m0, m1, f); ball.position.y += Math.sin(f * Math.PI) * .5; }
    else if (cyc + k !== lastHit) { lastHit = cyc + k; if (hit) { to.hit = 1; boomT = t; boom.position.copy(m1); k % 2 ? sb++ : sa++; drawPlate(sa, sb); } else { splashT = t; splash.position.copy(m1); } }
  } else ball.visible = false;
  // 綿の煙: ぽんとふくらんで、ゆっくり流れながら小さくなる
  for (const p of puffs) { const a = t - p.t0; p.g.visible = a < 3.2; if (a < 3.2) { const s = sm(a / .12) * (1 + a * .35) * (1 - sm((a - 2) / 1.2)); p.g.scale.setScalar(Math.max(.001, s)); p.g.position.x += p.vx * dt * .5 * Math.exp(-a * 2.5); p.g.position.y += dt * .11; p.g.rotation.z += dt * .3; } }
  const sa2 = (t - splashT) / .55; splash.visible = sa2 < 1; if (sa2 < 1) { splash.scale.set(1 + sa2, Math.sin(sa2 * Math.PI) * 1.2 + .01, 1 + sa2); splash.position.y = SEA + .1 + Math.sin(sa2 * Math.PI) * .2; }
  const ba = (t - boomT) / .3; boom.visible = ba < 1; if (ba < 1) boom.scale.setScalar(.25 + ba * .6);
  renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(inner, cam);
  renderer.setRenderTarget(null); renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
