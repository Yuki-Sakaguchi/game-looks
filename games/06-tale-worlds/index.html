<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ものがたりの世界をめぐる</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:13px/1.5 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;color:#f0ead8;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block}
#hud{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;pointer-events:none}
#cap{position:fixed;left:10px;bottom:8px;font:11px/1.5 ui-monospace,Menlo,monospace;color:#fff4dc;opacity:.75;text-shadow:0 1px 0 #000;pointer-events:none}
.btn{position:fixed;width:64px;height:64px;border-radius:50%;background:#2a2c36cc;border:2px solid #c8ccd8;color:#f4f4f8;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;touch-action:none}
.btn.on{background:#e8b44acc;color:#1e2026;border-color:#ffe6a8}
#bJump{right:18px;bottom:64px}#bTalk{right:92px;bottom:30px;width:54px;height:54px;font-size:12px}#bRun{right:20px;bottom:142px;width:50px;height:50px;font-size:12px}
#bMenu{position:fixed;right:10px;top:10px;padding:4px 10px;border-radius:4px;background:#2a2c36dd;border:1px solid #c8ccd8;font-size:12px}
#stick{position:fixed;width:100px;height:100px;border-radius:50%;border:2px solid #ffffff66;background:#ffffff14;display:none;pointer-events:none}
#knob{position:absolute;left:30px;top:30px;width:40px;height:40px;border-radius:50%;background:#ffffff55}
.pc .btn{display:none}
#menu,#help{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);max-height:84vh;overflow:auto;background:linear-gradient(#8a909c,#5a5e6a 40%,#40444e);border:2px solid #e6e8ee;outline:3px solid #1c1e26;border-radius:6px;padding:12px 14px;display:none;box-sizing:border-box}
#menu h2,#help h2{margin:0 0 8px;font-size:15px;color:#ffe6a8}
#mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px}
#mlist .w{display:block;padding:4px 8px;border-radius:3px;background:#00000030;color:#f4f4f8;text-decoration:none}
#mlist a.w:hover{background:#e8b44a;color:#1e2026}
#mlist .w b{color:#ffe6a8;margin-right:4px}#mlist a.w:hover b{color:#1e2026}
#mlist .off{opacity:.5}#mlist .w small{margin-left:6px;font-size:10px}
#mlist .here{outline:1px solid #ffe6a8}
#menu button,#help button{margin-top:10px;font:inherit;padding:4px 14px;border-radius:4px;border:1px solid #e6e8ee;background:#2a2c36;color:#f4f4f8}
#help p{margin:4px 0}#help kbd{display:inline-block;padding:0 5px;border:1px solid #c8ccd8;border-radius:3px;background:#00000040;font:12px ui-monospace,Menlo,monospace}
</style>
<canvas id="hud"></canvas>
<div id="cap">06 ─ ものがたりの世界をめぐる / 描きこんだテクスチャと、ブラウン管</div>
<div id="stick"><div id="knob"></div></div>
<div class="btn" id="bJump">ジャンプ</div><div class="btn" id="bTalk">はなす</div><div class="btn" id="bRun">走る</div>
<div id="bMenu">ワールド</div>
<div id="menu"><h2>どのワールドへ行く？</h2><div id="mlist"></div><button id="mclose">とじる</button></div>
<div id="help"><h2>ものがたりの世界をめぐる</h2>
  <p>いろいろなワールドを歩きまわる 3D アクション。村の人に話しかけたり、屋根や荷物の上にのぼったりしてみよう。右上の「ワールド」から、ほかのワールドへ行ける。</p>
  <p class="k"><kbd>W A S D</kbd>／<kbd>矢印</kbd> 歩く　<kbd>Shift</kbd> 走る　<kbd>Space</kbd> ジャンプ　<kbd>E</kbd>／<kbd>Enter</kbd> はなす・しらべる　ドラッグ・<kbd>Q</kbd><kbd>C</kbd> カメラ　<kbd>M</kbd> ワールド</p>
  <p class="t">スマホ：画面の左をなぞって歩く（大きくたおすと走る）、右をなぞってカメラ。右下のボタンでジャンプ・はなす。</p>
  <button id="hclose">はじめる</button></div>
<script src="../../game-looks-7/kit.js"></script>
<script src="../../game-looks-7/retro.js"></script>
<script src="../../game-looks-7/retro-motions.js"></script>
<script src="../../game-looks-13/pack-tale.js"></script>
<script src="core.js"></script>
<script src="worlds/list.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// あそべるゲーム 06。第 13 集の主人公（4.5 頭身）で、第 8・9・11・12 集の場面をワールドとして歩きまわる。
// ワールドは worlds/<id>.js。もとの場面をもとに、物をふやし、当たり判定・村人との会話・乗れる所を足した。土台（動き・カメラ・会話の窓）は core.js。
// 引数: ?w=8-01（ワールド） ?auto=1（自動で歩く。撮影用） ?at=x,z,向き（度） ?talk=1（近くの人と話したままにする。確かめる用）
import * as THREE from 'three';
const q = new URLSearchParams(location.search), list = window.TALE_LIST, w = list.find(x => x.id === q.get('w') && x.ready) || list.find(x => x.ready);
if (!matchMedia('(pointer:coarse)').matches) document.body.classList.add('pc');
const load = src => new Promise((ok, ng) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ng; document.head.appendChild(s); });
for (const p of w.packs) await load('../../' + p);
await load('worlds/' + w.id + '.js');
const K = KIT(THREE), R = RETRO(THREE, K), TL = PACK_TALE(THREE, K, R), MO = RETRO_MOTIONS(THREE, R);
const G = TALE_GAME(THREE, K, R, TL, MO, { list, id: w.id, title: w.name });
G.run(w.id);
document.getElementById('cap').textContent = `06 ─ ものがたりの世界をめぐる ・ ${w.id} ${w.name}`;
const help = document.getElementById('help'); if (!q.get('auto') && !q.get('at') && !sessionStorageGet()) help.style.display = 'block';
document.getElementById('hclose').onclick = () => { help.style.display = 'none'; try { sessionStorage.setItem('tale-help', '1'); } catch (e) {} };
function sessionStorageGet() { try { return sessionStorage.getItem('tale-help'); } catch (e) { return null; } }
</script>
</html>
