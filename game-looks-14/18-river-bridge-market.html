<title>14-18 夕方の大河の橋の上の市場 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#2a2030;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#fffaf0;opacity:.9;text-shadow:0 1px 0 #000}

<div id="cap">14-18 ─ 夕方の大河の橋の上の市場 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="../game-looks-8/pack-fantasy-town.js"></script>
<script src="../game-looks-13/pack-tale.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 夕方。はば 200 m の大河にかかる、長い石の橋。橋の上には両がわに 2 階だての店がならび、まん中の通りは 買いものの人でにぎわう。
// 店と店のすきまから、横からの低い夕日が通りに しまの光を落とし、川と、向こう岸の城の町が見える。
// 色の組は「石の あたたかい灰・しっくいの クリーム・屋根の 緑青」＋差し色の 夕日の だいだい と 日よけの赤。主役は第 13 集の TL.person（4.5 頭身）。
// 通りの人、帆かけ舟、かもめ、旗、ゆれる川面が動く。
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), F = PACK_FTOWN(THREE, K, R), TL = PACK_TALE(THREE, K, R), T = R.tex, { hash } = K, PI = Math.PI;
const { scene, cam, renderer, onResize } = K.stage({ fov: 52, far: 1000, aa: false, fitAspect: .9, maxFov: 78 });
scene.add(R.skyDome([[0, '#2a3a7a'], [.45, '#6a6aa0'], [.78, '#d8987a'], [1, '#ffd08a']], { r: 470 })); scene.fog = new THREE.Fog('#d89a80', 160, 560);
const SUN = new THREE.Vector3(-.85, .3, -.3).normalize(), { sun } = K.lights(scene, renderer, { sky: 0xb8b0d8, ground: 0x8a6a58, amb: 1.25, sun: 0xffb870, power: 2.6, range: 30, map: 2048 });

// ---- 川と岸：川は x の向きに流れる。橋は z の向き（z=30 の岸から z=-210 の岸へ） ----
const WF = T.water({ c: '#3a6490' }), water = R.ground({ w: 900, d: 700, cell: 4, cz: -90, layers: [WF[0]] }); water.mesh.position.y = -.1; scene.add(water.mesh);
const bank = z => z > 26 ? 1 : z < -214 ? 1 : 0, HB = (x, z) => bank(z) ? 1.2 + (R.tn(x + 500, z + 500, 20, 20, 1000, 1000, 3) - .5) * 2 : -3;
const land = R.ground({ w: 900, d: 700, cell: 4, cz: -90, H: HB, layers: [T.grass({ c: '#7a9a50' }), T.dirt({ c: '#a88a68' })], mix: (x, z) => [Math.abs(z - 28) < 4 || Math.abs(z + 216) < 4 ? 1 : 0, 0] }); scene.add(land.mesh);

// ---- 橋：石のアーチを 12 m ごとに。上に石だたみの床（高さ DY）と、ひくい らんかん ----
const DY = 7, BW = 10, Z1 = 34, Z2 = -222, fixed = [], put = (o, x, z, ry = 0, y = 0) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
const stone = F.tex.ashlar({ c: '#c8a890', moss: .3 });
for (let z = Z1 - 6; z > Z2; z -= 12) put(F.arch({ w: 8.05, h: DY + 3 - 1.6 - .05, d: BW, th: 2, stone }), 0, z, PI / 2, -3);
{ const D = R.geo().normal([0, 1, 0]); for (let z = Z1; z > Z2; z -= 4) D.quad([-BW / 2, DY, z], [BW / 2, DY, z], [BW / 2, DY, z - 4], [-BW / 2, DY, z - 4], [0, 0, 3, 1.3]); fixed.push(D.mesh(T.cobble({ c: '#b8a898', kind: 'slab' })));
  const Sd = R.geo(); for (let z = Z1; z > Z2; z -= 4) for (const s of [-1, 1]) Sd.quad([s * BW / 2, DY - 1.6, z - (s > 0 ? 4 : 0)], [s * BW / 2, DY - 1.6, z - (s > 0 ? 0 : 4)], [s * BW / 2, DY + .02, z - (s > 0 ? 0 : 4)], [s * BW / 2, DY + .02, z - (s > 0 ? 4 : 0)], [0, 0, 1.3, .5]); fixed.push(Sd.mesh(stone)); }

// ---- 店：右がわ（東）に 2 階だての細い家が通りに顔を向けてならぶ。左がわ（西）は ひくい石のらんかんで、川と夕日に ひらける ----
const WALLS = [T.plaster({ frame: 'beam', c: '#f0e0c0', wood: '#6a4630' }), T.plaster({ frame: 'cross', c: '#e8d0b0', wood: '#5a3a28' }), T.plaster({ frame: 'box', c: '#f4e8d0', wood: '#7a5034' })];
const ROOFS = [F.tex.slate({ c: '#4a9a8a', c2: '#3a7a74' }), F.tex.slate({ c: '#5aa898' }), T.roof({ kind: 'slate', c: '#3e8a80' })];
const AW = ['#c8402e', '#e8a040', '#3a6a9a', '#f0e8d8'], stalls = [];
for (let k = 0; k < 54; k++) { const z = Z1 - 6 - k * 4.2; if (z < -84 && z > -96) continue; const i = k;
  put(R.house({ w: 4, d: 3.4, h: 2.7, h2: 2.2, jut: .35, wall: WALLS[i % 3], roof: ROOFS[i % 3], pitch: .9, eave: .4, ridge: 'x', win: T.window({ bars: 'cross', frame: '#6a4630', curtain: AW[(i + 1) % 4], box: i % 2 === 0 }), door: T.door({ style: i % 2 ? 'glass' : 'panel', c: '#7a4a30' }),
    awning: hash(i, 2) > .25 ? T.fabric({ c: AW[i % 4], c2: '#f4ecd8', pattern: 'stripe', scallop: true }) : undefined, chimney: i % 4 === 0, seed: i }), 3.3, z, -PI / 2, DY);
  if (hash(i, 4) > .45) { put(R.barrel({ h: .9, c: '#8a6440' }), 1.3, z + 1.2, i, DY); put(R.crate({ s: .6 }), 1.4, z - 1.3, i * .3, DY); } }
// 左のらんかん（ひくい石のかべ）と、川を見る ベンチ・街灯
put(F.wall({ len: Z1 - Z2, h: 1.1, th: .5, stone, crenel: false }), -BW / 2 + .25, (Z1 + Z2) / 2, PI / 2, DY);
for (let z = Z1 - 10, i = 0; z > Z2; z -= 9, i++) { if (z < -82 && z > -98) continue; if (i % 2 === 0) { put(R.bench({ w: 2, c: '#8a6440' }), -4.1, z, PI / 2, DY); stalls.push(z + 2.6); } else put(R.lamp({ h: 3.4 }), -4.4, z, PI / 2, DY); }
// 橋のまん中の門の塔（通りをまたぐ）と、旗
put(F.gate({ w: 9, h: 13, d: 6, aw: 4, ah: 6, stone, door: 'none', crest: 'wave' }), 0, -90, 0, DY);
for (const x of [-4.5, 4.5]) put(F.tower({ kind: 'round', r: 2, h: 15, stone, roof: ROOFS[0], top: 'cone', roofH: 5, wins: true, flag: { c: '#c8402e', c2: '#f0e4c8', crest: 'wave' } }), x, -90, 0, DY);
// 岸の家なみと、向こう岸の城（大きい物・遠くの物）
for (let i = 0; i < 46; i++) { const s = i % 2 ? 1 : -1, x = s * (14 + (i >> 1) * 7 + hash(i, 4) * 3), z = -232 - hash(i, 5) * 22; put(R.house({ w: 6, d: 6, h: 4 + hash(i, 6) * 3, h2: hash(i, 7) > .5 ? 2.6 : 0, wall: WALLS[i % 3], roof: ROOFS[i % 3], pitch: 1.1, win: T.window({ bars: 'cross', lit: 1 }), lit: .4, seed: i + 300 }), x, z, hash(i, 8) * .3, 1); }
put(F.castle({ s: 3.4, stone: F.tex.ashlar({ c: '#e0c8b0' }), roof: ROOFS[1], crest: 'wave', c: '#c8402e' }), -110, -300, .5, 2);
for (let i = 0; i < 24; i++) { const s = i % 2 ? 1 : -1, x = s * (16 + (i >> 1) * 9 + hash(i, 9) * 4), z = 44 + hash(i, 10) * 20; put(R.house({ w: 6, d: 6, h: 4 + hash(i, 11) * 2, wall: WALLS[i % 3], roof: ROOFS[i % 3], pitch: 1.1, seed: i + 400 }), x, z, PI, 1.4); }
for (let i = 0; i < 20; i++) { const s = i % 2 ? 1 : -1; put(R.tree({ kind: 'round', h: 6 + hash(i, 12) * 3, c: '#6a8a48', seed: i }), s * (10 + hash(i, 13) * 80), -226 - hash(i, 14) * 30, i, 1); }
scene.add(R.merge(fixed));
scene.add(R.backdrop({ c: '#8a6a8a', haze: '#e0a880', r: 440, h: 50, y: -4, rep: 3, seed: 11 }));
for (let i = 0; i < 6; i++) { const a = -PI / 2 + (i - 2.5) * .5, c = R.cloud({ s: 70 + hash(i, 3) * 40, c: '#ffd8b0', shade: '#a888b0', seed: i }); c.position.set(Math.cos(a) * 400, 70 + hash(i, 5) * 40, Math.sin(a) * 400); c.lookAt(0, 40, 0); scene.add(c); }
// 川の向こうに しずむ夕日（霧をかけない光る円）
{ const m = R.mat('#fff0b0', { glow: true }).clone(); m.fog = false; const d = new THREE.Mesh(new THREE.CircleGeometry(14, 20), m); d.position.set(-400, 22, -160); d.lookAt(0, 22, -60); scene.add(d); }
// 通りにわたした 三角の旗のひも
for (let z = Z1 - 14; z > -80; z -= 18) scene.add(F.bunting({ from: [-4.4, DY + 3.3, z], to: [1.5, DY + 4.6, z - 2], n: 10, cs: ['#c8402e', '#f6d040', '#3a6a9a', '#f0e8d8'], sag: .5 }));

// ---- 川の舟：帆かけ舟が ゆっくり横切る ----
const boats = [0, 1, 2, 3].map(i => { const b = R.boat({ c: ['#8a5a3a', '#6a4a3a', '#a86a40', '#7a5a48'][i], sail: true }); b.scale.setScalar(2.2); scene.add(b); return b; });
const gulls = [...Array(5)].map(() => { const b = R.bird({ c: '#f4f0e8', belly: '#ffffff', s: 1.4 }); scene.add(b); return b; });

// ---- 人：通りを行き来する買いもの客、店先に立つ店の人 ----
const SK = ['#e8b48c', '#c88a60', '#d8a078', '#b07850'], HR = ['#2a2420', '#5a3a28', '#8a5a30', '#1e1a18'], CL = ['#3a6a9a', '#c8402e', '#6a8a4a', '#e8c060', '#7a4a6a', '#f0e8d8'];
const crowd = [...Array(14)].map((_, i) => { const p = TL.person({ size: i % 6 === 5 ? 'child' : i % 5 === 2 ? 'tall' : 'normal', outfit: ['traveler', 'apron', 'robe', 'worker'][i % 4], hair: ['swept', 'center', 'wolf'][i % 3], hat: ['straw', undefined, 'beret', 'kerchief', undefined, 'hood'][i % 6], hatC: CL[(i + 2) % 6], sword: false,
  head: { hair: HR[i % 4], skin: SK[i % 4], eyes: 'round', mouth: i % 2 ? 'smile' : 'flat' }, colors: { tunic: CL[i % 6], apron: '#f0e8d8', pants: '#5a4a3a', scarf: CL[(i + 3) % 6] } }); scene.add(p);
  p.userData.lane = -1.6 + hash(i, 1) * 2.6; p.userData.dir = i % 3 === 0 ? 1 : -1; p.userData.off = hash(i, 2) * 90; p.userData.sp = .9 + hash(i, 3) * .4; return p; });
const keepers = stalls.slice(0, 8).map((z, i) => { const p = TL.person({ size: i % 3 === 2 ? 'child' : 'normal', outfit: ['apron', 'traveler', 'robe'][i % 3], hair: ['center', 'wolf'][i % 2], hat: ['kerchief', 'straw', undefined][i % 3], hatC: AW[i % 4], sword: false, head: { hair: HR[(i + 1) % 4], skin: SK[(i + 2) % 4], eyes: 'round', mouth: 'smile' }, colors: { tunic: CL[(i + 1) % 6], apron: '#f0e8d8' } });
  p.position.set(-4.35, DY, z); p.rotation.y = -PI / 2; scene.add(p); return p; });   // らんかんに もたれて 川を見る
const hero = TL.person({ ...TL.cast('hero'), colors: { ...TL.cast('hero').colors, scarf: '#e8a040' } }); scene.add(hero);

const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
const SP = 1.15, Z0 = 24, LOOP = 104, T0 = +(new URLSearchParams(location.search).get('t') || 0);   // ?t=秒 で途中から
K.loop((dt, t) => {
  t += T0; const z = Z0 - (t * SP) % LOOP, x = -.6;
  hero.position.set(x, DY, z); hero.rotation.y = PI; R.walk(hero, t * SP * 3.6, .85);
  const tall = innerWidth < innerHeight; cam.position.set(x + (tall ? 1 : .7), DY + (tall ? 2.2 : 2), z + (tall ? 3.4 : 3.8)); cam.lookAt(x - (tall ? 1.6 : 2.6), DY + (tall ? 1.6 : 1.1), z - 12);   // 少し左（川がわ）へふる
  sun.position.set(x + SUN.x * 60, DY + SUN.y * 60, z + SUN.z * 60); sun.target.position.set(x, DY, z - 6);
  crowd.forEach((p, i) => { const u = p.userData, L = 120, d = ((u.off + t * u.sp * u.dir) % L + L) % L, pz = z + 26 - d; p.position.set(u.lane, DY, pz); p.rotation.y = u.dir > 0 ? 0 : PI; p.visible = pz < Z1 - 2; R.walk(p, t * u.sp * 3.6 + i, .8); });
  keepers.forEach((p, i) => { R.idle(p, t + i * 1.7, Math.sin(t * .4 + i) * .5); const J = p.userData.J; J.armL.rotation.x = J.armR.rotation.x = -1; J.foreL.rotation.x = J.foreR.rotation.x = -.6; J.torso.rotation.x = .15; });
  boats.forEach((b, i) => { const bx = ((i * 70 + t * (2 + i * .4)) % 280) - 140, bz = [-30, -60, -130, -170][i]; b.position.set(i % 2 ? -bx : bx, Math.sin(t + i) * .08, bz); b.rotation.y = i % 2 ? -PI / 2 : PI / 2; b.rotation.z = Math.sin(t * .8 + i) * .04; });
  gulls.forEach((b, i) => { const a = t * (.3 + i * .04) + i * 1.3, r = 9 + i * 2; b.position.set(Math.cos(a) * r + 8, DY + 9 + i * .8 + Math.sin(t * .7 + i) * .6, z - 18 + Math.sin(a) * r); b.rotation.y = -a; R.birdPose(b, 'fly', t * 1.2 + i); });
  R.flip(water.mat, WF, t, 2); F.tick(t); crt.render(scene, cam, t);
});
</script>
