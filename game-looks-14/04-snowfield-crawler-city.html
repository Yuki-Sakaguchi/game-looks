<title>14-04 雪原をゆく蒸気の移動都市 描きこんだテクスチャとブラウン管</title>

canvas{display:block}

<div id="cap">14-04 ─ 雪原をゆく蒸気の移動都市 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="../game-looks-8/pack-city.js"></script>
<script src="../game-looks-8/pack-fantasy-town.js"></script>
<script src="../game-looks-9/pack-dark.js"></script>
<script src="../game-looks-11/pack-steam1.js"></script>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 夜明けまえの雪原。地平線がだいだいにそまり、空の上はまだ紺。そりの道を歩く旅の人の右を、巨大な歯車の車輪にのった「動く町」が いっしょに進む。
// 色の組は「雪の青むらさき・空の紺とだいだい・鉄と真ちゅう」＋差し色の 窓のあかりと主役の赤いスカーフ。町の胴は このページで打った鉄板の絵、車輪は第 11 集の歯車、家と時計塔は既存の部品。
// 主役は第 13 集の TL.person（4.5 頭身）。うしろ右から追い、町を見上げる。煙突のけむり、車輪がまき上げる雪、ふる雪、トナカイ、からす、甲板の人が動く。
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), C = PACK_CITY(THREE, K, R), F = PACK_FTOWN(THREE, K, R), D = PACK_DARK(THREE, K, R), S1 = PACK_STEAM1(THREE, K, R), S2 = PACK_STEAM2(THREE, K, R), SN = PACK_SNOW2(THREE, K, R), TL = PACK_TALE(THREE, K, R);
const T = R.tex, { hash } = K, PI = Math.PI, TR = R.TR, Px = R.Px, ramp = R.ramp;
const { scene, cam, renderer, onResize } = K.stage({ fov: 54, far: 900, aa: false, fitAspect: .9, maxFov: 80 });
scene.add(R.skyDome([[0, '#1c2458'], [.45, '#3e5098'], [.74, '#9a88b8'], [.9, '#f0a888'], [1, '#ffd49a']], { r: 440 })); scene.fog = new THREE.Fog('#a898c0', 90, 520);
const { sun } = K.lights(scene, renderer, { sky: 0xc0c8ff, ground: 0x8a7aa8, amb: 1.25, sun: 0xffb888, power: 2.2, range: 44, map: 2048 }), SUN = new THREE.Vector3(-.55, .28, -.78).normalize();
const moon = D.moon({ r: 16, az: 32, el: 30, c: '#f4f0f8', halo: 2.2, k: .3 }); scene.add(moon);

// ---- 雪原。主役の道（そりのあと）はゆるくうねり、町の通ったあとは 2 本の深いわだち ----
const PX = z => Math.sin(z * .018) * 4 + Math.sin(z * .047 + 1) * 1.2, XC = 38, TW = 10.4;   // XC ＝ 町のまん中の x、TW ＝ 車輪の列の半分のはば
const sst = (a, b, v) => { const k = Math.max(0, Math.min(1, (v - a) / (b - a))); return k * k * (3 - 2 * k); };
const H = (x, z) => { const dp = x < PX(z) ? PX(z) - x : 0, dc = x > XC ? x - XC - TW - 3 : 0, rut = Math.min(Math.abs(x - XC - TW), Math.abs(x - XC + TW));
  const hill = (Math.sin(x * .04) + Math.sin(z * .031 + 1) + Math.sin((x - z) * .019 + 2) * 1.4 + 1.3) * 1.4 * (sst(4, 22, dp) + sst(0, 16, dc)) + Math.max(0, -x - 40) * .18 + Math.max(0, x - XC - 24) * .3 + Math.sin(z * .07 + x * .05) * .25;
  return hill - (rut < 1.8 ? .35 * (1 - rut / 1.8) : 0); };
const land = R.ground({ w: 200, d: 240, cell: 2, H, layers: [T.snow({ c: '#d0d4f0' }), T.snow({ c: '#9a9cd4', seed: 2 }), T.snow({ c: '#a8a0bc', seed: 5 })],
  mix: (x, z) => { const hx = H(x + .8, z) - H(x - .8, z), rut = Math.min(Math.abs(x - XC - TW), Math.abs(x - XC + TW)); return [hx > .3 ? 1 : 0, Math.abs(x - PX(z)) < 1.1 || rut < 1.9 ? 1 : 0]; },
  shade: (x, z) => { const hx = H(x + 1, z) - H(x - 1, z), hz = H(x, z + 1) - H(x, z - 1), k = Math.max(-.25, Math.min(.14, hx * .12 + hz * .12)); return [1 + k * .6, .92 + k * .5, .96 + k * .2]; } });
scene.add(land.mesh);

// ---- 雪をかぶった針葉樹の林（道と町のあとを よけて かたまる）と岩 ----
const fixed = [], put = (o, x, z, ry = 0, y = H(x, z) - .1) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
for (let c = 0; c < 60; c++) { const z = 30 - c * 9 - hash(c, 1) * 6, sd = hash(c, 2), x = sd < .6 ? PX(z) - 8 - hash(c, 3) * 40 : XC + TW + 6 + hash(c, 3) * 40, n = 2 + Math.floor(hash(c, 4) * 5);
  for (let k = 0; k < n; k++) { const tx = x + (hash(c, k + 10) - .5) * 8, tz = z + (hash(c, k + 30) - .5) * 8; if (Math.abs(tx - PX(tz)) < 4 || Math.abs(tx - XC) < TW + 5) continue; put(SN.snowPine({ h: 4 + hash(c, k + 50) * 6, c: k % 3 ? '#2a5458' : '#345e62', snow: .7, seed: c + k }), tx, tz, k); }
  if (c % 4 === 1) put(R.rock({ s: .8 + hash(c, 5) * 1.4, c: '#6a6a98', seed: c }), x + 3, z - 3, c); }
for (let i = 0; i < 70; i++) { const z = 26 - i * 6.3, x = PX(z) - 2 - hash(i, 7) * 3; put(R.tuft({ kind: 'reed', s: .6, c: '#a89060', seed: i % 3 }), x, z, i); }
scene.add(R.merge(fixed));
scene.add(R.backdrop({ c: '#c8c0e0', haze: '#b8a8cc', r: 250, h: 40, y: -4, rep: 3, seed: 3 }), R.backdrop({ c: '#7a7cb4', haze: '#a898c0', r: 350, h: 120, y: -8, seed: 6 }));
for (let k = 0; k < 7; k++) { const c = R.cloud({ s: 40 + hash(k, 9) * 30, c: '#ffc8a8', shade: '#7a6a9a', seed: k }), a = -PI / 2 - .9 + k * .55; c.position.set(Math.cos(a) * 330, 70 + hash(k, 8) * 50, Math.sin(a) * 330); c.lookAt(0, 30, 0); scene.add(c); }

// ---- 動く町のテクスチャ（このページで打つ） ----
const IR = ramp('#4a4a62'), RU = ramp('#8a5a44'), BR = ramp('#c8963a'), LT = ['#fff0c0', '#ffd27a', '#f0a050'];
// 胴の鉄板（64×32 ＝ 6×3 m）。板の目地とリベット、上の板のさび、下のすす。丸い窓は別の絵（光る）
const hullT = (() => { const P = Px(64, 32); P.each((x, y) => { const lx = x % 16, ly = y % 11, n = R.tn(x, y, 8, 4, 64, 32, 4);
    if (lx === 15 || ly === 10) return IR[0]; if (lx === 0 || ly === 0) return IR[4]; if ((lx === 2 || lx === 13) && (ly === 2 || ly === 8)) return IR[5];
    if (y < 11 && n > .62 && hash(x, y, 2) > .45) return RU[2 + (x & 1)]; if (y > 26 && hash(x, y, 3) > .5) return IR[1]; return n > .7 ? IR[3] : n < .28 ? IR[1] : IR[2]; });
  for (let x = 0; x < 64; x++) { P.set(x, 21, BR[1]); P.set(x, 22, BR[4]); P.set(x, 23, BR[3]); } return T.from(P, { m: 6 }); })();
const portT = (() => { const P = Px(32, 16); P.each(() => undefined); for (const cx of [8, 24]) { P.disc(cx, 7, 4.5, BR[2]); P.disc(cx, 7, 3.6, LT[2]); P.disc(cx - .6, 6.4, 2.6, LT[1]); P.set(cx - 2, 5, LT[0]); P.set(cx - 1, 5, LT[0]); P.set(cx - 2, 6, LT[0]); P.line(cx - 3, 7, cx + 3, 7, BR[1]); } return T.from(P, { m: 3, cut: true }); })();
// 甲板の板（雪がつもり、まん中は人が歩いて板が見える）
const deckT = (() => { const P = Px(32, 32), W = ramp('#dcdcf4'), Wd = ramp('#7a5a44'); P.each((x, y) => { const n = R.tn(x, y, 6, 6, 32, 32, 7); return n < .38 ? (x % 8 === 0 ? Wd[1] : y % 16 === 0 ? Wd[2] : Wd[3]) : n < .45 ? W[2] : n > .8 ? W[5] : W[4]; }); return T.from(P, { m: 3 }); })();
// 車輪の下の帯（無限軌道の板。前へ送る）
const trackT = (() => { const P = Px(16, 16); P.each((x, y) => y % 8 === 7 ? IR[0] : y % 8 === 0 ? IR[4] : x === 0 || x === 15 ? IR[1] : (x === 5 || x === 10) ? IR[1] : y % 8 < 3 ? IR[3] : IR[2]); return T.from(P, { m: 1.5 }); })();
const snowRoof = (c, e0) => { const P = R.paint.roof({ c, kind: 'slate' }), sp = R.paint.snow({}); P.each((x, y) => { const e = e0 + Math.sin(x * .39) * 4 + Math.sin(x * .98 + 1) * 3; return y < e ? (y > e - 2 ? '#a8a8d0' : sp.get(x, y)) : undefined; }); return T.from(P, { m: 3 }); };
const ROOF = [snowRoof('#4a4a5a', 34), snowRoof('#5a3a3a', 28), snowRoof('#3a4a5a', 40)];
const WALL = [T.brick({ c: '#a84a38' }), T.plaster({ frame: 'cross', c: '#e8dcc4', wood: '#4a3a30' }), T.boards({ c: '#5a6a7a' }), T.brick({ c: '#7a5a48', seed: 3 })];
const winL = T.window({ bars: 'cross', lit: 1, curtain: '#ffe0a0', frame: '#3a3a44' }), winD = T.window({ bars: 'cross', curtain: '#e8dcc8', frame: '#3a3a44' });

// ---- 動く町（前が -z。長さ 60 m、はば 20 m、胴の上が y=9、煙突のてっぺんまで 24 m ほど） ----
const city = new THREE.Group(); scene.add(city); const LEN = 60, HW = 9, DY = 9, WR = 4.2;
{ const B = R.parts(), Hl = B.g(hullT), Ir = B.g(T.metal({ c: '#3a3a4e' })), Dk = B.g(deckT), Gl = B.g(portT, { glow: true, cut: true, side: true }), Br = B.g(S2.tex.brass({ c: '#b8883a' }));
  Hl.box(HW * 2, DY - 3.4, LEN, 0, 3.4, 0, { m: 6 }); Dk.box(HW * 2 + .6, .4, LEN + .6, 0, DY - .2, 0, { m: 3 });
  // 前の へさき（雪をおしわける くさび）
  const zf = -LEN / 2, nose = -LEN / 2 - 6; for (const s of [-1, 1]) { const a = [s * HW, 3.4, zf], b = [s * HW, DY, zf], c = [0, DY, nose], d = [0, 1.2, nose + 2.2]; s > 0 ? Hl.quad(a, d, c, b, [0, 0, 1.5, 1]) : Hl.quad(d, a, b, c, [0, 0, 1.5, 1]); }
  Dk.tri([-HW, DY, zf], [HW, DY, zf], [0, DY, nose], [0, 0], [3, 0], [1.5, 1]); Br.box(.6, .6, 6, 0, DY, zf - 3, { m: 1.5 });
  for (const s of [-1, 1]) { for (let k = 0; k < 9; k++) { const z = -LEN / 2 + 3.4 + k * 6.6; Gl.quad([s * (HW + .02), 6.2, z + (s > 0 ? 3 : -3)], [s * (HW + .02), 6.2, z - (s > 0 ? 3 : -3)], [s * (HW + .02), 7.7, z - (s > 0 ? 3 : -3)], [s * (HW + .02), 7.7, z + (s > 0 ? 3 : -3)], [0, 0, 1, 1]); }
    Ir.box(.5, .5, LEN, s * HW, DY + .5, 0, {}); for (let k = 0; k <= 15; k++) Ir.box(.18, 1, .18, s * HW, DY, -LEN / 2 + k * 4, {});   // 手すり
    Br.box(.5, .5, LEN - 12, s * (TW + 1), WR - .5, 0, { m: 1.5 }); }           // 車輪の軸をつなぐ真ちゅうの棒
  Gl.quad([-2, 5.6, zf - .05 - 1.2], [2, 5.6, zf - .05 - 1.2], [2, 7.2, zf - .05 - 1.2], [-2, 7.2, zf - .05 - 1.2], [0, 0, 1, 1]);
  city.add(B.group()); }
// 無限軌道の帯（車輪の下に見える板。テクスチャを送って動かす）
const trackM = []; for (const s of [-1, 1]) { const t = trackT.clone(); t.needsUpdate = true; const G = R.geo(); G.box(2.6, .9, LEN - 2, 0, 0, 0, { uv: [0, 0, 2, (LEN - 2) / 1.5] }); const m = G.mesh(t); m.position.set(s * TW, 0, 0); city.add(m); trackM.push(t); }
// 大きな歯車の車輪（片がわ 4 つ。軸は x）
const wheels = []; for (const s of [-1, 1]) for (let k = 0; k < 4; k++) { const g = S1.gear({ r: WR, n: 22, th: 1.2, c: k % 2 ? '#b8883a' : '#8a7a6a', spokes: 6, manual: true }); g.rotation.y = PI / 2; g.position.set(s * TW, WR - .2, -LEN / 2 + 8 + k * 14.6); city.add(g); wheels.push(g); }
// 側面の小さな歯車（回る）と圧力計
for (const s of [-1, 1]) for (let k = 0; k < 3; k++) { const g = S1.gear({ r: 1.3 - k * .2, c: '#d8a84a', speed: (k % 2 ? -1 : 1) * .6 * s, phase: k }); g.rotation.y = s * PI / 2; g.position.set(s * (HW + .25), 7.4 - k * .6, 6 + k * 2.2); city.add(g); }
// 甲板の上の町：家（2 列）、時計塔、大きな煙突 3 本
const deck = [], dput = (o, x, z, ry = 0) => { o.position.set(x, DY, z); o.rotation.y = ry; deck.push(o); return o; };
[[-5, -18, 6], [-5.4, -9, 5], [-5, 9, 6.4], [-5.2, 18, 5.4], [5, -20, 5.6], [5.2, -11.5, 6], [5, 12, 5], [5.4, 20, 6]].forEach(([x, z, w], i) => dput(R.house({ w, d: 6.4, h: 3 + (i % 3) * .8, h2: i % 2 ? 2.6 : 0, wall: WALL[i % 4], wall2: WALL[(i + 1) % 4], roof: ROOF[i % 3], pitch: .9, eave: .45, ridge: 'z', win: winD, winLit: winL, lit: 1, chimney: i % 2 === 0, door: T.door({ style: 'plank', c: '#5a3a2c', lit: 1 }), wins: { f: 1, b: 1, l: 2, r: 2 }, seed: i + 3 }), x, z, x > 0 ? -PI / 2 : PI / 2));
const tower = F.clockTower({ w: 4.4, h: 17, stone: T.brick({ c: '#8a5a48' }), roof: '#4f8f80', lit: 1 }); tower.position.set(0, DY, -2); tower.rotation.y = PI; city.add(tower);
city.add(R.merge(deck));
const stacks = [[-3.2, 4, 15], [3.2, 4, 13], [0, 26, 16]].map(([x, z, h]) => { const c = S1.chimney({ r: 1.3, h, tex: T.brick({ c: '#6a4a44' }) }); c.position.set(x, DY, z); city.add(c);
  const sm = C.steam({ n: 18, r: 2.8, rise: 18, a: .95, speed: .12, c: '#b8a8c8', spread: 1.8, wind: [-2, 3.5] }); sm.position.set(x, DY + h + .6, z); city.add(sm); return c; });
// へさきの大きなランプと、町のあかり（雪を だいだいに照らす）
const lampF = S2.lamp({ kind: 'post', h: 2.2, c: '#c8963a', glow: '#fff0c0' }); lampF.position.set(0, DY, -LEN / 2 - 4.4); city.add(lampF);
for (const [x, y, z, p] of [[0, DY + 2, -LEN / 2 - 5, 60], [-HW - 3, 6, -10, 40], [-HW - 3, 6, 16, 40]]) { const L = new THREE.PointLight(0xffa860, p, 30, 1.6); L.position.set(x, y, z); city.add(L); }
// 甲板の人（手すりから外を見る）
const folk = [{ hat: 'cap', colors: { tunic: '#3a5a8a' } }, { hat: 'kerchief', hatC: '#d8c8a8', outfit: 'apron', colors: { tunic: '#8a3a40', apron: '#e8dcc0' } }, { outfit: 'worker', colors: { tunic: '#6a5a3a' } }].map((o, i) => { const p = TL.person({ size: i === 1 ? 'small' : 'normal', hair: ['center', 'wolf', 'swept'][i], head: { hair: ['#3a2a24', '#c88a3a', '#2a2a34'][i], skin: '#f0c8a0', eyes: 'round', mouth: 'smile' }, ...o }); p.position.set(-HW + 1.2, DY + .2, -16 + i * 13); p.rotation.y = -PI / 2; city.add(p); return p; });

// ---- 主役と、道づれのトナカイ、からす ----
const hero = TL.person({ ...TL.cast('hero'), colors: { ...TL.cast('hero').colors, scarf: '#d8382e' } }); scene.add(hero);
const deer = [0, 1, 2].map(i => { const d = SN.reindeer({ s: i === 2 ? .8 : 1.1 }); scene.add(d); return d; });
const crows = [0, 1, 2, 3].map(k => { const b = R.bird({ c: '#2a2a3a', belly: '#3a3a4a', neck: false, s: 1.7 }); scene.add(b); return b; });
const flakes = D.flakes({ kind: 'snow', n: 220, box: [30, 14, 30], size: 1.6, vy: -.8, wind: [-.4, 0] }); scene.add(flakes);

const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
const fx = K.fx(scene, 220), SP = 1.25, Z0 = 10, LOOP = 400, q = new THREE.Vector3(); let em = 0, roll = 0;
K.loop((dt, t) => {
  const z = Z0 - (t * SP) % LOOP, x = PX(z), dx = PX(z - .5) - x;
  hero.position.set(x, H(x, z), z); hero.rotation.y = PI + Math.atan2(-dx, .5) * .8; R.walk(hero, t * SP * 3.8, .8);
  const tall = innerWidth < innerHeight; cam.position.set(x - (tall ? 2 : 1.1), H(x, z) + (tall ? 1.5 : 1.8), z + (tall ? 3.1 : 4.9)); cam.lookAt(x + (tall ? 9 : 5), H(x, z) + (tall ? 4.4 : 3.3), z - 12);
  // 町は主役と同じ向きに進み、少しずつ前へ出たり下がったりする
  const cz = z - 30 - Math.sin(t * .04) * 8, vz = SP + Math.cos(t * .04) * .4; city.position.set(XC, 0, cz); roll += vz * dt;
  wheels.forEach(g => { g.userData.spin.rotation.z = roll / WR; }); trackM.forEach(tx => { tx.offset.y = roll / 1.5; });
  if ((em += dt) > .05) { em = 0; for (const s of [-1, 1]) { q.set(XC + s * TW + (Math.random() - .5) * 2.5, .4, cz - LEN / 2 + 3 + Math.random() * 2); fx.emit('smoke', q.x, q.y, q.z, { size: 1.6, life: 2.2, vy: 1.4, vx: s * 1.2, vz: -.6, grow: 2.6, spread: .6, tint: '#e0dcf4', add: false }); } }
  sun.position.set(x + SUN.x * 70, SUN.y * 70, z + SUN.z * 70); sun.target.position.set(x + 10, 0, z - 14); land.follow(x + 14, z - 50);
  deer.forEach((d, i) => { const dz = z - 8 - i * 2.6 + Math.sin(t * .2 + i) * .8, ddx = PX(dz) - 2.6 - i * 1.3; d.position.set(ddx, H(ddx, dz), dz); d.rotation.y = PI + (i === 1 ? .3 : 0); SN.reindeerPose(d, i === 1 && Math.sin(t * .3) > .2 ? 'graze' : 'walk', t * (i === 1 ? 1 : 1.25) + i); });
  folk.forEach((p, i) => { R.idle(p, t + i * 2, 0); p.userData.J.head.rotation.y = Math.sin(t * .4 + i) * .5; if (i === 0) p.userData.J.armR.rotation.set(-2.4 + Math.sin(t * 6) * .3, 0, .3); });
  crows.forEach((b, k) => { const a = t * (.28 + k * .05) + k * 1.6, r = 9 + k * 3; b.position.set(XC - 4 + Math.cos(a) * r, 30 + k * 1.6 + Math.sin(t + k), cz + Math.sin(a) * r); b.rotation.y = Math.atan2(-Math.sin(a), Math.cos(a)); R.birdPose(b, 'fly', t * .5 + k); });
  fx.update(dt); S1.tick(t); S2.tick(t); F.tick(t); C.update(t, cam); D.tick(t, cam); crt.render(scene, cam, t);
});
</script>
