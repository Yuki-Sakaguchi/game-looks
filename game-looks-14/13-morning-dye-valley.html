<title>14-13 朝の染めものの谷 描きこんだテクスチャとブラウン管</title>
<style>
html,body{margin:0;height:100%;background:#2a2420;overflow:hidden}
canvas{display:block}
#cap{position:fixed;left:12px;bottom:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#fffaf0;opacity:.9;text-shadow:0 1px 0 #000}
</style>
<div id="cap">14-13 ─ 朝の染めものの谷 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>
<script src="../game-looks-7/retro.js"></script>
<script src="../game-looks-8/pack-fantasy-town.js"></script>
<script src="../game-looks-8/pack-city.js"></script>
<script src="../game-looks-13/pack-tale.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 朝。せまい山あいの谷の底に、白いしっくいの家々にかこまれた染め場がある。石のふちの丸い池が何十も ならび、池ごとに あい・あかね・きはだ・白の石灰。
// 色の組は「しっくいの白・谷の岩の赤茶」の上に、染めの 3 色（あい・赤・黄）を大きな色面として置く（このテーマは「極端な色」への挑戦）。
// 主役は第 13 集の TL.person（4.5 頭身）。池のあいだの 細い石のへりを歩く。池に入って布をふむ職人、さおで布を上げる人、ほされて風にゆれる長い布、湯気、はとが動く。
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), F = PACK_FTOWN(THREE, K, R), C = PACK_CITY(THREE, K, R), TL = PACK_TALE(THREE, K, R), T = R.tex, { hash } = K, PI = Math.PI;
const { scene, cam, renderer, onResize } = K.stage({ fov: 50, far: 800, aa: false, fitAspect: .9, maxFov: 78 });
scene.add(R.skyDome([[0, '#2e6cc8'], [.5, '#6aa8e0'], [.82, '#c8dcec'], [1, '#f0dcc0']], { r: 380 })); scene.fog = new THREE.Fog('#e0c8b0', 90, 380);
const SUN = new THREE.Vector3(-.6, .55, -.3).normalize(), { sun } = K.lights(scene, renderer, { sky: 0xf0f4ff, ground: 0xc8a888, amb: 1.15, sun: 0xffe0b0, power: 2, range: 30, map: 2048 });

// ---- 染めの色：あい・あかね・きはだ・石灰の白・こい あい（池の水はコマ送りでゆれる） ----
const DYE = { indigo: '#2a3e9a', deep: '#1c2a6e', red: '#c4302a', yellow: '#e8b018', lime: '#e8e4d4', green: '#3a8a4a' };
// 染め汁のテクスチャ（32 ドット、3 コマ）：こい色の面に、ゆっくり回るうずの明るい線と、ふちに寄った あわ。白くとばさないよう、明るい段は少しだけ
const dyeTex = (c, f) => { const P = R.Px(32), G = R.ramp(c, 6, { contrast: .9 }); P.each((x, y) => { const a = Math.atan2(y - 15.5, x - 15.5), r = Math.hypot(x - 15.5, y - 15.5), w = Math.sin(a * 3 + r * .45 - f * 2.1) + Math.sin(x * .4 + y * .3 + f) * .4;
  return w > 1.15 ? G[4] : w > .7 ? G[3] : w < -1 ? G[1] : G[2]; }); for (let k = 0; k < 10; k++) { const x = Math.floor(hash(k, f, 1) * 30), y = Math.floor(hash(k, f, 2) * 30); P.set(x, y, G[5]); P.set(x + 1, y, G[4]); } return T.from(P, { m: 1.5 }); };
const dyeFrames = {}; for (const [k, c] of Object.entries(DYE)) dyeFrames[k] = [0, 1, 2].map(f => dyeTex(c, f));

// ---- 地面：染め場は 石だたみ。そのまわりは 赤茶の土。谷の底の川 ----
const land = R.ground({ w: 220, d: 220, cell: 2, cz: -30, layers: [T.dirt({ c: '#a8785a' }), T.cobble({ c: '#d8ccb4' })], mix: (x, z) => [Math.abs(x) < 15 && z < 6 && z > -44 ? 1 : 0, 0] }); scene.add(land.mesh);

// ---- 池：石のふちの丸い池を ます目に。中の色は ます目の場所で決める（帯のように色がかたまる） ----
const fixed = [], put = (o, x, z, ry = 0, y = 0) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
const RIM = R.geo(), DYEG = {}, VATS = [], VR = 1.05;
const kindAt = (x, z) => { const ax = Math.abs(x), h = hash(Math.round(x), Math.round(z), 7); if (h > .9) return 'lime'; if (z > -10) return x < 0 ? 'red' : 'yellow'; if (z > -22) return ax < 6 ? 'indigo' : 'deep'; if (z > -32) return x < 0 ? 'yellow' : 'green'; return x < 0 ? 'indigo' : 'red'; };
for (let i = 0; i < 10; i++) for (let j = 0; j < 15; j++) { const x = (i - 4.5) * 2.6 + (i >= 5 ? .6 : -.6), z = 2 - j * 2.6; if (hash(i, j, 3) > .94) continue; const k = kindAt(x, z); VATS.push([x, z, k]);
  RIM.loft(10, [[0, VR + .32, VR + .32, 0, .85, x, z], [.32, VR + .26, VR + .26, .16, 1.05, x, z], [.36, VR + .04, VR + .04, .24, 1.1, x, z], [-.2, VR, VR, .5, .62, x, z]], { ur: 3 });
  (DYEG[k] ||= R.geo().normal([0, 1, 0])); const G = DYEG[k], y = .2 + (hash(i, j) - .5) * .04; for (let s = 0; s < 10; s++) { const a0 = s / 10 * PI * 2, a1 = (s + 1) / 10 * PI * 2, P = a => [x + Math.cos(a) * VR, y, z + Math.sin(a) * VR], U = a => [(x + Math.cos(a) * VR) / 3, -(z + Math.sin(a) * VR) / 3]; G.tri([x, y, z], P(a1), P(a0), [x / 3, -z / 3], U(a1), U(a0)); } }
fixed.push(RIM.mesh(T.stone({ c: '#d8d0bc' })));
const dyeMeshes = Object.entries(DYEG).map(([k, G]) => { const m = G.mesh(dyeFrames[k][0]); m.material = m.material.clone(); m.castShadow = false; m.userData.k = k; scene.add(m); return m; });

// ---- まわりの家：白いしっくいの陸屋根の家を、谷のかべの段にそって積む。屋上に ほした布 ----
const WALLS = [T.plaster({ c: '#f0e8d8' }), T.plaster({ c: '#e8dcc4', frame: 'none' }), T.plaster({ c: '#f4ece0' })];
const homes = []; for (let i = 0; i < 30; i++) { const s = i % 2 ? 1 : -1, row = Math.floor(i / 2) % 5, col = Math.floor(i / 10), x = s * (17 + row * 4.6 + hash(i, 1) * 1.6), z = 4 - col * 15 - hash(i, 2) * 6 - row * 1.5, y = row * 2.4, h = 3.2 + hash(i, 3) * 2.4;
  put(R.house({ w: 5 + hash(i, 4) * 2, d: 5, h, wall: WALLS[i % 3], roof: T.stone({ c: '#d8ccb4' }), roofKind: 'flat', door: T.door({ style: 'plank', c: ['#2a4a9a', '#3a8a8a', '#a84a2a'][i % 3] }), win: T.window({ bars: 'cross', frame: '#3a5a9a', curtain: '#f0e8d8' }), seed: i }), x, z, s > 0 ? -PI / 2 : PI / 2, y);
  if (row) put(R.rock({ s: 3.4, c: '#a8785a', seed: i }), x, z, i, y - 2.8); homes.push([x, z, y + h, s]); }
for (let i = 0; i < 16; i++) { const s = i % 2 ? 1 : -1; put(R.rock({ s: 16 + hash(i, 6) * 8, c: '#9a5a3e', seed: i + 50 }), s * (60 + hash(i, 7) * 10), 10 - i * 11, i, -2 + hash(i, 8) * 4); }
// 谷の奥：段々に上がっていく白い家々（遠くまで続く町）と、その上の赤茶の山
for (let i = 0; i < 70; i++) { const row = Math.floor(i / 10), x = (i % 10 - 4.5) * 7.5 + (hash(i, 11) - .5) * 3, z = -60 - row * 9, y = row * 3.6 + Math.abs(x) * .12, h = 3 + hash(i, 12) * 3;
  put(R.house({ w: 5.5 + hash(i, 13) * 2, d: 6, h, wall: WALLS[i % 3], roof: T.stone({ c: '#d8ccb4' }), roofKind: 'flat', door: T.door({ style: 'plank', c: ['#2a4a9a', '#3a8a8a', '#a84a2a'][i % 3] }), win: T.window({ bars: 'cross', frame: '#3a5a9a', curtain: '#f0e8d8' }), seed: i + 40 }), x, z, 0, y);
  put(R.rock({ s: 4, c: '#a8785a', seed: i + 9 }), x, z - 1, i, y - 3.2); }
scene.add(R.backdrop({ c: '#8a4e36', haze: '#d8b096', r: 250, h: 60, y: -4, rep: 3, seed: 9 }));
scene.add(R.merge(fixed));

// ---- ほした布：染め場の両わきと奥に、高いさおの わく。長い布が 風にゆれる（1 まいずつ動かす） ----
const CLOTH = [DYE.indigo, DYE.red, DYE.yellow, DYE.indigo, '#f0ece0', DYE.red, DYE.yellow, DYE.green, DYE.deep];
const cloths = [], frameG = R.geo().smooth(1);
const rack = (x0, z0, x1, z1, top, n, sd) => { for (const [x, z] of [[x0, z0], [x1, z1]]) frameG.loft(5, [[0, .12, .12, 0, .8, x, z], [top + .3, .1, .1, top / 1.5, 1, x, z]], { cap: 'top' }); const L = Math.hypot(x1 - x0, z1 - z0), ux = (x1 - x0) / L, uz = (z1 - z0) / L;
  for (let k = 0; k < n; k++) { const u = (k + .5) / n, w = 1.3, h = 3.2 + hash(k, sd) * 1.6, c = CLOTH[(k + sd) % CLOTH.length], pat = hash(k, sd, 2) > .72 ? 'stripe' : 'plain';
    const m = R.geo().quad([-w / 2, -h, 0], [w / 2, -h, 0], [w / 2, 0, 0], [-w / 2, 0, 0], [0, 0, w / 2, h / 2]).mesh(T.fabric({ c, c2: '#f4ece0', pattern: pat, seed: k }), { side: true });
    const g = new THREE.Group(); g.add(m); g.position.set(x0 + (x1 - x0) * u, top - .05, z0 + (z1 - z0) * u); g.rotation.y = Math.atan2(-uz, ux); scene.add(g); cloths.push([g, k + sd]); } };
rack(-14, 4, -14, -40, 7, 9, 0); rack(14, 4, 14, -40, 7, 9, 3); rack(-12, -46, 12, -46, 8, 7, 5);
{ const L = 44; frameG.box(.14, .14, L, -14, 7, -18, { m: 1 }); frameG.box(.14, .14, L, 14, 7, -18, { m: 1 }); frameG.box(24, .14, .14, 0, 8, -46, { m: 1 }); }
scene.add(frameG.mesh(T.planks({ c: '#6a4a34' })));

// ---- 人：池に入って布をふむ職人、さおで布を上げる人、運ぶ人 ----
const SK = ['#c88a60', '#b07850', '#d8a078', '#a86a48'], HR = ['#2a2420', '#3a2a20', '#1e1a18'];
const pick = (k, n) => VATS.filter(v => v[2] === k).filter((_, i) => i % 3 === 1).slice(0, n);
const workers = [...pick('indigo', 2), ...pick('red', 2), ...pick('yellow', 2), ...pick('lime', 1), ...pick('deep', 1)].map(([x, z, k], i) => { const p = TL.person({ hair: ['wolf', 'center', 'swept'][i % 3], hat: i % 2 ? 'kerchief' : undefined, hatC: '#f0e8d8', head: { hair: HR[i % 3], skin: SK[i % 4], eyes: 'round', mouth: 'smile' }, outfit: 'worker', colors: { tunic: ['#f0e8d8', '#8a6a4a', '#5a6a8a'][i % 3], pants: '#4a3a30' } }); p.position.set(x, -.3, z); p.rotation.y = hash(i, 5) * PI * 2; scene.add(p); return p; });
const pole = () => R.geo().smooth(1).loft(4, [[-1.2, .03, .03, 0, 1], [1.6, .03, .03, 1, 1]], {}).mesh(T.planks({ c: '#8a6a48' }));
workers.forEach((p, i) => { if (i % 2) { const s = pole(); s.rotation.x = 1.4; p.userData.J.foreR.add(s); } });
const carrier = TL.person({ hair: 'center', hat: 'kerchief', hatC: DYE.red, head: { hair: HR[0], skin: SK[2], eyes: 'round' }, outfit: 'apron', colors: { tunic: '#f0e8d8', apron: DYE.indigo } }); scene.add(carrier);
const bundle = R.geo().smooth(1).loft(8, [[0, .26, .2, 0, .9], [.36, .3, .24, .5, 1.05], [.6, .2, .16, 1, 1]], { cap: 'both' }).mesh(T.fabric({ c: DYE.yellow, pattern: 'plain' })); bundle.rotation.z = PI / 2; bundle.position.set(0, .35, 0); carrier.userData.J.head.add(bundle);
const doves = [...Array(6)].map((_, i) => { const b = R.bird({ c: '#d8d4cc', belly: '#f0ece4', s: 1.4 }); scene.add(b); return b; });
const steam = []; for (const [x, z] of [[-9.4, -30], [9.6, -28], [-4, -36]]) { const sm = C.steam({ n: 8, r: .6, rise: 3, spread: .5, speed: .25, c: '#f4f0e8', a: .45, wind: [.3, 0] }); sm.position.set(x, .3, z); scene.add(sm); }

// ---- 主役：池のあいだの石のへり（x≈0 の通り）を奥へ歩く ----
const hero = TL.person({ ...TL.cast('hero'), colors: { ...TL.cast('hero').colors, scarf: '#2a3e9a' } }); scene.add(hero);
const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
const SP = 1.1, Z0 = 6, LOOP = 46, T0 = +(new URLSearchParams(location.search).get('t') || 0);   // ?t=秒 で途中から
K.loop((dt, t) => {
  t += T0; const z = Z0 - (t * SP) % LOOP, x = 0;
  hero.position.set(x, .02, z); hero.rotation.y = PI; R.walk(hero, t * SP * 3.8, .8);
  const tall = innerWidth < innerHeight; cam.position.set(x + (tall ? .7 : 1.1), tall ? 3 : 2.7, z + (tall ? 3.5 : 4)); cam.lookAt(x - .3, tall ? 1.2 : .55, z - 6.5);   // 少し高い所から、池の色の帯を見下ろす
  sun.position.set(x + SUN.x * 60, SUN.y * 60, z + SUN.z * 60); sun.target.position.set(x, 0, z - 6);
  dyeMeshes.forEach(m => R.flip(m.material, dyeFrames[m.userData.k], t, 2));
  workers.forEach((p, i) => { const J = p.userData.J; R.idle(p, t + i, 0); if (i % 2) { const k = Math.sin(t * 1.4 + i); J.armR.rotation.x = -1.2 + k * .4; J.foreR.rotation.x = -.4; J.torso.rotation.x = .25 + k * .1; } else { R.walk(p, t * 2.4 + i, .5); J.torso.rotation.x = .3; J.armL.rotation.x = J.armR.rotation.x = -.6; } });
  { const cz = -40 + (t * 1.2) % 50; carrier.position.set(-1.3 + Math.sin(cz) * .02, .02, cz); carrier.rotation.y = 0; R.walk(carrier, t * 4.6, .7); }
  cloths.forEach(([g, k]) => { g.rotation.x = Math.sin(t * 1.3 + k * .7) * .12 + .05; g.rotation.z = Math.sin(t * .9 + k) * .04; });
  doves.forEach((b, i) => { const a = t * (.4 + i * .03) + i * 1.1, r = 6 + i; b.position.set(Math.cos(a) * r, 9 + i * .7 + Math.sin(t + i) * .5, z - 16 + Math.sin(a) * r); b.rotation.y = -a; R.birdPose(b, 'fly', t + i); });
  C.update(t, cam); crt.render(scene, cam, t);
});
</script>
