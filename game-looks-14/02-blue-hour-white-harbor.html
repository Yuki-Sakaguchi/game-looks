<div id="cap">14-02 ─ 青い夕ぐれの白い坂の港町 / 描きこんだテクスチャと、ブラウン管　｜　見るだけ（自動で歩く）</div>
<script src="../game-looks-7/kit.js"></script>

<script src="../game-looks-8/pack-city.js"></script>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// 日がしずんだすぐあとの「青い時間」。海に面したがけの上に、白いしっくいの家が段になって重なる港町。海ぞいの石の通りに、街灯と電球のひもが ともりはじめる。
// 色の組は「しっくいの白（夕ぐれで青むらさきに寄る）・海と空の青・窓のあかりの だいだい」＋差し色の ブーゲンビリアの赤むらさき。通りの先に 青いドームの大きな建物、海の向こうに 火山の島と 帆船。
// 主役は旅の人（第 13 集の TL.person、4.5 頭身）。うしろから追い、右に海、左に段の町、正面にドームを入れる。かもめが回り、ねこが手すりにすわり、町の人が行き来する。
import * as THREE from 'three';
const K = KIT(THREE), R = RETRO(THREE, K), F = PACK_FTOWN(THREE, K, R), C = PACK_CITY(THREE, K, R), TL = PACK_TALE(THREE, K, R), T = R.tex, { hash } = K, PI = Math.PI, TR = R.TR;
const { scene, cam, renderer, onResize } = K.stage({ fov: 54, far: 900, aa: false, fitAspect: .9, maxFov: 80 });
scene.add(R.skyDome([[0, '#18225a'], [.42, '#3a4c9c'], [.72, '#9a78b4'], [.88, '#f09a8a'], [1, '#ffc890']], { r: 520 })); scene.fog = new THREE.Fog('#8a82b8', 90, 560);
const { sun } = K.lights(scene, renderer, { sky: 0x9aa8ff, ground: 0x6a5a8a, amb: 1.25, sun: 0xffa880, power: 1.2, range: 34, map: 2048 }), SUN = new THREE.Vector3(.8, .28, -.4).normalize();

// ---- 地面。通り（y=0, x=-3.4〜3.4）の左は 9 m ごとに 4.5 m 上がる段の町、右は手すりの先で 18 m 下の海へ落ちる ----
const SEA = -18, TH = 5.5, H = (x, z) => { if (x > 3.8) return SEA - 3; const u = -x - 3.4; if (u <= 0) return 0; const st = Math.floor(u / 9), k = u - st * 9; return Math.min(5, st) * TH + (st < 5 && k > 7 ? (k - 7) / 2 * TH : 0); };
const LAMPS = [], ZL = [10, 1, -8, -17, -26];
for (const z of ZL) LAMPS.push({ x: 2.6, z, r: 5.2, c: '#ffb060', k: .9 }); for (let i = 0; i < 9; i++) LAMPS.push({ x: -3.2, z: 12 - i * 6.5, r: 2.6, c: '#ffc070', k: .55 });
const shadeL = C.lightShade(LAMPS, [.7, .7, .86]);
const pave = T.cobble({ kind: 'slab', c: '#c8c4d4', seed: 3 }), terr = T.cobble({ kind: 'slab', c: '#e4dcd8', seed: 5 }), cliff = T.rock({ c: '#8a7a8c', moss: .15 });
const land = R.ground({ w: 66, d: 120, cell: 1.5, cx: -19, cz: -20, H, layers: [pave, terr, cliff], shade: shadeL,
  mix: (x, z) => { const u = -x - 3.4, k = ((u % 9) + 9) % 9; return [u > 0 ? 1 : 0, (u > 0 && k > 7 && u < 45) ? 1 : 0]; } }); scene.add(land.mesh);
// 海。夕日の方向に、きらめきの帯を頂点の色で入れる
const WF = T.water({ c: '#3a4a9a' }), sea = R.ground({ w: 700, d: 700, cell: 7, cx: 330, cz: -60, H: () => SEA - .4, layers: [WF[0]],
  shade: (x, z) => { const d = Math.abs((z + 30) - (x - 6) * -.5) / (1 + (x - 6) * .02), k = Math.max(0, 1 - d / 14) * Math.min(1, (x - 6) / 60); return [.8 + k * 2.2, .76 + k * 1.3, .95 + k * .3]; } }); scene.add(sea.mesh);

// ---- 手すり（白いしっくいの低いかべ。8 m ごとに柱）と、その上の街灯 ----
const fixed = [], put = (o, x, z, ry = 0, y = H(x, z)) => { o.position.set(x, y, z); o.rotation.y = ry; fixed.push(o); return o; };
const wallT = T.plaster({ c: '#ecebf2', frame: 'none', seed: 2 }), wallT2 = T.plaster({ c: '#f2ece6', frame: 'none', patch: true, seed: 7 }), capT = T.stone({ c: '#d0ccd8', seed: 4 });
{ const B = R.parts(), W = B.g(wallT), Cp = B.g(capT), Rt = B.g(T.stone({ c: '#a8a0b8', moss: .2, seed: 6 })); for (let i = 0; i < 12; i++) { const z = 16 - i * 8; W.box(.5, .82, 7.6, 3.55, 0, z - 4, { m: 3 }); Rt.box(.6, 18.6, 8, 3.6, SEA - .6, z - 4, { m: 3 }); Cp.box(.7, .14, 7.8, 3.55, .82, z - 4, { m: 3 }); W.box(.8, 1.15, .8, 3.55, 0, z - 8, { m: 3 }); Cp.box(.95, .14, .95, 3.55, 1.15, z - 8, { m: 3 }); } fixed.push(B.group()); }
for (const z of ZL) put(C.streetLamp({ h: 3.4, c: '#3a3a52', halo: true }), 3.3, z, -PI / 2, 0);

// ---- 段の町の家（白いかべ、青い扉、陸屋根。いくつかは青い小さなドーム） ----
const DOOR = ['#2a5ab0', '#3a7ac0', '#2a6a8a', '#7a3a5a'], winT = T.window({ shutters: true, box: true, c: '#3a6ab0' }), winL = T.window({ shutters: true, lit: true, c: '#3a6ab0' });
for (let st = 0; st < 5; st++) for (let i = 0; i < 10; i++) { const z = 14 - i * 7 - (st % 2) * 3.5 - hash(i, st) * 1.2, x = -3.4 - st * 9 - 3.4, y = st * TH; if (st === 0 && (z < -28 || i % 3 === 2)) continue;
  const tall = st > 0 && hash(i, st, 2) > .45, h = put(R.house({ w: 5.2 + hash(i, st, 3) * 1.2, d: 5, h: 2.7, h2: tall ? 2.5 : 0, wall: hash(i, st, 4) > .5 ? wallT : wallT2, base: false, roof: capT, roofKind: 'flat', door: T.door({ style: 'panel', c: DOOR[(i + st) % 4] }), win: winT, winLit: winL, lit: .55, wins: { f: tall ? [1.6] : [-1.6, 1.6], r: 0, l: 0, b: 0 }, seed: i * 7 + st }), x, z, PI / 2, y);
  if (hash(i, st, 5) > .72) { const d = F.dome({ r: 1.25, kind: 'round', c: '#2a5ab0', c2: '#4a8ad0' }); put(d, x, z, 0, y + h.userData.top - .1); }
  if (hash(i, st, 6) > .45) put(R.tree({ kind: 'bush', h: .9 + hash(i, st, 7) * .5, c: '#c8387a', flowers: .6, fc: ['#e85aa0', '#f07ab8'], seed: i + st * 10 }), x + 2.9, z - 3.1, i, y); }
// 通りの先の大きな建物（白い四角に、青い大ドーム。鐘の塔をそえる）
const ZC = -40; { const hall = put(R.house({ w: 12, d: 10, h: 7, wall: wallT, base: capT, roof: capT, roofKind: 'flat', door: T.door({ style: 'panel', arch: true, c: '#2a5ab0' }), doorS: 1.5, win: T.window({ arch: true, h: 48 }), winLit: T.window({ arch: true, h: 48, lit: true }), lit: 1, wins: { f: [-3.6, 3.6], r: 0, l: 0, b: 0 } }), -.5, ZC, 0, 0);
  const B = R.parts(); B.g(wallT).loft(12, [[0, 4.2, 4.2, 0, .9], [2.4, 4.2, 4.2, 1, 1]], { ur: 6 }); const drum = B.group(); put(drum, -.5, ZC, 0, 7.2);
  put(F.dome({ r: 4.3, kind: 'round', c: '#2a5ab0', c2: '#5a9ae0' }), -.5, ZC, 0, 9.5);
  put(F.tower({ kind: 'square', r: 1.6, h: 14, stone: wallT, roof: '#2a5ab0', top: 'cone', roofH: 2.6, wins: true, lit: 1 }), 6.5, ZC + 2, 0, 0); }
// 丘のてっぺんの風車
for (let i = 0; i < 3; i++) put(F.windmill({ h: 8, stone: wallT, roof: '#6a4a3a', c: '#efe6d8', speed: .4 + i * .1 }), -48 - i * 3, -10 - i * 14, PI / 2 + .3, 5 * TH);
scene.add(R.merge(fixed));

// ---- 海の向こう：火山の島（うすく けむり）、帆船、漁の小舟 ----
{ const G = R.geo(); G.loft(14, [[0, 150, 110, 0, .8], [22, 100, 76, 1, .9], [52, 40, 32, 2.2, 1], [64, 16, 14, 2.6, 1.05]], { cap: 'top' }); const isl = G.mesh(T.rock({ c: '#5a4a78', m: 24 })); isl.position.set(170, SEA - 1, -340); scene.add(isl);
  const G2 = R.geo(); G2.loft(12, [[0, 90, 40, 0, .85], [14, 50, 24, 1, 1]], { cap: 'top' }); const isl2 = G2.mesh(T.rock({ c: '#6a5a88', m: 24 })); isl2.position.set(260, SEA - 1, 120); scene.add(isl2); }
const plume = C.steam({ n: 14, r: 9, rise: 50, a: .45, speed: .05, c: '#b8a4c4', spread: 4, wind: [-12, 3] }); plume.position.set(170, SEA + 64, -340); scene.add(plume);
const ship = F.ship({ s: 2.2, c: '#5a3a2e', c2: '#e8c060', sail: '#f2eadc', sail2: '#c8b8a8', crest: 'sun' }); scene.add(ship);
const boats = [0, 1, 2].map(i => { const b = R.boat({ c: ['#c8402a', '#2a6ab0', '#e8b040'][i], sail: true }); b.scale.setScalar(1.4); scene.add(b); return b; });
for (let i = 0; i < 5; i++) { const c = R.cloud({ s: 40 + hash(i, 8) * 30, c: '#f0b8b0', shade: '#6a5a9a', seed: i }), a = -.9 + i * .38; c.position.set(Math.cos(a) * 380, 70 + hash(i, 9) * 60, Math.sin(a) * 380); c.lookAt(0, 50, 0); scene.add(c); }
// 通りにわたす電球のひも
for (const z of [6, -3.5, -12.5, -21.5]) scene.add(C.bulbs([-3.3, 3.9, z], [3.3, 3.5, z + 1.5], { n: 7, sag: .45, cs: ['#ffb050', '#ffe0a0', '#ff8a6a'] }));

// ---- 人とねこと かもめ（この場面のためのオリジナル） ----
const hero = TL.person({ ...TL.cast('hero'), colors: { ...TL.cast('hero').colors, scarf: '#e8508a' } }); scene.add(hero);
const old = TL.person({ size: 'tall', hair: 'center', hat: 'cap', hatC: '#2a3a5a', head: { hair: '#d8d4d0', skin: '#e8b890', beard: true }, colors: { tunic: '#3a4a6a', pants: '#5a5050', scarf: '#e8dcc8' } }); old.position.set(2.7, 0, -5); old.rotation.y = PI / 2; scene.add(old);
const girl = TL.person({ size: 'child', hair: 'wolf', head: { hair: '#3a2a2a', skin: '#f0c8a0', eyes: 'round', mouth: 'smile' }, colors: { tunic: '#e8c040', pants: '#3a5a8a' } }); scene.add(girl);
const lady = TL.person({ size: 'normal', hair: 'center', outfit: 'apron', hat: 'kerchief', hatC: '#e85a8a', head: { hair: '#4a3030', skin: '#f0c8a0', mouth: 'smile' }, colors: { tunic: '#3a6ab0', apron: '#f2ece0', pants: '#3a3a50' } }); scene.add(lady);
const catA = R.cat({ c: '#f2ece0', belly: '#ffffff', s: 1 }); catA.position.set(3.55, .96, 3); catA.rotation.y = -PI / 2; scene.add(catA);
const catB = R.cat({ c: '#3a3440', s: 1 }); scene.add(catB);
const gulls = [0, 1, 2, 3].map(i => { const b = R.bird({ c: '#f4f4f8', belly: '#ffffff', neck: false, s: 1.4 }); scene.add(b); return b; });

const crt = R.crt(renderer, { noise: 0 }); onResize(crt.resize);
const Z0 = 12, LEN = 30, SPEED = 1.15;
K.loop((dt, t) => {
  const z = Z0 - (t * SPEED) % LEN, x = .2;
  hero.position.set(x, 0, z); hero.rotation.y = PI; R.walk(hero, t * SPEED * 3.8, .8);
  const tall = innerWidth < innerHeight; cam.position.set(x - .9, tall ? 1.9 : 2.3, z + (tall ? 3.6 : 3.9)); cam.lookAt(x + .9, tall ? 2.5 : .9, z - 8);
  sun.position.set(x + SUN.x * 60, SUN.y * 60, z + SUN.z * 60); sun.target.position.set(x, 0, z - 6); land.follow(-16, z - 30);
  R.idle(old, t, Math.sin(t * .3) * .3);
  const gz = 4 - ((t * 1.9) % 26); girl.position.set(-1.2 + Math.sin(t * .8) * .4, 0, gz); girl.rotation.y = PI; R.walk(girl, t * 8, 1);
  catB.position.set(-1.0 + Math.sin(t * .8) * .4, 0, gz - 1.6); catB.rotation.y = PI; R.catPose(catB, 'walk', t * 1.6); R.catPose(catA, 'sit', t);
  const lz = -24 + ((t * 1.0) % 34); lady.position.set(-1.9, 0, lz); lady.rotation.y = 0; R.walk(lady, t * 3.6, .7);
  ship.position.set(62, SEA, -110 + t * .8); ship.rotation.y = 0;
  boats.forEach((b, i) => { b.position.set(70 + i * 26, SEA - .2 + Math.sin(t * 1.3 + i) * .08, -40 - i * 34 + Math.sin(t * .1 + i) * 3); b.rotation.set(Math.sin(t * 1.1 + i) * .05, PI / 2 + i * .5, 0); });
  gulls.forEach((b, i) => { const a = t * (.3 + i * .05) + i * 1.6; b.position.set(14 + Math.cos(a) * (8 + i * 2), 5 + i * 1.5 + Math.sin(t + i) * .8, z - 10 + Math.sin(a) * 9); b.rotation.y = Math.atan2(-Math.sin(a), Math.cos(a)); R.birdPose(b, 'fly', t * .4 + i); });
  R.flip(sea.mat, WF, t, 3); F.tick(t); C.update(t, cam); crt.render(scene, cam, t);
});
</script>
