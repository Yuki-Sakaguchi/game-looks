  if ((em += dt) > .07) { em = 0; eng.updateMatrixWorld(); q.set(...eng.userData.vent); eng.localToWorld(q);
    fx.emit('smoke', q.x, q.y, q.z, { size: .8, life: 3.2, vy: 1.9, vx: .5, vz: .2, grow: 2.2, spread: .25, tint: '#fff0e4', add: false }); }
  fx.update(dt); S2.tick(t); F.tick(t); crt.render(scene, cam, t);
});
</script>
